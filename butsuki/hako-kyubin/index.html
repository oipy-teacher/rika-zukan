<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ズザッ！プカッ！ハコ急便 ～摩擦と流体の力～</title>
<!--
  ============================================================
  ハコ急便（高1 物理基礎 1編2章 4「摩擦を受ける運動」＋ 5「液体や気体から受ける力」）
  世界とメタファー : 木箱の配達員「ハコ吉」が 陸（摩擦ヤード）→ 海（水圧・浮力ハーバー）→ 空（エアドロップ）を運ぶ配送会社
  画風            : ステッカー・ポップ（太い墨の輪郭・ベタ塗り・ずらした黒い影・網点）＋ 工事現場の安全標識（黄×黒のしま）
  配色            : 墨 #1b1a1f／安全イエロー #ffd23f／信号オレンジ #ff6b1a／赤 #ef3e36／ティール #13b5a8／空 #7cc6fe
  書体            : Dela Gothic One（見出し・判定）＋ BIZ UDPGothic（数値と本文）
  HUD             : 黒い作業帯＋黄黒しま。ボタンは押すと沈むステッカー
  音              : WebAudio の合成のみ（外部ファイルなし）。コンボで BGM の楽器が増える
                    （2026-10-04 第2段: 自前のループは共通BGMエンジンに置きかえ。BGM.level()／ボス面は tense）
  外部への送信     : なし（保存はこの端末の localStorage だけ）
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1a1f;--yel:#ffd23f;--org:#ff6b1a;--red:#ef3e36;--tea:#13b5a8;--sea:#0b4f6c;--sky:#7cc6fe;--pap:#fff4dc;--wht:#fffdf7;--blu:#2f6fdf;--grn:#2fae5a;
  --disp:'Dela Gothic One','Hiragino Kaku Gothic StdN','Hiragino Sans',sans-serif;--body:'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif;
  --stripe:repeating-linear-gradient(-45deg,var(--yel) 0 12px,var(--ink) 12px 24px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.hidden{display:none!important}
.disp{font-family:var(--disp);font-weight:400}
.stk{background:var(--wht);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink)}
b.hl{color:var(--org)}
sup{font-size:.62em;vertical-align:.55em;line-height:0}
sub{font-size:.62em;vertical-align:-.2em;line-height:0}

/* ---------- ボタン（押すと沈むステッカー） ---------- */
.btn{font-family:var(--body);font-weight:700;font-size:clamp(17px,2.4vmin,22px);min-height:54px;padding:6px 20px;border:3px solid var(--ink);border-radius:14px;background:var(--yel);color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .05s,box-shadow .05s;line-height:1.15;touch-action:manipulation;position:relative}
.btn small{display:block;font-family:var(--body);font-weight:700;font-size:.62em;opacity:.85}
.btn:active,.btn.on{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.org{background:var(--org);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.btn.tea{background:var(--tea);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff;text-shadow:2px 2px 0 var(--ink)}
.btn.wht{background:var(--wht)}
.btn.sky{background:var(--sky)}
.btn.big{font-family:var(--disp);font-weight:400;font-size:clamp(22px,3.6vmin,34px);padding:10px 34px;min-height:66px}
.btn[disabled]{filter:grayscale(1);opacity:.5}
.btn.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.btn.pulse:active{animation:none}

/* ---------- HUD（黒い作業帯） ---------- */
#hud{position:fixed;left:0;right:0;top:0;height:54px;background:var(--ink);display:flex;align-items:center;gap:8px;padding:0 8px;z-index:20;color:#fff}
#hud:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:var(--stripe)}
.hb{font-family:var(--body);font-weight:700;font-size:15px;height:40px;padding:0 12px;border:3px solid var(--yel);background:var(--ink);color:var(--yel);border-radius:10px;cursor:pointer;white-space:nowrap}
.hb:active{background:var(--yel);color:var(--ink)}
.hb.sq{width:42px;padding:0;font-size:18px}
#hStage{flex:1;min-width:0;font-size:clamp(13px,2.2vmin,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:#fff}
#hStage .z{display:inline-block;padding:1px 8px;border-radius:6px;margin-right:6px;color:var(--ink)}
.hr{display:flex;align-items:center;gap:6px}
#hScore{font-size:clamp(18px,3vmin,26px);color:var(--yel);min-width:84px;text-align:right;letter-spacing:.02em}
#hScore.bump{animation:sb .35s}
@keyframes sb{0%{transform:scale(1.5);color:#fff}100%{transform:scale(1)}}

/* ---------- 指示の札 ---------- */
#task{position:fixed;z-index:15;left:12px;top:68px;width:min(340px,32vw);padding:10px 12px 12px;max-height:calc(100vh - 180px);overflow:hidden}
body.port #task{left:8px;right:8px;width:auto;top:64px;padding:8px 10px 10px}
#task .th{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.chip{font-family:var(--body);font-weight:700;font-size:14px;padding:3px 10px;border:2px solid var(--ink);border-radius:8px;white-space:nowrap}
.z0{background:var(--org);color:#fff}.z1{background:var(--tea);color:#fff}.z2{background:var(--sky);color:var(--ink)}.z3{background:var(--red);color:#fff}
#task .rn{font-family:var(--body);font-weight:700;font-size:16px}
#task .giv{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
#task .giv span{background:var(--ink);color:#fff;border-radius:8px;padding:3px 9px 4px;line-height:1.1}
#task .giv small{display:block;font-size:11px;color:var(--yel);font-weight:700}
#task .giv b{font-size:clamp(16px,2.4vmin,20px)}
#task .ask{font-size:clamp(14px,2.1vmin,17px);font-weight:700;line-height:1.45}
body.port #task .giv{margin:2px 0 4px}
body.port #task .giv b{font-size:16px}
body.port #task .ask{font-size:14px}
.boss{display:flex;align-items:center;gap:6px;margin:2px 0 6px;font-family:var(--body);font-weight:700;font-size:14px;color:var(--red)}
.boss .hp{flex:1;height:14px;border:2px solid var(--ink);border-radius:7px;background:#ddd;overflow:hidden;display:flex}
.boss .hp i{flex:1;background:var(--red);border-right:2px solid var(--ink);transition:background .3s}
.boss .hp i:last-child{border-right:0}
.boss .hp i.gone{background:#bbb}
.tbar{height:10px;border:2px solid var(--ink);border-radius:5px;overflow:hidden;margin:2px 0 6px;background:#eee}
.tbar i{display:block;height:100%;background:var(--org);width:100%}

/* ---------- 操作台 ---------- */
#dock{position:fixed;bottom:0;left:0;right:0;height:96px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 10px env(safe-area-inset-bottom);z-index:16}
#dock .btn{min-width:110px}
body.port #dock{height:100px;gap:8px}
body.port.embed #dock{bottom:50px}
body.port.embed #combo{bottom:158px}
body.port.embed #expl{bottom:58px}
body.port #dock .btn{min-width:0;flex:1;max-width:190px;padding:6px 8px}

/* ---------- コンボ ---------- */
#combo{position:fixed;right:12px;top:70px;z-index:17;text-align:center;padding:4px 14px 6px;border:3px solid var(--ink);border-radius:12px;background:var(--yel);box-shadow:4px 4px 0 var(--ink);transform-origin:center;pointer-events:none}
body.port #combo{top:auto;bottom:108px;right:8px}
#combo b{display:block;font-size:30px;line-height:1}
#combo small{font-size:11px;font-family:var(--body);font-weight:700}
#combo.t2{background:var(--org);color:#fff;text-shadow:2px 2px 0 var(--ink)}
#combo.t3{background:var(--red);color:#fff;text-shadow:2px 2px 0 var(--ink)}
#combo.t4{background:linear-gradient(90deg,#ff6b1a,#ffd23f,#3fbf5f,#13b5a8,#2f6fdf,#ff7aa8,#ff6b1a);background-size:300% 100%;animation:foil 1.2s linear infinite;color:#fff;text-shadow:2px 2px 0 var(--ink)}
#combo.bump{animation:cb .4s cubic-bezier(.2,2,.4,1)}
#combo.t4.bump{animation:cb .4s cubic-bezier(.2,2,.4,1),foil 1.2s linear infinite}
@keyframes cb{0%{transform:scale(1.8) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes foil{to{background-position:300% 0}}

/* ---------- 判定・帯 ---------- */
#judge{position:fixed;left:50%;top:40%;z-index:40;pointer-events:none;text-align:center;opacity:0;white-space:nowrap;transform:translate(-50%,-50%)}
#judge .w{font-family:var(--disp);font-size:clamp(46px,12vmin,120px);line-height:1;color:var(--yel);
  text-shadow:4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),3px 3px var(--ink),-3px -3px var(--ink),3px -3px var(--ink),-3px 3px var(--ink),10px 10px 0 var(--ink)}
#judge .s{font-family:var(--body);font-weight:700;font-size:clamp(20px,4vmin,34px);color:#fff;margin-top:6px;
  text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),4px 4px 0 var(--ink)}
#judge.P .w{color:var(--yel)}#judge.G .w{color:var(--org)}#judge.Go .w{color:var(--sky)}#judge.M .w{color:#cfcfcf}
#judge.go{animation:jg 1.25s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes jg{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-10deg)}16%{opacity:1;transform:translate(-50%,-50%) scale(.9) rotate(-5deg)}28%{transform:translate(-50%,-50%) scale(1.06) rotate(-5deg)}78%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-5deg)}100%{opacity:0;transform:translate(-50%,-64%) scale(1) rotate(-5deg)}}
#banner{position:fixed;left:0;right:0;top:46%;z-index:39;pointer-events:none;text-align:center;font-size:clamp(26px,6.5vmin,60px);color:#fff;padding:10px 0;background:var(--ink);border-top:6px solid var(--yel);border-bottom:6px solid var(--yel);transform:translateY(-50%) scaleY(0);opacity:0;text-shadow:4px 4px 0 var(--org)}
#banner.go{animation:bn 1.6s ease forwards}
@keyframes bn{0%{opacity:1;transform:translateY(-50%) scaleY(0)}12%{transform:translateY(-50%) scaleY(1.1)}20%{transform:translateY(-50%) scaleY(1)}80%{opacity:1;transform:translateY(-50%) scaleY(1)}100%{opacity:0;transform:translateY(-50%) scaleY(0)}}
#cheer{position:fixed;z-index:41;pointer-events:none;font-family:var(--body);font-weight:700;font-size:clamp(17px,2.6vmin,22px);max-width:92vw;text-align:center;line-height:1.3;color:#fff;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink),3px 3px 0 var(--ink);opacity:0;transform:translate(-50%,-50%)}
#cheer.go{animation:ch 1.2s ease forwards}
@keyframes ch{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}

/* ---------- 解説カード ---------- */
#expl{position:fixed;z-index:30;left:50%;bottom:12px;transform:translateX(-50%);width:min(680px,calc(100vw - 20px));padding:12px 14px 12px;display:flex;gap:12px;align-items:center;animation:up .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes up{from{transform:translate(-50%,120%)}to{transform:translate(-50%,0)}}
#expl .gb{flex:none;width:64px;height:64px;border:3px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--body);font-weight:700;font-size:13px;line-height:1;text-align:center;transform:rotate(-10deg)}
#expl .gb.P{background:var(--yel)}#expl .gb.G{background:var(--org);color:#fff}#expl .gb.Go{background:var(--sky)}#expl .gb.M{background:#ccc}
#expl .tx{flex:1;min-width:0;font-size:clamp(13px,2vmin,16px);line-height:1.5;font-weight:700}
#expl .tx h4{font-family:var(--body);font-weight:700;font-size:clamp(16px,2.5vmin,20px);margin-bottom:2px}
#expl .tx .calc{background:var(--pap);border-left:5px solid var(--org);padding:4px 8px;margin-top:4px;border-radius:4px}
#expl .btn{flex:none}
body.port #expl{flex-wrap:wrap;gap:8px}
body.port #expl .gb{width:52px;height:52px;font-size:11px}
body.port #expl .btn{width:100%}

/* ---------- 指の手ほどき ---------- */
#hand{position:fixed;z-index:45;width:58px;height:70px;pointer-events:none;left:-200px;top:-200px;transform:translate(-14px,-4px)}
#hand svg{width:100%;height:100%;filter:drop-shadow(3px 3px 0 rgba(27,26,31,.9))}
#hand .ring{position:absolute;left:2px;top:-12px;width:28px;height:28px;border:4px solid var(--yel);border-radius:50%;opacity:0}
#hand.pr .ring{animation:rg .8s ease-out infinite}
@keyframes rg{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(2)}}
#cbub{position:fixed;z-index:46;pointer-events:none;max-width:min(330px,82vw);background:var(--yel);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:16px;box-shadow:4px 4px 0 var(--ink);line-height:1.4}
#cbub b{color:var(--red)}
#cbub:before{content:"れんしゅう";position:absolute;top:-12px;left:10px;background:var(--ink);color:var(--yel);font-family:var(--body);font-weight:700;font-size:11px;padding:1px 8px;border-radius:6px}

/* ---------- タイトル ---------- */
.scr{position:fixed;inset:0;z-index:10}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#logo{text-align:center;line-height:1;margin-bottom:10px;pointer-events:none}
#logo .l1{display:inline-block;font-size:clamp(38px,9vmin,96px);margin:0 .1em}
#logo .l3{display:block;font-size:clamp(60px,15vmin,160px);color:var(--yel);margin-top:-.08em;letter-spacing:.02em}
#logo .l4{display:inline-block;margin-top:14px;font-family:var(--body);font-weight:700;font-size:clamp(16px,2.8vmin,26px);letter-spacing:.06em;background:var(--ink);color:#fff;padding:6px 16px;border-radius:8px;border:3px solid var(--yel)}
.ol{text-shadow:4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),3px 3px var(--ink),-3px -3px var(--ink),3px -3px var(--ink),-3px 3px var(--ink),9px 9px 0 var(--ink)}
.ol2{text-shadow:6px 0 var(--ink),-6px 0 var(--ink),0 6px var(--ink),0 -6px var(--ink),4px 4px var(--ink),-4px -4px var(--ink),4px -4px var(--ink),-4px 4px var(--ink),5px 5px 0 var(--ink),14px 14px 0 var(--org)}
#logo .a{color:var(--org);--r:-8deg}#logo .b{color:var(--tea);--r:6deg}
.drop{animation:drop .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{0%{transform:translateY(-110vh) rotate(var(--r,0deg))}70%{transform:translateY(10px) rotate(var(--r,0deg))}100%{transform:translateY(0) rotate(var(--r,0deg))}}
#tBtns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;align-items:center}
#tSub{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#tName{font-family:var(--body);font-weight:700;font-size:16px;height:44px;border:3px solid var(--ink);border-radius:10px;padding:0 12px;width:200px;background:var(--wht);box-shadow:3px 3px 0 var(--ink);user-select:text;-webkit-user-select:text;touch-action:manipulation}
#tInfo{font-family:var(--body);font-weight:700;font-size:16px;color:#fff;text-shadow:2px 2px 0 var(--ink)}

/* ---------- マップ（配送伝票） ---------- */
#map{overflow-y:auto;touch-action:pan-y;padding:18px 12px 40px}
#zones{display:flex;gap:14px;max-width:1200px;margin:0 auto;align-items:flex-start}
body.port #zones{flex-direction:column}
.zone{flex:1;min-width:0;width:100%}
.zh{font-family:var(--disp);font-size:clamp(20px,3vmin,28px);padding:6px 12px;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.zh span{font-family:var(--body);font-weight:700}.zh small{font-family:var(--body);font-weight:700;font-size:12px;margin-left:auto;opacity:.9}
.tk{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--wht);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:8px 10px;margin-bottom:10px;cursor:pointer;font-family:var(--body);position:relative;transition:transform .05s;color:var(--ink)}
.tk:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tk .ic{flex:none;width:46px;height:46px;border:3px solid var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px}
.tk .nm{flex:1;min-width:0}
.tk .nm small{display:block;font-weight:700;font-size:12px;opacity:.7}
.tk .nm b{font-family:var(--body);font-weight:700;font-size:clamp(17px,2.3vmin,20px)}
.tk .st{flex:none;font-size:18px;letter-spacing:-2px;color:#c9c2b0}
.tk .st i{font-style:normal}.tk .st i.on{color:var(--org);text-shadow:1px 1px 0 var(--ink)}
.tk.lock{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.tk.lock .st{display:none}
.tk.next:after{content:"NEXT!";position:absolute;right:-6px;top:-10px;background:var(--red);color:#fff;font-family:var(--body);font-weight:700;font-size:12px;padding:2px 8px;border:2px solid var(--ink);border-radius:8px;animation:pulse 1s infinite}
.tk.boss{background:#ffe1d6}
.tk.test{background:var(--yel)}
#mapTop{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 auto 14px;max-width:1200px}
#mapTop .ttl{font-family:var(--disp);font-size:clamp(20px,3.4vmin,30px);color:#fff;text-shadow:3px 3px 0 var(--ink)}
#mapTop .cnt{font-family:var(--body);font-weight:700;font-size:16px;background:var(--ink);color:var(--yel);padding:6px 12px;border-radius:10px;border:3px solid var(--yel)}

/* ---------- オーバーレイ ---------- */
#ov{position:fixed;inset:0;z-index:60;background:rgba(27,26,31,.62);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;touch-action:pan-y}
#ovBox{width:min(620px,100%);padding:18px 18px 16px;position:relative;max-height:calc(100vh - 24px);overflow:auto;touch-action:pan-y}
#ovBox h2{font-family:var(--disp);font-weight:400;font-size:clamp(22px,3.6vmin,32px);margin-bottom:8px}
#ovBox p{font-size:16px;line-height:1.6;font-weight:700;margin:6px 0}
#ovBox .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.card2{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--pap)}
.card2 .lb{display:inline-block;font-family:var(--body);font-weight:700;font-size:13px;background:var(--ink);color:var(--yel);padding:2px 8px;border-radius:6px;margin-bottom:4px}
.card2 .bd{font-size:clamp(16px,2.5vmin,20px);font-weight:700;line-height:1.5}
.fbox{font-family:var(--body);font-weight:700;font-size:clamp(21px,3.4vmin,30px);text-align:center;padding:8px;border:3px dashed var(--ink);border-radius:12px;background:var(--wht);margin:8px 0}
.ovtag{display:inline-block;margin-bottom:8px;font-family:var(--body);font-weight:700;font-size:14px;padding:3px 12px;border:3px solid var(--ink);border-radius:8px}
.mini-demo{height:90px;position:relative;border:3px solid var(--ink);border-radius:12px;background:var(--sky);overflow:hidden;margin:8px 0}

/* ---------- クリア ---------- */
.clr{text-align:center}
.clr .big{font-family:var(--disp);font-size:clamp(34px,7vmin,64px);color:var(--yel)}
.clr .sc{font-family:var(--disp);font-size:clamp(30px,6vmin,54px)}
.stars{display:flex;justify-content:center;gap:10px;margin:8px 0;min-height:76px}
.stars span{font-size:64px;line-height:1;color:#d9d2bf;-webkit-text-stroke:3px var(--ink);display:inline-block}
.stars span.on{color:var(--yel);animation:stmp .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes stmp{0%{transform:scale(3) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.recs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0}
.recs span{background:var(--ink);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700}
.recs span b{color:var(--yel)}
.newrec{display:inline-block;background:var(--red);color:#fff;font-family:var(--body);font-weight:700;padding:3px 12px;border:3px solid var(--ink);border-radius:10px;transform:rotate(-6deg);animation:pulse .8s infinite}

/* ---------- ステッカー ---------- */
.cap{width:120px;height:120px;margin:10px auto;position:relative;cursor:pointer}
.cap .t,.cap .bt{position:absolute;left:0;width:120px;height:60px;border:4px solid var(--ink)}
.cap .t{top:0;border-radius:60px 60px 0 0;background:var(--org);border-bottom-width:2px}
.cap .bt{top:60px;border-radius:0 0 60px 60px;background:var(--wht);border-top-width:2px}
.cap.shk{animation:shk .5s ease-in-out 3}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.cap.open .t{animation:capT .5s forwards}.cap.open .bt{animation:capB .5s forwards}
@keyframes capT{to{transform:translate(-40px,-60px) rotate(-40deg);opacity:0}}
@keyframes capB{to{transform:translate(40px,60px) rotate(30deg);opacity:0}}
.stkr{width:min(240px,70vw);margin:6px auto;border:4px solid var(--ink);border-radius:18px;padding:12px;background:var(--wht);box-shadow:6px 6px 0 var(--ink);text-align:center;position:relative;overflow:hidden;animation:flipin .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes flipin{0%{transform:rotateY(90deg) scale(.4)}100%{transform:rotateY(0) scale(1)}}
.stkr .ic{font-size:44px;line-height:1.1}
.stkr .nm{font-family:var(--body);font-weight:700;font-size:20px;margin:4px 0}
.stkr .fm{font-weight:700;font-size:15px;background:var(--pap);border-radius:8px;padding:4px}
.stkr .rr{position:absolute;top:6px;right:8px;font-family:var(--body);font-weight:700;font-size:11px;padding:1px 6px;border:2px solid var(--ink);border-radius:6px;background:#eee}
.stkr.gold{background:linear-gradient(135deg,#fff3b0,#ffd23f 45%,#fff3b0 55%,#e9b200)}
.stkr.gold .rr{background:var(--yel)}
.stkr.holo{background:linear-gradient(115deg,#ffd6c2,#fff5a8,#c9f7d4,#bfefff,#ffd1e6,#ffd6c2);background-size:300% 300%;animation:flipin .6s cubic-bezier(.2,1.5,.4,1),holo 2.4s linear infinite}
.stkr.holo .rr{background:var(--red);color:#fff}
.stkr.holo:after{content:"";position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);animation:shine 1.8s linear infinite}
@keyframes holo{to{background-position:300% 300%}}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
#book{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
#book .stkr{width:auto;margin:0;padding:8px;animation:none;box-shadow:4px 4px 0 var(--ink)}
#book .stkr.holo{animation:holo 2.4s linear infinite}
#book .stkr .ic{font-size:32px}#book .stkr .nm{font-size:15px}#book .stkr .fm{font-size:12px}
#book .stkr.no{filter:grayscale(1) brightness(.6);opacity:.55}

/* ---------- 確認テスト ---------- */
#test{overflow-y:auto;touch-action:pan-y;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px 40px}
#tq{width:min(760px,100%);padding:18px;margin-top:8px}
#tq .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#tq .qn{font-family:var(--body);font-weight:700;font-size:18px}
#tq .qt{font-size:clamp(17px,2.6vmin,22px);font-weight:700;line-height:1.6;margin:6px 0 12px}
#tq .ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.port #tq .ch{grid-template-columns:1fr}
#tq .ch .btn{font-family:var(--body);font-weight:700;font-size:clamp(16px,2.4vmin,20px);background:var(--wht);text-align:left}
#tq .ch .btn.ok{background:var(--yel)}#tq .ch .btn.ng{background:#bbb}
#tq .ex{margin-top:10px;font-weight:700;line-height:1.5;background:var(--pap);border-radius:8px;padding:8px 10px;border-left:6px solid var(--org)}

   ─ 2026-10-03 オーナー指示「BGMも本気出していいよ。全力でやっていこう」から作った共通部品
   ─ ゲームの index.html の印の外に window.GAME_FX = { bgm:{…} } を書くと、そのゲーム専用の曲が鳴る。

       BGM.mood('tense')    ピンチ・時間切れ間近（T セクションへ。無ければサビの和音で急かす）
       BGM.mood('calm')     静か（確認テスト中は自動でこれ）
       BGM.mood('clear')    クリアのジングル（Zukan.mainClear で自動）→ そのあと ふつう
       BGM.level(0〜3)      コンボなどで楽器を足す・引く（1がふつう）

   ─ iOS Safari の自動再生の決まりに合わせ、最初のタップで鳴り始める
   ─ 音量・オンオフのボタン（左下・指で押せる大きさ）。状態は localStorage（rika-bgm:v1）に保存。初期音量は「小」
     （教室で30台が同時に鳴る前提）。図鑑の「音を消す」（rika-zukan:profile:v1 の mute）にも従う
   ─ このファイルは build / sync_one.py が各ゲームの ZUKAN（または GUARD）の印の間へ同期する（ゲーム側で直接いじらない）
   ─ 外への送信はしない
   ========================================================== */

    square:function(t,m,d,v,out){ var f = mtof(m), g = gain(0), lp = filt('lowpass', 3200, .7), e = env(g,t,.005,.12,.55,.08,.32*v,d), o = osc('square',f,t,e); vib(o,t,14,5.6,.18,e); o.connect(lp); lp.connect(g); g.connect(out); },

    freeze:function(c,o,t,p){ for(var i=0;i<9;i++) sTone(c,o,t+i*.07,'sine',(2000+Math.random()*2200)*p,null,.5,.07); sNoise(c,o,t+.62,.06,'highpass',4500,.7,.5); sTone(c,o,t+.62,'triangle',3200*p,2600*p,.15,.1); },
    wilt:function(c,o,t,p){ var w = sTone(c,o,t,'triangle',760*p,170*p,1.1,.28,.05); var l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 7; lg.gain.value = 30; l.connect(lg); lg.connect(w.frequency); l.start(t); l.stop(t+1.2); sTone(c,o,t+1.05,'sine',120,60,.2,.3); },
    glitch:function(c,o,t,p){ for(var i=0;i<14;i++) sTone(c,o,t+i*.032,'square',(100+Math.random()*1600)*p,null,.03,.12); sNoise(c,o,t+.48,.12,'bandpass',3000,.5,.3); },
    heart:function(c,o,t,p){ [[0,.9],[.26,.6],[1.05,.6],[1.31,.42]].forEach(function(b){ sTone(c,o,t+b[0],'sine',72*p,38*p,.24,b[1]); sNoise(c,o,t+b[0],.05,'lowpass',300,.7,b[1]*.4); }); },
    smoke:function(c,o,t,p){ sNoise(c,o,t,.55,'bandpass',300,1.2,.5,2600); sTone(c,o,t+.05,'sine',230*p,85*p,.35,.5); sTone(c,o,t+.42,'triangle',880*p,1320*p,.12,.08); },
    gust:function(c,o,t,p){ var g = sNoise(c,o,t,1.5,'bandpass',300,1.4,.0001,500); g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.7,t+.4); g.gain.exponentialRampToValueAtTime(.001,t+1.5); var f = g; sTone(c,o,t+.1,'sine',900*p,1350*p,.9,.05,.3); },
    quake:function(c,o,t,p){ sNoise(c,o,t,1.8,'lowpass',160,.8,.9); sTone(c,o,t,'sine',42*p,32*p,1.8,.7,.15); for(var i=0;i<5;i++) sNoise(c,o,t+.2+Math.random()*1.2,.08,'lowpass',600,.7,.35); },
    stamp:function(c,o,t,p){ sTone(c,o,t+.45,'sine',150*p,55*p,.2,.9); sNoise(c,o,t+.45,.09,'lowpass',1400,.7,.6); sNoise(c,o,t+.55,.25,'bandpass',4000,.8,.08); },
    ink:function(c,o,t,p){ sNoise(c,o,t,.28,'lowpass',900,.7,.7,200); sTone(c,o,t,'sine',180*p,70*p,.18,.35); sNoise(c,o,t+.3,.4,'bandpass',1200,1.5,.12,4000); },
    melt:function(c,o,t,p){ var g = sNoise(c,o,t,1.2,'highpass',3500,.6,.35); var l = c.createOscillator(), lg = c.createGain(); l.type = 'square'; l.frequency.value = 23; lg.gain.value = .2; l.connect(lg); lg.connect(g.gain); l.start(t); l.stop(t+1.2); sTone(c,o,t,'sine',300*p,120*p,.3,.2); },
    buzzer:function(c,o,t,p){ [[0,.22],[.32,.5]].forEach(function(b){ var lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.connect(o); sTone(c,lp,t+b[0],'square',196*p,null,b[1],.22); sTone(c,lp,t+b[0],'square',185*p,null,b[1],.22); }); },
    fizzle:function(c,o,t,p){ sTone(c,o,t,'sine',900*p,55*p,1,.32); sTone(c,o,t,'sawtooth',450*p,30*p,.9,.07); [.2,.36,.5].forEach(function(d){ sNoise(c,o,t+d,.02,'highpass',3000,.7,.25); }); },
    dizzy:function(c,o,t,p){ var w = sTone(c,o,t,'triangle',620*p,260*p,1.4,.25,.04); var l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 6; lg.gain.value = 120; l.connect(lg); lg.connect(w.frequency); l.start(t); l.stop(t+1.5); },
    stop:function(c,o,t,p){ sTone(c,o,t,'sine',520*p,null,.16,.3); sTone(c,o,t+.2,'sine',390*p,null,.26,.3); }
  };
  function penSound(type, pitch){
    var d = sfxOut(); if(!d) return;
    try{ (SND[type] || SND.stop)(d.c, d.o, d.c.currentTime + .01, pitch || 1); }catch(e){}
  }
  function fxConf(){
    var f = window.GAME_FX && window.GAME_FX.penalty; f = f && typeof f === 'object' ? f : {};
    var type = FXT[f.type] ? f.type : 'stop', T = FXT[type];
    return {type:type, sound:SND[f.sound] ? f.sound : type, word:f.word || T.word, words:f.words || {}, color:f.color || T.color, bg:f.bg || T.bg,
            ink:f.ink || T.ink || '#ffffff', font:f.font || '', say:f.say || {}, pitch:+f.pitch || 1, shake:f.shake == null ? 1 : +f.shake};
  }
  var WHY = {
    mash:'れんだ しても 理科は 身につかない',
    guess:'当てずっぽうは 考えたことに ならない',
    skip:'解説を とばすと 同じところで また まちがえる'
  };
  var NAME = {mash:'れんだ', guess:'あてずっぽう', skip:'とばし読み'};
  /* 罰の札：画面全体をおおって lockMs のあいだ操作を止める（見た目と音は fxConf() ＝ゲームの GAME_FX.penalty） */
  function pen(kind, cost, extra){
    ensureCSS(); if(!document.body) return;
    var ms = CFG.lockMs, F = fxConf();
    lockUntil = Math.max(lockUntil, now() + ms);
    var old = document.querySelectorAll('.tk-pen'); for(var i=0;i<old.length;i++) old[i].remove();
    var d = document.createElement('div'); d.className = 'tk-pen tk-fx-' + F.type; d.style.setProperty('--tk-ms', (ms/1000) + 's');
    d.style.setProperty('--c', F.color); d.style.setProperty('--bg', F.bg); d.style.setProperty('--ink', F.ink); if(F.font) d.style.setProperty('--font', F.font);
    d.setAttribute('role', 'alert');
    var word = F.words[kind] || F.word, say = F.say[kind] || '';
    d.innerHTML = '<div class="tk-art">' + FXT[F.type].art() + '</div>' +
      '<div class="t0">' + esc(NAME[kind] || '') + '</div>' +
      '<div class="t1">' + esc(word) + (cost ? '<small>' + esc(cost) + '</small>' : '') + '</div>' +
      '<div class="t2">' + (say ? '<span class="say">' + esc(say) + '</span>' : '') + esc(WHY[kind] || '') + (extra ? '<br>' + extra : '') + '</div><div class="bar"></div>';
    var kill = function(e){ e.preventDefault(); e.stopPropagation(); };
    ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click'].forEach(function(t){ d.addEventListener(t, kill, {passive:false}); });
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, ms);
    penSound(F.sound, F.pitch);
    try{ if(window.BGM && BGM.duck) BGM.duck(ms); }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate([60,40,120]); }catch(e){}
    try{ if(F.shake > 0 && !matchMedia('(prefers-reduced-motion:reduce)').matches && document.body.animate){ var k = 8 * F.shake; document.body.animate([{transform:'translate(-'+k+'px,2px)'},{transform:'translate('+(k-1)+'px,-3px)'},{transform:'translate(-'+(k-3)+'px,3px)'},{transform:'none'}], {duration:320}); } }catch(e){}
  }

  /* ---------------- 本編の罰の払い方 ----------------
     ゲームが onPenalty を渡していればゲーム自身の点で払う。なければ図鑑のかけら（次にもらう分から引く）。
     どちらも無いゲームでは、操作を止めるだけ（数字は出さない）。回数が増えるほど重くなる */
  function hasZukan(){ return !!(window.Zukan && Zukan.earn); }
  function gameCost(base){ S.game.k++; return Math.min(CFG.debtMax, base * S.game.k); }
  function costText(n){
    if(typeof CFG.onPenalty === 'function') return CFG.penaltyLabel || '−';
    if(hasZukan()) return 'かけら −' + n;
    return '';
  }
  function pay(kind, n){
    if(typeof CFG.onPenalty === 'function'){ try{ CFG.onPenalty(kind, n); }catch(e){} return; }
    if(hasZukan()) S.debt += n;
  }
  function gamePenalty(kind, base){
    ensureLoaded();
    if(kind === 'guess') S.game.guess++; else S.game.mash++;
    S.game.sus++; S.game.streak = 0;
    var n = gameCost(base);
    pay(kind, n); save();
    pen(kind, costText(n), hasZukan() && typeof CFG.onPenalty !== 'function' ? 'つぎに もらう かけらから 引かれるよ' : '');
    emit(kind, {cost:n});
  }
  function testPenalty(kind){
    S.test[kind]++;
    var extra = '確認テストの点 −1・提出カードが「ひび入り」になる';
    if(kind === 'skip'){
      if(S.test.skip % 2){ note('<b>とばし読み</b>　問題と解説、ちゃんと読んだ？ <em>あと1回で −1点</em>', 2400); emit('skip'); return; }
    }
    pen(kind, '−1点', extra);
    emit(kind);
  }

  /* ---------------- 連打 ---------------- */
  function excluded(t){
    return !t || !t.closest || !!t.closest('#sc-ov,.zk-ov,.tk-pen,.tk-chk .tk-ch,[data-mash-ok]');
  }
  function isButton(t){
    return !!t.closest('button,[role=button],a[href],input[type=button],input[type=submit],label,summary,.btn');
  }
  function onClick(e){
    var t = e.target, at = now();
    if(at < lockUntil){ e.preventDefault(); e.stopPropagation(); return; }
    if(excluded(t)) return;
    if(S.inTest && at - Math.max(S.lastAt, S.t0) > 180000) S.inTest = false; /* テストを途中でやめて本編へもどった */
    clicks.push(at); if(clicks.length > 8) clicks.shift();
    if(gateBlock(e)) return;
    if(t.closest('canvas')) return;
    if(!S.inTest && (!CFG.mash || !isButton(t))) return;
    taps.push(at);
    while(taps.length && at - taps[0] > CFG.mashMs) taps.shift();
    if(taps.length >= CFG.mashN){
      taps = []; e.preventDefault(); e.stopPropagation();
      if(S.inTest) testPenalty('mash'); else gamePenalty('mash', CFG.debtMash);
    }
  }

  /* ---------------- カラオケ読み ---------------- */
  function karaoke(el, cps){
    var chars = [];
    (function walk(node){
      var kids = [].slice.call(node.childNodes);
      for(var i=0;i<kids.length;i++){
        var c = kids[i];
        if(c.nodeType === 3){
          var txt = c.nodeValue; if(!txt) continue;
          var frag = document.createDocumentFragment();
          for(var j=0;j<txt.length;j++){
            var ch = txt.charAt(j), sp = document.createElement('span');
            sp.className = 'tk-kc'; sp.textContent = ch; frag.appendChild(sp);
            var ms = /\s/.test(ch) ? 30 : 1000 / cps;
            if(/[、，,]/.test(ch)) ms += 200; if(/[。！？!?]/.test(ch)) ms += 350;
            chars.push({sp:sp, ms:ms});
          }
          c.parentNode.replaceChild(frag, c);
        }else if(c.nodeType === 1 && !/^(SCRIPT|STYLE|SVG|svg|CANVAS|IMG|BUTTON|INPUT|TEXTAREA|SELECT)$/.test(c.tagName)){
          if(c.tagName === 'BR' && chars.length) chars[chars.length-1].ms += 220;
          walk(c);
        }
      }
    })(el);
    if(!chars.length) return null;
    el.classList.add('tk-kara');
    var total = 0; for(var k=0;k<chars.length;k++) total += chars[k].ms;
    var i = 0, timer = 0, stopped = false;
    function step(){
      if(stopped || !el.isConnected) return;
      if(i > 0) chars[i-1].sp.className = 'tk-kc lit';
      if(i >= chars.length) return;
      chars[i].sp.className = 'tk-kc now';
      var ms = chars[i].ms; i++;
      timer = setTimeout(step, ms);
    }
    step();
    return {total:total, stop:function(){ stopped = true; clearTimeout(timer); chars.forEach(function(c){ c.sp.className = 'tk-kc lit'; }); }};
  }
  /* 解説の文が入っている、いちばん小さい見えている要素を探す */
  function findTextEl(text){
    var key = strip(text); if(key.length < 6) return null;
    var head = key.slice(0, Math.min(16, key.length));
    var all = document.body.getElementsByTagName('*'), best = null, bestLen = 1e9;
    for(var i=0;i<all.length;i++){
      var e = all[i];
      if(/^(SCRIPT|STYLE|BUTTON|svg|SVG|HTML|BODY)$/.test(e.tagName) || e.closest('#sc-ov,.zk-ov,.tk-note,.tk-pen,svg')) continue;
      var t = strip(e.textContent);
      if(t.length >= bestLen || t.indexOf(head) < 0) continue;
      var r = e.getBoundingClientRect(); if(r.width < 4 || r.height < 4) continue;
      best = e; bestLen = t.length;
    }
    /* 見出し（「もう一歩」「正解：…」）ごと読ませるため、親が解説とほぼ同じ大きさなら親まで上がる */
    while(best && best.parentElement && best.parentElement !== document.body){
      var pl = strip(best.parentElement.textContent).length;
      if(pl > key.length * 1.6 + 40 || best.parentElement.querySelector('button,input,select,canvas')) break;
      best = best.parentElement;
    }
    return best;
  }

  /* ---------------- 解説の「つぎへ」を読み終わるまで止める ---------------- */
  var NEXT_RE = /^(▶|→|＞|>)?\s*(つぎ|次|NEXT|Next|next|答え合わせ|こたえあわせ|結果|けっか)/;
  function textOf(b){ return String(b.textContent || b.value || '').trim(); }
  function visible(el){
    if(!el || !el.isConnected || el.disabled) return false;
    var r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return false;
    var cs = getComputedStyle(el); return cs.visibility !== 'hidden' && cs.display !== 'none' && +cs.opacity > 0.05;
  }
  function nextButtons(){
    var out = [], bs = document.querySelectorAll('button,[role=button],input[type=button]');
    for(var i=0;i<bs.length;i++){ var b = bs[i]; if(excluded(b)) continue; if(NEXT_RE.test(textOf(b)) && visible(b)) out.push(b); }
    return out;
  }
  function gate(btn, opt){
    if(!btn) return;
    opt = opt || {};
    var ms = opt.ms, el = opt.el || null, kara = null;
    if(ms == null){
      if(!el && opt.text) el = findTextEl(opt.text);
      if(el) kara = karaoke(el, opt.ok ? CFG.readCpsOk : CFG.readCps);
      if(kara) ms = kara.total + 300;
      else { var n = strip(opt.text || '').length; ms = n ? n / (opt.ok ? CFG.readCpsOk : CFG.readCps) * 1000 : (opt.ok ? 700 : 1200); }
    }
    ms = Math.min(CFG.readMax, ms);
    if(ms <= 0) return;
    ensureCSS();
    var g = {b:btn, until:now() + ms, tries:0, kara:kara};
    gates.push(g);
    btn.classList.add('tk-gated'); btn.style.setProperty('--tk-ms', (ms/1000) + 's');
    g.timer = setTimeout(function(){ ungate(g, true); }, ms);
  }
  function ungate(g, ready){
    var i = gates.indexOf(g); if(i >= 0) gates.splice(i, 1);
    clearTimeout(g.timer);
    if(g.kara) g.kara.stop();
    if(g.b){ g.b.classList.remove('tk-gated'); if(ready && g.b.isConnected){ g.b.classList.add('tk-ready'); setTimeout(function(){ g.b.classList.remove('tk-ready'); }, 2100); } }
  }
  function gateBlock(e){
    if(!gates.length) return false;
    var t = e.target, at = now();
    for(var i=gates.length-1;i>=0;i--){
      var g = gates[i];
      if(!g.b.isConnected){ ungate(g); continue; }
      if(at >= g.until){ ungate(g, true); continue; }
      if(g.b === t || g.b.contains(t)){
        e.preventDefault(); e.stopPropagation();
        g.tries++;
        if(g.tries >= 4){
          g.tries = 0;
          if(S.inTest){ S.test.skip += 2; pen('skip', '−1点', '確認テストの点 −1・提出カードが「ひび入り」になる'); emit('skip'); }
          else gamePenalty('skip', CFG.debtMash);
        }else{
          note('📖 光る文字を 目で追って 読もう　<em>あと ' + Math.ceil((g.until - at) / 1000) + ' 秒</em>', 1500);
        }
        return true;
      }
    }
    return false;
  }

  /* ---------------- 確認テスト ---------------- */
  function startTest(){
    S.inTest = true; S.t0 = now(); S.lastAt = 0; S.seen = {};
    S.test = {guess:0, mash:0, skip:0, n:0};
    if(!S.told){
      S.told = true;
      setTimeout(function(){
        note('📝 <em>確認テストのルール</em><br>● 問題が出てすぐ（2.5秒以内）の<b>まちがい</b> → あてずっぽう <b>−1点</b><br>● <b>連打</b>（1秒に7回） → <b>−1点</b><br>● 解説を<b>とばす</b>（光り終わる前に何度も押す・すぐ次を答える） → <b>−1点</b><br>罰があると 提出カードが「<b>ひび入り</b>」になる。わからない問題は、考えてから答えよう。', 5600);
      }, 350);
    }
  }
  function prevClickBefore(at){
    /* 答えを決めたクリック（いまから0.4秒以内）の、ひとつ前のクリック＝「つぎへ」を押した時刻 */
    var i = clicks.length - 1;
    if(i >= 0 && at - clicks[i] < 400) i--;
    return i >= 0 ? clicks[i] : 0;
  }
  function onTestAnswer(q, ok){
    var key = q && (q.id || q.q) ? String(q.id || strip(q.q)) : '#' + S.test.n;
    if(S.seen[key]) return;
    S.seen[key] = 1;
    var at = now(), gap = at - (S.lastAt || S.t0);
    S.lastAt = at; S.test.n++;
    var think = gap;
    if(!q || q.t === 'choice' || q.t == null){ var p = prevClickBefore(at); if(p && p > (S.t0 - 50)) think = Math.min(gap, at - p); }
    if(!ok && think < CFG.guessMs) testPenalty('guess');
    else if(S.test.n > 1 && gap < CFG.skipMs) testPenalty('skip');
    else if(ok && think >= CFG.guessMs) praise();
    if(!ok) S.game.streak = 0;
    /* 解説をカラオケ読みさせ、新しく出た「つぎへ」を読み終わるまで止める */
    var ex = q ? (q.ex || q.exp || '') : '';
    var before = nextButtons();
    setTimeout(function(){
      var after = nextButtons(), fresh = [];
      for(var i=0;i<after.length;i++) if(before.indexOf(after[i]) < 0) fresh.push(after[i]);
      if(!fresh.length) return;
      var ms = null, el = ex ? findTextEl(ex) : null, kara = el ? karaoke(el, ok ? CFG.readCpsOk : CFG.readCps) : null;
      if(kara) ms = kara.total + 300;
      for(var j=0;j<fresh.length;j++) gate(fresh[j], ms != null ? {ms:ms} : ex ? {text:ex, ok:ok, el:null} : {ms: ok ? 700 : 1200});
      if(kara && fresh.length) gates[gates.length-1].kara = kara;
    }, Math.max(40, lockUntil - now() + 40)); /* 罰の札が消えてから読み始める */
  }
  function penalty(){
    return S.test.guess + S.test.mash + Math.floor(S.test.skip / 2);
  }
  function fmtTime(ms){ var s = Math.round(ms/1000); return Math.floor(s/60) + '分' + String(s%60).padStart(2,'0') + '秒'; }

  /* ---------------- 本編の○×（ゲームが Tekitou.answer を呼んだとき） ---------------- */
  function onGameAnswer(ok){
    var at = now(), from = Math.max(S.game.shownAt || 0, S.game.lastAt || 0), think = from ? at - from : 1e9;
    S.game.lastAt = at;
    /* 子どもが押した（離した）直後に決まった正誤だけを数える。時間で自動に進む場面（流れてきた・ぶつかった）の正誤は数えない */
    var byHand = at - lastInputAt < 600;
    if(!byHand) { if(!ok) S.game.streak = 0; return; }
    if(ok) { S.game.wrongs = []; if(think >= CFG.guessMs) praise(); return; }
    S.game.streak = 0;
    S.game.wrongs.push(at);
    while(S.game.wrongs.length && at - S.game.wrongs[0] > CFG.burstMs) S.game.wrongs.shift();
    var fast = think < CFG.guessMs, burst = S.game.wrongs.length >= CFG.burstN;
    if(!(fast || burst)) return;
    S.game.wrongs = [];
    gamePenalty('guess', CFG.debtGuess);
  }

  /* ---------------- ごほうび：考えてから正解したら金の「本物 ×n」 ---------------- */
  function praise(){
    ensureCSS(); if(!document.body) return;
    S.game.streak++;
    var n = S.game.streak, d = document.createElement('div');
    var x = lastPt[0] || innerWidth / 2, y = lastPt[1] || innerHeight * .4;
    d.className = 'tk-real' + (n >= 5 ? ' big' : '');
    d.style.left = Math.max(70, Math.min(innerWidth - 70, x)) + 'px'; d.style.top = Math.max(40, y - 30) + 'px';
    d.innerHTML = '✨ 本物' + (n >= 2 ? ' <b>×' + n + '</b>' : '') + (n === 5 ? '<small>じっくり名人！</small>' : n === 10 ? '<small>理屈マスター！</small>' : '');
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1300);
  }
  var lastPt = [0, 0], lastInputAt = 0;
  window.addEventListener('pointerdown', function(e){ lastPt = [e.clientX, e.clientY]; lastInputAt = now(); }, true);
  ['pointerup','click','keydown'].forEach(function(t){ window.addEventListener(t, function(){ lastInputAt = now(); }, true); });

  /* ---------------- まぐれ判定（パズルの手） ---------------- */
  function median(a){ if(!a.length) return 1e9; var b = a.slice().sort(function(x,y){return x-y}); return b[b.length >> 1]; }
  function solved(o){
    o = o || {};
    var mv = S.moves.slice(), n = mv.length, gaps = [];
    for(var i=1;i<n;i++) gaps.push(mv[i] - mv[i-1]);
    S.moves = [];
    var min = +o.min || 0;
    var many = min ? (n >= Math.max(min * 2 + 4, min + 6)) : (n >= 12);
    var lucky = many && median(gaps) < CFG.luckyGapMs;
    if(!lucky){
      if(n && (!min || n <= min + 2)) praise();
      if(o.onResult) try{ o.onResult(true); }catch(e){}
      return false;
    }
    S.game.lucky++; S.game.sus++; S.game.streak = 0;
    emit('lucky', {moves:n, min:min});
    if(o.defer){
      /* アクションの最中は止めない：まぐれを覚えておき、本編クリアのときに理屈チェック */
      note('🔍 <b>まぐれ？</b>　手あたりしだいに さわって 合っただけ かも。<br><em>クリアのときに 理屈チェック</em>が 出るよ', 3000);
      if(o.onResult) try{ o.onResult(false); }catch(e){}
      return true;
    }
    riddle({q:o.q, title:'まぐれ？', sub:'手あたりしだいに さわって 合っただけ かも。<br>理屈が わかっているか 1問で たしかめよう'}).then(function(ok){
      if(o.onResult) try{ o.onResult(ok); }catch(e){}
    });
    return true;
  }

  /* ---------------- 理屈チェック（1問） ---------------- */
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pickQ(){
    try{
      if(!window.Quiz || !Quiz.all) return null;
      var all = Quiz.all().filter(function(q){ return q.t === 'choice' && q.choices && q.choices.length >= 2 && !q.fig; });
      var k = '';
      try{ k = (Zukan._cur.koma || [])[0] || ''; }catch(e){}
      var mine = all.filter(function(q){ return !k || q.koma === k; });
      var pool = mine.length ? mine : all;
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }catch(e){ return null; }
  }
  var riddleOpen = false;
  function riddle(o){
    return new Promise(function(res){
      var q = o.q || pickQ();
      if(!q || riddleOpen || !document.body){ res(true); return; }
      riddleOpen = true; ensureCSS();
      var shown = shuffle(q.choices), t0 = now(), done = false;
      var d = document.createElement('div'); d.className = 'tk-chk';
      d.innerHTML = '<div class="tk-card"><div class="tk-h">🔍 理屈チェック' + (o.title ? '<span>' + esc(o.title) + '</span>' : '') + '</div>' +
        '<p class="tk-sub">' + (o.sub || 'クリアの前に 1問だけ。ちゃんと わかってクリアしたか たしかめよう') + '</p>' +
        '<p class="tk-q"></p><div class="tk-ch"></div><div class="tk-ex"></div><div class="tk-go"></div></div>';
      d.querySelector('.tk-q').textContent = String(q.q || '').replace(/<[^>]*>/g, '');
      var box = d.querySelector('.tk-ch');
      shown.forEach(function(c){
        var b = document.createElement('button'); b.type = 'button'; b.textContent = String(c).replace(/<[^>]*>/g, '');
        b.onclick = function(){
          if(done) return; done = true;
          var ok = c === q.choices[0], think = now() - t0;
          [].forEach.call(box.children, function(x){ x.disabled = true; if(x.textContent === String(q.choices[0]).replace(/<[^>]*>/g, '')) x.className = 'ok'; else if(x === b) x.className = 'ng'; });
          var ex = d.querySelector('.tk-ex'), go = d.querySelector('.tk-go');
          if(ok && think >= CFG.guessMs){
            ex.innerHTML = '<div class="tk-big">本物！ ✨</div>';
            praise(); S.game.sus = 0; S.game.lucky = 0;
            setTimeout(function(){ d.remove(); riddleOpen = false; res(true); }, 1400);
            return;
          }
          ex.innerHTML = (ok ? '<b>正解。でも 早すぎ！</b> 考えてから 答えよう<br>' : '<b>もう一歩</b> 正解：' + esc(String(q.choices[0]).replace(/<[^>]*>/g, '')) + '<br>') + esc(String(q.ex || '').replace(/<[^>]*>/g, ''));
          ensureLoaded();
          var n = CFG.debtLucky; pay('lucky', n); save();
          var nb = document.createElement('button'); nb.type = 'button'; nb.className = 'tk-next'; nb.textContent = 'わかった（' + (costText(n) || 'もう一度 考えよう') + '）';
          nb.onclick = function(){ if(nb.classList.contains('tk-gated')) return; d.remove(); riddleOpen = false; res(false); };
          go.appendChild(nb);
          var kara = karaoke(ex, CFG.readCps);
          gate(nb, {ms: kara ? kara.total + 300 : 2500});
          if(kara && gates.length) gates[gates.length - 1].kara = kara;
        };
        box.appendChild(b);
      });
      document.body.appendChild(d);
    });
  }

  /* ---------------- 共通部品へのつなぎ ---------------- */
  function hookQuiz(){
    var Q = window.Quiz; if(!Q || Q.__tk) return; Q.__tk = 1;
    var test = Q.test, check = Q.check, review = Q.review;
    if(test) Q.test = function(){ var r = test.apply(this, arguments); startTest(); return r; };
    if(check) Q.check = function(q, ans){
      var ok = check.apply(this, arguments);
      if(!S.inReview){ try{ if(S.inTest) onTestAnswer(q, ok); }catch(e){} }
      return ok;
    };
    if(review) Q.review = function(){ S.inReview = true; try{ return review.apply(this, arguments); } finally { S.inReview = false; } };
  }
  function hookCard(){
    var C = window.SubmitCard; if(!C || C.__tk) return; C.__tk = 1;
    var show = C.show;
    C.show = function(r, onClose){
      try{
        if(r && S.t0){
          ensureLoaded();
          r = Object.assign({}, r);
          var raw = +r.score || 0, full = penalty(), p = Math.min(raw, full), rows = (r.records || []).slice(), why = [];
          if(S.test.guess) why.push('あてずっぽう ' + S.test.guess + '回');
          if(S.test.mash) why.push('連打 ' + S.test.mash + '回');
          if(S.test.skip) why.push('とばし読み ' + S.test.skip + '回');
          if(full > 0){ r.score = raw - p; rows.push(['適当プレイ', 'ひび入り −' + full + '点（' + why.join('・') + '）' + (full > p ? '　※0点より下にはならない' : '')]); }
          else if(why.length){ rows.push(['適当プレイ', why.join('・')]); }
          else rows.push(['解きかた', '◎ 本物（罰なし・じっくり解いた）']);
          rows.push(['テストの時間', fmtTime(now() - S.t0)]);
          if(S.game.mash || S.game.guess) rows.push(['ゲーム中の連打・あてずっぽう', (S.game.mash + S.game.guess) + '回']);
          r.records = rows;
          r.tekitou = {raw:raw, penalty:p, full:full, guess:S.test.guess, mash:S.test.mash, skip:S.test.skip, game:S.game.mash + S.game.guess};
        }
      }catch(e){}
      S.inTest = false; S.t0 = 0;
      return show.call(this, r, onClose);
    };
  }
  function hookZukan(){
    var Zk = window.Zukan; if(!Zk || Zk.__tk || !Zk.earn) return; Zk.__tk = 1;
    var earn = Zk.earn;
    Zk.earn = function(n, why, opt){
      ensureLoaded();
      if(S.debt > 0 && why !== 'pass'){
        n = Math.floor(Number(n) || 0);
        var cut = Math.min(S.debt, n);
        if(cut > 0){
          S.debt -= cut; n -= cut; save();
          if(!(opt && opt.silent)) setTimeout(function(){ note('<b>連打・あてずっぽう・とばし読み</b>の罰で かけら <em>−' + cut + '</em>', 2600); }, 600);
        }
        if(n <= 0) return 0;
      }
      return earn.call(this, n, why, opt);
    };
  }
  /* 本編クリア：まぐれ・罰があったときだけ理屈チェックを1問はさむ（ふつうに遊んだ子は止めない） */
  function hookClear(){
    var Zk = window.Zukan; if(!Zk || Zk.__tkc || !Zk.mainClear) return; Zk.__tkc = 1;
    var mc = Zk.mainClear;
    Zk.mainClear = function(opt){
      var self = this, args = arguments;
      if(S.game.sus > 0 && window.GAME_MODE !== 'test'){
        riddle({title:'クリアの前に', sub:'このプレイでは 連打・あてずっぽう・まぐれが あった。<br>理屈が わかっているか 1問で たしかめよう'}).then(function(){ S.game.sus = 0; mc.apply(self, args); });
        return 0;
      }
      return mc.apply(this, arguments);
    };
  }
  function hookAll(){ hookQuiz(); hookCard(); hookZukan(); hookClear(); }

  window.addEventListener('click', onClick, true);

  window.Tekitou = {
    setup: function(o){ if(o) for(var k in o) if(Object.prototype.hasOwnProperty.call(CFG, k)) CFG[k] = o[k]; hookAll(); },
    shown: function(){ S.game.shownAt = now(); S.moves = []; if(S.inTest) S.lastAt = now(); },
    move: function(){ var t = now(), l = S.moves[S.moves.length-1]; if(l && t - l < 60) return; /* 同じ1手で2回呼ばれたものはまとめる */ S.moves.push(t); if(S.moves.length > 400) S.moves.shift(); },
    solved: solved,
    check: function(o){ return riddle(o || {}); },
    answer: function(ok, o){ hookAll(); if(S.inTest) onTestAnswer(o && o.q, !!ok); else onGameAnswer(!!ok); },
    startTest: function(){ startTest(); },
    gate: gate,
    karaoke: function(el, o){ ensureCSS(); return karaoke(el, (o && o.cps) || CFG.readCps); },
    stats: function(){ ensureLoaded(); return {test:Object.assign({penalty:penalty(), inTest:S.inTest}, S.test), game:{mash:S.game.mash, guess:S.game.guess}, debt:S.debt}; },
    config: CFG,
    fx: {types:Object.keys(FXT), preview:function(kind){ pen(kind || 'mash', 'かけら −5', ''); }, sound:function(type, c, out, t, p){ (SND[type] || SND.stop)(c, out, t || 0, p || 1); }},
    _hook: hookAll
  };

  hookAll();
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hookAll);
  window.addEventListener('load', hookAll);
})();

/*@GUARD_END*/</script>

    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',

  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div'+(x[0]==='適当プレイ'?' class="sc-bad"':x[0]==='解きかた'?' class="sc-good"':'')+'>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.tekitou&&r.tekitou.full>0?'<s>ひび入り<br>減点前 '+esc(r.tekitou.raw)+'点</s>':'')+(r.koma&&isPass(r)?'<em>合格</em>':'')+(r.tekitou&&!r.tekitou.full?'<em style="background:linear-gradient(135deg,#f3c34a,#c8862a)">✨本物</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>
'use strict';

const f2=x=>{const v=Math.round(x*100)/100;return (Math.abs(v)<1e-9?0:v).toFixed(2)};

const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,PORT=false,R={x:0,y:0,w:300,h:300},MODE='title',TT=0;

const EMB=(()=>{try{return window.self!==window.top}catch(e){return true}})();document.body.classList.toggle('embed',EMB);

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);PORT=W<H*1.05;document.body.classList.toggle('port',PORT);buildScenery();layoutR()}
function layoutR(){
  const hud=62,dock=PORT?(EMB?150:100):96,t=$('task'),hasT=!t.classList.contains('hidden');
  if(PORT){const th=hasT?t.offsetHeight+6:0;R={x:8,y:hud+th+4,w:W-16,h:Math.max(150,H-hud-th-4-dock)};$('dock').style.left='0px'}
  else{const pw=hasT?Math.min(340,W*.32)+20:0;R={x:pw+10,y:hud+6,w:W-pw-20,h:Math.max(150,H-hud-6-dock)};$('dock').style.left=pw+'px'}
}
addEventListener('resize',resize);

/* =====================================================================
   描画の道具（ステッカー・ポップ）
   ===================================================================== */
function rrect(x,y,w,h,r){r=Math.max(0,Math.min(r,Math.abs(w)/2,Math.abs(h)/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2)}
function poly(p){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath()}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
/* fn で形を作り、ずらした黒い影 → 塗り → 墨の線 */
function ink(fn,fill,lw=3,sh=4,sx,sy){

function font(size,disp){return disp?`${size}px 'Dela Gothic One','Hiragino Sans',sans-serif`:`700 ${size}px 'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif`}
function txt(s,x,y,o={}){ctx.save();ctx.font=font(o.size||16,o.disp);ctx.textAlign=o.align||'center';ctx.textBaseline='middle';
  if(o.stroke){ctx.lineWidth=o.stroke;ctx.strokeStyle=o.sc||INK;ctx.lineJoin='round';ctx.strokeText(s,x,y)}ctx.fillStyle=o.col||INK;ctx.fillText(s,x,y);ctx.restore()}
function tag(s,x,y,o={}){const size=o.size||15,dsp=o.disp&&size>=18;ctx.save();ctx.font=font(size,dsp);const w=ctx.measureText(s).width+size*1.1,h=size*1.8;ctx.restore();
  let bx=x-w/2,by=y-h/2;if(o.al==='l')bx=x;if(o.al==='r')bx=x-w;
  bx=clamp(bx,4,W-w-4);by=clamp(by,4,H-h-4);
  ink(()=>rrect(bx,by,w,h,h*.32),o.bg||WHT,2.5,3);txt(s,bx+w/2,by+h/2+1,{size,col:o.fg||INK,disp:dsp});return{x:bx,y:by,w,h}}
function arrow(x1,y1,x2,y2,col,o={}){
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<4)return;const a=Math.atan2(dy,dx),w=o.w||7,hl=Math.min(o.head||17,L*.6),hw=w*1.75;
  ctx.save();ctx.translate(x1,y1);ctx.rotate(a);const c=Math.cos(-a),s=Math.sin(-a),sh=o.sh??3;
  if(o.dash){ctx.setLineDash([6,5]);ctx.strokeStyle=col;ctx.lineWidth=3;line(0,0,L-hl,0);ctx.setLineDash([]);
    ink(()=>poly([[L-hl,-hw*.8],[L,0],[L-hl,hw*.8]]),col,2,0)}
  else ink(()=>{ctx.beginPath();ctx.moveTo(0,-w/2);ctx.lineTo(L-hl,-w/2);ctx.lineTo(L-hl,-hw);ctx.lineTo(L,0);ctx.lineTo(L-hl,hw);ctx.lineTo(L-hl,w/2);ctx.lineTo(0,w/2);ctx.closePath()},col,2.5,sh,sh*c-sh*s,sh*s+sh*c);
  ctx.restore();
  if(o.label)tag(o.label,x2+(o.lx||0),y2+(o.ly||0),{bg:col,fg:o.fg||'#fff',size:o.ls||13});
}
/* 主役：木箱のハコ吉（下の真ん中が x,y） */
function crate(x,y,s,ang=0,o={}){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const w=s*(o.wr||1),h=s,c=Math.cos(-ang),sn=Math.sin(-ang);
  ink(()=>rrect(-w/2,-h,w,h,s*.1),o.col||'#eba13b',3,4,4*c-4*sn,4*sn+4*c);
  ctx.save();rrect(-w/2,-h,w,h,s*.1);ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-w/2,-h,w,h*.12);
  ctx.strokeStyle='rgba(27,26,31,.28)';ctx.lineWidth=2;for(let i=1;i<3;i++)line(-w/2,-h+h*i/3,w/2,-h+h*i/3);
  ctx.restore();
  ctx.strokeStyle=INK;ctx.lineWidth=2.5;rrect(-w/2+s*.08,-h+s*.08,w-s*.16,h-s*.16,s*.05);ctx.stroke();
  ctx.fillStyle=INK;[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([i,j])=>{circ(i*(w/2-s*.13),-h/2+j*(h/2-s*.13),s*.035);ctx.fill()});
  const ey=-h*.56,ex=w*.17,er=s*.085,m=o.mood||'idle',lk=o.look||0;
  ctx.lineWidth=Math.max(2,s*.04);ctx.strokeStyle=INK;ctx.lineCap='round';
  if(m==='strain'){[[-1],[1]].forEach(([i])=>{ctx.beginPath();ctx.moveTo(i*ex-er,ey-er*.8);ctx.lineTo(i*ex+er*.4*i,ey);ctx.lineTo(i*ex-er,ey+er*.8);ctx.stroke()});
    ctx.beginPath();ctx.moveTo(-w*.12,-h*.3);for(let i=0;i<=4;i++)ctx.lineTo(-w*.12+i*w*.06,-h*.3+(i%2?3:-3));ctx.stroke()}
  else if(m==='happy'){[-1,1].forEach(i=>{ctx.beginPath();ctx.arc(i*ex,ey+er*.4,er,Math.PI*1.1,Math.PI*1.9);ctx.stroke()});
    ink(()=>{ctx.beginPath();ctx.arc(0,-h*.34,s*.12,0,Math.PI);ctx.closePath()},RED,2,0)}
  else if(m==='shock'){[-1,1].forEach(i=>{ink(()=>circ(i*ex,ey,er*1.3),'#fff',2,0);circ(i*ex,ey,er*.35);ctx.fillStyle=INK;ctx.fill()});ink(()=>circ(0,-h*.28,s*.07),INK,0,0)}

}
function tagLocal(s,x,y,sz){const size=Math.max(10,sz*.15);ctx.font=font(size,true);const w=ctx.measureText(s).width+8,h=size*1.4;ink(()=>rrect(x-w/2,y-h/2,w,h,4),INK,0,0);txt(s,x,y+1,{size,col:YEL,disp:true});ctx.restore()}
function cloud(x,y,s,a=1){ctx.save();ctx.globalAlpha=a;const cs=[[0,0,1],[-.9,.2,.7],[.9,.25,.75],[-.4,-.45,.7],[.45,-.35,.65]];
  ctx.fillStyle='rgba(27,26,31,.18)';cs.forEach(([i,j,r])=>{circ(x+i*s+5,y+j*s+5,r*s);ctx.fill()});

const P=[],FL=[];let SHAKE=0,FLASH=0,FLC='#fff',SLOW=0,GLOW=0;
function emit(n,x,y,o={}){if(RM)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=o.ang!=null?o.ang+rnd(-(o.spread||.5),o.spread||.5):rnd(0,Math.PI*2),sp=rnd(o.v0||80,o.v1||380);
  P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(o.l0||.4,o.l1||1),t:0,type:o.type||'spark',col:o.cols?o.cols[i%o.cols.length]:(o.col||YEL),s:rnd(o.s0||3,o.s1||7),rot:rnd(0,6),vr:rnd(-8,8),g:o.g??500})}}
function floatT(s,x,y,col=YEL,size=34){FL.push({s,x,y,col,size,t:0})}

function flash(c,a){FLC=c;FLASH=RM?a*.3:a}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function stepFX(dt){
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt;if(p.t>p.life){P.splice(i,1);continue}
    if(p.type==='bubble'){p.vy-=200*dt;p.vx*=.96;p.x+=Math.sin(p.t*9)*.6}else p.vy+=p.g*dt;
    if(p.type==='conf'){p.vx*=.98;p.vy=Math.min(p.vy,170)}if(p.type==='dust'){p.vx*=.92;p.vy*=.92}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}
  for(let i=FL.length-1;i>=0;i--){FL[i].t+=dt;if(FL[i].t>1.1)FL.splice(i,1)}
  SHAKE*=Math.pow(.004,dt);if(SHAKE<.3)SHAKE=0;FLASH=Math.max(0,FLASH-dt*2.6);
}
function drawFX(){
  P.forEach(p=>{const k=1-p.t/p.life;ctx.globalAlpha=Math.min(1,k*1.5);
    if(p.type==='spark'){ctx.strokeStyle=p.col;ctx.lineWidth=p.s*.6;ctx.lineCap='round';line(p.x,p.y,p.x-p.vx*.03,p.y-p.vy*.03);ctx.lineCap='butt'}
    else if(p.type==='conf'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.fillRect(-p.s,-p.s*.5,p.s*2,p.s);ctx.strokeStyle=INK;ctx.lineWidth=1.2;ctx.strokeRect(-p.s,-p.s*.5,p.s*2,p.s);ctx.restore()}
    else if(p.type==='star'){star(p.x,p.y,p.s*1.6,p.col,p.rot)}
    else if(p.type==='dust'){ctx.fillStyle=p.col;circ(p.x,p.y,p.s*(1.6-k));ctx.fill()}
    else if(p.type==='bubble'){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;circ(p.x,p.y,p.s);ctx.stroke()}
    else if(p.type==='drop'){ctx.fillStyle=p.col;circ(p.x,p.y,p.s);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.stroke()}
    else if(p.type==='ring'){ctx.strokeStyle=p.col;ctx.lineWidth=6*k;circ(p.x,p.y,(1-k)*p.s*30);ctx.stroke()}
  });ctx.globalAlpha=1;
  FL.forEach(f=>{const k=f.t/1.1,sc=k<.15?1+(.15-k)*5:1;ctx.globalAlpha=k>.7?(1-k)/.3:1;ctx.save();ctx.translate(f.x,f.y-k*70);ctx.scale(sc,sc);txt(f.s,0,0,{size:f.size,disp:true,col:f.col,stroke:7});ctx.restore()});ctx.globalAlpha=1;
}

function coachPos(s,which){const q=which==='to'?s.to:s.at;if(typeof q==='string'){const el=$(q);if(!el)return null;const b=el.getBoundingClientRect();return{x:b.left+b.width/2,y:b.top+b.height/2}}return q?q():null}

}

/* ---------- A1 ギリギリ引き（静止摩擦力・最大摩擦力 F0=μN） ---------- */
function mkA1(p){
  const N=p.m?Math.round(p.m*g*10)/10:p.W+(p.load||0),F0=Math.round(p.mu*N*10)/10,MAX=30;
  const S={F:0,Fr:0,hold:false,ht:0,st:'in',x:0,v:0,tt:0,show:p.practice===1};
  const giv=p.m?[['質量',`${p.m.toFixed(1)} kg`],['静止摩擦係数 μ',p.mu.toFixed(2)],['g','9.8 m/s²']]:[['重さ',`${p.W} N`],...(p.load?[['上の荷物',`${p.load} N`]]:[]),['静止摩擦係数 μ',p.mu.toFixed(2)]];
  const nTxt=p.m?`N = mg = ${p.m.toFixed(1)}×9.8 = ${f1(N)} N`:p.load?`N = ${p.W} + ${p.load} = ${N} N（上の荷物の重さも押している）`:`N = ${N} N（鉛直方向のつりあい）`;
  let G={};

    expl:`${nTxt}<br>F<sub>0</sub> = μN = ${p.mu.toFixed(2)} × ${f1(N)} = <b>${f1(F0)} N</b>。止まっている間は 静止摩擦力 = 引く力（つりあい）`,
    dock:[{id:'pull',label:'ひっぱる',sub:'長おし',hold:1,cls:'org'},{id:'ok',label:'決定！',main:1}],
    btn(id,ev){if(S.st!=='in')return;
      if(id==='pull'){S.hold=ev==='down';if(ev==='down')S.ht=0}
      if(id==='ok'&&ev==='tap'){if(p.practice===2){cheer('すべるまで ひっぱろう！',W/2,H*.35);return}if(S.F<=0){cheer('まず 長おしで ひっぱろう',W/2,H*.35);return}S.st='done';
        const diff=F0-S.F,gr=diff<=Math.max(.1,F0*.02)+1e-9?'P':diff<=F0*.06?'G':diff<=F0*.2?'Go':'M';S.reveal=1;
        done({grade:gr,x:G.cx,y:G.fy-G.cs,head:gr==='P'?'ギリギリ!!':undefined,msg:gr==='M'?`まだ ${f1(diff)} N も余裕があった！`:diff<.05?`引く力 ${f1(S.F)} N ＝ 最大摩擦力。まさに すべりだす直前！`:`引く力 ${f1(S.F)} N（あと ${f1(diff)} N ですべりだす所だった）`})}},
    update(dt){
      if(S.st==='in'&&S.hold){S.ht+=dt;const rate=.6+S.ht*S.ht*2.6,b=S.F;S.Fr+=rate*dt;S.F=Math.floor(S.Fr*10+1e-6)/10;

/* ---------- B2f 深さから圧力を求める（問43の向き） ---------- */

    ask:`カプセルが水深 **${p.h} m** までもぐる。そこでの圧力 p′ を **上下ドラッグ**（圧力計の針が動く）で予想して **決定**！`,
    expl:`p′ = p₀ + ρhg = 1.0×10<sup>5</sup> + 1.0×10<sup>3</sup>×${p.h}×9.8 = 1.0×10<sup>5</sup> + ${sci(rho*g*p.h,2)} = <b>${sci(tru,2)} Pa</b>`,

  r.coach=()=>[{at:()=>({x:R.x+R.w*.5,y:R.y+R.h*.6}),to:()=>({x:R.x+R.w*.5,y:R.y+R.h*.6-110}),g:'drag',text:'**上へドラッグ** で 圧力計（右上）の針が上がる。下へで下がる',until:()=>S.moved&&!S.drag},{at:'d-go',g:'tap',text:'**決定！**',until:()=>S.st!=='in'}];

 {q:'真空中で、質量のちがう2つの物体を同じ高さから同時に落とすと？',a:['同時に落ちる','重いほうが先に落ちる','軽いほうが先に落ちる','どちらも落ちない'],ex:'空気の抵抗がなければ、質量にかかわらず自由落下する'},
 {q:'空気の抵抗を受けて落ちる物体が 終端速度に達したあとの 加速度の大きさは？',a:['0','g','g / 2','だんだん大きくなる'],ex:'抵抗力と重力がつりあう → 合力 0 → 加速度 0'},
];
/* 図鑑・Quizが無いので、まぐれ判定の「理屈チェック」には確認テストの問題を渡す */
function tkRiddleQ(){const q=QB[Math.floor(Math.random()*QB.length)];return {q:q.q,choices:q.a,ex:q.ex||''}}
const T={};
function startTest(){window.Tekitou&&Tekitou.startTest();setMode('test');T.qs=shuffle(QB).slice(0,10).map(q=>({...q,shown:shuffle(q.a)}));T.i=0;T.ans=[];showQ()}
function showQ(){const q=T.qs[T.i];if(!q)return testEnd();
  $('tq').innerHTML=`<div class="qh"><span class="chip z3">確認テスト</span><span class="qn">第 ${T.i+1} 問 ／ ${T.qs.length}</span></div><div class="qt">${q.q}</div><div class="ch">${q.shown.map((o,i)=>`<button class="btn" data-i="${i}">${o}</button>`).join('')}</div><div id="tex"></div>`;
  $('test').scrollTop=0;
  document.querySelectorAll('#tq .ch .btn').forEach(b=>b.onclick=()=>{if(T.lock)return;T.lock=1;AU.init();const o=q.shown[+b.dataset.i],ok=o===q.a[0];T.ans.push({q,y:o,ok});
    window.Tekitou&&Tekitou.answer(ok,{q:{id:'hk'+T.i,q:q.q,ex:q.ex}});
    document.querySelectorAll('#tq .ch .btn').forEach(x=>{const v=q.shown[+x.dataset.i];if(v===q.a[0])x.classList.add('ok');else if(x===b)x.classList.add('ng')});
    if(ok){AU.hit('G',T.ans.filter(a=>a.ok).length);const r=b.getBoundingClientRect();emit(30,r.left+r.width/2,r.top,{type:'star',cols:[YEL,ORG,'#fff'],v0:100,v1:300,g:300})}else AU.miss();
    $('tex').innerHTML=`<div class="ex">${ok?'⭕ 正解！':'❌ 正解は「'+q.a[0]+'」'}　${q.ex}</div><div class="row" style="display:flex;justify-content:center;margin-top:10px"><button class="btn org" id="tNx">${T.i+1>=T.qs.length?'結果へ ▶':'つぎへ ▶'}</button></div>`;
    $('tNx').onclick=()=>{AU.tap();T.lock=0;T.i++;showQ()}})}
function testEnd(){const marks=T.ans.map(a=>a.ok),score=marks.filter(Boolean).length,tOnly=window.GAME_MODE==='test';
  SV.testBest=Math.max(SV.testBest??0,score);save();AU.fanfare();
  const tot=Object.values(SV.stars).reduce((a,b)=>a+b,0);
  $('tq').innerHTML=`<div class="clr"><div class="big ol">確認テスト おわり！</div><div class="sc">${score} / ${T.qs.length} 点</div>
    <div class="row" style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn org" id="tCard">📝 提出カード</button><button class="btn wht" id="tRe">🔁 もう一度テスト</button><button class="btn wht" id="tMap">🗺 ルートへ</button></div></div>`;
  $('tCard').onclick=()=>SubmitCard.reopen(T.card);$('tRe').onclick=()=>startTest();$('tMap').onclick=()=>showMap();
  T.card=SubmitCard.show({gameId:'hako-kyubin',grade:'butsuki',unit:'物理基礎　1編2章　4 摩擦を受ける運動／5 液体や気体から受ける力',
    game:'ズザッ！プカッ！ハコ急便 ～摩擦と流体の力～'+(tOnly?'（確認テストのみ）':''),name:window.PLAYER_NAME||SV.name||'',score,total:T.qs.length,marks,
    records:tOnly?[['モード','確認テストだけ']]:[['★',`${tot} / ${STG.length*3}`],['ステッカー',`${Object.keys(SV.stk).length} / ${STG.length}`],['キラ',`${Object.values(SV.stk).filter(v=>v==='holo').length} 枚`]],
    review:T.ans.map(a=>({q:a.q.q,a:a.q.a[0],y:a.y,ok:a.ok}))})}

/* =====================================================================
   起動
   ===================================================================== */
resize();sndLabel();
window.Tekitou&&Tekitou.setup({onPenalty:function(kind,n){RUN.score=Math.max(0,RUN.score-n*16)},penaltyLabel:'スコア ダウン'});
if(window.PLAYER_NAME){SV.name=String(window.PLAYER_NAME).slice(0,16);$('tName').value=SV.name}
if(window.GAME_MODE==='test')startTest();else showTitle();
requestAnimationFrame(loop);
</script>

/* プレイ回数を数える（公開サイトのゲームにだけ build_site.py が入れる）
   送るのはゲームIDだけ。同じタブで開き直しても1回しか数えない。届かなくてもゲームには何も起きない */
(function(){
  var C=window.ZUKAN_COUNTER;if(!C||!C.db||!C.id||!/^[a-z0-9-]{2,40}$/.test(C.id))return;
  var k='zukan-played:'+C.id;
  try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
  try{fetch(C.db+'/plays/'+C.id+'.json',{method:'PUT',body:JSON.stringify({'.sv':{increment:1}}),keepalive:true})['catch'](function(){})}catch(e){}
})();
</script>
