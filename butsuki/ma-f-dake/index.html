<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ma＝F岳 登頂RTA ～運動方程式の立て方～</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd84a;--c:#6fd3ff;--r:#ff6b6b;--g:#7dff8a;--gray:#888}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff}
body{font-family:'DotGothic16','Hiragino Kaku Gothic ProN',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;touch-action:manipulation}
.hidden{display:none!important}
.screen{width:min(96vw,820px);padding:24px 8px;text-align:center}
h1{font-size:clamp(30px,6.5vw,54px);margin:8px 0;color:var(--y);letter-spacing:.04em;text-shadow:4px 4px 0 #a33}
h2{font-size:26px;margin:6px 0;color:var(--y)}
.sub{font-size:18px;margin-bottom:14px;color:#ccc}
.story{white-space:pre-wrap;text-align:left;display:inline-block;font-size:17px;line-height:1.8;border:4px double #fff;padding:14px 18px;max-width:100%}
.btn{background:#000;color:#fff;border:3px solid #fff;padding:10px 18px;margin:6px;font-size:20px;cursor:pointer;border-radius:4px}
.btn:active{background:#fff;color:#000}
.btn.big{font-size:24px;padding:12px 26px}
.btn.y{border-color:var(--y);color:var(--y)}
.btn.c{border-color:var(--c);color:var(--c)}
.y{color:var(--y)}.c{color:var(--c)}.r{color:var(--r)}.g{color:var(--g)}.gray{color:var(--gray)}

/* ゲーム画面 */
#game{width:min(98vw,820px);padding:6px 4px 30px}
#hud{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:17px;padding:4px 2px}
#hTime{font-size:24px;color:var(--y);min-width:110px;text-align:right}
#hGear span{display:inline-block;width:26px;text-align:center}
#hGear .no{opacity:.25;filter:grayscale(1)}
#mt{position:relative;height:150px;border:3px solid #fff;background:linear-gradient(#0b1b3a,#1c3561);overflow:hidden}
#mt svg{position:absolute;inset:0;width:100%;height:100%}
#climber{position:absolute;font-size:28px;transform:translate(-50%,-85%);transition:left 1.2s steps(8),top 1.2s steps(8);z-index:3}
.node{position:absolute;transform:translate(-50%,-50%);font-size:15px;z-index:2;text-align:center;line-height:1}
.node small{display:block;font-size:10px;color:#fff;margin-top:2px;white-space:nowrap;background:rgba(0,0,0,.55);padding:0 3px}
#penFx{position:absolute;right:8px;top:6px;font-size:26px;color:var(--r);opacity:0;transition:opacity .2s;z-index:4}
#card{border:4px double #fff;margin-top:8px;padding:10px 12px}
#stTitle{color:var(--y);font-size:19px;margin-bottom:4px}
#prob{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
#story{flex:1 1 300px;font-size:17px;line-height:1.75}
#diag{flex:0 1 330px;margin:0 auto}
#diag svg{width:100%;height:auto;display:block}
#eqs{margin-top:6px;font-size:18px;color:var(--g);line-height:1.6}
#stepbox{border:4px double #fff;margin-top:8px;padding:10px 12px;min-height:200px}
#stepNo{font-size:14px;color:var(--gray)}
#q{font-size:20px;line-height:1.6;margin:4px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{flex:1 1 45%;text-align:left;background:#000;color:#fff;border:2px solid #fff;padding:10px 12px;font-size:18px;cursor:pointer;border-radius:3px;line-height:1.4}
.opt.on{background:var(--y);color:#000;border-color:var(--y)}
.opt:disabled{opacity:.35}
.opt.okk{background:var(--g);color:#000;border-color:var(--g);opacity:1}
.opt.ngg{border-color:var(--r);color:var(--r);opacity:1}
.eq{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:58px;border:2px dashed var(--c);padding:6px;font-size:22px;margin-bottom:8px}
.eq .slot{min-width:70px;min-height:42px;border:2px dotted #666;display:flex;align-items:center;justify-content:center;padding:0 6px;color:var(--gray);font-size:15px}
.eq .rhs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;flex:1;min-height:42px}
.tile{background:#15233d;color:#fff;border:2px solid var(--c);padding:8px 12px;font-size:21px;cursor:pointer;border-radius:4px;min-width:48px}
.tile.s{border-color:var(--y);color:var(--y);min-width:52px;font-size:24px;padding:4px 12px}
.tile.l{border-color:#c9a0ff;background:#231538}
.tile.used{opacity:.2;pointer-events:none}
.lab{font-size:13px;color:var(--gray);margin:6px 0 2px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.ctrl{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.ctrl .btn{margin:0}
#fb{margin-top:10px;font-size:18px;line-height:1.6;min-height:1em}
.calc{font-size:22px;line-height:1.8;border:2px solid var(--g);padding:10px 14px;display:inline-block}
.stars{font-size:14px;color:var(--gray)}

/* オーバーレイ */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#ovBox{background:#000;border:4px double #fff;max-width:620px;width:100%;padding:18px;text-align:center;font-size:19px;line-height:1.7;max-height:92vh;overflow:auto}
#ovBox .emo{font-size:52px}

table{border-collapse:collapse;margin:10px auto;font-size:16px;text-align:left;max-width:760px}
td{border:1px solid #666;padding:6px 8px;vertical-align:top}
input{font:inherit;font-size:18px;padding:4px 8px;background:#000;color:#fff;border:2px solid #fff}
.qbox{border:4px double #fff;padding:12px 14px;text-align:left;margin-top:10px}
.spell{font-size:24px;letter-spacing:.12em;color:var(--y);border:2px dashed var(--y);display:inline-block;padding:4px 12px;margin-top:4px}
.titles span{display:inline-block;border:2px solid var(--y);color:var(--y);padding:2px 10px;margin:3px;font-size:16px}
</style>
<script>/*@GUARD_BEGIN*/
/* ==========================================================
   適当プレイ番（全ゲーム共通） v2  ─ Tekitou
   ─ 2026-10-01 オーナー指示「適当に操作（連打とか、スキップとか）するとマイナスになる仕組み。
     ゲームクリアが目的にならない仕組みが必要」を、全ゲームにまとめて入れるための部品
   ─ v2（同日）: オーナー「黒板クエストの防止策がなかなか良かった」→ 黒板クエスト（shotoku-sansu-quest）の作りにそろえた
       ・1回目から罰（注意だけの猶予はなし）。本編の罰は回数で重くなる（かけら 5→10→15→20）
       ・罰のときは「ポキッ！」の札が出て2.6秒 操作できない。なぜダメかを一言で言う
       ・解説はカラオケ読み（文字が読む速さで光る）。光り終わるまで「つぎへ」が押せない。押せないうちに4回押すと とばし読み
       ・罰が1回でもあった確認テストは、提出カードに「ひび入り」と出る（罰なしは「本物」）
   ─ v3（同日）: オーナー「化学反応式の係数合わせとか、適当に連打してたまたま一致」「理屈分かってないけど適当にやってクリアしちゃう奴ら多数」
       「ゲームクリアが目的にならない仕組みを維持しつつ、やりたくなる・ドーパミンが出る・ギリギリ待たせないライン」
       ・まぐれ判定：パズルの手数が必要な数よりずっと多く、しかも速い手で正解にたどり着いたら「まぐれ」
       ・理屈チェック：まぐれ／罰のあとの本編クリアのときだけ、この回の問題を1問。考えて正解なら「本物！」、外したら解説をカラオケ読み＋かけら −10
         （ふつうに遊んだ子は止めない＝待たせない）
       ・ごほうび：考えてから正解すると金の「本物 ×n」が弾む。罰なしのテストは提出カードに金の「本物」
       ・カラオケ読みは まちがい 9字/秒・正解 14字/秒・最長15秒（読ませるけど、待たせすぎない）
   ─ 読み込むだけで次のことをする（ゲーム側の追加作業なし）
       ・確認テスト（Quiz.test 〜 SubmitCard.show の間）
           問題が出て2.5秒以内のまちがい …「あてずっぽう」テストの点 −1
           連打（1秒に7回）               …「れんだ」テストの点 −1
           前の答えから2秒以内に次を答える …「とばし読み」2回で −1
           → 提出カードの点から引き、カードに理由と「ひび入り」を書く（合格の判定も引いたあとの点で行う）
       ・ゲームの本編
           ボタンの連打（1秒に7回・canvas は数えない） … かけら −5×回数（次にもらうかけらから引く）
   ─ ゲーム側で使える呼び出し（なくても動く）
       Tekitou.setup({mash:false})          … 連打そのものが遊びのゲームは本編の連打判定を切る
       Tekitou.setup({onPenalty:fn, penaltyLabel:'スコア −50'}) … 図鑑を持たないゲーム：本編の罰をゲームの点で払う
       data-mash-ok（属性）                  … その要素の中の連打は数えない
       Tekitou.shown()                      … 本編で問題を出した瞬間（あてずっぽうの計測の起点）
       Tekitou.answer(ok,{q})               … 本編・テストで○×が決まったとき（Quiz.check を使わないゲーム用）
       Tekitou.gate(button,{text,ok,el})    … 解説をカラオケ読みさせ、読み終わるまでそのボタンを押せなくする
       Tekitou.move()                       … パズルの1手（係数の＋/−・並べかえ・つまみ）ごとに呼ぶ
       Tekitou.solved({min, q, onResult, defer}) … パズルが正解の形になった瞬間。min＝正解に最低いる手数（わからなければ省略）
                                              defer:true＝アクションの最中なので止めず、まぐれは本編クリアのときの理屈チェックへ回す
                                              まぐれなら理屈チェックを出し、onResult(本物か) を呼ぶ。戻り値＝まぐれだったか
       Tekitou.check({q}).then(ok=>…)       … 理屈チェックを1問だけ出す（q 省略でこの回の問題から）
       Tekitou.stats()                      … 今の回数
   ─ このファイルは build / sync_one.py が各ゲームの ZUKAN（または GUARD）の印の間へ同期する（ゲーム側で直接いじらない）
   ─ 外への送信はしない。保存はこの端末の localStorage（rika-tekitou:v1）だけ
   ========================================================== */
(function(){
  if (window.Tekitou) return;

  var CFG = {
    mash:true,
    mashN:7,  mashMs:1000,        /* この時間にこの回数たたいたら連打（黒板クエストと同じ 1秒に7回） */
    guessMs:2500,                 /* 問題が出てからこれより早いまちがい＝あてずっぽう */
    burstN:3, burstMs:2500,       /* 本編：この時間にこの回数まちがえたら あてずっぽう（黒板クエストと同じ） */
    skipMs:2000,                  /* テスト：前の答えからこれより早い答え＝とばし読み */
    lockMs:2600,                  /* 罰のあと操作できない時間（黒板クエストと同じ） */
    debtMash:5, debtGuess:5, debtMax:20, /* 本編の罰（かけら）。回数×この量、上限あり */
    readCps:9,                    /* カラオケ読みの速さ（字/秒）。中学生の黙読の遅い側 */
    readCpsOk:14,                 /* 正解したときの解説は速く（待たせすぎない） */
    readMax:15000,
    luckyGapMs:800,               /* まぐれ判定：手と手の間がこれより短い（考えていない） */
    debtLucky:10,                 /* 理屈チェックを外したときの罰（かけら） */
    onPenalty:null,               /* 本編の罰をゲーム自身の点で払う： function(kind, n){…}（kind=mash/guess/skip・n=かけら換算の量） */
    penaltyLabel:''               /* そのとき札に出す文字（例：'スコア −50'） */
  };
  var Z_PEN = 2147482950, Z_NOTE = 2147482900; /* Guide(…600)の上・提出カード(…3000)の下 */
  var KEY = 'rika-tekitou:v1';

  var S = {
    inTest:false, t0:0, lastAt:0, seen:{}, inReview:false, told:false,
    test:{guess:0, mash:0, skip:0, n:0},
    game:{mash:0, guess:0, wrongs:[], shownAt:0, lastAt:0, k:0, lucky:0, sus:0, streak:0},
    moves:[],
    debt:0
  };
  var clicks = [], taps = [], lockUntil = 0, gates = [];

  /* ---------------- 小道具 ---------------- */
  function now(){ return Date.now(); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
  function strip(s){ return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,''); }
  function storeKey(){
    var k = '';
    try{ if(window.Zukan && Zukan._cur && Zukan._cur.koma && Zukan._cur.koma[0]) k = Zukan._cur.koma[0]; }catch(e){}
    return k || (location.pathname + '|' + document.title);
  }
  function load(){
    try{
      var all = JSON.parse(localStorage.getItem(KEY)) || {}, o = all[storeKey()];
      if(o){ S.debt = o.d|0; S.game.mash = o.m|0; S.game.guess = o.g|0; }
    }catch(e){}
  }
  function save(){
    try{
      var all = JSON.parse(localStorage.getItem(KEY)) || {};
      all[storeKey()] = {d:S.debt, m:S.game.mash, g:S.game.guess, at:now()};
      localStorage.setItem(KEY, JSON.stringify(all));
    }catch(e){}
  }
  var loaded = false;
  function ensureLoaded(){ if(!loaded){ loaded = true; load(); } }
  function emit(kind, extra){
    try{ window.dispatchEvent(new CustomEvent('tekitou', {detail:Object.assign({kind:kind, test:S.inTest}, extra||{})})); }catch(e){}
  }

  /* ---------------- 見た目 ---------------- */
  var FONT = '"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans",sans-serif';
  var CSS = [
    /* ポキッ！の札（黒板クエストの .pen と同じ考え方：画面全体をおおって操作を止める） */
    '.tk-pen{position:fixed;inset:0;z-index:'+Z_PEN+';display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(40,8,8,.6);',
    ' pointer-events:all;touch-action:none;cursor:not-allowed;font-family:'+FONT+';overflow:hidden;animation:tkFade var(--tk-ms,2.6s) ease forwards}',
    '.tk-pen .t0{font-size:clamp(15px,3vmin,20px);font-weight:900;color:#ffd6d6;letter-spacing:.2em;margin-bottom:6px}',
    '.tk-pen .t1{font-size:clamp(38px,9vmin,72px);font-weight:900;color:#ff4b4b;letter-spacing:.04em;text-shadow:0 4px 0 #3a0909,0 0 24px rgba(255,80,80,.6);animation:tkDrop .5s cubic-bezier(.2,1.6,.4,1) both}',
    '.tk-pen .t2{font-size:clamp(16px,3vmin,21px);font-weight:700;color:#fff;margin-top:10px;text-align:center;padding:0 22px;line-height:1.65;max-width:640px}',
    '.tk-pen .t2 em{font-style:normal;color:#ffd54a}',
    '.tk-pen .chalk{position:absolute;top:22%;left:50%;width:min(46vw,300px);height:18px;margin-left:min(-23vw,-150px);display:flex;gap:6px;transform:rotate(-12deg)}',
    '.tk-pen .chalk i{flex:1;background:#f4f1e8;border-radius:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}',
    '.tk-pen .chalk i:first-child{animation:tkSnapL .5s ease-out forwards}.tk-pen .chalk i:last-child{animation:tkSnapR .5s ease-out forwards}',
    '.tk-pen .bar{position:absolute;left:0;bottom:0;height:7px;width:100%;background:#ff4b4b;transform-origin:left;animation:tkBar var(--tk-ms,2.6s) linear forwards}',
    '@keyframes tkDrop{0%{opacity:0;transform:translateY(-40px) scale(1.6)}100%{opacity:1;transform:none}}',
    '@keyframes tkSnapL{to{transform:translate(-14px,10px) rotate(-18deg)}}@keyframes tkSnapR{to{transform:translate(16px,18px) rotate(24deg)}}',
    '@keyframes tkBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}',
    '@keyframes tkFade{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}',
    '@keyframes tkShake{0%,100%{transform:none}20%{transform:translate(-8px,2px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-1px)}}',
    /* 下に出る短いお知らせ */
    '.tk-note{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:'+Z_NOTE+';pointer-events:none;',
    ' font-family:'+FONT+';font-weight:700;font-size:clamp(13px,2.4vmin,16px);line-height:1.6;',
    ' background:rgba(20,24,40,.94);color:#fff;border-radius:14px;padding:10px 16px;max-width:min(92vw,600px);text-align:left;',
    ' box-shadow:0 8px 24px rgba(0,0,0,.35);animation:tkNote var(--tk-ms,3.4s) ease forwards}',
    '.tk-note em{font-style:normal;color:#ffd54a}.tk-note b{color:#ff8a8a}',
    '@keyframes tkNote{0%{opacity:0;transform:translate(-50%,12px)}6%{opacity:1;transform:translate(-50%,0)}90%{opacity:1}100%{opacity:0}}',
    /* カラオケ読み：まだ読んでいない字はうすく、今の字は光り、読んだ字は元の色 */
    '.tk-kara .tk-kc{opacity:.3;transition:opacity .25s,text-shadow .4s}',
    '.tk-kara .tk-kc.now{opacity:1;text-shadow:0 0 10px #ffd54a,0 0 2px currentColor}',
    '.tk-kara .tk-kc.lit{opacity:1}',
    /* 読み終わるまで押せない「つぎへ」 */
    '.tk-gated{position:relative;filter:saturate(.3) brightness(.92);cursor:wait!important}',
    '.tk-gated::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;background:currentColor;opacity:.75;transform-origin:left;border-radius:2px;animation:tkBar var(--tk-ms,3s) linear forwards;pointer-events:none}',
    '.tk-ready{animation:tkPulse 1s ease-in-out 2}',
    '@keyframes tkPulse{50%{transform:scale(1.06)}}',
    /* 本物 ×n（ごほうび） */
    '.tk-real{position:fixed;z-index:'+Z_NOTE+';transform:translate(-50%,-50%);pointer-events:none;font-family:'+FONT+';font-weight:900;font-size:clamp(17px,3.4vmin,24px);color:#fff6cf;',
    ' background:linear-gradient(135deg,#f3c34a,#c8862a);border:2px solid #fff3c4;border-radius:999px;padding:4px 14px;box-shadow:0 6px 18px rgba(200,134,42,.55),0 0 22px rgba(255,214,100,.6);',
    ' text-shadow:0 1px 0 #8a5a12;white-space:nowrap;animation:tkReal 1.3s cubic-bezier(.2,1.5,.4,1) forwards}',
    '.tk-real b{font-size:1.15em}.tk-real small{display:block;font-size:.62em;text-align:center}',
    '.tk-real.big{font-size:clamp(22px,4.6vmin,32px)}',
    '@keyframes tkReal{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}18%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-62%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}',
    /* 理屈チェック */
    '.tk-chk{position:fixed;inset:0;z-index:'+(Z_PEN+10)+';display:flex;align-items:center;justify-content:center;background:rgba(12,16,32,.72);padding:3vmin;font-family:'+FONT+'}',
    '.tk-chk .tk-card{width:min(94vw,620px);max-height:92vh;overflow:auto;background:#fffdf6;color:#1d2433;border-radius:20px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:4px solid #f3c34a;animation:tkDrop .45s cubic-bezier(.2,1.6,.4,1) both}',
    '.tk-chk .tk-h{font-weight:900;font-size:clamp(20px,3.6vmin,26px);color:#b06a10;display:flex;align-items:center;gap:10px;flex-wrap:wrap}',
    '.tk-chk .tk-h span{font-size:.62em;background:#d8232a;color:#fff;border-radius:999px;padding:2px 10px}',
    '.tk-chk .tk-sub{margin:6px 0 10px;font-size:clamp(13px,2.2vmin,15px);color:#5a6178;line-height:1.6}',
    '.tk-chk .tk-q{font-weight:800;font-size:clamp(16px,2.8vmin,20px);line-height:1.6;margin:0 0 12px}',
    '.tk-chk .tk-ch{display:grid;gap:8px}',
    '.tk-chk .tk-ch button,.tk-chk .tk-next{font:inherit;font-weight:800;font-size:clamp(15px,2.5vmin,18px);text-align:left;padding:11px 14px;border-radius:12px;border:2px solid #c9cfdd;background:#fff;color:#1d2433;cursor:pointer}',
    '.tk-chk .tk-ch button.ok{border-color:#2e9e57;background:#e2f5e6}.tk-chk .tk-ch button.ng{border-color:#d8232a;background:#fde3e4}',
    '.tk-chk .tk-ex{margin-top:12px;line-height:1.7;font-size:clamp(14px,2.4vmin,17px)}',
    '.tk-chk .tk-ex b{color:#d8232a}.tk-chk .tk-big{font-size:clamp(30px,6vmin,46px);font-weight:900;color:#c8862a;text-align:center;animation:tkDrop .5s cubic-bezier(.2,1.6,.4,1) both}',
    '.tk-chk .tk-next{margin-top:12px;width:100%;text-align:center;background:#1d2433;color:#fff;border-color:#1d2433}',
    '@media (prefers-reduced-motion:reduce){.tk-pen,.tk-pen *,.tk-note,.tk-ready,.tk-real,.tk-chk *{animation-duration:.01ms!important;animation-iteration-count:1!important}.tk-pen .bar{animation:none}}'
  ].join('\n');
  function ensureCSS(){
    if(document.getElementById('tk-style') || !document.head) return;
    var st = document.createElement('style'); st.id = 'tk-style'; st.textContent = CSS; document.head.appendChild(st);
  }
  function note(html, ms){
    ensureCSS(); if(!document.body) return;
    var old = document.querySelectorAll('.tk-note'); for(var i=0;i<old.length;i++) old[i].remove();
    var d = document.createElement('div'); d.className = 'tk-note'; d.style.setProperty('--tk-ms', ((ms||3400)/1000) + 's');
    d.innerHTML = html; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, ms || 3400);
  }
  var WHY = {
    mash:'れんだ しても 理科は 身につかない',
    guess:'当てずっぽうは 考えたことに ならない',
    skip:'解説を とばすと 同じところで また まちがえる'
  };
  var NAME = {mash:'れんだ', guess:'あてずっぽう', skip:'とばし読み'};
  /* 罰の札：画面全体をおおって lockMs のあいだ操作を止める */
  function pen(kind, cost, extra){
    ensureCSS(); if(!document.body) return;
    var ms = CFG.lockMs;
    lockUntil = Math.max(lockUntil, now() + ms);
    var old = document.querySelectorAll('.tk-pen'); for(var i=0;i<old.length;i++) old[i].remove();
    var d = document.createElement('div'); d.className = 'tk-pen'; d.style.setProperty('--tk-ms', (ms/1000) + 's');
    d.setAttribute('role', 'alert');
    d.innerHTML = '<div class="chalk"><i></i><i></i></div>' +
      '<div class="t0">' + esc(NAME[kind] || '') + '</div>' +
      '<div class="t1">ポキッ！ ' + esc(cost) + '</div>' +
      '<div class="t2">' + esc(WHY[kind] || '') + (extra ? '<br>' + extra : '') + '</div><div class="bar"></div>';
    var kill = function(e){ e.preventDefault(); e.stopPropagation(); };
    ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click'].forEach(function(t){ d.addEventListener(t, kill, {passive:false}); });
    document.body.appendChild(d);
    setTimeout(function(){ d.remove(); }, ms);
    try{ if(navigator.vibrate) navigator.vibrate([60,40,120]); }catch(e){}
    try{ if(!matchMedia('(prefers-reduced-motion:reduce)').matches && document.body.animate) document.body.animate([{transform:'translate(-8px,2px)'},{transform:'translate(7px,-3px)'},{transform:'translate(-5px,3px)'},{transform:'none'}], {duration:320}); }catch(e){}
  }

  /* ---------------- 本編の罰の払い方 ----------------
     ゲームが onPenalty を渡していればゲーム自身の点で払う。なければ図鑑のかけら（次にもらう分から引く）。
     どちらも無いゲームでは、操作を止めるだけ（数字は出さない）。回数が増えるほど重くなる */
  function hasZukan(){ return !!(window.Zukan && Zukan.earn); }
  function gameCost(base){ S.game.k++; return Math.min(CFG.debtMax, base * S.game.k); }
  function costText(n){
    if(typeof CFG.onPenalty === 'function') return CFG.penaltyLabel || '−';
    if(hasZukan()) return 'かけら −' + n;
    return '';
  }
  function pay(kind, n){
    if(typeof CFG.onPenalty === 'function'){ try{ CFG.onPenalty(kind, n); }catch(e){} return; }
    if(hasZukan()) S.debt += n;
  }
  function gamePenalty(kind, base){
    ensureLoaded();
    if(kind === 'guess') S.game.guess++; else S.game.mash++;
    S.game.sus++; S.game.streak = 0;
    var n = gameCost(base);
    pay(kind, n); save();
    pen(kind, costText(n), hasZukan() && typeof CFG.onPenalty !== 'function' ? 'つぎに もらう かけらから 引かれるよ' : '');
    emit(kind, {cost:n});
  }
  function testPenalty(kind){
    S.test[kind]++;
    var extra = '確認テストの点 −1・提出カードが「ひび入り」になる';
    if(kind === 'skip'){
      if(S.test.skip % 2){ note('<b>とばし読み</b>　問題と解説、ちゃんと読んだ？ <em>あと1回で −1点</em>', 2400); emit('skip'); return; }
    }
    pen(kind, '−1点', extra);
    emit(kind);
  }

  /* ---------------- 連打 ---------------- */
  function excluded(t){
    return !t || !t.closest || !!t.closest('#sc-ov,.zk-ov,.tk-pen,.tk-chk .tk-ch,[data-mash-ok]');
  }
  function isButton(t){
    return !!t.closest('button,[role=button],a[href],input[type=button],input[type=submit],label,summary,.btn');
  }
  function onClick(e){
    var t = e.target, at = now();
    if(at < lockUntil){ e.preventDefault(); e.stopPropagation(); return; }
    if(excluded(t)) return;
    if(S.inTest && at - Math.max(S.lastAt, S.t0) > 180000) S.inTest = false; /* テストを途中でやめて本編へもどった */
    clicks.push(at); if(clicks.length > 8) clicks.shift();
    if(gateBlock(e)) return;
    if(t.closest('canvas')) return;
    if(!S.inTest && (!CFG.mash || !isButton(t))) return;
    taps.push(at);
    while(taps.length && at - taps[0] > CFG.mashMs) taps.shift();
    if(taps.length >= CFG.mashN){
      taps = []; e.preventDefault(); e.stopPropagation();
      if(S.inTest) testPenalty('mash'); else gamePenalty('mash', CFG.debtMash);
    }
  }

  /* ---------------- カラオケ読み ---------------- */
  function karaoke(el, cps){
    var chars = [];
    (function walk(node){
      var kids = [].slice.call(node.childNodes);
      for(var i=0;i<kids.length;i++){
        var c = kids[i];
        if(c.nodeType === 3){
          var txt = c.nodeValue; if(!txt) continue;
          var frag = document.createDocumentFragment();
          for(var j=0;j<txt.length;j++){
            var ch = txt.charAt(j), sp = document.createElement('span');
            sp.className = 'tk-kc'; sp.textContent = ch; frag.appendChild(sp);
            var ms = /\s/.test(ch) ? 30 : 1000 / cps;
            if(/[、，,]/.test(ch)) ms += 200; if(/[。！？!?]/.test(ch)) ms += 350;
            chars.push({sp:sp, ms:ms});
          }
          c.parentNode.replaceChild(frag, c);
        }else if(c.nodeType === 1 && !/^(SCRIPT|STYLE|SVG|svg|CANVAS|IMG|BUTTON|INPUT|TEXTAREA|SELECT)$/.test(c.tagName)){
          if(c.tagName === 'BR' && chars.length) chars[chars.length-1].ms += 220;
          walk(c);
        }
      }
    })(el);
    if(!chars.length) return null;
    el.classList.add('tk-kara');
    var total = 0; for(var k=0;k<chars.length;k++) total += chars[k].ms;
    var i = 0, timer = 0, stopped = false;
    function step(){
      if(stopped || !el.isConnected) return;
      if(i > 0) chars[i-1].sp.className = 'tk-kc lit';
      if(i >= chars.length) return;
      chars[i].sp.className = 'tk-kc now';
      var ms = chars[i].ms; i++;
      timer = setTimeout(step, ms);
    }
    step();
    return {total:total, stop:function(){ stopped = true; clearTimeout(timer); chars.forEach(function(c){ c.sp.className = 'tk-kc lit'; }); }};
  }
  /* 解説の文が入っている、いちばん小さい見えている要素を探す */
  function findTextEl(text){
    var key = strip(text); if(key.length < 6) return null;
    var head = key.slice(0, Math.min(16, key.length));
    var all = document.body.getElementsByTagName('*'), best = null, bestLen = 1e9;
    for(var i=0;i<all.length;i++){
      var e = all[i];
      if(/^(SCRIPT|STYLE|BUTTON|svg|SVG|HTML|BODY)$/.test(e.tagName) || e.closest('#sc-ov,.zk-ov,.tk-note,.tk-pen,svg')) continue;
      var t = strip(e.textContent);
      if(t.length >= bestLen || t.indexOf(head) < 0) continue;
      var r = e.getBoundingClientRect(); if(r.width < 4 || r.height < 4) continue;
      best = e; bestLen = t.length;
    }
    /* 見出し（「もう一歩」「正解：…」）ごと読ませるため、親が解説とほぼ同じ大きさなら親まで上がる */
    while(best && best.parentElement && best.parentElement !== document.body){
      var pl = strip(best.parentElement.textContent).length;
      if(pl > key.length * 1.6 + 40 || best.parentElement.querySelector('button,input,select,canvas')) break;
      best = best.parentElement;
    }
    return best;
  }

  /* ---------------- 解説の「つぎへ」を読み終わるまで止める ---------------- */
  var NEXT_RE = /^(▶|→|＞|>)?\s*(つぎ|次|NEXT|Next|next|答え合わせ|こたえあわせ|結果|けっか)/;
  function textOf(b){ return String(b.textContent || b.value || '').trim(); }
  function visible(el){
    if(!el || !el.isConnected || el.disabled) return false;
    var r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return false;
    var cs = getComputedStyle(el); return cs.visibility !== 'hidden' && cs.display !== 'none' && +cs.opacity > 0.05;
  }
  function nextButtons(){
    var out = [], bs = document.querySelectorAll('button,[role=button],input[type=button]');
    for(var i=0;i<bs.length;i++){ var b = bs[i]; if(excluded(b)) continue; if(NEXT_RE.test(textOf(b)) && visible(b)) out.push(b); }
    return out;
  }
  function gate(btn, opt){
    if(!btn) return;
    opt = opt || {};
    var ms = opt.ms, el = opt.el || null, kara = null;
    if(ms == null){
      if(!el && opt.text) el = findTextEl(opt.text);
      if(el) kara = karaoke(el, opt.ok ? CFG.readCpsOk : CFG.readCps);
      if(kara) ms = kara.total + 300;
      else { var n = strip(opt.text || '').length; ms = n ? n / (opt.ok ? CFG.readCpsOk : CFG.readCps) * 1000 : (opt.ok ? 700 : 1200); }
    }
    ms = Math.min(CFG.readMax, ms);
    if(ms <= 0) return;
    ensureCSS();
    var g = {b:btn, until:now() + ms, tries:0, kara:kara};
    gates.push(g);
    btn.classList.add('tk-gated'); btn.style.setProperty('--tk-ms', (ms/1000) + 's');

  }
  function ungate(g, ready){
    var i = gates.indexOf(g); if(i >= 0) gates.splice(i, 1);
    clearTimeout(g.timer);
    if(g.kara) g.kara.stop();
    if(g.b){ g.b.classList.remove('tk-gated'); if(ready && g.b.isConnected){ g.b.classList.add('tk-ready'); setTimeout(function(){ g.b.classList.remove('tk-ready'); }, 2100); } }
  }
  function gateBlock(e){
    if(!gates.length) return false;
    var t = e.target, at = now();
    for(var i=gates.length-1;i>=0;i--){
      var g = gates[i];
      if(!g.b.isConnected){ ungate(g); continue; }
      if(at >= g.until){ ungate(g, true); continue; }
      if(g.b === t || g.b.contains(t)){
        e.preventDefault(); e.stopPropagation();
        g.tries++;
        if(g.tries >= 4){
          g.tries = 0;
          if(S.inTest){ S.test.skip += 2; pen('skip', '−1点', '確認テストの点 −1・提出カードが「ひび入り」になる'); emit('skip'); }
          else gamePenalty('skip', CFG.debtMash);
        }else{
          note('📖 光る文字を 目で追って 読もう　<em>あと ' + Math.ceil((g.until - at) / 1000) + ' 秒</em>', 1500);
        }
        return true;
      }
    }
    return false;
  }

  /* ---------------- 確認テスト ---------------- */
  function startTest(){
    S.inTest = true; S.t0 = now(); S.lastAt = 0; S.seen = {};
    S.test = {guess:0, mash:0, skip:0, n:0};
    if(!S.told){
      S.told = true;
      setTimeout(function(){
        note('📝 <em>確認テストのルール</em><br>● 問題が出てすぐ（2.5秒以内）の<b>まちがい</b> → あてずっぽう <b>−1点</b><br>● <b>連打</b>（1秒に7回） → <b>−1点</b><br>● 解説を<b>とばす</b>（光り終わる前に何度も押す・すぐ次を答える） → <b>−1点</b><br>罰があると 提出カードが「<b>ひび入り</b>」になる。わからない問題は、考えてから答えよう。', 5600);
      }, 350);
    }
  }
  function prevClickBefore(at){
    /* 答えを決めたクリック（いまから0.4秒以内）の、ひとつ前のクリック＝「つぎへ」を押した時刻 */
    var i = clicks.length - 1;
    if(i >= 0 && at - clicks[i] < 400) i--;
    return i >= 0 ? clicks[i] : 0;
  }
  function onTestAnswer(q, ok){
    var key = q && (q.id || q.q) ? String(q.id || strip(q.q)) : '#' + S.test.n;
    if(S.seen[key]) return;
    S.seen[key] = 1;
    var at = now(), gap = at - (S.lastAt || S.t0);
    S.lastAt = at; S.test.n++;
    var think = gap;
    if(!q || q.t === 'choice' || q.t == null){ var p = prevClickBefore(at); if(p && p > (S.t0 - 50)) think = Math.min(gap, at - p); }
    if(!ok && think < CFG.guessMs) testPenalty('guess');
    else if(S.test.n > 1 && gap < CFG.skipMs) testPenalty('skip');
    else if(ok && think >= CFG.guessMs) praise();
    if(!ok) S.game.streak = 0;
    /* 解説をカラオケ読みさせ、新しく出た「つぎへ」を読み終わるまで止める */
    var ex = q ? (q.ex || q.exp || '') : '';
    var before = nextButtons();
    setTimeout(function(){
      var after = nextButtons(), fresh = [];
      for(var i=0;i<after.length;i++) if(before.indexOf(after[i]) < 0) fresh.push(after[i]);
      if(!fresh.length) return;
      var ms = null, el = ex ? findTextEl(ex) : null, kara = el ? karaoke(el, ok ? CFG.readCpsOk : CFG.readCps) : null;
      if(kara) ms = kara.total + 300;
      for(var j=0;j<fresh.length;j++) gate(fresh[j], ms != null ? {ms:ms} : ex ? {text:ex, ok:ok, el:null} : {ms: ok ? 700 : 1200});
      if(kara && fresh.length) gates[gates.length-1].kara = kara;
    }, Math.max(40, lockUntil - now() + 40)); /* ポキッ！の札が消えてから読み始める */
  }
  function penalty(){
    return S.test.guess + S.test.mash + Math.floor(S.test.skip / 2);
  }
  function fmtTime(ms){ var s = Math.round(ms/1000); return Math.floor(s/60) + '分' + String(s%60).padStart(2,'0') + '秒'; }

  /* ---------------- 本編の○×（ゲームが Tekitou.answer を呼んだとき） ---------------- */
  function onGameAnswer(ok){
    var at = now(), from = Math.max(S.game.shownAt || 0, S.game.lastAt || 0), think = from ? at - from : 1e9;
    S.game.lastAt = at;
    /* 子どもが押した（離した）直後に決まった正誤だけを数える。時間で自動に進む場面（流れてきた・ぶつかった）の正誤は数えない */
    var byHand = at - lastInputAt < 600;
    if(!byHand) { if(!ok) S.game.streak = 0; return; }
    if(ok) { S.game.wrongs = []; if(think >= CFG.guessMs) praise(); return; }
    S.game.streak = 0;
    S.game.wrongs.push(at);
    while(S.game.wrongs.length && at - S.game.wrongs[0] > CFG.burstMs) S.game.wrongs.shift();
    var fast = think < CFG.guessMs, burst = S.game.wrongs.length >= CFG.burstN;
    if(!(fast || burst)) return;
    S.game.wrongs = [];
    gamePenalty('guess', CFG.debtGuess);
  }

  /* ---------------- ごほうび：考えてから正解したら金の「本物 ×n」 ---------------- */
  function praise(){
    ensureCSS(); if(!document.body) return;
    S.game.streak++;
    var n = S.game.streak, d = document.createElement('div');
    var x = lastPt[0] || innerWidth / 2, y = lastPt[1] || innerHeight * .4;
    d.className = 'tk-real' + (n >= 5 ? ' big' : '');
    d.style.left = Math.max(70, Math.min(innerWidth - 70, x)) + 'px'; d.style.top = Math.max(40, y - 30) + 'px';
    d.innerHTML = '✨ 本物' + (n >= 2 ? ' <b>×' + n + '</b>' : '') + (n === 5 ? '<small>じっくり名人！</small>' : n === 10 ? '<small>理屈マスター！</small>' : '');
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1300);
  }
  var lastPt = [0, 0], lastInputAt = 0;
  window.addEventListener('pointerdown', function(e){ lastPt = [e.clientX, e.clientY]; lastInputAt = now(); }, true);
  ['pointerup','click','keydown'].forEach(function(t){ window.addEventListener(t, function(){ lastInputAt = now(); }, true); });

  /* ---------------- まぐれ判定（パズルの手） ---------------- */
  function median(a){ if(!a.length) return 1e9; var b = a.slice().sort(function(x,y){return x-y}); return b[b.length >> 1]; }
  function solved(o){
    o = o || {};
    var mv = S.moves.slice(), n = mv.length, gaps = [];
    for(var i=1;i<n;i++) gaps.push(mv[i] - mv[i-1]);
    S.moves = [];
    var min = +o.min || 0;
    var many = min ? (n >= Math.max(min * 2 + 4, min + 6)) : (n >= 12);
    var lucky = many && median(gaps) < CFG.luckyGapMs;
    if(!lucky){
      if(n && (!min || n <= min + 2)) praise();
      if(o.onResult) try{ o.onResult(true); }catch(e){}
      return false;
    }
    S.game.lucky++; S.game.sus++; S.game.streak = 0;
    emit('lucky', {moves:n, min:min});
    if(o.defer){
      /* アクションの最中は止めない：まぐれを覚えておき、本編クリアのときに理屈チェック */
      note('🔍 <b>まぐれ？</b>　手あたりしだいに さわって 合っただけ かも。<br><em>クリアのときに 理屈チェック</em>が 出るよ', 3000);
      if(o.onResult) try{ o.onResult(false); }catch(e){}
      return true;
    }
    riddle({q:o.q, title:'まぐれ？', sub:'手あたりしだいに さわって 合っただけ かも。<br>理屈が わかっているか 1問で たしかめよう'}).then(function(ok){
      if(o.onResult) try{ o.onResult(ok); }catch(e){}
    });
    return true;
  }

  /* ---------------- 理屈チェック（1問） ---------------- */
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pickQ(){
    try{
      if(!window.Quiz || !Quiz.all) return null;
      var all = Quiz.all().filter(function(q){ return q.t === 'choice' && q.choices && q.choices.length >= 2 && !q.fig; });
      var k = '';
      try{ k = (Zukan._cur.koma || [])[0] || ''; }catch(e){}
      var mine = all.filter(function(q){ return !k || q.koma === k; });
      var pool = mine.length ? mine : all;
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }catch(e){ return null; }
  }
  var riddleOpen = false;
  function riddle(o){
    return new Promise(function(res){
      var q = o.q || pickQ();
      if(!q || riddleOpen || !document.body){ res(true); return; }
      riddleOpen = true; ensureCSS();
      var shown = shuffle(q.choices), t0 = now(), done = false;
      var d = document.createElement('div'); d.className = 'tk-chk';
      d.innerHTML = '<div class="tk-card"><div class="tk-h">🔍 理屈チェック' + (o.title ? '<span>' + esc(o.title) + '</span>' : '') + '</div>' +
        '<p class="tk-sub">' + (o.sub || 'クリアの前に 1問だけ。ちゃんと わかってクリアしたか たしかめよう') + '</p>' +
        '<p class="tk-q"></p><div class="tk-ch"></div><div class="tk-ex"></div><div class="tk-go"></div></div>';
      d.querySelector('.tk-q').textContent = String(q.q || '').replace(/<[^>]*>/g, '');
      var box = d.querySelector('.tk-ch');
      shown.forEach(function(c){
        var b = document.createElement('button'); b.type = 'button'; b.textContent = String(c).replace(/<[^>]*>/g, '');
        b.onclick = function(){
          if(done) return; done = true;
          var ok = c === q.choices[0], think = now() - t0;
          [].forEach.call(box.children, function(x){ x.disabled = true; if(x.textContent === String(q.choices[0]).replace(/<[^>]*>/g, '')) x.className = 'ok'; else if(x === b) x.className = 'ng'; });
          var ex = d.querySelector('.tk-ex'), go = d.querySelector('.tk-go');
          if(ok && think >= CFG.guessMs){
            ex.innerHTML = '<div class="tk-big">本物！ ✨</div>';
            praise(); S.game.sus = 0; S.game.lucky = 0;
            setTimeout(function(){ d.remove(); riddleOpen = false; res(true); }, 1400);
            return;
          }
          ex.innerHTML = (ok ? '<b>正解。でも 早すぎ！</b> 考えてから 答えよう<br>' : '<b>もう一歩</b> 正解：' + esc(String(q.choices[0]).replace(/<[^>]*>/g, '')) + '<br>') + esc(String(q.ex || '').replace(/<[^>]*>/g, ''));
          ensureLoaded();
          var n = CFG.debtLucky; pay('lucky', n); save();
          var nb = document.createElement('button'); nb.type = 'button'; nb.className = 'tk-next'; nb.textContent = 'わかった（' + (costText(n) || 'もう一度 考えよう') + '）';
          nb.onclick = function(){ if(nb.classList.contains('tk-gated')) return; d.remove(); riddleOpen = false; res(false); };
          go.appendChild(nb);
          var kara = karaoke(ex, CFG.readCps);
          gate(nb, {ms: kara ? kara.total + 300 : 2500});
          if(kara && gates.length) gates[gates.length - 1].kara = kara;
        };
        box.appendChild(b);
      });
      document.body.appendChild(d);
    });
  }

  /* ---------------- 共通部品へのつなぎ ---------------- */
  function hookQuiz(){
    var Q = window.Quiz; if(!Q || Q.__tk) return; Q.__tk = 1;
    var test = Q.test, check = Q.check, review = Q.review;
    if(test) Q.test = function(){ var r = test.apply(this, arguments); startTest(); return r; };
    if(check) Q.check = function(q, ans){
      var ok = check.apply(this, arguments);
      if(!S.inReview){ try{ if(S.inTest) onTestAnswer(q, ok); }catch(e){} }
      return ok;
    };
    if(review) Q.review = function(){ S.inReview = true; try{ return review.apply(this, arguments); } finally { S.inReview = false; } };
  }
  function hookCard(){
    var C = window.SubmitCard; if(!C || C.__tk) return; C.__tk = 1;
    var show = C.show;
    C.show = function(r, onClose){
      try{
        if(r && S.t0){
          ensureLoaded();
          r = Object.assign({}, r);
          var raw = +r.score || 0, full = penalty(), p = Math.min(raw, full), rows = (r.records || []).slice(), why = [];
          if(S.test.guess) why.push('あてずっぽう ' + S.test.guess + '回');
          if(S.test.mash) why.push('連打 ' + S.test.mash + '回');
          if(S.test.skip) why.push('とばし読み ' + S.test.skip + '回');
          if(full > 0){ r.score = raw - p; rows.push(['適当プレイ', 'ひび入り −' + full + '点（' + why.join('・') + '）' + (full > p ? '　※0点より下にはならない' : '')]); }
          else if(why.length){ rows.push(['適当プレイ', why.join('・')]); }
          else rows.push(['解きかた', '◎ 本物（罰なし・じっくり解いた）']);

          if(S.game.mash || S.game.guess) rows.push(['ゲーム中の連打・あてずっぽう', (S.game.mash + S.game.guess) + '回']);
          r.records = rows;

  function hookZukan(){
    var Zk = window.Zukan; if(!Zk || Zk.__tk || !Zk.earn) return; Zk.__tk = 1;
    var earn = Zk.earn;

      if(S.debt > 0 && why !== 'pass'){
        n = Math.floor(Number(n) || 0);

        return 0;
      }
      return mc.apply(this, arguments);
    };

    startTest: function(){ startTest(); },

    config: CFG,
    _hook: hookAll

  hookAll();
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hookAll);
  window.addEventListener('load', hookAll);
})();

<script>/*@SUBMIT_CARD_BEGIN*/

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}

      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});

  function payPass(res){

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');

      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+

        '<div class="sc-grid">'+cells+'</div>'+

      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

function svg(inner){return `<svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" font-family="DotGothic16,monospace">${inner}</svg>`}
function A(x1,y1,x2,y2,c,lab,lx,ly,o){o=o||{};const g=Math.atan2(y2-y1,x2-x1),h=11,bx=x2-h*Math.cos(g),by=y2-h*Math.sin(g);
  const p2=[bx+5.5*Math.sin(g),by-5.5*Math.cos(g)],p3=[bx-5.5*Math.sin(g),by+5.5*Math.cos(g)];
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${c}" stroke-width="${o.w||3}" ${o.dash?'stroke-dasharray="5 4"':''}/><polygon points="${x2},${y2} ${p2} ${p3}" fill="${c}"/>`+
  (lab?`<text x="${lx}" y="${ly}" fill="${c}" font-size="${o.fs||14}" text-anchor="${o.anc||'middle'}">${lab}</text>`:'')}
function T(x,y,s,c,anc,fs){return `<text x="${x}" y="${y}" fill="${c||'#fff'}" font-size="${fs||13}" text-anchor="${anc||'middle'}">${s}</text>`}
function box(x,y,w,h,l1,l2){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#333" stroke="#fff" stroke-width="2"/>`+T(x+w/2,y+h/2-2,l1)+(l2?T(x+w/2,y+h/2+14,l2):'')}

   box(150,122,60,50,'ザック',v.m+'kg')+A(210,147,295,147,Y,v.F1+' N',255,137)+A(150,147,65,147,Y,v.F2+' N',105,137)+T(318,153,'🧍','#fff','middle',22)+T(42,153,'🧍','#fff','middle',22)+

/* 図鑑・Quizが無いので、まぐれ判定の「理屈チェック」にはこのゲームの確認テストの問題を渡す */
function tkRiddleQ(){const q=TEST[Math.floor(Math.random()*TEST.length)];return {q:q.q,choices:q.a,ex:''}}

/* ===== 状態 ===== */
const S={hard:false,st:0,v:null,steps:[],si:0,hp:5,gear:[],miss:0,sonan:0,lost:0,pen:0,t0:0,timer:null,log:[],whyOK:true,rev:new Set(),eqs:[],runs:0,best:null,hardClear:false,busy:false};
const MAXHP=()=>S.hard?3:5, PEN=()=>S.hard?20:10;

/* ===== 山の絵 ===== */
const SLOPE=x=>84-(x/64)*78;
const NODES=[7,17,27,37,47,56,64].map(x=>[x,SLOPE(x)-1]);
function mtSvg(){
  let p='M0,100 V84 ';for(let x=0;x<=64;x+=4){const y=SLOPE(x);p+=`H${x} V${y.toFixed(1)} `}
  for(let x=68;x<=100;x+=4){const y=6+(x-64)*1.5;p+=`H${x} V${y.toFixed(1)} `}p+='V100 Z';
  let sn='M50,26 ';for(let x=52;x<=64;x+=4){sn+=`H${x} V${SLOPE(x).toFixed(1)} `}for(let x=68;x<=76;x+=4){sn+=`H${x} V${(6+(x-64)*1.5).toFixed(1)} `}sn+='V26 H72 V30 H64 V26 H58 V30 H50 Z';
  let back='M40,100 ';for(let x=40;x<=100;x+=4){const y=Math.max(30,40+Math.abs(x-84)*2.2);back+=`H${x} V${y} `}back+='V100 Z';
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${back}" fill="#2a3f63"/><path d="${p}" fill="#4d5b3c"/><path d="${sn}" fill="#f4f4f4"/>
  ${[[10,14],[24,9],[84,12],[92,24],[33,20]].map(([x,y])=>`<rect x="${x}" y="${y}" width=".6" height="1.2" fill="#fff"/>`).join('')}</svg>`;
}
function drawMt(){
  let h=mtSvg();
  NODES.forEach(([x,y],i)=>{
    if(i<6){const g=ST[i].gear,has=S.gear[i];h+=`<div class="node" style="left:${x}%;top:${y+6}%"><span style="${has?'':'opacity:.3;filter:grayscale(1)'}">${g.e}</span><small>${ST[i].area}</small></div>`}
    else h+=`<div class="node" style="left:${x+5}%;top:${y+2}%">🚩<small>山頂</small></div>`;
  });
  $('mtIn').innerHTML=h;
}
function placeClimber(i,anim){const c=$('climber');if(!anim){c.style.transition='none';requestAnimationFrame(()=>c.style.transition='')}const [x,y]=NODES[i];c.style.left=x+'%';c.style.top=y+'%'}

/* ===== HUD ===== */
function hud(){
  $('hArea').innerHTML=`<span class="y">${ST[S.st]?ST[S.st].area:'山頂'}</span>${S.hard?' <span class="r">HARD</span>':''}`;
  $('hHp').innerHTML='<span class="r">'+'♥'.repeat(Math.max(0,S.hp))+'</span><span class="gray">'+'♡'.repeat(Math.max(0,MAXHP()-S.hp))+'</span>';
  $('hGear').innerHTML=ST.map((s,i)=>`<span class="${S.gear[i]?'':'no'}">${s.gear.e}</span>`).join('');
}
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const total=()=>(Date.now()-S.t0)/1000+S.pen;
function tick(){$('hTime').textContent='⏱ '+fmtT(total())}

/* ===== 進行 ===== */
function startRun(hard){
  Object.assign(S,{hard,st:0,hp:hard?3:5,gear:[],miss:0,sonan:0,lost:0,pen:0,log:[],t0:Date.now()});
  ['title','summit','result','test'].forEach(id=>$(id).classList.add('hidden'));$('game').classList.remove('hidden');
  clearInterval(S.timer);S.timer=setInterval(tick,250);
  drawMt();placeClimber(0,false);enterStage(0);window.scrollTo(0,0);
}
function enterStage(i){
  S.st=i;S.saveSt=i;saveLocal(i);const st=ST[i];S.v=st.gen();S.steps=st.steps(S.v);S.si=0;S.whyOK=true;S.rev=new Set();S.eqs=[];
  $('stTitle').textContent=st.name;$('story').innerHTML=st.story(S.v);drawDiag();$('eqs').innerHTML='';hud();renderStep();
}
function drawDiag(){$('diag').innerHTML=ST[S.st].diag(S.v,S.rev)}
function next(){S.si++;if(S.si>=S.steps.length)stageClear();else renderStep()}

function renderStep(){
  const s=S.steps[S.si];S.busy=false;
  $('stepNo').textContent=`STEP ${S.si+1} / ${S.steps.length}　`+{force:'💪 力を見つける',tiles:'🧱 式を組み立てる',choice:'🧭 手順を選ぶ',why:'❓ なぜ？（装備がかかっている・1回勝負）',calc:'🧮 ゲームが計算'}[s.t];
  $('q').innerHTML=s.q||'';$('fb').innerHTML='';
  window.Tekitou&&Tekitou.shown();
  ({force:rForce,tiles:rTiles,choice:rChoice,why:rWhy,calc:rCalc})[s.t](s);
}
function fb(h,cls){$('fb').innerHTML=`<span class="${cls||''}">${h}</span>`}
function nextBtn(label){return `<div class="ctrl"><button class="btn y" onclick="next()">${label||'次へ ▶'}</button></div>`}

function miss(s,detail){
  S.miss++;S.pen+=PEN();S.hp--;hud();tick();
  const p=$('penFx');p.textContent='＋'+PEN()+'秒';p.style.opacity=1;setTimeout(()=>p.style.opacity=0,700);
  const key=ST[S.st].area+'｜'+(s.q||'').replace(/<[^>]+>/g,'');if(!S.log.some(l=>l.k===key))S.log.push({k:key,a:detail});
  if(S.hp<=0){S.busy=true;setTimeout(sonan,500);return true}
  return false;
}
function sonan(){
  S.sonan++;
  ov(`<div class="emo">🚁</div><h2>遭難……</h2>体力が つきた。<br>救助ヘリで <span class="y">${ST[S.st].area}</span> の入口まで 運ばれた。<br><span class="gray">（数値が変わって やり直し）</span>`,'もう一度 登る',()=>{S.hp=S.hard?2:3;enterStage(S.st)});
}

/* --- 力を選ぶ --- */
function rForce(s){
  const opts=shuffle(s.opts);
  $('work').innerHTML=`<div class="opts" data-mash-ok>${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('')}</div><div class="ctrl"><button class="btn y" id="bGo">決定 ▶</button></div>`;
  document.querySelectorAll('#work .opt').forEach(b=>b.onclick=()=>{b.classList.toggle('on');window.Tekitou&&Tekitou.move()});
  $('bGo').onclick=()=>{
    if(S.busy)return;
    const sel=[...document.querySelectorAll('#work .opt')].map(b=>b.classList.contains('on'));
    const wrong=opts.filter((o,i)=>sel[i]&&!o[1]),lack=opts.filter((o,i)=>!sel[i]&&o[1]);
    if(!wrong.length&&!lack.length){
      window.Tekitou&&Tekitou.answer(true);
      window.Tekitou&&Tekitou.solved({min:s.opts.filter(o=>o[1]).length,q:tkRiddleQ()});
      S.busy=true;if(s.reveal){S.rev.add(s.reveal);drawDiag()}
      fb('⭕ 正解！ 図に 力の矢印がかきこまれた。','g');setTimeout(next,900);return;
    }
    window.Tekitou&&Tekitou.answer(false);
    let h='✕ ちがう……<br>'+wrong.map(o=>`<span class="r">・「${o[0]}」</span> → ${o[2]}`).join('<br>')+(lack.length?(wrong.length?'<br>':'')+'<span class="y">・まだ 見落としている力がある。</span>':'');
    fb(h);if(miss(s,'正しい力：'+s.opts.filter(o=>o[1]).map(o=>o[0]).join('、')))return;
  };
}

/* --- タイルで式を組み立てる --- */
function rTiles(s){
  S.eqL=null;S.eqR=[];
  let tiles=s.tiles.slice();if(S.hard)tiles.push({id:'x98',l:'9.8'},{id:'xa',l:'a'});
  tiles=shuffle(tiles);const lhs=s.lhs?shuffle(s.lhs):null;
  $('work').innerHTML=`<div data-mash-ok><div class="eq"><span id="eqL" class="slot">${s.lhsFixed||'左辺'}</span><span>＝</span><span class="rhs" id="eqR"><span class="gray" style="font-size:15px">ここに タイルをならべる</span></span></div>`+
   (lhs?`<div class="lab">左辺（どの質量 × a？）</div><div class="pal">${lhs.map(t=>`<button class="tile l" data-l="${t.id}">${t.l}</button>`).join('')}</div>`:'')+
   `<div class="lab">右辺（力と符号）</div><div class="pal" id="palR"><button class="tile s" data-s="+">＋</button><button class="tile s" data-s="-">－</button>${tiles.map(t=>`<button class="tile" data-q="${t.id}">${t.l}</button>`).join('')}</div></div>`+
   `<div class="ctrl"><button class="btn" id="bClr">けす</button><button class="btn y" id="bGo">決定 ▶</button></div>`;
  if(s.lhsFixed){$('eqL').style.color='#fff';$('eqL').style.borderColor='transparent';$('eqL').style.fontSize='22px'}
  const lab=id=>tiles.find(t=>t.id===id).l;
  const draw=()=>{
    $('eqR').innerHTML=S.eqR.length?S.eqR.map((t,i)=>`<button class="tile ${t.s?'s':''}" data-k="${i}">${t.s?(t.s==='+'?'＋':'－'):lab(t.id)}</button>`).join(''):'<span class="gray" style="font-size:15px">ここに タイルをならべる</span>';
    document.querySelectorAll('#eqR .tile').forEach(b=>b.onclick=()=>{S.eqR.splice(+b.dataset.k,1);window.Tekitou&&Tekitou.move();draw()});
    document.querySelectorAll('#palR .tile[data-q]').forEach(b=>b.classList.toggle('used',S.eqR.some(t=>t.id===b.dataset.q)));
    if(lhs){const L=lhs.find(t=>t.id===S.eqL);$('eqL').innerHTML=L?L.l:'左辺';$('eqL').style.color=L?'#fff':'';$('eqL').style.fontSize=L?'22px':''}
  };
  document.querySelectorAll('#palR .tile').forEach(b=>b.onclick=()=>{S.eqR.push(b.dataset.s?{s:b.dataset.s}:{id:b.dataset.q});window.Tekitou&&Tekitou.move();draw()});
  document.querySelectorAll('#work .tile.l').forEach(b=>b.onclick=()=>{S.eqL=b.dataset.l;window.Tekitou&&Tekitou.move();draw()});
  $('eqL').onclick=()=>{if(lhs){S.eqL=null;draw()}};
  $('bClr').onclick=()=>{S.eqR=[];if(lhs)S.eqL=null;draw()};
  $('bGo').onclick=()=>{
    if(S.busy)return;
    if(lhs&&!S.eqL)return fb('左辺（質量 × a）を 選ぼう。','y');
    const k=S.eqR;if(!k.length)return fb('右辺が からっぽ。','y');
    const terms=[];let i=0;
    while(i<k.length){let sg='+';if(k[i].s){sg=k[i].s;i++}else if(terms.length)return fb('式の形になっていない…… 項と項の間には「＋」か「−」を入れよう。','y');
      if(i>=k.length||k[i].s)return fb('式の形になっていない…… 符号のあとには 力のタイルを置こう。','y');terms.push([sg,k[i].id]);i++}
    const ans=s.ans,has=id=>terms.find(t=>t[1]===id);
    const lhsOK=!lhs||S.eqL===s.lhsAns;
    const extra=terms.filter(t=>!ans.some(a=>a[1]===t[1])),lack=ans.filter(a=>!has(a[1])),sign=ans.filter(a=>has(a[1])&&has(a[1])[0]!==a[0]);
    if(lhsOK&&!extra.length&&!lack.length&&!sign.length){
      window.Tekitou&&Tekitou.answer(true);
      {const nT=ans.length,min=(lhs?1:0)+nT+Math.max(0,nT-1);window.Tekitou&&Tekitou.solved({min,q:tkRiddleQ()})}
      S.busy=true;const L=s.lhsFixed||lhs.find(t=>t.id===S.eqL).l;
      const eq=`${s.no?s.no+'　':''}${L} ＝ ${terms.map((t,j)=>(j===0&&t[0]==='+'?'':(t[0]==='+'?' ＋ ':' － '))+lab(t[1])).join('')}`;
      S.eqs.push(eq);$('eqs').innerHTML=S.eqs.map(e=>'✔ '+e).join('<br>');
      fb('⭕ 式が立った！','g');setTimeout(next,900);return;
    }
    window.Tekitou&&Tekitou.answer(false);
    const msg=[];
    if(!lhsOK)msg.push('左辺の質量がちがう。<b>どの物体の式</b>を立てている？');
    if(extra.length)msg.push('その物体に はたらいていない力（関係ない量）が 入っている。');
    if(lack.length)msg.push('力が 足りない。');
    if(sign.length)msg.push('向き（符号）が ちがう項がある。');
    const right=(s.lhsFixed||lhs.find(t=>t.id===s.lhsAns).l)+' ＝ '+ans.map((a,j)=>(j===0&&a[0]==='+'?'':(a[0]==='+'?' ＋ ':' － '))+lab(a[1])).join('');
    fb('✕ '+msg.join('<br>✕ ')+`<br><span class="c">ヒント：${s.hint}</span>`,'r');
    miss(s,'正しい式：'+(s.no||'')+right);
  };
  draw();
}

/* --- 手順を選ぶ --- */
function rChoice(s){
  const opts=shuffle(s.opts);
  $('work').innerHTML=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('')}</div>`;
  document.querySelectorAll('#work .opt').forEach(b=>b.onclick=()=>{
    if(S.busy)return;const o=opts[+b.dataset.i];
    if(o[1]){window.Tekitou&&Tekitou.answer(true);S.busy=true;b.classList.add('okk');fb('⭕ 正解！','g');setTimeout(next,800)}
    else{window.Tekitou&&Tekitou.answer(false);b.disabled=true;b.classList.add('ngg');fb('✕ ちがう…… <span class="c">ヒント：'+s.hint+'</span>','r');miss(s,'正解：'+s.opts.find(o=>o[1])[0])}
  });
}

/* --- なぜ？（1回勝負） --- */
function rWhy(s){
  const opts=shuffle(s.opts);
  $('work').innerHTML=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('')}</div><div id="whyNext"></div>`;
  document.querySelectorAll('#work .opt').forEach(b=>b.onclick=()=>{
    if(S.busy)return;S.busy=true;const o=opts[+b.dataset.i];
    window.Tekitou&&Tekitou.answer(!!o[1]);
    document.querySelectorAll('#work .opt').forEach((x,i)=>{x.disabled=true;if(opts[i][1])x.classList.add('okk')});
    if(o[1])fb('⭕ その通り！ <span class="gray">'+s.exp+'</span>','g');
    else{b.classList.add('ngg');S.whyOK=false;fb(`✕ ざんねん…… <span class="y">この区間の装備（${ST[S.st].gear.e}${ST[S.st].gear.n}）は 取り逃した。</span><br><span class="c">${s.exp}</span>`,'r');
      const key=ST[S.st].area+'｜'+s.q.replace(/<[^>]+>/g,'');if(!S.log.some(l=>l.k===key))S.log.push({k:key,a:'正解：'+s.opts.find(o=>o[1])[0]})}
    $('whyNext').innerHTML=nextBtn();
    window.Tekitou&&Tekitou.gate(document.querySelector('#whyNext button'),{text:s.exp||'',ok:!!o[1]});
  });
}

/* --- ゲームが計算 --- */
function rCalc(s){
  $('q').innerHTML='式が そろった。あとは ゲームが計算する。';
  $('work').innerHTML=`<div class="calc">${s.html()}</div>`+nextBtn();
}

/* --- 区間クリア --- */
function stageClear(){
  const st=ST[S.st];
  if(S.whyOK){
    S.gear[S.st]=true;S.hp=Math.min(MAXHP(),S.hp+2);hud();drawMt();if(S.st<5){S.saveSt=S.st+1;saveLocal(S.saveSt)}
    ov(`<div class="emo">${st.gear.e}</div><h2>${st.area} クリア！</h2><span class="c">${st.gear.n}</span> を 手に入れた！<br><span class="gray">山小屋で休んだ（♥＋2）</span><br><br><span class="y">📌 ${st.key}</span>${S.st<5?spellBox(S.st+1):''}`,
      S.st===5?'🚩 山頂へ！':'▶ 次の区間へ',()=>climb());
  }else{
    S.lost++;
    ov(`<div class="emo">🧱</div><h2>進めない！</h2>この先は <span class="c">${st.gear.e}${st.gear.n}</span> がないと 登れない。<br>「なぜ？」に正しく答えられなかったので 手に入らなかった……<br><br><span class="y">📌 ${st.key}</span><br><span class="gray">（数値が変わって もう一度）</span>${spellBox(S.st)}`,
      '↩ この区間を もう一度',()=>enterStage(S.st));
  }
}
function climb(){
  placeClimber(S.st+1,true);
  if(S.st===5){setTimeout(summit,1300);return}
  setTimeout(()=>enterStage(S.st+1),1300);
}

/* --- 登頂 --- */
function summit(){
  clearInterval(S.timer);const t=total();S.runs++;
  const newBest=S.best===null||t<S.best;if(newBest)S.best=t;if(S.hard)S.hardClear=true;
  const titles=[];
  if(S.miss===0)titles.push('🏅 ノーミス登頂');
  if(S.lost===0)titles.push('🎒 装備一発コンプ');
  if(S.sonan===0)titles.push('🚁 遭難ゼロ');
  if(t<600)titles.push('⚡ 10分切り');
  if(t<300)titles.push('🔥 5分切り');
  if(S.hard)titles.push('💀 ハードルート踏破');
  $('game').classList.add('hidden');const sm=$('summit');sm.classList.remove('hidden');
  sm.innerHTML=`<div style="font-size:60px">🌅🚩</div><h1>登 頂 ！</h1>
   <div style="font-size:22px">記録　<b class="y" style="font-size:44px">${fmtT(t)}</b>${newBest&&S.runs>1?'　<span class="r">自己ベスト更新！</span>':''}</div>
   <div style="margin:6px 0 10px">❌ ミス ${S.miss}回（＋${S.miss*PEN()}秒）　🚁 遭難 ${S.sonan}回　🧱 装備取り逃し ${S.lost}回${S.best!==null?'　🏆 ベスト '+fmtT(S.best):''}</div>
   <div class="titles">${titles.map(x=>`<span>${x}</span>`).join('')||'<span class="gray" style="border-color:#666">称号なし……次は取れる！</span>'}</div>
   ${S.log.length?`<div class="qbox" style="margin-top:12px"><b class="y">【つまずいたところ】</b><br>${S.log.map(l=>`・${l.k}<br>　<span class="c">${l.a}</span>`).join('<br>')}</div>`:''}
   <div style="margin-top:16px">
    <button class="btn big y" onclick="startTest()">📝 確認テストへ</button><br>
    <button class="btn c" onclick="startRun(false)">🔁 もう一度登る（数値が変わる）</button>
    <button class="btn" style="border-color:var(--r);color:var(--r)" onclick="startRun(true)">🔥 ハードルート（♥3・ミス＋20秒・ダミー増）</button>
   </div>`;
  saveLocal(6);sm.insertAdjacentHTML('beforeend',spellBox(6,'ベスト記録の'));
  $('bHardT').classList.remove('hidden');window.scrollTo(0,0);
}

/* --- 確認テスト --- */
function startTest(){window.Tekitou&&Tekitou.startTest();['summit','result','game'].forEach(id=>$(id).classList.add('hidden'));$('test').classList.remove('hidden');S.ti=0;S.tans=[];showTQ();window.scrollTo(0,0)}
function showTQ(){
  if(S.ti>=TEST.length)return testResult();
  const q=TEST[S.ti],opts=shuffle(q.a);$('tnum').textContent='第'+(S.ti+1)+'問 ／ '+TEST.length+'問';$('tq').innerHTML=q.q;
  $('tch').innerHTML=opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('');
  document.querySelectorAll('#tch .opt').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i],ok=o===q.a[0];S.tans.push({q,ok,t:o});window.Tekitou&&Tekitou.answer(ok,{q:{id:'mf'+S.ti,q:q.q}});S.ti++;showTQ()});
}
function testResult(){
  $('test').classList.add('hidden');const r=$('result');r.classList.remove('hidden');
  const sc=S.tans.filter(a=>a.ok).length,name=$('nameIn').value.replace(/[<>&"]/g,'');
  r.innerHTML=`<h2>確認テスト けっか</h2><div style="font-size:20px">${name?name+'　':''}<b style="font-size:44px" class="y">${sc}</b> / ${TEST.length} 点</div>`+
   `<table>${S.tans.map((a,i)=>`<tr><td>${a.ok?'⭕':'❌'}</td><td>${i+1}. ${a.q.q}<br><span style="color:${a.ok?'#8f8':'#f88'}">あなた：${a.t}</span>${a.ok?'':'<br><span class="y">正解：'+a.q.a[0]+'</span>'}</td></tr>`).join('')}</table>`+
   `<div>登山の記録：${S.best!==null?'🏆 ベスト '+fmtT(S.best)+'　':''}登頂 ${S.runs}回${S.hardClear?'　💀 ハード踏破':''}</div>`+
   `<div style="margin-top:12px"><button class="btn y" onclick="SubmitCard.reopen(S.card)">📝 提出カードを表示</button><button class="btn c" onclick="startRun(false)">🔁 もう一度登る</button><button class="btn" style="border-color:var(--r);color:var(--r)" onclick="startRun(true)">🔥 ハードルート</button></div>`;
  window.scrollTo(0,0);
  const tOnly=window.GAME_MODE==='test';
  S.card=SubmitCard.show({gameId:'ma-f-dake',unit:'高1物理　運動方程式の立て方',game:'ma＝F岳 登頂RTA'+(tOnly?'（確認テストのみ）':''),
   name:name,score:sc,total:TEST.length,marks:S.tans.map(a=>a.ok),
   records:tOnly?[['モード','確認テストだけ']]:[['ベスト',S.best!==null?fmtT(S.best):'—'],['登頂',S.runs+'回'],...(S.hardClear?[['ハード','踏破']]:[])],
   review:S.tans.map(a=>({q:a.q.q,a:a.q.a[0],y:a.t,ok:a.ok}))});
}

/* --- オーバーレイ --- */
function ov(html,label,fn){
  $('ovBox').innerHTML=html+`<div style="margin-top:14px"><button class="btn big y" id="ovGo">${label}</button></div>`;$('ov').classList.remove('hidden');
  $('ovGo').onclick=()=>{$('ov').classList.add('hidden');fn()};
}

/* ===== セーブ（自動セーブ＋ふっかつのじゅもん） =====
   自動セーブ：このiPadの中（localStorage）だけに保存。外への送信はしない。
   保存できない環境（アプリ内ブラウザ等）でも、じゅもんで再開できる。 */
const SKEY='maf-dake-save-v1';
const KANA='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわがぎぐげござじずぜぞだぢづでどばびぶべぼ';
const FIELDS=[['st',3],['gear',6],['hp',3],['hard',1],['miss',6],['sonan',4],['lost',4],['el',12],['pen',10],['best',12],['runs',4],['hc',1]]; // 66bit
function snap(st){
  const running=S.t0&&!$('game').classList.contains('hidden');
  return {st,gear:ST.reduce((b,_,i)=>b|(S.gear[i]?1<<i:0),0),hp:Math.max(1,S.hp),hard:S.hard?1:0,miss:S.miss,sonan:S.sonan,lost:S.lost,
    el:st>5?0:Math.floor(running?(Date.now()-S.t0)/1000:(S.el||0)),pen:st>5?0:S.pen,best:S.best===null?4095:Math.floor(S.best),runs:S.runs,hc:S.hardClear?1:0};
}
function saveLocal(st){try{localStorage.setItem(SKEY,JSON.stringify(snap(st)))}catch(e){}}
function loadLocal(){try{return JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){return null}}
function encode(o){
  let bits='';for(const [k,n] of FIELDS){const v=Math.max(0,Math.min((1<<n)-1,Math.round(o[k]||0)));bits+=v.toString(2).padStart(n,'0')}
  const g=[];for(let i=0;i<11;i++)g.push(parseInt(bits.slice(i*6,i*6+6),2));
  const chk=g.reduce((a,x,i)=>(a+x*(i+1))%64,0);
  const out=g.map((x,i)=>KANA[(x+i*37+chk*11)%64]).concat(KANA[chk]).join('');
  return out.slice(0,4)+' '+out.slice(4,8)+' '+out.slice(8);
}
function decode(str){
  const c=[...String(str).replace(/[\s　・]/g,'')].map(ch=>KANA.indexOf(ch));
  if(c.length!==12||c.some(x=>x<0))return null;
  const chk=c[11],g=c.slice(0,11).map((x,i)=>((x-i*37-chk*11)%64+64*20)%64);
  if(g.reduce((a,x,i)=>(a+x*(i+1))%64,0)!==chk)return null;
  let bits=g.map(x=>x.toString(2).padStart(6,'0')).join(''),o={},p=0;
  for(const [k,n] of FIELDS){o[k]=parseInt(bits.slice(p,p+n),2);p+=n}
  if(o.st>6)return null;return o;
}
function spellBox(st,label){return `<div style="margin-top:12px;font-size:15px" class="gray">📜 ${label||''}ふっかつのじゅもん（写真に撮っておけば 続きから再開できる）<br><span class="spell">${encode(snap(st))}</span></div>`}
function applySave(o){
  S.best=o.best===4095?null:o.best;S.runs=o.runs;S.hardClear=!!o.hc;
  if(S.runs>0)$('bHardT').classList.remove('hidden');
}
function resume(o){
  applySave(o);
  Object.assign(S,{hard:!!o.hard,hp:o.hp,gear:ST.map((_,i)=>!!(o.gear>>i&1)),miss:o.miss,sonan:o.sonan,lost:o.lost,pen:o.pen,log:[],t0:Date.now()-o.el*1000});
  ['title','summit','result','test'].forEach(id=>$(id).classList.add('hidden'));$('game').classList.remove('hidden');
  clearInterval(S.timer);S.timer=setInterval(tick,250);
  drawMt();placeClimber(o.st,false);enterStage(o.st);window.scrollTo(0,0);
}
function titleInfo(){
  const o=loadLocal();let h='';
  if(o){applySave(o);
    if(o.st<=5)h+=`<button class="btn big g" style="border-color:var(--g);color:var(--g)" id="bCont">▶ つづきから（${ST[o.st].area}・⏱${fmtT(o.el+o.pen)}${o.hard?'・HARD':''}）</button>`;
    if(S.best!==null)h+=`<div class="y" style="margin-top:6px">🏆 自己ベスト ${fmtT(S.best)}　（登頂 ${S.runs}回${S.hardClear?'・💀 ハード踏破':''}）</div>`;
  }
  $('cont').innerHTML=h;if($('bCont'))$('bCont').onclick=()=>resume(o);
}
function askSpell(){
  $('ovBox').innerHTML=`<div class="emo">📜</div><h2>ふっかつのじゅもん</h2><input id="spIn" style="width:100%;font-size:24px;text-align:center;letter-spacing:.1em" placeholder="ひらがな 12もじ" autocomplete="off"><div id="spMsg" class="r" style="min-height:1.6em;margin-top:6px"></div>
   <div><button class="btn" id="spNo">やめる</button><button class="btn big y" id="spGo">じゅもんを となえる</button></div>`;
  $('ov').classList.remove('hidden');$('spIn').focus();
  $('spNo').onclick=()=>$('ov').classList.add('hidden');
  $('spGo').onclick=()=>{const o=decode($('spIn').value);
    if(!o){$('spMsg').textContent='じゅもんが ちがいます（12もじ・ひらがな）';return}
    $('ov').classList.add('hidden');
    if(o.st<=5)resume(o);else{applySave(o);try{localStorage.setItem(SKEY,JSON.stringify(o))}catch(e){}titleInfo()}
  };
}
addEventListener('pagehide',()=>{if(!$('game').classList.contains('hidden'))saveLocal(S.saveSt)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!$('game').classList.contains('hidden'))saveLocal(S.saveSt)});
window.Tekitou&&Tekitou.setup({onPenalty:function(kind,n){const add=Math.round(PEN()*(n/5));S.pen+=add;tick();const p=$('penFx');if(p){p.textContent='＋'+add+'秒';p.style.opacity=1;setTimeout(()=>p.style.opacity=0,700)}},penaltyLabel:'タイムペナルティ'});
titleInfo();
/* --- ミニゲーム集から「確認テストだけ」で開かれたとき --- */
if(window.PLAYER_NAME)$('nameIn').value=window.PLAYER_NAME;
if(window.GAME_MODE==='test'){$('title').classList.add('hidden');startTest()}
</script>
