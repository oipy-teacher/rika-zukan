<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>アトム・ブロック ～分解も結び付きも組み替え～</title>
<!--
  ゲームID: atom-block ／ コマID: chu2-kagaku-12（化学変化と原子・分子 第12回）
  ねらい: 分解も、物質どうしが結び付く反応も、「原子の組合せが変わる」ことで説明できる

  【6. 別の世界】（2026-09-27 描き直し ─ 画風＝日本の少年漫画の「白黒の原稿」）
   1 世界とメタファー: 坑道を掘り進む少年漫画の連載原稿。画面そのものが「見開きのコマ割り」。
     大ゴマ＝坑道の断面／小ゴマ＝道具帯・組み立て台（反応ノートはナレーション枠）・トロッコ。
     10mごとの節目は「第N話」の扉。メッセージは吹き出し（まちがい＝ギザギザの叫びフキダシ、手順＝ベタ地のナレーション）。
   2 配色: 紙の白 #fbfaf5 と墨 #111 だけ。濃淡はベタとスクリーントーン（網点・線・カケアミ・砂目）で出す。
     色を持つのは原子だけ（制作ルール5.の色表）＝白黒の原稿の中で、理科の主役だけが色を持つ。地層は10mごとにトーンの種類が変わる
   3 書体: 見出し・描き文字 Reggae One ／ 手書きの書き込み Yusei Magic ／ 本文ゴシック
   4 画面: 全画面canvasに原稿を描く。横長（PC・iPad横）＝左に坑道の大ゴマ、右に道具・台・トロッコのコマを積む見開き。
     縦長（iPad縦・スマホ）＝坑道／道具帯／台＋トロッコを縦にコマ割り。どの画面も紙面いっぱい。
     タイトルは表紙の1枚絵（集中線・坑夫のうしろ姿・化合物の岩が割れて色つきの原子が飛ぶ・「バキッ！！」）
   5 HUD: コマ枠の中に ベタ抜きの深さ計・トーンの進み具合・コイン・かけら（Zukan.state()で読んで自前で描く）・ランタン（音）
   6 演出: 集中線・効果線・描き文字（バキッ！／ゴォォ…／ジジジ…／ピカーッ！！／ポンッ！／ドガァァン！！／ゴゴゴ）
     音: ツルハシの金属音・バーナーのゴー・電流のジジジ・木琴のような合体音・トロッコのゴロゴロ（WebAudio合成）

  【7. 動かす遊び】Merge & Dig 型の縦スクロール採掘
   正しい「分解の道具」（加熱・電流）で化合物ブロックを割る → 原子がこぼれる →
   台の上で原子をドラッグして重ね、正しい組（O₂・H₂・H₂O・CO₂…）になると合体して光る → コイン →
   かじ場で道具を強化 → 深く潜る。台の上では「物質どうしを重ねて🔥加熱」で結び付く反応（Fe＋S→FeS 等）も起きる。
   合わない道具では割れない（水を加熱＝水蒸気になるだけ［状態変化］、ツルハシ＝粉になるだけ、単体は分解できない）。
   元の物質に組み戻そうとすると「元にもどるだけ」とはじかれる。反応のたびに「原子の数は前後で同じ・組合せだけ変わる」を記帳。
  30分: 12の層（10mごとの節目11回＋120m踏破）→ 58mで中ボス岩盤 → 118mで大ボス岩盤 → 確認テスト＋提出カード
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Yusei+Magic&family=M+PLUS+1+Code:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fbfaf5;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:#111;-webkit-text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
input{-webkit-user-select:text;user-select:text}
.rg{font-family:"Reggae One","Hiragino Kaku Gothic ProN",sans-serif;font-weight:400}
.mono{font-family:"Reggae One","M PLUS 1 Code",ui-monospace,monospace;font-weight:400}
.hand{font-family:"Yusei Magic","Hiragino Maru Gothic ProN",sans-serif}
/* ペン入れのボタン（手描きの枠・ベタの影） */
.plank{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:52px;padding:8px 26px;
  border:3px solid #111;border-radius:14px 5px 16px 4px/5px 15px 4px 14px;background:#fff;color:#111;filter:grayscale(1);
  font-family:"Reggae One","Hiragino Kaku Gothic ProN",sans-serif;font-weight:400;font-size:20px;letter-spacing:.04em;cursor:pointer;box-shadow:4px 4px 0 #111}
.plank:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #111}
.plank.sm{font-size:16px;min-height:46px;padding:6px 18px}
.plank.iron{background:#111;color:#fff;box-shadow:4px 4px 0 #fff,4px 4px 0 2.5px #111}
.plank[disabled]{color:#555;cursor:default;box-shadow:2px 2px 0 #111;
  background-image:radial-gradient(#111 .8px,transparent 1.1px),radial-gradient(#111 .8px,transparent 1.1px);background-size:6px 6px;background-position:0 0,3px 3px;background-color:#fff}
/* HUD（コマ枠の計器） */
#hud{position:fixed;z-index:5;display:flex;align-items:center;gap:12px;padding:0 10px;pointer-events:none;background:#fff;border:3px solid #111;filter:grayscale(1)}
#hud .logo{display:none;font-size:calc(var(--hf) * .78);white-space:nowrap;transform:rotate(-3deg);padding:0 6px;
  text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,4px 4px 0 #111}
body.land #hud .logo{display:block}
#hud .gauge{display:flex;align-items:baseline;gap:3px;background:#111;color:#fff;padding:2px 12px 3px;transform:skewX(-8deg);box-shadow:3px 3px 0 #fff,3px 3px 0 2px #111}
#hud .gauge b{font-family:"Reggae One",sans-serif;font-weight:400;font-size:var(--hf,26px);line-height:1.1;letter-spacing:.04em}
#hud .gauge small{font-family:"Reggae One",sans-serif;font-size:calc(var(--hf) * .5)}
#hud .lay{flex:1;min-width:0;line-height:1.15}
#hud .lay .nm{font-family:"Reggae One",sans-serif;font-size:calc(var(--hf) * .56);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .lay .bar{height:calc(var(--hf) * .34);margin-top:4px;border:2px solid #111;background:#fff;overflow:hidden;max-width:520px}
#hud .lay .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,#111 0 2px,#fff 2px 5px);border-right:2px solid #111}
#hud .cnt{display:flex;align-items:center;gap:14px;font-family:"Reggae One",sans-serif;font-size:calc(var(--hf) * .62)}
#hud .cnt span{display:flex;align-items:center;gap:5px}
#hud .coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;border:2px solid #111;background:#fff;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px #111}
#hud .kk{display:inline-block;width:.75em;height:.95em;background:#111;clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%)}
body:not(.land) #hud .cnt{flex-direction:column;align-items:flex-end;gap:0}
#snd{pointer-events:auto;width:44px;height:44px;flex:none;border:2.5px solid #111;border-radius:10px 4px 12px 4px/4px 11px 4px 10px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:2px 2px 0 #111}
#snd svg{width:26px;height:30px}
#snd.off svg .fl{opacity:.1}
#snd.off{background-image:linear-gradient(135deg,transparent 46%,#111 46% 54%,transparent 54%)}
/* フキダシ（メッセージ） */
#sign{position:fixed;z-index:6;pointer-events:none;opacity:0;transform:scale(.8);transform-origin:30% 0;transition:opacity .15s,transform .18s cubic-bezier(.3,1.6,.5,1);
  filter:drop-shadow(2.5px 0 0 #111) drop-shadow(-2.5px 0 0 #111) drop-shadow(0 2.5px 0 #111) drop-shadow(0 -2.5px 0 #111)}
#sign.on{opacity:1;transform:none}
#sign .in{position:relative;background:#fff;color:#111;padding:10px 18px 11px;font-size:clamp(14px,calc(.45vw + 9px),19px);line-height:1.55;font-weight:700;border-radius:28px;filter:grayscale(1)}
#sign .in::after{content:"";position:absolute;left:24%;top:-14px;width:24px;height:16px;background:#fff;clip-path:polygon(0 100%,100% 100%,15% 0)}
#sign.bad .in{border-radius:0;clip-path:var(--jag);padding:18px 26px 19px}
#sign.bad .in::after{display:none}
#sign.good .in{font-family:"Yusei Magic","Hiragino Maru Gothic ProN",sans-serif;font-weight:400}
#sign.tut{filter:none}
#sign.tut .in{background:#111;color:#fff;border-radius:0;box-shadow:5px 5px 0 #fff,5px 5px 0 2.5px #111}
#sign.tut .in::after{display:none}
#sign.tut b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
/* 扉（10mごとの節目＝第N話） */
#banner{position:fixed;z-index:8;left:50%;top:70px;width:min(92vw,560px);transform:translate(-50%,-150%) rotate(-3deg);visibility:hidden;transition:transform .45s cubic-bezier(.3,1.4,.5,1),visibility 0s .45s;pointer-events:auto;cursor:pointer;
  background:#fff;border:4px solid #111;box-shadow:9px 9px 0 #111;text-align:center;overflow:hidden;padding-bottom:12px;filter:grayscale(1)}
#banner.on{transform:translate(-50%,0) rotate(-1.2deg);visibility:visible;transition:transform .45s cubic-bezier(.3,1.4,.5,1),visibility 0s}
#banner .d{background:#111;color:#fff;font-family:"Reggae One",sans-serif;font-size:16px;letter-spacing:.12em;padding:6px 12px;text-align:left}
#banner .t{font-family:"Reggae One",sans-serif;font-size:clamp(26px,2.4vw + 10px,40px);color:#111;padding:26px 14px 22px;line-height:1.2;border-bottom:3px solid #111;margin-bottom:10px;
  background:radial-gradient(ellipse at 50% 50%,#fff 0 32%,rgba(255,255,255,0) 64%),repeating-conic-gradient(from 2deg at 50% 50%,#111 0deg 1.1deg,#fff 1.1deg 6.5deg);
  text-shadow:3px 0 #fff,-3px 0 #fff,0 3px #fff,0 -3px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff,6px 6px 0 #111}
#banner .f{font-size:clamp(14px,.4vw + 11px,17px);line-height:1.7;font-weight:700;text-align:left;padding:0 18px}
#banner .f b{text-decoration:underline wavy;text-decoration-thickness:1.5px;text-underline-offset:4px}
#banner .u{margin:10px 16px 0;font-family:"Reggae One",sans-serif;font-size:15px;color:#fff;background:#111;padding:6px 12px;display:inline-block;transform:rotate(-1deg)}
#banner .x{font-family:"Yusei Magic",sans-serif;font-size:12.5px;color:#333;margin-top:8px}
/* かじ場ボタン */
#forgeBtn{position:fixed;z-index:5;padding:4px 4px;min-height:44px;flex-direction:column;gap:3px;line-height:1.1;white-space:nowrap;letter-spacing:0}
#forgeBtn small{font-family:"Yusei Magic",sans-serif;font-size:.62em}
#forgeBtn.ready{background:#111;color:#fff;box-shadow:4px 4px 0 #fff,4px 4px 0 2.5px #111;animation:beat 1.1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:none}50%{transform:rotate(-2deg) scale(1.04)}}
/* かじ場（強化のページ） */
#forge{position:fixed;z-index:12;left:50%;bottom:0;width:min(100vw,960px);max-height:94vh;overflow-y:auto;transform:translate(-50%,108%);transition:transform .3s ease;
  background:#fbfaf5;border:4px solid #111;border-bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));touch-action:pan-y;filter:grayscale(1)}
#forge.on{transform:translate(-50%,0)}
#forge h2{margin:0 0 10px;font-family:"Reggae One",sans-serif;font-weight:400;font-size:26px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:6px}
#forge h2 .mono{font-size:19px}
#fgList{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.upg{display:flex;align-items:center;gap:10px;padding:8px;border:2.5px solid #111;background:#fff;box-shadow:3px 3px 0 #111}
.upg .ic{width:48px;height:48px;flex:none;border:2px solid #111;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
.upg .tx{flex:1;min-width:0}
.upg .tx b{font-family:"Reggae One",sans-serif;font-weight:400;font-size:16px}
.upg .tx small{display:block;font-size:12.5px;color:#222;line-height:1.4}
.upg .pip{letter-spacing:2px;font-size:12px}
.upg button{min-width:86px;min-height:44px;font-size:14px;padding:4px 10px}
#forge .coin{display:inline-block;width:.9em;height:.9em;border-radius:50%;border:2px solid #111;background:#fff;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px #111;vertical-align:-2px}
/* タイトル（表紙） */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center}
#title{pointer-events:none}
#tCard{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.7vh,20px);pointer-events:auto;text-align:center;padding:14px 12px;filter:grayscale(1)}
#tCard .kicker{background:#111;color:#fff;font-family:"Reggae One",sans-serif;font-size:clamp(12px,calc(var(--tw) * .034),20px);padding:4px 14px;transform:rotate(-2deg);letter-spacing:.1em}
#tCard h1{margin:0;font-family:"Reggae One",sans-serif;font-weight:400;color:#111;line-height:1.04;font-size:min(calc(var(--tw) * .112),calc(var(--th) * .13));transform:rotate(-3deg);
  text-shadow:.05em 0 #fff,-.05em 0 #fff,0 .05em #fff,0 -.05em #fff,.04em .04em #fff,-.04em -.04em #fff,.04em -.04em #fff,-.04em .04em #fff,.1em .1em 0 #111}
body.land #tCard h1{font-size:min(calc(var(--tw) * .19),calc(var(--th) * .12))}
#tCard h1 span{display:inline}
body.land #tCard h1 span{display:block}
#tCard .sub{font-family:"Reggae One",sans-serif;font-size:clamp(14px,calc(var(--tw) * .042),26px);background:#fff;border:2.5px solid #111;padding:3px 14px;transform:rotate(1.5deg)}
#nameBox{display:flex;align-items:center;gap:8px;background:#fff;border:2.5px solid #111;padding:6px 12px;box-shadow:3px 3px 0 #111}
#nameBox label{font-family:"Reggae One",sans-serif;font-size:15px}
#nameIn{width:170px;min-height:38px;font-size:17px;border:0;border-bottom:2px dashed #111;background:transparent;color:#111;padding:4px 6px;font-family:"Yusei Magic",sans-serif;outline:none}
#tCard .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
#btnStart{background:#111;color:#fff;font-size:clamp(20px,calc(var(--tw) * .05),30px);padding:10px 34px;min-height:58px;box-shadow:5px 5px 0 #fff,5px 5px 0 3px #111}
#tCard .hint{font-family:"Yusei Magic",sans-serif;font-size:clamp(13px,calc(var(--tw) * .03),19px);line-height:1.55;background:#fff;border:2.5px solid #111;border-radius:26px;padding:8px 18px;max-width:94%}
/* 最終話（クリア） */
#clear{justify-content:center;gap:16px;padding:24px;text-align:center;background:#fbfaf5}
#clear::before{content:"";position:absolute;inset:10px;border:4px solid #111;z-index:-1;
  background:radial-gradient(ellipse at 50% 40%,#fff 0 24%,rgba(255,255,255,0) 58%),repeating-conic-gradient(from 0deg at 50% 40%,#111 0 .7deg,#fff .7deg 4.6deg)}
#clear::after{content:"完";position:absolute;right:28px;bottom:26px;font-family:"Reggae One",sans-serif;font-size:clamp(34px,5vw,64px);background:#111;color:#fff;padding:4px 14px;transform:rotate(-6deg)}
#clear h2{margin:0;font-family:"Reggae One",sans-serif;font-weight:400;font-size:clamp(48px,10vw,132px);color:#111;transform:rotate(-4deg);
  text-shadow:.05em 0 #fff,-.05em 0 #fff,0 .05em #fff,0 -.05em #fff,.04em .04em #fff,-.04em -.04em #fff,.04em -.04em #fff,-.04em .04em #fff,.09em .09em 0 #111}
#clear .rule{max-width:min(92vw,760px);background:#111;color:#fff;padding:14px 20px;font-size:clamp(15px,.5vw + 12px,20px);line-height:1.75;font-weight:700;text-align:left;box-shadow:6px 6px 0 #fff,6px 6px 0 3px #111}
#clear .rule em{font-style:normal;text-decoration:underline wavy;text-decoration-thickness:2px;text-underline-offset:5px}
#clear .rec{font-family:"Reggae One",sans-serif;font-size:clamp(15px,.5vw + 12px,21px);background:#fff;border:3px solid #111;padding:8px 18px;line-height:1.75;box-shadow:4px 4px 0 #111}
/* 確認テスト（原稿の余白に書く作業日誌） */
#test{justify-content:flex-start;align-items:stretch;padding:calc(10px + env(safe-area-inset-top)) 10px 14px;overflow-y:auto;touch-action:pan-y;background:#fbfaf5}
#test .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;background:#111;color:#fff;padding:6px 16px;flex:none}
#test .top .rg{font-size:clamp(17px,1vw + 10px,24px)}
#test .top .mono{font-size:clamp(16px,1vw + 9px,22px)}
#test .paper{flex:1 0 auto;background:#fff;border:3px solid #111;padding:16px 16px 18px;display:flex;flex-direction:column}
body.land #test .paper{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"q a" "f a" "f b";column-gap:28px;padding:22px 26px}
body.land #tQ{grid-area:q}body.land #tFig{grid-area:f}body.land #tA{grid-area:a;border-left:3px solid #111;padding-left:24px;align-self:start}body.land #tFb{grid-area:b;padding-left:27px}
#tQ{font-size:clamp(17px,.9vw + 9px,25px);font-weight:700;line-height:1.65;margin-bottom:10px;padding:10px 14px;border:2.5px solid #111;background:#fff;box-shadow:4px 4px 0 #111}
#tFig{text-align:center;margin:8px 0 12px;overflow-x:auto}
#tFig svg{max-width:100%;height:auto;background:#fff;border:2px solid #111}
body.land #tFig svg{width:100%;max-height:56vh}
#tA{display:flex;flex-direction:column;gap:11px}
.tag{min-height:48px;text-align:left;font-size:clamp(15.5px,.6vw + 10px,21px);font-weight:700;line-height:1.45;padding:10px 14px;cursor:pointer;
  border:2.5px solid #111;border-radius:12px 4px 14px 5px/5px 13px 4px 12px;background:#fff;color:#111;box-shadow:3px 3px 0 #111;font-family:inherit}
.tag:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
.tag.ok{background:#111;color:#fff}
.tag.ng{background-image:repeating-linear-gradient(-45deg,rgba(17,17,17,.55) 0 1.5px,transparent 1.5px 6px);text-decoration:line-through;text-decoration-thickness:2px}
.tag.pickd{opacity:.4}
#tA .numrow{display:flex;gap:8px;align-items:center}
#numIn{flex:1;min-height:48px;font-size:22px;font-family:"M PLUS 1 Code",monospace;border:2.5px solid #111;border-radius:0;background:#fff;color:#111;padding:4px 10px}
#tA .ord{display:flex;flex-direction:column;gap:6px;min-height:20px;padding:6px;border:2px dashed #111;background:#fff}
#tA .ord div{font-size:15px;font-weight:700;padding:6px 8px;background:#fff;border:1.5px solid #111;border-left:6px solid #111}
#tFb{margin-top:12px;font-size:clamp(15px,.5vw + 11px,20px);line-height:1.6;font-weight:700}
#tFb .mk{font-family:"Reggae One",sans-serif;font-size:1.7em;margin-right:6px}
#tFb .ex{display:block;font-weight:500;font-size:.95em;color:#222;margin-top:4px}
#tNext{margin-top:12px}
@media (prefers-reduced-motion:reduce){#banner,#forge,#sign{transition:none}#forgeBtn.ready{animation:none}}
</style>
</head>
<body>
<canvas id="cv" aria-label="坑道"></canvas>

<div id="title" class="ov">
  <div id="tCard">
    <div class="kicker">中2理科 化学 第12回</div>
    <h1><span>アトム・</span><span>ブロック</span></h1>
    <div class="sub">～分解も結び付きも組み替え～</div>
    <div id="nameBox"><label for="nameIn">なまえ</label><input id="nameIn" maxlength="16" autocomplete="off" placeholder="（空でもOK）"></div>
    <div class="row">
      <button id="btnStart" class="plank">⛏ はじめる</button>
      <button id="btnCont" class="plank hidden">つづきから</button>
    </div>
    <div class="row"><button id="btnBook" class="plank sm iron">📖 図鑑</button></div>
    <div class="hint">正しい道具で化合物を割り、こぼれた原子を組み替えて、地下120mまで潜れ！</div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}
