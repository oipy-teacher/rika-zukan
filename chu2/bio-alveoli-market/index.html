<title>肺胞マーケット ～肺胞でのガス交換～</title>
<!--
 ==========================================================================
 肺胞マーケット ～肺胞でのガス交換～（bio-alveoli-market / chu2-seibutsu-22）
 ねらい: 肺胞では、空気中の酸素が血液に入り、血液中の二酸化炭素が空気中へ出る（ガス交換）。
         肺胞がたくさんあると、空気と血液がふれる所が広くなり、効率よく受け渡しできる。
 --------------------------------------------------------------------------
 画風（2026-09-27 v2）: 「クロスステッチ刺繍」。アイーダ布（布目と穴）の上に×の糸で刺した図案。
   背景・屋台・通り・文字は×刺し、気体の玉はサテン刺し（平行な糸）、線はバックステッチ／ランニングステッチ。
 1. 世界とメタファー: 布に刺した中世の市。気管の大通りから気管支の路地が分かれ、その先の屋台＝肺胞。
    屋台の下を毛細血管の通りが流れ、血液の「かご」が全身から運ばれてくる。
    屋台の空気から酸素の玉を かごへ投げ入れ（玉入れ）、かごから出てくる二酸化炭素の玉を屋台で受け取る。
    はく息が二酸化炭素を外へ運ぶ。かごが動脈血（あざやかな赤）になって出ていけば取引成立。
    道のり＝市場の地図（刺繍の見本布）に通りを1本ずつ刺し足す／集める＝帳簿の「市の証」＋図鑑／美麗＝刺繍。
 2. 配色: 布 #EDE3D1／主 えんじ #8C2F39／差し 藍 #2B4162／静脈血 #5E1F2D→動脈血 #D7263D／
    原子の色は全ゲーム共通（O #E4572E・N #2549C9・C #3a3d46）。夜市は藍の布、大市は金糸。
 3. 書体: 見出し・数字＝M PLUS 1p（900）を布目に落として×刺しにする。説明の札も M PLUS 1p。
 4. 画面の組み方: 全画面のcanvas。PC・iPad横＝上に屋台（肺胞）の列、下を横に流れる血管の通り。
    スマホ・iPad縦＝まん中を縦に流れる通り、左右に屋台。devicePixelRatio に合わせて描く。
 5. HUD: 刺繍の札（布ラベル）に通りの名前・出荷の刺し進み帯・銀貨・かけら・息のリング。
 6. 音: リュートのつま弾き（Karplus-Strong）、タボール太鼓、リコーダー、鐘。れんさが上がるほど楽器が増える。
 7. 核の操作: 屋台の中の玉をつかんで かごへ投げる（はじく／タップで自動の山なり）。
    理科の判断＝酸素だけを投げる（窒素は入らない・二酸化炭素は逆向き）、酸素の足りないかごを選ぶ、
    肺胞にふれている所でだけ受け渡しできる、出てきた二酸化炭素を受け取る。
    誤った向き・窒素・満タンのかごへの投げ入れで れんさは切れる。
 ==========================================================================
-->

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',

    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',

    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',

    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

 "q": "はく息について正しいものは？", "choices": ["酸素はまだ約17%ふくまれている", "酸素はまったくふくまれない", "ほとんどが二酸化炭素である", "窒素はふくまれない"], "ex": "はく息の酸素は約17%、二酸化炭素は約4%。大部分は窒素。", "fig": null, "kind": "judge", "level": 1}, {"id": "chu2-bio-alveoli-market-q008", "koma": "chu2-seibutsu-22", "t": "choice", "q": "吸う息とはく息で、割合がほとんど変わらない気体は？", "choices": ["窒素", "酸素", "二酸化炭素", "水蒸気"], "ex": "窒素は肺胞でほとんど出入りしないので、割合はほぼ同じ（約78%）。", "fig": null, "kind": "judge", "level": 1}, {"id": "chu2-bio-alveoli-market-q009", "koma": "chu2-seibutsu-22", "t": "order", "q": "鼻や口から吸いこんだ酸素が血液に入るまでの道すじを、順に並べよう。", "items": ["気管", "気管支", "肺胞", "肺胞のまわりの毛細血管"], "ex": "気管→気管支→肺胞。肺胞をあみの目のように囲む毛細血管へ酸素が入る。", "fig": null, "kind": "term", "level": 1}, {"id": "chu2-bio-alveoli-market-q010", "koma": "chu2-seibutsu-22", "t": "choice", "q": "肺胞のまわりには、何があみの目のように取りかこんでいる？", "choices": ["毛細血管", "筋肉", "骨", "神経だけ"], "ex": "肺胞を取りかこむ毛細血管の血液との間で、ガス交換が行われる。", "fig": null, "kind": "term", "level": 1}, {"id": "chu2-bio-alveoli-market-q011", "koma": "chu2-seibutsu-22", "t": "num", "q": "空気（吸う息）の二酸化炭素は約0.04%、はく息の二酸化炭素は約4%。はく息の二酸化炭素の割合は、吸う息の約何倍？", "ans": 100, "unit": "倍", "tol": 0, "ex": "4 ÷ 0.04 = 100。肺胞で血液中の二酸化炭素が空気中へ出てくるから。", "fig": null, "kind": "calc", "level": 2}, {"id": "chu2-bio-alveoli-market-q012", "koma": "chu2-seibutsu-22", "t": "choice", "q": "酸素を多くふくむ血液を何という？", "choices": ["動脈血", "静脈血", "血しょう", "組織液"], "ex": "酸素の多い血液が動脈血、二酸化炭素の多い血液が静脈血。肺胞を通ると静脈血が動脈血になる。", "fig": null, "kind": "term", "level": 1}, {"id": "chu2-bio-alveoli-market-q013", "koma": "chu2-seibutsu-22", "t": "choice", "q": "石灰水を入れた2本の試験管の一方に吸う息（まわりの空気）、もう一方にはく息を同じ量ふきこんでよくふった。予想される結果は？", "choices": ["はく息の方が白くにごる", "吸う息の方が白くにごる", "どちらも同じくらい白くにごる", "どちらも変化しない"], "ex": "はく息は二酸化炭素が多い（約4%）ので、石灰水がよく白くにごる。", "fig": null, "kind": "method", "level": 1}, {"id": "chu2-bio-alveoli-market-q014", "koma": "chu2-seibutsu-22", "t": "choice", "q": "肺胞で血液に入った酸素は、このあとどうなる？", "choices": ["血液によって全身の細胞まで運ばれる", "肺胞にもどって、はく息として出ていく", "すぐに二酸化炭素に変わって肺胞へ出ていく", "肺の中にたくわえられる"], "ex": "酸素は血液で体のすみずみの細胞まで運ばれ、そこで使われる。", "fig": null, "kind": "judge", "level": 1}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  g.font='900 '+clamp(sz*.17,13,20)+'px '+FONT;for(let k=0;k<3;k++){g.lineWidth=3;g.strokeStyle=PAL.ecru;g.strokeText('★',p[0]-sz*.2+k*sz*.2,p[1]+sz*.4);g.fillStyle=k<SV.stars[i]?PAL.gold:'rgba(120,100,80,.45)';g.fillText('★',p[0]-sz*.2+k*sz*.2,p[1]+sz*.4)}
  if(!open){g.font='22px sans-serif';g.fillText('🔒',p[0],p[1])}
  if(open&&!own){g.font='900 13px '+FONT;g.fillStyle=PAL.art;g.fillText('つぎ',p[0],p[1]-sz*.62)}})}
function mapTap(x,y){if(!MP)return;const sz=MP.sz||100;MP.pts.forEach((p,i)=>{if(Math.abs(x-p[0])<sz*.55&&Math.abs(y-p[1])<sz*.6){const open=i===0||SV.stars[i-1]>0;if(open){SFX.click();openIntro(i)}else{SFX.bounce()}}})}
$('btnLedger').onclick=()=>{ac();SFX.click();openLedger()};
$('btnBookM').onclick=()=>{ac();try{Z().openBook()}catch(e){}};
$('btnGachaM').onclick=()=>{ac();try{Z().openGacha()}catch(e){}};
$('btnTestM').onclick=()=>{ac();SFX.click();startTest()};

/* =================== 15. 通りのはじめ・おわり =================== */
function openIntro(i){newGame(i);G.paused=true;show('intro');BGC=null;const st=STAGES[i];const need=THR.map(t=>Math.ceil(t*st.cnt));
 ov('<h2>第'+(i+1)+'の通り　'+esc(st.name)+'<small>新しいこと：'+esc(st.nw)+'</small></h2><div class="newel"><canvas id="nwC" width="10" height="10"></canvas><p style="margin:0">'+esc(st.tip)+'</p></div>'+
 '<div class="goal"><span>かご '+st.cnt+'</span><span>★1 動脈血 '+need[0]+'</span><span>★2 '+need[1]+'</span><span>★3 '+need[2]+'</span>'+(SV.best[i]?'<span>最高 '+SV.best[i]+'</span>':'')+'</div>'+
 '<div class="btns"><button class="fab red big" id="goSt">市をひらく</button></div>');
 const c=$('nwC');c.width=120*DPR;c.height=64*DPR;c.style.width='120px';c.style.height='64px';const q=c.getContext('2d');q.scale(DPR,DPR);
 const tp=i===1||i===2?'CO2':i===0?'O2':null;if(tp){const s=molSprite(tp,16);q.drawImage(s,60-s.cw/2,32-s.ch/2,s.cw,s.ch)}else{const s=molSprite('O2',12),s2=molSprite('N2',12);q.drawImage(s,30-s.cw/2,32-s.ch/2,s.cw,s.ch);q.drawImage(s2,90-s2.cw/2,32-s2.ch/2,s2.cw,s2.ch)}
 $('goSt').onclick=()=>{ac();ovClose();SFX.fanfare();G.paused=false;show('play');SV.tut.play=SV.tut.play||(i>0?1:0);save();BGM.tier=0;BGM.start();
  G.banner={txt:'第'+(i+1)+'の通り',t:0,col:PAL.red};G.tipT=5.5;G.tipTxt=st.tip;inhale()}}
function endStage(){G.ended=true;BGM.stop();const i=G.i,st=G.st,ratio=G.done/G.cnt;let stars=0;THR.forEach((t,k)=>{if(G.done>=Math.ceil(t*G.cnt))stars=k+1});
 const prev=SV.stars[i],rec=G.done>SV.best[i];SV.stars[i]=Math.max(prev,stars);SV.best[i]=Math.max(SV.best[i],G.done);SV.coins+=G.coins;if(i===0)SV.tut.play=1;
 if(stars>0&&i===7)badge('night');if(stars>=3&&i===8)badge('king');checkTotBadges();
 const allNow=SV.stars.every(s=>s>0),firstAll=allNow&&!SV.allClear;if(allNow)SV.allClear=true;save();
 if(stars>0){try{Z()&&Z().earn(15,'rule',{silent:true})}catch(e){}}
 setTimeout(()=>showResult(stars,prev,rec,firstAll),700)}
function showResult(stars,prev,rec,firstAll){scene='result';backBtn();const i=G.i;
 ov('<h2 style="text-align:center">'+(stars>0?'取引おわり！':'今日の市はここまで')+'<small>第'+(i+1)+'の通り　'+esc(G.st.name)+'</small></h2>'+
 '<div id="stBox" style="display:flex;justify-content:center;gap:8px;font-size:56px;line-height:1.1;min-height:66px"></div>'+
 (rec&&stars>0?'<p style="text-align:center;color:var(--art,#D7263D);margin:0">✨ 新記録！</p>':'')+
 '<table class="ledg"><tr><td>動脈血になって出荷したかご</td><td id="rDone">0</td></tr><tr><td>血液へ入れた酸素</td><td id="rO2">0</td></tr><tr><td>受け取った二酸化炭素</td><td id="rCO2">0</td></tr><tr><td>最高れんさ</td><td>×'+G.maxC+'</td></tr><tr><td>銀貨</td><td id="rCoin">0</td></tr></table>'+
 (stars===0?'<p>★1には 動脈血 '+Math.ceil(THR[0]*G.cnt)+' かご が必要。あと '+(Math.ceil(THR[0]*G.cnt)-G.done)+' かご！　酸素の足りないかごをねらおう。</p>':'')+
 '<div class="btns">'+(stars>0&&i<NST-1?'<button class="fab red big" id="rNext">つぎの通りへ</button>':'')+'<button class="fab" id="rAgain">もう一度</button><button class="fab ind" id="rMap">市場の地図へ</button>'+(firstAll?'<button class="fab red" id="rClear">本編クリア！ 確認テストへ</button>':'')+'</div>',true);
 const cnt=(id,to,d)=>{const el=$(id);if(!el)return;let t0=performance.now();const f=()=>{const k=Math.min(1,(performance.now()-t0)/d);el.textContent=Math.round(to*k)+(id==='rDone'?' / '+G.cnt:'');if(k<1)requestAnimationFrame(f)};f()};
 cnt('rDone',G.done,700);cnt('rO2',G.stat.o2,700);cnt('rCO2',G.stat.co2,700);cnt('rCoin',G.coins,900);
 const box=$('stBox');for(let k=0;k<3;k++){const s=document.createElement('span');s.textContent='★';s.style.cssText='color:rgba(120,100,80,.25);display:inline-block;transition:transform .25s cubic-bezier(.2,1.8,.4,1)';box.appendChild(s);
  if(k<stars)setTimeout(()=>{s.style.color='#C9972E';s.style.transform='scale(1.35)';setTimeout(()=>s.style.transform='scale(1)',180);SFX.star(k);if(G){G.shake=8;burst(pw/2+(k-1)*60,ph*.35,[PAL.gold,PAL.art,PAL.ecru],24,true)}vib(40)},500+k*450)}
 if(stars>0)setTimeout(()=>{SFX.fanfare();if(G)confetti(90)},500+stars*450);
 const nx=$('rNext');if(nx)nx.onclick=()=>{ovClose();openIntro(i+1)};
 $('rAgain').onclick=()=>{ovClose();openIntro(i)};$('rMap').onclick=()=>{ovClose();openMap()};
 const rc=$('rClear');if(rc)rc.onclick=()=>{ovClose();goClear()}}
function goClear(){const z=Z();if(z&&z.mainClear){try{z.mainClear({onClose:startTest})}catch(e){startTest()}}else startTest()}

/* =================== 16. 確認テスト =================== */
let T=null;
function startTest(){if(!window.Quiz){alert('問題データがありません');return}G=null;ovClose();show('test');T={qs:Quiz.test(),i:0,ans:[]};renderQ()}
function renderQ(){const q=T.qs[T.i];$('qNo').textContent=(T.i+1)+' / '+T.qs.length;$('qText').textContent=q.q;const f=$('qFig');if(q.fig){f.innerHTML=q.fig;f.hidden=false;$('qGrid').classList.add('hasfig')}else{f.innerHTML='';f.hidden=true;$('qGrid').classList.remove('hasfig')}
 const A=$('qArea');A.innerHTML='';$('scTest').scrollTop=0;
 const mkB=(c,lab)=>{const b=document.createElement('button');b.className='fab';b.innerHTML='<span class="L">'+lab+'</span><span></span>';b.lastChild.textContent=c;return b};
 if(q.t==='choice'){const box=document.createElement('div');box.className='qch';q.shown.forEach((c,k)=>{const b=mkB(c,'アイウエオ'[k]);b.onclick=()=>answer(c);box.appendChild(b)});A.appendChild(box)}
 else if(q.t==='order'){const pk=[];const slots=document.createElement('div');slots.className='ordSlots';const box=document.createElement('div');box.className='qch';
  const draw=()=>{slots.innerHTML=q.items.map((_,k)=>'<div>'+(k+1)+'. '+(pk[k]?esc(pk[k]):'')+'</div>').join('');box.querySelectorAll('.fab').forEach(b=>b.classList.toggle('done',pk.indexOf(b.dataset.v)>=0))};
  q.shown.forEach((c,k)=>{const b=mkB(c,String(k+1));b.dataset.v=c;b.onclick=()=>{if(pk.indexOf(c)>=0)return;pk.push(c);SFX.click();draw();if(pk.length===q.items.length)setTimeout(()=>answer(pk.slice()),250)};box.appendChild(b)});
  const rs=document.createElement('button');rs.className='fab sm ind';rs.style.marginTop='10px';rs.textContent='やり直す';rs.onclick=()=>{pk.length=0;draw()};
  const h=document.createElement('p');h.style.margin='4px 0';h.textContent='順番に タップして並べよう';A.appendChild(h);A.appendChild(slots);A.appendChild(box);A.appendChild(rs);draw()}
 else{const w=document.createElement('div');w.className='qch';w.innerHTML='<div class="numRow"><input id="numIn" inputmode="decimal"><b>'+esc(q.unit||'')+'</b></div><button class="fab red" id="numOk">これで決める</button>';A.appendChild(w);$('numOk').onclick=()=>answer($('numIn').value)}}
function answer(a){const q=T.qs[T.i];T.ans[T.i]=a;const ok=Quiz.check(q,a);ok?SFX.trade():SFX.bounce();vib(ok?20:[20,40,20]);
 const d=document.createElement('div');d.className='qfb';d.innerHTML='<div class="sheet"><div class="mk" style="color:'+(ok?'#D7263D':'#2B4162')+'">'+(ok?'◯':'✕')+'</div><p>'+(ok?'':'<b>正解：</b>'+esc(Quiz.answer(q))+'<br>')+esc(q.ex||'')+'</p><div class="btns"><button class="fab red">'+(T.i+1<T.qs.length?'次の問題へ':'結果へ')+'</button></div></div>';
 $('app').appendChild(d);d.querySelector('.fab').onclick=()=>{d.remove();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}}
function finishTest(){const qs=T.qs,answers=T.ans;const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;const tm=window.GAME_MODE==='test';const name=window.PLAYER_NAME||SV.name||($('nameIn').value||'').trim()||'';
 const nClr=SV.stars.filter(s=>s>0).length,totStar=SV.stars.reduce((a,b)=>a+b,0);
 const done=()=>{T=null;if(tm){openTitle()}else openMap()};
 if(score>=Math.ceil(qs.length*.7)){try{Z()&&Z().earn(30,'pass',{silent:true})}catch(e){}}
 if(!window.SubmitCard){done();return}
 SubmitCard.show({gameId:GAME_ID,grade:'chu2',koma:[KOMA],unit:'中2理科　生物の体のつくりと働き　第22回',game:'肺胞マーケット ～肺胞でのガス交換～'+(tm?'（確認テストのみ）':''),
  name,score,total:qs.length,marks,
  records:tm?[['モード','確認テストだけ']]:[['刺し終えた通り',nClr+' / '+NST+'（★'+totStar+'）'],['動脈血になったかご',SV.tot.art+' かご'],['血液へ入れた酸素',SV.tot.o2+' 個'],['最高れんさ','×'+SV.maxCombo]],
  review},done)}

/* =================== 17. ループと起動 =================== */
let last=performance.now();
function frame(now){const raw=Math.min(.05,(now-last)/1000);last=now;NOW+=raw;
 try{if(scene==='title')drawTitle(raw);
  else if(scene==='map')drawMap(raw);
  else if(scene==='test'){ctx.setTransform(1,0,0,1,0,0);if(!MAPC){const W=cv.width,H=cv.height,c=mk(W,H);paintCloth(c.getContext('2d'),W,H,PAL.cloth,PAL.hole);MAPC=c}ctx.drawImage(MAPC,0,0)}
  else if(G){let dt=raw;if(G.slow>0){G.slow-=raw;dt*=.35}if(!G.paused&&!G.ended&&scene==='play')tStep(dt);fxStep(raw);drawPlay(raw)}}catch(e){console.error(e)}
 requestAnimationFrame(frame)}
window.addEventListener('resize',()=>{resize()});
resize();setMute(!!SV.mute);
try{window.Zukan&&Zukan.setup({game:GAME_ID,koma:[KOMA]})}catch(e){}
if(document.fonts&&document.fonts.load){document.fonts.load('900 20px "M PLUS 1p"').then(()=>{XS={};SPR={};BGC=null;TITLE=null;TA=null;MAPC=null}).catch(()=>{})}
window.__am={get G(){return G},get SV(){return SV},openIntro,startTest,tapThrow,catchBubble,openMap,get scene(){return scene},go(){const b=$('goSt');b&&b.click()}};
if(window.GAME_MODE==='test'){startTest()}else{openTitle()}
requestAnimationFrame(frame);
