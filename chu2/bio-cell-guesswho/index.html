<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>この細胞だれ？ ～植物の細胞と動物の細胞～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1d12;--wood:#8a5a32;--wood2:#6e4524;--tag:#f0d9a8;--tag2:#e4c285;--grn:#4f8f3a;--red:#c8323a;--pap:#fff8ea;--disp:'Kaisei Decol','Zen Kaku Gothic New','Hiragino Mincho ProN',serif;--body:'Zen Kaku Gothic New','Hiragino Sans','Meiryo',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#3e2716;color:var(--ink);font-family:var(--body);overflow-x:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;
 background:repeating-linear-gradient(92deg,rgba(0,0,0,.06) 0 3px,transparent 3px 11px),repeating-linear-gradient(88deg,rgba(255,255,255,.04) 0 2px,transparent 2px 23px),linear-gradient(180deg,#9a6638,#7b4d29)}
button{font-family:inherit;color:inherit}
.hide{display:none!important}
.scr{display:none;min-height:100vh;flex-direction:column;padding:10px 10px 18px}
.scr.on{display:flex}
.btn{color:var(--ink);font:900 16px/1.25 var(--body);min-height:46px;padding:9px 14px;border:3px solid var(--ink);border-radius:10px;background:var(--pap);box-shadow:0 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:#f2b53a}
.btn.grn{background:#9fd48a}
.btn.red{background:#e8736a;color:#fff!important}
.btn.sel{background:#ffe07a;outline:3px solid #fff}
.btn:disabled{opacity:.4}
.btn.sm{min-height:44px;font-size:14px;padding:6px 10px}
h1,h2{font-family:var(--disp);margin:0}
/* タイトル */
#title{align-items:center;justify-content:center;text-align:center;gap:12px;color:#fff}
.sign{background:var(--pap);color:var(--ink);border:4px solid var(--ink);border-radius:12px;padding:14px 12px;box-shadow:0 8px 0 rgba(0,0,0,.35);width:100%;max-width:440px}
.sign h1{font-size:clamp(30px,9vw,44px);line-height:1.2}
.sign .sub{font-weight:900;font-size:16px;margin-top:4px}
.minirow{display:flex;gap:6px;justify-content:center;margin:12px 0 6px}
.minirow .tag{width:64px}
.sign .lead{font-size:15px;line-height:1.6;font-weight:700;margin:6px 0 0}
.namebox{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:900}
.namebox input{font:inherit;font-size:17px;padding:8px 10px;border:3px solid var(--ink);border-radius:10px;width:11em}
.tbtns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
/* ゲーム */
#game{gap:7px;padding-top:6px}
.hud{display:flex;gap:5px;align-items:center;font-weight:900;font-size:14px}
.pill{background:var(--pap);border:2.5px solid var(--ink);border-radius:999px;padding:4px 8px;white-space:nowrap}
.pill.cmb{background:#ffe07a}
.ibtn{flex:none;min-width:44px;min-height:44px;border:2.5px solid var(--ink);border-radius:10px;background:var(--pap);font-size:18px;cursor:pointer}
.top{display:flex;gap:8px;align-items:stretch}
.hidden{width:96px;flex:none;perspective:600px}
.bubble{flex:1;background:var(--pap);border:3px solid var(--ink);border-radius:12px;padding:7px 10px;font-weight:700;font-size:15px;line-height:1.5;position:relative;min-height:84px}
.bubble:before{content:'';position:absolute;left:-12px;top:22px;border:6px solid transparent;border-right-color:var(--ink);border-width:8px 12px 8px 0}
.bubble.bad{background:#ffe1dc}.bubble.good{background:#e3f5da}
.board{background:rgba(0,0,0,.18);border:3px solid rgba(0,0,0,.35);border-radius:12px;padding:8px 6px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;perspective:700px}
.board.c3{grid-template-columns:repeat(3,1fr)}
/* 木札 */
.tag{position:relative;background:linear-gradient(180deg,var(--tag),var(--tag2));border:2.5px solid var(--ink);border-radius:8px 8px 6px 6px;padding:12px 3px 4px;text-align:center;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.5,-0.3,.7,1.3),filter .45s;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.tag:before{content:'';position:absolute;top:4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#5b3a1e;box-shadow:inset 0 1px 2px #000}
.tag svg{width:100%;height:auto;display:block;background:#fffdf5;border-radius:4px;border:1px solid rgba(0,0,0,.2)}
.tag .nm{font-size:10.5px;font-weight:900;line-height:1.2;margin-top:3px;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.tag.down{transform:rotateX(-78deg);filter:brightness(.55)}
.tag.pick{outline:4px solid #ffe07a;outline-offset:1px;transform:translateY(-4px)}
.tag.ok{outline:4px solid #7fd35f}
.hid{width:100%;aspect-ratio:.8;position:relative;transform-style:preserve-3d;transition:transform .7s}
.hid .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:10px;overflow:hidden}
.hid .back{background:repeating-linear-gradient(45deg,#6e4524 0 8px,#7b4d29 8px 16px);display:flex;align-items:center;justify-content:center;font:900 48px var(--disp);color:#f2b53a;text-shadow:0 3px 0 #2b1d12}
.hid .front{transform:rotateY(180deg);background:var(--tag);padding:4px}
.hid .front svg{width:100%;height:auto;background:#fffdf5;border-radius:4px}
.hid .front .nm{font-size:10px;font-weight:900;text-align:center;line-height:1.2}
.hid.open{transform:rotateY(180deg)}
.nuc{fill:#a79e94;transition:fill 1.2s}
.stained .nuc{fill:#c0305f}
.qs{display:flex;flex-wrap:wrap;gap:6px}
.qs .btn{flex:1 1 46%;font-size:14px;text-align:left;padding:6px 8px}
.qs .btn .a{float:right;font-size:13px}
.legend{font-size:11.5px;font-weight:700;color:#fff;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.legend svg{vertical-align:middle}
.bar{display:flex;gap:6px;align-items:center}
/* 重ね画面 */
#ov{position:fixed;inset:0;z-index:50;background:rgba(30,18,8,.6);display:flex;align-items:flex-end;justify-content:center;padding:10px;overflow:auto}
#ov.mid{align-items:center}
.panel{width:min(100%,470px);max-height:calc(100vh - 20px);overflow:auto;background:var(--pap);border:4px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.4);padding:14px;text-align:center}
.panel h2{font-size:22px;margin-bottom:6px}
.panel p{line-height:1.6;margin:6px 0}
.step{font-weight:900;margin:10px 0 6px;text-align:left}
.two{display:flex;gap:8px}.two .btn{flex:1;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .btn{font-size:14px;padding:6px 10px;flex:1 1 44%}
.fact{background:#fff1c4;border:2.5px dashed var(--ink);border-radius:10px;padding:8px 10px;font-size:14.5px;text-align:left;line-height:1.6}
.judge{display:flex;flex-direction:column;gap:4px;text-align:left;font-weight:700;font-size:15px;margin:8px 0}
.judge div{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:5px 8px}
.cols{display:flex;gap:8px;text-align:left}
.cols>div{flex:1;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px;min-height:120px}
.cols h3{margin:0 0 6px;font-size:14px}
.cols .btn{display:block;width:100%;margin-bottom:5px;font-size:13px;padding:5px 6px;min-height:40px}
/* 演出 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font:900 22px var(--body);color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);animation:ft 1.1s forwards;white-space:nowrap}
@keyframes ft{to{transform:translate(-50%,-170%);opacity:0}}
.cf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;border:1.5px solid rgba(0,0,0,.3);animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.bn{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font:700 clamp(26px,8vw,40px) var(--disp);color:var(--ink);background:#f2b53a;border:4px solid var(--ink);border-radius:12px;padding:6px 18px;box-shadow:0 6px 0 var(--ink);animation:bn 1.5s forwards;white-space:nowrap}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(.3)}15%{transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.drop{position:absolute;width:16px;height:22px;background:#c0305f;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:drop .7s ease-in forwards}
@keyframes drop{from{transform:translateY(-110px)}to{transform:translateY(0)}}
/* テスト */
#test{gap:10px;background:var(--pap)}
#result{color:#fff}
.qno{font-weight:900}
.dots{display:flex;gap:4px}.dots i{flex:1;height:8px;border-radius:4px;background:#e0cfa9}.dots i.on{background:var(--wood)}
.qtext{font-size:18px;font-weight:700;line-height:1.6;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px 12px}
.fig{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px}
.fig svg{width:100%;height:auto;display:block;max-height:250px}
.tchoices{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.tchoices .btn{text-align:left;font-size:16px;font-weight:700;line-height:1.45}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys .btn{font-size:20px}
.numd{font-size:26px;font-weight:900;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;text-align:right;min-height:52px}
.ord{display:flex;flex-direction:column;gap:6px}
.ord .slot{background:#fff;border:2.5px dashed var(--ink);border-radius:10px;padding:8px 10px;min-height:44px;font-weight:700;text-align:left}
.ord .slot b{color:var(--red);margin-right:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
 <section id="title" class="scr">
  <div class="sign">
   <div style="font-size:44px">❓</div>
   <h1>この細胞だれ？</h1>
   <div class="sub">～植物の細胞と動物の細胞～</div>
   <div class="minirow" id="tRow"></div>
   <p class="lead">伏せた札の細胞に「はい／いいえ」で質問。<br>植物？動物？ <b>決め手</b>を決めてから、染色して開封！</p>
  </div>
  <div class="namebox" id="nameBox">なまえ <input id="nameIn" maxlength="20" placeholder="（なくてもOK）" autocomplete="off"></div>
  <div class="tbtns">
   <button class="btn pri" id="bStart">▶ はじめる</button>
   <button class="btn" id="bCont">⏩ つづきから</button>
   <button class="btn" id="bBook1">📖 図鑑</button>
  </div>
 </section>

 <section id="game" class="scr">
  <div class="hud">

  </div>
  <div class="board" id="board"></div>
  <div class="legend" id="legend">
   <span><svg width="26" height="12"><rect x="1" y="1" width="24" height="10" fill="none" stroke="#2b1d12" stroke-width="3"/><rect x="4" y="3.5" width="18" height="5" fill="none" stroke="#2b1d12" stroke-width="1"/></svg> 細胞壁＋細胞膜</span>
   <span><svg width="22" height="12"><rect x="2" y="2" width="18" height="8" rx="3" fill="#fbf2f2" stroke="#2b1d12" stroke-width="1"/></svg> 細胞膜だけ</span>
   <span><svg width="14" height="12"><ellipse cx="7" cy="6" rx="5" ry="3.5" fill="#5da144" stroke="#2f6b24"/></svg> 葉緑体</span>
   <span><svg width="18" height="12"><rect x="1" y="1" width="16" height="10" rx="4" fill="#e3f0f4" stroke="#7aa3b0" stroke-dasharray="2 1.5"/></svg> 液胞</span>
   <span><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="#a79e94"/></svg> 核</span>
  </div>

 </section>

 <section id="test" class="scr">
  <h2 style="font-size:24px">📝 確認テスト</h2>

 </section>

 <section id="result" class="scr" style="align-items:center;justify-content:center;text-align:center;gap:12px">
  <h2 style="font-size:28px">札あて名人！</h2>
  <div id="resBox" style="font-size:18px;line-height:1.7;font-weight:700"></div>
  <div class="tbtns">
   <button class="btn pri" id="bCard">📝 提出カードをもう一度見る</button>
   <button class="btn" id="bRetest">🔁 テストをやり直す</button>
   <button class="btn" id="bBook2">📖 図鑑</button>
   <button class="btn" id="bTop">🏠 タイトルへ</button>
  </div>
 </section>
</div>
<div id="ov" class="hide"></div>
<div id="fx"></div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};

          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}

      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

u003c/text>\u003ctext x=\"250\" y=\"122\">C\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2}, {"id": "chu2-bio-cell-guesswho-q004", "koma": "chu2-seibutsu-03", "t": "choice", "q": "ある細胞を観察すると、核はあったが、細胞壁も葉緑体も見られなかった。「動物の細胞」と判断できる決め手はどれ？", "choices": ["細胞壁がないこと", "核があること", "葉緑体がないこと", "形がまるいこと"], "ex": "葉緑体がない植物の細胞もあり、核はどちらにもある。決め手は細胞壁がないこと。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q005", "koma": "chu2-seibutsu-03", "t": "choice", "q": "タマネギの表皮の細胞には葉緑体が見られない。それでも「植物の細胞」と言える決め手はどれ？", "choices": ["細胞壁があること", "核があること", "細胞膜があること", "形が細長いこと"], "ex": "細胞壁は植物の細胞だけにある。タマネギの表皮は地下にあって光が当たらず、葉緑体がない。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q006", "koma": "chu2-seibutsu-03", "t": "choice", "q": "植物の細胞で、細胞膜の外側にある じょうぶなしきりを何という？", "choices": ["細胞壁", "細胞質", "液胞", "核"], "ex": "細胞膜の外側の厚くじょうぶなつくりが細胞壁。植物の体を支えるのに役立つ。", "kind": "term", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q007", "koma": "chu2-seibutsu-03", "t": "choice", "q": "植物の細胞に見られる緑色の粒で、光合成を行うつくりを何という？", "choices": ["葉緑体", "液胞", "核", "細胞壁"], "ex": "緑色の粒は葉緑体。光合成を行う。", "kind": "term", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q008", "koma": "chu2-seibutsu-03", "t": "choice", "q": "細胞の核を観察しやすくするために使う染色液はどれ？", "choices": ["酢酸オルセイン液", "ヨウ素液", "BTB液", "石灰水"], "ex": "酢酸オルセイン液（酢酸カーミン液）で核が赤く染まる。", "kind": "method", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q009", "koma": "chu2-seibutsu-03", "t": "choice", "q": "表は、動物の細胞と植物の細胞で見られるつくりを○×でまとめたもの。①に入るつくりはどれ？", "choices": ["葉緑体", "細胞膜", "核", "細胞質"], "ex": "動物の細胞になく植物の細胞にある緑の粒＝葉緑体。細胞膜はどちらにもある。", "fig": "\u003csvg viewBox=\"0 0 300 150\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"150\" fill=\"#fff\"/>\u003cg font-size=\"15\" font-weight=\"bold\" text-anchor=\"middle\">\u003crect x=\"20\" y=\"8\" width=\"260\" height=\"136\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/>\u003cline x1=\"20\" y1=\"35\" x2=\"280\" y2=\"35\" stroke=\"#333\"/>\u003cline x1=\"120\" y1=\"8\" x2=\"120\" y2=\"144\" stroke=\"#333\"/>\u003cline x1=\"200\" y1=\"8\" x2=\"200\" y2=\"144\" stroke=\"#333\"/>\u003ctext x=\"70\" y=\"27\">つくり\u003c/text>\u003ctext x=\"160\" y=\"27\">動物の細胞\u003c/text>\u003ctext x=\"240\" y=\"27\">植物の細胞\u003c/text>\u003cline x1=\"20\" y1=\"62\" x2=\"280\" y2=\"62\" stroke=\"#bbb\"/>\u003cline x1=\"20\" y1=\"89\" x2=\"280\" y2=\"89\" stroke=\"#bbb\"/>\u003cline x1=\"20\" y1=\"116\" x2=\"280\" y2=\"116\" stroke=\"#bbb\"/>\u003ctext x=\"70\" y=\"55\">核\u003c/text>\u003ctext x=\"160\" y=\"55\">○\u003c/text>\u003ctext x=\"240\" y=\"55\">○\u003c/text>\u003ctext x=\"70\" y=\"82\">①\u003c/text>\u003ctext x=\"160\" y=\"82\">×\u003c/text>\u003ctext x=\"240\" y=\"82\">○\u003c/text>\u003ctext x=\"70\" y=\"109\">細胞膜\u003c/text>\u003ctext x=\"160\" y=\"109\">○\u003c/text>\u003ctext x=\"240\" y=\"109\">○\u003c/text>\u003ctext x=\"70\" y=\"136\">細胞壁\u003c/text>\u003ctext x=\"160\" y=\"136\">×\u003c/text>\u003ctext x=\"240\" y=\"136\">○\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2}, {"id": "chu2-bio-cell-guesswho-q010", "koma": "chu2-seibutsu-03", "t": "choice", "q": "ある動物の皮ふの細胞は、角ばってすきまなく並んで見えた。この細胞について正しいものはどれ？", "choices": ["細胞壁がないので、動物の細胞である", "すきまなく並ぶので、植物の細胞である", "角ばっているので、植物の細胞である", "核があるので、植物の細胞である"], "ex": "形や並び方は決め手にならない。細胞壁がなければ動物の細胞。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q011", "koma": "chu2-seibutsu-03", "t": "choice", "q": "植物の細胞と動物の細胞を同じ染色液で染めた。赤く染まる丸いつくりが見られるのはどれ？", "choices": ["どちらの細胞にも見られる", "植物の細胞だけ", "動物の細胞だけ", "どちらにも見られない"], "ex": "核はどちらの細胞にもあり、染色液でよく染まる。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q012", "koma": "chu2-seibutsu-03", "t": "choice", "q": "オオカナダモの葉の細胞とタマネギの表皮の細胞に共通して見られ、ヒトのほおの内側の細胞には見られないものはどれ？", "choices": ["細胞壁", "葉緑体", "核", "細胞膜"], "ex": "細胞壁は植物の細胞だけ。葉緑体はタマネギの表皮にはない。核・細胞膜はほおの細胞にもある。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q013", "koma": "chu2-seibutsu-03", "t": "choice", "q": "細胞壁のはたらきとして正しいものはどれ？", "choices": ["植物の体を支え、形を保つのに役立つ", "光合成を行う", "染色液で赤く染まる", "細胞の活動でできた物質や水をためる"], "ex": "細胞壁は植物の体を支える。光合成は葉緑体、物質や水をためるのは液胞。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q014", "koma": "chu2-seibutsu-03", "t": "choice", "q": "細胞のつくりのうち、核と細胞壁以外の部分（細胞膜・葉緑体・液胞などをふくむ）をまとめて何という？", "choices": ["細胞質", "細胞膜", "組織", "液胞"], "ex": "核と細胞壁以外の部分をまとめて細胞質という。", "kind": "term", "fig": null, "level": 1}, {"id": "chu2-bio-cell-guesswho-q015", "koma": "chu2-seibutsu-03", "t": "choice", "q": "図のオオカナダモの葉の細胞で、動物の細胞にもあるつくりはどれ？", "choices": ["ウ", "ア", "イ", "エ"], "ex": "ウの核はどちらの細胞にもある。ア（細胞壁）・イ（葉緑体）・エ（液胞）は植物の細胞で見られる。", "fig": "\u003csvg viewBox=\"0 0 300 170\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"170\" fill=\"#fff\"/>\u003crect x=\"40\" y=\"20\" width=\"200\" height=\"130\" rx=\"6\" fill=\"#fbf7ea\" stroke=\"#2b1d12\" stroke-width=\"7\"/>\u003crect x=\"48\" y=\"28\" width=\"184\" height=\"114\" rx=\"4\" fill=\"none\" stroke=\"#2b1d12\" stroke-width=\"1.5\"/>\u003crect x=\"80\" y=\"50\" width=\"120\" height=\"70\" rx=\"18\" fill=\"#e3f0f4\" stroke=\"#7aa3b0\" stroke-dasharray=\"4 3\"/>\u003cellipse cx=\"62\" cy=\"44\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"92\" cy=\"38\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"130\" cy=\"36\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"170\" cy=\"38\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"210\" cy=\"42\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"220\" cy=\"78\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"218\" cy=\"112\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"186\" cy=\"132\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"146\" cy=\"134\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellips   function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

function msg(t,cls){const m=$('#msg');m.innerHTML=t;m.className='bubble'+(cls?' '+cls:'')}
function hud(){$('#hCase').textContent=R.boss?'👹 難事件 '+(S.boss+1)+'/'+BOSS_N:'🎴 '+Math.min(S.caseIdx+1,10)+'/10';$('#hCombo').textContent='×'+Math.max(1,S.combo);$('#hScore').textContent=S.score+'点';$('#bMute').textContent=S.mute?'🔇':'🔊'}
let clock=null;function startClock(){if(clock)return;let last=Date.now();clock=setInterval(()=>{const n=Date.now();if(R.active&&document.visibilityState==='visible')S.stats.ms+=n-last;last=n},500)}

function setupCase(def,boss){
 const hid=pick(def.hid);R={active:true,boss:!!boss,def,hid,asked:[],budget:def.budget,pick:null,kind:null,reason:null,board:shuffle(def.board)};
 show('game');hud();
 const b=$('#board');b.className='board'+(R.board.length<=6?' c3':'');b.innerHTML=R.board.map((id,i)=>tagHTML(id,i)).join('');
 $$('#board .tag').forEach(t=>t.onclick=()=>{if(!R.active||t.classList.contains('down')||R.boss)return;SFX.tap();R.pick=t.dataset.id;$$('#board .tag').forEach(x=>x.classList.toggle('pick',x===t));if(R.def.tut&&R.asked.length)msg('③ 札を選んだ！ つぎは <b>🖐 答える</b>')});
 const h=$('#hid');h.classList.remove('open');$('#hidFront').innerHTML='';
 $('#legend').classList.toggle('hide',!!boss&&false);
 drawQs();
 msg(boss?'👹 難事件！ 質問は <b>1回だけ</b>。どの質問なら植物か動物か決められる？':(def.tut?'① 伏せた札（左）の細胞は だれ？ まずは質問。<b>「細胞壁はある？」</b>をタップ！':esc(def.tip)));
 if(def.big&&!boss)banner('⚠️ 山場');
 if(def.nw&&!boss)setTimeout(()=>banner(def.nw==='all'?'質問 全解禁！':'新しい質問！'),200);
}
function drawQs(){const d=R.def;$('#budget').textContent='質問 のこり '+R.budget+(R.boss?'（難事件）':'');
 $('#qs').innerHTML=d.qs.map(q=>{const a=R.asked.find(x=>x.q===q);return `<button class="btn" data-q="${q}" ${a||R.budget<=0||!R.active?'disabled':''}>${esc(QS[q].t)}${a?`<span class="a">${a.y?'⭕ はい':'❌ いいえ'}</span>`:''}</button>`}).join('');
 $$('#qs .btn').forEach(b=>b.onclick=()=>ask(b.dataset.q))}
function ask(q){if(!R.active||R.budget<=0)return;R.budget--;S.stats.asked++;
 const hc=CELLS[R.hid],y=!!QS[q].f(hc);R.asked.push({q,y});SFX.ask();setTimeout(()=>y?SFX.yes():SFX.no(),250);drawQs();
 // 合わない札が倒れる
 const downs=[];$$('#board .tag').forEach(t=>{if(t.classList.contains('down'))return;const c=CELLS[t.dataset.id];if(!!QS[q].f(c)!==y)downs.push(t)});
 downs.forEach((t,i)=>setTimeout(()=>{t.classList.add('down');t.classList.remove('pick');if(R.pick===t.dataset.id)R.pick=null;SFX.clack()},(RM?0:350)+i*170));
 const standing=$$('#board .tag').length-$$('#board .tag.down').length-downs.length;
 setTimeout(()=>{
  let t=`「${esc(QS[q].t)}」→ <b>${y?'はい':'いいえ'}</b>。`+(downs.length?`${downs.length}枚 パタン！ のこり${standing}枚。`:'1枚も倒れなかった…（この質問では しぼれない）');
  if(q==='nuc'||q==='mem')t+=' 核・細胞膜は どの細胞にもある。';
  if(R.def.tut)t+=' <br>② のこった札から答えを1枚 <b>タップ</b>して選ぼう';
  if(R.def.big&&q==='chl'&&!y)t+=' <br>⚠️ 葉緑体がなくても、植物の細胞かもしれない…';
  msg(t);
 },(RM?100:450)+downs.length*170);
}
$('#bAns').onclick=()=>{if(!R.active)return;SFX.tap();answerPanel()};
function answerPanel(){
 const need=!R.boss;
 const reasons=shuffle(REASONS);
 const p=ov(`<h2>🖐 答えを確定しよう</h2>
  ${need?`<div class="step">① どの札？ ${R.pick?`→ <b>${esc(CELLS[R.pick].n)}</b>`:'<span style="color:#c8323a">（盤の札をタップして選んでね）</span>'}</div>`:''}
  <div class="step">${need?'②':'①'} 植物の細胞？ 動物の細胞？</div><div class="two"><button class="btn" data-k="plant">🌿 植物</button><button class="btn" data-k="animal">🐾 動物</button></div>
  <div class="step">${need?'③':'②'} 決め手になった特徴は？</div><div class="chips" id="rs">${reasons.map(r=>`<button class="btn" data-r="${r.id}">${esc(r.t)}</button>`).join('')}</div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="aBack" style="flex:1">もどる</button><button class="btn red" id="aGo" style="flex:1.6" disabled>💧 染色して開封！</button></div>`);
 const upd=()=>{$$('#ov [data-k]').forEach(b=>b.classList.toggle('sel',b.dataset.k===R.kind));$$('#rs .btn').forEach(b=>b.classList.toggle('sel',b.dataset.r===R.reason));$('#aGo').disabled=!(R.kind&&R.reason&&(!need||R.pick))};
 $$('#ov [data-k]').forEach(b=>b.onclick=()=>{SFX.tap();R.kind=b.dataset.k;upd()});
 $$('#rs .btn').forEach(b=>b.onclick=()=>{SFX.tap();R.reason=b.dataset.r;upd()});
 $('#aBack').onclick=()=>{SFX.tap();ovClose();if(need&&!R.pick)msg('盤の札を1枚 <b>タップ</b>して選んでから、答えよう')};
 $('#aGo').onclick=()=>{ovClose();openStain()};upd();
}
function openStain(){
 R.active=false;drawQs();
 const hc=CELLS[R.hid],h=$('#hid');const r=h.getBoundingClientRect();
 SFX.drip();const d=document.createElement('i');d.className='drop';d.style.left=(r.left+r.width/2-8)+'px';d.style.top=(r.top+r.height/2-11)+'px';$('#fx').appendChild(d);setTimeout(()=>d.remove(),720);
 msg('💧 染色液（酢酸オルセイン）を1滴…');
 setTimeout(()=>{$('#hidFront').innerHTML=cellSVG(R.hid)+`<div class="nm">${esc(hc.n)}</div>`;h.classList.add('open');SFX.open();
  setTimeout(()=>{$('#hidFront svg').classList.add('stained')},RM?0:500);
  setTimeout(judge,RM?300:1500)},RM?50:750);
}
function judge(){
 const hc=CELLS[R.hid],rs=REASONS.find(x=>x.id===R.reason);
 const kindOK=R.kind===hc.k;const reasonOK=kindOK&&rs.ok(hc)&&rs.kind===hc.k;const cardOK=R.boss?true:R.pick===R.hid;
 const all=kindOK&&reasonOK;
 const cx=innerWidth/2,cy=innerHeight*.3;
 let pts=0;
 if(all){S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);pts=100*S.combo+(cardOK&&!R.boss?50:0);S.score+=pts;S.stats.ok++;SFX.good(S.combo);confetti(S.combo>=3?90:45);banner(S.combo>=2?`🔥 ${S.combo}連続！`:'🎯 正解！');earn(15,'hit',cx,cy);floatTxt(cx,cy+40,'+'+pts+'点')}
 else{S.combo=0;S.stats.miss++;SFX.bad()}
 S.log.push({hid:R.hid,kind:R.kind,reason:R.reason,ok:all});save();hud();
 $$('#board .tag').forEach(t=>{if(t.dataset.id===R.hid)t.classList.add('ok')});
 const nm=hc.n,kindTxt=hc.k==='plant'?'植物の細胞':'動物の細胞';
 const why=[];
 if(!kindOK)why.push(`❌ ${esc(nm)}は<b>${kindTxt}</b>。`);
 if(kindOK&&!reasonOK){why.push(`⚠️ ${kindTxt}は当たり。でも「${esc(rs.t)}」は決め手にならない。`+(rs.why?esc(rs.why)+'。':(rs.ok(hc)?'':'この細胞には当てはまらない。')))}
 const good=hc.k==='plant'?REASONS.filter(x=>x.kind==='plant'&&x.ok(hc)).map(x=>x.t):['細胞壁がない'];
 const bossNext=R.boss;
 const p=ov(`<h2>${all?'🎯 正解！':'😣 おしい…'}</h2>
  <div class="judge"><div>${kindOK?'⭕':'❌'} 植物か動物か：<b>${kindTxt}</b></div><div>${reasonOK?'⭕':'❌'} 決め手：${esc(rs.t)}</div>${R.boss?'':`<div>${cardOK?'⭕':'➖'} 札：${esc(nm)}${cardOK?'（ぴったり！＋50点）':''}</div>`}</div>
  ${why.length?`<p style="text-align:left;font-weight:700">${why.join('<br>')}</p>`:''}
  <div class="fact">🔍 ${esc(nm)}の決め手になる特徴：<b>${esc(good.join('・'))}</b><br>🧪 染色すると<b>核</b>が赤く染まった。核は植物にも動物にもある（決め手にならない）。</div>
  ${all?`<p style="font-weight:900">${S.combo>=2?'🔥 連続正解で 倍率 ×'+S.combo+'！':''} ＋${pts}点</p>`:'<p style="font-weight:900;color:#c8323a">連続が 0 にもどった。つぎは根拠をはっきり！</p>'}
  <button class="btn pri" id="bNx" style="width:100%;margin-top:6px">${all?'つぎの事件へ ▶':'🔁 もう1件（同じテーマ）'}</button>`,true);
 $('#bNx').onclick=()=>{SFX.tap();ovClose();
  if(bossNext){if(all){S.boss++;save();if(S.boss>=BOSS_N)return recordCard();bossCase()}else{S.boss=0;save();bossIntro(true)}return}
  if(all){S.caseIdx++;save()}
  if(S.caseIdx>=CASES.length)bossIntro();else setupCase(CASES[S.caseIdx])};
}
/* ---- 難事件 ---- */
let BOSSQ=[];
function bossIntro(again){
 R={active:false,boss:true};
 const p=ov(`<h2>👹 難事件 3連続！</h2><p>盤の札は8枚。質問は <b>1回だけ</b>。<br>3件つづけて「植物か動物か」と「決め手」を当てよう。</p>${again?'<p style="color:#c8323a;font-weight:900">失敗したので、はじめから！</p>':''}<div class="fact">💡 1回の質問で、植物か動物かを必ず決められる質問はどれだろう？</div><button class="btn red" id="bBi" style="width:100%;margin-top:10px">いざ！</button>`,true);
 BOSSQ=shuffle([pick(['onion','root','tsuyu','hair']),'skin',pick(['kanadamo','leafin'])]);
 $('#bBi').onclick=()=>{SFX.tap();ovClose();bossCase()};
}
function bossCase(){const hid=BOSSQ[S.boss]||pick(ALLP);const others=shuffle(ALLP.concat(ALLA).filter(x=>x!==hid)).slice(0,7);
 setupCase({board:others.concat([hid]),hid:[hid],qs:['nuc','mem','ang','wall','chl','vac'],budget:1},true)}
/* ---- 記録カード（決め手になった／ならなかった） ---- */
function recordCard(){
 R={active:false};
 const chips=[{t:'細胞壁がある（→植物）',g:1},{t:'細胞壁がない（→動物）',g:1},{t:'葉緑体がある（→植物）',g:1},{t:'大きな液胞がある（→植物）',g:1},{t:'核がある',g:0},{t:'細胞膜がある',g:0},{t:'葉緑体がない',g:0},{t:'角ばってすきまなく並ぶ',g:0}];
 const st=chips.map(()=>null);let first=true;
 const draw=()=>{const col=g=>chips.map((c,i)=>st[i]===g?`<button class="btn" data-i="${i}">${esc(c.t)}</button>`:'').join('');
  $('#rcBody').innerHTML=`<div class="chips" style="margin-bottom:8px">${chips.map((c,i)=>st[i]==null?`<button class="btn" data-i="${i}">${esc(c.t)}</button>`:'').join('')||'<span style="font-size:13px">（全部 分けた！）</span>'}</div>
   <div class="cols"><div><h3>⭕ 決め手になった</h3>${col(1)}</div><div><h3>➖ 決め手にならなかった</h3>${col(0)}</div></div>`;
  $$('#rcBody .btn').forEach(b=>b.onclick=()=>{SFX.tap();const i=+b.dataset.i;st[i]=st[i]==null?1:st[i]===1?0:null;draw()});
  $('#rcOk').disabled=st.some(x=>x==null)};
 ov(`<h2>📋 記録カード</h2><p style="font-size:14px">特徴をタップして分けよう（1回→「なった」、2回→「ならなかった」、3回→もどす）</p><div id="rcBody"></div><div id="rcRes"></div><button class="btn red" id="rcOk" style="width:100%;margin-top:10px" disabled>これで記録する</button>`,true);draw();
 $('#rcOk').onclick=ev=>{const wrong=chips.map((c,i)=>st[i]!==c.g?i:-1).filter(i=>i>=0);
  if(wrong.length){first=false;SFX.bad();$('#rcRes').innerHTML=`<p style="color:#c8323a;font-weight:900">あと ${wrong.length} 枚、分け方を見直そう。<br>ヒント：どの細胞にもあるもの・植物なのにないことがあるものは、決め手にならない。</p>`;return}
  SFX.rule();confetti(100);banner('📋 記録完成！');if(first)earn(30,'rule',ev.clientX,ev.clientY);S.record=true;save();
  $('#rcRes').innerHTML=`<div class="fact">✅ <b>決め手</b>：細胞壁（植物だけ）・葉緑体（植物だけ）・大きな液胞（植物で見られる）。細胞壁が<b>ない</b>なら動物。<br>➖ <b>共通</b>：核・細胞膜（と細胞質）は どちらにもある。葉緑体がないだけ、形だけでは決められない。</div>`;
  $('#rcOk').textContent='🎉 本編クリア！';$('#rcOk').onclick=()=>{ovClose();clearGame()}};
}
function clearGame(){S.cleared=true;save();const after=()=>showClear();if(Z()&&Zukan.mainClear){try{Zukan.mainClear({onClose:after})}catch(e){after()}}else after()}
function showClear(){show('game');R={active:false};
 ov(`<h2>🎉 札あて 完全解決！</h2><div class="judge"><div>🎴 正解 <b>${S.stats.ok}</b> 件　😣 おしい ${S.stats.miss} 件</div><div>🔥 最大連続 <b>${S.maxCombo}</b>　🏆 ${S.score} 点</div><div>❓ 質問した回数 ${S.stats.asked} 回</div></div>
  <div class="tbtns" style="margin:0 auto"><button class="btn red" id="bT">📝 確認テストへ</button>${Z()&&Zukan.openBook?'<button class="btn" id="bBk">📖 図鑑</button>':''}<button class="btn" id="bRb">👹 難事件に再挑戦</button></div>`,true);
 $('#bT').onclick=()=>{ovClose();startTest()};const bk=$('#bBk');if(bk)bk.onclick=()=>{try{Zukan.openBook()}catch(e){}};
 $('#bRb').onclick=()=>{ovClose();S.boss=0;save();bossIntro()}}

/* =========================================================
   確認テスト
   ========================================================= */
let T=null;
function startTest(){const qs=window.Quiz?Quiz.test():[];T={qs,i:0,ans:[]};show('test');if(!qs.length){$('#tbox').innerHTML='<p>問題データが読みこめませんでした。</p>';return}renderQ()}
function renderQ(){
 const q=T.qs[T.i],box=$('#tbox');
 let h=`<div class="qno">第 ${T.i+1} 問 / ${T.qs.length}</div><div class="dots">${T.qs.map((_,i)=>`<i class="${i<T.i?'on':''}"></i>`).join('')}</div><div class="qtext" style="margin-top:8px">${q.q}</div>`;
 if(q.fig)h+=`<div class="fig" style="margin-top:8px">${q.fig}</div>`;
 if(q.t==='choice')h+=`<div class="tchoices">${q.shown.map((c,i)=>`<button class="btn" data-i="${i}">${c}</button>`).join('')}</div>`;
 else if(q.t==='num')h+=`<div style="margin-top:10px;display:flex;gap:8px;align-items:center"><div class="numd" id="nd" style="flex:1"></div><b style="font-size:20px">${esc(q.unit||'')}</b></div><div class="keys" style="margin-top:8px">${['7','8','9','4','5','6','1','2','3','0','.','⌫'].map(k=>`<button class="btn" data-k="${k}">${k}</button>`).join('')}</div><button class="btn pri" id="nOk" style="width:100%;margin-top:8px">けってい</button>`;
 else if(q.t==='order')h+=`<p style="margin:8px 0 4px;font-weight:700">👆 はじめのものから順にタップ</p><div class="ord" id="os"></div><div class="tchoices" id="oi"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="oBack" style="flex:1">↩ 1つもどす</button><button class="btn pri" id="oOk" style="flex:1" disabled>けってい</button></div>`;
 box.innerHTML=h;
 if(q.t==='choice')box.querySelectorAll('.tchoices .btn').forEach(b=>b.onclick=()=>answer(q.shown[+b.dataset.i]));
 if(q.t==='num'){let v='';const nd=$('#nd');box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{SFX.tap();const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(v.length<8&&!(k==='.'&&v.includes('.')))v+=k;nd.textContent=v});$('#nOk').onclick=()=>{if(v!=='')answer(v)}}
 if(q.t==='order'){const pk=[];const draw=()=>{$('#os').innerHTML=pk.map((t,i)=>`<div class="slot"><b>${i+1}</b>${t}</div>`).join('')+(pk.length<q.shown.length?`<div class="slot" style="opacity:.5"><b>${pk.length+1}</b>…</div>`:'');
   $('#oi').innerHTML=q.shown.filter(t=>!pk.includes(t)).map(t=>`<button class="btn" data-t="${esc(t)}">${t}</button>`).join('');
   $('#oi').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{SFX.tap();pk.push(b.dataset.t);draw()});$('#oOk').disabled=pk.length<q.shown.length};
  draw();$('#oBack').onclick=()=>{pk.pop();draw()};$('#oOk').onclick=()=>answer(pk.slice())}
 window.scrollTo(0,0)}
function answer(v){T.ans[T.i]=v;SFX.tap();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}
function finishTest(){
 const qs=T.qs,answers=T.ans;const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmt(S.stats.ms)],['正解した事件',S.stats.ok+'件'],['最大連続',S.maxCombo+'回'],['得点',S.score+'点']];
 if(score>=Math.ceil(qs.length*.7))earn(30,'pass');
 SFX.good(3);if(score===qs.length){confetti(120);banner('💯 満点！')}
 const shown=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　生物の体のつくりと働き　第3回',
  game:'この細胞だれ？ ～植物の細胞と動物の細胞～'+(TEST_ONLY?'（確認テストのみ）':''),name:S.name||window.PLAYER_NAME||'',score,total:qs.length,marks,records:recs,review},showResult);
 S.test={score,total:qs.length,rec:shown};save();showResult()}
function showResult(){show('result');const t=S.test;$('#resBox').innerHTML=t?`確認テスト <b style="font-size:40px;color:#f2b53a">${t.score}</b> / ${t.total} 点`:'';$('#bBook2').classList.toggle('hide',!(Z()&&Zukan.openBook))}
$('#bCard').onclick=()=>{if(S.test&&S.test.rec)SubmitCard.reopen(S.test.rec,()=>{})};
$('#bRetest').onclick=()=>startTest();
$('#bTop').onclick=()=>{if(TEST_ONLY){startTest();return}showTitle()};
$('#bBook1').onclick=$('#bBook2').onclick=()=>{try{Zukan.openBook()}catch(e){}};

/* ---------------- タイトル ---------------- */
function showTitle(){show('title');R={};$('#tRow').innerHTML=['kanadamo','cheek','onion','nerve'].map((id,i)=>tagHTML(id,i)).join('');
 const inProg=hadSave&&(S.caseIdx>0||S.cleared);$('#bCont').classList.toggle('hide',!inProg);$('#bBook1').classList.toggle('hide',!(Z()&&Zukan.openBook));
 if(window.PLAYER_NAME){S.name=String(window.PLAYER_NAME);$('#nameBox').classList.add('hide')}else $('#nameIn').value=S.name||''}
function takeName(){if(!window.PLAYER_NAME)S.name=$('#nameIn').value.trim().slice(0,20)}
$('#bStart').onclick=()=>{ac();takeName();const keep={name:S.name,mute:S.mute};S=JSON.parse(JSON.stringify(DEF));Object.assign(S,keep);hadSave=true;save();startClock();setupCase(CASES[0])};
$('#bCont').onclick=()=>{ac();takeName();save();startClock();if(S.cleared)showClear();else if(S.record)clearGame();else if(S.caseIdx>=CASES.length){S.boss=0;bossIntro()}else setupCase(CASES[S.caseIdx])};
$('#bMute').onclick=()=>{S.mute=!S.mute;save();hud();if(!S.mute)SFX.tap()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);

try{Z()&&Zukan.setup({game:GID,koma:[KOMA]})}catch(e){}
try{Z()&&Zukan.hud&&Zukan.hud($('#hKake'))}catch(e){}
if(window.PLAYER_NAME&&!S.name)S.name=String(window.PLAYER_NAME);
if(TEST_ONLY)startTest();else showTitle();
</script>
