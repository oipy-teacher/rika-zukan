<html lang="ja">
<head>
<meta charset="utf-8">

<title>細胞ぬりえ図鑑 ～生物は細胞でできている～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6e8;--ink:#2d2a26;--red:#e4572e;--org:#f29e38;--yel:#f4cf3c;--grn:#5aa64a;--sky:#4fa3d9;--pnk:#e77fae;
 --hand:'Klee One','Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;--body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Meiryo',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#e6dcc4;color:var(--ink);font-family:var(--body);overflow-x:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden;
 background:linear-gradient(90deg,transparent 20px,rgba(228,87,46,.35) 20px 22px,transparent 22px),repeating-linear-gradient(0deg,transparent 0 31px,rgba(70,110,170,.10) 31px 32px),var(--paper);
 box-shadow:0 0 28px rgba(0,0,0,.14)}
button{font-family:inherit;color:inherit}
.hide{display:none!important}
.scr{display:none;min-height:100vh;flex-direction:column;align-items:stretch;padding:10px 12px 18px 28px}
.scr.on{display:flex}
.btn{font:700 17px/1.2 var(--body);min-height:48px;padding:10px 18px;border:3px solid var(--ink);border-radius:14px 18px 12px 16px;background:#fff;box-shadow:3px 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--yel)}
.btn.grn{background:#bfe3a8}
.btn.sm{min-height:44px;font-size:15px;padding:8px 12px}
.btn:disabled{opacity:.45}
h1,h2,h3{font-family:var(--hand);margin:0}
/* ---- タイトル ---- */
#title{align-items:center;text-align:center;justify-content:center;gap:12px}
.cover{width:100%;max-width:440px;border:4px solid var(--ink);border-radius:10px 16px 12px 18px;background:#fff9e6;padding:18px 14px 16px;box-shadow:5px 6px 0 var(--ink);position:relative}
.cover .emo{font-size:54px;line-height:1}
.cover h1{font-size:clamp(30px,9vw,44px);letter-spacing:.04em;margin-top:4px}
.cover .sub{font-family:var(--hand);font-size:clamp(16px,4.6vw,20px);margin-top:4px;color:#5a4f40}
.cover .lead{font-size:15px;margin:10px 0 0;line-height:1.6}
.namebox{display:flex;align-items:center;gap:8px;justify-content:center;font-size:15px;margin-top:4px}
.namebox input{font:inherit;font-size:17px;padding:8px 10px;border:3px solid var(--ink);border-radius:10px;width:11em;background:#fff}
.tbtns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
/* ---- ゲーム ---- */
#game{padding-top:6px;gap:6px}
.hud{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;font-weight:900;font-size:14px}
.pill{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 8px;white-space:nowrap}
.pill.cmb{background:#ffe7c2}
.pill.warn{background:#ffd4cc;color:#b3261e}
.ibtn{min-width:44px;min-height:44px;flex:none;border:2px solid var(--ink);border-radius:12px;background:#fff;font-size:18px;cursor:pointer}
.spec-name{display:flex;align-items:center;gap:6px;font-family:var(--hand);font-size:17px;min-height:34px}
#snName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spec-name .st{color:#d9a400;font-size:15px}
#stage{position:relative;width:min(100%,420px,calc(100vh - 340px));min-width:260px;aspect-ratio:1;margin:0 auto}
#sv,#macro{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#macro{background:#fff9e6;border:3px dashed #9d8c6e;border-radius:18px}
#macro.zoom{transition:transform .7s ease-in,opacity .7s;opacity:0}
#sv.focus{animation:focus .35s}
@keyframes focus{0%{filter:blur(4px)}100%{filter:none}}
#sv.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
#msg{min-height:50px;background:#fff;border:2px solid var(--ink);border-radius:14px 18px 14px 10px;padding:7px 11px;font-size:15px;line-height:1.5;font-weight:700}
#msg.bad{background:#ffe8e3}
#msg.good{background:#eaf7df}
.prog{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px}
.bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--org) 0 8px,var(--yel) 8px 16px);transition:width .3s}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mag{min-width:62px}
.mag.on{background:#bfe3ff}
.mag small{display:block;font-size:10px;font-weight:700;opacity:.7;line-height:1}
#bStain{font-size:12px;line-height:1.15}
.pal{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cray{width:34px;height:44px;border:2px solid var(--ink);border-radius:8px 8px 4px 4px;cursor:pointer;position:relative;clip-path:polygon(0 30%,50% 0,100% 30%,100% 100%,0 100%)}
.cray.on{transform:translateY(-6px);box-shadow:0 4px 0 var(--ink)}
.auto{font-size:13px;padding:6px 8px;min-height:44px}
.auto.on{background:#ffe7c2}
/* ---- SVG の中 ---- */
.nuc{fill:rgba(80,70,60,.14);stroke:rgba(80,70,60,.28);stroke-width:1;transition:fill 1.4s,stroke 1.4s}
.stained .nuc{fill:#b3306c;stroke:#6e1a42}
.stained .bgc{fill:#f8edf0}
.faint .lineL{opacity:.26;transition:opacity 1.4s}
.faint.stained .lineL{opacity:1}
.pf{fill:none;fill-opacity:.88}
.hc{fill:transparent;stroke:transparent;stroke-width:5;pointer-events:all}
.hb{fill:none;stroke:transparent;pointer-events:stroke;stroke-linecap:round}
.ht{fill:transparent;stroke:transparent;stroke-width:8;pointer-events:all}
.hint{fill:rgba(255,205,0,.38)!important;animation:hint .8s infinite alternate}
@keyframes hint{to{fill:rgba(255,205,0,.08)}}
.spl{transform-box:fill-box;transform-origin:center;animation:spl 1.4s forwards;pointer-events:none}
@keyframes spl{0%{transform:scale(.1);opacity:.9}35%{transform:scale(1);opacity:.8}100%{transform:scale(1.25);opacity:0}}
/* ---- 重ね画面 ---- */
#ov{position:fixed;inset:0;z-index:50;background:rgba(40,34,26,.55);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.panel{width:min(100%,470px);max-height:calc(100vh - 24px);overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:12px 18px 14px 20px;box-shadow:5px 6px 0 var(--ink);padding:16px 16px 18px;text-align:center}
.panel h2{font-size:24px;margin-bottom:6px}
.panel p{line-height:1.6;margin:8px 0}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.choices .btn{text-align:left;font-size:16px;line-height:1.45}
.choices .btn.ng{background:#e6e6e6;opacity:.6}
.choices .btn.ok{background:#bfe3a8}
.card{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px;margin:8px auto;max-width:320px;box-shadow:3px 4px 0 var(--ink)}
.card .big{font-size:52px;line-height:1.1}
.card .nm{font-family:var(--hand);font-size:22px}
.stars{color:#e0a800;font-size:22px;letter-spacing:2px}
.fact{background:#fff4c9;border:2px dashed #c9a02c;border-radius:10px;padding:8px 10px;font-size:15px;text-align:left;line-height:1.6}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.thumb{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px;font-size:13px;text-align:left;line-height:1.4}
.thumb svg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chip{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:8px 12px;font-weight:700;font-size:15px;min-height:44px;cursor:pointer}
textarea{font:inherit;font-size:17px;width:100%;min-height:76px;border:3px solid var(--ink);border-radius:10px;padding:8px;background:#fff;font-family:var(--hand)}
.machine{width:min(100%,300px);display:block;margin:0 auto}
#knob{transform-box:fill-box;transform-origin:center;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
#capG{transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.capT,.capB{transition:transform .5s ease-out}
.open .capT{transform:translate(-22px,-26px) rotate(-28deg)}
.open .capB{transform:translate(18px,8px) rotate(18deg)}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
/* ---- 演出 ---- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font:900 22px var(--body);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;animation:ft 1s forwards;white-space:nowrap}
@keyframes ft{to{transform:translate(-50%,-160%);opacity:0}}
.pt{position:absolute;width:9px;height:14px;border-radius:3px;animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.cf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.bn{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:900 clamp(26px,8vw,40px) var(--hand);color:var(--red);background:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px 18px;box-shadow:4px 5px 0 var(--ink);animation:bn 1.4s forwards;white-space:nowrap}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(.3)}15%{transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.drop{position:absolute;width:18px;height:24px;background:#b3306c;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:drop .8s ease-in forwards}
@keyframes drop{from{transform:translateY(-120px)}to{transform:translateY(0)}}
/* ---- テスト ---- */
#test{gap:10px}
.qno{font-weight:900;font-size:15px}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:8px;border-radius:4px;background:#ddd3bd}
.dots i.on{background:var(--org)}
.qtext{font-size:18px;font-weight:700;line-height:1.6;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 12px}
.fig{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px}
.fig svg{width:100%;height:auto;display:block;max-height:240px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys .btn{font-size:20px}
.numd{font-size:26px;font-weight:900;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:8px 12px;text-align:right;min-height:52px}
.ord{display:flex;flex-direction:column;gap:6px}
.ord .slot{background:#fff;border:2px dashed #9d8c6e;border-radius:10px;padding:8px 10px;min-height:44px;font-weight:700;text-align:left}
.ord .slot b{color:var(--red);margin-right:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>/*@SUBMIT_CARD_BEGIN*/

   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

 R={active:false,mode:'ta'};show('game');
 ov(`<h2>⏳ さいごの試験</h2><p>初めて見る標本 <b>3つ</b> を、<b>${TA_MS/60000*60|0}秒</b>以内に ぬり切れ！<br>倍率も染色も、自分で決める。</p>
  <div class="fact">💡 コツ：低い倍率で全体を見てから、ちょうどいい倍率へ。うすい標本は染色液。</div>
  ${S.taBest?`<p>これまでのベスト：<b>${fmt(S.taBest)}</b></p>`:''}<button class="btn pri" id="bTa">スタート！</button>`);
 $('#bTa').onclick=()=>{SFX.open();ovClose();taStart()};
}
function taStart(){
 const ids=shuffle(TA_POOL).slice(0,3);R={active:false,mode:'ta',ta:ids.map(id=>({id,seed:newSeed()})),taIdx:0,combo:0,taStartAt:Date.now(),taEnd:Date.now()+TA_MS};S.taTries++;save();hud();
 taLoad();
}
function taLoad(){const t=R.ta[R.taIdx];const d=SPEC[t.id];$('#snEmo').textContent=d.emo;$('#snName').textContent=d.name;$('#snStar').textContent='★'.repeat(d.rare);$('#macro').classList.add('hide');$('#sv').style.visibility='';
 beginScope(t.id,t.seed,{mags:[40,100,400],start:40,stain:true})}
function taNext(){SFX.done();R.taIdx++;if(R.taIdx<3){banner('のこり '+(3-R.taIdx)+' 標本！');confetti(20);setTimeout(taLoad,RM?50:700);return}
 const t=Date.now()-R.taStartAt;R.active=false;const best=!S.taBest||t<S.taBest;if(best)S.taBest=t;save();SFX.rare();confetti(120);banner('🏆 試験 合格！');
 setTimeout(()=>{ov(`<h2>🏆 試験 合格！</h2><p style="font-size:20px">タイム <b>${fmt(t)}</b>${best?' <span style="color:#e4572e">ベスト更新！</span>':''}</p><p>初めて見る標本でも、区切りの部屋を見つけられた！</p><button class="btn pri" id="bCl">📒 ぬりえ帳を とじる</button>`);$('#bCl').onclick=()=>{ovClose();clearGame()}},RM?100:1200)}
function taFail(){if(!R.active)return;R.active=false;SFX.fail();
 const left=R.left+R.ta.slice(R.taIdx+1).reduce((a,t)=>a+GEN[t.id](rngF(t.seed)).cells.filter(c=>c.target).length,0);
 ov(`<h2>⏰ 時間切れ</h2><p style="font-size:19px">標本 ${R.taIdx+1}/3 で、<b>あと ${R.left} 部屋</b>だった！${R.taIdx<2?`<br><span style="font-size:15px">（のこりの標本もふくめると あと ${left} 部屋）</span>`:''}</p>
  <p style="font-size:15px">はみ出しや 倍率の切りかえで時間を使っていないかな？</p>
  <div class="tbtns" style="margin:0 auto"><button class="btn pri" id="bRe">🔁 もう1回（新しい標本）</button>${S.taTries>=2?'<button class="btn" id="bSkip">📝 あとにして確認テストへ</button>':''}</div>`);
 $('#bRe').onclick=()=>{ovClose();taStart()};const sk=$('#bSkip');if(sk)sk.onclick=()=>{ovClose();clearGame(true)}}
/* ---- 本編クリア ---- */
function clearGame(skipped){
 R={active:false};S.cleared=true;save();
 const after=()=>showClear(skipped);
 if(Z()&&Zukan.mainClear){try{Zukan.mainClear({onClose:after})}catch(e){after()}}else after();
}
function showClear(skipped){
 show('game');
 ov(`<h2>🎉 ぬりえ帳 かんせい！</h2><div class="card" style="max-width:360px;text-align:left"><div style="font-family:var(--hand);font-size:19px;border-bottom:2px dashed #9d8c6e;padding-bottom:6px;margin-bottom:6px">「${esc(S.heading||'生物の体は、小さな部屋（細胞）でできている')}」</div>
  <div>🖍 ぬった部屋：<b>${S.stats.ok}</b>　はみ出し：<b>${S.stats.spill}</b>回</div><div>🔥 最大コンボ：<b>${S.stats.maxCombo}</b>　⏱ ${fmt(S.stats.ms)}</div><div>⏳ 試験：<b>${S.taBest?fmt(S.taBest):(skipped?'あとで':'—')}</b></div></div>
  <div class="tbtns" style="margin:10px auto 0"><button class="btn pri" id="bT">📝 確認テストへ</button>${Z()&&Zukan.openBook?'<button class="btn" id="bBk">📖 図鑑</button>':''}<button class="btn" id="bNb">📒 ぬりえ帳を見る</button>${skipped?'<button class="btn" id="bTaR">⏳ 試験に再チャレンジ</button>':''}</div>`);
 $('#bT').onclick=()=>{ovClose();startTest()};const bk=$('#bBk');if(bk)bk.onclick=()=>{try{Zukan.openBook()}catch(e){}};
 $('#bNb').onclick=()=>notebook(()=>showClear(skipped));const tr=$('#bTaR');if(tr)tr.onclick=()=>{ovClose();taIntro()};
}
function notebook(back){
 const wasActive=R.active;R.active=false;
 ov(`<h2>📒 ぬりえ帳</h2>${S.heading?`<div style="font-family:var(--hand);font-size:18px">「${esc(S.heading)}」</div>`:''}
  ${S.done.length?`<div class="thumbs">${S.done.map(r=>`<div class="thumb">${thumbSVG(r.id,r.seed,r.colors)}<b>${SPEC[r.id].emo} ${esc(SPEC[r.id].name)}</b> <span class="stars" style="font-size:13px">${STARS(r.stars)}</span><br>${esc(r.memo||'')}</div>`).join('')}</div>`:'<p>まだ何もぬっていないよ</p>'}
  <button class="btn pri" id="bNbC" style="margin-top:12px">とじる</button>`);
 $('#bNbC').onclick=()=>{SFX.tap();ovClose();if(back)back();else{R.active=wasActive;R.lastTick=Date.now()}}}

/* =========================================================
   確認テスト（問題は questions.json → Quiz）
   ========================================================= */
let T=null;
function startTest(){
 const qs=window.Quiz?Quiz.test():[];T={qs,i:0,ans:[]};show('test');
 if(!qs.length){$('#tbox').innerHTML='<p>問題データが読みこめませんでした。</p>';return}
 renderQ()}
function renderQ(){
 const q=T.qs[T.i],box=$('#tbox');
 let h=`<div class="qno">第 ${T.i+1} 問 / ${T.qs.length}</div><div class="dots">${T.qs.map((_,i)=>`<i class="${i<T.i?'on':''}"></i>`).join('')}</div><div class="qtext" style="margin-top:8px">${q.q}</div>`;
 if(q.fig)h+=`<div class="fig" style="margin-top:8px">${q.fig}</div>`;
 if(q.t==='choice')h+=`<div class="choices">${q.shown.map((c,i)=>`<button class="btn" data-i="${i}">${c}</button>`).join('')}</div>`;
 else if(q.t==='num')h+=`<div style="margin-top:10px;display:flex;gap:8px;align-items:center"><div class="numd" id="nd" style="flex:1"></div><b style="font-size:20px">${esc(q.unit||'')}</b></div><div class="keys" style="margin-top:8px">${['7','8','9','4','5','6','1','2','3','0','.','⌫'].map(k=>`<button class="btn" data-k="${k}">${k}</button>`).join('')}</div><button class="btn pri" id="nOk" style="width:100%;margin-top:8px">けってい</button>`;
 else if(q.t==='order')h+=`<p style="margin:8px 0 4px;font-weight:700">👆 はじめのものから順にタップ</p><div class="ord" id="os"></div><div class="choices" id="oi"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="oBack" style="flex:1">↩ 1つもどす</button><button class="btn pri" id="oOk" style="flex:1" disabled>けってい</button></div>`;
 box.innerHTML=h;
 if(q.t==='choice')box.querySelectorAll('.choices .btn').forEach(b=>b.onclick=()=>answer(q.shown[+b.dataset.i]));
 if(q.t==='num'){let v='';const nd=$('#nd');box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{SFX.tick();const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(v.length<8&&!(k==='.'&&v.includes('.')))v+=k;nd.textContent=v});$('#nOk').onclick=()=>{if(v!=='')answer(v)}}
 if(q.t==='order'){const pick=[];const draw=()=>{$('#os').innerHTML=pick.map((t,i)=>`<div class="slot"><b>${i+1}</b>${t}</div>`).join('')+(pick.length<q.shown.length?`<div class="slot" style="opacity:.5"><b>${pick.length+1}</b>…</div>`:'');
   $('#oi').innerHTML=q.shown.filter(t=>!pick.includes(t)).map(t=>`<button class="btn" data-t="${esc(t)}">${t}</button>`).join('');
   $('#oi').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{SFX.tick();pick.push(b.dataset.t);draw()});$('#oOk').disabled=pick.length<q.shown.length};
  draw();$('#oBack').onclick=()=>{pick.pop();draw()};$('#oOk').onclick=()=>answer(pick.slice())}
 window.scrollTo(0,0)}
function answer(v){T.ans[T.i]=v;SFX.tap();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}
function finishTest(){
 const qs=T.qs,answers=T.ans;
 const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmt(S.stats.ms)],['ぬった部屋',S.stats.ok+'部屋'],['はみ出し',S.stats.spill+'回'],['試験タイム',S.taBest?fmt(S.taBest):'—']];
 if(score>=Math.ceil(qs.length*.7))earn(30,'pass');
 SFX.done();if(score===qs.length){confetti(120);banner('💯 満点！')}
 const shown=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　生物の体のつくりと働き　第1回',
  game:'細胞ぬりえ図鑑 ～生物は細胞でできている～'+(TEST_ONLY?'（確認テストのみ）':''),
  name:S.name||window.PLAYER_NAME||'',score,total:qs.length,marks,records:recs,review},showResult);
 S.test={score,total:qs.length,rec:shown};save();showResult();
}
function showResult(){
 show('result');const t=S.test;
 $('#resBox').innerHTML=t?`確認テスト <b style="font-size:40px;color:#e4572e">${t.score}</b> / ${t.total} 点`+(S.heading&&!TEST_ONLY?`<div style="font-family:var(--hand);margin-top:6px">「${esc(S.heading)}」</div>`:''):'';
 $('#bBook2').classList.toggle('hide',!(Z()&&Zukan.openBook))}
$('#bCard').onclick=()=>{if(S.test&&S.test.rec)SubmitCard.reopen(S.test.rec,()=>{})};
$('#bRetest').onclick=()=>startTest();
$('#bTop').onclick=()=>{if(TEST_ONLY){startTest();return}showTitle()};
$('#bBook1').onclick=$('#bBook2').onclick=()=>{try{Zukan.openBook()}catch(e){}};

/* ---------------- タイトル ---------------- */
function showTitle(){
 show('title');R={active:false};
 const inProg=hadSave&&(S.round>0||S.cleared||S.stats.ok>0);
 $('#bCont').classList.toggle('hide',!inProg);
 $('#bBook1').classList.toggle('hide',!(Z()&&Zukan.openBook));
 if(window.PLAYER_NAME){S.name=String(window.PLAYER_NAME);$('#nameBox').classList.add('hide')}else $('#nameIn').value=S.name||'';
}
function takeName(){if(!window.PLAYER_NAME)S.name=$('#nameIn').value.trim().slice(0,20)}
$('#bStart').onclick=()=>{ac();takeName();const keep={name:S.name,mute:S.mute};S=JSON.parse(JSON.stringify(DEF));Object.assign(S,keep);hadSave=true;save();startRound()};
$('#bCont').onclick=()=>{ac();takeName();save();
 if(S.round<ROUNDS.length)startRound();else if(!S.rule)headingStep();else if(!S.cleared)taIntro();else showClear(!S.taBest)};
$('#bNote').onclick=()=>{SFX.tap();notebook()};
$('#bMute').onclick=()=>{S.mute=!S.mute;save();hud();if(!S.mute)SFX.tap()};
document.addEventListener('visibilitychange',()=>{R.lastTick=Date.now();if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);

/* ---------------- 起動 ---------------- */
drawPal();
try{Z()&&Zukan.setup({game:GID,koma:[KOMA]})}catch(e){}
try{Z()&&Zukan.hud&&Zukan.hud($('#hKake'))}catch(e){}
if(window.PLAYER_NAME&&!S.name)S.name=String(window.PLAYER_NAME);
if(TEST_ONLY){startTest()}else showTitle();
</script>
</body>
</html>
