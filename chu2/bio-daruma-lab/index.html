<!--
 ==========================================================================
 だるまさん反応ラボ ～刺激から反応までの時間～（bio-daruma-lab / chu2-seibutsu-34）
 ねらい: 刺激を受けてから反応するまでには、信号が神経と中枢を通る分だけ時間がかかる。
         手をつなぐ人数が増えると、遅れは人数に比例して伸びる（1人あたり約0.25秒）。
 役割: 確認用（反応時間を測る体験の後）。封印は無い（予想用の封印を読むコマでもない）。
 --------------------------------------------------------------------------
 画風: 型染め（型紙で白抜きした朱・藍・黄土）。布の地（生成り）に、型紙で抜いた白い線（白抜き）、
   限られた3色のべた、青海波・鮫小紋の地紋。すべて canvas と CSS で描く。外部画像なし。
 1. 世界とメタファー: 夕焼けの路地の先にある校庭。染めた手ぬぐいの帯が「時間のものさし」になり、
    鬼の「だ・る・ま・さ・ん・が・こ・ろ・ん・だ」が型染めの判子になって流れてくる。
    手をつないだ子どもたちの列を長おしで前へ進め、はなすと止まる。止まった合図は手から手へ
    1人ずつ伝わり、1人ごとに約0.25秒おくれる（遅れの棒が1人ぶんずつ伸びる）。
    鬼がふり向いて見たとき、1人でも動いていたらアウト。おくれを記録帳から予想して、早めにはなす。
 2. 配色: 生成りの布 #EFE5D0／藍 #1F3A5F／朱 #C8412E／黄土 #C9973F。紫・水色のグラデは使わない。
 3. 書体: 見出し・数字＝Potta One（筆で抜いた型文字の太さ）／本文＝Zen Kaku Gothic New。
 4. 画面: PC・iPad横＝左に藍の「記録帳」の袖、右に横長の校庭（鬼は右端の銀杏の下）。
         スマホ・iPad縦＝上に鬼と銀杏、下から子どもの列が上っていく。手ぬぐいの帯は上端。
 5. HUD: 朱の荷札（もどる）、藍の手ぬぐい札（第何戦）、記録帳のグラフ、1人の体の中の信号の道すじ。
 6. 音: 木琴（わらべうたの音階）・拍子木・太鼓・鈴を WebAudio で合成。ミュートあり。
 7. ハマる仕組み: 1回1〜2分ですぐやり直し（周回）／ニアミスは本当の差（あと0.12秒）／前回の自分との比べ合い。
    かけらは「次の人数での遅れを記録から予想して当てた」ときだけ（止まるのが速いだけでは出ない）。
 ==========================================================================
-->

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

: 0.08, "ex": "1人あたり約0.25秒なので、6人では0.25×6＝約1.5秒。", "level": 1}, {"id": "chu2-bio-daruma-lab-q005", "koma": "chu2-seibutsu-34", "t": "choice", "kind": "judge", "q": "手をにぎられてから次の人の手をにぎるまでに、時間がかかるのはなぜ？", "choices": ["信号が感覚神経・中枢（脊髄と脳）・運動神経を通り、脳で判断してから命令が出るから", "手の皮ふが、刺激を受けとるのに時間がかかるから", "信号が人から人へ伝わるたびに弱くなっていくから", "筋肉がのびて骨をおすのに時間がかかるから"], "ex": "刺激の信号は神経と中枢を通って伝わり、脳でどうするか決めてから命令が出る。その分の時間がかかる。", "level": 1}, {"id": "chu2-bio-daruma-lab-q006", "koma": "chu2-seibutsu-34", "t": "order", "kind": "judge", "q": "手をにぎられたので、次の人の手をにぎった。1人の体の中で信号が伝わる順に並べよう。", "items": ["皮ふ", "感覚神経", "脊髄", "脳", "運動神経", "手の筋肉"], "ex": "皮ふの信号は感覚神経→脊髄→脳へ。脳の命令は脊髄→運動神経→手の筋肉へ伝わる（脊髄は行きも帰りも通る）。", "level": 1}, {"id": "chu2-bio-daruma-lab-q007", "koma": "chu2-seibutsu-34", "t": "order", "kind": "judge", "q": "「カン！」という音を聞いて、すぐ立ち止まった。信号が伝わる順に並べよう。", "items": ["耳", "感覚神経", "脳", "脊髄", "運動神経", "足の筋肉"], "ex": "耳は頭部の感覚器官なので、信号は感覚神経から脊髄を通らずに直接脳へ。命令は脳→脊髄→運動神経→足の筋肉。", "level": 1}, {"id": "chu2-bio-daruma-lab-q008", "koma": "chu2-seibutsu-34", "t": "choice", "kind": "graph", "q": "図のように、落ちてくるものさしをつかむ実験をした。Pさんは10cm、Qさんは20cmの目盛りのところをつかんだ。正しいものは？", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 200\" font-family=\"sans-serif\">\u003crect width=\"300\" height=\"200\" fill=\"#EFE5D0\"/>\u003crect x=\"130\" y=\"14\" width=\"40\" height=\"176\" fill=\"#fff\" stroke=\"#1F3A5F\" stroke-width=\"2\"/>\u003cg stroke=\"#1F3A5F\" stroke-width=\"1.5\">\u003cline x1=\"130\" y1=\"20\" x2=\"150\" y2=\"20\"/>\u003cline x1=\"130\" y1=\"28\" x2=\"142\" y2=\"28\"/>\u003cline x1=\"130\" y1=\"36\" x2=\"142\" y2=\"36\"/>\u003cline x1=\"130\" y1=\"44\" x2=\"142\" y2=\"44\"/>\u003cline x1=\"130\" y1=\"52\" x2=\"142\" y2=\"52\"/>\u003cline x1=\"130\" y1=\"60\" x2=\"150\" y2=\"60\"/>\u003cline x1=\"130\" y1=\"68\" x2=\"142\" y2=\"68\"/>\u003cline x1=\"130\" y1=\"76\" x2=\"142\" y2=\"76\"/>\u003cline x1=\"130\" y1=\"84\" x2=\"142\" y2=\"84\"/>\u003cline x1=\"130\" y1=\"92\" x2=\"142\" y2=\"92\"/>\u003cline x1=\"130\" y1=\"100\" x2=\"150\" y2=\"100\"/>\u003cline x1=\"130\" y1=\"108\" x2=\"142\" y2=\"108\"/>\u003cline x1=\"130\" y1=\"116\" x2=\"142\" y2=\"116\"/>\u003cline x1=\"130\" y1=\"124\" x2=\"142\" y2=\"124\"/>\u003cline x1=\"130\" y1=\"132\" x2=\"142\" y2=\"132\"/>\u003cline x1=\"130\" y1=\"140\" x2=\"150\" y2=\"140\"/>\u003cline x1=\"130\" y1=\"148\" x2=\"142\" y2=\"148\"/>\u003cline x1=\"130\" y1=\"156\" x2=\"142\" y2=\"156\"/>\u003cline x1=\"130\" y1=\"164\" x2=\"142\" y2=\"164\"/>\u003cline x1=\"130\" y1=\"172\" x2=\"142\" y2=\"172\"/>\u003cline x1=\"130\" y1=\"180\" x2=\"150\" y2=\"180\"/>\u003c/g>\u003cg fill=\"#1F3A5F\" font-size=\"12\">\u003ctext x=\"152\" y=\"24\">0\u003c/text>\u003ctext x=\"152\" y=\"104\">10\u003c/text>\u003ctext x=\"152\" y=\"184\">20\u003c/text>\u003c/g>\u003cg fill=\"#C8412E\" font-size=\"15\" font-weight=\"700\">\u003ctext x=\"20\" y=\"104\">Pさん→\u003c/text>\u003ctext x=\"20\" y=\"184\">Qさん→\u003c/text>\u003c/g>\u003ctext x=\"186\" y=\"60\" font-size=\"13\" fill=\"#1F3A5F\">0の目盛りを\u003c/text>\u003ctext x=\"186\" y=\"78\" font-size=\"13\" fill=\"#1F3A5F\">指の間に置き\u003c/text>\u003ctext x=\"186\" y=\"96\" font-size=\"13\" fill=\"#1F3A5F\">落ちたら\u003c/text>\u003ctext x=\"186\" y=\"114\" font-size=\"13\" fill=\"#1F3A5F\">すぐつかむ\u003c/text>\u003ctext x=\"186\" y=\"150\" font-size=\"12\" fill=\"#1F3A5F\">[cm]\u003c/text>\u003c/svg>", "choices": ["Pさんのほうが、刺激を受けてから反応するまでの時間が短い", "Qさんのほうが、刺激を受けてから反応するまでの時間が短い", "つかんだ位置と、反応するまでの時間は関係ない", "2人とも、反応するまでの時間は0秒である"], "ex": "反応が遅いほど、つかむまでにものさしが長く落ちる。短い位置でつかんだPさんのほうが反応が速い。", "level": 2}, {"id": "chu2-bio-daruma-lab-q009", "koma": "chu2-seibutsu-34", "t": "choice", "kind": "judge", "q": "神経を信号が伝わる速さは秒速約50m。1人の神経の長さを約2mとすると、神経を伝わる時間は約0.04秒になる。1人あたり約0.25秒の遅れの大部分をしめるのは？", "choices": ["脳で「にぎられた」と判断し、命令を出すまでの時間", "感覚神経を信号が伝わる時間", "運動神経を信号が伝わる時間", "皮ふが刺激を受けとる時間"], "ex": "0.25秒のうち神経を伝わるのは約0.04秒。残りの大部分は、脳で判断して命令を出すのにかかる時間。", "level": 2}, {"id": "chu2-bio-daruma-lab-q010", "koma": "chu2-seibutsu-34", "t": "choice", "kind": "method", "q": "手をつなぐ実験で、1人あたりの時間をなるべく正確に求める工夫として適切なものは？", "choices": ["人数を多くして全体の時間を測り、何回かくり返して平均を人数でわる", "2人だけで1回測り、その値をそのまま使う", "いちばん速かった1回の記録だけを使う", "ストップウォッチを押す人を、毎回ちがう人にかえる"], "ex": "1人あたりの時間は短くて測りにくい。人数を多くし、何回か測って平均をとると誤差が小さくなる。", "level": 2}, {"id": "chu2-bio-daruma-lab-q011", "koma": "chu2-seibutsu-34", "t": "choice", "kind": "judge", "q": "同じメンバーで手をつなぐ実験を何回かくり返すと、1人あたりの時間は短くなっていった。その理由として正しいものは？", "choices": ["脳での判断に慣れて、命令を出すまでが速くなったから", "神経を信号が伝わる速さが速くなったから", "神経の長さが短くなったから", "皮ふが刺激を受けとらなくなったから"], "ex": "神経を伝わる速さは変わらない。慣れて脳での判断→命令が速くなるので、1人あたりの時間が短くなる。", "level": 2}, {"id": "chu2-bio-daruma-lab-q012", "koma": "chu2-seibutsu-34", "t": "choice", "kind": "term", "q": "脳と脊髄のように、受けとった信号をもとに判断して命令を出すところをまとめて何という？", "choices": ["中枢神経", "末しょう神経", "感覚器官", "運動器官"], "ex": "脳と脊髄は中枢神経。感覚神経や運動神経は、そこから枝分かれした末しょう神経。", "level": 2}, {"id": "chu2-bio-daruma-lab-q013", "koma": "chu2-seibutsu-34", "t": "num", "kind": "calc", "q": "1人あたり0.25秒かかる人たちが、12人手をつないだ。合図が最後の人まで伝わるのにかかる時間は約何秒？", "ans": 3, "unit": "秒", "tol": 0.05, "ex": "遅れは人数に比例する。0.25×12＝3.0秒。", "level": 2}, {"id": "chu2-bio-daruma-lab-q014", "koma": "chu2-seibutsu-34", "t": "choice", "kind": "judge", "q": "だるまさんがころんだで、手をつないだ8人のいちばん前の人が、鬼がふり向くのを見てから止まった。うしろの人ほどどうなる？", "choices": ["合図が手から手へ伝わるのに時間がかかるので、うしろの人ほど遅れて止まる", "全員が同時に止まる", "うしろの人ほど早く止まる", "いちばんうしろの人だけが止まれない"], "ex": "1人ごとに刺激→判断→反応の時間がかかるので、うしろの人ほど止まるのが遅れる。", "level": 2}]};

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

function nextCall(){if(!G)return;G.callNo++;const rd=G.rd;
 let n=0;if(rd.type==='prac')n=G.pracStage>=1?1:0;else if(rd.ns)n=rd.ns[G.callNo%rd.ns.length];else n=rd.n||0;G.n=n;
 G.ti=[];for(let i=0;i<n;i++)G.ti.push(Math.round((MEAN+rnd(-.03,.03))*100)/100);
 G.chant=(rd.type==='sound'||rd.type==='light')?mkHum(rd):mkChant(rd.type==='prac'?{tempo:'prac'}:rd);
 G.t=-READY;G.release=null;G.walked=0;G.wk=new Array(n+1).fill(0);G.stopT=[];G.res=null;G.turnT=0;G.oniFace=0;G.holding=false;G.needUp=pointerDown;G.stopped=false;G.cueShown=false;G.revealed=false;
 G.predThis=false;G.predLocked=false;
 if(rd.type==='chant'||rd.type==='prac'){
  if(rd.type==='prac'&&n===1){G.predThis=true;G.bar=0}
  else if(rd.pred===2){G.predThis=true}
  else if(rd.pred===1&&G.callNo===0){G.predThis=true;G.bar=Math.max(.1,G.bar)}
  if(!G.predThis&&G.measured!=null){G.barMode='rec';G.bar=G.measured}

  if(rd.type==='chant'&&rd.pred===0&&G.measured==null)G.barMode='none';
 }else G.barMode='none';
 G.phase=G.predThis?'pred':'ready';
 syncButtons();updHud();
}

function releaseIn(){G&&(G.needUp=false);$('holdBtn').classList.remove('on');if(!G||!G.holding)return;G.holding=false;

  cvPid=e.pointerId;try{cv.setPointerCapture(e.pointerId)}catch(_){}return}

/* ---------- 1フレームの進行 ---------- */
function update(dt){if(!G||G.paused)return;const ch=G.chant,rd=G.rd;
 if(G.phase==='ready'){G.t+=dt;if(G.t>=0){G.t=0;G.phase='chant'}}
 else if(G.phase==='chant'){
  if(G.prac&&G.walked<.05&&!G.holding&&G.t>.25){}else G.t+=dt;
  if(G.prac&&G.holding&&G.release==null&&G.t>ch.look-.02){G.t=ch.look-.02;G.pracHold=(G.pracHold||0)+dt;if(G.pracHold>.1&&!G.pracMsg){G.pracMsg=1;cheer('いまだ！ 指を はなす！')}}
  ch.syl.forEach((s,k)=>{if(!s.said&&G.t>=s.t){s.said=true;if(s.hum)SFX.hum();else{SFX.syl(k);if(k===9){SFX.taiko(.7)}}bumpStrip(k)}});
  if(ch.cue!=null&&!G.cueShown&&G.t>=ch.cue){G.cueShown=true;if(ch.cueType==='sound')SFX.kan();else{flash=.55;flashC='rgba(201,151,63,.55)'}}
  const turnStart=ch.cue!=null?ch.cue:ch.tF;
  if(G.t>=turnStart){G.oniFace=clamp((G.t-turnStart)/(ch.look-turnStart),0,1)}
  if(G.holding&&G.t>=0&&!G.stopped){G.walked+=V*dt;G.stepT=(G.stepT||0)+dt;if(G.stepT>.28){G.stepT=0;SFX.step()}}
  for(let i=0;i<=G.n;i++){const moving=G.walked>0&&(i===0?(!G.stopped&&G.holding):(G.release==null?G.holding:G.t<G.stopT[i-1]));if(moving)G.wk[i]+=V*dt}
  if(G.release!=null){for(let i=0;i<G.n;i++){if(!G['sq'+i]&&G.t>=G.stopT[i]){G['sq'+i]=1;SFX.squeeze(i)}}
   if(G.n>0&&!G.revealed&&G.t>=G.stopT[G.n-1]){G.revealed=true;reveal()}}
  if(G.t>=ch.look){if(G.prac&&(G.holding||G.release==null)){}else{judge()}}
 }else if(G.phase==='turn'){G.turnT+=dt;G.oniFace=1;if(G.turnT>1.25){G.phase='result';G.resT=0;showToast()}}
 else if(G.phase==='result'){G.resT+=dt;G.anim=Math.max(0,G.anim-dt*Math.max(3,G.anim*2));if(G.resT>(G.res&&G.res.long?2.6:1.7))afterCall()}
 else if(G.phase==='back'){G.turnT+=dt;G.oniFace=clamp(1-G.turnT/.4,0,1)}
 if(G.phase!=='chant'&&G.phase!=='turn'){for(let i=0;i<G.wk.length;i++)G.wk[i]=lerp(G.wk[i],G.phase==='result'||G.phase==='pred'||G.phase==='ready'?G.wk[0]:G.wk[i],dt*2)}
}
function reveal(){/* 遅れの棒が全部そろった瞬間：予想と実測をくらべる */
 const act=G.stopT[G.n-1]-G.release;G.act=act;const p=G.stopT[G.n-1];
 if(G.predThis&&!G.prac){SV.preds++;G.predsR++;const tol=.1+.01*G.n,diff=Math.abs(G.predVal-act);
  if(diff<=tol){SV.hits++;G.hitsR++;G.predHit=true;bigHit('予想的中！',G.n+'人で '+act.toFixed(2)+'秒（予想 '+G.predVal.toFixed(2)+'秒）');try{window.Zukan&&Zukan.earn(15,'hit',{x:W/2,y:H*.35})}catch(e){}
   if(G.rd.rule||G.r>=7){if(!SV.rule){SV.rule=true;G.ruleNow=true;try{window.Zukan&&Zukan.earn(30,'rule',{x:W/2,y:H*.45})}catch(e){}}}}
  else{G.predHit=false;pop('おしい！ 差 '+diff.toFixed(2)+'秒',L.needle+act*L.pps,L.strip.y+L.strip.h+30,{c:P.ai,s:.9})}
  save()}
 SV.rec.push({n:G.n,d:Math.round(act*100)/100});if(SV.rec.length>80)SV.rec.shift();
 if(G.rd.type==='chant'&&!G.rd.ns&&G.measured==null){G.measured=Math.round(act*100)/100}
 if(G.prac){G.measured=act}
 save()}
function judge(){const ch=G.chant,look=ch.look;G.phase='turn';G.turnT=0;SFX.look();
 let caught=[];const leaderMoving=G.holding&&!G.stopped;
 if(leaderMoving){for(let i=0;i<=G.n;i++)caught.push(i)}else{for(let i=0;i<G.n;i++)if(G.release==null||G.stopT[i]>look)caught.push(i+1)}
 if(G.walked<=.02){caught=[]}
 const lastStop=G.release==null?null:(G.n?G.stopT[G.n-1]:G.release);
 const res={caught,margin:lastStop==null?null:look-lastStop,walked:G.walked};
 if(ch.cue!=null&&G.release!=null&&G.release>=ch.cue){res.react=G.release-ch.cue}
 if(ch.cue!=null&&G.release!=null&&G.release<ch.cue)res.flying=true;
 if(G.prac&&caught.length){caught=[];res.caught=[];res.forgive=true}
 G.res=res;
 if(!caught.length&&G.walked>.02){G.steps+=G.walked;G.safe++;G.anim=0;
  const tight=res.margin!=null&&res.margin<=.3&&!res.flying;const waste=res.margin!=null&&res.margin>1;
  if(!waste){G.combo++;SV.maxCombo=Math.max(SV.maxCombo,G.combo)}
  SFX.safe(G.combo);shake=RM?0:(tight?10:5);flash=tight?.45:.25;flashC=tight?'rgba(201,151,63,.5)':'rgba(239,229,208,.5)';vib(tight?[20,30,40]:25);
  burst(W/2,L.yard.y+L.yard.h*.4,tight?60:30);
  pop('+'+G.walked.toFixed(1)+'歩',kidPos(0).x,kidPos(0).y-kidPos(0).s*1.3,{c:P.shu,s:1.2});
  if(G.combo>=2)pop('れんぞくセーフ ×'+G.combo,W/2,L.yard.y+L.yard.h*.2,{c:G.combo>=5?P.shu:P.ai,s:1+Math.min(1,G.combo*.12),big:1});
  if(tight)pop('ピタッ！',W/2,L.yard.y+L.yard.h*.55,{c:P.ki,s:1.8,big:1});
 }else if(caught.length){G.caught++;const lost=Math.min(G.steps,2);G.steps-=lost;res.lost=lost;G.anim=G.walked+lost;
  if(G.combo>=3)res.almost=G.combo;G.combo=0;SFX.out();shake=RM?0:14;flash=.4;flashC='rgba(200,65,46,.45)';vib([60,40,60])}
 if(res.react!=null){(G.rd.type==='sound'?SV.react.s:SV.react.l).push(Math.round(res.react*100)/100);G.reacts.push(res.react);const A=G.rd.type==='sound'?SV.react.s:SV.react.l;if(A.length>40)A.shift()}
 if(res.flying)G.flying++;
 G.walkedLast=G.walked;G.walked=0;
 save()}
function showToast(){const r=G.res,t=$('toast');if(!r)return;let a='',b='',cls='';
 if(!r.walked||r.walked<=.02){a='すすまなかった';b='<b>長おし</b>で すすもう';r.long=0}
 else if(r.caught.length){cls='shu';a='アウト！';
  if(G.holding||(r.caught.length===G.n+1&&G.release==null))b='指をはなす前に 鬼が見た！';
  else{const late=G.stopT[G.n-1]-G.chant.look;b='最後の <b>'+r.caught.length+'人</b> が うごいてた（あと <b>'+late.toFixed(2)+'秒</b> 早く はなせば セーフ）'}
  if(r.react!=null)b='反応 <b>'+r.react.toFixed(2)+'秒</b>… 鬼が見るまでに 止まれなかった';
  if(r.almost)b+='<br>あと1回で ×'+(r.almost+1)+' だった！';b+='<br>2歩もどる'}
 else{a=r.forgive?'セーフ（れんしゅう）':'セーフ！';
  if(r.flying)b='合図の前に 止まった（フライング）。反応は測れない';
  else if(r.react!=null)b='あなたの反応 <b>'+r.react.toFixed(2)+'秒</b>'+(G.rd.type==='sound'?'（耳→脳→足）':'（目→脳→足）');
  else if(G.n>0){b=G.n+'人の遅れ <b>'+G.act.toFixed(2)+'秒</b>　1人あたり <b>'+(G.act/G.n).toFixed(2)+'秒</b>';if(r.margin!=null)b+='<br>全員ストップ → 鬼が見る <b>'+r.margin.toFixed(2)+'秒</b>前'+(r.margin>1?'（早すぎ… もったいない）':'')}
  else if(r.margin!=null)b='鬼が見る <b>'+r.margin.toFixed(2)+'秒</b>前に ストップ';
  if(r.forgive)b='鬼が見のがしてくれた！ ほんとうは <b>早めに</b> はなす';}
 if(G.predThis&&G.n>0&&!G.prac&&G.act!=null){b='予想 '+G.predVal.toFixed(2)+'秒 → 実際 <b>'+G.act.toFixed(2)+'秒</b>'+(G.predHit?'　的中！':'')+'<br>'+b;r.long=1}
 t.innerHTML='<div class="t1 '+cls+'">'+a+'</div><div class="t2">'+b+'</div>';t.classList.remove('on');void t.offsetWidth;t.classList.add('on')}

 if(G.prac){G.pracStage++;if(G.pracStage>=2){G.phase='done';if(PR_ON&&window.Guide){try{Guide.tutorialClear()}catch(e){}}else{if(SV.next<1){SV.next=1;save()}G=null;startRound(1)}return}G.phase='back';G.turnT=0;setTimeout(()=>{if(G&&G.prac)nextCall()},450);return}

function kidPos(i){const g=yardGeo(),n=G?G.n:0,a=prog();const extra=G?(G.wk[i]||0):0;const tot=G&&G.prac?30:TOTAL;
 if(land){const span=g.fy-g.by,gap=Math.min(clamp(L.yard.h*.14,36,90)*.8,span/Math.max(1,n));const y=g.fy-i*gap,dep=(g.fy-y)/(g.fy-g.hz);const s=Math.min(clamp(L.yard.h*.2,44,120),Math.max(40,gap*2.4))*(1-dep*.4);
  const x=lerp(g.x0,g.x1,clamp(a+(extra-(G?G.wk[0]||0:0)+(G?G.walked:0))/tot,0,1))+i*gap*.62;return {x,y,s}}
 const s0=clamp(L.yard.h*.17,40,96)*(n>8?.8:1);const aa=clamp(a+(extra-(G?G.wk[0]||0:0)+(G?G.walked:0))/tot,0,1);const y=lerp(g.y0,g.y1,aa);const dep=clamp((g.y0-y)/(g.y0-g.hz),0,1);const s=s0*(1-dep*.35);
 const gap=Math.min(s*.78,(W-40)/Math.max(1,n+1));const x=W/2-(n*gap)/2+i*gap;return {x,y,s}}

  q.shown.forEach((c,k)=>{const b=mk(c,String(k+1));b.dataset.v=c;b.onclick=()=>{if(pk.indexOf(c)>=0)return;pk.push(c);SFX.click();draw();if(pk.length===q.items.length)setTimeout(()=>answer(pk.slice()),250)};box.appendChild(b)});
  const rs=document.createElement('button');rs.className='fuda sm';rs.style.marginTop='12px';rs.textContent='やり直す';rs.onclick=()=>{pk.length=0;draw()};
  const hint=document.createElement('div');hint.style.cssText='font-size:15px;margin-bottom:6px';hint.textContent='順に タップして並べよう';A.appendChild(hint);A.appendChild(slots);A.appendChild(box);A.appendChild(rs);draw()}
 else{const w=document.createElement('div');w.innerHTML='<div class="numRow"><input id="numIn" inputmode="decimal" autocomplete="off"><b>'+esc(q.unit||'')+'</b></div><div style="text-align:center"><button class="fuda shu" id="numOk">これで決める</button></div>';A.appendChild(w);
  $('numOk').onclick=()=>{const v=String($('numIn').value).replace(/[０-９．]/g,c=>c==='．'?'.':String.fromCharCode(c.charCodeAt(0)-0xFEE0));if(!v.trim())return;answer(v)}}}
function answer(a){const q=T.qs[T.i];T.ans[T.i]=a;const ok=Quiz.check(q,a);ok?SFX.safe(3):SFX.out();
 const d=document.createElement('div');d.className='qfb';d.innerHTML='<div class="mk '+(ok?'o':'x')+'">'+(ok?'〇':'×')+'</div><div class="ex">'+(ok?'':'<b>正解：</b>'+esc(Quiz.answer(q))+'<br>')+esc(q.ex||'')+'</div><button class="fuda shu">'+(T.i+1<T.qs.length?'次の問題へ':'結果へ')+'</button>';
 $('app').appendChild(d);d.querySelector('.fuda').onclick=()=>{d.remove();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}}
function finishTest(){const qs=T.qs,answers=T.ans;const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const tm=window.GAME_MODE==='test';const name=window.PLAYER_NAME||SV.name||$('nameIn').value.trim()||'';const stars=SV.stars.slice(1).reduce((a,b)=>a+b,0);
 const done=()=>{T=null;if(tm){showScene('test');$('qNo').textContent='おわり';$('qText').textContent='おつかれさまでした。提出カードは先生に見せよう。';$('qArea').innerHTML='';$('qFig').hidden=true;const b=document.createElement('button');b.className='fuda shu';b.style.marginTop='16px';b.textContent='もう一度 確認テスト';b.onclick=startTest;$('qArea').appendChild(b)}else openBook()};
 if(!window.SubmitCard){done();return}
 SubmitCard.show({gameId:GAME_ID,grade:'chu2',koma:[KOMA],unit:'中2理科　生物の体のつくりと働き　第34回',game:'だるまさん反応ラボ ～刺激から反応までの時間～'+(tm?'（確認テストのみ）':''),
  name,score,total:qs.length,marks,
  records:tm?[['モード','確認テストだけ']]:[['クリアした勝負',Math.max(0,Math.min(8,SV.next-1))+' / 8'],['集めた★',stars+' / 24'],['予想的中',SV.hits+' / '+SV.preds],['反応（音）の平均',SV.react.s.length?avgOf(SV.react.s).toFixed(2)+'秒':'—']],
  review},done)}

/* ================= ループ ================= */
let last=performance.now(),HELP=null;
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;clock+=dt;
 try{if(scene==='play')update(dt);else demoStep(dt);stepFx(dt);render()}catch(e){console.error(e)}
 requestAnimationFrame(frame)}
addEventListener('resize',()=>{resize()});
/* ================= はじまり ================= */
window.GAME_ID=GAME_ID;
resize();muteUI();
try{window.Zukan&&Zukan.setup({game:GAME_ID,koma:[KOMA]})}catch(e){}
try{if(window.Guide){Guide.setup({theme:{bg:'#EFE5D0',fg:'#1F3A5F',accent:'#C8412E',accentText:'#EFE5D0',font:'"Potta One",sans-serif',bodyFont:'"Zen Kaku Gothic New",sans-serif',radius:0,texture:'paper',line:'#1F3A5F',dim:'rgba(20,40,64,.5)',shadow:'7px 7px 0 #1F3A5F',outline:'#EFE5D0',hand:'#EFE5D0',handLine:'#1F3A5F'},
  sfx:k=>{if(k==='done'||k==='clear')SFX.safe(2);else if(k==='step')SFX.click();else if(k==='open')SFX.stamp()},muted:()=>SV.mute});
 Guide.tutorialButton('#btnHow',()=>{ac();startPractice()});
 HELP=Guide.help({rules:['**長おし** で進む・**はなす** と止まる','鬼が見たとき、1人でも **動いていたらアウト**（2歩もどる）','手をはなすと、止まれの合図は **手から手へ1人ずつ** 伝わる。1人ごとに少しおくれる','「鬼が見る」印が **遅れの棒の先** に来たら はなすとピッタリ','予想の棒が記録どおりなら **予想的中**（かけら）'],
  onOpen:()=>{if(G)G.paused=true},onClose:()=>{if(G&&$('ov').hidden)G.paused=false},replay:'tutorial',offset:{x:62},attention:true});HELP.hide()}}catch(e){console.error(e)}
window.__dl={get G(){return G},get SV(){return SV},startRound,startTest,nextCall,press,releaseIn,setBar,lockPred,openBook,finale,get L(){return L}};
if(window.GAME_MODE==='test'){startTest()}else{initTitle()}
requestAnimationFrame(frame);
})();
