<!--
 ==========================================================================
 夜を越える一株 ～光合成と呼吸～（bio-day-night / chu2-seibutsu-10・確認用）
 ねらい: 光合成と呼吸は、気体の出入りに関して逆向きの関係にある。
         昼は光合成と呼吸の両方をしていて光合成の方がさかん（葉全体では二酸化炭素を取り入れ酸素を出す）、
         夜は呼吸だけ（酸素を取り入れ二酸化炭素を出す）。光が弱いと出入りがほとんど見られない。
 --------------------------------------------------------------------------
 v2（2026-09-27 ゼロから作り直し・割り当て表 80行目どおり）
 1. 世界とメタファー: 影絵芝居。うしろから照らされた紙の幕に、地平線の一株が逆光のシルエットで立つ。
    幕の空は、昼は夕焼け色の金、夜は藍。空を漂う気体の分子を指でつまんで、気孔が光った葉へわたし、
    葉から出てきた気体の泡をはじいて外へ出す。昼は二酸化炭素を入れて酸素を出す（光合成で養分が根にたまる）、
    夜は酸素を入れて二酸化炭素を出す（呼吸だけ・養分が減る）。取り違えると はね返されて しおれる。
    昼のうちに養分をためて、夜の呼吸で使い切らないように備える（99 Nights 型の昼夜サバイバル）。
    幕間ごとに、次の時間帯の「気体の出入りの矢印」を切り絵で置いて予想してから幕を上げる。
    道のり＝1日目の朝から5日目の朝へ（昼4回・夜4回、最後は長い冬の夜）。集める＝育った葉の影絵帳。
 2. 配色: 背景 #1A1A24（夜の幕）／主 #F6AE2D（逆光の金）／差し #2F4858（藍の空）。影は #111118。
    色が付くのは分子の原子（O #E4572E・C #3a3d46）と、根にたまる養分の粒（金）だけ。
 3. 書体: Shippori Antique（見出し・本文とも。生物の単元の他ゲームと重ならない）。
 4. 画面の組み方: 全画面の canvas が影絵の幕。PC・iPad横＝横長の地平線の中央に株、左右に空が広がる。
    スマホ・iPad縦＝空を上に広く、株を縦に大きく、地面の下（黒）に根と計器。canvas は devicePixelRatio 対応。
 5. HUD: 影絵の札（黒い切り絵の板に金の文字）。もどる＝左上の黒い札。養分・しおれ・葉の枚数は地面の中の札。
    光合成と呼吸の大きさは空の「はたらきの札」に棒で、葉全体の出入りは株の横の大きな切り絵の矢印で。
 6. 音: 影絵芝居の拍子木・木の実のからころ・低い笛（WebAudio 合成の木質の音）。
 7. ハマる仕組み: 主⑩「5日目の朝まで終われません」（道のりの帯）／副⑲昼夜サイクル・⑧数字が増える（根の養分）。
    かけら: 幕間の矢印が正しい・連続で正しい気体をわたせたとき・昼と夜の出入りのきまりを見つけたときだけ。
 ==========================================================================
-->

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と

     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+

  function reviewHTML(r){

    document.body.appendChild(ov);

  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){

    all:load,

})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

0", "t": "order", "q": "植物の1日の気体の出入りを、夜明け前から順に並べよう。", "items": ["夜明け前：酸素をとり入れ、二酸化炭素を出す", "晴れた昼：二酸化炭素をとり入れ、酸素を出す", "夕方の弱い光：出入りがほとんど見られない", "夜：酸素をとり入れ、二酸化炭素を出す"], "ex": "夜は呼吸だけ（二酸化炭素を出す）→明るくなると光合成がさかんになり二酸化炭素をとり入れる→光が弱まるとつり合い→また夜。", "fig": null, "kind": "method", "level": 2}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

$('bGrow').onclick=()=>{ac();if(!G||G.over)return;const cost=growCost();if(G.N<cost||G.leaves.length>=MAXLEAF)return;G.N-=cost;const idx=G.leaves.length;const sh=nextShape();SV.shapes[idx]=sh;const l=newLeaf(idx);G.leaves.push(l);SFX.grow();save();
 const geo=plantGeo();const q=geo.L[idx];fxText(q.cx,q.cy-30,'新しい葉：'+LEAF_NAMES[sh],'#111118',17,true);capShow('葉がふえると 昼の光合成がふえる。でも <b>呼吸もふえて</b>、夜に使う養分もふえる',4500);updHud()};
$('bMute').onclick=()=>{SV.mute=!SV.mute;save();updHud();if(!SV.mute)SFX.click()};
let capTm=0;function capShow(h,ms){$('capT').innerHTML=h;$('cap').classList.add('on');clearTimeout(capTm);capTm=setTimeout(()=>$('cap').classList.remove('on'),ms||3000)}

/* ================= はじめの早送り（導入） ================= */
function demo(){SV.demo=1;save();G={ph:0,P:{k:'day',L:1,day:1,len:9},t:0,len:9,N:START_N,wilt:0,leaves:[0,1].map(i=>Object.assign(newLeaf(i),{born:0})),mols:[],fx:[],grains:[],combo:0,paused:false,over:false,demo:1,stat:{fed:0,wrong:0,miss:0}};
 show('scPlay');for(let i=0;i<12;i++)spawnMol(i%2?'co2':'o2',true);$('panel').style.visibility='hidden';capShow('晴れた一日を 早送り。<b>昼</b>は光合成で 根に養分がたまる…',4000);G.demoStep=0}
function demoUpdate(dt){G.t+=dt;G.geo=plantGeo();const P=G.P;
 if(P.k==='day'){G.N+=dt*9;if(Math.random()<dt*6){const i=Math.random()<.5?0:1;G.grains.push({i,t:0,d:1,down:1})}if(G.t>=G.len){G.P={k:'night',L:0,day:1,len:7};G.t=0;G.len=7;document.body.classList.add('night');SFX.hyoshi();capShow('<b>夜</b>は呼吸だけ。養分を使い、気体の矢印が <b>ひっくり返る</b>',4000)}}
 else{G.N=Math.max(0,G.N-dt*8);if(Math.random()<dt*4)G.grains.push({i:Math.random()<.5?0:1,t:0,d:1,down:0});if(G.t>=G.len){G.over=true;$('panel').style.visibility='';document.body.classList.remove('night');G=null;interlude(0)}}
 G.mols.forEach(o=>{o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=o.va*dt});G.grains.forEach(p=>{p.t+=dt});G.grains=G.grains.filter(p=>p.t<p.d);G.fx.forEach(f=>{f.t+=dt});G.fx=G.fx.filter(f=>f.t<f.d)}

/* ================= タイトル ================= */
let TW=390,TH=844,TT=0;
function titleResize(){orient();const r=$('scTitle').getBoundingClientRect();TW=Math.max(300,r.width);TH=Math.max(400,r.height);fit(tcv,tg,TW,TH)}
function titleFrame(dt){TT+=dt;const c=tg,t=TT;c.setTransform(DPR,0,0,DPR,0,0);const land=TW>TH*1.05,gy=land?TH*.78:TH*.8;
 const gr=c.createLinearGradient(0,0,0,gy);gr.addColorStop(0,'#F4CD7C');gr.addColorStop(.55,'#F6AE2D');gr.addColorStop(1,'#E0772A');c.fillStyle=gr;c.fillRect(0,0,TW,gy);
 const sx=land?TW*.79:TW*.5,sy=land?gy-TH*.12:gy-TH*.1,sr=land?TH*.3:TW*.42;
 const hg=c.createRadialGradient(sx,sy,sr*.6,sx,sy,sr*2.2);hg.addColorStop(0,'rgba(255,240,200,.75)');hg.addColorStop(1,'rgba(255,230,160,0)');c.fillStyle=hg;c.fillRect(0,0,TW,gy);
 c.beginPath();c.arc(sx,sy,sr,0,TAU);c.fillStyle='#FFE7B0';c.fill();
 // 紙の目
 c.save();c.globalAlpha=.8;c.fillStyle=c.createPattern(PAPER,'repeat');c.fillRect(0,0,TW,gy);c.restore();
 // 遠い山
 c.fillStyle='#3b2416';c.globalAlpha=.55;c.beginPath();c.moveTo(0,gy);for(let x=0;x<=TW;x+=TW/10)c.lineTo(x,gy-TH*.04-Math.abs(Math.sin(x*.01+2))*TH*.07);c.lineTo(TW,gy);c.fill();c.globalAlpha=1;
 // 地面
 c.fillStyle=SH;c.beginPath();c.moveTo(0,gy);for(let x=0;x<=TW;x+=12)c.lineTo(x,gy-4-Math.abs(Math.sin(x*.19))*7);c.lineTo(TW,TH);c.lineTo(0,TH);c.fill();
 // 一株（大きく）
 const S=land?TH*.2:TW*.26,cx=sx+(land?0:0),H=land?TH*.55:TH*.42,sway=RM?0:Math.sin(t*.8)*S*.04;c.strokeStyle=SH;c.lineWidth=S*.1;c.lineCap='round';c.beginPath();c.moveTo(cx,gy);c.quadraticCurveTo(cx,gy-H*.5,cx+sway,gy-H);c.stroke();
 [0,1,2,3,4].forEach(i=>{const f=.2+.18*i,side=i%2?1:-1,bx=cx+sway*f*f,by=gy-H*f,ang=(side>0?-.35:Math.PI+.35)+Math.sin(t*1.2+i)*.05*(RM?0:1),len=S*(1-.08*i);c.save();c.translate(bx,by);c.rotate(ang);c.shadowColor='rgba(255,236,190,.9)';c.shadowBlur=8;leafPath(c,[0,1,4,3,5][i],len,len*.3);c.fillStyle=SH;c.fill();c.restore()});
 c.fillStyle=SH;c.beginPath();c.ellipse(cx+sway,gy-H-6,S*.07,S*.14,0,0,TAU);c.fill();
 // 空を漂う分子
 for(let i=0;i<8;i++){const u=((t*.03+i/8)%1),x=(i*197%100)/100*TW,y=gy*(.15+.7*((i*53%100)/100))+Math.sin(t+i)*8;molDraw(c,i%2?'co2':'o2',x+Math.sin(u*TAU)*20,y,6,t*.5+i,'rgba(17,17,24,.7)')}
 // 地面の中の養分
 c.save();c.shadowColor='#F6AE2D';c.shadowBlur=6;const rr=srand(5);for(let i=0;i<60;i++){const a=rr()*TAU,r=Math.sqrt(rr());c.fillStyle='#F6AE2D';c.fillRect(cx+Math.cos(a)*r*S*.5-1.5,gy+TH*.07+Math.sin(a)*r*TH*.04-1.5,3,3)}c.restore()}
function initTitle(){if(window.PLAYER_NAME)$('nameIn').value=window.PLAYER_NAME;else if(SV.name)$('nameIn').value=SV.name;
 $('btnCont').hidden=!(hasSave()&&(SV.ph>0||SV.demo));$('btnBookT').hidden=!Z();$('btnStart').textContent=(hasSave()&&SV.ph>0)?'はじめから':'はじめる'}
let arm=false;
$('btnStart').onclick=()=>{ac();SV.name=$('nameIn').value.trim();
 if(hasSave()&&SV.ph>0&&!arm){arm=true;$('btnStart').textContent='本当に はじめから？（記録が消える）';setTimeout(()=>{arm=false;initTitle()},3500);return}
 if(arm){const nm=SV.name,mu=SV.mute;SV=freshSave();SV.name=nm;SV.mute=mu;arm=false}save();SFX.hyoshi();demo()};
$('btnCont').onclick=()=>{ac();SV.name=$('nameIn').value.trim()||SV.name;save();SFX.click();openCal()};
$('btnBookT').onclick=()=>{try{Z().openBook()}catch(e){}};$('btnBookC').onclick=()=>{try{Z().openBook()}catch(e){}};

/* ================= こよみ（1日目の朝 → 5日目の朝） ================= */
function openCal(){G=null;ovClose();show('scCal');const svg=$('calSvg'),r=svg.getBoundingClientRect(),W=Math.max(300,r.width),H=Math.max(200,r.height);svg.setAttribute('viewBox','0 0 '+W+' '+H);
 const land=W>H;let s='';const n=PH.length;const pts=[];
 for(let i=0;i<=n;i++){const u=i/n;pts.push(land?[W*(.06+.88*u),H*(.55-Math.sin(u*Math.PI*2)*.12)]:[W*(.5+Math.sin(u*Math.PI*2.2)*.28),H*(.95-.82*u)])}
 s+='<path d="M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+'" fill="none" stroke="rgba(243,227,192,.3)" stroke-width="3" stroke-dasharray="6 8"/>';
 for(let i=0;i<n;i++){const P=PH[i],a=pts[i],b=pts[i+1],m=[(a[0]+b[0])/2,(a[1]+b[1])/2],done=i<SV.ph,cur=i===SV.ph&&!SV.done,R=Math.min(W,H)*(land?.05:.045);
  s+='<g opacity="'+(done||cur?1:.4)+'"><circle cx="'+m[0]+'" cy="'+m[1]+'" r="'+R+'" fill="'+(P.k==='day'?(P.cloudy?'#B39B72':'#F6AE2D'):'#2F4858')+'" stroke="'+(cur?'#F6AE2D':'#111118')+'" stroke-width="'+(cur?4:2)+'"/>'+
   (P.k==='day'?'':'<circle cx="'+(m[0]+R*.25)+'" cy="'+(m[1]-R*.2)+'" r="'+(R*.55)+'" fill="#F3E3C0"/><circle cx="'+(m[0]+R*.45)+'" cy="'+(m[1]-R*.35)+'" r="'+(R*.5)+'" fill="#2F4858"/>')+
   (done?'<text x="'+m[0]+'" y="'+(m[1]+R*.35)+'" text-anchor="middle" font-size="'+R+'" fill="#111118">'+(SV.arrows[i]?'✓':'・')+'</text>':'')+
   '<text x="'+(m[0]+(land?0:R*1.5))+'" y="'+(m[1]+(land?R*1.9:R*.35))+'" text-anchor="'+(land?'middle':'start')+'" font-size="'+Math.max(13,R*.55)+'" fill="#F3E3C0" font-family="Shippori Antique,serif">'+KAN[P.day-1]+'日目 '+(P.k==='day'?'昼・'+P.sky:(P.boss?'冬の夜':P.long?'長い夜':'夜'))+'</text></g>'}
 const last=pts[n];s+='<g><circle cx="'+last[0]+'" cy="'+last[1]+'" r="'+Math.min(W,H)*.06+'" fill="'+(SV.done?'#FFE7B0':'none')+'" stroke="#F6AE2D" stroke-width="3" stroke-dasharray="'+(SV.done?'0':'5 5')+'"/><text x="'+last[0]+'" y="'+(last[1]-Math.min(W,H)*.06-10)+'" text-anchor="middle" font-size="18" fill="'+(SV.done?'#111118':'#F6AE2D')+'" font-family="Shippori Antique,serif">五日目の朝</text></g>';
 svg.innerHTML=s;$('clR').innerHTML='越えた夜 '+SV.nights+' / 4<br>葉の影絵帳 '+new Set(SV.shapes).size+' / 8';
 $('btnGo').textContent=SV.done?'1日目から もう一度':SV.ph===0?'1日目の朝へ':'つづける（'+KAN[PH[SV.ph].day-1]+'日目の'+(PH[SV.ph].k==='day'?'昼':'夜')+'）';$('btnTestC').hidden=!SV.done;$('btnBookC').hidden=!Z()}
$('btnGo').onclick=()=>{ac();SFX.hyoshi();if(SV.done){SV.ph=0;SV.snap={N:START_N,n:2,wilt:0};SV.snaps={0:SV.snap};SV.fails=0;save()}
 G=null;interlude(SV.ph)};
$('btnTestC').onclick=()=>{ac();SFX.click();startTest()};
$('btnAlb').onclick=()=>{SFX.click();const have=new Set(SV.shapes);
 ovOpen('<div class="mk"><div class="ey">葉の影絵帳</div><h2>育った葉 '+have.size+' / 8</h2><p>夜を越えるたび、葉を広げるたびに、新しい形の葉がひらく。</p><div class="alb">'+LEAF_NAMES.map((nm,k)=>have.has(k)?'<div>'+leafSVG(k)+esc(nm)+'</div>':'<div class="no">'+leafSVG(-1)+'？？？</div>').join('')+'</div><div class="btns"><button class="kb" id="aC">とじる</button></div></div>');$('aC').onclick=()=>{SFX.click();ovClose()}};
function leafSVG(k){if(k<0)return '<svg viewBox="0 0 100 70"><path d="M20 35 Q50 10 84 35 Q50 60 20 35Z" fill="none" stroke="#666" stroke-dasharray="4 4"/></svg>';
 const c=document.createElement('canvas');c.width=200;c.height=140;const x=c.getContext('2d');x.translate(30,70);leafPath(x,k,140,40);x.fillStyle=SH;x.fill();return '<svg viewBox="0 0 100 70"><image href="'+c.toDataURL()+'" x="0" y="0" width="100" height="70"/></svg>'}

/* ================= オーバーレイ ================= */
function ovOpen(h){$('ov').innerHTML=h;$('ov').hidden=false}
function ovClose(){$('ov').hidden=true;$('ov').innerHTML=''}

/* ================= 確認テスト ================= */
let T=null;
function startTest(){ovClose();G=null;show('scTest');if(!window.Quiz){$('qText').textContent='問題データがありません';return}T={qs:Quiz.test(),i:0,ans:[]};renderQ()}
function renderQ(){const q=T.qs[T.i];$('qNo').textContent=(T.i+1)+' / '+T.qs.length;$('qText').textContent=q.q;const f=$('qFig');if(q.fig){f.innerHTML=q.fig;f.hidden=false}else{f.innerHTML='';f.hidden=true}
 const A=$('qArea');A.innerHTML='';$('scTest').scrollTop=0;const mk=(c,lab)=>{const b=document.createElement('button');b.className='kb';b.innerHTML='<span class="L">'+lab+'</span><span></span>';b.lastChild.textContent=c;return b};
 if(q.t==='choice'){const box=document.createElement('div');box.className='qch';q.shown.forEach((c,k)=>{const b=mk(c,'壱弐参四伍'[k]);b.onclick=()=>answer(c);box.appendChild(b)});A.appendChild(box)}
 else if(q.t==='order'){const pk=[];const sl=document.createElement('div');sl.className='ordS';const box=document.createElement('div');box.className='qch';
  const draw=()=>{sl.innerHTML=q.items.map((_,k)=>'<div>'+(k+1)+'. '+(pk[k]?esc(pk[k]):'')+'</div>').join('');box.querySelectorAll('.kb').forEach(b=>b.classList.toggle('done',pk.indexOf(b.dataset.v)>=0))};
  q.shown.forEach((c,k)=>{const b=mk(c,String(k+1));b.dataset.v=c;b.onclick=()=>{if(pk.indexOf(c)>=0)return;pk.push(c);SFX.click();draw();if(pk.length===q.items.length)setTimeout(()=>answer(pk.slice()),250)};box.appendChild(b)});
  const hint=document.createElement('p');hint.style.cssText='font-size:15px;color:#F6AE2D;margin:10px 0 0';hint.textContent='上から順に タップして並べよう';
  const rs=document.createElement('button');rs.className='kb sm';rs.style.marginTop='14px';rs.textContent='やり直す';rs.onclick=()=>{pk.length=0;draw()};
  A.appendChild(hint);A.appendChild(sl);A.appendChild(box);A.appendChild(rs);draw()}
 else{const w=document.createElement('div');w.className='qch';w.innerHTML='<div class="numR"><input id="numIn" inputmode="decimal"><b>'+esc(q.unit||'')+'</b></div><button class="kb" id="numOk">これで決める</button>';A.appendChild(w);$('numOk').onclick=()=>answer($('numIn').value)}}
function answer(a){const q=T.qs[T.i];T.ans[T.i]=a;const ok=Quiz.check(q,a);ok?SFX.dawn():SFX.wrong();
 const d=document.createElement('div');d.className='qfb';d.innerHTML='<div class="mkx" style="color:'+(ok?'#F6AE2D':'#E8927C')+'">'+(ok?'○':'×')+'</div><div class="ex">'+(ok?'':'<b>正解：</b>'+esc(Quiz.answer(q))+'<br>')+esc(q.ex||'')+'</div><button class="kb">'+(T.i+1<T.qs.length?'次の問題へ':'結果へ')+'</button>';
 $('app').appendChild(d);d.querySelector('.kb').onclick=()=>{d.remove();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}}
function finishTest(){const qs=T.qs,answers=T.ans;const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const tm=window.GAME_MODE==='test';const name=window.PLAYER_NAME||SV.name||$('nameIn').value.trim()||'';
 const done=()=>{T=null;if(tm){show('scTest');$('qText').textContent='おつかれさまでした。提出カードは 先生に見せよう。';$('qArea').innerHTML='';$('qFig').hidden=true;const b=document.createElement('button');b.className='kb';b.style.marginTop='16px';b.textContent='もう一度 確認テスト';b.onclick=startTest;$('qArea').appendChild(b)}else openCal()};
 if(!window.SubmitCard){done();return}
 SubmitCard.show({gameId:GAME_ID,grade:'chu2',koma:[KOMA],unit:'中2理科　生物の体のつくりと働き　第10回',game:'夜を越える一株 ～光合成と呼吸～'+(tm?'（確認テストのみ）':''),
  name,score,total:qs.length,marks,
  records:tm?[['モード','確認テストだけ']]:[['越えた夜',SV.nights+' / 4'],['幕間の矢印が正しかった',SV.arrows.filter(Boolean).length+' / 8'],['正しくわたした気体',SV.fed+'回'],['育った葉の形',new Set(SV.shapes).size+' / 8']],
  review},done)}

/* ================= ループ ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000))*(window.__SPEED||1);last=now;
 try{if(scene==='play'&&G){if(G.demo&&!G.over)demoUpdate(dt);else if(!G.paused&&!G.over)update(dt);else if(G.over&&!G.demo){G.geo=plantGeo()}if(G)render()}else if(scene==='title')titleFrame(dt)}catch(e){console.error(e)}
 requestAnimationFrame(frame)}
let rzT=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{orient();if(scene==='play')layoutPlay();if(scene==='title')titleResize();if(scene==='cal')openCal()},80)});
/* ================= はじまり ================= */
window.GAME_ID=GAME_ID;
try{window.Zukan&&Zukan.setup({game:GAME_ID,koma:[KOMA]})}catch(e){}
window.__db={get G(){return G},get SV(){return SV},startPhase,interlude,startTest,openCal,mode,lightNow,plantGeo,feed(i,k){const geo=plantGeo();const o={k,x:0,y:0};G.mols.push(o);feed(geo.L[i],o)},release(i){const lf=G.leaves[i];if(lf.bub)releaseBub(lf,i,plantGeo(),false,0,-30)}};
if(window.GAME_MODE==='test'){startTest()}else{show('scTitle');initTitle()}
requestAnimationFrame(frame);
})();
