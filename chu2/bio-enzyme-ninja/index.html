<title>酵素ニンジャ ～消化酵素～</title>
<!--
 ==========================================================================
 酵素ニンジャ ～消化酵素～（bio-enzyme-ninja / chu2-seibutsu-19）役割: なし
 ねらい: 消化酵素は種類ごとに働く相手の物質が決まっている（アミラーゼ＝デンプン、ペプシン＝タンパク質、
        リパーゼ＝脂肪。すい液は3つすべてに働く消化酵素をふくむ。胆汁は消化酵素をふくまない。
        小腸の壁の消化酵素が 麦芽糖など をブドウ糖にする）
 --------------------------------------------------------------------------
 遊びの核: スワイプ斬り（Fruit Ninja型）。飛んでくる物質・食物を、手元の「消化酵素の刀」でなぞって斬る。
   刀が相手に合えば 鎖がばらけて小さな粒になり墨がはじける。合わない刀は「カキン」とはじかれ、連がとぎれ命が減る。
   飛ぶ速さはゆっくりで、腕前ではなく「刀の選び方」で決まる。切ってはいけない物（持っている刀では分解できない物・
   もう分解されきった粒）は見送る＝「見切り」。
 画風: 水墨画（墨のにじみ・かすれた筆・余白・朱の落款）。別のデザイナー＝水墨画家。
 1. 世界とメタファー: 墨の忍者屋敷。消化管の順に「口の間→胃の間→すい臓の間→胆のうの間→すい液の間→
    小腸の壁の間」と間を抜け、各間で消化酵素の巻物（刀）を授かる。最奥は墨龍の間（ボス）。
    道のり＝屋敷の見取り図を1間ずつ／集める＝酵素の巻物・相性表の升目／美麗＝墨のにじみの水墨画。
 2. 配色: 地 #EEE9DD（和紙）／主 #1A1A1A（墨）／差し #B7282E（朱）。刀の筋だけ 薄墨・黄土・金泥 を使う。
 3. 書体: 見出し＝Yuji Boku（筆文字）／本文＝BIZ UDPMincho。
 4. 画面の組み方: PC・iPad横＝横長の座敷を物質が放物線で横切る。相性表の掛け軸は右上。
    スマホ・iPad縦＝縦に高く飛び上がる。刀の鍔は画面下、相性表は左上の札をタップで開く。
 5. HUD: 左上「◀ もどる」の黒漆の札、上の掛け札（間の名・消化の数・命・線香の残り）、右上の朱の落款（かけら）。
 6. 音: 琴の音（都節の音階）・太鼓の「どん」・刀のはじかれる金属音・風を切る音（WebAudioで合成）。
 7. 相性表: 刀×物質の升目。試し斬り（巻きわら）で自分で斬って ◯✕ を埋める。墨龍の間では この表だけが頼り。
 ==========================================================================
-->

 background:var(--ink);color:#F3EDDF;border:0;border-radius:2px;box-shadow:inset 0 0 0 2px #F3EDDF,inset 0 0 0 4px var(--ink),3px 4px 0 rgba(183,40,46,.9)}

/* 刀の鍔（下の帯） */
#bar{position:absolute;z-index:12;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:0 8px calc(8px + env(safe-area-inset-bottom));pointer-events:none}

.bl.on .tb{transform:translateY(-8px) scale(1.08);box-shadow:0 0 0 4px var(--red),0 0 0 8px rgba(238,233,221,.9),0 8px 14px rgba(26,26,26,.35)}

.bl.dry{opacity:.35}

body.cmp .bl .tb{width:46px;height:46px}

.tt{position:absolute;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:12px}

/* 見取り図のボタン */
#mapUi{position:absolute;z-index:12;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 10px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(238,233,221,.95) 30%)}
/* 巻物のオーバーレイ */
#ov{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,36,30,.32)}
.scr{position:relative;width:min(640px,94vw);max-height:88vh;overflow:auto;padding:26px 26px 22px;background:#F4EFE3;
 box-shadow:0 12px 30px rgba(26,26,26,.35);border-top:14px solid #2a241c;border-bottom:14px solid #2a241c;animation:unroll .35s ease-out}
@keyframes unroll{from{clip-path:inset(0 0 92% 0)}to{clip-path:inset(0 0 0 0)}}
.scr::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--red),#8e1e22)}
.scr .kk{font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--red)}

.scr .card small{display:block;font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--red)}
.scr .card b{font-family:var(--hd);font-weight:400;font-size:20px}
.scr .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.scr .stars{font-family:var(--hd);font-size:44px;color:var(--red);letter-spacing:.1em;text-align:center;line-height:1}

.scr .rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}

.scr .rec div b{display:block;font-family:var(--hd);font-weight:400;font-size:24px}

.qfb .in{background:#F4EFE3;border-top:12px solid #2a241c;border-bottom:12px solid #2a241c;width:min(560px,94vw);padding:14px 18px;text-align:center;box-shadow:0 12px 30px rgba(26,26,26,.35)}
.qfb .mk{font-family:var(--hd);font-size:80px;line-height:1;color:var(--ink)}

@media (max-width:560px){
 #plate{left:8px;right:8px;transform:none;max-width:none;min-width:0;top:calc(60px + env(safe-area-inset-top));padding:1px 8px 4px}
 #plate b{font-size:17px}#plate .row{font-size:12px;gap:10px}

}
.scr .stars span{display:inline-block;animation:stamp .42s cubic-bezier(.2,1.7,.4,1) both}
.scr .stars span.off{color:rgba(26,26,26,.2)}
.scr .stars span:nth-child(2){animation-delay:.42s}.scr .stars span:nth-child(3){animation-delay:.84s}
@keyframes stamp{0%{transform:scale(3.4) rotate(-28deg);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
#plQ{display:inline-block}#plQ.pp{animation:pp .38s cubic-bezier(.2,1.8,.4,1)}@keyframes pp{0%{transform:scale(2)}100%{transform:scale(1)}}
body.land .tt h1{animation:dropL 1s cubic-bezier(.2,1.4,.4,1) both}body:not(.land) .tt h1{animation:dropP 1s cubic-bezier(.2,1.4,.4,1) both}

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}

        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;

  function cardHTML(r){

    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

/* ================= 描く道具 ================= */
function hexP(x,y,r){ctx.beginPath();for(let i=0;i<6;i++){const t=Math.PI/6+i*TAU/6;ctx.lineTo(x+Math.cos(t)*r,y+Math.sin(t)*r)}ctx.closePath()}

function comb(u,tails,sc){sc=sc||1;const w=u*.95*sc,h=u*3.4*sc;ctx.fillStyle='rgba(26,26,26,.78)';ctx.beginPath();ctx.moveTo(-w,-h/2);ctx.lineTo(0,-h/2);ctx.lineTo(0,h/2);ctx.lineTo(-w,h/2);ctx.closePath();ctx.fill();

 switch(k){
  case 'st':{const n=o.n||6,d=u*1.62;ctx.beginPath();for(let i=0;i<n;i++){const px=(i-(n-1)/2)*d,py=(i%2?1:-1)*u*.3;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ink(u*.18,.5);
   for(let i=0;i<n;i++){const px=(i-(n-1)/2)*d,py=(i%2?1:-1)*u*.3;hexP(px,py,u*.9);ctx.fillStyle='rgba(26,26,26,.1)';ctx.fill();ink(u*.2)}break}

  case 'pr':case 'pp':case 'a1':{const n=k==='pr'?6:k==='pp'?3:1,d=u*1.62;ctx.beginPath();for(let i=0;i<n;i++){const px=(i-(n-1)/2)*d,py=Math.sin(i*1.3)*u*.5;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ink(u*.3);
   for(let i=0;i<n;i++){const px=(i-(n-1)/2)*d,py=Math.sin(i*1.3)*u*.5;bead(px,py,u*.72,k==='a1'?.2:BEAD[(i+(o.seed||0))%6])}break}
  case 'fa':ctx.save();ctx.translate(-u*1.6,0);comb(u,3);ctx.restore();break;
  case 'fxa':ctx.beginPath();ctx.moveTo(-u*1.6,0);for(let k2=1;k2<=6;k2++)ctx.lineTo(-u*1.6+k2*u*.6,(k2%2?-1:1)*u*.28);ink(u*.3);ctx.beginPath();ctx.arc(-u*1.7,0,u*.34,0,TAU);ctx.fillStyle=INK;ctx.fill();break;

 openOv(`<h2>酵素の<em>巻物</em></h2><p style="font-size:14px">授かった巻物（${Object.keys(SV.scrolls).length} / 6）</p><div class="rolls">${h}</div><div class="btns"><button class="pb" id="oC">とじる</button></div>`);$('oC').onclick=closeOv};
$('btnTbl').onclick=()=>{const bs=BORD.filter(b=>SV.scrolls[b]);const cs=CORD;const cell=(b,c)=>{const v=SV.tbl[b+'|'+c];return v?'<b style="color:'+(v==='o'?RED:v==='t'?OCH:INK)+'">'+tblMark(v)+'</b>':'<span style="opacity:.3">？</span>'};
 const n=bs.reduce((a,b)=>a+cs.filter(c=>SV.tbl[b+'|'+c]).length,0);
 openOv(`<h2>相性<em>表</em></h2><p style="font-size:14px">自分で斬って うめた升目（${n}）。◯＝分解する　✕＝はじかれる　△＝細かくするだけ</p><div style="overflow:auto"><table style="border-collapse:collapse;font-size:15px;min-width:420px;width:100%">
 <tr><th></th>${cs.map(c=>'<th style="border:1px solid #1a1a1a;padding:4px;font-size:13px">'+COLS[c]+'</th>').join('')}</tr>${bs.map(b=>'<tr><th style="border:1px solid #1a1a1a;padding:4px 8px;font-family:var(--hd);font-weight:400;text-align:left">'+BL[b].nm+'</th>'+cs.map(c=>'<td style="border:1px solid #1a1a1a;text-align:center;font-family:var(--hd);font-size:22px">'+cell(b,c)+'</td>').join('')+'</tr>').join('')}</table></div>
 <div class="btns"><button class="pb" id="oC">とじる</button></div>`);$('oC').onclick=closeOv};
$('btnBookM').onclick=()=>{try{Z().openBook()}catch(e){}};$('btnGachaM').onclick=()=>{try{Z().openGacha()}catch(e){}};$('btnTestM').onclick=()=>startTest();
$('bBack').onclick=()=>{actx();if(scene==='title'){try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}return}
 if(G)G.pause=true;$('bkSub').textContent=scene==='test'?'確認テストは 次はさいしょから。屋敷の進み具合は保存されています。':scene==='map'?'進み具合は保存されます。タイトルにもどります。':'進み具合は保存されます（斬りぬけた間と★はそのまま。この間は 次に はじめから）。';
 $('bkGo').textContent=scene==='map'?'タイトルへ':'見取り図へ';$('scrBack').hidden=false};
$('bkNo').onclick=()=>{$('scrBack').hidden=true;if(G&&$('ov').hidden)G.pause=false};
$('bkGo').onclick=()=>{$('scrBack').hidden=true;closeOv();save();leaveGuide();if(scene==='map'){G=null;setScene('title');initTitle()}else{T=null;openMap()}};

/* ================= タイトル ================= */
function initTitle(){G=null;if(window.PLAYER_NAME)$('nameIn').value=window.PLAYER_NAME;else if(SV.name)$('nameIn').value=SV.name;
 $('btnCont').hidden=!hasSave();$('btnBookT').hidden=!Z();$('btnStart').textContent=hasSave()?'はじめから':'はじめる'}
let startArm=false;
$('btnStart').onclick=()=>{actx();SV.name=$('nameIn').value.trim();
 if(hasSave()&&!startArm){startArm=true;$('btnStart').textContent='本当に？（記録が消える）';setTimeout(()=>{startArm=false;initTitle()},3500);return}
 if(startArm){const nm=SV.name,mu=SV.mute;SV=fresh();SV.name=nm;SV.mute=mu;startArm=false}
 save();SFX.drum();
 if(window.Guide)Guide.intro(INTRO).then(()=>startRoom(0));else startRoom(0)};
$('btnCont').onclick=()=>{actx();SV.name=$('nameIn').value.trim()||SV.name;save();SFX.tap();openMap()};
$('btnBookT').onclick=()=>{try{Z().openBook()}catch(e){}};

/* ================= さいごの確認テスト ================= */
/* ================= 遊び方の案内（Guide）・れんしゅう（2026-09-28 仕上げ） ================= */
const INTRO={title:'第19回　酵素ニンジャ',learn:'消化酵素は 種類ごとに **働く相手が決まっている**（アミラーゼ＝デンプン、ペプシン＝タンパク質、リパーゼ＝脂肪）',how:'飛んでくる物質を 指で **なぞって斬る**。合う刀に **持ちかえて** から',gesture:'swipe'};
let HELP=null,COACH=null;
function stopCoach(){if(COACH&&COACH.stop){try{COACH.stop()}catch(e){}}COACH=null}
function leaveGuide(){stopCoach();const g=G;if(g&&g.practice){g.practice=false;try{Guide.tutorialEnd()}catch(e){}}}
document.body.appendChild($('scrBack'));
function flyT(){if(!G)return null;const o=G.objs.filter(o=>!o.dead&&!o.fixed&&o.y<H-(L.barH||80)-40&&o.y>(L.top||80)).sort((a,b)=>a.vy-b.vy)[0];return o?{x:o.x,y:o.y,r:o.r+16,el:cv}:null}
function mkPractice(replay){let PG=null;return {label:'れんしゅう中',
 start:()=>{closeOv();startRoom(0,{practice:true});PG=G},
 steps:[
  {gesture:'swipe',label:'スワイプ',target:()=>{const o=G&&G.objs.find(x=>x.fixed);return o?{x:o.x,y:o.y,r:o.r+14,el:cv}:null},dir:'right',until:()=>!!G&&(G.tcut||0)>=1,text:'**アミラーゼ** の刀で、巻きわらの **デンプン** を なぞって斬る',praise:'斬れた！'},
  {gesture:'tap',label:'タップ',target:'#capB',until:()=>!!G&&G.phase==='run',text:'アミラーゼは **デンプンを分解** できた。「**本番へ**」を タップ'},
  {gesture:'swipe',label:'スワイプ',target:flyT,dir:'right',dist:120,until:()=>!!G&&G.score>=1,text:'飛んでくる **デンプン** を なぞって斬れ！（ゆっくり落ちてくる）',praise:'一刀両断！'}
 ],
 onExit:res=>{if(res&&res.replaced)return;if(!G||G!==PG||!G.practice)return;const g=G;g.practice=false;SV.tut=1;save();
  if(replay){G=null;openMap()}}
}}
function runPractice(replay){return Guide.tutorial(mkPractice(replay))}
if(window.Guide){
 Guide.setup({theme:{bg:'#F6F1E5',fg:'#1A1A1A',accent:'#B7282E',accentText:'#F6F1E5',font:"'Yuji Boku',serif",bodyFont:"'BIZ UDPMincho',serif",radius:2,
   texture:'paper',line:'#1A1A1A',dim:'rgba(40,36,30,.42)',shadow:'4px 5px 0 rgba(26,26,26,.75)',outline:'#EEE9DD',hand:'#F6F1E5',handLine:'#1A1A1A'},
  sfx:k=>{if(k==='step')SFX.hit(3);else if(k==='done')SFX.tier(1);else if(k==='clear')SFX.win();else if(k==='open'||k==='close'||k==='nudge'||k==='cheer')SFX.tap()},
  muted:()=>SV.mute,learn:INTRO.learn,how:INTRO.how,title:INTRO.title});
 Guide.tutorialButton('#btnHowto',()=>{actx();SFX.tap();SV.name=$('nameIn').value.trim()||SV.name;save();runPractice(!!(SV.tut||SV.open))});
 let wasP=false;
 HELP=Guide.help({mount:$('hudR'),size:46,attention:true,
  rules:['刀は 相手が決まっている：**アミラーゼ＝デンプン**・**ペプシン＝タンパク質**・**リパーゼ＝脂肪**','合わない刀は **はじかれる**（連がとぎれ、命が減る）','刀の **鍔をタップ** して持ちかえる','分解できない物・分解されきった粒は **見送る**（見切り）','巻きわらの **試し斬り** で 相性表をうめる'],
  onOpen:()=>{wasP=!!(G&&G.pause);if(G)G.pause=true},onClose:()=>{if(G&&!wasP&&$('ov').hidden&&$('scrBack').hidden)G.pause=false},
  replay:()=>{runPractice(true);return null},labels:{replay:'れんしゅうをもう一度'}});
}else $('btnHowto').hidden=true;
let T=null;
function startTest(){if(!window.Quiz){openOv('<h2>問題データがありません</h2><div class="btns"><button class="pb" id="oC">とじる</button></div>');$('oC').onclick=closeOv;return}G=null;closeOv();setScene('test');T={qs:Quiz.test(),i:0,ans:[]};renderQ()}
function renderQ(){const q=T.qs[T.i];$('qNo').textContent=(T.i+1)+' / '+T.qs.length;$('qText').textContent=q.q;const f=$('qFig');if(q.fig){f.innerHTML=q.fig;f.hidden=false}else{f.innerHTML='';f.hidden=true}
 const A=$('qArea');A.innerHTML='';$('scTest').scrollTop=0;const LBL='いろはにほへ';
 const mk=(c,l)=>{const b=document.createElement('button');b.dataset.l=l;b.textContent=c;return b};
 if(q.t==='choice'){q.shown.forEach((c,k)=>{const b=mk(c,LBL[k]);b.onclick=()=>answer(c);A.appendChild(b)})}
 else if(q.t==='order'){const pk=[];const sl=document.createElement('div');sl.className='ordS';const hint=document.createElement('div');hint.style.cssText='font-weight:700;font-size:14px';hint.textContent='正しい順に タップしよう';A.appendChild(hint);A.appendChild(sl);
  const bs=[];const draw=()=>{sl.innerHTML=q.items.map((_,k)=>'<div>'+(k+1)+'. '+(pk[k]?esc(pk[k]):'')+'</div>').join('');bs.forEach(b=>b.classList.toggle('done',pk.indexOf(b.textContent)>=0))};
  q.shown.forEach((c,k)=>{const b=mk(c,String(k+1));bs.push(b);b.onclick=()=>{if(pk.indexOf(c)>=0)return;pk.push(c);SFX.tap();draw();if(pk.length===q.items.length)setTimeout(()=>answer(pk.slice()),250)};A.appendChild(b)});
  const rs=document.createElement('button');rs.className='pb sm';rs.style.cssText='padding-left:14px;align-self:flex-start';rs.textContent='やり直す';rs.onclick=()=>{pk.length=0;draw()};A.appendChild(rs);draw()}
 else{const w=document.createElement('div');w.innerHTML='<div class="numRow"><input id="numIn" inputmode="decimal"><b>'+esc(q.unit||'')+'</b></div><button class="sb" id="numOk" style="margin-top:12px">これで決める</button>';A.appendChild(w);$('numOk').onclick=()=>answer($('numIn').value)}}
function answer(a){const q=T.qs[T.i];T.ans[T.i]=a;const ok=Quiz.check(q,a);SFX.mark(ok);
 const d=document.createElement('div');d.className='qfb';d.innerHTML='<div class="in"><div class="mk '+(ok?'o':'')+'">'+(ok?'〇':'✕')+'</div><div class="ex">'+(ok?'':'<b>正解：</b>'+esc(Quiz.answer?Quiz.answer(q):'')+'<br>')+esc(q.ex||'')+'</div><button class="sb">'+(T.i+1<T.qs.length?'次の問題へ':'結果へ')+'</button></div>';
 $('app').appendChild(d);d.querySelector('button').onclick=()=>{d.remove();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'}
function finishTest(){const qs=T.qs,answers=T.ans;const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const tm=window.GAME_MODE==='test';const name=window.PLAYER_NAME||SV.name||$('nameIn').value.trim()||'';
 const nSt=SV.stars.reduce((a,b)=>a+(b||0),0);const nT=Object.keys(SV.tbl).length;
 const done=()=>{T=null;if(tm){$('qText').textContent='おつかれさまでした。提出カードは 先生に見せよう。';$('qArea').innerHTML='';$('qFig').hidden=true;const b=document.createElement('button');b.className='sb';b.textContent='もう一度 確認テスト';b.onclick=startTest;$('qArea').appendChild(b)}else openMap()};
 if(!window.SubmitCard){done();return}
 SubmitCard.show({gameId:GAME,grade:'chu2',koma:[KOMA],unit:'中2理科　生物の体のつくりと働き　第19回',game:'酵素ニンジャ ～消化酵素～'+(tm?'（確認テストのみ）':''),
  name,score,total:qs.length,marks,
  records:tm?[['モード','確認テストだけ']]:[['クリアタイム',fmt(SV.elapsed)],['屋敷の★',nSt+' / 30'],['最大の連',SV.best+'連'],['墨龍の持ちかえ',SV.bossSw==null?'―':SV.bossSw+'回']].concat(nT?[['相性表',nT+'マス']]:[]).slice(0,4),
  review},done)}

/* ================= ループ ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;try{update(dt);render()}catch(e){console.error(e)}requestAnimationFrame(frame)}
setInterval(()=>{if(scene==='play')save()},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ================= はじまり ================= */
resize();
try{window.Zukan&&Zukan.setup({game:GAME,koma:[KOMA]})}catch(e){}
// 自動テスト用（遊びには使わない）
window.__en={mapRects:()=>mapRects(),get G(){return G},get SV(){return SV},get L(){return L},get U(){return U},startRoom,startTest,openMap,selBlade,slashSeg,
 go(){const b=$('oGo');if(b)b.click()},
 auto(){ // 理科として正しく1手だけ斬る
  if(!G)return 'none';const ph=G.phase;
  if(ph==='trialDone'){$('capB').click();return 'run'}
  if(ph==='trial'){const p=trialLeft()[0];if(!p)return 'wait';const o=G.objs.find(o=>(o.t==='food'?o.comps[0]:KD[o.k].c)===p[1]&&!(o.regen>0));if(!o)return 'wait';selBlade(p[0]);G.sid++;slashSeg(o.x-o.r*1.3,o.y-4,o.x+o.r*1.3,o.y+4);return 'trial '+p.join('×')}
  const list=ph==='boss'?G.B.segs.filter(s=>s.alive&&!s.off):ph==='run'?G.objs.filter(o=>!o.dead&&o.y<H-L.barH-10&&o.y>L.top):[];
  const bls=G.r.bl.filter(b=>b!=='su');
  // 今の刀で斬れる物を先に（持ちかえを少なく）
  const best=(o)=>{if(o.t==='food'){return bls.find(b=>o.comps.some(c=>EFF[b][c]==='o'))}const c=KD[o.k].c;if(o.k==='fb')return bls.indexOf('bi')>=0?'bi':'li';return bls.find(b=>EFF[b][c]==='o')};
  let tgt=list.find(o=>{const b=best(o);return b&&(b===G.blade||(o.t==='food'&&o.comps.some(c=>EFF[G.blade][c]==='o')))});let b=G.blade;
  if(!tgt){tgt=list.find(o=>best(o));if(!tgt)return 'wait';b=best(tgt)}
  selBlade(b);G.sid++;slashSeg(tgt.x-tgt.r*.5,tgt.y-2,tgt.x+tgt.r*.5,tgt.y+2);return 'cut '+(tgt.k)+' '+b},
 wrong(){if(!G)return;const o=G.objs.find(o=>!o.dead);if(!o)return 'none';const bls=G.r.bl;const b=bls.find(b=>o.t==='food'?!o.comps.some(c=>EFF[b][c]!=='x'):EFF[b][KD[o.k].c]==='x');if(!b)return 'nob';selBlade(b);G.sid++;slashSeg(o.x-o.r,o.y,o.x+o.r,o.y);return 'wrong '+o.k+' '+b}};
if(window.GAME_MODE==='test'){startTest()}else{setScene('title');initTitle()}
requestAnimationFrame(frame);
})();
</script>
