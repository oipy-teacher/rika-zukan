 start:()=>{TUTSTEP=-1;startRace(0)},
 label:'れんしゅう中',
 steps:[
  {gesture:'tap',target:()=>segEl('B',2),until:()=>G&&G.B>=2,text:'看板は「ジョグ（強さ2）」。まず **呼吸** のレバーを **2段目** に',label:'呼吸を上げる'},
  {gesture:'tap',target:()=>segEl('H',2),until:()=>G&&G.H>=2,text:'つぎは **拍動** も **2段目** に。**2つがそろう** と走り出す！',label:'拍動を上げる',praise:'そろった！'},
  {gesture:'swipe',dir:'up',target:()=>runnerTarget(),until:()=>G&&G.lane!==1,text:'コーンだ！ **スワイプ** でレーンを変えて よけよう',label:'よける'},
  {gesture:'tap',target:()=>segEl('B',1),until:()=>G&&G.B===1&&G.H===1,text:'「歩く（強さ1）」の看板。**呼吸も拍動も 1段目** に下げて そろえる',label:'下げる',praise:'先読み！'}
 ],
 clearOn:'manual',
 onStep:i=>{TUTSTEP=i;const s=PRACTICE.steps[2];s.dir=WIDE?'up':'left'},
 onClear:()=>earn(10,'first-try',W/2,H*.4),
 onExit:res=>afterPractice(res)};
let TUT_ABORT=false;function endTut(){TUT_ABORT=true;try{Guide.tutorialEnd()}catch(e){}TUT_ABORT=false}
function afterPractice(res){TUTSTEP=-1;if(TUT_ABORT)return;if(G&&G.st.tut){G=null}bgmStop();SV.tut=1;SV.reach=Math.max(SV.reach,1);save();if(TUTFROM==='start')openPrep(1);else openMap()}

/* ================= さいごの確認テスト ================= */
let T=null;
function startTest(){if(!window.Quiz){alert('問題データがありません');return}endTut();G=null;ovClose();show('scTest');T={qs:Quiz.test(),i:0,ans:[]};renderQ()}
function mkAns(c,k,lab){const b=document.createElement('button');b.className='ans';b.innerHTML='<span class="L">'+lab+'</span><span></span>';b.lastChild.textContent=c;return b}
function renderQ(){const q=T.qs[T.i];$('qNo').textContent='第'+(T.i+1)+'問 / '+T.qs.length;$('qText').textContent=q.q;const f=$('qFig');if(q.fig){f.innerHTML=q.fig;f.hidden=false}else{f.innerHTML='';f.hidden=true}
 const A=$('qArea');A.innerHTML='';$('scTest').scrollTop=0;
 if(q.t==='choice'){const box=document.createElement('div');box.className='qch';q.shown.forEach((c,k)=>{const b=mkAns(c,k,'アイウエオ'[k]);b.onclick=()=>answer(c);box.appendChild(b)});A.appendChild(box)}
 else if(q.t==='order'){const pk=[];const slots=document.createElement('div');slots.className='ordSlots';const box=document.createElement('div');box.className='qch';
  const draw=()=>{slots.innerHTML=q.items.map((_,k)=>'<div>'+(k+1)+'. '+(pk[k]?esc(pk[k]):'')+'</div>').join('');box.querySelectorAll('.ans').forEach(b=>b.classList.toggle('done',pk.indexOf(b.dataset.v)>=0))};
  q.shown.forEach((c,k)=>{const b=mkAns(c,k,String(k+1));b.dataset.v=c;b.onclick=()=>{if(pk.indexOf(c)>=0)return;pk.push(c);SFX.click();draw();if(pk.length===q.items.length)setTimeout(()=>answer(pk.slice()),250)};box.appendChild(b)});
  const rs=document.createElement('button');rs.className='sl pale sm';rs.style.marginTop='16px';rs.innerHTML='<span>やり直す</span>';rs.onclick=()=>{pk.length=0;draw()};
  const hint=document.createElement('div');hint.style.cssText='font-size:17px;margin:4px 0';hint.textContent='はじめから順に タップして並べよう';
  A.appendChild(hint);A.appendChild(slots);A.appendChild(box);A.appendChild(rs);draw()}
 else{const w=document.createElement('div');w.innerHTML='<div class="numRow"><input id="numIn" inputmode="decimal"><b style="font-weight:400">'+esc(q.unit||'')+'</b></div><div style="text-align:center"><button class="sl red" id="numOk"><span>これで決める</span></button></div>';A.appendChild(w);$('numOk').onclick=()=>answer($('numIn').value)}}
const MARK_O='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="36" fill="none" stroke="#C0122C" stroke-width="14"/></svg>';
const MARK_X='<svg viewBox="0 0 100 100"><path d="M18 18 L82 82 M82 18 L18 82" stroke="#141414" stroke-width="15"/></svg>';
function answer(a){const q=T.qs[T.i];T.ans[T.i]=a;const ok=Quiz.check(q,a);ok?SFX.good():SFX.bad();
 const d=document.createElement('div');d.className='qfb';d.innerHTML='<div class="mk">'+(ok?MARK_O:MARK_X)+'</div><div class="ex">'+(ok?'':'<b>正解：</b>'+esc(Quiz.answer(q))+'<br>')+esc(q.ex||'')+'</div><button class="sl red"><span>'+(T.i+1<T.qs.length?'次の問題へ':'結果へ')+'</span></button>';
 $('app').appendChild(d);d.querySelector('.sl').onclick=()=>{d.remove();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}}
function finishTest(){const qs=T.qs,answers=T.ans;const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const tm=window.GAME_MODE==='test';const name=window.PLAYER_NAME||SV.name||$('nameIn').value.trim()||'';
 const nClr=SV.stars.slice(1).filter(s=>s>0).length,tot=SV.stars.slice(1).reduce((a,b)=>a+b,0);
 const done=()=>{T=null;if(tm){show('scTest');$('qNo').textContent='おつかれさま';$('qText').textContent='提出カードは 先生に見せよう。';$('qArea').innerHTML='';$('qFig').hidden=true;const b=document.createElement('button');b.className='sl red';b.style.marginTop='16px';b.innerHTML='<span>もう一度 確認テスト</span>';b.onclick=startTest;$('qArea').appendChild(b)}else openMap()};
 if(!window.SubmitCard){done();return}
 SubmitCard.show({gameId:GAME_ID,grade:'chu2',koma:[KOMA],unit:'中2理科　生物の体のつくりと働き　第28回',game:'走れ！ハートランナー ～呼吸数と拍動数～'+(tm?'（確認テストのみ）':''),
  name,score,total:qs.length,marks,
  records:tm?[['モード','確認テストだけ']]:[['走りきったレース',nClr+' / '+(NST-1)],['集めた★',tot+' / '+((NST-1)*3)],['決勝のベスト',SV.best[NST-1]?SV.best[NST-1].toFixed(1)+'秒':'—'],['最高コンボ',SV.maxCombo+'']],
  review},done)}

/* ================= ループ ================= */
let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;TT+=scene==='title'?0:dt;
 try{if(scene==='play'&&G){update(dt);render(dt);bgmTick()}else if(scene==='play'){render(dt)}else if(scene==='title'){titleFrame(dt)}else if(scene==='map'){mapBg(dt)}}catch(e){console.error(e)}
 requestAnimationFrame(frame)}
function mapBg(dt){TT+=dt;cx.save();cx.fillStyle=PAPER;cx.fillRect(0,0,W,H);cx.fillStyle=RED;P();cx.arc(W*.9,H*.12,Math.min(W,H)*.22,0,TAU);cx.fill();cx.save();cx.translate(-W*.1,H*.95);cx.rotate(-.3);cx.fillStyle=INK;cx.fillRect(0,-30,W*1.6,60);cx.restore();cx.fillStyle=INK;cx.save();cx.translate(W*.4,-20);cx.rotate(.7);cx.fillRect(0,0,H*1.6,14);cx.restore();grain();cx.restore()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&scene==='play'&&!G.done&&$('ov').hidden){G.paused=true;ovOpen('<div class="hd">ひと休み</div><p>レースは止まっています。</p><div class="row"><button class="sl red" id="psGo"><span>つづける</span></button></div>');$('psGo').onclick=()=>{ovClose();if(G)G.paused=false}}});
addEventListener('resize',()=>{resize();if(scene==='play'&&G)renderLevers()});

/* ================= はじまり ================= */
window.GAME_ID=GAME_ID;
try{window.Zukan&&Zukan.setup({game:GAME_ID,koma:[KOMA]})}catch(e){}
try{
 Guide.setup({theme:{bg:'#F6F2E8',fg:'#141414',accent:'#C0122C',accentText:'#fff',font:"'RocknRoll One',sans-serif",bodyFont:"'RocknRoll One',sans-serif",radius:0,texture:'grain',line:'#141414',dim:'rgba(20,20,20,.5)',shadow:'8px 8px 0 #C0122C',outline:'#F6F2E8',hand:'#F6F2E8',handLine:'#141414'},
  sfx:k=>{if(k==='step')SFX.good();else if(k==='done')SFX.perfect(3);else if(k==='clear')SFX.fan();else if(k==='cheer')SFX.coin(3);else if(k==='nudge')SFX.bad();else SFX.click()},muted:()=>SV.mute});
 HELP=Guide.help({title:'走れ！ハートランナー',learn:'運動すると 細胞が使う酸素が増える。だから **呼吸数と拍動数が そろって増える**',how:'看板の強さに **呼吸と拍動のレバーを同じ段** に。スワイプ（または画面のタップ・矢印キー）でレーンを変える',
  rules:['看板の強さ（□の数）に、**呼吸と拍動を両方** 合わせると加速','片方だけでは **細胞に届く酸素は増えない**（取り入れる×運ぶ）','**坂・向かい風・近道の急坂** は 1段きつい','看板が来る前にそろえると **先読み**（PERFECT）','下がる看板では、呼吸も拍動も下げてそろえる','キー：Q/A＝呼吸 上/下　P/L＝拍動 上/下'],
  onOpen:()=>{if(G)G.paused=true},onClose:()=>{if(G&&$('ov').hidden)G.paused=false},replay:'tutorial',offset:{x:62},attention:true,show:false});
 Guide.tutorialButton('#btnHow',()=>{actx();TUTFROM='how';Guide.tutorial(PRACTICE)});
}catch(e){console.error(e);$('btnHow').hidden=true}
buildLevers();muteIcon();resize();
if(window.GAME_MODE==='test'){startTest()}else{showTitle()}
requestAnimationFrame(frame);
})();
</script>
<script>window.ZUKAN_COUNTER={"db": "https://rika-zukan-rank-default-rtdb.asia-southeast1.firebasedatabase.app", "id": "bio-heart-runner"};
/* プレイ回数を数える（公開サイトのゲームにだけ build_site.py が入れる）
   送るのはゲームIDだけ。同じタブで開き直しても1回しか数えない。届かなくてもゲームには何も起きない */
(function(){
  var C=window.ZUKAN_COUNTER;if(!C||!C.db||!C.id||!/^[a-z0-9-]{2,40}$/.test(C.id))return;
  var k='zukan-played:'+C.id;
  try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
  try{fetch(C.db+'/plays/'+C.id+'.json',{method:'PUT',body:JSON.stringify({'.sv':{increment:1}}),keepalive:true})['catch'](function(){})}catch(e){}
})();
</script>
