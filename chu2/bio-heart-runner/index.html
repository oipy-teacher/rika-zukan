<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>走れ！ハートランナー ～呼吸数と拍動数～</title>
<!--
 ==========================================================================
 走れ！ハートランナー ～呼吸数と拍動数～（bio-heart-runner / chu2-seibutsu-28）
 ねらい: 運動すると細胞が使う酸素が増え、呼吸数と拍動数がそろって増える
         （細胞に酸素と養分を多く届け、二酸化炭素を多く運び出すため）
 --------------------------------------------------------------------------
 遊びの核: 3レーンのランナー（必ずゴールがある1レース1〜2分）。コースの看板が「走る強さ」を
   指定する。強さに合わせて【呼吸】と【拍動】のレバーを同じ段にそろえたときだけ加速する。
   片方だけ上げても、細胞に届く酸素＝min(取り入れる, 運ぶ)なので息切れして失速する。
   スワイプでレーンを変えて障害物をよけ、坂・向かい風・近道の急坂は「1段きつい」。
   理科の判断＝看板を読んで2つのレバーを先読みでそろえる（下げるのも同じ）。
 1. 世界とメタファー: 1920年代ロシア構成主義の陸上大会ポスター。コースは斜めに駆け上がる帯、
    看板は赤い斜めの札、成績は大会プログラムと記録グラフ。
 2. 配色: 背景 #EAE4D6（生成りの紙）／主 #C0122C（赤）／差し #141414（黒）。灰 #8E8A80。
 3. 書体: 見出し・本文とも RocknRoll One（太いゴシックを斜めに組む）。
 4. 画面: 全画面。PC・iPad横＝右上がりの斜めのトラックを右へ走る横スクロール／
    スマホ・iPad縦＝奥へ走る3レーン（遠近）。canvas は devicePixelRatio に合わせて確保。
 5. HUD: 斜めの札（レース名・タイム・次の看板）、細胞の酸素バー、レバー2本、
    下に「肺→血液→筋肉の細胞」の運び屋の模式図（酸素の粒が回る）。
 6. 音: 行進曲の太鼓＝心臓の拍動（拍動数がそのままテンポ）・金管の和音・号笛・スタンプ。
    （2026-10-04 第2段: この曲は拍動数＝テンポで学びと結びついているので自前のまま残す。共通BGMエンジンの曲は付けない（GAME_FX は罰の札だけ）。
     ゲームの変数 BGM は共通エンジン window.BGM と名前がぶつかるため OWNBGM に改名）
 7. ドーパミン: そろった瞬間に赤いフラッシュ・斜めの帯「そろった！」・紙吹雪の三角と四角・
    揺れ・音程が上がる金管。コンボで背景の放射光と伴奏の楽器が増える。★はドン・ドン・ドン。
    前回の自分（ゴースト）との差・★3までの差を本当の秒数で出す。
 ==========================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&display=swap" rel="stylesheet">
<style>
:root{--p:#EAE4D6;--p2:#F6F2E8;--r:#C0122C;--r2:#8E0C20;--k:#141414;--g:#8E8A80;
 --f:'RocknRoll One','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--p);color:var(--k);font-family:var(--f);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;pointer-events:none}
.scr>*{pointer-events:auto}
/* 斜めの札（ボタン） */
.sl{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:6px 26px;background:var(--k);color:var(--p2);font-size:21px;letter-spacing:.04em;transform:skewX(-12deg);box-shadow:6px 6px 0 var(--r);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.sl>span{display:inline-block;transform:skewX(12deg)}
.sl.red{background:var(--r);color:#fff;box-shadow:6px 6px 0 var(--k)}
.sl.pale{background:var(--p2);color:var(--k);outline:3px solid var(--k);outline-offset:-3px;box-shadow:5px 5px 0 var(--k)}
.sl.sm{min-height:44px;font-size:16px;padding:4px 16px}
.sl:active{transform:skewX(-12deg) translate(4px,4px);box-shadow:2px 2px 0 var(--r)}
.sl.red:active,.sl.pale:active{box-shadow:2px 2px 0 var(--k)}
.sl[disabled]{opacity:.35;pointer-events:none}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:skewX(-12deg) scale(1)}50%{transform:skewX(-12deg) scale(1.07)}}
/* 固定ボタン */
#bBack{position:fixed;left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));z-index:40;min-height:46px;padding:4px 16px 4px 12px;font-size:17px;background:var(--k);color:var(--p2);transform:skewX(-12deg);box-shadow:4px 4px 0 var(--r);display:flex;align-items:center;gap:6px}
#bBack>span{transform:skewX(12deg);display:flex;align-items:center;gap:6px}
#bBack i{display:inline-block;width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-right:14px solid var(--r)}
#bBack:active{transform:skewX(-12deg) translate(3px,3px);box-shadow:1px 1px 0 var(--r)}
#bMute{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));z-index:40;width:48px;height:48px;background:var(--p2);outline:3px solid var(--k);outline-offset:-3px;box-shadow:4px 4px 0 var(--k);display:flex;align-items:center;justify-content:center}
#bMute svg{width:28px;height:28px}
/* 表紙 */
#scTitle{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:0 0 calc(22px + env(safe-area-inset-bottom)) 0}
#logo{position:absolute;left:5vw;top:9vh;transform-origin:left top;transform:rotate(-8deg);pointer-events:none}
#logo .sup{display:inline-block;background:var(--k);color:var(--p2);font-size:clamp(12px,1.7vw,18px);padding:4px 12px;letter-spacing:.08em;transform:skewX(-12deg)}
#logo h1{margin:.1em 0 0;font-weight:400;line-height:.92;font-size:clamp(64px,13vw,168px);color:var(--r);letter-spacing:-.02em;text-shadow:6px 6px 0 var(--k)}
#logo .h2{display:inline-block;background:var(--r);color:#fff;font-size:clamp(34px,6.4vw,84px);padding:.04em .3em .1em;margin-top:.08em;box-shadow:8px 8px 0 var(--k);transform:skewX(-12deg)}
#logo .h2 span{display:inline-block;transform:skewX(12deg)}
#logo .sub{display:block;margin-top:.5em;font-size:clamp(18px,2.6vw,32px);color:var(--k);letter-spacing:.06em}
#logo.drop{animation:ldrop .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes ldrop{0%{transform:translate(-40vw,-10vh) rotate(-20deg);opacity:0}100%{transform:rotate(-8deg);opacity:1}}
#tBtns{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:center;padding:0 0 0 7vw;max-width:94vw}
#tBtns .sl.big{min-height:64px;font-size:28px;padding:6px 40px}
#nameRow{position:absolute;right:5vw;bottom:calc(24px + env(safe-area-inset-bottom));font-size:16px;display:flex;align-items:center;gap:8px;background:var(--p2);padding:6px 10px;outline:3px solid var(--k);outline-offset:-3px}
#nameRow input{font:inherit;font-size:17px;width:9em;border:0;border-bottom:3px solid var(--k);background:transparent;padding:4px;color:var(--k)}
body.tall #logo{left:6vw;top:13vh}
body.tall #logo h1{font-size:clamp(60px,21vw,120px)}
body.tall #logo .h2{font-size:clamp(30px,10vw,60px)}
body.tall #tBtns{padding:0 5vw 64px;gap:14px 16px}
body.tall #tBtns .sl.big{font-size:24px;padding:6px 30px}
body.tall #nameRow{left:5vw;right:auto;bottom:calc(14px + env(safe-area-inset-bottom))}
/* プレイ HUD */
#hStage{position:absolute;left:calc(128px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));background:var(--r);color:#fff;font-size:17px;padding:6px 16px;transform:skewX(-12deg);box-shadow:4px 4px 0 var(--k);max-width:calc(100vw - 260px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#hStage span{display:inline-block;transform:skewX(12deg)}
#hTime{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%) skewX(-12deg);background:var(--k);color:var(--p2);font-size:30px;padding:2px 18px;min-width:132px;text-align:center;pointer-events:none;box-shadow:4px 4px 0 var(--r)}
#hTime small{font-size:15px;margin-left:3px}
#hO2{position:absolute;right:calc(128px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;pointer-events:none}
#hO2 b{font-weight:400;font-size:14px;background:var(--p2);padding:2px 6px;outline:2px solid var(--k)}
#hO2 .bar{width:clamp(110px,16vw,230px);height:24px;background:var(--p2);border:3px solid var(--k);box-shadow:3px 3px 0 var(--k);position:relative;transform:skewX(-12deg);overflow:hidden}
#hO2 .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--r);width:100%;transition:width .1s}
#hO2 .bar u{position:absolute;left:40%;top:0;bottom:0;width:3px;background:var(--k)}
#hO2.low .bar i{background:var(--k);animation:blink .4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#hNext{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;align-items:center;gap:8px;pointer-events:none;font-size:17px}
#hNext span{white-space:nowrap}
#hNext .t{background:var(--p2);outline:3px solid var(--k);outline-offset:-3px;padding:3px 10px}
#hNext .v{background:var(--k);color:var(--p2);padding:3px 12px;transform:skewX(-12deg)}
#hNext .v.up{background:var(--r);color:#fff}
#hNext .blk{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
#hNext .blk i{width:10px;height:14px;background:rgba(255,255,255,.3);transform:skewX(-12deg)}
#hNext .blk i.on{background:#fff}
#warn{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;font-size:16px;background:var(--k);color:#fff;padding:5px 12px;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis;box-shadow:4px 4px 0 var(--r)}
#warn.ok{background:var(--r);box-shadow:4px 4px 0 var(--k)}
#warn:empty{display:none}
#lockNote{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none;background:repeating-linear-gradient(-45deg,var(--k) 0 10px,#333 10px 20px);color:#fff;font-size:16px;padding:6px 14px;outline:3px solid var(--r)}
/* レバー */
.lever{position:absolute;display:flex;gap:6px;touch-action:none}
.lvHead{display:flex;align-items:center;gap:6px;background:var(--k);color:var(--p2);padding:4px 8px;pointer-events:none;position:relative}
.lvHead svg{width:38px;height:38px;flex:none}
.lvHead .nm{font-size:14px;line-height:1.1}
.lvHead .nb{font-size:22px;line-height:1;white-space:nowrap}
.lvHead .nb small{font-size:11px;margin-left:2px}
#lvH .lvHead{background:var(--r)}
.lvTrack{display:flex;gap:5px;position:relative;touch-action:none;cursor:pointer}
.seg{flex:1;position:relative;background:var(--p2);outline:3px solid var(--k);outline-offset:-3px;transition:background .08s}
.seg span{position:absolute;font-size:12px;color:var(--g);left:6px;top:2px}
.seg.on{background:var(--k)}
.seg.on span{color:var(--p2)}
#lvH .seg.on{background:var(--r)}
.seg.need::after{content:'';position:absolute;inset:-7px;border:3px dashed var(--r);pointer-events:none}
#lvH .seg.need::after{border-color:var(--k)}
.seg.lk{background:repeating-linear-gradient(-45deg,#bbb 0 6px,#ddd 6px 12px)}
.lever.shake{animation:lshake .3s}
@keyframes lshake{25%{translate:-6px 0}75%{translate:6px 0}}
.lung{transform-origin:50% 60%;animation:breathe 3.75s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.82)}45%{transform:scale(1.08)}}
.hrt{transform-origin:50% 55%;animation:beat .8s ease-out infinite}
@keyframes beat{0%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(.96)}34%{transform:scale(1.1)}60%,100%{transform:scale(1)}}
body.wide .lever{flex-direction:column;bottom:calc(14px + env(safe-area-inset-bottom));width:124px}
body.wide #lvB{left:calc(14px + env(safe-area-inset-left))}
body.wide #lvH{right:calc(14px + env(safe-area-inset-right))}
body.wide .lvHead{flex-wrap:wrap;justify-content:center;text-align:center;transform:skewY(-6deg)}
body.wide .lvHead .txt{width:100%}
body.wide .lvTrack{flex-direction:column-reverse;height:min(40vh,300px);transform:skewY(-6deg)}
body.tall #hStage{max-width:calc(100vw - 250px);font-size:14px}
body.tall .lever{padding-right:10px}
body.tall #hTime{top:calc(62px + env(safe-area-inset-top));left:12px;transform:skewX(-12deg);font-size:26px;min-width:110px}
body.tall #hO2{top:calc(66px + env(safe-area-inset-top));right:14px}
body.tall #hO2 b{font-size:12px}
body.tall #hNext{top:calc(112px + env(safe-area-inset-top));font-size:15px;max-width:96vw}
body.tall .lever{left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));height:62px;flex-direction:row}
body.tall #lvB{bottom:calc(80px + env(safe-area-inset-bottom))}
body.tall #lvH{bottom:calc(10px + env(safe-area-inset-bottom))}
body.tall .lvHead{width:128px;flex:none;transform:skewX(-12deg)}
body.tall .lvHead>*{transform:skewX(12deg)}
body.tall .lvTrack{flex:1;flex-direction:row;transform:skewX(-12deg)}
body.tall .lvHead svg{width:34px;height:34px}
/* 大会プログラム（マップ） */
#scMap{overflow:auto;-webkit-overflow-scrolling:touch}
#mapIn{min-height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;padding:calc(72px + env(safe-area-inset-top)) 4vw 30px;align-content:start}
.poster{background:var(--p2);outline:4px solid var(--k);outline-offset:-4px;box-shadow:10px 10px 0 var(--k);padding:18px 18px 16px;position:relative}
.poster h2{margin:-34px 0 14px -6px;font-weight:400;font-size:28px}
.poster h2 span{display:inline-block;background:var(--r);color:#fff;padding:4px 18px;transform:skewX(-12deg) rotate(-3deg);box-shadow:5px 5px 0 var(--k)}
#races{display:flex;flex-direction:column;gap:9px}
.race{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;min-height:52px;padding:4px 12px 4px 4px;background:var(--p);outline:3px solid var(--k);outline-offset:-3px;text-align:left;transform:skewX(-8deg)}
.race>*{transform:skewX(8deg)}
.race .no{background:var(--k);color:var(--p2);height:44px;display:flex;align-items:center;justify-content:center;font-size:18px}
.race .nm{font-size:17px;line-height:1.2}
.race .nm small{display:block;font-size:12px;color:#555}
.race .st{font-size:18px;color:var(--r);letter-spacing:2px}
.race .st .off{color:#bbb}
.race.sel{background:var(--r);color:#fff}
.race.sel .nm small{color:#ffe}
.race.sel .st,.race.sel .st .off{color:#fff}
.race.sel .st .off{opacity:.45}
.race.lock{opacity:.4}
.race.boss .no{background:var(--r)}
#rInfo{margin-top:14px;font-size:16px;line-height:1.6;background:var(--p);padding:10px 12px;outline:2px solid var(--k)}
#graphBox svg{width:100%;height:auto;display:block}
#gnote{font-size:15px;line-height:1.6;margin:10px 0 0}
#mbtns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px 20px;justify-content:center;padding-top:6px}
body.tall #mapIn{grid-template-columns:1fr;gap:30px;padding-left:14px;padding-right:14px}
/* オーバーレイ */
#ov{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(20,20,20,.55);padding:16px;overflow:auto}
.card{position:relative;background:var(--p2);outline:4px solid var(--k);outline-offset:-4px;box-shadow:12px 12px 0 var(--r);width:min(620px,94vw);padding:22px 22px 20px;text-align:center;max-height:none;margin:auto}
.card .hd{display:inline-block;font-size:30px;background:var(--k);color:var(--p2);padding:4px 22px;transform:skewX(-12deg) rotate(-3deg);margin:-44px 0 10px;box-shadow:6px 6px 0 var(--r)}
.card .hd.red{background:var(--r);color:#fff;box-shadow:6px 6px 0 var(--k)}
.card p{font-size:18px;line-height:1.65;margin:10px 0}

.card .row{display:flex;flex-wrap:wrap;gap:14px 18px;justify-content:center;margin-top:16px}
.card .row.lsStick{position:sticky;bottom:-16px;margin:14px -18px -20px;padding:12px 0 14px;background:var(--p2)}
.lsCh{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.lsCh button{font:inherit;font-size:18px;text-align:left;padding:10px 14px;background:#fff;border:3px solid #141414;box-shadow:4px 4px 0 #141414;cursor:pointer;color:#141414}
.lsCh button.ng{opacity:.4}.lsCh button.ok{background:#C0122C;color:#fff}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
.newel{display:inline-block;background:var(--r);color:#fff;padding:4px 12px;transform:skewX(-12deg);font-size:18px;margin:4px 0}
.stars{display:flex;justify-content:center;gap:16px;margin:8px 0 4px}

.bigT{font-size:56px;line-height:1;color:var(--k)}
.bigT small{font-size:22px}
.nm2{display:inline-block;background:var(--k);color:#fff;padding:4px 12px;font-size:17px;margin:6px 0}

.ledger{display:grid;grid-template-columns:1fr auto;gap:4px 16px;text-align:left;font-size:16px;margin:12px auto 0;max-width:420px}
.ledger b{font-weight:400;color:var(--r)}
.rulebox{margin:14px 0 4px;background:var(--r);color:#fff;padding:10px 14px;font-size:18px;line-height:1.5;transform:skewX(-6deg)}
.rulebox>*{transform:skewX(6deg);display:block}
/* 確認テスト */
#scTest{overflow:auto;-webkit-overflow-scrolling:touch}
#tIn{max-width:880px;margin:0 auto;padding:calc(72px + env(safe-area-inset-top)) 16px 40px}
#qNo{display:inline-block;background:var(--r);color:#fff;font-size:20px;padding:4px 18px;transform:skewX(-12deg);box-shadow:5px 5px 0 var(--k)}
#qText{font-size:22px;line-height:1.6;margin:18px 0 12px;background:var(--p2);padding:14px 16px;outline:3px solid var(--k);outline-offset:-3px}

#qFig svg{max-width:100%;height:auto}
.qch{display:flex;flex-direction:column;gap:12px}
.ans{display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:8px 14px 8px 8px;background:var(--p2);outline:3px solid var(--k);outline-offset:-3px;font-size:18px;line-height:1.45;box-shadow:5px 5px 0 var(--k);transition:transform .08s}
.ans .L{flex:none;width:40px;height:40px;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;transform:skewX(-12deg)}
.ans:nth-child(2n) .L{background:var(--r)}
.ans:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--k)}
.ans.done{opacity:.35}
.ordSlots{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.ordSlots div{min-height:42px;background:var(--p);outline:2px dashed var(--k);padding:8px 12px;font-size:17px}

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 2026-10-01: 適当プレイ番（guard.js）が減点したときは、records の「適当プレイ」の行を赤、「解きかた」の行を緑で出し、
     点の丸に「減点前 ○点」を添える（減点は r.score に反映済みで届く。合格の判定も減点後の点）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-rec div.sc-bad{background:#fde3e4;color:#b3141c;font-weight:900;border:2px solid #e8384f}',
    '#sc-card .sc-rec div.sc-good{background:#e2f5e6;color:#1d6b33;font-weight:700}',
    '#sc-card .sc-score s{text-decoration:none;font-size:clamp(11px,1.6vmin,13px);line-height:1.25;text-align:center;color:#6b7390;font-weight:700;margin-top:2px}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div'+(x[0]==='適当プレイ'?' class="sc-bad"':x[0]==='解きかた'?' class="sc-good"':'')+'>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.tekitou&&r.tekitou.full>0?'<s>ひび入り<br>減点前 '+esc(r.tekitou.raw)+'点</s>':'')+(r.koma&&isPass(r)?'<em>合格</em>':'')+(r.tekitou&&!r.tekitou.full?'<em style="background:linear-gradient(135deg,#f3c34a,#c8862a)">✨本物</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

\"#222\" stroke-width=\"2\"/>\u003cpolyline points=\"0,10 90,90\" fill=\"none\" stroke=\"#C0122C\" stroke-width=\"4\" transform=\"translate(2,0)\"/>\u003ctext x=\"46\" y=\"122\" font-size=\"12\" text-anchor=\"middle\" fill=\"#222\">運動の強さ→\u003c/text>\u003ctext x=\"-4\" y=\"-6\" font-size=\"12\" fill=\"#222\">拍動数\u003c/text>\u003ctext x=\"80\" y=\"-6\" font-size=\"16\" font-weight=\"bold\" fill=\"#141414\">C\u003c/text>\u003c/g>\u003c/svg>", "ex": "運動が強くなるほど細胞が使う酸素が増えるので、拍動数は右上がりに増える。", "level": 1}, {"id": "chu2-bio-heart-runner-q003", "koma": "chu2-seibutsu-28", "t": "choice", "kind": "judge", "q": "走っているときに、呼吸数だけが増えて拍動数が増えなかったとする。筋肉の細胞に届く酸素はどうなる？", "choices": ["あまり増えない。肺で取り入れた酸素を運ぶ血液の流れが増えないから", "大きく増える。呼吸数が増えれば酸素は足りるから", "減る。呼吸数が増えると血液が止まるから"], "ex": "肺で取り入れた酸素は血液で運ばれる。運ぶ流れ（拍動）が増えなければ、細胞に届く量はあまり増えない。", "fig": null, "level": 1}, {"id": "chu2-bio-heart-runner-q004", "koma": "chu2-seibutsu-28", "t": "choice", "kind": "judge", "q": "拍動数だけが増えて、呼吸数が増えなかったとする。筋肉の細胞に届く酸素はどうなる？", "choices": ["あまり増えない。血液は速く流れても、肺で取り入れる酸素が増えないから", "大きく増える。血液が速く流れれば酸素は足りるから", "心臓が酸素をつくるので、増える"], "ex": "血液が運べる酸素は、肺で取り入れた分だけ。取り入れる量（呼吸）も増やさないと届く量は増えない。", "fig": null, "level": 1}, {"id": "chu2-bio-heart-runner-q005", "koma": "chu2-seibutsu-28", "t": "num", "kind": "calc", "q": "安静時の拍動数が1分間に75回の人が、運動したら150回になった。1回の拍動で送り出す血液の量が同じだとすると、1分間に送り出す血液の量は安静時の何倍？", "ans": 2, "unit": "倍", "tol": 0, "ex": "150÷75＝2。拍動数が2倍になれば、送り出す血液の量も2倍（1回の量が同じとき）。", "fig": null, "level": 1}, {"id": "chu2-bio-heart-runner-q006", "koma": "chu2-seibutsu-28", "t": "num", "kind": "calc", "q": "1回の呼吸で500mLの空気が肺に出入りするとする。運動中に呼吸数が1分間に30回になったら、1分間に出入りする空気はおよそ何mL？", "ans": 15000, "unit": "mL", "tol": 0, "ex": "500×30＝15000mL。呼吸数が増えると、取り入れる空気（酸素）が増える。", "fig": null, "level": 2}, {"id": "chu2-bio-heart-runner-q007", "koma": "chu2-seibutsu-28", "t": "choice", "kind": "judge", "q": "細胞は、血液が運んできた酸素と養分を使って何をしている？", "choices": ["養分を分解して生きるためのエネルギーを取り出し、二酸化炭素と水を出している", "二酸化炭素を使って養分をつくっている", "酸素をためておき、運動のときにまとめて血液へもどしている", "養分を尿素に変えている"], "ex": "細胞による呼吸：養分＋酸素→エネルギー＋二酸化炭素＋水。運動するとこれがさかんになる。", "fig": null, "level": 2}, {"id": "chu2-bio-heart-runner-q008", "koma": "chu2-seibutsu-28", "t": "choice", "kind": "graph", "q": "表は、ある人が運動する前と後の拍動数・呼吸数を記録したもの。表から言えることとして正しいものは？", "choices": ["運動の直後にどちらも増え、時間がたつとだんだん元にもどっていく", "運動の直後に拍動数だけ増え、呼吸数は変わらない", "運動をやめるとすぐに運動前の値にもどる", "運動のあと、時間がたつほど増え続ける"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 150\" width=\"320\" height=\"150\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"150\" fill=\"#fbf8f1\"/>\u003ctext x=\"10\" y=\"22\" font-size=\"13\" font-weight=\"bold\" fill=\"#141414\">\u003c/text>\u003ctext x=\"120\" y=\"22\" font-size=\"13\" font-weight=\"bold\" fill=\"#141414\">拍動数(回/分)\u003c/text>\u003ctext x=\"225\" y=\"22\" font-size=\"13\" font-weight=\"bold\" fill=\"#141414\">呼吸数(回/分)\u003c/text>\u003cpath d=\"M8 30 H312\" stroke=\"#141414\" stroke-width=\"2\"/>\u003ctext x=\"10\" y=\"52\" font-size=\"14\" fill=\"#222\">運動前\u003c/text>\u003ctext x=\"150\" y=\"52\" font-size=\"14\" fill=\"#222\">72\u003c/text>\u003ctext x=\"255\" y=\"52\" font-size=\"14\" fill=\"#222\">16\u003c/text>\u003cpath d=\"M8 60 H312\" stroke=\"#ccc\"/>\u003ctext x=\"10\" y=\"78\" font-size=\"14\" fill=\"#222\">運動の直後\u003c/text>\u003ctext x=\"150\" y=\"78\" font-size=\"14\" fill=\"#222\">150\u003c/text>\u003ctext x=\"255\" y=\"78\" font-size=\"14\" fill=\"#222\">40\u003c/text>\u003cpath d=\"M8 86 H312\" stroke=\"#ccc\"/>\u003ctext x=\"10\" y=\"104\" font-size=\"14\" fill=\"#222\">3分後\u003c/text>\u003ctext x=\"150\" y=\"104\" font-size=\"14\" fill=\"#222\">110\u003c/text>\u003ctext x=\"255\" y=\"104\" font-size=\"14\" fill=\"#222\">26\u003c/text>\u003cpath d=\"M8 112 H312\" stroke=\"#ccc\"/>\u003ctext x=\"10\" y=\"130\" font-size=\"14\" fill=\"#222\">6分後\u003c/text>\u003ctext x=\"150\" y=\"130\" font-size=\"14\" fill=\"#222\">80\u003c/text>\u003ctext x=\"255\" y=\"130\" font-size=\"14\" fill=\"#222\">18\u003c/text>\u003cpath d=\"M8 138 H312\" stroke=\"#ccc\"/>\u003c/svg>", "ex": "細胞が使う酸素が多いときはどちらも増え、使う量が減るとしだいにもどる。", "level": 2}, {"id": "chu2-bio-heart-runner-q009", "koma": "chu2-seibutsu-28", "t": "num", "kind": "method", "q": "手首で脈拍を15秒間数えたら20回だった。1分間の脈拍数は何回？", "ans": 80, "unit": "回", "tol": 0, "ex": "15秒の4倍が1分なので、20×4＝80回。脈拍は心臓の拍動が動脈に伝わったもの。", "fig": null, "level": 2}, {"id": "chu2-bio-heart-runner-q010", "koma": "chu2-seibutsu-28", "t": "choice", "kind": "method", "q": "「運動の強さ」と「拍動数」の関係を調べる。正しい調べ方はどれ？", "choices": ["同じ人が同じ測り方（時間）で測り、運動の強さだけを変えて比べる", "強い運動は体力のある人、弱い運動は別の人が行って比べる", "運動の強さを変えるたびに、測る時間も変えて比べる", "1回だけ測って、結果を決める"], "ex": "調べたい条件（運動の強さ）以外はそろえる。何度か測ると確かになる。", "fig": null, "level": 2}, {"id": "chu2-bio-heart-runner-q011", "koma": "chu2-seibutsu-28", "t": "choice", "kind": "judge", "q": "全力で走っているとき、あしの筋肉の細胞のまわりの毛細血管を通りぬけた後の血液は、通る前と比べてどうなっている？", "choices": ["酸素が減り、二酸化炭素が増えている", "酸素が増え、二酸化炭素が減っている", "酸素も二酸化炭素も増えている", "何も変わらない"], "ex": "筋肉の細胞が酸素を受け取り、呼吸で出た二酸化炭素を血液にわたしている。", "fig": null, "level": 2}, {"id": "chu2-bio-heart-runner-q012", "koma": "chu2-seibutsu-28", "t": "choice", "kind": "judge", "q": "運動でたくさん出た二酸化炭素は、どこから体の外へ出される？", "choices": ["血液で肺へ運ばれ、はく息から出る", "血液で腎臓へ運ばれ、尿から出る", "筋肉から直接、皮ふの外へ出る", "小腸から大腸へ運ばれて出る"], "ex": "二酸化炭素は血液（おもに血しょう）で肺へ運ばれ、肺胞から出てはく息になる。", "fig": null, "level": 2}, {"id": "chu2-bio-heart-runner-q013", "koma": "chu2-seibutsu-28", "t": "order", "kind": "judge", "q": "走り始めてから、筋肉の細胞に酸素が多く届くまでを、順に並べよう。", "items": ["筋肉の細胞が酸素を多く使うようになる", "呼吸数と拍動数が増える", "肺で多くの酸素を取り入れ、血液が速く運ぶ", "毛細血管から筋肉の細胞へ多くの酸素がわたされる"], "ex": "使う量が増える→取り入れて運ぶ量を増やす→細胞に届く、の順。", "fig": null, "level": 2}, {"id": "chu2-bio-heart-runner-q014", "koma": "chu2-seibutsu-28", "t": "choice", "kind": "term", "q": "心臓が縮んだりゆるんだりして、血液を送り出す動きを何という？", "choices": ["拍動", "脈拍", "呼吸", "消化"], "ex": "心臓の動きが拍動。拍動が動脈に伝わって手首などで感じられるのが脈拍。", "fig": null, "level": 2}, {"id": "chu2-bio-heart-runner-q015", "koma": "chu2-seibutsu-28", "t": "choice", "kind": "judge", "q": "手首で測る脈拍数が、心臓の拍動数とほぼ同じになるのはなぜ？", "choices": ["脈拍は、心臓の拍動によって送り出された血液の勢いが動脈に伝わったものだから", "手首にも小さな心臓があるから", "脈拍は呼吸に合わせて起こるから", "静脈に血液がもどる音だから"], "ex": "1回の拍動ごとに動脈が1回ふくらむので、脈拍数≒拍動数。", "fig": null, "level": 2}]};

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

/* ==========================================================
   BGMエンジン（全ゲーム共通）  ─ BGM
   ─ 2026-10-03 オーナー指示「BGMも本気出していいよ。全力でやっていこう」から作った共通部品
   ─ ゲームの index.html の印の外に window.GAME_FX = { bgm:{…} } を書くと、そのゲーム専用の曲が鳴る。
     GAME_FX.bgm が無いゲームでは何も鳴らさない（ボタンも出さない）。書き方は _shared/fx-README.md
   ─ WebAudio だけで鳴らす（外部ファイル・外部サイトなし）。曲は1小節ずつ先読みで組み立てる
       ・曲のセクション（intro／A／B／S＝サビ／T＝ピンチ／Q＝静か）と form（流れる順）
       ・ドラム（キック・スネア・ハット・タム・シンバル・太鼓・ブラシ…を合成）／ベース／和音パッド／
         刻み（伴奏）／アルペジオ／メロディ／副旋律。テンポ・調・音階・拍子・スウィング・音色はデータで決める
   ─ ゲームの場面に合わせて強さを変える
       BGM.mood('normal')   ふつう
       BGM.mood('tense')    ピンチ・時間切れ間近（T セクションへ。無ければサビの和音で急かす）
       BGM.mood('calm')     静か（確認テスト中は自動でこれ）
       BGM.mood('clear')    クリアのジングル（Zukan.mainClear で自動）→ そのあと ふつう
       BGM.level(0〜3)      コンボなどで楽器を足す・引く（1がふつう）
       BGM.duck(ms)         一瞬小さくする（適当プレイ番の罰の瞬間は自動）
   ─ iOS Safari の自動再生の決まりに合わせ、最初のタップで鳴り始める
   ─ 音量・オンオフのボタン（左下・指で押せる大きさ）。状態は localStorage（rika-bgm:v1）に保存。初期音量は「小」
     （教室で30台が同時に鳴る前提）。図鑑の「音を消す」（rika-zukan:profile:v1 の mute）にも従う
   ─ このファイルは build / sync_one.py が各ゲームの ZUKAN（または GUARD）の印の間へ同期する（ゲーム側で直接いじらない）

        var c = kids[i];
        if(c.nodeType === 3){
          var txt = c.nodeValue; if(!txt) continue;
          var frag = document.createDocumentFragment();
          for(var j=0;j<txt.length;j++){
            var ch = txt.charAt(j), sp = document.createElement('span');
            sp.className = 'tk-kc'; sp.textContent = ch; frag.appendChild(sp);
            var ms = /\s/.test(ch) ? 30 : 1000 / cps;
            if(/[、，,]/.test(ch)) ms += 200; if(/[。！？!?]/.test(ch)) ms += 350;
            chars.push({sp:sp, ms:ms});
          }
          c.parentNode.replaceChild(frag, c);
        }else if(c.nodeType === 1 && !/^(SCRIPT|STYLE|SVG|svg|CANVAS|IMG|BUTTON|INPUT|TEXTAREA|SELECT)$/.test(c.tagName)){
          if(c.tagName === 'BR' && chars.length) chars[chars.length-1].ms += 220;
          walk(c);
        }
      }
    })(el);
    if(!chars.length) return null;
    el.classList.add('tk-kara');
    var total = 0; for(var k=0;k<chars.length;k++) total += chars[k].ms;
    var i = 0, timer = 0, stopped = false;
    function step(){
      if(stopped || !el.isConnected) return;
      if(i > 0) chars[i-1].sp.className = 'tk-kc lit';
      if(i >= chars.length) return;
      chars[i].sp.className = 'tk-kc now';
      var ms = chars[i].ms; i++;
      timer = setTimeout(step, ms);
    }
    step();
    return {total:total, stop:function(){ stopped = true; clearTimeout(timer); chars.forEach(function(c){ c.sp.className = 'tk-kc lit'; }); }};
  }
  /* 解説の文が入っている、いちばん小さい見えている要素を探す */
  function findTextEl(text){
    var key = strip(text); if(key.length < 6) return null;
    var head = key.slice(0, Math.min(16, key.length));
    var all = document.body.getElementsByTagName('*'), best = null, bestLen = 1e9;
    for(var i=0;i<all.length;i++){
      var e = all[i];
      if(/^(SCRIPT|STYLE|BUTTON|svg|SVG|HTML|BODY)$/.test(e.tagName) || e.closest('#sc-ov,.zk-ov,.tk-note,.tk-pen,svg')) continue;
      var t = strip(e.textContent);
      if(t.length >= bestLen || t.indexOf(head) < 0) continue;
      var r = e.getBoundingClientRect(); if(r.width < 4 || r.height < 4) continue;
      best = e; bestLen = t.length;
    }
    /* 見出し（「もう一歩」「正解：…」）ごと読ませるため、親が解説とほぼ同じ大きさなら親まで上がる */
    while(best && best.parentElement && best.parentElement !== document.body){
      var pl = strip(best.parentElement.textContent).length;
      if(pl > key.length * 1.6 + 40 || best.parentElement.querySelector('button,input,select,canvas')) break;
      best = best.parentElement;
    }
    return best;
  }

  /* ---------------- 解説の「つぎへ」を読み終わるまで止める ---------------- */
  var NEXT_RE = /^(▶|→|＞|>)?\s*(つぎ|次|NEXT|Next|next|答え合わせ|こたえあわせ|結果|けっか)/;
  function textOf(b){ return String(b.textContent || b.value || '').trim(); }
  function visible(el){
    if(!el || !el.isConnected || el.disabled) return false;
    var r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return false;
    var cs = getComputedStyle(el); return cs.visibility !== 'hidden' && cs.display !== 'none' && +cs.opacity > 0.05;
  }
  function nextButtons(){
    var out = [], bs = document.querySelectorAll('button,[role=button],input[type=button]');
    for(var i=0;i<bs.length;i++){ var b = bs[i]; if(excluded(b)) continue; if(NEXT_RE.test(textOf(b)) && visible(b)) out.push(b); }
    return out;
  }
  function gate(btn, opt){
    if(!btn) return;
    opt = opt || {};
    var ms = opt.ms, el = opt.el || null, kara = null;
    if(ms == null){
      if(!el && opt.text) el = findTextEl(opt.text);
      if(el) kara = karaoke(el, opt.ok ? CFG.readCpsOk : CFG.readCps);
      if(kara) ms = kara.total + 300;
      else { var n = strip(opt.text || '').length; ms = n ? n / (opt.ok ? CFG.readCpsOk : CFG.readCps) * 1000 : (opt.ok ? 700 : 1200); }
    }
    ms = Math.min(CFG.readMax, ms);
    if(ms <= 0) return;
    ensureCSS();
    var g = {b:btn, until:now() + ms, tries:0, kara:kara};
    gates.push(g);
    btn.classList.add('tk-gated'); btn.style.setProperty('--tk-ms', (ms/1000) + 's');
    g.timer = setTimeout(function(){ ungate(g, true); }, ms);
  }
  function ungate(g, ready){
    var i = gates.indexOf(g); if(i >= 0) gates.splice(i, 1);
    clearTimeout(g.timer);
    if(g.kara) g.kara.stop();
    if(g.b){ g.b.classList.remove('tk-gated'); if(ready && g.b.isConnected){ g.b.classList.add('tk-ready'); setTimeout(function(){ g.b.classList.remove('tk-ready'); }, 2100); } }
  }
  function gateBlock(e){
    if(!gates.length) return false;
    var t = e.target, at = now();
    for(var i=gates.length-1;i>=0;i--){
      var g = gates[i];
      if(!g.b.isConnected){ ungate(g); continue; }
      if(at >= g.until){ ungate(g, true); continue; }
      if(g.b === t || g.b.contains(t)){
        e.preventDefault(); e.stopPropagation();
        g.tries++;
        if(g.tries >= 4){
          g.tries = 0;
          if(S.inTest){ S.test.skip += 2; pen('skip', '−1点', '確認テストの点 −1・提出カードが「ひび入り」になる'); emit('skip'); }
          else gamePenalty('skip', CFG.debtMash);
        }else{
          note('📖 光る文字を 目で追って 読もう　<em>あと ' + Math.ceil((g.until - at) / 1000) + ' 秒</em>', 1500);
        }
        return true;
      }
    }
    return false;
  }

  /* ---------------- 確認テスト ---------------- */
  function startTest(){
    S.inTest = true; S.t0 = now(); S.lastAt = 0; S.seen = {};
    S.test = {guess:0, mash:0, skip:0, n:0};
    if(!S.told){
      S.told = true;
      setTimeout(function(){
        note('📝 <em>確認テストのルール</em><br>● 問題が出てすぐ（2.5秒以内）の<b>まちがい</b> → あてずっぽう <b>−1点</b><br>● <b>連打</b>（1秒に7回） → <b>−1点</b><br>● 解説を<b>とばす</b>（光り終わる前に何度も押す・すぐ次を答える） → <b>−1点</b><br>罰があると 提出カードが「<b>ひび入り</b>」になる。わからない問題は、考えてから答えよう。', 5600);
      }, 350);
    }
  }
  function prevClickBefore(at){
    /* 答えを決めたクリック（いまから0.4秒以内）の、ひとつ前のクリック＝「つぎへ」を押した時刻 */
    var i = clicks.length - 1;
    if(i >= 0 && at - clicks[i] < 400) i--;
    return i >= 0 ? clicks[i] : 0;
  }
  function onTestAnswer(q, ok){
    var key = q && (q.id || q.q) ? String(q.id || strip(q.q)) : '#' + S.test.n;
    if(S.seen[key]) return;
    S.seen[key] = 1;
    var at = now(), gap = at - (S.lastAt || S.t0);
    S.lastAt = at; S.test.n++;
    var think = gap;
    if(!q || q.t === 'choice' || q.t == null){ var p = prevClickBefore(at); if(p && p > (S.t0 - 50)) think = Math.min(gap, at - p); }
    if(!ok && think < CFG.guessMs) testPenalty('guess');
    else if(S.test.n > 1 && gap < CFG.skipMs) testPenalty('skip');
    else if(ok && think >= CFG.guessMs) praise();
    if(!ok) S.game.streak = 0;
    /* 解説をカラオケ読みさせ、新しく出た「つぎへ」を読み終わるまで止める */
    var ex = q ? (q.ex || q.exp || '') : '';
    var before = nextButtons();
    setTimeout(function(){
      var after = nextButtons(), fresh = [];
      for(var i=0;i<after.length;i++) if(before.indexOf(after[i]) < 0) fresh.push(after[i]);
      if(!fresh.length) return;
      var ms = null, el = ex ? findTextEl(ex) : null, kara = el ? karaoke(el, ok ? CFG.readCpsOk : CFG.readCps) : null;
      if(kara) ms = kara.total + 300;
      for(var j=0;j<fresh.length;j++) gate(fresh[j], ms != null ? {ms:ms} : ex ? {text:ex, ok:ok, el:null} : {ms: ok ? 700 : 1200});
      if(kara && fresh.length) gates[gates.length-1].kara = kara;
    }, Math.max(40, lockUntil - now() + 40)); /* 罰の札が消えてから読み始める */
  }
  function penalty(){
    return S.test.guess + S.test.mash + Math.floor(S.test.skip / 2);
  }
  function fmtTime(ms){ var s = Math.round(ms/1000); return Math.floor(s/60) + '分' + String(s%60).padStart(2,'0') + '秒'; }

  /* ---------------- 本編の○×（ゲームが Tekitou.answer を呼んだとき） ---------------- */
  function onGameAnswer(ok){
    var at = now(), from = Math.max(S.game.shownAt || 0, S.game.lastAt || 0), think = from ? at - from : 1e9;
    S.game.lastAt = at;
    /* 子どもが押した（離した）直後に決まった正誤だけを数える。時間で自動に進む場面（流れてきた・ぶつかった）の正誤は数えない */
    var byHand = at - lastInputAt < 600;
    if(!byHand) { if(!ok) S.game.streak = 0; return; }
    if(ok) { S.game.wrongs = []; if(think >= CFG.guessMs) praise(); return; }
    S.game.streak = 0;
    S.game.wrongs.push(at);
    while(S.game.wrongs.length && at - S.game.wrongs[0] > CFG.burstMs) S.game.wrongs.shift();
    var fast = think < CFG.guessMs, burst = S.game.wrongs.length >= CFG.burstN;
    if(!(fast || burst)) return;
    S.game.wrongs = [];
    gamePenalty('guess', CFG.debtGuess);
  }

  /* ---------------- ごほうび：考えてから正解したら金の「本物 ×n」 ---------------- */
  function praise(){
    ensureCSS(); if(!document.body) return;
    S.game.streak++;
    var n = S.game.streak, d = document.createElement('div');
    var x = lastPt[0] || innerWidth / 2, y = lastPt[1] || innerHeight * .4;
    d.className = 'tk-real' + (n >= 5 ? ' big' : '');
    d.style.left = Math.max(70, Math.min(innerWidth - 70, x)) + 'px'; d.style.top = Math.max(40, y - 30) + 'px';
    d.innerHTML = '✨ 本物' + (n >= 2 ? ' <b>×' + n + '</b>' : '') + (n === 5 ? '<small>じっくり名人！</small>' : n === 10 ? '<small>理屈マスター！</small>' : '');
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1300);
  }
  var lastPt = [0, 0], lastInputAt = 0;
  window.addEventListener('pointerdown', function(e){ lastPt = [e.clientX, e.clientY]; lastInputAt = now(); }, true);
  ['pointerup','click','keydown'].forEach(function(t){ window.addEventListener(t, function(){ lastInputAt = now(); }, true); });

  /* ---------------- まぐれ判定（パズルの手） ---------------- */
  function median(a){ if(!a.length) return 1e9; var b = a.slice().sort(function(x,y){return x-y}); return b[b.length >> 1]; }
  function solved(o){
    o = o || {};
    var mv = S.moves.slice(), n = mv.length, gaps = [];
    for(var i=1;i<n;i++) gaps.push(mv[i] - mv[i-1]);
    S.moves = [];
    var min = +o.min || 0;
    var many = min ? (n >= Math.max(min * 2 + 4, min + 6)) : (n >= 12);
    var lucky = many && median(gaps) < CFG.luckyGapMs;
    if(!lucky){
      if(n && (!min || n <= min + 2)) praise();
      if(o.onResult) try{ o.onResult(true); }catch(e){}
      return false;
    }
    S.game.lucky++; S.game.sus++; S.game.streak = 0;
    emit('lucky', {moves:n, min:min});
    if(o.defer){
      /* アクションの最中は止めない：まぐれを覚えておき、本編クリアのときに理屈チェック */
      note('🔍 <b>まぐれ？</b>　手あたりしだいに さわって 合っただけ かも。<br><em>クリアのときに 理屈チェック</em>が 出るよ', 3000);
      if(o.onResult) try{ o.onResult(false); }catch(e){}
      return true;
    }
    riddle({q:o.q, title:'まぐれ？', sub:'手あたりしだいに さわって 合っただけ かも。<br>理屈が わかっているか 1問で たしかめよう'}).then(function(ok){
      if(o.onResult) try{ o.onResult(ok); }catch(e){}
    });
    return true;
  }

  /* ---------------- 理屈チェック（1問） ---------------- */
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pickQ(){
    try{
      if(!window.Quiz || !Quiz.all) return null;
      var all = Quiz.all().filter(function(q){ return q.t === 'choice' && q.choices && q.choices.length >= 2 && !q.fig; });
      var k = '';
      try{ k = (Zukan._cur.koma || [])[0] || ''; }catch(e){}
      var mine = all.filter(function(q){ return !k || q.koma === k; });
      var pool = mine.length ? mine : all;
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }catch(e){ return null; }
  }
  var riddleOpen = false;
  function riddle(o){
    return new Promise(function(res){
      var q = o.q || pickQ();
      if(!q || riddleOpen || !document.body){ res(true); return; }
      riddleOpen = true; ensureCSS();
      var shown = shuffle(q.choices), t0 = now(), done = false;
      var d = document.createElement('div'); d.className = 'tk-chk';
      d.innerHTML = '<div class="tk-card"><div class="tk-h">🔍 理屈チェック' + (o.title ? '<span>' + esc(o.title) + '</span>' : '') + '</div>' +
        '<p class="tk-sub">' + (o.sub || 'クリアの前に 1問だけ。ちゃんと わかってクリアしたか たしかめよう') + '</p>' +
        '<p class="tk-q"></p><div class="tk-ch"></div><div class="tk-ex"></div><div class="tk-go"></div></div>';
      d.querySelector('.tk-q').textContent = String(q.q || '').replace(/<[^>]*>/g, '');
      var box = d.querySelector('.tk-ch');
      shown.forEach(function(c){
        var b = document.createElement('button'); b.type = 'button'; b.textContent = String(c).replace(/<[^>]*>/g, '');
        b.onclick = function(){
          if(done) return; done = true;
          var ok = c === q.choices[0], think = now() - t0;
          [].forEach.call(box.children, function(x){ x.disabled = true; if(x.textContent === String(q.choices[0]).replace(/<[^>]*>/g, '')) x.className = 'ok'; else if(x === b) x.className = 'ng'; });
          var ex = d.querySelector('.tk-ex'), go = d.querySelector('.tk-go');
          if(ok && think >= CFG.guessMs){
            ex.innerHTML = '<div class="tk-big">本物！ ✨</div>';
            praise(); S.game.sus = 0; S.game.lucky = 0;
            setTimeout(function(){ d.remove(); riddleOpen = false; res(true); }, 1400);
            return;
          }
          ex.innerHTML = (ok ? '<b>正解。でも 早すぎ！</b> 考えてから 答えよう<br>' : '<b>もう一歩</b> 正解：' + esc(String(q.choices[0]).replace(/<[^>]*>/g, '')) + '<br>') + esc(String(q.ex || '').replace(/<[^>]*>/g, ''));
          ensureLoaded();
          var n = CFG.debtLucky; pay('lucky', n); save();
          var nb = document.createElement('button'); nb.type = 'button'; nb.className = 'tk-next'; nb.textContent = 'わかった（' + (costText(n) || 'もう一度 考えよう') + '）';
          nb.onclick = function(){ if(nb.classList.contains('tk-gated')) return; d.remove(); riddleOpen = false; res(false); };
          go.appendChild(nb);
          var kara = karaoke(ex, CFG.readCps);
          gate(nb, {ms: kara ? kara.total + 300 : 2500});
          if(kara && gates.length) gates[gates.length - 1].kara = kara;
        };
        box.appendChild(b);
      });
      document.body.appendChild(d);
    });
  }

  /* ---------------- 共通部品へのつなぎ ---------------- */
  function hookQuiz(){
    var Q = window.Quiz; if(!Q || Q.__tk) return; Q.__tk = 1;
    var test = Q.test, check = Q.check, review = Q.review;
    if(test) Q.test = function(){ var r = test.apply(this, arguments); startTest(); return r; };
    if(check) Q.check = function(q, ans){
      var ok = check.apply(this, arguments);
      if(!S.inReview){ try{ if(S.inTest) onTestAnswer(q, ok); }catch(e){} }
      return ok;
    };
    if(review) Q.review = function(){ S.inReview = true; try{ return review.apply(this, arguments); } finally { S.inReview = false; } };
  }
  function hookCard(){
    var C = window.SubmitCard; if(!C || C.__tk) return; C.__tk = 1;
    var show = C.show;
    C.show = function(r, onClose){
      try{
        if(r && S.t0){
          ensureLoaded();
          r = Object.assign({}, r);
          var raw = +r.score || 0, full = penalty(), p = Math.min(raw, full), rows = (r.records || []).slice(), why = [];
          if(S.test.guess) why.push('あてずっぽう ' + S.test.guess + '回');
          if(S.test.mash) why.push('連打 ' + S.test.mash + '回');
          if(S.test.skip) why.push('とばし読み ' + S.test.skip + '回');
          if(full > 0){ r.score = raw - p; rows.push(['適当プレイ', 'ひび入り −' + full + '点（' + why.join('・') + '）' + (full > p ? '　※0点より下にはならない' : '')]); }
          else if(why.length){ rows.push(['適当プレイ', why.join('・')]); }
          else rows.push(['解きかた', '◎ 本物（罰なし・じっくり解いた）']);
          rows.push(['テストの時間', fmtTime(now() - S.t0)]);
          if(S.game.mash || S.game.guess) rows.push(['ゲーム中の連打・あてずっぽう', (S.game.mash + S.game.guess) + '回']);
          r.records = rows;
          r.tekitou = {raw:raw, penalty:p, full:full, guess:S.test.guess, mash:S.test.mash, skip:S.test.skip, game:S.game.mash + S.game.guess};
        }
      }catch(e){}
      S.inTest = false; S.t0 = 0;
      return show.call(this, r, onClose);
    };
  }
  function hookZukan(){
    var Zk = window.Zukan; if(!Zk || Zk.__tk || !Zk.earn) return; Zk.__tk = 1;
    var earn = Zk.earn;
    Zk.earn = function(n, why, opt){
      ensureLoaded();
      if(S.debt > 0 && why !== 'pass'){
        n = Math.floor(Number(n) || 0);
        var cut = Math.min(S.debt, n);
        if(cut > 0){
          S.debt -= cut; n -= cut; save();
          if(!(opt && opt.silent)) setTimeout(function(){ note('<b>連打・あてずっぽう・とばし読み</b>の罰で かけら <em>−' + cut + '</em>', 2600); }, 600);
        }
        if(n <= 0) return 0;
      }
      return earn.call(this, n, why, opt);
    };
  }
  /* 本編クリア：まぐれ・罰があったときだけ理屈チェックを1問はさむ（ふつうに遊んだ子は止めない） */
  function hookClear(){
    var Zk = window.Zukan; if(!Zk || Zk.__tkc || !Zk.mainClear) return; Zk.__tkc = 1;
    var mc = Zk.mainClear;
    Zk.mainClear = function(opt){
      var self = this, args = arguments;
      if(S.game.sus > 0 && window.GAME_MODE !== 'test'){
        riddle({title:'クリアの前に', sub:'このプレイでは 連打・あてずっぽう・まぐれが あった。<br>理屈が わかっているか 1問で たしかめよう'}).then(function(){ S.game.sus = 0; mc.apply(self, args); });
        return 0;
      }
      return mc.apply(this, arguments);
    };
  }
  function hookAll(){ hookQuiz(); hookCard(); hookZukan(); hookClear(); }

  window.addEventListener('click', onClick, true);

  window.Tekitou = {
    setup: function(o){ if(o) for(var k in o) if(Object.prototype.hasOwnProperty.call(CFG, k)) CFG[k] = o[k]; hookAll(); },
    shown: function(){ S.game.shownAt = now(); S.moves = []; if(S.inTest) S.lastAt = now(); },
    move: function(){ var t = now(), l = S.moves[S.moves.length-1]; if(l && t - l < 60) return; /* 同じ1手で2回呼ばれたものはまとめる */ S.moves.push(t); if(S.moves.length > 400) S.moves.shift(); },
    solved: solved,
    check: function(o){ return riddle(o || {}); },
    answer: function(ok, o){ hookAll(); if(S.inTest) onTestAnswer(o && o.q, !!ok); else onGameAnswer(!!ok); },
    startTest: function(){ startTest(); },
    gate: gate,
    karaoke: function(el, o){ ensureCSS(); return karaoke(el, (o && o.cps) || CFG.readCps); },
    stats: function(){ ensureLoaded(); return {test:Object.assign({penalty:penalty(), inTest:S.inTest}, S.test), game:{mash:S.game.mash, guess:S.game.guess}, debt:S.debt}; },
    config: CFG,
    fx: {types:Object.keys(FXT), preview:function(kind){ pen(kind || 'mash', 'かけら −5', ''); }, sound:function(type, c, out, t, p){ (SND[type] || SND.stop)(c, out, t || 0, p || 1); }},
    _hook: hookAll
  };

  hookAll();
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hookAll);
  window.addEventListener('load', hookAll);
})();

/*@ZUKAN_END*/</script>

  <div id="tBtns">
   <button class="sl red big pulse" id="btnStart"><span>はじめる</span></button>
   <button class="sl big" id="btnCont" hidden><span>つづきから</span></button>
   <button class="sl pale sm" id="btnHow"><span>あそびかた</span></button>
   <button class="sl pale sm" id="btnBookT" hidden><span>📖 図鑑</span></button>
  </div>

 </section>

<script>
(function(){
'use strict';
const GAME_ID='bio-heart-runner',KOMA='chu2-seibutsu-28',SKEY='rika-zukan:chu2:game:'+GAME_ID+':v1';
const $=id=>document.getElementById(id);
const RED='#C0122C',RED2='#8E0C20',INK='#141414',PAPER='#EAE4D6',PAPER2='#F6F2E8',GREY='#8E8A80';
const FONT="'RocknRoll One','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif";
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const hsh=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const Z=()=>window.Zukan||null;
function RM(){try{const p=JSON.parse(localStorage.getItem('rika-zukan:profile:v1')||'{}');return !!p.lessMotion||matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}}
const INHUB=!!window.COLLECTION_NAME||(function(){try{return window.parent!==window}catch(e){return true}})();
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function vib(n){try{if(navigator.vibrate&&!RM())navigator.vibrate(n)}catch(e){}}

/* ================= 理科の値（段ごとにそろって増える・このゲームの目安） ================= */
const BR=[0,16,24,32,40,48];        // 呼吸数（回/分）
const HR=[0,75,100,125,155,180];    // 拍動数（回/分）
const PACE=['','歩く','ジョグ','ランニング','ダッシュ','全力'];
const SPD=[0,3.2,5,7,9.5,11];       // 画面の中の走る速さ（m/s・見た目用）
const MODF={'':1,slope:.8,wind:.85};
const MODN={slope:'坂',wind:'向かい風'};

/* ================= レース（全9レース） ================= */
// segs: [長さm, 走る強さ(1-4), 'slope'|'wind'|'' , 場所]
const STAGES=[
 {name:'ウォームアップ',sub:'れんしゅう',place:'town',tut:true,segs:[[110,2],[34,1]],obs:[[58,1,'cone']],newel:''},
 {name:'第1走　町の大通り',sub:'看板の強さに、呼吸と拍動をそろえる',place:'town',segs:[[28,1],[90,2],[120,3],[90,2],[110,3],[40,1]],dens:.55,aid:true,
  newel:'看板の強さに **呼吸と拍動を同じ段** でそろえると加速する'},
 {name:'第2走　川ぞいの道',sub:'いっきに2段の看板',place:'river',segs:[[20,2],[80,3],[130,4],[70,2],[120,4],[80,3],[40,1]],dens:.7,
  newel:'**いっきに2段** 上がる・下がる看板もある。看板が見えたら先に動かすと **先読み**'},
 {name:'第3走　坂の町',sub:'坂は1段きつい',place:'hill',segs:[[20,2],[80,3],[90,3,'slope'],[70,2],[80,2,'slope'],[110,4],[70,2],[40,1]],dens:.7,
  newel:'**坂道は1段きつい**（坂 ＋1）。ジョグでも坂なら3段'},
 {name:'第4走　橋の上の実験走',sub:'片方だけ上げたら？',place:'river',exp:true,segs:[[20,2],[60,2],[130,4],[110,4],[70,2],[130,4],[110,4],[40,1]],dens:.35,
  newel:'実験走：レバーの **片方を固定** して走ったら、細胞に酸素は届く？',
  locks:[{k:'H',v:2,from:74},{k:'B',v:2,from:404}]},
 {name:'第5走　2周目・町',sub:'看板が次々来る',place:'town',segs:[[20,2],[60,3],[60,4],[50,2],[70,4],[60,3],[80,4],[50,2],[60,3],[40,1]],dens:.85,
  newel:'看板が **次々** 来る。コンボをつなげ'},
 {name:'第6走　2周目・川の向かい風',sub:'風も1段きつい',place:'river',segs:[[20,2],[70,3],[80,3,'wind'],[60,2],[70,3,'wind'],[70,4],[60,4,'wind'],[70,2],[60,2,'wind'],[40,1]],dens:.85,
  newel:'**向かい風も1段きつい**（風 ＋1）。ダッシュに風で、最大の **5段**'},
 {name:'第7走　2周目・坂の近道',sub:'急坂の近道を選ぶ',place:'hill',segs:[[20,2],[80,3],[80,3,'slope'],[140,3],[70,2],[160,4],[70,2,'slope'],[40,1]],dens:.8,
  forks:[{at:195,len:110},{at:432,len:120}],
  newel:'**近道の急坂**（＋1）は速いけど、そのぶん上げる。準備できたら近道のレーンへ'},
 {name:'決勝　町→川→坂 通し',sub:'タイムアタック',place:'town',boss:true,segs:[[20,2],[60,3],[70,4],[50,2],[60,3],[70,4,'','river'],[60,3,'wind','river'],[60,2,'','river'],[80,4,'','river'],[50,4,'wind','river'],[60,3,'slope','hill'],[60,2,'','hill'],[90,4,'','hill'],[60,3,'slope','hill'],[70,4,'slope','hill'],[60,2,'','hill'],[40,1,'','hill']],dens:.85,
  forks:[{at:745,len:100}],newel:'町→川→坂を **通しで**。前回の自分（ゴースト）に勝て'}
];
const NST=STAGES.length;

/* ================= セーブ ================= */
function fresh(){return {v:1,name:'',reach:0,stars:Array(NST).fill(0),best:Array(NST).fill(0),ghost:{},graph:{},maxCombo:0,rules:{},tut:0,mainDone:false,mute:false}}
function load(){try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&s.v===1){const f=fresh();const o=Object.assign(f,s);o.stars=f.stars.map((x,i)=>(s.stars||[])[i]||0);o.best=f.best.map((x,i)=>(s.best||[])[i]||0);o.ghost=s.ghost||{};o.graph=s.graph||{};o.rules=s.rules||{};return o}}catch(e){}return fresh()}
let SV=load();
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SV))}catch(e){}}
function hasSave(){return SV.reach>0||SV.tut>0}

/* ================= 音（行進曲：太鼓＝拍動・金管・号笛） ================= */
let AC=null,MG=null,NB=null;
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)try{AC=new C();MG=AC.createGain();MG.gain.value=SV.mute?0:.6;MG.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function envg(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(f,dl,d,type,v,f2){const a=actx();if(!a||SV.mute)return;const t=a.currentTime+Math.max(0,dl||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);envg(g,t,.006,d,v||.08);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.06)}
function nbuf(){if(!NB){NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.8),AC.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}return NB}
function noise(dl,d,v,ft,ff,q){const a=actx();if(!a||SV.mute)return;const t=a.currentTime+Math.max(0,dl||0);const s=a.createBufferSource();s.buffer=nbuf();const f=a.createBiquadFilter();f.type=ft||'bandpass';f.frequency.value=ff||1500;f.Q.value=q||1;const g=a.createGain();envg(g,t,.004,d,v||.08);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d+.06)}
function brass(f,dl,d,v){const a=actx();if(!a||SV.mute)return;const t=a.currentTime+Math.max(0,dl||0);v=v||.05;
 [1,1.006].forEach(m=>{const o=a.createOscillator(),fl=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';o.frequency.value=f*m;fl.type='lowpass';fl.frequency.setValueAtTime(f*1.4,t);fl.frequency.linearRampToValueAtTime(f*5,t+.05);fl.frequency.linearRampToValueAtTime(f*2.2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.025);g.gain.setValueAtTime(v,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05)})}
const NT=n=>440*Math.pow(2,(n-69)/12);
const SFX={
 click(){tone(1500,0,.03,'square',.04)},
 lev(k,l){tone(NT((k==='H'?62:55)+[0,0,4,7,12,16][l]),0,.1,k==='H'?'triangle':'square',k==='H'?.12:.05)},
 lock(){tone(190,0,.1,'square',.08);tone(150,.08,.14,'square',.08)},
 perfect(c){const b=60+Math.min(10,c);[0,4,7,12].forEach((s,i)=>brass(NT(b+s),i*.04,.38,.05));noise(0,.6,.04,'bandpass',1400,.5)},
 saki(c){SFX.perfect(c);tone(NT(84+Math.min(8,c)),.2,.18,'square',.05);tone(NT(88+Math.min(8,c)),.3,.3,'square',.05)},
 good(){brass(NT(64),0,.18,.05);brass(NT(67),.07,.26,.05)},
 miss(){tone(170,0,.22,'sawtooth',.06,100)},
 stumble(){noise(0,.2,.18,'lowpass',380);tone(95,0,.16,'sine',.2,50)},
 whistle(){tone(2700,0,.42,'sine',.07,2550);tone(2760,.0,.42,'sine',.04,2600)},
 count(i){tone(i?NT(69):NT(81),0,.16,'square',.07);if(!i)noise(0,.3,.1,'highpass',3000)},
 sign(){noise(0,.18,.06,'bandpass',2600,2)},
 fan(){const s=[60,64,67,72,0,67,72,76];s.forEach((n,i)=>{if(n)brass(NT(n),i*.11,i===7?.8:.2,.06)});[0,.44,.88].forEach(d=>noise(d,.12,.12,'lowpass',500))},
 stamp(i){noise(0,.12,.3,'lowpass',320);tone(85,0,.2,'sine',.28,40);brass(NT(67+i*5),.05,.34,.06)},
 coin(i){tone(NT(84+(i%7)),0,.05,'square',.03)},
 unlock(){[48,55,60,67,72].forEach((n,i)=>brass(NT(n),i*.07,.5,.05));noise(0,.8,.08,'bandpass',900,.4)},
 rule(){[60,67,72,76,79,84].forEach((n,i)=>brass(NT(n),i*.09,.6,.05));noise(.3,1.2,.07,'bandpass',1500,.4)},
 beat(v){tone(72,0,.1,'sine',.22*v,44);tone(64,.14,.08,'sine',.14*v,40)},
 snare(v){noise(0,.1,.07*v,'highpass',1800)},
 hat(){noise(0,.03,.025,'highpass',6000)},
 cheer(){noise(0,1,.05,'bandpass',1600,.4);noise(.2,.8,.04,'bandpass',2400,.5)},
 breath(){noise(0,.4,.025,'bandpass',800,.8)},
 bad(){tone(220,0,.12,'square',.05,180)}
};
/* 行進曲：太鼓＝拍動数（拍動数がそのままテンポになる）。コンボで楽器が増える */
const OWNBGM={on:false,next:0,n:0,bn:0};
const BASS=[36,36,43,43,41,41,43,31];
function bgmStart(){const a=actx();if(!a)return;OWNBGM.on=true;OWNBGM.next=a.currentTime+.1;OWNBGM.n=0;OWNBGM.bn=a.currentTime+.5}
function bgmStop(){OWNBGM.on=false}
function bgmTick(){if(!OWNBGM.on||!AC||SV.mute||!G||G.paused)return;const now=AC.currentTime;if(OWNBGM.next<now-.5)OWNBGM.next=now+.05;
 const hr=HR[G.H||1],iv=60/hr/2,c=G.combo||0;
 while(OWNBGM.next<now+.12){const dl=OWNBGM.next-now,n=OWNBGM.n;
  if(n%2===0)beatAt(dl,G.sync?1:.75);
  if(c>=3&&n%4===2)noiseAt(dl,'snare');
  if(c>=5&&n%2===0)tone(NT(BASS[(n>>1)%8]),dl,.18,'triangle',.09);
  if(c>=8&&n%8===0)brass(NT(BASS[(n>>1)%8]+24),dl,.16,.03);
  if(c>=12)noiseAt(dl,'hat');
  OWNBGM.next+=iv;OWNBGM.n++}
 const bi=60/BR[G.B||1];if(OWNBGM.bn<now){SFX.breathAt(Math.max(0,OWNBGM.bn-now));OWNBGM.bn+=bi;if(OWNBGM.bn<now)OWNBGM.bn=now+bi}}
function beatAt(dl,v){tone(72,dl,.1,'sine',.2*v,44);tone(64,dl+.13,.08,'sine',.13*v,40)}
function noiseAt(dl,k){if(k==='snare')noise(dl,.1,.06,'highpass',1800);else noise(dl,.03,.022,'highpass',6000)}
SFX.breathAt=dl=>noise(dl,.45,.022,'bandpass',750,.8);

/* ================= 画面・canvas（devicePixelRatio に合わせる） ================= */
const cv=$('cv');let cx=cv.getContext('2d');
let W=0,H=0,DPR=1,WIDE=true;const LY={};
function resize(){const r=cv.getBoundingClientRect();W=Math.max(300,r.width||innerWidth);H=Math.max(300,r.height||innerHeight);DPR=Math.min(3,window.devicePixelRatio||1);
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);
 WIDE=W/H>1.05;document.body.classList.toggle('wide',WIDE);document.body.classList.toggle('tall',!WIDE);document.body.classList.toggle('rm',RM());layout()}
function layout(){
 if(WIDE){LY.RX=W*.3;LY.RY=H*.6;LY.LG=Math.min(H*.078,70);LY.U=Math.min(H*.088,W*.058,86);LY.PPM=Math.max(24,W/30);
  const dw=Math.min(470,W-2*(124+44));LY.dg={x:(W-dw)/2,y:H-96,w:dw,h:80};
 }else{const panel=152;LY.dg={x:10,y:H-panel-10-64,w:W-20,h:60};
  LY.Y0=LY.dg.y-18;LY.HZ=H*.25;LY.CX=W/2;LY.LW=Math.min(W*.2,130);LY.U0=Math.min(H*.092,W*.22);LY.ZC=7}
 const w=$('warn'),ln=$('lockNote');
 if(WIDE){w.style.top='';w.style.bottom=(96+10)+'px';ln.style.top='';ln.style.bottom=(96+48)+'px'}
 else{w.style.bottom='';w.style.top=Math.max(110,LY.HZ+6)+'px';ln.style.bottom='';ln.style.top=Math.max(146,LY.HZ+44)+'px'}}
let AMB=-.16;
function proj(z,lane,h){h=h||0;
 if(WIDE){const ca=Math.cos(AMB),sa=Math.sin(AMB),u=z*LY.PPM,s=LY.U*(1+(lane-1)*.09);return {x:LY.RX+u*ca,y:LY.RY+u*sa+(lane-1)*LY.LG-h*s,s,p:1}}
 const zz=Math.max(z,-LY.ZC*.72),p=LY.ZC/(zz+LY.ZC),s=LY.U0*p;
 return {x:LY.CX+(lane-1)*LY.LW*p,y:LY.HZ+(LY.Y0-LY.HZ)*p-h*s,s,p}}
function P(){cx.beginPath()}
function poly(pts,fill,stroke,lw){P();pts.forEach((q,i)=>i?cx.lineTo(q.x,q.y):cx.moveTo(q.x,q.y));cx.closePath();if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=lw||2;cx.stroke()}}
function txt(s,x,y,size,col,align,rot,base){cx.save();cx.translate(x,y);if(rot)cx.rotate(rot);cx.font=size+'px '+FONT;cx.textAlign=align||'center';cx.textBaseline=base||'middle';cx.fillStyle=col;cx.fillText(s,0,0);cx.restore()}
function slab(x,y,w,h,col,skew){cx.save();cx.translate(x,y);cx.transform(1,0,skew==null?-.21:skew,1,0,0);cx.fillStyle=col;cx.fillRect(-w/2,-h/2,w,h);cx.restore()}
// 紙の地（粒）
let GRAIN=null;(function(){const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');const d=g.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()<.5?14:0}g.putImageData(d,0,0);GRAIN=c})();
function grain(){if(!GRAIN)return;const pt=cx.createPattern(GRAIN,'repeat');cx.fillStyle=pt;cx.fillRect(0,0,W,H)}

/* ================= ゲームの状態 ================= */
let G=null,scene='title',SEL=1,TUTSTEP=-1,TUTFROM='start';
function compile(si){const st=STAGES[si];const segs=[];let x=0,prevD=0;const evs=[];
 st.segs.forEach((s,k)=>{const len=s[0],pace=s[1],mod=s[2]||'',place=s[3]||st.place;const D=Math.min(5,pace+(mod?1:0));
  const seg={a:x,b:x+len,pace,mod,place,D,spd:SPD[pace]*MODF[mod]};segs.push(seg);
  if(k>0&&(D!==prevD||mod!==segs[k-1].mod))evs.push({at:x,D,pace,mod,up:D>prevD,same:D===prevD});
  prevD=D;x+=len});
 const total=x;
 // 障害物
 const obs=[];
 if(st.obs)st.obs.forEach(o=>obs.push({at:o[0],lane:o[1],type:o[2]}));
 else{let seed=si*97+13;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};let z=46;
  while(z<total-36){const near=evs.some(e=>Math.abs(e.at-z)<9)||(st.forks||[]).some(f=>z>f.at-30&&z<f.at+f.len+6);
   if(!near){const lane=Math.floor(r()*3);obs.push({at:z,lane,type:['cone','hurdle','puddle','crate'][Math.floor(r()*4)]});
    if(st.dens>.75&&r()<.3){const l2=(lane+1+Math.floor(r()*2))%3;obs.push({at:z+.2,lane:l2,type:'cone'})}}
   z+=(20+r()*16)/(st.dens||.6)*.62}}
 // 目標タイム（いつもそろえて加速したとき＋反応の余裕）
 let ideal=0;segs.forEach(s=>ideal+=(s.b-s.a)/(s.spd*1.12));ideal+=evs.length*.35+1.2;
 return {segs,evs,total,obs,ideal,forks:(st.forks||[]).map(f=>Object.assign({done:false},f))}}
function segAt(g,d){const s=g.segs;for(let i=0;i<s.length;i++)if(d<s[i].b)return s[i];return s[s.length-1]}
function demandNow(g){const s=segAt(g,g.dist);return Math.min(5,s.D+(g.fork?1:0))}
function newRace(si){const c=compile(si),st=STAGES[si];
 return Object.assign(c,{si,st,dist:0,v:0,t:0,rt:0,lane:1,laneF:1,B:1,H:1,O:100,D:c.segs[0].D,sync:false,combo:0,maxC:0,cur:null,ei:0,fork:null,laneLock:false,
  stum:0,count:st.tut?0:3.2,started:!!st.tut,paused:false,done:false,perf:0,saki:0,good:0,miss:0,hits:0,
  rec:[],recT:0,ghost:SV.ghost[si]||null,locks:(st.locks||[]).map(l=>Object.assign({on:false,off:false,def:0},l)),
