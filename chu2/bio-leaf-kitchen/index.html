<!DOCTYPE html>

<title>葉っぱキッチン ～光合成～</title>
<!--
 ==========================================================================
 葉っぱキッチン ～光合成～（bio-leaf-kitchen / chu2-seibutsu-07・予想用）
 ねらい: 光のエネルギーを使い、二酸化炭素と水からデンプンなどと酸素ができる（光合成）。
         このコマは光合成の実験の「前」。実験の手順（下ごしらえ）を体で覚え、
         何ができるかは「予言の鍋」に封印する（結果はゲームで見せない）。
 --------------------------------------------------------------------------
 1. 世界とメタファー: 1950年代のテレビ料理番組「リーフ・キッチン」。プレイヤーはシェフ。
    厨房（暗室の扉・日なたの窓・熱湯なべ・湯せん・直火・流し・ヨウ素液・ストロー・水草の水そう）を
    走り回って、注文票どおりの「光合成の実験の下ごしらえ」を時間内に仕上げ、出し口から出す。
    Overcooked 型のてんてこ舞い。道のり＝本店→2号店→3号店（公開収録）。集める＝器具と手順の手帖。
 2. 配色: 背景 #F4E9D8（クリームの壁紙）／主 #3E7C59（ミッドセンチュリーの緑）／差し #E76F51（サーモン）
    ＋マスタード #E9B949・ティール #3A8C8C・ミント #BFDCD3・木 #B7794A・墨 #2B2A28。
    試薬の色は理科どおり: ヨウ素液＝茶色（デンプンがあると青紫）／BTB液＝青→緑→黄（二酸化炭素が溶けると黄）／
    エタノール＝脱色すると緑色にそまり、葉は白っぽくなる。
 3. 書体: 見出し＝Kosugi Maru（丸ゴシック）＋英字ロゴ＝Pacifico（50年代の筆記体）。
 4. 画風: ミッドセンチュリーのイラスト。くすんだ平塗り＋少しずれた墨の輪郭線（版ずれ風）、
    スターバースト（✦の光）・ブーメラン模様のカウンター・原子模様の壁紙・紙の粒子。
    ダイアログは「木枠のブラウン管テレビ」、ボタンは台形の看板、確認テストは「レシピカード」。
 5. 画面の組み方: 全画面の canvas。PC・iPad横＝横長の厨房全体（奥の壁の列＋手前カウンターの列、間の通路をシェフが走る）。
    スマホ縦＝厨房を上下2段に組み替え、シェフは画面の真ん中の通路。上に注文票のレール。
 6. HUD: 注文票（クリップで留めた伝票）・キッチンタイマー・拍手ランプ・かけらの値札・「もどる」の矢印看板。
 7. 音: ビブラフォン風の和音・カウンターベル「チーン」・拍手・火のボッ、を WebAudio で合成。
 8. 理科の埋め込み: 手順の順番そのものが操作。暗室を飛ばす／直火でエタノール／緑のままヨウ素液／
    息をふきこまずに光、はその場で失敗（死に覚えの罠）→ 1行で理由。正しく出した皿だけが拍手とかけら。
 ==========================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

#mapBar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:10px 10px calc(12px + env(safe-area-inset-bottom))}

/* HUD（もどる・音） */

 clip-path:polygon(0 50%,22px 0,100% 0,100% 100%,22px 100%)}

#bMute{position:absolute;right:8px;top:8px;z-index:20;width:48px;height:46px;border:3px solid var(--ink);background:var(--paper);border-radius:50% 50% 46% 46%/60% 60% 40% 40%;font-size:13px;box-shadow:3px 3px 0 var(--ink)}
#bMute.off{background:#d9cdb8;text-decoration:line-through}
/* カンペ（字幕） */
#cue{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-.6deg);z-index:15;max-width:min(94vw,860px);width:max-content;
 background:var(--mustard);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 16px;font-size:16px;line-height:1.45;text-align:center;pointer-events:none}
#cue b{color:#8C2E17}
#cue.bad{background:#F2B6A6}
#cue.good{background:#CFE6C8}
/* テレビのダイアログ */
#ov{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(43,42,40,.42);padding:12px}
.tv{position:relative;width:min(640px,96vw);max-height:94%;display:flex;flex-direction:column;background:var(--wood);
 background-image:repeating-linear-gradient(92deg,rgba(0,0,0,.06) 0 3px,transparent 3px 11px);border:4px solid var(--ink);border-radius:26px;padding:16px 16px 12px;box-shadow:8px 8px 0 var(--ink)}
.tv::before,.tv::after{content:'';position:absolute;bottom:-22px;width:12px;height:22px;background:var(--ink);transform:skewX(14deg)}
.tv::before{left:18%}.tv::after{right:18%;transform:skewX(-14deg)}
.tvScr{flex:1;min-height:0;overflow:auto;background:#EEF1E4;background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.7),transparent 55%);border:5px solid var(--ink);border-radius:34px/26px;padding:18px 18px 16px;
 box-shadow:inset 0 0 26px rgba(43,42,40,.25)}
.tvKnob{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 6px 0}
.tvKnob i{width:26px;height:26px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:inline-block;position:relative}
.tvKnob i::after{content:'';position:absolute;left:50%;top:2px;width:3px;height:9px;background:var(--ink);transform:translateX(-50%) rotate(35deg);transform-origin:50% 9px}
.tvKnob .brand{font-family:var(--script);color:var(--paper);font-size:18px}
.mh{font-size:24px;color:var(--green);text-align:center;margin:0 0 6px;letter-spacing:.05em}

.rline{display:flex;justify-content:space-between;border-bottom:2px dotted #b9ad96;padding:5px 2px;font-size:16px}
.newel{display:flex;gap:12px;align-items:center;background:var(--paper);border:3px solid var(--ink);padding:10px;margin:8px 0;transform:rotate(-.5deg)}

.newel div{font-size:15px;line-height:1.55}
/* 手帖 */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}

.bk img{width:84px;height:84px;display:block;margin:0 auto 2px}
.bk b{display:block;font-size:14px;color:var(--green)}
.bk.no{background:#e3d9c6;color:#8d826f}
.bk.no b{color:#8d826f}
.bk .st{font-size:12px;color:#8C2E17}

#scSeal{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:64px 10px calc(12px + env(safe-area-inset-bottom))}
#sealHead{text-align:center;background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 14px;max-width:min(94vw,760px);font-size:16px;line-height:1.55}
#sealHead h2{margin:0;font-size:22px;color:var(--green)}
#sealStage{position:relative;flex:1;width:100%;max-width:1100px;min-height:0}

.jar{width:96px;height:112px;border:0;background:none;padding:0;touch-action:none;position:relative}
.jar svg{width:100%;height:100%;pointer-events:none}
.jar.drag{opacity:.35}
#sealGo{margin-top:8px}
.ghost{position:fixed;z-index:60;pointer-events:none;width:96px;height:112px;transform:translate(-50%,-50%) rotate(-6deg)}
/* 確認テスト（レシピカード） */
#scTest{position:absolute;inset:0;z-index:25;overflow:auto;padding:66px 12px 30px;display:flex;justify-content:center}
.card{position:relative;width:min(920px,100%);background:#FFFBF2;background-image:linear-gradient(transparent 0 58px,#E76F51 58px 61px,transparent 61px),repeating-linear-gradient(transparent 0 31px,#9CC5D6 31px 32px);
 border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:12px 20px 22px;transform:rotate(-.4deg);align-self:flex-start}
.card .qh{display:flex;justify-content:space-between;align-items:center;height:48px;font-size:17px}
.card .qh b{font-family:var(--script);color:var(--salmon);font-size:22px;font-weight:400}
.qbody{display:flex;gap:18px;margin-top:14px}
.qL{flex:1.1}.qR{flex:1}
.qtext{font-size:19px;line-height:1.75}
.qfig{margin-top:10px;background:#fff;border:2px solid var(--ink);padding:6px;text-align:center}
.qfig svg{max-width:100%;height:auto}
.qch{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;background:var(--paper);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 12px;font-size:16px;line-height:1.45}
.ans i{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-style:normal;background:var(--k,var(--teal));color:#fff;border:2px solid var(--ink)}
.ans:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ans.done{opacity:.35}
.ordSlots{display:flex;flex-direction:column;gap:4px;margin:6px 0 10px}
.ordSlots div{border-bottom:2px dashed #b9ad96;min-height:30px;font-size:15px;padding:4px}
.qfb{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(43,42,40,.4);padding:14px}
.qfb .in{width:min(560px,96vw);background:var(--paper);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);padding:16px;text-align:center}
.qfb .mk{font-size:64px;line-height:1;font-family:var(--script)}
.qfb .ex{font-size:16px;line-height:1.7;text-align:left;margin:8px 0 12px}
@media (max-width:600px){.jar{width:74px;height:86px}#sealHead{font-size:14px}#sealHead h2{font-size:19px}}
@media (max-width:720px){.qbody{flex-direction:column}.qtext{font-size:17px}.card{padding:10px 12px 18px}}
/* 仕上げ 2026-09-28（lk-finish-2026-09-28）: ✦のドン・スターバーストの紙吹雪 */
.stars span{display:inline-block}
@media (orientation:portrait){#cue{left:calc(50% + 29px);max-width:calc(100vw - 74px)}}
.stars .on.don{animation:lkDon .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes lkDon{0%{transform:scale(3.2) rotate(-60deg);opacity:0}60%{transform:scale(.85);opacity:1}100%{transform:none;opacity:1}}
.stars .on.wait{opacity:0}
.tv.don{animation:lkTv .2s ease-out}
@keyframes lkTv{40%{transform:translateY(6px)}100%{transform:none}}
.lkcf{position:fixed;top:-24px;z-index:45;pointer-events:none;width:var(--w);height:var(--w);background:var(--c);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:lkcf var(--t) cubic-bezier(.3,.2,.6,1) var(--d) forwards}
@keyframes lkcf{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.lkcf{display:none}.stars .on.wait{opacity:1}}
</style>
</head>

<script>/*@SUBMIT_CARD_BEGIN*/

   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）

     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

const PRACTICE={label:'れんしゅう中',bandAt:'bottom',steps:PSTEPS,clearText:'れんしゅうクリア！',start:()=>{actx();startRound(-1)},
 onExit:res=>{if(res&&(res.stopped||res.replaced))return;G=null;if(SV.cur>0)openMap();else startRound(0)}};
$('btnCont').onclick=()=>{actx();SV.name=$('nameIn').value.trim()||SV.name;save();SFX.tap();openMap()};
$('btnBookT').onclick=()=>{try{Z().openBook()}catch(e){}};
if(window.Guide)Guide.tutorialButton('#btnHow',()=>{actx();SFX.tap();Guide.tutorial(PRACTICE)});else $('btnHow').hidden=true;
$('btnBookM').onclick=()=>{try{Z().openBook()}catch(e){}};
$('btnHub').onclick=()=>{try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}};
$('btnNote').onclick=()=>{SFX.tap();openNote()};
$('btnSealM').onclick=()=>{SFX.tap();openSeal()};
$('btnTestM').onclick=()=>{SFX.tap();startTest()};
$('bMute').onclick=()=>{SV.mute=!SV.mute;save();$('bMute').classList.toggle('off',SV.mute);if(!SV.mute){actx();SFX.tap()}};
$('bBack').onclick=()=>{SFX.tap();if(scene==='play'&&G&&G.R.prac){if(window.Guide)Guide.tutorialEnd();G=null;initTitle();return}
 if(scene==='play'&&G){G.paused=true;ovOpen('<div class="mh"><small>Commercial break</small>番組表にもどる？</div><p class="mp" style="text-align:center">クリアした回と★は保存されます。<br>この回の途中の皿は、やり直しになります。</p><div class="mbtns"><button class="pl" id="bkY"><span>もどる</span></button><button class="pl g sm" id="bkN"><span>つづける</span></button></div>');
  $('bkY').onclick=()=>{SFX.tap();save();openMap()};$('bkN').onclick=()=>{SFX.tap();ovClose();if(G)G.paused=false}}
 else if(scene==='map'){initTitle()}else if(scene==='seal'){openMap()}else if(scene==='test'){T=null;openMap()}};
function ovOpen(h){$('ovBody').innerHTML=h;$('ov').hidden=false;$('ovBody').scrollTop=0}
function ovClose(){$('ov').hidden=true;$('ovBody').innerHTML=''}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ================= 確認テスト ================= */
let T=null;
function startTest(){if(!window.Quiz){ovOpen('<p class="mp">問題データがありません</p>');return}G=null;ovClose();show('test');T={qs:Quiz.test(),i:0,ans:[]};renderQ()}
function renderQ(){const q=T.qs[T.i];$('qNo').textContent=(T.i+1)+' / '+T.qs.length;$('qText').textContent=q.q;const f=$('qFig');if(q.fig){f.innerHTML=q.fig;f.hidden=false}else{f.innerHTML='';f.hidden=true}
 const A=$('qArea');A.innerHTML='';$('scTest').scrollTop=0;const KC=[C.salmon,C.teal,C.green,C.mustD,'#7A5C99'];
 const mk=(c,k,lab)=>{const b=document.createElement('button');b.className='ans';b.style.setProperty('--k',KC[k%5]);b.innerHTML='<i>'+lab+'</i><span></span>';b.lastChild.textContent=c;return b};
 if(q.t==='choice'){const box=document.createElement('div');box.className='qch';q.shown.forEach((c,k)=>{const b=mk(c,k,'ABCDE'[k]);b.onclick=()=>answer(c);box.appendChild(b)});A.appendChild(box)}
 else if(q.t==='order'){const pk=[];const slots=document.createElement('div');slots.className='ordSlots';const box=document.createElement('div');box.className='qch';
  const draw=()=>{slots.innerHTML=q.items.map((_,k)=>'<div>'+(k+1)+'. '+(pk[k]?esc(pk[k]):'')+'</div>').join('');box.querySelectorAll('.ans').forEach(b=>b.classList.toggle('done',pk.indexOf(b.dataset.v)>=0))};
  q.shown.forEach((c,k)=>{const b=mk(c,k,String(k+1));b.dataset.v=c;b.onclick=()=>{if(pk.indexOf(c)>=0)return;pk.push(c);SFX.tap();draw();if(pk.length===q.items.length)setTimeout(()=>answer(pk.slice()),250)};box.appendChild(b)});
  const rs=document.createElement('button');rs.className='pl m sm';rs.style.marginTop='12px';rs.innerHTML='<span>やり直す</span>';rs.onclick=()=>{pk.length=0;draw()};
  const hint=document.createElement('div');hint.style.cssText='font-size:15px;margin-bottom:4px';hint.textContent='最初の手順から順にタップしよう';A.appendChild(hint);A.appendChild(slots);A.appendChild(box);A.appendChild(rs);draw()}
 else{const w=document.createElement('div');w.className='qch';w.innerHTML='<div style="display:flex;gap:8px;align-items:center"><input id="numIn" inputmode="decimal" style="font-size:20px;width:8em;padding:8px;border:3px solid #2B2A28"><b>'+esc(q.unit||'')+'</b></div><button class="pl" id="numOk"><span>これで決める</span></button>';A.appendChild(w);$('numOk').onclick=()=>answer($('numIn').value)}}
function answer(a){const q=T.qs[T.i];T.ans[T.i]=a;const ok=Quiz.check(q,a);ok?(SFX.bell()):SFX.fail();
 const d=document.createElement('div');d.className='qfb';d.innerHTML='<div class="in"><div class="mk" style="color:'+(ok?C.green:C.salmonD)+'">'+(ok?'Good!':'Oops!')+'</div><div class="ex">'+(ok?'':'<b>正解：</b>'+esc(Quiz.answer(q))+'<br>')+esc(q.ex||'')+'</div><button class="pl"><span>'+(T.i+1<T.qs.length?'次の問題へ':'結果へ')+'</span></button></div>';
 $('app').appendChild(d);d.querySelector('.pl').onclick=()=>{d.remove();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}}
function finishTest(){const qs=T.qs,answers=T.ans;const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const tm=window.GAME_MODE==='test';const name=window.PLAYER_NAME||SV.name||$('nameIn').value.trim()||'';
 const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'};const nStar=SV.stars.reduce((a,b)=>a+b,0);
 const done=()=>{T=null;if(tm){show('test');$('qText').textContent='おつかれさまでした。提出カードは先生に見せよう。';$('qArea').innerHTML='';$('qFig').hidden=true;const b=document.createElement('button');b.className='pl';b.style.marginTop='16px';b.innerHTML='<span>もう一度 確認テスト</span>';b.onclick=startTest;$('qArea').appendChild(b)}else openMap()};
 if(!window.SubmitCard){done();return}
 SubmitCard.show({gameId:GAME_ID,grade:'chu2',koma:[KOMA],unit:'中2理科　生物の体のつくりと働き　第7回',game:'葉っぱキッチン ～光合成～'+(tm?'（確認テストのみ）':''),
  name,score,total:qs.length,marks,
  records:tm?[['モード','確認テストだけ']]:[['収録時間',fmt(SV.elapsed)],['出した皿',SV.served+' 皿'],['集めた★',nStar+' / 27'],['予言の鍋',SV.sealed?'封印ずみ':'まだ']],
  review},done)}

/* ================= ループ ================= */
let last=performance.now(),tt=0;
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;tt+=dt;
 try{if(scene==='play'&&G){if(!G.paused&&!G.over)update(dt);render()}else if(scene==='title'){drawTitle(tt);grain()}else if(scene==='map'){drawMap(tt);grain()}else if(scene==='seal'){drawSeal(tt);grain()}else if(scene==='test'){wallpaper(0,0,W,H,C.cream)}}catch(e){console.error(e)}
 requestAnimationFrame(frame)}
let HELP=null;
function placeHelp(){if(!HELP)return;HELP.update(PORT?{corner:'bl',offset:{x:0,y:0}}:{corner:'tr',offset:{x:0,y:52}})}
if(window.Guide){
 Guide.setup({theme:{bg:'#FBF3E4',fg:'#2B2A28',accent:'#E76F51',accentText:'#FFF8EC',font:"'Kosugi Maru','Hiragino Maru Gothic ProN',sans-serif",bodyFont:"'Kosugi Maru','Hiragino Maru Gothic ProN',sans-serif",
   radius:14,texture:'dots',line:'#2B2A28',dim:'rgba(43,42,40,.4)',shadow:'5px 5px 0 #2B2A28',outline:'#2B2A28',hand:'#FBF3E4',handLine:'#2B2A28'},
  sfx:k=>{if(k==='step')SFX.done();else if(k==='nudge')SFX.tick();else if(k==='done')SFX.bell();else if(k==='clear'){SFX.fanfare();setTimeout(SFX.clap,300)}else if(k==='open'||k==='close')SFX.tap();else if(k==='cheer')SFX.jar()},
  muted:()=>SV.mute});
 HELP=Guide.help({title:INTRO.title,learn:INTRO.learn,how:INTRO.how,gesture:'tap',size:46,show:false,attention:true,replay:'tutorial',
  rules:['注文票と **同じ皿** を「出し口」へ。注文票をタップすると 手順のメモが見られる',
   '**✦が光ったら** できあがり。もう一度タップで取り出す',
   '順番をまちがえると **しっぱい**（暗室を飛ばす・直火のエタノール・緑のままヨウ素液・息をふきこまない）',
   '**比べる用** の皿は「ちがう条件は1つだけ」。つづけて出すと **れんぞく**',
   '時間内に出した皿の数で ★が決まる'],
  onOpen:()=>{if(scene==='play'&&G&&!G.paused){G.paused=true;G.hp=1}},
  onClose:()=>{if(G&&G.hp){G.hp=0;G.paused=false}}});
 placeHelp();addEventListener('resize',placeHelp);
}
window.__lk={get G(){return G},stById,get mapHits(){return mapHits},get SV(){return SV},startRound,openMap,openSeal,startTest,tapStation,endRound};
resize();
try{window.Zukan&&Zukan.setup({game:GAME_ID,koma:[KOMA]})}catch(e){}
if(window.GAME_MODE==='test'){startTest()}else{initTitle()}
requestAnimationFrame(frame);
})();
