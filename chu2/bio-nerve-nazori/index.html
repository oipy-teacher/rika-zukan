<title>神経なぞり ～刺激が伝わる道すじ～</title>
<!--
 ==========================================================================
 神経なぞり ～刺激が伝わる道すじ～（bio-nerve-nazori / chu2-seibutsu-32）
 ねらい: 刺激は 感覚器官→感覚神経→中枢（脳・脊髄）→運動神経→筋肉 の順に伝わって反応が起こる。
         目・耳・鼻・舌（頭部）の信号は脊髄を通らず直接脳へ。皮ふの信号は脊髄を通って脳へ。
         脳の命令は 脊髄→運動神経→筋肉。（「反射」という用語は使わない＝気づいてから動く反応だけ）
 役割: なし（予想用・確認用の組ではない。封印は読まない・書かない）
 --------------------------------------------------------------------------
 画風: 「ストリングアート（釘と糸の直線）」。黒く塗った板に真鍮の釘を打ち、白い糸を釘から釘へ
   まっすぐ張って模様を作る技法。曲線はすべて直線の糸の重なり（包絡線）で見せる。
 1. 世界とメタファー: 1枚の「神経の板」。玉＝釘の輪に糸を巻いた飾り（目・耳・皮ふ・鼻・舌／感覚神経／
    脳／脊髄／運動神経／手・足・首の筋肉）。指でなぞると糸が釘から釘へ張られ、正しい順につながると
    オレンジの信号の光が糸を走り、玉がはじけ、左（スマホは上）の場面の糸の人形が振り向く・走り出す。
    道のり＝糸の人形の全身図に、場面ごとの神経の道すじが1本ずつ張られていく。
    集める＝「糸カード」（神経の図鑑）＋中2理科図鑑ガチャ。
 2. 配色: 板 #1B1B1B／糸 #F2F2F2／信号・差し #FF7F11／釘 真鍮 #C9A45C／
    糸の色分け 感覚神経 #63C3D8・運動神経 #F0C75E・筋肉 #E0685A（刺しゅう糸の色）。
    紫と水色のグラデ・光る脳・ロボットは使わない。
 3. 書体: 見出し・玉の字・数字＝Stick（細い棒の字＝糸の線）／本文＝Zen Kaku Gothic New。
 4. 画面の組み方: 全画面。PC・iPad横＝左に場面の板・右に大きな神経の盤（8列×6段）。
    スマホ・iPad縦＝上に場面の板・下に縦長の盤（6列×8段）で、指の届く所に玉を置く。canvas は devicePixelRatio 対応。
 5. HUD: 板の上端の細い桟に、釘で留めた札（もどる）・糸で書いた数字（信号）・巻き取った糸の本数（進み具合）・
    コンボは盤の上に糸の字で大きく。かけらは Zukan.state() を読んで札に書く。
 6. 音: はじく弦（Karplus-Strong 合成）。つなぐたびに音程が上がる。糸が切れる「ビン！」。
 7. 核の操作: ツムツム型なぞり消し。玉を一筆でなぞる。正しい順（器官→感覚神経→[脊髄]→脳→脊髄→運動神経→筋肉）
    だけが消える。順を飛ばす・逆にする・中枢を飛ばすと糸が切れ、倍率リセット＋理由を1行で出す。
    長くつなぐほど（感覚神経・運動神経の玉を何個も通るほど）得点が大きい。れんしゅう面と第1場面は失敗しない
    （まちがった玉には糸がかからず、ヒントが出るだけ）。
 8. 流れ: 表紙 → この回でわかること（Guide.intro）→ れんしゅう（Guide.tutorial）→ 第1〜8場面（第8＝はじめての場面3連続の
    タイムアタック）→ 本編クリア（Zukan.mainClear）→ 確認テスト（Quiz.test）→ 提出カード（SubmitCard.show）
 ==========================================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stick&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B1B1B;--th:#F2F2F2;--or:#FF7F11;--brass:#C9A45C;--se:#63C3D8;--mo:#F0C75E;--mu:#E0685A;
 --hd:"Stick","Zen Kaku Gothic New","Hiragino Sans",sans-serif;--bd:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--th);font-family:var(--bd);touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
/* 糸を張った札（ボタン） */
.tag{position:relative;min-height:48px;padding:10px 20px;border:0;background:transparent;color:var(--th);font-family:var(--hd);font-size:22px;letter-spacing:.06em;
 background-image:repeating-linear-gradient(135deg,rgba(242,242,242,.07) 0 1px,transparent 1px 7px);
 outline:2px solid var(--th);outline-offset:-6px;box-shadow:inset 0 0 0 1px rgba(242,242,242,.35);transition:transform .08s}
.tag::before,.tag::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6e2a4,var(--brass) 55%,#6b5424);top:3px;left:3px}
.tag::after{left:auto;right:3px}
.tag:active{transform:translateY(3px) scale(.97)}
.tag.or{outline-color:var(--or);color:#fff;background-color:rgba(255,127,17,.14);box-shadow:inset 0 0 0 1px rgba(255,127,17,.6),0 0 22px rgba(255,127,17,.25)}
.tag.big{font-size:30px;padding:14px 34px;min-height:64px}
.tag.sm{font-size:18px;padding:8px 14px;min-height:44px}
.tag small{display:block;font-family:var(--bd);font-size:12px;letter-spacing:0;opacity:.8}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pulse{animation:beat 1.1s ease-in-out infinite}
/* もどる（いつも左上・釘で留めた白い札） */
#bBack{position:fixed;z-index:60;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));min-height:50px;padding:6px 18px 6px 10px;border:0;
 background:#F2F2F2;color:#1B1B1B;font-family:var(--hd);font-size:22px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #000,0 0 0 2px #1B1B1B,0 0 0 4px #F2F2F2;transform:rotate(-2deg)}
#bBack b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--or);color:#fff;font-size:15px;font-family:var(--bd)}
#bBack::before{content:"";position:absolute;top:-6px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6e2a4,var(--brass) 55%,#6b5424)}
#bBack:active{transform:rotate(-2deg) translateY(3px)}
#tops{position:fixed;z-index:60;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center}
.ic{width:48px;height:48px;border:0;background:#1B1B1B;color:var(--th);font-size:22px;display:grid;place-items:center;outline:2px solid var(--th);outline-offset:-5px}
/* 表紙 */
#scrTitle{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px max(22px,env(safe-area-inset-bottom));pointer-events:none}
#scrTitle>*{pointer-events:auto}
#logo{position:fixed;left:0;right:0;text-align:center;pointer-events:none;z-index:21}
#logo h1{margin:0;font-family:var(--hd);font-weight:400;font-size:clamp(54px,11vmin,120px);letter-spacing:.08em;line-height:1;color:#fff;text-shadow:0 0 1px #fff,3px 3px 0 #000}
#logo h1 span{display:inline-block;opacity:0;transform:translateY(-40px);animation:drop .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes drop{to{opacity:1;transform:none}}
#logo p{margin:.5em 0 0;font-family:var(--hd);font-size:clamp(18px,3.4vmin,30px);color:var(--or);letter-spacing:.12em}
#logo svg{display:block;margin:4px auto 0;width:min(560px,80vw);height:20px}
#logo svg path{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.4s .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tBtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
#nmRow{margin-bottom:10px;display:flex;gap:8px;align-items:center;font-size:15px}
#nmRow input{font:inherit;font-size:18px;width:12em;padding:8px 10px;background:#111;color:#fff;border:0;outline:2px solid #888;outline-offset:-2px}
/* マップ */
#scrMap{position:fixed;inset:0;z-index:20;pointer-events:none}
#scrMap>*{pointer-events:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;border:0;background:#1B1B1B;color:#fff;font-family:var(--hd);font-size:25px;
 box-shadow:0 0 0 2px #F2F2F2,0 0 0 6px #1B1B1B,0 0 0 7px rgba(242,242,242,.5);display:grid;place-items:center;line-height:1}
.pin small{display:block;font-size:12px;font-family:var(--bd);margin-top:2px;color:var(--brass)}
.pin.done{box-shadow:0 0 0 2px var(--or),0 0 0 6px #1B1B1B,0 0 0 7px var(--or),0 0 22px rgba(255,127,17,.5)}
.pin.lock{opacity:.35}
.pin.next{animation:beat 1.1s infinite}
.pin .st{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--or);white-space:nowrap;letter-spacing:1px}
#mapBar{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
#mapHead{position:absolute;top:max(66px,calc(env(safe-area-inset-top) + 60px));left:0;right:0;text-align:center;font-family:var(--hd);font-size:clamp(20px,3.6vmin,32px);pointer-events:none}
#mapHead small{display:block;font-family:var(--bd);font-size:13px;opacity:.75;margin-top:4px}
/* 重ね札（結果・確認） */
.ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,10,10,.72);padding:16px}
.plate{position:relative;max-width:560px;width:100%;background:#1B1B1B;padding:26px 22px 20px;text-align:center;
 outline:2px solid var(--th);outline-offset:-10px;box-shadow:0 0 0 1px #444,0 20px 60px #000;background-image:repeating-linear-gradient(45deg,rgba(242,242,242,.035) 0 1px,transparent 1px 9px)}
.plate h2{margin:6px 0 8px;font-family:var(--hd);font-weight:400;font-size:clamp(28px,6vmin,44px);letter-spacing:.06em}
.plate p{margin:8px 0;line-height:1.7;font-size:16px}
.plate .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.stars{display:flex;gap:14px;justify-content:center;margin:6px 0 4px;min-height:64px}
.stars i{font-style:normal;font-size:56px;line-height:1;color:#333;transform:scale(0);display:inline-block}
.stars i.on{color:var(--or);text-shadow:0 0 18px rgba(255,127,17,.8)}
.stars i.pop{animation:stamp .45s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes stamp{0%{transform:scale(2.4) rotate(-20deg);opacity:0}100%{transform:scale(1);opacity:1}}
.recs{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:center;font-size:15px;margin:10px 0}
.recs b{font-family:var(--hd);font-size:22px;color:var(--or);font-weight:400}
.why{font-size:15px;color:#ddd;border-top:1px dashed #666;padding-top:8px}
/* 糸カード */
#scrBook .plate{max-width:900px;max-height:92vh;overflow:auto;touch-action:pan-y}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:10px}
.card{background:#141414;padding:8px 8px 10px;outline:1px solid #555;outline-offset:-4px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;display:block}
.card b{display:block;font-family:var(--hd);font-weight:400;font-size:20px;margin-top:2px}
.card span{display:block;font-size:12px;line-height:1.5;color:#ccc;margin-top:3px}
.card.no{opacity:.35}
/* 確認テスト */
#scrTest{position:fixed;inset:0;z-index:30;overflow-y:auto;touch-action:pan-y;padding:max(70px,calc(env(safe-area-inset-top) + 64px)) 14px 40px;background:transparent}
.tbox{max-width:780px;margin:0 auto}
#tNo{font-family:var(--hd);font-size:22px;color:var(--or);text-align:center}
#tLamps{display:flex;gap:6px;justify-content:center;margin:8px 0 12px}
#tLamps i{width:16px;height:16px;border-radius:50%;border:2px solid #777}
#tLamps i.ok{background:var(--or);border-color:var(--or)}#tLamps i.ng{background:#555;border-color:#999}#tLamps i.cur{border-color:#fff;box-shadow:0 0 8px #fff}
#tQ{font-size:clamp(18px,2.6vmin,22px);line-height:1.7;font-weight:700;background:#111;padding:14px 16px;outline:1px solid #666;outline-offset:-5px}
#tFig{background:#fff;margin:10px auto;max-width:460px;padding:6px}
#tFig svg{width:100%;height:auto;display:block}
#tA{display:grid;gap:10px;margin-top:12px}
.ch{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;text-align:left;font-size:17px;font-family:var(--bd);font-weight:700;background:#161616;border:0;color:#fff;outline:2px solid #bbb;outline-offset:-5px;position:relative}
.ch i{font-style:normal;font-family:var(--hd);font-size:22px;color:var(--or);min-width:24px;text-align:center}
.ch.ok{outline-color:var(--or);background:#3a2208}
.ch.ng{outline-color:#666;opacity:.6;text-decoration:line-through}
#ckA .ch{font-size:15px;min-height:50px;line-height:1.45}
.ch:disabled{cursor:default}
.slot{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 12px;background:#0f0f0f;outline:1px dashed #888;outline-offset:-4px;font-weight:700}
.slot i{font-style:normal;font-family:var(--hd);color:var(--or);font-size:20px}
#tEx{margin-top:12px;padding:12px 14px;background:#111;line-height:1.7;outline:1px solid var(--or);outline-offset:-4px}
#tNext{margin:14px auto 0;display:block}
#scrEnd .plate{max-width:520px}
@media (prefers-reduced-motion:reduce){.pulse,.pin.next{animation:none}#logo h1 span{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<button id="bBack" class="hidden" aria-label="もどる"><b>◀</b><span id="bBackT">もどる</span></button>
<div id="tops" class="hidden"><button class="ic" id="bMute" aria-label="音">🔊</button></div>

<div id="logo" class="hidden"><h1 id="logoH"></h1><svg viewBox="0 0 560 20" preserveAspectRatio="none"><path d="M4 12 L556 8" stroke="#FF7F11" stroke-width="2.4" fill="none"/></svg><p>～刺激が伝わる道すじ～</p></div>
<div id="scrTitle" class="hidden">
 <div id="nmRow"><label for="nameIn">なまえ</label><input id="nameIn" maxlength="16" autocomplete="off" placeholder="（なくても遊べる）"></div>
 <div class="tBtns">
  <button class="tag big or pulse" id="bStart">はじめる</button>

  <button class="tag" id="bHow">あそびかた</button>
  <button class="tag" id="bBookT">📖 図鑑</button>
 </div>
</div>

<div id="scrMap" class="hidden">
 <div id="mapHead">糸の人形に、神経の道すじを張ろう<small id="mapSub"></small></div>

 <div id="mapBar">
  <button class="tag sm" id="bCards">🧵 糸カード <span id="cardN"></span></button>
  <button class="tag sm" id="bBook2">📖 図鑑</button>
  <button class="tag sm" id="bGacha">🎁 ガチャ</button>
  <button class="tag sm" id="bToTest">📝 確認テストへ</button>
 </div>
</div>

<div id="scrRes" class="ov hidden"><div class="plate">
 <h2 id="rH">場面クリア！</h2>
 <div class="stars" id="rStars"><i>★</i><i>★</i><i>★</i></div>

</div></div>

<div id="scrChk" class="ov hidden"><div class="plate" style="max-width:640px;max-height:94vh;overflow-y:auto;touch-action:pan-y">
 <h2 style="font-size:clamp(24px,5vmin,36px)">道すじチェック</h2>
 <p id="ckQ" style="font-weight:700"></p>
 <div id="ckA" style="display:grid;gap:8px;margin-top:8px"></div>
 <p class="why hidden" id="ckEx" style="text-align:left"></p>
 <div class="row"><button class="tag or hidden" id="ckNext">つぎへ</button></div>
</div></div>

<div id="scrBackQ" class="ov hidden"><div class="plate">
 <h2>もどる？</h2><p id="bkSub">進み具合は保存されます。</p>
 <div class="row"><button class="tag or" id="bkGo">もどる</button><button class="tag" id="bkNo">つづける</button></div>
</div></div>

<div id="scrBook" class="ov hidden"><div class="plate">
 <h2>糸カード <small style="font-size:.5em" id="bkCount"></small></h2>

 <div class="row"><button class="tag or" id="eMap">道すじの図へ</button></div>
</div></div>

         mel:"1 . 2 . 3 . 4 . | 3 . 2 . 1 . 2 . | 4 . 5 . 6 . 5 4 | 3 - - - 2 - . . | 1 . 2 . 3 . 4 . | 5 . 4 . 3 . 4 5 | 6 . 5 . 4 . 2 . | 1 - - - . . . ."},
      B:{chords:'4 4 3 3 2 2 5 5', bass:'quarter', arp:'up', groove:'half',
         mel:"4 - - - 5 - 6 - | 5 - - - 4 - - - | 3 - - - 4 - 5 - | 4 - - - 3 - - - | 2 - - - 3 - 4 - | 3 - - - 2 - 1 - | 5 - - - 6 - 7 - | 5 - - - - - . ."},
      S:{chords:'1 4 3 5 1 4 5 1', bass:'oct', arp:'updown',
         mel:"6 . 6 . 7 . 6 5 | 4 . 5 . 6 . . . | 8 . 7 . 6 . 5 . | 7 - - - 5 - . . | 6 . 6 . 7 . 8 . | 9 . 8 . 7 . 6 . | 7 . 6 . 5 . 4 . | 6 - - - - - . .",
         mel2:"1 - - - | 1 - - - | 3 - - - | 2 - - - | 1 - - - | 1 - - - | 2 - - - | 1 - - -"},

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と

   ─ このファイルの中身は build_collections.py が各ゲームの

   ─ 2026-10-01: 適当プレイ番（guard.js）が減点したときは、records の「適当プレイ」の行を赤、「解きかた」の行を緑で出し、

(function(){

  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div'+(x[0]==='適当プレイ'?' class="sc-bad"':x[0]==='解きかた'?' class="sc-good"':'')+'>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.tekitou&&r.tekitou.full>0?'<s>ひび入り<br>減点前 '+esc(r.tekitou.raw)+'点</s>':'')+(r.koma&&isPass(r)?'<em>合格</em>':'')+(r.tekitou&&!r.tekitou.full?'<em style="background:linear-gradient(135deg,#f3c34a,#c8862a)">✨本物</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- カラオケ読み ---------------- */
  function karaoke(el, cps){
    var chars = [];

  /* 解説の文が入っている、いちばん小さい見えている要素を探す */

 case 2:if(t==='S')return {ok:true,ns:2};
  if(!skin&&t==='B')return {ok:true,ns:4};if(skin&&t==='C')return {ok:true,ns:3};
  if(t==='M'||t==='U')return no('近道はない！ 気づいて動くには、信号は必ず **中枢** を通る','skip');
  if(!skin&&t==='C')return no('頭にある感覚器官（目・耳・鼻・舌）の信号は、**脊髄を通らない**','head');

 case 3:if(t==='B')return {ok:true,ns:4};
  if(t==='M'||t==='U')return no('この場面は「気づいてから」動く。気づくのは **脳**。信号は まだ脳に届いていない','skip');
  return no('その玉には つながらない。皮ふの信号は **気づく所** まで上る','x');

  if(t==='M'||t==='U')return no('手・足・首への命令は、脳から いきなり 運動神経・筋肉へは出ない','spine');

 case 5:if(t==='M')return {ok:true,ns:6};
  if(t==='U')return no('中枢から筋肉へ 直接はつながらない。**命令を運ぶ神経** がいる','motor');

  return no('その玉には つながらない。命令を **筋肉へ運ぶ神経** をさがそう','x');
 case 6:if(t==='M')return {ok:true,ns:6};
  if(t==='U'&&n.k===cur.u)return {ok:true,ns:7};
  if(t==='U')return no('その筋肉は この場面では動かない。「'+cur.txt+'」で動くのは？','mus');
  return no('その玉には つながらない。命令は **逆もどりしない**','x');
 }return no('','x')}

function seqFor(cur,a,b){var s=['O'];for(var i=0;i<1+a;i++)s.push('S');if(cur.o==='skin')s.push('C');s.push('B','C');for(i=0;i<1+b;i++)s.push('M');s.push('U');return s}

/* 解ける道があるか（深さ優先） */
function findPath(maxN){var cur=G.cur,best=null,cnt=0;
 function dfs(n,s,path){if(++cnt>6000)return;if(s===7){if(!best||path.length>best.length)best=path.slice();return}
  var nb=neighbors(n);for(var i=0;i<nb.length;i++){var m=nb[i];if(path.indexOf(m)>=0)continue;var r=stepS(s,m,cur);if(r.ok){path.push(m);dfs(m,r.ns,path);path.pop();if(best&&maxN&&best.length>=maxN)return}}}
 for(var c=0;c<G.C;c++)for(var r=0;r<G.R;r++){var n=G.grid[c][r];if(n.t==='O'&&n.k===cur.o){dfs(n,1,[n]);if(best)return best}}
 return best}
function plant(prefer){var cur=G.cur,seq=seqFor(cur,ri(0,1),ri(0,1));
 for(var tries=0;tries<80;tries++){var st=prefer&&prefer.length&&tries<40?pick(prefer):G.grid[ri(0,G.C-1)][ri(0,G.R-1)],path=[st];
  var ok=(function walk(){if(path.length===seq.length)return true;var nb=shuffle(neighbors(path[path.length-1]).filter(function(m){return path.indexOf(m)<0}));
   if(prefer)nb.sort(function(a,b){return (prefer.indexOf(b)>=0)-(prefer.indexOf(a)>=0)});
   for(var i=0;i<nb.length;i++){path.push(nb[i]);if(walk())return true;path.pop()}return false})();
  if(ok){path.forEach(function(n,i){var t=seq[i];n.t=t;n.k=t==='O'?cur.o:t==='U'?cur.u:null;n.spin=1});return path}}
 return null}
function ensureSolvable(prefer){if(findPath())return;for(var i=0;i<25;i++){(prefer||[]).forEach(function(n){var m=randType();n.t=m.t;n.k=m.k});if(findPath())return}plant(prefer)}
