<!--
 ==========================================================================
 維管束インターチェンジ ～道管と師管～（bio-vessel-traffic / chu2-seibutsu-14）
 ねらい: 光合成でできた養分（有機物）は、道管とは別の管＝師管を通って、根・つぼみ・実・新芽など
         必要な所へ（上にも下にも）運ばれる。根で吸った水と肥料分は道管で上へ。
         デンプンは水にとけにくいので、水にとけやすい物質（糖）に変えられてから運ばれる。
 --------------------------------------------------------------------------
 遊びの核（割り当て表 84）: 交通整理。一株の植物＝一枚の路線図。根と葉の「出口」に立つ進路標識を
   タップで切りかえ、出てくるトラック（水・肥料分・糖・デンプン）を 道管（上り一方通行）／
   師管（上り線・下り線）へ流す。取り違えると車線の上で立ち往生して渋滞、向きちがいは終点で誤配。
   正しく届いた分だけ 根・実・つぼみ・新芽がふくらみ、水が届いた葉は光合成して次の養分を出す。
   2日×（朝・昼・夕・夜）＝8区。区ごとに交差点（届け先）が1つずつ増える。区の間に「投資」。
 ハマる仕組み: 主⑨アップグレード投資（根毛・葉・気孔・たくわえ＝効く／師管に水の車線・夜の光合成
   ブースター・デンプン直行便・道管の下り線＝効かない。効かない所へ投資するとポイントだけ減る）
   副⑤コンボ（正しい配送が続くと倍率。誤配・渋滞でリセット）・⑰仕分けの快（色の車線へすっと流れる）
 --------------------------------------------------------------------------
 1. 世界とメタファー: スイス・スタイルの路線図と道路標識。幹線＝茎、ランプ＝葉柄・根への枝、
    交差点＝維管束の分かれ目。HUDは案内標識・巨大な区番号・時刻の目盛り。
 2. 配色: 白 #FFFFFF／道管の青 #0057B8／師管の黄 #FFB400／黒 #111111。夜の区だけ地を黒に反転。
 3. 書体: 見出し＝Zen Kaku Gothic New（900の巨大文字）。数字は Helvetica/Arial 系。
 4. 画面: 全画面。PC・iPad横＝横長の路線図（左＝根、右＝新芽）＋左の案内欄。
    スマホ・iPad縦＝縦の幹線（下＝根、上＝新芽）と左右の枝道。canvas は devicePixelRatio に合わせる。
 5. HUD: 左上の青い標識「← もどる」（いつも同じ場所）、巨大な区番号、時刻の目盛り、PT、連続の倍率。
 6. 音: 信号の電子音、ポイント切替のカチッ、配送のチャイム（連続で音が上がる）、渋滞のクラクション。
 画風: スイス・タイポグラフィ（グリッドと巨大な文字）。
 ==========================================================================
-->

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);

      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

x=\"190\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" font-family=\"sans-serif\" fill=\"#24313a\">D\u003c/text>\u003ctext x=\"150\" y=\"132\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">茎\u003c/text>\u003crect x=\"204\" y=\"44\" width=\"92\" height=\"52\" fill=\"#eef5f7\"/>\u003crect x=\"204\" y=\"44\" width=\"92\" height=\"6\" fill=\"#f4f7ea\" stroke=\"#9cbf7e\"/>\u003crect x=\"204\" y=\"90\" width=\"92\" height=\"6\" fill=\"#f4f7ea\" stroke=\"#9cbf7e\"/>\u003ccircle cx=\"250\" cy=\"70\" r=\"17\" fill=\"#e9ecd8\" stroke=\"#9a8f5a\"/>\u003cpath d=\"M236 70A14 14 0 0 1 264 70Z\" fill=\"#dceaf2\" stroke=\"#6d8fa0\"/>\u003cpath d=\"M236 70A14 14 0 0 0 264 70Z\" fill=\"#f3e0b8\" stroke=\"#a97d3c\"/>\u003ctext x=\"208\" y=\"40\" font-size=\"10\" font-family=\"sans-serif\">表\u003c/text>\u003ctext x=\"208\" y=\"108\" font-size=\"10\" font-family=\"sans-serif\">裏\u003c/text>\u003cline x1=\"254\" y1=\"62\" x2=\"284\" y2=\"26\" stroke=\"#24313a\" stroke-width=\"1.2\"/>\u003ccircle cx=\"284\" cy=\"26\" r=\"9\" fill=\"#fff\" stroke=\"#24313a\" stroke-width=\"1.2\"/>\u003ctext x=\"284\" y=\"30\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" font-family=\"sans-serif\" fill=\"#24313a\">E\u003c/text>\u003cline x1=\"254\" y1=\"78\" x2=\"284\" y2=\"114\" stroke=\"#24313a\" stroke-width=\"1.2\"/>\u003ccircle cx=\"284\" cy=\"114\" r=\"9\" fill=\"#fff\" stroke=\"#24313a\" stroke-width=\"1.2\"/>\u003ctext x=\"284\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" font-family=\"sans-serif\" fill=\"#24313a\">F\u003c/text>\u003ctext x=\"250\" y=\"132\" font-family=\"sans-serif\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">葉（葉脈）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2}, {"id": "chu2-bio-vessel-traffic-q003", "koma": "chu2-seibutsu-14", "t": "choice", "q": "光合成でできたデンプンは、どのようにして体の各部へ運ばれる？", "choices": ["水にとけやすい物質に変えられて、師管を通る", "デンプンのまま、師管を通る", "デンプンのまま、道管を通る", "水にとけやすい物質に変えられて、道管を通る"], "ex": "デンプンは水にとけないので、水にとけやすい物質に変わって師管を通る。", "fig": null, "kind": "judge", "level": 1}, {"id": "chu2-bio-vessel-traffic-q004", "koma": "chu2-seibutsu-14", "t": "choice", "q": "同じ株の葉を、夕方と次の日の朝につんで、ヨウ素液で調べた。朝の葉の方が色が変わりにくかった。理由として正しいのは？", "choices": ["夜のあいだに、デンプンが水にとけやすい物質に変わって、ほかの部分へ運ばれたから", "夜のあいだも光合成が続き、デンプンがさらにふえたから", "朝は気温が低く、ヨウ素液が反応しないから", "夜のあいだに、根からデンプンが吸収されたから"], "ex": "昼につくられたデンプンは、夜のあいだに運び出されて葉から減る。", "fig": null, "kind": "judge", "level": 2}, {"id": "chu2-bio-vessel-traffic-q005", "koma": "chu2-seibutsu-14", "t": "choice", "q": "根から吸収された、水にとけた肥料分が通る管は？", "choices": ["道管", "師管", "根毛の中だけで、上へは運ばれない"], "ex": "水と、水にとけた肥料分は道管を通る。師管は葉でつくられた養分の通り道。", "fig": null, "kind": "judge", "level": 2}, {"id": "chu2-bio-vessel-traffic-q006", "koma": "chu2-seibutsu-14", "t": "choice", "q": "師管を通って運ばれる養分の向きとして、正しいものは？", "choices": ["葉から、根・芽・果実など必要な所へ（上にも下にも）", "根から葉へ、上向きだけ", "葉から根へ、下向きだけ"], "ex": "養分は、成長している芽や根、果実、たくわえる所など、必要な所へ運ばれる。", "fig": null, "kind": "judge", "level": 2}, {"id": "chu2-bio-vessel-traffic-q007", "koma": "chu2-seibutsu-14", "t": "choice", "q": "ジャガイモのいもにたくわえられているデンプンは、もとはどこでつくられたものか。", "choices": ["葉の光合成でつくられ、師管を通って運ばれてきたもの", "根が土の中から吸収したもの", "いもの中で、光合成によってつくられたもの"], "ex": "葉でできた養分が師管で運ばれ、いもで再びデンプンになってたくわえられる。", "fig": null, "kind": "judge", "level": 2}, {"id": "chu2-bio-vessel-traffic-q008", "koma": "chu2-seibutsu-14", "t": "choice", "q": "葉でつくられた養分が通る管を何という？", "choices": ["師管", "道管", "気孔", "根毛"], "ex": "葉でつくられた養分＝師管、根から吸った水＝道管。", "fig": null, "kind": "term", "level": 1}, {"id": "chu2-bio-vessel-traffic-q009", "koma": "chu2-seibutsu-14", "t": "choice", "q": "図は、茎の維管束を1つ拡大したものである。葉でつくられた養分が通るのは？", "choices": ["Q（茎の外側の方）", "P（茎の中心の方）", "PとQの両方"], "ex": "維管束の中では、外側が師管（養分）、中心側が道管（水）。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 160\" width=\"300\" height=\"160\">\u003crect width=\"300\" height=\"160\" fill=\"#f7faf2\"/>\u003ctext x=\"150\" y=\"16\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middl 003c/svg>", "kind": "graph", "level": 2}, {"id": "chu2-bio-vessel-traffic-q010", "koma": "chu2-seibutsu-14", "t": "choice", "q": "木の幹の表面近くを、ぐるりと輪の形にはぎ取った。しばらくすると、はぎ取った所のすぐ上がふくらんだ。理由として考えられるのは？", "choices": ["外側にある師管が切られ、葉から運ばれてきた養分がそこでたまったから", "内側にある道管が切られ、根からの水がそこでたまったから", "根から上がってきた肥料分が、そこでたまったから"], "ex": "師管は外側にある。切れた所より上に、葉からの養分がたまる。", "fig": null, "kind": "judge", "level": 3}, {"id": "chu2-bio-vessel-traffic-q011", "koma": "chu2-seibutsu-14", "t": "order", "q": "葉でできた養分が、根にたくわえられるまでを順に並べよう。", "items": ["葉で光合成によりデンプンができる", "水にとけやすい物質に変わる", "師管を通って根へ運ばれる", "根で再びデンプンなどになってたくわえられる"], "ex": "デンプン→水にとけやすい物質→師管で運ばれる→たくわえる所で再びデンプンなどに。", "fig": null, "kind": "judge", "level": 2}, {"id": "chu2-bio-vessel-traffic-q012", "koma": "chu2-seibutsu-14", "t": "choice", "q": "水と養分の運ばれ方の組み合わせとして、正しいものは？", "choices": ["水は道管で根から上へ、養分は師管で必要な所へ", "水は師管で上へ、養分は道管で下へ", "水も養分も道管で上へ", "水も養分も師管で必要な所へ"], "ex": "道管と師管は別の管で、運ぶ物と向きがちがう。", "fig": null, "kind": "judge", "level": 1}, {"id": "chu2-bio-vessel-traffic-q013", "koma": "chu2-seibutsu-14", "t": "choice", "q": "「葉でできた養分は夜のあいだに運び出される」ことを確かめたい。比べ方として最も適切なものは？", "choices": ["同じ株の、よく日に当たった葉を夕方と次の朝につみ、同じ方法でヨウ素液で調べる", "夕方につんだ葉を1枚だけ調べる", "朝につんだ葉と、別の植物の昼の葉を調べる"], "ex": "同じ株・同じ方法で、ちがうのは時刻だけにすると、夜のあいだの変化だと言える。", "fig": null, "kind": "method", "level": 2}, {"id": "chu2-bio-vessel-traffic-q014", "koma": "chu2-seibutsu-14", "t": "choice", "q": "色水を吸わせたとき、赤く染まる管はどちら？ また、その管が運ぶものは？", "choices": ["道管。根から吸った水や肥料分", "師管。葉でつくられた養分", "道管。葉でつくられた養分", "師管。根から吸った水"], "ex": "色水は水の通り道＝道管を上がる。", "fig": null, "kind": "term", "level": 1}, {"id": "chu2-bio-vessel-traffic-q015", "koma": "chu2-seibutsu-14", "t": "choice", "q": "図の葉脈の断面で、葉でつくられた養分が通るのはどこ？", "choices": ["B（葉脈の裏側）", "A（葉脈の表側）", "C（気孔）", "D（表の表皮）"], "ex": "葉脈では、表側が道管、裏側が師管。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 172\" width=\"300\" height=\"172\">\u003crect width=\"300\" height=\"170\" fill=\"#eef5f7\"/>\u003crect x=\"0\" y=\"16\" width=\"300\" height=\"12\" fill=\"#f4f7   function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

let AC=null;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,when){const a=AC;if(!a||SV.mute)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.07,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
let NB=null;function noise(d,vol,freq,when){const a=AC;if(!a||SV.mute)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*.4,a.sampleRate);const dd=NB.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1}const t=a.currentTime+(when||0);const s=a.createBufferSource();s.buffer=NB;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(freq*2.2,t+d);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02)}
const SFX={
 sw(){tone(2200,.03,'square',.03);tone(1400,.04,'square',.025,.03)},
 go(){noise(.22,.035,500)},
 del(k){const b=660*Math.pow(1.06,Math.min(k,12));tone(b,.16,'sine',.07);tone(b*1.5,.28,'sine',.06,.09)},
 horn(){tone(392,.28,'square',.035);tone(330,.35,'square',.035,.3)},
 lost(){tone(300,.2,'triangle',.05);tone(220,.3,'triangle',.05,.16)},
 conv(){[500,700,900,1200].forEach((f,i)=>tone(f,.08,'sine',.035,i*.05))},
 sig(){[0,.28,.56].forEach(w=>tone(1000,.12,'sine',.05,w));tone(2000,.5,'sine',.06,.84)},
 buy(){tone(880,.1,'square',.03);tone(1320,.18,'square',.03,.08)},
 bad(){tone(180,.4,'sawtooth',.03)},
 fan(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.4,'triangle',.05,i*.08))},
 tick(){tone(1600,.02,'square',.02)},
 pinpon(){tone(988,.18,'sine',.08);tone(784,.35,'sine',.08,.16)},

function grid(c,w,h,col){c.strokeStyle=col;c.lineWidth=1;c.beginPath();const n=LAND?12:6;for(let i=1;i<n;i++){const x=Math.round(w*i/n)+.5;c.moveTo(x,0);c.lineTo(x,h)}c.stroke()}
function arrowGlyph(c,x,y,s,dir,col){c.save();c.translate(x,y);c.rotate(dir);c.fillStyle=col;c.beginPath();c.moveTo(0,-s);c.lineTo(s*.8,-s*.1);c.lineTo(s*.3,-s*.1);c.lineTo(s*.3,s);c.lineTo(-s*.3,s);c.lineTo(-s*.3,-s*.1);c.lineTo(-s*.8,-s*.1);c.closePath();c.fill();c.restore()}
