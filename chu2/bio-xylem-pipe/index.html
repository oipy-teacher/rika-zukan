<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>道管パイプライン ～水の通り道～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9dc;--bg2:#e3dccb;--ink:#24313a;--dim:#5d6a70;--brass:#b98a2f;--brass2:#e0b95c;--water:#3f8fd8;--dye:#d23a43;--ph:#e9c98f;--leaf:#5e9e45;--ng:#c8503e;
 --disp:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;--body:'Zen Kaku Gothic New','Hiragino Sans',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#d9d2c1;color:var(--ink);font-family:var(--body);overflow:hidden}
body{display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:520px;height:100%;height:100dvh;overflow:hidden;
 background-color:var(--bg);background-image:radial-gradient(circle,#cfc6b1 1.4px,transparent 1.6px);background-size:22px 22px}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.scr.on{display:flex}
button{font-family:var(--body);font-weight:700;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.btn{min-height:52px;padding:10px 20px;border:none;border-radius:14px;background:linear-gradient(#f0cf7a,#cf9c38);color:#2b1f08;font-size:18px;box-shadow:0 4px 0 #86611c,0 8px 16px rgba(60,40,10,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #86611c}
.btn.sub{background:linear-gradient(#ffffff,#e4ddcd);color:var(--ink);box-shadow:0 4px 0 #9d947f;font-size:16px;min-height:46px}
.btn.blue{background:linear-gradient(#6fb2ea,#2f79c4);color:#fff;box-shadow:0 4px 0 #1d4f84,0 8px 16px rgba(20,50,90,.25)}
.btn[disabled]{opacity:.45}
/* タイトル */
#title{align-items:center;justify-content:center;text-align:center;padding:20px}
#title h1{font-family:var(--disp);font-weight:800;font-size:clamp(32px,9.6vw,44px);margin:6px 0 0;letter-spacing:.03em;color:#1f4f7a;text-shadow:0 2px 0 #fff}
#title .sub{color:var(--dim);margin:4px 0 10px;font-weight:700}
#title .tag{font-size:15px;line-height:1.7;background:rgba(255,255,255,.75);border:2px solid #cdbf9b;border-radius:14px;padding:10px 14px;margin-bottom:14px}
#title .row{display:flex;flex-direction:column;gap:11px;width:min(300px,88%)}
#title input{font:inherit;font-size:17px;padding:10px 12px;border:2px solid #cdbf9b;border-radius:12px;background:#fff;color:var(--ink);text-align:center}
.mini{font-size:13px;color:var(--dim);margin-top:10px}
/* ゲーム */
#hud{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px 4px;font-size:14px}
#hud .face{font-family:var(--disp);font-weight:800;font-size:16px;color:#1f4f7a;white-space:nowrap}
#hud .sp{flex:1}
.pill{background:#fff;border:1.5px solid #cdbf9b;border-radius:12px;padding:3px 8px;white-space:nowrap}
.ibtn{min-width:44px;min-height:44px;border-radius:50%;border:2px solid #cdbf9b;background:#fff;font-size:18px;padding:0}
#prog{flex:none;margin:2px 12px 4px;font-size:12.5px;font-weight:700;color:#1f4f7a;display:flex;align-items:center;gap:8px}
#prog .bar{flex:1;height:10px;border-radius:6px;background:#fff;border:1.5px solid #cdbf9b;overflow:hidden}
#prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#6fb2ea,#2f79c4);transition:width .6s}
#bands{flex:none;display:grid;margin:0 auto;font-size:11.5px;font-weight:700;text-align:center;color:#5a4a26;min-height:18px}
#bands span{padding:1px 0;white-space:nowrap;overflow:hidden}
#bands .xy{color:#1d5f99}#bands .ph{color:#9a6a1c}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:2px}
#board{position:relative;display:grid;border:5px solid #8e6a33;border-radius:10px;background:#8e6a33;box-shadow:0 6px 16px rgba(60,40,10,.3);touch-action:manipulation}
.cell{position:relative;overflow:hidden}
.cell svg{display:block;width:100%;height:100%}
.cell.rot svg{cursor:pointer}
.cell.spin svg .pp{animation:spin .16s ease-out}
@keyframes spin{from{transform:rotate(-90deg)}to{transform:rotate(0)}}
.cell svg .pp{transform-origin:50px 50px}
.w{stroke-dasharray:1;stroke-dashoffset:1;animation:fill .13s linear forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.leak{position:absolute;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;pointer-events:none;animation:drip 1s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(22px);opacity:0}}
.xmark{position:absolute;pointer-events:none;font-weight:900;color:var(--ng);text-shadow:0 0 3px #fff,0 0 6px #fff;animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.85)}to{transform:scale(1.15)}}
.vap{animation:vap 2.4s ease-out infinite}
@keyframes vap{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
#msg{flex:none;min-height:44px;margin:4px 10px 0;text-align:center;font-weight:700;font-size:15px;line-height:1.45;color:var(--ink)}
#foot{flex:none;display:flex;gap:10px;justify-content:center;padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
#foot .btn{flex:1;max-width:260px}
/* カード */
#card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,34,20,.45);z-index:20;padding:14px}
#card.on{display:flex}
.cd{width:100%;max-width:450px;max-height:94%;overflow-y:auto;background:#fffdf7;border:3px solid #cdbf9b;border-radius:20px;padding:16px;box-shadow:0 16px 40px rgba(40,30,10,.4)}
.cd h2{font-family:var(--disp);font-weight:800;font-size:22px;margin:0 0 6px;color:#1f4f7a}
.cd p{font-size:16.5px;line-height:1.7;margin:6px 0}
.cd .rule{background:#eaf3fb;border-left:5px solid #2f79c4;padding:8px 12px;border-radius:8px;font-weight:700}
.cd .trap{background:#fbece8;border-left:5px solid var(--ng);padding:8px 12px;border-radius:8px;font-weight:700}
.chs{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.chs button{min-height:50px;text-align:left;padding:10px 14px;border:2px solid #cdbf9b;border-radius:14px;background:#fff;font-size:16px;line-height:1.45}
.chs button.ok{background:#dcefd2;border-color:#5e9e45}
.chs button.ng{background:#f7dcd6;opacity:.85}
.fb{min-height:22px;font-size:15.5px;line-height:1.6;margin-top:8px;font-weight:700}
.go{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.stars{font-size:34px;text-align:center;letter-spacing:6px;color:var(--brass)}
.sec{display:block;margin:6px auto;max-width:300px;width:100%;touch-action:manipulation}
.sec [data-r]{cursor:pointer;transition:fill .5s}
.sec .sel{stroke:#e0a400!important;stroke-width:4!important}
.pop{position:absolute;pointer-events:none;font-family:var(--disp);font-weight:800;font-size:19px;white-space:nowrap;color:#1f4f7a;text-shadow:0 0 4px #fff,0 0 8px #fff;animation:up 1.2s ease-out forwards;z-index:30}
@keyframes up{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{transform:translate(-50%,-10px) scale(1.2);opacity:1}100%{transform:translate(-50%,-64px) scale(1);opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff8d8;opacity:0;z-index:25}
.combo{font-family:var(--disp);font-weight:800;color:var(--dye)}
/* テスト */
#test{padding:14px 16px 24px}
#test .hd{display:flex;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:800;font-size:18px;color:#1f4f7a}
.dots{display:flex;gap:4px;margin:8px 0 12px}
.dots i{flex:1;height:8px;border-radius:4px;background:#fff;border:1px solid #cdbf9b}
.dots i.on{background:#2f79c4}
.qt{font-size:17.5px;line-height:1.65;font-weight:700;margin-bottom:8px}
.fig{text-align:center;margin:6px 0 10px}
.fig svg{max-width:100%;height:auto;background:#fff;border-radius:12px;border:1.5px solid #cdbf9b}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.numpad button{min-height:52px;border-radius:12px;border:2px solid #cdbf9b;background:#fff;font-size:20px}
.numv{font-size:26px;text-align:center;border:2px solid #2f79c4;border-radius:12px;padding:8px;min-height:52px;background:#fff}
.ord{display:flex;flex-direction:column;gap:8px}
.ord button{min-height:48px;border-radius:12px;border:2px solid #cdbf9b;background:#fff;font-size:16px;text-align:left;padding:8px 12px}
.ord button.used{opacity:.3}
.seq{border:2px dashed #2f79c4;border-radius:12px;padding:8px;min-height:52px;font-size:15px;line-height:1.7;margin-bottom:8px;background:#fff}
#end{align-items:center;justify-content:center;text-align:center;padding:24px}
#end h2{font-family:var(--disp);font-weight:800;font-size:30px;margin:6px 0;color:#1f4f7a}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}.vap,.leak,.xmark{animation:none!important}}
</style>
</head>

 <pattern id="pCellS" width="20" height="16" patternUnits="userSpaceOnUse"><rect width="20" height="16" fill="#eadcbf"/><rect x=".8" y=".8" width="18.4" height="14.4" rx="4" fill="#f4ead3" stroke="#cdb88c" stroke-width="1.2"/></pattern>

<div id="app">

<section id="title" class="scr on">

<script>/*@SUBMIT_CARD_BEGIN*/

     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */

    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',

    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',

  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){

      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});

  }
  function payPass(res){

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

, "kind": "judge", "level": 2}, {"id": "chu2-bio-xylem-pipe-q004", "koma": "chu2-seibutsu-13", "t": "order", "q": "根で吸収された水が、葉から水蒸気として出ていくまでの道すじを、順に並べよう。", "items": ["根毛", "根の道管", "茎の道管", "葉脈の道管", "気孔"], "ex": "水は根毛から入り、根・茎・葉の道管を通って、気孔から水蒸気として出ていく。", "fig": null, "kind": "judge", "level": 1}, {"id": "chu2-bio-xylem-pipe-q005", "koma": "chu2-seibutsu-13", "t": "choice", "q": "根から吸収された、水にとけた養分（肥料分）が通る管は？", "choices": ["道管", "師管", "気孔", "維管束の外側の管"], "ex": "根から吸った水と、水にとけた肥料分は道管を通る。師管は葉でつくられた養分の通り道。", "fig": null, "kind": "judge", "level": 2}, {"id": "chu2-bio-xylem-pipe-q006", "koma": "chu2-seibutsu-13", "t": "choice", "q": "根毛があると、水を吸収しやすくなる。その理由として正しいのは？", "choices": ["根の表面積が大きくなり、土とふれる部分が増えるから", "根毛の中を師管が通っているから", "根毛で光合成が行われるから", "根毛が土の中の空気を追い出すから"], "ex": "細い根毛が土の粒のすき間に入りこみ、根の表面積を大きくしている。", "fig": null, "kind": "judge", "level": 1}, {"id": "chu2-bio-xylem-pipe-q007", "koma": "chu2-seibutsu-13", "t": "choice", "q": "道管と師管が集まって、束のようになっている部分を何という？", "choices": ["維管束", "根毛", "表皮", "孔辺細胞"], "ex": "道管と師管の束を維管束という。葉では葉脈になっている。", "fig": null, "kind": "term", "level": 1}, {"id": "chu2-bio-xylem-pipe-q008", "koma": "chu2-seibutsu-13", "t": "choice", "q": "道管の説明として正しいものは？", "choices": ["根から吸収した水などが通る管", "葉でつくられた養分が通る管", "気体が出入りする葉のすき間", "水を吸収する根の細い毛"], "ex": "道管＝水の通り道。師管＝葉でつくられた養分の通り道。", "fig": null, "kind": "term", "level": 1}, {"id": "chu2-bio-xylem-pipe-q009", "koma": "chu2-seibutsu-13", "t": "choice", "q": "茎の中の水の通り道を調べたい。方法として最も適切なものは？", "choices": ["赤インクなどで色をつけた水に植物をさし、しばらくしてから茎をうすく切って観察する", "植物を暗い所に1日置いてから、茎をヨウ素液につける", "茎を切ってすぐに、切り口に石灰水をかける", "葉をすべて取ってから色水にさし、すぐに茎を切る"], "ex": "色水を吸わせてから切ると、水が通った管が色で見える。葉を取ると吸い上げが弱くなる。", "fig": null, "kind": "method", "level": 1}, {"id": "chu2-bio-xylem-pipe-q010", "koma": "chu2-seibutsu-13", "t": "choice", "q": "色水にさしたホウセンカの茎を輪切りにすると、赤い部分が茎の外寄りに輪の形に並んで見えた。ここから言えることは？", "choices": ["維管束が外寄りに輪の形に並んでいて、その中の道管が染まった", "道管は茎のいちばん外側の表皮にある", "水は茎の表面を伝って上がる", "師管が水を運んだので、外側が染まった"], "ex": "輪に並ぶのは維管束。1つの維管束の中で見ると、染まったのは中心側の道管。", "fig": null, "kind": "judge", "level": 3}, {"id": "chu2-bio-xylem-pipe-q011", "koma": "chu2-seibutsu-13", "t": "choice", "q": "図は根の断面である。根毛から吸収された水が、上へ運ばれていく管があるのはどこ？", "choices": ["A（中心の部分）", "B（外側の細胞）", "C（根毛）"], "ex": "根では中心に道管が集まっていて、吸収された水はそこから上へ運ばれる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 220\" width=\"300\" height=\"220\">\u003cline x1=\"230\" y1=\"110\" x2=\"254\" y2=\"118\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"226\" y1=\"135\" x2=\"251\" y2=\"152\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"215\" y1=\"157\" x2=\"237\" y2=\"184\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"197\" y1=\"175\" x2=\"204\" y2=\"199\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"175\" y1=\"186\" x2=\"175\" y2=\"216\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"150\" y1=\"190\" x2=\"141\" y2=\"224\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"125\" y1=\"186\" x2=\"110\" y2=\"206\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"103\" y1=\"175\" x2=\"79\" y2=\"193\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"85\" y1=\"157\" x2=\"53\" y2=\"169\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"74\" y1=\"135\" x2=\"49\" y2=\"134\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"70\" y1=\"110\" x2=\"41\" y2=\"101\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"74\" y1=\"85\" x2=\"45\" y2=\"66\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"85\" y1=\"63\" x2=\"71\" y2=\"42\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u003cline x1=\"103\" y1=\"45\" x2=\"93\" y2=\"17\" stroke=\"#c9ad7a\" stroke-width=\"4\" stroke-linecap=\"round\"/>\u #24313a\">C\u003c/text>\u003c/svg>", "kind": "graph", "level": 2}, {"id": "chu2-bio-xylem-pipe-q012", "koma": "chu2-seibutsu-13", "t": "choice", "q": "葉のついた枝と、葉をすべて取った枝を、同じ色水に同じ時間さした。茎がよく染まったのはどちらで、それはなぜ？", "choices": ["葉のついた枝。葉から水が出ていく（蒸散）ので、水が吸い上げられるから", "葉を取った枝。水の行き先がないので茎にたまるから", "どちらも同じ。吸い上げは根だけで決まるから"], "ex": "葉で蒸散が行われると、道管の水が引き上げられて吸水が起こる。", "fig": null, "kind": "judge", "level": 3}, {"id": "chu2-bio-xylem-pipe-q013", "koma": "chu2-seibutsu-13", "t": "choice", "q": "師管の説明として正しいものは？", "choices": ["葉でつくられた養分が通る管", "根から吸収した水が通る管", "根から吸収した肥料分が通る管", "空気中の二酸化炭素が通る管"], "ex": "師管は葉でつくられた養分の通り道。水や肥料分は道管。", "fig": null, "kind": "term", "level": 1}, {"id": "chu2-bio-xylem-pipe-q014", "koma": "chu2-seibutsu-13", "t": "order", "q": "ホウセンカの茎の断面を、茎の中心から外側に向かって順に並べよう。", "items": ["茎の中心の細胞", "道管", "師管", "表皮"], "ex": "維管束の中では中心側が道管、外側が師管。いちばん外は表皮。", "fig": null, "kind": "graph", "level": 2}, {"id": "chu2-bio-xylem-pipe-q015", "koma": "chu2-seibutsu-13", "t": "choice", "q": "「茎の中なら、どこを通っても水は同じように上がる」という考えについて、正しいのは？", "choices": ["正しくない。水は茎の中の道管を通って上がる", "正しい。茎の細胞はどこでも水を運ぶ", "正しくない。水は茎の表面を伝って上がる"], "ex": "色水の実験で染まるのは道管だけ。水の通り道は決まっている。", "fig": null, "kind": "judge", "level": 2}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

 tone(f,d,type,v,f2,delay){if(!this.on||!this.ctx)return;const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||.1,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)},
 noise(d,v,f){if(!this.on||!this.ctx)return;const c=this.ctx,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();fl.type='lowpass';fl.frequency.value=f||1200;g.gain.value=v||.08;s.buffer=b;s.connect(fl);fl.connect(g);g.connect(c.destination);s.start()}
};

 stop(){AU.tone(180,.25,'square',.06,110)},
 drip(){AU.tone(1200,.06,'sine',.05,700)},

 ng(){AU.tone(220,.2,'square',.05,190)},

const rotC=c=>((c<<1)|(c>>3))&15;

function parseLv(L){
 const rows=L.rows.map(r=>r.split(' ')),reg=rows.map(r=>r.shift());
 const H=rows.length,W=rows[0].length,cells=[];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=rows[y][x],k=t[0];const c={x,y,k,reg:reg[y],base:0,r:0,st:null,si:0};
  if(k==='k'){c.st=t.slice(1).split('|').map(h=>parseInt(h,16));c.base=c.st[0]}
  else if(t.length>1)c.base=parseInt(t.slice(1),16);
  cells.push(c)}
 return{W,H,cells};
}
function conn(c){if(c.k==='k')return c.st[c.si];if(c.k==='x'||c.k==='s')return rotN(c.base,c.r);return c.base}
const isPipe=c=>'xsXSk'.includes(c.k);
const isPh=c=>c.k==='s'||c.k==='S';
const canTap=c=>c.k==='x'||c.k==='s'||c.k==='k';
function rngF(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

/* ---------- タイルの絵（viewBox 100×100） ---------- */
function armPath(c){let d='';for(let i=0;i<4;i++)if(c&BIT[i]){const e=[[50,0],[100,50],[50,100],[0,50]][i];d+=`M50 50L${e[0]} ${e[1]}`}return d}
function bgOf(c){
 if(c.reg==='G')return c.k==='.'?'<rect width="100" height="100" fill="url(#pSoil)"/>':'<rect width="100" height="100" fill="url(#pSoil)"/><rect x="0" y="0" width="100" height="100" fill="url(#pCellS)" opacity="'+(c.k==='n'?1:.0)+'"/>';
 if(c.reg==='T'){if(c.k==='.')return '<rect width="100" height="100" fill="#e6f1f5"/>';return '<rect width="100" height="100" fill="url(#pCellT)"/>'}
 return '<rect width="100" height="100" fill="#e6f1f5"/>';
}
function pipeSVG(c,cn){
 const ph=isPh(c),d=armPath(cn);
 let s=`<g class="pp"><path d="${d}" stroke="${ph?'#a97d3c':'#5f8497'}" stroke-width="40" fill="none"/><circle cx="50" cy="50" r="20" fill="${ph?'#a97d3c':'#5f8497'}"/>`;
 s+=`<path d="${d}" stroke="${ph?'url(#pPh)':'url(#pXy)'}" stroke-width="33" fill="none"/><circle cx="50" cy="50" r="16.5" fill="${ph?'url(#pPh)':'url(#pXy)'}"/>`;
 if(ph){// ふるいのような区切り
  for(let i=0;i<4;i++)if(cn&BIT[i]){const[dx,dy]=DV[i];for(const t of [24,40]){const px=50+dx*t,py=50+dy*t;s+=`<path d="M${px-dy*16} ${py-dx*16}L${px+dy*16} ${py+dx*16}" stroke="#a97d3c" stroke-width="2.6"/>`}}
 }else{
  s+=`<path d="${d}" stroke="rgba(255,255,255,.55)" stroke-width="5" fill="none" transform="translate(-8 -8)" opacity=".7"/>`;
 }
 if(c.k==='k'){s+=`<circle cx="50" cy="50" r="15" fill="#e0b95c" stroke="#86611c" stroke-width="3"/><circle cx="50" cy="50" r="5" fill="#86611c"/>`}
 if(c.k==='X'||c.k==='S')s+=`<g fill="#86611c"><circle cx="12" cy="12" r="4"/><circle cx="88" cy="12" r="4"/><circle cx="12" cy="88" r="4"/><circle cx="88" cy="88" r="4"/></g>`;
 return s+'</g>';
}
function leafSVG(c,wet,mono){
 const ang={4:0,8:90,1:180,2:270}[c.base]||0;// 葉柄の向き（Sなら葉は上）
 const col=wet?'#4f9a36':'#9cbf7e',st=wet?'#2f6b22':'#6f8d58',vc=wet?(DYE?'#d23a43':'#3f8fd8'):'#c9dcb4';
 let body=mono?`<path d="M50 94 C44 70 40 40 50 6 C60 40 56 70 50 94Z" fill="${col}" stroke="${st}" stroke-width="2.5"/><path d="M50 90V12 M46 84 C45 60 45 40 49 16 M54 84 C55 60 55 40 51 16" stroke="${vc}" stroke-width="1.6" fill="none"/>`
  :`<path d="M50 96 V74 C22 70 12 40 26 18 C36 8 64 8 74 18 C88 40 78 70 50 74" fill="${col}" stroke="${st}" stroke-width="2.5"/><path d="M50 96V16 M50 60 L30 42 M50 60 L70 42 M50 44 L34 28 M50 44 L66 28 M50 74 L36 62 M50 74 L64 62" stroke="${vc}" stroke-width="2" fill="none"/>`;
 let vap='';if(wet&&!RM)vap=`<g class="vap"><g transform="translate(24 30)">${h2o(6)}</g></g><g class="vap" style="animation-delay:.8s"><g transform="translate(72 22)">${h2o(6)}</g></g><g class="vap" style="animation-delay:1.6s"><g transform="translate(46 12)">${h2o(5)}</g></g>`;
 return `<rect width="100" height="100" fill="#e6f1f5"/><g transform="rotate(${ang} 50 50)">${body}</g>${vap}`;
}
function h2o(u){// 水分子（O赤・H白、くの字）
 return `<circle cx="${-u*.9}" cy="${u*.55}" r="${u*.55}" fill="#EAF6FF" stroke="#7a9ab0" stroke-width=".6"/><circle cx="${u*.9}" cy="${u*.55}" r="${u*.55}" fill="#EAF6FF" stroke="#7a9ab0" stroke-width=".6"/><circle cx="0" cy="0" r="${u*.75}" fill="#E4572E" stroke="#8a2f18" stroke-width=".6"/>`;
}
function rootSVG(c,mono){
 const cn=c.base;const d=armPath(cn);const wc=DYE?'#d23a43':'#3f8fd8';
 let s='<rect width="100" height="100" fill="url(#pSoil)"/>';
 s+=`<path d="M50 50 V100" stroke="#f1e4c6" stroke-width="22" stroke-linecap="round"/><path d="${d}" stroke="#f1e4c6" stroke-width="22"/>`;
 s+='<g stroke="#f7efdc" stroke-width="1.6" stroke-linecap="round">';for(let i=0;i<9;i++){const y=56+i*4.6,l=10+((i*7)%9);s+=`<path d="M39 ${y}l-${l} ${-3+(i%3)*3}M61 ${y}l${l} ${-3+((i+1)%3)*3}"/>`}s+='</g>';
 s+=`<path d="${d}" stroke="#5f8497" stroke-width="12"/><path d="${d}" stroke="url(#pXy)" stroke-width="8"/>`;
 s+=`<g fill="${wc}" opacity=".9"><circle cx="16" cy="70" r="4"/><circle cx="84" cy="80" r="4"/><circle cx="22" cy="92" r="3"/><circle cx="80" cy="60" r="3"/></g>`;
 if(!mono)s+='';
 return s;
}
function tissueSVG(c){return bgOf(c)}
let DYE=0;
function cellSVG(c,water){
 let s='';
 if(c.k==='L')s=leafSVG(c,water&&water.leaf,G&&G.L.plant==='monocot');
 else if(c.k==='R')s=rootSVG(c,G&&G.L.plant==='monocot');
 else if(isPipe(c))s=bgOf(c)+(c.reg==='G'?`<path d="${armPath(conn(c))}" stroke="#f1e4c6" stroke-width="60"/><circle cx="50" cy="50" r="30" fill="#f1e4c6"/>`:'')+pipeSVG(c,conn(c));
 else s=bgOf(c);
 if(water&&water.arms){const wc=DYE?'#d23a43':'#3f8fd8';
  for(const a of water.arms){const e=[[50,0],[100,50],[50,100],[0,50]][a.d];const p=a.inn?`M${e[0]} ${e[1]}L50 50`:`M50 50L${e[0]} ${e[1]}`;
   s+=`<path class="w" pathLength="1" d="${p}" stroke="${wc}" stroke-width="${c.k==='R'?7:17}" stroke-linecap="round" fill="none" style="animation-delay:${a.t}ms" opacity=".92"/>`}
 }
 return `<svg viewBox="0 0 100 100" preserveAspectRatio="none">${s}</svg>`;
}

 TS=Math.floor(Math.max(44,Math.min(78,aw/W,ah/H)));
 const b=$('#board');b.style.gridTemplateColumns=`repeat(${W},${TS}px)`;b.style.gridTemplateRows=`repeat(${H},${TS}px)`;
 const bd=$('#bands');if(G.L.bands){bd.style.gridTemplateColumns=`repeat(${W},${TS}px)`;bd.style.width=(TS*W+10)+'px';bd.style.paddingLeft='5px';bd.innerHTML=G.L.bands.map(t=>`<span class="${t==='道管'?'xy':t==='師管'?'ph':''}">${t}</span>`).join('')}else bd.innerHTML='';
}
function startLv(i){
 const L=LV[i];SV.lv=i;save();DYE=L.dye;
 const P=parseLv(L);const rnd=rngF(7+i*31+(Date.now()%997));
 G={i,L,W:P.W,H:P.H,cells:P.cells,flows:0,water:null,busy:false,t:0,done:false,moves:0,trapHit:false};
 // ばらばらにする
 for(const c of G.cells){
  if(c.k==='x'||c.k==='s'){const sym=(rotN(c.base,1)===c.base);if(sym)continue;let r=1+Math.floor(rnd()*3);if(rotN(c.base,r)===c.base)r=(r%3)+1;c.r=r}
  if(c.k==='k'){c.si=(L.init&&L.init.k!=null)?L.init.k:1}
 }
 show('game');$('#board').innerHTML='';
 for(const c of G.cells){const d=document.createElement('div');d.className='cell'+(canTap(c)?' rot':'');c.el=d;d.innerHTML=cellSVG(c,null);$('#board').appendChild(d);
  d.addEventListener('pointerup',ev=>{ev.preventDefault();tapCell(c)})}
 layout();
 $('#hFace').textContent='株'+(i+1)+'/7';$('#hFlow').textContent='0';
 $('#hTimeP').classList.toggle('hide',!L.ta);$('#hTime').textContent=L.ta?L.ta:'0';
 updProg();msg('管をタップして回そう');
 card(`<h2>${L.name}</h2>${plantMini(L)}<p>${L.intro}</p><div class="go"><button class="btn" id="cGo">はじめる</button></div>`);
 $('#cGo').onclick=()=>{closeCard();AU.init();G.t0=performance.now();if(L.ta)runTimer()};
}
function plantMini(L){
 const mono=L.plant==='monocot';
 const roots=mono?'<g stroke="#b99b6a" stroke-width="3" fill="none" stroke-linecap="round"><path d="M60 78 q-14 10 -22 22 M60 78 q-6 12 -8 24 M60 78 q0 12 0 24 M60 78 q6 12 8 24 M60 78 q14 10 22 22"/></g>'
  :'<g stroke="#b99b6a" stroke-width="3" fill="none" stroke-linecap="round"><path d="M60 78 V104" stroke-width="4.5"/><path d="M60 86 l-14 8 M60 86 l14 8 M60 96 l-10 6 M60 96 l10 6"/></g>';
 const leaves=mono?'<path d="M60 70 C40 60 26 44 20 30 C34 40 48 52 60 62Z M60 52 C80 42 94 28 98 16 C84 26 70 36 60 44Z" fill="#7ab25c" stroke="#3f7a2e" stroke-width="1.5"/>'
  :'<path d="M60 58 C48 50 34 50 26 58 C36 66 50 66 60 58Z M60 42 C72 34 86 34 94 42 C84 50 70 50 60 42Z M60 28 C54 18 58 10 64 6 C68 16 66 24 60 28Z" fill="#7ab25c" stroke="#3f7a2e" stroke-width="1.5"/>';
 return `<svg viewBox="0 0 120 110" width="120" height="110" style="float:right;margin:0 0 4px 8px"><rect x="0" y="76" width="120" height="34" rx="6" fill="#a88a62"/><path d="M60 78 V20" stroke="#6aa94d" stroke-width="6" stroke-linecap="round"/>${leaves}${roots}<text x="4" y="12" font-size="10" font-weight="bold" fill="#5d6a70">${mono?'単子葉類':'双子葉類'}</text></svg>`;
}
function updProg(){
 let tot=0,done=0;LV.forEach((L,i)=>{const n=L.rows.join(' ').split(' ').filter(t=>t[0]==='L').length;tot+=n;if(i<SV.lv)done+=n});
 if(G&&G.water)done+=G.water.leafN;
 $('#progI').style.width=(Math.min(1,(done+1)/(tot+1))*100)+'%';$('#progN').textContent=done+'/'+tot;
}
function tapCell(c){
 if(!G||G.busy||G.done||$('#card').classList.contains('on'))return;AU.init();
 if(G.water){drain()}
 if(c.k==='x'||c.k==='s'){c.r=(c.r+1)%4;SFX.click();G.moves++;c.el.innerHTML=cellSVG(c,null);if(!RM){c.el.classList.remove('spin');void c.el.offsetWidth;c.el.classList.add('spin')}}
 else if(c.k==='k'){c.si=(c.si+1)%c.st.length;SFX.cock();G.moves++;c.el.innerHTML=cellSVG(c,null)}
 else if(c.k==='n'){msg(c.reg==='G'?'根の細胞。ここには管がない。':'茎の細胞。<b>管のない所</b>を通って水が上がっていくわけではない。');SFX.tap()}
 else if(c.k==='X'||c.k==='S'){msg('この管は固定されていて回らない。');SFX.tap()}
 else if(c.k==='R'){msg('<b>根毛</b>：土の粒のすき間に入りこみ、根の表面積を広げて 水を吸う。');SFX.tap()}
 else if(c.k==='L'){msg('葉。とどいた水の多くは、気孔から<b>水蒸気</b>として出ていく（蒸散）。');SFX.tap()}
}
function drain(){if(!G.water)return;G.water=null;document.querySelectorAll('.leak,.xmark').forEach(e=>e.remove());for(const c of G.cells)c.el.innerHTML=cellSVG(c,null);updProg()}
const at=(x,y)=>(x<0||y<0||x>=G.W||y>=G.H)?null:G.cells[y*G.W+x];

const STEP=115;
function doFlow(){
 if(!G||G.busy||G.done)return;AU.init();if(G.water)drain();

  $('#cardIn').querySelector('.go:last-child').innerHTML=`<button class="btn" id="cT">確認テストへ</button><button class="btn sub ${Z()?'':'hide'}" id="cB">📖 図鑑</button>`;
  $('#cT').onclick=()=>{closeCard();const go=()=>startTest();if(Z()&&Zukan.mainClear){try{Zukan.mainClear({onClose:go})}catch(e){go()}}else go()};
  $('#cB').onclick=()=>{try{Zukan.openBook()}catch(e){}};
 });
}
$('#bFlow').onclick=doFlow;
$('#bLegend').onclick=()=>{if(!G||G.busy)return;card(`<h2>🔍 管の見分け方</h2><svg viewBox="0 0 200 100" width="100%" style="max-width:320px;display:block;margin:0 auto"><g transform="translate(0 0)">${pipeSVG({k:'x'},5).replace('class="pp"','')}</g><g transform="translate(100 0)">${pipeSVG({k:'s'},5).replace('class="pp"','')}</g></svg><p><b style="color:#1d5f99">道管</b>（左）：すじ模様の青っぽい管。<b>根から吸った水</b>（と、水にとけた肥料分）が上がる。茎の維管束では <b>中心側</b>。</p><p><b style="color:#9a6a1c">師管</b>（右）：区切りのある黄色っぽい管。<b>葉でつくられた養分</b>が通る。維管束の <b>外側</b>。</p><p style="font-size:15px">真ちゅうの丸＝切りかえコック（タップで向きが変わる）。四すみのびょう＝固定された管。</p><div class="go"><button class="btn" id="cOk">OK</button></div>`);$('#cOk').onclick=closeCard};
window.addEventListener('resize',()=>{if(G&&$('#game').classList.contains('on')){layout()}});

/* ---------- 確認テスト ---------- */
let T=null;
function startTest(){
 closeCard();clearInterval(timer);
 const qs=window.Quiz?Quiz.test():[];T={qs,i:0,ans:[]};show('test');
 $('#tName').classList.toggle('hide',!!SV.name);$('#nameIn2').value=SV.name||'';
 renderQ();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderQ(){
 const q=T.qs[T.i];if(!q){finishTest();return}
 $('#tNo').textContent=(T.i+1)+' / '+T.qs.length;
 $('#tDots').innerHTML=T.qs.map((_,i)=>`<i class="${i<T.i?'on':''}"></i>`).join('');
 let h=`<div class="qt">${q.q}</div>`+(q.fig?`<div class="fig">${q.fig}</div>`:'');
 if(q.t==='choice')h+=`<div class="chs">${q.shown.map((c,i)=>`<button data-i="${i}">${c}</button>`).join('')}</div>`;
 else if(q.t==='num')h+=`<div class="numv" id="nv">&nbsp;</div><div style="text-align:right;margin-top:4px">${esc(q.unit||'')}</div><div class="numpad">${['7','8','9','4','5','6','1','2','3','0','.','←'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><div class="go"><button class="btn" id="nOk">これで答える</button></div>`;
 else h+=`<div style="font-size:14px;margin-bottom:6px">正しい順に タップしよう</div><div class="seq" id="sq"></div><div class="ord">${q.shown.map((c,i)=>`<button data-i="${i}">${c}</button>`).join('')}</div><div class="go"><button class="btn sub" id="oClr">やり直す</button><button class="btn" id="oOk" disabled>これで答える</button></div>`;
 $('#tBody').innerHTML=h;$('#test').scrollTop=0;
 const next=a=>{T.ans[T.i]=a;SFX.tap();T.i++;setTimeout(renderQ,180)};
 if(q.t==='choice')$('#tBody').querySelectorAll('.chs button').forEach(b=>b.onclick=()=>{b.classList.add('ok');$('#tBody').querySelectorAll('.chs button').forEach(x=>x.disabled=true);next(q.shown[+b.dataset.i])});
 else if(q.t==='num'){let v='';$('#tBody').querySelectorAll('.numpad button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='←')v=v.slice(0,-1);else if(v.length<8)v+=k;$('#nv').innerHTML=v||'&nbsp;';SFX.tap()});$('#nOk').onclick=()=>{if(v)next(v)}}
 else{let seq=[];const upd=()=>{$('#sq').innerHTML=seq.map((i,n)=>(n+1)+'. '+q.shown[i]).join('<br>');$('#tBody').querySelectorAll('.ord button').forEach(b=>b.classList.toggle('used',seq.includes(+b.dataset.i)));$('#oOk').disabled=seq.length!==q.shown.length};
  $('#tBody').querySelectorAll('.ord button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!seq.includes(i)){seq.push(i);SFX.tap();upd()}});
  $('#oClr').onclick=()=>{seq=[];upd()};$('#oOk').onclick=()=>next(seq.map(i=>q.shown[i]));upd()}
}
function fmt(s){s=Math.round(s);return Math.floor(s/60)+'分'+String(s%60).padStart(2,'0')+'秒'}
function finishTest(){
 const nm=$('#nameIn2').value.trim();if(nm)SV.name=nm;
 const qs=T.qs,answers=T.ans;
 const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 SFX.fan();
 const rec={gameId:GAME,grade:'chu2',koma:[KOMA],
  unit:'中2理科　生物の体のつくりと働き　第13回',game:'道管パイプライン ～水の通り道～'+(TEST_ONLY?'（確認テストのみ）':''),
  name:SV.name||'',score,total:qs.length,marks,
  records:TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmt(SV.elapsed)],['タイムアタック',SV.ta?SV.ta.toFixed(1)+'秒':'—'],['水を流した回数',SV.flows+'回'],['断面の予想',SV.hits+'/'+SV.checks+' 的中']],
  review};
 const done=()=>{show('end');$('#endH').textContent=score===qs.length?'満点！ 🎉':'おつかれさま！';$('#endP').innerHTML=`確認テスト <b>${score} / ${qs.length}</b>`};
 SV.lastTest=rec;save();
 try{SubmitCard.show(rec,done)}catch(e){}
 done();
}
$('#bCard').onclick=()=>{if(SV.lastTest){try{SubmitCard.show(SV.lastTest,()=>{})}catch(e){}}};
$('#bAgain').onclick=()=>startTest();
$('#bTop').onclick=()=>{show('title');initTitle()};

/* ---------- タイトル ---------- */
function initTitle(){
 $('#nameIn').value=SV.name||'';
 $('#bCont').classList.toggle('hide',!(SV.lv>0));
 $('#bCont').textContent=SV.lv>=LV.length?'つづきから（確認テスト）':'つづきから（株'+(SV.lv+1)+'）';
 const hasZ=!!(Z()&&Zukan.openBook);$('#bBook1').classList.toggle('hide',!hasZ);$('#bBook2').classList.toggle('hide',!hasZ);
}
function takeName(){const v=$('#nameIn').value.trim();if(v)SV.name=v;save()}
$('#bStart').onclick=()=>{AU.init();takeName();Object.assign(SV,{lv:0,best:{},flows:0,hits:0,checks:0,elapsed:0,ta:null,trap:0});save();startLv(0)};
$('#bCont').onclick=()=>{AU.init();takeName();if(SV.lv>=LV.length)startTest();else startLv(SV.lv)};
$('#bBook1').onclick=$('#bBook2').onclick=()=>{try{Zukan.openBook()}catch(e){}};
setMute();initTitle();
try{Z()&&Zukan.hud&&Zukan.hud($('#hKake'))}catch(e){}
if(TEST_ONLY)startTest();
})();
</script>
</body>
