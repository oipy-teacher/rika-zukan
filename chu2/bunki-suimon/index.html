<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B3D91">
<title>でんりゅう水門 ～分かれ道の電流～</title>
<!--
  でんりゅう水門 ～分かれ道の電流～　（ゲームID bunki-suimon ／ コマID chu2-denryu-04 ／ 確認用）

  【遊びの核】配管つなぎ（リアルタイムで流れが迫る）。ポンプ（電源）から流れ（電流）が迫ってくる前に、
    部品表から「分岐管・水門・合流管・本線管」を指でドラッグして配管図の空き枠にはめる。流れが空き枠に届けば水もれ。
  【理科の埋め込み】水門（枝の抵抗）の太さ＝その枝に流れる電流。本線（合流した後）の電流は枝の電流の和。
    注文どおりの本線にするには、枝の和を合わせるしかない。合流点の後の本線管は「流れこむ和」と同じ値でないとあふれる。
    合わないときは「あと0.10A」「0.10A多い」を本当の差で出す（ニアミス）。一発で合ったときだけ、かけら。
  【画風】青焼き設計図（別のデザイナー）。濃紺の感光紙に白い製図線。管は二重線、寸法線・引出線・詳細図・表題欄・部品表。
    角丸・影・グラデのボタンは使わない。ボタンも「図面の枠」と破線の補助線で描く。
  【世界とメタファー】町の上水道の配水設計図。1区画＝1日。区画ごとに注文（本線の電流）を締め、区画図の町が広がる。
    HUDは図面の表題欄、部品置き場は部品表、読み取りは詳細図、戻るは図面の左上の枠。
  【配色】感光紙 #0B3D91／製図線 #E8F1FF／流れ・強調 #FFD23F（紫・水色のグラデは使わない）
  【書体】BIZ UDPGothic（見出し・本文）／Share Tech Mono（寸法・数値）
  【画面の組み方】全画面の設計図。横長（PC・iPad横）は左から右へ流す配管図＋右に表題欄と部品表。
    縦長（スマホ・iPad縦）は上から下へ流れる縦の配管図に組み替え、表題欄は上、部品表は親指の届く下。
  【音】WebAudio合成（水の流れ＝ろ過ノイズ、はめる音＝カチリ、合った＝ベル）。ミュートあり
  【ハマる仕組み】主⑦ニアミス（本当の差）／副⑤連続（一発で合うと×が上がる・外すとリセット）／⑯1注文30秒・すぐやり直し
  【道のり×集める×美麗】12区画の町を広げる／区画ごとに部品図を部品台帳に登録＋図鑑ガチャ／白い製図線の青焼き
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B3D91;--bg2:#08306F;--ln:#E8F1FF;--ac:#FFD23F;--dim:rgba(232,241,255,.5);
  --fj:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;--fm:"Share Tech Mono","BIZ UDPGothic",ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{color:var(--ln);font-family:var(--fj);user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;pointer-events:none}
.scr button,.scr input,.scr .bp,.scr .sheet{pointer-events:auto}
.hidden{display:none!important}

/* ===== 図面の部品（枠・補助線） ===== */
.bp{position:relative;background:rgba(9,50,120,.96);border:1.5px solid var(--ln);color:var(--ln)}
.bp::after{content:"";position:absolute;inset:-7px;border:1px dashed rgba(232,241,255,.32);pointer-events:none}
.btn{position:relative;min-height:50px;border:1.5px solid var(--ln);background:rgba(8,48,111,.55);color:var(--ln);font:700 17px var(--fj);letter-spacing:.08em;padding:0 18px;border-radius:0}
.btn::before{content:"";position:absolute;left:-6px;right:-6px;top:50%;border-top:1px solid rgba(232,241,255,.28);pointer-events:none;z-index:-1}
.btn.y{background:var(--ac);color:#0B3D91;border-color:var(--ac)}
.btn.sm{min-height:46px;font-size:15px;padding:0 12px}
.btn:active{transform:translate(1px,2px)}
.btn:disabled{opacity:.4;cursor:default}
.lbl{font:400 12px var(--fm);letter-spacing:.18em;color:var(--dim)}

/* ===== タイトル ===== */
#scrTitle{display:flex;flex-direction:column;justify-content:space-between;padding:calc(64px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom))}
.t-kick{font:400 13px var(--fm);letter-spacing:.2em;color:var(--dim)}
.t-kick b{font-family:var(--fj);font-weight:700;letter-spacing:.06em;color:var(--ln)}
h1.tt{margin:10px 0 0;font-weight:700;line-height:1.05;letter-spacing:.04em}
h1.tt .a{display:block;font-size:clamp(46px,13vw,104px);white-space:nowrap}
h1.tt .a em{font-style:normal;color:var(--ac)}
.t-dim{display:flex;align-items:center;gap:10px;margin-top:14px;font:700 17px var(--fj);letter-spacing:.08em;max-width:520px}
.t-dim i{flex:1;height:0;border-top:1.5px solid var(--ln);position:relative}
.t-dim i::before,.t-dim i::after{content:"";position:absolute;top:-6px;width:0;height:11px;border-left:1.5px solid var(--ln)}
.t-dim i::before{left:0}.t-dim i::after{right:0}
.t-note{margin-top:10px;font-size:14px;line-height:1.7;color:var(--dim);max-width:520px}
.t-bot{display:flex;flex-direction:column;gap:16px;width:100%;max-width:520px;align-self:center}
.t-bot .row{display:flex;gap:16px}.t-bot .row>*{flex:1}
.nm{display:flex;align-items:center;gap:10px;padding:8px 12px}
.nm label{font-size:14px;font-weight:700;white-space:nowrap}
.nm input{flex:1;min-width:0;height:38px;background:transparent;border:0;border-bottom:1.5px dashed var(--ln);color:var(--ln);font:700 17px var(--fj);padding:0 6px;border-radius:0;outline:none}

/* ===== 区画図 ===== */
#scrMap .mfoot{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:14px}
#scrMap .mfoot>*{flex:1;white-space:nowrap;padding:0 6px}

#runCap{position:absolute;left:120px;right:64px;top:calc(12px + env(safe-area-inset-top));text-align:center;line-height:1.25;pointer-events:none}
#runCap b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#runCap span{display:block;font:400 12px var(--fm);color:var(--dim);letter-spacing:.06em}
@media (min-aspect-ratio:21/20){#runCap{left:140px;right:auto;width:calc(75% - 190px);top:calc(16px + env(safe-area-inset-top))}#runCap b{font-size:19px}#runCap span{font-size:14px}#resBar .eq{font-size:clamp(16px,1.75vw,24px)}#resBar h3{font-size:20px}}
/* ===== 結果の注記 ===== */
#resBar{position:absolute;padding:14px 16px 14px;display:flex;flex-direction:column;gap:10px;z-index:3}
#resBar h3{margin:0;font-size:22px;line-height:1.2;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#resBar h3 small{font:400 13px var(--fm);letter-spacing:.14em;color:var(--dim)}
#resBar .eq{font:400 clamp(18px,5.4vw,24px) var(--fm);color:var(--ac);letter-spacing:.04em;line-height:1.15}
#resBar p{margin:0;font-size:15px;line-height:1.6;font-weight:700}
#resBar .btns{display:flex;gap:12px}#resBar .btns>*{flex:1}
#resBar.ok h3{color:var(--ac)}

/* ===== パネル（竣工・もどる・台帳） ===== */
.panel{position:absolute;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));padding:18px 18px 18px;max-height:calc(100% - 90px);overflow-y:auto}
.panel h2{margin:0;font-size:30px;line-height:1.15}
.panel h2 small{display:block;font-size:14px;font-weight:700;margin-top:6px;color:var(--dim)}
.panel .btns{display:flex;gap:14px;margin-top:16px}.panel .btns>*{flex:1}
.stars{display:flex;gap:12px;margin:14px 0 12px}
.stars div{flex:1;border:1px solid var(--dim);padding:8px 4px;text-align:center;font-size:12px;font-weight:700;line-height:1.3;color:var(--dim)}
.stars div i{display:block;font-style:normal;font-size:24px;line-height:1.1}
.stars div.on{border-color:var(--ac);color:var(--ln)}.stars div.on i{color:var(--ac)}
.stars div.wait{opacity:0}.stars div.don{animation:don .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes don{0%{transform:scale(2.3) rotate(-10deg);opacity:0}60%{transform:scale(.93);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.stars div.don{animation:none}}
@media (max-aspect-ratio:21/20){#runCap{right:112px}}
.newpart{display:flex;gap:14px;align-items:center;border:1px dashed var(--ln);padding:10px 12px}
.newpart svg{flex:none;width:92px;height:70px}
.newpart b{display:block;font-size:16px;color:var(--ac)}
.newpart span{font-size:13px;line-height:1.55}
.rec{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-top:12px}
.rec b{font:400 20px var(--fm);color:var(--ac)}
#scrBack,#scrParts{background:rgba(6,34,82,.55);pointer-events:auto;z-index:8}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.part{border:1px solid var(--dim);padding:8px 10px 10px;min-height:150px}
.part.on{border-color:var(--ln)}
.part svg{width:100%;height:74px;display:block}
.part b{display:block;font-size:14px;margin-top:4px}
.part span{display:block;font-size:12px;line-height:1.5;color:var(--dim);margin-top:2px}
.part.off b,.part.off svg{opacity:.3}
.part .no{font:400 11px var(--fm);letter-spacing:.14em;color:var(--dim)}

/* ===== もどる・音（いつも同じ場所） ===== */
#bBack{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top));z-index:9;min-height:0;height:44px;padding:0 14px 0 12px;font:700 16px var(--fj);letter-spacing:.06em;background:var(--bg);border:1.5px solid var(--ln);color:var(--ln);display:flex;align-items:center;gap:8px}
#bBack::before{content:"";position:absolute;inset:-6px;border:1px dashed rgba(232,241,255,.35);pointer-events:none}
#bBack i{font-style:normal;color:var(--ac);font-size:15px}
#bMute{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:9;width:44px;height:44px;min-height:0;padding:0;background:var(--bg);border:1.5px solid var(--ln);color:var(--ln);font:400 13px var(--fm)}

/* ===== 検図票（確認テスト） ===== */
#scrTest{pointer-events:auto;background:rgba(6,34,82,.6);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(66px + env(safe-area-inset-top)) 14px calc(26px + env(safe-area-inset-bottom))}
.sheet{width:100%;margin:0 auto;padding:16px 16px 18px}
.sh-h{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px;border-bottom:1.5px solid var(--ln);padding-bottom:8px}
.sh-h .t{font:400 18px var(--fm);letter-spacing:.16em;line-height:1}
.sh-h .t small{display:block;font-family:var(--fj);font-size:13px;font-weight:700;letter-spacing:.02em;margin-top:5px}
.sh-h .sp{flex:1}
.sh-h .no{font-weight:700;font-size:15px;border:1.5px solid var(--ac);color:var(--ac);padding:4px 9px}
.lamps{display:flex;gap:6px;margin-bottom:12px}
.lamps i{flex:1;height:10px;border:1px solid var(--dim)}
.lamps i.ok{background:var(--ac);border-color:var(--ac)}.lamps i.ng{background:repeating-linear-gradient(45deg,var(--ln) 0 2px,transparent 2px 6px);border-color:var(--ln)}.lamps i.cur{border:2px solid var(--ln)}
#tQ{font-size:18px;font-weight:700;line-height:1.7;margin:4px 2px 12px}
#tFig{background:#F4F8FF;padding:8px;margin-bottom:14px;text-align:center;border:1.5px solid var(--ln);outline:1px dashed rgba(232,241,255,.35);outline-offset:5px}
#tFig svg{width:100%;height:auto;max-height:240px}
#tA{display:flex;flex-direction:column;gap:12px}
.ch{display:flex;align-items:center;gap:12px;min-height:54px;text-align:left;font-size:16px;font-weight:700;padding:8px 14px;line-height:1.45;border:1.5px solid var(--ln);background:rgba(8,48,111,.5);color:var(--ln);border-radius:0}
.ch i{flex:none;font:400 16px var(--fm);font-style:normal;width:30px;height:30px;border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center}
.ch.ok{border-color:var(--ac);background:var(--ac);color:#0B3D91}.ch.ok i{border-color:#0B3D91}
.ch.ng{background:repeating-linear-gradient(45deg,rgba(232,241,255,.18) 0 3px,transparent 3px 9px)}
.ch:disabled{cursor:default}
.numbox{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.numbox .v{flex:1;height:58px;border:1.5px solid var(--ln);border-bottom:3px solid var(--ac);color:var(--ac);font:400 32px var(--fm);display:flex;align-items:center;justify-content:flex-end;padding:0 14px;letter-spacing:.06em}
.numbox .u{font:700 20px var(--fj);min-width:40px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{min-height:52px;padding:0;font:400 24px var(--fm);border:1.5px solid var(--ln);background:rgba(8,48,111,.5);color:var(--ln);border-radius:0}
.keys button.go{grid-column:span 4;font:700 18px var(--fj);background:var(--ac);color:#0B3D91;border-color:var(--ac)}
.ord{display:flex;flex-direction:column;gap:10px}
.ord .slot{min-height:46px;border:1.5px dashed var(--dim);display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:15px;font-weight:700}
.ord .slot i{font-style:normal;font:400 18px var(--fm);width:22px;color:var(--ac)}
#tEx{margin-top:14px;padding:12px 14px;font-size:15px;font-weight:700;line-height:1.6;border:1px dashed var(--ln)}
#tEx b{font-size:18px;margin-right:8px}
#tNext{width:100%;margin-top:14px}
#scrEnd{pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(6,34,82,.55)}
#scrEnd .panel{position:relative;left:auto;right:auto;bottom:auto;width:100%;max-width:560px}
.big{font:400 76px var(--fm);line-height:1;margin:12px 0 16px;color:var(--ac)}
.big small{font-size:24px;color:var(--ln)}
.col{display:flex;flex-direction:column;gap:14px}

/* ===== 横長（PC・iPad横） ===== */
@media (min-aspect-ratio:21/20){
  #scrTitle{right:auto;width:47%;justify-content:center;padding:8vh 3vw 6vh 5vw}
  h1.tt .a{font-size:clamp(56px,6.6vw,112px)}
  .t-bot{align-self:flex-start;max-width:440px;margin-top:5vh}
  #scrMap .mfoot{left:auto;width:min(720px,60vw)}
  .panel{left:auto;right:4vw;bottom:7vh;width:min(600px,46vw);padding:24px 26px}
  .panel.wide{left:6vw;right:6vw;width:auto;top:9vh;bottom:9vh;max-height:none}
  .sheet{max-width:1240px;display:grid;grid-template-columns:1.05fr 1fr;column-gap:36px;padding:24px 28px 26px}
  #scrTest{padding:calc(70px + env(safe-area-inset-top)) 4vw 4vh;display:flex;flex-direction:column}
  .sheet{margin:auto}
  #scrEnd .panel{max-width:900px;display:grid;grid-template-columns:1fr 1fr;gap:10px 36px;align-items:center;padding:32px 36px}
  .big{font-size:110px}
}
@media (max-aspect-ratio:21/20){
  .panel.wide{top:calc(64px + env(safe-area-inset-top));bottom:calc(14px + env(safe-area-inset-bottom));max-height:none}
}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}

/* 共通部品 Guide の「ひとこと」の1文字（class=ch）が、確認テストの選択肢 .ch の見た目を拾わないように */
.gd-cheer span.ch{display:inline-block;border:0;background:none;box-shadow:none;padding:0;margin:0;min-height:0;width:auto;height:auto;gap:0;font:inherit;color:inherit;text-align:inherit;filter:none;border-radius:0}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>

<div id="scrTitle" class="scr">
  <div class="t-head">
    <div class="t-kick">DWG No. BS-04 ／ <b>中2理科 電流とその利用 第4回</b></div>
    <h1 class="tt"><span class="a">でんりゅう<em>水門</em></span></h1>
    <div class="t-dim"><i></i><span>分かれ道の電流</span><i></i></div>
  </div>
  <div class="t-bot">
    <div class="nm bp" id="nmRow"><label for="nameIn">設計者名</label><input id="nameIn" maxlength="16" placeholder="なまえ（なくてもOK）" autocomplete="off"></div>
    <button class="btn y" id="bStart">設計をはじめる</button>
    <div class="row"><button class="btn sm" id="bHow">✋ あそびかた</button><button class="btn sm" id="bCont">つづきから</button><button class="btn sm" id="bBook1">📖 図鑑</button></div>
  </div>
</div>

<div id="scrMap" class="scr hidden">
  <div class="mfoot"><button class="btn sm" id="bParts">部品台帳</button><button class="btn sm" id="bBook2">📖 図鑑</button><button class="btn sm" id="bGacha">🎁 ガチャ</button><button class="btn sm y" id="bToTest">検図へ</button></div>
</div>

<div id="scrRun" class="scr hidden">
  <div id="runCap"><b id="capT"></b><span id="capS"></span></div>
  <div id="resBar" class="bp hidden">
    <h3 id="rT"></h3>
    <div class="eq" id="rEq"></div>
    <p id="rP"></p>
    <div class="btns" id="rB"></div>
  </div>
</div>

<div id="scrClear" class="scr hidden">
  <div class="panel bp">
    <h2 id="cTitle">区画 竣工<small id="cSub"></small></h2>
    <div class="stars" id="cStars"></div>
    <div class="newpart" id="cPart"></div>
    <div class="rec" id="cRec"></div>
    <div class="btns"><button class="btn sm" id="cMap">区画図へ</button><button class="btn y sm" id="cNext">次の区画へ</button></div>
  </div>
</div>

<div id="scrParts" class="scr hidden">
  <div class="panel bp wide">
    <h2>部品台帳<small>区画を竣工させるたびに、部品図が1枚ずつ登録される</small></h2>
    <div class="parts" id="pList"></div>
    <div class="btns"><button class="btn sm" id="pClose">とじる</button></div>
  </div>
</div>

<div id="scrTest" class="scr hidden">
  <div class="sheet bp">
    <div class="tcol">
      <div class="sh-h"><div class="t">INSPECTION<small>検図票 ─ 確認テスト</small></div><div class="sp"></div><div class="no" id="tNo"></div></div>
      <div class="lamps" id="tLamps"></div>
      <div id="tQ"></div>
      <div id="tFig" class="hidden"></div>
    </div>
    <div class="tcol">
      <div id="tA"></div>
      <div id="tEx" class="hidden"></div>
      <button class="btn y hidden" id="tNext">つぎへ</button>
    </div>
  </div>
</div>

<div id="scrEnd" class="scr hidden">
  <div class="panel bp">
    <div><h2>検図 完了<small id="eName"></small></h2><div class="big" id="eScore"></div></div>
    <div class="col">
      <button class="btn y" id="eCard">📝 提出カードを表示</button>
      <button class="btn sm" id="eBook">📖 図鑑</button>
      <button class="btn sm" id="eMap">区画図へ</button>
    </div>
  </div>
</div>

<div id="scrBack" class="scr hidden">
  <div class="panel bp"><h2 id="bkT">もどりますか？<small id="bkSub">進み具合は保存されます。</small></h2>
    <div class="btns"><button class="btn sm" id="bkNo">つづける</button><button class="btn y sm" id="bkGo">もどる</button></div></div>
</div>
<button class="hidden" id="bBack" aria-label="もどる"><i>◀</i><span>もどる</span></button>
<button id="bMute" aria-label="音">SND</button>
</div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',

    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

function startTest(){scene='test';G=null;showScr('scrTest');backBtn();TQ=window.Quiz?Quiz.test():[];TI=0;TA=[];TOK=[];$('scrTest').scrollTop=0;showQ()}
function lamps(){$('tLamps').innerHTML=TQ.map(function(q,i){return'<i class="'+(i<TOK.length?(TOK[i]?'ok':'ng'):i===TI?'cur':'')+'"></i>'}).join('')}
function showQ(){if(TI>=TQ.length)return finishTest();var q=TQ[TI];$('tNo').textContent='第'+(TI+1)+'問 ／ '+TQ.length;lamps();
  $('tQ').innerHTML=esc(q.q).replace(/&lt;(\/?)(sub|sup)&gt;/g,'<$1$2>');var f=$('tFig');if(q.fig){f.innerHTML=q.fig;f.classList.remove('hidden')}else{f.innerHTML='';f.classList.add('hidden')}
  $('tEx').classList.add('hidden');$('tNext').classList.add('hidden');var box_=$('tA');box_.innerHTML='';
  if(q.t==='choice'){q.shown.forEach(function(s,i){var b=document.createElement('button');b.className='ch';b.innerHTML='<i>'+'ABCDEF'.charAt(i)+'</i><span></span>';b.querySelector('span').innerHTML=esc(s).replace(/&lt;(\/?)(sub|sup)&gt;/g,'<$1$2>');b.dataset.v=s;b.onclick=function(){answer(s,b)};box_.appendChild(b)})}
  else if(q.t==='num'){var v='';box_.innerHTML='<div class="numbox"><div class="v" id="nv">&nbsp;</div><div class="u">'+esc(q.unit||'')+'</div></div><div class="keys" id="nk"></div>';
    var ks=['7','8','9','⌫','4','5','6','.','1','2','3','0'],nk=$('nk');ks.forEach(function(k){var b=document.createElement('button');b.textContent=k;b.onclick=function(){if(TA.length>TI)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<7&&!(k==='.'&&v.indexOf('.')>=0))v+=k;$('nv').innerHTML=v?esc(v):'&nbsp;';tone(900,.03,'sine',.04)};nk.appendChild(b)});
    var go=document.createElement('button');go.className='go';go.textContent='この値で決定';go.onclick=function(){if(v&&TA.length<=TI)answer(v,null)};nk.appendChild(go)}
  else{var sel=[];var wrap=document.createElement('div');wrap.className='ord';box_.appendChild(wrap);
    var draw=function(){wrap.innerHTML='';sel.forEach(function(s,i){var d=document.createElement('div');d.className='slot';d.innerHTML='<i>'+(i+1)+'</i><span></span>';d.querySelector('span').textContent=s;wrap.appendChild(d)});
      q.shown.forEach(function(s){if(sel.indexOf(s)>=0)return;var b=document.createElement('button');b.className='ch';b.innerHTML='<i>＋</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){if(TA.length>TI)return;sel.push(s);tone(700+sel.length*80,.05,'sine',.05);if(sel.length===q.shown.length)answer(sel.slice(),null);else draw()};wrap.appendChild(b)});
      if(sel.length&&TA.length<=TI){var r=document.createElement('button');r.className='btn sm';r.textContent='やりなおす';r.onclick=function(){sel=[];draw()};wrap.appendChild(r)}};
    draw()}}
function answer(v,btn){if(TA.length>TI)return;var q=TQ[TI],ok=window.Quiz?Quiz.check(q,v):false;TA.push(v);TOK.push(ok);ok?SFX.ok():SFX.bad();
  [].slice.call($('tA').querySelectorAll('.ch')).forEach(function(b){b.disabled=true;if(q.t==='choice'){if(b.dataset.v===q.choices[0])b.classList.add('ok');else if(b===btn)b.classList.add('ng')}});
  if(q.t==='order'){var w=$('tA').querySelector('.ord');if(w)[].slice.call(w.querySelectorAll('.slot')).forEach(function(d,i){d.style.borderColor=v[i]===q.items[i]?AC:LN;d.style.borderStyle='solid'})}
  var ex=$('tEx');ex.innerHTML=(ok?'<b style="color:'+AC+'">合格</b>':'<b>要修正</b>正解：'+esc(window.Quiz?Quiz.answer(q):'').replace(/&lt;(\/?)(sub|sup)&gt;/g,'<$1$2>')+'<br>')+esc(q.ex||'').replace(/&lt;(\/?)(sub|sup)&gt;/g,'<$1$2>');ex.classList.remove('hidden');
  lamps();var nb=$('tNext');nb.textContent=TI+1>=TQ.length?'検図を終える':'つぎへ';nb.classList.remove('hidden');setTimeout(function(){nb.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'})},50)}
$('tNext').onclick=function(){TI++;$('scrTest').scrollTop=0;showQ()};
function totalStars(){var n=0;for(var k in SV.stars)n+=SV.stars[k].filter(Boolean).length;return n}
function finishTest(){var qs=TQ,answers=TA;var review=window.Quiz?Quiz.review(qs,answers):[],marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length,name=getName();
  var records=TEST?[['モード','確認テストだけ']]:[['クリアタイム',SV.clearMs?fmtT(SV.clearMs):'（大口注文まだ）'],['一発で合った注文',(SV.first||0)+' / '+(SV.orders||0)],['配水した家',(SV.houses||0)+'戸'],['区画の★',totalStars()+' / 36']];
  $('eName').textContent=(name?name+'　':'')+'確認テスト';$('eScore').innerHTML=score+'<small> / '+qs.length+' 点</small>';
  setScene('end');
  if(window.SubmitCard)CARD=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　電流とその利用　第4回',
    game:'でんりゅう水門 ～分かれ道の電流～'+(TEST?'（確認テストのみ）':''),name:name,score:score,total:qs.length,marks:marks,records:records,review:review},function(){});
  refreshK()}
$('eCard').onclick=function(){if(CARD&&window.SubmitCard)SubmitCard.reopen(CARD)};
$('eMap').onclick=function(){setScene(TEST?'title':'map')};

/* ---------------- ループ ---------------- */
var last=performance.now();
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  c.setTransform(DPR,0,0,DPR,0,0);if(BGC)c.drawImage(BGC,0,0,W,H);else{c.fillStyle=BG;c.fillRect(0,0,W,H)}
  SHK=Math.max(0,SHK-dt);FLASH=Math.max(0,FLASH-dt*2.5);if(SHK>0&&!RM)c.translate((Math.random()-.5)*16*SHK,(Math.random()-.5)*16*SHK);
  if(scene==='run'&&G){if(scene==='run'&&$('scrBack').classList.contains('hidden')&&!PAUSED)update(dt);drawCircuit(G);drawHUD();drawTray();drawHints();
    if(DRAG&&DRAG.moved){c.globalAlpha=.92;drawPiece(DRAG.p,DRAG.x,DRAG.y-10,TS,{tile:1,sel:1});c.globalAlpha=1;var s=slotAt(DRAG.x,DRAG.y);if(s){var p=P(s.u,s.v);box(p[0]-TS/2-6,p[1]-TS/2-6,TS+12,TS+12,canTake(s,DRAG.p)?AC:LN,2,[4,3])}}}
  else if(scene==='map')drawMap();
  else if(scene==='title'){drawTitle()}
  stepFX(dt);drawFX();
  if(FLASH>0&&!RM){c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='rgba(255,210,63,'+(FLASH*.18)+')';c.fillRect(0,0,W,H)}
  requestAnimationFrame(frame)}
addEventListener('resize',resize);

/* ---------------- はじまり ---------------- */
resize();
window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]});
refreshK();
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nmRow').classList.add('hidden')}else if(SV.name)$('nameIn').value=SV.name;
if(!(SV.unl>1))$('bCont').classList.add('hidden');
if(TEST){startTest()}else setScene('title');
requestAnimationFrame(frame);
/* 自動操作の確かめ用（遊びには影響しない） */
window.__BS={G:function(){return G},SV:function(){return SV},start:startDay,flow:startFlow,scene:function(){return scene},
  slotXY:function(s){var p=P(s.u,s.v);return p},trayR:function(){return TR},place:function(s,p){return place(s,p)},
  solve:function(wrong){var L=G.L,O=G.O;/* 正しい組を探してはめる */
    L.slots.forEach(function(s){if(s.fixed||s.piece)return;if(s.type==='split'||s.type==='merge'){var p=L.tray.filter(function(q){return q.k===s.type})[0];if(p)place(s,p)}});
    var free=L.gs.filter(function(s){return !s.fixed}),gates=L.tray.filter(function(q){return q.k==='gate'});var fixedSum=L.gs.filter(function(s){return s.fixed}).reduce(function(a,s){return a+s.piece.val},0);
    var need=O.T-fixedSum;function rec(k,rem,used){if(k===free.length)return rem===0?used:null;for(var i=0;i<gates.length;i++){if(used.indexOf(gates[i])>=0)continue;var r=rec(k+1,rem-gates[i].val,used.concat([gates[i]]));if(r)return r}return null}
    var sol=wrong?gates.slice(0,free.length):rec(0,need,[]);if(sol)free.forEach(function(s,i){if(sol[i])place(s,sol[i])});
    if(L.ps&&!L.ps.piece){var inflow=L.ps.e==='ab'?L.gs[0].piece.val+L.gs[1].piece.val:O.T;var pp=L.tray.filter(function(q){return q.k==='pipe'&&(wrong?q.val!==inflow:q.val===inflow)})[0];if(pp)place(L.ps,pp)}}};
})();
</script>
