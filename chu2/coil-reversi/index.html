<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1B2A41">
<title>コイル・ホッケー ～誘導電流の向き～</title>
<!--
  コイル・ホッケー ～誘導電流の向き～（改題）　（ゲームID coil-reversi ／ コマID chu2-denryu-31 ／ 確認用）
  2026-09-27 v2 ゼロから作り直し（割り当て表 31 の行どおり）

  【遊びの核】エアホッケー。パックは棒磁石（半分がN・半分がS。向きは変わらないパック）。両端のゴールの奥にコイルがあり、
    それぞれに検流計。パックがコイルに近づく・遠ざかるたびに、そのコイルの針が左右に振れる（リアルタイム）。
    お題「相手のコイルを 右 に振らせてゴール」に合う面（N/S）で打ちこんだときだけ得点。合わない向きならノーゴール。
  【理科の埋め込み】中2の範囲（内容の取扱い：動かす向きを変えると電流の向きが変わる）にそろえ、向きは一から求めさせない。
    台ごとに「基準の札」（例：N極を近づける→右）を先に見せ、そこから
      ・近づける⇄遠ざける で逆　・N⇄S で逆　・両方変えると元と同じ
    で考える。自分が打つとパックは手前のコイルから「遠ざかる」ので、手前のコイルのお題で「遠ざける」判断が自然に入る。
    相手の打ち込みは、打たれる前に自分のコイルの針の向きを宣言（読みが当たるとコイルのバリアではね返す）。
  【ハマる仕組み】主⑤コンボ（お題の一発成功・読みの的中が続くと ×n、外すとリセット）／副⑬死に覚え（「NでもSでも同じ」
    「近づけても遠ざけても同じ」の罠でノーゴール→直後に理由を1行）・⑯1試合1〜2分・負けてもすぐ再戦
  【道のり×集める×美麗】CPUの対戦相手を1人ずつ倒すトーナメント（7人）／勝つたびに磁石パック（宝石のローポリ）を集める＋中2理科図鑑／
    三角面のローポリの台と背景
  【画風】ローポリ（三角面のフラットな陰影）。背景も台もマレットも検流計も、すべて三角形の面の明暗で描く。丸いグラデーションや角丸は使わない
  【配色】夜のゲームセンター 背景 #1B2A41／主 #F2F4F3／差し #FF6B35（N極もこの色）／S極 #3FA7D6／銅 #C9793A
  【書体】Stick（見出し・札。直線だけで組んだ字形がローポリの面と合う）／Chakra Petch（数字・欧文）
    ※割り当て表は Zen Kaku Gothic Antique だが、同じ電流単元の heranai-ippondo が既に使っているため、単元内の重複をさけて変更
  【画面の組み方】全画面。横長（PC・iPad横）＝台を横長に置いて左が自分・右が相手、検流計は台の左右。縦長（スマホ・iPad縦）＝台を縦にして自分が下
  【HUD】スコアボード（YOU 2 - 1 FOX）・お題の札・基準の札を台の外側に三角面の札で描く。もどるは左上の白い札「◀ もどる」
  【音】WebAudio合成のアーケード風シンセ（矩形波・のこぎり波）。ミュートあり
  【操作】指だけ（マウスも可）。自分の陣地をドラッグ＝マレットを動かす。「反転」でパックのN・Sを入れかえる（自分の陣地にあるとき）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stick&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B2A41;--bg2:#243752;--wh:#F2F4F3;--or:#FF6B35;--sb:#3FA7D6;--ink:#0E1726;
  --fh:"Chakra Petch","Stick","Hiragino Sans","Yu Gothic",sans-serif;--fb:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;--fn:"Chakra Petch","Stick",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{color:var(--wh);font-family:var(--fb);user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;pointer-events:none}
.scr button,.scr input,.scr .facet{pointer-events:auto}
.hidden{display:none!important}

/* ===== 三角面の札（角を斜めに落とした多角形） ===== */
.facet{position:relative;background:linear-gradient(135deg,#2E4566 0 48%,#263B59 48% 100%);color:var(--wh);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.facet.w{background:linear-gradient(135deg,#FFFFFF 0 45%,#E4E8E7 45% 70%,#D3D9D8 70%);color:var(--ink)}
.facet.o{background:linear-gradient(135deg,#FF8A5B 0 40%,#FF6B35 40% 72%,#E4541F 72%);color:#fff}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border:0;
  font:400 22px var(--fh);letter-spacing:.08em;transition:transform .07s}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.sm{min-height:46px;font-size:18px;padding:0 14px}
.btn:disabled{opacity:.4;cursor:default}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* ===== タイトル ===== */
#scrTitle{display:flex;flex-direction:column;justify-content:flex-end;padding:calc(64px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom))}
.tt-box{display:flex;flex-direction:column;gap:12px;width:100%;max-width:520px;align-self:center}
.logo{pointer-events:none;text-align:center}
.logo .k{font:700 13px var(--fn);letter-spacing:.3em;color:#9FB3CC}
.logo h1{margin:2px 0 0;font:400 clamp(46px,13vw,110px)/1 var(--fh);letter-spacing:.02em;color:var(--wh);
  text-shadow:.04em .04em 0 var(--or),.08em .08em 0 #B8441B,.1em .12em 0 rgba(0,0,0,.5)}
.logo h1 span{display:block}
.logo .sub{display:inline-block;margin-top:12px;padding:6px 16px;font:400 20px var(--fh);letter-spacing:.14em}
.logo-in{animation:logoin .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes logoin{0%{opacity:0;transform:translateY(-60px) rotate(-4deg)}100%{opacity:1;transform:none}}
.row{display:flex;gap:10px}.row>*{flex:1}
.nm{display:flex;align-items:center;gap:10px;padding:8px 14px}
.nm label{font:400 17px var(--fh);white-space:nowrap}
.nm input{flex:1;min-width:0;height:38px;background:#0E1726;border:2px solid #3E5A80;color:var(--wh);font:16px var(--fb);padding:0 10px}

/* ===== トーナメント表 ===== */
#scrMap .mhead{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));padding:6px 22px 8px;text-align:center;pointer-events:none;white-space:nowrap}
#scrMap .mhead b{display:block;font:400 24px var(--fh);letter-spacing:.1em}
#scrMap .mhead small{font:700 13px var(--fn);letter-spacing:.06em;color:#C9D3E0}
#mNodes .node{position:absolute;transform:translate(-50%,-50%);min-width:104px;min-height:50px;padding:4px 10px;font:400 16px var(--fh);line-height:1.2;text-align:center}
#mNodes .node small{display:block;font:700 12px var(--fn);letter-spacing:.08em}
#mNodes .node.lock{opacity:.45}
#mNodes .node.cur{animation:pulse 1.2s ease-in-out infinite}
#scrMap .mfoot{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
#scrMap .mfoot>*{flex:0 1 210px}

/* ===== 試合中 ===== */
.rb{position:absolute;top:calc(10px + env(safe-area-inset-top));width:48px;height:48px;min-height:0;padding:0;font:700 20px var(--fn)}
#bPause{right:12px}#bMute{right:66px}
#order{position:absolute;padding:6px 16px 8px;text-align:center;white-space:nowrap;pointer-events:none;transform:translateX(-50%)}
#order small{display:block;font:700 11px var(--fn);letter-spacing:.24em;color:#FFD9C8}
#order b{font:400 22px var(--fh);letter-spacing:.04em}
#order i{font-style:normal;display:inline-block;padding:0 8px;margin:0 2px;background:#fff;color:var(--or);font:400 22px var(--fh)}
@media (max-width:520px){#order{padding:5px 10px 6px}#order b,#order i{font-size:16px}}
#order.pop{animation:opop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes opop{0%{transform:translateX(-50%) scale(1.5)}100%{transform:translateX(-50%) scale(1)}}
#bFlip{position:absolute;width:92px;height:92px;min-height:0;padding:0;flex-direction:column;gap:0;font:400 20px var(--fh);line-height:1.1}
#bFlip small{font:700 11px var(--fn);letter-spacing:.1em}
#bFlip:disabled{opacity:.35}
#decl{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;transform:translateX(-50%)}
#decl .q{padding:5px 12px;font:400 17px var(--fh);white-space:nowrap}
#decl .b{display:flex;gap:10px}
#decl .b button{min-width:80px;min-height:54px;font:400 22px var(--fh)}
#decl.on .b button{animation:pulse .8s ease-in-out infinite}
#toast{position:absolute;left:50%;transform:translateX(-50%);max-width:min(94vw,760px);padding:8px 16px 9px;font:15px/1.55 var(--fb);text-align:center;pointer-events:none}
#toast b{color:var(--or);font-weight:700}
#toast.ok b{color:#0E1726;background:#FFD9C8;padding:0 3px}
#toast.w b{color:#D2451B}

/* ===== 試合前・試合後・一時停止・もどる ===== */
.cover{pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(14,23,38,.6)}
.card{width:min(580px,94vw);padding:22px 22px 20px;text-align:center}
.card h2{margin:0;font:400 34px/1.15 var(--fh);letter-spacing:.06em}
.card h2 small{display:block;font:700 13px var(--fn);letter-spacing:.3em;color:#FFB08F;margin-bottom:4px}
.card p{margin:12px 0 0;font-size:16px;line-height:1.7}
.card p b{color:var(--or)}
.card .calib{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.card .calib div{padding:6px 12px;font:400 17px var(--fh);background:#0E1726}
.card .btns{display:flex;gap:10px;margin-top:18px}.card .btns>*{flex:1}
.stars{display:flex;gap:10px;justify-content:center;margin:16px 0 8px}
.stars div{flex:1;max-width:150px;padding:8px 4px;font:400 14px/1.3 var(--fh);background:#0E1726;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.stars div i{display:block;font-style:normal;font-size:32px;line-height:1.1;color:#3E5A80}
.stars div.on i{color:var(--or)}
.stars div.wait{opacity:0}.stars div.don{animation:don .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes don{0%{transform:scale(2.4) rotate(-12deg);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:none}}
.rec{display:flex;justify-content:center;gap:18px;font-size:14px;margin-top:6px;flex-wrap:wrap}
.rec b{font:700 22px var(--fn)}

/* ===== 確認テスト（検定台） ===== */
#scrTest{pointer-events:auto;touch-action:pan-y;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(66px + env(safe-area-inset-top)) 14px calc(26px + env(safe-area-inset-bottom));background:rgba(14,23,38,.55)}
.page{width:100%;max-width:1180px;margin:0 auto;padding:18px 18px 20px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh-h .t{font:400 24px var(--fh);letter-spacing:.08em}.sh-h .t small{display:block;font:700 12px var(--fn);letter-spacing:.24em;color:#FFB08F}
.sh-h .sp{flex:1}.sh-h .no{font:700 18px var(--fn);background:var(--or);color:#fff;padding:4px 12px}
.lamps{display:flex;gap:5px;margin-bottom:12px}
.lamps i{flex:1;height:12px;background:#3E5A80;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.lamps i.ok{background:var(--or)}.lamps i.ng{background:#6B7A8F}.lamps i.cur{background:#fff}
#tQ{font-size:18px;line-height:1.75;margin:4px 2px 12px}
#tFig{padding:8px;margin-bottom:14px;text-align:center;background:#F2F4F3;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
#tFig svg{width:100%;height:auto;max-height:250px}
#tA{display:flex;flex-direction:column;gap:12px}
.ch{display:flex;align-items:center;gap:12px;min-height:54px;text-align:left;font:16px/1.45 var(--fb);padding:8px 14px;border:0;color:var(--ink);
  background:linear-gradient(135deg,#FFFFFF 0 55%,#E4E8E7 55%);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.ch:active{transform:translateY(2px)}
.ch i{flex:none;font:700 17px var(--fn);font-style:normal;width:30px;height:30px;background:var(--bg);color:#fff;display:flex;align-items:center;justify-content:center}
.ch.ok{background:linear-gradient(135deg,#FFB08F 0 55%,#FF8A5B 55%)}.ch.ng{background:#8A97A8}
.ch:disabled{cursor:default}
.numbox{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.numbox .v{flex:1;height:58px;background:#0E1726;color:var(--or);font:700 32px var(--fn);display:flex;align-items:center;justify-content:flex-end;padding:0 14px}
.numbox .u{font-size:20px;min-width:40px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{min-height:52px;font:700 24px var(--fn);background:#F2F4F3;color:var(--ink);border:0}
.keys button.go{grid-column:span 4;font:400 20px var(--fh);background:var(--or);color:#fff}
.ord{display:flex;flex-direction:column;gap:10px}
.ord .slot{min-height:46px;border:2px dashed #6B7A8F;display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:15px}
.ord .slot i{font-style:normal;font:700 19px var(--fn);width:22px}
#tEx{margin-top:14px;padding:12px 14px;font-size:15px;line-height:1.65;background:#0E1726}
#tEx b{font:400 20px var(--fh);margin-right:8px}
#tNext{width:100%;margin-top:16px}
#scrEnd .card .big{font:700 84px/1 var(--fn);margin:10px 0 14px;color:var(--or)}
#scrEnd .card .big small{font-size:26px;color:var(--wh)}
.col{display:flex;flex-direction:column;gap:10px;margin-top:10px}

/* ===== もどる（いつも左上・同じ場所） ===== */
#bBack{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top));z-index:6;min-height:48px;height:48px;padding:0 18px 0 14px;font:400 21px var(--fh);letter-spacing:.06em}
#scrBack{z-index:7}

@media (min-aspect-ratio:21/20){
  #scrTitle{justify-content:center;align-items:flex-start;padding:6vh 4vw 6vh 5vw}
  .tt-box{align-self:flex-start;max-width:min(470px,40vw)}
  .logo{text-align:left}
  .logo h1{font-size:clamp(56px,7vw,120px)}
  .sheetgrid{display:grid;grid-template-columns:1.05fr 1fr;column-gap:36px}
  .page{padding:26px 30px 28px}
  #scrTest{display:flex;flex-direction:column;padding-left:4vw;padding-right:4vw}
  .page{margin:auto}
}
@media (max-height:560px){.logo h1{font-size:44px}}
@media (prefers-reduced-motion:reduce){.pulse,.logo-in,#mNodes .node.cur,#decl.on .b button,#order.pop{animation:none}.stars div.don{animation:none}}
.gd-cheer span.ch{display:inline-block;border:0;background:none;box-shadow:none;padding:0;margin:0;min-height:0;width:auto;height:auto;gap:0;font:inherit;color:inherit;text-align:inherit;clip-path:none}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>

<div id="scrTitle" class="scr">
  <div class="tt-box">
    <div class="logo logo-in">
      <div class="k">STAGE 31 — 電流とその利用</div>
      <h1><span>コイル・</span><span>ホッケー</span></h1>
      <div class="sub facet o">～誘導電流の向き～</div>
    </div>
    <div class="nm facet" id="nmRow"><label for="nameIn">プレイヤー</label><input id="nameIn" maxlength="16" placeholder="なまえ（なくてもOK）" autocomplete="off"></div>
    <button class="btn facet o pulse" id="bStart">はじめる</button>
    <div class="row"><button class="btn facet w sm" id="bHow">✋ あそびかた</button><button class="btn facet sm" id="bCont">つづきから</button><button class="btn facet w sm" id="bBook1">📖 図鑑</button></div>
  </div>
</div>

<div id="scrMap" class="scr hidden">
  <div class="mhead facet"><b>トーナメント表</b><small id="mStat"></small></div>
  <div id="mNodes"></div>
  <div class="mfoot"><button class="btn facet w sm" id="bBook2">📖 図鑑</button><button class="btn facet o sm" id="bGacha">🎁 ガチャ</button><button class="btn facet sm" id="bToTest">📝 確認テストへ</button></div>
</div>

<div id="scrRun" class="scr hidden">
  <div id="order" class="facet o"><small>MISSION</small><b id="orderT"></b></div>
  <button class="btn facet w rb" id="bMute" aria-label="音">♪</button>
  <button class="btn facet w rb" id="bPause" aria-label="一時停止">II</button>
  <button class="btn facet w" id="bFlip" aria-label="パックのN・Sを入れかえる">⇅<span>反転</span><small>N ⇄ S</small></button>
  <div id="decl" class="hidden"><div class="q facet">手前の針は？</div><div class="b"><button class="btn facet w" id="dL">◀ 左</button><button class="btn facet w" id="dR">右 ▶</button></div></div>
  <div id="toast" class="facet w hidden"></div>
</div>

<div id="scrVs" class="scr cover hidden">
  <div class="card facet"><h2><small id="vNo"></small><span id="vName"></span></h2><p id="vNew"></p><div class="calib" id="vCal"></div>
    <div class="btns"><button class="btn facet o" id="vGo">試合開始</button></div></div>
</div>

<div id="scrClear" class="scr cover hidden">
  <div class="card facet"><h2><small id="cNo"></small><span id="cTitle"></span></h2>
    <div class="stars" id="cStars"></div><div class="rec" id="cRec"></div>
    <div class="btns"><button class="btn facet w sm" id="cMap">トーナメント表</button><button class="btn facet o" id="cNext">次の相手へ</button></div></div>
</div>

<div id="scrPause" class="scr cover hidden">
  <div class="card facet"><h2><small>PAUSE</small>一時停止</h2><p>台はそのまま止まっています。</p>
    <div class="btns"><button class="btn facet w sm" id="pMap">トーナメント表へ</button><button class="btn facet o" id="pGo">つづける</button></div></div>
</div>

<div id="scrTest" class="scr hidden">
  <div class="page facet sheetgrid">
    <div>
      <div class="sh-h"><div class="t">検定台<small>FINAL CHECK — 確認テスト</small></div><div class="sp"></div><div class="no" id="tNo"></div></div>
      <div class="lamps" id="tLamps"></div>
      <div id="tQ"></div>
      <div id="tFig" class="hidden"></div>
    </div>
    <div>
      <div id="tA"></div>
      <div id="tEx" class="hidden"></div>
      <button class="btn facet o hidden" id="tNext">つぎへ</button>
    </div>
  </div>
</div>

<div id="scrEnd" class="scr cover hidden">
  <div class="card facet"><h2><small>RESULT</small>検定おわり</h2><div id="eName" style="margin-top:6px"></div>
    <div class="big" id="eScore"></div>
    <div class="col"><button class="btn facet o" id="eCard">📝 提出カードを表示</button><button class="btn facet w sm" id="eBook">📖 図鑑</button><button class="btn facet sm" id="eMap">トーナメント表へ</button></div></div>
</div>

<div id="scrBack" class="scr cover hidden">
  <div class="card facet"><h2><small>BACK</small><span id="bkT">もどりますか？</span></h2><p id="bkSub">進み具合は保存されます。</p>
    <div class="btns"><button class="btn facet w sm" id="bkNo">つづける</button><button class="btn facet o" id="bkGo">もどる</button></div></div>
</div>
<button class="btn facet w hidden" id="bBack" aria-label="もどる">◀ もどる</button>
</div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',

    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',

    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',

    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',

  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  var m={x:cx+(LAND?r*1.35:r*.95),y:cy-r*(LAND?.8:.95)};var mr=L.mr;L.mr=r*.55;meterDraw(m,Math.sin(t*2.2)*.6,'検流計',1,t,true);L.mr=mr;
  c.save();c.translate(cx-r*.2,cy+r*.1);c.rotate(-.35+fl*.05);
  var sLen=r*.9,hx=[];for(var k=0;k<8;k++){var an=k/8*Math.PI*2+Math.PI/8;hx.push([Math.cos(an)*sLen,Math.sin(an)*sLen])}
  for(var k2=0;k2<8;k2++){var isN=(k2<4)===(face>0);tri(c,[0,0],hx[k2],hx[(k2+1)%8],isN?(k2%2?C.or:C.or2):(k2%2?C.sb:C.sb2))}
  poly(c,hx,null,C.ink,5);c.font='700 '+Math.round(sLen*.55)+'px "Chakra Petch",sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';
  c.fillText(face>0?'N':'S',0,sLen*.45);c.fillText(face>0?'S':'N',0,-sLen*.45);c.restore();
  // マレットとコイル
  malletDraw(cx+(LAND?-r*1.2:-r*.95),cy+r*.95,r*.42,C.wh,C.wh3,false);
  for(var j=0;j<6;j++){var xx=cx+(LAND?r*1.2:r*.9)+j*r*.1,yy=cy+r*.7;var pts=[];for(var q=0;q<6;q++){var a2=q/6*Math.PI*2+Math.PI/6;pts.push([xx+Math.cos(a2)*r*.07,yy+Math.sin(a2)*r*.45])}poly(c,pts,null,C.ink,6);poly(c,pts,null,j%2?C.gold:C.cu3,3.5)}
  if(!RM&&Math.random()<.08)PT.push({x:rnd(0,W),y:-10,vx:rnd(-20,20),vy:rnd(40,90),life:5,t:0,c:[C.or,C.sb,C.gold][Math.floor(rnd(0,3))],s:rnd(4,8),rot:0,vr:rnd(-3,3)})}
function mapPts(){var n=OPP.length-1,pts=[null];for(var i=1;i<=n;i++){if(LAND){var col=(i-1)%4,row=Math.floor((i-1)/4);pts.push([W*(.16+.23*col)+(row?W*.115:0),H*(.36+row*.3)])}
  else{pts.push([W*(i%2?.3:.7),H*(.17+(i-1)*.1)])}}return pts}
function drawMap(t){c.drawImage(BG0,0,0,W,H);c.fillStyle='rgba(14,23,38,.35)';c.fillRect(0,0,W,H);var pts=mapPts();
  c.save();c.lineWidth=4;c.strokeStyle='rgba(255,107,53,.6)';P();for(var i=1;i<pts.length;i++){if(i===1)c.moveTo(pts[i][0],pts[i][1]);else c.lineTo(pts[i][0],pts[i][1])}c.stroke();c.restore();
  for(var i2=1;i2<pts.length;i2++){var O=OPP[i2],un=i2<=SV.unl,done=SV.stars[i2]&&SV.stars[i2][0];c.save();c.globalAlpha=un?1:.35;animalDraw(pts[i2][0],pts[i2][1]-(LAND?64:44),LAND?26:18,O.a,O.col,t);c.restore()}
  // 集めたパック
  var n=PUCKS.length-1,w=Math.min(W*.9,n*56),x0=W/2-w/2,y=H-(LAND?100:104);c.save();c.font='15px "Chakra Petch","Stick",sans-serif';c.textAlign='center';c.fillStyle=C.wh;
  var got=Object.keys(SV.pucks||{}).length;c.fillText('集めた磁石パック　'+got+' / '+n+'　　読み的中 '+(SV.reads||0)+'回',W/2,y-34);
  for(var k=1;k<=n;k++){var x=x0+w*(k-.5)/n;c.save();if(!(SV.pucks&&SV.pucks[k]))c.globalAlpha=.25;puckDraw(x,y,18,1,0,PUCKS[k].c);c.restore()}c.restore()}
function placeNodes(){var box=$('mNodes');box.innerHTML='';var pts=mapPts();
  OPP.forEach(function(O,i){if(i===0)return;var b=document.createElement('button');var un=i<=SV.unl,st=SV.stars[i]||[0,0,0];
    b.className='node btn facet '+(un?(st[0]?'w':'o'):'lock')+(un&&!st[0]&&i===SV.unl?' cur':'');
    b.innerHTML='<small>'+(O.boss?'FINAL':'ROUND '+i)+'</small>'+esc(O.n)+'<br>'+(un?st.map(function(v){return v?'★':'☆'}).join(''):'🔒');
    b.style.left=pts[i][0]+'px';b.style.top=pts[i][1]+'px';b.disabled=!un;b.onclick=function(){ac();SFX.tick();startMatch(i)};box.appendChild(b)});
  var n=0;for(var k in SV.stars)n+=SV.stars[k].filter(Boolean).length;$('mStat').textContent='★ '+n+' / 21　WIN '+Object.keys(SV.pucks||{}).length+' / 7';
  $('bToTest').disabled=!SV.done}

/* ================= 遊び方案内（Guide） ================= */
var HELP=null,PRAC_RET=null;
var INTRO={title:'第31回　コイル・ホッケー',
  learn:'磁石を **近づける⇄遠ざける**、**N⇄S** を入れかえると、誘導電流の向き（針）は **逆** になる',

    {gesture:'drag',target:malT,to:puckT,until:function(){return G&&G.lastHit==='you'&&G.p.vu>.3},text:'マレットを **ドラッグ** して、パックを相手のゴールへ打ちこもう'},

    {gesture:'drag',target:malT,to:puckT,until:function(){return G&&G.pracDone},text:'S極を近づけると、針は **逆の左**。打ちこめ！'}

var TQ=[],TI=0,TA=[],TOK=[],CARD=null;
function startTest(){scene='test';G=null;showScr('scrTest');backBtn();HELP&&HELP.hide();TQ=window.Quiz?Quiz.test():[];TI=0;TA=[];TOK=[];$('scrTest').scrollTop=0;showQ()}
function lampsBar(){$('tLamps').innerHTML=TQ.map(function(q,i){return'<i class="'+(i<TOK.length?(TOK[i]?'ok':'ng'):i===TI?'cur':'')+'"></i>'}).join('')}
function showQ(){if(TI>=TQ.length)return finishTest();var q=TQ[TI];$('tNo').textContent=(TI+1)+' / '+TQ.length;lampsBar();
  $('tQ').textContent=q.q;var f=$('tFig');if(q.fig){f.innerHTML=q.fig;f.classList.remove('hidden')}else{f.innerHTML='';f.classList.add('hidden')}
  $('tEx').classList.add('hidden');$('tNext').classList.add('hidden');var box=$('tA');box.innerHTML='';

    ['7','8','9','⌫','4','5','6','.','1','2','3','0'].forEach(function(k){var b=document.createElement('button');b.textContent=k;b.onclick=function(){if(TA.length>TI)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<7&&!(k==='.'&&v.indexOf('.')>=0))v+=k;$('nv').innerHTML=v?esc(v):'&nbsp;';SFX.tick()};$('nk').appendChild(b)});
    var go=document.createElement('button');go.className='go';go.textContent='この値で決定';go.onclick=function(){if(v&&TA.length<=TI)answer(v,null)};$('nk').appendChild(go)}
  else{var sel=[];var wrap=document.createElement('div');wrap.className='ord';box.appendChild(wrap);
    var draw=function(){wrap.innerHTML='';sel.forEach(function(s,i){var d=document.createElement('div');d.className='slot';d.innerHTML='<i>'+(i+1)+'</i><span></span>';d.querySelector('span').textContent=s;wrap.appendChild(d)});
      q.shown.forEach(function(s){if(sel.indexOf(s)>=0)return;var b=document.createElement('button');b.className='ch';b.innerHTML='<i>＋</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){if(TA.length>TI)return;sel.push(s);SFX.tick();if(sel.length===q.shown.length)answer(sel.slice(),null);else draw()};wrap.appendChild(b)});

  if(q.t==='order'){var w=$('tA').querySelector('.ord');if(w)[].slice.call(w.querySelectorAll('.slot')).forEach(function(d,i){d.style.borderColor=v[i]===q.items[i]?C.or:'#8A97A8';d.style.borderStyle='solid'})}
  var ex=$('tEx');ex.innerHTML=(ok?'<b style="color:'+C.or+'">GOAL!</b>':'<b style="color:#9FB3CC">NO GOAL</b>正解：'+esc(window.Quiz?Quiz.answer(q):'')+'<br>')+esc(q.ex||'');ex.classList.remove('hidden');

/* ================= ループ ================= */
var last=performance.now();
function frame(now){var dt=Math.min(.04,(now-last)/1000);last=now;T+=dt;
  c.setTransform(DPR,0,0,DPR,0,0);
  if(toastT>0){toastT-=dt;$('toast').classList.toggle('hidden',toastT<=0)}
  KKt-=dt;if(KKt<=0){KKt=.5;kkUpd()}
  if(scene==='run'&&G){if(!G.paused&&!G.won){G.time+=dt;if(G.comboT>0)G.comboT=Math.max(0,G.comboT-dt*3);step(dt)}drawRun(dt);
    var f=$('bFlip');f.disabled=G.p.u>.5}
  else if(scene==='map'||scene==='test'||scene==='end')drawMap(T);
  else drawTitle(T);
  drawFX(dt);
  requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',function(){if(document.hidden&&scene==='run'&&G&&!G.won){G.paused=true;showScr('scrRun','scrPause')}});

/* ================= はじまり ================= */
resize();
window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]});
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nmRow').classList.add('hidden')}else if(SV.name)$('nameIn').value=SV.name;
if(!(SV.unl>1||SV.stars[1]))$('bCont').classList.add('hidden');
if(TEST){startTest()}else setScene('title');
requestAnimationFrame(frame);
window.__CR={G:function(){return G},L:function(){return L},start:startMatch,scene:function(){return scene},SV:function(){return SV}};
})();
