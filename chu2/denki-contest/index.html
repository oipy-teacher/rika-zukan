<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#C89B63">
<title>でんき工作コンテスト ～熱・光・音・運動～</title>
<!--
  でんき工作コンテスト ～熱・光・音・運動～　（ゲームID denki-contest ／ コマID chu2-denryu-13）v2 2026-09-27 作り直し
  予想用のコマ。器具から何が出るか（熱・光・音・運動）はゲームの中で一度も見せない。答えは実験で確かめる。

  【遊びの核】ドミノ・ピタゴラ装置づくり。段ボールの台に器具をのせ、割りピンの金具から金具へ導線を指で引いて
    「電池（電源装置）→スイッチ→器具→電池」の輪をつくる。スイッチを入れて通電テスト。輪が閉じていれば
    導線が1本ずつ光ってつながり、「通電OK」のスタンプが押される（ご褒美はここ。器具は光らせない・鳴らさない）。
    ショート・向きのある器具の逆づけ・スイッチが輪の外・器具を通らない近道は、テストで見つかる。
    通電したら、器具から次の仕掛けの「受け口」（熱で動く／光で動く／音で動く／動きで動く）へ矢印を指で引いて
    「何が出るか」を予想し、理由の札を貼って出品する。8作品つないだ装置ごと、予想を封筒に封印する。
  【画風】段ボール工作（別のデザイナー）。段目の見える段ボール、ちぎったガムテープ、マジックの手書き文字、
    割りピンの金具、色つきの工作用導線、赤い色画用紙。UIのボタンも段ボールの切れはしと画用紙。
  【世界とメタファー】放課後の理科室で開かれる「でんき工作コンテスト」。1作品＝段ボールの台1枚。
    作品をつなぐたびにピタゴラ装置が教室の前から後ろへ伸びていく（道のり）。部品箱を開けると「部品図鑑」の
    カードが出る（集める）。段ボールとテープの手づくりの味（美しさ）。
  【配色】背景 #C89B63（段ボール）／主 #3A2A1A（こげ茶のマジック）／差し #E63946（赤い画用紙）。
    ほかは導線の色（赤・黒・黄・緑・青）と割りピンの真ちゅう色だけ。紫と水色のグラデは使わない。
  【書体】Mochiy Pop P One（見出し・作品名）／Yusei Magic（マジックの手書き・札・ボタン）
  【画面の組み方】PC・iPad横＝左にお題と作品リスト、中央に段ボールの台、右に受け口の列と次の台が見え、下に部品箱。
    スマホ・iPad縦＝上から「装置の全体（教室の床）」→お題→台→受け口の列→部品箱の順に縦に落ちていく構図。
  【HUD】上の帯に教室の床と、伸びていく装置の模型（出品 n/8）。かけらは Zukan.state() で読んで自分で描く。
  【音】WebAudioで、段ボールをたたく音・テープをちぎる音・導線がつながる「ポン」・スタンプ。ミュートあり。
  【封印の形（前後のコマが読む。変えない）】localStorage rika-zukan:chu2:seal:chu2-denryu-13 に
    {v:1,koma,game,at,name,slots:{<key>:{title,devs:[器具],pred:[{dev,main,extra:[],reason:文}]}}}
    器具＝heater/led/bulb/buzzer/motor、出るもの＝heat/light/sound/motion。
  【ハマる仕組み】主⑩「5作品…ではなく8作品を出品するまで終われません」（最初から1つ進んだ進捗バー）
    副㉒お題に合わせて作る→審査・③開封（部品箱／実験後の封筒）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{--cb:#C89B63;--ink:#3A2A1A;--red:#E63946;--fh:"Mochiy Pop P One","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;--fm:"Yusei Magic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;--fb:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cb);overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);font-family:var(--fm);user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button{font-family:var(--fm);cursor:pointer;color:inherit;touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;pointer-events:none}
.scr button,.scr input,.scr .pe{pointer-events:auto}
.hidden{display:none!important}

/* ===== 段ボールのボタン・色画用紙のボタン ===== */
.kb{position:relative;min-height:50px;padding:0 18px;border:3px solid var(--ink);border-radius:7px 12px 6px 14px/12px 6px 13px 7px;
  background:repeating-linear-gradient(90deg,rgba(58,42,26,.07) 0 2px,transparent 2px 7px),#E7C48C;color:var(--ink);font:400 19px var(--fm);letter-spacing:.03em;
  box-shadow:3px 4px 0 var(--ink)}
.kb:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.kb.red{background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 4px),#E63946;color:#FFF7EA}
.kb.wh{background:repeating-linear-gradient(0deg,rgba(58,42,26,.05) 0 1px,transparent 1px 26px),#FBF4E4}
.kb.sm{min-height:44px;font-size:15px;padding:0 12px}
.kb:disabled{opacity:.45;cursor:default;transform:none}
.kb::after{content:"";position:absolute;width:34px;height:13px;top:-9px;left:14px;background:rgba(238,228,203,.82);transform:rotate(-6deg);clip-path:polygon(0 12%,8% 0,16% 14%,24% 0,100% 0,100% 100%,90% 86%,82% 100%,74% 88%,0 100%);pointer-events:none}
.kb.nt::after{display:none}

/* ===== 段ボールのパネル（テープで留めた紙） ===== */
.cbp{position:relative;border:3px solid var(--ink);border-radius:8px 14px 7px 12px/14px 7px 12px 8px;background:repeating-linear-gradient(90deg,rgba(58,42,26,.06) 0 2px,transparent 2px 8px),#DDB880;box-shadow:5px 7px 0 rgba(58,42,26,.35)}
.paper{position:relative;border:2px solid rgba(58,42,26,.55);background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(58,120,190,.16) 27px 28px),#FBF6EA;box-shadow:3px 5px 0 rgba(58,42,26,.3);border-radius:3px}
.tp::before,.tp::after{content:"";position:absolute;width:64px;height:20px;background:rgba(238,228,203,.86);box-shadow:0 1px 1px rgba(0,0,0,.12);clip-path:polygon(0 10%,6% 0,12% 12%,18% 0,100% 0,100% 100%,92% 88%,86% 100%,80% 90%,0 100%);pointer-events:none;z-index:2}
.tp::before{top:-10px;left:18px;transform:rotate(-8deg)}
.tp::after{top:-9px;right:18px;transform:rotate(7deg)}
.hd{font:400 26px/1.15 var(--fh);margin:0}
.mk{font-family:var(--fm)}

/* ===== タイトル ===== */
#scrTitle{display:flex;flex-direction:column;justify-content:flex-end;padding:calc(20px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom))}
.tt-bot{display:flex;flex-direction:column;gap:14px;width:100%;max-width:520px;align-self:center}
.tt-bot .row{display:flex;gap:12px}.tt-bot .row>*{flex:1}
.nm{display:flex;align-items:center;gap:10px;padding:8px 12px}
.nm label{font:400 16px var(--fm);white-space:nowrap}
.nm input{flex:1;min-width:0;height:40px;background:#FFFDF6;border:2px solid var(--ink);border-radius:4px 8px 5px 7px;color:var(--ink);font:400 17px var(--fm);padding:0 10px}
#bStart{min-height:64px;font-size:23px}

/* ===== 作っている最中 ===== */
.tb{position:absolute;top:calc(8px + env(safe-area-inset-top));height:44px;min-height:0;width:48px;padding:0;font-size:19px;display:flex;align-items:center;justify-content:center}
#bMute{right:12px}#bParts{right:70px;width:auto;padding:0 10px;font-size:15px}
#odai{position:absolute;padding:8px 12px 8px;pointer-events:none}
#odai .n{font:400 12px var(--fm);color:#8A5A2B}
#odai .t{font:400 20px/1.2 var(--fh);margin:2px 0 3px}
#odai .g{font:600 12.5px/1.45 var(--fb)}
#odai .nw{display:inline-block;font:400 12px var(--fm);background:var(--red);color:#fff;padding:1px 7px;border-radius:3px;margin-left:6px;vertical-align:2px}
#todo{position:absolute;font:400 15px/1.35 var(--fm);padding:6px 12px;background:#FFF4B8;border:2px solid var(--ink);border-radius:3px 9px 4px 8px;box-shadow:2px 3px 0 rgba(58,42,26,.35);pointer-events:none;transform:rotate(-.6deg)}
#todo b{color:var(--red);font-weight:400}
#todo.ng{background:#FFE3E0;border-color:var(--red);font:600 14px/1.5 var(--fb)}#todo.okm{background:#E8F6D8;border-color:#2F7D4A;font:600 14px/1.5 var(--fb)}
#list{position:absolute;padding:10px 12px;pointer-events:none;overflow:hidden}
#list h4{margin:0 0 6px;font:400 14px var(--fh)}
#list ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
#list li{font:400 14px var(--fm);display:flex;gap:6px;align-items:center;opacity:.55}
#list li.cur{opacity:1;color:var(--red)}#list li.done{opacity:1}
#list li i{font-style:normal;width:20px;text-align:center}
#act{position:absolute;display:flex;gap:10px}
#act .kb{flex:1;min-height:56px;font-size:19px}

/* ===== 審査票・部品箱・設計図 ===== */
.ov{pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:calc(60px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));background:rgba(58,42,26,.42)}
.ov>.cbp,.ov>.paper{width:100%;max-width:620px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px 18px}
.jrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:2px dashed rgba(58,42,26,.3);font:600 14px/1.5 var(--fb)}
.jrow .m{flex:none;width:44px;height:44px;border:3px solid var(--red);border-radius:50%;color:var(--red);font:400 22px var(--fm);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.jrow .m.tri{border-color:#8A5A2B;color:#8A5A2B}
.medal{display:flex;align-items:center;gap:14px;margin:12px 0 4px}
.medal .rb{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 26px var(--fh);border:4px solid var(--ink);box-shadow:3px 4px 0 var(--ink);flex:none}
.medal .g{background:radial-gradient(circle at 35% 30%,#FFF3B0,#E8B923 60%,#B58608)}.medal .s{background:radial-gradient(circle at 35% 30%,#FFFFFF,#C9CDD4 60%,#8E949E)}.medal .b{background:radial-gradient(circle at 35% 30%,#FFD7B0,#C8773C 60%,#8C4F22)}
.btns{display:flex;gap:12px;margin-top:14px}.btns>*{flex:1}
.box3d{width:190px;height:150px;margin:10px auto 6px;position:relative;cursor:pointer}
.box3d .b{position:absolute;left:10px;right:10px;bottom:0;height:104px;border:3px solid var(--ink);background:repeating-linear-gradient(90deg,rgba(58,42,26,.08) 0 2px,transparent 2px 8px),#D2A466;border-radius:4px}
.box3d .l{position:absolute;left:0;right:0;top:20px;height:34px;border:3px solid var(--ink);background:#E3B878;border-radius:4px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.box3d .x{position:absolute;left:50%;top:18px;width:36px;height:136px;margin-left:-18px;background:rgba(238,228,203,.9);border-left:1px dashed rgba(58,42,26,.3);border-right:1px dashed rgba(58,42,26,.3);transition:opacity .3s}
.box3d.op .l{transform:translate(96px,-6px) rotate(64deg)}.box3d.op .x{opacity:0}
.box3d .q{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:400 34px var(--fm)}
.pcard{width:min(300px,84vw);margin:6px auto 0;padding:12px 14px;border:3px solid var(--ink);border-radius:6px;background:#FBF6EA;box-shadow:4px 5px 0 var(--ink);animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.pcard.gold{background:linear-gradient(135deg,#FFF3C4,#FBF6EA 40%,#FFE9A0)}
.pcard .ic{font-size:40px;text-align:center}
.pcard h5{margin:4px 0;font:400 20px var(--fh);text-align:center}
.pcard p{margin:0;font:600 13.5px/1.65 var(--fb)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
#pGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.pc{padding:8px;border:2px solid var(--ink);border-radius:5px;background:#FBF6EA;font:600 12px/1.5 var(--fb);min-height:90px}
.pc b{display:block;font:400 15px var(--fh);margin-bottom:2px}
.pc.no{background:rgba(251,246,234,.35);border-style:dashed;color:rgba(58,42,26,.5)}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.bcell{border:2px solid #EAF1FB;border-radius:4px;padding:6px;font:600 11.5px/1.45 var(--fb);color:#EAF1FB}
.bcell b{font:400 13px var(--fm)}
.bcell svg{width:100%;height:auto;display:block;margin:4px 0}
.blue{background:repeating-linear-gradient(0deg,transparent 0 19px,rgba(234,241,251,.1) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,rgba(234,241,251,.1) 19px 20px),#1D3F73;color:#EAF1FB;border-color:#EAF1FB}
.hold{position:relative;overflow:hidden;width:100%;min-height:64px;font:400 21px var(--fm);border:3px solid var(--ink);border-radius:8px;background:#E63946;color:#fff;box-shadow:3px 4px 0 var(--ink)}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(58,42,26,.45)}
.sealmark{width:92px;height:92px;border-radius:50%;background:#B3261E;color:#fff;font:400 44px var(--fm);display:flex;align-items:center;justify-content:center;margin:6px auto;border:4px double #FBF6EA;box-shadow:0 0 0 3px #B3261E;animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
.tbl{width:100%;border-collapse:collapse;font:600 13px/1.5 var(--fb);background:#FBF6EA}
.tbl th,.tbl td{border:2px solid var(--ink);padding:5px 6px;text-align:center}
.tbl th{background:#E7C48C;font:400 13px var(--fm)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{min-height:40px;padding:0 10px;border:2px solid var(--ink);border-radius:5px;background:#FBF6EA;font:400 15px var(--fm)}
.chip.on{background:var(--red);color:#fff}

/* ===== 審査用紙（確認テスト） ===== */
#scrTest{pointer-events:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(64px + env(safe-area-inset-top)) 12px calc(22px + env(safe-area-inset-bottom));background:rgba(58,42,26,.25)}
#scrTest .paper{max-width:1180px;margin:0 auto;padding:16px 16px 18px}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sh-h .t{font:400 22px var(--fh);line-height:1}
.sh-h .t small{display:block;font:400 13px var(--fm);margin-top:4px;color:#8A5A2B}
.sh-h .sp{flex:1}
.sh-h .no{font:400 16px var(--fm);border:2px solid var(--ink);padding:4px 10px;border-radius:4px;background:#FFF4B8}
.lamps{display:flex;gap:5px;margin-bottom:12px}
.lamps i{flex:1;height:10px;border:2px solid var(--ink);border-radius:2px;background:#FBF6EA}
.lamps i.ok{background:#3E9B5B}.lamps i.ng{background:var(--red)}.lamps i.cur{background:#F2C14E}
#tQ{font:600 18px/1.75 var(--fb);margin:4px 2px 12px}
#tFig{padding:8px;margin-bottom:14px;text-align:center;background:#fff;border:2px solid var(--ink);border-radius:4px}
#tFig svg{width:100%;height:auto;max-height:250px}
#tA{display:flex;flex-direction:column;gap:12px}
.ch{display:flex!important;align-items:center;gap:12px;min-height:56px;text-align:left;font:600 16px/1.45 var(--fb)!important;padding:8px 14px!important}
.ch i{flex:none;font:400 17px var(--fm);font-style:normal;width:32px;height:32px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;background:#FBF6EA}
.ch.ok{background:#9ED9A9!important}.ch.ng{background:#F5A3A9!important}
.ch:disabled{opacity:1;cursor:default}
.numbox{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.numbox .v{flex:1;height:60px;background:#FFFDF6;font:400 30px var(--fm);display:flex;align-items:center;justify-content:flex-end;padding:0 14px;border:3px solid var(--ink);border-radius:4px}
.numbox .u{font:400 22px var(--fm);min-width:40px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys .kb{min-height:52px;padding:0;font:400 24px var(--fm)}
.keys .go{grid-column:span 4;font-size:19px}
.ord{display:flex;flex-direction:column;gap:10px}
.ord .slot{min-height:46px;border:2px dashed rgba(58,42,26,.5);border-radius:4px;display:flex;align-items:center;gap:10px;padding:6px 12px;font:600 15px var(--fb);background:rgba(255,255,255,.5)}
.ord .slot i{font-style:normal;font:400 18px var(--fm);width:22px}
#tEx{margin-top:14px;padding:12px 14px;font:600 15px/1.65 var(--fb);background:#FFF4B8;border:2px solid var(--ink);border-radius:3px}
#tEx b{font:400 19px var(--fm);margin-right:8px}
#tNext{width:100%;margin-top:14px}
#scrEnd{pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(58,42,26,.35)}
#scrEnd .cbp{width:100%;max-width:880px;padding:22px}
.big{font:400 84px/1 var(--fh);margin:10px 0 14px;color:var(--red)}
.big small{font-size:26px;color:var(--ink)}
.col{display:flex;flex-direction:column;gap:12px}
#toast{position:absolute;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translateX(-50%) rotate(-1deg);z-index:12;width:min(92vw,520px);padding:10px 16px;font:600 14.5px/1.6 var(--fb);pointer-events:none;transition:opacity .3s}
#toast b{font:400 17px var(--fm);color:var(--red);display:block}
#toast.off{opacity:0}

/* ===== もどる（いつも左上の同じ場所） ===== */
#bBack{position:absolute;left:12px;top:calc(8px + env(safe-area-inset-top));z-index:11;min-height:0;height:44px;padding:0 14px 0 12px;font-size:17px}
#scrBackQ{z-index:12}

@media (min-aspect-ratio:21/20){
  #scrTitle{justify-content:center;align-items:flex-start;padding:6vh 5vw}
  .tt-bot{align-self:flex-start;max-width:440px;margin-top:auto;margin-bottom:4vh}
  .ov>.cbp,.ov>.paper{max-width:880px;padding:24px 28px}
  #pGrid{grid-template-columns:repeat(4,1fr)}
  .bgrid{grid-template-columns:repeat(4,1fr)}
  #scrTest{padding:calc(66px + env(safe-area-inset-top)) 4vw 4vh;display:flex;flex-direction:column}
  #scrTest .paper{margin:auto;width:100%;display:grid;grid-template-columns:1.05fr 1fr;column-gap:36px;padding:26px 30px}
  #scrEnd .cbp{display:grid;grid-template-columns:1fr 1fr;gap:10px 36px;align-items:center;padding:30px 34px}
  .big{font-size:120px}
}
@media (min-width:700px) and (max-aspect-ratio:21/20){#pGrid{grid-template-columns:repeat(3,1fr)}.bgrid{grid-template-columns:repeat(3,1fr)}#act .kb{min-height:68px;font-size:23px}#todo{font-size:19px}#odai .t{font-size:26px}#odai .g{font-size:16px}}
@media (prefers-reduced-motion:reduce){.pcard,.sealmark{animation:none}.box3d .l{transition:none}}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>

<div id="scrTitle" class="scr">
  <div class="tt-bot">
    <div class="nm cbp" id="nmRow"><label for="nameIn">出品者</label><input id="nameIn" maxlength="16" placeholder="なまえ（なくてもOK）" autocomplete="off"></div>
    <button class="kb red" id="bStart">工作をはじめる</button>
    <div class="row"><button class="kb sm" id="bCont">つづきから</button><button class="kb sm" id="bEnv">✉ 封筒をひらく</button></div>
    <div class="row"><button class="kb wh sm" id="bParts1">🧰 部品図鑑</button><button class="kb wh sm" id="bBook1">📖 図鑑</button></div>
  </div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

  wk.wires.forEach(function(w){var a=f(w[0]),b=f(w[1]);if(a!==b)P[a]=b});if(closed){var a=f('S1'),b=f('S2');if(a!==b)P[a]=b}return f}

  st.slots.forEach(function(_,i){var a='D'+(i+1)+'a',b='D'+(i+1)+'b',d=wk.devs[i];r.byp.push(f(a)===f(b));
    if(!d||r.short){r.ok.push(false);r.rev.push(false);return}
    var pa=wk.flip[i]?b:a,pb=wk.flip[i]?a:b,fw=f(pa)===f('B+')&&f(pb)===f('B-'),bw=f(pa)===f('B-')&&f(pb)===f('B+');
    if(fw||(bw&&!DEV[d].polar)){r.ok.push(true);r.rev.push(false)}else{r.ok.push(false);r.rev.push(!!(bw&&DEV[d].polar))}});
  r.all=r.ok.length>0&&r.ok.every(Boolean);return r}

function testCircuit(){var st=ST[S.ti],wk=W0();
  if(wk.devs.some(function(d){return !d}))return {kind:'nodev',msg:'器具がまだ台にのっていない'};
  var cl=evalC(st,wk,true),op=evalC(st,wk,false);
  if(op.short||cl.short){var bi=wk.devs.map(function(_,i){return cl.byp[i]}).indexOf(true);return {kind:'short',msg:bi>=0?'ショート！　器具の両はしが導線でつながっていて、電流が器具を通らない近道ができている':'ショート！　器具を通らずに、＋と−が導線だけでつながっている',byp:bi}}
  if(!cl.all){var ri=cl.rev.indexOf(true);if(ri>=0)return {kind:'rev',msg:'流れない…　向きのある器具かも。'+(wk.devs[ri]==='led'?'発光ダイオードは長い足が＋':'電子ブザーは赤い導線が＋')+'（器具の ↻ で向きを変えられる）',i:ri};
    var bi2=cl.byp.indexOf(true);if(bi2>=0&&wk.devs[bi2])return {kind:'byp',msg:'器具'+(bi2+1)+'の両はしが導線でつながっていて、電流が器具を通らない（その導線をタップで外そう）',byp:bi2};
    return {kind:'open',msg:'流れない…　どこかがとぎれていて、輪になっていない'}}
  if(op.ok.some(Boolean))return {kind:'sw',msg:'スイッチを切っても止まらない。スイッチが輪の外にある'};
  if(st.order&&!orderOK(st,wk))return {kind:'order',msg:'通電はするけれど、設計図とちがう。設計図では ＋極 → 器具 → スイッチ → −極'};
  return {kind:'ok',f:cl.f}}

  backFrom=scene;$('bkSub').textContent=scene==='test'?'確認テストは、次はさいしょから。作品の進み具合は保存されています。':scene==='end'?'タイトルにもどります。':'進み具合は保存されます（出品した作品・つないだ導線・部品図鑑はそのまま）。タイトルにもどります。';
  $('bkGo').textContent='タイトルへ';show('scrBackQ',true)};
$('bkNo').onclick=function(){show('scrBackQ',false)};$('bkGo').onclick=function(){show('scrBackQ',false);OVS.forEach(function(id){show(id,false)});setScene('title')};
function refreshTitle(){var started=S.works.length>0&&!!S.works[0];$('bCont').classList.toggle('hidden',!started||S.cleared&&!S.works[S.ti]);$('bEnv').classList.toggle('hidden',!readSeal());
  $('bStart').textContent=S.cleared?'もう一度 はじめから作る':(started?'はじめから作る':'工作をはじめる');$('bBook1').classList.toggle('hidden',!Zk())}
function getName(){return(window.PLAYER_NAME||$('nameIn').value||S.name||'').trim()}
function startNew(){var keep={name:S.name,parts:S.parts,sealed:S.sealed,cleared:S.cleared};S=fresh();S.name=keep.name;S.parts=keep.parts||{};S.sealed=keep.sealed;S.cleared=keep.cleared;S.ti=0;S.works=[newWork(ST[0])];save();setScene('play');
  toast('出品まで あと8作品','器具を選んで、導線で輪をつくり、何が出るか予想して出品。予想の答えは実験の日に。')}
$('bStart').onclick=function(){ac();SFX.tape();S.name=$('nameIn').value.trim()||S.name;save();startNew()};
$('bCont').onclick=function(){ac();SFX.tape();S.name=$('nameIn').value.trim()||S.name;if(!S.works[S.ti])S.works[S.ti]=newWork(ST[S.ti]);var w=S.works[S.ti];if(w.phase==='done'){nextStationResume();return}save();setScene('play')};
function nextStationResume(){if(S.ti>=ST.length-1){setScene('play');blueprint();return}S.ti++;if(!S.works[S.ti])S.works[S.ti]=newWork(ST[S.ti]);save();setScene('play')}
$('bEnv').onclick=function(){ac();openEnv()};
function openParts(){$('pGrid').innerHTML=PARTS.map(function(p){return S.parts[p.id]?'<div class="pc"><b>'+p.ic+' '+p.n+'</b>'+p.t+'</div>':'<div class="pc no"><b>？？？</b>部品箱から出る</div>'}).join('');$('pbc').textContent=Object.keys(S.parts).length+' / '+PARTS.length;show('scrPartsBook',true)}
$('bParts').onclick=openParts;$('bParts1').onclick=openParts;$('pbClose').onclick=function(){show('scrPartsBook',false)};
function openBook(){var z=Zk();if(z&&z.openBook)z.openBook()}
$('bBook1').onclick=openBook;$('eBook').onclick=openBook;if(!Zk())['bBook1','eBook'].forEach(function(id){$(id).classList.add('hidden')});
$('bMute').onclick=function(){muted=!muted;try{localStorage.setItem(SKEY+':mute',muted?'1':'0')}catch(e){}$('bMute').textContent=muted?'🔇':'🔊'};
$('eTitle').onclick=function(){setScene('title')};
function toast(t,b){$('toT').textContent=t;$('toB').innerHTML=b||'';var el=$('toast');el.classList.remove('off');clearTimeout(toast.h);toast.h=setTimeout(function(){el.classList.add('off')},4200)}

/* ================= 確認テスト（審査用紙） ================= */
var TQ=[],TI=0,TA=[],TOK=[],CARD=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
function startTest(){setScene('test');TQ=window.Quiz?Quiz.test():[];TI=0;TA=[];TOK=[];$('scrTest').scrollTop=0;showQ()}
function lamps(){$('tLamps').innerHTML=TQ.map(function(q,i){return'<i class="'+(i<TOK.length?(TOK[i]?'ok':'ng'):i===TI?'cur':'')+'"></i>'}).join('')}
function showQ(){if(TI>=TQ.length)return finishTest();var q=TQ[TI];$('tNo').textContent='第'+(TI+1)+'問 ／ '+TQ.length;lamps();
  $('tQ').textContent=q.q;var f=$('tFig');if(q.fig){f.innerHTML=q.fig;f.classList.remove('hidden')}else{f.innerHTML='';f.classList.add('hidden')}
  $('tEx').classList.add('hidden');$('tNext').classList.add('hidden');var box=$('tA');box.innerHTML='';
  if(q.t==='choice'){q.shown.forEach(function(s,i){var b=document.createElement('button');b.className='kb wh nt ch';b.innerHTML='<i>'+'アイウエオカ'.charAt(i)+'</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){answer(s,b)};box.appendChild(b)})}
  else if(q.t==='num'){var v='';box.innerHTML='<div class="numbox"><div class="v" id="nv">&nbsp;</div><div class="u">'+esc(q.unit||'')+'</div></div><div class="keys" id="nk"></div>';
    var ks=['7','8','9','⌫','4','5','6','.','1','2','3','0'],nk=$('nk');ks.forEach(function(k){var b=document.createElement('button');b.className='kb wh nt';b.textContent=k;b.onclick=function(){if(TA.length>TI)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<7&&!(k==='.'&&v.indexOf('.')>=0))v+=k;$('nv').innerHTML=v?esc(v):'&nbsp;';SFX.tap()};nk.appendChild(b)});
    var go=document.createElement('button');go.className='kb red go nt';go.textContent='この値で決定';go.onclick=function(){if(v&&TA.length<=TI)answer(v,null)};nk.appendChild(go)}
  else{var sel=[];var wr=document.createElement('div');wr.className='ord';box.appendChild(wr);
    var draw=function(){wr.innerHTML='';sel.forEach(function(s,i){var d=document.createElement('div');d.className='slot';d.innerHTML='<i>'+(i+1)+'</i><span></span>';d.querySelector('span').textContent=s;wr.appendChild(d)});
      q.shown.forEach(function(s){if(sel.indexOf(s)>=0)return;var b=document.createElement('button');b.className='kb wh nt ch';b.innerHTML='<i>＋</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){if(TA.length>TI)return;sel.push(s);SFX.tap();if(sel.length===q.shown.length)answer(sel.slice(),null);else draw()};wr.appendChild(b)});
      if(sel.length&&TA.length<=TI){var r=document.createElement('button');r.className='kb sm nt';r.textContent='やりなおす';r.onclick=function(){sel=[];draw()};wr.appendChild(r)}};draw()}}
function answer(v,btn){if(TA.length>TI)return;var q=TQ[TI],ok=window.Quiz?Quiz.check(q,v):false;TA.push(v);TOK.push(ok);ok?SFX.ok():SFX.ng();
  [].slice.call($('tA').querySelectorAll('.ch')).forEach(function(b){b.disabled=true;var t=b.querySelector('span').textContent;if(q.t==='choice'){if(t===q.choices[0])b.classList.add('ok');else if(b===btn)b.classList.add('ng')}});
  if(q.t==='order'){var w=$('tA').querySelector('.ord');if(w)[].slice.call(w.querySelectorAll('.slot')).forEach(function(d,i){d.style.borderColor=v[i]===q.items[i]?'#2F7D4A':RED;d.style.borderStyle='solid'})}
  if(q.t==='num'){var nv=$('nv');if(nv)nv.style.borderColor=ok?'#2F7D4A':RED}
  var ex=$('tEx');ex.innerHTML=(ok?'<b style="color:#2F7D4A">◎ 合格</b>':'<b style="color:'+RED+'">△ おしい</b>正解：'+esc(window.Quiz?Quiz.answer(q):'')+'<br>')+esc(q.ex||'');ex.classList.remove('hidden');
  lamps();var nb=$('tNext');nb.textContent=TI+1>=TQ.length?'審査を終える':'つぎへ';nb.classList.remove('hidden');setTimeout(function(){nb.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'})},50)}
$('tNext').onclick=function(){TI++;$('scrTest').scrollTop=0;showQ()};
function fmtT(ms){var s=Math.round(ms/1000);return Math.floor(s/60)+'分'+(s%60<10?'0':'')+(s%60)+'秒'}
function finishTest(){var qs=TQ,answers=TA,review=window.Quiz?Quiz.review(qs,answers):[],marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length,name=getName();
  var g=S.works.filter(function(w){return w&&w.medal==='g'}).length,fc=S.works.filter(function(w){return w&&w.firstC}).length;
  var records=TEST?[['モード','確認テストだけ']]:[['金賞',g+' / 8作品'],['1回で通電',fc+' / 8'],['予想の封印',S.sealed?'済み':'まだ'],['作った時間',fmtT(S.t*1000)]];
  $('eName').textContent=(name?name+'　':'')+'審査の結果';$('eScore').innerHTML=score+'<small> / '+qs.length+' 点</small>';setScene('end');
  if(window.SubmitCard)CARD=SubmitCard.show({gameId:GAME,grade:'chu2',koma:[KOMA],unit:'中2理科　電流とその利用　第13回',
    game:'でんき工作コンテスト ～熱・光・音・運動～'+(TEST?'（確認テストのみ）':''),name:name,score:score,total:qs.length,marks:marks,records:records,review:review},function(){});refreshK()}
$('eCard').onclick=function(){if(CARD&&window.SubmitCard)SubmitCard.reopen(CARD)};

/* ================= ループ ================= */
var last=performance.now(),tacc=0;
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;c.setTransform(DPR,0,0,DPR,0,0);
  if(scene==='play'){S.t+=dt;tacc+=dt;if(tacc>5){tacc=0;save()}drawPlay();updTodo()}else if(scene==='title')drawTitle();else drawBg();
  updFx(dt);if(scene!=='play')drawFx();requestAnimationFrame(frame)}

/* ================= はじまり ================= */
resize();
window.Zukan&&Zukan.setup&&Zukan.setup({game:GAME,koma:[KOMA]});refreshK();
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nmRow').classList.add('hidden')}else if(S.name)$('nameIn').value=S.name;
if(TEST)startTest();else setScene('title');
requestAnimationFrame(frame);
/* 自動操作の確かめ用の窓口（遊びには影響しない） */
window.__DC={shelf:function(){return SHELF},ly:function(){return LY},tp:termPos,sp:slotPos,S:function(){return S},ST:ST,test:testCircuit,sw:doSwitch,judge:openJudge,box:openBox,next:nextStation,blue:blueprint,seal:doSeal,scene:function(){return scene},refresh:refreshUI,layout:layout,start:startNew};
})();
</script>
