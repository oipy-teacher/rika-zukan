<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2EDE4">
<title>でんねつ実験プログラム ～温度上昇の実験計画～</title>
<!--
  でんねつ実験プログラム ～温度上昇の実験計画～（ゲームID dennetsu-program ／ コマID chu2-denryu-16 ／ 探究・予想用）
  2026-09-27 v2 ゼロから作り直し（割り当て表 通し16）

  【遊びの核】命令ブロックでロボを動かす（Lightbot型）。矢印ブロック（↑→↓←・同じ向きを続けて押すと歩数が増える）を並べて ▶実行。
    実験ロボが盤面を歩き、通ったマスの器具（水の量・使う水・電熱線・電圧・時間・容器）を持ち替えながら、机A・机Bに装置を組む。
    机に着いた瞬間の手持ちが、その机の装置になる。＝「どのマスを通るか」が「どの条件にするか」。
  【理科の埋め込み】依頼（電力で決まる？／時間で決まる？）に対して、AとBで変わる条件が「依頼の1つだけ」のときだけロボは最後まで動く。
    2つ変える→「比べられない」で止まる。そろえ忘れやすい水の量・使う水（くみ置き/冷たい水道水）・容器（発泡/金属）は、近道の上に罠として置く（死に覚え）。
    山場＝「6Wの電熱線しかない世界」（縛り）：電熱線を替えずに、電圧を変えて電力を変える。温度が何℃上がるかは一度も出さない。
    最後に、上昇温度の予想グラフを指で4本描いて封筒に封印（rika-zukan:chu2:seal:chu2-denryu-16。形は v1 と同じ {v,koma,game,at,name,slots:{power,time,volt,prod:{q,pred,reason}},plan}＋draw）。
  【画風】バウハウスの幾何（別のデザイナー）：円・三角・四角の原色の平面構成。角丸なし・影なし・太い黒の罫。ロボも円と四角と三角でできている。
  【世界とメタファー】原色の積み木でできた実験室。盤面＝実験室の床、壁＝原色の積み木、器具＝幾何の記号。計画書は構成主義のポスター。
  【配色】紙 #F2EDE4／主（青）#1F3A93／差し（黄）#F6C600／赤 #D8342A／墨 #161616。グラデーションは使わない。
  【書体】Murecho（見出し900・本文700。幾何的なゴシック）。
  【画面の組み方】PC・iPad横＝左に実験室（上に実験台A/Bと条件表・下に盤面）、右に命令の棚。スマホ・iPad縦＝上に実験台と盤面、下に命令の帯。
  【HUD】上の帯：左端に黒い「◀ もどる」、机の番号（黄の円）、計画書の束の進み（13マスの四角）、かけら（赤い円）、音（黒い円）。
  【音】WebAudio合成の木琴＋クリック（正弦波・三角波）。ミュートあり。
  【流れ】タイトル→実験室マップ→机1〜9（新要素を1つずつ）→ラッシュ4台（タイム）→予想グラフを描いて封印→確認テスト→提出カード
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Murecho:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#F2EDE4;--blue:#1F3A93;--yel:#F6C600;--red:#D8342A;--ink:#161616;--pale:#E2DACB;--f:"Murecho","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;--shH:300px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f);color:var(--ink);font-weight:700;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;border-radius:0}
input{font-family:inherit}
.hidden{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;background:var(--paper)}

/* ---- もどる（いつも左上の同じ場所） ---- */
#bBack{position:absolute;left:0;top:0;height:56px;min-width:128px;padding:0 16px 0 12px;background:var(--ink);color:#fff;border:0;font:900 17px var(--f);letter-spacing:.06em;display:flex;align-items:center;gap:10px;z-index:40}
#bBack i{display:block;width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent;border-right:17px solid var(--yel)}
#bBack:active{background:var(--red)}

/* ---- HUD ---- */
#hud{position:absolute;left:0;right:0;top:0;height:56px;border-bottom:4px solid var(--ink);display:flex;align-items:center;gap:10px;padding:0 10px 0 140px;background:var(--paper);z-index:5}
.hn{width:44px;height:44px;border-radius:50%;background:var(--yel);display:flex;align-items:center;justify-content:center;font:900 19px var(--f);flex:none}
.hbar{display:flex;gap:3px;flex:1;min-width:0;align-items:center}
.hbar i{flex:1;max-width:26px;height:18px;border:2.5px solid var(--ink);background:transparent}
.hbar i.on{background:var(--blue)}.hbar i.on:nth-child(3n+2){background:var(--red)}.hbar i.on:nth-child(3n){background:var(--yel)}
.hbar i.cur{outline:3px solid var(--red);outline-offset:1px}
.hlab{font:900 12px var(--f);line-height:1.15;white-space:nowrap}
.hlab b{display:block;font-size:15px}
.hk{height:40px;min-width:40px;padding:0 10px 0 8px;border-radius:20px;background:var(--red);color:#fff;display:flex;align-items:center;gap:5px;font:900 16px var(--f);flex:none}
.hk::before{content:"";width:12px;height:12px;background:#fff;transform:rotate(45deg)}
.hb{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:18px;flex:none;display:flex;align-items:center;justify-content:center}
.hb.sq{border-radius:0;background:var(--blue)}
#hRush{font:900 15px var(--f);background:var(--ink);color:var(--yel);padding:6px 10px;flex:none}
body.P #bBack{min-width:96px;padding:0 10px;font-size:15px;gap:6px}
body.P #hud{padding-left:102px;gap:6px}
body.P .hn{width:34px;height:34px;font-size:15px}
body.P .hlab{font-size:10px}body.P .hlab b{font-size:12px;max-width:6.5em;overflow:hidden;text-overflow:ellipsis}
body.P .hbar{display:none}
body.P .hk{height:34px;min-width:34px;font-size:14px;padding:0 8px}
body.P .hb{width:38px;height:38px}
body.P #hRush{font-size:12px;padding:4px 6px}

/* ---- 実験室（canvas）と命令の棚 ---- */
#cvWrap{position:absolute;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#shelf{position:absolute;background:var(--paper);display:flex;flex-direction:column;gap:10px;padding:12px;overflow:hidden}
body.L #cvWrap{left:0;top:60px;bottom:0;right:max(360px,36%)}
body.L #shelf{right:0;top:60px;bottom:0;width:max(360px,36%);border-left:4px solid var(--ink)}
body.P #cvWrap{left:0;right:0;top:60px;bottom:var(--shH)}
body.P #shelf{left:0;right:0;bottom:0;height:var(--shH);border-top:4px solid var(--ink);padding:8px 10px;gap:7px}

#req{display:flex;align-items:stretch;min-height:72px;border:3px solid var(--ink);background:#fff;flex:none;position:relative}
#req .no{width:72px;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 30px/1 var(--f);flex:none}
#req .no small{font-size:11px;letter-spacing:.1em;margin-bottom:3px}
#req .tx{padding:7px 10px;flex:1;min-width:0}
#req .tx b{display:block;font:900 19px/1.3 var(--f)}
#req .tx small{display:block;font:700 13px/1.4 var(--f);margin-top:2px;color:#3b3b3b}
#req .nw{position:absolute;right:-3px;top:-14px;background:var(--red);color:#fff;font:900 12px var(--f);padding:3px 8px;letter-spacing:.05em}
body.P #req{min-height:52px}
body.P #req .no{width:52px;font-size:22px}
body.P #req .tx{padding:4px 8px}
body.P #req .tx b{font-size:15px}
body.P #req .tx small{font-size:11.5px;margin-top:0}

.plab{display:flex;justify-content:space-between;align-items:baseline;font:900 13px var(--f);letter-spacing:.08em}
.plab span{font-size:15px}
#prog{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
body.P #prog{grid-template-columns:repeat(9,1fr);gap:4px}
.slot{aspect-ratio:1;border:2.5px dashed #9b9588;display:flex;align-items:center;justify-content:center;position:relative;background:transparent;padding:0;min-height:44px}
.slot.f{border:3px solid var(--ink)}
.slot.f.U{background:var(--yel)}.slot.f.R{background:var(--red)}.slot.f.D{background:var(--blue)}.slot.f.L{background:var(--ink)}
.slot svg{width:52%;height:52%}
.slot b{position:absolute;right:3px;bottom:0;font:900 20px/1 var(--f);color:var(--ink)}
.slot.f.R b,.slot.f.D b{color:#fff}.slot.f.L b{color:var(--yel)}
.slot.run{outline:5px solid var(--ink);outline-offset:2px;transform:scale(1.06)}
body.P .slot b{font-size:15px}

#pal{display:grid;grid-template-columns:repeat(4,1fr) 1fr 1fr 1.9fr;gap:6px;flex:none}
#pal button{min-height:58px;border:3px solid var(--ink);padding:0;display:flex;align-items:center;justify-content:center;font:900 13px/1.1 var(--f)}
#pal .ar svg{width:44%;height:44%}
#pal .ar[data-d=U]{background:var(--yel)}#pal .ar[data-d=R]{background:var(--red)}#pal .ar[data-d=D]{background:var(--blue)}#pal .ar[data-d=L]{background:var(--ink)}
#pal .ar:active{transform:translate(2px,2px)}
#bUndo,#bClr{background:#fff}
#bRun{background:var(--red);color:#fff;font-size:18px!important;gap:5px;border-radius:0;white-space:nowrap}
#bRun::before{content:"";width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:15px solid #fff}
#bRun:disabled{background:#9b9588}
body.P #pal button{min-height:50px}
#log{flex:1;min-height:0;overflow:auto;border-left:6px solid var(--ink);padding:4px 10px;font:700 15px/1.55 var(--f);background:rgba(255,255,255,.5)}
#log b{font-weight:900}
#log .ng{color:var(--red);font-weight:900}
#log .ok{color:var(--blue);font-weight:900}
body.P #log{font-size:13px;line-height:1.45;padding:3px 8px}
.kbd{margin-top:auto;font:700 11px var(--f);color:#6f6a60}
body.P .kbd{display:none}

/* ---- 画面（タイトル・マップ・予想・テスト…） ---- */
.scr{position:absolute;inset:0;background:var(--paper);overflow:hidden;z-index:10}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.bx{min-height:56px;border:3px solid var(--ink);background:#fff;font:900 19px var(--f);letter-spacing:.06em;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:10px}
.bx.red{background:var(--red);color:#fff}.bx.blue{background:var(--blue);color:#fff}.bx.yel{background:var(--yel)}.bx.ink{background:var(--ink);color:#fff}
.bx:active{transform:translate(2px,2px)}
.bx:disabled{background:#cfc8ba;color:#827c70}
.bx.sm{min-height:48px;font-size:16px;padding:0 14px}

/* タイトル */
#scrTitle .poster{position:absolute;inset:0;width:100%;height:100%}
#scrTitle .tt{position:absolute;left:6vw;top:13vh;max-width:min(640px,88vw)}
.kick{display:inline-block;background:var(--ink);color:#fff;font:900 13px var(--f);letter-spacing:.12em;padding:6px 10px}
#scrTitle h1{margin:14px 0 0;font:900 clamp(40px,7.4vw,104px)/1.02 var(--f);letter-spacing:-.01em}
#scrTitle h1 span{display:block}
#scrTitle h1 span:nth-child(2){color:var(--red)}
#scrTitle h1 span:nth-child(3){color:var(--blue)}
#scrTitle .sub{margin-top:14px;display:inline-block;background:var(--yel);font:900 clamp(16px,2vw,24px) var(--f);padding:6px 14px;border:3px solid var(--ink)}
#scrTitle .menu{position:absolute;right:5vw;bottom:8vh;width:min(360px,88vw);display:flex;flex-direction:column;gap:10px}
#scrTitle .menu label{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);padding:0 0 0 10px;font:900 14px var(--f)}
#scrTitle .menu input{flex:1;min-width:0;height:48px;border:0;border-left:3px solid var(--ink);padding:0 10px;font:700 17px var(--f);background:transparent}
#scrTitle .menu .row{display:flex;gap:10px}#scrTitle .menu .row .bx{flex:1}
body.P #scrTitle .tt{left:6vw;top:10vh}
body.P #scrTitle .poster{top:40%;height:60%}
body.P #scrTitle .menu{left:6vw;right:6vw;width:auto;bottom:5vh}

/* マップ */
#scrMap{padding:76px 5vw 24px}
#scrMap h2,.h2{font:900 clamp(24px,3.4vw,40px)/1.15 var(--f);margin:0}
#scrMap .lead{font:700 15px/1.5 var(--f);margin:6px 0 14px}
#scrMap .lead b{background:var(--yel);padding:0 4px}
#mGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,42vw),1fr));gap:12px}
.mt{position:relative;aspect-ratio:1.25;border:3px solid var(--ink);background:#fff;text-align:left;padding:10px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.mt .n{font:900 34px/1 var(--f);position:relative;z-index:1}
.mt .nm{font:900 14px/1.3 var(--f);position:relative;z-index:1}
.mt .nw{font:700 11.5px/1.3 var(--f);position:relative;z-index:1}
.mt .deco{position:absolute;right:-16%;top:-30%;width:52%;aspect-ratio:1;border-radius:50%;background:var(--pale)}
.mt.done .deco{background:var(--blue)}.mt.done:nth-child(3n+2) .deco{background:var(--red);border-radius:0;transform:rotate(12deg)}.mt.done:nth-child(3n) .deco{background:var(--yel);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
.mt.next{outline:5px solid var(--red);outline-offset:-1px}
.mt.lock{background:var(--pale);color:#8c8578;cursor:default}
.mt.rush{background:var(--ink);color:#fff}.mt.rush.lock{background:#5b574f}
.mt.fin{background:var(--yel)}
.mt .chk{position:absolute;right:8px;top:8px;z-index:1;background:var(--ink);color:#fff;font:900 12px var(--f);padding:2px 6px}
.mfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* 予想グラフ */
#scrDraw{display:flex}
#gWrap{position:relative;flex:1;min-width:0;min-height:0}
#gcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#gPanel{background:var(--paper);display:flex;flex-direction:column;gap:10px;padding:14px;overflow-y:auto}
body.L #scrDraw{flex-direction:row;padding-top:60px}
body.L #gPanel{width:max(360px,34%);border-left:4px solid var(--ink)}
body.P #scrDraw{flex-direction:column;padding-top:60px}
body.P #gPanel{height:46%;border-top:4px solid var(--ink);padding:10px}
.gstep{display:flex;gap:6px}
.gstep i{flex:1;height:10px;border:2px solid var(--ink)}
.gstep i.on{background:var(--ink)}
.gq{font:900 20px/1.35 var(--f)}
.gq em{font-style:normal;padding:0 5px;color:#fff}
.gnote{font:700 14px/1.55 var(--f)}
.rs{display:flex;flex-direction:column;gap:6px}
.rs button{min-height:48px;border:3px solid var(--ink);background:#fff;text-align:left;padding:6px 10px 6px 44px;font:700 14.5px/1.35 var(--f);position:relative}
.rs button::before{content:"";position:absolute;left:12px;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--blue);border-radius:50%}
.rs button:nth-child(2)::before{background:var(--red);border-radius:0}
.rs button:nth-child(3)::before{background:var(--yel);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.rs button:nth-child(4)::before{background:var(--ink);border-radius:0;transform:rotate(45deg)}
.rs button:nth-child(5)::before{background:#b8b1a3}
.sumt{border:3px solid var(--ink);background:#fff}
.sumt div{display:flex;gap:8px;padding:7px 10px;border-top:2px solid var(--ink);font:700 14px/1.4 var(--f)}
.sumt div:first-child{border-top:0}
.sumt i{flex:none;width:14px;height:14px;margin-top:3px}
.sumt b{font-weight:900}
.hold{position:relative;overflow:hidden;min-height:64px;border:3px solid var(--ink);background:var(--red);color:#fff;font:900 19px var(--f)}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink)}
.hold span{position:relative}

/* クリア・テスト・おわり */
#scrClear{padding:76px 6vw 30px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.stat{border:3px solid var(--ink);background:#fff;padding:10px 12px;font:700 14px/1.4 var(--f)}
.stat b{display:block;font:900 30px/1.1 var(--f)}
.stat:nth-child(1){border-top:12px solid var(--blue)}.stat:nth-child(2){border-top:12px solid var(--red)}.stat:nth-child(3){border-top:12px solid var(--yel)}.stat:nth-child(4){border-top:12px solid var(--ink)}
.lesson{border-left:10px solid var(--red);background:#fff;padding:10px 14px;font:700 16px/1.6 var(--f);max-width:900px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

#scrTest{padding:70px 0 20px}
#tIn{max-width:980px;margin:0 auto;padding:0 5vw;display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
body.P #tIn{grid-template-columns:1fr}
.tq-h{display:flex;align-items:center;gap:12px;grid-column:1/-1}
.tq-n{width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font:900 26px var(--f);flex:none}
.tq-dots{display:flex;gap:4px;flex:1}
.tq-dots i{flex:1;max-width:30px;height:12px;border:2.5px solid var(--ink)}
.tq-dots i.ok{background:var(--blue)}.tq-dots i.ng{background:var(--red)}.tq-dots i.cur{background:var(--yel)}
.tq-q{font:900 19px/1.55 var(--f)}
.tq-fig{border:3px solid var(--ink);background:#fff;padding:6px;margin-top:10px}
.tq-fig svg{width:100%;height:auto;display:block}
.tq-a{display:flex;flex-direction:column;gap:8px}
.ch{min-height:54px;border:3px solid var(--ink);background:#fff;text-align:left;padding:8px 12px 8px 50px;font:700 16px/1.4 var(--f);position:relative}
.ch::before{content:"";position:absolute;left:14px;top:50%;margin-top:-10px;width:20px;height:20px;background:var(--blue);border-radius:50%}
.ch:nth-child(2)::before{background:var(--red);border-radius:0}.ch:nth-child(3)::before{background:var(--yel);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}.ch:nth-child(4)::before{background:var(--ink);border-radius:0;transform:rotate(45deg) scale(.85)}
.ch.ok{background:var(--blue);color:#fff}.ch.ng{background:var(--red);color:#fff}
.numv{display:flex;align-items:center;gap:10px}.numv div{flex:1;border:3px solid var(--ink);background:#fff;min-height:58px;font:900 28px var(--f);display:flex;align-items:center;padding:0 12px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{min-height:52px;border:3px solid var(--ink);background:#fff;font:900 20px var(--f)}
.keys .go{grid-column:1/-1;background:var(--red);color:#fff;font-size:18px}
.ordl{display:flex;flex-direction:column;gap:6px}
.ordl .sl{border:3px solid var(--ink);background:var(--yel);padding:8px 10px;font:700 15px/1.4 var(--f)}
.ex{border-left:10px solid var(--blue);background:#fff;padding:10px 12px;font:700 15px/1.55 var(--f)}
.ex.ng{border-left-color:var(--red)}

#scrEnd{display:flex;align-items:center;justify-content:center;padding:70px 6vw 20px}
.endc{border:4px solid var(--ink);background:#fff;padding:22px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
.endc .sc{font:900 64px/1 var(--f)}.endc .sc small{font-size:22px}

/* ダイアログ・帯 */
#dlg{position:absolute;inset:0;background:rgba(22,22,22,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#dlgIn{background:var(--paper);border:4px solid var(--ink);width:min(560px,100%);max-height:92%;overflow:auto;position:relative}
#dlgIn .band{height:16px;display:flex}#dlgIn .band i{flex:1}

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

function tri(c,x,y,s,f,dir){c.beginPath();if(dir==='down'){c.moveTo(x-s,y-s*.8);c.lineTo(x+s,y-s*.8);c.lineTo(x,y+s*.9)}else{c.moveTo(x,y-s*.9);c.lineTo(x+s,y+s*.8);c.lineTo(x-s,y+s*.8)}c.closePath();c.fillStyle=f;c.fill()}
function zig(c,x0,x1,y,a,col,lw){c.beginPath();var n=6,dx=(x1-x0)/n;c.moveTo(x0,y);for(var i=0;i<n;i++)c.lineTo(x0+dx*(i+.5),y+(i%2?a:-a)),c.lineTo(x0+dx*(i+1),y);c.lineWidth=lw;c.strokeStyle=col;c.lineJoin='miter';c.stroke()}

/* 器具の記号（盤面・机・グラフで共通） */
function token(c,k,v,x,y,s,label){
  if(k==='cup'){if(v==='foam'){rect(c,x-s*.4,y-s*.4,s*.8,s*.8,'#fff',C.ink,Math.max(2,s*.07));rect(c,x-s*.24,y-s*.1,s*.48,s*.3,C.pale)}else{rect(c,x-s*.4,y-s*.4,s*.8,s*.8,C.metal,C.ink,Math.max(2,s*.07));c.strokeStyle='#fff';c.lineWidth=s*.06;c.beginPath();c.moveTo(x-s*.25,y+s*.25);c.lineTo(x+s*.1,y-s*.28);c.moveTo(x-s*.05,y+s*.3);c.lineTo(x+s*.26,y-s*.14);c.stroke()}}
  else if(k==='water'){circ(c,x,y,v==='150'?s*.46:s*.33,C.blue)}
  else if(k==='start'){if(v==='room'){circ(c,x,y,s*.4,'#fff',C.blue,Math.max(2,s*.07));c.beginPath();c.arc(x,y,s*.4,0,Math.PI);c.closePath();c.fillStyle=C.blue;c.fill()}else{tri(c,x,y,s*.46,C.cold,'down');c.fillStyle='#fff';for(var i=-1;i<=1;i++){c.fillRect(x+i*s*.16-s*.04,y-s*.28,s*.08,s*.08)}}}
  else if(k==='heater'){rect(c,x-s*.42,y-s*.42,s*.84,s*.84,C.red);zig(c,x-s*.3,x+s*.3,y,s*(v==='18'?.2:v==='9'?.14:.09),'#fff',Math.max(2,s*.09))}
  else if(k==='volt'){rect(c,x-s*.42,y-s*.42,s*.84,s*.84,C.ink);txt(c,v+'V',x,y+s*.02,s*.42,C.yel,'center',900)}
  else if(k==='time'){circ(c,x,y,s*.42,C.yel,C.ink,Math.max(2,s*.06));c.beginPath();c.moveTo(x,y);c.arc(x,y,s*.34,-Math.PI/2,-Math.PI/2+Math.PI*2*(+v/6));c.closePath();c.fillStyle=C.ink;c.fill()}
  if(label){txt(c,label,x,y+s*.64,Math.max(9,s*.28),C.ink,'center',900)}
}

/* ================= 遊びの状態 ================= */

function newGame(li){

  G={L:L,li:li,prog:L.prog&&!S.done[li]?L.prog.map(function(p){return p.slice()}):[],run:null,res:null,shown:{},sci:0,runs:0,rx:L.sx,ry:L.sy,tray:{},face:1,hi:{}};

function resetRun(){if(!G)return;G.run=null;G.res=null;G.rx=G.L.sx;G.ry=G.L.sy;G.tray={};G.shown={};if(G.L.pre)G.shown.A=preA(G.L);G.hi={};stamp=null;flash=null;G.fail=null}

/* ---- 命令ブロック ---- */
var ARW={U:'<path d="M5 1L9.5 9H.5Z" fill="#161616"/>',R:'<path d="M9 5L1 9.5V.5Z" fill="#fff"/>',D:'<path d="M5 9L9.5 1H.5Z" fill="#fff"/>',L:'<path d="M1 5L9 9.5V.5Z" fill="#F6C600"/>'};
function renderProg(runB){
  if(!G)return;var L=G.L,h='';
  for(var i=0;i<L.lim;i++){var p=G.prog[i];
    if(p)h+='<button class="slot f '+p[0]+(runB===i?' run':'')+'" data-i="'+i+'" aria-label="ブロック'+(i+1)+'"><svg viewBox="0 0 10 10">'+ARW[p[0]]+'</svg><b>'+p[1]+'</b></button>';
    else h+='<div class="slot"></div>'}
  $('prog').innerHTML=h;
  $('pCnt').textContent=G.prog.length+' / '+L.lim+(L.lim<=7&&L.i>=7?'（縛り）':'');
  $('bRun').disabled=!!(G.run&&!G.res)||!G.prog.length;
}
function addBlock(d){
  if(!G||scene!=='play'||(G.run&&!G.res)||G.passing)return;ac();resetRun();
  var last=G.prog[G.prog.length-1];
  if(last&&last[0]===d&&last[1]<6)last[1]++;
  else if(G.prog.length<G.L.lim)G.prog.push([d,1]);
  else{SFX.ng();toast('命令ブロックは '+G.L.lim+' 個まで。同じ向きは続けて押すと歩数が増える');return}
  SFX.add(G.prog.length);renderProg();logIdle();
}
$('prog').addEventListener('click',function(e){var b=e.target.closest('.slot.f');if(!b||!G||(G.run&&!G.res)||G.passing)return;var i=+b.dataset.i,p=G.prog[i];if(!p)return;resetRun();
  if(p[1]>1)p[1]--;else G.prog.splice(i,1);SFX.del();renderProg();logIdle()});
[].forEach.call(document.querySelectorAll('#pal .ar'),function(b){b.addEventListener('click',function(){addBlock(b.dataset.d)})});
$('bUndo').onclick=function(){if(!G||(G.run&&!G.res)||G.passing||!G.prog.length)return;resetRun();var p=G.prog[G.prog.length-1];if(p[1]>1)p[1]--;else G.prog.pop();SFX.del();renderProg();logIdle()};
$('bClr').onclick=function(){if(!G||(G.run&&!G.res)||G.passing)return;resetRun();G.prog=[];SFX.del();renderProg();logIdle()};
$('bRun').onclick=function(){runProg()};
document.addEventListener('keydown',function(e){
  if(scene!=='play'||!$('dlg').classList.contains('hidden'))return;
  var m={ArrowUp:'U',ArrowRight:'R',ArrowDown:'D',ArrowLeft:'L'}[e.key];
  if(m){e.preventDefault();addBlock(m)}else if(e.key==='Backspace'){e.preventDefault();$('bUndo').onclick()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();runProg()}});

function logIdle(){if(!G)return;var L=G.L;$('log').innerHTML=(L.tip||'机Aと机'+Object.keys(L.req).join('・')+'に装置を組む。')+(G.sci>=2?'<br><span class="ok">ヒント：</span>'+hint(L):'')}
function hint(L){var s=[];for(var d in L.req){var rq=L.req[d];s.push('机Aと机'+d+'で、<b>'+TG[rq].map(function(k){return KS[k]}).join('か')+'</b>以外のマス（'+L.need.filter(function(k){return TG[rq].indexOf(k)<0}).map(function(k){return KS[k]}).join('・')+'）は同じものを通る')}return s.join('。')+'。'}

/* ---- 実行 ---- */
var STEP=RM?.07:.2;
function runProg(){
  if(!G||scene!=='play'||G.passing||(G.run&&!G.res)||!G.prog.length)return;ac();resetRun();
  G.runs++;var sim=simulate(G.L,G.prog);
  G.run={sim:sim,i:0,t:0,phase:'walk',px:G.L.sx,py:G.L.sy};
  renderProg(0);$('log').innerHTML='ロボが動いている…';
}
function stepRun(dt){
  var R=G.run;if(!R||G.res)return;
  if(R.phase==='walk'){R.t+=dt;
    while(R.t>=STEP&&R.phase==='walk'){R.t-=STEP;
      if(R.i<R.sim.steps.length){var st=R.sim.steps[R.i];R.px=G.rx;R.py=G.ry;G.rx=st.x;G.ry=st.y;renderProg(st.b);SFX.step(R.i);
        if(st.pick){G.tray[st.pick[0]]=st.pick[1];SFX.pick(st.pick[0]);var p=cellC(st.x,st.y);burst(p[0],p[1],pcol(st.pick[0]),10)}
        if(st.inst){G.shown[st.inst]=R.sim.cfg[st.inst];SFX.inst();flyTo(st.x,st.y,st.inst)}
        R.i++}
      else if(R.sim.bump){R.phase='bump';R.t=0;SFX.bump();shake=.3;G.fail={bump:R.sim.bump};finish({ok:false,sci:false,type:'bump',why:'<b>ゴツン！</b> 積み木（または外）にぶつかった。'+(R.sim.bump.b+1)+'番目のブロックを直そう。'})}
      else{R.phase='cmp';R.t=0;R.res=judge(G.L,R.sim.cfg);R.rows=0}}}
  else if(R.phase==='cmp'){R.t+=dt;var need=R.res.ok||R.res.sci?KINDS.length:0;
    if(R.res.type==='reach'||R.res.type==='miss'){finish(R.res);return}
    while(R.rows<need&&R.t>=(R.rows+1)*(RM?.02:.11)){var k=KINDS[R.rows];G.hi[k]=rowCol(k,R.res);SFX.row(R.rows,G.hi[k]!=='bad');R.rows++}
    if(R.rows>=need&&R.t>(need*(RM?.02:.11)+.25))finish(R.res)}
}
function rowCol(k,res){var L=G.L,cf=G.run.sim.cfg;var same=L.desks.every(function(d){return cf[d]&&cf[d][k]===cf.A[k]});
  if(res.ok)return same?'same':'chg';
  if(res.type==='trap')return k===res.k?'bad':'same';
  if(same)return 'same';
  if(res.type==='two'||res.type==='wrong')return 'bad';
  return 'chg'}
function finish(res){
  G.res=res;renderProg();
  if(res.ok){onPass(res);return}
  if(res.sci){G.sci++;if(S.streak>1)toast('連続合格 リセット');S.streak=0;SFX.ng();shake=.25}else if(res.type!=='bump')SFX.ng();
  G.fail=G.fail||{};G.fail.d=res.d;G.fail.k=res.k;
  $('log').innerHTML='<span class="ng">■ 停止</span>　'+res.why+'<br><small>ブロックをさわると、やり直せる。</small>'+(G.sci>=2&&res.sci?'<br><span class="ok">ヒント：</span>'+hint(G.L):'');
  updHUD();save();
}
function onPass(res){
  var L=G.L,li=G.li,first=G.sci===0&&!S.firstOk[li];G.passing=true;
  var wasDone=!!S.done[li];S.done[li]=1;
  if(G.sci===0){if(!S.firstOk[li]){S.firstOk[li]=1;S.first++}S.streak++;S.best=Math.max(S.best,S.streak)}
  S.plans[li]={cfg:G.run.sim.cfg,chg:res.chg};
  SFX.ok();stamp={t:0};var bp=benchCenter();burst(bp[0],bp[1],null,36);
  if(first&&!wasDone){setTimeout(function(){earn(L.rush?10:10,L.rush?'first-try':'control',bp[0],bp[1])},500)}
  if(L.rule&&!S.rules[L.rule]){S.rules[L.rule]=1;setTimeout(function(){earn(30,'rule',bp[0],bp[1]+40);banner(L.rule==='volt'?'発見：電熱線が同じでも、電圧を変えると電力が変わる':'発見：比べる相手ごとに、変えるのは1つだけ')},1300)}
  if(L.rush&&li===NLV-1){S.rushT=performance.now()-S.rushOn}
  save();updHUD();
  $('log').innerHTML='<span class="ok">■ 合格</span>　比べられる計画。'+(G.sci===0?'<b>一発で合格！</b>'+(S.streak>1?'　連続 '+S.streak:''):'');
  setTimeout(function(){G.passing=false;
    if(L.rush&&li<NLV-1){startLevel(li+1);return}
    planDialog(li)},L.rush?900:1500);
}

/* ---- 計画書（合格のダイアログ） ---- */

    [[last?'予想グラフを描く ▶':'つぎの机へ ▶','red',function(){closeDlg();if(last)toDraw();else startLevel(li+1)}],['実験室マップ','',function(){closeDlg();toMap()}]]);
}

/* ---- 描画：盤面 ---- */
function cellC(x,y){var b=LY.board,c=LY.cell;return [b.x+(x+.5)*c,b.y+(y+.5)*c]}
function pcol(k){return {cup:C.ink,water:C.blue,start:C.blue,heater:C.red,volt:C.ink,time:C.yel}[k]||C.ink}
var WALLC=[C.blue,C.red,C.yel,C.ink];
function drawBoard(){
  var L=G.L,b=LY.board,s=LY.cell;
  rect(cx,b.x,b.y,b.w,b.h,'#FBF8F2');
  cx.strokeStyle='#cfc6b5';cx.lineWidth=1.5;cx.beginPath();
  for(var i=1;i<COLS;i++){cx.moveTo(b.x+i*s,b.y);cx.lineTo(b.x+i*s,b.y+b.h)}for(i=1;i<ROWS;i++){cx.moveTo(b.x,b.y+i*s);cx.lineTo(b.x+b.w,b.y+i*s)}cx.stroke();
  for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++){var t=L.grid[y][x],p=cellC(x,y),X=b.x+x*s,Y=b.y+y*s;
    if(t==='#'){var ci=(x*3+y*5+L.i)%4,col=WALLC[ci];rect(cx,X,Y,s,s,col);
      var m=(x+y*2)%3,ic=ci===2?C.ink:ci===3?C.yel:'#F2EDE4';
      if(m===0)circ(cx,p[0],p[1],s*.26,ic);else if(m===1)tri(cx,p[0],p[1]+s*.04,s*.28,ic);else{cx.beginPath();cx.arc(X,Y+s,s*.62,-Math.PI/2,0);cx.lineTo(X,Y+s);cx.closePath();cx.fillStyle=ic;cx.fill()}}
    else if(t==='S'){circ(cx,p[0],p[1],s*.3,null,C.ink,Math.max(3,s*.08));txt(cx,'スタート',p[0],p[1]+s*.4,Math.max(9,s*.15),C.ink,'center',900)}
    else if(/^[ABC]$/.test(t)){var dc=t==='A'?C.blue:t==='B'?C.red:C.yel,got=G.shown[t];
      rect(cx,X+s*.08,Y+s*.08,s*.84,s*.84,dc);txt(cx,t,p[0],p[1]-(got?s*.08:0),s*.5,t==='C'?C.ink:'#fff','center',900);
      if(got&&!(G.rx===x&&G.ry===y)){txt(cx,'組んだ',p[0],p[1]+s*.3,Math.max(9,s*.15),t==='C'?C.ink:'#fff','center',900)}
      if(G.fail&&G.fail.d===t){cx.lineWidth=5;cx.strokeStyle=C.ink;cx.setLineDash([6,4]);cx.strokeRect(X+3,Y+3,s-6,s-6);cx.setLineDash([])}}
    else if(TOK[t]){token(cx,TOK[t][0],TOK[t][1],p[0],p[1]-s*.1,s*.56,null);txt(cx,VS[TOK[t][0]][TOK[t][1]],p[0],p[1]+s*.34,Math.max(9,s*.17),C.ink,'center',900)}
  }
  rect(cx,b.x,b.y,b.w,b.h,null,C.ink,4);
  // 道すじの下書き
  if(G.prog.length&&!(G.run&&!G.res)){var sim=simulate(L,G.prog),pts=[cellC(L.sx,L.sy)];sim.steps.forEach(function(st){pts.push(cellC(st.x,st.y))});
    cx.save();cx.globalAlpha=G.run?.25:.75;cx.setLineDash([s*.12,s*.1]);cx.lineWidth=Math.max(2,s*.05);cx.strokeStyle=C.ink;cx.beginPath();pts.forEach(function(p,i){i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])});cx.stroke();cx.setLineDash([]);
    var e=pts[pts.length-1];circ(cx,e[0],e[1],s*.08,C.ink);
    if(sim.bump&&!G.run){var bx=b.x+(sim.bump.x+.5)*s,by=b.y+(sim.bump.y+.5)*s;cx.globalAlpha=.9;cx.strokeStyle=C.red;cx.lineWidth=Math.max(3,s*.08);cx.beginPath();cx.moveTo(bx-s*.2,by-s*.2);cx.lineTo(bx+s*.2,by+s*.2);cx.moveTo(bx+s*.2,by-s*.2);cx.lineTo(bx-s*.2,by+s*.2);cx.stroke()}
    cx.restore()}
  drawRobot();
}
function drawRobot(){
  var s=LY.cell,R=G.run,x=G.rx,y=G.ry,hop=0;
  if(R&&R.phase==='walk'&&R.i>0){var k=clamp(R.t/STEP,0,1);x=lerp(R.px,G.rx,Math.min(1,k*1.8));y=lerp(R.py,G.ry,Math.min(1,k*1.8));hop=Math.sin(Math.min(1,k*1.8)*Math.PI)*s*.12}
  if(R&&R.phase==='bump'){var bb=R.sim.bump;var q=Math.sin(Math.min(1,R.t*4)*Math.PI)*.22;R.t+=0;x=G.rx+(bb.x-bb.fx)*q;y=G.ry+(bb.y-bb.fy)*q}
  var p=[LY.board.x+(x+.5)*s,LY.board.y+(y+.5)*s-hop],X=p[0],Y=p[1]+s*.05,u=s*.9,sad=G.res&&!G.res.ok;
  cx.fillStyle='rgba(22,22,22,.18)';cx.beginPath();cx.ellipse(X,LY.board.y+(y+.5)*s+s*.36,s*.26,s*.07,0,0,Math.PI*2);cx.fill();
  cx.fillStyle=C.ink;cx.fillRect(X-u*.2,Y+u*.1,u*.1,u*.24);cx.fillRect(X+u*.1,Y+u*.1,u*.1,u*.24);
  rect(cx,X-u*.26,Y-u*.14,u*.52,u*.3,C.blue,C.ink,Math.max(2,u*.04));
  rect(cx,X-u*.17,Y-u*.08,u*.12,u*.12,C.red);circ(cx,X+u*.1,Y-u*.02,u*.07,C.yel);
  circ(cx,X,Y-u*.34,u*.19,C.yel,C.ink,Math.max(2,u*.04));
  if(sad){cx.strokeStyle=C.ink;cx.lineWidth=Math.max(2,u*.04);[-1,1].forEach(function(sg){var ex=X+sg*u*.07,ey=Y-u*.36;cx.beginPath();cx.moveTo(ex-u*.04,ey-u*.04);cx.lineTo(ex+u*.04,ey+u*.04);cx.moveTo(ex+u*.04,ey-u*.04);cx.lineTo(ex-u*.04,ey+u*.04);cx.stroke()})}
  else{circ(cx,X-u*.07,Y-u*.35,u*.035,C.ink);circ(cx,X+u*.07,Y-u*.35,u*.035,C.ink)}
  tri(cx,X,Y-u*.6,u*.07,C.red);
  // 手に持っている器具
  var ks=KINDS.filter(function(k){return G.tray[k]!=null});
  if(ks.length){var ts=Math.max(12,s*.22),w=ks.length*ts*1.05,x0=X-w/2+ts/2;rect(cx,X-w/2-3,Y-u*.9-ts*.6,w+6,ts*1.2,'#fff',C.ink,2);
    ks.forEach(function(k,i){token(cx,k,G.tray[k],x0+i*ts*1.05,Y-u*.9,ts*.95,null)})}
}

/* ---- 描画：実験台（上） ---- */
function benchCenter(){var b=LY.bench;return [b.x+b.w/2,b.y+b.h/2]}
function deskRects(){var b=LY.bench,L=G.L,n=L.desks.length,side=b.w>=520;
  var cupA=side?{x:b.x,y:b.y,w:b.w*.44,h:b.h}:{x:b.x,y:b.y,w:b.w,h:b.h*.47};
  var tab=side?{x:b.x+b.w*.46,y:b.y,w:b.w*.54,h:b.h}:{x:b.x,y:b.y+b.h*.5,w:b.w,h:b.h*.5};
  var cw=cupA.w/n,rs={};L.desks.forEach(function(d,i){rs[d]={x:cupA.x+i*cw,y:cupA.y,w:cw,h:cupA.h}});return {cups:rs,tab:tab}}
function drawCup(r,d,cf,flash){
  var dc=d==='A'?C.blue:d==='B'?C.red:C.yel,s=Math.min(r.w*.9,r.h),lb=clamp(s*.2,18,34);
