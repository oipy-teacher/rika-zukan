<!--
  ゲームID: fuin-box ／ コマID: chu2-kagaku-01（化学変化と原子・分子 第1回・予想用）
  ねらい: 炭酸水素ナトリウムを加熱すると元とは違う物質ができるかどうかを、中1で学んだ調べ方を手がかりに予想する

  【6. 別の世界】（2026-09-27 v2 作り直し ─ 画風＝スクラップブック・コラージュ）
   1 世界とメタファー: 宅配便の倉庫。画面そのものが「倉庫の床に貼った作業用の紙」と「送り状（伝票）」の貼り重ね。
     棚（段ボールの山）の間で、調べる道具の荷を押して装置の出口へ運ぶ。道具はマスキングテープで留めた切り抜き。
     正しい出口に入ると赤い検品スタンプがドン、出口と装置が茶色のテープの「配管」でつながる。
   2 配色: 背景 クラフト紙 #E9DFCC ／ 主 段ボールの茶 #8C5A2B ／ 差し 検品スタンプの赤 #D7263D。
     色を持つのは理科の変化だけ（石灰水の白いにごり・塩化コバルト紙の青→桃・炎）
   3 書体: 見出し・荷札・スタンプ Kaisei Decol ／ 本文 ゴシック
   4 画面: 全画面canvasに倉庫の床（真上から）を描く。横長＝倉庫を横長に、右に送り状の束と十字キー。
     縦長（スマホ）＝倉庫の図を縦の通路に組み替え（行と列を入れかえる）、上に送り状、下端に十字キー。
     タイトルは「封」のシールを貼った段ボール箱と、切り抜き文字のコラージュ1枚絵
   5 HUD: マスキングテープの帯に 棚の番号・「封印まで」の進みぐあい（紙の目盛り）・かけら（荷札）・音（切り抜きのスピーカー）
   6 音: 段ボールのこすれ・検品スタンプのドン・呼び鈴のチン・テープをはがすビーッ・ガラスのパリン（WebAudio合成）

  【7. 動かす遊び】倉庫番（荷を押して運ぶ）
   十字キー／スワイプで配達員を動かし、調べる道具の荷（石灰水・塩化コバルト紙・線香・マッチ・水とフェノールフタレイン液…）を
   装置やびんの「出口」へ押しこむ。気体・液体・固体に合わない道具は「差し戻し」ではね返る。
   びんの気体は、押しこむ道具が「予言」＝その場で結果が出て的中/外れ（外れは返品）。
   加熱装置の面では、くさびを「底側」にかませて口を下げ、ガス栓を踏んで加熱→結果→ガラス管を抜いてから火を消す。
   順番をまちがえると割れる・逆流する（死に覚え）。
   最後の金の箱（炭酸水素ナトリウム）は、道具をつないで手順のリハーサルをしたら、中身は見ずに3か所の予言を封印する（開けるのは化学2）。
  30分: 9列の棚（びん3面→加熱装置3面→混合→繁忙期タイムアタック→金の箱）→ 確認テスト＋提出カード
  封印の形: localStorage rika-zukan:chu2:seal:chu2-kagaku-01 =
     {v:1,koma,game,at,name,slots:{liquid:{id,t,reason,method},gas:{…},solid:{…}}}（id: water/none/melt ・ co2/o2/h2/none ・ same/other/char）
-->

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#E9DFCC;color:#2b2118;

/* ===== 荷札ボタン（ひもの穴つき） ===== */
.tag{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.35em;min-height:48px;padding:6px 22px 6px 34px;cursor:pointer;
  background:#f6ecd2;border:0;color:#3a2a18;font-family:"Kaisei Decol",serif;font-weight:700;font-size:19px;letter-spacing:.04em;
  clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%);box-shadow:none;filter:drop-shadow(2px 3px 0 rgba(60,35,10,.35))}
.tag::before{content:"";position:absolute;left:14px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#E9DFCC;box-shadow:inset 0 0 0 2px #8C5A2B}
.tag::after{content:"";position:absolute;inset:4px 4px 4px 18px;border:1.5px dashed rgba(140,90,43,.45);pointer-events:none}
.tag:active{transform:translate(1px,2px)}
.tag.red{background:#D7263D;color:#fff}.tag.red::after{border-color:rgba(255,255,255,.5)}
.tag.brown{background:#8C5A2B;color:#fff}.tag.brown::after{border-color:rgba(255,255,255,.45)}
.tag.sm{font-size:15px;min-height:44px;padding:4px 16px 4px 30px}
.tag[disabled]{opacity:.45;pointer-events:none}
/* マスキングテープ */
.mt{position:absolute;height:22px;background:repeating-linear-gradient(90deg,rgba(241,220,143,.88) 0 6px,rgba(236,211,125,.88) 6px 12px);
  clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,100% 0,96% 12%,100% 25%,96% 40%,100% 55%,96% 70%,100% 85%,96% 100%,0 100%,4% 85%,0 70%,4% 55%,0 40%,4% 25%)}
.mt.b{background:repeating-linear-gradient(90deg,rgba(150,195,216,.85) 0 6px,rgba(135,182,205,.85) 6px 12px)}
.mt.r{background:repeating-linear-gradient(45deg,rgba(215,38,61,.8) 0 5px,rgba(240,120,130,.8) 5px 10px)}
/* 紙片 */
.paper{position:relative;background:#fbf8f0;box-shadow:2px 3px 0 rgba(70,45,15,.28),0 0 0 1px rgba(90,60,25,.12)}
.paper.lined{background:#fbf8f0 repeating-linear-gradient(180deg,transparent 0 25px,rgba(120,150,180,.25) 25px 26px)}
.stampT{display:inline-block;font-family:"Kaisei Decol",serif;font-weight:700;color:#D7263D;border:3px solid #D7263D;border-radius:6px;padding:0 8px;transform:rotate(-6deg);letter-spacing:.06em;opacity:.9}
/* ===== HUD（テープの帯） ===== */
#hud{position:fixed;left:0;right:0;top:0;z-index:11;height:var(--hb,54px);display:flex;align-items:center;gap:10px;padding:0 10px 0 8px;padding-top:env(safe-area-inset-top);pointer-events:none}
#hud>*{pointer-events:auto}
#bBack{flex:none;height:44px;min-width:92px;border:0;cursor:pointer;background:#fff27a;color:#D7263D;font-family:"Kaisei Decol",serif;font-weight:700;font-size:18px;padding:0 12px 0 10px;
  box-shadow:2px 3px 0 rgba(70,45,15,.35);transform:rotate(-2deg);position:relative;letter-spacing:.02em}
#bBack::after{content:"";position:absolute;left:30%;right:30%;top:-7px;height:13px;background:rgba(241,220,143,.9)}
#bBack b{font-size:15px;margin-right:2px}
#hud .ttl{flex:1;min-width:0;position:relative;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;
  background:repeating-linear-gradient(90deg,rgba(241,220,143,.92) 0 7px,rgba(236,211,125,.92) 7px 14px);
  clip-path:polygon(0 0,100% 0,98.8% 20%,100% 40%,98.8% 60%,100% 80%,98.8% 100%,0 100%,1.2% 80%,0 60%,1.2% 40%,0 20%)}
#hud .ttl .nm{font-family:"Kaisei Decol",serif;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#3a2a18}
#hud .prog{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#8C5A2B;white-space:nowrap}
#hud .prog .bar{width:120px;height:14px;background:#fbf8f0;border:1.5px solid #8C5A2B;position:relative;overflow:hidden}
#hud .prog .bar i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(-45deg,#D7263D 0 4px,#e6576a 4px 8px);width:10%;transition:width .5s}
#hud .prog .bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(140,90,43,.5) 11px 12px)}
#hud .tick{flex:none;display:flex;align-items:center;gap:4px;height:34px;padding:0 10px 0 22px;background:#f6ecd2;font-family:"Kaisei Decol",serif;font-weight:700;font-size:16px;color:#3a2a18;
  clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);position:relative;filter:drop-shadow(1px 2px 0 rgba(60,35,10,.3))}
#hud .tick::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:#E9DFCC;box-shadow:inset 0 0 0 1.5px #8C5A2B}
#hud .tick small{font-size:11px;color:#8C5A2B}
#bSnd{flex:none;width:44px;height:44px;border:0;background:#fbf8f0;cursor:pointer;box-shadow:2px 3px 0 rgba(70,45,15,.3);transform:rotate(3deg);display:flex;align-items:center;justify-content:center;padding:0}
#bSnd svg{width:28px;height:28px}
#bSnd.off .w{opacity:.12}
#bSnd.off::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:3px;background:#D7263D;transform:rotate(-35deg)}
body.port #hud .prog .lbl{display:none}
body.port #hud .prog .bar{width:44px}
body.port #hud .tick small{display:none}
body.port #hud .tick{padding:0 8px 0 18px}
body.port #bBack{min-width:0;padding:0 8px;font-size:16px}
body.port #hud{gap:6px}
body.port #hud .ttl .nm{font-size:14px}
body.port #hud .ttl{padding:0 8px}
body.port #hud .sc{display:none}
/* ===== 送り状（右の束／上の帯） ===== */
#inv{position:fixed;z-index:4;padding:12px 14px 10px;background:#fbf8f0;box-shadow:3px 4px 0 rgba(70,45,15,.3);transform:rotate(.6deg);overflow:hidden auto}
#inv::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,#D7263D 0 18px,#fbf8f0 18px 26px,#2b5fb3 26px 44px,#fbf8f0 44px 52px)}
#inv .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px;border-bottom:1.5px solid #8C5A2B;padding-bottom:4px}
#inv .hd b{font-family:"Kaisei Decol",serif;font-size:21px;color:#3a2a18}
#inv .hd span{font-size:12px;color:#8C5A2B;font-weight:700;white-space:nowrap}
#inv .it{font-size:14px;font-weight:700;margin:6px 0 2px;color:#3a2a18}
#inv .it em{font-style:normal;background:linear-gradient(transparent 60%,rgba(241,220,143,.9) 60%)}
#inv ul{list-style:none;margin:4px 0 0;padding:0;font-size:14px;line-height:1.5}
#inv li{display:flex;gap:6px;align-items:flex-start;padding:3px 0;border-bottom:1px dashed rgba(140,90,43,.35)}
#inv li .bx{flex:none;width:18px;height:18px;margin-top:2px;border:2px solid #8C5A2B;background:#fff;position:relative}
#inv li.ok .bx::after{content:"✓";position:absolute;left:1px;top:-9px;font-size:22px;color:#D7263D;font-weight:900}

#inv .legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;color:#5a4630}
#inv .legend span{white-space:nowrap}
#inv .legend i{display:inline-block;width:10px;height:10px;margin-right:3px;vertical-align:-1px}
#inv .hint{margin-top:6px;font-size:13px;line-height:1.55;color:#5a4630;background:#fff27a;padding:5px 8px;transform:rotate(-.6deg);box-shadow:1px 2px 0 rgba(70,45,15,.2)}
#inv .stars{font-size:15px;color:#D7263D;letter-spacing:2px}
body.port #inv{padding:8px 10px 6px;transform:none}
body.port #inv .hd b{font-size:16px}
body.port #inv ul{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;line-height:1.35}
body.port #inv li{border:0;padding:1px 0}
body.port #inv li .bx{width:14px;height:14px;margin-top:1px}
body.port #inv li.ok .bx::after{font-size:17px;top:-7px}
body.port #inv .legend,body.port #inv .it{display:none}

#pad{position:fixed;z-index:4;display:grid;grid-template-columns:repeat(3,var(--pk,58px));grid-template-rows:repeat(3,var(--pk,58px));gap:4px}

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

cv.addEventListener('pointerup',function(e){if(!PT||scene!=='play'){PT=null;return}var dx=e.clientX-PT.x,dy=e.clientY-PT.y;PT=null;
 if(Math.hypot(dx,dy)>22){var k=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');doDir(k);return}
 var g=fromS(e.clientX,e.clientY);walkTo(g[0],g[1])});
function walkTo(tx,ty){if(!G||tx<0||ty<0||tx>=G.W||ty>=G.H)return;
 var cr=crateAt(tx,ty);if(cr&&!cr.lock){/* 荷をタップ：となりなら押す */var dx=tx-G.p.x,dy=ty-G.p.y;if(Math.abs(dx)+Math.abs(dy)===1){moveQ=[];tryMove(dx,dy)}return}
 if(solid(tx,ty))return;var W=G.W,st=G.p.y*W+G.p.x,goal=ty*W+tx,prev={},q=[st];prev[st]=-1;
 while(q.length){var c=q.shift();if(c===goal)break;var cx=c%W,cy=(c/W)|0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=cx+d[0],ny=cy+d[1],n=ny*W+nx;if(prev[n]!==undefined||solid(nx,ny)||crateAt(nx,ny))return;if(isSw(nx,ny)&&n!==goal)return;prev[n]=c;q.push(n)})}
 if(prev[goal]===undefined)return;var path=[],c2=goal;while(c2!==st){path.unshift(c2);c2=prev[c2]}
 moveQ=path.map(function(n){return [n%W,(n/W)|0]})}
/* 判定スタンプのドラッグ */

/* ================= ループ ================= */
var last=performance.now(),hudT=0;
function frame(t){var dt=Math.max(0,Math.min(.05,(t-last)/1000));last=t;now+=dt;
 FL.a=Math.max(0,FL.a-dt*2.4);
 if(G&&scene==='play'&&!PAUSED){
  var sp=RM?40:15;G.p.rx+=(G.p.x-G.p.rx)*Math.min(1,dt*sp);G.p.ry+=(G.p.y-G.p.ry)*Math.min(1,dt*sp);
  G.cr.forEach(function(c){c.rx+=(c.x-c.rx)*Math.min(1,dt*sp);c.ry+=(c.y-c.ry)*Math.min(1,dt*sp);if(c.wob>0)c.wob=Math.max(0,c.wob-dt*3)});
  if(moveQ.length&&Math.abs(G.p.rx-G.p.x)+Math.abs(G.p.ry-G.p.y)<.3&&busy<=now){var m=moveQ.shift();var ok=tryMove(m[0]-G.p.x,m[1]-G.p.y);if(!ok)moveQ=[]}
  if(G.ph==='heat')heatTick(dt);
  if(G.ph==='back'){G.back=Math.min(1,G.back+dt*.8);if(G.back>=.9&&!G.crack){G.crack=1;SFX.crack();shake(10);if(!G.d.gold)note('<b>逆流！パリン！</b> 火を先に消したので、試験管が冷えて石灰水が吸いこまれた。<small>火を消す<b>前</b>に、ガラス管を石灰水から<b>抜く</b>。</small>','bad',5.5)}
   if(G.back>=1){G.ph='result';G.back=0;G.crack=0;G.fire=true;G.tubeIn=true;note('新しい試験管で組みなおした。こんどは<b>管を抜いてから</b>火を消そう。','',4)}}
  G.bot.forEach(function(b){if(b.fx)b.fx.t+=dt});
  if(G.d.timed&&G.ph==='build'){G.timer-=dt;if(G.timer<=0){G.ph='done';stageFail()}else if(G.timer<10&&Math.floor(G.timer*2)!==Math.floor((G.timer+dt)*2))SFX.tick()}
 }
 if(SHK>0)SHK=Math.max(0,SHK-dt*30);
 parts=parts.filter(function(p){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.vx*=.99;p.r+=p.vr*dt;return p.t<p.life});
 stamps=stamps.filter(function(s){s.t+=dt;return s.t<s.life});floats=floats.filter(function(f){f.t+=dt;return f.t<1.4});
 if(noteT>0){noteT-=dt;if(noteT<=0)$('note').className=''}
 hudT-=dt;if(hudT<=0){hudT=.5;if(scene!=='title')updHud()}
 draw();requestAnimationFrame(frame)}

/* ================= 遊び方案内（Guide・制作ルール13／仕上げ 2026-09-27） ================= */
var GD=window.Guide||null,HELP=null,PAUSED=false,PRACTICE=null;
/* 盤の向き → 画面の向き（スマホでは盤を90°まわして描くので、言葉もそれに合わせる） */
function gdir(gx,gy){var d=L.T?[gy,gx]:[gx,gy];return d[0]>0?'右':d[0]<0?'左':d[1]>0?'下':'上'}
function cellPt(x,y,r){var s=toS(x,y);return {x:s[0]+L.ts/2,y:s[1]+L.ts/2,r:L.ts*(r||.5)}}
function tutCrate(){return G?G.cr.filter(function(c){return c.k==='L'})[0]:null}
var TUTP=[[6,2],[7,2],[8,2],[8,3],[8,4],[8,5]];/* れんしゅう（1列目）で石灰水の荷が通る道 */
function tutIdx(){var c=tutCrate();if(!c)return -1;for(var i=0;i<TUTP.length;i++)if(TUTP[i][0]===c.x&&TUTP[i][1]===c.y)return i;return -1}
function tutAllow(cr,bx,by){if(cr.k!=='L')return false;var i=tutIdx();return i>=0&&i<TUTP.length-1&&TUTP[i+1][0]===bx&&TUTP[i+1][1]===by}
function tutSteps(){var cr=function(){var c=tutCrate();return c?cellPt(c.rx,c.ry,.46):null};
 return [
  {gesture:'swipe',label:'あるく',target:function(){return cellPt(G.p.rx,G.p.ry,.46)},to:function(){return cellPt(G.p.x+1,G.p.y,.46)},
   until:function(){return G.p.x!==2||G.p.y!==2},text:'**'+gdir(1,0)+'へスワイプ** すると、配達員が1マス歩く（十字キーでもOK）'},
  {gesture:'tap',label:'タップで移動',target:function(){return cellPt(5,2,.46)},until:function(){return (G.p.x===5&&G.p.y===2)||tutIdx()>0},
   text:'行きたい床を **タップ** すると、そこまで歩いていく'},
  {gesture:'swipe',label:'押す',target:cr,to:function(){var i=Math.max(0,tutIdx());return cellPt(TUTP[i+1][0],TUTP[i+1][1],.46)},until:function(){return tutIdx()>=1},
   text:'荷に向かって歩くと **押せる**。'+gdir(1,0)+'へ押そう',praise:'ずずっ！'},
  {gesture:'tap',label:'やり直し',target:'#bUndo',until:function(){return G.undos>0},text:'押しまちがえても大丈夫。**1手もどす** で戻せる'},
  {gesture:'swipe',label:'押す',target:cr,to:function(){return cellPt(8,2,.46)},until:function(){return tutIdx()>=2},
   text:'続けて **'+gdir(1,0)+'へ押そう**（指の先まで）'},
  {gesture:'tap',label:'回りこむ',target:function(){return cellPt(8,1,.46)},until:function(){return (G.p.x===8&&G.p.y===1)||tutIdx()>=3},
   text:'荷の **'+gdir(0,-1)+'がわ** へ回りこむ（床をタップ）'},
  {gesture:'swipe',label:'出口へ',target:cr,to:function(){return cellPt(8,5,.5)},until:function(){return !!G.done.o1},
   text:'**'+gdir(0,1)+'へ押して**、赤い点線の **出口** へ入れよう！',praise:'的中！'}
 ]}
if(GD){
 GD.setup({
  theme:{bg:'#fbf8f0',fg:'#2b2118',accent:'#D7263D',accentText:'#fff',font:FD,bodyFont:FG,radius:0,texture:'lines',line:'#8C5A2B',

 });
