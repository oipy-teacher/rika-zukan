<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>封印ボックス ～炭酸水素ナトリウムの予言～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--kraft:#c8955a;--kraft2:#a8743f;--kraft3:#8a5a2b;--ink:#2a241f;--paper:#f7f0e2;--red:#c7362b;--yel:#f1c232;--floor:#d6d0c4;--green:#2f7d4f;--blue:#2f5f9e;--disp:'Dela Gothic One','Zen Kaku Gothic New','Hiragino Sans',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:var(--ink);background:#cbc4b6;background-image:linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:64px 64px;min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{max-width:540px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.scr{display:none;flex-direction:column;flex:1;padding:12px 14px 28px}
.scr.on{display:flex}
.hidden{display:none!important}
/* ---- タイトル ---- */
#title{align-items:center;justify-content:center;text-align:center;gap:10px}
.stamp{font-weight:900;display:inline-block;border:3px solid var(--red);color:var(--red);padding:2px 12px;border-radius:6px;transform:rotate(-4deg);letter-spacing:.1em;font-size:14px;background:rgba(255,255,255,.4)}
.t-emoji{font-size:74px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15))}
h1.t{font-family:var(--disp);font-weight:400;font-size:clamp(34px,10vw,52px);margin:4px 0 0;letter-spacing:.04em;line-height:1.15}
.t-sub{font-weight:900;font-size:clamp(15px,4.3vw,19px);background:var(--ink);color:var(--paper);padding:6px 14px;border-radius:4px}
.tape{height:18px;width:100%;max-width:420px;background:repeating-linear-gradient(-45deg,var(--yel) 0 14px,var(--ink) 14px 28px);border-radius:2px;margin:6px 0}
.namebox{display:flex;gap:8px;align-items:center;font-weight:700;font-size:16px}
.namebox input{font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);width:180px;-webkit-user-select:text;user-select:text}
.cta{font-family:var(--disp);font-weight:400;font-size:21px;min-height:56px;padding:10px 26px;border-radius:12px;border:3px solid var(--ink);background:var(--red);color:#fff;box-shadow:0 5px 0 var(--ink);letter-spacing:.06em;width:100%;max-width:360px}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.cta.y{background:var(--yel);color:var(--ink)}
.cta.w{background:var(--paper);color:var(--ink)}
.cta[disabled]{opacity:.45;pointer-events:none}
.ghost{font-weight:700;font-size:16px;min-height:46px;padding:8px 18px;border-radius:10px;border:2px solid var(--ink);background:rgba(255,255,255,.55)}
.small{font-size:13px;color:#5b5147;line-height:1.6}
/* ---- HUD ---- */
.hud{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);display:flex;gap:5px;align-items:center;padding:8px 8px;font-weight:900;font-size:13px;overflow:hidden;border-bottom:6px solid transparent;border-image:repeating-linear-gradient(-45deg,var(--yel) 0 10px,var(--ink) 10px 20px) 6}
.hud .pill{background:rgba(255,255,255,.12);padding:3px 7px;min-width:0;border-radius:999px;white-space:nowrap}
.hud .sp{flex:1}
#hCombo.hot{background:var(--red);animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.2)}}
#muteBtn{position:fixed;top:6px;right:max(8px,calc(50% - 262px));z-index:60;width:44px;height:44px;border-radius:50%;border:2px solid var(--paper);background:var(--ink);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
/* ---- 倉庫ステージ ---- */
.round-tag{font-weight:900;font-size:15px;letter-spacing:.08em;color:var(--ink);display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.round-tag b{background:var(--yel);padding:2px 8px;border:2px solid var(--ink);border-radius:4px}
.stage{position:relative;height:238px;margin:0 -14px;overflow:hidden;background:linear-gradient(#b9b1a2 0 64%,#9d9484 64% 66%,#7d7466 66% 100%)}
.stage::before{content:"";position:absolute;left:0;right:0;top:66%;height:22px;background:repeating-linear-gradient(90deg,#5f574b 0 26px,#6d6457 26px 30px);animation:belt 1.2s linear infinite paused}
.stage.run::before{animation-play-state:running}
@keyframes belt{to{background-position:30px 0}}
.shelf{position:absolute;top:10px;height:8px;background:#7a6a55;left:0;right:0}
.shelf.s2{top:70px}
.bgbox{position:absolute;width:44px;height:34px;background:var(--kraft2);border:2px solid var(--kraft3);opacity:.5}
#boxWrap{position:absolute;left:50%;bottom:44px;width:220px;height:190px;margin-left:-110px;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#boxWrap.enter{transform:translateX(-380px)}
#boxWrap.leave{transform:translateX(420px)}
#boxWrap.shake{animation:shake .25s infinite}
#boxWrap.shake2{animation:shake2 .12s infinite}
@keyframes shake{25%{transform:translate(-3px,1px) rotate(-1deg)}75%{transform:translate(3px,-1px) rotate(1deg)}}
@keyframes shake2{25%{transform:translate(-6px,2px) rotate(-2deg)}75%{transform:translate(6px,-2px) rotate(2deg)}}
#boxSvg{width:100%;height:100%;overflow:visible}
#flame{position:absolute;left:50%;bottom:6px;width:70px;height:60px;margin-left:-35px;opacity:0;transition:opacity .2s,transform .2s;transform-origin:50% 100%}
#reveal{position:absolute;left:50%;bottom:60px;width:170px;height:150px;margin-left:-85px;pointer-events:none;opacity:0;transform:scale(.4) translateY(40px);transition:all .5s cubic-bezier(.2,1.6,.4,1)}
#reveal.on{opacity:1;transform:scale(1) translateY(0)}
.silverTag{position:absolute;top:8px;left:10px;font-weight:900;background:#e9edf2;border:2px solid #5d6570;color:#39414b;padding:3px 10px;border-radius:6px;transform:rotate(-5deg);font-size:14px;box-shadow:0 0 0 3px rgba(255,255,255,.6);animation:glint 1.4s infinite}
@keyframes glint{50%{box-shadow:0 0 16px 4px rgba(255,255,255,.95)}}
/* ---- 伝票（問題パネル） ---- */
.slip{background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:12px 12px 14px;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative}
.slip::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:7px;background:repeating-linear-gradient(90deg,var(--red) 0 18px,transparent 18px 26px);border-radius:10px 10px 0 0}
.slip h3{margin:6px 0 8px;font-size:18px;font-weight:900;line-height:1.45}
.slip .q-no{font-weight:900;font-size:13px;letter-spacing:.1em;color:var(--red)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:50px;text-align:left;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-size:16px;font-weight:700;line-height:1.45;box-shadow:0 3px 0 var(--ink);display:flex;gap:10px;align-items:center}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt .ic{flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:center}
.opt.sel{background:var(--yel)}
.opt.ok{background:#d9f0dd;border-color:var(--green)}
.opt.ng{background:#f6dcd8;border-color:var(--red)}
.opt[disabled]{pointer-events:none}
.chosen{font-size:14px;background:#efe6d3;border-left:5px solid var(--kraft2);padding:6px 10px;border-radius:6px;margin:0 0 8px;line-height:1.5}
.heatbtn{margin-top:10px;width:100%;min-height:64px;border-radius:14px;border:3px solid var(--ink);background:linear-gradient(#ff8a3d,#d7431f);color:#fff;font-family:var(--disp);font-size:20px;box-shadow:0 5px 0 var(--ink);position:relative;overflow:hidden}
.heatbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.heatbar{height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin-top:8px}
.heatbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#e2361b);transition:width .15s}
.res-line{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:15px;line-height:1.5;font-weight:700}
.res-line.ok{background:#dcefdc}
.res-line.ng{background:#f3e1dc}
.res-line .mk{font-family:var(--disp);font-size:20px;line-height:1}
.ex{font-size:15px;line-height:1.65;background:#fff;border:1px dashed #8a7d6b;border-radius:8px;padding:8px 10px;margin:6px 0 10px}
/* ---- 金の箱 ---- */
.tube-fig{background:#fffaf0;border:2px solid var(--ink);border-radius:10px;margin:8px 0;padding:4px}
.slotchips{display:flex;gap:6px;margin:6px 0 2px;flex-wrap:wrap}
.slotchips span{font-size:12px;font-weight:900;padding:3px 8px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.slotchips span.done{background:var(--yel)}
.slotchips span.now{background:var(--ink);color:#fff}
.hold{margin-top:10px;width:100%;min-height:80px;border-radius:50%/40%;border:4px solid var(--red);background:radial-gradient(circle,#fff 0 55%,#f8e2dc 56%);color:var(--red);font-family:var(--disp);font-size:22px;position:relative;overflow:hidden}
.hold i{position:absolute;left:0;bottom:0;height:100%;width:0;background:rgba(199,54,43,.25)}
.sealmark{font-family:var(--disp);color:var(--red);border:5px double var(--red);border-radius:50%;width:120px;height:120px;display:flex;align-items:center;justify-content:center;font-size:40px;transform:rotate(-12deg);margin:6px auto;background:rgba(255,255,255,.6)}
.sealmark.pop{animation:stampin .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes stampin{0%{transform:scale(2.4) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
/* ---- タイムアタック ---- */
.ta-top{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin:6px 0}
.ta-time{font-family:var(--disp);font-size:30px}
.ta-time.low{color:var(--red)}
.ta-card{background:#fff;border:3px solid var(--ink);border-radius:12px;min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;font-weight:900;line-height:1.5;padding:14px;box-shadow:0 5px 0 var(--ink);position:relative}
.ta-card.in{animation:cardin .22s}
@keyframes cardin{from{transform:translateY(-16px) scale(.96);opacity:.2}}
.ta-card.ng{animation:shake2 .12s 3;border-color:var(--red)}
.ta-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ta-tools button{min-height:66px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:900;font-size:14px;line-height:1.3;box-shadow:0 3px 0 var(--ink);display:flex;gap:6px;align-items:center;padding:6px 8px;text-align:left}
.ta-tools button:last-child{grid-column:1/-1}
.ta-tools button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.goalbar{height:14px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.goalbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--yel) 0 8px,#e0a800 8px 16px);transition:width .2s}
/* ---- 演出 ---- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.fly{position:fixed;z-index:55;pointer-events:none;font-family:var(--disp);font-size:24px;color:var(--red);text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:fly 1s ease-out forwards;white-space:nowrap}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.banner{position:fixed;left:50%;top:38%;z-index:56;transform:translate(-50%,-50%);background:var(--ink);color:var(--yel);font-family:var(--disp);font-size:clamp(20px,6vw,30px);padding:12px 22px;border:4px solid var(--yel);border-radius:12px;text-align:center;animation:bann 1.8s forwards;pointer-events:none;max-width:92vw;line-height:1.35}
.banner small{display:block;color:#fff;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:15px;margin-top:4px}
@keyframes bann{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}12%{transform:translate(-50%,-50%) scale(1.08);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;background:#fff;z-index:54;pointer-events:none;animation:fl .35s forwards}
@keyframes fl{from{opacity:.75}to{opacity:0}}
.modal{position:fixed;inset:0;z-index:40;background:rgba(30,24,18,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{background:var(--paper);border:3px solid var(--ink);border-radius:14px;max-width:460px;width:100%;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal h2{font-family:var(--disp);font-weight:400;margin:0 0 8px;font-size:22px}
/* ---- テスト ---- */
.tbox{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.tq{font-size:18px;font-weight:900;line-height:1.6;margin:8px 0 12px}
.tfig{background:#fff;border:1px solid #bbb;border-radius:8px;padding:6px;margin-bottom:10px;text-align:center}
.tfig svg{max-width:100%;height:auto}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:6px;border-radius:3px;background:#d9cfbd}
.dots i.on{background:var(--red)}
.numrow{display:flex;gap:8px;align-items:center}
.numrow input{font:inherit;font-size:22px;width:130px;padding:10px;border:2px solid var(--ink);border-radius:8px;-webkit-user-select:text;user-select:text}
.ordlist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-height:20px}
.ordlist div{background:var(--yel);border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-weight:700}
.result-big{font-family:var(--disp);font-size:56px;color:var(--red)}
.recgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.recgrid div{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:8px;font-size:13px;font-weight:700}
.recgrid b{display:block;font-size:18px}
.sealsum{background:#fff;border:2px dashed var(--red);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.7;text-align:left}
@media (min-width:700px){.stage{height:270px}#boxWrap{width:250px;height:216px;margin-left:-125px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">

<!-- ========== タイトル ========== -->
<section id="title" class="scr on">
  <div class="stamp">中2理科　化学変化と原子・分子</div>
  <div class="t-emoji">📦</div>
  <h1 class="t">封印ボックス</h1>
  <div class="t-sub">～炭酸水素ナトリウムの予言～</div>
  <div class="tape"></div>
  <div class="small" style="max-width:340px">箱を<b>割る前に</b>中身を予言しよう。<br>当たれば大当たり。最後に届く<b>金の箱</b>は、予言を封印する。</div>
  <div class="namebox" id="nameRow">なまえ <input id="nameIn" maxlength="16" placeholder="（空でもOK）" autocomplete="off"></div>
  <button class="cta" id="bStart">▶ はじめる</button>
  <button class="cta w hidden" id="bCont">つづきから</button>
  <button class="ghost hidden" id="bBook1">📖 図鑑</button>
</section>

<!-- ========== 本編 ========== -->
<section id="game" class="scr" style="padding-top:0">
  <div class="hud" style="margin:0 -14px">
    <span class="pill" id="hRound">第1便</span>
    <span class="pill" id="hCombo">COMBO 0</span>
    <span class="sp"></span>
    <span class="pill">⭐ <span id="hScore">0</span></span>
    <span class="pill">⏱ <span id="hTime">0:00</span></span>
    <span style="width:44px"></span>
  </div>
  <div class="round-tag" style="margin-top:8px"><b id="rtNo">第1便</b><span id="rtName"></span></div>
  <div class="stage" id="stage">
    <div class="shelf"></div><div class="shelf s2"></div>
    <div class="bgbox" style="left:14px;top:-26px"></div><div class="bgbox" style="left:64px;top:-26px;height:26px"></div><div class="bgbox" style="right:24px;top:34px"></div><div class="bgbox" style="right:74px;top:40px;width:36px;height:28px"></div>
    <div id="boxWrap"><svg id="boxSvg" viewBox="0 0 240 200"></svg></div>
    <svg id="flame" viewBox="0 0 70 60"><path d="M35 58 C12 50 14 30 26 18 C26 30 32 30 33 22 C36 12 42 6 44 0 C50 16 60 26 58 40 C57 52 48 58 35 58Z" fill="#ff8a1d"/><path d="M35 58 C24 54 24 42 31 34 C32 42 38 42 38 36 C42 40 46 46 45 50 C44 56 40 58 35 58Z" fill="#ffe066"/></svg>
    <div id="reveal"></div>
  </div>
  <div id="panel"></div>
</section>

<!-- ========== クリア ========== -->
<section id="clear" class="scr" style="text-align:center;align-items:center">
  <div class="stamp" style="margin-top:14px">本日の出荷　完了</div>
  <div class="sealmark" style="margin-top:14px">封</div>
  <h2 style="font-family:var(--disp);font-weight:400;font-size:26px;margin:4px 0">倉庫番、おつかれさま！</h2>
  <div class="recgrid" id="clearRec" style="width:100%;max-width:420px"></div>
  <div class="sealsum" id="clearSeal" style="width:100%;max-width:420px"></div>
  <p class="small" style="max-width:380px">金の箱は、学校で<b>炭酸水素ナトリウムを加熱する実験</b>をしたあと、<br>「白い粉の三つ子事件」で開けられるよ。</p>
  <button class="cta" id="bToTest">📝 確認テストへ</button>
  <button class="ghost hidden" id="bBook2" style="margin-top:10px">📖 図鑑</button>
</section>

<!-- ========== 確認テスト ========== -->
<section id="test" class="scr">
  <div class="round-tag" style="margin-top:6px"><b>確認テスト</b><span id="tNo"></span></div>
  <div class="dots" id="tDots" style="margin-bottom:10px"></div>
  <div class="namebox hidden" id="tName" style="margin-bottom:10px">なまえ <input id="tNameIn" maxlength="16" autocomplete="off"></div>
  <div class="tbox" id="tBox"></div>
</section>

<!-- ========== 結果 ========== -->
<section id="result" class="scr" style="text-align:center;align-items:center"></section>

</div>
<canvas id="fx"></canvas>
<button id="muteBtn" aria-label="音のオン・オフ">🔊</button>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,delay,slide){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,vol,freq){if(!S.sound)return;const a=ac();if(!a)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq||1200;g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}

const EL={H:['#EAF6FF','#1c4f86'],C:['#3a3d46','#fff'],N:['#2549C9','#fff'],O:['#E4572E','#fff'],Na:['#E9B949','#3d2a00'],Mg:['#B9C6D4','#1f2a36'],S:['#EAD23C','#4d3f00'],Cl:['#2FA36B','#fff'],Ca:['#EDE6D6','#4d3f22'],Fe:['#767C8A','#fff'],Cu:['#C8773C','#fff'],Zn:['#9FB2BE','#1d2c36'],Ag:['#C9CDD4','#2a2f38']};
const LAYOUT={H2:[['H',0,0],['H',.72,0]],O2:[['O',0,0],['O',.72,0]],H2O:[['H',0,.56],['H',1.02,.56],['O',.51,0]],CO2:[['O',0,0],['O',1.56,0],['C',.78,0]]};
function atomEl(s,size){const e=EL[s]||['#999','#fff'];return `<span class="atom" style="--c:${e[0]};--t:${e[1]};--a:${size||40}px">${s}</span>`}
function molHTML(f,size){size=size||34;const L=LAYOUT[f];if(!L)return '';const xs=L.map(a=>a[1]),ys=L.map(a=>a[2]),mx=Math.min(...xs),my=Math.min(...ys);const w=(Math.max(...xs)-mx+1)*size,h=(Math.max(...ys)-my+1)*size;return `<span class="mol2" style="width:${w}px;height:${h}px">${L.map(a=>`<span style="left:${(a[1]-mx)*size}px;top:${(a[2]-my)*size}px">${atomEl(a[0],size)}</span>`).join('')}</span>`}

 const opts=shuffle(s.o.map((t,i)=>({t,i})));const TILT=['down','up','level'];
 const optHTML=o=>s.fig==='tilt'?`<button class="opt" data-v="${o.i}" style="flex-direction:column;align-items:stretch"><span style="background:#fffaf0;border-radius:6px;display:block">${apparatusSVG({tilt:TILT[o.i],labels:false,w:300})}</span><span>${esc(o.t)}</span></button>`:`<button class="opt" data-v="${o.i}"><span>${esc(o.t)}</span></button>`;
 const p=panel(`<div class="slip"><div class="q-no">装置の点検 ${G.si+1} ／ ${SAFETY.length}</div><h3>${s.q}</h3>${s.fig==='end'?`<div class="tube-fig" id="sfig">${apparatusSVG({bubbles:true,gas:true,labels:false})}</div>`:''}<div class="opts">${opts.map(optHTML).join('')}</div><div id="sfb"></div></div>`);
 let tried=false;
 p.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
  const ok=b.dataset.v==='0',v=+b.dataset.v;
  if(ok){b.classList.add('ok');p.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(!tried){good(b,120);earn(10,'first-try',b)}else sfx.pick();
   if(s.fig==='end')$('sfig').innerHTML=apparatusSVG({inWater:false,flame:false,gas:true,labels:false});
   $('sfb').innerHTML=`<div class="ex">${s.ex}</div><button class="cta y" id="sN">つぎへ ▶</button>`;$('sN').addEventListener('click',()=>{sfx.tap();G.si++;safetyQ()})}
  else{b.classList.add('ng');b.disabled=true;if(!tried)bad();tried=true;
   let fig='';
   if(s.fig==='tilt'&&v!==0)fig=`<div class="tube-fig">${apparatusSVG({tilt:TILT[v],crack:true,labels:false})}</div><div class="ex">パリン！ 口の方にできた液体が、熱い底の方へ流れこむと、ガラスが急に冷えて割れてしまう。</div>`;
   if(s.fig==='end'&&v===1){fig=`<div class="tube-fig">${apparatusSVG({flame:false,backflow:true,crack:true,gas:true,labels:false})}</div><div class="ex">試験管が冷えて中の気体がちぢみ、水そうの水が吸いこまれて<b>逆流</b>！ 熱い試験管に水が入ると割れてしまう。</div>`;sfx.crack()}
   $('sfb').innerHTML=fig||`<div class="ex">それだと危ない。もう一度考えよう。</div>`;if(fig)$('sfb').scrollIntoView({behavior:RM?'auto':'smooth',block:'center'})}
 }));
}
function slotChips(){return `<div class="slotchips">${SLOTS.map((s,i)=>`<span class="${i<G.slot?'done':i===G.slot?'now':''}">${['①口','②気体','③底'][i]}</span>`).join('')}</div>`}
function slotStep(){
 const sl=SLOTS[G.slot];if(!sl)return sealStep();
 const keys=shuffle(Object.keys(sl.preds));
 const p=panel(`<div class="slip"><div class="q-no">予言を封印 ${G.slot+1} ／ 3</div>${slotChips()}<div class="tube-fig">${apparatusSVG({hl:G.slot})}</div><h3>${sl.place}<br>${sl.ask}</h3><div class="opts">${keys.map(k=>optBtn(k,sl.preds[k].t,sl.preds[k].ic)).join('')}</div><p class="small">当たり外れは、今日は判定しない。自分の考えでOK。</p></div>`);
 onOpts(p,v=>{G.sel[sl.key]={pred:v,t:sl.preds[v].t};reasonStep()});
}
function reasonStep(){
 const sl=SLOTS[G.slot],sel=G.sel[sl.key];
 const p=panel(`<div class="slip"><div class="q-no">根拠カードをつける</div>${slotChips()}<div class="chosen">予言：${esc(sel.t)}</div><h3>その予言の<b>根拠</b>は？（予言とつながるものを選ぶ）</h3><div class="opts">${shuffle(sl.reasons.map((r,i)=>({r,i}))).map(o=>`<button class="opt" data-v="${o.i}"><span>🗂️ ${esc(o.r.t)}</span></button>`).join('')}</div><div id="rfb"></div></div>`);
 p.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
  const r=sl.reasons[+b.dataset.v];
  if(r.s.includes(sel.pred)){sel.reason=r.t;p.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('ok');
   if(!G.tries[sl.key]){good(b,150);earn(10,'predict',b);flyText('筋が通った！',ctr(b)[0],ctr(b)[1]-30,'#2f7d4f')}else{sfx.pick()}
   G.tries[sl.key]=true;setTimeout(methodStep,650)}
  else{b.classList.add('ng');b.disabled=true;G.tries[sl.key]=true;sfx.miss();S.combo=0;hud();
   $('rfb').innerHTML=`<div class="ex">${r.s.length?'その根拠は、別の予言につながるものだよ。':'「なんとなく」は根拠にならない。'}予言「${esc(sel.t)}」につながる根拠を選び直そう。</div>`}
 }));
}
function methodStep(){
 const sl=SLOTS[G.slot],sel=G.sel[sl.key],right=sl.right(sel.pred);
 const p=panel(`<div class="slip"><div class="q-no">調べ方をつける</div>${slotChips()}<div class="chosen">予言：${esc(sel.t)}<br>根拠：${esc(sel.reason)}</div><h3>実験のあと、それを<b>どう確かめる</b>？</h3><div class="opts">${shuffle(sl.methods).map(k=>optBtn(k,TOOL[k].t,TOOL[k].ic)).join('')}</div><div id="mfb"></div></div>`);
 let tried=false;
 p.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.v===right){b.classList.add('ok');p.querySelectorAll('.opt').forEach(x=>x.disabled=true);sel.method=TOOL[right].t;
   if(!tried){good(b,120);earn(10,'first-try',b)}else sfx.pick();
   $('mfb').innerHTML=`<div class="ex">${methodEx(sl.key,sel.pred)}</div><button class="cta y" id="mN">${G.slot<2?'次の場所へ ▶':'封印へ ▶'}</button>`;
   $('mN').addEventListener('click',()=>{sfx.tap();G.slot++;slotStep()})}
  else{b.classList.add('ng');b.disabled=true;if(!tried)bad();tried=true;$('mfb').innerHTML=`<div class="ex">${wrongMethod(b.dataset.v)}</div>`}
 }));
}
function methodEx(k,p){
 if(k==='liquid')return '青色の塩化コバルト紙は、<b>水にふれると赤（桃）色</b>になる。試験管が冷えてから調べる。';
 if(k==='gas')return ({co2:'二酸化炭素なら、石灰水が白くにごる。',o2:'酸素なら、線香が炎を上げて激しく燃える。',h2:'水素なら、ポンと音を立てて燃える。',none:'気体が出るなら、ガラス管の先から泡が出るはず。'})[p];
 return '元の炭酸水素ナトリウムと<b>並べて比べる</b>のがポイント。見た目が似ていても、性質がちがえば別の物質。';
}
function wrongMethod(v){return({lime:'石灰水は二酸化炭素を調べる道具。',senko:'火のついた線香は酸素を調べる道具。',match:'マッチの火は水素を調べる道具。',magnet:'磁石では、この物質は見分けられない。',eye:'見た目の色だけでは、同じ物質かどうか決められない（白い粉はたくさんある）。',smell:'においは危険なこともあり、決め手にならない。',cobalt:'塩化コバルト紙は水を調べる道具。',bubble:'泡が出るかどうかでは、気体の種類までは分からない。',compare:'それは固体を調べる方法。'})[v]||'もう一度考えよう。'}
function sealStep(){
 const p=panel(`<div class="slip"><div class="q-no">封印</div>${slotChips()}
  <div class="sealsum">${SLOTS.map(s=>{const x=G.sel[s.key];return `<b>${s.place}</b><br>予言：${esc(x.t)}<br><small>根拠：${esc(x.reason)}／調べ方：${esc(x.method)}</small>`}).join('<hr style="border:0;border-top:1px dashed #c9b">')}</div>
  <button class="hold" id="holdB"><i id="holdI"></i><span style="position:relative">長押しで 封印シールをはる</span></button></div>`);
 const b=$('holdB');let t0=0,iv=0;
 const stop=()=>{clearInterval(iv);iv=0;if(!b.disabled)$('holdI').style.width='0'};
 b.addEventListener('pointerdown',e=>{e.preventDefault();t0=Date.now();clearInterval(iv);iv=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/900);$('holdI').style.width=(k*100)+'%';if(Math.random()<.4)sfx.tick();if(k>=1){clearInterval(iv);b.disabled=true;doSeal()}},40)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
}
function doSeal(){
 const rec={v:1,koma:KOMA,game:GAME_ID,at:Date.now(),name:S.name||'',slots:{}};
 SLOTS.forEach(s=>{const x=G.sel[s.key];rec.slots[s.key]={id:x.pred,t:x.t,reason:x.reason,method:x.method}});
 try{localStorage.setItem(SEAL_KEY,JSON.stringify(rec))}catch(e){}
 S.sealed=true;S.seal=rec;S.score+=300;hud();
 sfx.seal();flash();confetti(120);
 panel(`<div class="slip" style="text-align:center"><div class="q-no">封印完了</div><div class="sealmark pop">封</div><h3>予言は金の箱の中に封印された。</h3><p style="font-size:15px;line-height:1.7">開けるのは、学校で加熱実験をしたあと。<br>そのとき、自分の予言と実験の結果を照らし合わせよう。</p><button class="cta y" id="toTA">最終便へ ▶</button></div>`);
 banner('封印完了！','開けるのは実験のあと');
 $('toTA').addEventListener('click',()=>{sfx.tap();S.r=5;S.b=0;save();startRound()});
}

/* ---------- タイムアタック ---------- */
let TA=null;
function taIntro(){
 setBox('plain','調べ方の箱','最終便',false);$('reveal').className='';
 const p=panel(`<div class="slip"><div class="q-no">最終便　タイムアタック</div><h3>カードに合う<b>調べる道具</b>をタップ！</h3><p style="font-size:15px;line-height:1.7">${TA_SEC}秒で <b>${TA_GOAL}問</b> 正解すれば出荷完了。<br>続けて正解するとコンボ倍率アップ。まちがえると倍率リセット。</p>${S.taBest?`<p class="small">これまでの最高：${S.taBest}問</p>`:''}<button class="cta" id="taGo">スタート ▶</button></div>`);
 $('taGo').addEventListener('click',()=>{sfx.tap();taStart()});
}
function taStart(){
 $('stage').classList.add('hidden');
 TA={left:TA_SEC,ok:0,deck:[],cur:null,lock:false};
 const p=panel(`<div class="ta-top"><span class="ta-time" id="taT">${TA_SEC}</span><span>正解 <b id="taOk">0</b> / ${TA_GOAL}</span></div><div class="goalbar"><i id="taG"></i></div><div style="height:10px"></div><div class="ta-card" id="taC"></div><div class="ta-tools">${shuffle(TA_TOOLS).map(k=>`<button data-v="${k}"><span style="width:30px;height:30px;flex:0 0 30px">${ICON[k]}</span>${TA_SHORT[k]}</button>`).join('')}</div>`);
 p.querySelectorAll('.ta-tools button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();taAns(b.dataset.v,b)}));
 taNext();
 TA.iv=setInterval(()=>{TA.left--;const t=$('taT');if(!t){clearInterval(TA.iv);return}t.textContent=TA.left;t.classList.toggle('low',TA.left<=10);if(TA.left<=10)sfx.tick();if(TA.left<=0){clearInterval(TA.iv);taEnd()}},1000);
}
function taNext(){if(!TA.deck.length)TA.deck=shuffle(TA_CARDS);let c=TA.deck.pop();if(TA.cur&&c[1]===TA.cur[1]&&TA.deck.length)c=TA.deck.pop();TA.cur=c;const e=$('taC');e.innerHTML=c[1];e.className='ta-card';void e.offsetWidth;e.classList.add('in')}
function taAns(v,b){
 if(TA.lock||TA.left<=0)return;
 if(v===TA.cur[0]){TA.ok++;good(b,80);if(S.combo%4===0)earn(10,'first-try',b);$('taOk').textContent=TA.ok;$('taG').style.width=Math.min(100,TA.ok/TA_GOAL*100)+'%';if(TA.ok===TA_GOAL){banner('ノルマ達成！','残り時間も記録に');sfx.rare()}taNext()}
 else{bad();TA.lock=true;const e=$('taC');e.classList.add('ng');e.innerHTML=TA.cur[1]+`<div style="position:absolute;bottom:6px;left:0;right:0;font-size:13px;color:var(--red)">正しくは「${TA_SHORT[TA.cur[0]]}」</div>`;setTimeout(()=>{TA.lock=false;taNext()},900)}
}
function taEnd(){
 $('stage').classList.remove('hidden');
 S.taBest=Math.max(S.taBest,TA.ok);save();
 if(TA.ok>=TA_GOAL){mainClear();return}
 panel(`<div class="slip" style="text-align:center"><div class="q-no">タイムアップ</div><h3>正解 ${TA.ok}問 ／ ノルマ ${TA_GOAL}問</h3><p style="font-size:15px">あと <b>${TA_GOAL-TA.ok}問</b>！ 道具と気体・液体・固体の組み合わせを思い出そう。</p><div class="ex">石灰水→二酸化炭素／線香→酸素／マッチ→水素／塩化コバルト紙→水／フェノールフタレイン液→アルカリ性</div><button class="cta" id="taR">もう一度 ▶</button></div>`);
 $('taR').addEventListener('click',()=>{sfx.tap();taStart()});
}

/* ---------- 本編クリア ---------- */
function mainClear(){
 stopClock();S.cleared=true;save();sfx.fanfare();confetti(160);flash();banner('出荷完了！','本編クリア');
 const go=()=>{renderClear();show('clear')};
 setTimeout(()=>{const Zk=Z();if(Zk&&Zk.mainClear){try{Zk.mainClear({koma:KOMA,onClose:go})}catch(e){go()}}else go()},1200);
}
function sealText(sl){return sl?`気体：${sl.gas.t}／液体：${sl.liquid.t}／固体：${sl.solid.t}`:'なし'}
function renderClear(){
 $('clearRec').innerHTML=`<div>クリアタイム<b>${fmtT(S.elapsed)}</b></div><div>スコア<b>${S.score.toLocaleString()}</b></div><div>最大コンボ<b>${S.maxCombo}</b></div><div>調べ方タイムアタック<b>${S.taBest}問</b></div>`;
 const sl=S.seal&&S.seal.slots;
 $('clearSeal').innerHTML=sl?`<b style="color:var(--red)">封印した予言</b><br>${SLOTS.map(s=>`${s.place.replace(/（.*/,'')}：${esc(sl[s.key].t)}`).join('<br>')}`:'';
 if(Z())$('bBook2').classList.remove('hidden');
}
$('bToTest').addEventListener('click',()=>{sfx.tap();startTest()});
$('bBook2').addEventListener('click',()=>{const Zk=Z();if(Zk)Zk.openBook({unit:'kagaku'})});
$('bBook1').addEventListener('click',()=>{const Zk=Z();if(Zk)Zk.openBook({unit:'kagaku'})});

/* ================= 確認テスト ================= */
let T=null;
function startTest(){
 stopClock();
 const qs=window.Quiz?Quiz.test():[];
 T={qs,i:0,ans:[]};show('test');
 if(TEST_ONLY&&!S.name){$('tName').classList.remove('hidden')}
 renderTest();
}
function renderTest(){
 const q=T.qs[T.i];if(!q)return finishTest();
 $('tNo').textContent='第'+(T.i+1)+'問 ／ '+T.qs.length+'問';
 $('tDots').innerHTML=T.qs.map((_,i)=>`<i class="${i<=T.i?'on':''}"></i>`).join('');
 let h=`<div class="tq">${q.q}</div>`+(q.fig?`<div class="tfig">${q.fig}</div>`:'');
 if(q.t==='choice')h+=`<div class="opts">${q.shown.map((c,i)=>`<button class="opt" data-i="${i}"><span>${c}</span></button>`).join('')}</div>`;
 else if(q.t==='num')h+=`<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off"><b>${esc(q.unit||'')}</b><button class="cta" style="width:auto;min-height:50px;font-size:18px" id="numOk">決定</button></div>`;
 else if(q.t==='order')h+=`<p class="small">正しい順にタップしよう</p><div class="ordlist" id="ordL"></div><div class="opts" id="ordO">${q.shown.map((c,i)=>`<button class="opt" data-i="${i}"><span>${c}</span></button>`).join('')}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="ghost" id="ordR">やり直す</button><button class="cta" style="flex:1" id="ordOk" disabled>決定</button></div>`;
 $('tBox').innerHTML=h;
 if(q.t==='choice')$('tBox').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{sfx.pick();$('tBox').querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('sel');setTimeout(()=>answer(q.shown[+b.dataset.i]),200)}));
 if(q.t==='num'){const go=()=>{const v=$('numIn').value.trim();if(!v)return;sfx.pick();answer(v)};$('numOk').addEventListener('click',go);$('numIn').addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
 if(q.t==='order'){let seq=[];const draw=()=>{$('ordL').innerHTML=seq.map((x,i)=>`<div>${i+1}. ${q.shown[x]}</div>`).join('');$('ordO').querySelectorAll('.opt').forEach(b=>b.classList.toggle('hidden',seq.includes(+b.dataset.i)));$('ordOk').disabled=seq.length!==q.shown.length};
  $('ordO').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{sfx.pick();seq.push(+b.dataset.i);draw()}));
  $('ordR').addEventListener('click',()=>{seq=[];draw()});$('ordOk').addEventListener('click',()=>{sfx.pick();answer(seq.map(i=>q.shown[i]))});}
}
function answer(v){T.ans[T.i]=v;T.i++;if(T.i<T.qs.length)renderTest();else finishTest()}
function finishTest(){
 const qs=T.qs,answers=T.ans;
 if(TEST_ONLY&&$('tNameIn').value.trim())S.name=$('tNameIn').value.trim();
 const review=window.Quiz?Quiz.review(qs,answers):[],marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 if(qs.length&&score>=Math.ceil(qs.length*.7))earn(30,'pass');
 const sl=S.seal&&S.seal.slots;
 const records=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(S.elapsed)],['最大コンボ',S.maxCombo+''],['タイムアタック',S.taBest+'問'],['封印した予言',sl?`気体=${sl.gas.t}・液体=${sl.liquid.t}・固体=${sl.solid.t.replace('見た目は似ているが、','')}`:'なし']];
 sfx.fanfare();confetti(100);
 const rec={gameId:GAME_ID,grade:'chu2',koma:[KOMA],unit:'中2理科　化学変化と原子・分子　第1回',game:'封印ボックス ～炭酸水素ナトリウムの予言～'+(TEST_ONLY?'（確認テストのみ）':''),name:S.name||window.PLAYER_NAME||'',score,total:qs.length,marks,records,review};
 renderResult(score,qs.length);
 setTimeout(()=>{if(window.SubmitCard){S.card=SubmitCard.show(rec,()=>{})}},600);
}
function renderResult(score,total){
 show('result');
 $('result').innerHTML=`<div class="stamp" style="margin-top:14px">確認テスト　結果</div><div class="result-big">${score}<span style="font-size:.45em"> / ${total}</span></div>
 <p style="font-weight:900">${score===total?'満点！ 調べ方は完ぺき。':score>=total*.7?'合格！ 予言の根拠づくりもばっちり。':'もう一度、道具と調べるものの組み合わせを確かめよう。'}</p>
 <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;align-items:center">
 <button class="cta" id="rCard">📝 提出カードを表示</button>
 <button class="ghost" id="rRetry">もう一度テストを解く</button>
 ${Z()?'<button class="ghost" id="rBook">📖 図鑑</button>':''}
 ${TEST_ONLY?'':'<button class="ghost" id="rTitle">タイトルへ</button>'}</div>`;
 $('rCard').addEventListener('click',()=>{if(S.card&&window.SubmitCard)SubmitCard.reopen(S.card)});
 $('rRetry').addEventListener('click',()=>{sfx.tap();startTest()});
 if($('rBook'))$('rBook').addEventListener('click',()=>Z().openBook({unit:'kagaku'}));
 if($('rTitle'))$('rTitle').addEventListener('click',()=>location.reload());
}

/* ================= 起動 ================= */
function begin(cont){
 ac();
 if(!cont){const keep=S.sound;S=fresh();S.sound=keep;S.name=(window.PLAYER_NAME||$('nameIn').value||'').trim()}
 show('game');hud();startClock();save();
 if(!cont){banner('箱を割る前に 予言せよ！','当たれば大当たり')}
 if(S.cleared&&cont){renderClear();show('clear');stopClock();return}
 setTimeout(startRound,cont?100:900);
}
$('bStart').addEventListener('click',()=>{sfx.tap();begin(false)});
$('bCont').addEventListener('click',()=>{sfx.tap();const o=loadSave();if(o){const snd=S.sound;S=o;S.sound=snd;if(window.PLAYER_NAME)S.name=window.PLAYER_NAME}begin(true)});
(function init(){
 const Zk=Z();if(Zk&&Zk.setup){try{Zk.setup({game:GAME_ID,koma:[KOMA]})}catch(e){}}
 if(Zk)$('bBook1').classList.remove('hidden');
 const o=loadSave();if(o&&(o.r>0||o.b>0||o.cleared)){$('bCont').classList.remove('hidden');$('bCont').textContent='つづきから（第'+(Math.min(o.r,5)+1)+'便）';if(o.sound===false){S.sound=false;setMute()}}
 if(window.PLAYER_NAME){$('nameRow').classList.add('hidden');S.name=window.PLAYER_NAME}
 if(TEST_ONLY){if(o&&o.name)S.name=o.name;if(window.PLAYER_NAME)S.name=window.PLAYER_NAME;if(o&&o.seal)S.seal=o.seal;startTest()}
})();
</script>
