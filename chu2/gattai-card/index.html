<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#161A2B">
<title>ガッタイ・レジスター ～合成抵抗～</title>
<!--
  ガッタイ・レジスター ～合成抵抗～　（ゲームID gattai-card ／ コマID chu2-denryu-12）v2 2026-09-27 作り直し

  【遊びの核】テトリス型の落ち物。上から落ちてくる「抵抗カード」を、列の底にいる「元の抵抗カード」に
    縦に重ねる（＝直列）か、横に並べる（＝並列）かを決めて落とす。列ごとの注文（全体の抵抗を大きく／
    全体の電流を大きく／電流計の針／V-Iグラフの傾き…）に合えば、2枚が1枚の「合体カード」になって
    ホロの光とともに消える。合わなければ焦げたカードが底に積もり、列があふれると負け。
    判断は大小だけ：直列＝どちらの抵抗よりも大きい／並列＝どちらの抵抗よりも小さい（並列の式は使わない）。
    合体したとき、電流計が「全体の電圧6.0V ÷ 全体の電流 ＝ 1枚にまとめると何Ω」を読み上げる（解説の
    「回路全体の電流と電圧から考えさせる」）。
  【画風】ホロ箔トレーディングカード（別のデザイナー）。銀の箔押しの枠・虹色のホロが角度で流れる・
    エンボスの浮き文字・キラの粒。UIのボタンもすべて箔押しのカード片。確認テストは「鑑定書（グレーディング・スラブ）」。
  【世界とメタファー】深夜のカードショップの対戦台。落ちてくるのは抵抗器のカード。1面＝ブースターパック1つ。
    合体カードはバインダーに集まる（30種・コンボ5以上で虹のシークレット仕様）。
  【配色】背景 #161A2B（夜の紺）／主 #C9D1E0（銀箔）／差し #FF7AA2（ホロのピンク）。金 #FFE08A・ミント #9CF2D0 は箔の虹の中だけ。
    紫と水色の2色グラデは使わない（虹は桃→金→若草→空→桃の全色でまわす）。
  【書体】Mochiy Pop One（見出し・カード名）／Bungee（数字・英字ラベル）／本文はシステムの角ゴシック
  【画面の組み方】PC・iPad横＝中央に縦の井戸（3列）、左に電流計とΩのものさし、右にNEXT・HOLD・COMBO。
    スマホ・iPad縦＝井戸を画面いっぱいにして、電流計とNEXTは上端の帯、操作ボタンは親指の下。
  【HUD】カードの枠・箔のラベルで描く（かけらは Zukan.state() で読んで自分で描く）。
  【音】WebAudioのキラキラ系シンセ（サイン波のアルペジオ＋高いヒス音）。パックを開ける紙の音。ミュートあり。
  【操作】ドラッグ＝列をえらぶ／タップ＝直列⇄並列／下へはらう＝ストンと落とす（ボタンとキーボードでも同じ）。
  【道のり×集める×美麗】パック10個（落ちる速さが上がる・新しい注文が1つずつ解禁）×合体カードのバインダー×ホロ箔。
  【ハマる仕組み】主⑤コンボ（まちがえると倍率リセット）／副④マージ（2枚→1枚）・⑦ニアミス（あふれまであと何段＝本当の段数）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#161A2B;--sv:#C9D1E0;--pk:#FF7AA2;--fh:"Mochiy Pop One","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;--fb:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;--fn:Bungee,"Mochiy Pop One",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{color:#EEF1F7;font-family:var(--fb);user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button{font-family:var(--fh);cursor:pointer;color:inherit;touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;pointer-events:none}
.scr button,.scr input,.scr .pe{pointer-events:auto}
.hidden{display:none!important}

/* ===== 箔押しのボタン ===== */
.fb{position:relative;overflow:hidden;min-height:50px;padding:0 18px;border:2px solid #0B0E1A;border-radius:12px;
  background:linear-gradient(135deg,#8C95AA 0%,#F4F6FB 28%,#AEB7CA 50%,#F7F9FC 72%,#8A93A8 100%);color:#141830;font:400 17px var(--fh);letter-spacing:.04em;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(0,0,0,.22),0 4px 0 #07090F,0 10px 22px rgba(0,0,0,.45)}
.fb::after{content:"";position:absolute;top:-60%;bottom:-60%;left:-60%;right:-60%;background:linear-gradient(115deg,transparent 34%,rgba(255,122,162,.6) 41%,rgba(255,224,138,.6) 46%,rgba(156,242,208,.55) 51%,rgba(156,203,255,.55) 56%,rgba(255,122,162,.5) 61%,transparent 68%);mix-blend-mode:overlay;animation:sheen 3.8s linear infinite;pointer-events:none}
@keyframes sheen{0%{transform:translateX(-35%)}100%{transform:translateX(35%)}}
.fb:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(0,0,0,.22),0 1px 0 #07090F}
.fb.pk{background:linear-gradient(135deg,#D94A74 0%,#FFC7D7 28%,#FF7AA2 52%,#FFE0E9 74%,#D2426C 100%);color:#2A0B17}
.fb.dk{background:linear-gradient(160deg,#2A3050,#3C4470 45%,#262C4A);color:#EEF1F7;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.3),0 4px 0 #07090F}
.fb.sm{min-height:44px;font-size:14px;padding:0 12px}
.fb:disabled{filter:grayscale(1) brightness(.55);cursor:default}
.fb .en{font:400 .72em var(--fn);letter-spacing:.08em;opacity:.8;margin-right:.35em}

/* ===== 箔の枠のパネル（スラブ） ===== */
.slab{padding:4px;border-radius:20px;background:linear-gradient(135deg,#8C95AA,#F4F6FB 24%,#FF9BBB 40%,#FFE9A8 52%,#B9F5DD 62%,#AEB7CA 76%,#8A93A8);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.slab>.in{background:radial-gradient(120% 90% at 20% 0%,#262C4B 0%,#161A2B 60%,#10131F 100%);border-radius:16px;padding:18px 18px 18px}
.lbl{display:inline-block;font:400 12px var(--fn);letter-spacing:.2em;color:#141830;background:linear-gradient(90deg,#C9D1E0,#FFFFFF 40%,#C9D1E0);padding:4px 10px;border-radius:6px}
.lbl.pk{background:linear-gradient(90deg,#FF7AA2,#FFD3E0 45%,#FF7AA2);color:#2A0B17}

/* ===== タイトル ===== */
#scrTitle{display:flex;flex-direction:column;justify-content:flex-end;padding:calc(20px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom))}
.ttl .set{font:400 12px var(--fn);letter-spacing:.22em;color:#C9D1E0}
.ttl .set b{font:400 12px var(--fh);letter-spacing:.04em;color:#FF7AA2}
h1.tt{margin:8px 0 0;font:400 clamp(40px,12.4vw,112px)/1.02 var(--fh);letter-spacing:.01em}
h1.tt span{display:block;white-space:nowrap;background:linear-gradient(100deg,#EEF1F7 0%,#FFFFFF 12%,#FFC2D4 24%,#FFE9A8 34%,#C8F7E4 44%,#CFE3FF 54%,#FFFFFF 64%,#C9D1E0 78%,#FFC2D4 90%,#EEF1F7 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #7E879C) drop-shadow(0 4px 0 #0B0E1A) drop-shadow(0 10px 16px rgba(0,0,0,.6));animation:ttsh 6s linear infinite}
h1.tt span.b{font-size:1.02em;background-image:linear-gradient(100deg,#FF7AA2 0%,#FFD3E0 14%,#FFE9A8 28%,#FF7AA2 44%,#FFC2D4 60%,#FFFFFF 70%,#FF7AA2 86%,#FFD3E0 100%)}
@keyframes ttsh{to{background-position:260% 0}}
.ttl .sub{display:inline-block;margin-top:12px;font:400 18px var(--fh);color:#141830;background:linear-gradient(90deg,#C9D1E0,#FFFFFF 40%,#C9D1E0);padding:6px 14px;border-radius:8px;box-shadow:0 4px 0 #07090F}
.tt-bot{display:flex;flex-direction:column;gap:14px;width:100%;max-width:520px;margin-top:22px}
.tt-bot .row{display:flex;gap:12px}.tt-bot .row>*{flex:1}
.nm{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;background:rgba(201,209,224,.1);border:1.5px solid rgba(201,209,224,.35)}
.nm label{font:400 13px var(--fh);white-space:nowrap;color:#C9D1E0}
.nm input{flex:1;min-width:0;height:38px;background:#0E1120;border:1.5px solid #C9D1E0;border-radius:8px;color:#EEF1F7;font:600 16px var(--fb);padding:0 10px}
#bStart{min-height:62px;font-size:21px}
#bEnv{display:none}

/* ===== パックの箱（面えらび） ===== */
#scrMap{display:flex;flex-direction:column;padding:calc(64px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
.mh{display:flex;gap:10px;align-items:stretch;margin-bottom:10px}
.mh .plate{flex:1;padding:8px 12px;border-radius:12px;background:rgba(14,17,32,.8);border:1.5px solid rgba(201,209,224,.45)}
.mh .plate b{display:block;font:400 18px var(--fn);letter-spacing:.14em;color:#FFE08A}
.mh .plate small{display:block;font:400 12px var(--fh);color:#C9D1E0;margin-top:2px}
#mStat{flex:none;text-align:right;font:400 14px var(--fh);line-height:1.5;color:#EEF1F7}
#packs{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:10px;margin-bottom:12px}
.pack{position:relative;overflow:hidden;border:2px solid #0B0E1A;border-radius:14px 14px 10px 10px;padding:8px 10px 8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,#2B3257 0%,#4A3A63 30%,#1E2442 60%,#2F3860 100%);color:#EEF1F7;box-shadow:0 5px 0 #07090F,0 10px 20px rgba(0,0,0,.4)}
.pack::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:repeating-linear-gradient(90deg,#C9D1E0 0 6px,#8C95AA 6px 12px);opacity:.85}
.pack::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 38%,rgba(255,122,162,.35) 45%,rgba(255,224,138,.35) 50%,rgba(156,242,208,.3) 55%,transparent 62%);animation:sheen 4.5s linear infinite;pointer-events:none}
.pack .no{font:400 22px var(--fn);letter-spacing:.06em;color:#FFE08A;margin-top:10px;line-height:1}
.pack .nmx{font:400 14px var(--fh);line-height:1.25}
.pack .st{font:400 15px var(--fh);letter-spacing:.1em;color:#FF7AA2}
.pack .st i{font-style:normal;color:#4A5275}
.pack.lock{filter:grayscale(1) brightness(.5)}
.pack.lock::after{display:none}
.pack.cur{border-color:#FF7AA2;box-shadow:0 0 0 3px #FF7AA2,0 5px 0 #07090F,0 10px 26px rgba(255,122,162,.45)}
.pack.boss{background:linear-gradient(150deg,#5A2338 0%,#8C3A57 30%,#3A1C33 60%,#6E2B47 100%)}
.mf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mf .fb{padding:0 4px;font-size:12px;white-space:nowrap}

/* ===== 遊んでいる最中 ===== */
.tb{position:absolute;top:calc(8px + env(safe-area-inset-top));height:42px;min-height:0;width:46px;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center;border-radius:10px}
#bPause{right:12px}#bMute{right:66px}
#ctl{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px}
#ctl .fb{flex:1;min-height:62px;padding:0 6px;font-size:15px;line-height:1.15}
#ctl .fb small{display:block;font:400 10px var(--fn);letter-spacing:.12em;opacity:.75}
#cRot{flex:1.4}

/* ===== パネル ===== */
.pan{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));pointer-events:auto}
.pan h2{margin:6px 0 0;font:400 32px/1.1 var(--fh);background:linear-gradient(100deg,#FFFFFF,#FFC2D4 30%,#FFE9A8 50%,#C8F7E4 70%,#FFFFFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.pan h2 small{display:block;font:400 14px/1.5 var(--fh);color:#C9D1E0;-webkit-text-fill-color:#C9D1E0;margin-top:6px}
.pan .btns{display:flex;gap:12px;margin-top:14px}.pan .btns>*{flex:1}
.stars{display:flex;gap:10px;margin:14px 0 10px}
.stars div{flex:1;padding:8px 4px;text-align:center;font:400 11px/1.35 var(--fh);border-radius:10px;background:rgba(201,209,224,.08);border:1.5px solid rgba(201,209,224,.25);color:#8C95AA}
.stars div i{display:block;font-style:normal;font-size:28px;line-height:1.1;color:#3A4166}
.stars div.on{color:#EEF1F7;border-color:#FFE08A}.stars div.on i{color:#FFE08A;text-shadow:0 0 12px rgba(255,224,138,.8)}
.rec{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 13px var(--fh);color:#C9D1E0}
.rec b{font:400 19px var(--fn);color:#EEF1F7;margin-left:4px}
.dim{background:rgba(10,12,22,.55)}
#newCards{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ===== バインダー ===== */
#scrBinder{pointer-events:auto;background:rgba(10,12,22,.72);display:flex;align-items:center;justify-content:center;padding:calc(60px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom))}
#scrBinder .slab{width:100%;max-width:1180px;max-height:100%;display:flex}
#scrBinder .in{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bh h3{margin:0;font:400 20px var(--fh);flex:1}
.bh h3 small{display:block;font:400 11px var(--fb);color:#C9D1E0;margin-top:2px}
#bGrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;-webkit-overflow-scrolling:touch;padding:2px}
.bc{position:relative;overflow:hidden;border-radius:10px;padding:6px 6px 7px;min-height:84px;background:#0E1120;border:1.5px dashed #3A4166;color:#4A5275;font:400 11px/1.3 var(--fh);text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2px}
.bc .v{font:400 16px var(--fn)}
.bc.got{border:2px solid #C9D1E0;color:#EEF1F7;background:linear-gradient(150deg,#2A3050,#1B2036 60%,#2A3050)}
.bc.got::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,122,162,.35) 46%,rgba(255,224,138,.35) 51%,rgba(156,242,208,.3) 56%,transparent 62%);animation:sheen 4s linear infinite;pointer-events:none}
.bc.rb{border-color:#FFE08A;box-shadow:0 0 0 2px rgba(255,224,138,.35)}
.bc .md{font:400 11px var(--fh);letter-spacing:.06em;color:#FF7AA2;white-space:nowrap}.bc .md small{font:400 8px var(--fn);letter-spacing:.1em;margin-left:3px;opacity:.8}
.bc.s .md{color:#FFE08A}

/* ===== 鑑定書（確認テスト） ===== */
#scrTest{pointer-events:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(62px + env(safe-area-inset-top)) 12px calc(22px + env(safe-area-inset-bottom));background:rgba(10,12,22,.55)}
#scrTest .slab{max-width:1200px;margin:0 auto}
.sh-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sh-h .t{font:400 17px var(--fn);letter-spacing:.14em;line-height:1;color:#FFE08A}
.sh-h .t small{display:block;font:400 12px var(--fh);letter-spacing:.02em;color:#C9D1E0;margin-top:4px}
.sh-h .sp{flex:1}
.sh-h .no{font:400 15px var(--fh);color:#141830;background:linear-gradient(90deg,#C9D1E0,#fff,#C9D1E0);padding:5px 10px;border-radius:6px}
.lamps{display:flex;gap:5px;margin-bottom:12px}
.lamps i{flex:1;height:9px;border-radius:5px;background:#2A3050}
.lamps i.ok{background:#7CF0B4}.lamps i.ng{background:#FF5C6C}.lamps i.cur{background:#FFE08A}
#tQ{font:600 18px/1.7 var(--fb);margin:4px 2px 12px}
#tFig{padding:8px;margin-bottom:14px;text-align:center;background:#F4F6FB;border-radius:12px;color:#141830}
#tFig svg{width:100%;height:auto;max-height:250px}
#tA{display:flex;flex-direction:column;gap:12px}
.ch{display:flex!important;align-items:center;gap:12px;min-height:56px;text-align:left;font:600 16px/1.45 var(--fb)!important;padding:8px 14px!important}
.ch i{flex:none;font:400 15px var(--fn);font-style:normal;width:30px;height:30px;border-radius:7px;background:#141830;color:#FFE08A;display:flex;align-items:center;justify-content:center}
.ch.ok{background:linear-gradient(135deg,#2E8C62,#7CF0B4 50%,#2E8C62)!important;color:#07130D!important}
.ch.ng{background:linear-gradient(135deg,#9C2B39,#FF8C98 50%,#9C2B39)!important;color:#1E0507!important}
.ch:disabled{filter:none!important;cursor:default}
.numbox{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.numbox .v{flex:1;height:60px;background:#0B0E1A;color:#FFE08A;font:400 30px var(--fn);display:flex;align-items:center;justify-content:flex-end;padding:0 14px;letter-spacing:.06em;border:2px solid #C9D1E0;border-radius:10px}
.numbox .u{font:400 20px var(--fh);min-width:40px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys .fb{min-height:52px;padding:0;font:400 22px var(--fn)}
.keys .go{grid-column:span 4;font:400 18px var(--fh)}
.ord{display:flex;flex-direction:column;gap:10px}
.ord .slot{min-height:46px;border:2px dashed #4A5275;border-radius:10px;display:flex;align-items:center;gap:10px;padding:6px 12px;font:600 15px var(--fb)}
.ord .slot i{font-style:normal;font:400 17px var(--fn);width:24px;color:#FFE08A}
#tEx{margin-top:14px;padding:12px 14px;font:600 15px/1.6 var(--fb);border-radius:12px;background:rgba(201,209,224,.1);border:1.5px solid rgba(201,209,224,.35)}
#tEx b{font:400 17px var(--fh);margin-right:8px}
#tNext{width:100%;margin-top:14px}
#scrEnd{pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,12,22,.6)}
#scrEnd .slab{width:100%;max-width:900px}
.grade{font:400 84px/1 var(--fn);margin:10px 0 14px;background:linear-gradient(100deg,#FFFFFF,#FFC2D4 30%,#FFE9A8 50%,#C8F7E4 70%,#FFFFFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.grade small{font-size:24px}
.col{display:flex;flex-direction:column;gap:12px}

/* ===== トースト（規則の発見など） ===== */
#toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:8;width:min(92vw,560px);pointer-events:none;transition:opacity .3s,transform .3s}
#toast.off{opacity:0;transform:translate(-50%,-14px)}
#toast .in{padding:12px 16px}
#toast b{display:block;font:400 17px var(--fh);color:#FFE08A;margin-bottom:4px}
#toast span{font:600 14px/1.6 var(--fb)}

/* ===== もどる（いつも左上の同じ場所） ===== */
#bBack{position:absolute;left:12px;top:calc(8px + env(safe-area-inset-top));z-index:9;min-height:0;height:42px;padding:0 14px 0 12px;font-size:15px;border-radius:10px 22px 22px 10px}
#scrBackQ{pointer-events:auto;z-index:10;background:rgba(10,12,22,.6)}

/* ===== 横長の画面（PC・iPad横） ===== */
@media (min-aspect-ratio:21/20){
  #scrTitle{right:auto;width:50%;justify-content:center;padding:6vh 3vw 6vh 5vw}
  h1.tt{font-size:clamp(52px,6.6vw,120px)}
  .tt-bot{max-width:470px;margin-top:5vh}
  #scrMap{padding:calc(64px + env(safe-area-inset-top)) 4vw 3vh}
  #packs{grid-template-columns:repeat(5,1fr);gap:16px;max-height:62vh}
  .pack .no{font-size:28px}.pack .nmx{font-size:16px}
  .mf{grid-template-columns:repeat(4,minmax(0,220px));justify-content:center}
  #ctl{left:auto;width:var(--rpw,300px);right:var(--rpr,20px);bottom:24px;flex-wrap:wrap}
  #ctl .fb{flex:1 1 40%;min-height:58px}

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>/*@QUIZ_BEGIN*/
/* ==========================================================

     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通

(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}

      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));

      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

var TILT=0,TILTT=0;

  if(a<=0)return;c.save();rr(x,y,w,h,r);c.clip();
  var o=((T*.18+(ph||0)+TILT*.3)%1+1)%1,L=Math.max(w,h)*2.2,gx=x-L*.5+o*L;
  var g=c.createLinearGradient(gx,y,gx+L,y+h*.8),cs=['#FF7AA2','#FFE08A','#B8F5A8','#9CF2D0','#9CCBFF','#FFB3CF','#FF7AA2'];
  cs.forEach(function(col,i){g.addColorStop(i/(cs.length-1),col)});

  c.globalCompositeOperation='lighter';var gp=((T*.35+(ph||0)*1.7)%1.6)-.3,bx=x+gp*w*1.6-w*.3;var g2=c.createLinearGradient(bx-w*.25,y,bx+w*.25,y+h);
  g2.addColorStop(0,'rgba(255,255,255,0)');g2.addColorStop(.5,'rgba(255,255,255,'+(.35*a)+')');g2.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g2;c.globalAlpha=1;c.fillRect(x,y,w,h);
  c.restore()}
function foilFill(x,y,w,h){var g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#8C95AA');g.addColorStop(.28,'#F4F6FB');g.addColorStop(.5,'#A9B2C5');g.addColorStop(.74,'#F2F4F9');g.addColorStop(1,'#7E879C');return g}
function pinkFill(x,y,w,h){var g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#D94A74');g.addColorStop(.3,'#FFC7D7');g.addColorStop(.52,'#FF7AA2');g.addColorStop(.75,'#FFE0E9');g.addColorStop(1,'#D2426C');return g}

  c.fillStyle='rgba(0,0,0,.55)';c.fillText(s,x+sz*.05,y+sz*.07);c.fillStyle='rgba(255,255,255,.55)';c.fillText(s,x-sz*.03,y-sz*.04);c.fillStyle=col||'#EEF1F7';c.fillText(s,x,y)}

  if(o.a!=null)c.globalAlpha=o.a;
  if(o.ghost){c.setLineDash([5,4]);rr(x,y,w,h,r);c.strokeStyle=o.gcol||'rgba(201,209,224,.75)';c.lineWidth=2;c.stroke();c.setLineDash([]);if(o.label){c.font='400 '+Math.max(10,h*.26)+'px '+FH;c.fillStyle=o.gcol||'rgba(201,209,224,.75)';c.textAlign='center';c.textBaseline='middle';c.fillText(o.label,cx,cy)}c.restore();return}
  if(o.junk){rr(x,y,w,h,r);c.fillStyle='#2B2F40';c.fill();c.strokeStyle='#161A2B';c.lineWidth=2;c.stroke();c.strokeStyle='rgba(255,92,108,.35)';c.lineWidth=1.5;c.beginPath();c.moveTo(x+w*.2,y+h*.25);c.lineTo(x+w*.45,y+h*.55);c.lineTo(x+w*.35,y+h*.8);c.moveTo(x+w*.65,y+h*.2);c.lineTo(x+w*.55,y+h*.5);c.lineTo(x+w*.8,y+h*.7);c.stroke();c.restore();return}

  G={si:si,S:S,lanes:[],cur:null,next:0,hold:0,holdOn:!!(S.hold||si>=3),clears:0,miss:0,combo:0,maxCombo:0,score:0,t:0,state:'fall',res:null,placed:0,left:S.time||0,paused:false,okS:0,okP:0,newBin:[],tut:S.tut&&!(SV.stars[0]&&SV.stars[0][0])?1:0,tutStep:0,endT:0,ms0:Date.now()};

  if(PD.moved&&Math.abs(dx)>Math.abs(dy)*.8){var i=Math.floor((e.clientX-LY.well.x)/LY.lw);if(e.clientX<LY.well.x)i=0;if(e.clientX>LY.well.x+LY.well.w)i=G.S.lanes-1;if(Math.abs(dx)>LY.lw*.4||i!==PD.lane)setLane(i)}
  if(dy>60&&Math.abs(dy)>Math.abs(dx)*1.4&&performance.now()-PD.t<420){hardDrop();PD=null}});
cv.addEventListener('pointerup',function(e){if(!PD)return;var dt=performance.now()-PD.t;if(!PD.moved&&dt<380)toggle();PD=null});
cv.addEventListener('pointercancel',function(){PD=null});
addEventListener('keydown',function(e){if(scene!=='play'||!G||G.paused)return;var k=e.key;
  if(k==='ArrowLeft'){setLane(G.cur?G.cur.lane-1:0);e.preventDefault()}else if(k==='ArrowRight'){setLane(G.cur?G.cur.lane+1:0);e.preventDefault()}
  else if(k==='ArrowUp'||k===' '){toggle();e.preventDefault()}else if(k==='ArrowDown'){hardDrop();e.preventDefault()}else if(k==='c'||k==='C'||k==='Shift')doHold()});
$('cRot').onclick=function(){ac();toggle()};$('cDrop').onclick=function(){ac();hardDrop()};$('cHold').onclick=function(){ac();doHold()};

/* ================= 場面の切りかえ ================= */
var SCR=['scrTitle','scrMap','scrPlay','scrClear','scrFail','scrPause','scrBinder','scrTest','scrEnd'];
function showScr(){var on=[].slice.call(arguments);SCR.forEach(function(id){$(id).classList.toggle('hidden',on.indexOf(id)<0)})}
var INHUB=!!window.COLLECTION_NAME||(function(){try{return window.parent!==window}catch(e){return true}})();
function backBtn(){var b=$('bBack'),on=scene==='play'||scene==='map'||scene==='test'||scene==='end'||(scene==='title'&&INHUB);b.classList.toggle('hidden',!on);b.textContent=scene==='title'?'◀ 一覧へ':'◀ もどる';$('scrBackQ').classList.add('hidden')}
var backFrom=null,backPaused=false;
$('bBack').onclick=function(){ac();
  if(scene==='title'){try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}return}
  backFrom=scene;backPaused=!!(G&&G.paused);if(scene==='play'&&G)G.paused=true;
  $('bkSub').textContent=scene==='test'?'確認テストは、次はさいしょから。パックの進み具合は保存されています。':scene==='map'||scene==='end'?'進み具合は保存されます。タイトルにもどります。':'進み具合は保存されます（開けたパックと★・バインダーはそのまま。このパックは次はさいしょから）。';
  $('bkGo').textContent=scene==='map'||scene==='end'?'タイトルへ':'パックの箱へ';$('scrBackQ').classList.remove('hidden')};
$('bkNo').onclick=function(){$('scrBackQ').classList.add('hidden');if(backFrom==='play'&&G&&!backPaused)G.paused=false};
$('bkGo').onclick=function(){$('scrBackQ').classList.add('hidden');if(backFrom==='map'||backFrom==='end')setScene('title');else{G=null;setScene('map')}};
function setScene(s){scene=s;backBtn();
  if(s==='title'){showScr('scrTitle');refreshTitle()}else if(s==='map'){refreshK();buildPacks();showScr('scrMap')}
  else if(s==='play')showScr('scrPlay');else if(s==='test')showScr('scrTest');else if(s==='end')showScr('scrEnd');
  $('bMute').textContent=muted?'🔇':'🔊'}
function refreshTitle(){$('bCont').classList.toggle('hidden',!(SV.unl>1||SV.stars[0]))}
function buildPacks(){var h='',tot=0;STAGES.forEach(function(S,i){var st=SV.stars[i]||[],n=st.filter(Boolean).length;tot+=n;var lock=i+1>SV.unl,cur=i+1===SV.unl&&!st[0];
    h+='<button class="pack'+(lock?' lock':'')+(cur?' cur':'')+(S.boss?' boss':'')+'" data-i="'+i+'"'+(lock?' disabled':'')+'><span class="no">'+(S.boss?'BOSS':'PACK '+pad2(i+1))+'</span><span class="nmx">'+S.n+'</span><span class="st">'+[0,1,2].map(function(k){return st[k]?'★':'<i>★</i>'}).join('')+'</span></button>'});
  $('packs').innerHTML=h;[].forEach.call($('packs').querySelectorAll('.pack'),function(b){b.onclick=function(){ac();SFX.pack();startStage(+b.dataset.i)}});
  $('mStat').innerHTML='★ '+tot+' / 30<br>合体カード '+binCount()+' / 30'+(Zk()?'<br>かけら ◆'+KAK:'');
  $('bToTest').disabled=!SV.done;$('bToTest').innerHTML=SV.done?'📋 鑑定へ':'📋 鑑定（ボス後）'}
function startStage(i){G=null;newStage(i);scene='play';backBtn();showScr('scrPlay');$('cHold').disabled=!G.holdOn;$('bMute').textContent=muted?'🔇':'🔊';
  if(!G.tut)toast('PACK '+pad2(i+1)+'「'+G.S.n+'」',G.S.note+'<br>合体 '+G.S.target+' 回でパック完了',2600)}
function showClear(){if(!G)return;var st=SV.stars[G.si],S=G.S,now=[true,G.miss===0,G.maxCombo>=Math.min(5,S.target)];showScr('scrPlay','scrClear');
  $('cLbl').textContent=S.boss?'BOSS CLEAR':'PACK CLEAR';$('cTitle').firstChild.nodeValue=S.boss?'ガッタイ王に勝った！':'パック完了！';
  $('cSub').textContent='PACK '+pad2(G.si+1)+'「'+S.n+'」'+(S.boss?' ─ 150秒で12合体':'');
  var L=['パック完了','ノーミス','コンボ'+Math.min(5,S.target)+'以上'];$('cStars').innerHTML=now.map(function(v,i){return'<div class="'+(v?'on':'')+'"><i>★</i>'+L[i]+'</div>'}).join('');
  $('cRec').innerHTML='<span>最大コンボ<b>'+G.maxCombo+'</b></span><span>ミス<b>'+G.miss+'</b></span><span>SCORE<b>'+G.score+'</b></span><span>時間<b>'+fmtT(G.t*1000)+'</b></span>';
  $('newCards').innerHTML=G.newBin.length?'<div style="width:100%;font:400 12px var(--fh);color:#FFE08A">NEW 合体カード</div>'+G.newBin.slice(0,8).map(function(o){return binHTML(o.k,true,o.rare)}).join(''):'';
  $('cNext').textContent=S.boss?'📋 鑑定へ（確認テスト）':'次のパック'}
$('cNext').onclick=function(){ac();if(!G)return;if(G.S.boss)toTest();else{SFX.pack();startStage(Math.min(STAGES.length-1,G.si+1))}};
$('cMap').onclick=function(){G=null;setScene('map')};
$('fRetry').onclick=function(){ac();var i=G?G.si:0;SFX.pack();startStage(i)};$('fMap').onclick=function(){G=null;setScene('map')};
$('bPause').onclick=function(){if(!G||G.state!=='fall'&&G.state!=='res')return;G.paused=true;showScr('scrPlay','scrPause')};
$('pGo').onclick=function(){if(G)G.paused=false;showScr('scrPlay')};$('pMap').onclick=function(){G=null;setScene('map')};
$('bMute').onclick=function(){muted=!muted;try{localStorage.setItem(SKEY+':mute',muted?'1':'0')}catch(e){}$('bMute').textContent=muted?'🔇':'🔊'};
function toTest(){var z=Zk();if(z&&z.mainClear&&!TEST){try{z.mainClear({onClose:startTest});return}catch(e){}}startTest()}
$('bToTest').onclick=function(){if(SV.done)startTest()};
function openBook(){var z=Zk();if(z&&z.openBook)z.openBook()}
$('bBook1').onclick=openBook;$('bBook2').onclick=openBook;$('eBook').onclick=openBook;
$('bGacha').onclick=function(){var z=Zk();if(z&&z.openGacha)z.openGacha()};
if(!Zk()){['bBook1','bBook2','bGacha','eBook'].forEach(function(id){$(id).classList.add('hidden')})}
function binHTML(k,got,rb){var p=k.split('-'),a=+p[0],b=+p[1],m=p[2],R=m==='S'?a+b:VOLT/curOf('P',a,b);
  return '<div class="bc'+(got?' got':'')+(rb?' rb':'')+(m==='S'?' s':'')+'"><span class="md">'+(m==='S'?'直列<small>SERIES</small>':'並列<small>PARALLEL</small>')+'</span>'+(got?'<span>'+a+'Ω と '+b+'Ω</span><span class="v">'+fmtR(R)+'</span>'+(rb?'<span style="color:#FFE08A;font-size:10px;white-space:nowrap">★虹</span>':''):'<span>'+a+'Ω と '+b+'Ω</span><span class="v">？</span>')+'</div>'}
$('bBinder').onclick=function(){$('bGrid').innerHTML=BINALL.map(function(k){var o=SV.bin[k];return binHTML(k,!!o,o&&o.r)}).join('');$('bCount').textContent=binCount()+' / 30';showScr('scrMap','scrBinder')};
$('bBinClose').onclick=function(){showScr('scrMap')};
function getName(){return(window.PLAYER_NAME||$('nameIn').value||SV.name||'').trim()}
$('bStart').onclick=function(){ac();SFX.pack();SV.name=$('nameIn').value.trim()||SV.name;save();if(SV.unl<=1&&!(SV.stars[0]&&SV.stars[0][0]))startStage(0);else setScene('map')};
$('bCont').onclick=function(){ac();SV.name=$('nameIn').value.trim()||SV.name;save();setScene('map')};

/* ================= 確認テスト（鑑定書） ================= */
var TQ=[],TI=0,TA=[],TOK=[],CARD=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
function startTest(){scene='test';G=null;showScr('scrTest');backBtn();TQ=window.Quiz?Quiz.test():[];TI=0;TA=[];TOK=[];$('scrTest').scrollTop=0;showQ()}
function lamps(){$('tLamps').innerHTML=TQ.map(function(q,i){return'<i class="'+(i<TOK.length?(TOK[i]?'ok':'ng'):i===TI?'cur':'')+'"></i>'}).join('')}
function showQ(){if(TI>=TQ.length)return finishTest();var q=TQ[TI];$('tNo').textContent='第'+(TI+1)+'問 ／ '+TQ.length;lamps();
  $('tQ').textContent=q.q;var f=$('tFig');if(q.fig){f.innerHTML=q.fig;f.classList.remove('hidden')}else{f.innerHTML='';f.classList.add('hidden')}
  $('tEx').classList.add('hidden');$('tNext').classList.add('hidden');var box=$('tA');box.innerHTML='';
  if(q.t==='choice'){q.shown.forEach(function(s,i){var b=document.createElement('button');b.className='fb dk ch';b.innerHTML='<i>'+'ABCDEF'.charAt(i)+'</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){answer(s,b)};box.appendChild(b)})}
  else if(q.t==='num'){var v='';box.innerHTML='<div class="numbox"><div class="v" id="nv">&nbsp;</div><div class="u">'+esc(q.unit||'')+'</div></div><div class="keys" id="nk"></div>';
    var ks=['7','8','9','⌫','4','5','6','.','1','2','3','0'],nk=$('nk');ks.forEach(function(k){var b=document.createElement('button');b.className='fb dk';b.textContent=k;b.onclick=function(){if(TA.length>TI)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<7&&!(k==='.'&&v.indexOf('.')>=0))v+=k;$('nv').innerHTML=v?esc(v):'&nbsp;';SFX.tick()};nk.appendChild(b)});
    var go=document.createElement('button');go.className='fb pk go';go.textContent='この値で決定';go.onclick=function(){if(v&&TA.length<=TI)answer(v,null)};nk.appendChild(go)}
  else{var sel=[];var wrap0=document.createElement('div');wrap0.className='ord';box.appendChild(wrap0);
    var draw=function(){wrap0.innerHTML='';sel.forEach(function(s,i){var d=document.createElement('div');d.className='slot';d.innerHTML='<i>'+(i+1)+'</i><span></span>';d.querySelector('span').textContent=s;wrap0.appendChild(d)});
      q.shown.forEach(function(s){if(sel.indexOf(s)>=0)return;var b=document.createElement('button');b.className='fb dk ch';b.innerHTML='<i>＋</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){if(TA.length>TI)return;sel.push(s);SFX.tick();if(sel.length===q.shown.length)answer(sel.slice(),null);else draw()};wrap0.appendChild(b)});
      if(sel.length&&TA.length<=TI){var r=document.createElement('button');r.className='fb sm';r.textContent='やりなおす';r.onclick=function(){sel=[];draw()};wrap0.appendChild(r)}};
    draw()}}
function answer(v,btn){if(TA.length>TI)return;var q=TQ[TI],ok=window.Quiz?Quiz.check(q,v):false;TA.push(v);TOK.push(ok);ok?SFX.ok(2):SFX.ng();
  [].slice.call($('tA').querySelectorAll('.ch')).forEach(function(b){b.disabled=true;var t=b.querySelector('span').textContent;if(q.t==='choice'){if(t===q.choices[0])b.classList.add('ok');else if(b===btn)b.classList.add('ng')}});
  if(q.t==='order'){var w=$('tA').querySelector('.ord');if(w)[].slice.call(w.querySelectorAll('.slot')).forEach(function(d,i){d.style.borderColor=v[i]===q.items[i]?OKC:NGC;d.style.borderStyle='solid'})}
  if(q.t==='num'){var nv=$('nv');if(nv)nv.style.borderColor=ok?OKC:NGC}
  var ex=$('tEx');ex.innerHTML=(ok?'<b style="color:'+OKC+'">GEM MINT！</b>':'<b style="color:#FF8C98">要確認</b>正解：'+esc(window.Quiz?Quiz.answer(q):'')+'<br>')+esc(q.ex||'');ex.classList.remove('hidden');
  lamps();var nb=$('tNext');nb.textContent=TI+1>=TQ.length?'鑑定を終える':'つぎへ';nb.classList.remove('hidden');setTimeout(function(){nb.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'})},50)}
$('tNext').onclick=function(){TI++;$('scrTest').scrollTop=0;showQ()};
function totalStars(){var n=0;for(var k in SV.stars)n+=SV.stars[k].filter(Boolean).length;return n}
function finishTest(){var qs=TQ,answers=TA;var review=window.Quiz?Quiz.review(qs,answers):[],marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length,name=getName();
  var records=TEST?[['モード','確認テストだけ']]:[['クリアタイム',SV.clearMs?fmtT(SV.clearMs):'（ボスまだ）'],['最大コンボ',String(SV.maxCombo||0)],['合体カード',binCount()+' / 30'],['パックの★',totalStars()+' / 30']];
  $('eName').textContent=(name?name+'　':'')+'鑑定結果';$('eScore').innerHTML=score+'<small> / '+qs.length+'</small>';
  setScene('end');
  if(window.SubmitCard)CARD=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　電流とその利用　第12回',
    game:'ガッタイ・レジスター ～合成抵抗～'+(TEST?'（確認テストのみ）':''),name:name,score:score,total:qs.length,marks:marks,records:records,review:review},function(){});
  refreshK()}
$('eCard').onclick=function(){if(CARD&&window.SubmitCard)SubmitCard.reopen(CARD)};
$('eMap').onclick=function(){setScene('map')};

/* ================= ループ ================= */
var last=performance.now();
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  c.setTransform(DPR,0,0,DPR,0,0);
  if(scene==='play'&&G){update(dt);drawPlay()}
  else if(scene==='title')drawTitle();
  else drawMapBg();
  updFx(dt);if(scene!=='play')drawFx();
  requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',function(){if(document.hidden&&scene==='play'&&G&&G.state==='fall'&&!G.paused){G.paused=true;showScr('scrPlay','scrPause')}});

/* ================= はじまり ================= */
if(INHUB)document.body.classList.add('inhub');
resize();
window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]});
refreshK();
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nmRow').classList.add('hidden')}else if(SV.name)$('nameIn').value=SV.name;
if(TEST){startTest()}else setScene('title');
requestAnimationFrame(frame);
/* 自動操作の確かめ用の窓口（遊びには影響しない） */
window.__GC={G:function(){return G},start:startStage,lane:setLane,toggle:toggle,drop:hardDrop,hold:doHold,scene:function(){return scene},SV:function(){return SV},need:function(i){return G&&G.lanes[i]?needOf(G.lanes[i]):null}};
})();
</script>
