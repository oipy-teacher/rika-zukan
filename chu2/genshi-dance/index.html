<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>原子のダンスパーティー ～質量の比が一定になるわけ～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d0a10;--bg2:#2c1119;--wine:#4a1523;--line:#5e2a36;--gold:#e8c36a;--gold2:#9c7a2a;--cream:#f7ecd6;--txt:#fbf3e4;--sub:#c9aab0;--ok:#63d19c;--ng:#f06a6a;
 --f:'Zen Kaku Gothic New','Hiragino Sans','Meiryo',sans-serif;--min:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--f);overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;
 background-image:radial-gradient(ellipse 80% 40% at 50% -5%,rgba(232,195,106,.25),transparent 70%),repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 22px,rgba(255,255,255,.015) 22px 44px)}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
.scr{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:8px 12px 30px}
.btn{min-height:50px;border:none;border-radius:12px;padding:10px 18px;font-size:18px;font-weight:900;background:var(--wine);color:#fff;box-shadow:0 4px 0 #0c0306}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c0306}
.btn.gold{background:var(--gold);color:#2a1b00;box-shadow:0 4px 0 var(--gold2)}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.small{font-size:13px;color:var(--sub)}
.tbtns{display:grid;gap:10px;margin-top:12px}
.ribbon{display:inline-block;font-size:13px;letter-spacing:.3em;color:var(--gold);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:3px 12px}
.logo{font-family:var(--min);font-weight:800;font-size:clamp(32px,10vw,50px);line-height:1.15;margin:8px 0 4px;letter-spacing:.04em;text-shadow:0 3px 0 #000}
.subt{font-size:15px;color:var(--gold);margin-bottom:6px;font-weight:700}
.namein{width:100%;font:inherit;font-size:18px;padding:10px;border-radius:8px;border:2px solid var(--line);background:#12050a;color:#fff;margin-top:6px}
.hero svg{display:block;width:100%;height:auto}
/* HUD */
.hudw{position:sticky;top:0;z-index:5;background:#1d0a10f2;padding-bottom:4px;margin-bottom:6px;box-shadow:0 6px 10px -6px #000}
.hud{display:flex;align-items:center;gap:6px;padding:6px 0 2px}
.hud .ib{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg2);font-size:20px;flex:none}
.hud .mid{flex:1;min-width:0;text-align:center;line-height:1.25}
.hud .mid b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--min)}
.hud .mid span{font-size:12px;color:var(--sub)}
.hud2{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--sub)}
.hud2 b{font-size:17px;color:var(--gold);margin-left:4px}
/* 原子（全ゲーム共通の色） */
.atom{--c:#999;--t:#fff;width:var(--a,34px);height:var(--a,34px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--a,34px)*.4);color:var(--t);
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.35) 18%,transparent 42%),radial-gradient(circle at 50% 50%,transparent 55%,rgba(0,0,0,.32) 100%),var(--c);box-shadow:0 2px 5px rgba(0,0,0,.4);flex:none;position:relative}
/* フロア */
.floor{position:relative;height:292px;border-radius:14px;overflow:hidden;border:2px solid var(--gold2);
 background:repeating-conic-gradient(#6b3f22 0 25%,#7d4b28 0 50%) 0 0/44px 44px}
.floor:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,190,.28),transparent 65%),linear-gradient(transparent 60%,rgba(0,0,0,.35))}
.band{position:absolute;right:8px;font-size:10px;font-weight:900;color:#ffe9b8;letter-spacing:.15em;opacity:.8;z-index:1}
.ent{position:absolute;display:flex;align-items:center;transition:left .45s cubic-bezier(.3,1.3,.5,1),top .45s cubic-bezier(.3,1.3,.5,1);z-index:2;cursor:pointer;touch-action:manipulation}
.ent .tag{position:absolute;right:-6px;top:-7px;background:var(--cream);color:#3a2410;border-radius:8px;font-size:10px;font-weight:900;padding:0 4px;font-style:normal;box-shadow:0 1px 2px #0006;z-index:3}
.ent.o2 .atom+.atom{margin-left:-7px}
.ent.pair .atom+.atom{margin-left:-8px}
.ent.pair{animation:sway 1.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.ent.sel{filter:drop-shadow(0 0 8px #ffe27a) drop-shadow(0 0 3px #fff)}
.ent.sel .atom{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.ent.born{animation:born .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes born{from{transform:scale(1.8)}}
.ent.no{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.panel{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.panel h3{margin:0 0 6px;font-size:17px;font-family:var(--min)}
.msg{font-size:16px;line-height:1.6;margin:4px 0 8px}
.msg b{color:var(--gold)}
.choice{display:block;width:100%;min-height:52px;text-align:left;background:#3a1520;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:16px;line-height:1.45;color:#fff}
.choice.ok{border-color:var(--ok);background:#12301f}.choice.ng{border-color:var(--ng);opacity:.55}
.choice.sel{border-color:var(--gold);background:#3e2c12}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums .choice{text-align:center;font-size:20px;font-weight:900;margin:0}
.why{background:#3a0f14;border:2px solid #7d1d25;border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6;margin-top:8px}
.good{background:#12301f;border:2px solid #2a7a4f;border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6;margin-top:8px}
.good b,.why b{color:var(--gold)}
.scale{background:var(--cream);color:#2a1a10;border-radius:10px;padding:8px 10px;margin-top:8px}
.scale svg{display:block;width:100%;height:auto}
.left{font-size:15px;text-align:center;margin-top:6px;min-height:22px}
.left b{color:var(--gold);font-size:18px}
.stepper{display:grid;grid-template-columns:60px 1fr 60px;gap:8px;align-items:center;margin:8px 0}
.stepper button{min-height:52px;font-size:26px;border-radius:10px;border:2px solid var(--line);background:#3a1520}
.stepper div{text-align:center;font-size:17px}.stepper div b{font-size:30px;color:var(--gold)}
.card{background:var(--cream);color:#2a1a10;border-radius:10px;padding:12px;margin:10px 0;font-size:14px;line-height:1.65}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat div{background:#3a1520;border-radius:10px;padding:8px;font-size:13px;color:var(--sub)}
.stat b{display:block;font-size:22px;color:#fff}
/* 演出 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.pop{position:fixed;z-index:61;font-weight:900;font-size:20px;color:var(--gold);pointer-events:none;text-shadow:0 2px 0 #000;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.banner{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);z-index:62;background:#1d0a10ee;border:2px solid var(--gold);border-radius:14px;padding:14px 22px;text-align:center;font-size:26px;font-weight:900;color:var(--gold);pointer-events:none;animation:bn 1.9s ease forwards;white-space:nowrap;font-family:var(--min)}
.banner small{display:block;font-size:14px;color:#fff;font-weight:700;margin-top:4px;white-space:normal;font-family:var(--f)}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}12%{transform:translate(-50%,-50%) scale(1.08);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.ov{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.ovc{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg2);border:2px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px 22px}
.ovc h2{margin:4px 0 8px;font-size:20px;font-family:var(--min)}
.tq{font-size:18px;font-weight:700;line-height:1.6;margin:12px 0}
.tfig{background:var(--cream);border-radius:10px;padding:6px;margin-bottom:8px;color:#222}
.tfig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.prog{display:flex;gap:4px;margin:8px 0}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--gold)}
.numshow{font-size:32px;text-align:center;background:#12050a;border-radius:10px;padding:8px;margin:6px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{min-height:52px;font-size:22px;border-radius:10px;border:2px solid var(--line);background:#3a1520}
.ordsel div{background:#3e2c12;border:2px solid var(--gold);border-radius:8px;padding:8px;margin:4px 0;font-size:15px}
.menu{display:grid;gap:8px;margin-top:10px}
.menu button{display:flex;justify-content:space-between;align-items:center;min-height:52px;text-align:left;background:#3a1520;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;color:#fff}
.menu button span{color:var(--sub);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="title" class="scr"><div class="wrap" style="text-align:center;padding-top:10px">
 <div class="ribbon">BALL OF ATOMS</div>
 <div class="logo">原子の<br>ダンスパーティー</div>

 <div class="hero" id="hero"></div>
 <p style="font-size:15px;line-height:1.6;margin:6px 0">金属の原子と酸素の原子を、ペアにして踊らせよう。<br>ペアがふえても、質量の比は…？</p>

 </div>

 <div class="floor" id="floor"><span class="band" style="top:4px">酸素分子（空気）</span><span class="band" style="top:92px">金属の原子</span><span class="band" style="top:186px">ペア（できた物質）</span></div>
 <div class="left" id="left"></div>
 <div class="panel" id="ctrl"></div>
</div></div>

<div id="clear" class="scr hidden"><div class="wrap" id="clearBox"></div></div>
<div id="test" class="scr hidden"><div class="wrap" id="tBox"></div></div>
<div id="ov" class="ov hidden"><div class="ovc" id="ovc"></div></div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

function setupFloor(M,o2){F.ents.forEach(e=>e.el&&e.el.remove());F={ents:[],sel:null,nid:1,live:false,miss:0,onDone:null,pairN:0};

function pairs(m){return F.ents.filter(e=>e.k==='pair'&&(!m||e.m===m))}
function entHTML(e){if(e.k==='O2')return atom('O',28)+atom('O',28)+'<i class="tag">2+2</i>';if(e.k==='O')return atom('O',28)+'<i class="tag">2</i>';
 if(e.k==='pair')return atom(e.m,34)+atom('O',26)+`<i class="tag">${W8[e.m]}+2</i>`;return atom(e.k,36)+`<i class="tag">${W8[e.k]}</i>`}
function layout(fresh){const fl=$('floor');const W=fl.clientWidth||340;
 const place=(list,y0,step,rowH)=>{const cols=Math.max(1,Math.floor((W-20)/step));list.forEach((e,i)=>{e.x=12+(i%cols)*step;e.y=y0+Math.floor(i/cols)*rowH})};
 place(freeO(),18,66,36);place(freeMetals(),106,46,42);place(pairs(),200,64,42);
 F.ents.forEach(e=>{if(!e.el){e.el=document.createElement('div');e.el.dataset.id=e.id;e.el.addEventListener('pointerdown',ev=>{ev.preventDefault();tapEnt(e)});fl.appendChild(e.el);e.el.style.left=(fresh?e.x:W/2)+'px';e.el.style.top=(fresh?e.y:-40)+'px';e.el.getBoundingClientRect()}
  e.el.className='ent '+(e.k==='O2'||e.k==='O'?'o2':e.k==='pair'?'pair':'mt')+(F.sel===e.id?' sel':'');
  if(e.el.dataset.k!==e.k){e.el.innerHTML=entHTML(e);e.el.dataset.k=e.k}
  e.el.style.left=e.x+'px';e.el.style.top=e.y+'px'});
 leftInfo()}
function leftInfo(){const fm=freeMetals(),fo=F.ents.filter(e=>e.k==='O2');const parts=[];
 const cu=fm.filter(e=>e.k==='Cu').length,mg=fm.filter(e=>e.k==='Mg').length;
 if(cu)parts.push(`銅原子 <b>${cu}</b>個`);if(mg)parts.push(`マグネシウム原子 <b>${mg}</b>個`);if(fo.length)parts.push(`酸素分子 <b>${fo.length}</b>個`);
 $('left').innerHTML=parts.length?'相手なし：'+parts.join('・'):''}
function tapEnt(e){if(!F.live)return;ac();
 const sel=F.sel?F.ents.find(x=>x.id===F.sel):null;
 if(e.k==='O2'){if(sel){if(sel.id===e.id)return;return nope(e,'いま選んでいる酸素の相手を、先に見つけよう。')}
  if(freeMetals().length<2){F.miss++;comboReset();return nope(e,`酸素分子 O₂ は、酸素原子2個でできている。金属の原子が<b>2個</b>ないと、ペアになりきれない。`)}
  F.sel=e.id;sfx.sel();layout();return}
 if(e.k==='O')return;
 if(e.k==='pair'){pop(`${FORM[e.m]}（${W8[e.m]}＋2）`,e.el,'#fff');return}
 // 金属
 if(!sel){F.miss++;comboReset();return nope(e,'金属の原子どうしでは、酸化物にならない。まず<b>酸素分子</b>をタップ。')}
 const p=mk('pair',e.k);F.ents.splice(F.ents.indexOf(e),1);e.el.remove();
 if(sel.k==='O2'){sel.k='O'}else{F.ents.splice(F.ents.indexOf(sel),1);sel.el.remove();F.sel=null}
 F.pairN++;sfx.pair(F.pairN);layout();p.el.classList.add('born');
 const b=p.el.getBoundingClientRect();sparks(b.left+b.width/2,b.top+b.height/2,14,e.k==='Cu'?'#ffb27a':'#e6f0ff');

 ms.forEach((m,j)=>{const n=pairs(m).length,a=n*W8[m],b=n*2,y=8+j*58;const mx=Math.max(80,a,b);const sc=210/Math.max(mx,1);

  s+=`<rect x="4" y="${y+36}" width="${Math.max(2,b*sc)}" height="14" rx="3" fill="${EL.O[0]}"/><text x="${10+b*sc}" y="${y+48}" font-size="12" fill="#3a2410">酸素 ${b}</text>`;
  s+=`<text x="326" y="${y+12}" font-size="13" text-anchor="end" font-weight="900" fill="#7a1d2a">${n?`${a}：${b} ＝ ${a/g}：${b/g}`:'―'}</text>`});

  <div class="scale">${recGraph()}<div class="small" style="color:#5a3a20">ペアの記録：金属の札の合計と、酸素の札の合計</div></div>

function heroSVG(){const at=(x,y,r,e)=>`<g><circle cx="${x}" cy="${y}" r="${r}" fill="${EL[e][0]}"/><circle cx="${x-r*.45}" cy="${y-r*.5}" r="${r*.2}" fill="#fff" opacity=".45"/><text x="${x}" y="${y+r*.36}" font-size="${r*.9}" text-anchor="middle" font-weight="900" fill="${EL[e][1]}" font-family="sans-serif">${e}</text></g>`;
 let s=`<svg viewBox="0 0 360 200"><defs><radialGradient id="cl"><stop offset="0" stop-color="#fff3c8" stop-opacity=".9"/><stop offset="1" stop-color="#e8c36a" stop-opacity="0"/></radialGradient></defs>`;
 s+=`<path d="M180,0 L180,26" stroke="#9c7a2a" stroke-width="3"/><ellipse cx="180" cy="44" rx="70" ry="10" fill="none" stroke="#e8c36a" stroke-width="3"/><path d="M110,44 Q180,90 250,44" fill="none" stroke="#e8c36a" stroke-width="2"/>`;
 [120,150,180,210,240].forEach((x,i)=>s+=`<path d="M${x},${44-(i%2?4:0)} L${x},${30-(i%2?4:0)}" stroke="#f7ecd6" stroke-width="4"/><circle cx="${x}" cy="${24-(i%2?4:0)}" r="14" fill="url(#cl)"/><path d="M${x},${27-(i%2?4:0)} q-3,-6 0,-10 q3,4 0,10Z" fill="#ffcf6b"/>`);
 [140,165,195,220].forEach((x,i)=>s+=`<path d="M${x},${52+i%2*6} l-4,10 l4,6 l4,-6Z" fill="#fff" opacity=".6"/>`);
 s+=`<ellipse cx="180" cy="186" rx="170" ry="16" fill="#6b3f22" opacity=".7"/>`;
 s+=`<g transform="rotate(-10 90 150)">${at(80,150,20,'Cu')}${at(104,146,14,'O')}</g><g transform="rotate(8 180 150)">${at(170,152,20,'Mg')}${at(194,148,14,'O')}</g><g transform="rotate(-6 270 150)">${at(262,150,20,'Cu')}${at(286,146,14,'O')}</g>`;
 return s+`<text x="180" y="112" font-size="14" text-anchor="middle" fill="#e8c36a" font-family="serif">♪ ♫ ♪</text></svg>`}
function initTitle(){clearInterval(BT);show('title');zkBtns();$('hero').innerHTML=heroSVG();$('nameIn').value=S.name||window.PLAYER_NAME||'';if(window.PLAYER_NAME)$('nameBox').classList.add('hidden');
 $('bCont').classList.toggle('hidden',!S.started);$('bCont').textContent=S.cleared?'つづきから（確認テスト・まとめ）':`つづきから（${ROUNDS[Math.min(S.r,ROUNDS.length-1)].nm}）`}
function takeName(){const v=$('nameIn').value.trim();S.name=v||window.PLAYER_NAME||S.name||'';save()}
$('bStart').onclick=()=>{ac();sfx.tap();takeName();if(S.started&&!confirm('はじめから踊りますか？（記録の一部は残ります）'))return;
 const keep={name:S.name,firstDone:S.firstDone,hitDone:S.hitDone,mainDone:S.mainDone,ruleGot:S.ruleGot};S=Object.assign(fresh(),keep);save();startRound(0)};
$('bCont').onclick=()=>{ac();sfx.tap();takeName();
 if(S.cleared){overlay(`<h2>どこから？</h2><div class="tbtns"><button class="btn gold wide" id="oT">📝 確認テスト</button><button class="btn ghost wide" id="oC">📜 まとめを見る</button><button class="btn ghost wide" id="oS">曲をえらぶ</button><button class="btn ghost wide" id="oX">とじる</button></div>`);
  $('oT').onclick=()=>{closeOv();startTest()};$('oC').onclick=()=>{closeOv();renderClear();show('clear')};$('oS').onclick=()=>{closeOv();stageMenu()};$('oX').onclick=closeOv}
 else startRound(S.r)};
$('bBook1').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();
$('bMute1').onclick=()=>{setMute(!MUTE);if(!MUTE){ac();sfx.tap()}};$('bMute').onclick=()=>{setMute(!MUTE);if(!MUTE){ac();sfx.tap()}};
$('bHome').onclick=()=>{sfx.tap();clearInterval(BT);save();initTitle()};
$('ov').addEventListener('pointerdown',e=>{if(e.target===$('ov')&&$('ovc').querySelector('#oX'))closeOv()});
addEventListener('resize',()=>{if(!$('game').classList.contains('hidden'))layout()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
setMute(MUTE);if(window.PLAYER_NAME&&!S.name)S.name=window.PLAYER_NAME;
if(TEST_ONLY){S.name=window.PLAYER_NAME||S.name||'';startTest()}else initTitle();
window.__GD={S:()=>S,F:()=>F,RD:()=>RD,B:()=>B,tap:id=>{const e=F.ents.find(x=>x.id===id);e&&tapEnt(e)},start:startRound,test:startTest};
})();
</script>
