<title>比例の星座 ～金属と酸素の質量のグラフ～</title>
<!--
  ゲームID: hirei-seiza ／ コマID: chu2-kagaku-31（化学変化と原子・分子 第31回・確認用〔実験の結果をグラフにする場面〕）
  ねらい: 金属の質量と、結び付く酸素の質量（の限度）は比例する（原点を通る直線）。銅：酸素≒4：1、マグネシウム：酸素≒3：2

  【6. 別の世界】画風＝染付（白磁に呉須の藍で描いた皿）
   1 世界とメタファー: 染付の大皿に描いた星図。皿の見込み（内側）が方眼のグラフ＝夜空。
     測定の札（短冊）の値から「結び付いた酸素＝加熱後−加熱前」を出し、パチンコ（スリングショット）で星を皿に打ち込む。
     星がそろうと、筆で原点から1本の線を引き、星座（比例のグラフ）が焼き上がる。夜ごとに皿の縁の文様（青海波・唐草・梅…）が変わる。
   2 配色: 白磁 #F7F7F2 ／ 呉須の藍 #1F3F8F（濃淡のだみ）／ 差し＝銅の色 #C8773C。落款の朱 #B8432F、金彩 #C9A24A は節目だけ。
   3 書体: Kaisei Tokumin（見出し・札・数字。明朝の筆の抜き）
   4 画面: 全画面canvas。横長＝左に横長の角皿（グラフ）、右に札の掛け台。パチンコは皿の横軸の上を左右に動き、下へ引いて放つ。
     縦長＝上に札、下に縦長の角皿。下の余白が引きしろ。
   5 HUD: もどる＝左上の白磁の札（藍の縁）。夜の名＝短冊。かけら＝藍の小皿。音＝小さな札。コンボ＝皿の右上に藍の大きな数字。
   6 音: 磁器を打つ「チーン」（非整数倍音のサイン波）・琴の爪弾き（都節音階）・太鼓（焼き上がり）
  【7. 動かす遊び】スリングショット（引っぱって放つ）
   パチンコをつかむ → 左右に動かして「横＝金属の質量」 → 下へ引く長さで「縦＝結び付いた酸素の質量」 → はなすと星が飛んで皿に刺さる。
   引き算をまちがえる／加熱後の質量をそのまま打つ／加熱の途中の値を使う と、星は違う所に刺さって欠け、本当のずれ（あと何g）が出る。
   星がそろったら、筆で1本の線を引く。原点を通り、ばらつきの真ん中を通る線だけが星座になる（折れ線・原点を外す線・外れ値に引っぱられた線は×）。
  30分: 8夜（一の夜＝導入3星 → 二の夜で銅座完成・コマ30の封印と照らす → 三の夜 皿ごとの質量 → 四の夜 加熱の記録と外れ値 →
       五の夜 山場：マグネシウム（線の傾きを先に予想）→ 六の夜 二つの星座 → 七の夜 星座で予言 → 八の夜 時間つきの一発勝負）
  ハマる仕組み: 主② 星座の帳（8枚の皿を焼いて埋める・一発で焼けば金彩）／副⑦ あと何gの本当のずれ／副⑤ 一発正解の連続（連）
  封印: localStorage rika-zukan:chu2:seal:chu2-kagaku-30（keikaku-rocket が書く {pred,predT,shape,shapeT,reason:{id,t},pts:[[銅g,酸素g]…]}）を開けて、
       描いた予想の線（pts）を銅の皿に重ね、二の夜の終わりに星座と照らす。無ければその場で線を描いて予想する。
-->

<script>/*@SUBMIT_CARD_BEGIN*/

     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',

    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',

    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+

       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */

    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

0.005, "ex": "0.90×2/3＝0.60 g。", "kind": "calc", "level": 2, "fig": null}, {"id": "chu2-hirei-seiza-q008", "koma": "chu2-kagaku-31", "t": "choice", "q": "実験の結果を点で表したら、少しばらついた。グラフの線の引き方として正しいものはどれか。", "choices": ["点のばらつきの真ん中を通る直線を引く", "点を順番に折れ線でつなぐ", "すべての点を必ず通る曲線を引く", "いちばん外れた点を通る直線を引く"], "ex": "測定値には誤差がある。すべての点を通そうとせず、点のばらつきの中心を通るように引く。", "kind": "method", "level": 1, "fig": null}, {"id": "chu2-hirei-seiza-q009", "koma": "chu2-kagaku-31", "t": "choice", "q": "このグラフの線が原点（0，0）を通る理由として、最も適切なものはどれか。", "choices": ["金属が0 gなら、結び付く相手がなく、酸素も0 gだから", "グラフはいつも原点から書き始める決まりだから", "酸素は空気中にいくらでもあるから", "0 gの金属を加熱すると、酸素が0.10 g結び付くから"], "ex": "金属が無ければ酸素は結び付かない。だから線は原点を通る。", "kind": "judge", "level": 2, "fig": null}, {"id": "chu2-hirei-seiza-q010", "koma": "chu2-kagaku-31", "t": "choice", "q": "表は、班ごとに銅の質量を変えて、反応しきるまで加熱した結果である。表の中で、ほかの班と比べて明らかに外れている班はどれか。", "fig": "\u003csvg viewBox=\"0 0 320 88\" width=\"320\">\u003crect x=\"4\" y=\"4\" width=\"312\" height=\"24\" fill=\"#ece6d6\"/>\u003ctext x=\"12\" y=\"21\" font-size=\"12\" text-anchor=\"start\" font-family=\"sans-serif\">班\u003c/text>\u003ctext x=\"122\" y=\"21\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">1\u003c/text>\u003ctext x=\"166\" y=\"21\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">2\u003c/text>\u003ctext x=\"210\" y=\"21\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">3\u003c/text>\u003ctext x=\"254\" y=\"21\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">4\u003c/text>\u003ctext x=\"298\" y=\"21\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">5\u003c/text>\u003crect x=\"4\" y=\"30\" width=\"312\" height=\"24\" fill=\"#fff\"/>\u003ctext x=\"12\" y=\"47\" font-size=\"12\" text-anchor=\"start\" font-family=\"sans-serif\">銅〔g〕\u003c/text>\u003ctext x=\"122\" y=\"47\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">0.40\u003c/text>\u003ctext x=\"166\" y=\"47\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">0.80\u003c/text>\u003ctext x=\"210\" y=\"47\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">1.20\u003c/text>\u003ctext x=\"254\" y=\"47\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">1.60\u003c/text>\u003ctext x=\"298\" y=\"47\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">2.00\u003c/text>\u003crect x=\"4\" y=\"56\" width=\"312\" height=\"24\" fill=\"#f6f2e6\"/>\u003ctext x=\"12\" y=\"73\" font-size=\"12\" text-anchor=\"start\" font-family=\"sans-serif\">酸素〔g〕\u003c/text>\u003ctext x=\"122\" y=\"73\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">0.10\u003c/text>\u003ctext x=\"166\" y=\"73\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">0.20\u003c/text>\u003ctext x=\"210\" y=\"73\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">0.19\u003c/text>\u003ctext x=\"254\" y=\"73\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">0.40\u003c/text>\u003ctext x=\"298\" y=\"73\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">0.50\u003c/text>\u003c/svg>", "choices": ["3班", "1班", "5班", "外れている班はない"], "ex": "銅：酸素＝4：1なら、1.20 gの銅には0.30 g。3班の0.19 gは加熱不足などが考えられる。", "kind": "judge", "level": 2}, {"id": "chu2-hirei-seiza-q011", "koma": "chu2-kagaku-31", "t": "choice", "q": "銅の質量を2倍にして、反応しきるまで加熱した。結び付く酸素の質量はどうなるか。", "choices": ["2倍になる", "変わらない", "4倍になる", "半分になる"], "ex": "金属の質量と結び付く酸素の質量は比例するので、2倍になる。", "kind": "judge", "level": 1, "fig": null}, {"id": "chu2-hirei-seiza-q012", "koma": "chu2-kagaku-31", "t": "num", "q": "銅の質量と加熱後の物質の質量の表がある。銅0.40 gは加熱後0.50 gになった。このとき結び付いた酸素は何gか。", "ans": 0.1, "unit": "g", "tol": 0.005, "ex": "0.50−0.40＝0.10 g。増えた分が結び付いた酸素。", "kind": "calc", "level": 1, "fig": null}, {"id": "chu2-hirei-seiza-q013", "koma": "chu2-kagaku-31", "t": "choice", "q": "銅の質量（横軸）と、できた酸化銅の質量（縦軸）のグラフの形として正しいものはどれか。", "choices": ["原点を通る直線", "横軸に平行な直線", "途中から横ばいになる線", "原点を通らない直線"], "ex": "酸化銅＝銅＋酸素で、銅：酸化銅＝4：5。これも比例なので原点を通る直線になる。", "kind": "graph", "level": 3, "fig": null}, {"id": "chu2-hirei-seiza-q014", "koma": "chu2-kagaku-31", "t": "order", "q": "金属の質量と結び付く酸素の質量の関係を、グラフから見いだす手順を正しい順に並べよう。", "items": ["金属の質量を変えて、反応しきるまで加熱して測る", "結び付いた酸素の質量を計算する", "横軸に金属の質量、縦軸に酸素の質量をとって点を打つ", "点のばらつきの真ん中を通る線を引く", "線の形から、関係を読み取る"], "ex": "測定→計算→点を打つ→線を引く→関係を読む。", "kind": "method", "level": 2, "fig": null}, {"id": "chu2-hirei-seiza-q015", "koma": "chu2-kagaku-31", "t": "num", "q": "ステンレス皿だけの質量は12.30 g、皿に銅をのせると12.70 g、質量が変わらなくなるまで加熱して冷ますと12.80 gだった。銅に結び付いた酸素は何gか。", "ans": 0.1, "unit": "g", "tol": 0.005, "ex": "加熱後12.80 − 加熱前12.70 ＝ 0.10 g。皿の質量は前後で同じなので、差がそのまま結び付いた酸素。", "kind": "calc", "level": 2, "fig": null}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  };

 if((e.key===' '||e.key==='Enter')&&KB.on){e.preventDefault();KB.on=false;S.cur.lastX=KB.x;fireAt(KB.x,KB.y)}});

function finishMain(){S.cleared=1;S.cur=null;save();scene='clear';BGKEY='';petals(80);SFX.fanfare();if(window.Zukan&&Zukan.mainClear){try{Zukan.mainClear({onClose:function(){scene='clear'}})}catch(e){}}}
function onBack(){AU.init();
 if(scene==='title'){try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}return}
 var t=scene==='test'?'確認テストをやめて、タイトルにもどる？<small>テストは次はさいしょから。星座の帳は保存されています。</small>':'タイトルにもどる？<small>進み具合は保存されます。「つづきから」で、この夜の続きから遊べます。</small>';
 dialog(t,[['つづける',null],['もどる',function(){AIM=FLY=STROKE=null;save();toTitle()},1]])}
function dialog(html,btns){$('dlgT').innerHTML=html;var R=$('dlgR');R.innerHTML='';btns.forEach(function(b){var el=document.createElement('button');el.className='pbtn'+(b[2]?' go':'');el.textContent=b[0];
 el.onclick=function(){$('dlg').classList.add('hidden');if(b[1])b[1]()};R.appendChild(el)});$('dlg').classList.remove('hidden')}

/* ================= 確認テスト ================= */
var TQ=[],TA=[],TI=0;
function startTest(){scene='test';hideAll();$('test').classList.remove('hidden');TQ=window.Quiz?Quiz.test():[];TA=[];TI=0;
 if(!$('tBack')){var b=document.createElement('button');b.id='tBack';b.className='pbtn';b.style.minWidth='0';b.textContent='◀ もどる';b.onclick=onBack;$('test').querySelector('.top').insertBefore(b,$('test').querySelector('.ttl'))}
 showQ()}
function showQ(){var q=TQ[TI];if(!q){finishTest();return}$('test').scrollTop=0;
 $('tNo').textContent=(TI+1)+' / '+TQ.length;$('tQ').textContent=q.q;$('tFig').innerHTML=q.fig||'';$('tFb').innerHTML='';var Ad=$('tA');Ad.innerHTML='';Ad.className=q.t==='choice'?'ch':'';
 if(q.t==='choice'){q.shown.forEach(function(c){var b=document.createElement('button');b.className='tag';b.textContent=c;b.onclick=function(){answer(c,b)};Ad.appendChild(b)})}
 else if(q.t==='num'){var row=document.createElement('div');row.className='numrow';row.innerHTML='<input id="numIn" inputmode="decimal" autocomplete="off"><span style="font-size:19px">'+esc(q.unit||'')+'</span>';
  var b=document.createElement('button');b.className='pbtn go';b.textContent='けってい';row.appendChild(b);Ad.appendChild(row);b.onclick=function(){var v=$('numIn').value.trim();if(!v)return;answer(v)}}
 else if(q.t==='order'){var sel=[],box=document.createElement('div');box.className='ord';Ad.appendChild(box);var btns=[];
  q.shown.forEach(function(c){var bt=document.createElement('button');bt.className='tag';bt.textContent=c;bt.onclick=function(){if(bt.classList.contains('pickd'))return;sel.push(c);bt.classList.add('pickd');
   var d=document.createElement('div');d.textContent=sel.length+'. '+c;box.appendChild(d);if(sel.length===q.shown.length)answer(sel.slice())};Ad.appendChild(bt);btns.push(bt)});
  var rs=document.createElement('button');rs.className='pbtn';rs.textContent='やり直す';rs.onclick=function(){sel=[];box.innerHTML='';btns.forEach(function(x){x.classList.remove('pickd')})};Ad.appendChild(rs)}}
function answer(v,btn2){var q=TQ[TI];if(TA[TI]!==undefined)return;TA[TI]=v;var ok=Quiz.check(q,v);AU.init();if(ok)SFX.hit(2);else SFX.miss();
 [].forEach.call($('tA').querySelectorAll('button,input'),function(b){b.disabled=true;if(q.t==='choice'&&b.textContent===q.choices[0])b.classList.add('ok')});
 if(btn2&&!ok)btn2.classList.add('ng');
 $('tFb').innerHTML='<span class="mk">'+(ok?'◎':'×')+'</span>'+(ok?'正解':'正解は「'+esc(Quiz.answer(q))+'」')+'<span class="ex">'+esc(q.ex||'')+'</span>';
 var nx=document.createElement('button');nx.className='pbtn go';nx.textContent=TI+1<TQ.length?'つぎへ':'結果を見る';nx.style.marginTop='12px';nx.onclick=function(){TI++;showQ()};
 $('tFb').appendChild(document.createElement('br'));$('tFb').appendChild(nx);setTimeout(function(){try{nx.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'})}catch(e){}},50)}
function finishTest(){var qs=TQ,review=Quiz.review(qs,TA),marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length;
 var sv=S||load(),nm=(NAME||(sv&&sv.name)||'').trim();
 var gold=sv?sv.res.filter(function(r){return r&&r.gold}).length:0;
 var recs=TEST?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(sv?sv.t:0)],['一発で刺さった星',(sv?sv.firsts:0)+' / '+(sv?sv.shots:0)+' 発'],['金彩の皿',gold+' / '+NIGHTS.length+' 枚'],['封印した予想',sv&&sv.sealCmp?(sv.sealCmp.hit?'的中（原点を通る直線）':'ズレ → 比例を発見'):'―']];
 SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　化学変化と原子・分子　第31回',game:'比例の星座 ～金属と酸素の質量のグラフ～'+(TEST?'（確認テストのみ）':''),
  name:nm,score:score,total:qs.length,marks:marks,records:recs,review:review},function(){if(TEST)startTest();else{$('test').classList.add('hidden');scene=S&&S.cleared?'clear':'shelf';BGKEY=''}})}

var last=performance.now(),saveT=0;
function frame(t){var dt=Math.min(.05,(t-last)/1000);last=t;TT+=dt;HIT=[];
 if(S&&(scene==='play'||scene==='seal'))S.t+=dt;
 if(SHK>0)SHK=Math.max(0,SHK-dt*1.8);if(FLASH>0)FLASH=Math.max(0,FLASH-dt*1.5);if(MSG.life>0)MSG.life-=dt;
 BGM.tick(dt);
 ctx.save();if(SHK>0&&!RM){var a=SHK*14;ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a)}
 if(scene==='title')drawPoster(dt);else if(scene==='shelf')drawShelf(dt);else if(scene==='seal'&&SEALS)drawSealScene(dt);else if(scene==='play'&&S&&S.cur)drawPlay(dt);else if(scene==='clear')drawClear(dt);else if(scene==='test'){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H)}
 drawFX(dt);drawEV(dt);ctx.restore();
 if(FLASH>0){ctx.save();ctx.globalAlpha=Math.min(.7,FLASH);ctx.fillStyle=FLASHC;ctx.fillRect(0,0,W,H);ctx.restore()}
 saveT+=dt;if(saveT>5){saveT=0;if(scene==='play')save()}
 requestAnimationFrame(frame)}
