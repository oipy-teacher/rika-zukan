<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="中2理科">
<meta name="theme-color" content="#11162e">
<title>中2理科</title>
<style>
:root{--ink:#11162e;--ink2:#1a2143;--paper:#fffdf8;--red:#e8384f;--blue:#2a55c9;--gold:#ffd76a;--mint:#5fe0a8;--line:rgba(255,255,255,.16);--dim:rgba(255,255,255,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;color:#fff;background:var(--ink);min-height:100vh;
 background-image:radial-gradient(700px 500px at 0% 0%,rgba(232,56,79,.24),transparent 60%),radial-gradient(800px 600px at 100% 100%,rgba(42,85,201,.3),transparent 60%);
 background-attachment:fixed;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.wrap{width:min(100%,860px);margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 60px max(12px,env(safe-area-inset-left))}
header{display:flex;align-items:flex-end;gap:10px 14px;flex-wrap:wrap;margin-bottom:12px}
.logo small{display:block;font-size:12px;letter-spacing:.25em;color:var(--dim)}
.logo h1{margin:2px 0 0;font-size:clamp(26px,7vw,40px);letter-spacing:.05em;line-height:1.15}
.namebox{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:6px 10px;flex:1 1 220px;max-width:340px}
.namebox label{font-size:13px;color:var(--dim);white-space:nowrap}
.namebox input{font:inherit;font-size:17px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;width:100%;min-width:0;height:42px}
.namebox.warn{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,106,.35)}

/* 達成率 */
.stat{border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--line);padding:14px 14px 12px}
.stat .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.stat .big{font-size:15px;font-weight:700}
.stat .big b{font-size:40px;line-height:1;font-weight:900;letter-spacing:.02em;margin:0 2px}
.stat .big i{font-style:normal;font-size:18px;color:var(--dim);font-weight:700}
.stat .delta{background:var(--mint);color:#063;border-radius:999px;padding:2px 10px;font-weight:900;font-size:15px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.stat .pubn{font-size:13px;color:var(--dim);margin-left:auto}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.bars{display:grid;gap:7px;margin:12px 0 8px}
.bar{display:grid;grid-template-columns:3.2em 1fr 3.8em;align-items:center;gap:8px;font-size:14px;font-weight:700}
.bar .tr{height:12px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;position:relative}
.bar .tr i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--uc);transition:width .8s ease}
.bar .tr s{position:absolute;inset:0 auto 0 0;border-radius:999px;background:rgba(255,255,255,.14);text-decoration:none}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.bar .n b{color:#fff}
.stat .sub{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--dim)}
.stat .sub b{color:#fff;font-size:17px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.quick button{min-height:54px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:800;font-size:14px;line-height:1.25;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.quick button span{font-size:22px;line-height:1}
.quick .teiki{grid-column:1/-1;flex-direction:row;gap:12px;min-height:62px;font-size:19px;background:linear-gradient(180deg,#ffcf4a,#e39a00);color:#3a2300;border:0;box-shadow:0 6px 0 #9c6400,0 10px 24px rgba(0,0,0,.35);position:relative;overflow:hidden}
.quick .teiki span{font-size:30px}
.quick .teiki small{display:block;font-size:12px;font-weight:700;opacity:.8}
.quick .teiki::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.quick .teiki:active{transform:translateY(4px);box-shadow:0 2px 0 #9c6400}
.quick button[hidden]{display:none}

/* アプデ履歴 */
.upd{margin-top:12px;border-radius:16px;background:rgba(255,215,106,.08);border:1px solid rgba(255,215,106,.35);padding:10px 14px}
.upd h3{margin:0 0 6px;font-size:14px;color:var(--gold);display:flex;align-items:center;gap:8px}
.upd h3 button{margin-left:auto;font-size:13px;color:var(--gold);text-decoration:underline;min-height:32px}
.upd li{font-size:14px;line-height:1.6;margin:2px 0}
.upd ul{margin:0;padding-left:1.1em}
.upd .idea{margin-top:6px;font-size:13px}

/* 単元タブ */
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px -12px 0;padding:8px 12px;background:rgba(17,22,46,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tabs button{min-height:48px;border-radius:12px;font-weight:900;font-size:16px;background:rgba(255,255,255,.07);border:2px solid transparent;line-height:1.1}
.tabs button small{display:block;font-size:11px;font-weight:700;color:var(--dim);margin-top:2px}
.tabs button[aria-selected=true]{background:var(--uc);border-color:rgba(255,255,255,.6);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tabs button[aria-selected=true] small{color:rgba(255,255,255,.85)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.tools label{display:flex;align-items:center;gap:6px;font-size:14px;min-height:40px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.06)}
.tools input{width:20px;height:20px;accent-color:var(--gold)}
.cont{margin-left:auto;min-height:40px;padding:0 14px;border-radius:999px;background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont[hidden]{display:none}

/* 一覧 */
.grp{margin:16px 0 6px;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--dim);display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grp b{color:#fff;font-weight:800}
.row{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;padding:10px 10px 10px 8px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:8px;position:relative;overflow:hidden}
.row::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--gc)}
.row .no{grid-row:1/span 3;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px}
.row .no b{font-size:24px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.row .no small{font-size:10px;color:var(--dim);margin-top:2px}
.row .no .em{font-size:22px;margin-top:6px;line-height:1}
.row .tt{font-size:17px;font-weight:900;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.row .tt small{display:block;font-size:13px;font-weight:700;color:var(--dim)}
.row .where{font-size:12px;color:var(--gold);margin-top:2px;font-weight:700}
.row .info{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:2px 9px;font-weight:800;font-size:12px;line-height:1.5;border:1px solid transparent;white-space:nowrap}
.chip.role{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.85)}
.chip.role.yosou{border-color:#ffb86b;color:#ffcf99}
.chip.m-main{background:#2a55c9;color:#fff}
.chip.m-pass{background:#1f9e62;color:#fff}
.chip.m-full{background:var(--gold);color:#4a3200}
.chip.none{color:var(--dim)}
.chip.beta{background:#fff;color:var(--ink);font-family:Georgia,serif;font-style:italic}
.chip.upd{background:rgba(255,215,106,.18);color:var(--gold)}
.chip.idea{background:rgba(95,224,168,.18);color:var(--mint)}
.chip.prep{background:rgba(255,255,255,.1);color:var(--dim)}
.row .btns{grid-column:2;display:flex;gap:8px;margin-top:4px}
.row .btns button{flex:1;min-height:44px;border-radius:12px;font-weight:900;font-size:15px}
.row .btns .play{background:var(--gc);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.row .btns .test{background:var(--paper);color:var(--ink)}
.row .btns .voice{flex:0 0 auto;padding:0 10px;background:rgba(255,255,255,.08);font-size:12px;font-weight:700}
.row.draft{background:rgba(255,255,255,.025);border-style:dashed;color:rgba(255,255,255,.5)}
.row.draft::before{background:rgba(255,255,255,.18)}
.row.draft .tt small{color:rgba(255,255,255,.38)}
.row.draft .em{filter:grayscale(1);opacity:.5}
.row.draft{padding:7px 10px 7px 8px;margin-bottom:6px;gap:2px 10px}
.row.draft .no small,.row.draft .no .em{display:none}
.row.draft .no{grid-row:1/span 2}
.row.draft .no b{font-size:18px}
.row.draft .tt{font-size:14px}
.row.draft .tt small{display:inline;font-size:12px;margin-left:4px}
.row.draft .chip{font-size:11px;padding:0 7px}
.row.hit{animation:hit 1.6s ease}
@keyframes hit{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.empty{color:var(--dim);font-size:14px;padding:14px;text-align:center}
.note{font-size:12px;color:var(--dim);line-height:1.8;margin-top:26px}
.special{display:flex;align-items:center;gap:10px}
@media (min-width:640px){
 .row{grid-template-columns:52px 1fr auto;align-items:center}
 .row .no{grid-row:1/span 2}
 .row .btns{grid-column:3;grid-row:1/span 2;margin:0;flex-direction:column;min-width:150px}
 .row .btns button{min-height:40px}
 .quick{grid-template-columns:repeat(5,1fr)}
 .quick .teiki{grid-column:1/-1}
}

/* 再生 */
#player{position:fixed;inset:0;z-index:1000;background:#000;display:none}
#player.on{display:block}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#menuBtn{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));z-index:1001;display:none;padding:8px 14px;min-height:40px;border-radius:999px;background:rgba(17,22,46,.72);border:1px solid rgba(255,255,255,.4);font-size:14px;font-weight:700}
#menuBtn.on{display:block}

/* ダイアログ */
.dlg{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:fade .2s}
@media (min-width:640px){.dlg{align-items:center}}
@keyframes fade{from{opacity:0}}
.dlg .box{background:var(--paper);color:var(--ink);border-radius:20px;padding:18px 18px 16px;width:min(100%,560px);max-height:88vh;overflow:auto;font-size:16px;line-height:1.7;animation:up .25s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.dlg h3{margin:0 0 8px;font-size:19px}
.dlg .row2{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.dlg .row2 button{min-height:44px;padding:0 18px;border-radius:999px;font-weight:800;border:2px solid var(--ink)}
.dlg .row2 .go{background:var(--ink);color:#fff}
.dlg small{color:#5b6380}
.dlg textarea{width:100%;min-height:110px;font:inherit;font-size:13px;border-radius:12px;border:2px solid #c9cfdd;padding:10px;word-break:break-all}
.dlg .recs{display:flex;flex-direction:column;gap:8px}
.dlg .rec{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#eef1f8;text-align:left;width:100%;min-height:52px}
.dlg .rec .sc{font-weight:900;font-size:20px;color:var(--red);min-width:66px}
.dlg .rec .gm{flex:1;font-size:14px;line-height:1.4}
.dlg .rec .gm small{display:block}
.dlg ul{padding-left:1.2em;margin:6px 0}
.dlg li{margin:4px 0;font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><small>中学2年 理科</small><h1>中2理科</h1></div>
    <div class="namebox" id="nb"><label for="nm">なまえ</label><input id="nm" maxlength="24" placeholder="出席番号となまえ" autocomplete="off"></div>
  </header>

  <section class="stat" id="stat" aria-label="達成率"></section>
  <section class="upd" id="upd" hidden></section>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="tools">
    <label><input type="checkbox" id="onlyNot"> 未合格だけ</label>
    <button class="cont" id="cont" hidden></button>
  </div>
  <div id="list"></div>

  <div class="note" id="note">
    ・「▶ あそぶ」はゲーム本編から。最後に確認テストがあります。「📝 テストだけ」は復習用で、すぐ確認テストを受けられます。<br>
    ・確認テストで7割以上とると「合格」。上の「合格」の数がふえていきます。<br>
    ・テストが終わると「提出カード」が出ます。その画面をスクリーンショットして提出しよう。<br>
    ・<span id="privacy">記録はこの端末のブラウザの中だけに保存されます（どこにも送信しません）。</span><br>
    ・ホーム画面に追加して使うと、記録が消えにくくなります。念のため「🔑 ふっかつのじゅもん」で記録のひかえも作れます。
  </div>
</div>

<div id="player"></div>
<button id="menuBtn">≡ メニュー</button>

<script>/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();
</script>

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  });

}

  var C=window.ZUKAN_CARDS;if(!C||!C.cards||C.grade!==GRADE)return null;
  var d=lsGet('rika-zukan:'+GRADE+':zukan:v1')||{};var own=d.cards||{};
  return {owned:C.cards.filter(function(c){return own[c.id]}).length,total:C.cards.length};
}

/* ---------- 達成率 ---------- */
var cur=null, baseSeen=null;
function renderStat(M){
  var total=KOMA.length, pub=KOMA.filter(function(k){return k.status==='public'}).length;
  var pass=KOMA.filter(function(k){return M[k.id]&&M[k.id].pass}).length;
  var full=KOMA.filter(function(k){return M[k.id]&&M[k.id].full}).length;
  var main=KOMA.filter(function(k){return M[k.id]&&M[k.id].main}).length;
  var p=profile();p.seen=p.seen||{};
  if(baseSeen===null)baseSeen=p.seen[GRADE]==null?pass:p.seen[GRADE];
  if(p.seen[GRADE]!==pass){p.seen[GRADE]=pass;p.v=p.v||1;lsSet(PKEY,p)}
  var d=pass-baseSeen;
  var h='<div class="top"><div class="big">合格 <b>'+pass+'</b><i>/ '+total+'</i></div>'+(d>0?'<span class="delta">+'+d+'</span>':'')+
    '<span class="pubn">公開中 '+pub+'コマ</span></div>';
  if(UNITS.length>1){
    h+='<div class="bars">'+UNITS.map(function(u){
      var ks=KOMA.filter(function(k){return k.unit===u.id});
      var up=ks.filter(function(k){return M[k.id]&&M[k.id].pass}).length, pp=ks.filter(function(k){return k.status==='public'}).length;
      return '<div class="bar" style="--uc:'+u.color+'"><span>'+esc(u.short||u.name)+'</span><span class="tr"><s style="width:'+(pp/ks.length*100)+'%"></s><i style="width:'+(up/ks.length*100)+'%"></i></span><span class="n"><b>'+up+'</b>/'+ks.length+'</span></div>'}).join('')+'</div>';
  }
  var zc=HUB.features.zukan?zukanCount():null;
  h+='<div class="sub">'+(zc?'<span>📖 図鑑 <b>'+zc.owned+'</b> / '+zc.total+'</span>':'')+'<span>✨ 満点 <b>'+full+'</b></span><span>🏁 本編クリア <b>'+main+'</b></span></div>';
  var z=Z(),hasZ=HUB.features.zukan&&z;
  var q=[];
  if(HUB.features.teiki&&SPECIAL['teiki-taisaku']&&SPECIAL['teiki-taisaku'].status==='public')
    q.push('<button class="teiki" data-q="teiki"><span>🏆</span><div>定期テスト対策<small>範囲をえらんで ×を特訓 → ボスラッシュ</small></div></button>');
  if(hasZ&&z.openBook)q.push('<button data-q="book"><span>📖</span>図鑑</button>');
  if(hasZ&&z.openGacha)q.push('<button data-q="gacha"><span>🔮</span>ガチャ</button>');
  if(hasZ&&z.openExchange)q.push('<button data-q="ex"><span>🔁</span>交換所</button>');
  q.push('<button data-q="recs"><span>📝</span>提出カードの記録</button>');
  q.push('<button data-q="spell"><span>🔑</span>ふっかつの<br>じゅもん</button>');
  h+='<div class="quick">'+q.join('')+'</div>';
  el('stat').innerHTML=h;
}
el('stat').addEventListener('click',function(e){
  var b=e.target.closest('[data-q]');if(!b)return;var z=Z(),a=b.dataset.q;
  try{
    if(a==='teiki')launch('teiki-taisaku','play');
    else if(a==='book')z.openBook({unit:cur});
    else if(a==='gacha')z.openGacha({box:cur});
    else if(a==='ex')z.openExchange();
    else if(a==='recs')openRecords();
    else if(a==='spell')openSpell();
  }catch(err){console.error(err)}
});

/* ---------- みんなの声で変わったこと ---------- */
function updates(){
  var U=window.ZUKAN_UPDATES;var a=(U&&U.updates)||[];
  return a.filter(function(u){return u&&u.game&&u.game.indexOf(GRADE+'/')===0&&BYGAME[u.game.slice(GRADE.length+1)]})
    .sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:0});
}
function jdate(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?(+m[1])+'年'+(+m[2])+'月'+(+m[3])+'日':esc(s)}
function updText(u){
  var g=u.game.slice(GRADE.length+1),k=BYGAME[g][0];
  var head='第'+k.no+'回『'+esc(k.title)+'』';
  return u.kind==='idea'?head+'は、みんなのアイデア『'+esc(u.voice)+'』から生まれました（'+jdate(u.date)+'）'
    :head+'は『'+esc(u.voice)+'』という声でアプデされました（'+jdate(u.date)+'）';
}
function renderUpd(){
  var us=updates();if(!us.length){el('upd').hidden=true;return}
  var ideas=us.filter(function(u){return u.kind==='idea'});
  el('upd').hidden=false;
  el('upd').innerHTML='<h3>📣 みんなの声で変わったこと'+(us.length>3?'<button data-u="all">もっと見る ›</button>':'')+'</h3><ul>'+
    us.slice(0,3).map(function(u){return '<li>'+updText(u)+'</li>'}).join('')+'</ul>'+
    (ideas.length?'<div class="idea"><button data-u="idea" style="color:var(--mint);text-decoration:underline;min-height:32px">💡 みんなのアイデアから生まれたゲーム（'+ideas.length+'本） ›</button></div>':'');
}
el('upd').addEventListener('click',function(e){var b=e.target.closest('[data-u]');if(!b)return;
  var us=updates();if(b.dataset.u==='idea')us=us.filter(function(u){return u.kind==='idea'});
  dialog('<h3>'+(b.dataset.u==='idea'?'💡 みんなのアイデアから生まれたゲーム':'📣 みんなの声で変わったこと')+'</h3><ul>'+us.map(function(u){return '<li>'+updText(u)+(u.change?'<br><small>→ '+esc(u.change)+'</small>':'')+'</li>'}).join('')+'</ul>',[['とじる']]);
});
function updCount(game){return updates().filter(function(u){return u.game===GRADE+'/'+game&&u.kind!=='idea'}).length}
function isIdea(game){return updates().some(function(u){return u.game===GRADE+'/'+game&&u.kind==='idea'})}

/* ---------- 単元タブと一覧 ---------- */
function renderTabs(M){
  el('tabs').innerHTML=UNITS.length>1?UNITS.map(function(u){
    var ks=KOMA.filter(function(k){return k.unit===u.id}),p=ks.filter(function(k){return M[k.id]&&M[k.id].pass}).length;
    return '<button role="tab" style="--uc:'+u.color+'" aria-selected="'+(u.id===cur)+'" data-u="'+u.id+'">'+esc(u.short||u.name)+'<small>'+p+'/'+ks.length+'</small></button>'}).join(''):'';
  el('tabs').style.display=UNITS.length>1?'':'none';
}
el('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-u]');if(!b)return;cur=b.dataset.u;render();window.scrollTo({top:el('tabs').offsetTop-4+(el('tabs').getBoundingClientRect().top<0?0:0),behavior:'smooth'})});
el('onlyNot').addEventListener('change',function(){render()});

function rowHTML(k,M){
  var m=M[k.id]||{},pub=k.status==='public';
  var chips=[];
  if(k.role&&k.role!=='なし')chips.push('<span class="chip role'+(k.role.indexOf('予想')===0?' yosou':'')+'">'+esc(k.role.replace('用',''))+'</span>');
  if(!pub)chips.push('<span class="chip prep">じゅんび中</span>');
  else{
    var got=[];
    if(m.main)got.push('<span class="chip m-main">🏁 本編</span>');
    if(m.pass)got.push('<span class="chip m-pass">✔ 合格</span>');
    if(m.full)got.push('<span class="chip m-full">★ 満点</span>');
    chips.push(got.length?got.join(''):'<span class="chip none">―</span>');
    if(k.beta)chips.push('<span class="chip beta">β</span>');
    var uc=updCount(k.game);if(uc)chips.push('<span class="chip upd">アプデ'+uc+'回</span>');
    if(isIdea(k.game))chips.push('<span class="chip idea">みんなのアイデアから生まれた</span>');
  }
  var multi=(BYGAME[k.game]||[]).length>1;
  var h='<div class="row'+(pub?'':' draft')+'" id="r-'+k.id+'" style="--gc:'+(pub?(k.color||unitOf(k.unit).color):'#666')+'">'+
    '<div class="no"><b>'+k.no+'</b><small>回</small><span class="em">'+(k.emoji||'')+'</span></div>'+
    '<div class="tt">'+esc(k.title)+(k.sub?'<small>'+esc(k.sub)+'</small>':'')+
      (multi&&k.stage?'<div class="where">📍 '+esc(k.stage)+'</div>':'')+'</div>'+
    '<div class="info">'+chips.join('')+'</div>';
  if(pub){
    h+='<div class="btns"><button class="play" data-g="'+k.game+'" data-k="'+k.id+'" data-m="play">▶ あそぶ</button><button class="test" data-g="'+k.game+'" data-k="'+k.id+'" data-m="test">📝 テストだけ</button>'+
      (window.Voice&&Voice.ask?'<button class="voice" data-v="'+k.game+'" aria-label="感想を送る">感想</button>':'')+'</div>';
  }
  return h+'</div>';
}
function render(){
  var M=marks();
  renderStat(M);renderTabs(M);renderUpd();
  var only=el('onlyNot').checked;
  var u=unitOf(cur),html='';
  (u.groups||[{name:'',koma:KOMA.filter(function(k){return k.unit===u.id}).map(function(k){return k.no})}]).forEach(function(g){
    var ks=g.koma.map(function(no){return KOMA.filter(function(k){return k.unit===u.id&&k.no===no})[0]}).filter(Boolean);
    if(only)ks=ks.filter(function(k){return !(M[k.id]&&M[k.id].pass)});
    if(!ks.length)return;
    if(g.name)html+='<div class="grp"><b>'+esc(g.name)+'</b></div>';
    html+=ks.map(function(k){return rowHTML(k,M)}).join('');
  });
  el('list').innerHTML=html||'<div class="empty">'+(only?'この単元は全部合格！ 🎉':'まだゲームがありません')+'</div>';
  var lk=lastKoma(M);
  if(lk&&lk.status==='public'){el('cont').hidden=false;el('cont').textContent='▶ つづきから：第'+lk.no+'回 '+lk.title;el('cont').dataset.k=lk.id}
  else el('cont').hidden=true;
}
el('cont').addEventListener('click',function(){var k=BYID[el('cont').dataset.k];if(!k)return;if(k.unit!==cur){cur=k.unit;render()}launch(k.game,'play',k.id)});
el('list').addEventListener('click',function(e){
  var v=e.target.closest('[data-v]');if(v){try{Voice.ask(GRADE+'/'+v.dataset.v)}catch(err){}return}
  var b=e.target.closest('[data-g]');if(b)launch(b.dataset.g,b.dataset.m,b.dataset.k);
});

/* ---------- ゲームを開く（iframe srcdoc：保存場所を共有する） ---------- */
function launch(id,mode,kid){
  var name=getName();
  if(mode==='test'&&!name){el('nb').classList.add('warn');el('nm').focus();el('nm').placeholder='← なまえを入れてね';window.scrollTo({top:0,behavior:'smooth'});return}
  var ks=(BYGAME[id]||[]).map(function(k){return k.id});
  if(kid&&ks.indexOf(kid)>0){ks.splice(ks.indexOf(kid),1);ks.unshift(kid)}
  var boot='<script>window.GAME_MODE='+JSON.stringify(mode==='test'?'test':'')+';window.PLAYER_NAME='+JSON.stringify(name)+
    ';window.COLLECTION_NAME='+JSON.stringify(HUB.collection)+';window.GRADE='+JSON.stringify(GRADE)+';window.KOMA='+JSON.stringify(ks)+';<\/script>';
  var go=function(src){
    var html=/<head[^>]*>/i.test(src)?src.replace(/<head([^>]*)>/i,function(m){return m+boot}):boot+src;
    var f=document.createElement('iframe');f.setAttribute('title','ゲーム');f.setAttribute('allow','autoplay; fullscreen');f.srcdoc=html;
    el('player').innerHTML='';el('player').appendChild(f);el('player').classList.add('on');el('menuBtn').classList.add('on');
    document.body.style.overflow='hidden';
  };
  if(SRC[id]){go(SRC[id]);return}
  fetch(id+'/index.html',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()})
    .then(go).catch(function(){dialog('ゲームを読みこめませんでした。<br>通信を確認して、もう一度おしてください。',[['とじる']])});
}
function closeGame(){el('player').innerHTML='';el('player').classList.remove('on');el('menuBtn').classList.remove('on');document.body.style.overflow='';render()}
el('menuBtn').onclick=function(){
  dialog('メニューにもどりますか？<br><small>セーブのないゲームは、次は最初からになります。提出カードは記録に残ります。</small>',[['つづける'],['もどる',closeGame,1]]);
};
window.addEventListener('message',function(e){
  var d=e.data;if(!d||typeof d!=='object')return;
  if(d.type==='submit-card'&&d.rec){mem.push(d.rec)}
  if(d.type==='rika-open-game'&&d.game&&(BYGAME[d.game]||SPECIAL[d.game])){closeGame();launch(d.game,d.mode==='test'?'test':'play')}
  if(d.type==='rika-close-game'){closeGame()}
});

/* ---------- ダイアログ ---------- */
function dialog(html,btns){
  var d=document.createElement('div');d.className='dlg';
  d.innerHTML='<div class="box" role="dialog">'+html+'<div class="row2">'+(btns||[]).map(function(b,i){return '<button data-i="'+i+'"'+(b[2]?' class="go"':'')+'>'+b[0]+'</button>'}).join('')+'</div></div>';
  d.addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(e.target===d||b){var f=b&&btns[+b.dataset.i][1];if(!(f&&f(d)===false))d.remove()}});
  document.body.appendChild(d);return d;
}

/* ---------- 提出カードの記録（学年とコマIDで絞る） ---------- */
function fmt(ms){var d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function openRecords(){
  var rs=records();
  var d=dialog('<h3>📝 提出カードの記録（この端末）</h3>'+(rs.length?'<div class="recs">'+rs.map(function(r,i){
    var k=r.koma&&r.koma[0]&&BYID[r.koma[0]];
    return '<button class="rec" data-r="'+i+'"><span class="sc">'+r.score+' / '+r.total+'</span><span class="gm">'+(k?'第'+k.no+'回 ':'')+esc(r.game)+'<small>'+fmt(r.at)+'　'+esc(r.name||'')+'</small></span><span>📝</span></button>'}).join('')+'</div>'
    :'<p>まだ記録はありません。確認テストを受けると、ここに提出カードが残ります。</p>'),[['とじる']]);
  d.querySelectorAll('.rec').forEach(function(b){b.onclick=function(){d.remove();SubmitCard.reopen(rs[+b.dataset.r])}});
}

/* ---------- ふっかつのじゅもん（記録のひかえ） ---------- */
var SPELL_KEYS=/^(rika-zukan:|mini-collection-|jewel-atelier-)/;
function b64(u8){var s='';for(var i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function unb64(t){var s=atob(t),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function pipe(u8,Stream){return new Response(new Blob([u8]).stream().pipeThrough(new Stream('deflate-raw'))).arrayBuffer().then(function(b){return new Uint8Array(b)})}
function makeSpell(){
  var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(SPELL_KEYS.test(k))o[k]=localStorage.getItem(k)}
  var u8=new TextEncoder().encode(JSON.stringify({v:1,at:Date.now(),d:o}));
  if(window.CompressionStream)return pipe(u8,CompressionStream).then(function(z){return 'RZ1.'+b64(z)}).catch(function(){return 'RZ0.'+b64(u8)});
  return Promise.resolve('RZ0.'+b64(u8));
}
function readSpell(t){
  t=String(t||'').replace(/\s+/g,'');var m=/^RZ([01])\.([A-Za-z0-9+/=]+)$/.exec(t);if(!m)return Promise.reject('形');
  var u8=unb64(m[2]);
  var p=m[1]==='1'?(window.DecompressionStream?pipe(u8,DecompressionStream):Promise.reject('この端末では読めません')):Promise.resolve(u8);
  return p.then(function(b){var j=JSON.parse(new TextDecoder().decode(b));if(!j||!j.d)throw '中身';return j});
}
function openSpell(){
  var z=Z();
  if(z&&(z.openSpell||z.openBackup)){try{(z.openSpell||z.openBackup)();return}catch(e){}}
  var d=dialog('<h3>🔑 ふっかつのじゅもん</h3><p style="margin:0 0 8px">図鑑・合格の記録・提出カードを、この長い「じゅもん」にしてひかえておけます。記録が消えたら、ここに貼りつけて元にもどせます。<br><small>じゅもんは自分だけで持っておこう（人に見せると、その人の端末にあなたの記録が入ってしまいます）。</small></p>'+
    '<textarea id="spT" readonly>つくっています…</textarea>'+
    '<div class="row2" style="justify-content:flex-start;margin-top:8px"><button id="spCopy">📋 コピー</button><button id="spSave">💾 ファイルに保存</button></div>'+
    '<hr style="border:0;border-top:1px solid #dde;margin:14px 0"><b>じゅもんで元にもどす</b><textarea id="spIn" placeholder="ここに じゅもん を貼りつける"></textarea>'+
    '<div class="row2" style="justify-content:flex-start;margin-top:8px"><button id="spFile">📂 ファイルから</button><button class="go" id="spGo">もとにもどす</button></div><input type="file" id="spF" accept=".txt,text/plain" hidden>',[['とじる']]);
  var spell='';
  makeSpell().then(function(s){spell=s;d.querySelector('#spT').value=s});
  d.querySelector('#spCopy').onclick=function(){var t=d.querySelector('#spT');t.select();try{navigator.clipboard.writeText(spell).then(function(){toast('コピーしました')},function(){document.execCommand('copy');toast('コピーしました')})}catch(e){document.execCommand('copy');toast('コピーしました')}};
  d.querySelector('#spSave').onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([spell],{type:'text/plain'}));var t=new Date();a.download='ふっかつのじゅもん_'+t.getFullYear()+(t.getMonth()+1)+t.getDate()+'.txt';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)};
  d.querySelector('#spFile').onclick=function(){d.querySelector('#spF').click()};
  d.querySelector('#spF').onchange=function(e){var f=e.target.files[0];if(!f)return;f.text().then(function(t){d.querySelector('#spIn').value=t})};
  d.querySelector('#spGo').onclick=function(){
    readSpell(d.querySelector('#spIn').value).then(function(j){
      var n=Object.keys(j.d).length;
      dialog('じゅもんの記録（'+new Date(j.at).toLocaleString()+' のひかえ・'+n+'件）で、この端末の記録を上書きします。いいですか？',[['やめる'],['上書きする',function(){
        Object.keys(j.d).forEach(function(k){if(SPELL_KEYS.test(k))try{localStorage.setItem(k,j.d[k])}catch(e){}});
        d.remove();location.reload();
      },1]]);
    }).catch(function(){toast('じゅもんが正しくありません。もう一度たしかめてね')});
  };
}
function toast(t){var s=document.createElement('div');s.textContent=t;s.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#11162e;color:#fff;padding:10px 18px;border-radius:999px;z-index:3000;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4)';document.body.appendChild(s);setTimeout(function(){s.remove()},1800)}

/* ---------- はじめに ---------- */
if(HUB.privacy)el('privacy').textContent=HUB.privacy;
(function(){
  var lk=lastKoma(marks());
  if(lk)cur=lk.unit;
  else{var fp=KOMA.filter(function(k){return k.status==='public'})[0];cur=fp?fp.unit:UNITS[0].id}
})();
render();
/* ---------- トップからの近道（#teiki・#zukan・#gacha・#g=ゲームID） ---------- */
(function(){
  var h='';try{h=decodeURIComponent((location.hash||'').slice(1))}catch(e){}
  if(!/^(teiki|zukan|gacha|g=[\w-]+)$/.test(h))return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  setTimeout(function(){try{
    var z=Z();
    if(h==='teiki'){if(HUB.features.teiki&&SPECIAL['teiki-taisaku'])launch('teiki-taisaku','play')}
    else if(h==='zukan'){if(z&&z.openBook)z.openBook({unit:cur})}
    else if(h==='gacha'){if(z&&z.openGacha)z.openGacha({box:cur})}
    else{var g=h.slice(2);if(BYGAME[g]&&BYGAME[g].some(function(k){return k.status==='public'})){cur=BYGAME[g][0].unit;render();launch(g,'play')}}
  }catch(err){console.error(err)}},0);
})();
window.addEventListener('pageshow',function(e){if(e.persisted)render()});
window.addEventListener('storage',function(){if(!el('player').classList.contains('on'))render()});
})();
