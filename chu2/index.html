<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中2理科 ミニゲーム集</title>
<style>
:root{--ink:#11162e;--paper:#fffdf8;--red:#e8384f;--blue:#2a55c9;--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;color:#fff;background:var(--ink);
 background-image:radial-gradient(700px 500px at 0% 0%,rgba(232,56,79,.28),transparent 60%),radial-gradient(800px 600px at 100% 100%,rgba(42,85,201,.35),transparent 60%);
 background-attachment:fixed;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #ffd76a;outline-offset:3px}
.wrap{width:min(100%,1040px);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 40px}
header{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.logo small{display:block;font-size:14px;letter-spacing:.3em;opacity:.7}
.logo h1{margin:2px 0 0;font-size:clamp(28px,5vw,44px);letter-spacing:.06em}
.namebox{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.namebox label{font-size:14px;opacity:.8}
.namebox input{font:inherit;font-size:18px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;width:min(60vw,240px)}
.namebox.warn{border-color:#ffd76a;box-shadow:0 0 0 3px rgba(255,215,106,.35)}
h2{font-size:15px;letter-spacing:.25em;opacity:.75;font-weight:700;margin:26px 0 10px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.game{border-radius:20px;padding:18px 18px 16px;background:rgba(255,255,255,.07);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.game::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--gc)}
.game .no{font-size:13px;opacity:.7;letter-spacing:.15em}
.game .tt{display:flex;align-items:center;gap:10px}
.game .em{font-size:38px;line-height:1}
.game .nm{font-size:22px;font-weight:900;line-height:1.25}
.game .nm small{display:block;font-size:14px;font-weight:700;opacity:.75}
.game .un{font-size:14px;background:rgba(255,255,255,.08);border-radius:8px;padding:6px 10px;line-height:1.5}
.game .ds{font-size:14px;opacity:.85;line-height:1.6}
.game .meta{font-size:13px;opacity:.7}
.game .btns{display:flex;gap:10px;margin-top:auto;padding-top:6px}
.game .btns button{flex:1;padding:12px 10px;border-radius:14px;font-weight:900;font-size:17px}
.play{background:var(--gc);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.test{background:var(--paper);color:var(--ink)}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);text-align:left;width:100%}
.rec .sc{font-weight:900;font-size:22px;color:#ff8a9a;min-width:74px}
.rec .gm{flex:1;font-size:14px;line-height:1.4}
.rec .gm small{display:block;opacity:.7}
.empty{opacity:.6;font-size:14px}
.note{font-size:13px;opacity:.6;line-height:1.7;margin-top:28px}
#player{position:fixed;inset:0;z-index:1000;background:#000;display:none}
#player.on{display:block}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#menuBtn{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:1001;display:none;padding:8px 14px;border-radius:999px;background:rgba(17,22,46,.72);border:1px solid rgba(255,255,255,.4);font-size:14px;font-weight:700}
#menuBtn.on{display:block}
.dlg{position:fixed;inset:0;z-index:1002;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg .box{background:var(--paper);color:var(--ink);border-radius:18px;padding:22px 24px;max-width:460px;font-size:17px;line-height:1.7}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.dlg .row button{padding:10px 18px;border-radius:999px;font-weight:700;border:2px solid var(--ink)}
.dlg .row .go{background:var(--ink);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><small>中学2年 理科</small><h1>中2理科 ミニゲーム集</h1></div>
    <div class="namebox" id="nb"><label for="nm">なまえ</label><input id="nm" maxlength="24" placeholder="出席番号となまえ"></div>
  </header>

  <h2>ゲーム</h2>
  <div class="games" id="games"></div>

  <h2>提出カードの記録（この端末）</h2>
  <div class="recs" id="recs"></div>

  <div class="note">
    ・「▶ あそぶ」はゲーム本編から。最後に確認テストがあります。<br>
    ・「📝 確認テストだけ」は復習用。ゲームをとばして、すぐに確認テストを受けられます。<br>
    ・テストが終わると「提出カード」が出ます。その画面をスクリーンショットして提出しよう。<br>
    ・記録はこの端末のブラウザの中だけに保存されます（どこにも送信しません）。
  </div>
</div>

<div id="player"></div>
<button id="menuBtn">≡ メニュー</button>

<script>/* ==========================================================
   提出カード（全ゲーム共通） v1
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+r.score+'</b><i>/ '+r.total+' 点</i></div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose()}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, name, score, total, marks:[bool], records:[[label,value]], review:[{q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose);return r;
    },
    reopen:open,
    all:load,
    KEY:KEY
  };
})();
</script>
<script>
(function(){
'use strict';
var COLLECTION={"name": "中2理科 ミニゲーム集"};
var GAMES=[{"id": "rika-busshitsu", "title": "げんしの勇者", "sub": "～物質の成り立ち～", "emoji": "⚔️", "color": "#c9a227", "style": "レトロRPG", "unit": "物質の成り立ち（分解・原子と分子）", "desc": "村人に話しかけて問題に答え、コインを集めて魔王ブンカインをたおす。", "tests": 10}, {"id": "jewel-atelier", "title": "ジュエル・アトリエ", "sub": "～ルビーとサファイアの山～", "emoji": "💎", "color": "#D7264F", "style": "錬金・ガチャ・登山", "unit": "物質の表し方（元素記号・周期表・化学式・化学反応式）", "desc": "錬金の依頼をこなしてジュエルのかけらを集め、元素の宝石を召喚しながら宝石の山の頂上をめざす。", "tests": 20}];
var SRC={};
var NKEY='mini-collection-player';
var mem=[];
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function getName(){return el('nm').value.trim()}
try{el('nm').value=localStorage.getItem(NKEY)||''}catch(e){}
el('nm').addEventListener('input',function(){el('nb').classList.remove('warn');try{localStorage.setItem(NKEY,getName())}catch(e){}});

function renderGames(){
  el('games').innerHTML=GAMES.map(function(g,i){
    return '<div class="game" style="--gc:'+g.color+'">'+
      '<div class="no">No.'+(i+1)+'　'+esc(g.style)+'</div>'+
      '<div class="tt"><span class="em">'+g.emoji+'</span><div class="nm">'+esc(g.title)+'<small>'+esc(g.sub)+'</small></div></div>'+
      '<div class="un">'+esc(g.unit)+'</div>'+
      '<div class="ds">'+esc(g.desc)+'</div>'+
      '<div class="meta">確認テスト '+g.tests+'問</div>'+
      '<div class="btns"><button class="play" data-g="'+g.id+'" data-m="play">▶ あそぶ</button><button class="test" data-g="'+g.id+'" data-m="test">📝 確認テストだけ</button></div>'+
    '</div>'}).join('');
}
function records(){
  var all=(window.SubmitCard?SubmitCard.all():[]).concat(mem);
  var seen={};return all.filter(function(r){var k=r.at+'|'+r.gameId;if(seen[k]||r.collection!==COLLECTION.name)return false;seen[k]=1;return true})
    .sort(function(a,b){return b.at-a.at});
}
function fmt(ms){var d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function renderRecs(){
  var rs=records().slice(0,12);
  el('recs').innerHTML=rs.length?rs.map(function(r,i){return '<button class="rec" data-r="'+i+'"><span class="sc">'+r.score+' / '+r.total+'</span><span class="gm">'+esc(r.game)+'<small>'+fmt(r.at)+'　'+esc(r.name||'')+'</small></span><span>📝</span></button>'}).join(''):'<div class="empty">まだ記録はありません。確認テストを受けると、ここに提出カードが残ります。</div>';
  el('recs').querySelectorAll('.rec').forEach(function(b){b.onclick=function(){SubmitCard.reopen(rs[+b.dataset.r])}});
}
function launch(id,mode){
  var name=getName();
  if(mode==='test'&&!name){el('nb').classList.add('warn');el('nm').focus();el('nm').placeholder='← なまえを入れてね';return}
  var boot='<script>window.GAME_MODE='+JSON.stringify(mode==='test'?'test':'')+';window.PLAYER_NAME='+JSON.stringify(name)+';window.COLLECTION_NAME='+JSON.stringify(COLLECTION.name)+';<\/script>';
  var go=function(src){
  var html=src.replace(/<head>/i,'<head>'+boot);
  var f=document.createElement('iframe');f.setAttribute('title','ゲーム');f.srcdoc=html;
  el('player').innerHTML='';el('player').appendChild(f);el('player').classList.add('on');el('menuBtn').classList.add('on');
  document.body.style.overflow='hidden';
  };
  if(SRC[id]){go(SRC[id]);return}
  fetch(id+'/index.html',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(go).catch(function(){alert('ゲームを読みこめませんでした。通信を確認して、もう一度おしてください。')});
}
function closeGame(){el('player').innerHTML='';el('player').classList.remove('on');el('menuBtn').classList.remove('on');document.body.style.overflow='';renderRecs()}
el('games').addEventListener('click',function(e){var b=e.target.closest('[data-g]');if(b)launch(b.dataset.g,b.dataset.m)});
el('menuBtn').onclick=function(){
  var d=document.createElement('div');d.className='dlg';
  d.innerHTML='<div class="box">メニューにもどりますか？<br><small>セーブのないゲームは、次は最初からになります。提出カードは記録に残ります。</small><div class="row"><button data-x="no">つづける</button><button class="go" data-x="go">もどる</button></div></div>';
  d.onclick=function(e){var b=e.target.closest('[data-x]');if(e.target===d||b){d.remove();if(b&&b.dataset.x==='go')closeGame()}};
  document.body.appendChild(d);
};
window.addEventListener('message',function(e){if(e.data&&e.data.type==='submit-card'&&e.data.rec){mem.push(e.data.rec)}});
renderGames();renderRecs();
})();
</script>
</body>
</html>
