<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>砂鉄の宝さがし ～磁界と磁力線～</title>
<!--
  中2理科 電流とその利用 第24回（chu2-denryu-24・確認用）  ゲームID: jishin-takara
  ─ 設計（制作ルール6の必須項目）─
  1 世界とメタファー: 砂浜の宝の島。砂の上に広げた「宝の地図の紙」の下に、見えない磁石が埋まっている。
    UIは島の道具＝紙の欄外のスタンプ、方位磁針の入った木箱、小石のボタン。
  2 配色: 背景 #F4EFE6（砂の紙）／主 #2C2C34（砂鉄の墨）／差し #D1495B（N極の赤）
    補助: S極 #3A6EA5・海 #3F7CAC #6FA8C9 #9CC7D8・砂 #E3CFA6 #CDB07E・椰子 #5C8A4E・金 #E0A93B
  3 書体: M PLUS 2（見出し900・本文700）。同じ単元でかぶらない見出し書体（割り当て表どおり）
  4 画面の組み方: 全画面の canvas が舞台。PC＝横長の紙＋右に方位磁針の木箱／スマホ・iPad縦＝紙を縦にして下に木箱
  5 HUD: 紙の上の点描スタンプ（区画名・旗の数・宝ポイント）と木箱の中の数字（かけら・磁針の残り・砂鉄袋）
  6 音: カリンバ／マリンバ風の点々とした音、砂鉄をまくシャカシャカ（ノイズ）、宝箱のチャイム
  画風: 点描（色の点の集まり）。紙・海・島・磁石・方位磁針・ボタンまで、すべて点で描く
  遊びの核: 砂鉄ふりかけ → 方位磁針を置いて向きを読む → 旗を通る磁力線を N極→S極 に指で描く → 磁石の上を掘る
  ご褒美は「理科として正しい操作」のときだけ: 正しい磁力線（向き・N→S・交わらない）／磁針の向きを予想して的中／一発で掘り当て
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFE6;--ink:#2C2C34;--red:#D1495B;--blue:#3A6EA5;--sea:#3F7CAC;--sand:#E3CFA6;--gold:#E0A93B;--wood:#8A5A3B;
  --f:"M PLUS 2","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:var(--f);font-weight:900;color:var(--ink);cursor:pointer;border:0;background:none;touch-action:manipulation}
/* 小石のボタン（点描の地と点線のふち） */
.peb{position:relative;min-height:48px;padding:10px 20px;font-size:17px;letter-spacing:.04em;
  background-color:#FBF7EF;background-image:radial-gradient(rgba(44,44,52,.13) 1.1px,transparent 1.5px);background-size:6px 6px;
  border:3px dotted var(--ink);border-radius:46% 54% 50% 50%/55% 48% 52% 45%;box-shadow:0 5px 0 rgba(44,44,52,.28);
  transition:transform .08s,box-shadow .08s}
.peb:active,.peb.down{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 rgba(44,44,52,.28)}
.peb.red{background-color:var(--red);color:#fff;border-color:#7d1f2d;background-image:radial-gradient(rgba(255,255,255,.28) 1.2px,transparent 1.6px)}
.peb.sea{background-color:var(--sea);color:#fff;border-color:#1f4666;background-image:radial-gradient(rgba(255,255,255,.25) 1.2px,transparent 1.6px)}
.peb.gold{background-color:var(--gold);color:#3a2605;border-color:#6d4b10}
.peb:disabled{opacity:.42;filter:grayscale(.6)}
.peb.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* いつも左上: もどる */
#bBack{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:60;min-height:48px;padding:8px 16px 8px 12px;font-size:17px;
  background-color:#fff;border:3px dotted var(--red);color:var(--red);border-radius:40% 60% 55% 45%/50% 45% 55% 50%;box-shadow:0 4px 0 rgba(209,73,91,.35)}
#bBack b{display:inline-block;margin-right:4px;font-size:20px;line-height:1}
#bMute{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:60;width:50px;height:50px;padding:0;font-size:22px}
/* 上の点描スタンプ（区画名・旗・ポイント） */
#hud{position:fixed;left:0;right:0;top:max(12px,env(safe-area-inset-top));z-index:40;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 70px}
#hudT{font-size:clamp(15px,2.2vw,22px);font-weight:900;letter-spacing:.06em;text-shadow:2px 2px 0 rgba(224,169,59,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#hudN{font-size:clamp(13px,1.6vw,16px);font-weight:700;background:rgba(244,239,230,.86);padding:3px 12px;border-bottom:3px dotted var(--red);max-width:100%;text-align:center;line-height:1.35}
#hudN b{color:var(--red)}
/* 方位磁針の木箱（道具箱） */
#box{position:fixed;z-index:30;display:flex;gap:10px;padding:12px;
  background-color:var(--wood);background-image:radial-gradient(rgba(255,226,180,.22) 1.2px,transparent 1.6px),radial-gradient(rgba(40,20,10,.25) 1px,transparent 1.4px);
  background-size:7px 7px,5px 5px;background-position:0 0,2px 3px;border:4px dotted #3b2415;box-shadow:0 8px 0 rgba(44,30,20,.35)}
body:not(.port) #box{right:14px;top:74px;bottom:14px;width:var(--bw,230px);flex-direction:column;border-radius:18px 10px 16px 12px}
body.port #box{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));height:var(--bh,140px);flex-direction:row;flex-wrap:wrap;align-content:flex-start;border-radius:16px 12px 18px 10px}
#boxHead{color:#FFE9C7;font-size:14px;font-weight:900;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;width:100%}
#boxHead span{white-space:nowrap}
body.port #boxHead{font-size:13px}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 4px;font-size:14px;line-height:1.15;
  background-color:#F7EEDC;background-image:radial-gradient(rgba(44,44,52,.12) 1px,transparent 1.4px);background-size:5px 5px;
  border:3px dotted #3b2415;border-radius:44% 56% 48% 52%/52% 46% 54% 48%;box-shadow:0 5px 0 rgba(20,10,5,.4);transition:transform .08s}
.tool i{font-style:normal;font-size:26px;line-height:1}
.tool small{font-size:12px;font-weight:700;opacity:.8}
.tool.on{background-color:#FFF;border-color:var(--red);box-shadow:0 0 0 4px rgba(209,73,91,.45),0 5px 0 rgba(20,10,5,.4);transform:translateY(-2px)}
.tool:active{transform:translateY(4px) scale(.95)}
.tool:disabled{opacity:.4}
body.port .tool{min-height:0;height:calc(var(--bh,140px) - 52px)}
body:not(.port) .tool{flex:0 0 auto;min-height:70px}
.bag{width:80%;height:8px;background-image:radial-gradient(#2C2C34 1.6px,transparent 2px);background-size:6px 8px;background-repeat:repeat-x;opacity:.85}
.bagw{width:80%;height:8px;background-image:radial-gradient(rgba(44,44,52,.2) 1.6px,transparent 2px);background-size:6px 8px}
#rules{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:#F7EEDC;border:3px dotted #3b2415;font-size:13px;line-height:1.4;transform:rotate(-1deg)}
#rules b{font-size:15px;color:var(--red);border-bottom:2px dotted var(--red)}#rules em{font-style:normal;color:var(--red)}
body.port #rules,.short #rules{display:none}
body.port #hud{top:max(66px,calc(env(safe-area-inset-top) + 56px));padding:0 10px}
body.port #hudT{font-size:14px}body.port #hudN{font-size:13px;padding:2px 8px}
body.port #toast{font-size:14px;bottom:calc(var(--bh,140px) + 30px)}
body.port #logo h1{font-size:clamp(56px,16vw,118px)}
body.port #logo{top:7vh}
#tDig.ready{background-color:var(--gold);animation:pulse .9s ease-in-out infinite}
/* 画面（DOM）: タイトル・地図・結果・テスト */
.scr{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.scr>*{pointer-events:auto}
#scrTitle{justify-content:flex-end;padding-bottom:max(6vh,24px)}
#logo{position:fixed;left:0;right:0;top:9vh;text-align:center;pointer-events:none;z-index:21}
#logo h1{margin:0;font-weight:900;line-height:1;letter-spacing:.02em;font-size:clamp(46px,9vw,118px);color:var(--ink);
  background-image:radial-gradient(circle,#2C2C34 42%,transparent 46%),radial-gradient(circle,#D1495B 40%,transparent 44%);background-size:.07em .07em,.07em .07em;background-position:0 0,.035em .035em;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(.04em .05em 0 rgba(224,169,59,.9)) drop-shadow(0 0 .02em #fff)}
#logo h1 .s{display:block;font-size:.52em;letter-spacing:.2em;margin-bottom:.08em}
#logo p{margin:.5em 0 0;font-size:clamp(16px,2.4vw,26px);font-weight:900;letter-spacing:.2em;color:var(--red);text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff}
#logo.drop h1{animation:drop .9s cubic-bezier(.3,1.6,.5,1) both}
#logo.drop p{animation:fade .8s .6s both}
@keyframes drop{0%{transform:translateY(-60vh) rotate(-6deg)}100%{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
#bStart{font-size:clamp(22px,3vw,30px);padding:16px 44px;min-height:66px}
#nmRow{margin-bottom:10px;background:rgba(244,239,230,.9);padding:6px 12px;border:3px dotted var(--ink);display:flex;align-items:center;gap:8px;font-size:15px}
#nameIn{font-family:var(--f);font-size:17px;font-weight:700;border:0;border-bottom:3px dotted var(--red);background:transparent;width:10em;padding:4px;color:var(--ink)}
/* 地図の下の帯（標本箱と操作） */
#mapBar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;width:min(96vw,760px)}
#shelf{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 10px;background-color:var(--wood);background-image:radial-gradient(rgba(255,226,180,.22) 1.2px,transparent 1.6px);background-size:7px 7px;border:3px dotted #3b2415}
#shelf .sp{width:44px;height:36px;display:flex;align-items:center;justify-content:center;background:#F7EEDC;border:2px dotted #3b2415}
#shelf .sp.no{opacity:.35}
body.port #shelf .sp{width:30px;height:28px}body.port #shelf .sp svg{width:28px;height:22px}body.port #shelf{gap:4px;padding:6px}
#shelfT{color:#FFE9C7;font-size:13px;width:100%;text-align:center}
/* 結果（宝箱） */
#scrClear{background:rgba(44,44,52,.45);z-index:45}
#clr{position:relative;width:min(92vw,560px);padding:22px 20px 18px;background-color:var(--bg);background-image:radial-gradient(rgba(44,44,52,.10) 1.1px,transparent 1.5px);background-size:6px 6px;
  border:4px dotted var(--ink);transform:rotate(-.8deg);text-align:center;animation:pop .45s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:rotate(-.8deg);opacity:1}}
#clr h2{margin:0;font-size:clamp(28px,5vw,44px);font-weight:900;color:var(--red);letter-spacing:.06em}
#clr .sub{font-size:15px;margin:4px 0 8px}
#stars{display:flex;justify-content:center;gap:14px;margin:8px 0}
#stars div{width:84px;display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:1.2;opacity:.25}
#stars div i{font-style:normal;font-size:46px;line-height:1.05;color:#bbb}
#stars div.on{opacity:1}
#stars div.on i{color:var(--gold);animation:stamp .4s cubic-bezier(.3,1.8,.5,1) both;text-shadow:2px 3px 0 #7a5410}
@keyframes stamp{0%{transform:scale(3.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
#spec{display:flex;gap:12px;align-items:center;justify-content:center;margin:6px 0 10px;padding:8px;border-top:3px dotted var(--ink);border-bottom:3px dotted var(--ink)}
#spec svg{width:110px;height:70px;flex:0 0 auto}
#spec div{text-align:left;font-size:14px;line-height:1.45}
#spec div b{font-size:17px;color:var(--red)}
#crec{font-size:14px;margin-bottom:10px}
/* 確認テスト（海辺の紙） */
#scrTest{justify-content:flex-start;overflow-y:auto;padding:76px 12px 30px;pointer-events:auto;touch-action:pan-y;
  background-color:#3F7CAC;background-image:radial-gradient(rgba(255,255,255,.18) 1.3px,transparent 1.8px),radial-gradient(rgba(20,50,80,.25) 1.2px,transparent 1.6px);background-size:9px 9px,6px 6px}
#tp{width:min(94vw,760px);padding:18px 18px 16px;background-color:var(--bg);background-image:radial-gradient(rgba(44,44,52,.08) 1.1px,transparent 1.5px);background-size:6px 6px;border:4px dotted var(--ink);box-shadow:8px 10px 0 rgba(20,40,60,.35);transform:rotate(.4deg)}
#tHead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;border-bottom:3px dotted var(--red);padding-bottom:6px;margin-bottom:10px}
#tLamps{display:flex;gap:4px}
#tLamps i{width:13px;height:13px;border-radius:50%;border:2px dotted var(--ink)}
#tLamps i.ok{background:var(--gold)}#tLamps i.ng{background:#9aa}#tLamps i.cur{background:var(--red)}
#tQ{font-size:clamp(17px,2.2vw,21px);line-height:1.6;margin:4px 0 10px}
#tFig{background:#fff;border:3px dotted rgba(44,44,52,.5);padding:6px;margin:0 auto 10px;max-width:420px}
#tFig svg{width:100%;height:auto;display:block}
#tA{display:grid;gap:10px}
.ch{display:flex;align-items:center;gap:10px;text-align:left;font-size:16px;font-weight:700;line-height:1.4;padding:10px 14px;min-height:52px;width:100%;
  background:#FBF7EF;border:3px dotted var(--ink);border-radius:30px 18px 26px 20px}
.ch i{font-style:normal;flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;border-radius:50%;font-size:14px}
.ch.ok{background:#FFE7A8;border-color:var(--gold);border-style:solid}.ch.ng{background:#E8D6D9;border-color:var(--red)}
.ch:disabled{color:var(--ink)}
.ord{display:grid;gap:8px}.slot{padding:8px 12px;border:3px dashed var(--ink);font-size:15px;display:flex;gap:8px}.slot i{font-style:normal;color:var(--red)}
#tEx{margin-top:10px;padding:10px 12px;background:#fff;border-left:6px dotted var(--red);font-size:15px;line-height:1.6}
#tNext{margin:12px auto 0;display:block}
#scrEnd{background-color:#3F7CAC;background-image:radial-gradient(rgba(255,255,255,.18) 1.3px,transparent 1.8px);background-size:9px 9px}
#endP{width:min(92vw,520px);padding:22px;text-align:center;background:var(--bg);border:4px dotted var(--ink);transform:rotate(-.5deg)}
#eScore{font-size:64px;font-weight:900;color:var(--red);line-height:1.1}#eScore small{font-size:22px;color:var(--ink)}
/* 手前の効果（フラッシュ・コンボ） */
#flash{position:fixed;inset:0;z-index:50;pointer-events:none;background:#fff;opacity:0}
#combo{position:fixed;z-index:41;pointer-events:none;left:50%;top:22%;transform:translate(-50%,-50%);font-weight:900;text-align:center;white-space:nowrap;opacity:0}
#combo b{display:block;font-size:clamp(40px,7vw,86px);line-height:1;color:var(--red);-webkit-text-stroke:3px #fff;paint-order:stroke;text-shadow:4px 5px 0 rgba(44,44,52,.35)}
#combo span{font-size:clamp(15px,2vw,20px);background:var(--ink);color:#fff;padding:2px 10px}
#combo.go{animation:cmb 1.1s cubic-bezier(.2,1.6,.4,1) both}
#combo.c2 b{color:#E0A93B}#combo.c3 b{background:linear-gradient(90deg,#D1495B,#E0A93B,#5C8A4E,#3F7CAC,#D1495B);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rb .6s linear infinite}
@keyframes rb{to{background-position:200% 0}}
@keyframes cmb{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
#toast{position:fixed;z-index:55;left:50%;bottom:22%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;font-size:16px;max-width:90vw;text-align:center;line-height:1.5;opacity:0;transition:opacity .25s;pointer-events:none;border:3px dotted #fff}
#toast.on{opacity:1}
#toast b{color:#FFC9CF}
#scrAsk{background:rgba(44,44,52,.5);z-index:70}
#ask{width:min(90vw,420px);padding:20px;text-align:center;background:var(--bg);border:4px dotted var(--ink)}
#ask p{font-size:16px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.peb.pulse,#tDig.ready,#logo.drop h1,#logo.drop p{animation:none}#combo.go{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="flash"></div>
<div id="combo"><b id="comboB"></b><span id="comboS"></span></div>
<div id="toast"></div>

<button id="bBack" class="hidden" aria-label="もどる"><b>◀</b><span id="bBackT">もどる</span></button>
<button id="bMute" class="peb" aria-label="音">🔊</button>

<div id="hud" class="hidden"><div id="hudT"></div><div id="hudN"></div></div>

<div id="box" class="hidden">
  <div id="boxHead"><span id="pts">★ 0</span><span id="kk">💠 0</span><span id="tim" class="hidden">⏱ 4:00</span></div>
  <button class="tool" id="tSand"><i>🫙</i>砂鉄<small>なぞる・長押し</small><div class="bagw"><div class="bag" id="bagM"></div></div></button>
  <button class="tool" id="tComp"><i>🧭</i>方位磁針<small id="compN">×3</small></button>
  <button class="tool" id="tPen"><i>✏️</i>磁力線<small id="flagN">旗 0/3</small></button>
  <button class="tool" id="tDig"><i>⛏️</i>掘る<small id="digN">線をぜんぶ描くと</small></button>
  <div id="rules"><b>磁力線のきまり</b><span>① <em>N極</em>から出て<em>S極</em>に入る</span><span>② 交わらない・枝分かれしない</span><span>③ 間かくがせまい所ほど磁界が強い</span><span>🧭 針の<em>N極（赤）</em>がさす向き＝磁界の向き</span></div>
</div>

<div id="logo" class="hidden"><h1><span class="s">砂鉄の</span>宝さがし</h1><p>～磁界と磁力線～</p></div>
<div id="scrTitle" class="scr hidden">
  <div id="nmRow">なまえ <input id="nameIn" maxlength="12" autocomplete="off" placeholder="（なくても遊べる）"></div>
  <div class="row">
    <button class="peb red pulse" id="bStart">はじめる</button>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="peb" id="bCont">つづきから</button>
    <button class="peb" id="bBook1">📖 図鑑</button>
  </div>
</div>

<div id="scrMap" class="scr hidden">
  <div id="mapBar">
    <div id="shelf"><div id="shelfT">掘り出した磁石の標本箱</div></div>
    <div class="row">
      <button class="peb gold hidden" id="bToTest">📜 確認テストへ</button>
      <button class="peb sea" id="bGacha">🎁 図鑑ガチャ</button>
      <button class="peb" id="bBook2">📖 図鑑</button>
    </div>
  </div>
</div>

<div id="scrClear" class="scr hidden">
  <div id="clr">

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

  if(scene==='title'){try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}return}
  if(scene==='map'){setScene('title');return}
  $('askP').innerHTML=scene==='test'?'確認テストをやめて、島の地図にもどりますか？<br>（テストは次はさいしょから）':'島の地図にもどりますか？<br>掘った区画と★は保存されます（この区画は次ははじめから）。';
  $('scrAsk').classList.remove('hidden');if(G)G.paused=true};
$('askNo').onclick=function(){$('scrAsk').classList.add('hidden');if(G)G.paused=false};
$('askGo').onclick=function(){$('scrAsk').classList.add('hidden');if(G&&G.state==='play')SV.playMs=(SV.playMs||0)+G.time*1000;save();G=null;setScene('map')};
$('bMute').onclick=function(){muted=!muted;try{localStorage.setItem(SKEY+':mute',muted?'1':'0')}catch(e){}$('bMute').textContent=muted?'🔇':'🔊';if(!muted){ac();SFX.tap()}};
['tSand','tComp','tPen','tDig'].forEach(function(id){var k={tSand:'sand',tComp:'comp',tPen:'pen',tDig:'dig'}[id];$(id).addEventListener('click',function(){ac();selectTool(k)})});
// 🫙長押し＝紙全体にふる（スマホでも）
$('tSand').addEventListener('pointerdown',function(){ac();clearInterval(sandHold);var n=0;sandHold=setInterval(function(){if(!G||G.state!=='play'){clearInterval(sandHold);return}n++;if(n>3){for(var i=0;i<2;i++)sprinkle(.5+Math.random()*(PW-1),.5+Math.random()*(PH-1),.9,7);if(n%3===0)vib(8)}},60)});
['pointerup','pointerleave','pointercancel'].forEach(function(ev){$('tSand').addEventListener(ev,function(){clearInterval(sandHold)})});
function openBook(){var z=Zk();if(z&&z.openBook)z.openBook()}
$('bBook1').onclick=openBook;$('bBook2').onclick=openBook;$('eBook').onclick=openBook;
$('bGacha').onclick=function(){var z=Zk();if(z&&z.openGacha)z.openGacha()};
if(!Zk()){['bBook1','bBook2','bGacha','eBook'].forEach(function(id){$(id).classList.add('hidden')})}
function getName(){return(window.PLAYER_NAME||$('nameIn').value||SV.name||'').trim()}
$('bStart').onclick=function(){ac();SFX.find();SV.name=$('nameIn').value.trim()||SV.name;save();if(SV.unl<=1&&!SV.stars[0])startLevel(0);else setScene('map')};
$('bCont').onclick=function(){ac();SFX.tap();SV.name=$('nameIn').value.trim()||SV.name;save();setScene('map')};
$('bToTest').onclick=function(){if(SV.done)toTest()};
function toTest(){var z=Zk();if(z&&z.mainClear&&!TEST){try{z.mainClear({onClose:startTest});return}catch(e){}}startTest()}

/* ---------------- 確認テスト ---------------- */
var TQ=[],TI=0,TA=[],TOK=[],CARD=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
function startTest(){setScene('test');G=null;TQ=window.Quiz?Quiz.test():[];TI=0;TA=[];TOK=[];$('scrTest').scrollTop=0;showQ()}
function lamps(){$('tLamps').innerHTML=TQ.map(function(q,i){return'<i class="'+(i<TOK.length?(TOK[i]?'ok':'ng'):i===TI?'cur':'')+'"></i>'}).join('')}
function showQ(){if(TI>=TQ.length)return finishTest();var q=TQ[TI];$('tNo').textContent='宝の鑑定　第'+(TI+1)+'問 ／ '+TQ.length;lamps();
  $('tQ').textContent=q.q;var f=$('tFig');if(q.fig){f.innerHTML=q.fig;f.classList.remove('hidden')}else{f.innerHTML='';f.classList.add('hidden')}
  $('tEx').classList.add('hidden');$('tNext').classList.add('hidden');var box=$('tA');box.innerHTML='';
  if(q.t==='choice'){q.shown.forEach(function(s,i){var b=document.createElement('button');b.className='ch';b.innerHTML='<i>'+'ABCDEF'.charAt(i)+'</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){answer(s,b)};box.appendChild(b)})}
  else if(q.t==='num'){var v='';box.innerHTML='<div style="font-size:26px;border-bottom:3px dotted #2C2C34;padding:6px;min-height:44px" id="nv"></div><div id="nk" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px"></div>';
    ['7','8','9','⌫','4','5','6','.','1','2','3','0'].forEach(function(k){var b=document.createElement('button');b.className='ch';b.style.justifyContent='center';b.textContent=k;b.onclick=function(){if(TA.length>TI)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<7)v+=k;$('nv').textContent=v+' '+(q.unit||'')};$('nk').appendChild(b)});
    var go=document.createElement('button');go.className='peb red';go.textContent='この値で決定';go.onclick=function(){if(v&&TA.length<=TI)answer(v,null)};box.appendChild(go)}
  else{var sel=[];var wrap=document.createElement('div');wrap.className='ord';box.appendChild(wrap);
    var draw=function(){wrap.innerHTML='';sel.forEach(function(s,i){var d=document.createElement('div');d.className='slot';d.innerHTML='<i>'+(i+1)+'</i><span></span>';d.querySelector('span').textContent=s;wrap.appendChild(d)});
      q.shown.forEach(function(s){if(sel.indexOf(s)>=0)return;var b=document.createElement('button');b.className='ch';b.innerHTML='<i>＋</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){if(TA.length>TI)return;sel.push(s);kal(600+sel.length*120,.05);if(sel.length===q.shown.length)answer(sel.slice(),null);else draw()};wrap.appendChild(b)});
      if(sel.length&&TA.length<=TI){var r=document.createElement('button');r.className='peb';r.textContent='やりなおす';r.onclick=function(){sel=[];draw()};wrap.appendChild(r)}};draw()}}
function answer(v,btn){if(TA.length>TI)return;var q=TQ[TI],ok=window.Quiz?Quiz.check(q,v):false;TA.push(v);TOK.push(ok);ok?SFX.hit(3):SFX.bad();
  [].slice.call($('tA').querySelectorAll('.ch')).forEach(function(b){b.disabled=true;var t=b.querySelector('span');if(q.t==='choice'&&t){if(t.textContent===q.choices[0])b.classList.add('ok');else if(b===btn)b.classList.add('ng')}});
  if(ok&&btn){var r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top,[GOLD,RED,'#fff'],18,3)}
  $('tEx').innerHTML=(ok?'<b style="color:#B07A12">本物の宝！</b> ':'<b style="color:#D1495B">にせもの…</b> 正解：'+esc(window.Quiz?Quiz.answer(q):'')+'<br>')+esc(q.ex||'');$('tEx').classList.remove('hidden');
  lamps();var nb=$('tNext');nb.textContent=TI+1>=TQ.length?'鑑定を終える':'つぎへ';nb.classList.remove('hidden');setTimeout(function(){nb.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'})},50)}
$('tNext').onclick=function(){TI++;$('scrTest').scrollTop=0;showQ()};
function totalStars(){var n=0;for(var k in SV.stars)n+=SV.stars[k].filter(Boolean).length;return n}
function finishTest(){var qs=TQ,answers=TA,review=window.Quiz?Quiz.review(qs,answers):[],marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length,name=getName();
  var records=TEST?[['モード','確認テストだけ']]:[['クリアタイム',SV.clearMs?fmtT(SV.clearMs):'（大地図まだ）'],['掘った区画の★',totalStars()+' / '+(NLV*3)],['描いた磁力線',(SV.lines||0)+' 本'],['大地図のタイム',SV.bossT?fmtT(SV.bossT*1000):'―']];
  $('eName').textContent=(name?name+'　':'')+'確認テスト';$('eScore').innerHTML=score+'<small> / '+qs.length+' 点</small>';setScene('end');
  if(score>=8){SFX.fan();for(var i=0;i<5;i++)setTimeout(function(){burst(Math.random()*W,H*.3,[RED,GOLD,'#fff','#5C8A4E'],30,5,1.3)},i*150)}
  if(window.SubmitCard)CARD=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　電流とその利用　第24回',
    game:'砂鉄の宝さがし ～磁界と磁力線～'+(TEST?'（確認テストのみ）':''),name:name,score:score,total:qs.length,marks:marks,records:records,review:review},function(){})}
$('eCard').onclick=function(){if(CARD&&window.SubmitCard)SubmitCard.reopen(CARD)};
$('eMap').onclick=function(){if(TEST){setScene('title');return}setScene('map')};

/* ---------------- ループ ---------------- */
var last=performance.now(),tutT=0;
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(G&&!G.paused&&scene==='play'){if(G.state==='play'){G.time+=dt;if(G.L.boss){G.left-=dt;if(Math.floor(G.left+dt)!==Math.floor(G.left))updHud();if(G.left<=0){G.left=0;G.L.boss&&timeUp()}}}
    // 砂鉄を焼き付け
    var nf=[];for(var i=0;i<G.falling.length;i++){var f=G.falling[i];f.t+=dt;if(f.t>=.3)bakeFiling(f);else nf.push(f)}G.falling=nf;
    if(G.tut===0&&G.fil.length>260){G.tut=1;note('模様が出てきた！ 次は<b>🧭方位磁針</b>をえらんで、紙を<b>タップして置こう</b>');selectTool('comp');var r=$('tComp').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,[GOLD,RED],20,3)}
    stepComps(dt);G.lines.forEach(function(L){L.t+=dt});G.mags.forEach(function(m){if(m.found)m.t+=dt});if(G.state==='clear')G.clearT+=dt;
    if(Math.floor(T*2)!==Math.floor((T-dt)*2))updHud()}
  stepFx(dt);
  var sx=SHK?(Math.random()-.5)*SHK:0,sy=SHK?(Math.random()-.5)*SHK:0;
  c.setTransform(DPR,0,0,DPR,sx*DPR,sy*DPR);c.clearRect(-20,-20,W+40,H+40);
  if(scene==='play'||scene==='test'&&false)drawPaperScene();else if(scene==='map')drawMap();else if(scene==='title')drawTitle();else{paintBG('map');c.drawImage(BGC,0,0,W,H)}
  c.setTransform(DPR,0,0,DPR,0,0);drawFx();
  requestAnimationFrame(frame)}
function timeUp(){if(!G||G.state!=='play')return;G.state='over';SFX.bad();toast('時間切れ！ 大地図は<b>もう一度</b>。旗の順番と、磁針の置き場所を考え直そう',3500);setTimeout(function(){if(G&&G.state==='over')startLevel(G.li)},2600)}
document.addEventListener('visibilitychange',function(){if(document.hidden&&G)save()});
window.addEventListener('resize',function(){resize()});

/* ---------------- はじまり ---------------- */
resize();
window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]});
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nmRow').classList.add('hidden')}else if(SV.name)$('nameIn').value=SV.name;
if(TEST)startTest();else setScene('title');
requestAnimationFrame(frame);
/* 自動操作での確かめ用（遊びには影響しない） */
window.__JT={G:function(){return G},start:startLevel,scene:function(){return scene},SV:function(){return SV},W2S:W2S,judge:judgeLine,dig:function(m){var b=m.body[0];digAt((b[0]+b[2])/2,(b[1]+b[3])/2,W/2,H/2)},sprinkle:sprinkle,place:placeComp,clear:levelClear,sel:selectTool};
})();
</script>
