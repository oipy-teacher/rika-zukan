<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>実験計画ロケット ～比例を確かめる計画～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1426;--bg2:#141f36;--steel:#1c2536;--steel2:#27324a;--line:#34415e;--amber:#f2a93b;--amber2:#b4731a;--go:#4fd18b;--ng:#ec4a4f;--paper:#f4efe2;--ink:#232018;--txt:#eef1f6;--sub:#9aa6bd;--dawn:#f0a560;
 --f:'Zen Kaku Gothic New','Hiragino Sans','Meiryo',sans-serif;--m:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--f);overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;
 background-image:linear-gradient(180deg,#0a1122 0%,#111c34 60%,#2a2a3a 88%,#4a3326 100%)}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
.scr{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:8px 12px 30px}
.btn{min-height:50px;border:none;border-radius:10px;padding:10px 18px;font-size:18px;font-weight:900;background:var(--steel2);color:#fff;box-shadow:0 4px 0 #050810}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #050810}
.btn.amber{background:var(--amber);color:#261600;box-shadow:0 4px 0 var(--amber2)}
.btn.go{background:#2f9e63;box-shadow:0 4px 0 #1b6b40}
.btn.red{background:#c7353a;box-shadow:0 4px 0 #7d1d21}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.small{font-size:13px;color:var(--sub)}
.tbtns{display:grid;gap:10px;margin-top:12px}
.mono{font-family:var(--m)}
/* タイトル */
#title .wrap{text-align:center;padding-top:14px}
.kick{display:inline-block;font-family:var(--m);font-size:13px;letter-spacing:.3em;color:var(--amber);border:1px solid var(--amber);padding:3px 12px;border-radius:3px}
.logo{font-weight:900;font-size:clamp(32px,10.5vw,50px);line-height:1.12;margin:10px 0 4px;letter-spacing:.04em;text-shadow:0 3px 0 #000}
.subt{font-size:16px;color:#ffd9a8;margin-bottom:6px;font-weight:700}
.namein{width:100%;font:inherit;font-size:18px;padding:10px;border-radius:8px;border:2px solid var(--line);background:#070c18;color:#fff;margin-top:6px}
.hero{border-radius:14px;overflow:hidden;border:2px solid var(--line);margin:10px 0;box-shadow:0 8px 24px #0008}
.hero svg{display:block;width:100%;height:auto}
/* HUD */
.hudw{position:sticky;top:0;z-index:5;background:#0c1426;padding-bottom:4px;margin-bottom:4px;box-shadow:0 6px 10px -6px #000}
.hud{display:flex;align-items:center;gap:6px;padding:6px 0 2px}
.hud2{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--sub)}
.hud2 b{font-family:var(--m);font-size:17px;color:var(--amber);margin-left:4px}
.hud .ib{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--steel);font-size:20px;flex:none}
.hud .mid{flex:1;min-width:0;text-align:center;line-height:1.2}
.hud .mid b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .mid span{font-size:12px;color:var(--sub);font-family:var(--m)}
/* 発射場 */
.pad{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#0d1830}
.pad svg{display:block;width:100%;height:auto}
.cd{position:absolute;left:8px;top:8px;font-family:var(--m);font-size:22px;color:var(--amber);background:#05080fcc;border:1px solid #3a2a10;border-radius:6px;padding:2px 10px;letter-spacing:.08em}
.cd.red{color:#ff6b6e;border-color:#6d1a1c}.cd.grn{color:var(--go);border-color:#14502f}
.ghostrec{position:absolute;right:8px;top:8px;font-size:12px;background:#05080fcc;border-radius:6px;padding:4px 8px;color:#cfd6e4;line-height:1.3;text-align:right}
.brief{background:var(--steel);border:2px solid var(--line);border-left:6px solid var(--amber);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px;line-height:1.6}
.brief b{color:#ffd28a}
/* 実験台の図 */
.rig{background:#f6f2e8;border-radius:12px;border:2px solid #cfc4a8;margin-top:10px;position:relative}
.rig svg{display:block;width:100%;height:auto}
.rig .cap{position:absolute;left:10px;top:6px;font-size:12px;font-weight:900;color:#5a4a2a;letter-spacing:.1em}
/* 点検表 */
.clip{background:var(--paper);color:var(--ink);border-radius:10px;padding:14px 10px 10px;margin-top:12px;position:relative;box-shadow:0 6px 0 #6b5e45,0 10px 20px #0008}
.clip:before{content:'';position:absolute;left:50%;top:-10px;width:110px;height:22px;margin-left:-55px;background:linear-gradient(#9aa3b3,#6c7586);border-radius:6px;box-shadow:0 2px 0 #3c4250}
.clip h3{margin:2px 4px 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.clip h3 .st{font-family:var(--m);font-size:12px;color:#8a3b17;border:2px solid #8a3b17;border-radius:4px;padding:1px 6px;transform:rotate(-4deg)}
.row{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;text-align:left;background:#fffdf7;border:2px solid #d8cfb8;border-radius:9px;padding:6px 8px;margin-bottom:6px;color:var(--ink);font-size:15px;line-height:1.35}
.row .ic{font-size:22px;width:30px;text-align:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx small{display:block;font-size:12px;color:#7a6d52;font-weight:700}
.row .lamp{width:22px;height:22px;border-radius:50%;flex:none;background:#b9b3a3;box-shadow:inset 0 -3px 0 #0003}
.row .lamp.go{background:var(--go);box-shadow:0 0 10px var(--go)}
.row .lamp.ng{background:var(--ng);box-shadow:0 0 12px var(--ng)}
.row .lamp.chk{background:var(--amber);animation:blink .25s infinite alternate}
.row.new{border-color:var(--amber);background:#fff6e2}
.row.new .tx small:after{content:' NEW';color:#c46a00}
.row.bad{border-color:var(--ng);animation:pulse 1s infinite}
@keyframes blink{to{opacity:.35}}
@keyframes pulse{50%{box-shadow:0 0 0 4px #ec4a4f44}}
.launchbar{position:sticky;bottom:0;padding:10px 0 12px;background:linear-gradient(transparent,#0c1426 30%);z-index:4}
.combo{font-family:var(--m);text-align:center;font-size:14px;color:var(--amber);min-height:18px}
/* シート */
.ov{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.ovc{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg2);border:2px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px 22px}
.ovc h2{margin:4px 0 8px;font-size:20px}
.opt{display:flex;gap:10px;align-items:center;width:100%;min-height:60px;text-align:left;background:var(--steel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:16px;line-height:1.4;color:#fff}
.opt.sel{border-color:var(--amber);background:#2b2616}
.opt .of{width:92px;flex:none;background:#f6f2e8;border-radius:8px}
.opt .of svg{display:block;width:100%;height:auto}
.abort{text-align:center}
.abort .hd{font-family:var(--m);font-size:30px;color:#ff6b6e;letter-spacing:.12em;text-shadow:0 0 12px #ff3b3f88}
.abort .fig{background:#f6f2e8;border-radius:10px;margin:8px 0;color:#222}
.abort .fig svg{display:block;width:100%;height:auto}
.why{background:#2a1416;border:2px solid #6d1a1c;border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.6;text-align:left}
.good{background:#10271b;border:2px solid #1f6b43;border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6;text-align:left;margin-top:8px}
.good b,.why b{color:#ffd28a}
.res{text-align:center}
.res .big{font-size:34px;font-weight:900;color:var(--go);text-shadow:0 0 16px #4fd18b66}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat div{background:var(--steel);border-radius:10px;padding:8px;font-size:13px;color:var(--sub)}
.stat b{display:block;font-size:22px;color:#fff;font-family:var(--m)}
/* 封印 */
.pcard{display:block;width:100%;min-height:56px;text-align:left;background:var(--steel);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:16px;line-height:1.45;color:#fff}
.pcard.sel{border-color:var(--amber);background:#2b2616}
.shapes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shapes button{background:#f6f2e8;border:3px solid transparent;border-radius:10px;padding:4px;color:#222;font-size:14px;font-weight:700;min-height:44px}
.shapes button.sel{border-color:var(--amber)}
.shapes svg{display:block;width:100%;height:auto}
.hold{position:relative;overflow:hidden;width:100%;min-height:56px;border:none;border-radius:12px;background:#6b1d24;color:#fff;font-size:18px;font-weight:900;margin-top:10px}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#c7353a}
.capsule{margin:10px auto;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 6%,#d9dde6 20%,#8d96a8 75%,#5b6477);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px #000a}
.capsule span{width:70px;height:70px;border-radius:50%;border:4px double #c7353a;color:#c7353a;background:#fff4e6;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg)}
.capsule.pop{animation:cap .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes cap{from{transform:scale(.3)}}
.sheet{background:var(--paper);color:var(--ink);border-radius:10px;padding:12px;margin:10px 0;font-size:14px;line-height:1.6}
.sheet li{margin:2px 0}
/* 演出 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.pop{position:fixed;z-index:61;font-family:var(--m);font-weight:900;font-size:20px;color:var(--amber);pointer-events:none;text-shadow:0 2px 0 #000;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:62;background:#05080fee;border:2px solid var(--amber);border-radius:14px;padding:14px 22px;text-align:center;font-size:26px;font-weight:900;color:#ffd28a;pointer-events:none;animation:bn 1.9s ease forwards;white-space:nowrap}
.banner small{display:block;font-size:14px;color:#fff;font-weight:700;margin-top:4px;white-space:normal}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}12%{transform:translate(-50%,-50%) scale(1.08);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.shake{animation:shk .5s}
@keyframes shk{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
#rk{transition:transform 2.2s cubic-bezier(.55,0,.8,.4)}
#rk.up{transform:translateY(-230px)}
.fl{opacity:0;transform-box:fill-box;transform-origin:50% 0}.fl.on{opacity:1;animation:flk .08s infinite alternate}
@keyframes flk{to{transform:scaleY(1.15)}}
.tq{font-size:18px;font-weight:700;line-height:1.6;margin:12px 0}
.tfig{background:#f6f2e8;border-radius:10px;padding:6px;margin-bottom:8px;color:#222}
.tfig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.choice{display:block;width:100%;min-height:52px;text-align:left;background:var(--steel);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:16px;line-height:1.45;color:#fff}
.prog{display:flex;gap:4px;margin:8px 0}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--amber)}
.numshow{font-family:var(--m);font-size:34px;text-align:center;background:#05080f;border-radius:10px;padding:8px;margin:6px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{min-height:52px;font-size:22px;border-radius:10px;border:2px solid var(--line);background:var(--steel)}
.ordsel div{background:#2b2616;border:2px solid var(--amber);border-radius:8px;padding:8px;margin:4px 0;font-size:15px}
.menu{display:grid;gap:8px;margin-top:10px}
.menu button{display:flex;justify-content:space-between;align-items:center;min-height:52px;text-align:left;background:var(--steel);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;color:#fff}
.menu button span{font-family:var(--m);color:var(--sub);font-size:12px;text-align:right}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="title" class="scr"><div class="wrap">
 <div class="kick">LAUNCH CONTROL</div>
 <div class="logo">🚀 実験計画<br>ロケット</div>
 <div class="subt">～比例を確かめる計画～</div>
 <div class="hero" id="hero"></div>
 <p style="font-size:15px;line-height:1.6;margin:6px 0">計画に<b style="color:#ffd28a">穴</b>があると、発射は中止。<br>点検表を直して、実験の計画を打ち上げよう。</p>
 <div id="nameBox"><input id="nameIn" class="namein" maxlength="20" placeholder="なまえ（空でも遊べる）"></div>
 <div class="tbtns">
  <button class="btn amber wide" id="bStart">はじめる</button>
  <button class="btn ghost wide hidden" id="bCont">つづきから</button>
  <button class="btn ghost wide zk hidden" id="bBook1">📖 図鑑</button>
  <button class="btn ghost wide" id="bMute1">🔊 音：オン</button>
 </div>
</div></div>

<div id="game" class="scr hidden"><div class="wrap" style="padding-bottom:0">
 <div class="hudw"><div class="hud"><button class="ib" id="bHome" aria-label="タイトルへ">🏠</button>
  <div class="mid"><b id="hName"></b><span id="hSub"></span></div>
  <button class="ib" id="bMute" aria-label="音">🔊</button></div>
  <div class="hud2"><span>推進力<b id="hScore">0</b></span><span id="zkHud"></span></div></div>
 <div class="pad" id="pad"></div>
 <div class="brief" id="brief"></div>
 <div class="rig"><span class="cap">実験台（計画どおりの図）</span><div id="rig"></div></div>
 <div class="clip"><h3><span>点検表</span><span class="st" id="stamp">下書き</span></h3><div id="rows"></div></div>
 <div class="launchbar"><div class="combo" id="combo"></div><button class="btn amber wide" id="bLaunch">🚀 カウントダウン開始</button></div>
</div></div>

<div id="seal" class="scr hidden"><div class="wrap" id="sealBox"></div></div>
<div id="clear" class="scr hidden"><div class="wrap" id="clearBox"></div></div>
<div id="test" class="scr hidden"><div class="wrap" id="tBox"></div></div>
<div id="ov" class="ov hidden"><div class="ovc" id="ovc"></div></div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();

        '<button data-a="close">とじる</button></div></div>';

      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}

  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){

})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

hoices": ["熱いままでは危険で、てんびんの表示も安定しないから", "冷ますと、さらに酸素が結び付くから", "冷ますと、粉が固まって飛び散らなくなるから", "熱いままのほうが質量が大きく表示されるから"], "ex": "熱い皿はやけどやてんびんの故障のもと。まわりの空気があたためられて表示も落ち着かない。", "kind": "method", "level": 1, "fig": null}, {"id": "chu2-keikaku-rocket-q005", "koma": "chu2-kagaku-30", "t": "num", "q": "表は、ある班の測定結果である。銅と結び付いた酸素の質量は何gか。", "fig": "\u003csvg viewBox=\"0 0 320 102\" width=\"320\">\u003crect x=\"6\" y=\"8\" width=\"308\" height=\"24\" fill=\"#ece6d6\"/>\u003ctext x=\"14\" y=\"25\" font-size=\"13\" fill=\"#333\" font-family=\"sans-serif\">ステンレス皿だけ\u003c/text>\u003ctext x=\"306\" y=\"25\" font-size=\"14\" text-anchor=\"end\" fill=\"#333\" font-family=\"monospace\">20.00 g\u003c/text>\u003crect x=\"6\" y=\"34\" width=\"308\" height=\"24\" fill=\"#fff\"/>\u003ctext x=\"14\" y=\"51\" font-size=\"13\" fill=\"#333\" font-family=\"sans-serif\">皿＋銅（加熱前）\u003c/text>\u003ctext x=\"306\" y=\"51\" font-size=\"14\" text-anchor=\"end\" fill=\"#333\" font-family=\"monospace\">20.80 g\u003c/text>\u003crect x=\"6\" y=\"60\" width=\"308\" height=\"24\" fill=\"#ece6d6\"/>\u003ctext x=\"14\" y=\"77\" font-size=\"13\" fill=\"#333\" font-family=\"sans-serif\">皿＋物質（質量が変わらなくなった後）\u003c/text>\u003ctext x=\"306\" y=\"77\" font-size=\"14\" text-anchor=\"end\" fill=\"#333\" font-family=\"monospace\">21.00 g\u003c/text>\u003c/svg>", "ans": 0.2, "unit": "g", "tol": 0.005, "ex": "結び付いた酸素＝21.00−20.80＝0.20 g。皿の質量は、はじめの銅の質量（0.80 g）を出すのに使う。", "kind": "calc", "level": 1}, {"id": "chu2-keikaku-rocket-q006", "koma": "chu2-kagaku-30", "t": "num", "q": "ステンレス皿だけの質量は21.35 g、皿にマグネシウムの粉をのせると21.95 gだった。のせたマグネシウムは何gか。", "ans": 0.6, "unit": "g", "tol": 0.005, "ex": "金属の質量＝（皿＋金属）−（皿）＝21.95−21.35＝0.60 g。だから皿だけの質量をはじめにはかる。", "kind": "calc", "level": 1, "fig": null}, {"id": "chu2-keikaku-rocket-q007", "koma": "chu2-kagaku-30", "t": "num", "q": "グラフは、銅1.00 gを加熱しては冷ましてはかる操作をくり返した結果である。銅が反応しきったのは、何回目の加熱か（最初に質量が変わらなくなった回）。", "fig": "\u003csvg viewBox=\"0 0 320 212\" width=\"320\">\u003cpath d=\"M50,176 L312,176 M50,176 L50,20\" stroke=\"#333\" stroke-width=\"2\"/>\u003ctext x=\"46\" y=\"180\" font-size=\"10\" text-anchor=\"end\" font-family=\"sans-serif\">1.00\u003c/text>\u003cpath d=\"M50,176 L312,176\" stroke=\"#0002\"/>\u003ctext x=\"46\" y=\"132\" font-size=\"10\" text-anchor=\"end\" font-family=\"sans-serif\">1.10\u003c/text>\u003cpath d=\"M50,128 L312,128\" stroke=\"#0002\"/>\u003ctext x=\"46\" y=\"84\" font-size=\"10\" text-anchor=\"end\" font-family=\"sans-serif\">1.20\u003c/text>\u003cpath d=\"M50,80 L312,80\" stroke=\"#0002\"/>\u003ctext x=\"46\" y=\"36\" font-size=\"10\" text-anchor=\"end\" font-family=\"sans-serif\">1.30\u003c/text>\u003cpath d=\"M50,32 L312,32\" stroke=\"#0002\"/>\u003ctext x=\"62\" y=\"190\" font-size=\"10\" text-anchor=\"middle\" font-family=\"sans-serif\">0\u003c/text>\u003ctext x=\"110\" y=\"190\" font-size=\"10\" text-anchor=\"middle\" font-family=\"sans-serif\">1\u003c/text>\u003ctext x=\"158\" y=\"190\" font-size=\"10\" text-anchor=\"middle\" font-family=\"sans-serif\">2\u003c/text>\u003ctext x=\"206\" y=\"190\" font-size=\"10\" text-anchor=\"middle\" font-family=\"sans-serif\">3\u003c/text>\u003ctext x=\"254\" y=\"190\" font-size=\"10\" text-anchor=\"middle\" font-family=\"sans-serif\">4\u003c/text>\u003ctext x=\"302\" y=\"190\" font-size=\"10\" text-anchor=\"middle\" font-family=\"sans-serif\">5\u003c/text>\u003cpolyline points=\"62,176 110,90 158,75 206,61 254,56 302,56\" fill=\"none\" stroke=\"#C8773C\" stroke-width=\"2.5\"/>\u003ccircle cx=\"62\" cy=\"176\" r=\"4.5\" fill=\"#C8773C\"/>\u003ccircle cx=\"110\" cy=\"90\" r=\"4.5\" fill=\"#C8773C\"/>\u003ccircle cx=\"158\" cy=\"75\" r=\"4.5\" fill=\"#C8773C\"/>\u003ccircle cx=\"206\" cy=\"61\" r=\"4.5\" fill=\"#C8773C\"/>\u003ccircle cx=\"254\" cy=\"56\" r=\"4.5\" fill=\"#C8773C\"/>\u003ccircle cx=\"302\" cy=\"56\" r=\"4.5\" fill=\"#C8773C\"/>\u003ctext x=\"182\" y=\"208\" font-size=\"11\" text-anchor=\"middle\" font-family=\"sans-serif\">加熱した回数〔回〕\u003c/text>\u003ctext x=\"10\" y=\"98\" font-size=\"11\" text-anchor=\"middle\" font-family=\"sans-serif\" transform=\"rotate(-90 10 98)\">加熱後の質量〔g〕\u003c/text>\u003c/svg>", "ans": 4, "unit": "回目", "tol": 0, "ex": "4回目で1.25 gになり、5回目も1.25 gで変わらない。4回目の加熱で反応しきったと分かる。", "kind": "graph", "level": 2}, {"id": "chu2-keikaku-rocket-q008", "koma": "chu2-kagaku-30", "t": "choice", "q": "この実験で、班ごとに変える条件はどれか。", "choices": ["金属の質量", "加熱する時間", "金属の種類", "ステンレス皿の大きさ"], "ex": "変える条件は1つだけ（金属の質量）。ほかの条件をそろえないと、ちがいの原因が分からない。", "kind": "method", "level": 1, "fig": null}, {"id": "chu2-keikaku-rocket-q009", "koma": "chu2-kagaku-30", "t": "choice", "q": "「銅1.00 gだけを加熱して、結び付いた酸素の質量をはかる」という計画の問題点として、最も適切なものはどれか。", "choices": ["結果が1つだけでは、銅の質量と酸素の質量の関係（グラフの形）が分からない", "銅1.00 gでは酸素が足りなくなる", "1.00 gの銅は反応しきらない", "1.00 gは電子てんびんではかれない"], "ex": "点が1つだけではどんな線でも引ける。関係を調べるには金属の質量を何通りも変える。", "kind": "judge", "level": 2, "fig": null}, {"id": "chu2-keikaku-rocket-q010", "koma": "chu2-kagaku-30", "t": "choice", "q": "この実験で、0.1 gまでしか表示できないてんびんではなく、0.01 gまで表示できる電子てんびんを使う理由として、最も適切なものはどれか。", "choices": ["結び付く酸素の質量は0.1〜0.5 gほどと小さく、0.1 gきざみでは差が読み取りにくいから", "0.01 gのてんびんのほうが、熱い皿をのせても平気だから", "0.01 gのてんびんのほうが、酸素が結び付きやすいから", "0.1 gのてんびんでは、皿がのらないから"], "ex": "小さな質量の変化を読み取るには、細かく表示できるてんびんが必要。", "kind": "judge", "level": 2, "fig": null}, {"id": "chu2-keikaku-rocket-q011", "koma": "chu2-kagaku-30", "t": "choice", "q": "ガスバーナーの炎が、ステンレス皿からはみ出さないようにする理由として、最も適切なものはどれか。", "choices": ["はみ出した炎の中で、できた酸化物から酸素がうばわれる（還元される）おそれがあるから", "炎がはみ出すと、ガスがすぐなくなるから", "炎がはみ出すと、皿が軽くなるから", "炎がはみ出すと、酸素が結び付きすぎるから"], "ex": "強い炎で加熱するが、皿からはみ出さないようにする。", "kind": "judge", "level": 3, "fig": null}, {"id": "chu2-keikaku-rocket-q012", "koma": "chu2-kagaku-30", "t": "order", "q": "金属の質量と結び付く酸素の質量を調べる実験の手順を、正しい順に並べよう。", "items": ["ステンレス皿だけの質量をはかる", "金属の粉をはかりとり、皿全体にうすく広げる", "ガスバーナーで加熱する", "冷ましてから、皿ごと質量をはかる", "質量が変わらなくなるまで、加熱と測定をくり返す"], "ex": "皿→金属→加熱→冷まして測定→くり返し。最後に皿と金属の質量を引いて、結び付いた酸素の質量を出す。", "kind": "method", "level": 2, "fig": null}, {"id": "chu2-keikaku-rocket-q013", "koma": "chu2-kagaku-30", "t": "choice", "q": "金属の粉を広げて加熱するのに使う、金属でできた皿を何というか。", "choices": ["ステンレス皿", "ペトリ皿", "時計皿", "るつぼばさみ"], "ex": "ステンレス皿は熱に強く、加熱してもほとんど変化しない。", "kind": "term", "level": 1, "fig": null}, {"id": "chu2-keikaku-rocket-q014", "koma": "chu2-kagaku-30", "t": "choice", "q": "実験の前に、ステンレス皿を一度強く加熱して冷ましておく理由として、最も適切なものはどれか。", "choices": ["実験中に皿そのものの質量が変わらないようにするため", "皿をあたためて、酸素を結び付きやすくするため", "皿の色を黒くして、目立たせるため", "皿を軽くして、測定しやすくするため"], "ex": "皿の質量が実験中に変わると、そのぶんが酸素の質量にまぎれこむ。", "kind": "judge", "level": 3, "fig": null}, {"id": "chu2-keikaku-rocket-q015", "koma": "chu2-kagaku-30", "t": "choice", "q": "マグネシウムの粉を加熱するときの注意として、正しいものはどれか。", "choices": ["燃えると強い光を出すので、直接見つめない", "燃え始めたら、すぐに水をかけて消す", "顔を近づけて、燃え方をよく観察する", "炎が皿をすっぽりつつむように加熱する"], "ex": "マグネシウムは強い光を出して燃え、白い酸化マグネシウムになる。光は見つめない。", "kind": "method", "level": 1, "fig": null}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

function unlocked(r){r=Math.min(r,ROUNDS.length-1);const s=new Set();for(let i=0;i<=r;i++)ROUNDS[i].add.forEach(x=>s.add(x));if(ROUNDS[r].m!=='Mg')s.delete('light');return ORDER.filter(x=>s.has(x))}
function optsOf(sl,m){return SLOT[sl].opts(m)}
function okOpt(sl,m){return optsOf(sl,m).find(o=>o.ok).id}
function draft(r){const R=ROUNDS[r],p={};const u=unlocked(r);u.forEach(sl=>p[sl]=okOpt(sl,R.m));
 if(R.boss){const pool=shuffle(u);pool.slice(0,5).forEach(sl=>{const bad=optsOf(sl,R.m).filter(o=>!o.ok);p[sl]=bad[Math.floor(Math.random()*bad.length)].id})}
 else Object.keys(R.holes).forEach(sl=>p[sl]=R.holes[sl]);return p}

let MUTE=false;try{MUTE=JSON.parse(localStorage.getItem('rika-zukan:profile:v1')||'{}').mute===true}catch(e){}
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,when,slide){if(MUTE)return;const a=ac();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.1,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol,lp){if(MUTE)return;const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol||.1;if(lp){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;s.connect(f);f.connect(g)}else s.connect(g);g.connect(a.destination);s.start()}

const fx=$('fx'),fc=fx.getContext('2d');let P=[],raf=0;
function fxSize(){const d=Math.min(2,devicePixelRatio||1);fx.width=innerWidth*d;fx.height=innerHeight*d;fc.setTransform(d,0,0,d,0,0)}fxSize();addEventListener('resize',fxSize);
function loop(){fc.clearRect(0,0,innerWidth,innerHeight);for(let i=P.length-1;i>=0;i--){const p=P[i];p.t++;p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;p.r+=.1;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fc.restore();if(p.t>160||p.y>innerHeight+20)P.splice(i,1)}raf=P.length?requestAnimationFrame(loop):0}
function kick(){if(!raf)raf=requestAnimationFrame(loop)}

 let s=`<svg viewBox="0 0 330 210">${axes('加熱した回数','加熱後の質量〔g〕',330,210)}`;
 [1.0,1.1,1.2,1.3].forEach(v=>s+=`<text x="36" y="${Y(v)+4}" font-size="10" text-anchor="end">${v.toFixed(2)}</text><path d="M40,${Y(v)} L320,${Y(v)}" stroke="#0001"/>`);
 pts.forEach((v,i)=>s+=`<text x="${X(i)}" y="190" font-size="10" text-anchor="middle">${i}</text>`);
 s+=`<path d="M40,${Y(1.25)} L320,${Y(1.25)}" stroke="#1f6b43" stroke-dasharray="5 4"/><text x="318" y="${Y(1.25)-5}" font-size="10" text-anchor="end" fill="#1f6b43">これ以上増えない（限度）</text>`;
 s+=`<polyline points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}" fill="none" stroke="#C8773C" stroke-width="2.5"/>`+pts.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${i===stopAt?'#ec4a4f':'#C8773C'}"/>`).join('');
 if(stopAt!=null)s+=`<text x="${X(stopAt)+8}" y="${Y(pts[stopAt])+22}" font-size="11" fill="#c7353a" font-weight="900">ここでやめると、まだ増える途中</text>`;
 return s+`<text x="180" y="14" font-size="10" text-anchor="middle" fill="#555">銅 1.00 g を加熱したときの例（前の回で見たグラフ）</text></svg>`}

 if(n===1)s+=`<path d="M40,174 L320,20" stroke="#2549C9" stroke-dasharray="6 4" stroke-width="2"/><path d="M60,90 L320,90" stroke="#2FA36B" stroke-dasharray="6 4" stroke-width="2"/><path d="M40,160 Q120,40 320,60" stroke="#C8773C" stroke-dasharray="6 4" stroke-width="2" fill="none"/><path d="M40,110 L320,72" stroke="#767C8A" stroke-dasharray="6 4" stroke-width="2"/>`;
 else s+=`<path d="M40,152 L320,24" stroke="#2549C9" stroke-dasharray="6 4" stroke-width="2"/><path d="M40,174 Q60,110 130,120 T320,40" stroke="#C8773C" stroke-dasharray="6 4" stroke-width="2" fill="none"/><path d="M40,170 Q150,150 240,70 L320,68" stroke="#2FA36B" stroke-dasharray="6 4" stroke-width="2" fill="none"/>`;
 s+=pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="#ec4a4f" stroke="#fff" stroke-width="2"/>`).join('');
 return s+`<text x="300" y="160" font-size="16" fill="#c7353a" font-weight="900">？</text><text x="180" y="14" font-size="11" text-anchor="middle" fill="#555">点が${n}つだと、どの線も引けてしまう</text></svg>`}

 for(let row=0;row<5;row++){const cnt=9-row*2;for(let i=0;i<cnt;i++){const x=165+(i-(cnt-1)/2)*23,y=150-row*20;const surf=(row===4)||i===0||i===cnt-1;s+=atomS(x,y,r,'Cu');if(surf){const dx=i===0?-14:i===cnt-1?14:0,dy=row===4||(!dx)?-15:-4;s+=atomS(x+dx,y+dy,7,'O')}n++}}

function abortFig(sl,id){

 const rec=S.rec[CUR.r];$('pad').innerHTML=padSVG()+`<div class="cd" id="cd">T-10</div><div class="ghostrec">${rec!=null?`前回のあなた<br>中止 ${rec}回`:'はじめての打ち上げ'}</div>`;

 document.querySelectorAll('.row').forEach(b=>b.onclick=()=>{if(CUR.busy)return;sfx.tap();openSlot(b.dataset.s)})}

 const first=a===0;if(first){bonus+=1500;S.firsts++;if(!S.firstDone[r]){S.firstDone[r]=1;got+=earn(10,'first-try',$('pad'))}}

 zkBtns();$('cT').onclick=()=>{sfx.tap();startTest()};$('cB').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();$('cS').onclick=()=>{sfx.tap();stageMenu()};$('cH').onclick=()=>{sfx.tap();initTitle()}}
function stageMenu(){overlay(`<h2>打ち上げをえらぶ</h2><div class="menu">${ROUNDS.map((R,i)=>`<button data-r="${i}" ${i>(S.maxR||0)&&!S.cleared?'disabled':''}>${esc(R.nm)}<span>${S.rec[i]!=null?'中止 '+S.rec[i]+'回':'―'}</span></button>`).join('')}<button data-r="seal">予想カプセル<span>${S.sealed?'封印ずみ':'―'}</span></button></div><button class="btn ghost wide" id="oX" style="margin-top:10px">とじる</button>`);
 document.querySelectorAll('.menu [data-r]').forEach(b=>b.onclick=()=>{sfx.tap();closeOv();if(b.dataset.r==='seal')sealStart();else{S.plan=null;S.planR=null;startRound(+b.dataset.r)}});$('oX').onclick=()=>{sfx.tap();closeOv()}}
setInterval(()=>{if(!$('game').classList.contains('hidden')&&document.visibilityState==='visible'&&!S.cleared){S.t++;if(S.t%5===0)save()}},1000);

/* ===== 確認テスト ===== */
let T=null;
function startTest(){stopBossTimer();if(!window.Quiz){alert('問題データが読み込まれていません');return}T={qs:Quiz.test(),i:0,ans:[],cur:null};show('test');renderTest()}
function renderTest(){
 const q=T.qs[T.i];T.cur=q.t==='order'?[]:'';
 let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="kick">確認テスト</span><b>第 ${T.i+1} 問 / ${T.qs.length}</b></div>
  <div class="prog">${T.qs.map((_,i)=>`<i class="${i<T.i?'on':''}"></i>`).join('')}</div><div class="tq">${q.q}</div>${q.fig?`<div class="tfig">${q.fig}</div>`:''}`;
 if(q.t==='choice')h+=q.shown.map((c,k)=>`<button class="choice" data-k="${k}">${c}</button>`).join('');
 else if(q.t==='num')h+=`<div class="numshow"><span id="numv">　</span> <small>${esc(q.unit||'')}</small></div><div class="keys">${['7','8','9','4','5','6','1','2','3','0','.','⌫'].map(k=>`<button data-n="${k}">${k}</button>`).join('')}</div><button class="btn amber wide" style="margin-top:10px" id="tOk">決定</button>`;
 else h+=`<p class="small">上から順になるように、タップして並べよう（もう一度タップで外す）</p><div class="ordsel" id="ordSel"></div>${q.shown.map((c,k)=>`<button class="choice" data-o="${k}">${c}</button>`).join('')}<button class="btn amber wide" style="margin-top:8px" id="tOk" disabled>決定</button>`;
 $('tBox').innerHTML=h;
 const next=a=>{T.ans.push(a);sfx.tap();setTimeout(()=>{T.i++;if(T.i<T.qs.length)renderTest();else finishTest()},180)};
 if(q.t==='choice')document.querySelectorAll('#tBox .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tBox .choice').forEach(x=>x.disabled=true);b.style.borderColor='var(--amber)';next(q.shown[+b.dataset.k])});
 else if(q.t==='num'){document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{sfx.tap();const k=b.dataset.n;if(k==='⌫')T.cur=T.cur.slice(0,-1);else if(T.cur.length<8)T.cur+=k;$('numv').textContent=T.cur||'　'});$('tOk').onclick=()=>{if(!T.cur)return;next(T.cur)}}
 else{const upd=()=>{$('ordSel').innerHTML=T.cur.map((k,n)=>`<div data-r="${n}">${n+1}. ${q.shown[k]}</div>`).join('');
   document.querySelectorAll('[data-o]').forEach(b=>b.style.display=T.cur.includes(+b.dataset.o)?'none':'block');
   document.querySelectorAll('[data-r]').forEach(d=>d.onclick=()=>{T.cur.splice(+d.dataset.r);upd()});$('tOk').disabled=T.cur.length!==q.shown.length};
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{sfx.tap();T.cur.push(+b.dataset.o);upd()});$('tOk').onclick=()=>{if(T.cur.length!==q.shown.length)return;next(T.cur.map(k=>q.shown[k]))};upd()}
}
function finishTest(){
 const qs=T.qs,answers=T.ans;const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const name=S.name||window.PLAYER_NAME||'';
 const sealTxt=S.seal?('銅2倍→酸素'+S.seal.predT):'―';
 const records=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(S.t)],['一発発射',S.firsts+' / '+ROUNDS.length],['発射中止（合計）',S.aborts+' 回'],['封印した予想',sealTxt]];
 sfx.jingle();
 const rec=SubmitCard.show({gameId:GAME_ID,grade:'chu2',koma:[KOMA],unit:'中2理科　化学変化と原子・分子　第30回',game:'実験計画ロケット ～比例を確かめる計画～'+(TEST_ONLY?'（確認テストのみ）':''),name,score,total:qs.length,marks,records,review},()=>renderResult(score,qs.length));
 T.rec=rec;if(!TEST_ONLY){S.test={score,total:qs.length};save()}renderResult(score,qs.length);
}
function renderResult(score,total){show('test');
 $('tBox').innerHTML=`<div class="brief" style="text-align:center;margin-top:16px"><span class="kick">確認テスト</span><div class="mono" style="font-size:58px;color:#ffd28a">${score}<span style="font-size:22px"> / ${total}</span></div>
  <p style="font-size:16px">${score===total?'満点！ 完ぺきな計画力だ。':score>=Math.ceil(total*.7)?'合格ライン突破！':'解説を読んで、もう一度ためそう。'}</p>
  <div class="tbtns"><button class="btn amber wide" id="rCard">📝 提出カードを表示</button><button class="btn ghost wide" id="rRetry">もう一度テストを解く</button>
  ${TEST_ONLY?'':'<button class="btn ghost wide zk hidden" id="rB">📖 図鑑</button><button class="btn ghost wide" id="rT">🏠 タイトルへ</button>'}</div></div>`;zkBtns();
 $('rCard').onclick=()=>{if(T&&T.rec&&SubmitCard.reopen)SubmitCard.reopen(T.rec)};$('rRetry').onclick=()=>startTest();
 if(!TEST_ONLY){$('rB').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();$('rT').onclick=()=>initTitle()}}

/* ===== タイトル ===== */
function initTitle(){stopBossTimer();show('title');zkBtns();$('hero').innerHTML=padSVG(true);$('nameIn').value=S.name||window.PLAYER_NAME||'';if(window.PLAYER_NAME)$('nameBox').classList.add('hidden');
 $('bCont').classList.toggle('hidden',!S.started);$('bCont').textContent=S.cleared?'つづきから（確認テスト・計画書）':S.ph==='seal'?'つづきから（予想カプセル）':`つづきから（${ROUNDS[Math.min(S.r,ROUNDS.length-1)].nm}）`}
function takeName(){const v=$('nameIn').value.trim();S.name=v||window.PLAYER_NAME||S.name||'';save()}
$('bStart').onclick=()=>{ac();sfx.tap();takeName();if(S.started&&!confirm('はじめから打ち上げますか？（記録の一部は残ります）'))return;
 const keep={name:S.name,rec:S.rec,firstDone:S.firstDone,mainDone:S.mainDone,ctrlGot:S.ctrlGot,ruleGot:S.ruleGot,sealed:S.sealed,seal:S.seal,maxR:S.maxR};S=Object.assign(fresh(),keep);S.ph='play';save();startRound(0)};
$('bCont').onclick=()=>{ac();sfx.tap();takeName();
 if(S.cleared){overlay(`<h2>どこから？</h2><div class="tbtns"><button class="btn amber wide" id="oT">📝 確認テスト</button><button class="btn ghost wide" id="oC">📜 計画書を見る</button><button class="btn ghost wide" id="oS">打ち上げをえらぶ</button><button class="btn ghost wide" id="oX">とじる</button></div>`);
  $('oT').onclick=()=>{closeOv();startTest()};$('oC').onclick=()=>{closeOv();renderClear();show('clear')};$('oS').onclick=()=>{closeOv();stageMenu()};$('oX').onclick=closeOv}
 else if(S.ph==='seal'||S.bossDone)sealStart();else startRound(S.r)};
$('bBook1').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();
$('bMute1').onclick=()=>{setMute(!MUTE);if(!MUTE){ac();sfx.tap()}};$('bMute').onclick=()=>{setMute(!MUTE);if(!MUTE){ac();sfx.tap()}};
$('bHome').onclick=()=>{sfx.tap();save();initTitle()};
$('ov').addEventListener('pointerdown',e=>{if(e.target===$('ov')&&$('ovc').querySelector('#oX')&&!$('holdB'))closeOv()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
setMute(MUTE);if(window.PLAYER_NAME&&!S.name)S.name=window.PLAYER_NAME;
if(TEST_ONLY){S.name=window.PLAYER_NAME||S.name||'';startTest()}else initTitle();
window.__KR={S:()=>S,CUR:()=>CUR,start:startRound,test:startTest,seal:sealStart,okOpt,unlocked,ROUNDS,fix:()=>{unlocked(CUR.r).forEach(sl=>CUR.plan[sl]=okOpt(sl,ROUNDS[CUR.r].m));renderRows();renderRig()}};
})();
</script>
</body>
</html>
