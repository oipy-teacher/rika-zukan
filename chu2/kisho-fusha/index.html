<!--
  風車の村の紙飛行機 ～高気圧・低気圧と風～（中2理科 気象 コマ18 / kisho-fusha / chu2-kisho-18）

  ■ 世界とメタファー: 「折り紙の風車の谷」。谷も畑も山も家も、色紙を折って作ったジオラマ。
    プレイヤーは谷の村に紙飛行機を届ける配達係。地図に折り紙の「高」「低」の駒を置くと、
    そのまわりに風（紙テープのうず）がおこり、紙飛行機が風に乗って曲がる。
    高気圧からは時計回りにふき出し、低気圧へは反時計回りにふきこむ（北半球・上から見て）。
    旗の風車に届くと、風の通り道にある村の風車がいっせいに回る（風が強いところほど速く回る＝風の地図）。
  ■ 画風（技法）: 折り紙。どの物も「色紙の面＋折り目の陰影（明るい面と暗い面）＋紙の厚み（ずれた影）」で描く。
    畑は折り目のついた色紙のパッチワーク、山は谷折りの三角、木は重ねた三角、風車はかざぐるま、飛行機は紙飛行機。
    等圧線は地図に入った「折り目」として描く。ボタン・札・枠も色紙を折った形（角は四角・折り返しの三角）。
  ■ 配色: 背景 #F3EFE6（生成りの台紙）／主 #2E5E4E（深緑の色紙）／差し #E4572E（朱の色紙）。
    高気圧の駒は藍 #2F5D8A、低気圧の駒は朱 #E4572E（天気図の慣習：高＝青・低＝赤）。村ごとに畑の色紙が変わる。
  ■ 書体: 見出し＝M PLUS 1（900の太い角ゴシック）／本文＝Zen Kaku Gothic New。
  ■ 画面の組み方: 全画面canvasの折り紙ジオラマが主役。
    PC・iPad横＝横長の地図の左から投げる／スマホ・iPad縦＝同じ地図を90°回した縦長の地図の下から投げる
    （回転なので「時計回り」は変わらない。方位記号の北も一緒に回る）。
    上端＝もどる札・村の名札・かけら（折り鶴）・音。下端＝駒の袋（高・低）。
  ■ HUD: かけらは折り鶴の数。Zukan.hud は使わず Zukan.state() で読む。
  ■ 音: オルゴール風の澄んだ音、紙のこすれる音、風の音（WebAudio合成）。ミュートあり。
  ■ 理科＝操作: 風は投げる前には見えない（2つめの村から）。駒を置いた位置と種類だけで風が決まり、
    投げた後は手を出せない。一発で届いたときだけかけら。外れたら「あと何マス」を本当の距離で見せ、風を見せて置き直す。
  ■ 深さ: 高気圧・低気圧のまわりの風の吹き方に「触れる」程度（解説 L4383-4384）。等圧線は「間がせまいほど風が強い」まで。
-->

  </div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };

cy=\"130\" r=\"4\" fill=\"#15244a\"/>\u003ctext x=\"298\" y=\"125\" font-size=\"13\" font-weight=\"900\" fill=\"#15244a\">D\u003c/text>\u003ctext x=\"30\" y=\"196\" font-size=\"10\" fill=\"#1d3f8f\">1024\u003c/text>\u003ctext x=\"286\" y=\"196\" font-size=\"10\" fill=\"#1d3f8f\">1004\u003c/text>\u003c/svg>", "choices": ["A", "B", "C", "D"], "ex": "等圧線の間隔がせまいところほど気圧の差が大きく、風が強い。Aの付近が最もせまい。", "id": "chu2-kisho-fusha-q005", "koma": "chu2-kisho-18"}, {"t": "choice", "kind": "term", "level": 1, "q": "天気図で、まわりよりも気圧が高いところを何というか。", "choices": ["高気圧", "低気圧", "前線", "気団"], "ex": "まわりより気圧が高いところが高気圧、低いところが低気圧。", "id": "chu2-kisho-fusha-q006", "koma": "chu2-kisho-18", "fig": null}, {"t": "choice", "kind": "judge", "level": 2, "q": "ある天気図で、中心の気圧が1008hPaで、まわりにいくほど気圧が低くなっていた。この中心について正しいものはどれか。", "choices": ["まわりより気圧が高いので、高気圧である", "1013hPaより低いので、低気圧である", "1013hPaより低いので、高気圧とも低気圧ともいえない", "中心の数字が小さいので、低気圧である"], "ex": "高気圧・低気圧は数値の大きさではなく、まわりと比べて高いか低いかで決まる。", "id": "chu2-kisho-fusha-q007", "koma": "chu2-kisho-18", "fig": null}, {"t": "choice", "kind": "judge", "level": 1, "q": "高気圧の中心付近の空気の動きと天気について、正しいものはどれか。", "choices": ["下降気流ができ、雲ができにくく晴れやすい", "上昇気流ができ、雲ができやすくくもりやすい", "下降気流ができ、雲ができやすく雨が降りやすい", "上昇気流ができ、雲ができにくく晴れやすい"], "ex": "高気圧の中心付近では空気が下りてくる（下降気流）。下りる空気は温度が上がるので雲ができにくい。", "id": "chu2-kisho-fusha-q008", "koma": "chu2-kisho-18", "fig": null}, {"t": "choice", "kind": "judge", "level": 1, "q": "低気圧の中心付近で雲ができやすいのはなぜか。", "choices": ["まわりから風がふきこみ、上昇気流ができるから", "まわりへ風がふき出し、下降気流ができるから", "中心付近は気圧が高く、空気が圧縮されるから", "中心付近は風がなく、空気が冷えるから"], "ex": "ふきこんだ空気は上へのぼる（上昇気流）。上昇した空気は膨張して冷え、雲ができる。", "id": "chu2-kisho-fusha-q009", "koma": "chu2-kisho-18", "fig": null}, {"t": "num", "kind": "graph", "level": 1, "q": "天気図の等圧線は、1000hPaを基準に何hPaごとに引かれているか（太い線は20hPaごと）。", "ans": 4, "unit": "hPa", "tol": 0, "ex": "細い等圧線は4hPaごと、1000hPaから20hPaごとに太い線で引く。", "id": "chu2-kisho-fusha-q010", "koma": "chu2-kisho-18", "fig": null}, {"t": "num", "kind": "graph", "level": 1, "q": "図の地点Pは、等圧線の上にある。Pの気圧は何hPaか。", "fig": "\u003csvg x ら南に向かって吹いてくる風", "南から北に向かって吹いていく風", "北へ向かって吹いていく風", "北半球だけで吹く風"], "ex": "風向は、風が吹いてくる方位で表す。北の風は北から吹いてくる。", "id": "chu2-kisho-fusha-q012", "koma": "chu2-kisho-18", "fig": null}, {"t": "choice", "kind": "judge", "level": 3, "q": "図のように、西に高気圧、東に低気圧がある。その間の地点Cに吹く風のおおよその向きとして最も適当なものはどれか。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 190\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"190\" fill=\"#f7f4ec\"/>\u003ctext x=\"8\" y=\"16\" font-size=\"12\" font-weight=\"700\" fill=\"#15244a\">北↑\u003c/text>\u003cellipse cx=\"80\" cy=\"95\" rx=\"22\" ry=\"22\" fill=\"none\" stroke=\"#1d3f8f\" stroke-width=\"1.4\"/>\u003cellipse cx=\"80\" cy=\"95\" rx=\"44\" ry=\"44\" fill=\"none\" stroke=\"#1d3f8f\" stroke-width=\"1.4\"/>\u003cellipse cx=\"80\" cy=\"95\" rx=\"66\" ry=\"66\" fill=\"none\" stroke=\"#1d3f8f\" stroke-width=\"1.4\"/>\u003ccircle cx=\"80\" cy=\"95\" r=\"13\" fill=\"#1d3f8f\"/>\u003ctext x=\"80\" y=\"100\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"900\" fill=\"#fff\" font-family=\"serif\">高\u003c/text>\u003cellipse cx=\"240\" cy=\"95\" rx=\"22\" ry=\"22\" fill=\"none\" stroke=\"#1d3f8f\" stroke-width=\"1.4\"/>\u003cellipse cx=\"240\" cy=\"95\" rx=\"44\" ry=\"44\" fill=\"none\" stroke=\"#1d3f8f\" stroke-width=\"1.4\"/>\u003cellipse cx=\"240\" cy=\"95\" rx=\"66\" ry=\"66\" fill=\"none\" stroke=\"#1d3f8f\" stroke-width=\"1.4\"/>\u003ccircle cx=\"240\" cy=\"95\" r=\"13\" fill=\"#b33a2e\"/>\u003ctext x=\"240\" y=\"100\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"900\" fill=\"#fff\" font-family=\"serif\">低\u003c/text>\u003ccircle cx=\"160\" cy=\"95\" r=\"4\" fill=\"#15244a\"/>\u003ctext x=\"166\" y=\"90\" font-size=\"13\" font-weight=\"900\" fill=\"#15244a\">C\u003c/text>\u003c/svg>", "choices": ["北西の風", "南東の風", "北東の風", "南西の風"], "ex": "高気圧（西）から低気圧（東）へ向かい、北半球では右へそれて南東へ流れる。北西から吹いてくる風になる。", "id": "chu2-kisho-fusha-q013", "koma": "chu2-kisho-18"}, {"t": "choice", "kind": "judge", "level": 2, "q": "高気圧と低気圧を近づけると、その間の風はどうなるか。", "choices": ["等圧線の間隔がせまくなり、風が強くなる", "等圧線の間隔が広くなり、風が強くなる", "等圧線の間隔がせまくなり、風が弱くなる", "気圧の差が消えて、風がやむ"], "ex": "近いほど短い距離で気圧が大きく変わる＝等圧線の間隔がせまい。そこでは風が強い。", "id": "chu2-kisho-fusha-q014", "koma": "chu2-kisho-18", "fig": null}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

/* ===== 物理（風と紙飛行機） ===== */
/*SIM_BEGIN*/
const SIG=4.0,RC=1.0,AMP=20,KW=1.4,DEF=30*Math.PI/180,S0=2.4,TAU=2.8,AIR=8,SDT=1/60,HITR=0.9,MW=16,MH=10,CONE=32*Math.PI/180;
function field(pcs,u,v){let gx=0,gy=0,P=1012;
 for(const p of pcs){const dx=u-p.u,dy=v-p.v,r=Math.sqrt(dx*dx+dy*dy+RC*RC),e=Math.exp(-r/SIG)*(p.k==='H'?AMP:-AMP);P+=e;gx-=dx/(r*SIG)*e;gy-=dy/(r*SIG)*e}
 const fx=-gx*KW,fy=-gy*KW,c=Math.cos(DEF),s=Math.sin(DEF);return [fx*c-fy*s,fx*s+fy*c,P]}
function canPlace(fl,pcs,u,v,skip){if(u<0.4||u>MW-0.4||v<0.4||v>MH-0.4)return false;
 for(const L of fl.launch)if(Math.hypot(u-L[0],v-L[1])<1.3)return false;
 for(const m of (fl.mts||[]))if(Math.hypot(u-m[0],v-m[1])<m[2]+0.35)return false;
 for(let i=0;i<pcs.length;i++)if(i!==skip&&Math.hypot(u-pcs[i].u,v-pcs[i].v)<1.1)return false;return true}
/* 1本の飛行機を飛ばす。戻り値: {path,hits:[targetIdx順],end:'land'|'crash'|'out'|'wet',minD:[各目標までの最小距離]} */
function fly(fl,pcs,li,ang,pow,rec){let u=fl.launch[li][0],v=fl.launch[li][1],t=0;const dx=Math.cos(ang),dy=Math.sin(ang);
 const tg=fl.targets,minD=tg.map(()=>99),hits=[],path=rec?[[u,v,0,0]]:null;let end='land',k=0;
 while(t<AIR){const w=field(pcs,u,v),s=S0*pow*Math.exp(-t/TAU),vx=dx*s+w[0],vy=dy*s+w[1];u+=vx*SDT;v+=vy*SDT;t+=SDT;k++;
  if(rec&&k%3===0)path.push([u,v,t,Math.hypot(w[0],w[1])]);
  for(let i=0;i<tg.length;i++){const d=Math.hypot(u-tg[i][0],v-tg[i][1]);if(d<minD[i])minD[i]=d;if(d<HITR&&!hits.includes(i)){hits.push(i);if(rec)path.push([u,v,t,-1-i])}}
  if(u<-0.6||u>MW+0.6||v<-0.6||v>MH+0.6){end='out';break}
  let bad=false;for(const m of (fl.mts||[]))if(Math.hypot(u-m[0],v-m[1])<m[2]){bad=true;break}if(bad){end='crash';break}
  if(fl.rain){for(const p of pcs)if(p.k==='L'&&Math.hypot(u-p.u,v-p.v)<0.95){bad=true;break}if(bad){end='wet';break}}
 }
 if(rec)path.push([u,v,t,0]);return {path,hits,end,minD,u,v}}
/* 1回の投げ（扇投げは全部）の結果 */
function throwAll(fl,pcs,ang,pow,rec){const res=fl.launch.map((_,li)=>fly(fl,pcs,li,ang+(fl.fan?fl.fan[li]:0),pow,rec));
 const got=new Set();res.forEach(r=>r.hits.forEach(h=>got.add(h)));
 const need=fl.need||'all';let ok;
 if(fl.fanAll)ok=res.every(r=>r.hits.length>0)&&got.size>=fl.targets.length;else ok=got.size>=fl.targets.length;
 return {res,ok,got:got.size}}
/*SIM_END*/

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function bell(f,d,v,dl){if(!S.sound||!ac())return;const t=AC.currentTime+(dl||0);[[1,1],[2.01,.35],[3.98,.12]].forEach(([m,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime((v||.08)*a,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+(d||.9)*(m>1?.5:1));o.connect(g);g.connect(MG);o.start(t);o.stop(t+(d||.9)+.05)})}
function noise(d,v,lo,hi,dl,sweep){if(!S.sound||!ac())return;const t=AC.currentTime+(dl||0),n=Math.max(1,Math.floor(AC.sampleRate*d)),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(lo,t);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+d);f.Q.value=hi||1;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.05,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d+.02)}

const shC=new Map();
function shade(hex,k){const key=hex+k;let r=shC.get(key);if(r)return r;let R,G,B;if(hex[0]==='#'){const n=parseInt(hex.slice(1),16);R=n>>16;G=n>>8&255;B=n&255}else{const m=hex.match(/\d+/g).map(Number);R=m[0];G=m[1];B=m[2]}
 if(k>0){R+=(255-R)*k;G+=(255-G)*k;B+=(255-B)*k}else{R*=1+k;G*=1+k;B*=1+k}r='rgb('+Math.round(R)+','+Math.round(G)+','+Math.round(B)+')';shC.set(key,r);return r}
function poly(g,pts,fill){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fillStyle=fill;g.fill()}
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function fh(sz,w){return (w||900)+' '+sz+'px "M PLUS 1","Hiragino Kaku Gothic ProN",sans-serif'}

function startTest(){if(!window.Quiz)return;MODE='test';F=null;TS={qs:Quiz.test(),i:0,ans:[]};showUI();renderQ()}
function renderQ(){const q=TS.qs[TS.i],box=$('#tbox');
 box.innerHTML='<div class="tno">確認テスト　第'+(TS.i+1)+'問 / '+TS.qs.length+'</div><div class="prog">'+TS.qs.map((_,i)=>'<i class="'+(i<TS.i?'on':'')+'"></i>').join('')+'</div><div class="tq">'+q.q+'</div>'+(q.fig?'<div class="fig2">'+q.fig+'</div>':'')+'<div id="ta"></div>';
 const ta=$('#ta');
 if(q.t==='choice'){const d=document.createElement('div');d.className='ch';q.shown.forEach(c=>{const b=document.createElement('button');b.innerHTML=c;b.onclick=()=>ans(c);d.appendChild(b)});ta.appendChild(d)}
 else if(q.t==='num'){ta.innerHTML='<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="数を入力"><b>'+esc(q.unit||'')+'</b><button class="fb s" id="numOk" style="flex:0 0 auto"><span>決定</span></button></div>';$('#numOk').onclick=()=>{const v=$('#numIn').value.trim();if(v==='')return;ans(v)}}
 else{const picked=[];ta.innerHTML='<div class="small">正しい順にタップしよう</div><div class="ord" id="ordBox"></div><div class="ch" id="ordPool"></div><div class="row" style="margin-top:10px"><button class="fb w s" id="ordRe"><span>やり直す</span></button><button class="fb s" id="ordOk" disabled><span>決定</span></button></div>';
  const drawO=()=>{$('#ordBox').innerHTML=picked.map((t,i)=>'<div>'+(i+1)+'. '+t+'</div>').join('');const pool=$('#ordPool');pool.innerHTML='';q.shown.forEach(t=>{if(picked.includes(t))return;const b=document.createElement('button');b.innerHTML=t;b.onclick=()=>{picked.push(t);sfx.tap();drawO()};pool.appendChild(b)});$('#ordOk').disabled=picked.length!==q.shown.length};
  drawO();$('#ordRe').onclick=()=>{picked.length=0;drawO()};$('#ordOk').onclick=()=>ans(picked.slice())}
 $('#test').scrollTop=0}
function ans(v){TS.ans.push(v);sfx.tap();TS.i++;if(TS.i<TS.qs.length)renderQ();else finishTest()}
function finishTest(){const qs=TS.qs,review=Quiz.review(qs,TS.ans),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;sfx.clear();
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',S.cleared?fmtT(S.t):'—'],['一発で届いた',S.first+' / '+nFlights()+'回'],['集めたかざぐるま',S.mills.filter(Boolean).length+' / 10'],['★',totalStars()+' / '+nFlights()*3]];
 TS.card=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:UNIT,game:GTITLE+(TEST_ONLY?'（確認テストのみ）':''),name:playerName(),score,total:qs.length,marks,records:recs,review},showTestResult);showTestResult()}
function showTestResult(){const r=TS.card||{};$('#tbox').innerHTML='<h2>テストの結果</h2><p style="font-family:var(--fh);font-weight:900;font-size:40px;margin:6px 0;color:var(--main)">'+(r.score||0)+' / '+(r.total||0)+' 点</p><div style="display:flex;flex-direction:column;gap:10px"><button class="fb" id="rCard"><span>提出カードをもう一度見る</span></button><button class="fb b" id="rAgain"><span>↺ テストをもう一度</span></button>'+(TEST_ONLY?'':'<button class="fb w s" id="rTitle"><span>タイトルへ</span></button>')+'<button class="fb w s zk" id="rBook"><span>📖 図鑑</span></button></div>';
 $('#rCard').onclick=()=>SubmitCard.reopen(TS.card,()=>{});$('#rAgain').onclick=()=>startTest();if($('#rTitle'))$('#rTitle').onclick=()=>toTitle();$('#rBook').onclick=openBook;zkButtons()}

/* ===== タイトル ===== */
function toTitle(){MODE='title';F=null;DECO=null;showUI();$('#bCont').classList.toggle('hidden',!S.started);bgKey=''}
$('#bStart').onclick=()=>{ac();sfx.fold();const nm=$('#nameIn').value.trim()||S.name,snd=S.sound;
 if(S.started&&!confirm0()){}S=fresh();S.name=nm;S.sound=snd;S.started=true;save();startFlight(0,0)};
function confirm0(){return true}
$('#bCont').onclick=()=>{ac();sfx.fold();const v=$('#nameIn').value.trim();if(v)S.name=v;save();toMap()};
$('#bSnd').onclick=toggleSnd;$('#bBook1').onclick=openBook;$('#bBook2').onclick=openBook;$('#bGacha').onclick=openGacha;$('#bMill1').onclick=millBook;$('#bMill2').onclick=millBook;

/* ===== ループ ===== */
let last=performance.now(),kkT=0,secT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);kkT-=dt;if(kkT<=0){kk();kkT=1}
 if(MODE==='play'||MODE==='map'){secT+=dt;if(secT>=1){secT-=1;if(MODE==='play'){S.t++;if(S.t%10===0)save()}}}
 draw(now);requestAnimationFrame(loop)}
addEventListener('resize',()=>{resize()});
resize();
try{window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]})}catch(e){}
setSnd();
if(window.PLAYER_NAME){$('#nameIn').value=window.PLAYER_NAME;$('#nameRow').classList.add('hidden')}else if(S.name)$('#nameIn').value=S.name;
/* 試験用のつまみ（画面の確認用） */
window.__game={S:()=>S,F:()=>F,startFlight,toMap,startTest,mode:()=>MODE,
 place:(k,u,v)=>{F.pcs.push({k,u,v});pieceMoved()},clear:()=>{F.pcs=[];pieceMoved()},aim:(a,p)=>{F.aim.a=a;F.aim.p=p},throw:()=>doThrow(),
 solve:(n)=>{const V=F.V,kinds=[];for(let i=0;i<V.H;i++)kinds.push('H');for(let i=0;i<V.L;i++)kinds.push('L');for(let z=0;z<(n||4000);z++){const pcs=[];for(const k of kinds){for(let q=0;q<40;q++){const u=.5+Math.random()*15,v=.5+Math.random()*9;if(canPlace(F.fl,pcs,u,v)){pcs.push({k,u,v});break}}}for(let a=-30;a<=30;a+=10)for(const p of [1,.8]){if(throwAll(F.fl,pcs,a*PI/180,p).ok){F.pcs=pcs;pieceMoved();F.aim.a=a*PI/180;F.aim.p=p;return true}}}return false},
 villageClear,mainClear,step:dt=>update(dt)};
if(TEST_ONLY)startTest();else toTitle();
requestAnimationFrame(loop);
</script>
</body></html>
