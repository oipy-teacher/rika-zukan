<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雲をつくる役づくり ～雲をつくる実験の計画～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bench:#1c1f22;--bench2:#272b30;--chalk:#f1efe6;--cream:#f4ecd6;--ink:#23201c;--amber:#e2a23b;--red:#d0533f;--blue:#3d6fb6;--teal:#2a8c8c;--brass:#b08a3e;--grn:#4f9a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--chalk);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
body{background:var(--bench);background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.4px),radial-gradient(rgba(255,255,255,.025) 1px,transparent 1.2px);background-size:7px 7px,11px 13px;overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.chalk{font-family:"Klee One","Zen Kaku Gothic New",sans-serif;font-weight:600}
.hidden{display:none!important}
#app{width:100%;max-width:560px;margin:0 auto;padding:8px 10px 28px}
.btn{font:inherit;font-weight:900;font-size:17px;min-height:48px;padding:10px 16px;border-radius:10px;border:2px solid var(--amber);background:var(--amber);color:#231a08;box-shadow:0 3px 0 #7a5418;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sub{background:transparent;color:var(--chalk);border-color:rgba(241,239,230,.55);box-shadow:none}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 0 #7c2a1d}
.btn[disabled]{opacity:.38;transform:none}
.btn.small{font-size:14px;min-height:44px;padding:6px 12px}
.panel{background:var(--bench2);border:1.5px solid rgba(176,138,62,.6);border-radius:12px;padding:12px 14px;margin-top:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 10px rgba(0,0,0,.35)}
.panel h3{margin:0 0 6px;font-size:19px}
.tiny{font-size:13px;opacity:.8}
#title{text-align:center;padding-top:6px}
#title h1{font-size:clamp(28px,8.4vw,42px);margin:4px 0 0;line-height:1.25}
#title .sub{font-weight:900;font-size:17px;color:var(--amber);margin-bottom:8px}
#title .lead{text-align:left;font-size:15.5px;line-height:1.75;max-width:440px;margin:8px auto}
#title .row{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:12px}
#title .row .btn{width:min(82vw,320px)}
#nameRow{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:900;margin-top:6px}
#nameRow input{font:inherit;font-size:17px;padding:8px 10px;border:2px solid var(--brass);border-radius:8px;width:12em;background:#fffaf0;color:var(--ink)}
#hud{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#101214;border:1px solid rgba(176,138,62,.5);border-radius:10px;font-weight:900;font-size:13px;overflow:hidden}
#hud .pill{background:rgba(255,255,255,.08);padding:3px 8px;border-radius:6px;white-space:nowrap}
#hChip{color:var(--amber)}
#hZk{min-width:0;overflow:hidden;flex:1 1 auto;text-align:right}
.iconbtn{font:inherit;min-width:44px;min-height:44px;border-radius:8px;border:1.5px solid rgba(241,239,230,.4);background:transparent;color:var(--chalk);font-size:18px;cursor:pointer}
#note{display:flex;gap:3px;margin:8px 0 2px}
#note i{flex:1;height:9px;border-radius:2px;background:rgba(255,255,255,.1)}
#note i.on{background:var(--amber)}
#note i.gift{background:#8f7440}
#noteLb{font-size:11.5px;opacity:.75;display:flex;justify-content:space-between}
#task{margin-top:6px}
#task .tb{font-size:12.5px;color:var(--amber);font-weight:900;letter-spacing:.05em}
#task .q{font-size:18px;line-height:1.45;margin:2px 0 2px}
#task .h{font-size:13.5px;opacity:.85;line-height:1.5}
#bench{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fl{background:rgba(255,255,255,.035);border:2px solid rgba(255,255,255,.12);border-radius:12px;padding:4px 4px 6px;cursor:pointer;transition:border-color .15s}
.fl.act{border-color:var(--amber);box-shadow:0 0 0 2px rgba(226,162,59,.25)}
.fl .lab{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:14px;padding:0 4px}
.fl .lab b{font-size:20px;color:var(--amber)}
.fl svg.fsvg{display:block;width:100%;height:auto}
.slot{display:flex;align-items:center;gap:6px;min-height:44px;margin-top:4px;padding:4px 6px;border-radius:8px;background:rgba(0,0,0,.25);border:1.5px dashed rgba(255,255,255,.22);font-size:13px;line-height:1.25;cursor:pointer;touch-action:manipulation}
.slot .band{width:6px;align-self:stretch;border-radius:3px;flex:0 0 6px}
.slot .fn{font-size:11px;opacity:.75;display:block}
.slot.fill{background:var(--cream);color:var(--ink);border:1.5px solid #fff;font-weight:700}
.slot.bad{background:#ffd9d0;border-color:var(--red);box-shadow:0 0 0 2px var(--red);animation:shake .35s}
.slot.pen{position:relative}
.slot.pen:after{content:"✎";position:absolute;right:4px;top:2px;color:var(--red);font-size:14px}
.slot.lock{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#handWrap{margin-top:10px}
#handLb{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900;opacity:.9}
#hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px;min-height:100px}
.card{position:relative;background:var(--cream);color:var(--ink);border-radius:8px;border:1.5px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.45);padding:0 2px 4px;text-align:center;cursor:pointer;min-height:96px;display:flex;flex-direction:column;align-items:center;touch-action:manipulation;animation:deal .35s ease-out both}
.card .cb{align-self:stretch;height:16px;border-radius:6px 6px 0 0;margin:0 -2px;color:#fff;font-size:10.5px;font-weight:900;line-height:16px}
.card svg{width:40px;height:40px;margin:3px 0 1px}
.card .cv{font-size:11px;font-weight:900;line-height:1.2}
.card:active{transform:translateY(2px)}
@keyframes deal{0%{opacity:0;transform:translateY(-18px) rotate(-8deg)}100%{opacity:1;transform:none}}
#acts{display:flex;gap:8px;margin-top:10px}
#acts .btn{flex:1}
#msg{margin-top:8px;font-size:15px;line-height:1.6}
#msg .ng{color:#ffb4a5;font-weight:900}
#msg .ok{color:#b6e3a8;font-weight:900}
.ov{position:fixed;inset:0;background:rgba(10,11,12,.72);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
.ov .paper{background:#f7f1e1;color:var(--ink);border-radius:14px;max-width:470px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:center}
.ov .paper h2{margin:4px 0 6px;font-size:22px}
.ov .paper p{font-size:15px;line-height:1.65;text-align:left;margin:6px 0}
.ov .paper .btn.sub{color:var(--ink);border-color:#8a8170}
.yaku{display:inline-block;font-family:"Klee One",serif;font-weight:600;font-size:30px;color:#fff;background:var(--red);border-radius:10px;padding:4px 16px;transform:rotate(-3deg);box-shadow:0 4px 0 #7c2a1d;animation:stp .5s cubic-bezier(.2,1.6,.4,1)}
.yaku.kime{background:#1f6d3a;box-shadow:0 4px 0 #0f3a1e}
.yaku.bad{background:#555;box-shadow:0 4px 0 #222}
@keyframes stp{0%{transform:rotate(-3deg) scale(2.2);opacity:0}100%{transform:rotate(-3deg) scale(1);opacity:1}}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pick button{font:inherit;font-weight:700;font-size:16px;min-height:48px;border-radius:10px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.pick button.cur{background:#e9dfc5}
.opt{display:block;width:100%;font:inherit;font-size:14.5px;font-weight:700;min-height:44px;margin:5px 0;padding:6px 10px;border-radius:8px;border:2px solid #8a8170;background:#fff;color:var(--ink);text-align:left;cursor:pointer;line-height:1.4}
.opt.sel{background:#fde7b5;border-color:#b2791a}
.plan{background:#fff;border:1.5px solid #cfc3a5;border-radius:10px;padding:6px 8px;margin:8px 0;text-align:left}
.plan .pt{font-weight:900;font-size:15px}
.plan .pd{font-size:13px;line-height:1.5}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.minis svg{width:100%;height:auto;background:#262a2e;border-radius:6px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.recs div{background:rgba(255,255,255,.06);border:1px solid rgba(176,138,62,.6);border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:900}
.recs b{display:block;font-size:19px;color:var(--amber)}
.col{display:flex;flex-direction:column;gap:10px;margin-top:12px}
#tbox .tno{font-weight:900;color:var(--amber)}
#tbox .prog{display:flex;gap:4px;margin:6px 0 12px}
#tbox .prog i{flex:1;height:8px;border-radius:2px;background:rgba(255,255,255,.12)}
#tbox .prog i.on{background:var(--amber)}
#tbox .tq{font-size:17.5px;font-weight:900;line-height:1.65;margin-bottom:10px}
#tbox .fig2{background:#fbf7ec;border-radius:8px;padding:6px;margin:6px 0 12px;text-align:center}
#tbox .fig2 svg{max-width:100%;height:auto;max-height:260px}
.ch{display:flex;flex-direction:column;gap:8px}
.ch button{font:inherit;text-align:left;font-size:15.5px;font-weight:700;min-height:50px;padding:8px 12px;border-radius:10px;border:2px solid rgba(241,239,230,.5);background:rgba(255,255,255,.06);color:var(--chalk);cursor:pointer;line-height:1.45}
.ch button:active{background:rgba(226,162,59,.3)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{font:inherit;font-size:22px;width:8em;padding:8px 10px;border:2px solid var(--brass);border-radius:8px}
.ord{min-height:54px;border:2px dashed rgba(241,239,230,.5);border-radius:8px;padding:6px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.ord div{background:var(--cream);color:var(--ink);border-radius:6px;padding:6px 8px;font-weight:700;font-size:15px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.pop{position:fixed;z-index:95;pointer-events:none;font-weight:900;font-size:20px;color:var(--amber);text-shadow:0 2px 0 #000;animation:pop 1.2s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-8px) scale(1.15);opacity:1}100%{transform:translate(-50%,-64px) scale(1);opacity:0}}
.smoke{animation:drift 4s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(3px,-4px)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app">

<section id="title">
  <svg viewBox="0 0 340 170" style="width:min(90vw,400px)" aria-hidden="true">
    <rect x="0" y="126" width="340" height="44" fill="#131517"/><path d="M0 126 H340" stroke="#3a3f45" stroke-width="2"/>
    <g id="tFlaskA"></g><g id="tFlaskB"></g>
    <g transform="translate(236 44)">
      <rect x="-8" y="70" width="106" height="12" rx="3" fill="#6b4b24"/><rect x="-8" y="66" width="106" height="6" fill="#8a6533"/>
      <g transform="rotate(-10 20 40)"><rect x="0" y="0" width="40" height="64" rx="5" fill="#f4ecd6" stroke="#fff"/><rect x="0" y="0" width="40" height="11" rx="4" fill="#3d6fb6"/><text x="20" y="42" text-anchor="middle" font-size="18" font-weight="900" fill="#23201c">引</text></g>
      <g><rect x="28" y="-4" width="40" height="64" rx="5" fill="#f4ecd6" stroke="#fff"/><rect x="28" y="-4" width="40" height="11" rx="4" fill="#2a8c8c"/><text x="48" y="38" text-anchor="middle" font-size="18" font-weight="900" fill="#23201c">水</text></g>
      <g transform="rotate(10 76 40)"><rect x="56" y="0" width="40" height="64" rx="5" fill="#f4ecd6" stroke="#fff"/><rect x="56" y="0" width="40" height="11" rx="4" fill="#7a7266"/><text x="76" y="42" text-anchor="middle" font-size="18" font-weight="900" fill="#23201c">煙</text></g>
    </g>
    <text x="12" y="156" font-size="13" fill="#e2a23b" font-weight="900">理科準備室　実験台 No.3</text>
  </svg>
  <div class="tiny" style="font-weight:900">中2理科 気象とその変化 第17回（探究）</div>
  <h1 class="chalk">雲をつくる役づくり</h1>
  <div class="sub">～ 雲をつくる実験の計画 ～</div>
  <div class="lead panel">🎴 手札は <b>実験の条件カード</b>。フラスコ <b>A</b> と <b>B</b> に1枚ずつ置いて、<b>ちがうのは1か所だけ</b>の組（役）をつくろう。<br>2か所以上ちがうと <b>役くずれ</b>。</div>
  <div id="nameRow"><label for="nameIn">なまえ</label><input id="nameIn" maxlength="20" placeholder="（なくてもOK）" autocomplete="off"></div>
  <div class="row">
    <button class="btn" id="bStart">🎴 はじめる</button>
    <button class="btn sub hidden" id="bCont">⏩ つづきから</button>
    <button class="btn sub zk hidden" id="bBook1">📖 図鑑</button>
    <button class="btn sub" id="bSnd1">🔊 音：オン</button>
  </div>
</section>

<section id="game" class="hidden">
  <div id="hud"><span class="pill" id="hNo">導入</span><span class="pill" id="hChip">🪙 0</span><span id="hZk"></span><button class="iconbtn" id="bSnd2" aria-label="音">🔊</button></div>
  <div id="note"></div><div id="noteLb"><span>📓 実験ノート</span><span id="noteTx"></span></div>
  <div id="task" class="panel"><div class="tb" id="tTb"></div><div class="q chalk" id="tQ"></div><div class="h" id="tH"></div></div>
  <div id="bench"></div>
  <div id="handWrap"><div id="handLb"><span id="handTx">手札</span><span id="deckTx"></span></div><div id="hand"></div></div>
  <div id="acts"><button class="btn sub" id="bDraw">🔄 引き直し</button><button class="btn red" id="bGo">🃏 勝負（計画を出す）</button></div>
  <div id="msg"></div>
</section>

<section id="notebook" class="hidden"><div class="panel" id="nbox"></div></section>

<section id="clear" class="hidden">
  <div class="panel">
    <h3 class="chalk" style="font-size:24px">実験ノート、完成！</h3>
    <p style="line-height:1.7">雲ができる条件を確かめるには、<b>変える条件を1つだけ</b>にして、<b>ほかの条件はすべてそろえる</b>（対照実験）。そろえる条件は、<b>雲ができやすい側</b>にそろえると差がはっきり見える。</p>
    <div class="recs" id="recs"></div>
    <div class="col"><button class="btn red" id="bTest">📝 確認テストへ（10問）</button><button class="btn sub zk hidden" id="bBook2">📖 図鑑</button></div>
  </div>
</section>
<section id="test" class="hidden"><div class="panel" id="tbox"></div></section>
<section id="result" class="hidden"><div class="panel" id="rbox"></div></section>
</div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',

    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

iddle\">室温\u003c/text>\u003ctext x=\"258\" y=\"134\" font-size=\"12\" text-anchor=\"middle\">室温\u003c/text>\u003cpath d=\"M96 22 V134 M204 22 V134\" stroke=\"#cfc3a5\"/>\u003c/svg>", "choices": ["水の条件もちがっていて、くもってもピストンと水のどちらが効いたか分からない", "けむりを両方に入れているので、比べられない", "Bのピストンも引かないと、比べられない", "温度をそろえているので、比べられない"], "ex": "変える条件は1つだけ。ピストン（気圧）と水の2つがちがうと、結果の原因を1つに決められない。", "id": "chu2-kisho-jouken-yaku-q001", "koma": "chu2-kisho-17"}, {"t": "choice", "kind": "method", "level": 1, "q": "「温度を下げるだけで雲ができるか」を確かめる。フラスコA・Bの組み合わせとして最もよいものはどれか。ほかの条件（水・けむり・容器）はA・Bで同じにしてある。", "choices": ["A：氷水で冷やす・ピストンは動かさない／B：室温のまま・ピストンは動かさない", "A：氷水で冷やす・ピストンを引く／B：室温のまま・ピストンは動かさない", "A：氷水で冷やす・ピストンを引く／B：ぬるま湯であたためる・ピストンを押す", "A：室温のまま・ピストンを引く／B：室温のまま・ピストンは動かさない"], "ex": "温度だけを変え、ピストンは両方動かさない。ピストンも変えると、温度とピストンのどちらが効いたか分からない。", "id": "chu2-kisho-jouken-yaku-q002", "koma": "chu2-kisho-17", "fig": null}, {"t": "choice", "kind": "judge", "level": 2, "q": "フラスコAは内側をぬらし、Bはかわいたままにした。それ以外の条件はすべて同じにして、両方のピストンを引くと、Aだけが白くくもった。この結果から言えることはどれか。", "choices": ["空気中の水蒸気の量が、雲のでき方に関係している", "ピストンを引くと、どのフラスコでも必ずくもる", "けむりがあるかどうかが、雲のでき方に関係している", "水蒸気の量は、雲のでき方に関係していない"], "ex": "変えたのは水（湿り具合）だけ。結果にちがいが出たので、水蒸気の量が関係していると言える。", "id": "chu2-kisho-jouken-yaku-q003", "koma": "chu2-kisho-17", "fig": null}, {"t": "choice", "kind": "judge", "level": 2, "q": "A：ピストンを引く・けむりを入れる／B：ピストンを動かさない・けむりなし（ほかは同じ）で実験すると、Aだけくもった。この結果から言えることとして正しいものはどれか。", "choices": ["気圧とけむりのどちらが効いたのかは、この結果だけでは分からない", "くもったのは、けむりを入れたからだと言える", "くもったのは、気圧が下がったからだと言える", "気圧もけむりも、雲のでき方には関係しない"], "ex": "2つの条件を同時に変えると、どちらが原因か決められない。1つずつ変えて確かめ直す。", "id": "chu2-kisho-jouken-yaku-q004", "koma": "chu2-kisho-17", "fig": null}, {"t": "choice", "kind": "term", "level": 1, "q": "調べたい条件だけを変え、それ以外の条件を同じにして結果を比べる実験を何というか。", "choices": ["対照実験", "予備実験", "再現実験", "演示実験"], "ex": "変える条件を1つにして、ほかをそろえた実験を対照実験という。", "id": "chu2-kisho-jouken-yaku-q005", "koma": "chu2-kisho-17", "fig": null}, {"t": "order", "kind": "method", "level": 1, "q": "フラスコで雲をつくる実験の手順を、正しい順に並べよう。", "items": ["フラスコの内側をぬるま湯でぬらす", "線香のけむりを少し入れる", "注射器と温度計をつけたゴム栓をする", "ピストンをすばやく引いて、温度と中のようすを見る"], "ex": "先に湿らせてけむりを入れ、ゴム栓で閉じてから、ピストンを動かして変化を見る。", "id": "chu2-kisho-jouken-yaku-q006", "koma": "chu2-kisho-17", "fig": null}, {"t": "choice", "kind": "judge", "level": 1, "q": "雲をつくる実験で、注射器のピストンをすばやく引いたとき、フラスコの中の空気はどうなるか。", "choices": ["気圧が下がり、膨張して、温度が下がる", "気圧が上がり、圧縮されて、温度が下がる", "気圧が下がり、膨張して、温度が上がる", "気圧は変わらず、温度だけが下がる"], "ex": "引くと中の気圧が下がり、空気が膨張して温度が下がる。露点に届くと水蒸気が水滴になり白くくもる。", "id": "chu2-kisho-jouken-yaku-q007", "koma": "chu2-kisho-17", "fig": null}, {"t": "choice", "kind": "method", "level": 1, "q": "雲をつくる実験で、フラスコに線香のけむりを少し入れるのはなぜか。", "choices": ["けむりの粒が芯になり、水蒸気が水滴になりやすくなるから", "けむりでフラスコの中の温度を上げるため", "けむりが水蒸気に変わって、水蒸気を増やすため", "けむりの量で気圧を測るため"], "ex": "けむりの細かい粒が水滴の芯になり、凝結しやすくなる。けむりがないと、くもりにくい。", "id": "chu2-kisho-jouken-yaku-q008", "koma": "chu2-kisho-17", "fig": null}, {"t": "num", "kind": "calc", "level": 1, "q": "ピストンを引くと、デジタル温度計の表示が 25.9℃ から 25.4℃ に変わった。温度は何℃下がったか。", "ans": 0.5, "unit": "℃", "tol": 0.05, "ex": "25.9−25.4＝0.5℃。温度の変化はわずかなので、0.1℃まで測れる温度計を使う。", "id": "chu2-kisho-jouken-yaku-q009", "koma": "chu2-kisho-17", "fig": null}, {"t": "choice", "kind": "judge", "level": 2, "q": "「湿り具合で雲のでき方が変わるか」を調べるため、Aは内側をぬらし、Bはかわいたままにした。ほかの条件はそろえたが、ピストンは両方とも「押す」にした。この計画の弱点はどれか。", "choices": ["どちらも圧縮されて温度が上がり、くもりにくいので、差が見えにくい", "ピストンが同じなので、比べられない", "押すと膨張して、どちらも必ずくもってしまう", "水を入れると気圧が変わるので、比べられない"], "ex": "変える条件は1つでも、そろえる値が悪いと差が出ない。雲ができやすい側（ピストンを引く）にそろえる。", "id": "chu2-kisho-jouken-yaku-q010", "koma": "chu2-kisho-17", "fig": null}, {"t": "choice", "kind": "judge", "level": 3, "q": "飛行機雲がすぐ消えた日と、長く残った日がある。校庭の百葉箱の記録では、2日とも湿度は61％だった。ある人は「湿度は飛行機雲の残り方に関係ない」と考えた。この考えの判断として最も適切なものはどれか。", "choices": ["飛行機雲ができる上空の湿度を調べないと、関係ないとは言えない", "校庭の湿度が同じなので、関係ないと言える", "気温がちがう日なので、関係ないと言える", "校庭で湿度がちがう別の日を調べないと、関係ないとは言えない"], "ex": "調べたいのは上空で起きること。地上の記録だけでは、上空の条件がそろっているか分からない。", "id": "chu2-kisho-jouken-yaku-q011", "koma": "chu2-kisho-17", "fig": null}, {"t": "choice", "kind": "method", "level": 2, "q": "ピストンの効き目（気圧）を調べる計画を図のように組んだ。ピストン以外で、そろっていない条件はどれか。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 160\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"160\" fill=\"#fbf7ec\"/>\u003cg transform=\"translate(0 0)\">\u003cpath d=\"M52 30 V75 A30 30 0 1 0 68 75 V30Z\" fill=\"#eaf4fb\" stroke=\"#23201c\" stroke-width=\"2\"/>\u003crect x=\"48\" y=\"22\" width=\"24\" height=\"10\" fill=\"#7a3b2a\"/>\u003cpath d=\"M64 22 V12 H100\" stroke=\"#555\" stroke-width=\"3\" fill=\"none\"/>\u003crect x=\"100\" y=\"6\" width=\"30\" height=\"12\" fill=\"#fff\" stroke=\"#23201c\"/>\u003cpath d=\"M110 12 H128\" stroke=\"#23201c\" stroke-width=\"2\"/>\u003crect x=\"128\" y=\"4\" width=\"3\" height=\"16\" fill=\"#23201c\"/>\u003cellipse cx=\"60\" cy=\"124\" rx=\"18\" ry=\"4\" fill=\"#6db3e8\"/>\u003cpath d=\"M44 100 q8 -10 16 -2 t16 -6\" stroke=\"#8a8378\" stroke-width=\"3\" fill=\"none\"/>\u003ctext x=\"60\" y=\"152\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">A（300mL）\u003c/text>\u003ctext x=\"112\" y=\"34\" font-size=\"10\" text-anchor=\"middle\">引く\u003c/text>\u003c/g>\u003cg transform=\"translate(160 0)\">\u003cpath d=\"M52 30 V67 A38 38 0 1 0 68 67 V30Z\" fill=\"#eaf4fb\" stroke=\"#23201c\" stroke-width=\"2\"/>\u003crect x=\"48\" y=\"22\" width=\"24\" height=\"10\" fill=\"#7a3b2a\"/>\u003cpath d=\"M64 22 V12 H100\" stroke=\"#555\" stroke-width=\"3\" fill=\"none\"/>\u003crect x=\"100\" y=\"6\" width=\"30\" height=\"12\" fill=\"#fff\" stroke=\"#23201c\"/>\u003cpath d=\"M94 12 H112\" stroke=\"#23201c\" stroke-width=\"2\"/>\u003crect x=\"112\" y=\"4\" width=\"3\" height=\"16\" fill=\"#23201c\"/>\u003cellipse cx=\"60\" cy=\"132\" rx=\"23\" ry=\"4\" fill=\"#6db3e8\"/>\u003cpath d=\"M44 100 q8 -10 16 -2 t16 -6\" stroke=\"#8a8378\" stroke-width=\"3\" fill=\"none\"/>\u003ctext x=\"60\" y=\"152\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\">B（500mL）\u003c/text>\u003ctext x=\"108\" y=\"34\" font-size=\"10\" text-anchor=\"middle\">動かさない\u003c/text>\u003c/g>\u003c/svg>", "choices": ["容器の大きさ", "水（内側をぬらすか）", "線香のけむり", "温度計の有無"], "ex": "Aは300mL、Bは500mLのフラスコ。容器もそろえないと、ちがいが気圧のせいか容器のせいか分からない。", "id": "chu2-kisho-jouken-yaku-q012", "koma": "chu2-kisho-17"}, {"t": "choice", "kind": "method", "level": 2, "q": "フラスコを氷水で冷やしてくもるかどうか調べる。ピストンの扱いとして最もよいものはどれか。", "choices": ["A・Bとも動かさない", "A・Bとも引く", "冷やす方だけ引く", "冷やさない方だけ引く"], "ex": "ピストンを引くと膨張して冷えるので、温度の効き目とまざる。温度だけを調べるときは両方動かさない。", "id": "chu2-kisho-jouken-yaku-q013", "koma": "chu2-kisho-17", "fig": null}, {"t": "choice", "kind": "method", "level": 3, "q": "「温度」と「けむり」の両方が雲のでき方に関係するか確かめたい。進め方として最もよいものはどれか。", "choices": ["温度だけを変える実験と、けむりだけを変える実験を、別々に行う", "温度とけむりを同時に変えた1回の実験で、両方を確かめる", "温度もけむりも同じにして、何回もくり返す", "けむりの量だけを増やしていき、温度は気にしない"], "ex": "1回の比較で変えるのは1つだけ。2つの条件を調べたいときは、比較を2つに分ける。", "id": "chu2-kisho-jouken-yaku-q014", "koma": "chu2-kisho-17", "fig": null}]};

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

 $('#nbox').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;const tb=+b.dataset.tb;sel[tb]=sel[tb]||{};
  if(b.dataset.p!=null){sel[tb].p=+b.dataset.p;$('#nbox').querySelectorAll('.opt[data-tb="'+tb+'"][data-p]').forEach(x=>x.classList.toggle('sel',x===b))}
  else{sel[tb].r=+b.dataset.r;$('#nbox').querySelectorAll('.opt[data-tb="'+tb+'"][data-r]').forEach(x=>x.classList.toggle('sel',x===b))}
  sfx.tap();$('#bSeal').disabled=!need.every(tb=>sel[tb]&&sel[tb].p!=null&&sel[tb].r!=null)});
 $('#bSeal').onclick=()=>doSeal(sel,need)}
function doSeal(sel,need){const slots={};need.forEach(tb=>{const p=S.plans[tb],t=TABLES[tb].t;slots[t]={plan:planText(p,tb),pred:PRED[sel[tb].p],reason:REASON[t][sel[tb].r],q:TABLES[tb].q}});
 const rec={v:1,koma:KOMA,game:GID,at:Date.now(),name:S.name||'',slots};try{localStorage.setItem(SEAL_KEY,JSON.stringify(rec))}catch(e){}
 S.sealed=true;S.seal=rec;S.cleared=true;save();sfx.seal();if(!S.rule.pred){S.rule.pred=1;earn(10,'predict',innerWidth/2,innerHeight/2)}
 overlay('<span class="yaku">封</span><h2>予想を封印した</h2><p>'+need.map(tb=>'計画'+(tb+1)+'：'+esc(slots[TABLES[tb].t].pred)).join('<br>')+'</p><p class="tiny">開けるのは、理科室でフラスコの実験をしたあと。</p>','つぎへ',()=>toClear())}

/* ===== 画面きりかえ ===== */
function show(id){for(const s of['title','game','notebook','clear','test','result'])$('#'+s).classList.toggle('hidden',s!==id);scrollTo(0,0)}
let clock=null;function startClock(){clearInterval(clock);clock=setInterval(()=>{if(!$('#game').classList.contains('hidden')||!$('#notebook').classList.contains('hidden')){S.t++;if(S.t%5===0)save()}},1000)}
function fmtT(t){return Math.floor(t/60)+'分'+String(t%60).padStart(2,'0')+'秒'}
function enterGame(){show('game');try{if(window.Zukan&&Zukan.hud){$('#hZk').innerHTML='';Zukan.hud($('#hZk'))}}catch(e){}if(S.cleared)return toClear();startClock();if(S.ri>=ROUNDS.length)return notebook();
 if(S.ri===0&&!S.introSeen){S.introSeen=1;save();return overlay('<h2 class="chalk">雲をつくる実験を計画しよう</h2><div style="background:#262a2e;border-radius:10px;padding:4px;max-width:230px;margin:0 auto">'+flaskSVG({P:'pull',T:'room',W:'wet',S:'in'},{temp:'25.4'})+'</div><p>丸底フラスコ・注射器・デジタル温度計。いろいろな<b>条件</b>を変えられる。<br>「何が雲をつくるのか」を確かめるには、フラスコ<b>A</b>と<b>B</b>をどう組めばいい？</p>','やってみる',()=>startRound(0))}
 startRound(S.ri)}
function toClear(){show('clear');clearInterval(clock);
 $('#recs').innerHTML='<div>クリアタイム<b>'+fmtT(S.t)+'</b></div><div>成立させた役<b>'+S.made+'</b></div><div>決め役<b>'+S.kime+'</b></div><div>一発成立<b>'+S.firstOK+'</b></div><div>役くずれ<b>'+S.kuzure+'回</b></div><div>チップ<b>🪙 '+S.chips+'</b></div>';
 sfx.big();burst(innerWidth/2,200,70,true);zkButtons();
 if(!S.mainDone&&window.Zukan&&Zukan.mainClear){S.mainDone=1;save();try{Zukan.mainClear({onClose:()=>{}})}catch(e){}}}
$('#bStart').onclick=()=>{ac();const nm=$('#nameIn').value.trim()||S.name,snd=S.sound;S=fresh();S.name=nm;S.sound=snd;S.started=true;save();enterGame()};
$('#bCont').onclick=()=>{ac();const v=$('#nameIn').value.trim();if(v)S.name=v;save();enterGame()};
const sndT=()=>{S.sound=!S.sound;save();setSnd()};$('#bSnd1').onclick=sndT;$('#bSnd2').onclick=sndT;
function openBook(){try{window.Zukan&&Zukan.openBook&&Zukan.openBook({unit:'kisho'})}catch(e){}}
$('#bBook1').onclick=openBook;$('#bBook2').onclick=openBook;$('#bTest').onclick=()=>startTest();

/* ===== 確認テスト ===== */
let T=null;function playerName(){return window.PLAYER_NAME||S.name||''}
function startTest(){if(!window.Quiz)return;T={qs:Quiz.test(),i:0,ans:[]};show('test');renderQ()}
function renderQ(){const q=T.qs[T.i],box=$('#tbox');
 box.innerHTML='<div class="tno">📝 確認テスト　第'+(T.i+1)+'問 / '+T.qs.length+'</div><div class="prog">'+T.qs.map((_,i)=>'<i class="'+(i<T.i?'on':'')+'"></i>').join('')+'</div><div class="tq">'+q.q+'</div>'+(q.fig?'<div class="fig2">'+q.fig+'</div>':'')+'<div id="ta"></div>';
 const ta=$('#ta');
 if(q.t==='choice'){const d=document.createElement('div');d.className='ch';q.shown.forEach(c=>{const b=document.createElement('button');b.innerHTML=c;b.onclick=()=>ans(c);d.appendChild(b)});ta.appendChild(d)}
 else if(q.t==='num'){ta.innerHTML='<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="数を入力"><b>'+esc(q.unit||'')+'</b><button class="btn" id="numOk">決定</button></div>';$('#numOk').onclick=()=>{const v=$('#numIn').value.trim();if(v)ans(v)}}
 else{const picked=[];ta.innerHTML='<div class="tiny">正しい順にタップしよう</div><div class="ord" id="ordBox"></div><div class="ch" id="ordPool"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sub" id="ordRe">やり直す</button><button class="btn" id="ordOk" disabled>決定</button></div>';
  const dr=()=>{$('#ordBox').innerHTML=picked.map((t,i)=>'<div>'+(i+1)+'. '+t+'</div>').join('');const pool=$('#ordPool');pool.innerHTML='';q.shown.forEach(t=>{if(picked.includes(t))return;const b=document.createElement('button');b.innerHTML=t;b.onclick=()=>{picked.push(t);sfx.tap();dr()};pool.appendChild(b)});$('#ordOk').disabled=picked.length!==q.shown.length};
  dr();$('#ordRe').onclick=()=>{picked.length=0;dr()};$('#ordOk').onclick=()=>ans(picked.slice())}
 scrollTo(0,0)}
function ans(v){T.ans.push(v);sfx.tap();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}
function sealText(){const s=S.seal&&S.seal.slots;if(!s)return '—';return Object.keys(s).map(k=>F[k].q+'：'+s[k].pred).join('／')}
function finishTest(){const qs=T.qs,review=Quiz.review(qs,T.ans),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 sfx.big();burst(innerWidth/2,220,60,true);
 if(TEST_ONLY&&!S.seal){try{const o=JSON.parse(localStorage.getItem(SEAL_KEY)||'null');if(o&&o.slots)S.seal=o}catch(e){}}
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',S.cleared?fmtT(S.t):'—'],['成立させた役',S.made+'（決め役 '+S.kime+'）'],['役くずれ',S.kuzure+'回'],['実験ノートの予想',sealText()]];
 T.card=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:UNIT,game:GTITLE+(TEST_ONLY?'（確認テストのみ）':''),name:playerName(),score,total:qs.length,marks,records:recs,review},showResult);showResult()}
function showResult(){show('result');const r=T.card||{};
 $('#rbox').innerHTML='<h3 style="font-size:24px">テストの結果</h3><p style="font-size:22px;font-weight:900">'+(r.score||0)+' / '+(r.total||0)+' 点</p><div class="col"><button class="btn" id="rCard">📝 提出カードをもう一度見る</button><button class="btn sub" id="rAgain">↺ テストをもう一度</button>'+(TEST_ONLY?'':'<button class="btn sub" id="rTitle">🏠 タイトルへ</button>')+'<button class="btn sub zk hidden" id="rBook">📖 図鑑</button></div>';
 $('#rCard').onclick=()=>SubmitCard.reopen(T.card,()=>{});$('#rAgain').onclick=()=>startTest();if($('#rTitle'))$('#rTitle').onclick=()=>toTitle();$('#rBook').onclick=openBook;zkButtons()}
function zkButtons(){const has=!!(window.Zukan&&Zukan.openBook);document.querySelectorAll('.zk').forEach(b=>b.classList.toggle('hidden',!has))}
function toTitle(){show('title');$('#bCont').classList.toggle('hidden',!S.started);zkButtons()}
/* タイトルの絵 */
(function(){const a=$('#tFlaskA'),b=$('#tFlaskB');const mk=(c,x)=>{const s=flaskSVG(c).replace('<svg class="fsvg"','<svg x="'+x+'" y="6" width="122" height="120" ');return s};
 a.outerHTML=mk({P:'pull',T:'room',W:'wet',S:'in'},0);b.outerHTML=mk({P:'stay',T:'room',W:'wet',S:'in'},120)})();
setSnd();
if(window.PLAYER_NAME){$('#nameIn').value=window.PLAYER_NAME;$('#nameRow').classList.add('hidden')}else if(S.name)$('#nameIn').value=S.name;
window.__game={state:()=>S,R:()=>R,ROUNDS,judge,startRound,notebook,F};
if(TEST_ONLY){$('#title').classList.add('hidden');startTest()}else toTitle();
</script>
</body>
</html>
