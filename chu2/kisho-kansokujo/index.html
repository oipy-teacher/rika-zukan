<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>観測所をひらこう ～観測の計画～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--kraft:#efe3c8;--paper:#fffdf5;--ink:#23324a;--red:#c9302c;--blue:#2f6db5;--rule:#b9d3ea;--grn:#3f7d4e;--mus:#d9a520}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
body{background:var(--kraft);background-image:repeating-linear-gradient(0deg,rgba(120,90,40,.05) 0 2px,transparent 2px 5px);overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mincho{font-family:"Zen Old Mincho","Hiragino Mincho ProN",serif;font-weight:900}
.hidden{display:none!important}
#app{width:100%;max-width:560px;margin:0 auto;padding:8px 10px 26px}
.btn{font:inherit;font-weight:900;font-size:17px;min-height:48px;padding:10px 16px;border-radius:8px;border:2.5px solid var(--ink);background:var(--ink);color:#fffdf5;box-shadow:0 3px 0 rgba(35,50,74,.45);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.sub{background:var(--paper);color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.4;transform:none}
.sheet{background:var(--paper);border:2px solid var(--ink);border-radius:6px;box-shadow:3px 4px 0 rgba(35,50,74,.25);background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--rule) 27px 28px);position:relative}
.sheet.plain{background-image:none}
.sheet:before{content:"";position:absolute;left:30px;top:0;bottom:0;width:1.5px;background:rgba(201,48,44,.45)}
.sheet.plain:before{display:none}
.stamp{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:"Zen Old Mincho",serif;font-weight:900;color:var(--red);border:3px double var(--red);border-radius:50%;width:74px;height:74px;min-width:74px;line-height:1;text-align:center;padding:0;font-size:18px;transform:rotate(-12deg);background:rgba(255,253,245,.85);white-space:nowrap}
.stamp.big{width:104px;height:104px;min-width:104px;font-size:24px;border-width:5px}
.stamp.ok{color:var(--grn);border-color:var(--grn)}
.stamp.stampin{animation:stp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stp{0%{transform:rotate(-12deg) scale(2.4);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
#title{text-align:center;padding-top:8px}
#title h1{font-size:clamp(30px,9vw,44px);margin:6px 0 0;line-height:1.2}
#title .sub{font-weight:900;font-size:17px;color:var(--red);margin-bottom:10px}
#title .lead{padding:12px 14px 12px 42px;margin:10px auto;max-width:430px;font-size:16px;line-height:1.75;text-align:left}
#title .row{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:12px}
#title .row .btn{width:min(80vw,320px)}
#nameRow{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:900}
#nameRow input{font:inherit;font-size:17px;padding:8px 10px;border:2.5px solid var(--ink);border-radius:6px;width:12em;background:#fff}
.tiny{font-size:13px;color:#4a5568}
#hud{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 8px;margin-bottom:8px;background:var(--ink);color:#fffdf5;border-radius:6px;font-weight:900;font-size:13.5px;overflow:hidden}
#hud .pill{background:rgba(255,255,255,.14);padding:3px 8px;border-radius:4px;white-space:nowrap}
#hZk{min-width:0;overflow:hidden;flex-shrink:1}
.iconbtn{font:inherit;min-width:44px;min-height:44px;border-radius:6px;border:2px solid var(--ink);background:var(--paper);font-size:18px;cursor:pointer}
#req{padding:10px 60px 10px 42px;margin-bottom:8px}
#req .iconbtn{position:absolute;right:8px;top:8px}
#req .no{font-weight:900;color:var(--red);font-size:13px}
#req .nm{font-family:"Zen Old Mincho",serif;font-weight:900;font-size:19px;line-height:1.35}
#req .ds{font-size:14.5px;line-height:1.6;margin-top:2px}
#area{margin-top:8px}
.panel{padding:12px 12px 14px 42px;margin-top:8px;font-size:15px;line-height:1.7}
.panel h3{margin:0 0 4px;font-family:"Zen Old Mincho",serif;font-size:18px}
.row2{margin:8px 0}
.row2 .lb{font-weight:900;font-size:14px;margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:14px;font-weight:700;min-height:44px;padding:5px 10px;border-radius:6px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;line-height:1.3;text-align:left;touch-action:manipulation}
.seg button.on{background:var(--ink);color:#fffdf5}
.seg button small{display:block;font-size:11.5px;font-weight:700;opacity:.85}
#est{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 6px;text-align:center;font-weight:900;font-size:12.5px}
#est div{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:4px}
#est b{display:block;font-size:19px}
#est .bad b{color:var(--red)}
.warn{color:var(--red);font-weight:900;font-size:14px}
#mapWrap{position:relative;border:2px solid var(--ink);border-radius:6px;overflow:hidden;box-shadow:3px 4px 0 rgba(35,50,74,.25)}
#map{display:block;width:100%;touch-action:none}
#clock{position:absolute;left:8px;top:8px;background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:2px 10px;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
#tip{position:absolute;right:8px;top:8px;left:110px;background:rgba(35,50,74,.88);color:#fffdf5;border-radius:6px;padding:4px 8px;font-size:12.5px;font-weight:700}
#live{margin-top:8px;padding:6px 8px 4px 38px}
.gsvg{width:100%;height:auto;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{font:inherit;font-size:14px;font-weight:700;min-height:44px;padding:6px 10px;border-radius:6px;border:2px solid var(--ink);background:#fff;cursor:pointer;text-align:left}
.chips button.on{background:#ffe7a3}
.fig{width:100%;max-width:440px;display:block;margin:6px auto;height:auto}
.stamprow{display:flex;gap:12px;align-items:center}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.recs div{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:900}
.recs b{display:block;font-size:20px;color:var(--blue)}
.col{display:flex;flex-direction:column;gap:10px;margin-top:12px}
#tbox{padding-left:42px}
#tbox .tno{font-weight:900;color:var(--red)}
#tbox .prog{display:flex;gap:4px;margin:6px 0 12px}
#tbox .prog i{flex:1;height:8px;border-radius:2px;background:#e0d4b6;border:1px solid var(--ink)}
#tbox .prog i.on{background:var(--red)}
#tbox .tq{font-size:18px;font-weight:900;line-height:1.65;margin-bottom:10px}
#tbox .fig2{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:6px;margin:6px 0 12px;text-align:center}
#tbox .fig2 svg{max-width:100%;height:auto;max-height:230px}
.ch{display:flex;flex-direction:column;gap:8px}
.ch button{font:inherit;text-align:left;font-size:16px;font-weight:700;min-height:50px;padding:8px 12px;border-radius:6px;border:2.5px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;line-height:1.45}
.ch button:active{background:#ffe7a3}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{font:inherit;font-size:22px;width:9em;padding:8px 10px;border:2.5px solid var(--ink);border-radius:6px}
.ord{min-height:54px;border:2.5px dashed var(--ink);border-radius:6px;padding:6px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.ord div{background:#ffe7a3;border:2px solid var(--ink);border-radius:6px;padding:6px 8px;font-weight:700;font-size:15px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{position:fixed;z-index:60;pointer-events:none;font-weight:900;font-size:19px;color:var(--ink);background:#fffdf5;border:2px solid var(--ink);border-radius:6px;padding:1px 8px;animation:pop 1.2s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-8px) scale(1.1);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;opacity:0}
#banner.on{animation:ban 1.7s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="banner"></div>
<div id="app">

<section id="title">
  <svg viewBox="0 0 320 160" style="width:min(86vw,380px)" aria-hidden="true">
    <rect x="10" y="12" width="300" height="136" rx="6" fill="#fffdf5" stroke="#23324a" stroke-width="2.5"/>
    
    <path d="M10 44 H310 M10 72 H310 M10 100 H310 M10 128 H310" stroke="#b9d3ea" stroke-width="1.2"/><path d="M40 12 V148" stroke="#c9302c" stroke-width="1.5" opacity=".5"/>
    <g transform="translate(60 26)"><rect x="0" y="16" width="46" height="44" fill="#fff" stroke="#23324a" stroke-width="2.5"/><path d="M-4 16 L23 2 L50 16Z" fill="#fff" stroke="#23324a" stroke-width="2.5"/><path d="M6 24 H40 M6 30 H40 M6 36 H40 M6 42 H40 M6 48 H40 M6 54 H40" stroke="#23324a" stroke-width="1.5"/><path d="M8 60 V100 M38 60 V100" stroke="#23324a" stroke-width="3"/><path d="M-10 100 H56" stroke="#3f7d4e" stroke-width="5"/></g>
    <polyline points="140,110 160,104 180,92 200,78 220,66 240,62 260,70 280,84" fill="none" stroke="#2f6db5" stroke-width="3"/>
    <g fill="#c9302c"><circle cx="140" cy="110" r="3.5"/><circle cx="160" cy="104" r="3.5"/><circle cx="180" cy="92" r="3.5"/><circle cx="200" cy="78" r="3.5"/><circle cx="220" cy="66" r="3.5"/><circle cx="240" cy="62" r="3.5"/><circle cx="260" cy="70" r="3.5"/><circle cx="280" cy="84" r="3.5"/></g>
    <g transform="translate(262 20) rotate(-12)"><circle r="24" fill="none" stroke="#c9302c" stroke-width="3"/><text y="6" text-anchor="middle" font-size="16" font-weight="900" fill="#c9302c" font-family="serif">受理</text></g>
  </svg>
  <div class="tiny" style="font-weight:900">中2理科 気象とその変化 第7回</div>
  <h1 class="mincho">観測所をひらこう</h1>
  <div class="sub">～ 観測の計画 ～</div>
  <div class="lead sheet">きょうから きみは観測所の所長。<br>依頼に合わせて <b>場所・器具・間隔・期間</b> を決め、観測員を走らせて データを集め、<b>変化が読み取れる記録</b>を納品しよう。</div>
  <div id="nameRow"><label for="nameIn">なまえ</label><input id="nameIn" maxlength="20" placeholder="（なくてもOK）" autocomplete="off"></div>
  <div class="row">
    <button class="btn red" id="bStart">⏱ 開所する（はじめる）</button>
    <button class="btn hidden" id="bCont">⏩ つづきから</button>
    <button class="btn sub zk hidden" id="bBook1">📖 図鑑</button>
    <button class="btn sub" id="bSnd1">🔊 音：オン</button>
  </div>
</section>

<section id="game" class="hidden">
  <div id="hud"><span class="pill" id="hNo">依頼 0</span><span class="pill" id="hPt">予算 120pt</span><span class="pill" id="hData">📈 0点</span><span id="hZk"></span></div>
  <div id="req" class="sheet"><button class="iconbtn" id="bSnd2" aria-label="音">🔊</button><div class="no" id="rNo"></div><div class="nm" id="rNm"></div><div class="ds" id="rDs"></div></div>
  <div id="area"></div>
</section>

<section id="clear" class="hidden">
  <div class="panel sheet">
    <h3 style="font-size:24px">観測所、大口依頼まで納品完了！</h3>
    <p>変化をとらえるには、<b>目的に合わせて 場所・器具・間隔・期間</b> を決める。気温は<b>地上約1.5mの風通しのよい日かげ</b>で。長い期間や夜は<b>自記温度計</b>や<b>アメダス</b>で連続した記録を。</p>
    <div class="recs" id="recs"></div>
    <div class="col"><button class="btn red" id="bTest">📝 確認テストへ（10問）</button><button class="btn sub zk hidden" id="bBook2">📖 図鑑</button></div>
  </div>
</section>
<section id="test" class="hidden"><div class="panel sheet" id="tbox"></div></section>
<section id="result" class="hidden"><div class="panel sheet" id="rbox"></div></section>
</div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}

        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});

  function cardHTML(r){

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

function plan3(){const own=S.jiki;const o3=OPT.inst3.map(o=>o.k==='jiki'?Object.assign({},o,{s:own?'持っている・気温だけ・0pt':'気温だけ・40pt',cost:own?0:40}):o);

 sel=>{const inst=o3[sel.inst].k,it=OPT.intv3[sel.intv].k,pe=OPT.per3[sel.per].k;const hours=pe==='half'?6:pe==='2d'?48:336;const n=inst==='bar'?Math.round(hours/it)+1:0;

function frontGraph(p,id){const hs=p.pe==='half'?times(10,16,p.it):times(0,48,p.it);const tp=hs.map(h=>[h,+Tfront(h).toFixed(1)]);

const ST={office:{x:.12,y:.86,n:'事務所'},box:{x:.72,y:.62,n:'百葉箱'},sun:{x:.42,y:.56,n:'日なた'},room:{x:.3,y:.2,n:'教室'},roof:{x:.8,y:.12,n:'屋上'},stairs:{x:.55,y:.34,n:'階段'}};
function startRun(o){
 const pts={};o.stations.forEach(s=>pts[s.k]=o.times.map(()=>undefined));
 run={o,t:o.t0,pts,op:{x:ST.office.x,y:ST.office.y,path:[]},last:performance.now(),dueFx:{}};
 const holder=document.createElement('div');holder.innerHTML='<div id="mapWrap"><canvas id="map"></canvas><div id="clock"></div><div id="tip">地図をタップして観測員を走らせよう。「！」が出たら読みに行く。</div></div><div id="live" class="sheet"></div>';
 $('#area').appendChild(holder);
 const cv=$('#map');const W=cv.parentElement.clientWidth,H=Math.round(W*.78);map.W=W;map.H=H;cv.width=W*DPR;cv.height=H*DPR;cv.style.height=H+'px';
 cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/W,y=(e.clientY-r.top)/H;let best=null,bd=.12;for(const s of run.o.stations){const p=ST[s.k];const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=s.k}}
  const tx=best?ST[best].x:x,ty=best?ST[best].y:y;route(tx,ty,best);sfx.tap()});

function onRoof(p){return p.y<.28&&p.x>.45}
function route(tx,ty,dest){const op=run.op;const path=[];const up=onRoof(op),toRoof=dest==='roof'||(ty<.28&&tx>.45);

function valOf(k,h){return k==='box'?Tday(h):k==='sun'?Tsun(h):k==='room'?Troom(h):TroofSun(h)}
function runLoop(now){if(!run||run.stop)return;const dt=Math.min(.05,(now-run.last)/1000);run.last=now;const o=run.o;
 run.t+=dt*o.hPerSec*(RM?1:1);
 // 観測員の移動
 const op=run.op;if(op.wait>0){op.wait-=dt}else if(op.path.length){const g=op.path[0],dx=g.x-op.x,dy=g.y-op.y,d=Math.hypot(dx,dy),sp=.42*dt;if(d<=sp){op.x=g.x;op.y=g.y;op.wait=g.wait||0;op.path.shift()}else{op.x+=dx/d*sp;op.y+=dy/d*sp;op.walk=(op.walk||0)+dt}}
 // 読み取り
 for(const s of o.stations){o.times.forEach((h,i)=>{if(run.pts[s.k][i]!==undefined)return;
  if(!s.manual){if(run.t>=h){run.pts[s.k][i]=+valOf(s.k,h).toFixed(1);S.data++;hud()}return}
  if(run.t>=h&&run.t<=h+.5){if(!run.dueFx[s.k+i]){run.dueFx[s.k+i]=1;sfx.due()}
   const p=ST[s.k];if(Math.hypot(op.x-p.x,op.y-p.y)<.05&&(op.wait||0)<=0){const v=+valOf(s.k,h).toFixed(1);run.pts[s.k][i]=v;S.data++;hud();sfx.rec();const r=$('#map').getBoundingClientRect();pop(r.left+p.x*map.W,r.top+p.y*map.H-20,fmtH(h)+' '+v+'℃')}}
  else if(run.t>h+.5){run.pts[s.k][i]=null;sfx.miss();const r=$('#map').getBoundingClientRect(),p=ST[s.k];pop(r.left+p.x*map.W,r.top+p.y*map.H-20,'読みそびれ×','#c9302c')}})}
 drawMap(now);drawLive();
 if(run.t>=o.t1){const res={};for(const k in run.pts)res[k]=run.pts[k].map(v=>v===undefined?null:v);const done=o.done;stopRun();save();$('#area').innerHTML='';done(res);return}
 requestAnimationFrame(runLoop)}
function fmtH(h){const H=Math.floor(h),M=Math.round((h-H)*60);return H+':'+String(M).padStart(2,'0')}
function drawLive(){const o=run.o;const ser=o.stations.map((s,j)=>({c:j?'#2f6db5':'#c9302c',name:ST[s.k].n,pts:o.times.map((h,i)=>[h,run.pts[s.k][i]===undefined?undefined:run.pts[s.k][i]]).filter(p=>p[1]!==undefined)}));
 const x0=Math.floor(o.times[0]),x1=Math.ceil(o.times[o.times.length-1]);$('#live').innerHTML=lineSVG({x0:Math.min(x0,6),x1:Math.max(x1,x0+2),dx:x1-x0>4?2:1,y0:10,y1:40,dy:5,series:ser,legend:true,h:140});
 $('#clock').textContent='🕒 '+fmtH(Math.max(0,run.t))}
function drawMap(now){const cv=$('#map');if(!cv)return;const c=cv.getContext('2d'),W=map.W,H=map.H;c.setTransform(DPR,0,0,DPR,0,0);
 const day=Math.max(0,Math.min(1,(run.t-6)/12));
 c.fillStyle='#e8d7a2';c.fillRect(0,0,W,H);
 c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=2;c.beginPath();c.ellipse(W*.45,H*.66,W*.28,H*.2,0,0,2*PI);c.stroke();
 // 校舎
 c.fillStyle='#d6d0c2';c.fillRect(W*.04,H*.04,W*.92,H*.26);c.strokeStyle='#23324a';c.lineWidth=2;c.strokeRect(W*.04,H*.04,W*.92,H*.26);
 c.fillStyle='#c6bfae';c.fillRect(W*.62,H*.05,W*.33,H*.24);c.fillStyle='#23324a';c.font='bold 11px sans-serif';c.fillText('屋上',W*.64,H*.1);c.fillText('校舎',W*.06,H*.1);
 for(let i=0;i<5;i++){c.fillStyle='#9fc3e0';c.fillRect(W*(.08+i*.1),H*.27,W*.07,H*.025)}
 // 階段
 c.fillStyle='#a79f8c';c.fillRect(W*.51,H*.3,W*.08,H*.07);for(let i=0;i<4;i++){c.fillStyle='#23324a';c.fillRect(W*.51,H*(.305+i*.016),W*.08,1.5)}
 // 芝生と木
 c.fillStyle='#8fbf6a';c.beginPath();c.ellipse(W*.72,H*.64,W*.12,H*.09,0,0,2*PI);c.fill();
 c.fillStyle='rgba(40,80,40,.25)';c.beginPath();c.ellipse(W*.92,H*.52,W*.1,H*.08,0,0,2*PI);c.fill();c.fillStyle='#4f8a45';c.beginPath();c.arc(W*.9,H*.48,W*.07,0,2*PI);c.fill();
 // 事務所
 c.fillStyle='#fffdf5';c.fillRect(W*.03,H*.8,W*.2,H*.16);c.strokeRect(W*.03,H*.8,W*.2,H*.16);c.fillStyle='#23324a';c.fillText('観測所',W*.05,H*.835);
 // 日なたの印
 const sunA=Math.sin(PI*day);c.fillStyle='rgba(255,200,60,'+(.25+.35*sunA)+')';c.beginPath();c.arc(W*ST.sun.x,H*ST.sun.y,W*.05,0,2*PI);c.fill();
 // 観測地点
 for(const s of run.o.stations){const p=ST[s.k],x=W*p.x,y=H*p.y;
  if(s.k==='box'||s.k==='roof'){c.fillStyle='#fff';c.fillRect(x-9,y-9,18,16);c.strokeStyle='#23324a';c.strokeRect(x-9,y-9,18,16);c.beginPath();c.moveTo(x-11,y-9);c.lineTo(x,y-15);c.lineTo(x+11,y-9);c.closePath();c.fillStyle='#fff';c.fill();c.stroke();for(let k=0;k<4;k++){c.beginPath();c.moveTo(x-7,y-6+k*3.5);c.lineTo(x+7,y-7+k*3.5);c.stroke()}}
  else{c.fillStyle='#c9302c';c.fillRect(x-2,y-14,4,20);c.beginPath();c.arc(x,y+7,4,0,2*PI);c.fill()}
  if(s.k==='roof'&&!s.manual||s.k==='box'&&!s.manual){c.fillStyle='#2f6db5';c.font='bold 10px sans-serif';c.fillText('自記',x-10,y+20)}
  // 期限の「！」
  if(s.manual){const i=run.o.times.findIndex((h,i)=>run.pts[s.k][i]===undefined&&run.t>=h&&run.t<=h+.5);if(i>=0){const f=(run.t-run.o.times[i])/.5;c.strokeStyle='#c9302c';c.lineWidth=4;c.beginPath();c.arc(x,y-28,13,-PI/2,-PI/2+2*PI*(1-f));c.stroke();c.fillStyle='#c9302c';c.font='bold 18px sans-serif';c.textAlign='center';c.fillText('！',x,y-21);c.textAlign='start';c.lineWidth=2}}
  c.fillStyle='#23324a';c.font='bold 10px sans-serif';c.fillText(ST[s.k].n,x+12,y+4)}
 // 観測員（上から見た姿）
 const op=run.op,ox=W*op.x,oy=H*op.y,sw=Math.sin((op.walk||0)*14)*3;c.fillStyle='#23324a';c.beginPath();c.ellipse(ox,oy+4,7,5,0,0,2*PI);c.fill();c.fillStyle='#2f6db5';c.beginPath();c.arc(ox+sw*.2,oy-2,6,0,2*PI);c.fill();c.fillStyle='#fff';c.fillRect(ox-2+sw*.2,oy-5,4,3);
 if(op.path.length){c.strokeStyle='rgba(35,50,74,.35)';c.setLineDash([4,4]);c.beginPath();c.moveTo(ox,oy);op.path.forEach(p=>c.lineTo(W*p.x,H*p.y));c.stroke();c.setLineDash([])}
 // 夕方の暗さ
 if(run.t>17||run.t<6.5){c.fillStyle='rgba(30,30,70,.12)';c.fillRect(0,0,W,H)}}
/* ===== 観測計画書（予想用） ===== */
const FP=[{key:'q',lb:'調べたいこと',opts:['晴れの日の、1日の気温と湿度の変わり方','晴れの日と雨の日の、気温の変わり方のちがい','前線が通るときの、気温と風向の変わり方']},
 {key:'p',lb:'場所',opts:['校庭の百葉箱（日かげ・風通し・地上約1.5m）','屋上の日かげ（地上約1.5mの高さで）','昇降口の日かげ']},
 {key:'i',lb:'器具',opts:['乾湿計を自分で読む＋自記温度計','乾湿計を自分で読む','学校の近くのアメダスの記録も取り寄せる']},
 {key:'n',lb:'間隔',opts:['1時間ごと','2時間ごと（授業の合間）','10分ごと（自記・アメダス）']},
 {key:'d',lb:'期間',opts:['晴れた日の1日','1週間（晴れの日と雨の日をふくむ）','前線が近づく2〜3日']},
 {key:'y',lb:'予想',opts:['気温は14時ごろ最高になり、そのころ湿度は低くなる','雨の日は、晴れの日より気温の変化が小さい','前線が通ると、気温が急に下がり風向が変わる']}];
function finalPlan(){const sel={};let h='<div class="panel sheet"><h3>校庭の観測計画書</h3>学校で本当に観測するつもりで、1つずつ選ぼう。提出カードにのる。';
 FP.forEach(r=>{h+='<div class="row2"><div class="lb">'+r.lb+'</div><div class="seg" data-k="'+r.key+'">'+r.opts.map((o,i)=>'<button data-i="'+i+'">'+esc(o)+'</button>').join('')+'</div></div>'});
 h+='<div class="col"><button class="btn red" id="bPlan" disabled>📝 この計画で提出する</button></div></div>';area(h);
 document.querySelectorAll('.seg').forEach(sg=>sg.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;sel[sg.dataset.k]=+b.dataset.i;sg.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i===+b.dataset.i));sfx.tap();$('#bPlan').disabled=FP.some(r=>sel[r.key]==null)}));
 $('#bPlan').onclick=()=>{const f=k=>FP.find(r=>r.key===k).opts[sel[k]];S.plan='【調べる】'+f('q')+'／【場所】'+f('p')+'／【器具】'+f('i')+'／【間隔】'+f('n')+'／【期間】'+f('d')+'／【予想】'+f('y');
  if(!S.rule.pred){S.rule.pred=1;earn(10,'predict',innerWidth/2,innerHeight/2)}S.cleared=true;save();bigStamp('提出',true);setTimeout(toClear,700)}}
/* ===== 画面きりかえ ===== */
function show(id){for(const s of['title','game','clear','test','result'])$('#'+s).classList.toggle('hidden',s!==id);scrollTo(0,0)}
let clock=null;function startClock(){clearInterval(clock);clock=setInterval(()=>{if(!$('#game').classList.contains('hidden')){S.t++;if(S.t%5===0)save()}},1000)}
function fmtT(t){return Math.floor(t/60)+'分'+String(t%60).padStart(2,'0')+'秒'}
function enterGame(){show('game');try{if(window.Zukan&&Zukan.hud){$('#hZk').innerHTML='';Zukan.hud($('#hZk'))}}catch(e){}if(S.cleared)return toClear();startClock();goStage(S.st)}
function toClear(){show('clear');const rej=Object.keys(S.rejects).filter(k=>/^r\d$/.test(k)).reduce((a,k)=>a+S.rejects[k],0);
 $('#recs').innerHTML='<div>クリアタイム<b>'+fmtT(S.t)+'</b></div><div>納品したデータ点<b>'+S.data+'点</b></div><div>差戻し<b>'+rej+'回</b></div><div>効かない投資<b>'+S.waste+'pt</b></div>';
 sfx.big();burst(innerWidth/2,200,70);
 if(!S.mainClearShown&&window.Zukan&&Zukan.mainClear){S.mainClearShown=true;save();try{Zukan.mainClear({onClose:()=>{}})}catch(e){}}}
$('#bStart').onclick=()=>{ac();const nm=$('#nameIn').value.trim()||S.name,snd=S.sound;S=fresh();S.name=nm;S.sound=snd;S.started=true;save();enterGame()};
$('#bCont').onclick=()=>{ac();const v=$('#nameIn').value.trim();if(v)S.name=v;save();enterGame()};
const sndT=()=>{S.sound=!S.sound;save();setSnd()};$('#bSnd1').onclick=sndT;$('#bSnd2').onclick=sndT;
function openBook(){try{window.Zukan&&Zukan.openBook&&Zukan.openBook({unit:'kisho'})}catch(e){}}
$('#bBook1').onclick=openBook;$('#bBook2').onclick=openBook;$('#bTest').onclick=()=>startTest();
/* ===== 確認テスト ===== */
let T=null;function playerName(){return window.PLAYER_NAME||S.name||''}
function startTest(){if(!window.Quiz)return;T={qs:Quiz.test(),i:0,ans:[]};show('test');renderQ()}
function renderQ(){const q=T.qs[T.i],box=$('#tbox');
 box.innerHTML='<div class="tno">📝 確認テスト　第'+(T.i+1)+'問 / '+T.qs.length+'</div><div class="prog">'+T.qs.map((_,i)=>'<i class="'+(i<T.i?'on':'')+'"></i>').join('')+'</div><div class="tq">'+q.q+'</div>'+(q.fig?'<div class="fig2">'+q.fig+'</div>':'')+'<div id="ta"></div>';
 const ta=$('#ta');
 if(q.t==='choice'){const d=document.createElement('div');d.className='ch';q.shown.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML=c;b.onclick=()=>ans(q.shown[i]);d.appendChild(b)});ta.appendChild(d)}
 else if(q.t==='num'){ta.innerHTML='<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="数を入力"><b>'+esc(q.unit||'')+'</b><button class="btn red" id="numOk">決定</button></div>';$('#numOk').onclick=()=>{const v=$('#numIn').value.trim();if(v)ans(v)}}
 else{const picked=[];ta.innerHTML='<div class="tiny">正しい順にタップしよう</div><div class="ord" id="ordBox"></div><div class="ch" id="ordPool"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sub" id="ordRe">やり直す</button><button class="btn red" id="ordOk" disabled>決定</button></div>';
  const draw=()=>{$('#ordBox').innerHTML=picked.map((t,i)=>'<div>'+(i+1)+'. '+t+'</div>').join('');const pool=$('#ordPool');pool.innerHTML='';q.shown.forEach(t=>{if(picked.includes(t))return;const b=document.createElement('button');b.innerHTML=t;b.onclick=()=>{picked.push(t);sfx.tap();draw()};pool.appendChild(b)});$('#ordOk').disabled=picked.length!==q.shown.length};
  draw();$('#ordRe').onclick=()=>{picked.length=0;draw()};$('#ordOk').onclick=()=>ans(picked.slice())}}
function ans(v){T.ans.push(v);sfx.tap();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}
function finishTest(){const qs=T.qs,review=Quiz.review(qs,T.ans),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 if(score>=Math.ceil(qs.length*.7))earn(30,'pass',innerWidth/2,200);sfx.big();burst(innerWidth/2,220,60);
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(S.t)],['納品したデータ点',S.data+'点'],['効かない投資',S.waste+'pt'],['校庭の観測計画',S.plan||'（未記入）']];
 T.card=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:UNIT,game:GTITLE+(TEST_ONLY?'（確認テストのみ）':''),name:playerName(),score,total:qs.length,marks,records:recs,review},showResult);showResult()}
function showResult(){show('result');const r=T.card||{};
 $('#rbox').innerHTML='<h3 style="font-size:24px">テストの結果</h3><p style="font-size:22px;font-weight:900">'+(r.score||0)+' / '+(r.total||0)+' 点</p><div class="col"><button class="btn red" id="rCard">📝 提出カードをもう一度見る</button><button class="btn" id="rAgain">↺ テストをもう一度</button>'+(TEST_ONLY?'':'<button class="btn sub" id="rTitle">🏠 タイトルへ</button>')+'<button class="btn sub zk hidden" id="rBook">📖 図鑑</button></div>';
 $('#rCard').onclick=()=>SubmitCard.reopen(T.card,()=>{});$('#rAgain').onclick=()=>startTest();if($('#rTitle'))$('#rTitle').onclick=()=>toTitle();$('#rBook').onclick=openBook;zkButtons()}
function zkButtons(){const has=!!(window.Zukan&&Zukan.openBook);document.querySelectorAll('.zk').forEach(b=>b.classList.toggle('hidden',!has))}
function toTitle(){show('title');$('#bCont').classList.toggle('hidden',!S.started);zkButtons()}
try{window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]})}catch(e){}
setSnd();
if(window.PLAYER_NAME){$('#nameIn').value=window.PLAYER_NAME;$('#nameRow').classList.add('hidden')}else if(S.name)$('#nameIn').value=S.name;
window.__game={state:()=>S,goStage,run:()=>run,ST,setOp:(k)=>{if(run){run.op.x=ST[k].x;run.op.y=ST[k].y;run.op.path=[]}},speed:v=>{if(run)run.o.hPerSec=v}};
if(TEST_ONLY){$('#title').classList.add('hidden');startTest()}else toTitle();
</script>
