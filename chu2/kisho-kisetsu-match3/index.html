<title>季節そろえパズル ～天気図と衛星画像～</title>
<!--
  季節そろえパズル ～天気図と衛星画像～（中2理科 気象 コマ25 / kisho-kisetsu-match3 / chu2-kisho-25・確認用）

  ■ 世界とメタファー: 「石のモザイク」。床のモザイク画をつくる工房。盤の石板は1枚1枚が資料のかけら
    （天気図＝トラバーチンの白い石／衛星画像＝青黒いスレート／各地の天気＝砂岩）。同じ季節の石を3つ以上1列にそろえると
    石が割れて小片になり、右（スマホは上）の「季節の衛星画像」のモザイク画に1片ずつはめこまれていく。
    石の色は季節で分けない（色は資料の種類だけ）。季節は石に描かれた中身（等圧線・雲・天気）を読んで見分ける。
  ■ 道のり: 10面（冬と夏→梅雨→春・秋→三点そろえ→石の目地→似た雲→台風まじり→季節のめぐり→タイムアタック）。
    集める: 四季の衛星画像のモザイク（各120片）。美麗: 石の小片と目地、ラピスラズリの縁どり。
  ■ 配色: 目地 #2C2A26（背景）／トラバーチン #E8DCC2（主）／ラピス #3D7EA6（差し）。補助: スレート #2F3B46・砂岩 #E0C596・テラコッタ #A8452F・金 #D8B45A。
  ■ 書体: 見出し・石の刻字＝Zen Antique（碑文のような明朝）／本文＝Zen Kaku Gothic New。
  ■ 画面の組み方: PC横長＝左に盤・右に完成していく衛星画像のモザイクと目標／スマホ縦＝上に衛星画像、下に盤。
  ■ HUD: 石の円盤に刻んだ残り手数・得点、目標は石の札（「冬 あと3片」）。Zukan.hud は使わず Zukan.state() で読む。
  ■ 音: 石のカチッという音・マリンバ（連鎖で音程が上がる）・ガラスの鈴（三点そろい）。連続成功で BGM の層が増える。ミュートあり。
  ■ ハマる仕組み: 主⑤コンボ・連鎖（入れかえが続けて決まると「連続」、落ちてそろうと「連鎖」）／副②コレクション（四季のモザイク画）・
    ⑦ニアミス（「冬の画像 あと3片」「あと1回で×5」は本当の数）。
  ■ 理科＝操作: そろうのは同じ季節の石だけ（天気図・衛星画像・各地の天気を読んで季節を判断する）。
    天気図・衛星画像・各地の天気の3種がそろう「三点そろい」を自分の入れかえで作ると、盤が止まり
    「衛星画像のどこが決め手？」をタップで指す（根拠）。正しい根拠を指したときだけかけらが出る（落ちて勝手にそろった連鎖では出ない）。
    山場（第7面）は、夏と春の衛星画像がどちらも「雲が少ない」ので、天気図と合わせて読まないと見分けにくい。台風の位置だけでは季節は決まらない（第8面）。
  ■ とっつきやすさ（ルール13）: はじめるの直後に「この回でわかること／こうやって遊ぶ」の石板。第1面は指が「冬の石を下へスワイプ→決め手の雲をタップ」を見せ、
    止まると次の一手も指で示す。第1面は手がつきても親方がおまけの手をくれ、根拠もやり直せる（失敗しない）。上の「？」で遊び方と石の見分け方。
  ■ 確認用: コマ24「季節をあやつる神さま」で封印した予想（rika-zukan:chu2:seal:chu2-kisho-24）があれば、アルバムにきみの予想として並べる（読むだけ）。
-->

<script>/*@SUBMIT_CARD_BEGIN*/

     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}

      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});

  }

  }

  function cardHTML(r){

      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+

  function open(r,onClose,fromShow){

  window.SubmitCard={

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});

        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}

    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];

        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  for(let c=0;c<N;c++){const mov=[];for(let r=N-1;r>=0;r--){const t=G.b[r][c];if(t&&!t.lock)mov.push(t)}
    let k=0,sp=0;for(let r=N-1;r>=0;r--){const t0=G.b[r][c];if(t0&&t0.lock)continue;if(k<mov.length){G.b[r][c]=mov[k++]}else{G.b[r][c]=null}}
    for(let r=N-1;r>=0;r--){if(G.b[r][c])continue;const t=freshTile(r,c);t.px=c;t.py=-1-(sp++);G.b[r][c]=t;nw.add(t)}}
  if(Math.random()<.75)repairGroups(nw)}
function settle(){return new Promise(res=>{const chk=()=>{if(!G){res();return}let ok=true;G.b.forEach((row,r)=>row.forEach((t,c)=>{if(t&&(Math.abs(t.py-r)>.01||Math.abs(t.px-c)>.01))ok=false}));if(ok)res();else requestAnimationFrame(chk)};chk()})}

  const m=sz*.07,p=prj(TB,m,m,sz-2*m,sz-2*m);let done=false,tries=0;const tut=!!STG[G.si].tut;G.konBox=null;

  kc.onpointerdown=e=>{if(done)return;const r=kc.getBoundingClientRect(),x=(e.clientX-r.left)*sz/r.width,y=(e.clientY-r.top)*sz/r.height;const[lo,la]=p.inv(x,y);const Z=ZONES[s];
    const inb=(b)=>lo>=b[0]&&lo<=b[2]&&la>=b[1]&&la<=b[3];let ok=false,msg;const tyZ=Z.dz.find(z=>z[1].indexOf('台風')>=0);
    if(v==='ty'&&tyZ&&inb(tyZ[0])){msg=tyZ[1]}else if(Z.ok.some(inb)){ok=true;msg=Z.okm}else{const d=Z.dz.find(z=>z[1].indexOf('台風')<0&&inb(z[0]));msg=d?d[1]:'そこには季節の決め手が見当たらない。'+Z.okm.split('＝')[0]+'を探そう'}

      $('#konA').innerHTML='<b class="trc">×</b> '+esc(msg)+'<br><b>はじめの面は練習。指の所をタップしてみよう</b>';setTimeout(()=>{done=false},500);return}
    c.save();c.lineWidth=4;c.strokeStyle=ok?'#2f6f98':'#a8452f';c.beginPath();c.arc(x,y,18,0,TAU);c.stroke();if(!ok){c.beginPath();c.moveTo(x-12,y-12);c.lineTo(x+12,y+12);c.moveTo(x+12,y-12);c.lineTo(x-12,y+12);c.stroke()}

    else{sfx.miss();$('#konA').innerHTML='<b class="trc">×</b> '+esc(msg)}

function goalsMet(){const g=STG[G.si].goal;return Object.keys(g).every(k=>(G.got[k]||0)>=g[k])}
function checkEnd(){if(!G||G.ended)return;if(goalsMet()&&!STG[G.si].boss){stageEnd(true);return}
  if(!STG[G.si].boss&&G.mv<=0){if(STG[G.si].tut){G.mv+=5;updHud();sfx.good();pop(W/2,L.by+L.B*.4,'親方から おまけの5手！','big');return}stageEnd(false)}}
async function stageEnd(win){if(G.ended)return;G.ended=true;BUSY=true;await wait(500);const st=STG[G.si];let stars=0;
  if(st.boss){win=G.got.santen>=st.goal.santen;stars=win?1+(G.got.santen>=8?1:0)+(G.kon.tot>0&&G.kon.ok===G.kon.tot?1:0):0}
  else if(win)stars=1+(G.kon.tot>0&&G.kon.ok===G.kon.tot?1:0)+(G.mv>=3?1:0);
  const prev=S.done[G.si]||{stars:0,win:false};S.done[G.si]={stars:Math.max(prev.stars,stars),win:prev.win||win};S.score+=G.score;S.best=Math.max(S.best,G.score);if(S.cur<=G.si)S.cur=G.si+1;save();
  const nWin=Object.values(S.done).filter(d=>d.win).length;
  if(win){sfx.fan();confetti(80);flash(.5)}else sfx.miss();
  const g=st.goal;const rest=Object.keys(g).map(k=>[k,g[k]-(G.got[k]||0)]).filter(a=>a[1]>0);
  const nm=k=>k==='santen'?'三点そろい':k==='lock'?'目地くだき':SN[k];
  ovOpen('<h2>第'+(G.si+1)+'面　'+esc(st.nm)+'　'+(win?'完成！':(st.boss?'時間切れ':'手がつきた'))+'</h2><div class="stars">'+[0,1,2].map(i=>'<i class="'+(i<stars?'on':'')+'" style="animation-delay:'+(i*.35)+'s">★</i>').join('')+'</div>'+
   '<p class="small" style="text-align:center">★ 目標　★ 根拠をすべて的中'+(st.boss?'　★ 三点そろい8回':'　★ 手を3つ以上残す')+'</p>'+
   (!win&&rest.length?'<p style="text-align:center" class="trc"><b>'+rest.map(a=>nm(a[0])+' あと'+a[1]+(a[0]==='santen'?'回':'片')).join('　')+'</b>だった！</p>':'')+
   '<div class="recs"><div>得点<b>'+G.score+'</b></div><div>最大の連続・連鎖<b>'+G.maxCombo+'・'+G.maxChain+'</b></div><div>三点そろい<b>'+G.got.santen+'回</b></div><div>根拠の的中<b>'+G.kon.ok+' / '+G.kon.tot+'</b></div></div>'+
   '<p class="small">完成した面 '+nWin+' / 10（8面で工房の親方に認められる）</p>'+
   '<div class="row"><button class="st lp" style="flex:1 1 100%" id="rsN">'+(G.si+1<STG.length?'つぎの面へ':'アルバムを見る')+'</button><button class="st s" id="rsA">もう一度</button><button class="st s" id="rsM">工房の道</button></div>');
  [0,1,2].forEach(i=>{if(i<stars)setTimeout(()=>{sfx.stamp();shake(6)},i*350+120)});
  $('#rsA').onclick=()=>{ovClose();startStage(G.si)};$('#rsM').onclick=()=>{ovClose();toMap()};
  $('#rsN').onclick=()=>{ovClose();if(G.si+1<STG.length)startStage(G.si+1);else finishMain()};
  if(nWin>=8&&!S.cleared){S.cleared=true;save()}BUSY=false}

let nowT=0,titleT=0;
function draw(dt){nowT+=dt;cx.setTransform(DPR,0,0,DPR,0,0);let sx=0,sy=0;if(SH>0){sx=rnd(-SH,SH);sy=rnd(-SH,SH);SH=Math.max(0,SH-dt*40)}
  if(BG)cx.drawImage(BG,0,0,W,H);cx.save();cx.translate(sx,sy);
  if(MODE==='title'||MODE==='map'||MODE==='test'){drawTitleArt(dt);if(MODE!=='title'){cx.fillStyle='rgba(28,25,21,.72)';cx.fillRect(0,0,W,H)}}
  else if(G){drawPanel();drawBoard(dt);guideTrail()}
  // 粒
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];if(p.fly){p.t+=dt/p.d;const t=1-Math.pow(1-Math.min(1,p.t),3);const x=lerp(p.x,p.tx,t),y=lerp(p.y,p.ty,t)-Math.sin(t*Math.PI)*80;cx.fillStyle=p.c;cx.fillRect(x-p.r/2,y-p.r/2,p.r,p.r);cx.strokeStyle='rgba(0,0,0,.4)';cx.lineWidth=1;cx.strokeRect(x-p.r/2,y-p.r/2,p.r,p.r);if(p.t>=1){PT.splice(i,1);G&&(G.albPulse=.3)}continue}
    p.life-=p.dec*dt;if(p.life<=0){PT.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;cx.globalAlpha=Math.min(1,p.life*1.5);cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.8);cx.restore()}
  cx.globalAlpha=1;cx.restore()}
function drawTitleArt(dt){titleT+=dt;const tile=Math.max(16,Math.min(W,H)/26);const cols=Math.ceil(W/tile)+1,rows=Math.ceil(H/tile)+1;const src=albSrc('fuyu',64,48);const r=srand(5);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const u=i/cols,v=j/rows;const sx2=Math.floor(clamp(u,0,.999)*ACOL),sy2=Math.floor(clamp(v,0,.999)*AROW);const col=src.cols[sy2*ACOL+sx2];const d=r()*1.6+Math.hypot(u-.5,v-.5)*1.2;const t=clamp((titleT-d*.6)*2.2,0,1);if(t<=0)continue;
    const y=j*tile-(1-t)*(1-t)*60;cx.globalAlpha=t;cx.fillStyle='rgb('+col[0]+','+col[1]+','+col[2]+')';cx.fillRect(i*tile+1+(r()-.5)*2,y+1+(r()-.5)*2,tile-2,tile-2);cx.fillStyle='rgba(255,255,255,.1)';cx.fillRect(i*tile+1,y+1,tile-2,tile*.2)}
  cx.globalAlpha=1;const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(44,42,38,.1)');g.addColorStop(1,'rgba(44,42,38,.65)');cx.fillStyle=g;cx.fillRect(0,0,W,H)}
function drawPanel(){const s=G.albFocus||Object.keys(STG[G.si].goal).find(k=>SEAS.includes(k))||'fuyu';
  frameBand(cx,L.ix,L.iy,L.iw,L.ih,Math.max(5,L.iw/60));drawAlbum(cx,s,L.ix,L.iy,L.iw,L.ih,S.alb[s]);
  if(G.albPulse>0){G.albPulse-=1/60;cx.fillStyle='rgba(255,250,230,'+(G.albPulse*.4)+')';cx.fillRect(L.ix,L.iy,L.iw,L.ih)}
  cx.save();cx.font=(WIDE?16:12)+'px "Zen Antique",serif';cx.textAlign='left';const lab=SN[s]+'の衛星画像 '+Math.floor(S.alb[s]/ALBN*100)+'%'+(S.alb[s]<ALBN&&ALBN-S.alb[s]<=10?'（あと'+(ALBN-S.alb[s])+'片）':'');cx.lineWidth=4;cx.strokeStyle='rgba(0,0,0,.8)';cx.strokeText(lab,L.ix+6,L.iy+L.ih-8);cx.fillStyle='#f4ecd8';cx.fillText(lab,L.ix+6,L.iy+L.ih-8);cx.restore();
  SEAS.forEach((ss,i)=>{const[x,y,w,h]=L.th[i];cx.fillStyle=ss===s?'#3D7EA6':'#57503f';cx.fillRect(x-3,y-3,w+6,h+6);drawAlbum(cx,ss,x,y,w,h,S.alb[ss]);cx.save();cx.font='11px "Zen Kaku Gothic New",sans-serif';cx.fillStyle='#f4ecd8';cx.lineWidth=3;cx.strokeStyle='rgba(0,0,0,.8)';const tt=SN[ss]+' '+Math.floor(S.alb[ss]/ALBN*100)+'%';cx.strokeText(tt,x+3,y+h-4);cx.fillText(tt,x+3,y+h-4);cx.restore()})}
function drawBoard(dt){const N=L.N,T=L.T;frameBand(cx,L.bx,L.by,L.B,L.B,Math.max(5,T*.14));cx.fillStyle='#1f1c18';cx.fillRect(L.bx,L.by,L.B,L.B);
  const S2=Math.round(T*.94*DPR);const hm=G.hintMove;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=G.b[r][c];if(!t)continue;
    // 動き
    if(t.py<r){t.vy+=34*dt;t.py=Math.min(r,t.py+t.vy*dt);if(t.py>=r){t.py=r;if(t.vy>6)t.bump=.12;t.vy=0}}else if(t.py>r){t.py=Math.max(r,t.py-12*dt)}if(t.px!==c)t.px+=clamp(c-t.px,-10*dt,10*dt);if(Math.abs(t.px-c)<.02)t.px=c;
    if(t.die>0)t.die+=dt*4;
    let sc=t.die>0?Math.max(0,1-t.die):1;if(t.bump>0){t.bump-=dt;sc*=1+t.bump*.5}
    let x=L.bx+(t.px+.5)*T,y=L.by+(t.py+.5)*T;if(y<L.by-T*.5)continue;
    const selc=G.sel&&G.sel[0]===r&&G.sel[1]===c;if(selc)sc*=1.08+Math.sin(nowT*12)*.03;
    if(hm&&((hm[0][0]===r&&hm[0][1]===c)||(hm[1][0]===r&&hm[1][1]===c)))x+=Math.sin(nowT*18)*2.5;
    if(G.tut&&G.tutStep&&((G.tut.a[0]===r&&G.tut.a[1]===c)||(G.tut.b[0]===r&&G.tut.b[1]===c))){cx.fillStyle='rgba(216,180,90,'+(.35+.3*Math.sin(nowT*6))+')';cx.fillRect(x-T/2,y-T/2,T,T)}
    const sz=T*.94*sc;cx.save();cx.translate(x,y);
    if(t.sp==='rain'){drawRain(sz)}else{cx.drawImage(face(t,S2),-sz/2,-sz/2,sz,sz)}
    if(t.sp==='line'){cx.strokeStyle='rgba(159,208,238,'+(.7+.3*Math.sin(nowT*8))+')';cx.lineWidth=T*.07;cx.strokeRect(-sz/2+2,-sz/2+2,sz-4,sz-4);cx.fillStyle='#9fd0ee';const a=t.ldir==='h';for(const d of[-1,1]){cx.beginPath();if(a){cx.moveTo(d*sz*.48,0);cx.lineTo(d*sz*.36,-sz*.08);cx.lineTo(d*sz*.36,sz*.08)}else{cx.moveTo(0,d*sz*.48);cx.lineTo(-sz*.08,d*sz*.36);cx.lineTo(sz*.08,d*sz*.36)}cx.closePath();cx.fill()}}
    if(t.lock){cx.fillStyle='rgba(165,158,142,.55)';cx.fillRect(-sz/2,-sz/2,sz,sz);cx.strokeStyle='rgba(80,72,60,.8)';cx.lineWidth=T*.025;cx.beginPath();cx.moveTo(-sz*.3,-sz*.4);cx.lineTo(-sz*.05,-sz*.05);cx.lineTo(-sz*.2,sz*.3);cx.moveTo(-sz*.05,-sz*.05);cx.lineTo(sz*.35,sz*.1);cx.stroke();cx.fillStyle='#5e7a4c';cx.beginPath();cx.arc(sz*.3,-sz*.35,sz*.08,0,TAU);cx.fill()}
    if(selc){cx.strokeStyle='#D8B45A';cx.lineWidth=T*.06;cx.strokeRect(-sz/2,-sz/2,sz,sz)}
    cx.restore()}}
function drawRain(sz){const q=sz/2;const cols=['#3D7EA6','#E8DCC2','#A8452F','#D8B45A'];cx.save();cx.rotate(nowT*.8);for(let i=0;i<4;i++){cx.fillStyle=cols[i];cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,q*.95,i*Math.PI/2,(i+1)*Math.PI/2);cx.closePath();cx.fill()}
  for(let k=0;k<12;k++){const a=k/12*TAU;cx.fillStyle=k%2?'#f4ecd8':'#1f4a66';cx.fillRect(Math.cos(a)*q*.72-q*.07,Math.sin(a)*q*.72-q*.07,q*.14,q*.14)}cx.restore();cx.fillStyle='#f4ecd8';cx.beginPath();cx.arc(0,0,q*.3,0,TAU);cx.fill();cx.font=Math.round(q*.38)+'px "Zen Antique",serif';cx.fillStyle='#1f4a66';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('扉',0,1)}

function toMap(){MODE='map';G=null;BUSY=false;showScr(['map']);hideHud();const cur=Math.min(S.cur,STG.length-1);
  $('#path').innerHTML=STG.map((st,i)=>{const d=S.done[i];const cl=d&&d.win?'done':d?'fail':(i===cur?'cur':'');return '<button class="md '+cl+'" data-i="'+i+'" '+(i>S.cur?'disabled':'')+'><span class="no">'+(i+1)+'</span><span class="t">'+esc(st.nm)+'<small>'+(d?(d.win?'完成':'もう一度'):(i>S.cur?'まだ':'つぎ'))+'</small><span class="sr">'+(d?'★'.repeat(d.stars)+'☆'.repeat(3-d.stars):'')+'</span></span></button>'}).join('');
  document.querySelectorAll('.md').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i<=S.cur){sfx.clack();startStage(i)}});
  const nWin=Object.values(S.done).filter(d=>d.win).length;
  $('#bNext').textContent=S.cur>=STG.length?'確認テストへ':'つぎの面へ　第'+(cur+1)+'面';
  $('#mapInfo').innerHTML='完成 '+nWin+' / 10 面（8面で合格）・　モザイク '+SEAS.map(s=>SN[s]+Math.floor(S.alb[s]/ALBN*100)+'%').join(' ')+'・　根拠 '+S.konOk+'/'+S.konTot;zkButtons();backBtn()}
function albumOpen(end){const sl=seal24();const mine={};if(sl&&sl.predText)sl.predText.split('／').forEach(x=>{const k=x.split('：')[0];mine[k==='冬'?'fuyu':k==='夏'?'natsu':k==='梅雨'?'tsuyu':k==='春'?'haru':'']=x});
  ovOpen('<h2>四季の衛星画像アルバム</h2><p class="small">石をそろえるたびに1片ずつはまる。季節ごとに、天気図・衛星画像・各地の天気は決まった組み合わせで現れる。</p><div class="alb">'+SEAS.map(s=>'<div class="pg"><h3>'+SN[s]+'　'+Math.floor(S.alb[s]/ALBN*100)+'%</h3><canvas data-s="'+s+'" width="320" height="240"></canvas><div class="t">'+(S.albDone[s]?esc(CAP[s]):'完成すると説明が読める（あと'+(ALBN-S.alb[s])+'片）')+'</div>'+(mine[s]?'<div class="me">コマ24で封印したきみの予想 → '+esc(mine[s])+'</div>':'')+'</div>').join('')+'</div>'+
   (sl?'':'<p class="small">（コマ24「季節をあやつる神さま」で予想を封印していると、ここにきみの予想が並ぶ）</p>')+
   '<div class="row" style="margin-top:12px">'+(end||S.cleared?'<button class="st lp" id="alT">確認テストへ</button>':'')+'<button class="st s" id="alX">閉じる</button></div>');
  document.querySelectorAll('.alb canvas').forEach(c=>{const x=c.getContext('2d');drawAlbum(x,c.dataset.s,0,0,320,240,S.alb[c.dataset.s])});
  $('#alX').onclick=ovClose;if($('#alT'))$('#alT').onclick=()=>{ovClose();startTest()}}
function backBtn(){const b=$('#bBack');const on=MODE!=='title'||INHUB;b.classList.toggle('hidden',!on);b.textContent=MODE==='title'?'◀ 一覧へ':'◀ もどる'}
$('#bBack').onclick=()=>{ac();sfx.tap();if(MODE==='title'){try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}return}
  const from=MODE;const msg=from==='test'?'確認テストは、次はさいしょから。工房の進み具合は保存されています。':from==='map'?'進み具合は保存されます。タイトルにもどります。':'進み具合は保存されます（はめたモザイクはそのまま。この面は次にはじめから）。';
  ovOpen('<h2>もどりますか？</h2><p>'+msg+'</p><div class="row" style="margin-top:12px"><button class="st lp" id="bkGo">'+(from==='map'?'タイトルへ':from==='test'&&TEST_ONLY?'テストのはじめへ':'工房の道へ')+'</button><button class="st" id="bkNo">つづける</button></div>');
  $('#bkNo').onclick=ovClose;$('#bkGo').onclick=()=>{ovClose();$('#kon').classList.add('hidden');if(from==='map')toTitle();else if(from==='test'&&TEST_ONLY)startTest();else toMap()}};

/* ===== 確認テスト ===== */
let TS=null;function playerName(){return window.PLAYER_NAME||S.name||''}
function startTest(){if(!window.Quiz)return;MODE='test';G=null;hideHud();TS={qs:Quiz.test(),i:0,ans:[]};showScr(['test']);backBtn();renderQ()}
function renderQ(){const q=TS.qs[TS.i],box=$('#tbox');
 box.innerHTML='<div class="tno">📝 確認テスト　第'+(TS.i+1)+'問 / '+TS.qs.length+'</div><div class="prog">'+TS.qs.map((_,i)=>'<i class="'+(i<TS.i?'on':'')+'"></i>').join('')+'</div><div class="tq">'+q.q+'</div>'+(q.fig?'<div class="fig2">'+q.fig+'</div>':'')+'<div id="ta"></div>';
 const ta=$('#ta');
 if(q.t==='choice'){const d=document.createElement('div');d.className='ch';q.shown.forEach(c=>{const b=document.createElement('button');b.innerHTML=c;b.onclick=()=>ans(c);d.appendChild(b)});ta.appendChild(d)}
 else if(q.t==='num'){ta.innerHTML='<div class="row" style="align-items:center"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="数を入力" style="flex:1;font:inherit;font-size:22px;padding:10px"><b>'+esc(q.unit||'')+'</b><button class="st s" id="numOk">決定</button></div>';$('#numOk').onclick=()=>{const v=$('#numIn').value.trim();if(v==='')return;ans(v)}}
 else{const picked=[];ta.innerHTML='<div class="small">正しい順にタップしよう</div><div class="ord" id="ordBox"></div><div class="ch" id="ordPool"></div><div class="row" style="margin-top:10px"><button class="st s" id="ordRe">やり直す</button><button class="st lp s" id="ordOk" disabled>決定</button></div>';
  const drawO=()=>{$('#ordBox').innerHTML=picked.map((t,i)=>'<div>'+(i+1)+'. '+t+'</div>').join('');const pool=$('#ordPool');pool.innerHTML='';q.shown.forEach(t=>{if(picked.includes(t))return;const b=document.createElement('button');b.innerHTML=t;b.onclick=()=>{picked.push(t);sfx.tap();drawO()};pool.appendChild(b)});$('#ordOk').disabled=picked.length!==q.shown.length};
  drawO();$('#ordRe').onclick=()=>{picked.length=0;drawO()};$('#ordOk').onclick=()=>ans(picked.slice())}
 $('#test').scrollTop=0}
function ans(v){TS.ans.push(v);sfx.tap();TS.i++;if(TS.i<TS.qs.length)renderQ();else finishTest()}
function finishTest(){const qs=TS.qs,review=Quiz.review(qs,TS.ans),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;sfx.fan();
 const nWin=Object.values(S.done).filter(d=>d.win).length;
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['完成した面',nWin+' / 10'],['根拠の的中',S.konOk+' / '+S.konTot],['三点そろい',S.santen+'回'],['モザイク',SEAS.map(s=>SN[s]+Math.floor(S.alb[s]/ALBN*100)+'%').join(' ')]];
 TS.card=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:UNIT,game:GTITLE+(TEST_ONLY?'（確認テストのみ）':''),name:playerName(),score,total:qs.length,marks,records:recs,review},showTestResult);showTestResult()}
function showTestResult(){const r=TS.card||{};$('#tbox').innerHTML='<h2>テストの結果</h2><p style="font-family:var(--fh);font-size:40px;margin:6px 0;color:#2a4f69">'+(r.score||0)+' / '+(r.total||0)+' 点</p><div style="display:flex;flex-direction:column;gap:8px"><button class="st lp" id="rCard">提出カードをもう一度見る</button><button class="st" id="rAgain">↺ テストをもう一度</button>'+(TEST_ONLY?'':'<button class="st s" id="rTitle">タイトルへ</button>')+'<button class="st s zk" id="rBook">📖 図鑑</button></div>';
 $('#rCard').onclick=()=>SubmitCard.reopen(TS.card,()=>{});$('#rAgain').onclick=()=>startTest();if($('#rTitle'))$('#rTitle').onclick=()=>toTitle();$('#rBook').onclick=openBook;zkButtons()}
function zkButtons(){const has=!!(window.Zukan&&Zukan.openBook);document.querySelectorAll('.zk').forEach(b=>b.classList.toggle('hidden',!has))}
function openBook(){try{window.Zukan&&Zukan.openBook&&Zukan.openBook({unit:'kisho'})}catch(e){}}
function openGacha(){try{window.Zukan&&Zukan.openGacha&&Zukan.openGacha({box:'kisho'})}catch(e){}}

/* ===== とっつきやすさ（ルール13） ===== */
const LEARN='季節ごとに、<b>天気図</b>（気圧配置）・<b>衛星画像</b>（雲）・<b>各地の天気</b>は、決まった組み合わせで現れる。';
const HOWTO='となりの石を<b>スワイプ</b>で入れかえ、<b>同じ季節</b>の石を3つ以上1列にそろえて消す。天気図・衛星画像・天気の3種がそろったら、衛星画像の<b>決め手をタップ</b>。';
function miniStone(t,s){const S0=66;const c=document.createElement('canvas');c.width=c.height=S0*2;const x=c.getContext('2d');x.scale(2,2);drawFace(x,0,0,S0,s,t,null,false);return c.toDataURL()}
let STEPIMG=null;
function stepsHTML(){if(!STEPIMG){try{STEPIMG={a:miniStone('zu','fuyu'),b:miniStone('ei','fuyu'),c:miniStone('ten','fuyu')}}catch(e){STEPIMG={}}}const im=k=>STEPIMG[k]?'<img src="'+STEPIMG[k]+'" style="width:30px;height:30px;border-radius:4px">':'';
  return '<div class="steps"><div><svg viewBox="0 0 66 66"><rect x="4" y="18" width="26" height="26" rx="4" fill="#e8dcc2" stroke="#8b7a5a"/><rect x="36" y="18" width="26" height="26" rx="4" fill="#2F3B46" stroke="#8b7a5a"/><path d="M14 54 Q33 64 52 54" fill="none" stroke="#3D7EA6" stroke-width="3"/><path d="M52 54l-7-1 4-5z" fill="#3D7EA6"/><path d="M52 10 Q33 0 14 10" fill="none" stroke="#3D7EA6" stroke-width="3"/><path d="M14 10l7 1-4 5z" fill="#3D7EA6"/></svg><span><b>① スワイプ</b><br>となりの石と入れかえ</span></div>'+
   '<div><span style="display:flex;gap:3px">'+im('a')+im('b')+im('c')+'</span><span><b>② 同じ季節を3つ</b><br>石が割れて、衛星画像の<br>モザイクに1片ずつはまる</span></div>'+
   '<div><svg viewBox="0 0 66 66"><rect x="6" y="6" width="54" height="54" rx="6" fill="#2F3B46" stroke="#8b7a5a"/><path d="M22 20l14 16M26 16l14 16M30 12l14 16" stroke="#f5f7f8" stroke-width="3" stroke-linecap="round"/><circle cx="33" cy="26" r="15" fill="none" stroke="#D8B45A" stroke-width="3" stroke-dasharray="5 3"/></svg><span><b>③ 決め手をタップ</b><br>3種がそろったら<br>衛星画像の季節の決め手を指す</span></div></div>'}
function introCard(){MODE='intro';showScr(['ov']);backBtn();
  ovOpen('<h2 style="text-align:center">この回でわかること</h2><div class="learn"><span class="lb">わかること</span><div class="big">'+LEARN+'</div></div><div class="learn"><span class="lb">こうやって遊ぶ</span><div style="font-size:15.5px;line-height:1.65">'+HOWTO+'</div>'+stepsHTML()+'</div><div class="row" style="margin-top:12px"><button class="st lp beat" id="inGo">やってみる</button></div>');
  $('#inGo').onclick=()=>{ac();sfx.clack();ovClose();startStage(0)}}
function helpOpen(){if(!$('#help').classList.contains('hidden'))return;ac();sfx.tap();const pm=MODE;if(MODE==='play')MODE='pause';
  const st=G?STG[G.si]:null;const gl=st?Object.keys(st.goal).map(k=>(k==='santen'?'三点そろい '+st.goal[k]+'回':k==='lock'?'目地くだき '+st.goal[k]+'個':SN[k]+' '+st.goal[k]+'片')).join('・'):'';
  $('#helpBox').innerHTML='<h2>遊び方</h2><div class="learn"><span class="lb">この回でわかること</span><div style="font-family:var(--fh);font-size:18px;line-height:1.5;color:#264a63">'+LEARN+'</div></div>'+stepsHTML()+
   (st?'<h2 style="font-size:21px;margin-top:12px">第'+(G.si+1)+'面　'+esc(st.nm)+' のルール</h2><ul class="rules"><li>'+esc(st.sub)+'</li><li>目標：'+esc(gl)+(st.boss?'（100秒）':'（'+st.mv+'手まで）')+'</li></ul>':'')+
   '<h2 style="font-size:21px;margin-top:12px">石の見分け方（色ではなく中身で）</h2><table class="ktab"><tr><th>季節</th><th>図 天気図</th><th>衛 衛星画像</th><th>天 各地の天気</th></tr>'+
   '<tr><td>冬</td><td>西に高・東に低（西高東低）。等圧線が南北にこむ</td><td>日本海にすじ状の雲</td><td>日本海側に雪、太平洋側は晴れ</td></tr>'+
   '<tr><td>夏</td><td>南に高・北に低（南高北低）</td><td>日本付近に雲が少ない</td><td>晴れて蒸し暑い（35℃）</td></tr>'+
   '<tr><td>梅雨</td><td>北と南の高気圧の間に停滞前線</td><td>東西に長い雲の帯</td><td>各地で雨が続く</td></tr>'+
   '<tr><td>春・秋</td><td>高気圧と低気圧が西から交互</td><td>雲のかたまりと晴れ間が交互</td><td>晴れと雨が数日ごとに入れかわる</td></tr></table>'+
   '<ul class="rules"><li>4つそろえると<b>ひまわり石</b>（1列を消す）、5つで<b>季節の扉</b>（入れかえた季節を全部消す）。</li><li>灰色の<b>目地</b>で固まった石は動かせない。となりでそろえると割れる。</li><li>自分の入れかえで3種そろう「三点そろい」のときだけ、決め手を指せる（かけらがもらえる）。</li></ul>'+
   '<div class="row" style="margin-top:12px"><button class="st lp" id="hpX">つづける</button></div>';
  $('#help').classList.remove('hidden');$('#helpBox').scrollTop=0;$('#hpX').onclick=()=>{sfx.tap();$('#help').classList.add('hidden');if(MODE==='pause')MODE=pm}}
$('#bHelp').onclick=helpOpen;
let GD=null,gdT=0;
function guideTarget(){if(!G||!$('#help').classList.contains('hidden'))return null;const st=STG[G.si];if(!st.tut)return null;
  if(MODE==='kon'&&G.konBox){const r=$('#konCv').getBoundingClientRect(),k=r.width/G.konBox.sz;return{k:'tap',x:r.left+G.konBox.x*k,y:r.top+G.konBox.y*k,t:'② 決め手の雲を タップ',ly:1}}
  if(MODE!=='play'||BUSY||!$('#ov').classList.contains('hidden'))return null;
  const cxy=(q)=>[L.bx+(q[1]+.5)*L.T,L.by+(q[0]+.5)*L.T];
  if(G.tutStep){const a=cxy(G.tut.a),b=cxy(G.tut.b);return{k:'drag',x:a[0],y:a[1],x2:b[0],y2:b[1],t:'① 冬の石を 下へスワイプ'}}
  if(G.idle>4){if(!G.gMove)G.gMove=hasMove();const m=G.gMove;if(m){const a=cxy(m[0]),b=cxy(m[1]);return{k:'drag',x:a[0],y:a[1],x2:b[0],y2:b[1],t:'同じ季節が3つ そろう所へ'}}}else G.gMove=null;
  return null}
function guideStep(dt){$('#bHelp').classList.toggle('hidden',!(MODE==='play'||MODE==='pause'||MODE==='map'||MODE==='kon'));
  const g=guideTarget(),f=$('#finger'),lb=$('#fgLab');
  if(!g){if(GD){f.classList.add('hidden');lb.classList.add('hidden');GD=null}return}
  if(!GD||GD.t!==g.t){gdT=0;lb.textContent=g.t}GD=g;gdT+=dt;f.classList.remove('hidden');lb.classList.remove('hidden');f.classList.toggle('tap',g.k==='tap');
  let x=g.x,y=g.y,sc=1;if(g.k==='tap')sc=1-.12*Math.max(0,Math.sin(gdT*7));else{const c=gdT%1.9;const t=1-Math.pow(1-clamp((c-.3)/.9,0,1),3);x=lerp(g.x,g.x2,t);y=lerp(g.y,g.y2,t);sc=c<.3?1-.1*(c/.3):c>1.3?1:.9}
  f.style.transform='translate('+(x-17)+'px,'+(y-4)+'px) scale('+sc+')';f.style.transformOrigin='17px 4px';
  const hw=Math.min(W/2-4,(lb.offsetWidth||220)/2+8);const lx=clamp(g.k==='drag'?(g.x+g.x2)/2:g.x,hw,W-hw);let ly=g.k==='drag'?Math.min(g.y,g.y2)-L.T*.5-40:g.y+56;ly=clamp(ly,60,H-48);lb.style.left=lx+'px';lb.style.top=ly+'px'}
function guideTrail(){if(!GD||GD.k!=='drag')return;cx.save();cx.globalAlpha=.6+.3*Math.sin(nowT*5);cx.strokeStyle='#D8B45A';cx.lineWidth=Math.max(4,L.T*.1);cx.strokeRect(GD.x-L.T/2+2,GD.y-L.T/2+2,L.T-4,L.T-4);cx.strokeRect(GD.x2-L.T/2+2,GD.y2-L.T/2+2,L.T-4,L.T-4);cx.restore()}

/* ===== ループ ===== */
let last=performance.now(),kkT=0;
function update(dt){if(!G||MODE!=='play')return;G.t+=dt;S.t+=dt;G.idle+=dt;const st=STG[G.si];
  if(st.boss&&!G.ended){G.time-=dt;if(G.time<=0){G.time=0;updHud();if(!BUSY)stageEnd(true)}else if(Math.floor(G.time*4)!==G.lastQ){G.lastQ=Math.floor(G.time*4);updHud()}}
  if(G.idle>12&&!BUSY&&!G.hintMove){G.hintMove=hasMove();hint('ヒント：ゆれている2つの石を入れかえると、同じ季節がそろう',3500)}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);guideStep(dt);bgm(dt);kkT-=dt;if(kkT<=0){kk();kkT=1}draw(dt);requestAnimationFrame(loop)}

$('#bStart').onclick=()=>{ac();sfx.fan();const nm=$('#nameIn').value.trim()||S.name,snd=S.sound;const keep={alb:S.alb,albDone:S.albDone};S=fresh();S.name=nm;S.sound=snd;S.started=true;S.alb=keep.alb;S.albDone=keep.albDone;save();introCard()};
$('#bCont').onclick=()=>{ac();sfx.tap();const v=$('#nameIn').value.trim();if(v)S.name=v;save();toMap()};
$('#bSnd').onclick=()=>{ac();S.sound=!S.sound;save();setSnd()};
$('#bAlb1').onclick=()=>{ac();sfx.tap();albumOpen()};$('#bAlb2').onclick=()=>{sfx.tap();albumOpen()};$('#bBook1').onclick=openBook;$('#bBook2').onclick=openBook;$('#bGacha').onclick=openGacha;
$('#bNext').onclick=()=>{ac();sfx.clack();if(S.cur>=STG.length)startTest();else startStage(Math.min(S.cur,STG.length-1))};

resize();try{document.fonts&&document.fonts.ready.then(()=>{for(const k in FC)delete FC[k]})}catch(e){}
try{window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]})}catch(e){}
setSnd();
if(window.PLAYER_NAME){$('#nameIn').value=window.PLAYER_NAME;$('#nameRow').classList.add('hidden')}else if(S.name)$('#nameIn').value=S.name;
window.__game={S:()=>S,G:()=>G,L,mode:()=>MODE,startStage,toMap,startTest,albumOpen,trySwap,hasMove,findGroups,stageEnd,busy:()=>BUSY,
  cellXY:(r,c)=>[L.bx+(c+.5)*L.T,L.by+(r+.5)*L.T],setTile:(r,c,s,t,v)=>{Object.assign(G.b[r][c],{s,t,v:v||null,sp:null,lock:0})},konTap:(lo,la)=>{}};
if(TEST_ONLY)startTest();else toTitle();
requestAnimationFrame(loop);
</script>
