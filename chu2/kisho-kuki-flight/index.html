<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空気のかたまり操縦 ～雲のでき方～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Kaisei+Decol:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f0e2;--paper2:#ebe2cc;--ink:#2e2a24;--sky:#bfe0ea;--sky2:#9ccbdc;--leaf:#5e8c61;--leaf2:#8fb3a0;--earth:#c9a66b;--red:#d2553b;--yel:#e9b949;--blue:#2f6f99}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;-webkit-text-size-adjust:100%}
body{background:var(--paper);background-image:repeating-linear-gradient(45deg,rgba(120,100,60,.035) 0 2px,transparent 2px 6px);overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dec{font-family:"Kaisei Decol","Zen Maru Gothic",serif}
.hidden{display:none!important}
#app{width:100%;max-width:540px;margin:0 auto;padding:8px 10px 30px}
.btn{font:inherit;font-weight:900;font-size:17px;min-height:48px;padding:10px 16px;border-radius:14px;border:none;background:var(--red);color:#fff;box-shadow:0 4px 0 #8e3322,0 6px 10px rgba(0,0,0,.15);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8e3322}
.btn.sub{background:#fffaf0;color:var(--ink);box-shadow:0 4px 0 #cbbf9f}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 #1d4a67}
.btn.yel{background:var(--yel);color:#3a2a00;box-shadow:0 4px 0 #a4801f}
.btn[disabled]{opacity:.4;transform:none}
.card{background:#fffaf0;border-radius:14px;box-shadow:0 3px 0 #d9ceb2,0 6px 14px rgba(60,40,10,.10);position:relative}
#title{text-align:center;padding-top:6px}
#title h1{font-family:"Kaisei Decol",serif;font-size:clamp(28px,8vw,40px);margin:6px 0 0;line-height:1.25;color:var(--blue)}
#title .sub{font-weight:900;font-size:18px;margin:2px 0 8px}
#title .lead{margin:10px auto;max-width:440px;font-size:15.5px;line-height:1.8;text-align:left;padding:12px 14px}
#title .row{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:10px}
#title .row .btn{width:min(80vw,320px)}
#nameRow{display:flex;gap:8px;align-items:center;justify-content:center;font-weight:900}
#nameRow input{font:inherit;font-size:17px;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;width:12em;background:#fff;color:var(--ink)}
.tiny{font-size:12.5px;color:#6b6252}
#hud{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:4px 2px 6px;margin-bottom:4px;font-weight:900;font-size:13px;overflow:hidden}
#hud .pill{background:#fffaf0;border-radius:999px;padding:3px 9px;box-shadow:0 2px 0 #d9ceb2;white-space:nowrap}
#hZk{min-width:0;overflow:hidden;flex-shrink:1}
.iconbtn{font:inherit;min-width:44px;min-height:44px;border-radius:12px;border:none;background:#fffaf0;box-shadow:0 2px 0 #d9ceb2;font-size:18px;cursor:pointer}
#fTitle{line-height:1.35;margin:2px 0 6px}
#fTitle b{font-family:"Kaisei Decol",serif;font-size:20px;color:var(--blue)}
#chain{display:flex;gap:3px;margin:0 0 6px}
#chain div{flex:1;text-align:center;font-size:11px;font-weight:900;padding:5px 0;border-radius:8px;background:#e7dfcb;color:#8a7f66;position:relative}
#chain div.on{background:var(--blue);color:#fff;animation:chip .4s}
#chain div.on.cl{background:#fff;color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
@keyframes chip{50%{transform:scale(1.15)}}
#view{overflow:hidden;padding:0}
#view svg{display:block;width:100%;height:auto;border-radius:14px}
#read{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}
#read div{background:#fffaf0;border-radius:10px;box-shadow:0 2px 0 #d9ceb2;padding:4px 6px;font-size:11.5px;font-weight:900;color:#6b6252;text-align:center}
#read div b{display:block;font-size:19px;color:var(--ink)}
#read div.hot b{color:var(--red)}#read div.cold b{color:var(--blue)}
#qbox{margin-top:8px;padding:10px 12px}
#qbox .q{font-weight:900;font-size:16px;line-height:1.5;margin-bottom:8px}
#qbox .ch{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#qbox .ch button{font:inherit;font-weight:900;font-size:15px;min-height:50px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;padding:4px}
#qbox .ch button.ng{opacity:.35}
#hold{width:100%;margin-top:8px;min-height:64px;font-size:19px;touch-action:none}
#hold.on{background:#b8432c;transform:translateY(3px);box-shadow:0 1px 0 #8e3322}
#msg{min-height:40px;margin-top:8px;font-weight:700;font-size:14.5px;line-height:1.6;padding:6px 10px;border-radius:10px;background:#fffaf0}
#msg.good{box-shadow:0 0 0 2px var(--leaf) inset}#msg.bad{box-shadow:0 0 0 2px var(--red) inset}
.panel{padding:14px;margin-top:8px;font-size:15.5px;line-height:1.75}
.panel h2{margin:0 0 6px;color:var(--blue);font-size:23px;font-family:"Kaisei Decol",serif}
.fig{width:100%;display:block;margin:8px auto;height:auto}
.chs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.chs button,.ch2 button{font:inherit;font-weight:800;font-size:15.5px;min-height:50px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);text-align:left;padding:8px 12px;cursor:pointer;line-height:1.45}
.chs button.sel,.ch2 button.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.ch2{display:flex;flex-direction:column;gap:6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.opts button{font:inherit;font-weight:900;min-height:46px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-size:15px;cursor:pointer}
.opts button.sel{background:var(--yel);border-color:#a4801f}
.col{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.recs div{background:#fff;border-radius:10px;padding:6px 8px;font-size:12.5px;font-weight:900;box-shadow:0 2px 0 #d9ceb2}
.recs b{display:block;font-size:19px;color:var(--blue)}
.ord{min-height:54px;border:2px dashed #b9ad8e;border-radius:12px;padding:6px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.ord div{background:var(--sky);border-radius:8px;padding:6px 8px;font-weight:800;font-size:15px}
#tbox .tno{font-weight:900;color:var(--blue)}
#tbox .prog{display:flex;gap:4px;margin:6px 0 12px}
#tbox .prog i{flex:1;height:7px;border-radius:4px;background:#e7dfcb}
#tbox .prog i.on{background:var(--blue)}
#tbox .tq{font-size:17.5px;font-weight:900;line-height:1.7;margin-bottom:10px}
#tbox .fig2{background:#fff;border-radius:10px;padding:6px;margin:6px 0 12px;text-align:center}
#tbox .fig2 svg{max-width:100%;height:auto;max-height:250px}
.ch{display:flex;flex-direction:column;gap:8px}
#tbox .ch button{font:inherit;text-align:left;font-size:16px;font-weight:800;min-height:50px;padding:8px 12px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;line-height:1.45}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{font:inherit;font-size:22px;width:8em;padding:8px 10px;border:2px solid var(--ink);border-radius:10px}
.stamp{display:inline-block;border:4px double var(--red);color:var(--red);font-family:"Kaisei Decol",serif;font-size:26px;padding:2px 14px;transform:rotate(-8deg);border-radius:8px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{position:fixed;z-index:60;pointer-events:none;font-weight:900;font-size:22px;color:var(--blue);text-shadow:0 0 3px #fff,0 0 6px #fff;animation:pop 1.2s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;font-family:"Kaisei Decol",serif;font-size:clamp(24px,7.5vw,36px);color:var(--blue);background:#fffaf0;padding:8px 22px;border-radius:16px;opacity:0;white-space:nowrap;box-shadow:0 5px 0 #d9ceb2,0 10px 20px rgba(0,0,0,.2)}
#banner.on{animation:ban 1.7s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-4deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06) rotate(1deg)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="banner"></div>
<div id="app">

<section id="title">
  <div class="tiny" style="font-weight:900">中2理科 気象とその変化 第15回</div>
  <svg viewBox="0 0 320 170" style="width:min(88vw,380px)" id="titleArt" aria-hidden="true"></svg>
  <h1>空気のかたまり操縦</h1>
  <div class="sub">～ 雲のでき方 ～</div>
  <div class="lead card">紙飛行機のパイロットになって、<b>空気のかたまり</b>を空へ運ぼう。<br>上がるとかたまりは、どうなる？ 目じるしごとに<b>「次に何が起きるか」を予言</b>して当てよう。<br><b>雲ができるまで終われません！</b></div>
  <div id="nameRow"><label for="nameIn">なまえ</label><input id="nameIn" maxlength="20" placeholder="（なくてもOK）" autocomplete="off"></div>
  <div class="row">
    <button class="btn" id="bStart">✈️ はじめる</button>
    <button class="btn blue hidden" id="bCont">⏩ つづきから</button>
    <button class="btn sub zk hidden" id="bBook1">📖 図鑑</button>
    <button class="btn sub" id="bSnd1">🔊 音：オン</button>
  </div>
</section>

<section id="game" class="hidden">
  <div id="hud"><span class="pill" id="hFl">フライト 1/8</span><span class="pill" id="hHit">🎯 0</span><span id="hZk"></span><button class="iconbtn" id="bSnd2" aria-label="音">🔊</button></div>
  <div id="play">
    <div id="fTitle"></div>
    <div id="chain"></div>
    <div id="view" class="card"></div>
    <div id="read"></div>
    <div id="qbox" class="card hidden"></div>
    <button class="btn" id="hold">✈️ 長押しで飛ぶ</button>
    <div id="msg"></div>
  </div>
  <div id="panel" class="panel card hidden"></div>
</section>

<section id="clear" class="hidden">
  <div class="panel card">
    <h2>雲ができた！ 全フライト完了</h2>
    <p><b>空気が上昇 → まわりの気圧が下がる → ふくらむ → 温度が下がる → 露点に達する → 水蒸気が凝結して雲</b>。雲ができていない空気は100m上がるごとに約1℃下がる。乾いた空気（露点が低い）ほど、高い所で雲ができる。下りる空気は縮んで温まり、雲は消える。</p>
    <div class="recs" id="recs"></div>
    <div id="sealView"></div>
    <div class="col"><button class="btn" id="bTest">📝 確認テストへ（10問）</button><button class="btn sub zk hidden" id="bBook2">📖 図鑑</button></div>
  </div>
</section>
<section id="test" class="hidden"><div class="panel card" id="tbox"></div></section>
<section id="result" class="hidden"><div class="panel card" id="rbox"></div></section>
</div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

 Q.sort(()=>Math.random()-.5).forEach(([t,ok])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(!ok){sfx.ng();b.disabled=true;b.style.opacity=.4;return}win('乾いた空気は露点が低い。露点まで冷えるには高く上がる必要がある → 雲ができはじめる高さが高い。')};box.appendChild(b)})}
/* ===== 封印（予想用） ===== */
const SQ=[['注射器のピストンを引いて、フラスコの中の空気をふくらませると、中は？',['白くくもる','変わらない','水がこおる']],['そのとき、フラスコの中の温度は？',['下がる','上がる','変わらない']],['ピストンを押しもどすと？',['くもりが消える','もっとくもる','変わらない']]];
const REASONS=['かたまりが上がってふくらむと、温度が下がった','温度が露点に達すると、雲ができた','下りて縮むと温度が上がり、雲が消えた','乾いたかたまりは、なかなか雲にならなかった'];
function sealPanel(){const P=$('#panel');const sel={a:[null,null,null],r:[]};
 const draw=()=>{P.innerHTML='<h2>🔏 実験の予想を封印</h2><p class="tiny">次の授業で、フラスコ（またはペットボトル）の中に雲をつくる実験をする。ゲームで見つけたことを使って予想しよう。答え合わせは本物の実験で。</p><svg class="fig" viewBox="0 0 300 120"><rect width="300" height="120" rx="10" fill="#e8f3f8"/><circle cx="110" cy="72" r="34" fill="#fff" stroke="#2e2a24" stroke-width="2"/><rect x="100" y="18" width="20" height="24" fill="#fff" stroke="#2e2a24" stroke-width="2"/><path d="M120 28 H170" stroke="#2e2a24" stroke-width="3"/><rect x="170" y="18" width="80" height="20" rx="3" fill="#fffaf0" stroke="#2e2a24" stroke-width="2"/><rect x="236" y="14" width="40" height="28" fill="#c9a66b" stroke="#2e2a24"/><text x="256" y="58" font-size="10" text-anchor="middle" font-weight="900">ピストン</text><path d="M82 96 q28 10 56 0" stroke="#7fb3d0" stroke-width="3" fill="none"/><text x="110" y="112" font-size="9" text-anchor="middle">少しの水・線香のけむり</text></svg>'+
  SQ.map((q,i)=>'<div style="font-weight:900;margin-top:6px">'+(i+1)+'. '+q[0]+'</div><div class="opts">'+q[1].map(o=>'<button data-i="'+i+'" data-o="'+o+'" class="'+(sel.a[i]===o?'sel':'')+'">'+o+'</button>').join('')+'</div>').join('')+
  '<div style="font-weight:900;margin-top:8px">根拠カード（ゲームで見たこと・1つ以上）</div><div class="ch2">'+REASONS.map((r,i)=>'<button data-r="'+i+'" class="'+(sel.r.includes(i)?'sel':'')+'">'+r+'</button>').join('')+'</div>'+
  '<div class="col"><button class="btn yel" id="bDoSeal" '+(sel.a.every(Boolean)?'':'disabled')+'>🔏 封印する</button></div>';
  P.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{sfx.tap();sel.a[+b.dataset.i]=b.dataset.o;draw()});
  P.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{sfx.tap();const i=+b.dataset.r;sel.r=sel.r.includes(i)?sel.r.filter(x=>x!==i):sel.r.concat([i]);draw()});
  $('#bDoSeal').onclick=()=>doSeal(sel)};draw()}
function predText(a){return 'ピストンを引くと'+a[0]+'・温度は'+a[1]+'／押すと'+a[2]}
function doSeal(sel){const rec={v:1,koma:KOMA,game:GID,at:Date.now(),name:S.name||window.PLAYER_NAME||'',pred:{cloud:sel.a[0],temp:sel.a[1],push:sel.a[2]},predText:predText(sel.a),reasons:sel.r.map(i=>REASONS[i])};
 try{localStorage.setItem(SEAL_KEY,JSON.stringify(rec))}catch(e){}S.seal=rec;save();
 if(sel.r.length){const k='predict';if(!S.paid[k]){S.paid[k]=1;earn(10,'predict',innerWidth/2,240)}}
 sfx.seal();burst(innerWidth/2,260,50,7);
 $('#panel').innerHTML='<h2>封印しました</h2><div style="text-align:center;margin:10px"><span class="stamp">封印</span></div><p>予想：<b>'+esc(rec.predText)+'</b>'+(rec.reasons.length?'<br>根拠：'+rec.reasons.map(esc).join('／'):'')+'</p><p class="tiny">実験のあとで、この予想と結果をくらべよう。</p><div class="col"><button class="btn" id="bFin">🏁 全フライト完了</button></div>';
 $('#bFin').onclick=()=>{S.cleared=true;save();toClear()}}
/* ===== はじめの説明 ===== */
function introPanel(){$('#play').classList.add('hidden');const P=$('#panel');P.classList.remove('hidden');
 P.innerHTML='<h2>空気のかたまりって？</h2><svg class="fig" viewBox="0 0 320 150"><rect width="320" height="150" rx="10" fill="#d7ecf2"/><path d="M0 150 L150 40 L320 150Z" fill="#6f9a6a"/><g><circle cx="60" cy="118" r="14" fill="#fffaf0" stroke="#2e2a24" stroke-dasharray="3 2"/><text x="60" y="122" font-size="9" text-anchor="middle">ふもと</text></g><g><circle cx="150" cy="22" r="19" fill="#fffaf0" stroke="#2e2a24" stroke-dasharray="3 2"/><text x="150" y="26" font-size="9" text-anchor="middle">山頂</text></g><text x="200" y="40" font-size="10" font-weight="900">袋もかたまりも</text><text x="200" y="54" font-size="10" font-weight="900">上ではふくらむ</text><rect x="220" y="66" width="40" height="28" rx="6" fill="#e9b949" stroke="#2e2a24"/><text x="240" y="84" font-size="8" text-anchor="middle">おかし</text></svg>'+
 '<p style="font-size:14.5px">空の空気を、見えない<b>風船のようなかたまり</b>として考える。かたまりの中の<b>水蒸気の量</b>（青い点）は、雲ができるまで変わらない。<br>下の数字（高さ・気圧・体積・温度・露点・湿度）を見ながら飛ぼう。上の6つのマスは「雲ができるまで」の道のり。</p><div class="col"><button class="btn" id="iGo">✈️ フライト1へ</button></div>';
 $('#iGo').onclick=()=>{sfx.tap();S.introSeen=true;save();banner('フライト1');startFlight(0)}}
function titleArt(){let g='<rect width="320" height="170" rx="16" fill="#d7ecf2"/><rect y="60" width="320" height="110" fill="#c7e3ec"/><circle cx="270" cy="36" r="16" fill="#f2c14e"/><path d="M0 170 L110 70 L190 130 L250 90 L320 150 V170Z" fill="#6f9a6a"/><path d="M0 170 L110 84 L190 142 L250 104 L320 162 V170Z" fill="#5e8c61"/>';
 g+='<g transform="translate(110 48)"><ellipse cx="0" cy="0" rx="34" ry="14" fill="#fff"/><circle cx="-14" cy="-8" r="14" fill="#fff"/><circle cx="10" cy="-12" r="17" fill="#fff"/></g><circle cx="70" cy="118" r="13" fill="#fffaf0" stroke="#2e2a24" stroke-dasharray="3 2"/>'+[0,1,2,3,4].map(i=>'<circle cx="'+(64+(i%3)*6)+'" cy="'+(114+Math.floor(i/3)*7)+'" r="1.8" fill="#7fb3d0"/>').join('');
 g+='<g transform="translate(150 70) rotate(-18)"><path d="M0 0 L46 12 L0 24 L10 12Z" fill="#fff" stroke="#2e2a24"/><path d="M10 12 L46 12" stroke="#2e2a24"/></g><path d="M84 110 Q120 96 150 84" stroke="#2e2a24" stroke-dasharray="3 3" fill="none"/>';$('#titleArt').innerHTML=g}
/* ===== 画面きりかえ ===== */
function show(id){for(const s of['title','game','clear','test','result'])$('#'+s).classList.toggle('hidden',s!==id);scrollTo(0,0)}
let clock=null;function startClock(){clearInterval(clock);clock=setInterval(()=>{if(!$('#game').classList.contains('hidden')){S.t++;if(S.t%5===0)save()}},1000)}
function fmtT(t){return Math.floor(t/60)+'分'+String(t%60).padStart(2,'0')+'秒'}
function enterGame(){show('game');try{if(window.Zukan&&Zukan.hud){$('#hZk').innerHTML='';Zukan.hud($('#hZk'))}}catch(e){}if(S.cleared)return toClear();startClock();hudUp();
 if(!S.introSeen)return introPanel();startFlight(S.f)}
function toClear(){show('clear');const r=S.bossRec||[200,800,1400];
 $('#recs').innerHTML='<div>クリアタイム<b>'+fmtT(S.t)+'</b></div><div>一発で当てた予言<b>'+S.first+'</b></div><div>最大連続的中<b>'+S.maxCombo+'</b></div><div>雲の高さ A/B/C<b style="font-size:15px">'+r.join('/')+'m</b></div>';
 $('#sealView').innerHTML=S.seal?'<div class="card" style="padding:8px 10px;margin:6px 0"><span class="stamp" style="font-size:16px">封印</span> '+esc(S.seal.predText)+'</div>':'';
 sfx.big();burst(innerWidth/2,200,80,8);zkButtons();
 if(!S.mainClearShown&&window.Zukan&&Zukan.mainClear){S.mainClearShown=true;save();try{Zukan.mainClear({onClose:()=>{}})}catch(e){}}}
$('#bStart').onclick=()=>{ac();const nm=$('#nameIn').value.trim()||S.name,snd=S.sound;S=fresh();S.name=nm;S.sound=snd;S.started=true;save();enterGame()};
$('#bCont').onclick=()=>{ac();const v=$('#nameIn').value.trim();if(v)S.name=v;save();enterGame()};
const sndT=()=>{S.sound=!S.sound;save();setSnd()};$('#bSnd1').onclick=sndT;$('#bSnd2').onclick=sndT;
function openBook(){try{window.Zukan&&Zukan.openBook&&Zukan.openBook({unit:'kisho'})}catch(e){}}
$('#bBook1').onclick=openBook;$('#bBook2').onclick=openBook;$('#bTest').onclick=()=>startTest();
/* ===== 確認テスト ===== */
let T=null;function playerName(){return window.PLAYER_NAME||S.name||''}
function startTest(){if(!window.Quiz)return;T={qs:Quiz.test(),i:0,ans:[]};show('test');renderQ()}
function renderQ(){const q=T.qs[T.i],box=$('#tbox');
 box.innerHTML='<div class="tno">📝 確認テスト　第'+(T.i+1)+'問 / '+T.qs.length+'</div><div class="prog">'+T.qs.map((_,i)=>'<i class="'+(i<T.i?'on':'')+'"></i>').join('')+'</div><div class="tq">'+q.q+'</div>'+(q.fig?'<div class="fig2">'+q.fig+'</div>':'')+'<div id="ta"></div>';
 const ta=$('#ta');
 if(q.t==='choice'){const d=document.createElement('div');d.className='ch';q.shown.forEach((c,i)=>{const b=document.createElement('button');b.innerHTML=c;b.onclick=()=>ans(q.shown[i]);d.appendChild(b)});ta.appendChild(d)}
 else if(q.t==='num'){ta.innerHTML='<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="数を入力"><b>'+esc(q.unit||'')+'</b><button class="btn" id="numOk">決定</button></div>';$('#numOk').onclick=()=>{const v=$('#numIn').value.trim();if(v==='')return;ans(v)}}
 else{const picked=[];ta.innerHTML='<div class="tiny">正しい順にタップしよう</div><div class="ord" id="ordBox"></div><div class="ch" id="ordPool"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sub" id="ordRe">やり直す</button><button class="btn" id="ordOk" disabled>決定</button></div>';
  const draw=()=>{$('#ordBox').innerHTML=picked.map((t,i)=>'<div>'+(i+1)+'. '+t+'</div>').join('');const pool=$('#ordPool');pool.innerHTML='';q.shown.forEach(t=>{if(picked.includes(t))return;const b=document.createElement('button');b.innerHTML=t;b.onclick=()=>{picked.push(t);sfx.tap();draw()};pool.appendChild(b)});$('#ordOk').disabled=picked.length!==q.shown.length};
  draw();$('#ordRe').onclick=()=>{picked.length=0;draw()};$('#ordOk').onclick=()=>ans(picked.slice())}}
function ans(v){T.ans.push(v);sfx.tap();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()}
function finishTest(){const qs=T.qs,review=Quiz.review(qs,T.ans),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 sfx.big();burst(innerWidth/2,220,60,7);const r=S.bossRec||[];
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(S.t)],['一発で当てた予言',S.first+'回（最大'+S.maxCombo+'連続）'],['雲ができた高さ A/B/C',r.length?r.join('/')+'m':'―'],['実験で確かめる予想',S.seal?S.seal.predText:'（未記入）']];
 T.card=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:UNIT,game:GTITLE+(TEST_ONLY?'（確認テストのみ）':''),name:playerName(),score,total:qs.length,marks,records:recs,review},showResult);showResult()}
function showResult(){show('result');const r=T.card||{};
 $('#rbox').innerHTML='<h2>テストの結果</h2><p style="font-size:22px;font-weight:900">'+(r.score||0)+' / '+(r.total||0)+' 点</p><div class="col"><button class="btn" id="rCard">📝 提出カードをもう一度見る</button><button class="btn blue" id="rAgain">↺ テストをもう一度</button>'+(TEST_ONLY?'':'<button class="btn sub" id="rTitle">🏠 タイトルへ</button>')+'<button class="btn sub zk hidden" id="rBook">📖 図鑑</button></div>';
 $('#rCard').onclick=()=>SubmitCard.reopen(T.card,()=>{});$('#rAgain').onclick=()=>startTest();if($('#rTitle'))$('#rTitle').onclick=()=>toTitle();$('#rBook').onclick=openBook;zkButtons()}
function zkButtons(){const has=!!(window.Zukan&&Zukan.openBook);document.querySelectorAll('.zk').forEach(b=>b.classList.toggle('hidden',!has))}
function toTitle(){show('title');$('#bCont').classList.toggle('hidden',!S.started);zkButtons()}
try{window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]})}catch(e){}
titleArt();setSnd();
if(window.PLAYER_NAME){$('#nameIn').value=window.PLAYER_NAME;$('#nameRow').classList.add('hidden')}else if(S.name)$('#nameIn').value=S.name;
window.__game={state:()=>S,F:()=>F,FL,lcl,holdOn,startFlight};
if(TEST_ONLY){$('#title').classList.add('hidden');startTest()}else toTitle();
</script>
