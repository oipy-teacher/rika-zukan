<title>異常天気のラスボス ～気象とその変化 総まとめ～</title>
<!--
  異常天気のラスボス ～気象とその変化 総まとめ～（中2理科 気象 コマ35 単元末まとめ / kisho-lastboss / chu2-kisho-35 / 役割なし）

  ■ 世界とメタファー: 夜の大聖堂。バラ窓（ステンドグラス）に宿ったボス「ナゾテンキ」が、霧・夕立・梅雨・大雪・台風・西からの雨の
    弾幕を撃ってくる。こちらは光の小鳥（色ガラスの自機）。画面ぜんぶが鉛線と色ガラスでできている。
  ■ 遊びの核: 縦シューティング（弾幕のボス戦）。PC・iPad横は自機が左・ボスが右の横向き、スマホ・iPad縦は自機が下・ボスが上。
    ・指でドラッグして自機を動かす。光の粒は自動で出る。
    ・下の「鍵」4つ＝謎を解く原因: 冷やす（水の状態変化）／持ち上げる（大気の動き）／海の水蒸気（海洋の影響）／高気圧で押す（大気の動き）。
      鍵をタップすると、その色の光に切りかわり、同時に大きな「鍵の弾」を1発撃つ。
    ・弾幕は、原因に合う鍵の光でだけ解ける（霧＝冷やす、夕立の雨粒＝持ち上げる、雪・しめった空気＝海の水蒸気、風・うず＝高気圧で押す）。
      解けると雲や雨粒に変わってガラスのかけらになって消える（連鎖＝コンボ）。
    ・「説明の札」（ガラスのメダル）を、原因→途中の変化→結果の順に、合う鍵の弾で撃ち抜くと説明がつながり、光の柱がボスの窓を割る。
      順番ちがい・鍵ちがいは連鎖がリセット。誤概念の札（わな）を撃つとひびが入る（死に覚え）。
  ■ 道のり: バラ窓の花びらを1枚ずつはがす＝れんしゅう（朝もや）→ 朝霧 → 夕立と急な冷えこみ → 梅雨の長雨 → 日本海側の大雪（山場：2本の説明を合流）
    → 秋の台風のカーブ → 西からくずれる天気 → 最終形態（5つの現象を時間内に続けて説明）。集める＝単元の図鑑の最後の1枚（ボス撃破）。
    各形態を「水の状態変化・大気の動き・海洋の影響」のどれで説明したかを、バラ窓の花びらの色で明示する。
  ■ 配色: 背景 #0F1320／主 金 #F2C14E／差し 朱 #C73E1D（色ガラス: 瑠璃 #2E5EAA・青緑 #2F8F83・乳白 #EDE4C8）。鉛線は #05070C。
  ■ 書体: Shippori Antique B1（見出し・札・数字）。
  ■ HUD: 左上「← もどる」（鉛枠の札）、上に説明の枠（原因→途中の変化→結果）、ボスの窓の残り、ハートのガラス、右上＝音・？。
  ■ 音: 大聖堂のオルガン風のうなり（連鎖で声部が増える）、ガラスの鈴、光の柱、割れる音。
  ■ 鍵の名前: 割り当て表の「冷やす・持ち上げる・水蒸気を断つ・高気圧で押し返す」を、原因の名前として筋が通るよう調整（_素材.md）。
-->

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

/>\u003cpath d=\"M264 10 C254 60 274 110 262 170\" fill=\"none\" stroke=\"#333\" stroke-width=\"1.3\"/>\u003ctext x=\"20\" y=\"96\" font-size=\"28\" font-weight=\"bold\" fill=\"#1d4fa0\">高\u003c/text>\u003ctext x=\"280\" y=\"96\" font-size=\"28\" font-weight=\"bold\" fill=\"#b8321d\">低\u003c/text>\u003c/svg>", "ex": "西に高気圧・東に低気圧＝西高東低の冬型。北西の季節風で日本海側に雪。", "kind": "graph", "level": 2, "id": "chu2-kisho-lastboss-q008", "koma": "chu2-kisho-35"}, {"t": "choice", "q": "夏から秋にかけて日本付近に来る台風の進み方として、正しいのは？", "choices": ["太平洋高気圧のふちに沿って北上し、偏西風に流されて東寄りに進む", "偏西風に流されて西へ進む", "太平洋高気圧の中心に向かってまっすぐ進む", "いつも日本海から太平洋へ南下する"], "ex": "台風は高気圧のふちを回るように北上し、日本付近では偏西風で北東へ。", "kind": "judge", "level": 2, "id": "chu2-kisho-lastboss-q009", "koma": "chu2-kisho-35", "fig": null}, {"t": "choice", "q": "台風が日本に上陸すると勢力が弱まることが多いのはなぜ？", "choices": ["陸の上では、発達に必要な水蒸気が海から補給されないから", "陸の上は気圧が高く、台風が押しつぶされるから", "陸の上では偏西風がふかないから", "陸は海よりあたたかいから"], "ex": "台風はあたたかい海の水蒸気で発達する。冷たい海や陸では弱まる。", "kind": "judge", "level": 2, "id": "chu2-kisho-lastboss-q010", "koma": "chu2-kisho-35", "fig": null}, {"t": "choice", "q": "日本付近で、天気が西から東へ移り変わることが多いのはなぜ？", "choices": ["上空の偏西風によって、低気圧や高気圧が西から東へ動くから", "地球が西から東へ回ると、雲が取り残されるから", "海風が西からふくから", "東の太平洋に高気圧があるから"], "ex": "偏西風は日本の上空を西から東へふく。", "kind": "judge", "level": 1, "id": "chu2-kisho-lastboss-q011", "koma": "chu2-kisho-35", "fig": null}, {"t": "order", "q": "梅雨の時期に雨の日が続くしくみを、原因から結果の順に並べよう。", "items": ["オホーツク海気団と小笠原気団の勢力がつり合う", "境目に停滞前線（梅雨前線）ができる", "湿った空気が前線で持ち上げられる", "雲が次々にでき、雨の日が続く"], "ex": "勢力がつり合うので前線が動かず、同じ地域で雨が続く。", "kind": "judge", "level": 3, "id": "chu2-kisho-lastboss-q012", "koma": "chu2-kisho-35", "fig": null}, {"t": "choice", "q": "温暖前線が近づくときの雨のふり方として正しいのは？", "choices": ["広い範囲で、弱い雨が長い時間続く", "せまい範囲で、強い雨が短い時間ふる", "雨はふらず、晴れる", "雪だけがふる"], "ex": "暖気が寒気の上をゆるやかにはい上がり、乱層雲ができる。", "kind": "judge", "level": 2, "id": "chu2-kisho-lastboss-q013", "koma": "chu2-kisho-35", "fig": null}, {"t": "num", "q": "質量3kgの箱（重さ30N）を、面積0.015m²の面を下にして置いた。床が受ける圧力は何Pa？", "ans": 2000, "unit": "Pa", "tol": 0, "ex": "30N÷0.015m²＝2000Pa。", "kind": "calc", "level": 2, "id": "chu2-kisho-lastboss-q014", "koma": "chu2-kisho-35", "fig": null}, {"t": "choice", "q": "夏の晴れた日の昼、海岸で海から陸へ風がふいた。その原因のつながりとして正しいのは？", "choices": ["陸が海よりあたたまりやすく、陸の空気が上昇して気圧が下がるから", "海が陸よりあたたまりやすいから", "陸の気圧が海より高くなるから", "海の上で雲ができるから"], "ex": "あたたまりやすい陸で上昇気流→気圧が低くなり、海から風がふきこむ。", "kind": "judge", "level": 3, "id": "chu2-kisho-lastboss-q015", "koma": "chu2-kisho-35", "fig": null}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

function dirTo(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay)||1;return [(bx-ax)/d,(by-ay)/d]}

function addB(kind,x,y,vx,vy){const B=BUL[kind];G.bul.push({kind,k:B.k,x,y,vx,vy,r:B.r*(Math.min(W_,H_)<500?.9:1),rot:Math.random()*6,life:14})}
function fan(g,kind,n,spread,sp){const [bx,by]=bossPos(),R=bossR();const bd=base();const a0=Math.atan2(bd[1],bd[0]);for(let i=0;i<n;i++){const a=a0+(i/(n-1)-.5)*spread+rnd(-.05,.05);addB(kind,bx+Math.cos(a)*R*.8,by+Math.sin(a)*R*.8,Math.cos(a)*sp,Math.sin(a)*sp)}}

let SPA=0;function spiral(g,kind,arms,sp){const [bx,by]=bossPos(),R=bossR();SPA+=.37;const bd=base();const a0=Math.atan2(bd[1],bd[0]);for(let k=0;k<arms;k++){const a=a0+Math.sin(SPA+k*Math.PI)*1.1;addB(kind,bx+Math.cos(a)*R*.8,by+Math.sin(a)*R*.8,Math.cos(a)*sp,Math.sin(a)*sp)}}
function wall(g,kind,n,sp){const [bx,by]=bossPos(),R=bossR();const gap=Math.floor(Math.random()*n);const f=base();const L=WIDE?PF.h:W_;for(let i=0;i<n;i++){if(i===gap||i===gap+1)continue;const b=(i+.5)/n*L;const [x,y]=WIDE?[bx-R,PF.y+b]:[b,by+R];addB(kind,x,y,f[0]*sp,f[1]*sp)}}

   cx.strokeStyle=LEAD;cx.lineWidth=4;cx.beginPath();cx.arc(x,y,r,0,7);cx.stroke();for(let k=0;k<n;k++){const a=k/n*Math.PI*2-Math.PI/2;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);cx.stroke()}}
  else gcircle(x,y,r+(cur?Math.sin(T_*4)*3:0),lock?'#222840':'#4A3A70',lock?null:'#8A7AB0',4);
  if(cur){cx.strokeStyle=GOLD;cx.lineWidth=3;cx.setLineDash([6,5]);cx.beginPath();cx.arc(x,y,r+8,0,7);cx.stroke();cx.setLineDash([])}
  const f=FORMS[i];otext(i===0?'練':i===7?'終':'一二三四五六'[i-1],x,y+r*.18,r*.62,lock?'#556':GOLD);
  const fs=Math.max(11,Math.min(14,r*.3));otext(f.nm.replace('ナゾテンキ ',''),x,y+r+fs+4,fs,lock?'#667':MILK);if(d)otext('★'.repeat(d.st)+'☆'.repeat(3-d.st),x,y-r-6,fs,GOLD)}
 // 説明の一覧
 if(WIDE){const x=W_*.66,y0=H_*.2;otext('ナゾテンキのバラ窓',x,y0,26,GOLD,'left');otext('花びらの色＝その形態を説明した鍵',x,y0+26,14,MILK,'left');
  [['水の状態変化',BLUE],['大気の動き','#D39A20'],['海洋の影響',TEAL]].forEach(([t,c],k)=>{gcircle(x+12,y0+58+k*30,10,c,null,3);otext(t,x+30,y0+64+k*30,15,MILK,'left')});
  let y=y0+170;for(let i=1;i<8;i++){const d=S.done[i];otext((d?'● ':'○ ')+FORMS[i].nm+(d?'：'+(d.cats||[]).join('＋'):''),x,y,14,d?GOLD:'#8A86A0','left');y+=24}}
 else{otext('ナゾテンキのバラ窓',W_/2,TOPH+20,20,GOLD);otext('花びらの色＝説明に使った鍵（青 水の状態変化・金 大気の動き・緑 海洋の影響）',W_/2,TOPH+42,10.5,MILK)}}
function placeRose(){const b=$('#roseBtns');if(!b)return;if(WIDE){b.style.left=(W_*.36)+'px';b.style.bottom='22px';b.style.top='';b.style.width=Math.min(520,W_*.5)+'px'}else{b.style.left='50%';b.style.bottom='16px';b.style.top='';b.style.width=(W_-24)+'px'}}
cv.addEventListener('pointerup',e=>{if(MODE!=='rose'||!$('#ov').classList.contains('hidden'))return;for(let i=0;i<8;i++){const [x,y,r]=petalPos(i);if(Math.hypot(e.clientX-x,e.clientY-y)<r+8&&i<=S.cur){sfx.tap();i===0?startPractice():brief(i);return}}});

/* ===== 画面の切りかえ ===== */
function show(ids){['title','rose','test'].forEach(k=>$('#'+k).classList.toggle('hidden',!ids.includes(k)));$('#keys').classList.toggle('hidden',MODE!=='play');backBtn()}
function backBtn(){const b=$('#bBack');b.classList.toggle('hidden',!(MODE!=='title'||INHUB));$('#bBackT').textContent=MODE==='title'?'一覧へ':'もどる'}
$('#bBack').onclick=()=>{sfx.tap();if(MODE==='title'){try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}return}
 const wp=paused;paused=true;ovOpen('<div class="kick">もどる</div><h2>'+(MODE==='play'?'バラ窓へもどりますか？':'タイトルへもどりますか？')+'</h2><p>進み具合は保存されます。'+(MODE==='play'?'この形態は、はじめからやり直しになります。':'')+'</p><div class="btns"><button class="gl" id="cfY">もどる</button><button class="gl dark s" id="cfN">つづける</button></div>');
 $('#cfY').onclick=()=>{ovClose();paused=false;if(MODE==='play'){if(G&&G.practice)try{window.Guide&&Guide.tutorialEnd()}catch(e){}toRose()}else toTitle()};$('#cfN').onclick=()=>{ovClose();paused=wp}};
function ovOpen(h){$('#ovBox').innerHTML=h;$('#ov').classList.remove('hidden')}
function ovClose(){$('#ov').classList.add('hidden')}
function setSnd(){$('#bSnd').textContent=W_<520?(S.sound?'♪':'♪×'):(S.sound?'音 ON':'音 OFF');if(!S.sound)padLevel(false,0)}
$('#bSnd').onclick=()=>{S.sound=!S.sound;save();setSnd();ac();sfx.tap();if(MODE==='play')padLevel(true,G?G.combo:0)};
function toTitle(){MODE='title';G=null;show(['title']);$('#bCont').classList.toggle('hidden',!S.started);if(helpCtl)helpCtl.hide();zkButtons();padLevel(false,0)}
function toRose(fx){MODE='rose';G=null;show(['rose']);if(helpCtl)helpCtl.hide();padLevel(false,0);if(fx)ROSEFX=1;const b=$('#rGo');
 if(S.cleared){b.textContent='確認テストへ';b.onclick=()=>{sfx.tap();startTest()}}else if(S.cur===0){b.textContent='れんしゅうから';b.onclick=()=>{sfx.tap();startPractice()}}else{b.textContent=FORMS[Math.min(S.cur,7)].sub+'「'+FORMS[Math.min(S.cur,7)].nm+'」へ';b.onclick=()=>{sfx.tap();brief(Math.min(S.cur,7))}}zkButtons()}
function brief(i){const f=FORMS[i];if(MODE!=='rose')toRose();const bul=[...new Set(f.bul)].map(k=>'<span class="cat '+(KEYS[BUL[k].k].cc)+'">'+BUL[k].nm+'</span>').join(' ');
 ovOpen('<div class="kick">'+esc(f.sub)+'</div><h2>'+esc(f.nm)+'</h2><p>撃ってくる弾幕：<br>'+bul+'</p><p class="small">'+(f.merge?'山場：2本の説明（すじA・すじB）を両方つないでから、合流の札で結果へ。':f.final?'5つの現象を、'+f.time+'秒のうちに続けて説明する（1本つなぐごとに＋20秒）。':'説明を'+f.chains.length+'本つなぐと、この形態の窓が割れる。')+'<br>弾幕は原因に合う鍵の光で解ける。わなの札に注意。</p><div class="btns"><button class="gl pulse" id="bfGo">挑む</button><button class="gl dark s" id="bfNo">バラ窓</button></div>');
 $('#bfGo').onclick=()=>{ovClose();ac();startForm(i)};$('#bfNo').onclick=()=>ovClose()}

/* ===== れんしゅう（Guide） ===== */
let PRACTICE=null;
function orbXY(idx){if(!G)return {x:W_/2,y:H_/2,r:40};const o=G.orbs.find(o=>!o.trap&&o.idx===idx&&!o.done);if(!o)return {x:W_/2,y:H_/2,r:40};const [x,y]=toXY(o.a,o.b);return {x,y,r:o.r+8}}
function underOrb(idx){const o=G&&G.orbs.find(o=>!o.trap&&o.idx===idx&&!o.done);if(!o)return true;const [x,y]=toXY(o.a,o.b);return WIDE?Math.abs(G.ship.y-y)<o.r*.8:Math.abs(G.ship.x-x)<o.r*.8}
function mkPractice(){return {
 start:()=>{startForm(0,true)},label:'れんしゅう中',
 steps:[
  {gesture:'drag',target:()=>G?{x:G.ship.x,y:G.ship.y,r:36}:{x:W_/2,y:H_*.8,r:36},to:()=>{if(!G)return {x:W_/2,y:H_*.8};const p=orbXY(0);return WIDE?{x:G.ship.x,y:p.y}:{x:p.x,y:G.ship.y}},until:()=>G&&G.moved>80,text:'画面を **ドラッグ** して、光の小鳥を動かす'},
  {gesture:'tap',target:'.key[data-k=cool]',until:()=>G&&KEY==='cool'&&G.erased>=3,text:'霧の原因は「冷える」。**冷やす** の鍵をタップ → 霧の弾が光で **解ける**'},
  {gesture:'drag',target:()=>G?{x:G.ship.x,y:G.ship.y,r:36}:{x:W_/2,y:H_/2},to:()=>{if(!G)return {x:W_/2,y:H_/2};const p=orbXY(0);return WIDE?{x:G.ship.x,y:p.y}:{x:p.x,y:G.ship.y}},until:()=>underOrb(0),text:'「**原因**」の札（晴れた夜、地面が…）の **正面へ** 動く'},
  {gesture:'tap',target:'.key[data-k=cool]',until:()=>G&&G.prog&&G.prog.n>=1,text:'鍵をタップすると **鍵の弾** が飛ぶ。原因の札を撃ち抜こう'},
  {gesture:'tap',target:'.key[data-k=cool]',until:()=>G&&G.prog&&G.prog.n>=3,text:'つづけて **途中の変化 → 結果** の順に撃つと、説明がつながって窓が割れる'}
 ],
 onClear:()=>{earn(10,'first-try','practice')},
 onExit:res=>{if(res&&res.cleared)setTimeout(()=>{toRose(true);setTimeout(()=>brief(1),600)},1200);else toRose()}}}
function startPractice(){ac();if(!window.Guide){startForm(0,true);return}PRACTICE=PRACTICE||mkPractice();Guide.tutorial(PRACTICE)}

/* ===== 確認テスト ===== */
let TS=null;function playerName(){return window.PLAYER_NAME||S.name||''}
function startTest(){if(!window.Quiz)return;MODE='test';G=null;show(['test']);if(helpCtl)helpCtl.hide();padLevel(false,0);TS={qs:Quiz.test(),i:0,ans:[]};renderQ()}
function renderQ(){const q=TS.qs[TS.i],box=$('#tbox');
 box.innerHTML='<div class="tno">確認テスト　第'+(TS.i+1)+'問 / '+TS.qs.length+'</div><div class="prog">'+TS.qs.map((_,i)=>'<i class="'+(i<TS.i?'on':'')+'"></i>').join('')+'</div><div class="tq">'+q.q+'</div>'+(q.fig?'<div class="fig2">'+q.fig+'</div>':'')+'<div id="ta"></div>';
 const ta=$('#ta');
 if(q.t==='choice'){const d=document.createElement('div');d.className='ch';q.shown.forEach(c=>{const b=document.createElement('button');b.innerHTML=c;b.onclick=()=>ans(c);d.appendChild(b)});ta.appendChild(d)}
 else if(q.t==='num'){ta.innerHTML='<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="数を入力"><b>'+esc(q.unit||'')+'</b><button class="gl s" id="numOk">決定</button></div>';$('#numOk').onclick=()=>{const v=$('#numIn').value.trim();if(v==='')return;ans(v)}}
 else{const picked=[];ta.innerHTML='<div class="small">原因から結果へ、正しい順にタップしよう</div><div class="ord" id="ordBox"></div><div class="ch" id="ordPool"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="gl dark s" id="ordRe" style="flex:1">やり直す</button><button class="gl s" id="ordOk" style="flex:1" disabled>決定</button></div>';
  const drawO=()=>{$('#ordBox').innerHTML=picked.map((t,i)=>'<div>'+(i+1)+'. '+t+'</div>').join('');const pool=$('#ordPool');pool.innerHTML='';q.shown.forEach(t=>{if(picked.includes(t))return;const b=document.createElement('button');b.innerHTML=t;b.onclick=()=>{picked.push(t);sfx.tap();drawO()};pool.appendChild(b)});$('#ordOk').disabled=picked.length!==q.shown.length};
  drawO();$('#ordRe').onclick=()=>{picked.length=0;drawO()};$('#ordOk').onclick=()=>ans(picked.slice())}
 $('#test').scrollTop=0}
function ans(v){TS.ans.push(v);sfx.tap();TS.i++;if(TS.i<TS.qs.length)renderQ();else finishTest()}
function finishTest(){const qs=TS.qs,review=Quiz.review(qs,TS.ans),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;sfx.fanfare();
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(S.t)],['つないだ説明',S.chains+'本'],['最大の連鎖',String(S.best)],['撃破した形態',Object.keys(S.done).filter(k=>+k>0).length+' / 7']];
 TS.card=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:UNIT,game:GTITLE+(TEST_ONLY?'（確認テストのみ）':''),name:playerName(),score,total:qs.length,marks,records:recs,review},showTestResult);showTestResult()}
function showTestResult(){const r=TS.card||{};$('#tbox').innerHTML='<div class="tno">テストの結果</div><div style="font-size:clamp(60px,11vw,110px);line-height:1.1;color:#F2C14E;text-shadow:0 3px 0 #05070C">'+(r.score||0)+'<span style="font-size:.35em;color:#EDE4C8"> / '+(r.total||0)+'</span></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;max-width:420px"><button class="gl" id="rCard">提出カードをもう一度見る</button><button class="gl dark s" id="rAgain">もう一度テスト</button>'+(TEST_ONLY?'':'<button class="gl dark s" id="rTitle">タイトルへ</button>')+'<button class="gl dark s zk" id="rBk">図鑑</button></div>';
 $('#rCard').onclick=()=>SubmitCard.reopen(TS.card,()=>{});$('#rAgain').onclick=()=>startTest();if($('#rTitle'))$('#rTitle').onclick=()=>toTitle();$('#rBk').onclick=openBook;zkButtons()}

/* ===== 図鑑 ===== */
function zkButtons(){const has=!!(window.Zukan&&Zukan.openBook);document.querySelectorAll('.zk').forEach(b=>b.classList.toggle('hidden',!has))}
function openBook(){try{window.Zukan&&Zukan.openBook&&Zukan.openBook({unit:'kisho'})}catch(e){}}
function openGacha(){try{window.Zukan&&Zukan.openGacha&&Zukan.openGacha({box:'kisho'})}catch(e){}}
$('#bBook1').onclick=openBook;$('#rBook').onclick=openBook;$('#rGacha').onclick=openGacha;

/* ===== Guide ===== */
let helpCtl=null;
const LEARN='霧・雲・前線の雨・季節の天気・台風は、**水の状態変化・大気の動き・海洋の影響** を組み合わせて説明できる';
const HOW='**ドラッグ** で動く。**鍵** をタップして、原因に合う光で弾幕を解き、説明の札を **原因→途中の変化→結果** の順に撃つ';
function setupGuide(){if(!window.Guide)return;
 Guide.setup({theme:{bg:'#161B30',fg:'#EDE4C8',accent:'#F2C14E',accentText:'#1a1204',font:'"Shippori Antique B1",serif',bodyFont:'"Shippori Antique B1",serif',radius:8,texture:'grain',line:'#F2C14E',dim:'rgba(5,7,14,.55)',shadow:'0 0 0 4px #05070C, 0 0 30px rgba(242,193,78,.4)',outline:'#05070C',hand:'#EDE4C8',handLine:'#05070C'},
  sfx:k=>{if(k==='step'||k==='done')sfx.tap();else if(k==='clear')sfx.fanfare();else if(k==='cheer')sfx.orb()},muted:()=>!S.sound,learn:LEARN,how:HOW,title:'第35回 異常天気のラスボス'});
 helpCtl=Guide.help({title:'異常天気のラスボス',learn:LEARN,how:HOW,
  rules:['**ドラッグ** で光の小鳥を動かす（光の粒は自動で出る）','**鍵** は原因の名前：冷やす＝水の状態変化／持ち上げる＝大気の動き／海の水蒸気＝海洋の影響／高気圧で押す＝大気の動き','弾幕は **原因に合う鍵の光** でだけ解ける：霧→冷やす、夕立の雨粒→持ち上げる、雪・しめった空気→海の水蒸気、季節風・台風のうず→高気圧で押す','鍵をタップすると **鍵の弾** が1発飛ぶ。説明の札は鍵の弾で撃つ','札は **原因→途中の変化→結果** の順に、その札の説明に合う鍵で。ちがうと連鎖がリセット','**わなの札**（よくある思いちがい）を撃つとひびが入る','大雪の形態は、すじA・すじB を両方つないでから合流の札'],
  onOpen:()=>{paused=true},onClose:()=>{paused=false},replay:'tutorial',attention:true});
 helpCtl.hide();
 Guide.tutorialButton('#bHow',()=>{ac();S.started=true;save();startPractice()})}
$('#bStart').onclick=async()=>{ac();sfx.tap();const nm=$('#nameIn').value.trim()||S.name,snd=S.sound;S=fresh();S.name=nm;S.sound=snd;S.started=true;save();
 if(window.Guide)await Guide.intro({title:'第35回 異常天気のラスボス',learn:LEARN,how:HOW,gesture:'drag'});startPractice()};
$('#bCont').onclick=()=>{ac();sfx.tap();const v=$('#nameIn').value.trim();if(v)S.name=v;save();toRose()};

/* ===== ループ ===== */
let last=performance.now();
function loop(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;update(dt);frame();requestAnimationFrame(loop)}
addEventListener('resize',resize);
resize();setupGuide();
try{window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]})}catch(e){}
if(window.PLAYER_NAME){$('#nameIn').value=window.PLAYER_NAME;$('#nameRow').classList.add('hidden')}else if(S.name)$('#nameIn').value=S.name;
window.__game={S:()=>S,G:()=>G,mode:()=>MODE,startForm,startPractice,brief,toRose,startTest,pressKey,toXY,fwd,orbR,
 target:()=>{if(!G)return null;const c=G.chains[G.ci];let want=null;if(c.M){if(G.prog.A<2)want=G.orbs.find(o=>o.lane==='A'&&o.idx===G.prog.A);else if(G.prog.B<2)want=G.orbs.find(o=>o.lane==='B'&&o.idx===G.prog.B);else want=G.orbs.find(o=>o.lane==='M')}else want=G.orbs.find(o=>!o.trap&&o.idx===G.prog.n&&!o.done);if(!want)return null;const [x,y]=toXY(want.a,want.b);return {x,y,k:want.k,r:want.r}},
 ship:()=>G&&{x:G.ship.x,y:G.ship.y},step:(dt)=>update(dt),setInv:()=>{if(G)G.inv=999}};
if(TEST_ONLY)startTest();else toTitle();
requestAnimationFrame(loop);
</script>
