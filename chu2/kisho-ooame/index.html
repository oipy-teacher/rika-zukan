<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<title>大雨の夜の判断 ～記録と情報で備える～</title>
<!--
  大雨の夜の判断 ～記録と情報で備える～（中2理科 気象 コマ34 / kisho-ooame / chu2-kisho-34 / 役割なし）

  ■ 世界とメタファー: 市役所が配る「公共の防災マップ」。スイス・タイポグラフィ（グリッドと巨大な文字）で組んだ
    白い紙の地形図の上に、指で避難の道を引く。画面ぜんぶが1枚の公共地図とその凡例・記録欄。
  ■ 遊びの核: 等高線ルート引き。初めて見る町の地形図で低い土地（しま模様＝浸水想定区域）・川ぞいを読み、
    雨の記録（1時間雨量の棒グラフ）と公的な情報（警戒レベル・通行止め・冠水）の段階に合わせて、
    地区■から避難所■まで高い所を通る道を1本ずつ引く。道が等高線をまたぐたびに高さの数字が跳ね、
    安全な避難所に届くと道全体が金色に縁取られて人が歩き出す。出所の分からないうわさの道は通れない（流される演出は使わない）。
  ■ 道のり: 町を1つずつ調べる（れんしゅう＋8つの町＝夕方→深夜）→ 最後に「出所しらべ」（使った情報の出所を仕分ける）。
    集める＝公的な情報カードの図鑑（警報・避難情報・観測の記録）。ゴール＝「全地区を避難させるまで終われません」。
  ■ 配色: 白 #FFFFFF／主 紺 #003A70／差し 山吹 #F2A900（黒に近い墨 #0B1B2B は文字だけ）。
  ■ 書体: Zen Kaku Gothic New（900の巨大な数字と見出し。左そろえ・グリッド）。
  ■ 画面の組み方: PC・iPad横＝左に横長の地形図、右に記録欄（時刻・警戒レベル・雨量グラフ・届いた情報）。
    iPad縦・スマホ縦＝上に記録の帯、まん中に縦の地形図、下に届いた情報。地形図は2本指で動かす・広げる、1本指で道を引く。
  ■ HUD: 左上「← もどる」（いつも同じ場所）。右上＝音・？。記録欄はそれ自体がHUD（Zukan.hud は使わない）。
  ■ 音: 公共放送のチャイム（正弦波）、等高線をまたぐたびの目盛りの音（高いほど高い音）、雨の音（ノイズ）。
  ■ 理科＝操作: 低い土地・川ぞい・アンダーパスは水が集まる／警戒レベル3で時間のかかる人、4までに全員／
    通行止め・冠水は市の情報・橋はうわさで決めない／がけのそばは土砂災害警戒区域。
    ★3の道＝しま模様を通る長さが、その時点でいちばん少ない道とほぼ同じ（「あと○m」は本当の差）。
  ■ 数値: 1時間雨量の区分（気象庁）と、2026年5月からの警戒レベルつきの名前（レベル3大雨警報・レベル4大雨危険警報 など）。_素材.md
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#003A70;--amb:#F2A900;--ink:#0B1B2B;--line:#D5DDE6;--f:'Zen Kaku Gothic New','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:var(--f);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
/* ボタン：四角・ベタ・左そろえ・右に矢印 */
.btn{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:54px;padding:0 18px 0 20px;background:var(--navy);color:#fff;font-weight:900;font-size:19px;letter-spacing:.04em;text-align:left;border-radius:0;transition:transform .08s}
.btn::after{content:"→";font-size:22px;font-weight:700}
.btn.amb{background:var(--amb);color:var(--ink)}
.btn.line{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 3px var(--navy)}
.btn.s{min-height:46px;font-size:16px}
.btn.noarr::after{content:""}
.btn:active{transform:translate(2px,2px)}
.btn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,169,0,.0)}50%{box-shadow:0 0 0 8px rgba(242,169,0,.35)}}
/* もどる（いつも左上） */
#bBack{position:fixed;z-index:40;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));height:46px;display:flex;align-items:center;gap:0;background:var(--navy);color:#fff;font-weight:900;font-size:17px;letter-spacing:.06em}
#bBack b{display:flex;align-items:center;justify-content:center;width:46px;height:46px;background:var(--amb);color:var(--ink);font-size:24px}
#bBack span{padding:0 14px 0 12px}
#hudR{position:fixed;z-index:40;right:max(72px,calc(env(safe-area-inset-right) + 72px));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px}
.sq{height:46px;min-width:46px;padding:0 10px;background:#fff;color:var(--navy);box-shadow:inset 0 0 0 3px var(--navy);font-weight:900;font-size:15px}
#bFit{background:var(--navy);color:#fff}
/* 届いた情報（カード） */
#rail{position:fixed;z-index:20;display:flex;gap:8px;pointer-events:none}
#rail.col{flex-direction:column}
.card{pointer-events:auto;position:relative;perspective:600px;flex:1 1 0;min-width:0;min-height:74px;cursor:pointer}
.card .in{position:relative;width:100%;height:100%;min-height:74px;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .fa,.card .ba{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:7px 9px 6px;background:#fff;box-shadow:inset 0 0 0 2px var(--navy);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.card .fa{border-top:7px solid var(--navy)}
.card.rum .fa{border-top:7px dashed var(--amb)}
.card .ba{transform:rotateY(180deg);background:var(--navy);color:#fff;box-shadow:none}
.card.rum .ba{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px var(--amb)}
.card .tx{font-weight:900;font-size:14px;line-height:1.25}
.card .lv{font-weight:900;font-size:11px;letter-spacing:.06em;color:var(--navy)}
.card .q{font-size:11px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:4px}
.card .q i{font-style:normal;display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;background:var(--amb);color:var(--ink);font-size:11px}
.card .src{font-size:22px;font-weight:900;line-height:1}
.card .sd{font-size:11px;line-height:1.3}
.card.new{animation:cin .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes cin{from{transform:translateY(-30px) scale(.8);opacity:0}}
.card .stamp{position:absolute;right:6px;bottom:6px;border:3px solid var(--amb);color:var(--amb);font-weight:900;font-size:13px;padding:1px 5px;transform:rotate(-8deg)}
/* 重ねる札 */
.scr{position:fixed;inset:0;z-index:25}
#title{display:grid;pointer-events:none}
#title .tt{position:absolute;pointer-events:none}
#tMeta{font-weight:900;font-size:13px;letter-spacing:.14em;color:var(--navy)}
#tMain{font-weight:900;color:var(--navy);line-height:.94;letter-spacing:-.02em}
#tMain span{display:block}
#tMain .y{color:var(--ink)}
#tSub{font-weight:700;color:var(--ink);letter-spacing:.06em}
#tBtns{position:absolute;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#tBtns .row{display:flex;gap:8px}
#tBtns .row .btn{flex:1 1 0}
#nameRow{display:flex;align-items:stretch;gap:0;box-shadow:inset 0 0 0 3px var(--navy);background:#fff}
#nameRow label{display:flex;align-items:center;padding:0 12px;background:var(--navy);color:#fff;font-weight:900;font-size:14px}
#nameIn{flex:1;min-width:0;border:0;font:inherit;font-size:17px;font-weight:700;padding:0 12px;height:46px;background:#fff;color:var(--ink);outline:none;border-radius:0}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.78);padding:14px}
.box{position:relative;background:#fff;box-shadow:inset 0 0 0 3px var(--navy),10px 10px 0 var(--amb);width:min(620px,100%);max-height:calc(100% - 10px);overflow:auto;padding:20px 20px 18px}
.box h2{margin:0 0 6px;font-weight:900;font-size:26px;color:var(--navy);line-height:1.15}
.box .big{font-weight:900;font-size:64px;line-height:.9;color:var(--navy);letter-spacing:-.03em}
.box .kick{font-weight:900;font-size:12px;letter-spacing:.16em;color:var(--navy);border-top:3px solid var(--navy);padding-top:6px;margin-top:10px}
.box p{margin:6px 0;line-height:1.6;font-size:15px}
.box .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.box .row2{display:flex;gap:8px}.box .row2>*{flex:1 1 0}
.stars{display:flex;gap:10px;margin:8px 0}
.stars b{display:flex;align-items:center;justify-content:center;width:62px;height:62px;font-size:40px;color:#fff;background:var(--line)}
.stars b.on{background:var(--amb);color:var(--ink);animation:don .45s cubic-bezier(.2,1.8,.4,1) both}
@keyframes don{0%{transform:scale(2.6) rotate(-14deg);opacity:0}100%{transform:none;opacity:1}}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:8px;border-top:3px solid var(--navy)}
.recs div{padding:8px 4px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--navy)}
.recs b{display:block;font-size:24px;font-weight:900;color:var(--ink)}
/* 目次（町の一覧） */
#index{overflow:auto;background:#fff;padding:70px max(18px,4vw) 30px}
#index .hd{display:flex;align-items:flex-end;gap:18px;border-bottom:6px solid var(--navy);padding-bottom:8px;margin-bottom:0}
#index .hd .n{font-weight:900;font-size:clamp(56px,11vw,120px);line-height:.8;color:var(--amb);letter-spacing:-.04em}
#index .hd h1{margin:0;font-weight:900;font-size:clamp(22px,4vw,40px);color:var(--navy);line-height:1.05}
#index .hd .pr{margin-left:auto;text-align:right;font-weight:900;color:var(--navy);font-size:13px}
#index .hd .pr b{display:block;font-size:34px;color:var(--ink)}
#towns{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 18px}
.town{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--line);text-align:left;min-height:clamp(74px,11vh,120px)}
.town .no{font-weight:900;font-size:clamp(44px,6vh,68px);line-height:1;color:var(--navy);width:62px;letter-spacing:-.04em}
.town .nm{font-weight:900;font-size:18px;line-height:1.2}
.town .nm small{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-top:2px}
.town .st{font-size:18px;color:var(--amb);font-weight:900;letter-spacing:-2px}
.town.cur{background:var(--navy);color:#fff}.town.cur .no,.town.cur .nm small{color:var(--amb)}
.town.lock{opacity:.35}
#index .foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
@media (max-width:560px){#index .hd{flex-wrap:wrap}#index .hd .pr{margin-left:0;text-align:left;width:100%;display:flex;align-items:baseline;gap:10px}#index .hd .pr b{font-size:26px}}
#index .foot .btn{flex:1 1 220px}
/* 出所しらべ */
#sort{background:#fff;display:flex;flex-direction:column;padding:66px max(12px,3vw) 12px}
#sort h2{margin:0;font-weight:900;font-size:clamp(20px,3.4vw,34px);color:var(--navy)}
#sort p{margin:4px 0 8px;font-size:14px;font-weight:700}
#sPile{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:8px 0;border-top:3px solid var(--navy);border-bottom:3px solid var(--navy)}
.chip{touch-action:none;background:#fff;box-shadow:inset 0 0 0 2px var(--navy);padding:8px 10px;font-weight:900;font-size:14px;cursor:grab;max-width:260px;line-height:1.3}
.chip.drag{position:fixed;z-index:60;box-shadow:inset 0 0 0 3px var(--navy),6px 6px 0 var(--amb);transform:rotate(-3deg) scale(1.05);pointer-events:none}
.chip.bad{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#sCols{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:6px;padding:8px;background:#F4F6F9;min-height:0;overflow:auto}
.col h3{margin:0 0 4px;font-weight:900;font-size:15px;color:#fff;background:var(--navy);padding:6px 8px;line-height:1.2}
.col.rumc h3{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px var(--amb)}
.col.hot{outline:4px solid var(--amb)}
.col .chip{cursor:default;font-size:12px;padding:6px 8px;background:#fff}
@media (max-width:640px){#sCols{grid-template-columns:1fr 1fr}}
/* 確認テスト */
#test{overflow:auto;background:#fff;padding:66px max(14px,4vw) 30px}
#tbox{max-width:760px;margin:0 auto}
.tno{font-weight:900;font-size:13px;letter-spacing:.14em;color:var(--navy);border-top:6px solid var(--navy);padding-top:8px}
.prog{display:flex;gap:4px;margin:8px 0 12px}.prog i{flex:1;height:8px;background:var(--line)}.prog i.on{background:var(--amb)}
.tq{font-weight:900;font-size:clamp(18px,2.6vw,24px);line-height:1.5}
.fig2{margin:10px 0;max-width:460px}.fig2 svg{width:100%;height:auto;display:block}
.ch{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ch button{min-height:52px;text-align:left;padding:10px 14px;font-weight:700;font-size:17px;background:#fff;box-shadow:inset 0 0 0 2px var(--navy);line-height:1.35}
.ch button:active{background:var(--amb)}
.numrow{display:flex;gap:8px;align-items:center;margin-top:12px}
.numrow input{flex:1;min-width:0;height:54px;font:inherit;font-size:22px;font-weight:900;padding:0 12px;border:0;box-shadow:inset 0 0 0 3px var(--navy);border-radius:0}
.numrow b{font-size:20px}
.ord{display:flex;flex-direction:column;gap:4px;margin:8px 0}.ord div{padding:8px 10px;background:var(--navy);color:#fff;font-weight:900}
.small{font-size:13px;font-weight:700;color:var(--navy)}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}.card.new,.stars b.on,.btn.pulse{animation:none}}
</style>
</head>

<script>/*@GAME_FX*/

      B:{chords:'5 5 2 2 3 3 4 4', bass:'quarter', arp:'up', drums:1,
        mel:"5 - - - 7 - - - | 2' - - - 1' - 7 - | 6 - - - 4 - - - | 2 - - - - - . . | 3 - - - 5 - - - | 1' - - - 7 - 5 - | 4 - - - 6 - - - | 7 - - - 6 - - -"},

        mel2:"3 - - - - - - - | 2 - - - - - - - | 3 - - - - - - - | 4 - - - - - - - | 3 - - - - - - - | 2 - - - - - - - | 2 - - - - - - - | 2 - - - - - - -"}

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

isho-ooame-q002", "koma": "chu2-kisho-34"}, {"t": "choice", "q": "大雨の夜、避難するかどうかを決めるのに使う情報として、いちばん信頼できるものは？", "choices": ["気象庁の警報や、市町村が出す避難の情報", "SNSで回ってきた、だれが書いたか分からない投稿", "「友だちの友だちが見た」という話", "いつもの夕方と同じ空のようす"], "ex": "情報は出所で選ぶ。出所が分からないうわさは、公的な情報で確かめる。", "kind": "method", "level": 1, "id": "chu2-kisho-ooame-q003", "koma": "chu2-kisho-34", "fig": null}, {"t": "order", "q": "警戒レベルの情報を、レベルの低い順（1→5）に並べよう。", "items": ["早期注意情報", "大雨注意報", "高齢者等避難", "避難指示", "緊急安全確保"], "ex": "1早期注意情報→2大雨注意報→3高齢者等避難→4避難指示→5緊急安全確保。", "kind": "term", "level": 2, "id": "chu2-kisho-ooame-q004", "koma": "chu2-kisho-34", "fig": null}, {"t": "choice", "q": "市町村から「警戒レベル4 避難指示」が出た。浸水想定区域の中に住む人がとる行動は？", "choices": ["危険な場所から全員が避難する", "レベル5が出るまで家で待つ", "高齢の人だけが避難する", "雨がやむまで外のようすを見に行く"], "ex": "「警戒レベル4までに全員避難」。レベル5は必ず出るとは限らないので待たない。", "kind": "judge", "level": 1, "id": "chu2-kisho-ooame-q005", "koma": "chu2-kisho-34", "fig": null}, {"t": "choice", "q": "「警戒レベル3 高齢者等避難」が出た。このとき避難を始めるのは？", "choices": ["高齢の人や、避難に時間がかかる人とその支援をする人", "住民全員", "だれも動かなくてよい", "川のようすを見に行く人"], "ex": "時間のかかる人ほど早めに動く。ほかの人も避難の準備をする。", "kind": "judge", "level": 2, "id": "chu2-kisho-ooame-q006", "koma": "chu2-kisho-34", "fig": null}, {"t": "num", "q": "ある町の雨量の記録は、1時間ごとに 30mm、45mm、55mm だった。この3時間で合わせて何mmの雨が降った？", "ans": 130, "unit": "mm", "tol": 0, "ex": "30＋45＋55＝130mm。降り始めからの雨量が多いほど、川や低い土地に水が集まる。", "kind": "calc", "level": 1, "id": "chu2-kisho-ooame-q007", "koma": "chu2-kisho-34", "fig": null}, {"t": "choice", "q": "1時間に60mmの雨は、気象庁の予報用語で何という？", "choices": ["非常に激しい雨", "やや強い雨", "強い雨", "小雨"], "ex": "30〜50mm未満が激しい雨、50〜80mm未満が非常に激しい雨、80mm以上が猛烈な雨。", "kind": "term", "level": 2, "id": "chu2-kisho-ooame-q008", "koma": "chu2-kisho-34", "fig": null}, {"t": "choice", "q": "大雨の夜、低い土地にある家から、丘の上の避難所へ向かう。えらぶ道は？", "choices": ["等高線の数字が大きい、高い所を通る道", "川ぞいの低い道（近いから）", "線路の下をくぐるアンダーパス", "浸水想定区域の中を通るいちばん短い道"], "ex": "水は低い所に集まる。高い所を通る道なら、途中で水につかりにくい。", "kind": "judge", "level": 2, "id": "chu2-kisho-ooame-q009", "koma": "chu2-kisho-34", "fig": null}, {"t": "choice", "q": "大雨のとき、アンダーパス（線路などの下をくぐる道）が危ないのはなぜ？", "choices": ["まわりより低く、雨水が集まって水につかりやすいから", "トンネルの中は気圧が低いから", "線路が水を吸いこむから", "上を走る電車が雨を集めるから"], "ex": "まわりより低い所には水が流れこむ。短い時間の強い雨でも冠水することがある。", "kind": "judge", "level": 2, "id": "chu2-kisho-ooame-q010", "koma": "chu2-kisho-34", "fig": null}, {"t": "choice", "q": "ハザードマップで、公民館は浸水想定区域の中、中学校は区域の外の高台にある。川があふれそうなときに向かうのは？", "choices": ["区域の外の高台にある中学校", "近いので区域の中の公民館", "どちらでも同じ", "家の1階"], "ex": "浸水想定区域の中の建物は、洪水のときに水につかるおそれがある。", "kind": "judge", "level": 1, "id": "chu2-kisho-ooame-q011", "koma": "chu2-kisho-34", "fig": null}, {"t": "choice", "q": "「〇〇川があふれたらしい、〇〇橋はもう渡れる」という投稿が回ってきた。まずすることは？", "choices": ["市町村の通行止めの情報や、川の水位の記録で確かめる", "すぐにほかの人へ転送する", "投稿を信じて〇〇橋を渡る", "何もしないで寝る"], "ex": "うわさは出所が分からない。公的な情報や観測の記録で確かめてから動く。", "kind": "method", "level": 2, "id": "chu2-kisho-ooame-q012", "koma": "chu2-kisho-34", "fig": null}, {"t": "choice", "q": "大雨のとき、がけのそば（土砂災害警戒区域）にある集会所へ避難しようとしている。よい判断は？", "choices": ["がけから離れた、安全な避難所へ向かう", "高い所にあるので、がけの下でもよい", "雨がやんだら行けばよい", "がけの上から川を見に行く"], "ex": "大雨のときは、がけくずれ・土石流のおそれがある。高さだけでなく、がけからの近さも見る。", "kind": "judge", "level": 2, "id": "chu2-kisho-ooame-q013", "koma": "chu2-kisho-34", "fig": null}, {"t": "choice", "q": "上流で大雨が降ったあと、自分の町では雨が弱まった。このとき川について言えることは？", "choices": ["上流の雨が流れてくるので、雨が弱まってもしばらく水位が上がることがある", "雨が弱まったので、すぐに水位は下がる", "川の水位は、自分の町の雨だけで決まる", "雨が弱まると、川の水は逆に流れる"], "ex": "川には上流で降った雨も集まる。自分の町の空だけで判断せず、水位の記録を見る。", "kind": "judge", "level": 3, "id": "chu2-kisho-ooame-q014", "koma": "chu2-kisho-34", "fig": null}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- カラオケ読み ---------------- */
  function karaoke(el, cps){
    var chars = [];

  /* 解説の文が入っている、いちばん小さい見えている要素を探す */

function polyM(pts){return pts.map(p=>[p[0]*WU,p[1]*WV])}
function distPolyM(P,x,y){let best=1e9,bt=0,acc=0,tot=0;const L=[];for(let i=0;i<P.length-1;i++){const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);L.push(l);tot+=l}

 return [best,bt]}

 for(const r of st.rv){const [dd,t]=distPolyM(r.m,x,y);const rh=lerp(r.h[0],r.h[1],t);h=Math.min(h,rh+Math.max(0,dd-12)*.032)}

 for(const r of st.rv){if(distPolyM(r.m,x,y)[0]<RIVW+pad){o.river=true;for(const b of d.bridges||[])if(Math.hypot(b.u*WU-x,b.v*WV-y)<BRW)o.bridge=b}}

  [1,2,3].forEach(k=>{if(k<=stars)setTimeout(()=>{const e=$('#st'+k);if(e){e.classList.add('on');sfx.thump();vib(20)}},350*k)});

function failStage(q){const st=ST;st.failed=true;sfx.fail();shake(10);vib([60,40,60]);const left=st.d.districts.filter(x=>!st.evac[x.id]).length;

  '<div class="btns"><button class="btn amb" id="flA">もう一度</button><button class="btn line s noarr" id="flI">一覧へ</button></div>');$('#flA').onclick=()=>{ovClose();startStage(st.i)};$('#flI').onclick=()=>{ovClose();toIndex()}},700)}

 ],

/* ===== 出所しらべ ===== */
const SORTSET=[['大雨警報（警戒レベル3）','jma'],['大雨危険警報（警戒レベル4）','jma'],['高齢者等避難','city'],['避難指示','city'],['中央橋 通行止め','city'],['1時間雨量 56mm','obs'],['川の水位が上がり続けている','obs'],['「中央橋、まだ渡れるってよ」','rumor'],['「雨はもう峠をこえた」','rumor']];
const COLS=[['jma','気象庁（警報など）'],['city','市（避難情報・通行止め）'],['obs','観測の記録（雨量・水位）'],['rumor','出所不明（うわさ）']];
let SORTN=0,SORTMISS=0;
function startSort(){MODE='sort';ST=null;show(['sort']);if(helpCtl)helpCtl.hide();SORTN=0;SORTMISS=0;const pile=$('#sPile'),cols=$('#sCols');pile.innerHTML='';cols.innerHTML='';
 COLS.forEach(([k,t])=>{const c=document.createElement('div');c.className='col'+(k==='rumor'?' rumc':'');c.dataset.k=k;c.innerHTML='<h3>'+esc(t)+'</h3>';cols.appendChild(c)});
 SORTSET.slice().sort(()=>Math.random()-.5).forEach(([t,k])=>{const d=document.createElement('div');d.className='chip';d.textContent=t;d.dataset.k=k;pile.appendChild(d);dragChip(d)})}
function dragChip(d){d.addEventListener('pointerdown',e=>{if(d.dataset.done)return;window.Tekitou&&Tekitou.shown();e.preventDefault();ac();sfx.tap();const r=d.getBoundingClientRect();const ox=e.clientX-r.left,oy=e.clientY-r.top;const ghost=d.cloneNode(true);ghost.classList.add('drag');ghost.style.width=r.width+'px';ghost.style.left=r.left+'px';ghost.style.top=r.top+'px';document.body.appendChild(ghost);d.style.opacity=.3;
 let hot=null;const mv=ev=>{ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';const el=document.elementFromPoint(ev.clientX,ev.clientY);const col=el&&el.closest?el.closest('.col'):null;if(hot&&hot!==col)hot.classList.remove('hot');hot=col;if(col)col.classList.add('hot')};
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);ghost.remove();d.style.opacity=1;if(hot)hot.classList.remove('hot');
  if(!hot)return;window.Tekitou&&Tekitou.answer(hot.dataset.k===d.dataset.k);if(hot.dataset.k===d.dataset.k){d.dataset.done=1;hot.appendChild(d);SORTN++;const rr=d.getBoundingClientRect();pop(rr.left+rr.width/2,rr.top,'○',{c:'#fff',bg:NAVY,s:22});sfx.ok(SORTN);burst(rr.left+rr.width/2,rr.top+10,14,[NAVY,AMB]);
   if(SORTN===SORTSET.length)setTimeout(sortDone,500)}else{SORTMISS++;d.classList.remove('bad');void d.offsetWidth;d.classList.add('bad');sfx.ng();vib(30);const rr=hot.getBoundingClientRect();pop(rr.left+rr.width/2,rr.top+40,d.dataset.k==='rumor'?'だれが書いたか分からない':'出所をもう一度',{c:INK,bg:AMB,s:14,life:1.4})}};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)})}
function sortDone(){S.sorted=true;S.cleared=true;save();if(!SORTMISS)earn(30,'rule','sortrule');sfx.fanfare();confetti(120);
 const body='<div class="kick">今夜の仕事はおわり</div><h2>全地区の避難と、情報の出所しらべが完了</h2><div class="recs"><div>かかった時間<b>'+fmtT(S.t)+'</b></div><div>★3の道<b>'+S.perfect+'本</b></div><div>最大コンボ<b>×'+S.best+'</b></div><div>情報カード<b>'+Object.keys(S.cards).length+'/'+CARDKINDS.length+'</b></div></div><p>浸水しやすいのは <b>低い土地・川ぞい</b>。<b>雨の記録</b>と<b>公的な情報</b>を重ねれば、水が来る前に動ける。</p><div class="btns"><button class="btn amb" id="sdT">確認テストへ</button><div class="row2"><button class="btn line s zk" id="sdG">ガチャ</button><button class="btn line s zk" id="sdB">図鑑</button></div></div>';
 const open=()=>{ovOpen(body);$('#sdT').onclick=()=>{ovClose();startTest()};$('#sdG').onclick=openGacha;$('#sdB').onclick=openBook;zkButtons()};
 if(!S.mc&&window.Zukan&&Zukan.mainClear){S.mc=true;save();try{Zukan.mainClear({onClose:open})}catch(e){open()}}else open()}
function fmtT(t){t=Math.round(t);return Math.floor(t/60)+'分'+String(t%60).padStart(2,'0')+'秒'}

/* ===== 確認テスト ===== */
let TS=null;function playerName(){return window.PLAYER_NAME||S.name||''}
function startTest(){if(!window.Quiz)return;MODE='test';ST=null;show(['test']);if(helpCtl)helpCtl.hide();TS={qs:Quiz.test(),i:0,ans:[]};renderQ()}
function renderQ(){const q=TS.qs[TS.i],box=$('#tbox');
 box.innerHTML='<div class="tno">確認テスト　第'+(TS.i+1)+'問 / '+TS.qs.length+'</div><div class="prog">'+TS.qs.map((_,i)=>'<i class="'+(i<TS.i?'on':'')+'"></i>').join('')+'</div><div class="tq">'+q.q+'</div>'+(q.fig?'<div class="fig2">'+q.fig+'</div>':'')+'<div id="ta"></div>';
 const ta=$('#ta');
 if(q.t==='choice'){const d=document.createElement('div');d.className='ch';q.shown.forEach(c=>{const b=document.createElement('button');b.innerHTML=c;b.onclick=()=>ans(c);d.appendChild(b)});ta.appendChild(d)}
 else if(q.t==='num'){ta.innerHTML='<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="数を入力"><b>'+esc(q.unit||'')+'</b><button class="btn s noarr" id="numOk">決定</button></div>';$('#numOk').onclick=()=>{const v=$('#numIn').value.trim();if(v==='')return;ans(v)}}
 else{const picked=[];ta.innerHTML='<div class="small">正しい順にタップしよう</div><div class="ord" id="ordBox"></div><div class="ch" id="ordPool"></div><div class="row2" style="display:flex;gap:8px;margin-top:10px"><button class="btn line s noarr" id="ordRe">やり直す</button><button class="btn s noarr" id="ordOk" disabled>決定</button></div>';
  const drawO=()=>{$('#ordBox').innerHTML=picked.map((t,i)=>'<div>'+(i+1)+'. '+t+'</div>').join('');const pool=$('#ordPool');pool.innerHTML='';q.shown.forEach(t=>{if(picked.includes(t))return;const b=document.createElement('button');b.innerHTML=t;b.onclick=()=>{picked.push(t);sfx.tap();drawO()};pool.appendChild(b)});$('#ordOk').disabled=picked.length!==q.shown.length};
  drawO();$('#ordRe').onclick=()=>{picked.length=0;drawO()};$('#ordOk').onclick=()=>ans(picked.slice())}
 $('#test').scrollTop=0}

 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(S.t)],['★3の道',S.perfect+'本'],['最大コンボ','×'+S.best],['情報カード',Object.keys(S.cards).length+'/'+CARDKINDS.length]];

 $('#rCard').onclick=()=>SubmitCard.reopen(TS.card,()=>{});$('#rAgain').onclick=()=>startTest();if($('#rTitle'))$('#rTitle').onclick=()=>toTitle();$('#rBook').onclick=openBook;zkButtons()}

 Guide.setup({theme:{bg:'#FFFFFF',fg:INK,accent:NAVY,accentText:'#fff',font:'"Zen Kaku Gothic New",sans-serif',bodyFont:'"Zen Kaku Gothic New",sans-serif',radius:0,texture:'grid',line:NAVY,dim:'rgba(255,255,255,.66)',shadow:'8px 8px 0 '+AMB,outline:'#fff',hand:AMB,handLine:NAVY},
