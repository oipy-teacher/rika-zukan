<!--
  空もようパック ～天気と1日の気温～（中2理科 気象 コマ9 / kisho-soramoyo / chu2-kisho-09）v2

  ■ 世界とメタファー: 「ホロ箔トレカのパック開封」。机の上ではなく、夜のショーケースの中。
    1日ぶんの気象観測の記録が、銀のホロ箔パックに封入されている。パックの窓のギザギザ（ミシン目）を
    指で左から右へ破ると、その下のカードに0時からの気温グラフ（のちに湿度の点線も）が少しずつ現れる。
    開ききる前に、天気シール（日本式の天気記号：晴れ＝○に縦線／くもり＝◎／雨＝●）をパックに貼って宣言する。
    早く正しく言い当てるほど箔がランクアップ（銀→ホロ→レインボー→ゴールド）し、光があふれる。
    道のり＝3日パック→5日パック…→1週間ボックス→月末ボックス（箱がだんだん大きくなる）。
    集める＝季節×天気の「空もようカード」をバインダーにうめる。
  ■ 配色: 背景 #151B2E（夜のショーケース）／主 #E3E8F0（銀の箔）／差し #FFB000（金の箔・気温の線）。
    湿度の点線は淡い青 #9CCBFF。ホロの虹は彩度をおさえ、銀と金が主役。
  ■ 書体: 見出し＝Mochiy Pop One（トレカのロゴ・描き文字の勢い）／本文＝Zen Kaku Gothic New／数字＝Russo One。
  ■ 画面の組み方: 全画面canvasが主役。PC・iPad横＝パックを横に並べ、いま破るパックだけ大きく持ち上がる。
    スマホ・iPad縦＝1枚のパックを画面いっぱいに置き、残りのパックは上に小さく並ぶ。天気シールは下のトレー。
  ■ HUD: 左上＝銀箔のタブ「◀ もどる」。右上＝金の箔のかけら・音。上中央＝ボックス名・残りパック・きらめき点・連続的中（canvasの箔の帯）。
    Zukan.hud は使わず Zukan.state() で読む。
  ■ 音: シンセのきらきら（ベル＋グリッサンド）、箔を破るカサカサ（ノイズ）、シールを貼る「ぺたっ」。
  ■ 理科＝操作: 天気は変化の幅（最高−最低）で決まる（晴れ7〜14℃／くもり3〜5℃／雨0.6〜2℃）。
    季節で高さを変え（冬の晴れは低いが幅大、夏の雨は高いが幅小）、目盛りの違うカード、湿度の線
    （晴れの日は気温と逆向き、雨の日は90%以上のまま）、途中で天気が変わる日（午前・午後に別々のシール）を順に解禁。
    シールは朝6時ぶん破るまで貼れず、最後のひと破りは宣言してからでないとできない。外すと連続的中が0に戻る。
  ■ 数値: 飽和水蒸気量は kisho-suijoki-block の表（20℃=17.3、30℃=30.4）。湿度＝水蒸気量÷飽和水蒸気量。
    データはすべて自作の例（実在の日・地点の記録ではない）。
-->

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+

  function reviewHTML(r){

      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){

        '<button data-a="close">とじる</button></div></div>';

    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}

    document.body.appendChild(ov);

  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){

})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

 const lab='BOX'+(S.box+1)+'　'+B.nm;cx.font=fh(WIDE?20:15);const tw=cx.measureText(lab).width;
 if(WIDE){cx.textAlign='center';cx.fillStyle='#E3E8F0';cx.fillText(lab,mid,top+22);
  cx.font=fnm(15);cx.fillStyle='#FFB000';cx.fillText('きらめき '+S.score.toLocaleString(),mid,top+44);
 }else{cx.textAlign='center';cx.fillStyle='#E3E8F0';cx.font=fh(W<380?11:13);cx.fillText('BOX'+(S.box+1)+'/8',mid,top+22);cx.font=fb(12);cx.fillText(B.nm,mid,top+40)}
 // 連続的中の箔ステッカー
 if(S.combo>0){const m=S.combo>=5?3:S.combo>=3?2:1;const t='連続 '+S.combo+(m>1?'  ×'+m:'');cx.font=fh(WIDE?17:13);const w2=cx.measureText(t).width+20;const x=WIDE?mid+tw/2+30:W-w2-12,y=WIDE?top+6:top+58;
  if(!WIDE&&B.ta){}else{rr(x,y,w2,WIDE?30:24,6);cx.fillStyle=m>1?'#FFB000':'#E3E8F0';cx.fill();}cx.fillStyle='#151B2E';cx.textAlign='left';cx.fillText(t,x+10,y+(WIDE?21:17))}
 // 小さなパックの列（スマホ）
 if(!WIDE){const n=packs.length,sw=16,gap=5;let x=12;const y=top+60;packs.forEach((q,i)=>{rr(x,y,sw,22,3);cx.fillStyle=q.done?(q.ok?'#FFB000':'#5a6380'):i===PI?'#fff':'#8d98ac';cx.fill();x+=sw+gap})}
 if(!WIDE){cx.font=fnm(13);cx.fillStyle='#FFB000';cx.textAlign='left';cx.fillText('きらめき '+S.score.toLocaleString(),12+packs.length*21+6,top+77)}
 // タイムアタック
 if(B.ta&&S.taLeft!=null){const t=Math.max(0,S.taLeft);const bw=WIDE?Math.min(420,W*.3):W-24,bx=W/2-bw/2,by=WIDE?top+52:top+88;rr(bx,by,bw,8,4);cx.fillStyle='#2a3456';cx.fill();rr(bx,by,Math.max(0,bw*t/B.ta),8,4);cx.fillStyle=t<30?'#ff6b5a':'#FFB000';cx.fill();cx.font=fnm(WIDE?15:14);cx.fillStyle=t<30?'#ff9d8f':'#fff';cx.textAlign=WIDE?'left':'right';cx.fillText('のこり '+fmtT(t),WIDE?bx+bw+10:W-12,WIDE?by+9:top+77)}
 cx.restore()}
function drawParts(dt){cx.save();for(const q of parts){q.life-=dt*.9;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=380*dt;q.vx*=.99;q.rot+=dt*6;if(q.life<=0)continue;cx.globalAlpha=clamp(q.life,0,1);cx.translate(q.x,q.y);cx.rotate(q.rot);
 if(q.k==='star'){cx.fillStyle=q.gold?'#FFB000':'hsl('+q.h+',90%,78%)';cx.beginPath();for(let i=0;i<8;i++){const rr2=i%2?q.sz*.4:q.sz;cx.lineTo(Math.cos(i*Math.PI/4)*rr2,Math.sin(i*Math.PI/4)*rr2)}cx.fill()}
 else{cx.fillStyle=q.gold?'#ffd66b':'hsl('+q.h+',70%,'+(70+Math.sin(q.rot)*20)+'%)';cx.fillRect(-q.sz/2,-q.sz/3,q.sz,q.sz*.66)}
 cx.setTransform(DPR,0,0,DPR,0,0)}cx.restore();parts=parts.filter(q=>q.life>0)}
function drawTitle(){drawBG();const bh=$('#title .box').offsetHeight||240;const s=WIDE?Math.min(W*.36,H*.78):Math.min(W*.92,H-bh-110);const px=WIDE?W*.34:W/2,py=WIDE?H*.52:(60+H-bh-30)/2;
 // まわりに浮かぶカード
 const kinds=['sun','cloud','rain','sun','rain','cloud'];kinds.forEach((w,i)=>{const a=i/6*6.283+tNow*.15,R=s*.78;const x=px+Math.cos(a)*R*(WIDE?1.05:.62),y=py+Math.sin(a)*R*.55;const cw=s*.2,ch=cw*1.4;
  cx.save();cx.translate(x,y);cx.rotate(Math.sin(a)*.3);rr(-cw/2,-ch/2,cw,ch,6);cx.fillStyle=silver(-cw/2,-ch/2,cw,ch);cx.fill();cx.clip();cx.globalCompositeOperation='overlay';cx.fillStyle=holoGrad(-cw/2,-ch/2,cw,ch,.9,sheen()+i*.2);cx.fillRect(-cw/2,-ch/2,cw,ch);cx.globalCompositeOperation='source-over';drawSym(w,0,-ch*.08,cw*.24,'#151B2E');cx.restore()});
 // 大きなパック
 cx.save();cx.translate(px,py);cx.rotate(-.06+Math.sin(tNow*.8)*.015);const r={x:-s*.36,y:-s*.5,w:s*.72,h:s};drawPackBody(r,null,true);
 cx.textAlign='center';cx.fillStyle='#151B2E';cx.font=fh(s*.042);cx.fillText('中2理科　気象とその変化　第9回',0,r.y+s*.1);
 // ロゴ（金箔の描き文字）
 const lg=cx.createLinearGradient(-s*.3,0,s*.3,0);lg.addColorStop(0,'#c98600');lg.addColorStop(.35,'#ffe39a');lg.addColorStop(.5,'#FFB000');lg.addColorStop(.7,'#fff1c2');lg.addColorStop(1,'#c98600');
 cx.font=fh(s*.1);cx.lineJoin='round';cx.lineWidth=s*.022;cx.strokeStyle='#151B2E';cx.strokeText('空もよう',0,-s*.2);cx.fillStyle=lg;cx.fillText('空もよう',0,-s*.2);
 cx.font=fh(s*.13);cx.strokeText('パック',0,-s*.05);cx.fillStyle=lg;cx.fillText('パック',0,-s*.05);
 cx.font=fh(s*.042);cx.fillStyle='#151B2E';cx.fillText('～天気と1日の気温～',0,s*.03);
 // 窓の中のミニグラフ
 const gx=-s*.26,gy=s*.08,gw=s*.52,gh=s*.24;rr(gx,gy,gw,gh,6);cx.fillStyle='#10172c';cx.fill();cx.strokeStyle='#FFB000';cx.lineWidth=2;cx.stroke();
 cx.strokeStyle='#FFB000';cx.lineWidth=s*.008;cx.beginPath();for(let i=0;i<=48;i++){const h=i/2,v=prof(h,5.5,14,.3);const x=gx+gw*.06+gw*.88*h/24,y=gy+gh*.85-gh*.7*v;i?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke();
 cx.strokeStyle='#9CCBFF';cx.setLineDash([5,4]);cx.beginPath();for(let i=0;i<=48;i++){const h=i/2,v=prof(h,5.5,14,.3);const x=gx+gw*.06+gw*.88*h/24,y=gy+gh*.15+gh*.6*v;i?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke();cx.setLineDash([]);
 ['sun','cloud','rain'].forEach((w,i)=>drawSym(w,(i-1)*s*.13,s*.42,s*.04,'#151B2E'));
 cx.restore()}
function drawPlay(dt){drawBG();
 const sh=shake>0&&!RM;if(shake>0)shake=Math.max(0,shake-dt);if(sh){cx.save();cx.translate(rnd(-8,8)*shake,rnd(-8,8)*shake)}
 packs.forEach(p=>{const t=p.tg;if(!t)return;const k=1-Math.pow(.001,dt);p.r.x=lerp(p.r.x,t.x,k);p.r.y=lerp(p.r.y,t.y,k);p.r.w=lerp(p.r.w,t.w,k);p.r.h=lerp(p.r.h,t.h,k)});
 packs.forEach((p,i)=>{if(i===PI)return;if(!WIDE&&Math.abs(p.r.x-p.tg.x)<2&&p.tg.x!==L.area.x)return;if(WIDE)drawSmallPack(p,i);else if(Math.abs(p.r.x-L.area.x)<W)drawActiveLite(p,i)});
 const p=cur();if(p)drawActive(p,PI);
 if(flash>0){cx.fillStyle='rgba(255,240,200,'+(flash*.35)+')';cx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*1.6)}
 drawParts(dt);
 if(sh)cx.restore();
 drawHUDc();drawTray()}
function drawActiveLite(p,i){drawPackBody(p.r,p,false)}
/* ===== ループ ===== */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;tNow=(now-T0)/1000;
 cx.setTransform(DPR,0,0,DPR,0,0);
 if(MODE==='title'){drawTitle();drawParts(dt)}
 else if(MODE==='test'){drawBG()}
 else{if(MODE==='play'){S.t+=dt;if(B.ta&&S.taLeft!=null){S.taLeft-=dt;if(S.taLeft<=0){S.taLeft=0;packs.forEach(q=>{if(!q.done){q.done=true;q.ok=false;q.doneAt=tNow}});endBox(true)}}}
  if(B)drawPlay(dt)}
 requestAnimationFrame(loop)}

/* ===== 確認テスト ===== */
let TS=null;function playerName(){return window.PLAYER_NAME||S.name||''}
function startTest(){if(!window.Quiz)return;MODE='test';ovClose();TS={qs:Quiz.test(),i:0,ans:[]};show('test');$('#hud').classList.remove('hidden');renderQ()}
function renderQ(){const q=TS.qs[TS.i],box=$('#tbox');
 box.innerHTML='<div class="tno">✦ 確認テスト　第'+(TS.i+1)+'問 / '+TS.qs.length+'</div><div class="prog">'+TS.qs.map((_,i)=>'<i class="'+(i<TS.i?'on':'')+'"></i>').join('')+'</div><div class="tq">'+q.q+'</div>'+(q.fig?'<div class="fig2">'+q.fig+'</div>':'')+'<div id="ta"></div>';
 const ta=$('#ta');
 if(q.t==='choice'){const d=document.createElement('div');d.className='ch';q.shown.forEach(c=>{const b=document.createElement('button');b.innerHTML=c;b.onclick=()=>ans(c);d.appendChild(b)});ta.appendChild(d)}
 else if(q.t==='num'){ta.innerHTML='<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="数を入力"><b>'+esc(q.unit||'')+'</b><button class="foil gold s" id="numOk" style="flex:0 0 auto">決定</button></div>';$('#numOk').onclick=()=>{const v=$('#numIn').value.trim();if(v==='')return;ans(v)}}
 else{const picked=[];ta.innerHTML='<div class="small">正しい順にタップしよう</div><div class="ord" id="ordBox"></div><div class="ch" id="ordPool"></div><div class="row" style="margin-top:10px"><button class="foil s" id="ordRe">やり直す</button><button class="foil gold s" id="ordOk" disabled>決定</button></div>';
  const drawO=()=>{$('#ordBox').innerHTML=picked.map((t,i)=>'<div>'+(i+1)+'. '+t+'</div>').join('');const pool=$('#ordPool');pool.innerHTML='';q.shown.forEach(t=>{if(picked.includes(t))return;const b=document.createElement('button');b.innerHTML=t;b.onclick=()=>{picked.push(t);sfx.tap();drawO()};pool.appendChild(b)});$('#ordOk').disabled=picked.length!==q.shown.length};
  drawO();$('#ordRe').onclick=()=>{picked.length=0;drawO()};$('#ordOk').onclick=()=>ans(picked.slice())}
 $('#tbox').scrollTop=0}
function ans(v){TS.ans.push(v);sfx.tap();TS.i++;if(TS.i<TS.qs.length)renderQ();else finishTest()}
function finishTest(){const qs=TS.qs,review=Quiz.review(qs,TS.ans),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;sfx.fan();
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(S.t)],['的中',S.hits+' / '+S.tries+'パック'],['早読み（朝〜昼で宣言して的中）',S.early+'回'],['最大連続的中',S.maxCombo+'連続']];
 TS.card=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:UNIT,game:GTITLE+(TEST_ONLY?'（確認テストのみ）':''),name:playerName(),score,total:qs.length,marks,records:recs,review},showTestResult);showTestResult()}
function showTestResult(){const r=TS.card||{};$('#tbox').innerHTML='<h2>テストの結果</h2><p style="font-family:var(--fn);font-size:40px;margin:6px 0;color:#FFB000">'+(r.score||0)+' / '+(r.total||0)+'</p><div style="display:flex;flex-direction:column;gap:9px"><button class="foil gold" id="rCard">提出カードをもう一度見る</button><button class="foil" id="rAgain">↺ テストをもう一度</button>'+(TEST_ONLY?'':'<button class="foil s" id="rTitle">タイトルへ</button>')+'<button class="foil s zk" id="rBook">📖 図鑑</button></div>';
 $('#rCard').onclick=()=>SubmitCard.reopen(TS.card,()=>{});$('#rAgain').onclick=()=>startTest();if($('#rTitle'))$('#rTitle').onclick=()=>toTitle();$('#rBook').onclick=openBook;zkButtons()}

/* ===== タイトル ===== */
function toTitle(){MODE='title';ovClose();show('title');$('#bCont').classList.toggle('hidden',!S.started);zkButtons();
 const fromList=/\/chu2\/[^/]+\/?(index\.html)?$/.test(location.pathname)||/\/chu2\/(index\.html)?(\?|#|$)/.test(document.referrer||'');$('#bList').classList.toggle('hidden',!fromList)}
$('#bList').onclick=()=>{location.href='../'};
$('#bStart').onclick=()=>{ac();sfx.tap();const nm=$('#nameIn').value.trim()||S.name,snd=S.sound,alb=S.album;S=fresh();S.name=nm;S.sound=snd;S.album=alb||{};S.started=true;save();B=BOXES[0];startBox(0,false)};
$('#bCont').onclick=()=>{ac();sfx.tap();const v=$('#nameIn').value.trim();if(v)S.name=v;save();if(S.cleared&&!S.packs){startTest();return}B=BOXES[S.box];startBox(S.box,!!S.packs)};
$('#bSnd1').onclick=toggleSnd;$('#bSnd').onclick=toggleSnd;$('#bBook1').onclick=openBook;$('#bAlb1').onclick=()=>albumOpen(null);
$('#bBack').onclick=()=>{sfx.tap();if(MODE==='test'){if(TEST_ONLY)return;toTitle();return}confirmBack()};

resize();
try{window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]})}catch(e){}
setSnd();kk();
if(window.PLAYER_NAME){$('#nameIn').value=window.PLAYER_NAME;$('#nameRow').classList.add('hidden')}else if(S.name)$('#nameIn').value=S.name;
window.__game={S:()=>S,mode:()=>MODE,packs:()=>packs,PI:()=>PI,tearTo:h=>{const p=cur();tearBy(h-p.rev)},seal:(i,w)=>placeSeal(i,w),truth:()=>cur().slots.map((_,i)=>truthAt(cur(),i)),next:nextPack,start:()=>$('#bStart').onclick(),go:()=>$('#bGo')&&$('#bGo').onclick(),box:i=>{B=BOXES[i];S.box=i;S.packs=null;startBox(i,false)},startTest};
if(TEST_ONLY){$('#bBack').classList.add('hidden');startTest()}else toTitle();
requestAnimationFrame(loop);
</script>
