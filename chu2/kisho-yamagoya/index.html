<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1d14">
<title>山小屋の5日間 ～気圧と天気～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--wood:#2b1d14;--wood2:#3b281b;--wood3:#1c130d;--lamp:#f0b35a;--lamp2:#ffd792;--paper:#f3e6c8;--paper2:#e6d3a8;--ink:#3a2a1c;--ink2:#6b5842;--red:#a23b2a;--blue:#34507a;--pen:#2d3f86;
 --serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;--sans:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--paper);font-family:var(--sans);overflow-x:hidden;background:var(--wood3)}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 12%,rgba(240,179,90,.28),transparent 55%),radial-gradient(ellipse at 50% 60%,var(--wood2),var(--wood) 60%,var(--wood3));background-attachment:fixed}
button{font-family:inherit;touch-action:manipulation}
.hidden{display:none!important}
.app{max-width:560px;margin:0 auto;padding:6px 10px 22px;position:relative}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 12px}
.btn{min-height:48px;padding:10px 22px;border-radius:10px;border:2px solid #7a5a36;background:var(--paper);color:var(--ink);font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #7a5a36,0 8px 16px rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5a36}
.btn.lamp{background:linear-gradient(#ffd792,#f0b35a);border-color:#8a5a1c;box-shadow:0 4px 0 #8a5a1c,0 0 22px rgba(240,179,90,.45)}
.btn[disabled]{opacity:.35;cursor:default;transform:none}
.btn.small{min-height:44px;font-size:15px;padding:8px 14px}
#mute{position:fixed;top:8px;right:8px;z-index:60;width:44px;height:44px;border-radius:50%;border:2px solid #7a5a36;background:rgba(0,0,0,.35);color:#fff;font-size:20px;cursor:pointer}
#title h1{font-family:var(--serif);font-weight:800;font-size:clamp(32px,9.5vw,48px);margin:4px 0 0;letter-spacing:.08em;color:var(--paper);text-shadow:0 0 18px rgba(240,179,90,.5)}
#title .sub{font-family:var(--serif);font-size:clamp(16px,4.6vw,21px);color:var(--lamp2);margin:4px 0 10px;letter-spacing:.14em}
#title .emo{font-size:30px}
.tbtns{display:flex;flex-direction:column;gap:12px;width:min(300px,86vw);margin-top:12px}
.namebox{margin-top:6px;font-size:15px;color:#e8d8b8}
.namebox input{font:inherit;font-size:17px;padding:8px 10px;border:2px solid var(--lamp);border-radius:8px;background:var(--paper);color:var(--ink);width:12em;max-width:70vw}
.ghost{font-size:14px;color:#dcc9a4;margin-top:12px;min-height:1.2em}
.hud{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-right:50px;min-height:44px;font-size:14px}
.chip{background:rgba(0,0,0,.3);border:1px solid rgba(240,179,90,.35);border-radius:20px;padding:3px 10px;white-space:nowrap}
.chip b{font-size:16px;color:var(--lamp2)}
.frame{border:6px solid #5a3d25;border-radius:10px;box-shadow:inset 0 0 0 2px #7a5a36,0 6px 16px rgba(0,0,0,.5);overflow:hidden;background:#1d1510;position:relative}
#win svg{display:block;width:100%;height:auto}
#winLbl{position:absolute;left:8px;bottom:6px;background:rgba(28,19,13,.7);color:var(--paper);padding:2px 8px;border-radius:8px;font-size:13px}
.sheet{margin-top:8px;background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 6px 4px;box-shadow:0 6px 16px rgba(0,0,0,.45),inset 0 0 30px rgba(160,120,60,.25)}
.sheet h4{margin:0 4px 2px;font-family:var(--serif);font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.sheet h4 small{font-family:var(--sans);font-weight:500;color:var(--ink2);font-size:12px}
#chart svg{display:block;width:100%;height:auto}
#recs{font-size:13px;overflow-x:auto}
#recs table{border-collapse:collapse;margin:2px auto 0;width:100%}
#recs td,#recs th{border:1px solid #cdb88c;padding:2px 3px;text-align:center;white-space:nowrap}
#recs th{background:#eadbb6;font-weight:700}
.lab{font-size:14px;color:#ecdcbc;margin:10px 0 4px;text-align:left}
.lab b{color:var(--lamp2)}
#reads{display:flex;flex-direction:column;gap:6px}
.rd{min-height:46px;border-radius:10px;border:2px solid rgba(240,179,90,.35);background:rgba(0,0,0,.28);color:var(--paper);font-size:15px;line-height:1.35;cursor:pointer;padding:6px 10px;text-align:left}
.rd.sel{background:var(--paper);color:var(--ink);border-color:var(--lamp);box-shadow:0 0 0 2px var(--lamp)}
#slots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sl{min-height:88px;border-radius:8px;border:2px dashed rgba(243,230,200,.4);background:rgba(0,0,0,.25);color:var(--paper);cursor:pointer;padding:3px 1px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;font-size:11px;position:relative}
.sl .tm{font-size:11px;color:#dcc9a4}
.sl .ic{font-size:22px;line-height:1.1}
.sl .nm{font-size:10px;line-height:1.15}
.sl.o{border:2px solid #d9a441;background:#f3e6c8;color:var(--ink)}
.sl.i{border:2px solid #8aa1c0;background:#dfe5ee;color:#1f2d44}
.sl.lock{opacity:.55;cursor:default}
.sl.now{box-shadow:0 0 0 3px var(--lamp2),0 0 16px var(--lamp)}
.sl .st{position:absolute;bottom:2px;left:0;right:0;font-size:18px}
.sl .st.pop{animation:pop .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
#hand{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center}
.cd{min-height:48px;min-width:74px;border-radius:8px;padding:4px 8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;border:2px solid transparent}
.cd.o{background:#f3e6c8;color:var(--ink);border-color:#d9a441}
.cd.i{background:#dfe5ee;color:#1f2d44;border-color:#8aa1c0}
.cd.sel{box-shadow:0 0 0 3px var(--lamp2),0 0 14px var(--lamp);transform:translateY(-3px)}
.cd .ic{font-size:20px}
.legend{font-size:12px;color:#dcc9a4;text-align:left;margin-top:4px;line-height:1.5}
#goBtn{width:100%;margin-top:10px;font-size:19px;min-height:54px}
#msg{margin-top:8px;background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6;text-align:left;box-shadow:0 6px 14px rgba(0,0,0,.4)}
#msg h3{margin:0 0 4px;font-family:var(--serif);font-size:19px}
#msg .row{display:flex;justify-content:flex-end;margin-top:6px}
.em{color:var(--red);font-weight:700}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.float{position:absolute;font-family:var(--serif);font-weight:800;color:var(--lamp2);font-size:24px;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 10px rgba(240,179,90,.8);animation:fl 1.2s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
.float.big{font-size:34px}
@keyframes fl{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-64px}}
.ember{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--lamp2);box-shadow:0 0 8px var(--lamp)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(16,10,6,.7);display:flex;align-items:center;justify-content:center;padding:14px}
.ov .paper{background:var(--paper);color:var(--ink);border-radius:12px;max-width:440px;width:100%;padding:18px 16px 16px;text-align:center;box-shadow:0 0 40px rgba(240,179,90,.35),0 12px 30px rgba(0,0,0,.6);max-height:92vh;overflow:auto;border:3px solid #7a5a36}
.ov h2{font-family:var(--serif);margin:4px 0 8px;font-size:25px}
.ov .no{display:inline-block;background:var(--wood);color:var(--lamp2);padding:2px 12px;border-radius:20px;font-size:14px;letter-spacing:.1em}
.ov p{font-size:16px;line-height:1.65;margin:8px 0;text-align:left}
.ov svg{max-width:100%;height:auto}
.stamp{display:inline-block;border:4px solid var(--red);color:var(--red);font-family:var(--serif);font-size:36px;padding:4px 16px;border-radius:8px;transform:rotate(-8deg);margin:8px}
.stamp.in{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(3) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
table.rec{margin:8px auto;border-collapse:collapse;font-size:15px}
table.rec td{border-bottom:1px solid #cdb88c;padding:4px 10px;text-align:left}
.dayres{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:6px 0;font-size:12px}
.dayres div{border-radius:6px;padding:3px 1px;background:#eadbb6}
#test{justify-content:flex-start;padding-top:60px}
#test h2{font-family:var(--serif);margin:0 0 6px}
#tNum{color:var(--lamp2);font-weight:700;margin-bottom:6px}
.qbox{width:100%;max-width:520px;background:var(--paper);color:var(--ink);border-radius:12px;padding:14px;text-align:left;font-size:17px;line-height:1.65}
#tFig{text-align:center;margin:6px 0}
#tFig svg{max-width:100%;height:auto;max-height:240px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choices button{min-height:48px;text-align:left;padding:10px 14px;border:2px solid #cdb88c;border-radius:10px;background:#fffaf0;color:var(--ink);font-size:16px;cursor:pointer}
.choices button.sel{background:var(--wood2);color:#fff}
.numrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.numrow input{font:inherit;font-size:22px;width:6em;padding:8px;border:2px solid var(--ink);border-radius:8px;background:#fff}
.seq{min-height:48px;border:2px dashed #cdb88c;border-radius:8px;padding:6px;margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.seq div{background:var(--wood2);color:#fff;border-radius:6px;padding:6px 8px}
.fb{margin-top:10px;padding:10px;border-radius:8px;font-size:15px;line-height:1.55}
.fb.o{background:#f7e2d4;border:2px solid var(--red)}
.fb.x{background:#ebe3d0;border:2px solid #8a7a5a}
.fb b.m{font-family:var(--serif);font-size:24px;margin-right:6px}
.hint{font-size:13px;color:#6b5842;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <filter id="oil" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .1  0 0 0 .22 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
</defs></svg>
<div class="app">
<section id="title" class="screen">

    <defs><radialGradient id="tg" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffd792" stop-opacity=".55"/><stop offset="1" stop-color="#ffd792" stop-opacity="0"/></radialGradient></defs>
    <circle cx="130" cy="88" r="78" fill="url(#tg)"/>

    <rect x="112" y="118" width="20" height="18" fill="#ffd792" stroke="#2b1d14" stroke-width="2"/><rect x="142" y="124" width="16" height="26" fill="#3b281b" stroke="#2b1d14" stroke-width="2"/></g>
    <g transform="translate(18 100)"><rect x="0" y="22" width="56" height="30" rx="4" fill="#3b281b" stroke="#c9a15e" stroke-width="2"/><rect x="6" y="6" width="44" height="22" rx="3" fill="#f3e6c8" stroke="#c9a15e" stroke-width="1.5"/><path d="M8 14 Q18 12 24 16 T40 22 T50 24" fill="none" stroke="#2d3f86" stroke-width="1.6"/><line x1="50" y1="24" x2="58" y2="40" stroke="#c9a15e" stroke-width="2"/></g>
  </svg>
  <div class="emo">🛖</div>
  <h1>山小屋の5日間</h1>
  <div class="sub">～ 気圧と天気 ～</div>
  <div class="namebox" id="nameBox">なまえ（なくてもOK）<br><input id="nameIn" maxlength="16" autocomplete="off"></div>
  <div class="tbtns">
    <button class="btn lamp" id="bStart">はじめる</button>

</section>

<section id="play" class="hidden">
  <div class="hud" id="hud">
    <span class="chip" id="hDay">1日目</span>
    <span class="chip">🕰 <b id="hTime">6:00</b></span>
    <span class="chip">★ <b id="hStar">0</b></span>

  <div class="sheet"><h4><span>自記気圧計の記録</span><small id="chartNote">前日18時〜いま</small></h4><div id="chart"></div><div id="recs"></div></div>
  <div id="planBox">
    <div id="readBox"><div class="lab">① 気圧の記録から <b>何が読める？</b></div><div id="reads"></div></div>
    <div class="lab" id="slotLab">② 予定表に作業カードを置く（カード→時間の順にタップ）</div>

    <div class="legend" id="legend"></div>

  </div>

<section id="test" class="screen hidden">
  <h2>📝 確認テスト</h2>
  <div class="namebox hidden" id="tNameBox">なまえ <input id="tName" maxlength="16" autocomplete="off"></div>
  <div id="tNum"></div>
  <div class="qbox"><div id="tQ"></div><div id="tFig"></div><div id="tA"></div><div id="tFb"></div></div>
</section>

<section id="end" class="screen hidden">
  <div class="stamp">おつかれさま</div>
  <p style="font-size:16px;line-height:1.7">気圧が<b style="color:#ffd792">下がり続ける</b> → 天気はくずれていく<br>気圧が<b style="color:#ffd792">上がり始める</b> → 天気は回復していく<br><small>値の高い低いより「変わり方」を読む</small></p>
  <div class="tbtns">
    <button class="btn small hidden" id="bBook2">📖 図鑑</button>
    <button class="btn small" id="bAgain">もう一度 5日目</button>

  </div>
</section>
</div>

<script>/*@SUBMIT_CARD_BEGIN*/

     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）

  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);

  function cardHTML(r){

    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+

  }

  function reviewHTML(r){

      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){

        '<button data-a="close">とじる</button></div></div>';

    draw();

      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}

  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],

       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){

})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

に減っていった", "0のまま変わらなかった", "気圧とは関係なく毎時間でたらめに変わった"], "ex": "気圧が下がり続け天気がくずれていくとき、雲が広がり雲量が増えていくことが多い。", "kind": "judge", "level": 2, "id": "chu2-kisho-yamagoya-q009", "koma": "chu2-kisho-10", "fig": null}, {"t": "order", "q": "気圧の記録から、この後の天気の傾向を判断する手順を正しい順に並べよう。", "items": ["記録を時刻の順に並べる", "いちばん新しい数時間の変化の向き（上がる・下がる）を見る", "その向きが続いているのか、小さな上下なのかを見分ける", "天気がくずれるか回復するかの傾向を判断する"], "ex": "最新の変化の向きと、それが続いているかを見てから判断する。", "kind": "method", "level": 2, "id": "chu2-kisho-yamagoya-q010", "koma": "chu2-kisho-10", "fig": null}, {"t": "choice", "q": "図はある地点の2日分の気圧の記録。天気が最も悪かった（雨が強かった）と考えられるのはア〜エのどのころ？", "choices": ["イ", "ア", "ウ", "エ"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 170\" font-family=\"sans-serif\">\u003crect width=\"300\" height=\"170\" fill=\"#fbf3de\"/>\u003cline x1=\"40\" y1=\"142.0\" x2=\"290\" y2=\"142.0\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003ctext x=\"37\" y=\"146.0\" font-size=\"10\" text-anchor=\"end\" fill=\"#6b5842\">1000\u003c/text>\u003cline x1=\"40\" y1=\"131.7\" x2=\"290\" y2=\"131.7\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003cline x1=\"40\" y1=\"121.3\" x2=\"290\" y2=\"121.3\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003ctext x=\"37\" y=\"125.3\" font-size=\"10\" text-anchor=\"end\" fill=\"#6b5842\">1004\u003c/text>\u003cline x1=\"40\" y1=\"111.0\" x2=\"290\" y2=\"111.0\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003cline x1=\"40\" y1=\"100.7\" x2=\"290\" y2=\"100.7\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003ctext x=\"37\" y=\"104.7\" font-size=\"10\" text-anchor=\"end\" fill=\"#6b5842\">1008\u003c/text>\u003cline x1=\"40\" y1=\"90.3\" x2=\"290\" y2=\"90.3\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003cline x1=\"40\" y1=\"80.0\" x2=\"290\" y2=\"80.0\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003ctext x=\"37\" y=\"84.0\" font-size=\"10\" text-anchor=\"end\" fill=\"#6b5842\">1012\u003c/text>\u003cline x1=\"40\" y1=\"69.7\" x2=\"290\" y2=\"69.7\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003cline x1=\"40\" y1=\"5   function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

/* ---------- 1日の記録をつくる（h=-6：前日18時 〜 h=18） ---------- */
function mk(type){var P=[],wet=[0,0,0,0,0,0],i,h,base,s,rate,b,low,f,k,r,peak,read,noon=null;
  function wob(h){return .45*Math.sin(2*Math.PI*(h+3)/12)+rf(-.15,.15)}
  if(type==='steady'){base=rf(1018,1021);for(h=-6;h<=18;h++)P.push(base+wob(h));read='steady'}
  else if(type==='fall'){base=rf(1021,1024);s=ri(-2,0);rate=rf(.7,.9);k=ri(3,4);for(h=-6;h<=18;h++)P.push((h<s?base:base-(h-s)*rate)+wob(h)*.5);for(i=k;i<6;i++)wet[i]=1;read='fall'}
  else if(type==='rise'){b=ri(2,4);low=rf(1003,1006);r=ri(1,2);for(h=-6;h<=18;h++)P.push((h<b?low+(b-h)*rf(.85,.95):low+(h-b)*rf(.8,.9))+rf(-.12,.12));for(i=0;i<r;i++)wet[i]=1;read='rise'}
  else if(type==='d3'){b=ri(-1,1);low=rf(1006,1008);f=ri(9,10);rate=rf(.55,.7);for(h=-6;h<=18;h++){var v=h<b?low+(b-h)*.9:(h<f?low+(h-b)*1.0:low+(f-b)*1.0-(h-f)*rate);P.push(v+rf(-.12,.12))}wet=[1,0,0,0,0,1];read='rise';noon='fall'}
  // 雲量・風向（3時間ごと）
  var hrs=[-6,-3,0,3,6,9,12,15,18],cl=[],wd=[];
  hrs.forEach(function(h){var sl=h<6?-1:Math.min(5,Math.floor((h-6)/2)),w=sl>=0?wet[sl]:null,c,d;
    if(type==='steady'){c=ri(1,3);d=pick(['北西','北','西'])}
    else if(type==='fall'){var toRain=6+2*k-h;c=w?10:(toRain>12?ri(1,3):toRain>6?ri(4,6):ri(7,9));d=w||toRain<=6?'南':(toRain<=12?'南東':'東')}
    else if(type==='rise'){var sinceB=h-b;c=(h<6+2*r)?10:(sinceB<6?ri(6,8):ri(2,4));if(h<6&&sinceB<0)c=10;d=sinceB<0?'南':(sinceB<3?'西':'北西')}
    else{if(h<8)c=10;else if(h<f+2)c=ri(2,4);else if(h<16)c=ri(6,8);else c=10;d=h<b?'南':(h<f?'北西':(h<14?'南東':'南'))}
    cl.push(c);wd.push(d)});
  return {type:type,P:P.map(r1),wet:wet,read:read,noon:noon,cl:cl,wd:wd}}
function Pat(sc,h){return sc.P[h+6]}

/* ---------- 図：自記気圧計の記録紙 ---------- */
var LO=1000,HI=1026;
function chartSVG(sc,upto,o){o=o||{};var W=340,H=186,L=38,R=330,T=20,B=158;
  function X(h){return L+(R-L)*(h+6)/24}
  function Y(p){return B-(B-T)*(p-LO)/(HI-LO)}
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">';
  s+='<rect x="'+L+'" y="'+T+'" width="'+(R-L)+'" height="'+(B-T)+'" fill="#fbf3de"/>';
  if(upto<18)s+='<rect x="'+X(upto)+'" y="'+T+'" width="'+(R-X(upto))+'" height="'+(B-T)+'" fill="#e8dcc0"/><text x="'+((X(upto)+R)/2)+'" y="'+(T+14)+'" font-size="11" text-anchor="middle" fill="#8a7658">これから</text>';
  for(var p=LO;p<=HI;p+=2){var y=Y(p);s+='<line x1="'+L+'" y1="'+y+'" x2="'+R+'" y2="'+y+'" stroke="'+(p===1013?'#c48a6a':'#d8c6a0')+'" stroke-width="'+(p%4===0?.9:.5)+'"'+(p===1013?' stroke-dasharray="4 3"':'')+'/>';if(p%4===0)s+='<text x="'+(L-3)+'" y="'+(y+4)+'" font-size="10" text-anchor="end" fill="#6b5842">'+p+'</text>'}
  s+='<text x="'+(R-2)+'" y="'+(Y(1013)-3)+'" font-size="9" text-anchor="end" fill="#a86a4a">1013</text>';
  // 記録紙の時刻線は弧になる（ペンが弧をえがくため）
  for(var h=-6;h<=18;h+=3){var x=X(h);s+='<path d="M'+x+' '+T+' Q'+(x-7)+' '+((T+B)/2)+' '+x+' '+B+'" fill="none" stroke="#cdb88c" stroke-width="'+(h%6===0?1:.5)+'"/>';
    if(h%6===0)s+='<text x="'+x+'" y="'+(B+13)+'" font-size="10" text-anchor="middle" fill="#6b5842">'+(h===0?'0時':(h<0?'前日'+(h+24):h))+'</text>'}
  s+='<text x="'+(L-3)+'" y="11" font-size="10" text-anchor="end" fill="#6b5842">hPa</text>';
  s+='<rect x="'+L+'" y="'+T+'" width="'+(R-L)+'" height="'+(B-T)+'" fill="none" stroke="#6b5842"/>';
  // 雨の時間（すぎた分だけ）
  for(var i=0;i<6;i++){var h0=6+2*i;if(sc.wet[i]&&h0<upto)s+='<rect x="'+X(h0)+'" y="'+(B+18)+'" width="'+(X(Math.min(h0+2,upto))-X(h0))+'" height="7" rx="2" fill="#34507a"/>'}
  if(S.sc&&sc.wet.some(function(w,i){return w&&6+2*i<upto}))s+='<rect x="'+(L+4)+'" y="'+(B+19)+'" width="10" height="6" rx="2" fill="#34507a"/><text x="'+(L+17)+'" y="'+(B+25)+'" font-size="10" fill="#34507a">雨が降った時間</text>';
  if(o.step3){var pts=[];for(var hk=-6;hk<=upto;hk+=3)pts.push([X(hk),Y(Pat(sc,hk)),Pat(sc,hk)]);
    s+='<path d="'+pts.map(function(q,j){return (j?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('')+'" fill="none" stroke="#2d3f86" stroke-width="1.4" stroke-dasharray="3 3"/>';
    pts.forEach(function(q,j){s+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.6" fill="#2d3f86"/><text x="'+q[0].toFixed(1)+'" y="'+(q[1]+(j%2?15:-7)).toFixed(1)+'" font-size="9.5" text-anchor="'+(q[0]>R-20?'end':(q[0]<L+20?'start':'middle'))+'" fill="#1f2a5c" stroke="#fbf3de" stroke-width="3" paint-order="stroke">'+q[2]+'</text>'})}
  else{var d='';for(var k=-6;k<=upto;k++)d+=(k===-6?'M':'L')+X(k).toFixed(1)+' '+Y(Pat(sc,k)).toFixed(1);
    s+='<path d="'+d+'" fill="none" stroke="#2d3f86" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    var ex=X(upto),ey=Y(Pat(sc,upto));s+='<line x1="'+ex+'" y1="'+ey+'" x2="'+(ex+14)+'" y2="'+(ey-22)+'" stroke="#6b5238" stroke-width="2"/><circle cx="'+ex+'" cy="'+ey+'" r="3" fill="#2d3f86"/>';
    s+='<text x="'+Math.min(ex+4,R-4)+'" y="'+(ey+16)+'" font-size="11" font-weight="700" text-anchor="'+(ex>R-40?'end':'start')+'" fill="#1f2a5c" stroke="#fbf3de" stroke-width="3" paint-order="stroke">'+Pat(sc,upto)+'</text>'}
  return s+'</svg>'}
function recsHTML(sc,upto,which){if(!which||!which.length)return '';var hrs=[-6,-3,0,3,6,9,12,15,18],h='<table><tr><th>時刻</th>';
  hrs.forEach(function(x,i){if(x<=upto)h+='<th>'+(x<0?x+24:x)+'</th>'});h+='</tr>';
  if(which.indexOf('cl')>=0){h+='<tr><th>雲量</th>';hrs.forEach(function(x,i){if(x<=upto)h+='<td>'+sc.cl[i]+'</td>'});h+='</tr>'}
  if(which.indexOf('wd')>=0){h+='<tr><th>風向</th>';hrs.forEach(function(x,i){if(x<=upto)h+='<td style="font-size:11px">'+sc.wd[i]+'</td>'});h+='</tr>'}
  return h+'</table>'}

/* ---------- 図：窓の外（油絵ふう） ---------- */
function winSVG(state,cl,hour){var W=360,H=112,night=hour<6||hour>=18,wet=state==='rain';
  var sky=night?'#26303f':(wet?'#7d8791':(cl>=7?'#a7b0b3':'#8fb0c6')),sky2=night?'#394455':(wet?'#9aa1a6':(cl>=7?'#c3c6c0':'#d9c9a0'));
  var s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+sky+'"/><stop offset="1" stop-color="'+sky2+'"/></linearGradient></defs>';
  s+='<g filter="url(#oil)"><rect x="-10" y="-10" width="'+(W+20)+'" height="'+(H+20)+'" fill="url(#sk)"/>';
  if(!wet&&!night&&cl<7)s+='<circle cx="'+(60+hour*12)+'" cy="'+(34+Math.abs(hour-12)*3)+'" r="13" fill="#f6e2a8" opacity=".95"/>';
  var nc=Math.round(cl/2);for(var i=0;i<nc;i++){var x=(i*67+23)%W,y=12+(i*29)%34;s+='<ellipse cx="'+x+'" cy="'+y+'" rx="'+(34+i%3*10)+'" ry="'+(10+i%2*4)+'" fill="'+(wet?'#6d747a':'#eceae2')+'" opacity="'+(wet?.9:.8)+'"/>'}
  s+='<path d="M-10 92 L40 50 L80 70 L130 30 L175 66 L220 44 L270 74 L320 48 L370 70 L370 130 L-10 130Z" fill="'+(night?'#1d2429':'#56675c')+'"/>';
  s+='<path d="M123 36 L130 30 L138 38 L132 37Z" fill="#ede6d3"/>';
  s+='<path d="M-10 104 Q90 88 180 100 T370 96 L370 130 L-10 130Z" fill="'+(night?'#16201a':'#3f5a3a')+'"/></g>';
  if(wet){for(var k=0;k<46;k++){var rx=(k*53)%W,ry=(k*37)%H;s+='<line x1="'+rx+'" y1="'+ry+'" x2="'+(rx-5)+'" y2="'+(ry+16)+'" stroke="#dfe7ee" stroke-width="1.2" opacity=".55"><animate attributeName="y1" from="'+(ry-20)+'" to="'+(ry+H)+'" dur="'+(RM?'0s':'.7s')+'" repeatCount="indefinite"/><animate attributeName="y2" from="'+(ry-4)+'" to="'+(ry+H+16)+'" dur="'+(RM?'0s':'.7s')+'" repeatCount="indefinite"/></line>'}}
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" filter="url(#grain)" fill="#000"/>';
  s+='<line x1="'+(W/2)+'" y1="0" x2="'+(W/2)+'" y2="'+H+'" stroke="#5a3d25" stroke-width="6"/><line x1="0" y1="'+(H/2)+'" x2="'+W+'" y2="'+(H/2)+'" stroke="#5a3d25" stroke-width="4"/>';
  return s+'</svg>'}

/* ---------- 音 ---------- */
var Snd={c:null,muted:false,
 init:function(){if(this.c)return;try{var A=window.AudioContext||window.webkitAudioContext;if(A)this.c=new A()}catch(e){}},
 t:function(f,d,type,v,f2,dl){if(this.muted||!this.c)return;var c=this.c,t0=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(v||.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.02)},
 n:function(d,v,fc,dl,hp){if(this.muted||!this.c)return;var c=this.c,t0=c.currentTime+(dl||0),len=Math.floor(c.sampleRate*d),b=c.createBuffer(1,len,c.sampleRate),x=b.getChannelData(0);for(var i=0;i<len;i++)x[i]=(Math.random()*2-1)*(1-i/len);var s=c.createBufferSource();s.buffer=b;var f=c.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=fc||1200;var g=c.createGain();g.gain.value=v||.1;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t0)},
 click:function(){this.t(700,.05,'triangle',.05)},
 place:function(){this.t(330,.08,'triangle',.08);this.n(.05,.06,900)},
 tick:function(){this.t(1500,.03,'square',.02);this.t(1100,.03,'square',.015,0,.12)},
 star:function(k){var b=440*Math.pow(1.06,Math.min(k,12)*2);this.t(b,.3,'triangle',.11);this.t(b*1.25,.3,'triangle',.09,0,.07);this.t(b*1.5,.45,'sine',.08,0,.14)},
 shelter:function(){this.t(392,.25,'sine',.09);this.t(523,.35,'sine',.08,0,.1)},
 wet:function(){this.n(.6,.14,700);this.t(200,.3,'sine',.07,140)},

};

/* ---------- 1日の流れ ---------- */
var D=null,hand=[],selCard=null,busy=false,upto=6,noonMode=false,cards={};
function beginDay(d,first){S.day=d;D=DAYS[d];var t=dayType(d);S.sc=mk(t);S.plan=[null,null,null,null,null,null];S.res=[];S.read=null;S.noonRead=null;S.first=!!first;S.phase='plan';save();
  var n=d+1;overlay('<span class="no">'+n+'日目 / 5</span><h2>'+(d===4?'最終日':n+'日目の朝')+'</h2><p>'+D.txt+'</p>','気圧計を見る',function(){planDay(d,true)})}
function mkHand(sc){var nOut=0;for(var i=0;i<6;i++)if(!sc.wet[i])nOut++;var o=shuffle(OUT).slice(0,nOut),n=shuffle(IN).slice(0,6-nOut),h=[];
  o.forEach(function(c,i){h.push({id:'o'+i,k:'o',ic:c[0],nm:c[1]})});n.forEach(function(c,i){h.push({id:'i'+i,k:'i',ic:c[0],nm:c[1]})});return h}
function planDay(d,fresh1){D=DAYS[d];noonMode=false;upto=6;busy=false;selCard=null;var sc=S.sc;
  if(fresh1||!S.cards){S.cards=mkHand(sc);S.plan=[null,null,null,null,null,null];S.read=null}
  S.res=[];S.phase='plan';save();cards={};S.cards.forEach(function(c){cards[c.id]=c});
  $('hDay').textContent=(d+1)+'日目';$('hTime').textContent='6:00';updHud();
  drawScene(6);drawChart();
  var rs=readsFor(d,sc);$('readBox').classList.remove('hidden');
  $('reads').innerHTML=shuffle(rs).map(function(k){return '<button class="rd" data-k="'+k+'">'+READ[k].t+'</button>'}).join('');
  [].forEach.call($('reads').children,function(b){b.onclick=function(){if(busy)return;Snd.click();S.read=b.dataset.k;[].forEach.call($('reads').children,function(x){x.classList.toggle('sel',x===b)});updGo()}});
  var no=0,ni=0;S.cards.forEach(function(c){if(c.k==='o')no++;else ni++});
  $('slotLab').innerHTML='② 予定表にカードを置く（カード→時間の順にタップ）<br><small>今日の外の作業 <b>'+no+'件</b>・小屋の中の作業 <b>'+ni+'件</b></small>';
  $('legend').innerHTML=d===0?'外の作業は、雨に当たるとずぶぬれ。中の作業は、晴れている間にやると「晴れ間のむだ」。':'';
  $('planBox').classList.remove('hidden');hideMsg();$('goBtn').textContent='時間を進める ▶';
  drawSlots();drawHand();updGo();
  if(d===0&&fresh1)msg('1日目の朝','上の青い線が、前日18時から今までの<b>気圧</b>。ドラムに巻いた記録紙に、ペンが気圧を書きつづける。<br>まず①で、記録から読めることを選ぼう。',null,true)}
function drawScene(h){var sc=S.sc,i=h<6?-1:Math.min(5,Math.floor((h-6)/2)),wet=i>=0?sc.wet[i]:(sc.type==='steady'||sc.type==='fall'?0:1);var ci=Math.max(0,Math.min(8,Math.round((h+6)/3)));
  $('win').innerHTML=winSVG(wet?'rain':'fair',sc.cl[ci],h)+'<div id="winLbl">'+(h<=6?'朝 ':'')+hh(h)+'　'+(wet?'雨':(sc.cl[ci]>=9?'くもり':'晴れ'))+'</div>'}
function drawChart(){var d=S.day;$('chart').innerHTML=chartSVG(S.sc,upto,{step3:DAYS[d].step3});$('chartNote').textContent='前日18時〜'+hh(upto)+(DAYS[d].step3?'（3時間おき）':'');
  $('recs').innerHTML=recsHTML(S.sc,upto,DAYS[d].recs)}
function drawSlots(){var h='';for(var i=0;i<6;i++){var id=S.plan[i],c=id?cards[id]:null,r=S.res[i],lock=(noonMode&&i<3)||r!=null;
  h+='<button class="sl'+(c?' '+c.k:'')+(lock?' lock':'')+'" data-i="'+i+'"><span class="tm">'+(6+2*i)+'時〜</span>'+(c?'<span class="ic">'+c.ic+'</span><span class="nm">'+c.nm+'</span>':'<span class="ic" style="opacity:.3">＋</span>')+(r?'<span class="st'+(r.pop?' pop':'')+'">'+r.m+'</span>':'')+'</button>'}
  $('slots').innerHTML=h;
  [].forEach.call($('slots').children,function(b){b.onclick=function(){tapSlot(+b.dataset.i)}})}
function drawHand(){var used={};S.plan.forEach(function(id){if(id)used[id]=1});
  $('hand').innerHTML=S.cards.filter(function(c){return !used[c.id]}).map(function(c){return '<button class="cd '+c.k+(selCard===c.id?' sel':'')+'" data-id="'+c.id+'"><span class="ic">'+c.ic+'</span>'+c.nm+'<small style="opacity:.7">'+(c.k==='o'?'（外）':'（中）')+'</small></button>'}).join('');
  [].forEach.call($('hand').children,function(b){b.onclick=function(){if(busy)return;Snd.click();selCard=selCard===b.dataset.id?null:b.dataset.id;drawHand()}})}
function tapSlot(i){if(busy||S.res[i]!=null||(noonMode&&i<3))return;
  if(selCard){S.plan[i]=selCard;selCard=null;Snd.place()}
  else if(S.plan[i]){S.plan[i]=null;Snd.click()}
  else return;save();drawSlots();drawHand();updGo()}
function updGo(){var full=S.plan.every(function(x){return x}),r=noonMode?S.noonRead:S.read;$('goBtn').disabled=busy||!full||!r}
function updHud(){$('hStar').textContent=S.star}

/* ---------- 時間を進める ---------- */
function go(){if(busy)return;busy=true;updGo();Snd.init();hideMsg();$('readBox').classList.add('hidden');
  var from=noonMode?3:0,to=S.day===2&&!noonMode?3:6;S.phase='run';save();step(from,to)}
function step(i,to){if(i>=to){if(to===3){noon();return}dayEnd();return}
  var sc=S.sc,c=cards[S.plan[i]],wet=sc.wet[i],h1=6+2*i;
  // ペンが2時間分すすむ
  var t0=h1,k=0,iv=setInterval(function(){k++;upto=Math.min(18,t0+k);drawChart();drawScene(upto-1<6?6:upto-1);$('hTime').textContent=hh(upto);Snd.tick();
    if(k>=2){clearInterval(iv);result(i,c,wet);setTimeout(function(){step(i+1,to)},RM?250:700)}},RM?120:330);
  S.cur=i;markNow(i)}
function markNow(i){[].forEach.call($('slots').children,function(b,j){b.classList.toggle('now',j===i)})}
function result(i,c,wet){var m,good=false,rect=$('slots').children[i].getBoundingClientRect(),x=rect.left+rect.width/2,y=rect.top;
  if(c.k==='o'&&!wet){m='★';good=true;S.combo++;S.star++;S.maxCombo=Math.max(S.maxCombo,S.combo);Snd.star(S.combo);floatAt(x,y,c.nm+' 完了',S.combo>=4);embers(rect,10+S.combo*3)}
  else if(c.k==='i'&&wet){m='☂️';good=true;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);Snd.shelter();floatAt(x,y,'雨やどり成功',false);embers(rect,6)}
  else if(c.k==='o'&&wet){m='💦';S.combo=0;S.wetN++;Snd.wet();floatAt(x,y,'ずぶぬれ…',false)}
  else{m='☁️';S.combo=0;S.wasteN++;Snd.waste();floatAt(x,y,'晴れ間のむだ',false)}
  S.res[i]={m:m,ok:good,pop:1};save();updHud();drawSlots();markNow(i);S.res[i].pop=0}
function noon(){noonMode=true;busy=false;upto=12;S.phase='noon';save();drawChart();drawScene(12);$('hTime').textContent='12:00';
  var rs=DAYS[2].noonReads;$('readBox').classList.remove('hidden');$('readBox').querySelector('.lab').innerHTML='① 正午の気圧計。<b>午前とくらべて何が読める？</b>';
  $('reads').innerHTML=shuffle(rs).map(function(k){return '<button class="rd" data-k="'+k+'">'+READ[k].t+'</button>'}).join('');
  [].forEach.call($('reads').children,function(b){b.onclick=function(){if(busy)return;Snd.click();S.noonRead=b.dataset.k;[].forEach.call($('reads').children,function(x){x.classList.toggle('sel',x===b)});updGo()}});
  $('slotLab').innerHTML='② <b>午後の予定を組み直す</b>（12時〜の3枠。カードをタップで外して置き直せる）';
  msg('正午。気圧計の針が…','午前は記録どおり回復した。でも、ペンの線をよく見て。<br><b>ここ2〜3時間</b>の動きを読み、午後の3枠を組み直そう。',null,true);
  drawSlots();drawHand();updGo();markNow(-1)}
function dayEnd(){busy=false;markNow(-1);var sc=S.sc,allOk=S.res.every(function(r){return r&&r.ok}),rOk=S.read===sc.read,nOk=sc.noon?S.noonRead===sc.noon:true,d=S.day;
  S.readTot+=sc.noon?2:1;S.readOk+=(rOk?1:0)+(sc.noon&&nOk?1:0);
  var extra='',kk=0;
  if(allOk&&rOk&&S.first){kk+=15;window.Zukan&&Zukan.earn&&Zukan.earn(15,'hit')}
  if(sc.noon&&nOk&&S.res.slice(3).every(function(r){return r.ok})&&S.first){kk+=15;window.Zukan&&Zukan.earn&&Zukan.earn(15,'hit')}
  if(allOk&&rOk&&sc.type==='fall'&&!S.rule.fall){S.rule.fall=1;extra+='<p class="em" style="text-align:center">★ 規則を見つけた！<br>気圧が下がり続けると、天気はくずれていく</p>';window.Zukan&&Zukan.earn&&Zukan.earn(30,'rule')}
  if(allOk&&rOk&&sc.type==='rise'&&!S.rule.rise){S.rule.rise=1;extra+='<p class="em" style="text-align:center">★ 規則を見つけた！<br>気圧が上がり始めると、天気は回復していく</p>';window.Zukan&&Zukan.earn&&Zukan.earn(30,'rule')}
  var readTxt='';if(!rOk&&S.read){readTxt='<p style="font-size:14px">朝の読み：<b>'+READ[S.read].t+'</b><br>'+(READ[S.read].trap||'正しくは「'+READ[sc.read].t+'」。')+'</p>'}
  if(sc.noon&&!nOk&&S.noonRead){readTxt+='<p style="font-size:14px">正午の読み：<b>'+READ[S.noonRead].t+'</b><br>'+(READ[S.noonRead].trap||'正しくは「'+READ[sc.noon].t+'」。')+'</p>'}
  var why=dayWhy(sc);
  var grid='<div class="dayres">'+S.res.map(function(r,i){return '<div>'+(6+2*i)+'時<br><span style="font-size:18px">'+r.m+'</span></div>'}).join('')+'</div>';
  save();
  if(allOk){Snd.fan();S.dayPerfect++;
    var last=d===4;S.day=last?4:d+1;if(last){S.cleared=true;S.phase='clear';var tt=S.elapsed;var nb=!S.best||S.retries<S.best.retries||(S.retries===S.best.retries&&tt<S.best.time);if(nb)S.best={retries:S.retries,time:tt};save()}else{S.sc=null;save()}
    overlay('<span class="no">'+(d+1)+'日目 おわり</span><div class="stamp in">段取り上手</div>'+grid+'<p>'+why+'</p>'+readTxt+extra+(kk?'':''),last?'5日間をふりかえる':'夜が明ける ▶',function(){if(last)clearScreen(true);else beginDay(d+1,true)})}
  else{S.retries++;save();
    overlay('<span class="no">'+(d+1)+'日目 おわり</span><h2>'+(S.res.filter(function(r){return r.ok}).length)+' / 6 枠が成功</h2>'+grid+'<p>'+why+'</p>'+readTxt+'<p style="font-size:14px">この日を、<b>別の日の記録</b>でもう一度。</p>','もう一度（別の記録で）',function(){beginDay(d,false)})}}
function dayWhy(sc){var p6=Pat(sc,6),pm=Pat(sc,-6);
  if(sc.type==='steady')return '気圧は '+Math.min.apply(null,sc.P)+'〜'+Math.max.apply(null,sc.P)+'hPa で<b>ほぼ一定</b>。小さな上下はあっても、1日中晴れた。';
  if(sc.type==='fall')return '前日18時 '+pm+'hPa → 朝6時 '+p6+'hPa と<b>下がり続けていた</b>。雲量も増えていき、'+(6+2*sc.wet.indexOf(1))+'時ごろ雨が降り出した。<b>外の作業は朝のうちに</b>。';
  if(sc.type==='rise'){var lo=Math.min.apply(null,sc.P.slice(0,13));return '夜のうちに '+lo+'hPa まで下がり、そこから<b>上がり始めていた</b>。値はまだ低くても、雨は'+(6+2*sc.wet.indexOf(0))+'時ごろやんだ。<b>外の作業は雨がやんでから</b>。'}
  return '朝は気圧が<b>上がり始めて</b>いて回復へ。でも正午前から<b>じわじわ下がり続け</b>、16時ごろまた雨。正午の組み直しで、外の作業を早めに回すのが正解。'}
function clearScreen(nb){enterPlay();$('planBox').classList.add('hidden');hideMsg();
  var done=function(){overlay('<div class="stamp in">無事に下山</div><h2>山小屋の5日間</h2>'+
   '<table class="rec"><tr><td>クリアタイム</td><td>'+fmt(S.elapsed)+'</td></tr><tr><td>気圧の読みの的中</td><td>'+S.readOk+' / '+S.readTot+'</td></tr><tr><td>★（外の作業）</td><td>'+S.star+'</td></tr><tr><td>やり直した日</td><td>'+S.retries+'回</td></tr><tr><td>ずぶぬれ／晴れ間のむだ</td><td>'+S.wetN+'回／'+S.wasteN+'回</td></tr></table>'+
   (hasZ()?'<button class="btn small" id="ovBook" style="margin:6px">📖 図鑑</button>':''),'📝 確認テストへ',function(){startTest()});var b=$('ovBook');if(b)b.onclick=book};
  if(window.Zukan&&Zukan.mainClear&&!S.mainDone){S.mainDone=1;save();Zukan.mainClear({onClose:done})}else done()}

/* ---------- 札・演出 ---------- */
function overlay(html,btn,fn){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="paper">'+html+'<div style="margin-top:12px"><button class="btn lamp">'+btn+'</button></div></div>';
  document.body.appendChild(o);o.querySelector('.paper>div:last-child .btn').onclick=function(){Snd.init();Snd.click();o.remove();fn&&fn()}}
function msg(h,body,fn,noBtn){var w=$('msg');w.classList.remove('hidden');w.innerHTML='<h3>'+h+'</h3><div>'+body+'</div>'+(noBtn?'':'<div class="row"><button class="btn small lamp" id="mNext">つぎへ ▶</button></div>');if(!noBtn)$('mNext').onclick=function(){Snd.click();hideMsg();fn&&fn()}}
function hideMsg(){$('msg').classList.add('hidden')}
function floatAt(x,y,t,big){var d=document.createElement('div');d.className='float'+(big?' big':'');d.textContent=t;d.style.left=Math.max(60,Math.min(innerWidth-60,x))+'px';d.style.top=y+'px';$('fx').appendChild(d);setTimeout(function(){d.remove()},1300)}
function embers(r,n){if(RM)n=Math.min(n,3);for(var i=0;i<n;i++){var d=document.createElement('div');d.className='ember';var x=r.left+r.width*Math.random(),y=r.top+r.height*Math.random();d.style.left=x+'px';d.style.top=y+'px';$('fx').appendChild(d);
  var a=-Math.PI/2+(Math.random()-.5)*1.6,dist=40+Math.random()*80;if(d.animate)d.animate([{transform:'scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*dist+'px,'+Math.sin(a)*dist+'px) scale(.2)',opacity:0}],{duration:800+Math.random()*400,easing:'ease-out'});setTimeout((function(e){return function(){e.remove()}})(d),1250)}}
$('goBtn').onclick=go;

var lastT=performance.now();
function frame(now){var dt=Math.min(.25,(now-lastT)/1000);lastT=now;if(cur==='play'&&!document.hidden)S.elapsed+=dt;requestAnimationFrame(frame)}

/* ---------- 確認テスト ---------- */
var T={qs:[],i:0,ans:[]};
function startTest(){show('test');var nm=nameNow();$('tNameBox').classList.toggle('hidden',!!nm);T.qs=window.Quiz?Quiz.test():[];T.i=0;T.ans=[];
  if(!T.qs.length){$('tQ').textContent='問題データがありません';return}renderQ()}
function renderQ(){var q=T.qs[T.i];$('tNum').textContent='第 '+(T.i+1)+' 問 ／ '+T.qs.length;$('tQ').innerHTML=q.q;$('tFig').innerHTML=q.fig||'';$('tFb').innerHTML='';var A=$('tA');A.innerHTML='';
  if(q.t==='choice'){var box=document.createElement('div');box.className='choices';q.shown.forEach(function(c){var b=document.createElement('button');b.textContent=c;b.onclick=function(){if(T.ans[T.i]!==undefined)return;b.classList.add('sel');answer(c)};box.appendChild(b)});A.appendChild(box)}
  else if(q.t==='num'){A.innerHTML='<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off"><b>'+(q.unit||'')+'</b><button class="btn small lamp" id="numGo">こたえる</button></div>';
    $('numGo').onclick=function(){var v=$('numIn').value.trim();if(!v)return;answer(v.replace(/[０-９．－]/g,function(ch){return ch==='－'?'-':String.fromCharCode(ch.charCodeAt(0)-0xFEE0)}))}}
  else if(q.t==='order'){var seq=[];A.innerHTML='<div class="hint">正しい順にタップ</div><div class="choices" id="oPool"></div><div class="seq" id="oSeq"></div><div class="numrow"><button class="btn small" id="oReset">やり直す</button><button class="btn small lamp" id="oGo" disabled>こたえる</button></div>';
    var drawO=function(){var Pl=$('oPool');Pl.innerHTML='';q.shown.forEach(function(it){if(seq.indexOf(it)>=0)return;var b=document.createElement('button');b.textContent=it;b.onclick=function(){Snd.click();seq.push(it);drawO()};Pl.appendChild(b)});
      $('oSeq').innerHTML=seq.map(function(s,i){return '<div>'+(i+1)+'. '+s+'</div>'}).join('');$('oGo').disabled=seq.length!==q.shown.length};
    drawO();$('oReset').onclick=function(){seq=[];drawO()};$('oGo').onclick=function(){answer(seq.slice())}}}
function answer(a){var q=T.qs[T.i];if(T.ans[T.i]!==undefined)return;T.ans[T.i]=a;var ok=window.Quiz&&Quiz.check(q,a);Snd.init();ok?Snd.star(1):Snd.waste();
  $('tA').querySelectorAll('button,input').forEach(function(b){b.disabled=true});
  $('tFb').innerHTML='<div class="fb '+(ok?'o':'x')+'"><b class="m">'+(ok?'○':'×')+'</b>'+(ok?'':'正解：<b>'+Quiz.answer(q)+'</b><br>')+(q.ex||'')+
   '<div style="text-align:right;margin-top:6px"><button class="btn small lamp" id="tNext">'+(T.i+1<T.qs.length?'つぎへ ▶':'結果を見る')+'</button></div></div>';
  $('tNext').onclick=function(){Snd.click();T.i++;if(T.i<T.qs.length)renderQ();else finishTest()};$('tNext').scrollIntoView({block:'nearest'})}
function finishTest(){var qs=T.qs,answers=T.ans;var review=Quiz.review(qs,answers),marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length;
  var nm=nameNow()||$('tName').value.trim();if(nm){S.name=nm;save()}
  var test=window.GAME_MODE==='test';
  var recs=test?[['モード','確認テストだけ']]:[['クリアタイム',S.cleared?fmt(S.elapsed):'—'],['気圧の読みの的中',S.readOk+' / '+S.readTot],['外の作業の★',S.star+'個'],['やり直した日',S.retries+'回']];
  SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　気象とその変化　第10回',game:TITLE+' ～'+SUB+'～'+(test?'（確認テストのみ）':''),
    name:nm,score:score,total:qs.length,marks:marks,records:recs,review:review},function(){show('end')})}

/* ---------- 起動 ---------- */
function setMute(){$('mute').textContent=Snd.muted?'🔇':'🔊'}
$('mute').onclick=function(){Snd.muted=!Snd.muted;S.muted=Snd.muted;save();setMute();Snd.init();Snd.click()};setMute();
$('bStart').onclick=startNew;$('bCont').onclick=cont;$('bBook1').onclick=book;$('bBook2').onclick=book;
$('bAgain').onclick=function(){Snd.init();enterPlay();S.phase='plan';beginDay(4,false)};
$('bTop').onclick=function(){initTitle();show('title')};
function initTitle(){var sv=load();$('bCont').classList.toggle('hidden',!(sv&&(sv.day>0||sv.sc)));
  $('bBook1').classList.toggle('hidden',!hasZ());$('bBook2').classList.toggle('hidden',!hasZ());
  if(window.PLAYER_NAME){$('nameBox').classList.add('hidden')}else if(S.name)$('nameIn').value=S.name;
  $('ghost').textContent=S.best?'前回の自分：やり直し '+S.best.retries+'回・'+fmt(S.best.time):''}
window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]});
initTitle();
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
setInterval(function(){if(cur==='play')save()},10000);
window.__game={S:function(){return S},solve:function(){var sc=S.sc,from=noonMode?3:0;var outs=S.cards.filter(function(c){return c.k==='o'}),ins=S.cards.filter(function(c){return c.k==='i'});
   if(!noonMode){S.plan=[null,null,null,null,null,null];for(var i=0;i<6;i++){S.plan[i]=(sc.wet[i]?ins.shift():outs.shift()).id}S.read=sc.read}
   else{var rem=S.plan.slice(3).map(function(id){return cards[id]});var o2=rem.filter(function(c){return c.k==='o'}),i2=rem.filter(function(c){return c.k==='i'});for(var j=3;j<6;j++){var c=sc.wet[j]?i2.shift():o2.shift();if(!c)c=(i2.shift()||o2.shift());S.plan[j]=c.id}S.noonRead=sc.noon}
   drawSlots();drawHand();updGo()},wrong:function(){S.plan=S.plan.slice().reverse();S.read=S.sc.read;drawSlots();updGo()},go:go,noon:function(){return noonMode},phase:function(){return S.phase}};
requestAnimationFrame(frame);
if(window.GAME_MODE==='test'){startTest()}
})();
</script>
