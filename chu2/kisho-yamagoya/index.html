<!--
  山小屋の5日間 ～気圧と天気～（中2理科 気象 コマ10 / kisho-yamagoya / chu2-kisho-10）v2

  ■ 世界とメタファー: 「フェルトと布のアップリケでできた山小屋」。空も山も小屋も洗濯物も、切ったフェルトを
    縫いつけた手芸の絵本。山小屋の前には自記気圧計があり、その記録紙は刺しゅう布、ペンは針と赤い糸。
    時間が進むと針が気圧の線を「ひと針ずつ」縫っていく。プレイヤーは山小屋の番人の手（顔は描かない）になって、
    洗濯かごから物干しへ洗濯物をドラッグして干し、タップで取りこむ。
    気圧が下がり続けたら雨の前ぶれ→先回りして取りこむ。上がり始めたら回復のしるし→干す。1〜2hPaの小さな上下はいつものゆれ。
    道のり＝5日間を1日ずつ。集める＝乾かした洗濯物の布（柄）と、5日間の気圧の記録布。
  ■ 配色: 背景 #EDE4D3（麻布）／主 #4A6C6F（青緑のフェルト）／差し #E9A23B（からし色）。
    補色: れんが #B5533C（赤い糸）・こげ茶 #6B4A35・オリーブ #8A9A5B・空色フェルト #9DC3CF・雲の灰 #B9BDB8。
  ■ 書体: 見出し＝Zen Maru Gothic（900）／本文＝Klee One（手書きの教科書体）。
  ■ 画面の組み方: 全画面canvasのアップリケの風景が主役。PC・iPad横＝左に小屋、横長の物干しの前（右下）に大きな自記気圧計、
    左下に洗濯かごと乾いた棚。スマホ・iPad縦＝上に自記気圧計と空、下に物干し・かご・棚。
  ■ HUD: 左上＝布のタグ「◀ もどる」（縫い目つき）。右上＝からし色のフェルトのかけら・音。上中央＝日めくりの布（何日目・時刻）。
    Zukan.hud は使わず Zukan.state() で読む。
  ■ 音: 木のおもちゃのような柔らかい音（三角波・木琴）、布のはためき（ノイズ）、雨音。
  ■ 理科＝操作: 天気は気圧の変化に数時間おくれて変わる（下がり続け→約6時間後に雨／最低を過ぎて上がり始め→約1〜2時間で雨がやむ）。
    かけらは「下がり続けを根拠に、雨の前に取りこみを終えた」「上がり始めを根拠に、まだくもりのうちに干した」
    「小さなゆれで取りこまなかった」ときだけ。空振り・びしょぬれでは増えない。
  ■ 数値: 気圧の記録はすべて自作の例（実在の地点の記録ではない）。安定1018〜1022hPa、1日2回の小さな上下は約±0.5hPa、
    くずれる前は1時間に0.5〜0.8hPaずつ下がり続ける。
-->

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

に減っていった", "0のまま変わらなかった", "気圧とは関係なく毎時間でたらめに変わった"], "ex": "気圧が下がり続け天気がくずれていくとき、雲が広がり雲量が増えていくことが多い。", "kind": "judge", "level": 2, "id": "chu2-kisho-yamagoya-q009", "koma": "chu2-kisho-10", "fig": null}, {"t": "order", "q": "気圧の記録から、この後の天気の傾向を判断する手順を正しい順に並べよう。", "items": ["記録を時刻の順に並べる", "いちばん新しい数時間の変化の向き（上がる・下がる）を見る", "その向きが続いているのか、小さな上下なのかを見分ける", "天気がくずれるか回復するかの傾向を判断する"], "ex": "最新の変化の向きと、それが続いているかを見てから判断する。", "kind": "method", "level": 2, "id": "chu2-kisho-yamagoya-q010", "koma": "chu2-kisho-10", "fig": null}, {"t": "choice", "q": "図はある地点の2日分の気圧の記録。天気が最も悪かった（雨が強かった）と考えられるのはア〜エのどのころ？", "choices": ["イ", "ア", "ウ", "エ"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 170\" font-family=\"sans-serif\">\u003crect width=\"300\" height=\"170\" fill=\"#fbf3de\"/>\u003cline x1=\"40\" y1=\"142.0\" x2=\"290\" y2=\"142.0\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003ctext x=\"37\" y=\"146.0\" font-size=\"10\" text-anchor=\"end\" fill=\"#6b5842\">1000\u003c/text>\u003cline x1=\"40\" y1=\"131.7\" x2=\"290\" y2=\"131.7\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003cline x1=\"40\" y1=\"121.3\" x2=\"290\" y2=\"121.3\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003ctext x=\"37\" y=\"125.3\" font-size=\"10\" text-anchor=\"end\" fill=\"#6b5842\">1004\u003c/text>\u003cline x1=\"40\" y1=\"111.0\" x2=\"290\" y2=\"111.0\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003cline x1=\"40\" y1=\"100.7\" x2=\"290\" y2=\"100.7\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003ctext x=\"37\" y=\"104.7\" font-size=\"10\" text-anchor=\"end\" fill=\"#6b5842\">1008\u003c/text>\u003cline x1=\"40\" y1=\"90.3\" x2=\"290\" y2=\"90.3\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003cline x1=\"40\" y1=\"80.0\" x2=\"290\" y2=\"80.0\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003ctext x=\"37\" y=\"84.0\" font-size=\"10\" text-anchor=\"end\" fill=\"#6b5842\">1012\u003c/text>\u003cline x1=\"40\" y1=\"69.7\" x2=\"290\" y2=\"69.7\" stroke=\"#d8c6a0\" stroke-width=\".7\"/>\u003cline x1=\"40\" y1=\"5   function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

let AC=null,MG=null,rainN=null,rainG=null;
function ac(){if(AC)return AC;try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}catch(e){}return AC}
function tone(f,d,v,t0,type){if(!S.sound||!ac())return;const t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v||.15,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05)}
function noise(d,v,f,type){if(!S.sound||!ac())return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type=type||'bandpass';fl.frequency.value=f||800;g.gain.value=v||.15;s.connect(fl);fl.connect(g);g.connect(MG);s.start()}
function rainLoop(on){if(!ac())return;if(!rainN){const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;rainN=AC.createBufferSource();rainN.buffer=b;rainN.loop=true;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1500;rainG=AC.createGain();rainG.gain.value=0;rainN.connect(f);f.connect(rainG);rainG.connect(MG);rainN.start()}
 rainG.gain.setTargetAtTime(on&&S.sound?.06:0,AC.currentTime,.4)}

let fiberPat=null;
function fabPat(k,c){const s=24,t=mk(s,s),g=t.getContext('2d');g.fillStyle=c;g.fillRect(0,0,s,s);
 if(k==='gingham'){g.fillStyle='rgba(255,255,255,.35)';g.fillRect(0,0,s,s/2);g.fillRect(0,0,s/2,s);g.fillStyle='rgba(255,255,255,.3)';g.fillRect(0,0,s/2,s/2)}

 if(k==='plaid'){g.fillStyle='rgba(60,40,20,.25)';g.fillRect(0,8,s,5);g.fillRect(8,0,5,s);g.fillStyle='rgba(255,255,255,.45)';g.fillRect(0,19,s,1.5);g.fillRect(19,0,1.5,s)}
 if(k==='star'){g.fillStyle='#E9A23B';const st=(x,y,r)=>{g.beginPath();for(let i=0;i<10;i++){const q=i%2?r*.45:r;g.lineTo(x+Math.cos(i*Math.PI/5-Math.PI/2)*q,y+Math.sin(i*Math.PI/5-Math.PI/2)*q)}g.fill()};st(7,7,4);st(18,17,3)}
 if(k==='check'){g.fillStyle='rgba(255,255,255,.4)';g.fillRect(0,0,s/2,s/2);g.fillRect(s/2,s/2,s/2,s/2)}
 if(k==='leaf'){g.fillStyle='rgba(247,240,225,.75)';g.beginPath();g.ellipse(8,8,5,2.5,.7,0,7);g.ellipse(18,18,5,2.5,-.6,0,7);g.fill()}
 if(k==='plain'){g.strokeStyle='rgba(107,74,53,.12)';for(let i=0;i<s;i+=3){g.beginPath();g.moveTo(i,0);g.lineTo(i,s);g.stroke()}}
 return t}

 }
 L.pegs=[];for(let i=0;i<L.npeg;i++){const x=L.line.x0+(L.line.x1-L.line.x0)*(i+.5)/L.npeg;L.pegs.push({x,y:lineY(x)})}
 L.unit=Math.min((L.line.x1-L.line.x0)/L.npeg*.86,WIDE?H*.16:H*.085);

 if(!WIDE){a.style.left='';a.style.right='10px';a.style.top='';a.style.bottom='calc(10px + env(safe-area-inset-bottom))'}else{a.style.right='';a.style.bottom=''}}

function felt(path,col,o){o=o||{};cx.save();path();cx.shadowColor='rgba(70,45,25,.28)';cx.shadowBlur=o.sh==null?5:o.sh;cx.shadowOffsetY=o.sy==null?2.5:o.sy;cx.fillStyle=col;cx.fill();cx.shadowColor='transparent';
 if(o.pat){cx.save();cx.clip();cx.globalAlpha=o.pa==null?1:o.pa;cx.fillStyle=o.pat;cx.fill();cx.restore()}
 cx.lineWidth=2.2;cx.strokeStyle=col;cx.globalAlpha=.55;cx.setLineDash([1.2,1.6]);cx.stroke();cx.globalAlpha=1;cx.setLineDash([]);
 if(o.st!==false){cx.lineWidth=o.sw||1.6;cx.strokeStyle=o.st||'rgba(255,248,235,.8)';cx.setLineDash(o.dash||[5,4]);cx.stroke();cx.setLineDash([])}
 cx.restore()}
function rrp(x,y,w,h,r){return ()=>{cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}}
function fh(px){return '900 '+px+'px "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif'}
function fb(px){return '600 '+px+'px "Klee One","Hiragino Mincho ProN",serif'}
function cloudPath(x,y,r){return ()=>{cx.beginPath();cx.arc(x-r*.9,y+r*.2,r*.6,Math.PI*.5,Math.PI*1.5);cx.arc(x-r*.3,y-r*.25,r*.75,Math.PI,Math.PI*1.85);cx.arc(x+r*.55,y-r*.05,r*.62,Math.PI*1.3,Math.PI*.4+Math.PI*2);cx.lineTo(x-r*.9,y+r*.8);cx.closePath()}}
function buildStatic(){stat=mk(Math.round(W*DPR),Math.round(H*DPR));const s=stat.getContext('2d');s.setTransform(DPR,0,0,DPR,0,0);
 cx=s;try{
  const G=L.ground;
  // 遠い山
  const mt=(pts,col,snow)=>{felt(()=>{cx.beginPath();cx.moveTo(-10,G+10);pts.forEach(p=>cx.lineTo(p[0]*W,p[1]));cx.lineTo(W+10,G+10);cx.closePath()},col,{st:'rgba(255,255,255,.35)'});
   if(snow)snow.forEach(([x,y,w])=>felt(()=>{cx.beginPath();cx.moveTo(x*W,y);cx.lineTo(x*W+w*W*.5,y+w*W*.35);cx.lineTo(x*W+w*W*.25,y+w*W*.3);cx.lineTo(x*W,y+w*W*.42);cx.lineTo(x*W-w*W*.22,y+w*W*.3);cx.lineTo(x*W-w*W*.5,y+w*W*.35);cx.closePath()},'#F7F0E1',{st:'rgba(107,74,53,.3)'}))};
  const top=WIDE?H*.1:L.line.y-H*.06;
  mt([[0,G-(G-top)*.45],[.18,top+(G-top)*.12],[.36,G-(G-top)*.5],[.55,top],[.78,G-(G-top)*.55],[.92,top+(G-top)*.25],[1,G-(G-top)*.4]],'#7E97A0',[[.55,top,.08],[.18,top+(G-top)*.12,.06]]);
  mt([[0,G-(G-top)*.25],[.25,G-(G-top)*.5],[.45,G-(G-top)*.22],[.7,G-(G-top)*.42],[1,G-(G-top)*.2]],'#6F8F6A');
  // 地面（草原）
  felt(()=>{cx.beginPath();cx.moveTo(-10,G);for(let x=0;x<=W+20;x+=40)cx.quadraticCurveTo(x+20,G-8,x+40,G);cx.lineTo(W+10,H+10);cx.lineTo(-10,H+10);cx.closePath()},'#8A9A5B',{st:'rgba(255,255,255,.4)'});
  // 草の刺しゅう
  cx.strokeStyle='rgba(247,240,225,.55)';cx.lineWidth=1.5;for(let i=0;i<60;i++){const x=(i*97.3)%W,y=G+14+((i*53.1)%(H-G-10));cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-3,y-8);cx.moveTo(x,y);cx.lineTo(x+3,y-8);cx.stroke()}
  // 物干しの柱
  const l=L.line;[[l.x0,l.y],[l.x1,l.y]].forEach(([x,y],i)=>{if(WIDE&&i===0)return;felt(rrp(x-5,y-10,10,G-y+14,4),'#6B4A35',{st:'rgba(255,255,255,.35)'})});
  drawHut();
 }finally{cx=CX0}
}
function drawHut(){const h=L.hut,x=h.x,y=h.y,w=h.w,hh=h.h;const wallY=y+hh*.38;
 // 屋根の下の壁

 // 屋根
 felt(()=>{cx.beginPath();cx.moveTo(x-w*.04,wallY+4);cx.lineTo(x+w*.5,y);cx.lineTo(x+w*1.04,wallY+4);cx.closePath()},'#4A6C6F',{st:'rgba(255,255,255,.6)'});

 // まど（灯りは動的に）

 // とびら

 // 看板

/* ===== 状態 ===== */
let MODE='title',T=0,items=[],queue=[],line=[],busy=0,drag=null,parts=[],pointer={x:0,y:0},tNow=0,FF=false,DS=null,raining=false,lastRainIdx=-1;
function dayStart(d){return (d-1)*24+6}
function dayEnd(d){return (d-1)*24+18}
function newDay(d){T=dayStart(d);const D=DAYS[d];line=new Array(L.npeg).fill(null);queue=[];busy=T;
 items=D.items.map((k,i)=>({k,id:d*100+i,fab:FABRIC[(d*3+i*5)%FABRIC.length].k,dry:0,need:ITEM[k].need,soaked:false,state:'basket',peg:-1,readyAt:0,leaveAt:0,wetExp:0,wetRain:-1,flap:Math.random()*6}));
 DS={d,fabs:[],dried:0,wet:0,hours:0,lastTake:null,preOK:null,rains:[],calmOK:false,recOK:false,early:null,log:[]};
 raining=rainAt(T);lastRainIdx=rainIdx(T)}
const basketItems=()=>items.filter(it=>it.state==='basket');

/* ===== 操作 ===== */
function nearestPeg(x,y){let b=-1,bd=1e9;L.pegs.forEach((p,i)=>{if(line[i])return;const d=Math.hypot(x-p.x,(y-p.y)*.6);if(d<bd){bd=d;b=i}});return bd<L.unit*1.6?b:-1}
function itemRect(i){const it=line[i];if(!it)return null;const p=L.pegs[i],u=L.unit,I=ITEM[it.k];return {x:p.x-u*I.w/2,y:p.y,w:u*I.w,h:u*I.h}}
function inR(x,y,r,m){m=m||0;return r&&x>=r.x-m&&x<=r.x+r.w+m&&y>=r.y-m&&y<=r.y+r.h+m}
function hang(it,peg){if(line[peg]||it.state!=='basket')return;const at=Math.max(T,busy)+.1;busy=at;it.state='line';it.peg=peg;it.readyAt=at;line[peg]=it;sfx.hang();buzz(12);
 // 回復を先読み：上がり始めて2時間以上・まだくもり（雲量5以上）・雨はやんでいる
 if(!DS.recOK&&slope(T)>=.3&&cloud(T)>=5&&!rainAt(T)){DS.recOK=true;S.kRec++;const p=L.pegs[peg];earn(10,'predict',p.x,p.y);pop(p.x,p.y+L.unit*.6,'回復を先読み！','気圧が上がり始めた→まだくもりでも干しどき','t')}
 burstAt(L.pegs[peg].x,L.pegs[peg].y,8,'#E9A23B')}
function take(it){if(it.state!=='line'||it.leaveAt)return;const at=Math.max(T,busy)+.1;busy=at;it.leaveAt=at;it.takeSlope=slope(T);sfx.tap();
 const hd=T-(DS.d-1)*24;if(DS.d===1&&it.dry<1&&hd>=12&&hd<17)DS.panic=true;
 if(it.dry<1){const p=L.pegs[it.peg];pop(p.x,p.y+L.unit*.5,'乾くまで あと'+Math.ceil((1-it.dry)*100)+'%','','o')}}
function takeAll(){line.forEach(it=>{if(it)take(it)});}
cv.addEventListener('pointerdown',e=>{ac();const x=e.clientX,y=e.clientY;pointer.x=x;pointer.y=y;if(MODE!=='play')return;
 for(let i=0;i<L.npeg;i++){const r=itemRect(i);if(inR(x,y,r,10)){drag={k:'line',i,x,y,sx:x,sy:y,moved:false};cv.setPointerCapture(e.pointerId);return}}
 if(inR(x,y,L.basket,14)){const b=basketItems();if(!b.length){toast('かごは空っぽ。今日の洗濯物はここまで');return}drag={k:'basket',it:b[0],x,y,sx:x,sy:y,moved:false};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{const x=e.clientX,y=e.clientY;pointer.x=x;pointer.y=y;if(!drag)return;drag.x=x;drag.y=y;if(Math.hypot(x-drag.sx,y-drag.sy)>8)drag.moved=true});
cv.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(MODE!=='play')return;
 if(d.k==='basket'){let peg=d.moved?nearestPeg(d.x,d.y-L.unit*.3):line.findIndex(v=>!v);if(peg<0){if(!d.moved)toast('物干しがいっぱい');return}hang(d.it,peg)}
 else{const it=line[d.i];if(!it)return;if(!d.moved||inR(d.x,d.y,L.basket,30)||inR(d.x,d.y,L.shelf,30)||d.y>L.pegs[d.i].y+L.unit*1.6)take(it)}});
cv.addEventListener('pointercancel',()=>{drag=null});
addEventListener('keydown',e=>{if(MODE!=='play')return;if(e.key===' '){const b=basketItems(),p=line.findIndex(v=>!v);if(b.length&&p>=0)hang(b[0],p)}else if(e.key==='a')takeAll();else if(e.key==='f')toggleFF()});
function toggleFF(){FF=!FF;$('#bFF').classList.toggle('on',FF);$('#bFF').textContent=FF?'▶ ふつう':'▶▶ 早送り'}

/* ===== 時間を進める ===== */
const HR=14;// 1時間＝14秒
function update(dt){if(MODE==='play'){const dg=dt/HR*(FF?3:1);step(dg)}else if(MODE==='night'){nightStep(dt)}}
function step(dg){const d=DS.d,end=dayEnd(d);const T0=T;T=Math.min(end,T+dg);S.t+=dg*HR;
 const R=rainAt(T),ri=rainIdx(T);
 // 雨の始まり
 if(R&&!raining){onRain(ri)}
 raining=R;rainLoop(R&&MODE==='play');
 line.forEach((it,i)=>{if(!it)return;

 if(o.shake)cv.animate([{transform:'translate(0,0)'},{transform:'translate('+o.shake+'px,'+(-o.shake*.6)+'px)'},{transform:'translate('+(-o.shake*.8)+'px,'+(o.shake*.5)+'px)'},{transform:'translate(0,0)'}],{duration:240});
 if(o.flash)$('#flash').animate([{opacity:o.flash*.55},{opacity:0}],{duration:400,easing:'ease-out'})}
function driedFx(c){const u=Math.pow(2,Math.min(c-1,9)*2/12);[659,784,988].forEach((f,i)=>tone(f*u,.25,.1,i*.06));if(c>=3)tone(1319*u,.35,.08,.2);
 const x=L.shelf.x+L.shelf.w/2,y=L.shelf.y;fx({shake:c>=3?5:3,flash:.28,vib:[15,25,15]});setTimeout(()=>ptx('+1枚',x+30,y-10),120);
 if(c>=2&&GD){const big=c>=STAGES[1],mid=c>=STAGES[0];const w=c>=STAGES[2]?'番人の達人！':big?'ふかふか！':mid?'いい天気読み！':'';
  setTimeout(()=>GD.cheer(c+'枚 連続でかわいた'+(w?'　'+w:''),{x:W/2,y:H*(WIDE?.18:.13),size:.62+Math.min(c,8)*.08,color:big?'#B5533C':mid?'#E9A23B':'#4A6C6F',sparks:mid?22:10,sound:false}),260);
  if(STAGES.includes(c)){burstAt(W/2,H*.3,40,'#E9A23B');sfx.good()}}}
function comboBreak(c){if(c<2||!GD)return;const nx=STAGES.find(k=>k>c)||c+1;setTimeout(()=>GD.cheer('あと'+(nx-c)+'枚で '+nx+'枚連続だった！',{x:W/2,y:H*(WIDE?.24:.18),size:.55,color:'#4A6C6F',sparks:false,sound:false}),600)}

 items=['socks','towel'].map((k,i)=>({k,id:900+i,fab:FABRIC[i*3].k,dry:0,need:ITEM[k].need,soaked:false,state:'basket',peg:-1,readyAt:0,leaveAt:0,wetExp:0,wetRain:-1,flap:Math.random()*6}));
 DS.tut=true;if(FF)toggleFF();show('hud');$('#act').classList.remove('hidden');MODE='play';if(HELP)HELP.show()}

if(GD){
 GD.setup({
  theme:{bg:'#F7F0E1',fg:'#3d2a1d',accent:'#B5533C',accentText:'#fff',font:'"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif',bodyFont:'"Klee One","Hiragino Mincho ProN",serif',
   radius:16,texture:'grain',line:'#6B4A35',dim:'rgba(60,40,25,.45)',shadow:'0 0 0 3px #F7F0E1,0 0 0 5px #4A6C6F,0 6px 0 rgba(60,40,25,.3)',outline:'#F7F0E1',hand:'#F7F0E1',handLine:'#6B4A35'},
  sfx:k=>{ac();({step:()=>sfx.hang(),done:()=>sfx.good(),clear:()=>sfx.fan(),open:()=>sfx.tap(),close:()=>sfx.tap(),cheer:()=>tone(988,.2,.08),nudge:()=>sfx.stitch()}[k]||sfx.tap)()},

 const on=()=>MODE==='play'&&DS&&DS.tut;

 HELP=GD.help({title:'山小屋の5日間',

 GD.tutorialButton('#bHow',()=>{ac();sfx.tap();if(!S.started){S.name=$('#nameIn').value.trim()||S.name;S.started=true;save()}GD.tutorial(PRACTICE)});
