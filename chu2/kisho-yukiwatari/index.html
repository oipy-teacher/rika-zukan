<title>雪原わたりの足型 ～力と面積～</title>
<!--
  雪原わたりの足型 ～力と面積～（中2理科 気象 コマ2 / kisho-yukiwatari / chu2-kisho-02・予想用）v2

  ■ 世界とメタファー: 「クレヨンとパステルで描いた画用紙の絵日記」。ざらついた画用紙に、紺のクレヨンの線、
    雪は白と水色のパステルでこすった面。旅人（後ろ姿・顔は描かない）が雪原をわたって、明かりのともる村へ向かう。
    旅人の持ち物は「れんが（20×10×5 cm・重さ20 N）」1つと小石（1個10 N）。雪に足場を刻むたびに、れんがを
    ころがして下の面を選び、小石をのせて重さを決め、雪の上へ「そっと置く」。雪の断面（拡大図）がへこみ、
    押した面の形の「足型」が画用紙の雪原にくっきり残る。
  ■ 遊びの核: スタンプ押し（押す面を選んで跡を刻む）。1歩ごとに、雪の「前の人の足あと（力・面積・深さ）」が見本として
    出る。へこみは「力÷面積」に比例するので、見本との比で考えれば一発で「ちょうどいい帯」に入れられる。
    深すぎると「ずぼっ」と落ち、浅すぎると足型がかすれて消える（ぬくもり−1）。
  ■ 予想用のコマ: 途中の「実験小屋」で、スポンジの実験の組をスタンプ台で組み立てる。「重さをそろえて面だけ変えた組」
    （2軒目は「面をそろえて重さだけ変えた組」）にだけ報酬。スポンジのへこみは布でかくし、見せない。
    最後に村の理科室で、本物のれんがを3つの面で置いたときのへこみを、粘土に指を押しこんで予想し、封蝋で封印する
    （localStorage rika-zukan:chu2:seal:chu2-kisho-02）。答え合わせは理科室の本物の実験で。
  ■ 道のり: 8ページの雪原（はじまりの雪 → 回せないれんが〔縛り: 石だけ〕 → ふたつの手がかり → 実験小屋1 → ひと晩たった雪
    → 逆転の谷〔山場: 重い荷物＋広い面は、軽い＋細い面より沈まない〕 → 実験小屋2 → こおった川〔ささる深さ〕 → 新雪の森
    → 吹雪の峠〔最終・日暮れまでのタイムアタック〕 → 村の理科室〔封印〕）。
    集める: 道具図鑑（かんじき・スキー板・ラクダの足・そり・キャタピラ・画びょう・くぎ・スパイク）。規則で決まる箱で開く。
  ■ ハマる仕組み: 主⑩「村に着くまで終われません」（はじめの2歩は押してある進捗）／副㉑縛り・③開封。
  ■ 配色: 画用紙 #F7F5F0／紺のクレヨン #2B4C7E／朱のクレヨン #E4572E。雪のパステル #dfe9f3・#b9cde2、れんが #c46a4a。
  ■ 書体: 見出し＝Hachi Maru Pop（子どもの手書きのような丸文字）。本文＝Klee One（鉛筆の手書きのような文字）。
  ■ 画面の組み方: 全画面canvasが主役。PC横長＝横長の実験台（左に小石のかご、中央に雪の断面とれんが、右に見本の札）、
    下の帯に雪原の道（足型が並び、右の村へ）。スマホ縦＝上に雪原の道の帯、中央に雪の断面を大きく、下にかごと「置く」。
  ■ HUD: ぬくもり＝ココアのマグ3つ、かけら＝「雪の結晶」（Zukan.state()）。ボタンはクレヨンでぬった形。もどる＝左上の朱の札。
  ■ 音: 木琴（マリンバ）の音、雪を踏む「さくっ」、落ちる「ずぼっ」、箱を開ける鈴。
-->

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);

      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

板が雪をとかすから", "雪をおす力が大きくなるから"], "ex": "体重（力）は同じでも、面積が大きいと面積あたりの力が小さくなる。かんじきも同じしくみ。", "fig": null, "kind": "judge", "level": 2}, {"id": "chu2-kisho-yukiwatari-q011", "koma": "chu2-kisho-02", "t": "num", "q": "表は、同じ物体で同じ力をかけ、ふれる面積だけを変えたときのへこみ。面積を 80 cm² にすると、へこみは何 mm と考えられる？", "ans": 1.5, "unit": "mm", "tol": 0.1, "ex": "面積が2倍になるごとにへこみは半分。40 cm²で3 mmなので、80 cm²では1.5 mm。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 110\" font-family=\"sans-serif\">\u003crect width=\"280\" height=\"110\" fill=\"#fff\"/>\u003cg stroke=\"#1f2a44\">\u003crect x=\"5\" y=\"5\" width=\"270\" height=\"100\" fill=\"none\" stroke-width=\"2\"/>\u003cline x1=\"5\" y1=\"38\" x2=\"275\" y2=\"38\"/>\u003cline x1=\"5\" y1=\"71\" x2=\"275\" y2=\"71\"/>\u003cline x1=\"95\" y1=\"5\" x2=\"95\" y2=\"105\"/>\u003cline x1=\"155\" y1=\"5\" x2=\"155\" y2=\"105\"/>\u003cline x1=\"215\" y1=\"5\" x2=\"215\" y2=\"105\"/>\u003c/g>\u003cg text-anchor=\"middle\" font-size=\"14\">\u003ctext x=\"50\" y=\"27\" font-weight=\"700\">ふれる面積\u003c/text>\u003ctext x=\"125\" y=\"27\">10 cm²\u003c/text>\u003ctext x=\"185\" y=\"27\">20 cm²\u003c/text>\u003ctext x=\"245\" y=\"27\">40 cm²\u003c/text>\u003ctext x=\"50\" y=\"60\" font-weight=\"700\">へこみ\u003c/text>\u003ctext x=\"125\" y=\"60\">12 mm\u003c/text>\u003ctext x=\"185\" y=\"60\">6 mm\u003c/text>\u003ctext x=\"245\" y=\"60\">3 mm\u003c/text>\u003ctext x=\"140\" y=\"94\" font-size=\"12\">（どれも同じ物体・同じ力でおした）\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2}, {"id": "chu2-kisho-yukiwatari-q012", "koma": "chu2-kisho-02", "t": "choice", "q": "A：60 N の力を 30 cm² で受ける。B：40 N の力を 10 cm² で受ける。1 cm² あたりの力が大きいのはどちら？", "choices": ["B", "A", "同じ"], "ex": "Aは60÷30＝2 N、Bは40÷10＝4 N。力が小さいBの方が、面積あたりでは大きい。", "fig": null, "kind": "calc", "level": 2}, {"id": "chu2-kisho-yukiwatari-q013", "koma": "chu2-kisho-02", "t": "order", "q": "「面積とへこみ方の関係」を調べる実験。正しい順に並べよう。", "items": ["水を入れたペットボトルを、底を下にしてスポンジに置く", "へこんだ深さを定規で測る", "同じペットボトルを、キャップを下にしてスポンジに置く", "へこんだ深さを測り、2つを比べる"], "ex": "力（同じペットボトル）はそろえ、面積だけを変えて、それぞれのへこみを測ってから比べる。", "fig": null, "kind": "method", "level": 2}, {"id": "chu2-kisho-yukiwatari-q014", "koma": "chu2-kisho-02", "t": "choice", "q": "同じ直方体をA・Bのように置いた。スポンジのへこみ方はどうなる？", "choices": ["Bの方が深い", "Aの方が深い", "同じ"], "ex": "Aは力2こ分を広い面（せまい面の4倍）で受けるので2÷4＝0.5。Bは力1こ分をせまい面で受けるので1÷1＝1。Bの方が面積あたりの力が大きく、深くへこむ。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 130\" font-family=\"sans-serif\">\u003crect x=\"10\" y=\"95\" width=\"120\" height=\"22\" rx=\"3\" fill=\"#f3d36b\" stroke=\"#8a6d1f\"/>\u003crect x=\"30\" y=\"55\" width=\"80\" height=\"20\" fill=\"#7aa0c4\" stroke=\"#1f2a44\"/>\u003crect x=\"30\" y=\"75\" width=\"80\" height=\"20\" fill=\"#7aa0c4\" stroke=\"#1f2a44\"/>\u003ctext x=\"70\" y=\"128\" text-anchor=\"middle\" font-size=\"14\">A：2こ重ねて、広い面を下\u003c/text>\u003crect x=\"150\" y=\"95\" width=\"120\" height=\"22\" rx=\"3\" fill=\"#f3d36b\" stroke=\"#8a6d1f\"/>\u003crect x=\"200\" y=\"15\" width=\"20\" height=\"80\" fill=\"#7aa0c4\" stroke=\"#1f2a44\"/>\u003ctext x=\"210\" y=\"128\" text-anchor=\"middle\" font-size=\"14\">B：1こ、せまい面を下\u003c/text>\u003ctext x=\"140\" y=\"12\" text-anchor=\"middle\" font-size=\"11\">同じ直方体（広い面の面積はせまい面の4倍）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

let AC=null,MG=null,NB=null;
function ac(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=S.sound?.55:0;MG.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function setSnd(){if(MG)MG.gain.value=S.sound?.55:0;$('bSnd1').textContent=S.sound?'音 あり':'音 なし';$('bSnd').textContent=S.sound?'♪':'✕'}
function toggleSnd(){ac();S.sound=!S.sound;save();setSnd()}
function mar(f,t0,dur,vol){if(!AC)return;t0=t0||AC.currentTime;dur=dur||.5;const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();o.type='sine';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*3.98;
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.22,t0+.005);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);g2.gain.setValueAtTime(.08,t0);g2.gain.exponentialRampToValueAtTime(.0005,t0+.08);
 o.connect(g);o2.connect(g2);g.connect(MG);g2.connect(MG);o.start(t0);o2.start(t0);o.stop(t0+dur+.05);o2.stop(t0+.12)}
function nz(t0,dur,f,vol,type,q){if(!AC)return;const s=AC.createBufferSource();s.buffer=NB;const bp=AC.createBiquadFilter();bp.type=type||'lowpass';bp.frequency.value=f;bp.Q.value=q||.7;const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+dur);s.connect(bp);bp.connect(g);g.connect(MG);s.start(t0);s.stop(t0+dur+.02)}
const sfx={
 tap(){if(!AC)return;mar(784,0,.25,.12)},
 roll(){if(!AC)return;const t=AC.currentTime;nz(t,.12,900,.25,'bandpass',2);nz(t+.1,.12,700,.2,'bandpass',2)},
 stone(){if(!AC)return;const t=AC.currentTime;mar(392,t,.18,.1);nz(t,.05,2500,.15,'bandpass',3)},
 crunch(){if(!AC)return;const t=AC.currentTime;for(let i=0;i<5;i++)nz(t+i*.035,.06,1800+Math.random()*1200,.18,'bandpass',1.5)},
 good(c){if(!AC)return;const t=AC.currentTime,sc=[523,659,784,1047,1319,1568];const k=Math.min(c||1,3);for(let i=0;i<3+k;i++)mar(sc[i%6],t+.08*i,.6,.2)},
 zubo(){if(!AC)return;const t=AC.currentTime;nz(t,.5,300,.5,'lowpass');const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(60,t+.4);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.5)},
 faint(){if(!AC)return;const t=AC.currentTime;nz(t,.8,3000,.12,'highpass');mar(330,t+.1,.5,.1)},
 bell(){if(!AC)return;const t=AC.currentTime;[1319,1568,2093].forEach((f,i)=>mar(f,t+i*.09,.9,.13))},
 clear(){if(!AC)return;const t=AC.currentTime;[523,659,784,1047,784,1047,1319].forEach((f,i)=>mar(f,t+i*.1,.8,.18))},

};

const PATS={};
function crayonPat(color,light){const k=color+(light||'');if(PATS[k])return PATS[k];const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d');g.fillStyle=color;g.fillRect(0,0,96,96);
 g.globalAlpha=.35;g.strokeStyle=light||'#ffffff';g.lineWidth=1;for(let i=-96;i<192;i+=4){g.beginPath();g.moveTo(i,0);g.lineTo(i+50,96);g.stroke()}
 g.globalAlpha=1;g.globalCompositeOperation='destination-out';let s=5;const R=()=>{s=(s*16807)%2147483647;return s/2147483647};for(let i=0;i<520;i++){g.globalAlpha=.4+R()*.6;g.beginPath();g.arc(R()*96,R()*96,.4+R()*1.1,0,7);g.fill()}
 PATS[k]=cx.createPattern(c,'repeat');return PATS[k]}
let seedR=1;function sr(){seedR=(seedR*16807)%2147483647;return seedR/2147483647}
function rough(pts,seed,amp){seedR=seed||1;amp=amp||1.6;const out=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const n=Math.max(2,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/14));for(let j=0;j<n;j++){const t=j/n;out.push([a[0]+(b[0]-a[0])*t+(sr()-.5)*amp,a[1]+(b[1]-a[1])*t+(sr()-.5)*amp])}}return out}
function pathOf(g,pts,close){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));if(close!==false)g.closePath()}
function crFill(g,pts,color,light,seed){g.save();pathOf(g,rough(pts,seed,2));g.fillStyle=crayonPat(color,light);g.fill();g.restore()}
function crLine(g,pts,color,w,seed,close){g.save();g.strokeStyle=color;g.lineCap='round';g.lineJoin='round';for(let k=0;k<2;k++){g.globalAlpha=k?.55:.9;g.lineWidth=(w||2.6)*(k?.7:1);pathOf(g,rough(pts,(seed||1)+k*7,k?2.2:1.2),close);g.stroke()}g.restore()}
function crRect(g,x,y,w,h,fill,line,seed,light){const p=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];if(fill)crFill(g,p,fill,light,seed);if(line)crLine(g,p,line,2.6,seed)}
function pastel(g,x,y,r,color,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,color);gr.addColorStop(1,'rgba(255,255,255,0)');g.save();g.globalAlpha=a==null?1:a;g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.restore()}
function makePaper(){const c=document.createElement('canvas');c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#F7F5F0';g.fillRect(0,0,W,H);

 for(let i=0;i<(W*H)/60;i++){const x=R()*W,y=R()*H;g.fillStyle=R()<.5?'rgba(120,110,95,.07)':'rgba(255,255,255,.5)';g.fillRect(x,y,1.2,1.2)}
 for(let i=0;i<40;i++){pastel(g,R()*W,R()*H,60+R()*160,R()<.5?'rgba(223,233,243,.55)':'rgba(240,232,220,.45)')}

 return c}

/* 1歩の問題（見本と帯）を作る */
function ratio(f,n){return force(n)/FACE[f].a}
function makeStep(sd,i){const s=sd.s[sd.vary?Math.min(i,sd.s.length-1):Math.floor(Math.random()*sd.s.length)];
 if(sd.script){const sc=sd.script[i];const tr=ratio(sc.f,sc.n),rr=ratio(sc.rf,sc.rn);return {s,tf:sc.f,tn:sc.n,d:s*tr,ref:{f:sc.rf,n:sc.rn,d:s*rr}}}
 const combos=[];(sd.faces).forEach(f=>{for(let n=sd.st[0];n<=sd.st[1];n++){const d=s*ratio(f,n);if(d>=2.5&&d<=34)combos.push({f,n,d})}});
 let pick=null;for(let k=0;k<40&&!pick;k++){const c=combos[Math.floor(Math.random()*combos.length)];if(!c)break;
  if(sd.ice&&c.f!=='small')continue;if(sd.heavy&&c.f==='small')continue;if(P&&P.prevRatio&&Math.abs(ratio(c.f,c.n)-P.prevRatio)<1e-9&&k<30)continue;pick=c}
 if(!pick)pick=combos[0]||{f:'big',n:0,d:s*.1};
 // 見本: 目標と1つだけちがう（面か重さ）置き方で、深さが別のもの
 const rc=[];FORDER.forEach(f=>{for(let n=0;n<=4;n++){const d=s*ratio(f,n);if(d<1.5||d>40)continue;if(Math.abs(d-pick.d)<1e-6)continue;const one=(f===pick.f)!==(n===pick.n);rc.push({f,n,d,one})}});
 const pref=rc.filter(x=>x.one);const pool=pref.length?pref:rc;const ref=pool[Math.floor(Math.random()*pool.length)];
 return {s,tf:pick.f,tn:pick.n,d:pick.d,ref}}
function band(d){return [d*.875,d*1.125]}

function compare(){if(P.phase!=='ready')return;const A=P.slots[0],B=P.slots[1],goal=P.sd.goal;P.checks++;

 crFill(cx,[[L.sx-60,L.ST+L.SH-4],[L.sx+L.SW+60,L.ST+L.SH-4],[L.sx+L.SW+80,L.ST+L.SH+18],[L.sx-80,L.ST+L.SH+18]],'#b98a5a','#d8ae80',201);
 drawTrail(cx,t);
 if(P.sealing){drawSeal(cx,t)}
 else if(P.hut){drawHut(cx,t)}
 else{const g=brickGeom();const dep=P.phase==='ready'||P.phase==='fall'?Math.max(0,P.drop-26)/L.kmm:Math.min(P.sink,39);
  drawSnow(cx,L.sx,L.ST,L.SW,L.SH,dep*L.kmm,g.x,g.x+g.w,'snow');
  drawRuler(cx,L.sx+L.SW+10,L.ST,L.SH,P.q,P.phase==='good'||P.phase==='bad'?Math.min(P.sink,40):null);
  if(P.phase==='bad'&&actualDepth()>band(P.q.d)[1]){pastel(cx,g.cxm,L.ST+P.sink*L.kmm,60,'rgba(43,76,126,.25)')}
  drawBrick(cx,g,P.brick.f,P.brick.n,P.phase==='bad'&&actualDepth()<band(P.q.d)[0]?.8:1,P.rollT||0);
  if(P.phase==='ready'){cx.save();cx.fillStyle='#2B4C7E';cx.font='600 14px "Klee One"';cx.textAlign='center';cx.fillText('下の面：'+FACE[P.brick.f].sh+'（'+FACE[P.brick.f].a+' cm²）',g.cxm,g.y-g.d-(P.brick.n?Math.ceil(P.brick.n/2)*16+22:10));cx.restore();
   // 下へ置く矢印
   const bob=Math.sin(t*5)*4;cx.save();cx.strokeStyle='rgba(228,87,46,.8)';cx.lineWidth=3;cx.beginPath();cx.moveTo(g.cxm+g.w/2+g.d+26,g.y+8+bob);cx.lineTo(g.cxm+g.w/2+g.d+26,g.bottom+14+bob);cx.stroke();cx.beginPath();cx.moveTo(g.cxm+g.w/2+g.d+19,g.bottom+6+bob);cx.lineTo(g.cxm+g.w/2+g.d+26,g.bottom+16+bob);cx.lineTo(g.cxm+g.w/2+g.d+33,g.bottom+6+bob);cx.stroke();cx.restore()}
  if(P.phase==='good'){// 上から見た足型
   const F=FACE[P.brick.f],sc=L.c*.9;const fx=L.land?L.sx-150:L.sx+L.SW-F.w*sc*.5-30,fy=L.land?L.ST+30:L.ST-40;}
 }
 drawBasketIf();
 if(L.land&&P&&!P.hut&&!P.sealing)drawNote(cx);
 // 飛ぶ小石（ドラッグ中）
 if(drag&&drag.kind==='stone'){const px=drag.x,py=drag.y;crFill(cx,[[px-13,py+6],[px-9,py-7],[px+9,py-8],[px+14,py+5],[px+4,py+10],[px-6,py+10]],'#8d99a8','#c3cbd6',150);crLine(cx,[[px-13,py+6],[px-9,py-7],[px+9,py-8],[px+14,py+5],[px+4,py+10],[px-6,py+10]],'#2B4C7E',2,151)}
 parts.forEach(p=>{cx.save();cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();cx.restore()});
 drawFlakes(t)}
function drawNote(g){const x=16,y=Math.max(230,L.ST-40),w=Math.min(300,L.sx-40),h=Math.min(L.bk.y-y-30,260);if(w<160||h<120)return;
 crFill(g,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],'#ffffff','#f4f7fb',801);crLine(g,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],'#2B4C7E',2.4,802);
 g.save();g.strokeStyle='rgba(43,76,126,.12)';g.lineWidth=1;for(let yy=y+34;yy<y+h;yy+=18){g.beginPath();g.moveTo(x+8,yy);g.lineTo(x+w-8,yy);g.stroke()}
 g.fillStyle='#2B4C7E';g.font='17px "Hachi Maru Pop"';g.textAlign='left';g.fillText('足型帳（上から見た形）',x+12,y+24);
 const pr=P.prints.slice(-4);const cw=(w-24)/2,ch=(h-44)/2;pr.forEach((p,i)=>{const F=FACE[p.f],sc=Math.min((cw-20)/20,(ch-30)/10);const cx0=x+12+(i%2)*cw+cw/2,cy0=y+40+Math.floor(i/2)*ch+ch/2-8;
  crFill(g,[[cx0-F.w*sc/2,cy0-F.d*sc/2],[cx0+F.w*sc/2,cy0-F.d*sc/2],[cx0+F.w*sc/2,cy0+F.d*sc/2],[cx0-F.w*sc/2,cy0+F.d*sc/2]],p.first?'#2B4C7E':'#6f8fbd','#8fa9cf',810+i);
  g.fillStyle='#2B4C7E';g.font='600 12px "Klee One"';g.textAlign='center';g.fillText(F.a+' cm²'+(p.first?' ★':''),cx0,cy0+F.d*sc/2+15)});
 if(!pr.length){g.fillStyle='rgba(43,76,126,.5)';g.font='600 13px "Klee One"';g.textAlign='center';g.fillText('うまく刻めた足型がここに残る',x+w/2,y+h/2)}
 g.restore()}
function drawBasketIf(){if(!P||P.sealing)return;if(!P.hut&&P.sd.st[1]===0){return}drawBasket(cx)}
function drawFlakes(t){cx.save();cx.fillStyle='rgba(255,255,255,.95)';cx.strokeStyle='rgba(43,76,126,.25)';flakes.forEach(f=>{cx.beginPath();cx.arc(f.x+Math.sin(t+f.p)*8,f.y,f.r,0,7);cx.fill();cx.stroke()});cx.restore()}
function drawTitleScene(t){// 雪原の大きな絵
 const hy=L.land?H*.42:H*.36;
 for(let i=0;i<6;i++){const x=W*(i/5);crFill(cx,[[x-W*.2,hy+30],[x,hy-H*.18-((i*53)%60)],[x+W*.2,hy+30]],i%2?'#b9cde2':'#c9d8e8','#ffffff',300+i)}
 crFill(cx,[[0,hy],[W*.3,hy-20],[W*.7,hy+10],[W,hy-10],[W,H],[0,H]],'#eef3f8','#ffffff',310);
 pastel(cx,W*.8,H*.14,90,'rgba(255,190,120,.55)');cx.save();cx.fillStyle='#ffb86b';cx.beginPath();cx.arc(W*.8,H*.14,26,0,7);cx.fill();cx.restore();
 village(cx,W*.82,hy+20,L.land?1.5:1.1,t);
 // 足型の道
 for(let i=0;i<16;i++){const f=FORDER[i%3],F=FACE[f],tt=i/15;const x=W*(.1+.62*tt),y=hy+H*.34*(1-tt)+((i%2)?-8:8);const sc=(1.3-tt*.8)*(L.land?1:.8);cx.save();cx.fillStyle='rgba(43,76,126,'+(.55-tt*.3)+')';cx.translate(x,y);cx.rotate(-.25);cx.fillRect(-F.w*sc/2,-F.d*sc/2,F.w*sc,F.d*sc);cx.restore()}
 traveler(cx,W*.68,hy+H*.04,L.land?1.6:1.2,t,Math.sin(t*3));
 cx.save();cx.translate(W*.16,hy+H*.24);cx.rotate(-.2);const g={x:-40,y:-20,w:80,h:20,d:18,bottom:0};drawBrickStatic(cx,g);cx.restore()}
function drawBrickStatic(g,geo){const x=geo.x,y=geo.y,w=geo.w,h=geo.h,d=geo.d;crFill(g,[[x,y],[x+d,y-d],[x+d+w,y-d],[x+w,y]],'#d98a6c','#f1b89c',61);crFill(g,[[x+w,y],[x+w+d,y-d],[x+w+d,y+h-d],[x+w,y+h]],'#a8553a','#c77758',62);crFill(g,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],'#c46a4a','#e0906e',63);crLine(g,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],'#2B4C7E',2.6,66)}
function drawHut(g,t){const hw=L.SW/2-10;for(let s=0;s<2;s++){const x=L.sx+s*(L.SW/2)+5,sl=P.slots[s];const geo=brickGeom(sl);
  drawSnow(g,x,L.ST,hw,L.SH*.6,0,geo.x,geo.x+geo.w,'sponge');
  {g.save();crFill(g,[[x-4,L.ST-6],[x+hw+4,L.ST-6],[x+hw+8,L.ST+L.SH*.6+4],[x-8,L.ST+L.SH*.6+4]],'#f0e3d0','#ffffff',400+s);g.fillStyle='#2B4C7E';g.font='600 14px "Klee One"';g.textAlign='center';g.fillText('へこみは 本物の実験で',x+hw/2,L.ST+L.SH*.3);g.restore()}
  drawBrick(g,geo,sl.f,sl.n,1,0);
  // 上から見た面の形
  g.fillStyle=P.sel===s?'#E4572E':'#2B4C7E';g.font='28px "Hachi Maru Pop"';g.textAlign='center';g.fillText(s?'B':'A',x+hw/2,geo.y-geo.d-(sl.n?Math.ceil(sl.n/2)*16+30:16));
  g.font='600 13px "Klee One"';g.fillText(FACE[sl.f].a+' cm²・'+force(sl.n)+' N',x+hw/2,L.ST+L.SH*.6+18);
  if(P.sel===s){crLine(g,[[x-6,geo.y-geo.d-60],[x+hw+6,geo.y-geo.d-60],[x+hw+6,L.ST+L.SH*.6+10],[x-6,L.ST+L.SH*.6+10]],'#E4572E',2.4,500)}}}
function drawSeal(g,t){const cs=clays();cs.forEach((c,i)=>{const dep=P.pred[i]*L.kmm*.6;const F=FACE[c.f];const fw=Math.min(c.w*.8,F.w*L.c*.55);
  drawSnow(g,c.x,c.y,c.w,c.h,dep,c.x+c.w/2-fw/2,c.x+c.w/2+fw/2,'clay');
  // 指
  if(P.hold===i){crFill(g,[[c.x+c.w/2-16,c.y+dep-70],[c.x+c.w/2+16,c.y+dep-70],[c.x+c.w/2+14,c.y+dep],[c.x+c.w/2-14,c.y+dep]],'#f2c9a8','#fbe3cf',600)}
  g.save();g.fillStyle='#2B4C7E';g.textAlign='center';g.font='600 14px "Klee One"';g.fillText(FACE[c.f].sh,c.x+c.w/2,c.y-52);g.fillText(F.a+' cm²',c.x+c.w/2,c.y-34);g.font='20px "Hachi Maru Pop"';g.fillStyle=P.pred[i]>0?'#E4572E':'#9aa6b8';g.fillText(P.pred[i]>0?'約 '+fmt(P.pred[i])+' mm':'長押し',c.x+c.w/2,c.y-12);g.restore();
  });
 if(P.phase==='sealed'){P.sealT=(P.sealT||0)+1/60;const a=Math.min(1,P.sealT*1.5);g.save();g.globalAlpha=a;crFill(g,[[L.cxm-120,L.ST-30],[L.cxm+120,L.ST-30],[L.cxm+120,L.ST+110],[L.cxm-120,L.ST+110]],'#f4ead3','#ffffff',700);crFill(g,[[L.cxm-120,L.ST-30],[L.cxm,L.ST+40],[L.cxm+120,L.ST-30]],'#e6d6b8',null,701);
  g.fillStyle='#b3261e';g.beginPath();g.arc(L.cxm,L.ST+40,26*Math.min(1,P.sealT*2),0,7);g.fill();g.fillStyle='#fff';g.font='18px "Hachi Maru Pop"';g.textAlign='center';g.fillText('封',L.cxm,L.ST+47);g.restore()}}

/* ===== 更新 ===== */
function update(dt,t){flakes.forEach(f=>{f.y+=f.v*dt;if(f.y>H+10){f.y=-10;f.x=Math.random()*W}});
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt*1.1});parts=parts.filter(p=>p.life>0);
 if(!P)return;if(P.rollT>0)P.rollT=Math.max(0,P.rollT-dt*4);
 if(MODE==='page'){S.t+=dt;if(P.time&&P.phase!=='fail'){const before=Math.ceil(P.time);P.time-=dt;if(Math.ceil(P.time)!==before)renderHUD();if(P.time<=0){P.time=0;P.phase='fail';P.cups=0;ovOpen('<div class="no">日が暮れた</div><h2>もう一度、峠の入口から</h2><p>見本とめやすの比を先に考えると、置くのが速くなる。</p>',[['もう一度','o',()=>startStage(P.i)],['地図へ','',()=>toMap()]])}}
  if(P.phase==='fall'){P.v+=900*dt;P.drop+=P.v*dt;const target=26+Math.min(actualDepth(),39)*L.kmm;if(P.drop>=26&&!P.hitSnow){P.hitSnow=true;sfx.crunch()}if(P.drop>=target){P.drop=target;P.sink=actualDepth();P.hitSnow=false;judge()}}
  if(P.phase==='good'){P.walk=(P.walk||0)+dt*2}
  if(toolQ.length&&$('ov').classList.contains('hidden')&&P.phase!=='fall'){toolQ.shift()()}}
 if(MODE==='seal'&&P.hold>=0&&P.phase==='ready'){P.pred[P.hold]=Math.min(38,P.pred[P.hold]+dt*7)}}

/* ===== 画面の切り替え ===== */
function show(w){['title','mapUI','hud','test'].forEach(id=>$(id).classList.add('hidden'));if(w==='title')$('title').classList.remove('hidden');if(w==='map')$('mapUI').classList.remove('hidden');if(w==='hud'){$('hud').classList.remove('hidden');$('bGo').classList.add('hidden');$('bPlace').classList.remove('hidden');$('msg').classList.add('hidden')}if(w==='test')$('test').classList.remove('hidden');
 const bb=$('bBack');const on=(w==='title'&&INHUB&&!TEST_ONLY)||w==='map'||w==='hud'||(w==='test'&&!TEST_ONLY);bb.classList.toggle('hidden',!on);bb.textContent=w==='title'?'◀ 一覧へ':'◀ もどる';$('bSnd').classList.toggle('hidden',w==='title')}
function ovOpen(html,btns){const o=$('ov');o.innerHTML='<div class="ovw"><div class="card">'+html+'<div class="btns"></div></div></div>';const b=o.querySelector('.btns');(btns||[]).forEach(x=>{const e=document.createElement('button');e.className='cb '+(x[1]||'');e.textContent=x[0];e.onclick=()=>{sfx.tap();x[2]()};b.appendChild(e)});o.classList.remove('hidden')}
function ovClose(){$('ov').classList.add('hidden');$('ov').innerHTML=''}
$('bBack').onclick=()=>{ac();sfx.tap();if(MODE==='title'){try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}return}
 const from=MODE;const msg=from==='test'?'確認テストは、次はさいしょから。雪原の進み具合は保存されています。':from==='map'?'進み具合は保存されます。タイトルにもどります。':'進み具合（わたったページ・道具図鑑）は保存されます。このページは次にはじめから。';
 const wasTime=P&&P.time;const hold=P;if(P&&P.time)P.phase=P.phase==='ready'?'pause':P.phase;
 ovOpen('<div class="no">もどる</div><h2>'+(from==='map'?'タイトルへもどる？':from==='test'?'テストをやめる？':'地図へもどる？')+'</h2><p>'+msg+'</p>',[['つづける','',()=>{ovClose();if(hold&&hold.phase==='pause')hold.phase='ready'}],[from==='map'||from==='test'?'タイトルへ':'地図へ','o',()=>{ovClose();if(from==='map'||from==='test')toTitle();else toMap()}]])};
$('bSnd').onclick=toggleSnd;$('bSnd1').onclick=toggleSnd;
function toTitle(){MODE='title';P=null;show('title');$('bCont').classList.toggle('hidden',!S.started);zkButtons()}
function zkButtons(){const has=!!(window.Zukan&&Zukan.openBook);document.querySelectorAll('.zk').forEach(b=>b.classList.toggle('hidden',!has))}
function openBook(){try{window.Zukan&&Zukan.openBook&&Zukan.openBook({unit:'kisho'})}catch(e){}}
function openGacha(){try{window.Zukan&&Zukan.openGacha&&Zukan.openGacha({box:'kisho'})}catch(e){}}
$('bBook1').onclick=openBook;$('bBook2').onclick=openBook;$('bGacha').onclick=openGacha;
$('bStart').onclick=()=>{ac();sfx.tap();const nm=$('nameIn').value.trim()||S.name,keep={sound:S.sound,tools:S.tools,paid:S.paid,best:S.best,mc:S.mc,seal:S.seal};S=fresh();Object.assign(S,keep);S.name=nm;S.started=true;save();openBrief(0)};
$('bCont').onclick=()=>{ac();sfx.tap();const v=$('nameIn').value.trim();if(v)S.name=v;save();toMap()};
function earn(n,why,key,x,y){if(key){if(S.paid[key])return 0;S.paid[key]=1;save()}let got=0;try{got=window.Zukan&&Zukan.earn?Zukan.earn(n,why,{x:x==null?W/2:x,y:y==null?H*.3:y}):0}catch(e){}return got}
function flashPop(t,x,y,cls){const d=document.createElement('div');d.className='pop '+(cls||'');d.textContent=t;d.style.left=Math.max(90,Math.min(W-90,x))+'px';d.style.top=Math.max(40,Math.min(H-40,y))+'px';$('pops').appendChild(d);setTimeout(()=>d.remove(),1500)}

/* ===== 確認テスト ===== */
let TS=null;function playerName(){return window.PLAYER_NAME||S.name||''}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function startTest(){if(!window.Quiz)return;ovClose();MODE='test';P=null;TS={qs:Quiz.test(),i:0,ans:[]};show('test');renderQ()}
function renderQ(){const q=TS.qs[TS.i],box=$('tbox');
 box.innerHTML='<div class="tno">確認テスト　第'+(TS.i+1)+'問 / '+TS.qs.length+'</div><div class="prog">'+TS.qs.map((_,i)=>'<i class="'+(i<TS.i?'on':'')+'"></i>').join('')+'</div><div class="tq">'+q.q+'</div>'+(q.fig?'<div class="fig2">'+q.fig+'</div>':'')+'<div id="ta"></div>';
 const ta=$('ta');
 if(q.t==='choice'){const d=document.createElement('div');d.className='ch';q.shown.forEach(c=>{const b=document.createElement('button');b.className='cb';b.innerHTML=c;b.onclick=()=>ans(c);d.appendChild(b)});ta.appendChild(d)}
 else if(q.t==='num'){ta.innerHTML='<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="数を入力"><b>'+esc(q.unit||'')+'</b><button class="cb o" id="numOk">決定</button></div>';$('numOk').onclick=()=>{const v=$('numIn').value.trim();if(v==='')return;ans(v)}}
 else{const picked=[];ta.innerHTML='<div style="font-size:14px">正しい順にタップしよう</div><div class="ord" id="ordBox"></div><div class="ch" id="ordPool"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="cb s" id="ordRe">やり直す</button><button class="cb o" id="ordOk" disabled>決定</button></div>';
  const drawO=()=>{$('ordBox').innerHTML=picked.map((t,i)=>'<div>'+(i+1)+'. '+t+'</div>').join('');const pool=$('ordPool');pool.innerHTML='';q.shown.forEach(t=>{if(picked.includes(t))return;const b=document.createElement('button');b.className='cb';b.innerHTML=t;b.onclick=()=>{picked.push(t);sfx.tap();drawO()};pool.appendChild(b)});$('ordOk').disabled=picked.length!==q.shown.length};
  drawO();$('ordRe').onclick=()=>{picked.length=0;drawO()};$('ordOk').onclick=()=>ans(picked.slice())}
 $('test').scrollTop=0}
function ans(v){TS.ans.push(v);sfx.tap();TS.i++;if(TS.i<TS.qs.length)renderQ();else finishTest()}
function finishTest(){const qs=TS.qs,review=Quiz.review(qs,TS.ans),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;sfx.clear();
 const pr=(S.pairs.face||[]).length+(S.pairs.force||[]).length;
 const recs=TEST_ONLY?[['モード','確認テストだけ']]:[['村までの足型',progSteps()+' / '+TOTAL_STEPS+' 歩'],['一発でぴったり',S.first+' 歩（置いた回数 '+S.tries+'）'],['条件をそろえた実験の組',pr+' 組'],['実験で確かめる予想',S.seal?S.seal.predText+'（根拠：'+S.seal.reason.t+'）':'（未記入）']];
 TS.card=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:UNIT,game:GTITLE+(TEST_ONLY?'（確認テストのみ）':''),name:playerName(),score,total:qs.length,marks,records:recs,review},showTestResult);showTestResult()}
function showTestResult(){const r=TS.card||{};$('tbox').innerHTML='<div class="tno">確認テスト</div><h2 style="font-family:var(--pop);font-weight:400;margin:6px 0">テストの結果</h2><p style="font-family:var(--pop);font-size:36px;margin:6px 0;color:#E4572E">'+(r.score!=null?r.score:0)+' / '+(r.total||TS.qs.length)+' 点</p><div style="display:flex;flex-direction:column;gap:8px"><button class="cb o" id="rCard">提出カードをもう一度見る</button><button class="cb n" id="rAgain">↺ テストをもう一度</button>'+(TEST_ONLY?'':'<button class="cb s" id="rTitle">タイトルへ</button>')+'<button class="cb s zk" id="rBook">📖 図鑑</button></div>';
 $('rCard').onclick=()=>SubmitCard.reopen(TS.card,()=>{});$('rAgain').onclick=()=>startTest();if($('rTitle'))$('rTitle').onclick=()=>toTitle();$('rBook').onclick=openBook;zkButtons()}

/* ===== ループ ===== */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;if(!(P&&P.phase==='pause'))update(dt,t);draw(t);requestAnimationFrame(loop)}
window.addEventListener('resize',()=>{resize();initFlakes()});
resize();initFlakes();
try{window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]})}catch(e){}
setSnd();
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nameRow').classList.add('hidden')}else if(S.name)$('nameIn').value=S.name;
window.__game={S:()=>S,P:()=>P,mode:()=>MODE,startStage,openBrief,toMap,startTest,tumble,addStone,removeStone,place,
 setBrick:(f,n)=>{const b=curBrick();b.f=f;b.n=n},answer:()=>P&&P.q&&{f:P.q.tf,n:P.q.tn},go:()=>$('bGo').click(),sel:s=>{P.sel=s},compare,
 press:(i,v)=>{P.pred[i]=v},reason:r=>{P.reason=r},seal:()=>sealIt()};
if(TEST_ONLY){startTest()}else toTitle();
requestAnimationFrame(loop);
