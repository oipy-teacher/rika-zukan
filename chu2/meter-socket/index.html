<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFF4D6">
<title>メーター・ソケット ～電流計と電圧計のつなぎ方～</title>
<!--
  メーター・ソケット ～電流計と電圧計のつなぎ方～　（ゲームID meter-socket ／ コマID chu2-denryu-01 ／ 予想用）
  2026-09-27 v2 ゼロから作り直し（割り当て表 通し1）

  【遊びの核】もぐら叩き。基板の「穴（ソケット）」がポコッと飛び出す。切れ目の穴には電流計Ⓐ（直列）、
    部品の両はしをまたぐ穴には電圧計Ⓥ（並列）を、弾倉で選んでからタップで打ちこむ。
    打ちこむとスイッチが入り、正しければ豆電球がパッと点いて針が目盛りにピタッと止まる。
    まちがえると、そのつなぎ方で本当に起きること（Ⓥを直列→豆電球がつかない／Ⓐを並列→大電流で振り切れ・バチッ／
    −端子が小さすぎ→振り切れ／＋−逆→針が左へ）が起き、理由が1行で出る。
    解禁の順: Ⓐだけ → Ⓥ → 電池をまたぐ穴（Ⓐはショート）→ 電流計の−端子（？なら5Aから・つなぎかえ）→ 電圧計の−端子（300Vから）
    → 目安「約◯」なら振り切れない一番小さい端子 → 並列の分かれ道 →〈山場〉＋端子の向き → ボス（3分タイムアタック）
    → 最終話: 実験で自分が組む回路に計器を置き、−端子と向きも決めて「封印」（予想用コマの計画書）
  【ハマる仕組み】主⑯1回1〜2分・すぐやり直せる（1話＝1枚の基板）／副⑤コンボ（連続正解で倍率・まちがいでリセット）・⑫ジュース
  【道のり×集める×美麗】懐中電灯編→ラジオ編→町の配電盤編と基板が大きくなる／1話ごとに「付録カード」（計器・部品）／
    網点と原色でパチンと光る回路
  【画風】ポップアート（アメコミの網点＝ベンデイ・ドット、原色、太い黒の輪郭、ずらした黒ベタの影、集中線・スターバースト、描き文字）。
    UI（ボタン・HUD・目次・テスト）も「コマの枠」「キャプション箱」「フキダシ」「描き文字」で描く。角丸・ピル型・ぼかし影は使わない。
  【世界とメタファー】アメコミの電子工作誌「月刊でんき工作」。タイトル＝表紙、ステージ選択＝目次、1話＝コマ割りされた基板のページ。
  【配色】紙 #FFF4D6／墨 #1B1B1B／赤 #E4002B（電流計・差し色）／黄 #FFD400（光）／青 #1E5BC6（電圧計）
  【書体】Reggae One（見出し・描き文字）／Bangers（欧文の擬音・数字）
  【全画面の構図】PC・iPad横＝左に広い基板（コマ割りのページ）、右端に縦の弾倉。スマホ・iPad縦＝上に基板、親指の届く下端に弾倉。
  【HUD】話数のキャプション箱・得点・コンボのスターバースト・かけら（Zukan.state()で読んで自分で描く）。基板の上端の電飾が進み具合。
  【音】WebAudio合成のコミック音（矩形波のザップ・ハンマーのガシャン・ベル）。ミュートあり
  【もどる】左上に常に黒いキャプション箱「◀ もどる」
  回路図の記号は電気用図記号（電池＝長い線が＋、豆電球＝○に×、抵抗器＝長方形、電流計＝○にA、電圧計＝○にV）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1B1B;--red:#E4002B;--yel:#FFD400;--blu:#1E5BC6;--crm:#FFF4D6;--wht:#FFFDF6;
  --fh:"Reggae One","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;--fe:Bangers,"Reggae One",sans-serif;
  --fb:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--crm);overscroll-behavior:none}
body{color:var(--ink);font-family:var(--fb);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;pointer-events:none;z-index:3}
.scr .pe,.scr button,.scr input{pointer-events:auto}
.hidden{display:none!important}
.dots{background-image:radial-gradient(circle,rgba(228,0,43,.28) 26%,transparent 28%);background-size:11px 11px}
.dotsb{background-image:radial-gradient(circle,rgba(30,91,198,.22) 26%,transparent 28%);background-size:10px 10px}

/* ===== ポップアートの部品（コマ枠・キャプション箱・描き文字） ===== */
.pop{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:52px;padding:0 22px;
  font:400 21px/1 var(--fh);letter-spacing:.04em;border:4px solid var(--ink);border-radius:0;background:var(--red);color:#fff;
  box-shadow:6px 6px 0 var(--ink);transform:rotate(-1.2deg);text-shadow:2px 2px 0 var(--ink)}
.pop:active{transform:rotate(-1.2deg) translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.pop.y{background:var(--yel);color:var(--ink);text-shadow:none;transform:rotate(.8deg)}
.pop.w{background:var(--wht);color:var(--ink);text-shadow:none;transform:rotate(.6deg)}
.pop.b{background:var(--blu);color:#fff}
.pop.k{background:var(--ink);color:var(--yel);text-shadow:none;box-shadow:5px 5px 0 var(--red)}
.pop.sm{min-height:46px;font-size:16px;padding:0 14px;box-shadow:4px 4px 0 var(--ink)}
.pop:disabled{background:#d9d2c0;color:#8a8373;text-shadow:none;cursor:default}
.capb{display:inline-block;background:var(--yel);border:3px solid var(--ink);padding:4px 10px;font:400 15px/1.35 var(--fh);box-shadow:4px 4px 0 var(--ink)}
.panel{position:relative;background:var(--wht);border:5px solid var(--ink);box-shadow:10px 10px 0 var(--ink)}
.panel::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(228,0,43,.12) 26%,transparent 28%);background-size:9px 9px;pointer-events:none}

#bBack{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));z-index:8;min-height:44px;height:44px;padding:0 14px;font-size:17px;box-shadow:4px 4px 0 var(--red)}
#hudCap{position:absolute;z-index:7;top:calc(10px + env(safe-area-inset-top));transform:rotate(-1.2deg);white-space:nowrap;max-width:calc(100vw - 200px);overflow:hidden;text-overflow:ellipsis;font-size:clamp(14px,1.6vw,19px)}
@media (orientation:portrait){#hudCap{max-width:calc(100vw - 244px)}}
#hudCap b{font-weight:400;color:var(--red);margin-right:.5em}
#bMute{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));z-index:8;width:48px;height:44px;min-height:44px;padding:0;font-size:20px}

/* ===== 表紙（タイトル） ===== */
#scrTitle .mast{position:absolute;left:0;right:0;top:0;height:calc(62px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:var(--red);border-bottom:5px solid var(--ink);display:flex;align-items:center;gap:14px;padding-left:18px;padding-right:74px;overflow:hidden}
#scrTitle .mast b{font:400 30px/1 var(--fh);color:var(--yel);text-shadow:3px 3px 0 var(--ink);letter-spacing:.06em;white-space:nowrap}
#scrTitle .mast span{font:700 13px/1.2 var(--fb);color:#fff;white-space:nowrap}
#scrTitle .mast i{margin-left:auto;font:400 26px/1 var(--fe);color:#fff;letter-spacing:.06em;text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.inhub #scrTitle .mast{padding-left:130px}
#tBlock{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.land #tBlock{left:4vw;top:calc(88px + env(safe-area-inset-top));bottom:4vh;width:44vw;justify-content:center}
.port #tBlock{left:5vw;right:5vw;bottom:calc(18px + env(safe-area-inset-bottom));align-items:stretch}
.tt{margin:0;font:400 clamp(44px,6.4vw,96px)/1.08 var(--fh);color:var(--yel);letter-spacing:.01em;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),7px 7px 0 var(--red),10px 10px 0 var(--ink)}
.port .tt{font-size:clamp(40px,12.6vw,74px);text-align:center}
.tt span{display:block;white-space:nowrap}
.tt span+span{margin-left:.9em}
.port .tt span+span{margin-left:0}
.tsub{align-self:flex-start;font-size:clamp(16px,2vw,22px);transform:rotate(-1.5deg)}
.port .tsub{align-self:center}
.nmrow{display:flex;align-items:center;gap:8px;background:var(--wht);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:6px 10px}
.nmrow label{font:400 15px var(--fh);white-space:nowrap}
.nmrow input{flex:1;min-width:0;border:0;border-bottom:3px dotted var(--ink);background:transparent;font:700 18px var(--fb);padding:6px 4px;outline:none}
.brow{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:center}
.port .brow{justify-content:center}
.port #bStart{flex:1 1 60%}

/* ===== 目次（マップ） ===== */
#scrMap{display:flex;flex-direction:column;padding:calc(62px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));gap:12px;overflow-y:auto}
#scrMap .mh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
#scrMap .mh h2{margin:0;font:400 clamp(26px,3.4vw,40px)/1 var(--fh);color:var(--ink);background:var(--yel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:6px 14px;transform:rotate(-1.5deg)}
#scrMap .mh small{font:700 13px var(--fb)}
#mGrid{display:grid;gap:12px;flex:1;min-height:0}
.land #mGrid{grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(118px,1fr)}
.port #mGrid{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(92px,auto)}
.ep{position:relative;text-align:left;border:4px solid var(--ink);background:var(--wht);box-shadow:5px 5px 0 var(--ink);padding:8px 10px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.ep .en{font:400 28px/1 var(--fe);color:var(--red);letter-spacing:.04em}
.ep .ek{font:700 11px var(--fb);background:var(--ink);color:#fff;padding:2px 6px;align-self:flex-start}
.ep .et{font:400 16px/1.25 var(--fh)}
.ep .ei{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 0}
.ep .ei svg{width:100%;height:100%;max-height:150px}
.port .ep .ei{display:none}
.ep .es{margin-top:auto;font:400 18px var(--fh);letter-spacing:.08em;color:var(--red)}
.ep.lock{background:#e9e2cf;color:#9a927d}
.ep.lock::after{content:"？";position:absolute;right:10px;top:4px;font:400 42px var(--fh);color:#c9c0a8}
.ep.cur{background:var(--yel)}
.ep.cur::before{content:"NEXT!";position:absolute;right:-4px;top:6px;background:var(--red);color:#fff;font:400 16px var(--fe);letter-spacing:.08em;padding:2px 10px;border:3px solid var(--ink);transform:rotate(8deg)}
.ep.done{background:var(--wht)}
#mCards{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#mCards b{font:400 15px var(--fh);margin-right:4px}
.cd{width:44px;height:56px;border:3px solid var(--ink);background:#e9e2cf;display:flex;align-items:center;justify-content:center;font:400 22px var(--fh);box-shadow:3px 3px 0 var(--ink);padding:0}
.cd.on{background:var(--yel)}
.mfoot{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ===== 話のおわり・確認・カード ===== */
.cen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(27,27,27,.35)}
.cen .panel{width:min(560px,94vw);max-height:92vh;overflow-y:auto;padding:22px 22px 20px}
.cen h2{position:relative;margin:0 0 10px;font:400 clamp(30px,5vw,46px)/1.05 var(--fh);color:var(--red);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.cen h2 small{display:block;margin-top:6px;font:700 15px/1.4 var(--fb);color:var(--ink);-webkit-text-stroke:0;text-shadow:none}
.cen p{position:relative;font:700 16px/1.6 var(--fb);margin:8px 0}
.stars{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stars span{border:3px solid var(--ink);padding:4px 8px;font:700 13px var(--fb);background:#e9e2cf}
.stars span.on{background:var(--yel)}
.stars span i{font-style:normal;color:var(--red);font-size:18px;margin-right:4px}
.recs{position:relative;display:flex;gap:10px 18px;flex-wrap:wrap;font:700 15px var(--fb);margin:6px 0 10px}
.recs b{font:400 24px var(--fe);letter-spacing:.04em;color:var(--red)}
.btns{position:relative;display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.card{position:relative;margin:10px auto 4px;width:220px;border:4px solid var(--ink);background:var(--yel);box-shadow:7px 7px 0 var(--ink);padding:10px;text-align:center;transform:rotate(-2deg)}
.card .cn{font:400 13px var(--fe);letter-spacing:.1em;color:var(--red)}
.card svg{display:block;margin:6px auto;background:var(--wht);border:3px solid var(--ink)}
.card .ct{font:400 20px var(--fh)}
.card .cx{font:700 12.5px/1.5 var(--fb);margin-top:4px;text-align:left}
.card.flip{animation:flip .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6)}100%{transform:rotate(-2deg)}}

/* ===== 確認テスト（読者クイズのページ） ===== */
#scrTest{overflow-y:auto;padding:calc(62px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}
.sheet{position:relative;margin:0 auto;max-width:1180px;display:grid;gap:18px}
.land .sheet{grid-template-columns:1.05fr 1fr;align-items:start}
.sheet .col{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead b{font:400 30px/1 var(--fe);letter-spacing:.06em;background:var(--red);color:#fff;border:4px solid var(--ink);padding:4px 12px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
.qhead span{font:400 16px var(--fh)}
#tLamps{display:flex;gap:5px;flex-wrap:wrap}
#tLamps i{width:20px;height:20px;border:3px solid var(--ink);background:var(--wht);border-radius:50%}
#tLamps i.cur{background:var(--yel)}#tLamps i.ok{background:var(--red)}#tLamps i.ng{background:#8e8e8e}
#tQ{position:relative;background:var(--wht);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px 18px;font:700 19px/1.6 var(--fb)}
#tQ::after{content:"";position:absolute;left:34px;bottom:-22px;border:12px solid transparent;border-top:14px solid var(--ink)}
#tFig{background:var(--wht);border:4px solid var(--ink);padding:8px;box-shadow:6px 6px 0 var(--ink)}
#tFig svg{display:block;width:100%;height:auto;max-height:42vh}
#tA{display:flex;flex-direction:column;gap:12px}
.ch{display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;border:4px solid var(--ink);background:var(--wht);box-shadow:5px 5px 0 var(--ink);padding:8px 12px;font:700 17px/1.45 var(--fb)}
.ch i{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--yel);border:3px solid var(--ink);font:400 20px var(--fe);font-style:normal}
.ch:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.ch.ok{background:var(--yel)}.ch.ok i{background:var(--red);color:#fff}
.ch.ng{background:#cfcfcf}
.numbox{display:flex;align-items:flex-end;gap:10px}
.numbox .v{flex:1;min-height:60px;border:4px solid var(--ink);background:var(--wht);font:400 40px/56px var(--fe);letter-spacing:.06em;padding:0 12px;box-shadow:5px 5px 0 var(--ink)}
.numbox .u{font:400 24px var(--fh)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{min-height:54px;border:4px solid var(--ink);background:var(--wht);font:400 26px var(--fe);box-shadow:4px 4px 0 var(--ink)}
.keys .go{grid-column:1/-1;background:var(--red);color:#fff;font:400 20px var(--fh)}
.ord{display:flex;flex-direction:column;gap:8px}
.ord .slot{display:flex;gap:10px;align-items:center;border:3px dashed var(--ink);background:var(--yel);padding:8px 10px;font:700 15px/1.4 var(--fb)}
.ord .slot i{font:400 22px var(--fe);font-style:normal;color:var(--red)}
#tEx{position:relative;background:var(--yel);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:12px 14px;font:700 16px/1.6 var(--fb)}
#tEx b{font:400 22px var(--fh);margin-right:8px}
#tNext{align-self:flex-end}
#scrEnd .big{position:relative;font:400 76px/1 var(--fe);color:var(--red);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
#scrEnd .big small{font-size:30px}

/* 計画（最終話）・封印 */
#planUI{position:absolute;z-index:4;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none}
#planUI .pe{pointer-events:auto}
#planMsg{max-width:min(620px,92vw);font-size:clamp(13px,1.5vw,16px)}
.sealbox{position:relative;border:4px solid var(--ink);background:var(--wht);padding:10px;margin:10px 0}
.sealbox svg{display:block;width:100%;height:auto}
.stamp{position:absolute;right:10px;top:8px;width:74px;height:74px;border:5px solid var(--red);color:var(--red);font:400 34px/64px var(--fh);text-align:center;transform:rotate(12deg);background:rgba(255,253,246,.8)}
.stars span.don{animation:don .42s cubic-bezier(.2,1.6,.4,1) both}
@keyframes don{0%{transform:scale(2.6) rotate(-14deg);opacity:0}60%{transform:scale(.9) rotate(3deg);opacity:1}100%{transform:none}}
.stars span.wait{opacity:0}
@media (prefers-reduced-motion: reduce){.card.flip{animation:none}.stars span.don{animation:none}}

/* 共通部品 Guide の「ひとこと」の1文字（class=ch）が、確認テストの選択肢 .ch の見た目を拾わないように */
.gd-cheer span.ch{display:inline-block;border:0;background:none;box-shadow:none;padding:0;margin:0;min-height:0;width:auto;height:auto;gap:0;font:inherit;color:inherit;text-align:inherit;filter:none;border-radius:0}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>

<div id="scrTitle" class="scr">
  <div class="mast"><b>月刊 でんき工作</b><span>中2理科<br>電流とその利用</span><i>No.01 ─ METER SOCKET</i></div>
  <div id="tBlock">
    <h1 class="tt"><span>メーター・</span><span>ソケット</span></h1>
    <div class="capb tsub">～電流計と電圧計のつなぎ方～</div>
    <div class="nmrow pe" id="nmRow"><label for="nameIn">読者名</label><input id="nameIn" maxlength="16" placeholder="なまえ（なくてもOK）" autocomplete="off"></div>
    <div class="brow"><button class="pop" id="bStart">はじめる！</button><button class="pop y" id="bCont">つづきから</button></div>
    <div class="brow"><button class="pop y sm" id="bHow">✋ あそびかた</button><button class="pop w sm" id="bBook1">📖 図鑑</button><button class="pop w sm hidden" id="bPlan1">📜 封印した計画書</button></div>
  </div>
</div>

<div id="scrMap" class="scr hidden">
  <div class="mh"><h2>目次</h2><small id="mSub"></small></div>
  <div id="mGrid"></div>
  <div id="mCards" class="pe"></div>
  <div class="mfoot"><button class="pop w sm" id="bBook2">📖 図鑑</button><button class="pop y sm" id="bGacha">🎁 ガチャ</button><button class="pop sm hidden" id="bToTest">📝 確認テストへ</button></div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

  $('sealBody').innerHTML='<div class="sealbox"><div class="stamp">封</div><p><b>'+esc(s.title||'')+'</b><br>封印した日: '+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'</p>'+
  '<p>電流計Ⓐ … <b>'+esc(s.plan.ammeter.spot)+'</b>（豆電球と直列）−端子 '+esc(s.plan.ammeter.term)+'・＋端子は'+esc(s.plan.ammeter.plus)+'<br>電圧計Ⓥ … <b>'+esc(s.plan.voltmeter.spot)+'</b>（豆電球と並列）−端子 '+esc(s.plan.voltmeter.term)+'・＋端子は'+esc(s.plan.voltmeter.plus)+'</p>'+
  '<p>実験では、スイッチを入れて針のふれが小さければ、スイッチを切ってから小さい−端子につなぎかえよう。</p></div>';$('scrSeal').classList.remove('hidden')};
$('sealClose').onclick=function(){$('scrSeal').classList.add('hidden')};
function toTest(){var z=Zk();if(z&&z.mainClear&&!TEST){try{z.mainClear({onClose:startTest});return}catch(e){}}startTest()}
$('bToTest').onclick=function(){if(SV.done)startTest()};
function openBook(){var z=Zk();if(z&&z.openBook)z.openBook()}
$('bBook1').onclick=openBook;$('bBook2').onclick=openBook;$('eBook').onclick=openBook;
$('bGacha').onclick=function(){var z=Zk();if(z&&z.openGacha)z.openGacha()};
if(!Zk()){['bBook1','bBook2','bGacha','eBook'].forEach(function(id){$(id).classList.add('hidden')})}
function getName(){return(window.PLAYER_NAME||$('nameIn').value||SV.name||'').trim()}
$('bStart').onclick=function(){ac();SV.name=$('nameIn').value.trim()||SV.name;save();var first=SV.unl===0&&!SV.stars[0];
  if(!window.Guide){if(first)startStage(0);else setScene('map');return}
  Guide.intro(INTRO).then(function(){if(first){PRAC_RET='stage0';Guide.tutorial(PRACTICE)}else setScene('map')})};
$('bCont').onclick=function(){ac();SV.name=$('nameIn').value.trim()||SV.name;save();setScene('map')};

/* ================= 遊び方案内（Guide）：intro・れんしゅう・？ ================= */
var HELP=null,PRAC_RET=null;
var INTRO={title:'第1回　メーター・ソケット',
  learn:'回路の切れ目には **電流計（直列）**、部品の両はしには **電圧計（並列）** をつなぐ',
  how:'弾倉で計器を選んで、飛び出した穴を **タップ** で打ちこむ',gesture:'tap'};
var PRAC_S={ep:'れんしゅう',n:'れんしゅう',rule:'切れ目にⒶ、またぐ穴にⓋ',mods:2,need:2,conc:1,life:999,pool:['gS'],tpl:['L1'],f:{},prac:1};
function holeT(need){return function(){if(!G||!G.prac&&!G.coachOn)return null;var m=G.mods.filter(function(q){return q.state==='pop'&&(!need||q.cfg.sock.need===need)})[0];if(!m)return null;var g=sockGeo(m);return{x:g.x,y:g.y,r:Math.max(30,m.sz*1.7),el:cv}}}
function magT(k){return function(){var b=MH[k];return b?{x:b.x+b.w/2,y:b.y+b.h/2,w:b.w,h:b.h,el:cv}:null}}
var PRACTICE={label:'れんしゅう中',
  start:function(){if(window.Guide&&Guide.active())Guide.skip();P=null;newGame(-1,PRAC_S);SEL='A';DIAL={A:0,V:0};G.state='run';G.popT=.35;setScene('run')},
  steps:[
    {gesture:'tap',target:holeT('A'),until:function(){return G&&G.correct>=1},place:'below',text:'回路の **切れ目** の穴！ いまの弾倉は **電流計Ⓐ**。穴を **タップ** して打ちこもう'},
    {gesture:'tap',target:magT('V'),until:function(){return SEL==='V'},text:'こんどは **電圧計Ⓥ** を使う。弾倉のⓋを **タップ**'},
    {gesture:'tap',target:holeT('V'),until:function(){return G&&G.correct>=2},place:'below',text:'豆電球の両はしを **またぐ穴** に、Ⓥを **タップ** で打ちこもう'}
  ],
  clearText:'れんしゅうクリア！',
  onExit:function(res){var r=PRAC_RET;PRAC_RET=null;if(!r)return;G=null;if(r==='stage0')startStage(0);else setScene(r)}};
/* 新しい操作が出てくる話の最初だけ、指で1回お手本（見終えたら次からは出ない） */
function stageCoach(){if(!window.Guide||!G||G.prac)return;var si=G.si,steps=null;
  var SCOPE_STEP={gesture:'tap',target:function(){if(!G||!G.scope||!MH.scope)return null;var mt=G.scope.meter,b=MH.scope.filter(function(q){return q.r===bestR(mt.type,mt.val)})[0];return b?{x:b.x+b.w/2,y:b.y+b.h/2,w:b.w,h:b.h,el:cv}:null},
     until:function(){return G&&!G.scope&&G.correct+G.miss>0},praise:false,text:'針のふれが小さい！ **もっと大きくふれる端子** を **タップ** して つなぎかえ'};
  if(si===3){G.coachPt='gS';steps=[
    {gesture:'tap',target:holeT('A'),until:function(){return G&&(G.scope||G.correct+G.miss>0)},place:'below',text:'大きさが「**？**」の穴。電流計の **−端子は5A** のまま、穴を **タップ**'},SCOPE_STEP]}
  else if(si===5){G.coachPt='gS';G.forceEst=1;steps=[
    {gesture:'tap',target:magT('dA'),until:function(){return DIAL.A!==0||(G&&G.correct+G.miss>0)},text:'「**約◯**」の目安つき！ **−端子** を **タップ** すると 5A→500mA→50mA と切りかわる'},
    {gesture:'tap',target:holeT('A'),until:function(){return G&&(G.scope||G.correct+G.miss>0)},place:'below',text:'振り切れない **一番小さい端子** にしたら、穴を **タップ**'},SCOPE_STEP]}
  else if(si===7){G.coachPt='gS';steps=[
    {gesture:'tap',target:function(){if(!G)return null;var m=G.mods.filter(function(q){return q.state==='pop'})[0];if(!m)return null;var g=sockGeo(m);return{x:g.a[0],y:g.a[1],r:Math.max(26,m.sz*.9),el:cv}},
     until:function(){return G&&(G.scope||G.correct+G.miss>0)},place:'below',text:'穴の両はしの ○ のうち、**電源の＋極側** の端を **タップ**。そこが ＋端子になる'},SCOPE_STEP]}
  if(!steps){G.coachPt=null;return}
  G.coachOn=true;Guide.coach(steps,{key:GID+'-s'+si}).then(function(r){if(G){G.coachOn=false;G.forceEst=0;if(r&&r.already)G.coachPt=null}})}
function helpRules(){var r=['回路の **切れ目** の穴 → **電流計Ⓐ**（直列につなぐ）','部品の両はしを **またぐ穴** → **電圧計Ⓥ**（並列につなぐ）','まちがえると、そのつなぎ方で本当に起きること（つかない・振り切れ）が起きる。連続で当てるとコンボ！'];
  if(G&&!G.prac&&G.S.rule)r.push('この話：'+G.S.rule);else if(P)r.push('最終話：実験で組む回路にⒶとⓋを置いて「封印する！」');
  if(LAND)r.push('キーボード：A＝電流計・V＝電圧計・R＝−端子の切りかえ');return r}
if(window.Guide){
  Guide.setup({theme:{bg:WHT,fg:INK,accent:RED,accentText:'#fff',font:FH,bodyFont:FB,radius:0,
      texture:{image:'radial-gradient(circle,rgba(228,0,43,.13) 26%,transparent 28%)',size:'9px 9px'},
      line:INK,dim:'rgba(27,27,27,.5)',shadow:'10px 10px 0 '+INK,outline:INK,hand:YEL,handLine:INK},
    sfx:function(k){if(muted)return;({step:SFX.on,done:SFX.pita,clear:SFX.clear,open:SFX.sel,close:SFX.esc,cheer:function(){SFX.combo(4)},nudge:SFX.pop}[k]||function(){})()},
    muted:function(){return muted},title:INTRO.title,learn:INTRO.learn,how:INTRO.how});
  HELP=Guide.help({rules:helpRules(),offset:{x:66},size:LAND?52:44,show:false,attention:true,labels:{replay:'れんしゅうをもう一度'},
    replay:function(){PRAC_RET='map';Guide.tutorial(PRACTICE);return null},
    onOpen:function(){if(G)G.paused=true},onClose:function(){if(G)G.paused=false}});
  Guide.tutorialButton('#bHow',function(){ac();PRAC_RET='title';Guide.tutorial(PRACTICE)});
}else $('bHow').classList.add('hidden');

/* ================= 確認テスト（読者クイズ） ================= */
var TQ=[],TI=0,TA=[],TOK=[],CARD=null;
function startTest(){G=null;P=null;setScene('test');TQ=window.Quiz?Quiz.test():[];TI=0;TA=[];TOK=[];$('scrTest').scrollTop=0;showQ()}
function lamps(){$('tLamps').innerHTML=TQ.map(function(q,i){return'<i class="'+(i<TOK.length?(TOK[i]?'ok':'ng'):i===TI?'cur':'')+'"></i>'}).join('')}
function showQ(){if(TI>=TQ.length)return finishTest();var q=TQ[TI];$('tNo').textContent='Q.'+(TI+1);lamps();
  $('tQ').textContent=q.q;var f=$('tFig');if(q.fig){f.innerHTML=q.fig;f.classList.remove('hidden')}else{f.innerHTML='';f.classList.add('hidden')}
  $('tEx').classList.add('hidden');$('tNext').classList.add('hidden');var box=$('tA');box.innerHTML='';
  if(q.t==='choice'){q.shown.forEach(function(s,i){var b=document.createElement('button');b.className='ch';b.innerHTML='<i>'+'ABCDEF'.charAt(i)+'</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){answer(s,b)};box.appendChild(b)})}
  else if(q.t==='num'){var v='';box.innerHTML='<div class="numbox"><div class="v" id="nv">&nbsp;</div><div class="u">'+esc(q.unit||'')+'</div></div><div class="keys" id="nk"></div>';
    var ks=['7','8','9','⌫','4','5','6','.','1','2','3','0'],nk=$('nk');ks.forEach(function(k){var b=document.createElement('button');b.textContent=k;b.onclick=function(){if(TA.length>TI)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<7&&!(k==='.'&&v.indexOf('.')>=0))v+=k;$('nv').innerHTML=v?esc(v):'&nbsp;';tone(900,.03,'square',.03)};nk.appendChild(b)});
    var go=document.createElement('button');go.className='go';go.textContent='この値で決定！';go.onclick=function(){if(v&&TA.length<=TI)answer(v,null)};nk.appendChild(go)}
  else{var sel=[];var wrap=document.createElement('div');wrap.className='ord';box.appendChild(wrap);
    var draw=function(){wrap.innerHTML='';sel.forEach(function(s,i){var d=document.createElement('div');d.className='slot';d.innerHTML='<i>'+(i+1)+'</i><span></span>';d.querySelector('span').textContent=s;wrap.appendChild(d)});
      q.shown.forEach(function(s){if(sel.indexOf(s)>=0)return;var b=document.createElement('button');b.className='ch';b.innerHTML='<i>＋</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){if(TA.length>TI)return;sel.push(s);tone(700+sel.length*80,.05,'square',.03);if(sel.length===q.shown.length)answer(sel.slice(),null);else draw()};wrap.appendChild(b)});
      if(sel.length&&TA.length<=TI){var r=document.createElement('button');r.className='pop w sm';r.textContent='やりなおす';r.onclick=function(){sel=[];draw()};wrap.appendChild(r)}};
    draw()}}
function answer(v,btn){if(TA.length>TI)return;var q=TQ[TI],ok=window.Quiz?Quiz.check(q,v):false;TA.push(v);TOK.push(ok);ok?SFX.pita():SFX.dud();
  [].slice.call($('tA').querySelectorAll('.ch')).forEach(function(b){b.disabled=true;var t=b.querySelector('span').textContent;if(q.t==='choice'){if(t===q.choices[0])b.classList.add('ok');else if(b===btn)b.classList.add('ng')}});
  if(q.t==='order'){var w=$('tA').querySelector('.ord');if(w)[].slice.call(w.querySelectorAll('.slot')).forEach(function(d,i){d.style.borderStyle='solid';d.style.background=v[i]===q.items[i]?'#FFD400':'#cfcfcf'})}
  var ex=$('tEx');ex.innerHTML=(ok?'<b style="color:#E4002B">ピタッ！</b>':'<b>ざんねん！</b>正解：'+esc(window.Quiz?Quiz.answer(q):'')+'<br>')+esc(q.ex||'');ex.classList.remove('hidden');
  lamps();var nb=$('tNext');nb.textContent=TI+1>=TQ.length?'採点する！':'つぎへ！';nb.classList.remove('hidden');setTimeout(function(){nb.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'})},50)}
$('tNext').onclick=function(){TI++;$('scrTest').scrollTop=0;showQ()};
function totalStars(){var n=0;for(var k in SV.stars)n+=SV.stars[k].filter(Boolean).length;return n}
function finishTest(){var qs=TQ,answers=TA;var review=window.Quiz?Quiz.review(qs,answers):[],marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length,name=getName();
  var bt=0,bn=0;for(var k in SV.best){if(+k<9){bt+=SV.best[k].t;bn++}}
  var records=TEST?[['モード','確認テストだけ']]:[['クリアした話',Object.keys(SV.stars).length+' / 10'],['★の数',totalStars()+' / 30'],['最大コンボ',(SV.maxc||0)+'連'],['計画書',SV.plan?'封印ずみ（Ⓐ'+SV.plan.ammeter.spot+'・Ⓥ'+SV.plan.voltmeter.spot+'）':'まだ']];
  $('eName').textContent=(name?name+'　':'')+'確認テスト';$('eScore').innerHTML=score+'<small> / '+qs.length+' 点</small>';
  setScene('end');
  if(window.SubmitCard)CARD=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　電流とその利用　第1回',
    game:'メーター・ソケット ～電流計と電圧計のつなぎ方～'+(TEST?'（確認テストのみ）':''),name:name,score:score,total:qs.length,marks:marks,records:records,review:review},function(){})}
$('eCard').onclick=function(){if(CARD&&window.SubmitCard)SubmitCard.reopen(CARD)};
$('eMap').onclick=function(){if(TEST){setScene('title');return}setScene('map')};

/* ================= 入力・ループ ================= */
cv.addEventListener('pointerdown',function(e){ac();var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(scene==='run'&&G&&!G.paused)tapBoard(x,y);else if(scene==='plan'&&P)planTap(x,y)});
document.addEventListener('keydown',function(e){if(scene!=='run'&&scene!=='plan')return;var k=e.key.toLowerCase();if(k==='a'){SEL='A';SFX.sel()}else if(k==='v'){SEL='V';SFX.sel()}else if(k==='r'||k===' '){DIAL[SEL]=(DIAL[SEL]+1)%3;SFX.dial();e.preventDefault()}});
window.addEventListener('resize',resize);
var last=performance.now();
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;c.setTransform(DPR,0,0,DPR,0,0);
  if(scene==='run'&&G){if(!G.paused)update(dt);drawRun(G.paused?0:dt)}else if(scene==='plan'&&P)drawPlan(dt);else if(scene==='title')drawCover();else drawPage();
  requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',function(){if(document.hidden&&scene==='run'&&G&&G.state==='run'){G.paused=true;$('bkSub').textContent='一時停止中。進み具合は保存されます。';$('scrBackQ').classList.remove('hidden')}});

/* ================= はじまり ================= */
resize();
window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]});
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nmRow').classList.add('hidden')}else if(SV.name)$('nameIn').value=SV.name;
if(TEST)startTest();else setScene('title');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){mkPat()});
requestAnimationFrame(frame);
/* 自動操作の確かめ用の窓口（遊びには影響しない） */
window.__MS={G:function(){return G},P:function(){return P},scene:function(){return scene},SV:function(){return SV},start:startStage,
  auto:function(){if(!G||G.state!=='run')return false;if(G.scope){var m=G.scope;scopePick(bestR(m.meter.type,m.meter.val));return true}
    var m2=G.mods.filter(function(m){return m.state==='pop'})[0];if(!m2)return false;var s=m2.cfg.sock,tp=s.need;SEL=tp;
    if((tp==='A'&&G.S.f.rA)||(tp==='V'&&G.S.f.rV)){var R=tp==='A'?RA:RV;DIAL[tp]=s.est?R.indexOf(bestR(tp,s.val)):0}hitMod(m2,tp,true);return true},
  scopeTest:function(){var m=G&&G.mods.filter(function(m){return m.state==='pop'&&m.cfg.sock.need==='A'})[0];if(!m)return false;m.cfg.sock.est=null;SEL='A';DIAL.A=0;hitMod(m,'A',true);return true},
  wrong:function(){var m2=G&&G.mods.filter(function(m){return m.state==='pop'})[0];if(!m2)return false;hitMod(m2,m2.cfg.sock.need==='A'?'V':'A',true);return true},
  plan:function(){startPlan();P.put={'ア':{type:'A',term:0,plusA:true},'ウ':{type:'V',term:0,plusA:true}};planCheck()},seal:function(){planSeal()}};
})();
</script>
