<title>燃えかす鍛冶場 ～酸化でできる物質～</title>
<!--
  ゲームID: moekasu-kantei ／ コマID: chu2-kagaku-18（化学変化と原子・分子 第18回・確認用）
  ねらい: 金属が酸素と結び付く（酸化）と、元の金属とは性質の違う物質（酸化物）ができる

  【6. 別の世界】画風＝水墨画（墨のにじみ・余白・筆）。
   1 世界とメタファー: 山あいの鍛冶場を、墨一色の掛け軸のように描く。左に炉とふいごと天秤、中央に金床、
     右に標本棚。山道に沿って炉が1つずつ灯っていく（道のり）。成果は「鑑定書」に筆で書かれ、刻印を打つ。
   2 配色: 和紙 #F1EDE4 ／ 墨 #1C1C1C（濃淡とにじみ）／ 差し色は火と光だけ #F5E663。
     マグネシウムが燃える白い光だけが、画面でいちばん明るい。銅だけ淡彩でうすく色をさす。
   3 書体: 見出し Yuji Boku（筆文字）／ 本文 明朝
   4 画面: 全画面canvas。横長＝金床を中央、左に炉・右に標本棚。縦長＝金床を画面下に大きく、素材は上から落ちてくる。
   5 HUD: 左上の墨の札「← もどる」、上に山道の炉の列（灯った数）、右上に標本・腕前・かけら・風鈴（音）。
   6 音: 金床の澄んだ金属音、ふいごの風、崩れる音、豆電球のりん、琴の爪弾き（連続成功）（WebAudio合成）

  【7. 動かす遊び】鍛冶屋。ふいごを押して金属を焼き（天秤の目盛りが実測の記録どおりに増える）、
   金属と燃えかすを金床にのせ、金槌でたたく（金属はのびる・燃えかすは砕ける）、砥石でこする（光沢）、
   豆電球をつなぐ（電気）。性質の違いを3つそろえたときだけ「酸化物」の刻印が打てる。
   磁石（鉄の燃えかすもつく）・ものさし（大きさ）は決め手にならず、連続がとぎれる。
   後半は中身の分からない「包み」を筆でほどいて鑑定する（③開封）。最後は上から次々に落ちる大仕事。
  開封: 最初に localStorage rika-zukan:chu2:seal:chu2-kagaku-17（コマ17「燃えたら重い？軽い？」）を開け、
   公開資料の再現記録（丸めたスチールウール 1.16g→1.34g）と照らす。封筒が無ければその場で予想してから焼く。
  深さ: 酸化は「簡単なもの」。化学反応式はマグネシウムと銅だけ。鉄は物質名の式まで（鉄＋酸素→酸化鉄）。
-->

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

 n(d,v,ff,dl,q,type){if(this.mute||!this.c)return;const c=this.c,t=c.currentTime+(dl||0),b=c.createBuffer(1,Math.max(1,c.sampleRate*d|0),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=ff||1000;f.Q.value=q||1;const g=c.createGain();g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)}};
const PENTA=[587,659,784,880,988,1175,1319,1568];

 anvil(){[[620,.9,.14],[1360,.6,.08],[2230,.4,.05],[3150,.25,.03]].forEach(p=>AU.t(p[0],p[1],'sine',p[2]));AU.n(.04,.25,3000,0,1)},

let scene='title',R=null,PT=[],FT=[],SHK=0,FLASH=0,now=0,drag=null,msgT=0,GLOW=0;

function fly(t,x,y,sz,col){const near=FT.filter(f=>Math.abs(f.x-x)<120&&Math.abs(f.y-y)<60&&f.t<.9).length;FT.push({t:0,life:1.5,txt:t,x,y:y-near*34,sz:sz||1,col:col||SUMI})}
function sparks(x,y,n,col){if(RM)n=Math.min(n,6);for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(120,520);PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-160,t:0,life:rnd(.25,.7),k:'sp',col:col||HI,sz:rnd(1.5,3.5)})}}
function inkSplat(x,y,n){if(RM)n=Math.min(n,5);for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(60,260);PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,t:0,life:rnd(.5,1),k:'ink',sz:rnd(3,11)})}}

function startStage(){const rd=curRD();
 R={rd,phase:rd.k==='pair'?'burn':'wrap',samples:[],res:{},diff:{},trap:0,mist:0,pumps:0,spread:rd.spread?0:1,grams:rd.mass?rd.mass[0]:0,cur:0,queue:[],done:[],timer:rd.timer||0,ev:{},firstOK:true};
 if(rd.k==='pair'){R.samples=[mkSample(rd.m,0,true)];R.samples[0].inKiln=true}
 else{const pool=rd.k==='boss'?shuffle(rd.pool):rd.pool[Math.random()*rd.pool.length|0].slice();R.queue=pool;nextWrap()}
 updHud();setClaim();setBand();fly('第'+rd.no+'の炉　'+rd.title,WW/2,PORT?160:120,1.3);SFX.koto(0);save();
 say(rd.k==='pair'?(rd.spread?'今度はスチールウールを<b>広げて</b>から焼く':'<b>ふいご</b>を押して、炉の'+MAT[rd.m].sh+'を焼こう'):rd.k==='boss'?'上から包みが落ちてくる！':'包みを<b>筆でなでて</b>ほどこう','');
}
function mkSample(m,spot,wrap){const p=spot==null?L.one:L.spots[spot];return{m,spot,x:p.x,y:p.y,tx:p.x,ty:p.y,hm:0,rub:0,shine:0,lit:0,bub:0,stick:0,crumb:0,stamp:null,wrap:!!wrap&&false,cover:0,nm:null,ruler:0,drop:0}}
function nextWrap(){R.ev={};R.res={};const m=R.queue.shift();if(!m){finishStage();return}
 const s=mkSample(m,null);s.cover=1;s.hidden=true;if(PORT||R.rd.k==='boss'){s.y=L.drop;s.vy=0;s.falling=true}R.samples=[s];R.phase='wrap';setBand();}
function sampleAt(p){let best=null,bd=1e9;for(const s of R.samples){if(s.inKiln)continue;const d=Math.hypot(s.x-p.x,s.y-p.y);if(d<90&&d<bd){bd=d;best=s}}return best}

 if(rd.m==='mg'){FLASH=Math.min(1,FLASH+.55);SFX.flash();sparks(K.x,K.y+20,26,'#ffffff')}else{SFX.fire();sparks(K.x,K.y+20,rd.m==='fe'?22:8,HI)}

 if(R.pumps>=6){R.phase='burnt';const d=(rd.mass[1]-rd.mass[0]).toFixed(2);
  setTimeout(()=>{fly(rd.mass[0].toFixed(2)+'g → '+rd.mass[1].toFixed(2)+'g',L.anvil.x,L.anvil.y-160,1.2);fly('＋'+d+'g＝結び付いた酸素',L.anvil.x,L.anvil.y-110,.9);SFX.koto(3);
   if(S.stage===0&&!S.opened)openVerdict();else toAnvil()},500)}

function useTool(tool,p,s){const rd=R.rd;if(!s){s=sampleAt(p)}if(!s){return}
 if(s.falling){say('落ちてくるのを待って。','');return}
 if(s.cover>0){say('先に包みを<b>筆でなでるように</b>ほどこう。','');return}
 if(tool==='stampOx'||tool==='stampMe'){doStamp(tool,s);return}
 const r=result(tool,s.m),m=s.m;
 // 見た目の反応
 if(tool==='hammer'){s.hm++;SHK=RM?0:7;SFX.anvil();if(MAT[m].kind==='metal'){sparks(s.x,s.y,18,HI);s.shine=Math.min(1,s.shine+.35)}else{SFX.crumble();dust(s.x,s.y,18,MAT[m].base==='mg'?'#d9d4c8':SUMI);s.crumb=Math.min(1,s.crumb+.5)}}

 if(tool==='magnet'){s.stick=r==='つく'?1.2:-1;SFX.clack()}
 if(tool==='ruler'){s.ruler=2;SFX.tap()}
 fly(TL[tool].v+'：'+r,s.x,s.y-80,.9);
 if(rd.k==='pair')pairRecord(tool,s,r);else singleRecord(tool,s,r);
 setBand()}
function pairRecord(tool,s,r){const rd=R.rd;R.res[tool]=R.res[tool]||{};R.res[tool][s.spot]=r;
 if(R.res[tool][0]==null||R.res[tool][1]==null){return}
 if(R.diff[tool]!=null)return;
 const base=MAT[rd.m].base,d=decisive(tool,base);R.diff[tool]=d;
 if(d){S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);SFX.koto(S.combo);const g=scoreAdd(20);fly('違いあり！ ＋'+g,L.anvil.x,L.anvil.y-(PORT?200:230),1.1);inkSplat(L.cert.x,L.cert.y,10);
  if(diffCount()>=3){setTimeout(()=>{say('性質の違いが3つそろった！ 刻印「酸化物」を打てる','');SFX.fanfare()},300)}}
 else trap(tool,base)}

 const g=scoreAdd(rd.k==='boss'?30:25);fly(MAT[s.m].kind==='ox'?MAT[s.m].ox+'！ ＋'+g:MAT[s.m].sh+'（金属） ＋'+g,s.x,s.y-110,1.1);

 if(sl)say('コマ17で封印した予想が届いている。<b>封を筆でなぞって切ろう</b>','');else{R.phase='predict';R.tilt=0;say('封筒が見つからない。いま予想しよう。<b>天秤の皿を指で傾けて</b>','')}setBand()}
function envRect(){return PORT?{x:300,y:430,w:360,h:210}:{x:WW/2,y:WH/2-40,w:440,h:250}}
function openCut(){const sl=R.seal;SFX.swish();inkSplat(envRect().x+envRect().w*.3,envRect().y,30);R.phase='read';
 S.sealPred=sl.pred;S.sealFrom='seal';save();
 showOv(`<h2>封を切った</h2><div class="env">予想：${esc(DIRS[sl.pred])}</div>
  <p><b>添えた根拠</b><br>${(sl.reasons||[]).map(t=>'・'+esc(t)).join('<br>')||'（なし）'}</p>
  <p class="small">討論会での直感：${sl.gut?DIRS[sl.gut]:'―'}　／　根拠の筋：${sl.consistent?'つながっていた':'実験のあとで見直そう'}</p>
  <p>では、実際に焼いて量ってみよう。<br><span class="small">公開資料の再現記録：丸めたスチールウール</span></p>
  <div class="row"><button class="sumi" id="oGo">炉へ</button></div>`,()=>{$('oGo').onclick=()=>{hideOv();toBurn()}})}
function toBurn(){scene='play';startStage();R.fromOpen=true}
function predictDone(){const t=R.tilt||0;const d=Math.abs(t)<.04?'same':t>0?'heavy':'light';S.sealPred=d;S.sealFrom='now';save();SFX.stamp();say('予想「燃やした後は'+DIRS[d]+'」を記録した。焼いて確かめよう','');setTimeout(toBurn,700)}
function openVerdict(){const hit=S.sealPred==='heavy';S.opened=true;if(S.sealHit==null){S.sealHit=hit;if(hit)earn(15,'hit')}save();
 if(hit){SFX.fanfare();sparks(L.scale.x,L.scale.y,40,HI)}else SFX.dull();
 const sl=readSeal();
 showOv(`<h2>${hit?'大当たり':'予想とずれた'}</h2><p class="big">${hit?'重くなった':'重くなった！'}</p>
  <p>燃やす前 <b>1.16g</b> → 燃やした後 <b>1.34g</b>（増えた分 0.18g）<br><span class="small">公開資料の再現記録（丸めたスチールウール）</span></p>
  <p>あなたの予想：<b>${esc(DIRS[S.sealPred])}</b>${S.sealFrom==='now'?'（その場で予想）':''}</p>
  <p>${hit?(sl&&sl.consistent?'根拠の筋も通っていた。鉄は空気中の<b>酸素と結び付いた</b>。結び付いた酸素の分だけ重くなる。':'鉄は空気中の<b>酸素と結び付いた</b>。結び付いた酸素の分だけ重くなる。'):'紙やろうそくとちがい、鉄には炭素がないので、燃えても気体は出ていかない。空気中の<b>酸素と結び付いて</b>、その分だけ重くなった。ズレた所こそ、いちばん記憶に残る発見。'}</p>
  <p class="small">では、この黒い燃えかすは、まだ鉄なのか？ 金床で確かめよう。</p>
  <div class="row"><button class="sumi" id="oGo">金床へ</button></div>`,()=>{$('oGo').onclick=()=>{hideOv();toAnvil()}})}

/* ================= 入力 ================= */
cv.addEventListener('pointerdown',onDown);addEventListener('pointermove',onMove);addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
function toolRects(){const tl=R&&R.rd&&(scene==='play')&&R.phase!=='burn'&&R.phase!=='burnt'?R.rd.tools.concat(R.rd.k==='pair'?['stampOx']:[]):[];const R0=L.rack,n=tl.length,w=Math.min(PORT?100:118,(R0.x1-R0.x0)/Math.max(1,n)),x0=(R0.x0+R0.x1)/2-w*n/2;return tl.map((id,i)=>({id,x:x0+w*i,y:R0.y0,w,h:R0.y1-R0.y0}))}
function toolAt(p){for(const r of toolRects())if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y-10&&p.y<r.y+r.h)return r;return null}
function stampReady(){if(!R)return false;if(R.rd.k==='pair')return R.phase==='test'&&diffCount()>=3;return evCount()>=2}
function onDown(e){AU.init();const p=s2w(e.clientX,e.clientY);if(!R)return;
 if(scene==='open'){if(R.phase==='env'){drag={k:'cut',pts:[p]};return}if(R.phase==='predict'){drag={k:'tilt',p};return}return}
 if(scene!=='play'||R.phase==='done')return;
 if(R.phase==='burn'){const B=L.bell;if(Math.hypot(p.x-B.x,p.y-B.y)<90||Math.hypot(p.x-L.kiln.x,p.y-L.kiln.y)<110){if(!R.spread){drag={k:'spread',x0:p.x};return}pump();return}
  if(!R.spread&&Math.hypot(p.x-L.kiln.x,p.y-L.kiln.y)<160){drag={k:'spread',x0:p.x};return}return}
 const t=toolAt(p);if(t){if((t.id==='stampOx'||t.id==='stampMe')&&!stampReady()){say(R.rd.k==='pair'?'刻印は、性質の違いが<b>3つ</b>そろってから（いま '+diffCount()+'つ）':'刻印は、決め手になる証拠が<b>2つ</b>そろってから（いま '+evCount()+'つ）','');SFX.tap();return}
  drag={k:'tool',id:t.id,x:p.x,y:p.y,rubOn:null,rubD:0,lx:p.x,ly:p.y};SFX.tap();return}
 const s=sampleAt(p);if(s&&s.cover>0){drag={k:'unwrap',s,lx:p.x,ly:p.y,d:0};return}
 if(s){fly(s.hidden?'中身は？':MAT[s.m].nm,s.x,s.y-90,.8);SFX.tap()}}
function onMove(e){if(!drag)return;const p=s2w(e.clientX,e.clientY);
 if(drag.k==='cut'){drag.pts.push(p);const E=envRect(),sx=E.x+E.w*.3;const crossed=drag.pts.some(q=>q.x<sx-40)&&drag.pts.some(q=>q.x>sx+40)&&drag.pts.some(q=>Math.abs(q.y-E.y)<70);if(crossed&&R.phase==='env'){drag=null;openCut()}return}
 if(drag.k==='tilt'){const A=L.anvil;R.tilt=clamp((p.y-drag.p.y)/180*(p.x>WW/2?1:-1),-.25,.25);return}
 if(drag.k==='spread'){if(Math.abs(p.x-drag.x0)>90){R.spread=1;SFX.swish();say('広げた！ 空気にふれる面が増えた。<b>ふいご</b>を押して焼こう','');drag=null;setBand()}return}
 if(drag.k==='unwrap'){drag.d+=Math.hypot(p.x-drag.lx,p.y-drag.ly);drag.lx=p.x;drag.ly=p.y;const s=drag.s;s.cover=Math.max(0,1-drag.d/260);if(Math.random()<.2)SFX.swish();if(s.cover<=0){drag=null;SFX.koto(2);inkSplat(s.x,s.y,14);R.phase='test1';say('包みがほどけた。金属か、燃えかすか？','');setBand()}return}
 if(drag.k==='tool'){drag.x=p.x;drag.y=p.y;if(drag.id==='stone'){const s=sampleAt(p);if(s&&!s.cover&&!s.falling){drag.rubD+=Math.hypot(p.x-drag.lx,p.y-drag.ly);drag.rubOn=s;if(Math.random()<.25)SFX.rub();if(drag.rubD>220){useTool('stone',p,s);drag.rubD=-1e9}}drag.lx=p.x;drag.ly=p.y}}}
function onUp(e){if(!drag)return;const d=drag;drag=null;
 if(d.k==='tilt'){return}
 if(d.k==='tool'){const p={x:d.x,y:d.y};if(d.id==='stone'){if(d.rubD>=0&&sampleAt(p))say('砥石は、金属の上で<b>何度もこする</b>','');return}useTool(d.id,p);}}

 $('path').innerHTML=RD.map((r,i)=>`<i class="${i<S.stage?'on':''}${i===S.stage&&!S.cleared?' now':''}"></i>`).join('')+`<span>炉 ${Math.min(S.stage,RD.length)}/${RD.length}</span>`}
function setBand(){const b=$('band');let t='';
 if(scene==='open'&&R){t=R.phase==='env'?'封筒の<b>赤い封</b>を、筆でなぞるように横に切る':R.phase==='predict'?'燃やした後の皿を<b>指で押し下げる・持ち上げる</b>（そのままなら「変わらない」）→ 下の札を押す':''}
 else if(scene==='play'&&R){const rd=R.rd;
  if(R.phase==='burn')t=!R.spread?'炉のスチールウールを<b>左右に引っぱって広げる</b>':'<b>ふいご</b>を押して風（酸素）を送る（'+R.pumps+'/6）';
  else if(R.phase==='test')t=diffCount()>=3?'<b>刻印「酸化物」</b>を、燃えかすの方へ打つ':'道具を<b>金属と燃えかすの両方</b>に使って比べる（違い '+diffCount()+'/3）';
  else if(R.phase==='wrap')t=R.samples[0]&&R.samples[0].falling?'包みが落ちてくる…':'包みを<b>筆でなでるように</b>こすってほどく';
  else if(R.phase==='test1')t=evCount()>=2?'<b>刻印</b>「酸化物」か「金属」を打つ（証拠 '+evCount()+'）':'決め手になる検査を<b>2つ以上</b>（証拠 '+evCount()+'/2）';
  if(rd.timer&&R.phase!=='done')t+='　残り '+Math.max(0,Math.ceil(R.timer))+'秒'}
 b.innerHTML=t;b.classList.toggle('hidden',!t);
 if(scene==='open'&&R&&R.phase==='predict'){b.innerHTML+=' <button class="sumi gold" id="pDone" style="pointer-events:auto;min-height:44px;font-size:17px;padding:6px 18px;margin-left:6px">これが予想</button>';$('pDone').onclick=predictDone}}

let last=performance.now(),bT=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;now+=dt;update(dt);draw();requestAnimationFrame(frame)}
function update(dt){if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').className=''}
 if(scene==='play'&&R){S.t+=dt;
  if(R.rd.timer&&R.phase!=='done'&&R.timer>0){R.timer-=dt;bT-=dt;if(bT<=0){bT=1;setBand()}}
  for(const s of R.samples){if(s.falling){s.vy=(s.vy||0)+1500*dt;s.y+=s.vy*dt;if(s.y>=L.one.y){s.y=L.one.y;s.falling=false;SFX.anvil();dust(s.x,s.y+30,10);SHK=RM?0:6;setBand()}continue}
   s.x+=(s.tx-s.x)*Math.min(1,dt*6);s.y+=(s.ty-s.y)*Math.min(1,dt*6);if(s.lit>0)s.lit=Math.max(.001,s.lit);if(s.bub>0){s.bub-=dt;if(Math.random()<.5)PT.push({x:s.x+rnd(-24,24),y:s.y+10,vx:rnd(-10,10),vy:-rnd(40,90),t:0,life:.8,k:'bub',sz:rnd(2,5)})}
   if(s.stick>0)s.stick=Math.max(0,s.stick-dt);if(s.ruler>0)s.ruler=Math.max(0,s.ruler-dt)}
  if(R.phase==='burn'||R.phase==='burnt'){const K=L.kiln;if(Math.random()<.3)PT.push({x:K.x+rnd(-26,26),y:K.y+40,vx:rnd(-10,10),vy:-rnd(30,60),t:0,life:.8,k:'fl',sz:rnd(4,9)})}
 }
 if(GLOW>0)GLOW=Math.max(0,GLOW-dt*1.2);if(FLASH>0)FLASH=Math.max(0,FLASH-dt*.9);if(SHK>0)SHK=Math.max(0,SHK-dt*30);
 PT=PT.filter(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='sp'||p.k==='ink'||p.k==='dust')p.vy+=700*dt;return p.t<p.life});FT=FT.filter(f=>{f.t+=dt;return f.t<f.life})}

 if(scene==='title'){drawTitle();return}if(scene==='test')return;

 cx.translate(OX,OY);cx.scale(SC,SC);drawWorld();cx.restore();

 // 粒

  else if(p.k==='ink'){cx.fillStyle='rgba(28,28,28,'+a*.8+')';cx.beginPath();cx.arc(p.x,p.y,p.sz*(1+p.t),0,7);cx.fill()}

  else if(p.k==='bub'){cx.strokeStyle='rgba(28,28,28,'+a+')';cx.lineWidth=1.5;cx.beginPath();cx.arc(p.x,p.y,p.sz,0,7);cx.stroke()}
  else if(p.k==='fl'){cx.fillStyle='rgba(245,230,99,'+a*.8+')';cx.beginPath();cx.arc(p.x,p.y,p.sz*(1-p.t),0,7);cx.fill()}}
 for(const f of FT){const a=f.t<.12?f.t/.12:1-Math.max(0,(f.t-.9)/.6);cx.globalAlpha=clamp(a,0,1);const sz=Math.round((PORT?26:30)*f.sz);cx.save();cx.shadowColor='rgba(241,237,228,1)';cx.shadowBlur=8;T(f.txt,f.x,f.y-f.t*40,sz,f.col);cx.restore()}cx.globalAlpha=1}

 if(R.phase==='burn'){const B=L.bell,p=.5+.5*Math.sin(now*6);cx.strokeStyle='rgba(28,28,28,'+(.3+p*.5)+')';cx.lineWidth=3;cx.beginPath();cx.ellipse(B.x,B.y,70+p*6,50+p*4,0,0,7);cx.stroke();T('押す',B.x,B.y-64,20)}}
