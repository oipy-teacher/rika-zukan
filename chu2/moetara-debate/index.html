<title>燃えたら重い？軽い？ ～金属の燃焼の予想～</title>
<!--
  ゲームID: moetara-debate ／ コマID: chu2-kagaku-17（化学変化と原子・分子 第17回・予想用）
  ねらい: 金属が燃えるときに酸素と結び付くなら、燃えたあとの質量は増えるはずだ、という予想を立てる

  【6. 別の世界】画風＝ロシア構成主義の「演説ポスター」（赤・黒・斜めの構図）。
   1 世界とメタファー: 討論会の演壇に置かれた大きな天秤（シーソー）。画面そのものが1枚のポスター。
     相手の主張は斜めの帯、事実は黒い「事実の箱」（ラッキーブロック）、根拠は支点につり下がる札。
   2 配色: 紙 #E9E2D0 ／ 赤 #B3001B ／ 墨 #1A1A1A の3色刷り（原子だけは全ゲーム共通の色）。版ずれ・網点・紙のざらつき。
   3 書体: 見出し RocknRoll One ／ 数字・欧文 Anton ／ 本文ゴシック
   4 画面: 全画面canvas。横長＝壇上に横長のシーソー、上に空気、下に棚。縦長＝シーソーを大きく、道具は下の棚。
     世界ごと数度かたむけ、背景の赤い円・黒い楔・斜めの帯で対角線の構図をつくる。
   5 HUD: 左上の黒い札「◀ もどる」、試合名の斜め札、支持の票数、かけら、メガホン（音）、
     「予想を封印するまで終われません」の斜めの進捗帯。
   6 音: 木づち（ガベル）、観客のどよめき、天秤のきしみ、金管風のファンファーレ（WebAudio合成）

  【7. 動かす遊び】シーソー（天秤）。右の皿＝燃やす物、左の皿＝燃やす前の重さ。
   マッチを運んで火をつけ、空気中の「酸素」（赤い2つ玉）を指でつまんで炎へ入れる（窒素ははね返る）。
   できた物（二酸化炭素・水蒸気・灰…）を、気体なら上へはじいて空気中へ出し、固体なら皿に残す。
   ひとつ動かすたびにシーソーがぎしりと傾く＝自分の考えが傾きになる。「判定！」で傾きを確定し、
   黒い「事実の箱」を3回たたいて割ると、中の事実（ろうそくは軽くなる…）と照らし合わせられる。
   予選→準々決勝→準決勝→決勝→最終予想の10試合。最後はスチールウールで自分の予想の傾きを作り、
   根拠の札を2枚つるして封印する（事実の箱は開けない。コマ18「燃えかす鍛冶場」で開封）。
  封印: localStorage rika-zukan:chu2:seal:chu2-kagaku-17 = {v,koma,game,pred,predText,reasons,reasonIds,gut,consistent,name,at}
-->

#claim{position:fixed;z-index:4;left:max(8px,env(safe-area-inset-left));top:112px;max-width:min(360px,44vw);background:var(--ink);color:var(--paper);padding:8px 14px 10px 46px;transform:rotate(-3deg);transform-origin:left top;
 clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);pointer-events:none}

#claim.won::after{content:"論破";position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(-12deg);font-family:var(--disp);color:#fff;background:var(--red);padding:2px 10px;font-size:18px;box-shadow:3px 3px 0 #000}
/* 指示の帯 */

 max-width:min(430px,34vw);box-shadow:6px 6px 0 var(--ink);pointer-events:none}
#band b{background:#fff;color:var(--red);padding:0 5px}
#ctrl{position:fixed;z-index:6;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}

 font-weight:800;font-size:16px;line-height:1.5;max-width:min(520px,88vw);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#msg.on{opacity:1}
#msg.bad{background:var(--ink);color:var(--paper);box-shadow:7px 7px 0 var(--red)}
#msg.bad::before{content:"異議あり！";display:block;font-family:var(--disp);color:#ff5a6a;font-size:13px;letter-spacing:.1em}
/* タイトル */

#title>*{pointer-events:auto}

#tMain .l2{font-size:min(15vw,112px);color:var(--red);margin-left:12vw;text-shadow:5px 5px 0 var(--ink)}

/* 重ねる板（結果・確認・封印） */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(26,26,26,.35)}
.card{position:relative;background:var(--paper);box-shadow:inset 0 0 0 4px var(--ink),10px 10px 0 var(--red);padding:22px 22px 20px;max-width:560px;width:100%;max-height:calc(100% - 10px);overflow:auto;transform:rotate(-1.2deg)}
.card h2{font-family:var(--disp);font-weight:400;margin:0 0 8px;font-size:26px;line-height:1.2}
.card p{line-height:1.6;margin:8px 0}
.card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.verdict{font-family:var(--disp);font-size:52px;line-height:1;color:var(--red);text-shadow:4px 4px 0 var(--ink);margin:4px 0 10px;transform:rotate(-6deg);display:inline-block}

.tagpick button::before{content:"";position:absolute;left:12px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--ink)}
.tagpick button.sel{background:var(--red);color:#fff;box-shadow:4px 4px 0 var(--ink)}
.tagpick button.sel::before{background:#fff;box-shadow:none}
.tagpick button.mis{}
.env{position:relative;margin:12px auto;width:min(320px,90%);height:150px;background:#d9cfb7;box-shadow:inset 0 0 0 3px var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:22px}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(to bottom right,transparent 49.5%,var(--ink) 49.5%,var(--ink) 51%,transparent 51%),linear-gradient(to bottom left,transparent 49.5%,var(--ink) 49.5%,var(--ink) 51%,transparent 51%)}

.ordbox div{padding:6px 10px;margin:4px 0;background:var(--ink);color:#fff;font-weight:700}
#tFb{margin-top:14px;font-weight:700;line-height:1.6}
#tFb .mk{font-family:var(--disp);font-size:40px;color:var(--red);margin-right:10px;vertical-align:middle}
#tFb .ex{display:block;border-left:8px solid var(--red);padding:4px 10px;margin:8px 0}
/* 仕上げ（演出どぱどぱ・とっつきやすさ） */
body.tut #band,body.tut #stageTag,body.tut #bar{display:none!important}
body:has(#dlg:not(.hidden)) .gd-coach,body:has(#dlg:not(.hidden)) .gd-band{visibility:hidden}

.stars{display:flex;gap:14px;margin:2px 0 10px}

.stars .s svg{width:58px;height:58px}
.stars .s small{font-size:11px;font-weight:800;white-space:nowrap}
.stars .s.on{animation:stampS .32s cubic-bezier(.2,1.6,.4,1) forwards}

.blk:hover{transform:translate(-1px,-1px)}
@media (prefers-reduced-motion:reduce){.stars .s.on,.stars .s.no.on,.verdict{animation-duration:.01ms!important}}

@media (orientation:portrait){#band{left:50%;transform:translateX(-50%) rotate(-1.5deg);max-width:94vw;text-align:center!important;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 64px)}#msg{top:26%}}
@media (max-width:520px){#stageTag{left:8px;top:calc(max(8px,env(safe-area-inset-top)) + 54px);transform:rotate(-3deg)}#bar{left:auto;right:8px;transform:rotate(-2deg);width:calc(100vw - 150px)!important;top:calc(max(8px,env(safe-area-inset-top)) + 58px)!important}#msg{font-size:14px;padding:8px 12px}#claim{top:100px;max-width:62vw}#claim p{font-size:12px}#band{font-size:13px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 64px);width:94vw}.verdict{font-size:40px}#stageTag b{font-size:13px}#stageTag span{font-size:10px}.chip{min-width:44px;padding:3px 6px}.chip b{font-size:18px}#bar{top:calc(max(8px,env(safe-area-inset-top)) + 58px);width:86vw}}

 <div class="hd"><span class="no" id="tNo">01</span><b>確認テスト</b><span id="tOf" style="font-family:var(--num);font-size:20px;margin-left:auto"></span></div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

window.QUIZ={"v": 1, "grade": "chu2", "unit": "kagaku", "game": "moetara-debate", "koma": ["chu2-kagaku-17"], "testCount": 10, "questions": [{"id": "chu2-moetara-debate-q001", "koma": "chu2-kagaku-17", "t": "choice", "q": "ろうそくや木などの物が燃えるとき、空気中から使われる気体はどれ？", "choices": ["酸素", "窒素", "二酸化炭素", "水素"], "ex": "物が燃えるときは空気中の酸素が使われる（小6）。ふたをした集気びんの中では、酸素が減って火が消える。", "kind": "term", "fig": null, "level": 1}, {"id": "chu2-moetara-debate-q002", "koma": "chu2-kagaku-17", "t": "choice", "q": "集気びんの中でろうそくを燃やしたあと、石灰水を入れてふると白くにごった。このことから分かることはどれ？", "choices": ["ろうそくが燃えて、二酸化炭素ができた", "ろうそくが燃えて、酸素がふえた", "ろうそくが燃えて、窒素ができた", "ろうそくが燃えると、水だけができる"], "ex": "石灰水を白くにごらせるのは二酸化炭素。燃えて二酸化炭素ができた証拠になる。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-moetara-debate-q003", "koma": "chu2-kagaku-17", "t": "choice", "q": "紙を燃やすと、残った灰は燃やす前の紙よりずっと軽くなる。その理由として、理科として筋が通っているのはどれ？", "choices": ["燃えてできた二酸化炭素や水蒸気が、空気中へ出ていったから", "熱くなった物は軽くなるから", "燃えると物は消えてなくなるから", "火の重さが抜けたから"], "ex": "紙の成分は燃えて気体（二酸化炭素・水蒸気）になり、空気中へ出ていく。原子が消えたわけではない。", "kind": "judge", "level": 2, "fig": null}, {"id": "chu2-moetara-debate-q004", "koma": "chu2-kagaku-17", "t": "choice", "q": "しぼんだボールの質量をはかったあと、空気を入れてふくらませてから、もう一度はかった。結果として正しいものはどれ？", "choices": ["空気を入れた後のほうが重い", "空気を入れた後のほうが軽い", "変わらない", "はかるたびにちがい、決まらない"], "ex": "気体にも質量がある。空気を入れた分だけ重くなる（中1）。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-moetara-debate-q005", "koma": "chu2-kagaku-17", "t": "choice", "q": "次の予想の（　）に入る、根拠とつながった言葉はどれ？「金属が燃えるときに空気中の酸素と結び付くとしたら、燃えた後の物質の質量は、燃やす前より（　）はずだ。」", "choices": ["結び付いた酸素の分だけ大きくなる", "熱で小さくなる", "酸素が消えるので小さくなる", "原子が消えるので小さくなる"], "ex": "「もし酸素と結び付くなら」という仮定から考えると、酸素にも質量があるので、その分が加わるはず。これを実験で確かめる。", "kind": "judge", "level": 2, "fig": null}, {"id": "chu2-moetara-debate-q006", "koma": "chu2-kagaku-17", "t": "choice", "q": "「スチールウールも燃やすと軽くなる」と予想した人がいる。この予想の根拠として、理科として筋が通っているものはどれ？", "choices": ["紙やろうそくは、燃えてできた気体が出ていって軽くなったから、同じことが起こるかもしれない", "熱い物は冷たい物より軽いから", "燃えると物は消えてなくなるから", "気体には質量がないから"], "ex": "ほかの物が燃えたときの事実を根拠にした予想。ほかの選択肢は理科として正しくない考え。予想が当たるかどうかは実験で決まる。", "kind": "judge", "level": 2, "fig": null}, {"id": "chu2-moetara-debate-q007", "koma": "chu2-kagaku-17", "t": "order", "q": "スチールウールを燃やすと質量がどう変わるかを確かめる実験。正しい手順に並べよう。", "items": ["燃やす前のスチールウールの質量をはかる", "スチールウールを加熱して燃やす", "冷めてから、燃やした後の物質の質量をはかる", "燃やす前と後の質量をくらべる"], "ex": "前と後を、同じはかり方でくらべる。熱いまま上皿にのせると正しくはかれないので、冷めてからはかる。", "kind": "method", "fig": null, "level": 1}, {"id": "chu2-moetara-debate-q008", "koma": "chu2-kagaku-17", "t": "choice", "q": "「熱い物は、冷たい物より軽い」という考えについて、正しいものはどれ？", "choices": ["正しくない。温度が変わっても物の質量は変わらない", "正しい。温度が高いほど質量は小さい", "正しい。熱には重さがあるから", "金属のときだけ正しい"], "ex": "氷がとけて水になっても、あたためても冷やしても、質量は変わらない（中1）。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-moetara-debate-q009", "koma": "chu2-kagaku-17", "t": "choice", "q": "スチールウールとは何か。正しいものはどれ？", "choices": ["鉄を細い繊維のようにしたもの", "銅を細い繊維のようにしたもの", "羊の毛でできた布", "アルミニウムのはく"], "ex": "スチールウールは細い鉄の繊維。表面積が大きいので、火をつけると赤く光って燃える。", "kind": "term", "fig": null, "level": 1}, {"id": "chu2-moetara-debate-q010", "koma": "chu2-kagaku-17", "t": "choice", "q": "火をつけたスチールウールを、酸素を入れた集気びんに入れると、空気中よりも激しく燃えた。このことから考えられることはどれ？", "choices": ["スチールウールが燃えることに、酸素が関係している", "スチールウールが燃えるのに、酸素は関係ない", "酸素の中では、鉄が別の原子に変わる", "酸素の中では、火の重さがふえる"], "ex": "酸素が多いほど激しく燃える。鉄も、燃えるときに酸素が関係していると考えられる。", "kind": "judge", "fig": null, "level": 1}, {"id": "chu2-moetara-debate-q011", "koma": "chu2-kagaku-17", "t": "choice", "q": "燃やす前と後の質量をくらべる実験で、気をつけることとして正しいものはどれ？", "choices": ["燃やす前と後で、同じ皿にのせて、同じてんびんではかる", "燃やす前は皿ごと、後は中身だけをはかる", "燃やした直後の熱いうちにすぐはかる", "燃えかすの一部がこぼれても気にしない"], "ex": "前と後で条件をそろえないと、ちがいが燃えたことによるものか分からない。", "kind": "method", "level": 2, "fig": null}, {"id": "chu2-moetara-debate-q012", "koma": "chu2-kagaku-17", "t": "choice", "q": "物質が、熱や光を出しながら激しく酸素と結び付く変化を何という？", "choices": ["燃焼", "分解", "状態変化", "蒸発"], "ex": "激しく熱や光を出して酸素と結び付く変化を燃焼という。", "kind": "term", "fig": null, "level": 1}, {"id": "chu2-moetara-debate-q013", "koma": "chu2-kagaku-17", "t": "choice", "q": "火をつけたろうそくをてんびんにのせたまま燃やし続けた。ろうそくの質量の変化を表すグラフはア〜ウのどれ？", " う。", "kind": "graph", "level": 2, "fig": null}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

function onUp(e){if(!drag)return;const d=drag;drag=null;const p=e&&e.clientX!=null?toWorld(e.clientX,e.clientY):{x:0,y:0};
 if(d.k==='beam')return;
 if(d.k==='tool'){useTool(d.id,d.x,d.y);return}
 if(d.k==='disc'){const a=panAnchor(1);if(Math.abs(d.x-a.x)<L.pw*.7&&Math.abs(d.y-(a.y-AR*2))<AR*6){R.pred=Math.min(10,R.pred+1);SFX.drop()}setBand();return}
 if(d.k==='item'){releaseItem(d.it,flingV(d.hist));return}
 if(d.k==='wool'){const v=flingV(d.hist);if(v.vy<-650||R.wool.y<L.exitY+60){R.wool.st='fly';R.wool.vx=v.vx*.3;R.wool.vy=Math.min(-500,v.vy);SFX.flick();fly('↑ 出ていく',R.wool.x,R.wool.y,INK)}else{R.wool.st='pan';SFX.drop()}return}
 if(d.k==='o2wool'){dropWoolJar();return}
 if(d.k==='air'){d.m.held=false;dropAir(d.m);return}
}
function itemPos(it){if(it.st==='drag'||it.st==='fly')return{x:it.x,y:it.y};const a=panAnchor(1);if(it.lx==null)packPan();return{x:a.x+(it.lx||0),y:a.y+(it.ly||-AR)}}
function itemHalf(it){return it.sp==='ASH'?AR*1.5:molHalfW(it.sp)*AR*.74}
/* 皿の上に、幅を見ながら左右交互に積む */
function packPan(){if(!R)return;const half=L.pw/2+16,b=bodyHalf()+4,rh=AR*2.1;let row=0,cl=b,cr=b;
 for(const it of R.items){if(it.st!=='pan'&&it.st!=='drag'&&it.st!=='fly')continue;if(it.st!=='pan')continue;const w=itemHalf(it);let side=cr<=cl?1:-1,cur=side>0?cr:cl;
  if(cur+2*w>half){side=-side;cur=side>0?cr:cl;if(cur+2*w>half){row++;cl=b;cr=b;side=1;cur=b}}
  it.lx=side*(cur+w);it.ly=-AR*1.1-row*rh;if(side>0)cr=cur+2*w+2;else cl=cur+2*w+2}}
function releaseItem(it,v){
 if(v.vy<-650||it.y<L.exitY+50){it.st='fly';it.vx=v.vx*.25;it.vy=Math.min(-520,v.vy*.8);SFX.flick();fly('↑ 空気中へ',it.x,it.y-20,INK);vib(10);R.flN=(R.flN||0)+1;AU.t(500+R.flN*110,.18,'sine',.06,.04,900+R.flN*110);burst(it.x,it.y,8,[INK,PAPER]);R.touched=true;setBand();setCtrl();return}
 it.st='pan';SFX.drop();setBand();setCtrl();
}

/* ---- 空気の分子を落とした先 ---- */
function dropAir(m){const rd=R.rd;
 if(rd.k==='jar'){const J=R.jarS,f=jarFlame();if(Math.hypot(m.x-f.x,m.y-f.y)<AR*3.2&&J.lit&&!J.out){
   if(m.sp==='N2'){mistake('窒素は、ろうそくが燃えるのに使われない。',m.x,m.y);bounce(m);return}
   if(m.sp==='CO2'){mistake('二酸化炭素には、物を燃やすはたらきがない。',m.x,m.y);bounce(m);return}
   // 酸素が使われて二酸化炭素ができる
   J.mols.splice(J.mols.indexOf(m),1);J.o2--;J.co2++;const c=jarMol('CO2');c.x=f.x;c.y=f.y-20;c.vy=-80;J.mols.push(c);SFX.burn();burst(f.x,f.y,10,[RED,INK]);fly('酸素 −1',f.x,f.y-40,RED);gainV(10,f.x,f.y);
   if(J.o2<=8){J.out=true;setTimeout(()=>{say('火が消えた！ まだ酸素は残っているのに…','');SFX.gavel();setBand();setCtrl()},500)}
   setBand();return}
  keepInJar(m);return}
 // 燃やす：炎へ
 if(R.fuel&&R.fuel.atoms.length){const f=fuelPos();if(Math.hypot(m.x-f.x,m.y-f.y)<AR*3.6){
   if(m.sp==='N2'){mistake('窒素は燃えるのに使われない。空気中の<b>酸素</b>を選ぼう。',m.x,m.y);bounce(m);return}
   if(!R.lit){say('まだ火がついていない。棚の<b>マッチ</b>を運ぼう。','');bounce(m);return}
   burnWith(m);return}}
 if(rd.k==='heat'&&R.tube&&!R.tube.done){const f=fuelPos();if(Math.hypot(m.x-f.x,m.y-f.y)<AR*4){
   if(m.sp==='O2'){mistake('分解には、空気中の酸素は使わない。加熱するだけで分かれる。',m.x,m.y);bounce(m);return}
   mistake('窒素は反応に使われない。',m.x,m.y);bounce(m);return}}
 if(rd.k==='ball'){const f=ballPos(),r=ballR();if(Math.hypot(m.x-f.x,m.y-f.y)<r+AR*2){
   R.air.splice(R.air.indexOf(m),1);R.ball.n++;R.ball.mm=(R.ball.mm||0);R.ball.mm+=molMass(m.sp);R.ball.n=R.ball.n;R.ball.mmA=(R.ball.mmA||[]);R.ball.mmA.push(m.sp);
   SFX.pop();burst(f.x,f.y-r,6,[RED,INK]);fly('＋'+MOL[m.sp].nm,f.x,f.y-r-20,RED);R.air.push(airMol(Math.random()<.2?'O2':'N2',true));setBand();setCtrl();return}}
 if(rd.k==='final'&&R.wool.st==='pan'){const f=woolPos();if(Math.hypot(m.x-f.x,m.y-f.y)<AR*4){
   if(m.sp==='N2'){mistake('窒素は燃えるのに使われない。',m.x,m.y);bounce(m);return}
   if(!R.wool.lit){say('まだ火がついていない。<b>マッチ</b>で火をつけてから。','');bounce(m);return}
   if(R.wool.o>=6){say('あなたの考えでは、もう十分に結び付いた。','');bounce(m);return}
   R.air.splice(R.air.indexOf(m),1);R.wool.o++;SFX.burn();burst(f.x,f.y,12,[RED,INK,'#fff']);fly('＋酸素（結び付く？）',f.x,f.y-50,RED);R.air.push(airMol(Math.random()<.35?'O2':'N2',true));setBand();return}}
 if(m.y>L.air.y1+20||m.x<L.air.x0-20){m.vx=rnd(-30,30);m.vy=-rnd(60,120)}
}
function bounce(m){m.vy=-rnd(160,240);m.vx=rnd(-80,80);if(R.jarS)keepInJar(m)}
function keepInJar(m){const J=L.jar;m.x=clamp(m.x,J.x-J.w/2+14,J.x+J.w/2-14);m.y=clamp(m.y,J.y-J.h/2+20,J.y+J.h/2-20)}
function burnWith(m){const F=R.fuel,f=fuelPos();R.air.splice(R.air.indexOf(m),1);
 let made=[];const ci=F.atoms.indexOf('C');
 if(ci>=0){F.atoms.splice(ci,1);made=['CO2']}else{let hs=0;for(let i=F.atoms.length-1;i>=0&&hs<4;i--)if(F.atoms[i]==='H'){F.atoms.splice(i,1);hs++}made=hs>=4?['H2O','H2O']:['H2O']}
 made.forEach((sp,i)=>{addProduct(sp,f.x+(i?20:-20),f.y-10,true)});
 R.burnN=(R.burnN||0)+1;AU.t(360+R.burnN*90,.22,'triangle',.08,.05);FLS=Math.max(FLS,RM?0:.35);vib(16);
  SFX.burn();burst(f.x,f.y-10,14+R.burnN*3,[RED,INK,'#fff']);SHK=RM?0:4;fly('＋酸素 → '+made.map(s=>MOL[s].nm.replace('（水蒸気）','')).join('・'),f.x,f.y-60,RED);gainV(10,f.x,f.y-30);
 if(!F.atoms.length){setTimeout(()=>{if(!R||R.fuel!==F)return;if(F.extra){const a=addProduct('ASH',f.x,f.y,false);a.m=F.extra;a.sp='ASH'}R.fuel=null;R.lit=false;say(F.nm+'が燃えきった。できた物を、どうする？','');setBand();setCtrl()},350)}
 setBand();setCtrl();
}
MOL.ASH={a:[],nm:'灰'};

/* ---- 道具 ---- */
const TOOL={
 match:{nm:'マッチ',hint:'火をつける'},burner:{nm:'ガスバーナー',hint:'加熱する'},warm:{nm:'あたためる',hint:'温める'},
 lime:{nm:'石灰水',hint:'びんへ入れる'},disc:{nm:'酸素の重り',hint:'右の皿へ'},
 heat:{nm:'熱',hint:'重り？',pseudo:1},light:{nm:'光',hint:'重り？',pseudo:1}};
function toolRects(){const tl=R.rd.tools||[],S0=L.shelf,n=tl.length,w=Math.min(PORT?190:200,(S0.x1-S0.x0)/Math.max(n,2)),h=S0.y1-S0.y0,x0=(S0.x0+S0.x1)/2-w*n/2;return tl.map((id,i)=>({id,x:x0+w*i,y:S0.y0,w,h}))}
function toolAt(p){for(const r of toolRects())if(p.x>r.x+4&&p.x<r.x+r.w-4&&p.y>r.y-20&&p.y<r.y+r.h)return r;return null}
function toolEnabled(id){const J=R.jarS;if(id==='disc')return R.rd.k==='jar'&&!R.predLocked;
 if(id==='match'){if(J)return R.predLocked&&!J.lit;if(R.wool)return!R.wool.lit;return!!R.fuel&&!R.lit}
 if(id==='lime')return J&&J.out&&!J.lime;return true}
function toolWhy(id){const J=R.jarS;if(id==='match'&&J&&!R.predLocked)say('先に予想！ 赤い重りを右の皿へ置いて、「予想を決めて着火」','');else if(id==='lime'&&J&&!J.out)say('石灰水は、火が消えてから。','');else if(id==='disc')say('予想はもう決めた。','');else say('いまは使わない。','')}
function useTool(id,x,y){const rd=R.rd;const T=TOOL[id];
 const a=panAnchor(1),onPan=Math.abs(x-a.x)<L.pw*.65&&y>a.y-AR*9&&y<a.y+AR*2;
 if(T.pseudo){if(onPan){mistake(id==='heat'?'「熱」は重りにならない。熱には質量がない。':'「光」は重りにならない。光には質量がない。',x,y);if(rd.k==='ball'&&id==='heat'){R.ball.warm=1.4;say('温めるとボールは少しふくらむ。でも熱には質量がない。天秤は動かない。','bad')}}return}
 if(id==='disc'){if(onPan){R.pred=Math.min(10,R.pred+1);SFX.drop();setBand()}return}
 if(id==='match'){
  if(R.jarS){const f=jarFlame();if(Math.hypot(x-f.x,y-f.y)<AR*5){R.jarS.lit=true;SFX.ignite();burst(f.x,f.y,10,[RED,INK]);setBand();setCtrl()}else say('マッチを、びんの中のろうそくの芯へ。','');return}
  if(R.wool){const f=woolPos();if(Math.hypot(x-f.x,y-f.y)<AR*4.5){R.wool.lit=true;SFX.ignite();burst(f.x,f.y,16,[RED,'#fff',INK]);fly('ちりちり…',f.x,f.y-40,RED);setBand();setCtrl()}else say('マッチを、スチールウールへ。','');return}
  if(R.fuel){const f=fuelPos();if(Math.hypot(x-f.x,y-f.y)<AR*5){R.lit=true;SFX.ignite();burst(f.x,f.y,12,[RED,INK]);fly('点火！',f.x,f.y-50,RED);setBand();setCtrl()}else say('マッチを、'+R.fuel.nm+'へ運ぼう。','')}return}
 if(id==='burner'){if(R.tube&&!R.tube.done&&onPan){R.tube.heating=true;SFX.ignite();setBand()}else say('ガスバーナーを、試験管の下へ。','');return}
 if(id==='warm'){if(R.ice&&!R.ice.done&&onPan){R.ice.heating=true;SFX.ignite();setBand()}else say('氷の皿へ運んで、温めよう。','');return}
 if(id==='lime'){const J=L.jar;if(Math.abs(x-J.x)<J.w*.6&&Math.abs(y-J.y)<J.h*.6){R.jarS.lime=.01;SFX.pop();setBand();setCtrl()}else say('石灰水を、びんの中へ。','');return}
}
function jarFlame(){const J=L.jar;return{x:J.x,y:J.y+J.h/2-AR*4.6}}
function woolPos(){if(R.wool&&(R.wool.st==='drag'||R.wool.st==='fly'||R.wool.held))return{x:R.wool.x,y:R.wool.y};if(R.wool&&R.wool.inJar>=0){const j=L.jars3[R.wool.inJar];return{x:j.x,y:j.y+10}}const a=panAnchor(1);return{x:a.x,y:a.y-AR*2}}
function ballPos(){const a=panAnchor(1);return{x:a.x,y:a.y-ballR()}}
function ballR(){return AR*(1.4+Math.min(1.6,(R.ball?R.ball.n:0)*.16))*(1+(R.ball&&R.ball.warm>0?.08:0))}

/* ---- スチールウールをびんへ（準決勝3） ---- */
function dropWoolJar(){const w=R.wool;w.held=false;const p={x:w.x,y:w.y};
 const J=L.jars3.findIndex(j=>Math.abs(p.x-j.x)<j.w*.6&&Math.abs(p.y-j.y)<j.h*.6);if(J<0){SFX.drop();return}
 const g=R.jars[J].g;w.inJar=J;
 if(g==='O2'){w.burn=1;SFX.burn();SFX.crowd();burst(L.jars3[J].x,L.jars3[J].y,40,[RED,'#fff',INK]);SHK=RM?0:10;fly('バチバチッ！！',L.jars3[J].x,L.jars3[J].y-90,RED);
  setTimeout(()=>roundWin(),1400)}
 else{w.burn=-1;mistake(g==='N2'?'窒素の中では、火が消えてしまった。窒素には物を燃やすはたらきがない。':'二酸化炭素の中では、火が消えてしまった。',p.x,p.y);
  setTimeout(()=>{w.inJar=-1;w.burn=0;w.lit=false;R.fails++;setBand();setCtrl()},1600)}
}

/* ---- 判定 → 事実の箱 ---- */
function judgeReady(){if(!R||R.phase!=='act')return false;const rd=R.rd;
 if(rd.k==='jar')return R.predLocked&&R.jarS.out&&R.jarS.lime>=1;
 if(rd.k==='burn')return!R.fuel&&!R.items.some(i=>i.st==='drag'||i.st==='fly');
 if(rd.k==='heat')return R.tube.done;
 if(rd.k==='melt')return R.ice.done;
 if(rd.k==='ball')return R.ball.n>=4;
 if(rd.k==='final')return R.wool.st==='pan'||R.wool.st==='gone';
 return false}
function doJudge(){if(!judgeReady()){notReady();return}
 const rd=R.rd;R.pdir=dirNow();SFX.gavel();
 if(rd.k==='final'){R.phase='sealpick';openSealPick();return}
 R.phase='box';fly(rd.k==='jar'?'予想：'+R.pred+'個':'あなたの傾き：'+DIRS[R.pdir],L.piv.x,L.piv.y-120,RED,1.3);
 if(rd.timer&&R.sub<rd.subs.length){R.box.hits=2}
 setBand();setCtrl();
}
function notReady(){const rd=R.rd;
 if(rd.k==='jar'){if(!R.predLocked)say('まず予想の重りを置いて「予想を決めて着火」。','');else if(!R.jarS.lit)say('マッチで火をつけよう。','');else if(!R.jarS.out)say('炎に酸素を入れて、火が消えるまで燃やそう。','');else say('石灰水をびんへ入れて、ふってみよう。','');return}
 if(R.fuel)say(R.fuel.nm+'がまだ燃え残っている。'+(R.lit?'酸素を炎へ。':'マッチで火をつけよう。'),'');
 else if(rd.k==='heat')say('ガスバーナーで試験管を加熱しよう。','');
 else if(rd.k==='melt')say('氷を温めて、とかそう。','');
 else if(rd.k==='ball')say('空気の分子をボールへ入れよう（4つ以上）。','');
}
function hitBox(){if(!R)return;
 if(R.rd.k==='final'){say('この箱は、実際に金属を燃やす実験のあと（燃えかす鍛冶場）で開ける。','');SFX.bad();return}
 if(R.phase!=='box'){R.box.shake=.3;SFX.tap();if(R.phase==='act')say('事実の箱は、判定のあとで割る。先に自分の傾きを決めよう。','');return}
 R.box.hits++;R.box.shake=.35;SHK=RM?0:5+R.box.hits*2;SFX.hit(R.box.hits);vib(12+R.box.hits*8);fly(['ドン！','ドドン！','バキッ！'][R.box.hits-1]||'ドン！',L.box.x,L.box.y-L.box.s*.8,RED,1+R.box.hits*.2);burst(L.box.x,L.box.y,10,[INK,RED,PAPER]);
 if(R.box.hits>=3){R.phase='open';R.box.open=true;SFX.crash();burst(L.box.x,L.box.y,50,[INK,RED,PAPER,'#fff']);SHK=RM?0:12;setBand();setCtrl();setTimeout(reveal,650)}}
function modelErrors(){const rd=R.rd,e=[];
 if(rd.k==='burn'||rd.k==='heat'){const stay=R.items.filter(i=>i.st==='pan'&&i.leave),out=R.items.filter(i=>i.st==='gone'&&!i.leave);
  stay.forEach(i=>e.push({it:i,t:MOL[i.sp].nm+'は気体。開いた皿の上には残らない（空気中へ出ていく）'}));
  out.forEach(i=>e.push({it:i,t:MOL[i.sp].nm+'は固体。空気中へ飛んでいかず、皿に残る'}))}
 if(rd.k==='melt')R.items.filter(i=>i.st==='gone').forEach(i=>e.push({it:i,t:'とけた水は液体。皿の上に残る'}));
 return e}
function reveal(){const rd=R.rd;let win,html='',near=false;
 if(rd.k==='jar'){const act=8,d=Math.abs(R.pred-act);win=d<=1;near=!win&&d<=3;
  const J=R.jarS;R.predShow=R.pred;R.pred=act;
  html=`<div class="cmp"><div><small>あなたの予想（残る酸素）</small><b>${R.predShow}個</b></div><div><small>事実</small><b>${act}個（約17％）</b></div></div>
  ${win?'':`<p class="why">${near?'おしい！ ':''}予想と事実の差は <b>${d}個</b>。</p>`}`;
 }else{
  const errs=modelErrors();R.errs=errs;const dm=R.pdir===rd.fact;win=dm&&!errs.length;near=dm&&errs.length>0;
  html=`<div class="cmp"><div><small>あなたの傾き</small><b>${DIRS[R.pdir]}</b></div><div><small>事実</small><b>${DIRS[rd.fact]}</b></div></div>
  ${near?`<p class="why">向きは合っている。でも <b>あと${errs.length}手</b>：${esc(errs[0].t)}。</p>`:''}
  ${!dm&&errs.length?`<p class="why">${esc(errs[0].t)}。</p>`:''}`;
 }
 if(rd.timer&&win&&R.sub<rd.subs.length-1){subWin();return}
 if(win){roundWin(html);return}
 R.fails++;comboBreak();S.combo=0;updHud();SFX.bad();
 showRes(`<div class="verdict no">${near?'おしい！':'ハズレ'}</div>${html}
  <div class="fact"><small>事実の箱の中身</small>${esc(rd.factT)}</div><p class="why">${esc(rd.whyT)}</p>
  <div class="row"><button class="blk red" id="rAgain">もう一度</button></div>`,()=>{$('rAgain').onclick=()=>{hideRes();SFX.tap();startRound(true)}});
}
function subWin(){const rd=R.rd;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);gainV(60,L.piv.x,L.piv.y-100);SFX.fan();fly('的中！ '+(R.sub+1)+'/'+rd.subs.length,L.piv.x,L.piv.y-160,RED,1.6);burst(L.box.x,L.box.y,30,[RED,INK]);

function roundWin(extra){const rd=R.rd,first=R.att===1&&R.mist===0&&R.fails===0;
 S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);if(first)S.firstWins++;
 let g=0;if(first)g+=earn(10,'first-try');if(rd.k==='jar'||rd.k==='burn'&&S.round===5)g+=earn(30,'rule');
 const tagNew=rd.tag&&!S.tags.includes(rd.tag);if(tagNew)S.tags.push(rd.tag);
 const tb=rd.timer?Math.max(0,Math.round(R.timer))*2:0;const v=gainV(100+tb,L.piv.x,L.piv.y-120);
 R.phase='done';SFX.fan();SFX.crowd();setClaim(true);burst(L.piv.x,L.piv.y-60,60,[RED,INK,PAPER]);SHK=RM?0:8;FLS=RM?0:.6;vib([20,40,30]);
  if([3,5,8].includes(S.combo)){fly(S.combo+'連続 的中！',L.piv.x,L.piv.y-230,RED,2.2);burst(L.piv.x,L.piv.y-230,40,[RED,INK,'#fff']);AU.t(1318,.5,'square',.05,.6)}
 S.round++;save();updHud();
 const stG=[true,R.att===1&&R.fails===0,R.mist===0];
  showRes(`<div class="verdict">${rd.k==='o2jar'?'燃えた！':'的中！'}</div>${starsHTML(stG,['的中','1回目で','異議なし'])}${extra||''}
  <div class="fact"><small>事実</small>${esc(rd.factT)}</div><p class="why">${esc(rd.whyT)}</p>

let last=performance.now(),bandT=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;now+=dt;update(dt);draw();requestAnimationFrame(frame)}
function update(dt){
 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').className=''}
 if(HELP){const want=scene==='play'||scene==='gut';if(want!==helpVis){helpVis=want;want?HELP.show():HELP.hide()}}
  if(FLS>0)FLS=Math.max(0,FLS-dt*2);
  if(scene==='play'&&R&&!PAUSED){S.t+=dt;
  if(R.rd.timer&&R.phase==='act'&&R.timer>0){R.timer-=dt;bandT-=dt;if(bandT<=0){bandT=1;setBand()}}
  // 空気の分子がただよう
  const A=L.air;for(const m of R.air){if(m.held)continue;m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=m.vr*dt;m.vx+=rnd(-20,20)*dt;m.vy+=rnd(-20,20)*dt;
   const sp=Math.hypot(m.vx,m.vy);if(sp>90){m.vx*=.97;m.vy*=.97}
   if(m.x<A.x0+20){m.x=A.x0+20;m.vx=Math.abs(m.vx)}if(m.x>A.x1-20){m.x=A.x1-20;m.vx=-Math.abs(m.vx)}if(m.y<A.y0+20){m.y=A.y0+20;m.vy=Math.abs(m.vy)}if(m.y>A.y1-20){m.y=A.y1-20;m.vy=-Math.abs(m.vy)}}
  if(R.air.length&&R.air.filter(m=>m.sp==='O2').length<3)R.air.push(airMol('O2',true));
  if(R.jarS){const J=L.jar,s=R.jarS;for(const m of s.mols){if(m.held)continue;m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=m.vr*dt;
    if(m.x<J.x-J.w/2+14){m.x=J.x-J.w/2+14;m.vx=Math.abs(m.vx)}if(m.x>J.x+J.w/2-14){m.x=J.x+J.w/2-14;m.vx=-Math.abs(m.vx)}if(m.y<J.y-J.h/2+26){m.y=J.y-J.h/2+26;m.vy=Math.abs(m.vy)}if(m.y>J.y+J.h/2-16){m.y=J.y+J.h/2-16;m.vy=-Math.abs(m.vy)}}
   if(s.lime>0&&s.lime<1){s.lime=Math.min(1,s.lime+dt*.6);if(s.lime>=1){SFX.pop();say('石灰水が白くにごった！ 二酸化炭素ができている。','');setBand();setCtrl()}}}
  // 加熱・とける
  if(R.tube&&R.tube.heating&&!R.tube.done){R.tube.heat+=dt/1.6;if(Math.random()<.4){const f=fuelPos();PT.push({x:f.x+rnd(-10,10),y:f.y+AR*2.4,vx:rnd(-20,20),vy:-rnd(40,90),t:0,life:.5,sz:rnd(4,8),col:RED,sh:1,rot:0,vr:0})}
   if(R.tube.heat>=1){R.tube.done=true;R.tube.heating=false;const f=fuelPos();// 2NaHCO3 → Na2CO3 + CO2 + H2O（原子の数はそのまま）
    addProduct('NA2CO3',f.x,f.y,false);addProduct('CO2',f.x-20,f.y-20,true);addProduct('H2O',f.x+20,f.y-20,true);R.body.m=50;R.tube.n=0;
    SFX.burn();burst(f.x,f.y,20,[RED,INK]);say('分かれた！ 3つの物質ができた。どれが出ていく？','');setBand();setCtrl()}}
  if(R.ice&&R.ice.heating&&!R.ice.done){R.ice.melt+=dt/1.8;if(R.ice.melt>=1){R.ice.done=true;const a=panAnchor(1);for(let i=0;i<3;i++){const it=addProduct('WAT',a.x,a.y-20,false);it.liquid=true}SFX.pop();say('とけて水になった。水の分子はどうする？','');setBand();setCtrl()}}
  if(R.ball&&R.ball.warm>0)R.ball.warm=Math.max(0,R.ball.warm-dt);
  // 飛んでいく物
  for(const it of R.items){if(it.st==='fly'){it.x+=it.vx*dt;it.y+=it.vy*dt;it.vy-=200*dt;if(it.y<-120){it.st='gone';setCtrl()}}}
  if(R.wool&&R.wool.st==='fly'){R.wool.x+=R.wool.vx*dt;R.wool.y+=R.wool.vy*dt;if(R.wool.y<-150){R.wool.st='gone';setCtrl()}}
  if(R.wool&&R.wool.lit&&Math.random()<(R.wool.burn>0?.9:.25)){const f=woolPos();const n=R.wool.burn>0?4:1;for(let i=0;i<n;i++)PT.push({x:f.x+rnd(-14,14),y:f.y+rnd(-14,14),vx:rnd(-220,220)*(R.wool.burn>0?1.6:.5),vy:rnd(-260,60),t:0,life:rnd(.2,.6),sz:rnd(2,5),col:Math.random()<.6?RED:'#fff',sh:3,rot:0,vr:0})}
  if(R.box.shake>0)R.box.shake=Math.max(0,R.box.shake-dt);
 }
 if(R)packPan();
 // シーソー（ぎしり）
 let tgt=0;if(scene==='gut')tgt=SEE.hold==null?0:SEE.hold;else if(R&&scene==='play'){const d=rightVal()-R.mL;tgt=.2*Math.tanh(d/(R.rd.k==='jar'?3.2:Math.max(20,R.mL*.35)))}
 const acc=55*(tgt-SEE.th)-8*SEE.w;SEE.w+=acc*dt;SEE.th+=SEE.w*dt;creakT-=dt;if(Math.abs(SEE.w)>.25&&creakT<=0){creakT=.35;SFX.creak()}
 if(SHK>0)SHK=Math.max(0,SHK-dt*30);
 PT=PT.filter(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.rot+=p.vr*dt;return p.t<p.life});
 FT=FT.filter(f=>{f.t+=dt;return f.t<f.life});
 if(scene==='play'&&R&&(Math.floor(now*2)!==Math.floor((now-dt)*2)))setCtrl();
}

 solve(){// いまの試合を理科として正しく動かす（確認用）
  if(scene==='gut'){SEE.hold=.15;gutDone();return}
  const rd=R.rd;if(rd.k==='jar'){R.pred=8;lockPred();R.jarS.lit=true;while(R.jarS.o2>8){const m=R.jarS.mols.find(x=>x.sp==='O2');const f=jarFlame();m.x=f.x;m.y=f.y;dropAir(m)}R.jarS.lime=1;return}
  if(rd.k==='o2jar'){R.wool.lit=true;const j=R.jars.findIndex(x=>x.g==='O2');R.wool.x=L.jars3[j].x;R.wool.y=L.jars3[j].y;dropWoolJar();return}
  if(rd.k==='heat'){R.tube.heat=1;R.tube.heating=true;return}
  if(rd.k==='melt'){R.ice.heating=true;R.ice.melt=1;return}
  if(rd.k==='ball'){for(let i=0;i<4;i++){const m=R.air[0];const f=ballPos();m.x=f.x;m.y=f.y;dropAir(m)}return}
  if(rd.k==='final'){R.wool.lit=true;for(let i=0;i<3;i++){const m=R.air.find(x=>x.sp==='O2');const f=woolPos();m.x=f.x;m.y=f.y;dropAir(m)}return}
  R.lit=true;let g=0;while(R.fuel&&R.fuel.atoms.length&&g++<20){const m=R.air.find(x=>x.sp==='O2');const f=fuelPos();m.x=f.x;m.y=f.y;dropAir(m)}},
 flickGas(){for(const it of R.items)if(it.st==='pan'&&it.leave){it.st='fly';it.vx=0;it.vy=-900}}};
