<title>ぽかぽか機関車 ～燃焼の熱のつかいみち～</title>
<!--
  ゲームID: pokapoka-kikansha ／ コマID: chu2-kagaku-23（化学変化と原子・分子 第23回・確認用＝アルコールの燃焼の後）
  ねらい: エタノールや都市ガス・プロパンガスなどを燃やすと熱が出て、その熱が調理や暖房に使われている

  【6. 別の世界】（2026-09-27 v2 作り直し ─ 画風＝ガッシュの平塗りポスター：不透明水彩の看板絵・旅行ポスター）
   1 世界とメタファー: 1930年代の「高原鉄道」の旅行ポスター。画面そのものが1枚のポスター（生成り色の余白・紺の罫線）。
     中央に機関庫（炉）があり、正面の大きな「のぞき窓」で燃焼の中身（燃料の分子＋酸素）が見える。
     線路は分かれ目（ポイント）で「置き場」「料理の駅」「暖房の駅」「お湯の駅」へ延びる。
   2 配色: 背景 #F4E3C1（生成り）／主 #1D4E89（紺）／差し #E4572E（朱）。駅ごとに空の色が変わる（夜明け→昼→夕焼け→星空→吹雪）。
     原子だけは制作ルール5.の色（C #3a3d46・H #EAF6FF・O #E4572E・Na・Cl）。
   3 書体: 見出し・看板文字 Kaisei Opti（ポスターの明朝の描き文字）／本文ゴシック
   4 画面: 全画面canvasの1枚絵。横長＝左から右へ延びる路線図（操車場→機関庫→分かれ目→右端に3つの駅）。
     縦長＝下から上へ延びる路線（下の操車場→機関庫→上の3つの駅）。どちらも画面いっぱい。タイトルは旅行ポスターの1枚絵。
   5 HUD: ポスターの余白に「第n駅 ○○」の看板文字・配達の路線ゲージ・あたたかい窓の数・ぬくもり券・かけら。
     火の強さは機関庫の壁の圧力計、室内の酸素は換気窓の横の目盛り（世界の部品で描く）。
   6 音: 汽笛（2音の和音＋蒸気）・ポイントのカタン・空気のシュッ・炉のボッ・駅のベル（WebAudio合成）

  【7. 動かす遊び】鉄道ポイント切替（列車を正しい駅へ導く）＋ 空気の弁の長押し（タイミング一発）＋ 煙のドラッグ
   ・操車場から荷を積んだ列車が来る。入口のポイントで「燃料（都市ガス・エタノール・プロパンガス・木炭・水素）」は炉へ、
     「燃えない物（水・砂・食塩・ドライアイス）」は置き場へ切りかえる（水・CO₂はもう酸素と結び付いた姿なので燃えない）。
   ・炉に着いたら空気のハンドルを長押し → 酸素O₂が1こずつ入る。のぞき窓の右に「できる物の型紙（CO₂一直線・H₂Oくの字）」があり、
     O の席がうまったら指をはなす＝ぴったり燃える（原子の数が前後で同じになる）。足りないと燃えきらず、多いとO₂があまる。
     8駅目からは型紙なし（原子の数から要る酸素を考える）。空気を入れないと火が弱まり、列車がのろくなって止まりかける。
   ・燃えると熱の荷を積み、切符（ガスコンロ・石油ストーブ・給湯器…）の使いみちの駅へ分かれ目のポイントで送る。
     届くと駅の町の窓があたたかい色にともる（あたたかい窓の数がどんどん増える）。
   ・5駅目から煙突の煙（CO₂・H₂O）を「しらべ台」の石灰水／塩化コバルト紙へドラッグして確かめる。木炭はCO₂だけ・水素はH₂Oだけ。
   ・7駅目から機関庫の中の空気が減る → 換気窓をタップ（室内で燃やすときは換気）。
   ・駅と駅の間の機関区で「ぬくもり券」を投資（空気口を広げる＝効く／炉を密閉する・砂を足す＝効かない罠）。燃料の切手を集める。
  30分: 導入1分 → 8駅（1駅約2分・駅ごとに新要素）→ 5駅目が山場（煙の確かめ）→ 9駅目「大寒波の峠」（夜明けまで町のぬくもりを保つボス）
        → 確認テスト10問 → 提出カード
-->

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();

      store(r);

      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

170\" y=\"120\">アルコールランプ\u003c/text>\u003ctext x=\"170\" y=\"60\">水100g\u003c/text>\u003ctext x=\"140\" y=\"16\">温度計\u003c/text>\u003c/svg>", "items": ["ビーカーの水の温度をはかる", "アルコールランプに火をつけて、水を加熱する", "3分後に水の温度をはかる", "ふたをかぶせて火を消す"], "ex": "加熱する前の温度をはかっておくと、上がった温度が分かる。アルコールランプの火はふたをかぶせて消す。", "kind": "method", "level": 1}, {"id": "chu2-pokapoka-kikansha-q009", "koma": "chu2-kagaku-23", "t": "num", "q": "エタノールを燃やして水を加熱したところ、水の温度が20℃から45℃になった。温度は何℃上がった？", "ans": 25, "unit": "℃", "tol": 0, "ex": "45−20＝25。燃焼で出た熱が水に移り、温度が上がった。", "kind": "calc", "level": 1, "fig": null}, {"id": "chu2-pokapoka-kikansha-q010", "koma": "chu2-kagaku-23", "t": "choice", "q": "3種類の燃料A〜Cを同じ質量ずつ燃やし、同じ量の水を温めた。グラフから、水の温度をいちばん上げた燃料は？", "fig": "\u003csvg viewBox=\"0 0 280 180\" width=\"280\" font-family=\"sans-serif\" font-size=\"11\">\u003cline x1=\"50\" x2=\"260\" y1=\"150\" y2=\"150\" stroke=\"#ddd\"/>\u003ctext x=\"44\" y=\"154\" text-anchor=\"end\">0\u003c/text>\u003cline x1=\"50\" x2=\"260\" y1=\"110\" y2=\"110\" stroke=\"#ddd\"/>\u003ctext x=\"44\" y=\"114\" text-anchor=\"end\">10\u003c/text>\u003cline x1=\"50\" x2=\"260\" y1=\"70\" y2=\"70\" stroke=\"#ddd\"/>\u003ctext x=\"44\" y=\"74\" text-anchor=\"end\">20\u003c/text>\u003cline x1=\"50\" x2=\"260\" y1=\"30\" y2=\"30\" stroke=\"#ddd\"/>\u003ctext x=\"44\" y=\"34\" text-anchor=\"end\">30\u003c/text>\u003cline x1=\"50\" y1=\"150\" x2=\"260\" y2=\"150\" stroke=\"#333\"/>\u003cline x1=\"50\" y1=\"150\" x2=\"50\" y2=\"20\" stroke=\"#333\"/>\u003crect x=\"75\" y=\"94\" width=\"36\" height=\"56\" fill=\"#8c9aa6\"/>\u003ctext x=\"93\" y=\"165\" text-anchor=\"middle\">燃料A\u003c/text>\u003ctext x=\"93\" y=\"90\" text-anchor=\"middle\">14\u003c/text>\u003crect x=\"140\" y=\"42\" width=\"36\" height=\"108\" fill=\"#d0583f\"/>\u003ctext x=\"158\" y=\"165\" text-anchor=\"middle\">燃料B\u003c/text>\u003ctext x=\"158\" y=\"38\" text-anchor=\"middle\">27\u003c/text>\u003crect x=\"205\" y=\"74\" width=\"36\" height=\"76\" fill=\"#3f8f86\"/>\u003ctext x=\"223\" y=\"165\" text-anchor=\"middle\">燃料C\u003c/text>\u003ctext x=\"223\" y=\"70\" text-anchor=\"middle\">19\u003c/text>\u003ctext x=\"8\" y=\"14\">水の温度の上がり方〔℃〕\u003c/text>\u003c/svg>", "choices": ["燃料B", "燃料A", "燃料C", "どれも同じ"], "ex": "棒がいちばん高いのは燃料B（27℃上昇）。燃料の燃焼で出る熱が、水の温度を上げている。", "kind": "graph", "level": 1}, {"id": "chu2-pokapoka-kikansha-q011", "koma": "chu2-kagaku-23", "t": "choice", "q": "エタノールの燃焼は、発熱反応・吸熱反応のどちら？", "choices": ["発熱反応（熱を出し、まわりの温度が上がる）", "吸熱反応（熱を奪い、まわりの温度が下がる）", "どちらでもない（熱の出入りがない）", "はじめは吸熱反応で、あとから発熱反応"], "ex": "燃焼は熱を出す反応なので発熱反応。その熱を調理や暖房に使う。", "kind": "judge", "level": 1, "fig": null}, {"id": "chu2-pokapoka-kikansha-q012", "koma": "chu2-kagaku-23", "t": "choice", "q": "ある物質を燃やすと、二酸化炭素と水ができた。この物質について分かることは？", "choices": ["炭素と水素をふくんでいる", "炭素だけでできている", "水素だけでできている", "酸素をまったくふくまない"], "ex": "二酸化炭素ができた→炭素をふくむ。水ができた→水素をふくむ。（酸素をふくむかどうかは、これだけでは分からない）", "kind": "judge", "level": 3, "fig": null}, {"id": "chu2-pokapoka-kikansha-q013", "koma": "chu2-kagaku-23", "t": "choice", "q": "ドライアイス（二酸化炭素）は、燃料として燃やしても熱を取り出せない。その理由として最も適切なものは？", "choices": ["炭素がすでに酸素と結び付いてできた物質だから", "冷たすぎて火がつかないから", "気体になりやすいから", "水にとけるから"], "ex": "二酸化炭素は、炭素が燃えて（酸素と結び付いて）できた物質。それ以上酸素と結び付いて熱を出すことはない。", "kind": "judge", "level": 3, "fig": null}, {"id": "chu2-pokapoka-kikansha-q014", "koma": "chu2-kagaku-23", "t": "num", "q": "図は、都市ガスの主成分メタン（炭素原子1個・水素原子4個）が燃えて、二酸化炭素の分子1個と水の分子2個ができるようすを原子のモデルで表したものである。メタンの分子1個が燃えるのに、酸素の分子（O₂）は何個必要？", "ans": 2, "unit": "個", "tol": 0, "fig": "\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 120' width='360' height='120'>\u003crect width='360' height='120' fill='#fff'/>\u003cg font-family='sans-serif' font-weight='700' text-anchor='middle' font-size='11'>\u003ccircle cx='40' cy='40' r='13' fill='#EAF6FF' stroke='#333'/>\u003ccircle cx='20' cy='62' r='13' fill='#EAF6FF' stroke='#333'/>\u003ccircle cx='60' cy='62' r='13' fill='#EAF6FF' stroke='#333'/>\u003ccircle cx='40' cy='80' r='13' fill='#EAF6FF' stroke='#333'/>\u003ccircle cx='40' cy='60' r='16' fill='#3a3d46' stroke='#333'/>\u003ctext x='40' y='64' fill='#fff'>C\u003c/text>\u003ctext x='95' y='65' font-size='20'>＋\u003c/text>\u003ctext x='140' y='66' font-size='16'>？個の O₂\u003c/text>\u003ctext x='195' y='65' font-size='20'>→\u003c/text>\u003ccircle cx='225' cy='40' r='14' fill='#E4572E' stroke='#333'/>\u003ccircle cx='251' cy='40' r='15' fill='#3a3d46' stroke='#333'/>\u003ccircle cx='277' cy='40' r='14' fill='#E4572E' stroke='#333'/>\u003ctext x='251' y='44' fill='#fff'>C\u003c/text>\u003ccircle cx='240' cy='88' r='14' fill='#E4572E' stroke='#333'/>\u003ccircle cx='226' cy='101' r='10' fill='#EAF6FF' stroke='#333'/>\u003ccircle cx='254' cy='101' r='10' fill='#EAF6FF' stroke='#333'/>\u003ccircle cx='305' cy='88' r='14' fill='#E4572E' stroke='#333'/>\u003ccircle cx='291' cy='101' r='10' fill='#EAF6FF' stroke='#333'/>\u003ccircle cx='319' cy='101' r='10' fill='#EAF6FF' stroke='#333'/>\u003ctext x='330' y='44' font-size='11'>CO₂\u003c/text>\u003ctext x='340' y='80' font-size='11'>H₂O×2\u003c/text>\u003c/g>\u003c/svg>", "ex": "できた物の酸素原子は、CO₂に2個・H₂O 2個に1個ずつで合計4個。酸素の分子O₂は2個（原子の数は反応の前後で同じ）。", "kind": "calc", "level": 2}, {"id": "chu2-pokapoka-kikansha-q015", "koma": "chu2-kagaku-23", "t": "choice", "q": "部屋の中でガスファンヒーターや石油ストーブを使うときに、ときどき換気をするのはなぜ？", "choices": ["燃焼で部屋の酸素が使われ、二酸化炭素などがふえるから", "燃焼で部屋の酸素がふえすぎるから", "換気すると燃料がふえるから", "燃焼で部屋の温度が下がるから"], "ex": "燃焼は酸素を使い、二酸化炭素や水ができる。酸素が足りなくなると燃えにくく危険なので、室内で火を使うときは換気する。", "kind": "judge", "level": 2}]};

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

  insul:{nm:'保温の荷箱',d:'運ぶ熱が冷めにくい → 1回の配達で温まる窓がふえる',cost:[12,22],max:2},
  sign:{nm:'信号所',d:'分かれ目の手前で列車が少しゆっくり走る',cost:[8,16],max:2}
};
var TRAPS=[
  {k:'seal',nm:'炉を密閉して熱を逃がさない',d:'すき間をふさいで、熱を閉じこめる',why:'効かない！ 燃焼には酸素が必要。密閉すると空気が入らず、火は消えてしまう。'},
  {k:'sand',nm:'炉に砂を足して長持ちさせる',d:'燃料に砂をまぜて量を増やす',why:'効かない！ 砂は燃えない。燃料が増えたことにはならない。'},
  {k:'dry',nm:'ドライアイス燃料で冷たく長持ち',d:'冷えた燃料はゆっくり燃えて長持ち？',why:'効かない！ ドライアイスは二酸化炭素。炭素がもう酸素と結び付いた物なので燃えない。'},
  {k:'water',nm:'燃料タンクに水を足してかさ増し',d:'水でうすめて燃料を節約',why:'効かない！ 水は燃えない（水素がもう酸素と結び付いた物）。火を弱めるだけ。'}
];
function renderUpg(){var h='',si=R.si;$('dpCoins').textContent=G.coins;
  Object.keys(UPG).forEach(function(k){var u=UPG[k],lv=G.up[k],c=u.cost[lv];h+='<div class="upg"><div class="tx"><b>'+u.nm+'</b> <span class="pip">'+'●'.repeat(lv)+'○'.repeat(u.max-lv)+'</span><small>'+u.d+'</small></div>'+
    (lv>=u.max?'<button class="tk c sm" disabled>最大</button>':'<button class="tk b sm" data-up="'+k+'"'+(G.coins<c?' disabled':'')+'>'+c+'枚</button>')+'</div>'});
  if(si>=1){var tp=TRAPS[si%TRAPS.length];var done=G.traps[tp.k];h+='<div class="upg trap"><div class="tx"><b>'+tp.nm+'</b><small>'+tp.d+'</small>'+(done?'<span class="res">'+tp.why+'</span>':'')+'</div>'+(done?'<button class="tk c sm" disabled>ためした</button>':'<button class="tk b sm" data-trap="'+tp.k+'"'+(G.coins<8?' disabled':'')+'>8枚</button>')+'</div>'}
  $('dpUp').innerHTML=h;
  [].forEach.call($('dpUp').querySelectorAll('[data-up]'),function(b){b.onclick=function(){var k=b.getAttribute('data-up'),u=UPG[k],c=u.cost[G.up[k]];if(G.coins<c)return;G.coins-=c;G.up[k]++;SFX.good(3);saveGame();renderUpg()}});
  [].forEach.call($('dpUp').querySelectorAll('[data-trap]'),function(b){b.onclick=function(){var k=b.getAttribute('data-trap');if(G.coins<8)return;G.coins-=8;G.traps[k]=1;SFX.bad();saveGame();renderUpg()}})}
function renderStamps(){var h='';STAMP_ORDER.forEach(function(k){var isP=k==='CO2'||k==='H2O',c=isP?{nm:PRODFACT[k].nm,m:PRODFACT[k].m,fuel:1}:CG[k],got=!!G.stamps[k];
  h+='<div class="stamp'+(got?'':' no')+(c.fuel?'':' non')+'" title="'+esc(isP?PRODFACT[k].t:c.fact)+'"><img src="'+molImg(c.m,80)+'" alt="">'+c.nm+(isP?'<br><span style="font-weight:500;font-size:10px">できた物</span>':c.fuel?'':'<br><span style="font-weight:500;font-size:10px">燃えない</span>')+'</div>'});$('dpStamps').innerHTML=h}
$('dpNext').onclick=function(){AU.init();openStage(G.stage)};
$('dpBook').onclick=function(){window.Zukan&&Zukan.openBook()};
function bossFail(){R.ended=true;R.paused=true;SFX.bad();state='card';$('cdTag').textContent='大寒波の峠';$('cdTitle').textContent='町が冷えきった…';
  $('cdBody').innerHTML='ぬくもりが0になってしまった。<br><b>ぴったり燃やす</b>（型紙なし）・<b>切符の駅へ送る</b>・<b>燃えない荷物は置き場</b>・<b>換気</b>をもう一度。';$('cdArt').innerHTML='';$('cdBtn').textContent='もう一度 峠へ';
  showOv('card');var si=R.si;$('cdBtn').onclick=function(){$('cdBtn').onclick=cdDefault;openStage(si)}}
var cdDefault=$('cdBtn').onclick;
function bossWin(){R.ended=true;R.paused=true;SFX.fan();G.done=1;G.stage=ST.length-1;saveGame();
  if(window.Zukan&&Zukan.earn)Zukan.earn(100,'boss',{id:GID+':daikanpa'});
  setTimeout(function(){if(window.Zukan&&Zukan.mainClear)Zukan.mainClear({onClose:showClear});else showClear()},1400)}
function showClear(){state='clear';showOv('clear');backBtn();
  $('clRec').innerHTML='あたたかい窓 <b>'+G.windows+'</b> ／ ぴったり燃焼 <b>'+G.st.perfect+'</b> 回<br>届けた熱 '+G.st.deliv+' ／ 煙のしらべ '+G.st.check+' ／ 置き場へ '+G.st.sort+'<br>最大 '+G.st.best+'連 ／ プレイ時間 '+fmtTime(G.st.time);
  $('clBook').classList.toggle('hidden',!window.Zukan)}
function fmtTime(s){s=Math.round(s||0);return Math.floor(s/60)+'分'+('0'+s%60).slice(-2)+'秒'}
$('toTest').onclick=function(){startTest()};$('clBook').onclick=function(){window.Zukan&&Zukan.openBook()};

/* ================= 確認テスト ================= */
var TQ=[],TA=[],TI=0;
function startTest(){state='test';R=null;showOv('test');backBtn();TQ=window.Quiz?Quiz.test():[];TA=[];TI=0;showQ()}
function showQ(){var q=TQ[TI];if(!q){finishTest();return}$('test').scrollTop=0;
  $('tNo').textContent=(TI+1)+' / '+TQ.length;$('tQ').textContent=q.q;$('tFig').innerHTML=q.fig||'';$('tFb').innerHTML='';var A=$('tA');A.innerHTML='';
  if(q.t==='choice'){q.shown.forEach(function(c){var b=document.createElement('button');b.className='ans';b.textContent=c;b.onclick=function(){answer(c,b)};A.appendChild(b)})}
  else if(q.t==='num'){var row=document.createElement('div');row.className='numrow';row.innerHTML='<input id="numIn" inputmode="decimal" autocomplete="off"><span style="font-weight:700;font-size:18px">'+esc(q.unit||'')+'</span>';
    var b=document.createElement('button');b.className='tk sm';b.textContent='決定';row.appendChild(b);A.appendChild(row);b.onclick=function(){var v=$('numIn').value.trim();if(!v)return;answer(v)}}
  else if(q.t==='order'){var sel=[],box=document.createElement('div');box.className='ord';A.appendChild(box);var btns=[];
    q.shown.forEach(function(c){var bt=document.createElement('button');bt.className='ans';bt.textContent=c;bt.onclick=function(){if(bt.classList.contains('pickd'))return;sel.push(c);bt.classList.add('pickd');
      var d=document.createElement('div');d.textContent=sel.length+'. '+c;box.appendChild(d);if(sel.length===q.shown.length)answer(sel.slice())};A.appendChild(bt);btns.push(bt)});
    var rs=document.createElement('button');rs.className='tk c sm';rs.textContent='やり直す';rs.onclick=function(){sel=[];box.innerHTML='';btns.forEach(function(b){b.classList.remove('pickd')})};A.appendChild(rs)}}
function answer(v,btn){var q=TQ[TI];if(TA[TI]!==undefined)return;TA[TI]=v;var ok=Quiz.check(q,v);AU.init();if(ok)SFX.good(3);else SFX.bad();
  [].forEach.call($('tA').querySelectorAll('button,input'),function(b){b.disabled=true;if(q.t==='choice'&&b.textContent===q.choices[0])b.classList.add('ok')});
  if(btn&&!ok)btn.classList.add('ng');
  $('tFb').innerHTML='<span class="mk">'+(ok?'○':'×')+'</span>'+(ok?'正解':'正解は「'+esc(Quiz.answer(q))+'」')+'<span class="ex">'+esc(q.ex||'')+'</span>';
  var nx=document.createElement('button');nx.className='tk sm';nx.style.marginTop='10px';nx.textContent=TI+1<TQ.length?'つぎへ':'結果を見る';nx.onclick=function(){TI++;showQ()};$('tFb').appendChild(document.createElement('br'));$('tFb').appendChild(nx);
  setTimeout(function(){nx.scrollIntoView({block:'nearest',behavior:'smooth'})},50)}
function finishTest(){var qs=TQ,review=Quiz.review(qs,TA),marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length;var sv=G||loadGame();
  var recs=TEST?[['モード','確認テストだけ']]:[['開通した駅',(sv&&sv.done?'9駅（全線）':((sv?sv.stage:0)+'駅'))],['あたたかい窓',(sv?sv.windows:0)+'枚'],['ぴったり燃焼',(sv?sv.st.perfect:0)+'回'],['プレイ時間',sv?fmtTime(sv.st.time):'-']];
  SubmitCard.show({gameId:GID,grade:'chu2',koma:KOMA,unit:'中2理科　化学変化と原子・分子　第23回',game:'ぽかぽか機関車 ～燃焼の熱のつかいみち～'+(TEST?'（確認テストのみ）':''),
    name:(NAME||'').trim(),score:score,total:qs.length,marks:marks,records:recs,review:review},function(){if(TEST)startTest();else toTitle()})}

/* ================= もどる ================= */
var backFrom=null;
$('bBack').onclick=function(){AU.init();
  if(state==='title'){try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}return}
  backFrom=state;if(R)R.paused=true;
  $('cfText').textContent=state==='test'?'確認テストは、次はさいしょから。開通した駅は保存されています。':state==='play'?'進み具合は保存されます（開通した駅・ぬくもり券・切手はそのまま。この駅は次にはじめから）。':'進み具合は保存されます。タイトルにもどります。';
  $('confirm').classList.remove('hidden')};
$('cfNo').onclick=function(){$('confirm').classList.add('hidden');if(backFrom==='play'&&R)R.paused=false};
$('cfGo').onclick=function(){$('confirm').classList.add('hidden');saveGame();toTitle()};

/* ================= ループ ================= */
var last=performance.now();
function frame(ts){var dt=Math.min(.05,(ts-last)/1000);last=ts;now+=dt;
  if(state==='play'&&R&&!R.paused){step(dt)}
  if(R){if(R.shake>0)R.shake=Math.max(0,R.shake-dt);if(R.flash>0)R.flash=Math.max(0,R.flash-dt*1.5);R.swAnim.s1=Math.max(0,R.swAnim.s1-dt*4);R.swAnim.s2=Math.max(0,R.swAnim.s2-dt*4);
    R.pt=R.pt.filter(function(p){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=L.U*3*dt;return p.t<p.life});R.ft=R.ft.filter(function(f){f.t+=dt;return f.t<1.3});
    R.puffs=R.puffs.filter(function(p){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.t<p.life});
    if(R.msg){R.msg.age+=dt;if(R.msg.age>R.msg.d)R.msg=null}if(R.hint){R.hint.age+=dt;if(R.hint.age>R.hint.d)R.hint=null}}
  draw();requestAnimationFrame(frame)}
function step(dt){var d=R.def;G.st.time+=dt;R.t+=dt;
  // 列車を出す
  R.spawnT-=dt;var pre=R.trains.filter(function(t){return (t.e==='in'||t.e==='f')&&t.st!=='gone'&&t.st!=='fade'});
  var clearIn=!R.trains.some(function(t){return t.e==='in'&&t.s<L.trainL*1.4});
  if(R.spawnT<=0&&clearIn&&pre.length<3){spawnTrain();R.spawnT=d.iv*(R.si===0&&R.spawned<2?1.4:1)}
  updTrains(dt);
  // 炉
  var f=R.furn;
  if(f.st==='load'){f.t+=dt;if(f.t>=.55){f.st='air';f.t=0}}
  else if(f.st==='air'){f.t+=dt;var iv=(R.si>=7?.42:.5)*(d.vent&&R.roomO2<.3?2.2:1);
    if(R.hold){R.holdT-=dt;if(R.holdT<=0){R.holdT=iv;if(f.o2<f.need+6)spawnO2()}R.idleAir=0}
    else{R.idleAir+=dt;if(R.idleAir>7){R.P=Math.max(0,R.P-dt*.06);if(!R.hiShown.idle||R.idleAir>7&&R.idleAir-dt<=7){R.hiShown.idle=1;msg('空気（酸素）を入れないと燃えない。火が弱まって列車が止まりそう！','bad',3)}}}
    f.fly=f.fly.filter(function(q){q.t+=dt;return q.t<.32})}
  else if(f.st==='wait'){f.t+=dt;f.fly=f.fly.filter(function(q){q.t+=dt;return q.t<.32});if(f.t>.3&&!f.fly.length)doBurn()}
  else if(f.st==='burn'){f.t+=dt;if(f.t>=1.45){f.st='show';f.t=0}}
  else if(f.st==='show'){f.t+=dt;if(f.t>=.8)finishBurn()}
  else if(f.st==='dud'){f.t+=dt;if(f.t>1)R.furn={st:'idle'}}
  if(!R.hold)R.holdT=0;
  // 火の強さ
  R.P=Math.max(0,R.P-dt*(.016+.003*R.si+(d.boss?.01:0)));
  // 室内の酸素
  if(d.vent){if(R.roomO2Target){R.roomO2=Math.min(1,R.roomO2+dt*1.2);if(R.roomO2>=1)R.roomO2Target=0}else R.roomO2=Math.max(0,R.roomO2-dt*.006);if(R.ventAnim>0)R.ventAnim-=dt;
    if(R.roomO2<.3&&!R.hiShown.lowO2){R.hiShown.lowO2=1;msg('機関庫の中の酸素が減った！ 空気が入りにくい → 換気窓をタップ','bad',3.4);hint('vent','換気窓をタップ',5)}}
  // 駅はゆっくり冷える
  ['cook','heat','bath'].forEach(function(k){R.warm[k]=Math.max(0,R.warm[k]-dt*(d.boss?.02:.008))});
  if(R.lime>0)R.lime=Math.max(0,R.lime-dt*.02);if(R.cob>0)R.cob=Math.max(0,R.cob-dt*.02);
  // 煙
  R.bubbles.forEach(function(b){if(b.dead||b.drag){if(b.drag)return;return}b.t+=dt;if(b.t<0){b.x=L.chim.x+L.chim.w/2+(b.sx||0);b.y=L.chim.y;return}
    var topY=L.PR.y+L.U*(L.land?.9:.2)+(L.land?0:L.PR.h*.26);if(b.y>topY)b.y+=b.vy*dt;b.x+=Math.sin(now*1.3+b.life)*L.U*.2*dt+(L.land?L.U*.18:L.U*.12)*(b.vx||1)*dt;
    b.x=clamp(b.x,L.PR.x+L.U*.6,L.PR.x+L.PR.w-L.U*.6)});
  R.bubbles=R.bubbles.filter(function(b){return !b.dead&&(b.drag||b.t<b.life)});
  if(d.prod&&R.si===4&&!R.hiShown.bub&&R.bubbles.length){R.hiShown.bub=1;hint('bub','煙をドラッグ → しらべ台へ',6)}
  // 煙突の湯気（火の強さに合わせて）
  if(Math.random()<dt*(1+R.P*7))R.puffs.push({x:L.chim.x+L.chim.w/2,y:L.chim.y,r:L.U*(.12+R.P*.12),vx:(Math.random()-.2)*L.U*.25,vy:-L.U*(.35+R.P*.5),t:0,life:1.6+R.P*1.5});
  // ボス
  if(R.boss){var b=R.boss;b.t+=dt;b.warm=Math.max(0,b.warm-dt*.0135);if(b.warm<=0&&!R.ended){bossFail();return}if(b.t>=b.dur&&!R.ended){bossWin();return}}
  if(Math.floor(R.t)%6===0&&Math.floor(R.t-dt)%6!==0)saveGame()}

cv.addEventListener('pointerdown',onDown);addEventListener('pointermove',onMove);addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
addEventListener('resize',function(){layout();TBG=null;if(state==='title')posTitlePanel()});
$('bMute').onclick=function(){AU.init();AU.mute=!AU.mute;$('bMute').classList.toggle('off',AU.mute);try{localStorage.setItem(MUTEK,AU.mute?'1':'')}catch(e){}};
try{AU.mute=localStorage.getItem(MUTEK)==='1';$('bMute').classList.toggle('off',AU.mute)}catch(e){}
$('btnStart').onclick=function(){NAME=$('nameIn').value.trim()||NAME;startGame(false)};
$('btnCont').onclick=function(){NAME=$('nameIn').value.trim()||NAME;startGame(true)};
$('btnBook').onclick=function(){window.Zukan&&Zukan.openBook()};
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nameBox').classList.add('hidden')}
window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:KOMA});
layout();
if(document.fonts&&document.fonts.load){document.fonts.load('20px "Kaisei Opti"').then(function(){TBG=null;if(R)renderBg()}).catch(function(){})}
if(TEST)startTest();else toTitle();
requestAnimationFrame(frame);
/* 自動テスト用の読み取り口（ゲームの外からは使わない） */
window.__PK={get R(){return R},get G(){return G},get L(){return L},get state(){return state},E:E,ST:ST,toggle:function(w){toggle(w)},openStage:openStage};
})();
