<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>せいでんきピンボール ～引力と斥力～</title>
<!--
  せいでんきピンボール ～引力と斥力～　（ゲームID seiden-pinball ／ コマID chu2-denryu-20 ／ 確認用）
  2026-09-27 v2 ゼロから作成（割り当て表 通し20）

  【遊びの核】ピンボール。フリッパーで玉を打ち上げ、台の「帯電ドラム」の面（素材）をタップで切りかえて、
    金に光る穴へ玉を曲げこむ。玉はドラムにふれる前から、引き合えば穴へ吸いよせられ、しりぞけ合えばはじき返される。
  【理科の埋め込み】玉＝こすった物の片方（例：ティッシュでこすったストロー玉）。ドラムの面は
    「玉と同じ物を同じようにこすった物」か「玉をこすった相手」。同じ物どうし＝同じ種類の電気＝しりぞけ合う（斥力）／
    こすった物とこすられた物＝ちがう種類の電気＝引き合う（引力）。金の穴のドラムは引き合う面、ハズレ穴のドラムは
    しりぞけ合う面にしておくのが正しい構え。帯電列（どちらが＋か）は使わない。力は離れていてもはたらく（金の放射線）。
    玉の側（ストロー玉⇔ティッシュ玉）・素材の組（ストローとティッシュ／風船と毛糸／ポリエチレンのひもとティッシュ）が
    階ごとに変わり、同じ面のままでは通用しない。山場（6階）は2つの玉を同時に打つマルチボールで、
    同じドラムが片方を引き、もう片方をはじく。玉どうしも引き合う。
  【ハマる仕組み】主⑫ジュース（金の放射線・穴に吸いこまれる光・機械式スコアの回転・ジャズの和音）／
    副⑤コンボ（打つ前に正しく構えて一発で入れると倍率が上がる。打ってから切りかえる・ハズレ穴に落とすとリセット）／
    副⑦ニアミス（外れたら金の穴まで本当に何cmだったかを表示）
  【道のり×集める×美麗】1930年代の遊技場ビルを1階→9階（屋上）へ上がる（エレベーターの階数表示の針）／
    帯電した物の見本棚（5つの素材）と中2理科図鑑のかけら／金と黒のアールデコの筐体
  【画風】アールデコ（金と黒の幾何学・放射状のサンバースト・段々の縁取り・細い二重線）。ボタンも角を落とした金縁の札。
  【配色】背景 #0E0E0E／主 金 #D4AF37／差し 朱 #C0392B／象牙 #F3E9D2
  【書体】Aoboshi One（見出し・札）＋ Limelight（数字）＋ ヒラギノ角ゴ系（小さい本文）
  【全画面の構図】PC・iPad横＝中央に台、左右に筐体のスコア面（左：スコア・連続・いまの玉／右：階数計・規則の札・見本棚・電光ニュース）
    スマホ・iPad縦＝台を縦に画面いっぱい、上帯にスコア、下帯にいまの玉。フリッパーは画面の左半分・右半分を親指で。
  【もどる】左上の金縁の札「◀ もどる」（いつも同じ場所）。押すと保存の確認。
  【数値】本編9台（1台5つの穴、山場は4回×2玉、屋上は3連続）＝判断45回以上。見込み約20分。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bk:#0E0E0E;--g:#D4AF37;--g2:#F6E27A;--g3:#8C6B1F;--r:#C0392B;--iv:#F3E9D2;
 --fh:"Aoboshi One","Hiragino Mincho ProN","Yu Mincho",serif;--fn:Limelight,"Aoboshi One",serif;
 --fb:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bk);overflow:hidden;overscroll-behavior:none}
body{color:var(--iv);font-family:var(--fb);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
button{font-family:var(--fh);cursor:pointer;touch-action:manipulation}
#stage{position:absolute;inset:0;overflow:hidden}/* 仕上げ 2026-09-28（sp-finish-2026-09-28）: fixed だと重ね順の箱になり、れんしゅう中に「もどる」を暗幕の上へ出せないため absolute */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.scr{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.scr>*{pointer-events:auto}
/* 金縁の札（角を落とした八角形） */
.dk{--c:10px;position:relative;min-height:52px;padding:0 26px;border:0;color:var(--g2);font:400 20px var(--fh);letter-spacing:.14em;
 background:linear-gradient(180deg,#1c1a16,#0b0b0b);
 clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c));
 box-shadow:inset 0 0 0 2px var(--g),inset 0 0 0 5px #0b0b0b,inset 0 0 0 6px var(--g3)}
.dk::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--g) 0 calc(var(--c) - 1px),transparent 0) left top/50% 50% no-repeat,linear-gradient(225deg,var(--g) 0 calc(var(--c) - 1px),transparent 0) right top/50% 50% no-repeat,linear-gradient(45deg,var(--g) 0 calc(var(--c) - 1px),transparent 0) left bottom/50% 50% no-repeat,linear-gradient(315deg,var(--g) 0 calc(var(--c) - 1px),transparent 0) right bottom/50% 50% no-repeat;pointer-events:none;opacity:.9}
.dk.gold{color:#140f02;background:linear-gradient(180deg,#F6E27A,#D4AF37 45%,#9c7a24);box-shadow:inset 0 0 0 2px #fff3b8,inset 0 0 0 5px #b8922c,inset 0 0 0 6px #5a4412}
.dk.gold::before{opacity:0}
.dk.red{color:var(--iv);background:linear-gradient(180deg,#d9483a,#C0392B 50%,#7d2219);box-shadow:inset 0 0 0 2px #f0a39a,inset 0 0 0 5px #9d2c21,inset 0 0 0 6px #4d130d}
.dk.red::before{opacity:0}
.dk.sm{min-height:46px;font-size:16px;padding:0 16px;letter-spacing:.08em;--c:8px}
.dk:active{transform:translateY(2px);filter:brightness(1.2)}
.dk:disabled{opacity:.35;cursor:default}
/* 常に同じ場所の「もどる」と音 */
#bBack{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:30;min-height:46px;font-size:17px;padding:0 16px 0 12px;letter-spacing:.06em}
#bMute{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:30;min-height:46px;min-width:52px;padding:0 10px;font-size:18px;letter-spacing:0}
/* タイトル */
#scrTitle{flex-direction:column;gap:12px;text-align:center;padding:max(64px,7vh) 16px 16px;justify-content:flex-start}
#logo{position:relative;padding:4px clamp(18px,4vw,44px) 16px;animation:drop 1.2s cubic-bezier(.25,1.5,.45,1) both}
#logo::before{content:"";position:absolute;inset:34px 0 0;background:rgba(8,7,5,.78);z-index:-1;
 clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);
 box-shadow:inset 0 0 0 2px #D4AF37,inset 0 0 0 7px rgba(8,7,5,.78),inset 0 0 0 8px #8C6B1F}
@keyframes drop{0%{transform:translateY(-110vh)}62%{transform:translateY(14px)}80%{transform:translateY(-6px)}100%{transform:none}}
#logo .orn{display:block;width:clamp(150px,20vw,220px);margin:0 auto -4px;filter:drop-shadow(0 0 10px rgba(212,175,55,.5))}
#logo .kick{font:400 clamp(11px,1.5vw,15px) var(--fn);letter-spacing:.42em;color:var(--g);margin:8px -.42em 2px 0}
#logo h1{margin:0;font:400 clamp(40px,8.6vw,104px)/1 var(--fh);letter-spacing:.04em;color:transparent;
 background:linear-gradient(100deg,#8C6B1F 0%,#F6E27A 18%,#D4AF37 32%,#fffbe0 42%,#D4AF37 52%,#8C6B1F 70%,#F6E27A 86%,#b8922c 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;
 animation:shine 4s linear infinite;filter:drop-shadow(0 2px 0 #6e5316) drop-shadow(0 4px 0 #3d2e08) drop-shadow(0 8px 10px rgba(0,0,0,.8)) drop-shadow(0 0 22px rgba(212,175,55,.35))}
#logo h1 span{display:block}#logo h1 .l1{font-size:.62em;letter-spacing:.3em;margin-right:-.3em}
@keyframes shine{from{background-position:120% 0}to{background-position:-140% 0}}
#logo .sub{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;font:400 clamp(15px,2vw,22px) var(--fh);letter-spacing:.3em;color:#F3E9D2}
#logo .sub i{display:block;width:clamp(26px,5vw,70px);height:6px;border-top:1px solid var(--g);border-bottom:1px solid var(--g)}
#scrTitle .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;animation:fadeup .8s .9s both}
#scrTitle .nm{display:flex;align-items:center;gap:8px;font:400 15px var(--fh);color:var(--g);animation:fadeup .8s .8s both}
#scrTitle input{height:46px;width:200px;background:#0b0b0b;border:2px solid var(--g3);color:var(--iv);font:16px var(--fb);padding:0 10px;outline:0}
#scrTitle input:focus{border-color:var(--g)}
#bStart{min-height:66px;min-width:250px;font-size:26px;letter-spacing:.3em;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(246,226,122,0))}50%{transform:scale(1.07);filter:drop-shadow(0 0 18px rgba(246,226,122,.8))}}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
/* エレベーター（階の選択） */
#scrMap{align-items:flex-end;justify-content:center;padding:0 12px 16px}
#floors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(760px,100%)}
#floors .dk{min-height:62px;font-size:17px;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;line-height:1.2}
#floors .dk small{font:400 12px var(--fn);letter-spacing:.2em;color:var(--g);opacity:.85}
#floors .dk.gold small{color:#3a2a05}
#floors .dk i{font-style:normal;font-size:12px;letter-spacing:.1em;color:var(--g2)}
#floors .dk.gold i{color:#3a2a05}
#mapBar{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#mapWrap{display:flex;flex-direction:column;align-items:center;width:100%}
/* 電光ニュース */
#tick{position:absolute;z-index:6;pointer-events:none;font:400 15px/1.55 var(--fh);color:var(--iv);letter-spacing:.03em;
 background:rgba(8,8,8,.9);border-top:1px solid var(--g);border-bottom:1px solid var(--g);padding:8px 12px;text-align:center;transition:opacity .35s}
#tick b{color:var(--g2);font-weight:400}
#tick em{color:#ff8d80;font-style:normal}
#tick.off{opacity:0}
/* 覆い（クリア・確認・テスト・結果） */
.ov{position:absolute;inset:0;background:rgba(5,5,5,.78);display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;z-index:20}
.card{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;background:#0d0c0a;padding:26px 22px 22px;text-align:center;
 box-shadow:inset 0 0 0 2px var(--g),inset 0 0 0 7px #0d0c0a,inset 0 0 0 8px var(--g3);
 clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 18px),calc(100% - 18px) 100%,18px 100%,0 calc(100% - 18px),0 18px)}
.card h2{margin:4px 0 6px;font:400 34px var(--fh);letter-spacing:.12em;color:var(--g2)}
.card .en{font:400 14px var(--fn);letter-spacing:.45em;color:var(--g)}
.card p{font:400 15px/1.7 var(--fh);color:#e8dcbc;margin:8px 0}
.stars{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap}
.rec2{font:400 26px var(--fh);letter-spacing:.2em;color:#fff3c4;text-shadow:0 0 16px #F6E27A,0 0 30px #D4AF37;animation:recg 1s ease-in-out infinite alternate}
@keyframes recg{from{transform:scale(1)}to{transform:scale(1.08)}}
.stars div{opacity:0;transform:scale(2.4);font:400 13px var(--fh);color:#6b5a30;border:1px solid #4a3d1c;padding:6px 10px;min-width:30%}
.stars div b{display:block;font-size:26px;color:#3a3020}
.stars div.in{opacity:1;transform:none;animation:stamp .38s cubic-bezier(.2,1.7,.4,1)}
@keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(-12deg)}to{opacity:1;transform:none}}
.stars div.on{color:var(--g2);border-color:var(--g)}
.stars div.on b{color:var(--g2);text-shadow:0 0 12px rgba(246,226,122,.7)}
.recs{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font:400 14px var(--fh);color:#cfc2a0;margin:6px 0 14px}
.recs b{font:400 22px var(--fn);color:var(--g2);margin-left:4px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* 確認テスト */
#scrTest{align-items:stretch;justify-content:center;overflow:auto;background:radial-gradient(120% 80% at 50% 0%,#1c1709 0%,#0E0E0E 60%);pointer-events:auto;padding:70px 14px 30px}
#tBox{width:min(760px,100%);margin:0 auto}
#tHead{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--g);padding-bottom:8px}
#tNo{font:400 18px var(--fh);color:var(--g2);letter-spacing:.1em}
#tLamps{display:flex;gap:5px}
#tLamps i{width:14px;height:14px;transform:rotate(45deg);border:1px solid var(--g3);display:block}
#tLamps i.cur{border-color:var(--g2);box-shadow:0 0 8px var(--g)}
#tLamps i.ok{background:var(--g)}
#tLamps i.ng{background:var(--r)}
#tQ{font:400 19px/1.7 var(--fh);margin:16px 0 10px;color:var(--iv)}
#tFig{background:#fbf7ec;padding:6px;margin:6px auto 12px;max-width:440px;box-shadow:0 0 0 2px var(--g),0 0 0 6px #0E0E0E,0 0 0 7px var(--g3)}
#tFig svg{display:block;width:100%;height:auto}
#tA{display:flex;flex-direction:column;gap:10px}
#tA .ch{display:flex;align-items:center;gap:12px;text-align:left;font:400 16px/1.45 var(--fb);letter-spacing:0;color:var(--iv);padding:10px 18px;min-height:54px}
#tA .ch i{font:400 18px var(--fn);color:var(--g);font-style:normal;min-width:18px}
#tA .ch.ok{box-shadow:inset 0 0 0 3px var(--g2),inset 0 0 0 5px #0b0b0b,inset 0 0 0 6px var(--g);background:#2a2208}
#tA .ch.ng{box-shadow:inset 0 0 0 3px var(--r),inset 0 0 0 5px #0b0b0b,inset 0 0 0 6px #6d1f17;background:#2a0c09}
.numbox{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0}
.numbox .v{min-width:180px;height:56px;border:2px solid var(--g);font:400 30px/52px var(--fn);color:var(--g2);text-align:center}
.numbox .u{font:400 18px var(--fh);color:var(--g)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto;width:100%}
.keys .dk{padding:0;font:400 22px var(--fn)}
.keys .go{grid-column:1/-1}
.ord{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;border:1px dashed var(--g);padding:10px 14px;font:15px/1.4 var(--fb);text-align:left}
.slot i{font:400 18px var(--fn);color:var(--g);font-style:normal}
#tEx{margin:14px 0;padding:12px 14px;border-left:3px solid var(--g);background:#15120a;font:400 15px/1.7 var(--fh);color:#e8dcbc}
#tEx b{margin-right:10px}
#tNext{display:block;margin:6px auto 0;min-width:220px}
#scrEnd .card h2{font-size:26px}
#eScore{font:400 64px var(--fn);color:var(--g2);margin:6px 0}
#eScore small{font:400 20px var(--fh);color:var(--g)}
@media (max-width:520px){
 #floors{gap:8px}#floors .dk{min-height:56px;font-size:15px}
 .card h2{font-size:28px}
 #tick{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}

  function cardHTML(r){

    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

function collideSeg(b,ax,ay,bx,by,rad,e,kick){var dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy,t=((b.x-ax)*dx+(b.y-ay)*dy)/l2;t=t<0?0:t>1?1:t;

function startTest(){G=null;setScene('test');TQ=window.Quiz?Quiz.test():[];TI=0;TA=[];TOK=[];$('scrTest').scrollTop=0;showQ()}
function lamps(){$('tLamps').innerHTML=TQ.map(function(q,i){return'<i class="'+(i<TOK.length?(TOK[i]?'ok':'ng'):i===TI?'cur':'')+'"></i>'}).join('')}
function showQ(){if(TI>=TQ.length)return finishTest();var q=TQ[TI];$('tNo').textContent='第'+(TI+1)+'問 ／ '+TQ.length;lamps();
 $('tQ').innerHTML=q.q;var f=$('tFig');if(q.fig){f.innerHTML=q.fig;f.classList.remove('hidden')}else{f.innerHTML='';f.classList.add('hidden')}
 $('tEx').classList.add('hidden');$('tNext').classList.add('hidden');var box=$('tA');box.innerHTML='';
 if(q.t==='choice'){q.shown.forEach(function(s,i){var b=document.createElement('button');b.className='ch dk';b.innerHTML='<i>'+'ABCDEF'.charAt(i)+'</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){answer(s,b)};box.appendChild(b)})}
 else if(q.t==='num'){var v='';box.innerHTML='<div class="numbox"><div class="v" id="nv">&nbsp;</div><div class="u">'+esc(q.unit||'')+'</div></div><div class="keys" id="nk"></div>';
  var nk=$('nk');['7','8','9','⌫','4','5','6','.','1','2','3','0'].forEach(function(k){var b=document.createElement('button');b.className='dk';b.textContent=k;b.onclick=function(){if(TA.length>TI)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<7&&!(k==='.'&&v.indexOf('.')>=0))v+=k;$('nv').innerHTML=v?esc(v):'&nbsp;';SFX.tap()};nk.appendChild(b)});
  var go=document.createElement('button');go.className='go dk gold';go.textContent='この値で決定';go.onclick=function(){if(v&&TA.length<=TI)answer(v,null)};nk.appendChild(go)}
 else{var sel=[];var wrap=document.createElement('div');wrap.className='ord';box.appendChild(wrap);
  function drawO(){wrap.innerHTML='';sel.forEach(function(s,i){var d=document.createElement('div');d.className='slot';d.innerHTML='<i>'+(i+1)+'</i><span></span>';d.querySelector('span').textContent=s;wrap.appendChild(d)});
   q.shown.forEach(function(s){if(sel.indexOf(s)>=0)return;var b=document.createElement('button');b.className='ch dk';b.innerHTML='<i>＋</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){if(TA.length>TI)return;sel.push(s);SFX.tap();if(sel.length===q.shown.length)answer(sel.slice(),null);else drawO()};wrap.appendChild(b)});
   if(sel.length&&TA.length<=TI){var r=document.createElement('button');r.className='dk sm';r.textContent='やりなおす';r.onclick=function(){sel=[];drawO()};wrap.appendChild(r)}}
  drawO()}}
function answer(v,btn){if(TA.length>TI)return;var q=TQ[TI],ok=window.Quiz?Quiz.check(q,v):false;TA.push(v);TOK.push(ok);ok?SFX.ok():SFX.bad();
 [].slice.call($('tA').querySelectorAll('.ch')).forEach(function(b){b.disabled=true;var t=b.querySelector('span').textContent;if(q.t==='choice'){if(t===q.choices[0])b.classList.add('ok');else if(b===btn)b.classList.add('ng')}});
 if(q.t==='order'){var w=$('tA').querySelector('.ord');if(w)[].slice.call(w.querySelectorAll('.slot')).forEach(function(d,i){d.style.borderColor=v[i]===q.items[i]?OKC:NGC;d.style.borderStyle='solid'})}
 if(q.t==='num'){var nv=$('nv');if(nv)nv.style.borderColor=ok?OKC:NGC}
 var ex=$('tEx');ex.innerHTML=(ok?'<b style="color:'+OKC+'">正解</b>':'<b style="color:#ff8d80">要確認</b>正解：'+esc(window.Quiz?Quiz.answer(q):'')+'<br>')+esc(q.ex||'');ex.classList.remove('hidden');
 lamps();var nb=$('tNext');nb.textContent=TI+1>=TQ.length?'テストを終える':'つぎへ';nb.classList.remove('hidden');setTimeout(function(){nb.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'})},50)}
$('tNext').onclick=function(){TI++;$('scrTest').scrollTop=0;showQ()};
function totalStars(){var n=0;for(var k in SV.stars)n+=SV.stars[k].filter(Boolean).length;return n}
function finishTest(){var qs=TQ,answers=TA;var review=window.Quiz?Quiz.review(qs,answers):[],marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length,name=getName();
 var fs=0,ns=0;for(var k in SV.best){fs+=SV.best[k].first||0;ns+=SV.best[k].n||0}
 var records=TEST?[['モード','確認テストだけ']]:[['クリアタイム',SV.clearMs?fmtT(SV.clearMs):'（屋上まだ）'],['一発で入れた穴',fs+' / '+ns],['最大連続',(SV.maxCombo||0)+' 回'],['★',totalStars()+' / '+(NT*3)]];
 $('eName').textContent=(name?name+'　':'')+'確認テスト';$('eScore').innerHTML=score+'<small> / '+qs.length+' 点</small>';
 setScene('end');
 if(window.SubmitCard)CARD=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　電流とその利用　第20回',
  game:'せいでんきピンボール ～引力と斥力～'+(TEST?'（確認テストのみ）':''),name:name,score:score,total:qs.length,marks:marks,records:records,review:review},function(){})}
$('eCard').onclick=function(){if(CARD&&window.SubmitCard)SubmitCard.reopen(CARD)};
$('eMap').onclick=function(){setScene(TEST?'title':'map')};

/* ================= 遊び方案内（Guide）2026-09-28 ================= */
var PRAC=false,PAUSED=false;
var INTRO={title:'せいでんきピンボール',
  learn:'**同じ物どうし** の電気は **しりぞけ合い**、**こすった物とこすられた物** は **引き合う**。ふれる前から力がはたらく',
  how:'**ドラムをタップ** で面を切りかえ、右下を **長おし→はなす** で発射。画面の左右をタップでフリッパー',gesture:'tap'};
function endPractice(){if(!PRAC)return;PRAC=false;if(window.Guide)Guide.tutorialEnd()}
function tpt(x,y,r){var q=tsc(x,y);return {x:q[0],y:q[1],r:r}}
var PRACTICE={label:'れんしゅう中　1階の1発目',block:true,clearOn:'manual',clearText:'れんしゅうクリア！ 引き合って IN',
  start:function(){PRAC=true;show('scrClear',false);show('scrBackCf',false);startTable(0,true);
    G.hint=0;G.introDone=true;G.drums[0].face=0;G.drums[1].face=0;G.drums.forEach(function(d){d.flipT=.6})},
  steps:[
    {gesture:'tap',target:function(){var d=G&&G.drums[0];return d?tpt(d.x,d.y,Math.max(30,8*L.s)):null},until:function(){return PRAC&&G&&cfgOK(G)},
      text:'玉は **ストロー玉**。金の穴のドラムを **タップ** して **ティッシュ面** に（こすった相手＝**引き合う**）',praise:'引き合う面！'},
    {gesture:'tap',target:function(){return G?tpt(36,158,Math.max(34,9*L.s)):null},until:function(){return PRAC&&G&&G.flipped},
      text:'画面の **左半分・右半分** をタップするとフリッパーが動く。落ちてきた玉を打ち返す',praise:'パシッ！'},
    {gesture:'hold',holdMs:900,target:function(){return G?tpt(94.75,162,Math.max(30,7*L.s)):null},until:function(){return PRAC&&G&&G.state==='fly'},
      text:'右下を **長おし** してばねを引き、**はなして** 発射！',praise:'発射！'}
  ],
  onExit:function(res){PRAC=false}};
if(window.Guide){
  Guide.setup({theme:{bg:'#0d0c0a',fg:'#F3E9D2',accent:'#F6E27A',accentText:'#140f02',font:'"Aoboshi One","Hiragino Mincho ProN",serif',bodyFont:'"Aoboshi One","Hiragino Mincho ProN",serif',
      radius:0,texture:'none',line:'#D4AF37',dim:'rgba(5,5,5,.66)',shadow:'0 0 0 4px #0d0c0a,0 0 0 5px #8C6B1F,0 0 34px rgba(212,175,55,.35)',outline:'#0d0c0a',hand:'#F3E9D2',handLine:'#8C6B1F'},
    sfx:function(k){if(k==='step'||k==='done')SFX.ok();else if(k==='clear')SFX.fan();else if(k==='open')SFX.tap();else if(k==='nudge')SFX.post()},
    muted:function(){return muted}});
  Guide.help({title:'せいでんきピンボール',learn:INTRO.learn,how:INTRO.how,gesture:'tap',offset:{x:70},attention:true,replay:'tutorial',show:false,
    rules:['玉は「こすった物の片方」。**いまの玉** を札で確かめてから構える',
      '**金の穴** のドラムは玉と **引き合う面**（こすった相手）に、ほかは **しりぞけ合う面**（玉と同じ物）に',
      'ドラムはタップで面が切りかわる。**打つ前に構える** と一発ボーナスと連続',
      '右下を長おしで引いて、はなして発射。画面の左半分・右半分でフリッパー（キーは ← →・スペース）'],
    onOpen:function(){PAUSED=true},onClose:function(){PAUSED=false}});
}
function helpVis(){if(!window.Guide)return;var h=Guide.help();if(!h)return;if(scene==='play')h.show();else h.hide()}

/* ================= はじまり ================= */
var greeted=false;addEventListener('pointerdown',function(){if(greeted||scene!=='title')return;greeted=true;ac();[392,523,659,784,1047].forEach(function(f,i){bell(f,.03,i*.07)})},true);
resize();
window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]});
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nmRow').classList.add('hidden')}else if(SV.name)$('nameIn').value=SV.name;
if(!(SV.unl>0||SV.stars[0]))$('bCont').classList.add('hidden');
if(SV.done)$('bToTest').classList.remove('hidden');
if(TEST)startTest();else setScene('title');
requestAnimationFrame(frame);
/* 自動操作の確かめ用の窓口（遊びには影響しない） */
window.__SP={PRAC:function(){return PRAC},PAUSED:function(){return PAUSED},tsc:function(x,y){return tsc(x,y)},G:function(){return G},start:startTable,scene:function(){return scene},SV:function(){return SV},
 setRight:function(){if(!G)return;G.drums.forEach(function(d){d.face=wantFace(G,d)})},
 launch:function(p){if(!G)return;G.pull=p||.7;release()},flip:function(s,on){if(G)flipper(s,on)},toggle:function(i){if(G&&G.drums[i])toggleDrum(G.drums[i])},
 physics:function(dt){physics(dt)},update:function(dt){update(dt)},clear:tableClear,toTest:toTest};
})();
