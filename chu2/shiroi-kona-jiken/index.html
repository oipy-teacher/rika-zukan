<title>白い粉の三つ子事件 ～分解でできた物質の正体～</title>
<!--
  ゲームID: shiroi-kona-jiken ／ コマID: chu2-kagaku-02（化学変化と原子・分子 第2回・確認用）
  ねらい: 炭酸水素ナトリウムの加熱でできた3つの物質は、どれも元の物質と性質が違うことを証拠で示す

  【6. 別の世界】（2026-09-27 v2 作り直し ─ 画風＝サイレント映画）
   1 世界とメタファー: 無声映画の探偵事務所。画面そのものが映写されたフィルムの1コマ（粒子・ちらつき・縦の傷・四隅の丸いケラレ）。
     説明はすべて「字幕カード」（黒地に白い飾り枠の中間字幕）。探偵は顔を映さず、手元とカウンターだけ。
     容疑者は3人組の「物」──泡の男（気体）・しずくの女（液体）・こなの三郎（固体）。帽子をかぶったシルエットで、顔は描かない。
   2 配色: 背景 #1C1C1C ／ 主 銀幕の白 #EDEDED ／ 差し 赤 #D72638。画面はすべて白黒で、**反応の色だけがカラー**
     （塩化コバルト紙の青→桃、フェノールフタレイン液のうすい赤→こい赤、封蝋と判決の赤）
   3 書体: 見出し・字幕 Noto Serif JP（太字）／ 本文も明朝で字幕らしく
   4 画面: 全画面canvasに探偵事務所のカウンターを描く。横長＝カウンター越しに試験管を横に並べ、右に証拠板と事件の札。
     縦長（スマホ）＝1本を画面の中央に大きく、瓶は上から傾けて注ぐ。事件の札は上の帯、棚は下
   5 HUD: 映写機のフィルムカウンター風の帯（第◯巻・証拠写真の数・かけら・音）。もどるは字幕カードの札
   6 音: 伴奏ピアノ（三和音・グリッサンド）・液体のとくとく・しずくのぽとん・ガラスのカチン・フラッシュのバシュッ（WebAudio合成）

  【7. 動かす遊び】注ぎ（傾けて量を合わせて注ぐバーテンダー型）
   棚から正しい試薬を選び、指でドラッグ（または端末を傾けて）瓶を傾け、試験管の目もりまで注ぐ。入れすぎは本当の差（+◯mL）を表示してやり直し。
   比べる実験では「さっきと同じ量」を目もりの影に合わせる（条件をそろえる）。しずく・つぶの数も数えて合わせる。
   栓をして左右にふる → 石灰水が白くにごる／元の粉はとけ残る。塩化コバルト紙は青→桃、フェノールフタレイン液はうすい赤 vs こい赤。
   元の炭酸水素ナトリウムと並べて比べた証拠がそろったときだけ、事件の札が裏返る。
  30分: 第0巻 封印をとく（化学1の予言） → 第1〜7巻（気体2巻・液体2巻・固体2巻・台所）→ 第8・9巻 最終弁論（時間つき）→ 確認テスト＋提出カード
  封印の読み取り: localStorage rika-zukan:chu2:seal:chu2-kagaku-01 の slots.gas/liquid/solid.id（co2 / water / other が実験の結果と一致）
-->

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#1C1C1C;color:#EDEDED;

input{-webkit-user-select:text;user-select:text}
/* 字幕カードの札（ボタン） */
.plate{position:relative;min-height:48px;padding:8px 26px;border:0;cursor:pointer;background:#111;color:#EDEDED;font-family:"Noto Serif JP",serif;font-weight:700;font-size:18px;letter-spacing:.08em;
  box-shadow:inset 0 0 0 2px #EDEDED,inset 0 0 0 5px #111,inset 0 0 0 6px #9a9a9a}

.plate.red{background:#D72638;color:#fff;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 5px #D72638,inset 0 0 0 6px rgba(255,255,255,.6)}

#bBack{flex:none;height:42px;padding:0 16px 0 14px;font-size:17px}
#hud .reel{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.06em;white-space:nowrap;overflow:hidden}
#hud .reel .no{flex:none;font-size:13px;color:#111;background:#EDEDED;padding:2px 8px;letter-spacing:.1em}

#hud .cnt{flex:none;display:flex;align-items:center;gap:6px;font-size:13px;color:#bdbdbd;border:1px solid #555;padding:3px 10px;white-space:nowrap}

#bSnd,#bTilt{flex:none;width:44px;height:44px;border:1px solid #666;background:#111;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-size:12px}

body.port #hud .cnt.ev,body.port #hud .reel .nm,body.port #hud .cnt small{display:none}

body.port #bTilt{width:40px;font-size:10px;line-height:1.1}
body.port #hud .cnt{padding:2px 7px}
/* ===== 事件の札 ===== */
#cases{position:fixed;z-index:4;display:grid;gap:8px}
.case{position:relative;perspective:700px;min-height:80px}
.case .in{position:absolute;inset:0;transition:transform .9s cubic-bezier(.4,1.4,.5,1);transform-style:preserve-3d}
.case.flip .in{transform:rotateY(180deg)}
.case .f,.case .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;gap:10px;padding:6px 10px;
  background:#101010;box-shadow:inset 0 0 0 1.5px #bdbdbd,inset 0 0 0 4px #101010,inset 0 0 0 5px #555}
.case .b{transform:rotateY(180deg);background:#1a0a0d;box-shadow:inset 0 0 0 2px #D72638,inset 0 0 0 5px #1a0a0d,inset 0 0 0 6px rgba(215,38,61,.5)}
.case canvas{flex:none;width:56px;height:56px}
.case .tx{min-width:0;line-height:1.35}
.case .tx b{display:block;font-size:16px;letter-spacing:.04em}
.case .tx small{display:block;font-size:12px;color:#aaa}
.case .b .tx b{color:#ff8a9a;font-size:18px}
.case .b .st{position:absolute;right:8px;top:6px;font-size:12px;color:#D72638;border:2px solid #D72638;padding:0 5px;transform:rotate(8deg);font-weight:900}
body.port #cases{grid-template-columns:repeat(3,1fr);gap:5px}
body.port .case{min-height:58px}
body.port .case canvas{width:34px;height:34px}
body.port .case .f,body.port .case .b{gap:4px;padding:3px 5px}
body.port .case .tx b{font-size:12px}
body.port .case .b .tx b{font-size:13px}
body.port .case .tx small{font-size:10.5px;white-space:nowrap}
body.port .case .b .st{display:none}
/* 証拠板 */
#board{position:fixed;z-index:4;overflow:hidden;background:#141414;box-shadow:inset 0 0 0 1px #444}
#board h3{margin:6px 10px 4px;font-size:14px;letter-spacing:.2em;color:#9a9a9a;font-weight:700}
#boardIn{display:grid;grid-template-columns:repeat(var(--bc,2),1fr);gap:8px;padding:4px 10px 10px}
.ph{position:relative;background:#e8e8e8;padding:5px 5px 18px;transform:rotate(var(--r,-1.5deg));box-shadow:2px 3px 0 rgba(0,0,0,.6)}
.ph canvas{display:block;width:100%;height:auto;background:#222}
.ph span{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:10.5px;color:#222;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.ph::before{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#D72638;box-shadow:0 1px 0 #000}
.ph.empty{background:#222;box-shadow:inset 0 0 0 1px #444}.ph.empty::before{display:none}
.ph.empty span{color:#666}
/* 操作の字幕（下） */
#cap{position:fixed;z-index:4;left:50%;transform:translateX(-50%);max-width:min(760px,94vw);text-align:center;padding:8px 22px 9px;background:rgba(10,10,10,.92);
  box-shadow:inset 0 0 0 1.5px #EDEDED,inset 0 0 0 4px rgba(10,10,10,.92),inset 0 0 0 5px #777;font-size:17px;font-weight:700;line-height:1.5;letter-spacing:.04em;pointer-events:none}
#cap small{display:block;font-size:13px;font-weight:500;color:#bdbdbd;letter-spacing:0}
#cap .v{color:#fff;font-variant-numeric:tabular-nums}
#cap .bad{color:#ff8a9a}
body.port #cap{font-size:15px;padding:6px 14px 7px}
/* 中間字幕（全画面） */
#inter{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,8,8,.96);cursor:pointer;padding:16px}
#inter .card{position:relative;width:min(760px,94vw);min-height:min(420px,70vh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 34px;
  box-shadow:inset 0 0 0 2px #EDEDED,inset 0 0 0 8px #080808,inset 0 0 0 9px #8a8a8a}
#inter .card::before,#inter .card::after{content:"❦";position:absolute;font-size:26px;color:#9a9a9a}
#inter .card::before{top:16px}#inter .card::after{bottom:14px;transform:rotate(180deg)}
#inter .k{font-size:14px;letter-spacing:.4em;color:#9a9a9a;margin-bottom:10px}
#inter h2{margin:0 0 16px;font-size:clamp(26px,4.2vw,44px);font-weight:900;letter-spacing:.12em;line-height:1.35}
#inter p{margin:6px 0;font-size:clamp(17px,2.2vw,22px);line-height:1.8;letter-spacing:.04em}
#inter p b{color:#ff8a9a}
#inter .who{color:#bdbdbd;font-size:.9em}
#inter .go{margin-top:18px;font-size:14px;color:#9a9a9a;letter-spacing:.2em;animation:blink 1.6s steps(2) infinite}
#inter .red{color:#D72638}
#inter .sealrow{display:grid;gap:8px;width:100%;max-width:560px;margin:10px auto 0;text-align:left}
#inter .sealrow div{padding:8px 12px;box-shadow:inset 0 0 0 1px #777;font-size:16px;line-height:1.5}
#inter .sealrow div small{display:block;color:#9a9a9a;font-size:12px}
#inter .opts{display:grid;gap:10px;width:100%;max-width:520px;margin-top:10px}
@keyframes blink{50%{opacity:.25}}
/* タイトル */
#title{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
#title .btns{display:flex;flex-direction:column;align-items:center;gap:12px}
#title .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#nmBox{display:flex;align-items:center;gap:8px;padding:6px 14px;box-shadow:inset 0 0 0 1px #777;background:rgba(10,10,10,.85)}
#nmBox label{font-size:14px;color:#bdbdbd;white-space:nowrap;letter-spacing:.1em}
#nmIn{width:180px;min-height:36px;border:0;border-bottom:1px solid #EDEDED;background:transparent;color:#EDEDED;font-size:17px;padding:2px 4px;outline:none;font-family:inherit}
#bStart{font-size:22px;min-height:58px;padding:8px 44px}
/* クリア */
.scr{position:fixed;inset:0;z-index:12;overflow-y:auto}

#clear h2{margin:6px 0;font-size:clamp(28px,4.4vw,46px);letter-spacing:.14em;font-weight:900}
#clear .eq{margin:14px auto;font-size:clamp(16px,2.4vw,22px);font-weight:700;line-height:1.6;padding:10px 12px;box-shadow:inset 0 0 0 1px #D72638}
#clear .eq b{color:#ff8a9a}
#clear .rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
#clear .rec div{box-shadow:inset 0 0 0 1px #555;padding:6px;font-size:13px;color:#bdbdbd}
#clear .rec b{display:block;font-size:22px;color:#EDEDED}
#clear .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}

#test{padding:calc(var(--hb,54px) + 12px) 14px 24px;background:#1C1C1C}

#tHead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #777;padding-bottom:6px}

#tNo{font-weight:900;font-size:18px;color:#ff8a9a}
#tQ{font-size:18px;line-height:1.8;font-weight:700;margin:12px 0 8px}
#tFig{text-align:center}
#tFig svg{max-width:100%;height:auto;background:#fff;filter:grayscale(.2)}
#tA{display:grid;gap:10px;margin-top:10px}
.opt{min-height:52px;border:0;cursor:pointer;text-align:left;padding:10px 16px;font-size:16px;line-height:1.55;font-weight:700;background:#0b0b0b;color:#EDEDED;box-shadow:inset 0 0 0 1px #9a9a9a;font-family:inherit}
.opt:active{background:#222}
.opt.ok{box-shadow:inset 0 0 0 3px #EDEDED;background:#2a2a2a}.opt.ng{box-shadow:inset 0 0 0 3px #D72638;color:#ff8a9a}.opt.pk{opacity:.35}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{width:160px;min-height:48px;font-size:20px;border:0;border-bottom:2px solid #EDEDED;background:#000;color:#EDEDED;padding:4px 10px;font-family:inherit}
#ordBox{min-height:30px;font-size:15px;line-height:1.7;box-shadow:inset 0 0 0 1px #555;padding:6px 10px}
#tFb{margin-top:12px;font-size:15px;line-height:1.7}

#tFb .ex{display:block;box-shadow:inset 0 0 0 1px #777;padding:6px 10px;margin-top:6px;font-size:14px;color:#ddd}
/* もどる確認 */
#bk{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:40}
#bk .card{width:min(460px,92vw);text-align:center;padding:24px 20px 18px;background:#0c0c0c;box-shadow:inset 0 0 0 2px #EDEDED,inset 0 0 0 7px #0c0c0c,inset 0 0 0 8px #8a8a8a}
#bk h3{margin:0 0 8px;font-size:22px;letter-spacing:.1em}
#bk p{margin:0 0 14px;font-size:15px;line-height:1.7;color:#ddd}
#bk .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* 巻の終わり：★のドン・ドン・ドン（仕上げ 2026-09-27） */
#rclr{position:fixed;left:50%;top:50%;z-index:19;transform:translate(-50%,-50%);min-width:min(460px,90vw);padding:26px 30px 22px;text-align:center;pointer-events:none;background:rgba(8,8,8,.94);
  box-shadow:inset 0 0 0 2px #EDEDED,inset 0 0 0 8px rgba(8,8,8,.94),inset 0 0 0 9px #8a8a8a;animation:rcIn .35s ease-out both}
#rclr .k{font-size:15px;letter-spacing:.5em;color:#bdbdbd}
#rclr .st{margin:8px 0 6px;font-size:56px;line-height:1;letter-spacing:.12em}

#rclr .st i.off{color:#3a3a3a;text-shadow:none}
#rclr .st i.on{opacity:1;transform:none;transition:transform .3s cubic-bezier(.2,1.9,.4,1),opacity .1s}
#rclr .w{font-size:14px;color:#bdbdbd;line-height:1.7}

.plate{transition:transform .08s}
.plate:active{transform:translateY(3px) scale(.97)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<canvas id="cv"></canvas>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================

  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}

  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }
