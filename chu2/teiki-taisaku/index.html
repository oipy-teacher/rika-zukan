<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1128">
<title>定期テスト対策 ～ボスラッシュ～</title>
<style>
:root{--ink:#0d1128;--ink2:#161c3d;--paper:#fffdf6;--gold:#ffc93c;--gold2:#e39a00;--red:#ff4d5e;--ok:#22c57a;--blue:#3d7bff;--dim:rgba(255,255,255,.62);--line:rgba(255,255,255,.16);--uc:#ffc93c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;background:var(--ink);color:#fff;overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(600px 420px at 50% -80px,rgba(255,201,60,.22),transparent 70%),
 repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.035) 39px 40px),
 repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.035) 39px 40px),var(--ink)}
body.fever::before{animation:fever 1.2s ease-in-out infinite alternate}
@keyframes fever{to{filter:hue-rotate(-18deg) brightness(1.35)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{width:min(100%,540px);margin:0 auto;min-height:100%;padding:max(10px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column}
.scr.on{display:flex;animation:scrIn .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(16px)}}
.hud{display:flex;align-items:center;gap:5px;min-height:44px;margin-bottom:8px;min-width:0}
.hud .pill{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-weight:800;font-size:13px;white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud>span:not(.pill):not(.sp){flex:0 1 auto;min-width:0;overflow:hidden}
.hud .sp{flex:1}
.mute{flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);font-size:20px}
.big{display:block;width:100%;min-height:58px;border-radius:18px;font-weight:900;font-size:20px;letter-spacing:.04em;background:linear-gradient(180deg,#ffd760,var(--gold2));color:#3a2300;box-shadow:0 6px 0 #9c6400,0 12px 26px rgba(0,0,0,.4);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #9c6400}
.big.sub{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.ghost{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid rgba(255,255,255,.35);font-weight:800;font-size:15px}
h1,h2{margin:0}
.center{text-align:center}

/* タイトル */
#title{justify-content:center;align-items:center;text-align:center;gap:14px}
.logo{position:relative;margin:10px 0 4px}
.logo .trophy{font-size:88px;line-height:1;display:inline-block;filter:drop-shadow(0 8px 24px rgba(255,201,60,.55));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.logo h1{font-size:clamp(34px,10vw,48px);letter-spacing:.06em;line-height:1.1;margin-top:8px;text-shadow:0 3px 0 #9c6400,0 0 30px rgba(255,201,60,.4)}
.logo h1 small{display:block;font-size:.46em;color:var(--gold);letter-spacing:.2em;text-shadow:none;margin-top:6px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin:6px 0}
.flow div{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-size:13px;font-weight:700;line-height:1.35}
.flow b{display:block;font-size:24px;margin-bottom:2px}
.namein{width:100%;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.07);border-radius:14px;padding:6px 10px}
.namein label{font-size:13px;color:var(--dim);white-space:nowrap}
.namein input{flex:1;min-width:0;height:44px;font:inherit;font-size:17px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;padding:0 10px;user-select:text;-webkit-user-select:text}
.trophies{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.trophies span{background:rgba(255,255,255,.07);border-radius:999px;padding:3px 10px}
.trophies span.got{background:rgba(255,201,60,.18);color:var(--gold);font-weight:800}
.nodata{background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.4);border-radius:14px;padding:12px;font-size:14px;line-height:1.7}

/* 範囲えらび */
#range h2{font-size:22px;margin:4px 0 2px}
#range .lead{font-size:13px;color:var(--dim);margin-bottom:10px}
.rtools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.utabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;position:sticky;top:0;z-index:3;background:var(--ink);padding:4px 0}
.utabs button{min-height:52px;border-radius:12px;background:rgba(255,255,255,.07);border:2px solid transparent;font-weight:900;font-size:15px;line-height:1.15}
.utabs button small{display:block;font-size:11px;color:var(--dim);font-weight:700;margin-top:2px}
.utabs button.on{background:var(--uc);border-color:rgba(255,255,255,.6)}
.utabs button.on small{color:#fff}
.grp{margin-bottom:10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);overflow:hidden}
.grp .gh{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 12px;text-align:left;font-weight:800;font-size:15px;background:rgba(255,255,255,.06)}
.grp .gh small{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap}
.ck{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:transparent;transition:.15s}
.on>.ck,.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.half{background:rgba(34,197,122,.4);border-color:var(--ok);color:#fff}
.km{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:4px 12px;text-align:left;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.km .n{font-weight:900;width:3.6em;flex:0 0 auto;color:var(--dim);white-space:nowrap}
.km .t{flex:1;line-height:1.3}
.km .q{font-size:11px;color:var(--dim);white-space:nowrap}
.km .q.x{color:#ff8f9b;font-weight:800}
.km.draft .t{color:rgba(255,255,255,.45)}
.rbar{position:sticky;bottom:0;margin:10px -12px -20px;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:rgba(13,17,40,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.rbar .sum{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rbar .sum b{font-size:20px;color:var(--gold)}

/* 問題 */
.prog{display:flex;gap:4px;margin:2px 0 10px}
.prog i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.14)}
.prog i.o{background:var(--ok)}.prog i.x{background:var(--red)}.prog i.c{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.card{background:var(--paper);color:#1c2140;border-radius:20px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative}
.card .src{font-size:12px;color:#6b7390;font-weight:700;margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .src .tag{background:#1c2140;color:#fff;border-radius:6px;padding:1px 8px}
.card .src .tag.x{background:var(--red)}
.card .src .tag.n{background:#3d7bff}
.card .qt{font-size:clamp(18px,5vw,22px);font-weight:800;line-height:1.55;overflow-wrap:anywhere}
.card .fig{margin:10px 0 0;text-align:center}
.card .fig svg{max-width:100%;height:auto;max-height:220px}
.chs{display:grid;gap:10px;margin-top:12px}
.ch{min-height:56px;border-radius:16px;background:#fff;color:#1c2140;font-weight:800;font-size:17px;line-height:1.35;padding:10px 14px;text-align:left;box-shadow:0 4px 0 #c9cfdd,0 6px 14px rgba(0,0,0,.25);transition:transform .08s;display:flex;align-items:center;gap:10px}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 #c9cfdd}
.ch i{font-style:normal;flex:0 0 28px;height:28px;border-radius:50%;background:#1c2140;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.ch.right{background:var(--ok);color:#fff;box-shadow:0 4px 0 #148a53}
.ch.right i{background:#fff;color:var(--ok)}
.ch.wrong{background:var(--red);color:#fff;box-shadow:0 4px 0 #b3202f;animation:shake .4s}
.ch.dim{opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.numbox{margin-top:12px}
.numdisp{height:56px;border-radius:14px;background:#fff;color:#1c2140;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;gap:8px;box-shadow:inset 0 0 0 3px #c9cfdd}
.numdisp small{font-size:18px;color:#6b7390}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keys button{min-height:54px;border-radius:14px;background:#fff;color:#1c2140;font-size:22px;font-weight:900;box-shadow:0 3px 0 #c9cfdd}
.keys .ok{background:var(--gold);grid-row:span 2;font-size:18px;box-shadow:0 3px 0 #9c6400}
.ordbox{margin-top:12px}
.ordsel{min-height:56px;border-radius:14px;border:2px dashed #c9cfdd;padding:6px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.ordsel .it{background:#1c2140;color:#fff;border-radius:10px;padding:8px 10px;font-weight:700;font-size:15px}
.ordsel .ph{color:#9aa1b8;font-size:14px;padding:8px}
.orditems{display:grid;gap:8px}
.orditems button{min-height:50px;border-radius:12px;background:#fff;color:#1c2140;font-weight:800;font-size:15px;text-align:left;padding:8px 12px;box-shadow:0 3px 0 #c9cfdd}
.orditems button.used{visibility:hidden}
.fb{margin-top:12px;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.6;animation:scrIn .3s}
.fb.o{background:rgba(34,197,122,.14);border:2px solid var(--ok)}
.fb.x{background:rgba(255,77,94,.12);border:2px solid var(--red)}
.fb b.h{font-size:19px;display:block}
.fb .ans{font-weight:800}
.fb .from{font-size:13px;color:var(--dim);margin-top:4px}
.next{margin-top:12px}
.combo{position:fixed;right:12px;bottom:max(84px,calc(env(safe-area-inset-bottom) + 70px));z-index:40;text-align:right;pointer-events:none;font-weight:900;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.combo b{display:block;font-size:44px;color:var(--gold)}
.combo span{font-size:14px;letter-spacing:.2em}
.combo.pop{animation:cpop .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes cpop{from{transform:scale(1.8) rotate(-8deg)}}
.stamp{position:fixed;left:50%;top:38%;z-index:60;transform:translate(-50%,-50%) rotate(-10deg);pointer-events:none;font-weight:900;font-size:56px;padding:6px 22px;border:6px solid;border-radius:18px;background:rgba(13,17,40,.55);animation:stamp .9s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap}
.stamp small{display:block;font-size:18px;text-align:center;letter-spacing:.2em}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-10deg) scale(3);opacity:0}25%{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) rotate(-10deg) scale(1)}}
.floaty{position:fixed;z-index:61;pointer-events:none;font-weight:900;font-size:26px;color:var(--gold);text-shadow:0 2px 0 #000;animation:floaty 1s ease-out forwards}
@keyframes floaty{to{transform:translateY(-70px);opacity:0}}

/* ラウンドのあいだ */
#between{justify-content:center;text-align:center;gap:14px}
#between h2{font-size:30px;color:var(--gold);text-shadow:0 3px 0 #9c6400}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.08);border-radius:16px;padding:12px 4px;font-size:13px;font-weight:700}
.stats b{display:block;font-size:34px;line-height:1.1}
.stats .fx b{color:var(--gold)}
.meterbig{height:18px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.meterbig i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#a6f06a);width:0;transition:width 1.2s cubic-bezier(.2,1,.3,1)}

/* ボス */
.arena{position:relative;border-radius:22px;padding:12px 12px 10px;margin-bottom:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:center;overflow:hidden}
.arena{background:radial-gradient(300px 200px at 50% 60%,color-mix(in srgb,var(--uc) 45%,transparent),transparent 70%),rgba(255,255,255,.05);border:1px solid var(--line);text-align:center;overflow:hidden}
.bname{font-weight:900;font-size:18px;letter-spacing:.06em}
.bname small{display:block;font-size:12px;color:var(--dim);letter-spacing:.2em}
.hp{height:16px;border-radius:99px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.4);overflow:hidden;margin:6px 0 2px;position:relative}
.hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#ff7a85,#e0273a);transition:width .5s cubic-bezier(.2,1,.3,1)}
.hp s{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.6;transition:width 1.1s ease .35s;text-decoration:none}
.bfig{font-size:74px;line-height:1.1;margin:2px 0 0;display:inline-block;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));animation:idle 2s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-6px) scale(1.03)}}
.bfig.hit{animation:bhit .45s}
@keyframes bhit{0%{filter:brightness(4) drop-shadow(0 0 20px #fff)}30%{transform:translateX(-14px) rotate(-8deg)}60%{transform:translateX(12px) rotate(6deg)}100%{transform:none}}
.bfig.dead{animation:bdead 1.4s forwards}
@keyframes bdead{30%{transform:scale(1.25) rotate(-10deg);filter:brightness(3)}100%{transform:scale(0) rotate(200deg);opacity:0}}
.phase{display:flex;gap:6px;justify-content:center;margin-top:4px}
.phase span{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:rgba(255,255,255,.08);color:var(--dim)}
.phase span.on{background:var(--uc);color:#fff}
.phase span.done{background:rgba(34,197,122,.25);color:#9ff0c8}
.hearts{font-size:20px;letter-spacing:2px;margin-top:4px}
.shake{animation:scr .4s}
@keyframes scr{20%{transform:translate(-6px,4px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
.flash{position:fixed;inset:0;z-index:55;pointer-events:none;background:#fff;animation:flash .35s forwards}
.flash.red{background:#ff2440}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.bmsg{min-height:24px;font-weight:800;font-size:15px;margin:8px 0 0;color:var(--gold)}
.timer{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}

/* ミニ課題 */
.mini .bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:10px}
.mini .bin{min-height:90px;border-radius:14px;border:3px dashed #9aa1b8;padding:6px;font-weight:800;font-size:14px;color:#1c2140;background:#f2f4fa;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.mini .bin.arm{border-color:var(--gold2);background:#fff7de}
.mini .bin.wrong{animation:shake .4s;border-color:var(--red)}
.mini .bin span{font-size:12px;background:#1c2140;color:#fff;border-radius:8px;padding:3px 6px}
.mini .pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mini .pool button{min-height:46px;padding:0 12px;border-radius:12px;background:#1c2140;color:#fff;font-weight:800;font-size:15px}
.mini .pool button.sel{background:var(--gold2);color:#3a2300;transform:scale(1.06)}
.mini .sld{margin-top:14px}
.mini input[type=range]{width:100%;height:44px;accent-color:var(--gold2)}
.mini .meter{font-size:30px;font-weight:900;text-align:center;margin-top:6px}
.mini .meter small{font-size:14px;color:#6b7390;display:block;font-weight:700}

/* 成績 */
#result h2{font-size:26px;text-align:center;margin:4px 0 10px}
.rsum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.rsum div{background:rgba(255,255,255,.08);border-radius:14px;padding:10px;text-align:center;font-size:13px;font-weight:700}
.rsum b{display:block;font-size:28px}
.xlist{display:grid;gap:8px;margin:8px 0 14px}
.xlist .xi{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5}
.xlist .xi .a{color:var(--gold);font-weight:800}
.xlist .xi button{margin-top:6px;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;font-weight:800}

/* 限定カード */
.reveal{position:fixed;inset:0;z-index:80;background:rgba(5,7,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.reveal .rays{position:absolute;width:760px;height:760px;left:50%;top:44%;margin:-380px 0 0 -380px;background:repeating-conic-gradient(from 0deg,rgba(255,201,60,.22) 0 8deg,transparent 8deg 22deg);border-radius:50%;animation:spin 9s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%)}
@keyframes spin{to{transform:rotate(360deg)}}
.lcard{position:relative;width:210px;height:300px;perspective:900px}
.lcard .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.3,1.4,.4,1)}
.lcard.open .in{transform:rotateY(180deg)}
.lcard .f,.lcard .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px}
.lcard .b{background:repeating-linear-gradient(45deg,#2a2f57 0 10px,#232849 10px 20px);border:4px solid var(--gold);font-size:64px;box-shadow:0 0 40px rgba(255,201,60,.5)}
.lcard .f{transform:rotateY(180deg);background:linear-gradient(160deg,#fff8dc,#ffe08a 55%,#f5b700);color:#3a2300;border:4px solid #fff;box-shadow:0 0 60px rgba(255,201,60,.9)}
.lcard .f .art{font-size:78px;line-height:1}
.lcard .f .art svg{width:120px;height:120px}
.lcard .f .nm{font-size:20px;font-weight:900}
.lcard .f .rb{position:absolute;top:10px;left:-6px;background:var(--red);color:#fff;font-size:12px;font-weight:900;padding:3px 12px;border-radius:0 8px 8px 0;letter-spacing:.15em}
.lcard .f .say{font-size:12px;line-height:1.5}
.reveal h3{margin:0;font-size:24px;color:var(--gold);position:relative}
.reveal p{margin:0;position:relative;font-size:14px;color:var(--dim);max-width:320px;line-height:1.6}
.reveal .big{max-width:320px;position:relative}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）

  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

よう、まず一番大きい値の端子につなぎ、振れが小さければ小さい端子にかえる。", "fig": null, "kind": "method", "level": 1, "game": "denatsu-slide"}, {"id": "chu2-denatsu-slide-q009", "koma": "chu2-denryu-05", "t": "order", "q": "直列回路の電圧の関係を調べる実験の手順を、正しい順にならべよう。", "items": ["抵抗器2つと電源を直列につなぐ", "電圧計を抵抗器Aの両端に並列につなぐ", "スイッチを入れて電圧計の値を読む", "抵抗器Bの両端・電源の両端でも同じように測る", "3つの値の関係を調べる"], "ex": "回路を組み、電圧計を並列につないで測り、場所をかえて測ってから、値の関係を調べる。", "fig": null, "kind": "method", "level": 2, "game": "denatsu-slide"}, {"id": "chu2-denatsu-slide-q010", "koma": "chu2-denryu-05", "t": "num", "q": "直列回路で電源の電圧を変えて、抵抗器A・Bの電圧を測った。表の「？」は何Vと考えられるか。", "ans": 6.0, "unit": "V", "tol": 0.05, "ex": "どの行も A＋B＝電源。9.0−3.0＝6.0V。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 304 92\" width=\"304\" font-family=\"sans-serif\" font-size=\"14\">\u003crect x=\"1\" y=\"1\" width=\"110\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"56.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">電源の電圧\u003c/text>\u003crect x=\"111\" y=\"1\" width=\"64\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"143.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">3.0V\u003c/text>\u003crect x=\"175\" y=\"1\" width=\"64\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"207.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">6.0V\u003c/text>\u003crect x=\"239\" y=\"1\" width=\"64\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"271.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">9.0V\u003c/text>\u003crect x=\"1\" y=\"31\" width=\"110\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"56.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">Aの電圧\u003c/text>\u003crect x=\"111\" y=\"31\" width=\"64\" height=\"30\" fill=\"#fff\" stroke=\"#23262b\"/>\u003ctext x=\"143.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">1.0V\u003c/text>\u003crect x=\"175\" y=\"31\" width=\"64\" height=\"30\" fill=\"#fff\" stroke=\"#23262b\"/>\u003ctext x=\"207.0\" y=\"51\" tex lide-q014", "koma": "chu2-denryu-05", "t": "num", "q": "電源9.0Vの直列回路につないだ2つの抵抗器に、同じ大きさの電圧がかかっていた。1つの抵抗器にかかる電圧は何Vか。", "ans": 4.5, "unit": "V", "tol": 0.05, "ex": "2つの和が9.0Vで、2つが等しいので 9.0÷2＝4.5V。", "fig": null, "kind": "calc", "level": 2, "game": "denatsu-slide"}, {"id": "chu2-denatsu-slide-q015", "koma": "chu2-denryu-05", "t": "choice", "q": "図の回路で、電圧計が測っているのはどこの電圧？", "choices": ["抵抗器Aにかかる電圧", "抵抗器Bにかかる電圧", "電源の電圧", "回路を流れる電流"], "ex": "電圧計は抵抗器Aの両端に並列につながっているので、Aにかかる電圧を測っている。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 150\" width=\"320\" font-family=\"sans-serif\" font-size=\"14\">\u003cpath d=\"M30 70 V30 H290 V130 H30 V86\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"16\" y1=\"74\" x2=\"44\" y2=\"74\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"23\" y1=\"82\" x2=\"37\" y2=\"82\" stroke=\"#23262b\" stroke-width=\"5\"/>\u003crect x=\"87.0\" y=\"21\" width=\"46\" height=\"18\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"110\" y=\"35\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">A\u003c/text>\u003crect x=\"187.0\" y=\"21\" width=\"46\" height=\"18\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"210\" y=\"35\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">B\u003c/text>\u003cpath d=\"M72 30 V75 H97\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cpath d=\"M123 75 H148 V30\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ccircle cx=\"110\" cy=\"75\" r=\"13\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"110\" y=\"80\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">V\u003c/text>\u003ccircle cx=\"72\" cy=\"30\" r=\"3\" fill=\"#23262b\"/>\u003ccircle cx=\"148\" cy=\"30\" r=\"3\" fill=\"#23262b\"/>\u003c/svg>", "kind": "graph", "level": 1, "game": "denatsu-slide"}, {"id": "chu2-parallel-defense-q001", "koma": "chu2-denryu-06", "t": "choice", "q": "2つの抵抗器A・Bを並列につないだ。Aにかかる電圧をV\u003csub>A\u003c/sub>、Bにかかる電圧をV\u003csub>B\u003c/sub>、電源の電圧をVとすると、成り立つ関係は？", "choices": ["V＝V\u003csub>A\u003c/sub>＝V\u003csub>B\u003c/sub>", "V＝V\u003csub>A\u003c/sub>＋V\u003csub>B\u003c/sub>", "V＝V\u003csub>A\u003c/sub>−V\u003csub>B\u003c/sub>", "V\u003csub>A\u003c/sub>＋V\u003csub>B\u003c/sub>＝2V"], "ex": "並列では、どの枝の抵抗器にも電源と同じ電圧がかかるので V＝V\u003csub>A\u003c/sub>＝V\u003csub>B\u003c/sub>。", "fig": null, "kind": "judge", "level": 1, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q002", "koma": "chu2-denryu-06", "t": "num", "q": "図の並列回路で、電源の電圧は6.0Vだった。抵抗器Bにかかる電圧は何Vか。", "ans": 6.0, "unit": "V", "tol": 0.05, "ex": "並列では、それぞれの抵抗器に電源と同じ電圧がかかる。だから6.0V。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 190\" width=\"320\" font-family=\"sans-serif\" font-size=\"14\">\u003cpath d=\"M30 76 V30 H270 V170 H30 V92\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"16\" y1=\"80\" x2=\"44\" y2=\"80\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"23\" y1=\"88\" x2=\"37\" y2=\"88\" stroke=\"#23262b\" stroke-width=\"5\"/>\u003ctext x=\"50\" y=\"89\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#23262b\">6.0V\u003c/text>\u003cpath d=\"M130 30 V77 M130 123 V170\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003crect x=\"121\" y=\"77.0\" width=\"18\" height=\"46\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"146\" y=\"105\" fill=\"#23262b\" font-weight=\"bold\">\u003c/text>\u003ctext x=\"114\" y=\"105\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#23262b\">A\u003c/text>\u003cpath d=\"M230 30 V77 M230 123 V170\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003crect x=\"221\" y=\"77.0\" width=\"18\" height=\"46\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"246\" y=\"105\" fill=\"#23262b\" font-weight=\"bold\">\u003c/text>\u003ctext x=\"214\" y=\"105\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#23262b\">B\u003c/text>\u003ct 2b\" stroke-width=\"2.5\"/>\u003ccircle cx=\"130\" cy=\"100\" r=\"11\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cpath d=\"M122.2 92.2 L137.8 107.8 M137.8 92.2 L122.2 107.8\" stroke=\"#23262b\" stroke-width=\"2\"/>\u003ctext x=\"114\" y=\"105\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#23262b\">A\u003c/text>\u003cpath d=\"M230 30 V44\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"230\" y1=\"44\" x2=\"242\" y2=\"68\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ccircle cx=\"230\" cy=\"44\" r=\"3\" fill=\"#23262b\"/>\u003ccircle cx=\"230\" cy=\"70\" r=\"3\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2\"/>\u003cpath d=\"M230 73 V88\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cpath d=\"M230 88 V89 M230 111 V170\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ccircle cx=\"230\" cy=\"100\" r=\"11\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cpath d=\"M222.2 92.2 L237.8 107.8 M237.8 92.2 L222.2 107.8\" stroke=\"#23262b\" stroke-width=\"2\"/>\u003ctext x=\"214\" y=\"105\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#23262b\">B\u003c/text>\u003ccircle cx=\"130\" cy=\"30\" r=\"3\" fill=\"#23262b\"/>\u003ccircle cx=\"130\" cy=\"170\" r=\"3\" fill=\"#23262b\"/>\u003c/svg>", "kind": "judge", "level": 2, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q005", "koma": "chu2-denryu-06", "t": "choice", "q": "豆電球Aだけが光っている回路で、図のスイッチを入れて豆電球Bを並列に加えた。電源から流れ出る電流の大きさはどうなる？（電源の電圧は変わらないものとする）", "choices": ["大きくなる", "小さくなる", "変わらない"], "ex": "Aに流れる電流はそのままで、Bに流れる電流の分だけ加わるので、電源から流れ出る電流は大きくなる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 190\" width=\"320\" font-family=\"sans-serif\" font-size=\"14\">\u003cpath d=\"M30 76 V30 H270 V170 H30 V92\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"16\" y1=\"80\" x2=\"44\" y2=\"80\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"23\" y1=\"88\" x2=\"37\" y2=\"88\" stroke=\"#23262b\" stroke-width=\"5\"/>\u003cpath d=\"M130 30 V89 M130 111 V170\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ccircle cx=\"130\" cy=\"100\" r=\"11\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cpath d=\"M122.2 92.2 L137.8 107.8 M137.8 92.2 L122.2 107.8\" stroke=\"#23262b\" stroke-width=\"2\"/>\u003ctext x=\"114\" y=\"105\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#23262b\">A\u003c/text>\u003cpath d=\"M230 30 V44\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"230\" y1=\"44\" x2=\"242\" y2=\"68\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ccircle cx=\"230\" cy=\"44\" r=\"3\" fill=\"#23262b\"/>\u003ccircle cx=\"230\" cy=\"70\" r=\"3\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2\"/>\u003cpath d=\"M230 73 V88\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cpath d=\"M230 88 V89 M230 111 V170\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ccircle cx=\"230\" cy=\"100\" r=\"11\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cpath d=\"M222.2 92.2 L237.8 107.8 M237.8 92.2 L222.2 107.8\" stroke=\"#23262b\" stroke-width=\"2\"/>\u003ctext x=\"214\" y=\"105\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#23262b\">B\u003c/text>\u003ccircle cx=\"130\" cy=\"30\" r=\"3\" fill=\"#23262b\"/>\u003ccircle cx=\"130\" cy=\"170\" r=\"3\" fill=\"#23262b\"/>\u003c/svg>", "kind": "judge", "level": 3, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q006", "koma": "chu2-denryu-06", "t": "choice", "q": "同じ豆電球2個を、同じ電源に「直列」でつないだ場合と「並列」でつないだ場合。豆電球1個にかかる電圧が大きいのはどちら？", "choices": ["並列", "直列", "どちらも同じ"], "ex": "並列ではどちらにも電源の電圧がかかる。直列では電源の電圧を2個で分け合う。だから並列の方が大きく、明るい。", "fig": null, "kind": "judge", "level": 2, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q007", "koma": "chu2-denryu-06", "t": "num", "q": "同じ豆電球2個を、電源6.0Vに直列につないだ。豆電球1個にかかる電圧は何Vか。", "ans": 3.0, "unit": "V", "tol": 0.05, "ex": "直列では電源の6.0Vを2個で分け合う。同じ豆電球なので3.0Vずつ。（並列なら6.0Vずつ）", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 160\" width=\"320\" font-family=\"sans-serif\" font-size=\"14\">\u003cpath d=\"M30 76 V40 H290 V140 H30 V92\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"16\" y1=\"80\" x2=\"44\" y2=\"80\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"23\" y1=\"88\" x2=\"37\" y2=\"88\" stroke=\"#23262b\" stroke-width=\"5\"/>\u003ctext x=\"50\" y=\"89\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#23262b\">6.0V\u003c/text>\u003crect x=\"98\" y=\"30\" width=\"24\" height=\"20\" fill=\"#fff\" stroke=\"none\"/>\u003ccircle cx=\"110\" cy=\"40\" r=\"11\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cpath d=\"M102.2 32.2 L117.8 47.8 M117.8 32.2 L102.2 47.8\" stroke=\"#23262b\" stroke-width=\"2\"/>\u003ctext x=\"110\" y=\"70\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">A\u003c/text>\u003crect x=\"198\" y=\"30\" width=\"24\" height=\"20\" fill=\"#fff\" stroke=\"none\"/>\u003ccircle cx=\"210\" cy=\"40\" r=\"11\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cpath d=\"M202.2 32.2 L217.8 47.8 M217.8 32.2 L202.2 47.8\" stroke=\"#23262b\" stroke-width=\"2\"/>\u003ctext x=\"210\" y=\"70\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">B\u003c/text>\u003c/svg>", "kind": "calc", "level": 2, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q008", "koma": "chu2-denryu-06", "t": "choice", "q": "家のコンセントにテーブルタップをつなぎ、電気スタンドと充電器を同時に使った。それぞれの器具にかかる電圧について正しいのは？（コンセントの電圧は100V）", "choices": ["どの器具にも同じ100Vがかかる", "つないだ器具の数で100Vを分け合う", "コンセントに近い器具ほど大きな電圧がかかる"], "ex": "テーブルタップの差しこみ口は並列につながっているので、どの器具にも同じ100Vがかかる。", "fig": null, "kind": "judge", "level": 2, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q009", "koma": "chu2-denryu-06", "t": "choice", "q": "並列回路で、抵抗器Bにかかる電圧を測りたい。電圧計はどうつなぐ？", "choices": ["抵抗器Bの両端に並列につなぐ", "抵抗器Bと直列につなぐ", "電源と直列につなぐ", "抵抗器Aと直列につなぐ"], "ex": "電圧計は、測りたい抵抗器の両端に並列につなぐ。", "fig": null, "kind": "method", "level": 1, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q010", "koma": "chu2-denryu-06", "t": "num", "q": "図の並列回路で、電圧計V\u003csub>1\u003c/sub>は3.0Vを示した。電圧計V\u003csub>2\u003c/sub>は何Vを示すか。", "ans": 3.0, "unit": "V", "tol": 0.05, "ex": "V\u003csub>1\u003c/sub>もV\u003csub>2\u003c/sub>も、並列の枝の両端の電圧を測っている。並列では等しいので3.0V。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 190\" width=\"320\" font-family=\"sans-serif\" font-size=\"14\">\u003cpath d=\"M30 76 V30 H270 V170 H30 V92\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"16\" y1=\"80\" x2=\"44\" y2=\"80\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"23\" y1=\"88\" x2=\"37\" y2=\"88\" stroke=\"#23262b\" stroke-width=\"5\"/>\u003cpath d=\"M130 30 V77 M130 123 V170\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003crect x=\"121\" y=\"77.0\" width=\"18\" height=\"46\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"146\" y=\"105\" fill=\"#23262b\" font-weight=\"bold\">\u003c/text>\u003ctext x=\"114\" y=\"105\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#23262b\">A\u003c/text>\u003cpath d=\"M130 62 H164 V88 M164 112 V138 H130\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ccircle cx=\"164\" cy=\"100\" r=\"13\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"164\" y=\"105\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">V\u003c/text>\u003ccircle cx=\"130\" cy=\"62\" r=\"3\" fill=\"#23262b\"/>\u003ccircle cx=\"130\" cy=\"138\" r=\"3\" fill=\"#23262b\"/>\u003ctext x=\"164\" y=\"128\" text-anchor=\"middle\" fill=\"#23262b\" font-weight=\"bold\">V₁\u003c/text>\u003cpath d=\"M230 30 V77 M230 123 V170\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003crect x=\"221\" y=\"77.0\" width=\"18\" height=\"46\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"246\" y=\"105\" fill=\"#23262b\" font-weight=\"bold\">\u003c/text>\u003ctext x=\"214\" y=\"105\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#23262b\">B\u003c/text>\u003cpath d=\"M230 62 H264 V88 M264 112 V138 H230\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ccircle cx=\"264\" cy=\"100\" r=\"13\" fill=\"#fff\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"264\" y=\"105\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">V\u003c/text>\u003ccircle cx=\"230\" cy=\"62\" r=\"3\" fill=\"#23262b\"/>\u003ccircle cx=\"230\" cy=\"138\" r=\"3\" fill=\"#23262b\"/>\u003ctext x=\"264\" y=\"128\" text-anchor=\"middle\" fill=\"#23262b\" font-weight=\"bold\">V₂\u003c/text>\u003ccircle cx=\"130\" cy=\"30\" r=\"3\" fill=\"#23262b\"/>\u003ccircle cx=\"130\" cy=\"170\" r=\"3\" fill=\"#23262b\"/>\u003c/svg>", "kind": "graph", "level": 2, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q011", "koma": "chu2-denryu-06", "t": "num", "q": "抵抗の大きさがちがう2つの抵抗器を、3.0Vの電源に並列につないだ。抵抗が大きい方の抵抗器にかかる電圧は何Vか。", "ans": 3.0, "unit": "V", "tol": 0.05, "ex": "並列では抵抗の大きさに関係なく、どの抵抗器にも電源と同じ3.0Vがかかる。", "fig": null, "kind": "calc", "level": 3, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q012", "koma": "chu2-denryu-06", "t": "choice", "q": "とちゅうで枝分かれがあり、電流の通り道が2本以上ある回路を何という？", "choices": ["並列回路", "直列回路", "分岐回路"], "ex": "枝分かれのある回路が並列回路。通り道が1本なら直列回路。", "fig": null, "kind": "term", "level": 1, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q013", "koma": "chu2-denryu-06", "t": "order", "q": "並列回路の電圧の関係を調べる実験の手順を、正しい順にならべよう。", "items": ["抵抗器2つを並列につないで回路をつくる", "電圧計を抵抗器Aの両端につなぐ", "スイッチを入れて電圧計の値を読む", "抵抗器Bの両端・電源の両端でも同じように測る", "3つの値を比べる"], "ex": "回路を組み、電圧計を並列につないで測り、場所をかえて測ってから比べる。", "fig": null, "kind": "method", "level": 2, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q014", "koma": "chu2-denryu-06", "t": "choice", "q": "並列回路について正しい組み合わせは？", "choices": ["各抵抗器の電圧は等しく、電流は枝に分かれて流れる", "各抵抗器の電圧の和が電源の電圧で、電流はどこも等しい", "電圧も電流も、枝に分かれて小さくなる", "電圧も電流も、どこでも等しい"], "ex": "並列では、各抵抗器の電圧は等しく（電源と同じ）、電流は枝分かれして分かれる。直列と入れかえて覚えないように。", "fig": null, "kind": "judge", "level": 2, "game": "parallel-defense"}, {"id": "chu2-parallel-defense-q015", "koma": "chu2-denryu-06", "t": "choice", "q": "並列回路で電圧を測った結果が表のようになった。1つだけ測りまちがえたと考えられるのはどれ？", "choices": ["抵抗器Bの値", "抵抗器Aの値", "電源の値"], "ex": "並列では電源・A・Bの電圧はすべて等しいはず。6.0Vにそろわない抵抗器Bの値がおかしい。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 308 62\" width=\"308\" font-family=\"sans-serif\" font-size=\"14\">\u003crect x=\"1\" y=\"1\" width=\"84\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"43.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">測った所\u003c/text>\u003crect x=\"85\" y=\"1\" width=\"74\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"122.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">電源\u003c/text>\u003crect x=\"159\" y=\"1\" width=\"74\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"196.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">抵抗器A\u003c/text>\u003crect x=\"233\" y=\"1\" width=\"74\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"270.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">抵抗器B\u003c/text>\u003crect x=\"1\" y=\"31\" width=\"84\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"43.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">電圧\u003c/text>\u003crect x=\"85\" y=\"31\" width=\"74\" height=\"30\" fill=\"#fff\" stroke=\"#23262b\"/>\u003ctext x=\"122.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">6.0V\u003c/text>\u003crect x=\"159\" y=\"31\" width=\"74\" height=\"30\" fill=\"#fff\" stroke=\"#23262b\"/>\u003ctext x=\"196.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">6.0V\u003c/text>\u003crect x=\"233\" y=\"31\" width=\"74\" height=\"30\" fill=\"#fff\" stroke=\"#23262b\"/>\u003ctext x=\"270.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">1.2V\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "parallel-defense"}, {"id": "chu2-kuroi-kinko-q001", "koma": "chu2-denryu-07", "t": "choice", "q": "箱の中に抵抗器①②が入っていて、つなぎ方が分からない。電源の電圧は6.0V。①の両端の電圧を測ると6.0Vだった。つなぎ方は？", "choices": ["並列", "直列", "これだけでは決められない"], "ex": "①に電源と同じ電圧がかかっているので並列。直列なら電源の電圧を分け合うので、6.0Vより小さくなる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 160\" width=\"320\" font-family=\"sans-serif\" font-size=\"14\">\u003cpath d=\"M30 76 V40 H110 M250 40 H290 V140 H30 V92\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"16\" y1=\"80\" x2=\"44\" y2=\"80\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"23\" y1=\"88\" x2=\"37\" y2=\"88\" stroke=\"#23262b\" stroke-width=\"5\"/>\u003ctext x=\"50\" y=\"89\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#23262b\">6.0V\u003c/text>\u003crect x=\"110\" y=\"20\" width=\"140\" height=\"80\" rx=\"6\" fill=\"#23262b\"/>\u003ctext x=\"180\" y=\"55\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"bold\">抵抗器①②\u003c/text>\u003ctext x=\"180\" y=\"78\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"20\" font-weight=\"bold\">？\u003c/text>\u003c/svg>", "kind": "judge", "level": 1, "game": "kuroi-kinko"}, {"id": "chu2-kuroi-kinko-q002", "koma": "chu2-denryu-07", "t": "choice", "q": "箱の中の抵抗器①②のつなぎ方を調べる。電源の電圧は6.0V。①の両端の電圧を測ると2.5Vだった。つなぎ方は？", "choices": ["直列", "並列", "これだけでは決められない"], "ex": "①の電圧が電源の電圧より小さい＝電源の電圧を分け合っているので直列。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 160\" width=\"320\" font-family=\"sans-serif\" font-size=\"14\">\u003cpath d=\"M30 76 V40 H110 M250 40 H290 V140 H30 V92\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"16\" y1=\"80\" x2=\"44\" y2=\"80\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"23\" y1=\"88\" x2=\"37\" y2=\"88\" stroke=\"#23262b\" stroke-width=\"5\"/>\u003ctext x=\"50\" y=\"89\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#23262b\">6.0V\u003c/text>\u003crect x=\"110\" y=\"20\" width=\"140\" height=\"80\" rx=\"6\" fill=\"#23262b\"/>\u003ctext x=\"180\" y=\"55\" text-anchor=\"middle\" fill=\"#fff\" ex": "電流計は測りたい所に直列につなぐ。直列ではどこも同じ電流なので、電流計にも同じ電流が流れる。", "fig": null, "kind": "method", "level": 1, "game": "kuroi-kinko"}, {"id": "chu2-kuroi-kinko-q011", "koma": "chu2-denryu-07", "t": "choice", "q": "電流計を、まちがえて抵抗器に並列につないでしまった。どうなるおそれがある？", "choices": ["大きな電流が流れて電流計がこわれることがある", "針がまったく動かないだけで安全", "電圧を正しく測れる"], "ex": "電流計は電流を流しやすいので、並列につなぐと大きな電流が流れて、電流計がこわれることがある。", "fig": null, "kind": "method", "level": 2, "game": "kuroi-kinko"}, {"id": "chu2-kuroi-kinko-q012", "koma": "chu2-denryu-07", "t": "order", "q": "箱の中の抵抗器①②が直列か並列かを、電圧計で見分ける手順を正しい順にならべよう。", "items": ["電源の両端に電圧計をつなぎ、電源の電圧を測る", "①の両端に電圧計をつなぎ、①の電圧を測る", "①の電圧と電源の電圧を比べる", "等しければ並列、小さければ直列と判断する"], "ex": "電源の電圧を知り、①の電圧を測って比べる。等しければ並列、小さければ直列。", "fig": null, "kind": "method", "level": 2, "game": "kuroi-kinko"}, {"id": "chu2-kuroi-kinko-q013", "koma": "chu2-denryu-07", "t": "choice", "q": "1Aの1000分の1の電流の大きさを表す単位は？", "choices": ["mA（ミリアンペア）", "kA（キロアンペア）", "mV（ミリボルト）"], "ex": "1A＝1000mA（ミリアンペア）。500mA端子などで使う。", "fig": null, "kind": "term", "level": 1, "game": "kuroi-kinko"}, {"id": "chu2-kuroi-kinko-q014", "koma": "chu2-denryu-07", "t": "choice", "q": "箱の中の抵抗器①②を調べた。①の電流も②の電流も0.20Aで、回路全体の電流は0.40Aだった。つなぎ方は？", "choices": ["並列", "直列", "これだけでは決められない"], "ex": "①②の電流が等しいだけでは決められないが、①の電流が全体より小さく、①＋②＝全体なので並列（同じ抵抗器2つの並列）。", "fig": null, "kind": "judge", "level": 3, "game": "kuroi-kinko"}, {"id": "chu2-kuroi-kinko-q015", "koma": "chu2-denryu-07", "t": "num", "q": "図の直列回路で、点aを流れる電流は0.25Aだった。点cを流れる電流は何Aか。", "ans": 0.25, "unit": "A", "tol": 0.005, "ex": "直列回路では、どこを測っても電流の大きさは等しい。だから0.25A。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 160\" width=\"320\" font-family=\"sans-serif\" font-size=\"14\">\u003cpath d=\"M30 76 V40 H290 V140 H30 V92\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"16\" y1=\"80\" x2=\"44\" y2=\"80\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003cline x1=\"23\" y1=\"88\" x2=\"37\" y2=\"88\" stroke=\"#23262b\" stroke-width=\"5\"/>\u003ctext x=\"50\" y=\"89\" ke=\"#23262b\"/>\u003ctext x=\"119.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">2.0\u003c/text>\u003crect x=\"147\" y=\"1\" width=\"56\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"175.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">4.0\u003c/text>\u003crect x=\"203\" y=\"1\" width=\"56\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"231.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">6.0\u003c/text>\u003crect x=\"259\" y=\"1\" width=\"56\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"287.0\" y=\"21\" text-anchor=\"middle\" fill=\"#23262b\">8.0\u003c/text>\u003crect x=\"1\" y=\"31\" width=\"90\" height=\"30\" fill=\"#e9e3d2\" stroke=\"#23262b\"/>\u003ctext x=\"46.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">電流〔A〕\u003c/text>\u003crect x=\"91\" y=\"31\" width=\"56\" height=\"30\" fill=\"#fff\" stroke=\"#23262b\"/>\u003ctext x=\"119.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">0.10\u003c/text>\u003crect x=\"147\" y=\"31\" width=\"56\" height=\"30\" fill=\"#fff\" stroke=\"#23262b\"/>\u003ctext x=\"175.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">0.20\u003c/text>\u003crect x=\"203\" y=\"31\" width=\"56\" height=\"30\" fill=\"#fff\" stroke=\"#23262b\"/>\u003ctext x=\"231.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">0.30\u003c/text>\u003crect x=\"259\" y=\"31\" width=\"56\" height=\"30\" fill=\"#fff\" stroke=\"#23262b\"/>\u003ctext x=\"287.0\" y=\"51\" text-anchor=\"middle\" fill=\"#23262b\">？\u003c/text>\u003c/svg>", "kind": "graph", "level": 1, "game": "hirei-beat"}, {"id": "chu2-hirei-beat-q003", "koma": "chu2-denryu-08", "t": "num", "q": "ある電熱線に3.0Vを加えると0.60Aの電流が流れた。同じ電熱線に5.0Vを加えると、電流は何Aになるか。", "ans": 1.0, "unit": "A", "tol": 0.005, "ex": "電流は電圧に比例。1.0Vあたり0.20Aなので、5.0Vでは0.20×5＝1.0A。", "fig": null, "kind": "calc", "level": 2, "game": "hirei-beat"}, {"id": "chu2-hirei-beat-q004", "koma": "chu2-denryu-08", "t": "choice", "q": "電熱線を流れる電流と電圧の関係を表すグラフはどれ？", "choices": ["ア", "イ", "ウ"], "ex": "電流は電圧に比例するので、原点を通る直線（ア）になる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 130\" width=\"330\" font-family=\"sans-serif\" font-size=\"14\">\u003cline x1=\"18\" y1=\"100\" x2=\"102\" y2=\"100\" stroke=\"#23262b\" stroke-width=\"1.5\"/>\u003cline x1=\"18\" y1=\"100\" x2=\"18\" y2=\"12\" stroke=\"#23262b\" stroke-width=\"1.5\"/>\u003cline x1=\"18\" y1=\"100\" x2=\"96\" y2=\"20\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"60\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">ア\u003c/text>\u003ctext x=\"102\" y=\"112\" font-size=\"10\" text-anchor=\"end\" fill=\"#23262b\">電圧\u003c/text>\u003ctext x=\"21\" y=\"14\" font-size=\"10\" fill=\"#23262b\">電流\u003c/text>\u003cline x1=\"123\" y1=\"100\" x2=\"207\" y2=\"100\" stroke=\"#23262b\" stroke-width=\"1.5\"/>\u003cline x1=\"123\" y1=\"100\" x2=\"123\" y2=\"12\" stroke=\"#23262b\" stroke-width=\"1.5\"/>\u003cline x1=\"123\" y1=\"70\" x2=\"201\" y2=\"20\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"165\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">イ\u003c/text>\u003ctext x=\"207\" y=\"112\" font-size=\"10\" text-anchor=\"end\" fill=\"#23262b\">電圧\u003c/text>\u003ctext x=\"126\" y=\"14\" font-size=\"10\" fill=\"#23262b\">電流\u003c/text>\u003cline x1=\"228\" y1=\"100\" x2=\"312\" y2=\"100\" stroke=\"#23262b\" stroke-width=\"1.5\"/>\u003cline x1=\"228\" y1=\"100\" x2=\"228\" y2=\"12\" stroke=\"#23262b\" stroke-width=\"1.5\"/>\u003cpath d=\"M228 100 Q248 22 306 18\" fill=\"none\" stroke=\"#23262b\" stroke-width=\"2.5\"/>\u003ctext x=\"270\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#23262b\">ウ\u003c/text>\u003ctext x=\"312\" y=\"112\" font-size=\"10\" text-anchor=\"end\" fill=\"#23262b\">電圧\u003c/text>\u003ctext x=\"231\" y=\"14\" font-size=\"10\" fill=\"#23262b\">電流\u003c/text>\u003c/svg>", "kind": "graph", "level": 1, "game": "hirei-beat"}, {"id": "chu2-hirei-beat-q005", "koma": " 路を組み、電圧を少しずつ変えて電流を測り、表とグラフにしてから関係を調べる。", "fig": null, "kind": "method", "level": 2, "game": "hirei-beat"}, {"id": "chu2-hirei-beat-q011", "koma": "chu2-denryu-08", "t": "choice", "q": "中1で調べた「ばねに加える力の大きさとばねののび」の関係と、電熱線の「電圧と電流」の関係について、正しいのは？", "choices": ["どちらも比例で、グラフは原点を通る直線になる", "どちらも反比例の関係になる", "ばねは比例だが、電熱線は比例しない"], "ex": "どちらも一方を2倍・3倍にすると、もう一方も2倍・3倍になる比例の関係。グラフは原点を通る直線。", "fig": null, "kind": "judge", "level": 2, "game": "hirei-beat"}, {"id": "chu2-hirei-beat-q012", "koma": "chu2-denryu-08", "t": "num", "q": "ある電熱線に6.0Vを加えると0.30Aの電流が流れた。この電熱線に0.45Aの電流を流すには、何Vを加えればよいか。", "ans": 9.0, "unit": "V", "tol": 0.05, "ex": "0.45Aは0.30Aの1.5倍。比例なので電圧も1.5倍にして 6.0×1.5＝9.0V。", "fig": null, "kind": "calc", "level": 3, "game": "hirei-beat"}, {"id": "chu2-hirei-beat-q013", "koma": "chu2-denryu-08", "t": "choice", "q": "電熱線の代わりに豆電球で同じ実験をすると、グラフが原点を通る直線にならなかった。この結果の考え方として正しいのは？", "choices": ["豆電球は温度が変わって流れにくさが変わるので、比例しないことがある", "実験はかならず失敗なので、やり直すしかない", "電熱線でも、同じように比例しない"], "ex": "豆電球は電圧を上げるとフィラメントの温度が上がり、電流が流れにくくなる。そのため比例のグラフにならないことがある。失敗と決めず、原因を考えるのが大切。", "fig": null, "kind": "judge", "level": 3, "game": "hirei-beat"}, {"id": "chu2-hirei-beat-q014", "koma": "chu2-denryu-08", "t": "num", "q": "ある電熱線に1.5Vを加えると、500mA端子につないだ電流計が図のようになった。この電熱線に3.0Vを加えると、電流は何mAになるか。", "ans": 300, "unit": "mA", "tol": 2, "ex": "図の読みは150mA。電圧を2倍にすると電流も2倍なので300mA。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 192\" width=\"300\" font-family=\"sans-serif\" font-size=\"14\">\u003crect x=\"1\" y=\"1\" width=\"298\" height=\"190\" rx=\"12\" fill=\"#fbf8ef\" stroke=\"#23262b\" stroke-width=\"2\"/>\u003cline x1=\"46.1\" y1=\"100.0\" x2=\"61.7\" y2=\"109.0\" stroke=\"#23262b\" stroke-width=\"2.2\"/>\u003cline x1=\"48.7\" y1=\"95.7\" x2=\"54.6\" y2=\"99.5\" stroke=\"#23262b\" stroke-width=\"1.1\"/>\u003cline x1=\"51.5\" y1=\"91.5\" x2=\"57.2\" y2=\"95.5\" stroke=\"#23262b\" stroke-width=\"1.1\"/>\u003cline x1=\"54.4\" y1=\"87.4\" x2=\"60.0\" y2=\"91.7\" stroke=\"#23262b\" stroke-width=\ , "測定値がおさまるように目盛りの数値を書く", "測定値を点で打つ", "点が線の上下に同じくらい散らばるように、原点を通る直線を引く"], "ex": "軸（量と単位）→目盛り→点→線の順。線は点を結ぶのではなく、点の並びを代表する1本。", "kind": "method", "level": 1, "fig": null, "game": "graph-audition"}, {"id": "chu2-graph-audition-q010", "koma": "chu2-denryu-09", "t": "choice", "q": "原点を通る3本の直線のうち、測定値の関係を表す線として最もよいのはどれ？", "choices": ["イ", "ア", "ウ"], "ex": "アは点がすべて線の下に、ウは点がすべて線の上にかたよる。イは点が上下に同じくらい散らばる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 220\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"220\" fill=\"#fff\"/>\u003cline x1=\"44\" y1=\"14\" x2=\"44\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"44\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">0\u003c/text>\u003cline x1=\"87.3\" y1=\"14\" x2=\"87.3\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"87.3\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">1\u003c/text>\u003cline x1=\"130.7\" y1=\"14\" x2=\"130.7\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"130.7\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">2\u003c/text>\u003cline x1=\"174\" y1=\"14\" x2=\"174\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"174\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">3\u003c/text>\u003cline x1=\"217.3\" y1=\"14\" x2=\"217.3\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"217.3\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">4\u003c/text>\u003cline x1=\"260.7\" y1=\"14\" x2=\"260.7\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"260.7\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">5\u003c/text>\u003cline x1=\"304\" y1=\"14\" x2=\"304\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"304\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">6\u003c/text>\u003cline x1=\"44\" y1=\"186\" x2=\"304\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003cline x1=\"44\" y1=\"157.3\" x2=\"304\" y2=\"157.3\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"161.3\" font-size=\"11\" text-anchor=\"end\">0.2\u003c/text>\u003cline x1=\"44\" y1=\"128.7\" x2=\"304\" y2=\"128.7\" stroke=\"#e6c9a6\"/>\u
