 fill=\"#fff\">O\u003c/text>\u003ctext x=\"150.0\" y=\"102\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">→\u003c/text>\u003ccircle cx=\"176.0\" cy=\"102.0\" r=\"10\" fill=\"#EAF6FF\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"176.0\" y=\"106.0\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1c4f86\">H\u003c/text>\u003ccircle cx=\"199.0\" cy=\"102.0\" r=\"10\" fill=\"#EAF6FF\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"199.0\" y=\"106.0\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1c4f86\">H\u003c/text>\u003ccircle cx=\"187.5\" cy=\"90.5\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"187.5\" y=\"94.5\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"223.0\" y=\"102\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">＋\u003c/text>\u003ccircle cx=\"247.0\" cy=\"96\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"247.0\" y=\"100\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q005", "koma": "chu2-kagaku-14", "t": "num", "q": "水素分子2個と酸素分子1個（まとまりは全部で3つ）が反応して、水ができた。反応後の水分子（まとまり）は何個？", "ans": 2, "unit": "個", "tol": 0, "ex": "水素原子4個・酸素原子2個を組み替えると、水分子（H₂O）が2個。まとまりの数は3つから2つに変わる。", "kind": "calc", "fig": null, "level": 1, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q006", "koma": "chu2-kagaku-14", "t": "num", "q": "水分子6個を、全部電気分解した。できる酸素分子は何個？", "ans": 3, "unit": "個", "tol": 0, "ex": "酸素原子は6個。酸素分子は原子2個で1つなので3個（水素分子は6個できる）。", "kind": "calc", "level": 2, "fig": null, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q007", "koma": "chu2-kagaku-14", "t": "num", "q": "マグネシウム原子4個を、酸素分子と余りなく結び付けて酸化マグネシウムにしたい。酸素分子は何個いる？", "ans": 2, "unit": "個", "tol": 0, "ex": "酸化マグネシウムはマグネシウム原子と酸素原子が1：1。酸素原子が4個いるので、酸素分子は2個。", "kind": "calc", "level": 2, "fig": null, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q008", "koma": "chu2-kagaku-14", "t": "choice", "q": "鉄原子3個と硫黄原子2個を、モデルで組み替えて硫化鉄（鉄原子1：硫黄原子1）をつくる。組み替えのあとのようすとして正しいのはどれ？", "choices": ["硫化鉄が2つでき、鉄原子が1個残る", "硫化鉄が3つできる", "硫化鉄が2つでき、硫黄原子が1個残る", "硫化鉄が5つできる"], "ex": "硫黄原子は2個しかないので、硫化鉄は2つまで。原子は出せないので、鉄原子1個はそのまま残る。", "kind": "judge", "level": 2, "fig": null, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q009", "koma": "chu2-kagaku-14", "t": "choice", "q": "酸化銀を試験管で加熱すると、試験管の中の物質の質量が軽くなる。原子のモデルで考えると、その理由として正しいのはどれ？", "choices": ["できた酸素が気体として試験管の外へ出ていったから", "加熱で銀原子の一部が消えたから", "酸素原子が銀原子に変わったから", "加熱で原子が小さくなったから"], "ex": "2Ag₂O→4Ag＋O₂。酸素原子は消えずに、酸素分子になって外へ出ていく。", "kind": "judge", "level": 2, "fig": null, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q010", "koma": "chu2-kagaku-14", "t": "choice", "q": "化学反応式 2H₂O → 2H₂ ＋ O₂ から読み取れることとして正しいのはどれ？", "choices": ["水分子2個から、水素分子2個と酸素分子1個ができる", "水分子2個から、水素原子2個と酸素原子1個ができる", "水2gから、水素2gと酸素1gができる", "水分子1個から、水素分子2個ができる"], "ex": "式の前の大きい数字（係数）は分子の数。H₂ の小さい数字は分子の中の原子の数。", "kind": "judge", "level": 2, "fig": null, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q011", "koma": "chu2-kagaku-14", "t": "order", "q": "水素と酸素から水ができる変化を、原子のモデルで確かめる。すじの通る順に並べよう。", "items": ["反応前の分子をモデルで並べる", "分子を原子にばらす", "原子をつなぎ直して水分子をつくる", "反応前と反応後の原子を種類ごとに数えて比べる"], "ex": "並べる→ばらす→組み替える→数えて比べる。最後に数えて比べることで、何が変わり何が変わらないかが分かる。", "kind": "method", "fig": null, "level": 1, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q012", "koma": "chu2-kagaku-14", "t": "choice", "q": "鉄と硫黄が結び付いて硫化鉄ができるとき、原子について正しく説明しているのはどれ？", "choices": ["鉄原子と硫黄原子の組合せが変わるが、原子はそれぞれ鉄原子・硫黄原子のまま", "鉄原子が硫黄原子に変わる", "鉄原子と硫黄原子がまざって、新しい「硫化鉄原子」になる", "硫黄原子は消えて、鉄原子だけが残る"], "ex": "化学変化で、原子が別の種類の原子に変わることはない。「硫化鉄原子」という原子はない。", "kind": "judge", "fig": null, "level": 1, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q013", "koma": "chu2-kagaku-14", "t": "choice", "q": "ア〜ウのモデルのうち、化学変化として「ありえない」ものはどれ？", "choices": ["イ", "ア", "ウ"], "ex": "イは反応前に銅原子2個なのに、反応後は3個になっている。原子が生まれることはない。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 357.0 116\" width=\"357.0\" height=\"116\" font-family=\"sans-serif\">\u003ctext x=\"6\" y=\"29\" font-size=\"15\" font-weight=\"700\" text-anchor=\"start\" fill=\"#333\">ア\u003c/text>\u003ccircle cx=\"40.0\" cy=\"24\" r=\"10\" fill=\"#3a3d46\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"40.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">C\u003c/text>\u003ctext x=\"64.0\" y=\"30\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">＋\u003c/text>\u003ccircle cx=\"88.0\" cy=\"24\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"88.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"105.0\" cy=\"24\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"105.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"133.0\" y=\"30\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">→\u003c/text>\u003ccircle cx=\"159.0\" cy=\"24\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"159.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"176.0\" cy=\"24\" r=\"10\" fill=\"#3a3d46\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"176.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">C\u003c/text>\u003ccircle cx=\"193.0\" cy=\"24\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"193.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"6\" y=\"65\" font-size=\"15\" font-weight=\"700\" text-anchor=\"start\" 化学反応式 2H₂ ＋ O₂ → 2H₂O から読み取れる、水素分子・酸素分子・水分子の数の比（水素：酸素：水）はどれ？", "choices": ["2：1：2", "2：2：2", "4：2：6", "1：2：1"], "ex": "係数が分子の数を表す。係数1は書かないので、酸素分子は1。", "kind": "judge", "fig": null, "level": 1, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q002", "koma": "chu2-kagaku-16", "t": "num", "q": "2H₂ ＋ O₂ → 2H₂O をもとに考える。水分子を10個つくるには、水素分子は何個いる？", "ans": 10, "unit": "個", "tol": 0, "ex": "水素分子と水分子の数は2：2＝1：1。水分子10個には水素分子10個。", "kind": "calc", "fig": null, "level": 1, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q003", "koma": "chu2-kagaku-16", "t": "num", "q": "2H₂ ＋ O₂ → 2H₂O をもとに考える。酸素分子5個と、余らずに反応する水素分子は何個？", "ans": 10, "unit": "個", "tol": 0, "ex": "水素分子：酸素分子＝2：1。酸素分子5個には水素分子10個。", "kind": "calc", "fig": null, "level": 1, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q004", "koma": "chu2-kagaku-16", "t": "choice", "q": "水素分子6個と酸素分子2個を反応させた（2H₂ ＋ O₂ → 2H₂O）。反応のあとに残っているものとして正しいのはどれ？", "choices": ["水分子4個と、水素分子2個", "水分子6個", "水分子4個と、酸素分子1個", "水分子2個と、水素分子4個"], "ex": "酸素分子2個と反応できる水素分子は4個まで。水分子が4個でき、水素分子2個が余る。", "kind": "calc", "level": 2, "fig": null, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q005", "koma": "chu2-kagaku-16", "t": "choice", "q": "化学反応式 2Cu ＋ O₂ → 2CuO が表していることとして正しいのはどれ？", "choices": ["銅原子2個と酸素分子1個から、酸化銅（CuO）が2つ分できる", "銅原子2個と酸素原子1個から、酸化銅が1つできる", "銅2gと酸素1gから、酸化銅が2gできる", "銅分子と酸素分子が1個ずつ結び付く"], "ex": "係数は原子や分子などの数。2Cu は銅原子2個、O₂ は酸素分子1個（酸素原子2個）。質量ではない。", "kind": "judge", "level": 2, "fig": null, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q006", "koma": "chu2-kagaku-16", "t": "num", "q": "2Ag₂O → 4Ag ＋ O₂ をもとに考える。酸化銀（Ag₂O）6つ分がすべて分解すると、酸素分子は何個できる？", "ans": 3, "unit": "個", "tol": 0, "ex": "酸化銀：酸素分子＝2：1。酸化銀6つ分からは酸素分子3個（銀原子は12個）。", "kind": "calc", "level": 2, "fig": null, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q007", "koma": "chu2-kagaku-16", "t": "choice", "q": "炭素が燃えて二酸化炭素ができる変化（C ＋ O₂ → CO₂）を、正しくモデルで表しているのはどれ？", "choices": ["ア", "イ", "ウ"], "ex": "二酸化炭素分子は、炭素原子1個の両側に酸素原子が1個ずつ一直線に並ぶ。酸素は分子（O₂）で反応する。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 262.0 116\" width=\"262.0\" height=\"116\" font-family=\"sans-serif\">\u003ctext x=\"6\" y=\"29\" font-size=\"15\" font-weight=\"700\" text-anchor=\"start\" fill=\"#333\">ア\u003c/text>\u003ccircle cx=\"40.0\" cy=\"24\" r=\"10\" fill=\"#3a3d46\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"40.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">C\u003c/text>\u003ctext x=\"64.0\" y=\"30\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">＋\u003c/text>\u003ccircle cx=\"88.0\" cy=\"24\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"88.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"105.0\" cy=\"24\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"105.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"133.0\" y=\"30\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">→\u003c/text>\u003ccircle cx=\"159.0\" cy=\"24\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"159.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"176.0\" cy=\"24\" r=\"10\" fill=\"#3a3d46\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"176.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">C\u003c/text>\u003ccircle cx=\"193.0\" cy=\"24\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"193.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"6\" y=\"65\" font-size=\"15\" font-weight=\"700\" text-anchor=\"start\" fill=\"#333\">イ\u003c/text>\u003ccircle cx=\"40.0\" cy=\"60\" r=\"10\" fill=\" "131.0\" cy=\"96\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"131.0\" y=\"100\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"159.0\" y=\"102\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">→\u003c/text>\u003ccircle cx=\"185.0\" cy=\"96\" r=\"10\" fill=\"#3a3d46\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"185.0\" y=\"100\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">C\u003c/text>\u003ccircle cx=\"202.0\" cy=\"96\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"202.0\" y=\"100\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"219.0\" cy=\"96\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"219.0\" y=\"100\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"236.0\" cy=\"96\" r=\"10\" fill=\"#3a3d46\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"236.0\" y=\"100\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">C\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q008", "koma": "chu2-kagaku-16", "t": "choice", "q": "「2H₂O」の「2」は何を表している？", "choices": ["水分子が2個あること", "水素原子が2個あること", "酸素原子が2個あること", "水が2gあること"], "ex": "化学式の前の大きい数字（係数）は分子の数。H₂O の中の小さい 2 は、分子1個の中の水素原子の数。", "kind": "term", "fig": null, "level": 1, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q009", "koma": "chu2-kagaku-16", "t": "choice", "q": "「2H₂」が表しているものとして正しいのはどれ？", "choices": ["水素分子2個（水素原子は全部で4個）", "水素原子2個", "水素分子1個（水素原子2個）", "水素原子4個が結び付いた分子1個"], "ex": "H₂ が水素分子1個（原子2個）。前の2は、その分子が2個という意味。", "kind": "judge", "fig": null, "level": 1, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q010", "koma": "chu2-kagaku-16", "t": "order", "q": "水素と酸素から水ができる変化の化学反応式をつくる。手順を正しい順に並べよう。", "items": ["物質名で「水素＋酸素→水」と書く", "それぞれを化学式にする（H₂＋O₂→H₂O）", "矢印の左右で、原子の種類ごとに数をくらべる", "足りない側の分子をふやし、係数をつける（2H₂＋O₂→2H₂O）"], "ex": "化学式の小さい数字は変えずに、分子の数（係数）でそろえる。", "kind": "method", "fig": null, "level": 1, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q011", "koma": "chu2-kagaku-16", "t": "choice", "q": "図は、マグネシウムが燃える変化をモデルで表したもの。この変化を表す化学反応式はどれ？", "choices": ["2Mg ＋ O₂ → 2MgO", "Mg ＋ O₂ → MgO", "Mg ＋ O → MgO", "2Mg ＋ O₂ → Mg₂O₂"], "ex": "マグネシウム原子2個と酸素分子1個から、酸化マグネシウム（MgO）が2つ分できる。化学式 MgO は変えずに係数でそろえる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 262.09999999999997 56\" width=\"262.09999999999997\" height=\"56\" font-family=\"sans-serif\">\u003ccircle cx=\"19.0\" cy=\"26\" r=\"11\" fill=\"#B9C6D4\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"19.0\" y=\"30\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a36\">Mg\u003c/text>\u003ccircle cx=\"47.0\" cy=\"26\" r=\"11\" fill=\"#B9C6D4\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"47.0\" y=\"30\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a36\">Mg\u003c/text>\u003ctext x=\"72.0\" y=\"32\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">＋\u003c/text>\u003ccircle cx=\"97.0\" cy=\"26\" r=\"11\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"97.0\" y=\"30\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"115.7\" cy=\"26\" r=\"11\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"115.7\" y=\"30\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"144.7\" y=\"32\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">→\u003c/text>\u003ccircle cx=\"171.7\" cy=\"26\" r=\"11\" fill=\"#B9C6D4\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"171.7\" y=\"30\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a36\">Mg\u003c/text>\u003ccircle cx=\"190.39999999999998\" cy=\"26\" r=\"11\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"190.39999999999998\" y=\"30\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"218.39999999999998\" cy=\"26\" r=\"11\" fill=\"#B9C6D4\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"218.39999999999998\" y=\"30\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1f2a36\">Mg\u003c/text>\u003ccircle cx=\"237.09999999999997\" cy=\"26\" r=\"11\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"237.09999999999997\" y=\"30\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q012", "koma": "chu2-kagaku-16", "t": "num", "q": "2Mg ＋ O₂ → 2MgO をもとに考える。マグネシウム原子8個と余らずに反応する酸素分子は何個？", "ans": 4, "unit": "個", "tol": 0, "ex": "マグネシウム原子：酸素分子＝2：1。", "kind": "calc", "fig": null, "level": 1, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q013", "koma": "chu2-kagaku-16", "t": "num", "q": "水の電気分解 2H₂O → 2H₂ ＋ O₂ で、水素分子が6個できた。同時にできた酸素分子は何個？", "ans": 3, "unit": "個", "tol": 0, "ex": "水素分子：酸素分子＝2：1。だから集まる気体の体積も、水素は酸素の約2倍になる。", "kind": "calc", "level": 2, "fig": null, "game": "hannoshiki-sort"}, {"id": "chu2-hannoshiki-sort-q014", "koma": "chu2-kagaku-16", "t": "choice", "q": "化学反応式 H₂ ＋ O₂ → H₂O は、正しい式ではない。その理由はどれ？", "choices": ["矢印の左右で、酸素原子の数がそろっていないから", "水素が分子で書かれているから", "水の化学式がまちがっているから", "矢印の向きが反対だから"], "ex": "左は酸素原子2個、右は1個。係数をつけて 2H₂ ＋ O₂ → 2H₂O にする。", "kind": "judge", "fig": null, "level": 1, "game": "hannoshiki-sort"}, {"id": "chu2-moetara-debate-q001", "koma": "chu2-kagaku-17", "t": "choice", "q": "ろうそくや木などの物が燃えるとき、空気中から使われる気体はどれ？", "choices": ["酸素", "窒素", "二酸化炭素", "水素"], "ex": "物が燃えるときは空気中の酸素が使われる（小6）。ふたをした集気びんの中では、酸素が減って火が消える。", "kind": "term", "fig": null, "level": 1, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q002", "koma": "chu2-kagaku-17", "t": "choice", "q": "集気びんの中でろうそくを燃やしたあと、石灰水を入れてふると白くにごった。このことから分かることはどれ？", "choices": ["ろうそくが燃えて、二酸化炭素ができた", "ろうそくが燃えて、酸素がふえた", "ろうそくが燃えて、窒素ができた", "ろうそくが燃えると、水だけができる"], "ex": "石灰水を白くにごらせるのは二酸化炭素。燃えて二酸化炭素ができた証拠になる。", "kind": "judge", "fig": null, "level": 1, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q003", "koma": "chu2-kagaku-17", "t": "choice", "q": "紙を燃やすと、残った灰は燃やす前の紙よりずっと軽くなる。その理由として、理科として筋が通っているのはどれ？", "choices": ["燃えてできた二酸化炭素や水蒸気が、空気中へ出ていったから", "熱くなった物は軽くなるから", "燃えると物は消えてなくなるから", "火の重さが抜けたから"], "ex": "紙の成分は燃えて気体（二酸化炭素・水蒸気）になり、空気中へ出ていく。原子が消えたわけではない。", "kind": "judge", "level": 2, "fig": null, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q004", "koma": "chu2-kagaku-17", "t": "choice", "q": "しぼんだボールの質量をはかったあと、空気を入れてふくらませてから、もう一度はかった。結果として正しいものはどれ？", "choices": ["空気を入れた後のほうが重い", "空気を入れた後のほうが軽い", "変わらない", "はかるたびにちがい、決まらない"], "ex": "気体にも質量がある。空気を入れた分だけ重くなる（中1）。", "kind": "judge", "fig": null, "level": 1, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q005", "koma": "chu2-kagaku-17", "t": "choice", "q": "次の予想の（　）に入る、根拠とつながった言葉はどれ？「金属が燃えるときに空気中の酸素と結び付くとしたら、燃えた後の物質の質量は、燃やす前より（　）はずだ。」", "choices": ["結び付いた酸素の分だけ大きくなる", "熱で小さくなる", "酸素が消えるので小さくなる", "原子が消えるので小さくなる"], "ex": "「もし酸素と結び付くなら」という仮定から考えると、酸素にも質量があるので、その分が加わるはず。これを実験で確かめる。", "kind": "judge", "level": 2, "fig": null, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q006", "koma": "chu2-kagaku-17", "t": "choice", "q": "「スチールウールも燃やすと軽くなる」と予想した人がいる。この予想の根拠として、理科として筋が通っているものはどれ？", "choices": ["紙やろうそくは、燃えてできた気体が出ていって軽くなったから、同じことが起こるかもしれない", "熱い物は冷たい物より軽いから", "燃えると物は消えてなくなるから", "気体には質量がないから"], "ex": "ほかの物が燃えたときの事実を根拠にした予想。ほかの選択肢は理科として正しくない考え。予想が当たるかどうかは実験で決まる。", "kind": "judge", "level": 2, "fig": null, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q007", "koma": "chu2-kagaku-17", "t": "order", "q": "スチールウールを燃やすと質量がどう変わるかを確かめる実験。正しい手順に並べよう。", "items": ["燃やす前のスチールウールの質量をはかる", "スチールウールを加熱して燃やす", "冷めてから、燃やした後の物質の質量をはかる", "燃やす前と後の質量をくらべる"], "ex": "前と後を、同じはかり方でくらべる。熱いまま上皿にのせると正しくはかれないので、冷めてからはかる。", "kind": "method", "fig": null, "level": 1, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q008", "koma": "chu2-kagaku-17", "t": "choice", "q": "「熱い物は、冷たい物より軽い」という考えについて、正しいものはどれ？", "choices": ["正しくない。温度が変わっても物の質量は変わらない", "正しい。温度が高いほど質量は小さい", "正しい。熱には重さがあるから", "金属のときだけ正しい"], "ex": "氷がとけて水になっても、あたためても冷やしても、質量は変わらない（中1）。", "kind": "judge", "fig": null, "level": 1, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q009", "koma": "chu2-kagaku-17", "t": "choice", "q": "スチールウールとは何か。正しいものはどれ？", "choices": ["鉄を細い繊維のようにしたもの", "銅を細い繊維のようにしたもの", "羊の毛でできた布", "アルミニウムのはく"], "ex": "スチールウールは細い鉄の繊維。表面積が大きいので、火をつけると赤く光って燃える。", "kind": "term", "fig": null, "level": 1, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q010", "koma": "chu2-kagaku-17", "t": "choice", "q": "火をつけたスチールウールを、酸素を入れた集気びんに入れると、空気中よりも激しく燃えた。このことから考えられることはどれ？", "choices": ["スチールウールが燃えることに、酸素が関係している", "スチールウールが燃えるのに、酸素は関係ない", "酸素の中では、鉄が別の原子に変わる", "酸素の中では、火の重さがふえる"], "ex": "酸素が多いほど激しく燃える。鉄も、燃えるときに酸素が関係していると考えられる。", "kind": "judge", "fig": null, "level": 1, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q011", "koma": "chu2-kagaku-17", "t": "choice", "q": "燃やす前と後の質量をくらべる実験で、気をつけることとして正しいものはどれ？", "choices": ["燃やす前と後で、同じ皿にのせて、同じてんびんではかる", "燃やす前は皿ごと、後は中身だけをはかる", "燃やした直後の熱いうちにすぐはかる", "燃えかすの一部がこぼれても気にしない"], "ex": "前と後で条件をそろえないと、ちがいが燃えたことによるものか分からない。", "kind": "method", "level": 2, "fig": null, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q012", "koma": "chu2-kagaku-17", "t": "choice", "q": "物質が、熱や光を出しながら激しく酸素と結び付く変化を何という？", "choices": ["燃焼", "分解", "状態変化", "蒸発"], "ex": "激しく熱や光を出して酸素と結び付く変化を燃焼という。", "kind": "term", "fig": null, "level": 1, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q013", "koma": "chu2-kagaku-17", "t": "choice", "q": "火をつけたろうそくをてんびんにのせたまま燃やし続けた。ろうそくの質量の変化を表すグラフはア〜ウのどれ？", "choices": ["ア", "イ", "ウ"], "ex": "ろうが燃えてできた二酸化炭素や水蒸気は空気中へ出ていくので、てんびんの上のろうそくの質量は減っていく。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 240 132\" width=\"240\" height=\"132\" font-family=\"sans-serif\">\u003cline x1=\"40\" y1=\"110\" x2=\"220\" y2=\"110\" stroke=\"#333\"/>\u003cline x1=\"40\" y1=\"110\" x2=\"40\" y2=\"20\" stroke=\"#333\"/>\u003cpolyline points=\"40,40 220,95\" fill=\"none\" stroke=\"#d7262f\" stroke-width=\"2.5\"/>\u003ctext x=\"222\" y=\"98\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" fill=\"#333\">ア\u003c/text>\u003cpolyline points=\"40,40 220,40\" fill=\"none\" stroke=\"#2549C9\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\"/>\u003ctext x=\"222\" y=\"44\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" fill=\"#333\">イ\u003c/text>\u003cpolyline points=\"40,40 220,22\" fill=\"none\" stroke=\"#2f8a57\" stroke-width=\"2.5\" stroke-dasharray=\"2 3\"/>\u003ctext x=\"222\" y=\"24\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" fill=\"#333\">ウ\u003c/text>\u003ctext x=\"130\" y=\"126\" font-size=\"11\" font-weight=\"700\" text-anchor=\"start\" fill=\"#333\">燃やした時間\u003c/text>\u003ctext x=\"16\" y=\"70\" font-size=\"11\" font-weight=\"700\" fill=\"#333\" text-anchor=\"middle\" transform=\"rotate(-90 16 70)\">ろうそくの質量\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "moetara-debate"}, {"id": "chu2-moetara-debate-q014", "koma": "chu2-kagaku-17", "t": "choice", "q": "予想の書き方として、いちばん理科らしいものはどれ？", "choices": ["燃えるときに空気中の酸素が使われるから、鉄も酸素と結び付くなら重くなると思う", "なんとなく重くなると思う", "友だちが軽くなると言っていたので、軽くなると思う", "重くなってほしいので、重くなると思う"], "ex": "予想は、すでに分かっている事実（根拠）とつなげて書く。当たるかどうかは実験で確かめる。", "kind": "judge", "fig": null, "level": 1, "game": "moetara-debate"}, {"id": "chu2-bio-cell-nurie-q001", "koma": "chu2-seibutsu-01", "t": "choice", "q": "初めて見る生物の体の一部を顕微鏡で拡大した（図）。「この部分は細胞でできている」と言える根拠として、最も適切なものはどれ？", "choices": ["線で区切られた小さな部屋がたくさん集まり、どの部屋にも丸いものが1つある", "全体がうすい緑色をしている", "形がどこも同じではない", "図の中に黒くて太い丸がある"], "ex": "細胞は区切られた小さな部屋のような単位。区切りで囲まれた部屋が集まっていれば、細胞でできていると言える。", "fig": "\u003csvg viewBox=\"0 0 300 170\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"170\" fill=\"#f6f3ea\"/>\u003cg fill=\"#eef4e3\" stroke=\"#3a342c\" stroke-width=\"2.2\" stroke-linejoin=\"round\">\u003cpath d=\"M20 20 L90 14 L96 62 L24 70Z\"/>\u003cpath d=\"M90 14 L170 20 L166 66 L96 62Z\"/>\u003cpath d=\"M170 20 L250 12 L258 60 L166 66Z\"/>\u003cpath d=\"M24 70 L96 62 L104 112 L28 118Z\"/>\u003cpath d=\"M96 62 L166 66 L176 116 L104 112Z\"/>\u003cpath d=\"M166 66 L258 60 L262 108 L176 116Z\"/>\u003cpath d=\"M28 118 L104 112 L100 158 L22 160Z\"/>\u003cpath d=\"M104 112 L176 116 L180 160 L100 158Z\"/>\u003cpath d=\"M176 116 L262 108 L270 156 L180 160Z\"/>\u003c/g>\u003cg fill=\"#b3306c\">\u003cellipse cx=\"58\" cy=\"40\" rx=\"6\" ry=\"5\"/>\u003cellipse cx=\"135\" cy=\"44\" rx=\"6\" ry=\"5\"/>\u003cellipse cx=\"214\" cy=\"36\" rx=\"6\" ry=\"5\"/>\u003cellipse cx=\"66\" cy=\"92\" rx=\"6\" ry=\"5\"/>\u003cellipse cx=\"140\" cy=\"88\" rx=\"6\" ry=\"5\"/>\u003cellipse cx=\"220\" cy=\"86\" rx=\"6\" ry=\"5\"/>\u003cellipse cx=\"60\" cy=\"138\" rx=\"6\" ry=\"5\"/>\u003cellipse cx=\"142\" cy=\"138\" rx=\"6\" ry=\"5\"/>\u003cellipse cx=\"224\" cy=\"134\" rx=\"6\" ry=\"5\"/>\u003c/g>\u003c/svg>", "kind": "judge", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q002", "koma": "chu2-seibutsu-01", "t": "choice", "q": "ほおの内側の細胞を観察した図。A〜Dのうち、細胞ではなく気泡（空気のあわ）なのはどれ？", "choices": ["C", "A", "B", "D"], "ex": "気泡はふちが黒く太く見え、中に核がない。細胞は区切りの中に核が1つある。", "fig": "\u003csvg viewBox=\"0 0 300 160\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"160\" fill=\"#f3efe8\"/>\u003cg fill=\"#f7ecef\" stroke=\"#3a342c\" stroke-width=\"1.8\">\u003cpath d=\"M20 60 C30 25 80 22 95 45 C110 70 88 100 55 98 C28 96 14 82 20 60Z\"/>\u003cpath d=\"M120 110 C125 80 170 72 185 95 C198 118 170 146 140 140 C122 136 117 125 120 110Z\"/>\u003cpath d=\"M215 40 C235 18 285 30 282 62 C279 92 240 98 222 82 C208 70 205 52 215 40Z\"/>\u003c/g>\u003cg fill=\"#b3306c\">\u003ccircle cx=\"58\" cy=\"62\" r=\"6\"/>\u003ccircle cx=\"152\" cy=\"108\" r=\"6\"/>\u003ccircle cx=\"248\" cy=\"60\" r=\"6\"/>\u003c/g>\u003ccircle cx=\"150\" cy=\"42\" r=\"20\" fill=\"#fff\" fill-opacity=\".6\" stroke=\"#221e1a\" stroke-width=\"7\"/>\u003cg font-size=\"16\" font-weight=\"bold\" fill=\"#222\">\u003ctext x=\"8\" y=\"30\">A\u003c/text>\u003ctext x=\"108\" y=\"150\">B\u003c/text>\u003ctext x=\"178\" y=\"22\">C\u003c/text>\u003ctext x=\"282\" y=\"108\">D\u003c/text>\u003c/g>\u003c/svg>", "kind": "judge", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q003", "koma": "chu2-seibutsu-01", "t": "choice", "q": "次のうち、顕微鏡で拡大しても細胞が見られないものはどれ？", "choices": ["水晶（石）のかけら", "タマネギのりん片の表皮", "ヒトのほおの内側", "池の水の中のミカヅキモ"], "ex": "生物の体はどこを拡大しても細胞でできている。石は生物ではないので細胞はない。", "fig": null, "kind": "judge", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q004", "koma": "chu2-seibutsu-01", "t": "choice", "q": "生物の体をつくっている、区切られた小さな部屋のような単位を何という？", "choices": ["細胞", "組織", "器官", "気泡"], "ex": "生物の体をつくる単位を細胞という。", "fig": null, "kind": "term", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q005", "koma": "chu2-seibutsu-01", "t": "choice", "q": "タマネギの表皮を観察するとき、染色液（酢酸オルセインなど）を1滴落とすのはなぜ？", "choices": ["核などが染まって、つくりが見やすくなるから", "細胞が大きくなって見やすくなるから", "細胞どうしがはなれて数えやすくなるから", "気泡が入らなくなるから"], "ex": "タマネギの表皮はほぼ透明。染色液で核が赤く染まり、区切りや核が見やすくなる。", "fig": null, "kind": "method", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q006", "koma": "chu2-seibutsu-01", "t": "choice", "q": "3種類の小さな生物を、ちがう倍率で観察し、どれも同じくらいの大きさにスケッチした（図）。実物がいちばん大きいのはどれ？", "choices": ["A（40倍で観察）", "B（100倍で観察）", "C（400倍で観察）", "3つとも同じ大きさ"], "ex": "同じ大きさに見えたなら、低い倍率で見たものほど実物は大きい。", "fig": "\u003csvg viewBox=\"0 0 300 130\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"130\" fill=\"#fff\"/>\u003cg fill=\"none\" stroke=\"#555\" stroke-width=\"2\">\u003ccircle cx=\"50\" cy=\"55\" r=\"42\"/>\u003ccircle cx=\"150\" cy=\"55\" r=\"42\"/>\u003ccircle cx=\"250\" cy=\"55\" r=\"42\"/>\u003c/g>\u003cg stroke=\"#3a342c\" stroke-width=\"2\">\u003cellipse cx=\"50\" cy=\"55\" rx=\"22\" ry=\"15\" fill=\"#dcebd0\"/>\u003cpath d=\"M128 60 Q150 25 172 60 Q150 44 128 60Z\" fill=\"#cfe6b8\"/>\u003cpath d=\"M230 50 C240 35 265 38 270 55 C272 72 245 76 232 66 C226 61 226 55 230 50Z\" fill=\"#efe3d0\"/>\u003c/g>\u003cg font-size=\"14\" font-weight=\"bold\" fill=\"#222\" text-anchor=\"middle\">\u003ctext x=\"50\" y=\"118\">A（40倍）\u003c/text>\u003ctext x=\"150\" y=\"118\">B（100倍）\u003c/text>\u003ctext x=\"250\" y=\"118\">C（400倍）\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q007", "koma": "chu2-seibutsu-01", "t": "choice", "q": "池の水にいるミカヅキモやゾウリムシの体について、正しいものはどれ？", "choices": ["体が1つの細胞だけでできている", "とても小さいので細胞ではできていない", "何百もの細胞が集まってできている", "核がない細胞だけでできている"], "ex": "ミカヅキモやゾウリムシのように、体が1つの細胞だけでできている生物を単細胞生物という。", "fig": null, "kind": "judge", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q008", "koma": "chu2-seibutsu-01", "t": "choice", "q": "細胞の形について、正しいものはどれ？", "choices": ["生物や体の部分によって、細胞の形はさまざまである", "どの細胞も同じ丸い形をしている", "植物の細胞はどれも同じ大きさ・形である", "四角い形でないものは細胞とはよばない"], "ex": "四角い細胞・細長い細胞・長い枝をのばす細胞など、形はさまざまだが、どれも区切られた部屋になっている。", "fig": null, "kind": "judge", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q009", "koma": "chu2-seibutsu-01", "t": "num", "q": "接眼レンズが10倍、対物レンズが40倍のとき、顕微鏡の倍率は何倍？", "ans": 400, "unit": "倍", "tol": 0, "ex": "顕微鏡の倍率＝接眼レンズの倍率×対物レンズの倍率＝10×40＝400倍。ゲームの ×400 も「10×40」だった。", "fig": null, "kind": "calc", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q010", "koma": "chu2-seibutsu-01", "t": "choice", "q": "染色液でよく染まり、植物の細胞にも動物の細胞にも1つずつ見られる丸いつくりを何という？", "choices": ["核", "気泡", "葉緑体", "細胞壁"], "ex": "染色液（酢酸オルセインや酢酸カーミン）で赤く染まる丸いものが核。", "fig": null, "kind": "term", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q011", "koma": "chu2-seibutsu-01", "t": "order", "q": "ほおの内側の細胞を観察する手順。正しい順に並べよう。", "items": ["綿棒でほおの内側を軽くこすりとる", "スライドガラスにこすりつける", "染色液を1滴落として数分待つ", "カバーガラスを片方からそっと下ろす", "低い倍率で見てから倍率を上げる"], "ex": "とる→つける→染める→気泡が入らないようにカバーガラス→低い倍率から観察、の順。", "fig": null, "kind": "method", "level": 2, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q012", "koma": "chu2-seibutsu-01", "t": "choice", "q": "ツユクサの葉の裏の表皮を観察した図。Xのすきま（気孔）について正しいものはどれ？", "choices": ["2つの細胞にはさまれたすきまで、細胞ではない", "1つの大きな細胞である", "細胞の中の核である", "カバーガラスの下に入った気泡である"], "ex": "気孔は2つの細胞が向かい合ってできたすきま。区切られた部屋（細胞）ではない。", "fig": "\u003csvg viewBox=\"0 0 300 170\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"170\" fill=\"#eef2e2\"/>\u003cg fill=\"none\" stroke=\"#3a342c\" stroke-width=\"2.2\" stroke-linejoin=\"round\">\u003cpath d=\"M10 10 C40 20 60 0 95 12 C100 45 88 60 100 85 C70 95 40 78 12 90 C20 60 2 40 10 10Z\"/>\u003cpath d=\"M95 12 C130 2 160 22 200 10 C205 40 195 58 205 80 C180 70 160 95 150 88 C130 92 115 80 100 85 C88 60 100 45 95 12Z\"/>\u003cpath d=\"M200 10 C230 20 260 4 292 14 C284 45 296 60 290 88 C260 80 230 96 205 80 C195 58 205 40 200 10Z\"/>\u003cpath d=\"M12 90 C40 78 70 95 100 85 C104 120 92 140 104 162 C70 155 40 170 8 160 C18 130 4 115 12 90Z\"/>\u003cpath d=\"M205 80 C230 96 260 80 290 88 C296 120 284 140 292 162 C260 155 230 170 196 160 C208 130 194 110 205 80Z\"/>\u003c/g>\u003cellipse cx=\"152\" cy=\"124\" rx=\"44\" ry=\"42\" fill=\"#eef2e2\"/>\u003cg stroke=\"#3a342c\" stroke-width=\"2\" fill=\"#e3eed3\">\u003cpath d=\"M152 94 A22 32 0 0 0 152 158 L152 145 A6 19 0 0 1 152 107Z\"/>\u003cpath d=\"M152 94 A22 32 0 0 1 152 158 L152 145 A6 19 0 0 0 152 107Z\"/>\u003c/g>\u003cellipse cx=\"152\" cy=\"126\" rx=\"5\" ry=\"18\" fill=\"#5d6b52\"/>\u003cg fill=\"#5da144\">\u003ccircle cx=\"140\" cy=\"112\" r=\"3\"/>\u003ccircle cx=\"137\" cy=\"130\" r=\"3\"/>\u003ccircle cx=\"164\" cy=\"116\" r=\"3\"/>\u003ccircle cx=\"167\" cy=\"136\" r=\"3\"/>\u003c/g>\u003cpath d=\"M152 126 L230 128\" stroke=\"#c0392b\" stroke-width=\"2\"/>\u003ctext x=\"236\" y=\"134\" font-size=\"18\" font-weight=\"bold\" fill=\"#c0392b\">X\u003c/text>\u003c/svg>", "kind": "judge", "level": 2, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q013", "koma": "chu2-seibutsu-01", "t": "choice", "q": "ほおの内側の細胞は、1つ1つがばらばらに見えた。それでも「ほおの内側も細胞でできている」と言える理由として、最も適切なものはどれ？", "choices": ["1つ1つが区切られた部屋になっていて、それぞれに核が1つある", "全体が同じ色に染まったから", "気泡がたくさん見えたから", "どれも四角い形をしていたから"], "ex": "ばらばらでも、区切られた部屋に核が1つずつある。形や並び方がちがっても細胞である。", "fig": null, "kind": "judge", "level": 2, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q014", "koma": "chu2-seibutsu-01", "t": "choice", "q": "葉をうすく切った断面の図。ア〜エのうち、細胞（区切られた部屋）ではないものはどれ？", "choices": ["ウ（丸っこい細胞どうしの間のすきま）", "ア（表面に並んだ細胞）", "イ（細長い細胞）", "エ（丸っこい細胞）"], "ex": "葉の内部には細胞どうしの間にすきまがあり、そこは細胞ではない。", "fig": "\u003csvg viewBox=\"0 0 300 170\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"170\" fill=\"#f1f4ea\"/>\u003cg fill=\"#fff\" stroke=\"#3a342c\" stroke-width=\"2\">\u003crect x=\"10\" y=\"8\" width=\"56\" height=\"20\"/>\u003crect x=\"66\" y=\"8\" width=\"60\" height=\"20\"/>\u003crect x=\"126\" y=\"8\" width=\"54\" height=\"20\"/>\u003crect x=\"180\" y=\"8\" width=\"58\" height=\"20\"/>\u003crect x=\"238\" y=\"8\" width=\"52\" height=\"20\"/>\u003c/g>\u003cg fill=\"#e3eed3\" stroke=\"#3a342c\" stroke-width=\"2\">\u003crect x=\"12\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003crect x=\"40\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003crect x=\"68\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003crect x=\"96\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003crect x=\"124\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003crect x=\"152\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003crect x=\"180\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003crect x=\"208\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003crect x=\"236\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003crect x=\"264\" y=\"30\" width=\"24\" height=\"56\" rx=\"9\"/>\u003cellipse cx=\"36\" cy=\"108\" rx=\"20\" ry=\"15\"/>\u003cellipse cx=\"100\" cy=\"104\" rx=\"22\" ry=\"14\"/>\u003cellipse cx=\"170\" cy=\"110\" rx=\"20\" ry=\"16\"/>\u003cellipse cx=\"240\" cy=\"104\" rx=\"22\" ry=\"15\"/>\u003cellipse cx=\"66\" cy=\"140\" rx=\"20\" ry=\"14\"/>\u003cellipse cx=\"136\" cy=\"142\" rx=\"22\" ry=\"14\"/>\u003cellipse cx=\"206\" cy=\"140\" rx=\"20\" ry=\"15\"/>\u003cellipse cx=\"270\" cy=\"142\" rx=\"18\" ry=\"14\"/>\u003c/g>\u003cg font-size=\"15\" font-weight=\"bold\" fill=\"#c0392b\">\u003ctext x=\"294\" y=\"24\" text-anchor=\"end\">ア\u003c/text>\u003ctext x=\"285\" y=\"66\" text-anchor=\"end\">イ\u003c/text>\u003ctext x=\"129\" y=\"100\">ウ\u003c/text>\u003ctext x=\"232\" y=\"108\">エ\u003c/text>\u003c/g>\u003ccircle cx=\"136\" cy=\"113\" r=\"8\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"1.5\" stroke-dasharray=\"3 2\"/>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-cell-nurie"}, {"id": "chu2-bio-cell-nurie-q015", "koma": "chu2-seibutsu-01", "t": "choice", "q": "顕微鏡の倍率を100倍から400倍に上げた。視野に見える細胞の数と、1つ1つの細胞の見え方はどうなる？", "choices": ["見える数は少なくなり、1つ1つは大きく見える", "見える数は多くなり、1つ1つは大きく見える", "見える数は少なくなり、1つ1つは小さく見える", "どちらも変わらない"], "ex": "倍率を上げると大きく見えるが、見える範囲はせまくなるので数は減る。", "fig": null, "kind": "judge", "level": 1, "game": "bio-cell-nurie"}, {"id": "chu2-bio-scope-sagashie-q001", "koma": "chu2-seibutsu-02", "t": "choice", "q": "顕微鏡の倍率を100倍から400倍に上げた。見えるものの大きさと、見える範囲はどうなる？", "choices": ["大きく見えるが、見える範囲はせまくなる", "大きく見え、見える範囲も広くなる", "小さく見えるが、見える範囲は広くなる", "大きさも範囲も変わらない"], "ex": "倍率を上げると大きく見えるが、見える範囲（視野）はせまくなる。", "kind": "judge", "fig": null, "level": 1, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q002", "koma": "chu2-seibutsu-02", "t": "order", "q": "顕微鏡で小さな目当てを見つけるときの手順。正しい順に並べよう。", "items": ["低い倍率の対物レンズにする", "目当てを探して視野の中央に動かす", "レボルバーを回して高い倍率にする", "調節ねじでピントを合わせ直す"], "ex": "低い倍率で広く探し、中央に入れてから倍率を上げ、ピントを合わせ直す。", "kind": "method", "fig": null, "level": 1, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q003", "koma": "chu2-seibutsu-02", "t": "num", "q": "接眼レンズ10倍、対物レンズ40倍のとき、顕微鏡の倍率は何倍？", "ans": 400, "unit": "倍", "tol": 0, "ex": "倍率＝接眼レンズの倍率×対物レンズの倍率＝10×40＝400倍。", "kind": "calc", "fig": null, "level": 2, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q004", "koma": "chu2-seibutsu-02", "t": "num", "q": "ある顕微鏡では、40倍のとき見える範囲の直径が4.5mmだった。同じ顕微鏡で400倍にすると、見える範囲の直径は何mm？", "ans": 0.45, "unit": "mm", "tol": 0.001, "ex": "倍率が10倍になると、見える範囲の直径は10分の1になる。4.5÷10＝0.45mm。", "kind": "calc", "fig": null, "level": 2, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q005", "koma": "chu2-seibutsu-02", "t": "choice", "q": "100倍で、ゾウリムシが図のように視野のはしに見えている。このまま400倍にすると、どうなる？", "choices": ["ゾウリムシが視野から外れて見えなくなる", "ゾウリムシが自然に視野の中央に移る", "ゾウリムシが小さく見える", "見える範囲が広がって見つけやすくなる"], "ex": "倍率を上げると見える範囲は中心のまわりだけにせまくなる。はしにあるものは外れるので、先に中央へ動かす。", "fig": "\u003csvg viewBox=\"0 0 300 150\" xmlns=\"http://www.w3.org/2000/svg\">\u003ccircle cx=\"150\" cy=\"72\" r=\"66\" fill=\"#eef5ef\" stroke=\"#1d1a16\" stroke-width=\"4\"/>\u003cg transform=\"translate(196 60) rotate(-20)\">\u003cpath d=\"M-20 0 C-20 -9 16 -10 20 -2 C22 3 12 8 2 7 Q-2 4 -6 7 C-14 9 -20 6 -20 0Z\" fill=\"#e8d4a3\" stroke=\"#7d6440\" stroke-width=\"1.5\"/>\u003c/g>\u003ccircle cx=\"150\" cy=\"72\" r=\"17\" fill=\"none\" stroke=\"#f0513a\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\u003ctext x=\"150\" y=\"147\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\">×100の視野（点線＝×400で見える範囲）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q006", "koma": "chu2-seibutsu-02", "t": "choice", "q": "低い倍率から高い倍率にかえると、視野の明るさはふつうどうなる？", "choices": ["暗くなる", "明るくなる", "変わらない"], "ex": "高い倍率ほど視野は暗くなる。しぼりや反しゃ鏡で明るさを調節する。", "kind": "judge", "fig": null, "level": 1, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q007", "koma": "chu2-seibutsu-02", "t": "choice", "q": "顕微鏡の視野の右上に、見たいものが見えている（図）。これを視野の中央に動かすには、プレパラートをどの向きに動かす？", "choices": ["右上", "左下", "右下", "左上"], "ex": "顕微鏡の像は上下左右が逆。像を中央へ寄せるには、プレパラートを像のある右上へ動かす。", "fig": "\u003csvg viewBox=\"0 0 300 150\" xmlns=\"http://www.w3.org/2000/svg\">\u003ccircle cx=\"150\" cy=\"75\" r=\"66\" fill=\"#eef5ef\" stroke=\"#1d1a16\" stroke-width=\"4\"/>\u003ccircle cx=\"190\" cy=\"42\" r=\"10\" fill=\"#8fcd6a\" stroke=\"#3f7f2a\" stroke-width=\"2\"/>\u003cpath d=\"M180 50 L158 68\" stroke=\"#f0513a\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/>\u003ccircle cx=\"150\" cy=\"75\" r=\"4\" fill=\"#f0513a\"/>\u003ctext x=\"296\" y=\"34\" text-anchor=\"end\" font-size=\"12\" font-weight=\"bold\">見えている像\u003c/text>\u003ctext x=\"160\" y=\"100\" font-size=\"13\" font-weight=\"bold\">中央\u003c/text>\u003cg font-size=\"12\" fill=\"#555\">\u003ctext x=\"150\" y=\"14\" text-anchor=\"middle\">上\u003c/text>\u003ctext x=\"150\" y=\"148\" text-anchor=\"middle\">下\u003c/text>\u003ctext x=\"76\" y=\"79\" text-anchor=\"middle\">左\u003c/text>\u003ctext x=\"226\" y=\"79\" text-anchor=\"middle\">右\u003c/text>\u003c/g>\u003c/svg>", "kind": "judge", "level": 1, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q008", "koma": "chu2-seibutsu-02", "t": "choice", "q": "泳いでいるゾウリムシを観察する。高い倍率で見るときに起こりやすいことはどれ？", "choices": ["見える範囲がせまいので、すぐに視野の外へ出てしまう", "動きがおそく見えるので、追いかけやすい", "高い倍率にすると動きが止まる", "見える範囲が広いので、見失わない"], "ex": "高い倍率ほど視野がせまいので、動くものはすぐ外へ出る。低い倍率で追いながら中央に入れてから上げる。", "kind": "judge", "fig": null, "level": 1, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q009", "koma": "chu2-seibutsu-02", "t": "choice", "q": "40倍で、ゾウリムシが視野のはしに小さく見えた。形をくわしく見るために、次にすることはどれ？", "choices": ["ゾウリムシを視野の中央に動かしてから、倍率を上げる", "すぐに400倍にする", "しぼりをせまくして暗くする", "接眼レンズを外してのぞく"], "ex": "はしのまま倍率を上げると視野から外れる。中央に入れてから倍率を上げる。", "kind": "method", "fig": null, "level": 1, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q010", "koma": "chu2-seibutsu-02", "t": "choice", "q": "スライドガラスに観察するものをのせ、カバーガラスをかけてつくった、顕微鏡で見るためのものを何という？", "choices": ["プレパラート", "レボルバー", "しぼり", "ルーペ"], "ex": "観察するものをスライドガラスとカバーガラスではさんだものをプレパラートという。", "kind": "term", "fig": null, "level": 1, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q011", "koma": "chu2-seibutsu-02", "t": "choice", "q": "対物レンズを10倍から40倍にかえてピントを合わせた。対物レンズとプレパラートの間の距離はどうなる？", "choices": ["近くなる", "遠くなる", "変わらない"], "ex": "高い倍率の対物レンズほど長く、ピントが合ったときのプレパラートとの距離は近い。", "kind": "judge", "fig": null, "level": 1, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q012", "koma": "chu2-seibutsu-02", "t": "num", "q": "100倍で見たとき、ゾウリムシの像の長さを見取り図にすると20mmだった。同じゾウリムシを400倍で見ると、像の長さは何mmになる？", "ans": 80, "unit": "mm", "tol": 0, "ex": "倍率が4倍になると、見える像の長さも4倍になる。20×4＝80mm。", "kind": "calc", "fig": null, "level": 2, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q013", "koma": "chu2-seibutsu-02", "t": "choice", "q": "ピントを合わせるとき、はじめに横から見ながら対物レンズとプレパラートを近づけ、そのあと接眼レンズをのぞきながら「遠ざけて」合わせる。その理由は？", "choices": ["対物レンズとプレパラートがぶつかるのを防ぐため", "視野を明るくするため", "倍率を上げるため", "上下左右を正しく見るため"], "ex": "のぞきながら近づけるとぶつけてしまうことがある。遠ざけながら合わせれば安全。", "kind": "method", "fig": null, "level": 1, "game": "bio-scope-sagashie"}, {"id": "chu2-bio-scope-sagashie-q014", "koma": "chu2-seibutsu-02", "t": "order", "q": "同じタマネギの表皮を3つの倍率で見た（図）。倍率の低いものから順に並べよう。", "items": ["B", "A", "C"], "ex": "倍率が低いほど、1つ1つの細胞は小さく、見える細胞の数は多い。", "fig": "\u003csvg viewBox=\"0 0 300 130\" xmlns=\"http://www.w3.org/2000/svg\">\u003cclipPath id=\"ga\">\u003ccircle cx=\"50\" cy=\"55\" r=\"42\"/>\u003c/clipPath>\u003cg clip-path=\"url(#ga)\">\u003crect x=\"8\" y=\"13\" width=\"84\" height=\"84\" fill=\"#f7f2e8\"/>\u003cg stroke=\"#5a5040\" stroke-width=\"1.5\" fill=\"none\">\u003cline x1=\"8\" y1=\"13.0\" x2=\"92\" y2=\"13.0\"/>\u003cline x1=\"8.0\" y1=\"13.0\" x2=\"8.0\" y2=\"31.7\"/>\u003cline x1=\"69.2\" y1=\"13.0\" x2=\"69.2\" y2=\"31.7\"/>\u003cline x1=\"8\" y1=\"31.7\" x2=\"92\" y2=\"31.7\"/>\u003cline x1=\"38.6\" y1=\"31.7\" x2=\"38.6\" y2=\"50.4\"/>\u003cline x1=\"8\" y1=\"50.4\" x2=\"92\" y2=\"50.4\"/>\u003cline x1=\"8.0\" y1=\"50.4\" x2=\"8.0\" y2=\"69.1\"/>\u003cline x ", "細胞質", "液胞", "核"], "ex": "細胞膜の外側の厚くじょうぶなつくりが細胞壁。植物の体を支えるのに役立つ。", "kind": "term", "fig": null, "level": 1, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-guesswho-q007", "koma": "chu2-seibutsu-03", "t": "choice", "q": "植物の細胞に見られる緑色の粒で、光合成を行うつくりを何という？", "choices": ["葉緑体", "液胞", "核", "細胞壁"], "ex": "緑色の粒は葉緑体。光合成を行う。", "kind": "term", "fig": null, "level": 1, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-guesswho-q008", "koma": "chu2-seibutsu-03", "t": "choice", "q": "細胞の核を観察しやすくするために使う染色液はどれ？", "choices": ["酢酸オルセイン液", "ヨウ素液", "BTB液", "石灰水"], "ex": "酢酸オルセイン液（酢酸カーミン液）で核が赤く染まる。", "kind": "method", "fig": null, "level": 1, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-guesswho-q009", "koma": "chu2-seibutsu-03", "t": "choice", "q": "表は、動物の細胞と植物の細胞で見られるつくりを○×でまとめたもの。①に入るつくりはどれ？", "choices": ["葉緑体", "細胞膜", "核", "細胞質"], "ex": "動物の細胞になく植物の細胞にある緑の粒＝葉緑体。細胞膜はどちらにもある。", "fig": "\u003csvg viewBox=\"0 0 300 150\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"150\" fill=\"#fff\"/>\u003cg font-size=\"15\" font-weight=\"bold\" text-anchor=\"middle\">\u003crect x=\"20\" y=\"8\" width=\"260\" height=\"136\" fill=\"none\" stroke=\"#333\" stroke-width=\"2\"/>\u003cline x1=\"20\" y1=\"35\" x2=\"280\" y2=\"35\" stroke=\"#333\"/>\u003cline x1=\"120\" y1=\"8\" x2=\"120\" y2=\"144\" stroke=\"#333\"/>\u003cline x1=\"200\" y1=\"8\" x2=\"200\" y2=\"144\" stroke=\"#333\"/>\u003ctext x=\"70\" y=\"27\">つくり\u003c/text>\u003ctext x=\"160\" y=\"27\">動物の細胞\u003c/text>\u003ctext x=\"240\" y=\"27\">植物の細胞\u003c/text>\u003cline x1=\"20\" y1=\"62\" x2=\"280\" y2=\"62\" stroke=\"#bbb\"/>\u003cline x1=\"20\" y1=\"89\" x2=\"280\" y2=\"89\" stroke=\"#bbb\"/>\u003cline x1=\"20\" y1=\"116\" x2=\"280\" y2=\"116\" stroke=\"#bbb\"/>\u003ctext x=\"70\" y=\"55\">核\u003c/text>\u003ctext x=\"160\" y=\"55\">○\u003c/text>\u003ctext x=\"240\" y=\"55\">○\u003c/text>\u003ctext x=\"70\" y=\"82\">①\u003c/text>\u003ctext x=\"160\" y=\"82\">×\u003c/text>\u003ctext x=\"240\" y=\"82\">○\u003c/text>\u003ctext x=\"70\" y=\"109\">細胞膜\u003c/text>\u003ctext x=\"160\" y=\"109\">○\u003c/text>\u003ctext x=\"240\" y=\"109\">○\u003c/text>\u003ctext x=\"70\" y=\"136\">細胞壁\u003c/text>\u003ctext x=\"160\" y=\"136\">×\u003c/text>\u003ctext x=\"240\" y=\"136\">○\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-guesswho-q010", "koma": "chu2-seibutsu-03", "t": "choice", "q": "ある動物の皮ふの細胞は、角ばってすきまなく並んで見えた。この細胞について正しいものはどれ？", "choices": ["細胞壁がないので、動物の細胞である", "すきまなく並ぶので、植物の細胞である", "角ばっているので、植物の細胞である", "核があるので、植物の細胞である"], "ex": "形や並び方は決め手にならない。細胞壁がなければ動物の細胞。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-guesswho-q011", "koma": "chu2-seibutsu-03", "t": "choice", "q": "植物の細胞と動物の細胞を同じ染色液で染めた。赤く染まる丸いつくりが見られるのはどれ？", "choices": ["どちらの細胞にも見られる", "植物の細胞だけ", "動物の細胞だけ", "どちらにも見られない"], "ex": "核はどちらの細胞にもあり、染色液でよく染まる。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-guesswho-q012", "koma": "chu2-seibutsu-03", "t": "choice", "q": "オオカナダモの葉の細胞とタマネギの表皮の細胞に共通して見られ、ヒトのほおの内側の細胞には見られないものはどれ？", "choices": ["細胞壁", "葉緑体", "核", "細胞膜"], "ex": "細胞壁は植物の細胞だけ。葉緑体はタマネギの表皮にはない。核・細胞膜はほおの細胞にもある。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-guesswho-q013", "koma": "chu2-seibutsu-03", "t": "choice", "q": "細胞壁のはたらきとして正しいものはどれ？", "choices": ["植物の体を支え、形を保つのに役立つ", "光合成を行う", "染色液で赤く染まる", "細胞の活動でできた物質や水をためる"], "ex": "細胞壁は植物の体を支える。光合成は葉緑体、物質や水をためるのは液胞。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-guesswho-q014", "koma": "chu2-seibutsu-03", "t": "choice", "q": "細胞のつくりのうち、核と細胞壁以外の部分（細胞膜・葉緑体・液胞などをふくむ）をまとめて何という？", "choices": ["細胞質", "細胞膜", "組織", "液胞"], "ex": "核と細胞壁以外の部分をまとめて細胞質という。", "kind": "term", "fig": null, "level": 1, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-guesswho-q015", "koma": "chu2-seibutsu-03", "t": "choice", "q": "図のオオカナダモの葉の細胞で、動物の細胞にもあるつくりはどれ？", "choices": ["ウ", "ア", "イ", "エ"], "ex": "ウの核はどちらの細胞にもある。ア（細胞壁）・イ（葉緑体）・エ（液胞）は植物の細胞で見られる。", "fig": "\u003csvg viewBox=\"0 0 300 170\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"170\" fill=\"#fff\"/>\u003crect x=\"40\" y=\"20\" width=\"200\" height=\"130\" rx=\"6\" fill=\"#fbf7ea\" stroke=\"#2b1d12\" stroke-width=\"7\"/>\u003crect x=\"48\" y=\"28\" width=\"184\" height=\"114\" rx=\"4\" fill=\"none\" stroke=\"#2b1d12\" stroke-width=\"1.5\"/>\u003crect x=\"80\" y=\"50\" width=\"120\" height=\"70\" rx=\"18\" fill=\"#e3f0f4\" stroke=\"#7aa3b0\" stroke-dasharray=\"4 3\"/>\u003cellipse cx=\"62\" cy=\"44\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"92\" cy=\"38\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"130\" cy=\"36\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"170\" cy=\"38\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"210\" cy=\"42\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"220\" cy=\"78\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"218\" cy=\"112\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"186\" cy=\"132\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"146\" cy=\"134\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"106\" cy=\"132\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"64\" cy=\"118\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003cellipse cx=\"60\" cy=\"80\" rx=\"8\" ry=\"5\" fill=\"#5da144\" stroke=\"#2f6b24\"/>\u003ccircle cx=\"70\" cy=\"100\" r=\"11\" fill=\"#c0305f\"/>\u003cg stroke=\"#c0392b\" stroke-width=\"1.6\">\u003cpath d=\"M240 30 L268 18\"/>\u003cpath d=\"M92 38 L112 8\"/>\u003cpath d=\"M70 100 L20 150\"/>\u003cpath d=\"M180 90 L268 100\"/>\u003c/g>\u003cg font-size=\"17\" font-weight=\"bold\" fill=\"#c0392b\">\u003ctext x=\"272\" y=\"22\">ア\u003c/text>\u003ctext x=\"114\" y=\"14\">イ\u003c/text>\u003ctext x=\"6\" y=\"164\">ウ\u003c/text>\u003ctext x=\"272\" y=\"106\">エ\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-cell-guesswho"}, {"id": "chu2-bio-cell-merge-q001", "koma": "chu2-seibutsu-04", "t": "order", "q": "ヒトの体のなりたちを、小さい単位から順に並べよう。", "items": ["細胞", "組織", "器官", "個体"], "ex": "細胞が集まって組織、組織が組み合わさって器官、器官が集まって個体（1つの体）になる。", "kind": "method", "fig": null, "level": 2, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q002", "koma": "chu2-seibutsu-04", "t": "order", "q": "植物の体のなりたち。小さい単位から順に並べよう。", "items": ["葉の表皮の細胞", "表皮組織", "葉", "ホウセンカの体"], "ex": "表皮の細胞（細胞）→表皮組織（組織）→葉（器官）→ホウセンカ（個体）。", "kind": "judge", "fig": null, "level": 2, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q003", "koma": "chu2-seibutsu-04", "t": "order", "q": "動物の体のなりたち。小さい単位から順に並べよう。", "items": ["筋肉の細胞", "筋組織", "胃", "ヒトの体"], "ex": "筋肉の細胞（細胞）→筋組織（組織）→胃（器官）→ヒト（個体）。", "kind": "judge", "fig": null, "level": 2, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q004", "koma": "chu2-seibutsu-04", "t": "choice", "q": "形やはたらきが同じ細胞が集まったものを何という？", "choices": ["組織", "器官", "個体", "細胞質"], "ex": "同じ形・はたらきの細胞の集まりを組織という。", "kind": "term", "fig": null, "level": 1, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q005", "koma": "chu2-seibutsu-04", "t": "choice", "q": "何種類かの組織が組み合わさって、特定のはたらきをする部分を何という？", "choices": ["器官", "組織", "細胞", "細胞膜"], "ex": "何種類かの組織が組み合わさった、特定のはたらきをする部分が器官。", "kind": "term", "fig": null, "level": 1, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q006", "koma": "chu2-seibutsu-04", "t": "choice", "q": "次のうち、器官にあたるものはどれ？", "choices": ["小腸", "筋組織", "表皮の細胞", "ゾウリムシ"], "ex": "小腸は何種類かの組織からなる器官。筋組織は組織、表皮の細胞は細胞、ゾウリムシは個体。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q007", "koma": "chu2-seibutsu-04", "t": "choice", "q": "次のうち、組織にあたるものはどれ？", "choices": ["上皮組織", "胃", "心臓", "ヒトの体"], "ex": "上皮組織は同じ形・はたらきの細胞の集まり（組織）。胃・心臓は器官、ヒトの体は個体。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q008", "koma": "chu2-seibutsu-04", "t": "choice", "q": "植物の器官の組み合わせとして正しいものはどれ？", "choices": ["根・茎・葉", "表皮組織・葉肉組織", "核・細胞壁・液胞", "細胞・組織・個体"], "ex": "植物では根・茎・葉などが器官。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q009", "koma": "chu2-seibutsu-04", "t": "choice", "q": "表皮組織だけをいくら集めても、葉にはならない。葉ができるために必要なことはどれ？", "choices": ["表皮組織・葉肉組織など、何種類かの組織が組み合わさること", "表皮組織がもっとたくさん集まること", "細胞が1つ1つ大きくなること", "細胞の核がふえること"], "ex": "器官は何種類かの組織の組み合わせ。同じ組織だけでは器官にならない。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q010", "koma": "chu2-seibutsu-04", "t": "choice", "q": "図は胃のかべの一部の模式図。A（表面の細胞の集まり）・B（筋肉の細胞の集まり）・C（神経の集まり）のように、何種類かの組織が組み合わさってできている胃は、次のどれにあたる？", "choices": ["器官", "組織", "細胞", "個体"], "ex": "A・B・Cはそれぞれ組織。何種類かの組織が組み合わさった胃は器官。", "fig": "\u003csvg viewBox=\"0 0 300 160\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"160\" fill=\"#fff\"/>\u003ctext x=\"10\" y=\"18\" font-size=\"12\" font-weight=\"bold\" fill=\"#555\">胃の内側（食べ物がふれる側）\u003c/text>\u003crect x=\"12\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"21\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"32\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"41\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"52\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"61\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"72\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"81\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"92\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" f 54\" font-size=\"12\" font-weight=\"bold\" fill=\"#555\">胃の外側\u003c/text>\u003cg stroke=\"#c0392b\" stroke-width=\"1.6\">\u003cpath d=\"M200 44 L236 40\"/>\u003cpath d=\"M200 90 L236 92\"/>\u003cpath d=\"M200 128 L236 134\"/>\u003c/g>\u003cg font-size=\"14\" font-weight=\"bold\" fill=\"#c0392b\">\u003ctext x=\"240\" y=\"45\">A\u003c/text>\u003ctext x=\"240\" y=\"97\">B\u003c/text>\u003ctext x=\"240\" y=\"139\">C\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q011", "koma": "chu2-seibutsu-04", "t": "choice", "q": "図のAは、胃の内側の表面に同じ形の細胞が並んだもの。Aのようなものを何という？", "choices": ["組織", "器官", "個体", "細胞壁"], "ex": "同じ形・はたらきの細胞が集まったAは組織（上皮組織）。", "fig": "\u003csvg viewBox=\"0 0 300 160\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect width=\"300\" height=\"160\" fill=\"#fff\"/>\u003ctext x=\"10\" y=\"18\" font-size=\"12\" font-weight=\"bold\" fill=\"#555\">胃の内側（食べ物がふれる側）\u003c/text>\u003crect x=\"12\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"21\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"32\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"41\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"52\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"61\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"72\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"81\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"92\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"101\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"112\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"121\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"132\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"141\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"152\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"161\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"172\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"181\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003crect x=\"192\" y=\"26\" width=\"18\" height=\"34\" rx=\"3\" fill=\"#f7c3d2\" stroke=\"#3a2330\" stroke-width=\"1.4\"/>\u003ccircle cx=\"201\" cy=\"48\" r=\"3\" fill=\"#c0305f\"/>\u003cpath d=\"M12 70 Q110 64 210 70\" stroke=\"#e5514c\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/>\u003cellipse cx=\"60\" cy=\"69\" rx=\"6\" ry=\"2\" fill=\"#7a1f24\"/>\u003cpath d=\"M12 82 Q110 76 210 82\" stroke=\"#e5514c\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/>\u003cellipse cx=\"100\" cy=\"81\" rx=\"6\" ry=\"2\" fill=\"#7a1f24\"/>\u003cpath d=\"M12 94 Q110 88 210 94\" stroke=\"#e5514c\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/>\u003cellipse cx=\"140\" cy=\"93\" rx=\"6\" ry=\"2\" fill=\"#7a1f24\"/>\u003cpath d=\"M12 106 Q110 100 210 106\" stroke=\"#e5514c\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/>\u003cellipse cx=\"180\" cy=\"105\" rx=\"6\" ry=\"2\" fill=\"#7a1f24\"/>\u003cpath d=\"M20 130 Q60 122 100 132 T200 128\" stroke=\"#d9a400\" stroke-width=\"3\" fill=\"none\"/>\u003ccircle cx=\"100\" cy=\"132\" r=\"4\" fill=\"#f5c542\" stroke=\"#3a2330\"/>\u003ctext x=\"10\" y=\"154\" font-size=\"12\" font-weight=\"bold\" fill=\"#555\">胃の外側\u003c/text>\u003cg stroke=\"#c0392b\" stroke-width=\"1.6\">\u003cpath d=\"M200 44 L236 40\"/>\u003cpath d=\"M200 90 L236 92\"/>\u003cpath d=\"M200 128 L236 134\"/>\u003c/g>\u003cg font-size=\"14\" font-weight=\"bold\" fill=\"#c0392b\">\u003ctext x=\"240\" y=\"45\">A\u003c/text>\u003ctext x=\"240\" y=\"97\">B\u003c/text>\u003ctext x=\"240\" y=\"139\">C\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q012", "koma": "chu2-seibutsu-04", "t": "choice", "q": "ゾウリムシの体について、正しいものはどれ？", "choices": ["1つの細胞で、生きるためのはたらきをすべて行っている", "組織と器官が集まってできている", "細胞をもっていない", "器官だけでできている"], "ex": "ゾウリムシは単細胞生物。1つの細胞が体全体。多細胞生物は細胞→組織→器官→個体。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-merge"}, {"id": "chu2-bio-cell-merge-q013", "koma": "chu2-seibutsu-04", "t": "choice", "q": "ある生物の体を調べると「表皮組織・葉肉組織・維管束が組み合わさった部分」があった。この部分について正しいものはどれ？", "choices": ["何種類かの組織が組み合わさっているので器官である", "同じ種類の細胞の集まりなので組織である", "1つの細胞である", "動物の器官である"], "ex": "3種類の組織が組み合わさった部分（葉）は、植物の器官。", "kind": "judge", "fig": null, "level": 1, "game": "bio-cell-merge"}, {"id": "chu2-bio-one-cell-q001", "koma": "chu2-seibutsu-05", "t": "choice", "q": "細胞に酸素が届かなくなった。細胞はどうなる？", "choices": ["養分から エネルギーを 取り出せなくなる", "養分が どんどん増えて 元気になる", "二酸化炭素を 酸素のかわりに使って 生きつづける", "何も変わらない"], "ex": "細胞は酸素を使って養分を分解し、エネルギーを取り出している。酸素がないと取り出せない。", "kind": "judge", "level": 1, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q002", "koma": "chu2-seibutsu-05", "t": "choice", "q": "細胞が、二酸化炭素などのいらない物を外へ出せなくなった。どうなる？", "choices": ["いらない物がたまり、細胞は生きていけなくなる", "たまった二酸化炭素から エネルギーが出て 元気になる", "二酸化炭素が 酸素に変わって また使える", "何も変わらない"], "ex": "細胞の呼吸では、取り込むだけでなく、できた二酸化炭素などを外へ出すことも欠かせない。", "kind": "judge", "level": 1, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q003", "koma": "chu2-seibutsu-05", "t": "choice", "q": "図は1つの細胞と、物質の出入りを表している。細胞に入る矢印ア・イにあてはまる物の組み合わせは？", "choices": ["酸素 と 養分", "二酸化炭素 と 水", "酸素 と 二酸化炭素", "養分 と 二酸化炭素"], "ex": "細胞は酸素と養分を取り込み、エネルギーを取り出したあと、二酸化炭素などを出す（ウ・エ）。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 150\" width=\"300\" height=\"150\">\u003crect width=\"300\" height=\"150\" fill=\"#fff\"/>\u003cellipse cx=\"150\" cy=\"75\" rx=\"70\" ry=\"42\" fill=\"#e3efd6\" stroke=\"#34443f\" stroke-width=\"2.5\"/>\u003cellipse cx=\"145\" cy=\"78\" rx=\"18\" ry=\"13\" fill=\"#b9bfd9\" stroke=\"#34443f\"/>\u003ctext x=\"150\" y=\"128\" font-size=\"12\" text-anchor=\"middle\" font-family=\"sans-serif\">1つの細胞\u003c/text>\u003cg stroke=\"#34443f\" stroke-width=\"2.5\" fill=\"none\">\u003cpath d=\"M20 50 H75\"/>\u003cpath d=\"M68 44 L77 50 L68 56\"/>\u003cpath d=\"M20 100 H75\"/>\u003cpath d=\"M68 94 L77 100 L68 106\"/>\u003cpath d=\"M225 50 H280\"/>\u003cpath d=\"M273 44 L282 50 L273 56\"/>\u003cpath d=\"M225 100 H280\"/>\u003cpath d=\"M273 94 L282 100 L273 106\"/>\u003c/g>\u003cg font-size=\"16\" font-weight=\"bold\" font-family=\"sans-serif\">\u003ctext x=\"40\" y=\"42\">ア\u003c/text>\u003ctext x=\"40\" y=\"92\">イ\u003c/text>\u003ctext x=\"245\" y=\"42\">ウ\u003c/text>\u003ctext x=\"245\" y=\"92\">エ\u003c/text>\u003c/g>\u003c/svg>", "kind": "judge", "level": 1, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q004", "koma": "chu2-seibutsu-05", "t": "choice", "q": "からだが1つの細胞だけでできている生物を何という？", "choices": ["単細胞生物", "多細胞生物", "器官", "組織"], "ex": "ゾウリムシのように、1つの細胞で生きている生物を単細胞生物という。", "kind": "term", "level": 1, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q005", "koma": "chu2-seibutsu-05", "t": "choice", "q": "池の水にいる生物のうち、からだが1つの細胞だけでできているものはどれ？", "choices": ["ゾウリムシ", "ミジンコ", "メダカ", "ヤゴ（トンボの幼虫）"], "ex": "ミジンコは池の水の中の小さな生物だが、たくさんの細胞でできた多細胞生物。", "kind": "judge", "level": 2, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q006", "koma": "chu2-seibutsu-05", "t": "choice", "q": "ゾウリムシ（単細胞生物）について、正しいものはどれ？", "choices": ["1つの細胞で、酸素や養分を取り込み、いらない物を出している", "肺をもっていて、肺で呼吸している", "たくさんの細胞が集まってできている", "呼吸をしないで生きている"], "ex": "単細胞生物は、1つの細胞で生きるための出し入れをすべて行っている。", "kind": "judge", "level": 1, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q007", "koma": "chu2-seibutsu-05", "t": "choice", "q": "植物の細胞について、正しいものはどれ？", "choices": ["植物の細胞も、酸素を取り込み二酸化炭素を出す呼吸をしている", "植物の細胞は、呼吸をしない", "植物の細胞は、二酸化炭素を取り込み酸素を出す呼吸をしている", "植物は根だけが呼吸している"], "ex": "呼吸（酸素を使って養分からエネルギーを取り出す）は、植物の細胞も動物の細胞も行っている。", "kind": "judge", "level": 2, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q008", "koma": "chu2-seibutsu-05", "t": "order", "q": "細胞がエネルギーを得るまでの流れを、正しい順に並べよう。", "items": ["酸素と養分を 細胞に取り込む", "酸素を使って 養分から エネルギーを取り出す", "できた二酸化炭素などを 細胞の外へ出す"], "ex": "取り込む → エネルギーを取り出す → いらない物を出す、の順。", "kind": "judge", "level": 1, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q009", "koma": "chu2-seibutsu-05", "t": "choice", "q": "同じ水を入れた容器A・Bのうち、Aにだけゾウリムシを入れ、同じ場所に置いた。グラフは水にとけている酸素の量の変化。Aで酸素が減ったのはなぜ？", "choices": ["ゾウリムシが 呼吸で酸素を使ったから", "ゾウリムシが 光合成で酸素をつくったから", "水が蒸発して なくなったから", "Bに酸素が移ったから"], "ex": "入れていないBは変わらないので、Aの酸素を減らしたのはゾウリムシの呼吸だと分かる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 190\" width=\"300\" height=\"190\">\u003crect width=\"300\" height=\"190\" fill=\"#fff\"/>\u003cg font-family=\"sans-serif\" font-size=\"11\">\u003cpath d=\"M50 20 V150 H280\" stroke=\"#34443f\" stroke-width=\"2\" fill=\"none\"/>\u003ctext x=\"8\" y=\"16\">水にとけている\u003c/text>\u003ctext x=\"8\" y=\"30\">酸素の量\u003c/text>\u003ctext x=\"235\" y=\"170\">時間 →\u003c/text>\u003cpath d=\"M52 40 L270 40\" stroke=\"#4f8fc9\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/>\u003cpath d=\"M52 40 L270 125\" stroke=\"#c9573c\" stroke-width=\"3\"/>\u003ctext x=\"200\" y=\"34\" fill=\"#4f8fc9\" font-weight=\"bold\">B（入れない）\u003c/text>\u003ctext x=\"190\" y=\"138\" fill=\"#c9573c\" font-weight=\"bold\">A（ゾウリムシあり）\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q010", "koma": "chu2-seibutsu-05", "t": "choice", "q": "ゾウリムシが呼吸していることを実験で確かめたい。いちばんよい方法は？", "choices": ["ゾウリムシを入れた容器と入れない容器を同じ条件で用意し、酸素や二酸化炭素の量の変化を比べる", "ゾウリムシを入れた容器だけを用意して、ようすを見る", "ゾウリムシの数を顕微鏡で数える", "水の温度だけを1日じゅう測る"], "ex": "ゾウリムシの有無だけを変えた容器と比べると、変化がゾウリムシのせいだと言える。", "kind": "method", "level": 2, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q011", "koma": "chu2-seibutsu-05", "t": "choice", "q": "細胞が酸素を使って養分を分解し、エネルギーを取り出すはたらきを何という？", "choices": ["細胞の呼吸", "消化", "光合成", "排出"], "ex": "肺での息の出し入れとは別に、細胞1つ1つが行っている呼吸を細胞の呼吸（細胞による呼吸）という。", "kind": "term", "level": 1, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q012", "koma": "chu2-seibutsu-05", "t": "choice", "q": "ヒトが肺で取り入れた酸素は、最終的にどこで使われる？", "choices": ["体じゅうの細胞1つ1つ", "肺の中だけ", "心臓の中だけ", "使われずに そのまま はき出される"], "ex": "肺は空気の出入り口。酸素を使って養分からエネルギーを取り出すのは、体じゅうの細胞。", "kind": "judge", "level": 2, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q013", "koma": "chu2-seibutsu-05", "t": "num", "q": "表は、ゾウリムシを入れた容器の水にとけている酸素の量の記録（例）。同じ減り方が続くとすると、30分のときは何mg/Lと考えられる？", "ans": 5.6, "unit": "mg/L", "tol": 0.05, "ex": "10分ごとに0.8mg/Lずつ減っているので、6.4−0.8＝5.6mg/L。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 96\" width=\"300\" height=\"96\">\u003crect width=\"300\" height=\"96\" fill=\"#fff\"/>\u003cg font-family=\"sans-serif\" font-size=\"13\" text-anchor=\"middle\">\u003crect x=\"10\" y=\"10\" width=\"280\" height=\"76\" fill=\"none\" stroke=\"#34443f\" stroke-width=\"1.5\"/>\u003cpath d=\"M10 48 H290 M100 10 V86 M147 10 V86 M194 10 V86 M241 10 V86\" stroke=\"#34443f\"/>\u003ctext x=\"55\" y=\"34\">時間〔分〕\u003c/text>\u003ctext x=\"123\" y=\"34\">0\u003c/text>\u003ctext x=\"170\" y=\"34\">10\u003c/text>\u003ctext x=\"217\" y=\"34\">20\u003c/text>\u003ctext x=\"265\" y=\"34\">30\u003c/text>\u003ctext x=\"55\" y=\"68\" font-size=\"11\">酸素〔mg/L〕\u003c/text>\u003ctext x=\"123\" y=\"72\">8.0\u003c/text>\u003ctext x=\"170\" y=\"72\">7.2\u003c/text>\u003ctext x=\"217\" y=\"72\">6.4\u003c/text>\u003ctext x=\"265\" y=\"72\" font-weight=\"bold\">？\u003c/text>\u003c/g>\u003c/svg>", "kind": "calc", "level": 2, "game": "bio-one-cell"}, {"id": "chu2-bio-one-cell-q014", "koma": "chu2-seibutsu-05", "t": "choice", "q": "酸素は十分にあるが、養分がなくなった細胞はどうなる？", "choices": ["エネルギーを取り出せなくなる", "酸素だけで エネルギーを取り出しつづける", "二酸化炭素から 養分をつくって生きる", "呼吸が速くなって元気になる"], "ex": "エネルギーは養分から取り出す。酸素だけでは足りず、養分と酸素の両方が必要。", "kind": "judge", "level": 1, "fig": null, "game": "bio-one-cell"}, {"id": "chu2-bio-stomata-maze-q001", "koma": "chu2-seibutsu-06", "t": "choice", "q": "図は、ある葉の断面の模式図。葉の外と中で気体が出入りする所は、ア〜エのどれ？", "choices": ["エ", "ア", "イ", "ウ"], "ex": "エは、2つの細胞にはさまれたすき間（気孔）。表面のほかの所は細胞がすき間なく並んでいる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 190\" width=\"300\" height=\"190\">\u003crect width=\"300\" height=\"190\" fill=\"#fff\"/>\u003crect x=\"0\" y=\"0\" width=\"300\" height=\"30\" fill=\"#eaf4f7\"/>\u003crect x=\"0\" y=\"160\" width=\"300\" height=\"30\" fill=\"#eaf4f7\"/>\u003crect x=\"0\" y=\"40\" width=\"300\" height=\"110\" fill=\"#f1f6e6\"/>\u003crect x=\"0\" y=\"30\" width=\"300\" height=\"10\" fill=\"#fbfdf5\" stroke=\"#8aa070\"/>\u003cline x1=\"0\" y1=\"30\" x2=\"0\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"20\" y1=\"30\" x2=\"20\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"40\" y1=\"30\" x2=\"40\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"60\" y1=\"30\" x2=\"60\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"80\" y1=\"30\" x2=\"80\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"100\" y1=\"30\" x2=\"100\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"120\" y1=\"30\" x2=\"120\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"140\" y1=\"30\" x2=\"140\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"160\" y1=\"30\" x2=\"160\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"180\" y1=\"30\" x2=\"180\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"200\" y1=\"30\" x2=\"200\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"220\" y1=\"30\" x2=\"220\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"240\" y1=\"30\" x2=\"240\" y2=\ 200\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"220\" y1=\"150\" x2=\"220\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"240\" y1=\"150\" x2=\"240\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"260\" y1=\"150\" x2=\"260\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"280\" y1=\"150\" x2=\"280\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cellipse cx=\"173\" cy=\"155\" rx=\"5\" ry=\"7\" fill=\"#4f8a3a\"/>\u003cellipse cx=\"187\" cy=\"155\" rx=\"5\" ry=\"7\" fill=\"#4f8a3a\"/>\u003ctext x=\"60\" y=\"26\" font-size=\"15\" font-weight=\"bold\" font-family=\"sans-serif\" fill=\"#1f2a26\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">ア\u003c/text>\u003ctext x=\"95\" y=\"72\" font-size=\"15\" font-weight=\"bold\" font-family=\"sans-serif\" fill=\"#1f2a26\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">イ\u003c/text>\u003ctext x=\"88\" y=\"124\" font-size=\"15\" font-weight=\"bold\" font-family=\"sans-serif\" fill=\"#1f2a26\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">ウ\u003c/text>\u003ctext x=\"174\" y=\"184\" font-size=\"15\" font-weight=\"bold\" font-family=\"sans-serif\" fill=\"#1f2a26\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">エ\u003c/text>\u003cg stroke=\"#1f2a26\" stroke-width=\"1.5\">\u003cline x1=\"66\" y1=\"22\" x2=\"72\" y2=\"34\"/>\u003cline x1=\"180\" y1=\"170\" x2=\"180\" y2=\"161\"/>\u003c/g>\u003c/svg>", "kind": "judge", "level": 1, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q002", "koma": "chu2-seibutsu-06", "t": "choice", "q": "葉の表面で気体が出入りできるのが気孔だけなのは、なぜ？", "choices": ["表面の細胞はすき間なく並び、すき間は気孔しかないから", "葉の表面の細胞は、どこでも気体を通すから", "気孔には緑の細胞がたくさん集まっているから", "気孔は水だけを通す管だから"], "ex": "表面（表皮）の細胞はすき間なく並ぶ。すき間になっている気孔だけが出入り口になる。", "kind": "judge", "level": 1, "fig": null, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q003", "koma": "chu2-seibutsu-06", "t": "choice", "q": "葉の表面にある、気体の出入り口になっているすき間を何という？", "choices": ["気孔", "葉脈", "表皮", "葉緑体"], "ex": "くちびるのような形の2つの細胞にはさまれたすき間を気孔という。", "kind": "term", "level": 1, "fig": null, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q004", "koma": "chu2-seibutsu-06", "t": "choice", "q": "昼の葉で、気孔を通って出入りするものの組み合わせとして正しいものは？", "choices": ["酸素・二酸化炭素・水蒸気", "酸素と二酸化炭素だけ", "水（液体）だけ", "デンプンと酸素"], "ex": "気孔からは酸素・二酸化炭素が出入りし、水蒸気も出ていく。", "kind": "judge", "level": 1, "fig": null, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q005", "koma": "chu2-seibutsu-06", "t": "choice", "q": "図のように、枝についた葉を表側と裏側から同じ大きさの透明な容器ではさんだ。しばらくすると、裏側の容器だけ内側がくもった。このことからわかることは？", "choices": ["葉の裏側に気孔が多い", "葉の表側に気孔が多い", "表と裏で気孔の数は同じ", "気孔は表側にしかない"], "ex": "気孔から水蒸気が出る。裏側の容器だけくもったので、裏側に気孔が多いと考えられる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 150\" width=\"300\" height=\"150\">\u003crect width=\"300\" height=\"150\" fill=\"#fff\"/>\u003cg font-family=\"sans-serif\" font-size=\"12\">\u003cpath d=\"M60 75 Q150 60 240 75\" stroke=\"#4d7f38\" stroke-width=\"6\" fill=\"none\"/>\u003cpath d=\"M40 75 L20 90\" stroke=\"#6b4f2a\" stroke-width=\"3\"/>\u003cpath d=\"M90 73 A60 50 0 0 1 210 73\" fill=\"rgba(200,230,240,.35)\" stroke=\"#5a8aa0\" stroke-width=\"2\"/>\u003cpath d=\"M90 77 A60 50 0 0 0 210 77\" fill=\"rgba(200,230,240,.35)\" stroke=\"#5a8aa0\" stroke-width=\"2\"/>\u003cg fill=\"#8fb7c9\">\u003ccircle cx=\"120\" cy=\"100\" r=\"2.3\"/>\u003ccircle cx=\"135\" cy=\"108\" r=\"2.3\"/>\u003ccircle cx=\"150\" cy=\"112\" r=\"2.3\"/>\u003ccircle cx=\"165\" cy=\"106\" r=\"2.3\"/>\u003ccircle cx=\"180\" cy=\"99\" r=\"2.3\"/>\u003ccircle cx=\"128\" cy=\"118\" r=\"2.3\"/>\u003ccircle cx=\"158\" cy=\"120\" r=\"2.3\"/>\u003ccircle cx=\"143\" cy=\"98\" r=\"2.3\"/>\u003ccircle cx=\"172\" cy=\"116\" r=\"2.3\"/>\u003c/g>\u003ctext x=\"222\" y=\"40\">表側の容器\u003c/text>\u003ctext x=\"222\" y=\"128\">裏側の容器\u003c/text>\u003ctext x=\"212\" y=\"143\" font-size=\"11\">（内側に水てき）\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q006", "koma": "chu2-seibutsu-06", "t": "choice", "q": "同じような3本の枝A〜Cの葉にワセリンをぬり、水の減った量を比べた（水面からの蒸発はふせいである）。表の結果から考えられることは？", "choices": ["気孔は葉の裏側に多い", "気孔は葉の表側に多い", "ワセリンをぬると水が多く出ていく", "気孔は茎にしかない"], "ex": "裏をふさいだCで大きく減らなくなった。裏の気孔から出ていく水蒸気が多いから。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" width=\"300\" height=\"120\">\u003crect width=\"300\" height=\"120\" fill=\"#fff\"/>\u003cg font-family=\"sans-serif\" font-size=\"13\">\u003crect x=\"8\" y=\"8\" width=\"284\" height=\"104\" fill=\"none\" stroke=\"#34443f\"/>\u003cpath d=\"M8 38 H292 M8 63 H292 M8 88 H292 M178 8 V112\" stroke=\"#34443f\"/>\u003ctext x=\"20\" y=\"28\">枝の葉にしたこと\u003c/text>\u003ctext x=\"186\" y=\"28\" font-size=\"12\">水の減った量\u003c/text>\u003ctext x=\"20\" y=\"56\">A 何もぬらない\u003c/text>\u003ctext x=\"220\" y=\"56\">5.0 mL\u003c/text>\u003ctext x=\"20\" y=\"81\">B 表にワセリン\u003c/text>\u003ctext x=\"220\" y=\"81\">4.2 mL\u003c/text>\u003ctext x=\"20\" y=\"106\">C 裏にワセリン\u003c/text>\u003ctext x=\"220\" y=\"106\">1.4 mL\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q007", "koma": "chu2-seibutsu-06", "t": "choice", "q": "葉の気孔を顕微鏡で観察したい。いちばんよい方法は？", "choices": ["葉の裏の表皮をうすくはがして（または写し取って）プレパラートにする", "葉を丸ごと1枚、スライドガラスにのせて見る", "葉をすりつぶして水に入れて見る", "葉をヨウ素液につけてから虫めがねで見る"], "ex": "気孔は表皮にあり小さい。うすい表皮を取って顕微鏡で見る。", "kind": "method", "level": 2, "fig": null, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q008", "koma": "chu2-seibutsu-06", "t": "choice", "q": "スイレンの葉は水面に浮かび、裏側は水につかっている。スイレンの気孔が多いのはどちら側と考えられる？", "choices": ["表側（空気にふれている側）", "裏側（水につかっている側）", "どちらにも気孔はない", "表と裏に同じ数ずつ"], "ex": "気孔は空気と気体を出し入れする所。水につかった裏側では出し入れできないので、表側にある。", "kind": "judge", "level": 2, "fig": null, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q009", "koma": "chu2-seibutsu-06", "t": "choice", "q": "図は、ある葉の断面を向きを変えて描いたもの。葉の裏側は A・B のどちら？", "choices": ["A（すき間の多い細胞の側。気孔もある）", "B（緑の細胞がすき間なく並ぶ側）", "どちらとも決められない"], "ex": "緑の細胞がすき間なく並ぶ側が表。すき間が多く気孔がある側が裏。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 190\" width=\"300\" height=\"190\">\u003crect width=\"300\" height=\"190\" fill=\"#fff\"/>\u003cg transform=\"rotate(180 150.0 95.0)\">\u003crect x=\"0\" y=\"0\" width=\"300\" height=\"30\" fill=\"#eaf4f7\"/>\u003crect x=\"0\" y=\"160\" width=\"300\" height=\"30\" fill=\"#eaf4f7\"/>\u003crect x=\"0\" y=\"40\" width=\"300\" height=\"110\" fill=\"#f1f6e6\"/>\u003crect x=\"0\" y=\"30\" width=\"300\" height=\"10\" fill=\"#fbfdf5\" stroke=\"#8aa070\"/>\u003cline x1=\"0\" y1=\"30\" x2=\"0\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"20\" y1=\"30\" x2=\"20\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"40\" y1=\"30\" x2=\"40\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"60\" y1=\"30\" x2=\"60\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"80\" y1=\"30\" x2=\"80\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"100\" y1=\"30\" x2=\"100\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"120\" y1=\"30\" x2=\"120\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"140\" y1=\"30\" x2=\"140\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"160\" y1=\"30\" x2=\"160\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"180\" y1=\"30\" x2=\"180\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"200\" y1=\"30\" x2=\"200\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"220\" y1=\"30\" x2=\"220\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"240\" y1=\"30\" x2=\"240\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"260\" y1=\"30\" x2=\"260\" y2=\"40\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"280\" y1=\"30\" x2=\"280\" y2=\"40\" stroke=\"#8aa070\" stroke-wid
