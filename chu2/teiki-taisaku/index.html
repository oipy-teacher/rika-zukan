/>\u003ccircle cx=\"160\" cy=\"132\" r=\"11\" fill=\"#b4d99a\" stroke=\"#4d7f38\" stroke-width=\".8\"/>\u003ccircle cx=\"205\" cy=\"110\" r=\"11\" fill=\"#b4d99a\" stroke=\"#4d7f38\" stroke-width=\".8\"/>\u003ccircle cx=\"250\" cy=\"128\" r=\"11\" fill=\"#b4d99a\" stroke=\"#4d7f38\" stroke-width=\".8\"/>\u003ccircle cx=\"285\" cy=\"105\" r=\"11\" fill=\"#b4d99a\" stroke=\"#4d7f38\" stroke-width=\".8\"/>\u003ccircle cx=\"45\" cy=\"140\" r=\"11\" fill=\"#b4d99a\" stroke=\"#4d7f38\" stroke-width=\".8\"/>\u003ccircle cx=\"135\" cy=\"140\" r=\"11\" fill=\"#b4d99a\" stroke=\"#4d7f38\" stroke-width=\".8\"/>\u003ccircle cx=\"230\" cy=\"142\" r=\"11\" fill=\"#b4d99a\" stroke=\"#4d7f38\" stroke-width=\".8\"/>\u003crect x=\"0\" y=\"150\" width=\"168\" height=\"10\" fill=\"#fbfdf5\" stroke=\"#8aa070\"/>\u003crect x=\"192\" y=\"150\" width=\"108\" height=\"10\" fill=\"#fbfdf5\" stroke=\"#8aa070\"/>\u003cline x1=\"0\" y1=\"150\" x2=\"0\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"20\" y1=\"150\" x2=\"20\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"40\" y1=\"150\" x2=\"40\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"60\" y1=\"150\" x2=\"60\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"80\" y1=\"150\" x2=\"80\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"100\" y1=\"150\" x2=\"100\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"120\" y1=\"150\" x2=\"120\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"140\" y1=\"150\" x2=\"140\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"160\" y1=\"150\" x2=\"160\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"200\" y1=\"150\" x2=\"200\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"220\" y1=\"150\" x2=\"220\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"240\" y1=\"150\" x2=\"240\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"260\" y1=\"150\" x2=\"260\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cline x1=\"280\" y1=\"150\" x2=\"280\" y2=\"160\" stroke=\"#8aa070\" stroke-width=\".8\"/>\u003cellipse cx=\"173\" cy=\"155\" rx=\"5\" ry=\"7\" fill=\"#4f8a3a\"/>\u003cellipse cx=\"187\" cy=\"155\" rx=\"5\" ry=\"7\" fill=\"#4f8a3a\"/>\u003c/g>\u003ctext x=\"8\" y=\"20\" font-size=\"15\" font-weight=\"bold\" font-family=\"sans-serif\" fill=\"#1f2a26\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">A\u003c/text>\u003ctext x=\"8\" y=\"184\" font-size=\"15\" font-weight=\"bold\" font-family=\"sans-serif\" fill=\"#1f2a26\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">B\u003c/text>\u003c/svg>", "kind": "judge", "level": 3, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q010", "koma": "chu2-seibutsu-06", "t": "choice", "q": "ある葉の裏側にだけワセリンをぬった。どうなると考えられる？", "choices": ["裏の気孔がふさがれ、そこから気体が出入りできなくなる", "裏から出ていく水蒸気がふえる", "表の気孔もいっしょにふさがる", "何も変わらない"], "ex": "ワセリンは気孔をふさぐ。ふさいだ側からは気体が出入りできない。", "kind": "judge", "level": 1, "fig": null, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q011", "koma": "chu2-seibutsu-06", "t": "choice", "q": "青い塩化コバルト紙を、葉の表と裏にテープで同時にはった。先に色が変わるのはどちらと考えられる？", "choices": ["裏にはった紙", "表にはった紙", "同時に変わる", "どちらも変わらない"], "ex": "塩化コバルト紙は水で青から赤（桃色）に変わる。気孔の多い裏から水蒸気が多く出る。", "kind": "judge", "level": 2, "fig": null, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q012", "koma": "chu2-seibutsu-06", "t": "order", "q": "気孔を顕微鏡で観察する手順を、正しい順に並べよう。", "items": ["葉の裏の表皮をうすくはがす", "スライドガラスにのせ、水を1てき落とす", "カバーガラスをかける", "低い倍率で見てから、倍率を上げる"], "ex": "プレパラートを作ってから、低倍率→高倍率の順で観察する。", "kind": "method", "level": 1, "fig": null, "game": "bio-stomata-maze"}, {"id": "chu2-bio-stomata-maze-q013", "koma": "chu2-seibutsu-06", "t": "choice", "q": "もし葉の表面に、すき間（気孔）がまったくなかったとしたら、どうなると考えられる？", "choices": ["葉の中と外で、気体が出入りできなくなる", "気体は表面のどこからでも出入りする", "水蒸気だけは表面から出ていける", "葉の中の酸素がふえつづけて元気になる"], "ex": "気体の出入り口は気孔。すき間がなければ、酸素・二酸化炭素・水蒸気は出入りできない。", "kind": "judge", "level": 2, "fig": null, "game": "bio-stomata-maze"}, {"id": "chu2-bio-leaf-kitchen-q001", "koma": "chu2-seibutsu-07", "t": "choice", "q": "ある植物に、二酸化炭素と水は十分にあたえたが、光を当てずに暗い所に置いた。デンプンはどうなる？", "choices": ["できない", "光を当てたときと同じだけできる", "光を当てたときより多くできる", "酸素だけができる"], "ex": "光合成は光のエネルギーを使う。材料がそろっていても、光がなければデンプンはできない。", "kind": "judge", "level": 1, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q002", "koma": "chu2-seibutsu-07", "t": "choice", "q": "光合成でデンプンをつくるとき、材料になる物質の組み合わせは？", "choices": ["二酸化炭素 と 水", "酸素 と 水", "二酸化炭素 と 酸素", "土の養分 と 水"], "ex": "材料は二酸化炭素と水。光は材料（物質）ではなく、エネルギーのもと。", "kind": "judge", "level": 1, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q003", "koma": "chu2-seibutsu-07", "t": "choice", "q": "光合成によって できる物質の組み合わせは？", "choices": ["デンプン と 酸素", "二酸化炭素 と 水", "デンプン と 二酸化炭素", "酸素 と 窒素"], "ex": "二酸化炭素と水から、デンプンなどの養分と酸素ができる。", "kind": "judge", "level": 1, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q004", "koma": "chu2-seibutsu-07", "t": "choice", "q": "植物の細胞の中で、光合成が行われている緑色の粒を何という？", "choices": ["葉緑体", "核", "細胞壁", "液胞"], "ex": "光合成は細胞の中の葉緑体で行われる。", "kind": "term", "level": 1, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q005", "koma": "chu2-seibutsu-07", "t": "choice", "q": "光のエネルギーを使って、二酸化炭素と水からデンプンなどと酸素をつくるはたらきを何という？", "choices": ["光合成", "呼吸", "蒸散", "消化"], "ex": "光合成。光・二酸化炭素・水がそろうと行われる。", "kind": "term", "level": 1, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q006", "koma": "chu2-seibutsu-07", "t": "choice", "q": "葉にデンプンができたかを調べる薬品と、デンプンがあるときの色の組み合わせは？", "choices": ["ヨウ素液 ― 青紫色", "ヨウ素液 ― 赤色", "石灰水 ― 白くにごる", "BTB液 ― 黄色"], "ex": "ヨウ素液はデンプンがあると青紫色になる。", "kind": "method", "level": 1, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q007", "koma": "chu2-seibutsu-07", "t": "choice", "q": "光を当てたオオカナダモから出た泡を試験管に集めた。この気体が酸素であることを確かめる方法と結果は？", "choices": ["火のついた線香を入れる ― 炎を上げて燃える", "石灰水を入れてふる ― 白くにごる", "においをかぐ ― つんとしたにおいがする", "マッチの火を近づける ― ポンと音がして燃える"], "ex": "酸素にはものを燃やす性質がある。線香が炎を上げて燃える。", "kind": "method", "level": 2, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q008", "koma": "chu2-seibutsu-07", "t": "choice", "q": "試験管Aには葉を入れ、Bには何も入れずに、両方に息をふきこんでゴム栓をし、光を30分当てた。そのあと石灰水を入れてふると、より白くにごるのはどちら？", "choices": ["B（Aでは光合成で二酸化炭素が使われたから）", "A（葉が二酸化炭素を出したから）", "AもBも同じ", "どちらもにごらない"], "ex": "Aの葉は光合成で二酸化炭素を使った。二酸化炭素が多く残るBの方がにごる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 160\" width=\"300\" height=\"160\">\u003crect width=\"300\" height=\"160\" fill=\"#fff\"/>\u003cpath d=\"M60 30 V120 Q78 138 96 120 V30\" fill=\"rgba(220,235,245,.6)\" stroke=\"#2b2118\" stroke-width=\"2.5\"/>\u003crect x=\"57\" y=\"22\" width=\"42\" height=\"10\" rx=\"3\" fill=\"#8a5a2e\" stroke=\"#2b2118\" stroke-width=\"1.5\"/>\u003cpath d=\"M78 110 Q66 80 78 50 Q90 80 78 110Z\" fill=\"#4f9a3a\" stroke=\"#2f6f25\"/>\u003ctext x=\"78\" y=\"152\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" font-family=\"sans-serif\">A\u003c/text>\u003cpath d=\"M190 30 V120 Q208 138 226 120 V30\" fill=\"rgba(220,235,245,.6)\" stroke=\"#2b2118\" stroke-width=\"2.5\"/>\u003crect x=\"187\" y=\"22\" width=\"42\" height=\"10\" rx=\"3\" fill=\"#8a5a2e\" stroke=\"#2b2118\" stroke-width=\"1.5\"/>\u003ctext x=\"208\" y=\"152\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" font-family=\"sans-serif\">B\u003c/text>\u003cg font-family=\"sans-serif\" font-size=\"11\">\u003ctext x=\"100\" y=\"60\">葉＋息\u003c/text>\u003ctext x=\"230\" y=\"60\">息だけ\u003c/text>\u003ccircle cx=\"150\" cy=\"16\" r=\"9\" fill=\"#f2b632\" stroke=\"#2b2118\"/>\u003ctext x=\"165\" y=\"20\">光を30分\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q009", "koma": "chu2-seibutsu-07", "t": "choice", "q": "息をふきこんで黄色にしたBTB液を試験管A〜Cに入れ、光を当てた（A：オオカナダモ　B：オオカナダモをアルミはくでおおう　C：何も入れない）。しばらくすると、Aだけ青色になった。なぜ？", "choices": ["Aでは葉が光合成をして、液の中の二酸化炭素が使われたから", "Aでは葉が二酸化炭素を出したから", "BTB液は光を当てると青くなるから", "Aでは水が蒸発したから"], "ex": "光が当たる葉があるAだけで二酸化炭素が減った。BとCと比べると、光と葉の両方が必要だとわかる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 160\" width=\"300\" height=\"160\">\u003crect width=\"300\" height=\"160\" fill=\"#fff\"/>\u003cpath d=\"M20 30 V120 Q38 138 56 120 V30\" fill=\"#e3c33a\" stroke=\"#2b2118\" stroke-width=\"2.5\"/>\u003crect x=\"17\" y=\"22\" width=\"42\" height=\"10\" rx=\"3\" fill=\"#8a5a2e\" stroke=\"#2b2118\" stroke-width=\"1.5\"/>\u003cpath d=\"M38 110 Q26 80 38 50 Q50 80 38 110Z\" fill=\"#4f9a3a\" stroke=\"#2f6f25\"/>\u003ctext x=\"38\" y=\"152\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" font-family=\"sans-serif\">A\u003c/text>\u003cpath d=\"M130 30 V120 Q148 138 166 120 V30\" fill=\"#e3c33a\" stroke=\"#2b2118\" stroke-width=\"2.5\"/>\u003crect x=\"127\" y=\"22\" width=\"42\" height=\"10\" rx=\"3\" fill=\"#8a5a2e\" stroke=\"#2b2118\" stroke-width=\"1.5\"/>\u003cpath d=\"M148 110 Q136 80 148 50 Q160 80 148 110Z\" fill=\"#4f9a3a\" stroke=\"#2f6f25\"/>\u003cpath d=\"M128 34 H168 V122 Q148 142 128 122Z\" fill=\"#b9bcc2\" stroke=\"#6b6f78\" stroke-width=\"2\"/>\u003ctext x=\"148\" y=\"84\" font-size=\"10\" text-anchor=\"middle\" font-family=\"sans-serif\">アルミ\u003c/text>\u003ctext x=\"148\" y=\"96\" font-size=\"10\" text-anchor=\"middle\" font-family=\"sans-serif\">はく\u003c/text>\u003ctext x=\"148\" y=\"152\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" font-family=\"sans-serif\">B\u003c/text>\u003cpath d=\"M240 30 V120 Q258 138 276 120 V30\" fill=\"#e3c33a\" stroke=\"#2b2118\" stroke-width=\"2.5\"/>\u003crect x=\"237\" y=\"22\" width=\"42\" height=\"10\" rx=\"3\" fill=\"#8a5a2e\" stroke=\"#2b2118\" stroke-width=\"1.5\"/>\u003ctext x=\"258\" y=\"152\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" font-family=\"sans-serif\">C\u003c/text>\u003cg font-family=\"sans-serif\" font-size=\"10\">\u003ctext x=\"4\" y=\"12\">息で黄色にしたBTB液に光を当てた。\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q010", "koma": "chu2-seibutsu-07", "t": "choice", "q": "光合成に光が必要かを調べる実験で、正しい計画はどれ？", "choices": ["光を当てる葉と当てない葉を用意し、それ以外の条件はそろえる", "光を当てる葉には水を多くし、当てない葉には水を少なくする", "光を当てる葉だけを用意して調べる", "光も水も二酸化炭素も、全部ちがう葉を用意する"], "ex": "調べたい条件を1つだけ変え、ほかはそろえる（対照実験）。2つ以上変えると、どれのせいか分からない。", "kind": "method", "level": 2, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q011", "koma": "chu2-seibutsu-07", "t": "choice", "q": "葉をあたためたエタノールにつける操作について、正しいものは？", "choices": ["葉の緑色をぬくためで、エタノールは引火しやすいので湯であたためる", "デンプンをふやすためで、ガスバーナーで直接あたためる", "葉をかたくするためで、冷やして使う", "酸素を集めるためで、日光に当てる"], "ex": "脱色するとヨウ素液の色の変化が見やすくなる。エタノールは引火しやすいので直接火にかけない。", "kind": "method", "level": 2, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q012", "koma": "chu2-seibutsu-07", "t": "order", "q": "葉にデンプンがあるか調べる手順を、正しい順に並べよう。", "items": ["光を当てた葉を 熱湯にひたす", "あたためたエタノールで 緑色をぬく", "水で あらう", "ヨウ素液をつけて 色を見る"], "ex": "やわらかくする → 脱色 → あらう → ヨウ素液、の順。", "kind": "method", "level": 1, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q013", "koma": "chu2-seibutsu-07", "t": "choice", "q": "光合成をしている植物に、酸素や土の肥料を多くあたえても、できるデンプンの量は増えなかった。なぜ？", "choices": ["酸素も土の肥料も、光合成の材料ではないから", "酸素と土の肥料は光合成の材料だが、足りていたから", "植物は肥料からデンプンをつくるから", "酸素があると光合成が止まるから"], "ex": "材料は二酸化炭素と水。酸素は光合成でできる物。", "kind": "judge", "level": 2, "fig": null, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-leaf-kitchen-q014", "koma": "chu2-seibutsu-07", "t": "choice", "q": "グラフは、オオカナダモに当てる光の強さを変えて、1分間に出る泡の数を数えた結果（例）。わかることは？", "choices": ["光が強いほど、光合成がさかんに行われる", "光が弱いほど、光合成がさかんに行われる", "光の強さと光合成は関係がない", "泡は二酸化炭素なので、光が強いほど呼吸がさかん"], "ex": "泡（酸素）の数が光の強さとともに増えた。光が強いほど光合成がさかん（ある程度まで）。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 170\" width=\"300\" height=\"170\">\u003crect width=\"300\" height=\"170\" fill=\"#fff\"/>\u003cg font-family=\"sans-serif\" font-size=\"11\">\u003cpath d=\"M50 20 V140 H280\" stroke=\"#2b2118\" stroke-width=\"2\" fill=\"none\"/>\u003ctext x=\"4\" y=\"16\">1分間の泡の数\u003c/text>\u003crect x=\"70\" y=\"115\" width=\"40\" height=\"25\" fill=\"#4f9a3a\"/>\u003ctext x=\"90\" y=\"109\" text-anchor=\"middle\">5\u003c/text>\u003crect x=\"140\" y=\"80\" width=\"40\" height=\"60\" fill=\"#4f9a3a\"/>\u003ctext x=\"160\" y=\"74\" text-anchor=\"middle\">12\u003c/text>\u003crect x=\"210\" y=\"40\" width=\"40\" height=\"100\" fill=\"#4f9a3a\"/>\u003ctext x=\"230\" y=\"34\" text-anchor=\"middle\">20\u003c/text>\u003ctext x=\"90\" y=\"156\" text-anchor=\"middle\">弱い\u003c/text>\u003ctext x=\"160\" y=\"156\" text-anchor=\"middle\">中くらい\u003c/text>\u003ctext x=\"230\" y=\"156\" text-anchor=\"middle\">強い\u003c/text>\u003ctext x=\"160\" y=\"168\" text-anchor=\"middle\">当てた光の強さ（例）\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-leaf-kitchen"}, {"id": "chu2-bio-starch-sonar-q001", "koma": "chu2-seibutsu-08", "t": "choice", "q": "ふ入りの葉の一部をアルミはくでおおい、暗い所に一晩置いてから日光に当てた。脱色してヨウ素液につけると、青紫色になるのはどの部分？", "choices": ["ア（緑色・光が当たった）", "イ（白い部分・光が当たった）", "ウ（緑色・おおった）", "エ（白い部分・おおった）"], "ex": "葉緑体があって光も当たったアだけで光合成が行われ、デンプンができる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 200\" width=\"300\" height=\"200\">\u003crect width=\"300\" height=\"200\" fill=\"#fff\"/>\u003cdefs>\u003cclipPath id=\"lf\">\u003cpath d=\"M150 12 C230 40 250 120 150 188 C50 120 70 40 150 12Z\"/>\u003c/clipPath>\u003c/defs>\u003cg clip-path=\"url(#lf)\">\u003crect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"#e9efe2\"/>\u003cpath d=\"M150 30 C205 55 212 118 150 168 C88 118 95 55 150 30Z\" fill=\"#5fae4a\"/>\u003crect x=\"60\" y=\"92\" width=\"190\" height=\"34\" fill=\"#b9bcc2\" opacity=\".9\"/>\u003c/g>\u003cpath d=\"M150 12 C230 40 250 120 150 188 C50 120 70 40 150 12Z\" fill=\"none\" stroke=\"#2b4a25\" stroke-width=\"2.5\"/>\u003cpath d=\"M150 12 V196\" stroke=\"#2b4a25\" stroke-width=\"1.5\"/>\u003cg font-family=\"sans-serif\" font-size=\"15\" font-weight=\"bold\" fill=\"#1d2a24\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">\u003ctext x=\"130\" y=\"72\">ア\u003c/text>\u003ctext x=\"92\" y=\"62\">イ\u003c/text>\u003ctext x=\"128\" y=\"115\">ウ\u003c/text>\u003ctext x=\"84\" y=\"115\">エ\u003c/text>\u003ctext x=\"136\" y=\"152\">ア\u003c/text>\u003ctext x=\"96\" y=\"160\">イ\u003c/text>\u003c/g>\u003cg font-family=\"sans-serif\" font-size=\"11\" fill=\"#1d2a24\">\u003ctext x=\"222\" y=\"88\">アルミはく\u003c/text>\u003cpath d=\"M232 92 L226 100\" stroke=\"#1d2a24\"/>\u003ctext x=\"214\" y=\"30\">白い部分＝ふ\u003c/text>\u003cpath d=\"M232 34 L205 60\" stroke=\"#1d2a24\"/>\u003c/g>\u003c/svg>", "kind": "judge", "level": 1, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q002", "koma": "chu2-seibutsu-08", "t": "choice", "q": "この実験で「光合成には光が必要」と分かるのは、どことどこを比べたとき？", "choices": ["ア と ウ", "ア と イ", "ア と エ", "イ と エ"], "ex": "アとウは光があるかないかだけがちがう（どちらも緑色）。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 200\" width=\"300\" height=\"200\">\u003crect width=\"300\" height=\"200\" fill=\"#fff\"/>\u003cdefs>\u003cclipPath id=\"lf\">\u003cpath d=\"M150 12 C230 40 250 120 150 188 C50 120 70 40 150 12Z\"/>\u003c/clipPath>\u003c/defs>\u003cg clip-path=\"url(#lf)\">\u003crect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"#e9efe2\"/>\u003cpath d=\"M150 30 C205 55 212 118 150 168 C88 118 95 55 150 30Z\" fill=\"#5fae4a\"/>\u003crect x=\"60\" y=\"92\" width=\"190\" height=\"34\" fill=\"#b9bcc2\" opacity=\".9\"/>\u003c/g>\u003cpath d=\"M150 12 C230 40 250 120 150 188 C50 120 70 40 150 12Z\" fill=\"none\" stroke=\"#2b4a25\" stroke-width=\"2.5\"/>\u003cpath d=\"M150 12 V196\" stroke=\"#2b4a25\" stroke-width=\"1.5\"/>\u003cg font-family=\"sans-serif\" font-size=\"15\" font-weight=\"bold\" fill=\"#1d2a24\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">\u003ctext x=\"130\" y=\"72\">ア\u003c/text>\u003ctext x=\"92\" y=\"62\">イ\u003c/text>\u003ctext x=\"128\" y=\"115\">ウ\u003c/text>\u003ctext x=\"84\" y=\"115\">エ\u003c/text>\u003ctext x=\"136\" y=\"152\">ア\u003c/text>\u003ctext x=\"96\" y=\"160\">イ\u003c/text>\u003c/g>\u003cg font-family=\"sans-serif\" font-size=\"11\" fill=\"#1d2a24\">\u003ctext x=\"222\" y=\"88\">アルミはく\u003c/text>\u003cpath d=\"M232 92 L226 100\" stroke=\"#1d2a24\"/>\u003ctext x=\"214\" y=\"30\">白い部分＝ふ\u003c/text>\u003cpath d=\"M232 34 L205 60\" stroke=\"#1d2a24\"/>\u003c/g>\u003c/svg>", "kind": "judge", "level": 2, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q003", "koma": "chu2-seibutsu-08", "t": "choice", "q": "この実験で「光合成は葉の緑色の部分（葉緑体のある所）で行われる」と分かるのは、どことどこを比べたとき？", "choices": ["ア と イ", "ア と ウ", "ア と エ", "ウ と エ"], "ex": "アとイは光の条件が同じで、緑色（葉緑体）かどうかだけがちがう。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 200\" width=\"300\" height=\"200\">\u003crect width=\"300\" height=\"200\" fill=\"#fff\"/>\u003cdefs>\u003cclipPath id=\"lf\">\u003cpath d=\"M150 12 C230 40 250 120 150 188 C50 120 70 40 150 12Z\"/>\u003c/clipPath>\u003c/defs>\u003cg clip-path=\"url(#lf)\">\u003crect x=\"0\" y=\"0\" width=\"300\" height=\"200\" fill=\"#e9efe2\"/>\u003cpath d=\"M150 30 C205 55 212 118 150 168 C88 118 95 55 150 30Z\" fill=\"#5fae4a\"/>\u003crect x=\"60\" y=\"92\" width=\"190\" height=\"34\" fill=\"#b9bcc2\" opacity=\".9\"/>\u003c/g>\u003cpath d=\"M150 12 C230 40 250 120 150 188 C50 120 70 40 150 12Z\" fill=\"none\" stroke=\"#2b4a25\" stroke-width=\"2.5\"/>\u003cpath d=\"M150 12 V196\" stroke=\"#2b4a25\" stroke-width=\"1.5\"/>\u003cg font-family=\"sans-serif\" font-size=\"15\" font-weight=\"bold\" fill=\"#1d2a24\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">\u003ctext x=\"130\" y=\"72\">ア\u003c/text>\u003ctext x=\"92\" y=\"62\">イ\u003c/text>\u003ctext x=\"128\" y=\"115\">ウ\u003c/text>\u003ctext x=\"84\" y=\"115\">エ\u003c/text>\u003ctext x=\"136\" y=\"152\">ア\u003c/text>\u003ctext x=\"96\" y=\"160\">イ\u003c/text>\u003c/g>\u003cg font-family=\"sans-serif\" font-size=\"11\" fill=\"#1d2a24\">\u003ctext x=\"222\" y=\"88\">アルミはく\u003c/text>\u003cpath d=\"M232 92 L226 100\" stroke=\"#1d2a24\"/>\u003ctext x=\"214\" y=\"30\">白い部分＝ふ\u003c/text>\u003cpath d=\"M232 34 L205 60\" stroke=\"#1d2a24\"/>\u003c/g>\u003c/svg>", "kind": "judge", "level": 2, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q004", "koma": "chu2-seibutsu-08", "t": "choice", "q": "アとエを比べても、光と葉緑体のどちらが必要なのかは分からない。なぜ？", "choices": ["光と葉緑体の2つの条件がちがうから", "エには水がないから", "アとエは同じ葉だから", "エは色が変わらないから"], "ex": "比べる2か所は、ちがう条件を1つだけにする。2つちがうと原因を1つに決められない。", "kind": "judge", "level": 2, "fig": null, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q005", "koma": "chu2-seibutsu-08", "t": "choice", "q": "実験の前に、植物を暗い所に一晩置いたのはなぜ？", "choices": ["葉にもとからあったデンプンをなくすため", "光合成をさかんにするため", "葉の緑色をぬくため", "葉をやわらかくするため"], "ex": "暗い所では新しいデンプンはできず、もとからあった分がなくなる。あとで見つかるデンプンは実験中にできた物だと言える。", "kind": "method", "level": 2, "fig": null, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q006", "koma": "chu2-seibutsu-08", "t": "choice", "q": "葉を、あたためたエタノールにつけるのはなぜ？", "choices": ["葉の緑色をぬいて、ヨウ素液の色の変化を見やすくするため", "デンプンをふやすため", "葉緑体をふやすため", "葉に光を当てるため"], "ex": "緑色のままだと青紫色になったかが分かりにくい。エタノールで脱色する。", "kind": "method", "level": 1, "fig": null, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q007", "koma": "chu2-seibutsu-08", "t": "choice", "q": "光合成が行われる、植物の細胞の中にある緑色の粒を何という？", "choices": ["葉緑体", "核", "液胞", "細胞壁"], "ex": "光合成は細胞の中の葉緑体で行われる。", "kind": "term", "level": 1, "fig": null, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q008", "koma": "chu2-seibutsu-08", "t": "choice", "q": "ふ入りの葉の「ふ」（白い部分）について、正しいものは？", "choices": ["葉緑体がないので、光が当たっても光合成でデンプンができない", "光が当たらないので白くなっている", "葉緑体が多すぎて白く見える", "デンプンがたくさんたくわえられている"], "ex": "ふの部分の細胞には葉緑体がない。光が当たっても光合成はできない。", "kind": "judge", "level": 1, "fig": null, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q009", "koma": "chu2-seibutsu-08", "t": "choice", "q": "初めて見る葉。一晩暗い所に置いたあと、図のようにおおいをして日光に当て、脱色してヨウ素液につけた。青紫色になると考えられるのはどこ？", "choices": ["AとD", "Aだけ", "A、B、D", "CとD"], "ex": "緑色（葉緑体がある）で、しかも光が当たった所だけ。Bはおおい、Cはふなのでできない。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 170\" width=\"300\" height=\"170\">\u003crect width=\"300\" height=\"170\" fill=\"#fff\"/>\u003cdefs>\u003cclipPath id=\"l2\">\u003cpath d=\"M20 85 C60 10 220 10 285 85 C220 160 60 160 20 85Z\"/>\u003c/clipPath>\u003c/defs>\u003cg clip-path=\"url(#l2)\">\u003crect width=\"300\" height=\"170\" fill=\"#5fae4a\"/>\u003ccircle cx=\"210\" cy=\"60\" r=\"30\" fill=\"#e9efe2\"/>\u003crect x=\"90\" y=\"0\" width=\"50\" height=\"170\" fill=\"#b9bcc2\" opacity=\".92\"/>\u003c/g>\u003cpath d=\"M20 85 C60 10 220 10 285 85 C220 160 60 160 20 85Z\" fill=\"none\" stroke=\"#2b4a25\" stroke-width=\"2.5\"/>\u003cg font-family=\"sans-serif\" font-size=\"16\" font-weight=\"bold\" fill=\"#1d2a24\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">\u003ctext x=\"55\" y=\"92\">A\u003c/text>\u003ctext x=\"108\" y=\"92\">B\u003c/text>\u003ctext x=\"203\" y=\"66\">C\u003c/text>\u003ctext x=\"240\" y=\"112\">D\u003c/text>\u003c/g>\u003ctext x=\"150\" y=\"166\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"11\">灰色＝アルミはく　白＝ふ\u003c/text>\u003c/svg>", "kind": "judge", "level": 3, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q010", "koma": "chu2-seibutsu-08", "t": "choice", "q": "光を当てたオオカナダモの葉を脱色してヨウ素液をたらし、顕微鏡で見た。青紫色になっていたのはどこ？", "choices": ["細胞の中の葉緑体の粒", "細胞のまわりの細胞壁", "細胞の核", "細胞と細胞のすき間"], "ex": "デンプンは光合成が行われる葉緑体でつくられる。", "kind": "judge", "level": 2, "fig": null, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q011", "koma": "chu2-seibutsu-08", "t": "choice", "q": "もし「暗い所に一晩置く」を省いて同じ実験をしたら、どんな困ったことが起こりうる？", "choices": ["おおった部分にも、もとからのデンプンが残っていて青紫色になるかもしれない", "どの部分も緑色のままになる", "ヨウ素液が使えなくなる", "ふの部分に葉緑体ができる"], "ex": "もとからのデンプンが残ると、実験中に光合成でできたかどうかを区別できない。", "kind": "method", "level": 3, "fig": null, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q012", "koma": "chu2-seibutsu-08", "t": "order", "q": "ふ入りの葉を使った実験の手順を、正しい順に並べよう。", "items": ["植物を 暗い所に 一晩置く", "葉の一部を アルミはくで おおい、日光に当てる", "葉を 熱湯にひたしてから、あたためたエタノールで 脱色する", "ヨウ素液につけて 色の変化を見る"], "ex": "デンプンをなくす → 条件をつけて光合成 → 脱色 → ヨウ素液。", "kind": "method", "level": 1, "fig": null, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q013", "koma": "chu2-seibutsu-08", "t": "choice", "q": "日光がよく当たっていたのに、デンプンができていない所があった。考えられる理由は？", "choices": ["その部分には葉緑体がなかったから", "その部分には光が強すぎたから", "その部分は葉の先だったから", "その部分にはヨウ素液が多かったから"], "ex": "光合成には光と葉緑体の両方が必要。光が当たっていても、葉緑体がなければできない。", "kind": "judge", "level": 2, "fig": null, "game": "bio-starch-sonar"}, {"id": "chu2-bio-starch-sonar-q014", "koma": "chu2-seibutsu-08", "t": "choice", "q": "表は実験の結果。ここから言えることとして最も適切なものは？", "choices": ["光合成には、光と葉緑体の両方が必要", "光合成には、光だけが必要", "光合成には、葉緑体だけが必要", "光合成には、光も葉緑体も関係ない"], "ex": "アとウから光、アとイから葉緑体が必要と分かる。両方そろったアだけが青紫色。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 130\" width=\"300\" height=\"130\">\u003crect width=\"300\" height=\"130\" fill=\"#fff\"/>\u003cg font-family=\"sans-serif\" font-size=\"13\">\u003crect x=\"8\" y=\"8\" width=\"284\" height=\"114\" fill=\"none\" stroke=\"#2b2118\"/>\u003cpath d=\"M8 34 H292 M8 56 H292 M8 78 H292 M8 100 H292 M150 8 V122\" stroke=\"#2b2118\"/>\u003ctext x=\"20\" y=\"26\">葉の部分\u003c/text>\u003ctext x=\"160\" y=\"26\">ヨウ素液での色\u003c/text>\u003ctext x=\"20\" y=\"50\">ア 緑色・光あり\u003c/text>\u003ctext x=\"160\" y=\"50\" fill=\"#4b3a8c\" font-weight=\"bold\">青紫色\u003c/text>\u003ctext x=\"20\" y=\"72\">イ 白色(ふ)・光あり\u003c/text>\u003ctext x=\"160\" y=\"72\">変化なし\u003c/text>\u003ctext x=\"20\" y=\"94\">ウ 緑色・おおい\u003c/text>\u003ctext x=\"160\" y=\"94\">変化なし\u003c/text>\u003ctext x=\"20\" y=\"116\">エ 白色(ふ)・おおい\u003c/text>\u003ctext x=\"160\" y=\"116\">変化なし\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "bio-starch-sonar"}, {"id": "chu2-kisho-kazami-q001", "koma": "chu2-kisho-01", "t": "choice", "q": "上から見た図のように、ふき流しがなびいている。このときの風向は？", "choices": ["西の風", "東の風", "北の風", "南の風"], "ex": "ふき流しは風下（東）へなびく。風向は吹いてくる方位なので、その反対の西。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 240 190\">\u003crect width=\"240\" height=\"190\" fill=\"#f6f1e6\"/>\u003cg font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">\u003cline x1=\"200\" y1=\"54\" x2=\"200\" y2=\"26\" stroke=\"#1f1b16\" stroke-width=\"2\"/>\u003cpath d=\"M200 20 l-6 10 h12z\" fill=\"#c0392b\"/>\u003ctext x=\"200\" y=\"16\" fill=\"#c0392b\">北\u003c/text>\u003c/g>\u003ccircle cx=\"110\" cy=\"95\" r=\"6\" fill=\"#1f1b16\"/>\u003cpolygon points=\"110,109 132,107 132,83 110,81\" fill=\"#c0392b\" stroke=\"#1f1b16\" stroke-width=\"1.5\"/>\u003cpolygon points=\"132,107 155,105 155,85 132,83\" fill=\"#fff\" stroke=\"#1f1b16\" stroke-width=\"1.5\"/>\u003cpolygon points=\"155,105 178,103 178,87 155,85\" fill=\"#c0392b\" stroke=\"#1f1b16\" stroke-width=\"1.5\"/>\u003cpolygon points=\"178,103 200,101 200,89 178,87\" fill=\"#fff\" stroke=\"#1f1b16\" stroke-width=\"1.5\"/>\u003ctext x=\"110\" y=\"180\" font-size=\"13\" text-anchor=\"middle\">（上から見た図）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q002", "koma": "chu2-kisho-01", "t": "choice", "q": "えんとつのけむりが図のようにたなびいている。このときの風向は？", "choices": ["北東の風", "南西の風", "北西の風", "南東の風"], "ex": "けむりは南西へ流れている。風は反対の北東から吹いてくるので北東の風。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 240 190\">\u003crect width=\"240\" height=\"190\" fill=\"#f6f1e6\"/>\u003cg font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\">\u003cline x1=\"205\" y1=\"54\" x2=\"205\" y2=\"26\" stroke=\"#1f1b16\" stroke-width=\"2\"/>\u003cpath d=\"M205 20 l-6 10 h12z\" fill=\"#c0392b\"/>\u003ctext x=\"205\" y=\"16\" fill=\"#c0392b\">北\u003c/text>\u003c/g>\u003crect x=\"114\" y=\"89\" width=\"12\" height=\"12\" fill=\"#1f1b16\"/>\u003ccircle cx=\"120\" cy=\"95\" r=\"5\" fill=\"#5b544a\" opacity=\"0.55\"/>\u003ccircle cx=\"113\" cy=\"102\" r=\"7\" fill=\"#5b544a\" opacity=\"0.49\"/>\u003ccircle cx=\"106\" cy=\"109\" r=\"8\" fill=\"#5b544a\" opacity=\"0.44\"/>\u003ccircle cx=\"99\" cy=\"116\" r=\"10\" fill=\"#5b544a\" opacity=\"0.38\"/>\u003ccircle cx=\"92\" cy=\"123\" r=\"12\" fill=\"#5b544a\" opacity=\"0.33\"/>\u003ccircle cx=\"85\" cy=\"130\" r=\"14\" fill=\"#5b544a\" opacity=\"0.27\"/>\u003ccircle cx=\"78\" cy=\"137\" r=\"16\" fill=\"#5b544a\" opacity=\"0.21\"/>\u003ccircle cx=\"71\" cy=\"144\" r=\"17\" fill=\"#5b544a\" opacity=\"0.16\"/>\u003ccircle cx=\"63\" cy=\"152\" r=\"19\" fill=\"#5b544a\" opacity=\"0.10\"/>\u003ctext x=\"120\" y=\"182\" font-size=\"13\" text-anchor=\"middle\">えんとつのけむり（上から見た図）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q003", "koma": "chu2-kisho-01", "t": "num", "q": "風速4 m/s の風に乗って流れる風船は、5秒間で何m進む？（風船は空気といっしょに動くとする）", "ans": 20, "unit": "m", "tol": 0, "ex": "風速は空気が1秒あたりに進む距離。4 m × 5秒 ＝ 20 m。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q004", "koma": "chu2-kisho-01", "t": "choice", "q": "「南の風 3 m/s」のとき、空中に放したシャボン玉は1秒後にどこにある？（空気といっしょに動くとする）", "choices": ["はじめの位置から北へ約3 m", "はじめの位置から南へ約3 m", "はじめの位置から北へ約1 m", "はじめの位置から東へ約3 m"], "ex": "南の風は南から吹いてくるので、ものは北へ流される。1秒で3 m。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q005", "koma": "chu2-kisho-01", "t": "choice", "q": "風向の表し方として正しいものは？", "choices": ["風が吹いてくる方位で表す", "風が吹いていく方位で表す", "雲が動いていく方位で表す", "旗がなびく方位で表す"], "ex": "風向は観測地点に風が吹いてくる方位。旗がなびく向きはその反対になる。", "fig": null, "kind": "term", "level": 1, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q006", "koma": "chu2-kisho-01", "t": "choice", "q": "風速の意味として正しいものは？", "choices": ["空気が1秒あたりに進む距離", "空気が1分あたりに進む距離", "風が物をおす力の大きさ", "風が吹き続けた時間"], "ex": "風速はふつう m/s（メートル毎秒）で表し、空気が1秒で進む距離を示す。", "fig": null, "kind": "term", "level": 1, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q007", "koma": "chu2-kisho-01", "t": "choice", "q": "観測地点（中央）に、図の矢印のように空気が流れてきた。風向を16方位で答えると？", "choices": ["北北東", "南南西", "東北東", "北東"], "ex": "空気は北と北東のまん中の方位から吹いてきている。その方位が北北東。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 240 200\">\u003crect width=\"240\" height=\"200\" fill=\"#f6f1e6\"/>\u003ccircle cx=\"120\" cy=\"95\" r=\"80\" fill=\"none\" stroke=\"#9a917f\" stroke-dasharray=\"3 4\"/>\u003ctext x=\"120\" y=\"12\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b544a\">北\u003c/text>\u003ctext x=\"185\" y=\"38\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b544a\">北東\u003c/text>\u003ctext x=\"212\" y=\"100\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b544a\">東\u003c/text>\u003ctext x=\"185\" y=\"162\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b544a\">南東\u003c/text>\u003ctext x=\"120\" y=\"188\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b544a\">南\u003c/text>\u003ctext x=\"55\" y=\"162\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b544a\">南西\u003c/text>\u003ctext x=\"28\" y=\"100\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b544a\">西\u003c/text>\u003ctext x=\"55\" y=\"38\" font-size=\"12\" text-anchor=\"middle\" fill=\"#5b544a\">北西\u003c/text>\u003cline x1=\"151\" y1=\"21\" x2=\"125\" y2=\"82\" stroke=\"#2b4a6b\" stroke-width=\"5\"/>\u003cpolygon points=\"125,82 125,70 134,74\" fill=\"#2b4a6b\"/>\u003ccircle cx=\"120\" cy=\"95\" r=\"5\" fill=\"#1f1b16\"/>\u003ctext x=\"120\" y=\"195\" font-size=\"12\" text-anchor=\"middle\">矢印＝空気の流れ（観測地点は中央）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q008", "koma": "chu2-kisho-01", "t": "num", "q": "的まで2秒で届く矢がある。東の風 3 m/s のとき、矢は西へ何m流される？（矢は空気といっしょに流れるとする）", "ans": 6, "unit": "m", "tol": 0, "ex": "1秒に3 m流されるので、2秒では 3 × 2 ＝ 6 m。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q009", "koma": "chu2-kisho-01", "t": "choice", "q": "西北西の風 2 m/s。的まで1秒の矢で的の中心に当てるには、ねらいをどうずらす？（矢は空気といっしょに流れるとする）", "choices": ["西北西へ2 m", "東南東へ2 m", "西北西へ1 m", "東南東へ4 m"], "ex": "矢は風下の東南東へ2 m流される。だから風上の西北西へ2 mずらす。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q010", "koma": "chu2-kisho-01", "t": "order", "q": "校庭で風向と風速を調べる。正しい順に並べよう。", "items": ["建物や木から離れた、開けた場所に立つ", "方位磁針で北を確かめる", "ふき流しがなびく向きを見て、その反対の方位を風向とする", "風速計でしばらく測り、平均の値を記録する"], "ex": "建物のそばでは風が乱れる。方位を決めてから向きを読み、風速はゆれるので平均で記録する。", "fig": null, "kind": "method", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q011", "koma": "chu2-kisho-01", "t": "choice", "q": "表は、ある日の観測記録。タンポポの綿毛が空気といっしょに運ばれるとき、1秒間に最も遠くまで運ばれるのは何時？", "choices": ["12時", "9時", "15時", "どの時刻も同じ"], "ex": "1秒あたりに進む距離＝風速。風速が最も大きい12時（5 m/s）。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 260 130\" font-size=\"15\">\u003crect width=\"260\" height=\"130\" fill=\"#fff\"/>\u003cg stroke=\"#1f1b16\">\u003crect x=\"10\" y=\"10\" width=\"240\" height=\"110\" fill=\"none\" stroke-width=\"2\"/>\u003cline x1=\"10\" y1=\"37\" x2=\"250\" y2=\"37\"/>\u003cline x1=\"10\" y1=\"64\" x2=\"250\" y2=\"64\"/>\u003cline x1=\"10\" y1=\"92\" x2=\"250\" y2=\"92\"/>\u003cline x1=\"80\" y1=\"10\" x2=\"80\" y2=\"120\"/>\u003cline x1=\"170\" y1=\"10\" x2=\"170\" y2=\"120\"/>\u003c/g>\u003cg text-anchor=\"middle\">\u003ctext x=\"45\" y=\"29\" font-weight=\"700\">時刻\u003c/text>\u003ctext x=\"125\" y=\"29\" font-weight=\"700\">風向\u003c/text>\u003ctext x=\"210\" y=\"29\" font-weight=\"700\">風速\u003c/text>\u003ctext x=\"45\" y=\"56\">9時\u003c/text>\u003ctext x=\"125\" y=\"56\">北西\u003c/text>\u003ctext x=\"210\" y=\"56\">2 m/s\u003c/text>\u003ctext x=\"45\" y=\"83\">12時\u003c/text>\u003ctext x=\"125\" y=\"83\">南東\u003c/text>\u003ctext x=\"210\" y=\"83\">5 m/s\u003c/text>\u003ctext x=\"45\" y=\"111\">15時\u003c/text>\u003ctext x=\"125\" y=\"111\">南\u003c/text>\u003ctext x=\"210\" y=\"111\">3 m/s\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q012", "koma": "chu2-kisho-01", "t": "choice", "q": "「北の風」と「北へ吹く風」の関係は？", "choices": ["反対の向きの風", "同じ向きの風", "直角の向きの風", "強さがちがうだけの同じ向きの風"], "ex": "北の風は北から南へ吹く。北へ吹く風は南から北へ吹く（南の風）。向きが反対。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q013", "koma": "chu2-kisho-01", "t": "num", "q": "風速5 m/s の風で、空気が60 m進むのに何秒かかる？", "ans": 12, "unit": "秒", "tol": 0, "ex": "1秒で5 m進むので、60 ÷ 5 ＝ 12秒。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q014", "koma": "chu2-kisho-01", "t": "choice", "q": "図は、ある地点の天気図記号（天気は晴れ）。風向と風力の組み合わせは？", "choices": ["南西の風・風力3", "北東の風・風力3", "南西の風・風力4", "北東の風・風力2"], "ex": "矢は風が吹いてくる方位（南西）へのびる。矢羽根の数が風力で、3本なので風力3。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 190 120\">\u003crect width=\"190\" height=\"120\" fill=\"#f6f1e6\"/>\u003cline x1=\"60.0\" y1=\"60.0\" x2=\"24.4\" y2=\"95.6\" stroke=\"#1f1b16\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"24.4\" y1=\"95.6\" x2=\"4.7\" y2=\"90.4\" stroke=\"#1f1b16\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\u003cline x1=\"30.3\" y1=\"89.7\" x2=\"10.7\" y2=\"84.5\" stroke=\"#1f1b16\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\u003cline x1=\"36.2\" y1=\"83.8\" x2=\"16.6\" y2=\"78.6\" stroke=\"#1f1b16\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\u003ccircle cx=\"60.0\" cy=\"60.0\" r=\"12.0\" fill=\"#fff\" stroke=\"#1f1b16\" stroke-width=\"2.5\"/>\u003cline x1=\"60.0\" y1=\"48.0\" x2=\"60.0\" y2=\"72.0\" stroke=\"#1f1b16\" stroke-width=\"2\"/>\u003cg font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">\u003cline x1=\"160\" y1=\"40\" x2=\"160\" y2=\"14\" stroke=\"#1f1b16\" stroke-width=\"2\"/>\u003cpath d=\"M160 8 l-5 9 h10z\" fill=\"#c0392b\"/>\u003ctext x=\"160\" y=\"54\" fill=\"#c0392b\">北\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-kazami-q015", "koma": "chu2-kisho-01", "t": "choice", "q": "図の天気図記号の地点で、ふき流しはどの方位へなびいている？", "choices": ["南東", "北西", "北東", "南西"], "ex": "矢は北西へのびているので北西の風。風は北西から吹いてくるので、ふき流しは風下の南東へなびく。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 190 120\">\u003crect width=\"190\" height=\"120\" fill=\"#f6f1e6\"/>\u003cline x1=\"60.0\" y1=\"60.0\" x2=\"24.4\" y2=\"24.4\" stroke=\"#1f1b16\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003cline x1=\"24.4\" y1=\"24.4\" x2=\"29.6\" y2=\"4.7\" stroke=\"#1f1b16\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\u003cline x1=\"30.3\" y1=\"30.3\" x2=\"35.5\" y2=\"10.7\" stroke=\"#1f1b16\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\u003ccircle cx=\"60.0\" cy=\"60.0\" r=\"12.0\" fill=\"#fff\" stroke=\"#1f1b16\" stroke-width=\"2.5\"/>\u003cline x1=\"60.0\" y1=\"48.0\" x2=\"60.0\" y2=\"72.0\" stroke=\"#1f1b16\" stroke-width=\"2\"/>\u003cg font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\">\u003cline x1=\"160\" y1=\"40\" x2=\"160\" y2=\"14\" stroke=\"#1f1b16\" stroke-width=\"2\"/>\u003cpath d=\"M160 8 l-5 9 h10z\" fill=\"#c0392b\"/>\u003ctext x=\"160\" y=\"54\" fill=\"#c0392b\">北\u003c/text>\u003c/g>\u003c/svg>", "kind": "judge", "level": 2, "game": "kisho-kazami"}, {"id": "chu2-kisho-yukiwatari-q001", "koma": "chu2-kisho-02", "t": "choice", "q": "同じ直方体を、ア・イ・ウのように面を変えてスポンジに置いた。スポンジがいちばん深くへこむのはどれ？", "choices": ["ウ（いちばん小さい面を下）", "ア（いちばん大きい面を下）", "イ（まん中の面を下）", "どれも同じ"], "ex": "物体の重さ（力）はどれも同じ。ふれる面積がいちばん小さいウが、面積あたりの力が大きく深くへこむ。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" font-family=\"sans-serif\">\u003crect x=\"5\" y=\"80\" width=\"90\" height=\"22\" rx=\"3\" fill=\"#f3d36b\" stroke=\"#8a6d1f\"/>\u003crect x=\"10\" y=\"62\" width=\"80\" height=\"18\" fill=\"#c0694a\" stroke=\"#6b2f1e\"/>\u003ctext x=\"50\" y=\"118\" text-anchor=\"middle\" font-size=\"13\">ア\u003c/text>\u003crect x=\"105\" y=\"80\" width=\"90\" height=\"22\" rx=\"3\" fill=\"#f3d36b\" stroke=\"#8a6d1f\"/>\u003crect x=\"130\" y=\"40\" width=\"40\" height=\"40\" fill=\"#c0694a\" stroke=\"#6b2f1e\"/>\u003ctext x=\"150\" y=\"118\" text-anchor=\"middle\" font-size=\"13\">イ\u003c/text>\u003crect x=\"205\" y=\"80\" width=\"90\" height=\"22\" rx=\"3\" fill=\"#f3d36b\" stroke=\"#8a6d1f\"/>\u003crect x=\"240\" y=\"0\" width=\"20\" height=\"80\" fill=\"#c0694a\" stroke=\"#6b2f1e\"/>\u003ctext x=\"250\" y=\"118\" text-anchor=\"middle\" font-size=\"13\">ウ\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q002", "koma": "chu2-kisho-02", "t": "choice", "q": "同じ直方体を、置く面を変えてスポンジにのせる。直方体にはたらく重力の大きさはどうなる？", "choices": ["どの面を下にしても変わらない", "小さい面を下にすると大きくなる", "大きい面を下にすると大きくなる", "置き方によって毎回ちがう"], "ex": "重力の大きさは物体の質量で決まり、置き方では変わらない。変わるのはふれる面積。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q003", "koma": "chu2-kisho-02", "t": "choice", "q": "Aさん（体重 400 N）は、ふつうの靴の4倍の面積のかんじきをはく。Bさん（体重 300 N）はふつうの靴。雪に深く沈むのはどちら？", "choices": ["Bさん：面積あたりの力が大きいから", "Aさん：体重が大きいから", "Aさん：かんじきをはくと重くなるから", "同じ：どちらも人だから"], "ex": "Aは400を4倍の面積で受けるので、面積あたりは100。Bは300をそのまま受ける。Bの方が面積あたりの力が大きい。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q004", "koma": "chu2-kisho-02", "t": "choice", "q": "スポンジの実験で「力は同じで、面積だけを変える」比べ方になっているのはどれ？", "choices": ["水を入れたペットボトルを、底を下にしたときとキャップを下にしたときで比べる", "ペットボトル1本と2本を、どちらもキャップを下にして比べる", "空のペットボトルと水入りのペットボトルを、底を下とキャップを下で比べる", "ペットボトルを手で強くおしたときと弱くおしたときで比べる"], "ex": "同じペットボトルなら力は同じ。向きを変えるとふれる面積だけが変わる。変える条件は1つだけにする。", "fig": null, "kind": "method", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q005", "koma": "chu2-kisho-02", "t": "choice", "q": "スポンジの実験で「面積は同じで、力だけを変える」には、どう比べればよい？", "choices": ["底を下にしたペットボトルを、1本のときと2本重ねたときで比べる", "底を下にしたときとキャップを下にしたときで比べる", "1本でキャップを下にしたときと、2本重ねて底を下にしたときで比べる", "スポンジを大きいものにかえて比べる"], "ex": "向きをそろえれば面積は同じ。本数を変えると力だけが変わる。", "fig": null, "kind": "method", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q006", "koma": "chu2-kisho-02", "t": "choice", "q": "物体がスポンジをおす力を2倍にし、ふれる面積も2倍にした。へこみ方はどうなる？", "choices": ["変わらない", "2倍深くなる", "半分になる", "4倍深くなる"], "ex": "面積あたりの力は「2倍÷2倍」で変わらない。だからへこみ方も変わらない。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q007", "koma": "chu2-kisho-02", "t": "choice", "q": "ふれる面積を変えずに、スポンジをおす力を3倍にした。へこみ方はどうなる？", "choices": ["深くなる", "浅くなる", "変わらない"], "ex": "面積が同じなら、力が大きいほど面積あたりの力が大きくなり、深くへこむ。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q008", "koma": "chu2-kisho-02", "t": "choice", "q": "面を垂直におす力の、単位面積あたりの大きさを何という？", "choices": ["圧力", "重力", "摩擦力", "弾性力"], "ex": "圧力は、力の大きさと力がはたらく面積に関係する量。", "fig": null, "kind": "term", "level": 1, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q009", "koma": "chu2-kisho-02", "t": "choice", "q": "画びょうの先がとがっているのはなぜ？", "choices": ["ふれる面積を小さくして、面をおすはたらきを大きくするため", "ふれる面積を大きくして、面をおすはたらきを小さくするため", "画びょうを軽くするため", "指がおす力の大きさを大きくするため"], "ex": "指でおす力は同じでも、先の面積が小さいと面積あたりの力が大きくなり、かべにささる。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q010", "koma": "chu2-kisho-02", "t": "choice", "q": "スキー板をはくと、雪に沈みにくいのはなぜ？", "choices": ["雪にふれる面積が大きく、面積あたりの力が小さくなるから", "スキー板をはくと体重が軽くなるから", "スキー板が雪をとかすから", "雪をおす力が大きくなるから"], "ex": "体重（力）は同じでも、面積が大きいと面積あたりの力が小さくなる。かんじきも同じしくみ。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q011", "koma": "chu2-kisho-02", "t": "num", "q": "表は、同じ物体で同じ力をかけ、ふれる面積だけを変えたときのへこみ。面積を 80 cm² にすると、へこみは何 mm と考えられる？", "ans": 1.5, "unit": "mm", "tol": 0.1, "ex": "面積が2倍になるごとにへこみは半分。40 cm²で3 mmなので、80 cm²では1.5 mm。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 110\" font-family=\"sans-serif\">\u003crect width=\"280\" height=\"110\" fill=\"#fff\"/>\u003cg stroke=\"#1f2a44\">\u003crect x=\"5\" y=\"5\" width=\"270\" height=\"100\" fill=\"none\" stroke-width=\"2\"/>\u003cline x1=\"5\" y1=\"38\" x2=\"275\" y2=\"38\"/>\u003cline x1=\"5\" y1=\"71\" x2=\"275\" y2=\"71\"/>\u003cline x1=\"95\" y1=\"5\" x2=\"95\" y2=\"105\"/>\u003cline x1=\"155\" y1=\"5\" x2=\"155\" y2=\"105\"/>\u003cline x1=\"215\" y1=\"5\" x2=\"215\" y2=\"105\"/>\u003c/g>\u003cg text-anchor=\"middle\" font-size=\"14\">\u003ctext x=\"50\" y=\"27\" font-weight=\"700\">ふれる面積\u003c/text>\u003ctext x=\"125\" y=\"27\">10 cm²\u003c/text>\u003ctext x=\"185\" y=\"27\">20 cm²\u003c/text>\u003ctext x=\"245\" y=\"27\">40 cm²\u003c/text>\u003ctext x=\"50\" y=\"60\" font-weight=\"700\">へこみ\u003c/text>\u003ctext x=\"125\" y=\"60\">12 mm\u003c/text>\u003ctext x=\"185\" y=\"60\">6 mm\u003c/text>\u003ctext x=\"245\" y=\"60\">3 mm\u003c/text>\u003ctext x=\"140\" y=\"94\" font-size=\"12\">（どれも同じ物体・同じ力でおした）\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q012", "koma": "chu2-kisho-02", "t": "choice", "q": "A：60 N の力を 30 cm² で受ける。B：40 N の力を 10 cm² で受ける。1 cm² あたりの力が大きいのはどちら？", "choices": ["B", "A", "同じ"], "ex": "Aは60÷30＝2 N、Bは40÷10＝4 N。力が小さいBの方が、面積あたりでは大きい。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q013", "koma": "chu2-kisho-02", "t": "order", "q": "「面積とへこみ方の関係」を調べる実験。正しい順に並べよう。", "items": ["水を入れたペットボトルを、底を下にしてスポンジに置く", "へこんだ深さを定規で測る", "同じペットボトルを、キャップを下にしてスポンジに置く", "へこんだ深さを測り、2つを比べる"], "ex": "力（同じペットボトル）はそろえ、面積だけを変えて、それぞれのへこみを測ってから比べる。", "fig": null, "kind": "method", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-yukiwatari-q014", "koma": "chu2-kisho-02", "t": "choice", "q": "同じ直方体をA・Bのように置いた。スポンジのへこみ方はどうなる？", "choices": ["Bの方が深い", "Aの方が深い", "同じ"], "ex": "Aは力2こ分を広い面（せまい面の4倍）で受けるので2÷4＝0.5。Bは力1こ分をせまい面で受けるので1÷1＝1。Bの方が面積あたりの力が大きく、深くへこむ。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 130\" font-family=\"sans-serif\">\u003crect x=\"10\" y=\"95\" width=\"120\" height=\"22\" rx=\"3\" fill=\"#f3d36b\" stroke=\"#8a6d1f\"/>\u003crect x=\"30\" y=\"55\" width=\"80\" height=\"20\" fill=\"#7aa0c4\" stroke=\"#1f2a44\"/>\u003crect x=\"30\" y=\"75\" width=\"80\" height=\"20\" fill=\"#7aa0c4\" stroke=\"#1f2a44\"/>\u003ctext x=\"70\" y=\"128\" text-anchor=\"middle\" font-size=\"14\">A：2こ重ねて、広い面を下\u003c/text>\u003crect x=\"150\" y=\"95\" width=\"120\" height=\"22\" rx=\"3\" fill=\"#f3d36b\" stroke=\"#8a6d1f\"/>\u003crect x=\"200\" y=\"15\" width=\"20\" height=\"80\" fill=\"#7aa0c4\" stroke=\"#1f2a44\"/>\u003ctext x=\"210\" y=\"128\" text-anchor=\"middle\" font-size=\"14\">B：1こ、せまい面を下\u003c/text>\u003ctext x=\"140\" y=\"12\" text-anchor=\"middle\" font-size=\"11\">同じ直方体（広い面の面積はせまい面の4倍）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-yukiwatari"}, {"id": "chu2-kisho-kori-kenchiku-q001", "koma": "chu2-kisho-03", "t": "num", "q": "質量 3 kg の本を、面積 0.06 m² の面を下にして机に置いた。本が机をおす圧力は何 Pa？（100 g の物体にはたらく重力を 1 N とする）", "ans": 500, "unit": "Pa", "tol": 0, "ex": "3 kg → 30 N。30 N ÷ 0.06 m² ＝ 500 Pa。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q002", "koma": "chu2-kisho-03", "t": "num", "q": "質量 2 kg の物体を、10 cm × 20 cm の面を下にして置いた。圧力は何 Pa？（100 g で 1 N）", "ans": 1000, "unit": "Pa", "tol": 0, "ex": "力 20 N。面積 200 cm² ＝ 0.02 m²。20 ÷ 0.02 ＝ 1000 Pa。cm² のまま割らない。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q003", "koma": "chu2-kisho-03", "t": "num", "q": "質量 60 kg の人が、片足 150 cm² の靴で両足で立っている。床が受ける圧力は何 Pa？（100 g で 1 N）", "ans": 20000, "unit": "Pa", "tol": 0, "ex": "力 600 N。面積 150×2＝300 cm²＝0.03 m²。600 ÷ 0.03 ＝ 20000 Pa。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q004", "koma": "chu2-kisho-03", "t": "choice", "q": "床をおす圧力を半分にしたい。正しい方法は？", "choices": ["力はそのままで、ふれる面積を2倍にする", "力はそのままで、ふれる面積を半分にする", "力も面積も2倍にする", "力を2倍にして、面積はそのままにする"], "ex": "圧力＝力÷面積。面積を2倍にすると圧力は半分。力も面積も2倍なら変わらない。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q005", "koma": "chu2-kisho-03", "t": "choice", "q": "面をおす力を2倍にし、ふれる面積を4倍にした。圧力はどうなる？", "choices": ["半分になる", "2倍になる", "変わらない", "8倍になる"], "ex": "2倍 ÷ 4倍 ＝ 0.5倍。圧力は半分になる。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q006", "koma": "chu2-kisho-03", "t": "choice", "q": "1 Pa（パスカル）はどんな圧力？", "choices": ["1 m² あたりに 1 N の力がはたらくときの圧力", "1 cm² あたりに 1 N の力がはたらくときの圧力", "1 m² あたりに 1 kg の物がのるときの圧力", "1 m あたりに 1 N の力がはたらくときの圧力"], "ex": "Pa ＝ N/m²。面積は m² で考える。", "fig": null, "kind": "term", "level": 1, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q007", "koma": "chu2-kisho-03", "t": "num", "q": "図の直方体を、圧力がいちばん大きくなる向きで置いた。圧力は何 Pa？", "ans": 4000, "unit": "Pa", "tol": 0, "ex": "いちばん小さい面ウ（10×5＝50 cm²＝0.005 m²）を下に。20 N ÷ 0.005 m² ＝ 4000 Pa。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 150\" font-family=\"sans-serif\">\u003crect width=\"280\" height=\"150\" fill=\"#f7fcff\"/>\u003cg stroke=\"#12324a\" stroke-width=\"1.5\">\u003cpath d=\"M60 110 L200 110 L240 80 L100 80 Z\" fill=\"#e6f3fa\"/>\u003cpath d=\"M60 110 L200 110 L200 135 L60 135 Z\" fill=\"#cfe8f5\"/>\u003cpath d=\"M200 110 L240 80 L240 105 L200 135 Z\" fill=\"#a7d2ea\"/>\u003c/g>\u003cg font-size=\"13\" text-anchor=\"middle\" fill=\"#12324a\">\u003ctext x=\"130\" y=\"148\">20 cm\u003c/text>\u003ctext x=\"236\" y=\"126\">10 cm\u003c/text>\u003ctext x=\"44\" y=\"126\">5 cm\u003c/text>\u003c/g>\u003ctext x=\"140\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" fill=\"#12324a\">質量 2 kg の直方体（100 gで1 N）\u003c/text>\u003ctext x=\"140\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" fill=\"#46697f\">面ア 20×10　面イ 20×5　面ウ 10×5（cm）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q008", "koma": "chu2-kisho-03", "t": "num", "q": "図の直方体で、面アを下にしたときの圧力は、面ウを下にしたときの何倍？", "ans": 0.25, "unit": "倍", "tol": 0.01, "ex": "力は同じ。面アは 200 cm²、面ウは 50 cm²で、面積が4倍なので圧力は 1/4 ＝ 0.25倍。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 150\" font-family=\"sans-serif\">\u003crect width=\"280\" height=\"150\" fill=\"#f7fcff\"/>\u003cg stroke=\"#12324a\" stroke-width=\"1.5\">\u003cpath d=\"M60 110 L200 110 L240 80 L100 80 Z\" fill=\"#e6f3fa\"/>\u003cpath d=\"M60 110 L200 110 L200 135 L60 135 Z\" fill=\"#cfe8f5\"/>\u003cpath d=\"M200 110 L240 80 L240 105 L200 135 Z\" fill=\"#a7d2ea\"/>\u003c/g>\u003cg font-size=\"13\" text-anchor=\"middle\" fill=\"#12324a\">\u003ctext x=\"130\" y=\"148\">20 cm\u003c/text>\u003ctext x=\"236\" y=\"126\">10 cm\u003c/text>\u003ctext x=\"44\" y=\"126\">5 cm\u003c/text>\u003c/g>\u003ctext x=\"140\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" fill=\"#12324a\">質量 2 kg の直方体（100 gで1 N）\u003c/text>\u003ctext x=\"140\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" fill=\"#46697f\">面ア 20×10　面イ 20×5　面ウ 10×5（cm）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q009", "koma": "chu2-kisho-03", "t": "choice", "q": "雪上車やブルドーザーにキャタピラ（無限軌道）がついているのはなぜ？", "choices": ["地面にふれる面積を大きくして、圧力を小さくするため", "車体を軽くするため", "地面をおす力を大きくするため", "ふれる面積を小さくして、圧力を大きくするため"], "ex": "重さ（力）は同じでも、面積が大きいと圧力が小さくなり、やわらかい地面に沈みにくい。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q010", "koma": "chu2-kisho-03", "t": "num", "q": "圧力が 5000 Pa をこえると割れる板がある。板の上に置く台の、板にふれる面積は 0.4 m²。台と荷物の重さを合わせて何 N までのせられる？", "ans": 2000, "unit": "N", "tol": 0, "ex": "力 ＝ 圧力 × 面積 ＝ 5000 × 0.4 ＝ 2000 N。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q011", "koma": "chu2-kisho-03", "t": "num", "q": "重さ 1200 N の物を置くとき、圧力を 3000 Pa 以下にしたい。ふれる面積は何 m² 以上にすればよい？", "ans": 0.4, "unit": "m²", "tol": 0.001, "ex": "面積 ＝ 力 ÷ 圧力 ＝ 1200 ÷ 3000 ＝ 0.4 m²。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q012", "koma": "chu2-kisho-03", "t": "order", "q": "圧力が小さい順に並べよう。", "items": ["100 N を 1 m² で受ける", "200 N を 0.5 m² で受ける", "50 N を 0.05 m² で受ける", "500 N を 0.2 m² で受ける"], "ex": "それぞれ 100 Pa、400 Pa、1000 Pa、2500 Pa。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q013", "koma": "chu2-kisho-03", "t": "num", "q": "1 hPa（ヘクトパスカル）は何 Pa？", "ans": 100, "unit": "Pa", "tol": 0, "ex": "h（ヘクト）は100倍を表す。気圧はふつう hPa で表す。", "fig": null, "kind": "term", "level": 1, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q014", "koma": "chu2-kisho-03", "t": "choice", "q": "同じれんがを、置く面を変えてスポンジにのせる。置く面によって変わるものは？", "choices": ["スポンジが受ける圧力", "れんがにはたらく重力の大きさ", "れんがの質量", "れんががスポンジをおす力の大きさ"], "ex": "おす力（重力）は同じ。変わるのはふれる面積なので、圧力が変わる。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kori-kenchiku-q015", "koma": "chu2-kisho-03", "t": "choice", "q": "机の上に置いた直方体が机をおす圧力を求めたい。測らなくてよいものは？", "choices": ["直方体の高さ（下の面に垂直な辺）", "直方体の質量", "下になる面のたての長さ", "下になる面の横の長さ"], "ex": "必要なのは力（質量から求める）と、下になる面の面積（たて×横）。高さは関係しない。", "fig": null, "kind": "method", "level": 2, "game": "kisho-kori-kenchiku"}, {"id": "chu2-kisho-kuki-tsumiki-q001", "koma": "chu2-kisho-04", "t": "num", "q": "空気をつめたスプレー缶から、空気を 3 L 出した。缶の質量はおよそ何 g 減る？（空気 1 L の質量を 1.2 g とする）", "ans": 3.6, "unit": "g", "tol": 0.05, "ex": "1 L で 1.2 g なので、3 L では 1.2 × 3 ＝ 3.6 g 減る。空気にも重さがある。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q002", "koma": "chu2-kisho-04", "t": "choice", "q": "空の圧力容器に、自転車の空気入れで空気をたくさん入れた。容器全体の質量はどうなる？", "choices": ["入れる前より大きくなる", "変わらない", "入れる前より小さくなる"], "ex": "空気にも質量がある。空気を押しこむと、そのぶん質量が大きくなる。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q003", "koma": "chu2-kisho-04", "t": "choice", "q": "スプレー缶から出した空気の体積を測る方法として、適切なものは？", "choices": ["水を満たしたメスシリンダーを水そうにさかさに立て、その中に空気を集める", "缶を水に入れて、うくかどうかを見る", "缶をふって、音の大きさを聞く", "缶を温めて、缶の大きさを測る"], "ex": "水上置換のように水と入れかえて集めると、出した空気の体積が目盛りで読める。", "fig": null, "kind": "method", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q004", "koma": "chu2-kisho-04", "t": "order", "q": "大気圧が大きい順に並べよう。", "items": ["海岸の砂浜", "標高 1000 m の高原", "富士山の頂上", "上空 10 km を飛ぶ飛行機の外"], "ex": "高い所ほど、その上にある空気が少ないので大気圧は小さい。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q005", "koma": "chu2-kisho-04", "t": "choice", "q": "地上で口を閉じたお菓子の袋が、高い山の上でぱんぱんにふくらんだ。その理由は？", "choices": ["まわりの大気圧が小さくなり、袋の中の空気がおし返す力のほうが大きくなったから", "山の上は気温が高く、袋の中の空気が温められたから", "山の上では袋の中の空気の重さがふえたから", "山の上は空気が多いから"], "ex": "袋の中は地上の気圧のまま。外の大気圧が小さいので、内側からおす力がまさってふくらむ。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q006", "koma": "chu2-kisho-04", "t": "choice", "q": "大気圧とは何か。正しいものは？", "choices": ["空気の重さによって生じる圧力", "空気が動くことで生じる力", "太陽の熱によって生じる圧力", "地面が空気をおし上げる力"], "ex": "地球をとりまく空気の重さによる圧力が大気圧。", "fig": null, "kind": "term", "level": 1, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q007", "koma": "chu2-kisho-04", "t": "choice", "q": "少しの水を入れて熱した空き缶を、口を下にして水に入れたら、ぐしゃっとつぶれた。正しい説明は？", "choices": ["中の水蒸気が水になって気体がへり、まわりのあらゆる向きから大気圧におされた", "中の気体がへり、上からだけ大気圧におされた", "中の水蒸気がふくらんで、缶を内側からこわした", "水そうの水の重さだけでつぶされた"], "ex": "大気圧はあらゆる向きからはたらく。中からおし返す気体がへると、全体からおされてつぶれる。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q008", "koma": "chu2-kisho-04", "t": "num", "q": "海面付近の大気圧（1気圧）は、約何 hPa？", "ans": 1013, "unit": "hPa", "tol": 13, "ex": "1気圧は約 1013 hPa（約 10万 Pa）。", "fig": null, "kind": "term", "level": 1, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q009", "koma": "chu2-kisho-04", "t": "num", "q": "大気圧が 1013 hPa（101300 Pa）のとき、1 m² の面が大気からおされる力は約何 N？", "ans": 101300, "unit": "N", "tol": 1500, "ex": "力 ＝ 圧力 × 面積 ＝ 101300 Pa × 1 m² ＝ 約 101300 N（約10万 N）。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q010", "koma": "chu2-kisho-04", "t": "choice", "q": "グラフは、高さと気圧の関係。高さ約 5.5 km の気圧はおよそいくら？", "choices": ["約 500 hPa", "約 1000 hPa", "約 250 hPa", "約 750 hPa"], "ex": "5 km で約 540、6 km で約 470。そのあいだなので約 500 hPa（地上の約半分）。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 280 200\" font-family=\"sans-serif\">\u003crect width=\"280\" height=\"200\" fill=\"#fff\"/>\u003cline x1=\"40\" y1=\"170\" x2=\"260\" y2=\"170\" stroke=\"#e6ddd0\"/>\u003ctext x=\"36\" y=\"174\" font-size=\"10\" text-anchor=\"end\">0\u003c/text>\u003cline x1=\"40\" y1=\"132\" x2=\"260\" y2=\"132\" stroke=\"#e6ddd0\"/>\u003ctext x=\"36\" y=\"136\" font-size=\"10\" text-anchor=\"end\">250\u003c/text>\u003cline x1=\"40\" y1=\"95\" x2=\"260\" y2=\"95\" stroke=\"#e6ddd0\"/>\u003ctext x=\"36\" y=\"99\" font-size=\"10\" text-anchor=\"end\">500\u003c/text>\u003cline x1=\"40\" y1=\"58\" x2=\"260\" y2=\"58\" stroke=\"#e6ddd0\"/>\u003ctext x=\"36\" y=\"62\" font-size=\"10\" text-anchor=\"end\">750\u003c/text>\u003cline x1=\"40\" y1=\"20\" x2=\"260\" y2=\"20\" stroke=\"#e6ddd0\"/>\u003ctext x=\"36\" y=\"24\" font-size=\"10\" text-anchor=\"end\">1000\u003c/text>\u003cline x1=\"40\" y1=\"170\" x2=\"260\" y2=\"170\" stroke=\"#4a3526\"/>\u003cline x1=\"40\" y1=\"20\" x2=\"40\" y2=\"170\" stroke=\"#4a3526\"/>\u003cpath d=\"M40 18 L62 35 L84 51 L106 65 L128 78 L150 89 L172 99 L194 108 L216 117 L238 124 L260 130\" fill=\"none\" stroke=\"#3d7fb0\" stroke-width=\"3\"/>\u003ctext x=\"40\" y=\"184\" font-size=\"10\" text-anchor=\"middle\">0\u003c/text>\u003ctext x=\"84\" y=\"184\" font-size=\"10\" text-anchor=\"middle\">2\u003c/text>\u003ctext x=\"128\" y=\"184\" font-size=\"10\" text-anchor=\"middle\">4\u003c/text>\u003ctext x=\"172\" y=\"184\" font-size=\"10\" text-anchor=\"middle\">6\u003c/text>\u003ctext x=\"216\" y=\"184\" font-size=\"10\" text-anchor=\"middle\">8\u003c/text>\u003ctext x=\"260\" y=\"184\" font-size=\"10\" text-anchor=\"middle\">10\u003c/text>\u003ctext x=\"150\" y=\"197\" font-size=\"11\" text-anchor=\"middle\">高さ（km）\u003c/text>\u003ctext x=\"8\" y=\"14\" font-size=\"11\">気圧（hPa）\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q011", "koma": "chu2-kisho-04", "t": "choice", "q": "空気の層を、積み重ねた箱と考える。下から3段目の箱の底をおす強さを決めるものは？", "choices": ["その段と、それより上にある空気の重さ", "その段より下にある空気の重さ", "地面の近くにある空気の重さだけ", "空気には重さがないので、どの段も0"], "ex": "ある高さの気圧は、その上に積み重なっている空気の重さで決まる。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q012", "koma": "chu2-kisho-04", "t": "num", "q": "圧力容器に空気を 5 L 押しこんだ。容器全体の質量はおよそ何 g ふえる？（空気 1 L ＝ 1.2 g）", "ans": 6, "unit": "g", "tol": 0.05, "ex": "1.2 g × 5 ＝ 6 g ふえる。", "fig": null, "kind": "calc", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q013", "koma": "chu2-kisho-04", "t": "choice", "q": "高い山に登るほど大気圧が小さくなるのはなぜ？", "choices": ["その場所より上にある空気の量が少なくなるから", "空気が冷たくなって重くなるから", "太陽に近づくから", "風が弱くなるから"], "ex": "大気圧はその上にある空気の重さによる。高い所ほど上にある空気が少ない。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q014", "koma": "chu2-kisho-04", "t": "order", "q": "空気 1 L の質量を調べる実験。正しい順に並べよう。", "items": ["空気をつめたスプレー缶の質量をはかる", "水の中のメスシリンダーに、空気を 1 L 移す", "もう一度、スプレー缶の質量をはかる", "はじめとあとの質量の差を求める"], "ex": "出す前と後の質量の差が、出した空気（1 L）の質量になる。", "fig": null, "kind": "method", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kuki-tsumiki-q015", "koma": "chu2-kisho-04", "t": "choice", "q": "水を満たしたコップに厚紙でふたをして、さかさにしても水が落ちない。おもな理由は？", "choices": ["大気圧が、下から厚紙をおしているから", "厚紙が水をすいこんでくっつくから", "コップの中では重力がはたらかないから", "水の重さが大気圧より大きいから"], "ex": "大気圧は上だけでなく下からもはたらく（あらゆる向き）。下からおす力が水を支える。", "fig": null, "kind": "judge", "level": 2, "game": "kisho-kuki-tsumiki"}, {"id": "chu2-kisho-kan-3d-q001", "koma": "chu2-kisho-05", "t": "choice", "q": "空き缶の中の空気を減らすと、缶がつぶれた。缶をつぶした大気圧は、どの向きから働いていた？", "choices": ["上・横・下の あらゆる向きから、外から缶の面を押した", "上からだけ押した", "横からだけ押した", "缶の内がわから外へ押した"], "ex": "大気圧は空気にふれている あらゆる面に、外から垂直に働く。中の空気が減ると外からの押しが勝つ。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q002", "koma": "chu2-kisho-05", "t": "choice", "q": "図のように、たてのガラスに吸盤がくっついている。吸盤がはなれない理由として正しいものは？", "choices": ["吸盤とガラスの間の空気が少なく、まわりの空気が吸盤をガラスへ押しつけているから", "吸盤の中の空気がガラスを引っぱっているから", "ガラスが吸盤を吸いこんでいるから", "大気圧は上から働くので、吸盤を下へ押さえているから"], "ex": "吸いついた面の側には空気がほとんど無い。まわりの大気圧が吸盤をガラスに押しつける。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 140\" font-size=\"11\">\u003cdefs>\u003cmarker id=\"h\" markerWidth=\"6\" markerHeight=\"6\" refX=\"3\" refY=\"3\" orient=\"auto\">\u003cpath d=\"M0,0L6,3L0,6z\" fill=\"#c8352b\"/>\u003c/marker>\u003c/defs>\u003crect x=\"40\" y=\"10\" width=\"10\" height=\"120\" fill=\"#bfe3ee\" stroke=\"#1f2f4a\"/>\u003ctext x=\"8\" y=\"136\">ガラス\u003c/text>\u003cpath d=\"M50 30 Q60 30 70 45 Q95 58 100 70 Q95 82 70 95 Q60 110 50 110Z\" fill=\"#e98b86\" stroke=\"#1f2f4a\" stroke-width=\"2\"/>\u003crect x=\"100\" y=\"64\" width=\"26\" height=\"12\" fill=\"#e3a82b\" stroke=\"#1f2f4a\"/>\u003ctext x=\"120\" y=\"28\">吸盤（横から見た図）\u003c/text>\u003c/svg>", "kind": "judge", "level": 2, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q003", "koma": "chu2-kisho-05", "t": "choice", "q": "図のように、天井のガラスに下から吸盤をつけると落ちなかった。吸盤を支えている大気圧は、主にどの向きに吸盤を押している？", "choices": ["下から上へ（ガラスに向かって）", "上から下へ", "横からだけ", "大気圧はここでは働いていない"], "ex": "大気圧はあらゆる向きから働く。下にある空気が吸盤を上向きにガラスへ押しつける。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 120\" font-size=\"11\">\u003crect x=\"20\" y=\"10\" width=\"180\" height=\"10\" fill=\"#bfe3ee\" stroke=\"#1f2f4a\"/>\u003ctext x=\"150\" y=\"36\">天井のガラス\u003c/text>\u003cpath d=\"M70 20 Q70 30 85 40 Q98 60 110 64 Q122 60 135 40 Q150 30 150 20Z\" fill=\"#e98b86\" stroke=\"#1f2f4a\" stroke-width=\"2\"/>\u003crect x=\"104\" y=\"64\" width=\"12\" height=\"22\" fill=\"#e3a82b\" stroke=\"#1f2f4a\"/>\u003c/svg>", "kind": "judge", "level": 2, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q004", "koma": "chu2-kisho-05", "t": "choice", "q": "次のうち、大気圧（気圧）が関係しているできごとはどれ？", "choices": ["ストローで飲み物を吸い上げる", "冷たいコップの表面に水滴がつく", "うちわで風を送ると炭火が赤くなる", "スポンジでコップを洗う"], "ex": "ストローの中の空気を減らすと、まわりの大気圧が飲み物の表面を押して、飲み物が上がってくる。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q005", "koma": "chu2-kisho-05", "t": "choice", "q": "水をいっぱいに入れたコップに厚紙をのせ、手で押さえて逆さにしてから手をはなしても、厚紙は落ちなかった。厚紙を支えているものは？", "choices": ["下から厚紙を押し上げる大気圧", "水が厚紙を引っぱる力", "厚紙の重さ", "上から厚紙を押す大気圧"], "ex": "大気圧は下からも働く。下の空気が厚紙を上向きに押している。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q006", "koma": "chu2-kisho-05", "t": "choice", "q": "図のように、ふたを閉めた空のペットボトルをベルジャーに入れ、ベルジャーの中の空気を抜いた。ペットボトルはどうなる？", "choices": ["あらゆる向きに少しふくらむ", "上の方だけふくらむ", "あらゆる向きからへこむ", "何も変わらない"], "ex": "まわりの気圧が下がると、中の空気が押す力のほうが大きくなり、あらゆる向きに押し広げる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 160\" font-size=\"11\">\u003cpath d=\"M50 140 V50 Q50 15 110 15 Q170 15 170 50 V140\" fill=\"#e6f4f8\" stroke=\"#1f2f4a\" stroke-width=\"2\"/>\u003crect x=\"40\" y=\"140\" width=\"140\" height=\"8\" fill=\"#1f2f4a\"/>\u003crect x=\"95\" y=\"70\" width=\"30\" height=\"66\" rx=\"6\" fill=\"#8fc7c2\" stroke=\"#1f2f4a\" stroke-width=\"2\"/>\u003crect x=\"102\" y=\"58\" width=\"16\" height=\"12\" fill=\"#1f5fa8\" stroke=\"#1f2f4a\"/>\u003cpath d=\"M180 144 H205 V100\" fill=\"none\" stroke=\"#1f2f4a\" stroke-width=\"3\"/>\u003ctext x=\"170\" y=\"94\">空気を抜く\u003c/text>\u003ctext x=\"60\" y=\"34\">ベルジャー\u003c/text>\u003ctext x=\"128\" y=\"110\">ふたを閉めた\u003c/text>\u003ctext x=\"128\" y=\"123\">ペットボトル\u003c/text>\u003c/svg>", "kind": "judge", "level": 2, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q007", "koma": "chu2-kisho-05", "t": "choice", "q": "ふたを開けたままの空き缶は、まわりから大気圧を受けているのに、つぶれない。その理由は？", "choices": ["缶の内がわにも空気があり、外と同じ大きさの大気圧で押し返しているから", "缶のまわりには大気圧が働いていないから", "大気圧は上からしか働かないから", "缶の中の空気が重いから"], "ex": "内がわと外がわで同じ大きさの大気圧が働くので、差し引きで つぶそうとする押しにならない。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q008", "koma": "chu2-kisho-05", "t": "choice", "q": "空き缶を大気圧でつぶす実験で、缶に少しの水を入れて加熱し、湯気を十分に出してから冷やすのはなぜ？", "choices": ["湯気で中の空気を追い出し、冷やして水蒸気を水にもどすことで、缶の中の気圧を下げるため", "缶をやわらかくするため", "缶の中の空気を増やすため", "缶の中の水を重くするため"], "ex": "水蒸気が水にもどると体積がとても小さくなり、缶の中の気圧が下がって外の大気圧に押される。", "kind": "method", "level": 2, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q009", "koma": "chu2-kisho-05", "t": "order", "q": "空き缶を大気圧でつぶす実験（先生が見せる実験）の手順を、正しい順にならべよう。", "items": ["缶に少しの水を入れる", "加熱して、口から湯気を十分に出す", "火を止め、トングで缶をはさむ", "缶の口を下にして冷たい水につける"], "ex": "先に湯気で空気を追い出してから、口を水でふさぐように冷やすと、中の気圧が下がる。", "kind": "method", "level": 1, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q010", "koma": "chu2-kisho-05", "t": "num", "q": "大気圧を1013hPaとする。1hPa＝100Paである。面積1m²の面を大気圧が押す力は何Nか。", "ans": 101300, "unit": "N", "tol": 100, "ex": "1013hPa＝101300Pa＝1m²あたり101300N。1m²ならその力がそのまま働く。", "kind": "calc", "level": 2, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q011", "koma": "chu2-kisho-05", "t": "num", "q": "大気圧を1000hPa（100000Pa）とする。面積0.001m²（10cm²）の吸盤の面を、大気圧が押す力は何Nか。", "ans": 100, "unit": "N", "tol": 1, "ex": "力＝圧力×面積＝100000Pa×0.001m²＝100N。", "kind": "calc", "level": 3, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q012", "koma": "chu2-kisho-05", "t": "choice", "q": "同じ缶で、中の空気を「半分くらい抜いたとき」と「ほとんど抜いたとき」を比べた。正しいものは？", "choices": ["ほとんど抜いたほうが、あらゆる向きから強く押されて大きくつぶれる", "半分抜いたほうが、大きくつぶれる", "どちらも同じようにつぶれる", "ほとんど抜くと、上の面だけがへこむ"], "ex": "中の気圧が下がるほど外との差が大きくなり、あらゆる向きの押しがいっせいに強まる。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q013", "koma": "chu2-kisho-05", "t": "choice", "q": "中の空気を抜いて、つるした密閉容器がある。この容器に働く大気圧の向きを正しく表した図は？", "choices": ["イ（すべての面に、外から面に垂直に押す矢印）", "ア（上の面にだけ、下向きの矢印）", "ウ（すべての面に、内がわから外へ向かう矢印）", "エ（底の面にだけ、上向きの矢印）"], "ex": "大気圧は、空気にふれている あらゆる面に、外から面に垂直に働く。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 110\">\u003cdefs>\u003cmarker id=\"h\" markerWidth=\"6\" markerHeight=\"6\" refX=\"3\" refY=\"3\" orient=\"auto\">\u003cpath d=\"M0,0L6,3L0,6z\" fill=\"#c8352b\"/>\u003c/marker>\u003c/defs>\u003cg transform=\"translate(0 10)\">\u003crect x=\"15\" y=\"20\" width=\"40\" height=\"40\" fill=\"#c9ccd0\" stroke=\"#1f2f4a\" stroke-width=\"2\"/>\u003ctext x=\"30\" y=\"92\" font-size=\"13\">ア\u003c/text>\u003cpath d=\"M35 0V16\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003c/g>\u003cg transform=\"translate(82 10)\">\u003crect x=\"15\" y=\"20\" width=\"40\" height=\"40\" fill=\"#c9ccd0\" stroke=\"#1f2f4a\" stroke-width=\"2\"/>\u003ctext x=\"30\" y=\"92\" font-size=\"13\">イ\u003c/text>\u003cpath d=\"M35 0V16\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003cpath d=\"M35 80V64\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003cpath d=\"M-5 40H11\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003cpath d=\"M75 40H59\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003c/g>\u003cg transform=\"translate(164 10)\">\u003crect x=\"15\" y=\"20\" width=\"40\" height=\"40\" fill=\"#c9ccd0\" stroke=\"#1f2f4a\" stroke-width=\"2\"/>\u003ctext x=\"30\" y=\"92\" font-size=\"13\">ウ\u003c/text>\u003cpath d=\"M35 18V2\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003cpath d=\"M35 62V78\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003cpath d=\"M13 40H-3\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003cpath d=\"M57 40H73\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003c/g>\u003cg transform=\"translate(246 10)\">\u003crect x=\"15\" y=\"20\" width=\"40\" height=\"40\" fill=\"#c9ccd0\" stroke=\"#1f2f4a\" stroke-width=\"2\"/>\u003ctext x=\"30\" y=\"92\" font-size=\"13\">エ\u003c/text>\u003cpath d=\"M35 80V64\" stroke=\"#c8352b\" stroke-width=\"2.5\" marker-end=\"url(#h)\" fill=\"none\"/>\u003c/g>\u003c/svg>", "kind": "graph", "level": 1, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kan-3d-q014", "koma": "chu2-kisho-05", "t": "choice", "q": "山の頂上で、ふもとで買ったお菓子の袋がぱんぱんにふくらんでいた。正しい説明は？", "choices": ["まわりの気圧が低くなり、袋の中の空気が外へ押し広げる力のほうが大きくなったから", "山の上では大気圧が高くなるから", "山の上の空気が袋の中に入りこんだから", "山の上では袋が重くなるから"], "ex": "まわりの大気圧が小さくなると、中の空気の押しが勝って、あらゆる向きにふくらむ。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kan-3d"}, {"id": "chu2-kisho-kiatsu-dive-q001", "koma": "chu2-kisho-06", "t": "choice", "q": "同じ日・同じ時刻に、4つの地点で気圧を測った（表）。いちばん標高が高いと考えられる地点は？", "choices": ["C（795hPa）", "B（1004hPa）", "A（902hPa）", "D（951hPa）"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" font-size=\"12\">\u003cg font-weight=\"700\">\u003crect x=\"5\" y=\"5\" width=\"290\" height=\"22\" fill=\"#dbe7f2\"/>\u003ctext x=\"15\" y=\"21\">地点\u003c/text>\u003ctext x=\"80\" y=\"21\">A\u003c/text>\u003ctext x=\"130\" y=\"21\">B\u003c/text>\u003ctext x=\"180\" y=\"21\">C\u003c/text>\u003ctext x=\"230\" y=\"21\">D\u003c/text>\u003c/g>\u003ctext x=\"15\" y=\"48\">気圧\u003c/text>\u003ctext x=\"68\" y=\"48\">902hPa\u003c/text>\u003ctext x=\"118\" y=\"48\">1004hPa\u003c/text>\u003ctext x=\"168\" y=\"48\">795hPa\u003c/text>\u003ctext x=\"218\" y=\"48\">951hPa\u003c/text>\u003ctext x=\"15\" y=\"75\" font-size=\"10\">同じ日・同じ時刻に測定\u003c/text>\u003c/svg>", "ex": "高いところほど上にある空気が少なく、気圧は小さい。いちばん値が小さいCがいちばん高い。", "kind": "graph", "level": 1, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q002", "koma": "chu2-kisho-06", "t": "choice", "q": "高いところほど気圧が小さくなるのは、なぜか。", "choices": ["高いところほど、その上にある空気の量が少ないから", "高いところほど、太陽に近くて暖かいから", "高いところほど、風が強いから", "高いところほど、空気が重くなるから"], "ex": "気圧は上にある空気の重さによる。上にある空気が少ないほど小さい。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q003", "koma": "chu2-kisho-06", "t": "choice", "q": "高さと気圧の関係を表したグラフとして、もっとも適切なものは？（たて軸が高さ、横軸が気圧）", "choices": ["ウ（高くなるほど気圧が小さくなる）", "ア（高さに比例して気圧が大きくなる）", "イ（高くなるほど気圧が大きくなる）", "エ（高さによらず気圧は同じ）"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 130\" font-size=\"10\">\u003cg transform=\"translate(0 0)\">\u003cpath d=\"M10 10 V112 H100\" fill=\"none\" stroke=\"#0f2340\" stroke-width=\"1.5\"/>\u003cpath d=\"M12 105 L98 22\" fill=\"none\" stroke=\"#e2453c\" stroke-width=\"3\"/>\u003ctext x=\"50\" y=\"126\" text-anchor=\"middle\" font-size=\"12\">ア\u003c/text>\u003ctext x=\"12\" y=\"8\">高さ↑\u003c/text>\u003ctext x=\"66\" y=\"108\">気圧→\u003c/text>\u003c/g>\u003cg transform=\"translate(84 0)\">\u003cpath d=\"M10 10 V112 H100\" fill=\"none\" stroke=\"#0f2340\" stroke-width=\"1.5\"/>\u003cpath d=\"M12 105 Q70 100 98 20\" fill=\"none\" stroke=\"#e2453c\" stroke-width=\"3\"/>\u003ctext x=\"50\" y=\"126\" text-anchor=\"middle\" font-size=\"12\">イ\u003c/text>\u003ctext x=\"12\" y=\"8\">高さ↑\u003c/text>\u003ctext x=\"66\" y=\"108\">気圧→\u003c/text>\u003c/g>\u003cg transform=\"translate(168 0)\">\u003cpath d=\"M10 10 V112 H100\" fill=\"none\" stroke=\"#0f2340\" stroke-width=\"1.5\"/>\u003cpath d=\"M98 108 Q25 100 14 18\" fill=\"none\" stroke=\"#e2453c\" stroke-width=\"3\"/>\u003ctext x=\"50\" y=\"126\" text-anchor=\"middle\" font-size=\"12\">ウ\u003c/text>\u003ctext x=\"12\" y=\"8\">高さ↑\u003c/text>\u003ctext x=\"66\" y=\"108\">気圧→\u003c/text>\u003c/g>\u003cg transform=\"translate(252 0)\">\u003cpath d=\"M10 10 V112 H100\" fill=\"none\" stroke=\"#0f2340\" stroke-width=\"1.5\"/>\u003cpath d=\"M12 62 L98 62\" fill=\"none\" stroke=\"#e2453c\" stroke-width=\"3\"/>\u003ctext x=\"50\" y=\"126\" text-anchor=\"middle\" font-size=\"12\">エ\u003c/text>\u003ctext x=\"12\" y=\"8\">高さ↑\u003c/text>\u003ctext x=\"66\" y=\"108\">気圧→\u003c/text>\u003c/g>\u003c/svg>", "ex": "高いほど上にある空気が少なく、気圧は小さい（地上に近いほど減り方が大きい）。", "kind": "graph", "level": 2, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q004", "koma": "chu2-kisho-06", "t": "choice", "q": "同じ学校で3日間、気圧を測ると、グラフのように少しずつ下がった。学校の標高は変わっていない。考えられることは？", "choices": ["天気（大気のようす）が変わり、同じ地点でも気圧が変化した", "学校が少しずつ高くなった", "気圧計は時間がたつと必ず小さい値になる", "測る人がちがうと、必ず値が下がる"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 130\" font-size=\"10\">\u003cpath d=\"M30 10 V110 H290\" fill=\"none\" stroke=\"#0f2340\"/>\u003ctext x=\"2\" y=\"20\">1015\u003c/text>\u003ctext x=\"2\" y=\"60\">1005\u003c/text>\u003ctext x=\"2\" y=\"100\">995\u003c/text>\u003cpath d=\"M30 26 L70 30 L110 40 L150 56 L190 76 L230 92 L270 100\" fill=\"none\" stroke=\"#2f6fd6\" stroke-width=\"3\"/>\u003ctext x=\"40\" y=\"124\">1日目朝\u003c/text>\u003ctext x=\"140\" y=\"124\">2日目\u003c/text>\u003ctext x=\"240\" y=\"124\">3日目\u003c/text>\u003ctext x=\"150\" y=\"20\">同じ学校で測った気圧\u003c/text>\u003c/svg>", "ex": "同じ地点でも、天気の変化にともなって気圧は時間とともに変わる。", "kind": "graph", "level": 2, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q005", "koma": "chu2-kisho-06", "t": "choice", "q": "携帯気圧計を持ってエレベーターで1階から10階へ上がった。気圧計の値はどうなる？", "choices": ["小さくなる", "大きくなる", "変わらない", "上がると大きく、止まると元にもどる"], "ex": "高いところほど上の空気が少ないので、気圧は小さくなる。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q006", "koma": "chu2-kisho-06", "t": "choice", "q": "ふもとで買ったお菓子の袋を持って山に登ると、山頂で袋がふくらんでいた。正しい説明は？", "choices": ["山頂ではまわりの気圧が小さく、袋の中の空気が押し広げる力のほうが大きくなったから", "山頂ではまわりの気圧が大きくなったから", "山頂の空気が袋の中に入りこんだから", "山頂では袋が温められたから"], "ex": "まわりの気圧が小さくなると、袋の中の空気の押しが勝ち、ふくらむ。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q007", "koma": "chu2-kisho-06", "t": "choice", "q": "山頂で飲みきったペットボトルのふたを閉め、そのまま ふもとへ下りた。ボトルはどうなる？", "choices": ["へこむ", "ふくらむ", "変わらない", "ふたが外れる"], "ex": "ふもとはまわりの気圧が大きいので、中の空気（山頂の空気）より外からの押しが強くなり、へこむ。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q008", "koma": "chu2-kisho-06", "t": "num", "q": "地上付近では、高さが10m上がるごとに気圧は約1hPa小さくなる。地上で1010hPaのとき、高さ100mのビルの屋上では約何hPaか。", "ans": 1000, "unit": "hPa", "tol": 1, "ex": "100mで約10hPa小さくなるので、1010−10＝1000hPa。", "kind": "calc", "level": 2, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q009", "koma": "chu2-kisho-06", "t": "num", "q": "高さ約1500mでの気圧は約850hPaである。海面の気圧を1013hPaとすると、その差は何hPaか。", "ans": 163, "unit": "hPa", "tol": 1, "ex": "1013−850＝163hPa。高くなるほど気圧は小さくなる。", "kind": "calc", "level": 1, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q010", "koma": "chu2-kisho-06", "t": "choice", "q": "上空約5500mの気圧は約500hPaである。海面（約1013hPa）と比べると、およそどれくらい？", "choices": ["約半分", "約2倍", "ほぼ同じ", "約10分の1"], "ex": "5500mでは上にある空気が海面の約半分になり、気圧も約半分になる。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q011", "koma": "chu2-kisho-06", "t": "choice", "q": "携帯気圧計で「高さによる気圧のちがい」を調べたい。よい方法はどれ？", "choices": ["高さのちがう地点を、同じ日のできるだけ短い時間のうちに続けて測る", "1日に1地点ずつ、何日もかけて測る", "1つの地点だけで、何回も測る", "地点ごとに別の気圧計を使い、別の日に測る"], "ex": "気圧は天気で時間とともに変わる。高さのちがいだけを比べるには、時間をあけずに測る。", "kind": "method", "level": 3, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q012", "koma": "chu2-kisho-06", "t": "order", "q": "次の場所を、気圧が大きい順にならべよう（同じ日・同じ時刻とする）。", "items": ["海岸（標高0m）", "町（標高500m）", "山小屋（標高2000m）", "山頂（標高3000m）"], "ex": "標高が低いほど上にある空気が多く、気圧が大きい。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q013", "koma": "chu2-kisho-06", "t": "choice", "q": "ふだん私たちの体は大気圧に押されているのに、つぶれない。その理由として正しいものは？", "choices": ["体の中からも同じくらいの大きさで押し返しているから", "大気圧は地上では0だから", "大気圧は上からしか働かないから", "体が空気より軽いから"], "ex": "大気圧はあらゆる向きから働き、体の中からも押し返すので、差し引きで つぶれない。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kiatsu-dive-q014", "koma": "chu2-kisho-06", "t": "choice", "q": "登山口で高さを合わせた高度計（気圧から高さを出すしくみ）が、山頂でいつもより高い値を示した。山頂の本当の高さは変わらない。何が起きたと考えられる？", "choices": ["天気が変わり、気圧が下がってきた", "気圧が上がってきた", "山が高くなった", "高度計の電池が増えた"], "ex": "高度計は気圧が小さいほど高いと表示する。気圧が下がると、同じ場所でも高く表示される。", "kind": "judge", "level": 3, "fig": null, "game": "kisho-kiatsu-dive"}, {"id": "chu2-kisho-kansokujo-q001", "koma": "chu2-kisho-07", "t": "choice", "q": "気温を正しく測る場所として、もっとも適切なものは？", "choices": ["地上約1.5mの高さの、風通しのよい日かげ", "地面に近い、日当たりのよい所", "日当たりのよい窓ぎわの教室の中", "屋上の、日光がよく当たる手すりの上"], "ex": "日光や地面の照り返しの影響を受けないよう、地上約1.5mの風通しのよい日かげで測る。", "kind": "method", "level": 1, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q002", "koma": "chu2-kisho-07", "t": "choice", "q": "百葉箱が白くぬられているのはなぜか。", "choices": ["日光をはね返して、箱の中が熱くなるのを防ぐため", "遠くからでも見つけやすくするため", "雨をはじいて、中をぬらさないため", "白いと温度計の目盛りが読みやすいため"], "ex": "白は日光をよくはね返すので、箱自体が温まりにくく、中の気温を正しく測れる。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q003", "koma": "chu2-kisho-07", "t": "choice", "q": "百葉箱の扉が北向きについているのはなぜか。", "choices": ["扉を開けたとき、直射日光が中の温度計に当たらないようにするため", "北風を中に入れて冷やすため", "北の空の雲を観測するため", "扉が南向きだと重くて開けにくいため"], "ex": "日本では太陽は南の空を通るので、北向きの扉なら開けても日光が入りにくい。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q004", "koma": "chu2-kisho-07", "t": "choice", "q": "「晴れた日に、気温が何時ごろいちばん高くなるか」を調べたい。観測の間隔と期間として、もっとも適切なものは？", "choices": ["1時間ごとに、朝から夕方までの1日", "1日1回、1か月間", "3時間ごとに、昼の1時間だけ", "1分ごとに、1年間"], "ex": "1日の中の変化を調べるので、期間は1日。最高になる時刻が分かるよう、1時間ごとくらいの細かさで測る。", "kind": "method", "level": 2, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q005", "koma": "chu2-kisho-07", "t": "choice", "q": "「寒冷前線が通るとき、気温がどう変わるか」を調べたい。観測の計画として、もっとも適切なものは？", "choices": ["前線が通りそうな前後の2〜3日間、10分〜1時間ごとに、自記温度計やアメダスで とぎれず記録する", "晴れた日に、1時間ごとに1日だけ測る", "1日1回、前線が通った日の翌朝に測る", "前線が通った後の1時間だけ、1分ごとに測る"], "ex": "いつ通るかはっきりしないので期間は前後を含めて長めに。急な変化の時刻が分かるよう細かい間隔で連続して記録する。", "kind": "method", "level": 3, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q006", "koma": "chu2-kisho-07", "t": "choice", "q": "「季節によって、1日の最高気温がどう変わるか」を調べたい。適切な計画は？", "choices": ["毎日の最高気温を、数か月以上 記録する", "1日だけ、10分ごとに記録する", "1週間だけ、朝に1回記録する", "同じ日に、場所を変えて何か所も測る"], "ex": "季節の変化を見るには長い期間が必要。毎日の最高気温を数か月以上ならべる。", "kind": "method", "level": 2, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q007", "koma": "chu2-kisho-07", "t": "choice", "q": "グラフは、校庭で1時間ごとに測った気温の記録である。不自然な値をふくむ時刻と、その理由として考えられるものは？", "choices": ["13時（温度計に日光が直接当たった）", "13時（その時刻だけ気温が本当に10℃以上上がった）", "6時（朝なので温度計が冷えていた）", "18時（夕方は温度計がくるう）"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 150\" font-size=\"10\">\u003crect x=\"34\" y=\"16\" width=\"256\" height=\"110\" fill=\"#fff\" stroke=\"#23324a\"/>\u003cline x1=\"34\" x2=\"290\" y1=\"126.0\" y2=\"126.0\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"129.0\" text-anchor=\"end\">10\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"107.7\" y2=\"107.7\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"110.7\" text-anchor=\"end\">15\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"89.3\" y2=\"89.3\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"92.3\" text-anchor=\"end\">20\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"71.0\" y2=\"71.0\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"74.0\" text-anchor=\"end\">25\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"52.7\" y2=\"52.7\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"55.7\" text-anchor=\"end\">30\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"34.3\" y2=\"34.3\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"37.3\" text-anchor=\"end\">35\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"16.0\" y2=\"16.0\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"19.0\" text-anchor=\"end\">40\u003c/text>\u003ctext x=\"34.0\" y=\"138\" text-anchor=\"middle\">6\u003c/text>\u003ctext x=\"76.7\" y=\"138\" text-anchor=\"middle\">8\u003c/text>\u003ctext x=\"119.3\" y=\"138\" text-anchor=\"middle\">10\u003c/text>\u003ctext x=\"162.0\" y=\"138\" text-anchor=\"middle\">12\u003c/text>\u003ctext x=\"204.7\" y=\"138\" text-anchor=\"middle\">14\u003c/text>\u003ctext x=\"247.3\" y=\"138\" text-anchor=\"middle\">16\u003c/text>\u003ctext x=\"290.0\" y=\"138\" text-anchor=\"middle\">18\u003c/text>\u003ctext x=\"2\" y=\"11\">℃\u003c/text>\u003ctext x=\"290\" y=\"148\" text-anchor=\"end\">時\u003c/text>\u003cpolyline fill=\"none\" stroke=\"#c9302c\" stroke-width=\"2.5\" points=\"34.0,111.3 55.3,109.9 76.7,105.8 98.0,100.0 119.3,93.0 140.7,86.0 162.0,80.2 183.3,34.3 204.7,74.7 226.0,75.4 247.3,78.3 268.7,82.4 290.0,87.5\"/>\u003ccircle cx=\"34.0\" cy=\"111.3\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"55.3\" cy=\"109.9\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"76.7\" cy=\"105.8\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"98.0\" cy=\"100.0\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"119.3\" cy=\"93.0\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"140.7\" cy=\"86.0\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"162.0\" cy=\"80.2\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"183.3\" cy=\"34.3\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"204.7\" cy=\"74.7\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"226.0\" cy=\"75.4\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"247.3\" cy=\"78.3\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"268.7\" cy=\"82.4\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"290.0\" cy=\"87.5\" r=\"3\" fill=\"#c9302c\"/>\u003ctext x=\"150.0\" y=\"11\" text-anchor=\"middle\" font-weight=\"700\">校庭で1時間ごとに測った気温の記録\u003c/text>\u003c/svg>", "ex": "前後の時刻とくらべて13時だけが極端に高い。日光が温度計に当たるなど、測り方の問題が考えられる。", "kind": "graph", "level": 2, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q008", "koma": "chu2-kisho-07", "t": "choice", "q": "日なたの地面の近くで気温を測ると、どうなると考えられるか。", "choices": ["日光や地面の照り返しで、本当の気温より高く出る", "本当の気温より低く出る", "本当の気温と同じになる", "湿度が測れるようになる"], "ex": "温度計自体が日光で温められたり、熱くなった地面の影響を受けたりするので、高く出る。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q009", "koma": "chu2-kisho-07", "t": "choice", "q": "自記温度計を使うよい点はどれか。", "choices": ["夜や休みの日も、とぎれずに気温を記録し続けられる", "ふつうの温度計より、必ず高い値が出る", "日なたに置いても正しい気温が測れる", "湿度と気圧も同時に測れる"], "ex": "自記温度計は回る円筒の記録紙にペンで気温を書き続けるので、データの連続性を補える。", "kind": "term", "level": 1, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q010", "koma": "chu2-kisho-07", "t": "choice", "q": "アメダスについて正しいものはどれか。", "choices": ["気象庁が全国約1300か所に置いた自動の観測所で、その記録を使える", "学校ごとに置かれた百葉箱のこと", "人工衛星から雲を写したもの", "天気図に使う記号のこと"], "ex": "アメダス（地域気象観測システム）は全国約1300か所の自動観測所。降水量や気温・風などを記録している。", "kind": "term", "level": 1, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q011", "koma": "chu2-kisho-07", "t": "choice", "q": "グラフは、ある晴れた日の校庭の気温である。気温がもっとも高くなったのは何時ごろか。", "choices": ["14時ごろ", "12時ごろ", "6時ごろ", "18時ごろ"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 150\" font-size=\"10\">\u003crect x=\"34\" y=\"16\" width=\"256\" height=\"110\" fill=\"#fff\" stroke=\"#23324a\"/>\u003cline x1=\"34\" x2=\"290\" y1=\"126.0\" y2=\"126.0\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"129.0\" text-anchor=\"end\">10\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"98.5\" y2=\"98.5\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"101.5\" text-anchor=\"end\">15\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"71.0\" y2=\"71.0\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"74.0\" text-anchor=\"end\">20\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"43.5\" y2=\"43.5\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"46.5\" text-anchor=\"end\">25\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"16.0\" y2=\"16.0\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"19.0\" text-anchor=\"end\">30\u003c/text>\u003ctext x=\"34.0\" y=\"138\" text-anchor=\"middle\">6\u003c/text>\u003ctext x=\"76.7\" y=\"138\" text-anchor=\"middle\">8\u003c/text>\u003ctext x=\"119.3\" y=\"138\" text-anchor=\"middle\">10\u003c/text>\u003ctext x=\"162.0\" y=\"138\" text-anchor=\"middle\">12\u003c/text>\u003ctext x=\"204.7\" y=\"138\" text-anchor=\"middle\">14\u003c/text>\u003ctext x=\"247.3\" y=\"138\" text-anchor=\"middle\">16\u003c/text
