$('bwSkip').onclick=()=>{sfx.tap();startRush()};

/* ---------- ボスラッシュ ---------- */
const BOSS_HP=100;
let B=null;
function startRush(){G.rushIdx=0;G.rushAll=true;if(!G.bosses.length)return finish();nextBoss()}
function bossTop(){
  const u=UBY[B.unit];
  $('bossTop').innerHTML=`<div class="arena" style="--uc:${u.color}"><div class="bname"><small>ボス ${G.rushIdx+1} / ${G.bosses.length}　${esc(u.name)}</small>${esc(u.boss)}</div>
   <div class="hp"><s style="width:${B.hp}%"></s><i style="width:${B.hp}%"></i></div>
   <span class="bfig" id="bfig">${BOSSFIG[u.id]||'👾'}</span>
   <div class="phase">${['知識の段','操作の段','説明の段'].map((p,i)=>`<span class="${i===B.phase?'on':i<B.phase?'done':''}">${p}</span>`).join('')}</div>
   <div class="hearts">${'❤️'.repeat(Math.max(B.hearts,0))}${'🖤'.repeat(Math.max(0,3-B.hearts))}</div><div class="bmsg" id="bmsg">${esc(B.msg||'')}</div></div>`;
  $('bossTop').classList.remove('hidden');
}
function setHp(v){B.hp=Math.max(0,v);const a=$('bossTop').querySelector('.hp i'),s=$('bossTop').querySelector('.hp s');if(a)a.style.width=B.hp+'%';if(s)s.style.width=B.hp+'%'}
function hitBoss(dmg,crit){
  const f=$('bfig');if(f){f.classList.remove('hit');void f.offsetWidth;f.classList.add('hit')}
  const [x,y]=f?centerOf(f):[innerWidth/2,200];
  setHp(B.hp-dmg);floaty((crit?'CRITICAL! ':'')+'-'+dmg,x,y,crit?'#ff4d5e':'#fff');
  burst(x,y,[UBY[B.unit].color,'#fff','#ffc93c'],crit?50:22,crit?11:7,crit?'star':'dot');
  crit?(sfx.crit(),flash(),shakeScr()):sfx.hit();
}
function hurt(){B.hearts--;sfx.hurt();flash(true);shakeScr();bossTop()}
function bossPool(unit,kind){let p=G.pool.filter(q=>KBY[q.koma]&&KBY[q.koma].unit===unit);if(kind){const k=p.filter(kind);if(k.length)p=k}return p}
async function nextBoss(){
  const unit=G.bosses[G.rushIdx];
  B={unit,hp:BOSS_HP,phase:0,hearts:3,msg:'',used:new Set()};
  $('plabel').textContent='👾 ボスラッシュ';show('play');$('prog').innerHTML='';
  $('qarea').innerHTML=`<div class="center" style="padding:24px 0"><div style="font-size:15px;color:var(--dim)">ボス ${G.rushIdx+1} / ${G.bosses.length}</div><div style="font-size:30px;font-weight:900;margin:6px 0">${esc(UBY[unit].boss)} が あらわれた！</div></div>`;
  bossTop();sfx.hurt();await sleep(1200);
  await bossFight();
}
async function bossAsk(q,phaseName){
  B.used.add(q.id);B.msg=phaseName;bossTop();const r=await ask(prepQ(q));record(q,r,'boss');
  return r;
}
function nextQ(pool){const c=pool.filter(q=>!B.used.has(q.id));const src=c.length?c:pool;return src.map(q=>({q,s:prio(q,null)})).sort((a,b)=>b.s-a.s)[0].q}
async function bossFight(){
  // 1. 知識の段: HP 100 → 55
  const know=bossPool(B.unit);
  while(B.hp>55){
    if(B.hearts<=0)return lose();
    const q=nextQ(know);const r=await bossAsk(q,'知識の段：正解でこうげき！');
    if(r.ok){const crit=G.combo>=3&&Math.random()<.5;hitBoss(crit?20:13+Math.min(G.combo,4),crit)}else hurt();
    await feedback(q,r);
  }
  if(B.hearts<=0)return lose();
  // 2. 操作の段: ミニ課題 → なければ並べ替え → なければスピード3連
  B.phase=1;B.msg='操作の段：決めれば大ダメージ！';bossTop();await sleep(400);
  const ok=await operation();
  if(B.hearts<=0)return lose();
  hitBoss(ok?30:10,ok);await sleep(700);
  // 3. 説明の段: なぜそうなるか（judge）でとどめ
  B.phase=2;bossTop();
  const why=bossPool(B.unit,q=>q.kind==='judge');
  while(B.hp>0){
    if(B.hearts<=0)return lose();
    const q=nextQ(why);const r=await bossAsk(q,'説明の段：「なぜ？」に答えてとどめ！');
    if(r.ok){const crit=G.combo>=3;hitBoss(Math.min(B.hp,crit?22:15),crit)}else hurt();
    await feedback(q,r);
  }
  await defeat();
}
async function operation(){
  const m=pickMini(B.unit);
  if(m)return runMini(m,true);
  const ord=bossPool(B.unit,q=>q.t==='order').filter(q=>!B.used.has(q.id));
  if(ord.length){const q=nextQ(ord);const r=await bossAsk(q,'操作の段：正しい順に並べろ！');if(!r.ok)hurt();await feedback(q,r);return r.ok}
  // スピード3連（25秒で3問）
  B.msg='操作の段：25秒で3問連続正解！';bossTop();
  const qs=[];const pool=bossPool(B.unit).filter(q=>q.t==='choice');for(let i=0;i<3&&pool.length;i++){const q=nextQ(pool);qs.push(q);B.used.add(q.id)}
  if(!qs.length)return true;
  const end=Date.now()+25000;let allOk=true;
  const bar=document.createElement('div');bar.className='timer';bar.innerHTML='<i></i>';$('bossTop').querySelector('.arena').appendChild(bar);
  const iv=setInterval(()=>{const i=bar.querySelector('i');if(i)i.style.width=Math.max(0,(end-Date.now())/250)+'%'},100);
  for(const q of qs){const r=await ask(prepQ(q));record(q,r,'boss');if(!r.ok||Date.now()>end){allOk=false;if(!r.ok)await feedback(q,r);break}await sleep(300)}
  clearInterval(iv);if(!allOk)hurt();else{stamp('操作 成功！','#ffc93c')}
  return allOk&&Date.now()<=end;
}
async function lose(){
  B.msg='';bossTop();
  $('qarea').innerHTML=`<div class="card center"><div style="font-size:50px">💫</div><div class="qt">${esc(UBY[B.unit].boss)}に やられた……</div><p style="color:#6b7390">でも失うものはない。まちがえた問題は覚えた。<br>その場でもう一度！</p><button class="big" id="retry">もう一度たたかう ▶</button><button class="ghost" id="giveup" style="margin-top:10px;color:#1c2140;border-color:#c9cfdd">このボスはやめて つぎへ</button></div>`;
  $('retry').onclick=()=>{sfx.tap();nextBoss()};
  $('giveup').onclick=()=>{sfx.tap();G.rushAll=false;G.rushIdx++;G.rushIdx<G.bosses.length?nextBoss():finish()};
}
function limitedOk(unit){
  const pub=BANK.koma.filter(k=>k.unit===unit&&QCOUNT[k.id]).map(k=>k.id);
  const inRange=G.range.filter(id=>pub.includes(id)).length;
  return pub.length>0&&inRange>=Math.min(10,pub.length);
}
async function defeat(){
  const u=UBY[B.unit];const f=$('bfig');if(f){f.classList.remove('hit');f.classList.add('dead')}
  sfx.win();flash();confetti(120);const [x,y]=f?centerOf(f):[innerWidth/2,200];burst(x,y,[u.color,'#ffc93c','#fff'],80,13,'star');
  G.beaten.push(B.unit);
  $('qarea').innerHTML=`<div class="center" style="padding:20px 0"><div style="font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 3px 0 #9c6400">撃破！</div><div style="font-size:16px;margin-top:6px">${esc(u.boss)} をたおした！</div></div>`;
  await sleep(1400);
  if(!S.bossFirst[B.unit]){S.bossFirst[B.unit]=Date.now();save();zEarn(100,'boss',innerWidth/2,innerHeight/2,'boss-'+B.unit)}
  if(limitedOk(B.unit))await reveal('boss-'+B.unit,u);
  else if(!S.limited['boss-'+B.unit])await note(`限定カードは、${esc(u.name)}の公開中のコマを<b>${Math.min(10,BANK.koma.filter(k=>k.unit===B.unit&&QCOUNT[k.id]).length)}コマ以上</b>範囲に入れてたおすと手に入るよ。`);
  G.rushIdx++;
  if(G.rushIdx<G.bosses.length){$('qarea').innerHTML='';return nextBoss()}
  if(G.rushAll&&UNITS.length&&UNITS.every(u=>G.beaten.includes(u.id)&&limitedOk(u.id)))await reveal('rush-all',{name:'4単元',color:'#ffc93c',boss:'ボスラッシュ完走'});
  finish();
}
function note(html){return new Promise(res=>{const d=document.createElement('div');d.className='reveal';d.innerHTML=`<p style="color:#fff;font-size:16px">${html}</p><button class="big">OK</button>`;d.querySelector('button').onclick=()=>{d.remove();res()};document.body.appendChild(d)})}
function reveal(key,u){
  return new Promise(res=>{
    const c=limitedCard(key);const first=!S.limited[key];
    if(first){S.limited[key]=Date.now();save()}
    sfx.card();confetti(first?160:40);
    if(grantLimited(key,res))return;
    const art=c&&c.art?(c.art.svg||esc(c.art.emoji||'')):(key==='rush-all'?'👑':(BOSSFIG[key.slice(5)]||'🏅'));
    const d=document.createElement('div');d.className='reveal';
    d.innerHTML=`<div class="rays"></div><h3>${first?'限定カード ゲット！':'限定カード（もう持っている）'}</h3>
      <div class="lcard" id="lc"><div class="in"><div class="b">🏆</div><div class="f"><span class="rb">限定</span><div class="art">${art}</div><div class="nm">${esc(c?c.name:(u.boss+'の勲章'))}</div><div>${'★'.repeat(c&&c.r?c.r:5)}</div>${c&&c.say?`<div class="say">${esc(c.say)}</div>`:''}</div></div></div>
      <p>${first?'定期テスト対策でボスをたおした人だけのカード。図鑑に入ったよ。':'何度でも挑めるけど、手に入るのは1回だけ。'}</p><button class="big">つぎへ ▶</button>`;
    document.body.appendChild(d);
    setTimeout(()=>{$('lc').classList.add('open');confetti(first?160:40);const [x,y]=centerOf($('lc'));burst(x,y,['#ffc93c','#fff'],60,12,'star')},RM?50:900);
    d.querySelector('.big').onclick=()=>{d.remove();res()};
  });
}

/* ---------- ミニ課題 ---------- */
const ENGINES={
 'order-drag':(m,A,done)=>{const it=m.params.items;const q={t:'order',items:it,shown:shuffle(it),q:m.params.prompt||m.title,koma:m.koma,game:m.game};
   ask(q).then(r=>done(r.ok,r.el))},
 'sort-bins':(m,A,done)=>{
   const P=m.params,items=shuffle(P.items.map((x,i)=>({t:x[0],b:x[1],i})));let sel=null,left=items.length,miss=0;
   A.innerHTML=`<div class="card mini"><div class="src"><span class="tag">ミニ課題</span>${esc(m.title||'')}</div><div class="qt">${safe(P.prompt||'正しい箱に分けよう')}</div>
     <div class="pool" id="mp">${items.map(x=>`<button data-i="${x.i}">${safe(x.t)}</button>`).join('')}</div>
     <div class="bins" id="mb">${P.bins.map((b,i)=>`<div class="bin" data-b="${i}">${safe(b)}</div>`).join('')}</div><div id="mm" style="color:#6b7390;font-size:13px;margin-top:8px">ことばをタップ → 箱をタップ</div></div>`;
   $('mp').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;sfx.tap();A.querySelectorAll('#mp button').forEach(x=>x.classList.toggle('sel',x===b));sel=b;A.querySelectorAll('.bin').forEach(x=>x.classList.add('arm'))};
   $('mb').onclick=e=>{const bin=e.target.closest('[data-b]');if(!bin||!sel)return;const it=items.find(x=>x.i===+sel.dataset.i);
     A.querySelectorAll('.bin').forEach(x=>x.classList.remove('arm'));
     if(it.b===+bin.dataset.b){const s=document.createElement('span');s.innerHTML=safe(it.t);bin.appendChild(s);sel.remove();sel=null;left--;sfx.ok(1);const [x,y]=centerOf(bin);burst(x,y,['#22c57a','#fff'],10,5);if(!left)done(miss<=1,bin)}
     else{miss++;sfx.ng();bin.classList.add('wrong');setTimeout(()=>bin.classList.remove('wrong'),400);$('mm').textContent='ちがう箱！ もう一度（ミス '+miss+'）'}};
 },
 'slider-match':(m,A,done)=>{
   const P=m.params,x=P.x||{},y=P.y||{};const f=v=>(y.k==null?1:y.k)*v+(y.b||0);
   const dec=(String(x.step||1).split('.')[1]||'').length, ydec=Math.max(2,(String(P.target).split('.')[1]||'').length);
   A.innerHTML=`<div class="card mini"><div class="src"><span class="tag">ミニ課題</span>${esc(m.title||'')}</div><div class="qt">${safe(P.prompt||m.title||'')}</div>
     <div class="meter" id="sm">0<small>${esc(y.label||'')}（めあて ${P.target} ${esc(y.unit||'')}）</small></div>
     <div class="sld"><input type="range" id="sr" min="${x.min||0}" max="${x.max||10}" step="${x.step||1}" value="${x.min||0}"><div style="display:flex;justify-content:space-between;color:#6b7390;font-size:13px"><span>${esc(x.label||'')}</span><b id="sx" style="color:#1c2140"></b></div></div>
     <button class="big" id="sgo" style="margin-top:10px">これで決定！</button></div>`;
   const upd=()=>{const v=+$('sr').value;$('sx').textContent=v.toFixed(dec)+' '+(x.unit||'');$('sm').firstChild.nodeValue=f(v).toFixed(ydec)+' '+(y.unit||'')};
   $('sr').oninput=upd;upd();
   $('sgo').onclick=()=>{const ok=Math.abs(f(+$('sr').value)-P.target)<=(P.tol||0)+1e-9;done(ok,$('sgo'))};
 }
};
function runMini(m,inBoss){
  return new Promise(res=>{
    const A=$('qarea');$('prog').innerHTML='';
    if(!inBoss){$('plabel').textContent='🧪 ミニ課題'}
    const t0=Date.now();
    ENGINES[m.engine](m,A,async(ok,el)=>{
      const [x,y]=el?centerOf(el):[innerWidth/2,innerHeight/2];
      if(ok){G.pts+=300;$('pscore').textContent='⭐ '+G.pts.toLocaleString();burst(x,y,['#ffc93c','#22c57a','#fff'],36,9,'star');sfx.fix();stamp('ミニ課題 クリア！','#22c57a')}
      else{sfx.ng();if(inBoss)hurt()}
      G.miniDone=(G.miniDone||0)+(ok?1:0);
      const nb=document.createElement('div');nb.className='fb '+(ok?'o':'x');nb.innerHTML=ok?`<b class="h">⭕ できた！（${Math.round((Date.now()-t0)/1000)}秒）</b>`:`<b class="h">❌ おしい…</b>${m.game&&BANK.games[m.game]?'<div class="from">📍 '+esc(BANK.games[m.game].title)+' でれんしゅうできます</div>':''}`;
      A.appendChild(nb);const b=document.createElement('button');b.className='big next';b.textContent='つぎへ ▶';b.onclick=()=>{sfx.tap();res(ok)};A.appendChild(b);
    });
  });
}

/* ---------- 成績カード ---------- */
function finish(){
  document.body.classList.remove('fever');if(comboEl)comboEl.style.display='none';
  const ans=G.answers,ok=ans.filter(a=>a.ok).length;
  const lastBy={};ans.forEach(a=>lastBy[a.q.id]=a.ok);
  const stillX=G.pool.filter(q=>LOG[q.id]&&LOG[q.id][2]===0);
  const units=[...new Set(G.range.map(id=>KBY[id].unit))].map(u=>UBY[u].short);
  const name=$('nameIn').value.trim()||window.PLAYER_NAME||'';
  const mins=Math.max(1,Math.round((Date.now()-G.t0)/60000));
  // koma は空・review にも koma を入れない＝テスト対策の点は、各コマの「合格」には数えない（問題ごとの成績 qlog だけ更新）
  const rec={gameId:'teiki-taisaku',grade:GRADE,koma:[],
    unit:'中2理科　定期テスト対策',game:'定期テスト対策 ～ボスラッシュ～',name,score:ok,total:ans.length,marks:ans.map(a=>a.ok),
    records:[['範囲',units.join('・')+' '+G.range.length+'コマ'],['正答率',(ans.length?Math.round(ok/ans.length*100):0)+'%'],['克服した問題',G.fixed+'問'],['まだ×の問題',stillX.length+'問'],['たおしたボス',G.beaten.length+' / '+G.bosses.length],['時間',mins+'分']],
    review:ans.map(a=>({id:a.q.id,q:a.q.q,a:correctText(a.q),y:Array.isArray(a.y)?a.y.join(' → '):String(a.y)+(a.q.t==='num'&&a.q.unit?' '+a.q.unit:''),ok:a.ok}))};
  persistLog();
  $('rTitle').textContent=G.beaten.length&&G.beaten.length===G.bosses.length?'🏆 ボスラッシュ 完走！':'おつかれさま！';
  $('rsum2').innerHTML=`<div><b>${ok}<small style="font-size:.5em"> / ${ans.length}</small></b>正解</div><div><b style="color:var(--gold)">${G.fixed}</b>克服した問題</div><div><b>${G.best}</b>最大コンボ</div><div><b>${G.beaten.length} / ${G.bosses.length}</b>たおしたボス</div>`;
  const byGame={};stillX.forEach(q=>(byGame[q.game]=byGame[q.game]||[]).push(q));
  $('xlist').innerHTML=stillX.length?Object.keys(byGame).map(g=>{const gm=BANK.games[g]||{};return byGame[g].slice(0,4).map(q=>`<div class="xi">${safe(q.q)}<div class="a">正解：${safe(correctText(q))}</div></div>`).join('')+`<div class="xi" style="background:none;border:0;padding:0 0 6px"><button data-g="${g}">${esc(gm.emoji||'')} ${esc(gm.title||g)}（第${gm.no}回）でれんしゅう ›</button></div>`}).join('')
    :'<div class="xi">範囲の中に ×のままの問題はありません。すばらしい！ 🎉</div>';
  show('result');confetti(G.fixed?120:50);sfx.win();
  const shown=window.SubmitCard?SubmitCard.show(rec,()=>{}):rec;
  S.reports=[shown].concat(S.reports||[]).slice(0,5);save();
  $('rCard').onclick=()=>window.SubmitCard&&SubmitCard.reopen(S.reports[0]);
}
$('xlist').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;
  if(window.parent&&window.parent!==window){window.parent.postMessage({type:'rika-open-game',game:b.dataset.g,mode:'play'},'*')}
  else location.href='../'+encodeURIComponent(b.dataset.g)+'/'};
$('rAgain').onclick=()=>{sfx.tap();LOG=loadLog();SEL=new Set(S.lastRange||[]);renderRange();show('range')};

/* ---------- はじめに ---------- */
function titleUI(){
  const n=BANK.questions.length;
  if(!n){$('noData').classList.remove('hidden');$('noData').innerHTML='まだ問題が入っていません。<br><small>（公開サイトの一覧ページから開くと、140コマ分の確認テストの問題が入ります）</small>';$('bStart').disabled=true}
  $('trophies').innerHTML=UNITS.map(u=>`<span class="${S.limited['boss-'+u.id]?'got':''}">${BOSSFIG[u.id]||''} ${esc(u.short)}${S.limited['boss-'+u.id]?' ✓':''}</span>`).join('')+(UNITS.length?`<span class="${S.limited['rush-all']?'got':''}">👑 完走${S.limited['rush-all']?' ✓':''}</span>`:'');
  $('bLast').classList.toggle('hidden',!(S.reports&&S.reports.length&&window.SubmitCard));
  $('bLast').onclick=()=>SubmitCard.reopen(S.reports[0]);
  const z=Z();$('bBook').classList.toggle('hidden',!(z&&z.openBook));$('bBook').onclick=()=>{try{Z().openBook()}catch(e){}};
}
$('nameIn').value=window.PLAYER_NAME||((lsGet('rika-zukan:profile:v1')||{}).name)||'';
$('bStart').onclick=()=>{ac();sfx.round();LOG=loadLog();SEL=new Set((S.lastRange||[]).filter(id=>KBY[id]));renderRange();show('range')};
$('bGo').onclick=()=>{ac();sfx.round();newSession();runRound()};
try{const z=Z();if(z&&z.setup)z.setup({game:'teiki-taisaku',koma:[]})}catch(e){}
zHud();titleUI();
LOG=loadLog();
if(window.GAME_MODE==='test'&&BANK.questions.length){SEL=new Set((S.lastRange||[]).filter(id=>KBY[id]));renderRange();show('range')}
else show('title');
</script>
