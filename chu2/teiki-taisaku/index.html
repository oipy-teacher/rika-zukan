理由として考えられるのは？", "choices": ["測定値には誤差があるから", "電熱線に電流が流れていないから", "電圧と電流は比例しないから", "電流計を直列につないだから"], "ex": "目盛りの読み取りや器具のわずかな違いで、測定値には誤差が入る。", "kind": "judge", "level": 1, "fig": null, "game": "graph-audition"}, {"id": "chu2-graph-audition-q012", "koma": "chu2-denryu-09", "t": "choice", "q": "誤差をできるだけ小さくする電流計・電圧計の読み方として正しいのは？", "choices": ["針を正面から見て、最小目盛りの10分の1まで読む", "針を斜めから見て、すばやく読む", "最小目盛りの数字だけを読み、あいだは読まない", "読むたびに電熱線を別のものに取りかえる"], "ex": "針は正面から、最小目盛りの1/10まで目分量で読む。", "kind": "method", "level": 1, "fig": null, "game": "graph-audition"}, {"id": "chu2-graph-audition-q013", "koma": "chu2-denryu-09", "t": "choice", "q": "ある電熱線の測定結果が表のようになった。測り間違いと考えられるのは、電圧が何Vのとき？", "choices": ["3.0V", "1.0V", "4.0V", "5.0V"], "ex": "ほかは1Vあたり約0.2A。3.0Vなら約0.60Aのはずが0.80Aで、大きく外れている。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 72\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"72\" fill=\"#fff\"/>\u003crect x=\"2\" y=\"2\" width=\"88\" height=\"34\" fill=\"#f3e6c9\" stroke=\"#999\"/>\u003ctext x=\"46\" y=\"24\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">電圧〔V〕\u003c/text>\u003crect x=\"90\" y=\"2\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"113\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">1.0\u003c/text>\u003crect x=\"136\" y=\"2\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"159\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">2.0\u003c/text>\u003crect x=\"182\" y=\"2\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"205\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">3.0\u003c/text>\u003crect x=\"228\" y=\"2\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"251\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">4.0\u003c/text>\u003crect x=\"274\" y=\"2\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"297\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">5.0\u003c/text>\u003crect x=\"2\" y=\"36\" width=\"88\" height=\"34\" fill=\"#f3e6c9\" stroke=\"#999\"/>\u003ctext x=\"46\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">電流〔A〕\u003c/text>\u003crect x=\"90\" y=\"36\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"113\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.20\u003c/text>\u003crect x=\"136\" y=\"36\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"159\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.41\u003c/text>\u003crect x=\"182\" y=\"36\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"205\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.80\u003c/text>\u003crect x=\"228\" y=\"36\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"251\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.79\u003c/text>\u003crect x=\"274\" y=\"36\" width=\"46\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"297\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">1.01\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "graph-audition"}, {"id": "chu2-graph-audition-q014", "koma": "chu2-denryu-09", "t": "choice", "q": "中1で学んだ「ばねを引く力とばねののび」の関係と同じように、電熱線を流れる電流は加える電圧に（　）する。", "choices": ["比例", "反比例", "関係しない", "電圧が大きいほど小さく"], "ex": "どちらも原点を通る直線のグラフ＝比例。測定値の誤差の扱い方も同じ。", "kind": "term", "level": 1, "fig": null, "game": "graph-audition"}, {"id": "chu2-teikou-seri-q001", "koma": "chu2-denryu-10", "t": "choice", "q": "電流の流れにくさを表す量と、その単位の組み合わせとして正しいのは？", "choices": ["電気抵抗・Ω（オーム）", "電力・W（ワット）", "電圧・V（ボルト）", "電流・A（アンペア）"], "ex": "電流の流れにくさが電気抵抗（抵抗）。単位はΩ（オーム）。", "kind": "term", "level": 1, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q002", "koma": "chu2-denryu-10", "t": "num", "q": "電熱線に6.0Vの電圧を加えると、0.30Aの電流が流れた。この電熱線の抵抗は何Ω？", "ans": 20, "unit": "Ω", "tol": 0, "ex": "抵抗＝電圧÷電流＝6.0÷0.30＝20Ω。", "kind": "calc", "level": 1, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q003", "koma": "chu2-denryu-10", "t": "num", "q": "電熱線に3.0Vの電圧を加えると、電流計は150mAを示した。この電熱線の抵抗は何Ω？", "ans": 20, "unit": "Ω", "tol": 0, "ex": "150mA＝0.15A に直してから、3.0÷0.15＝20Ω。mAのまま割ると0.02になってしまう。", "kind": "calc", "level": 2, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q004", "koma": "chu2-denryu-10", "t": "num", "q": "ある電熱線に3.0Vを加えると0.20Aの電流が流れた。同じ電熱線に6.0Vを加えると、電流は何A？", "ans": 0.4, "unit": "A", "tol": 0.001, "ex": "同じ電熱線なら電流は電圧に比例。電圧2倍で電流も2倍の0.40A（抵抗はどちらも15Ω）。", "kind": "judge", "level": 1, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q005", "koma": "chu2-denryu-10", "t": "choice", "q": "グラフは電熱線A・Bに加えた電圧と流れた電流の関係である。抵抗が大きいのはどちら？", "choices": ["B", "A", "AとBは同じ", "グラフからは分からない"], "ex": "同じ電圧でBの方が流れる電流が小さい＝電流が流れにくい＝抵抗が大きい（グラフの傾きが小さい）。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 220\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"220\" fill=\"#fff\"/>\u003cline x1=\"44\" y1=\"14\" x2=\"44\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"44\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">0\u003c/text>\u003cline x1=\"87.3\" y1=\"14\" x2=\"87.3\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"87.3\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">1\u003c/text>\u003cline x1=\"130.7\" y1=\"14\" x2=\"130.7\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"130.7\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">2\u003c/text>\u003cline x1=\"174\" y1=\"14\" x2=\"174\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"174\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">3\u003c/text>\u003cline x1=\"217.3\" y1=\"14\" x2=\"217.3\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"217.3\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">4\u003c/text>\u003cline x1=\"260.7\" y1=\"14\" x2=\"260.7\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"260.7\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">5\u003c/text>\u003cline x1=\"304\" y1=\"14\" x2=\"304\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"304\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">6\u003c/text>\u003cline x1=\"44\" y1=\"186\" x2=\"304\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003cline x1=\"44\" y1=\"157.3\" x2=\"304\" y2=\"157.3\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"161.3\" font-size=\"11\" text-anchor=\"end\">0.1\u003c/text>\u003cline x1=\"44\" y1=\"128.7\" x2=\"304\" y2=\"128.7\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"132.7\" font-size=\"11\" text-anchor=\"end\">0.2\u003c/text>\u003cline x1=\"44\" y1=\"100\" x2=\"304\" y2=\"100\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"104\" font-size=\"11\" text-anchor=\"end\">0.3\u003c/text>\u003cline x1=\"44\" y1=\"71.3\" x2=\"304\" y2=\"71.3\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"75.3\" font-size=\"11\" text-anchor=\"end\">0.4\u003c/text>\u003cline x1=\"44\" y1=\"42.7\" x2=\"304\" y2=\"42.7\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"46.7\" font-size=\"11\" text-anchor=\"end\">0.5\u003c/text>\u003cline x1=\"44\" y1=\"14\" x2=\"304\" y2=\"14\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"18\" font-size=\"11\" text-anchor=\"end\">0.6\u003c/text>\u003cpath d=\"M44 186H308M44 186V10\" stroke=\"#222\" stroke-width=\"2\" fill=\"none\"/>\u003ctext x=\"308\" y=\"216\" font-size=\"11\" text-anchor=\"end\">電圧〔V〕\u003c/text>\u003ctext x=\"48\" y=\"22\" font-size=\"11\">電流〔A〕\u003c/text>\u003cpath d=\"M44 186L217.3 14\" stroke=\"#c8372d\" stroke-width=\"2.4\" fill=\"none\"/>\u003ctext x=\"195.7\" y=\"22.6\" font-size=\"14\" font-weight=\"bold\" fill=\"#c8372d\">A\u003c/text>\u003cpath d=\"M44 186L304 100\" stroke=\"#1f3a5f\" stroke-width=\"2.4\" fill=\"none\"/>\u003ctext x=\"278\" y=\"100\" font-size=\"14\" font-weight=\"bold\" fill=\"#1f3a5f\">B\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q006", "koma": "chu2-denryu-10", "t": "num", "q": "グラフはある電熱線の電圧と電流の関係である。この電熱線の抵抗は何Ω？", "ans": 20, "unit": "Ω", "tol": 0, "ex": "読みやすい点（例：6.0Vで0.30A）を読んで 6.0÷0.30＝20Ω。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 220\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"220\" fill=\"#fff\"/>\u003cline x1=\"44\" y1=\"14\" x2=\"44\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"44\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">0\u003c/text>\u003cline x1=\"87.3\" y1=\"14\" x2=\"87.3\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"87.3\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">1\u003c/text>\u003cline x1=\"130.7\" y1=\"14\" x2=\"130.7\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"130.7\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">2\u003c/text>\u003cline x1=\"174\" y1=\"14\" x2=\"174\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"174\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">3\u003c/text>\u003cline x1=\"217.3\" y1=\"14\" x2=\"217.3\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"217.3\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">4\u003c/text>\u003cline x1=\"260.7\" y1=\"14\" x2=\"260.7\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"260.7\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">5\u003c/text>\u003cline x1=\"304\" y1=\"14\" x2=\"304\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"304\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">6\u003c/text>\u003cline x1=\"44\" y1=\"186\" x2=\"304\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003cline x1=\"44\" y1=\"164.5\" x2=\"304\" y2=\"164.5\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"168.5\" font-size=\"11\" text-anchor=\"end\">0.05\u003c/text>\u003cline x1=\"44\" y1=\"143\" x2=\"304\" y2=\"143\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"147\" font-size=\"11\" text-anchor=\"end\">0.1\u003c/text>\u003cline x1=\"44\" y1=\"121.5\" x2=\"304\" y2=\"121.5\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"125.5\" font-size=\"11\" text-anchor=\"end\">0.15\u003c/text>\u003cline x1=\"44\" y1=\"100\" x2=\"304\" y2=\"100\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"104\" font-size=\"11\" text-anchor=\"end\">0.2\u003c/text>\u003cline x1=\"44\" y1=\"78.5\" x2=\"304\" y2=\"78.5\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"82.5\" font-size=\"11\" text-anchor=\"end\">0.25\u003c/text>\u003cline x1=\"44\" y1=\"57\" x2=\"304\" y2=\"57\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"61\" font-size=\"11\" text-anchor=\"end\">0.3\u003c/text>\u003cline x1=\"44\" y1=\"35.5\" x2=\"304\" y2=\"35.5\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"39.5\" font-size=\"11\" text-anchor=\"end\">0.35\u003c/text>\u003cline x1=\"44\" y1=\"14\" x2=\"304\" y2=\"14\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"18\" font-size=\"11\" text-anchor=\"end\">0.4\u003c/text>\u003cpath d=\"M44 186H308M44 186V10\" stroke=\"#222\" stroke-width=\"2\" fill=\"none\"/>\u003ctext x=\"308\" y=\"216\" font-size=\"11\" text-anchor=\"end\">電圧〔V〕\u003c/text>\u003ctext x=\"48\" y=\"22\" font-size=\"11\">電流〔A〕\u003c/text>\u003cpath d=\"M44 186L304 57\" stroke=\"#c8372d\" stroke-width=\"2.4\" fill=\"none\"/>\u003c/svg>", "kind": "graph", "level": 2, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q007", "koma": "chu2-denryu-10", "t": "choice", "q": "電気器具の回路に抵抗器が入れてある理由として、最も適切なのは？", "choices": ["電流が流れすぎないようにするため", "直流を交流に変えるため", "電流の向きを変えるため", "電源の電圧を大きくするため"], "ex": "抵抗は電流の流れにくさ。抵抗を入れると、同じ電圧でも流れる電流が小さくなる。", "kind": "judge", "level": 1, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q008", "koma": "chu2-denryu-10", "t": "num", "q": "抵抗が10Ωの電熱線に0.40Aの電流が流れているとき、電熱線に加わっている電圧は何V？", "ans": 4, "unit": "V", "tol": 0, "ex": "電圧＝抵抗×電流＝10×0.40＝4.0V。", "kind": "calc", "level": 2, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q009", "koma": "chu2-denryu-10", "t": "num", "q": "抵抗が15Ωの電熱線に6.0Vの電圧を加えると、流れる電流は何A？", "ans": 0.4, "unit": "A", "tol": 0.001, "ex": "電流＝電圧÷抵抗＝6.0÷15＝0.40A。", "kind": "calc", "level": 2, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q010", "koma": "chu2-denryu-10", "t": "choice", "q": "抵抗の大きい電熱線と小さい電熱線に、同じ大きさの電圧を加えた。流れる電流について正しいのは？", "choices": ["抵抗の大きい電熱線の方が、電流が小さい", "抵抗の大きい電熱線の方が、電流が大きい", "どちらも同じ大きさの電流が流れる", "抵抗の大きい方には電流が流れない"], "ex": "抵抗が大きいほど電流が流れにくい。同じ電圧なら、抵抗が大きい方が電流は小さい。", "kind": "judge", "level": 1, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q011", "koma": "chu2-denryu-10", "t": "choice", "q": "値札に「10Ω」とある電熱線を測った。3.0Vで0.30A、6.0Vで0.60Aだった。言えることは？", "choices": ["どちらも電圧÷電流は10Ωで、値札どおりの電熱線である", "電圧を変えたので、抵抗も2倍に変わった", "電流が変わったので、値札は偽物である", "2回の結果がちがうので、測り間違いである"], "ex": "同じ電熱線なら、電圧を変えても 電圧÷電流 は同じ。3.0÷0.30＝6.0÷0.60＝10Ω。", "kind": "judge", "level": 2, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q012", "koma": "chu2-denryu-10", "t": "order", "q": "電熱線の電気抵抗を調べる手順を、正しい順に並べよう。", "items": ["電流計は直列、電圧計は並列にして回路を組む", "電源装置で電圧を加え、電流と電圧を測る", "電流の単位を A にそろえる", "電圧÷電流を計算する"], "ex": "回路を組む→測る→単位をそろえる（mA→A）→電圧÷電流。", "kind": "method", "level": 1, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q013", "koma": "chu2-denryu-10", "t": "choice", "q": "「1Ω（オーム）」の抵抗とは、どんな抵抗か？", "choices": ["1Vの電圧を加えたとき、1Aの電流が流れる抵抗", "1Aの電流が流れたとき、1Wの熱を出す抵抗", "1Vの電圧を加えたとき、電流が流れない抵抗", "1mの長さの導線の抵抗"], "ex": "抵抗＝電圧÷電流 なので、1V÷1A＝1Ω。", "kind": "term", "level": 1, "fig": null, "game": "teikou-seri"}, {"id": "chu2-teikou-seri-q014", "koma": "chu2-denryu-10", "t": "choice", "q": "電熱線Aは6.0Vで0.60A、電熱線Bは6.0Vで0.20Aの電流が流れた。電流が流れにくいのはどちらで、抵抗は何Ω？", "choices": ["B・30Ω", "A・10Ω", "B・0.03Ω", "A・3.6Ω"], "ex": "同じ電圧で電流が小さいBが流れにくい。6.0÷0.20＝30Ω（Aは10Ω）。", "kind": "judge", "level": 2, "fig": null, "game": "teikou-seri"}, {"id": "chu2-material-curling-q001", "koma": "chu2-denryu-11", "t": "choice", "q": "長さと太さをそろえた線で比べたとき、電気抵抗が最も大きいのはどれ？", "choices": ["ガラス", "鉄", "ニクロム", "アルミニウム"], "ex": "ガラスは金属と比べものにならないほど抵抗が大きく、電流をほとんど通さない。", "kind": "judge", "level": 1, "fig": null, "game": "material-curling"}, {"id": "chu2-material-curling-q002", "koma": "chu2-denryu-11", "t": "choice", "q": "銅が導線に使われる理由として、最も適切なのは？", "choices": ["電気抵抗が小さく、電流を通しやすいから", "電気抵抗が大きく、熱を出しやすいから", "電流をほとんど通さないから", "電流の向きを変えられるから"], "ex": "銅は抵抗が小さい導体。だから電気を運ぶ導線に使う。", "kind": "judge", "level": 1, "fig": null, "game": "material-curling"}, {"id": "chu2-material-curling-q003", "koma": "chu2-denryu-11", "t": "choice", "q": "ゴムやガラスのように、電流をほとんど通さない物質を何という？", "choices": ["絶縁体（不導体）", "導体", "電熱線", "電解質"], "ex": "抵抗がきわめて大きく電流をほとんど通さない物質が絶縁体（不導体）。", "kind": "term", "level": 1, "fig": null, "game": "material-curling"}, {"id": "chu2-material-curling-q004", "koma": "chu2-denryu-11", "t": "choice", "q": "電熱線（ヒーター）にニクロムが使われる理由として、最も適切なのは？", "choices": ["銅などに比べて抵抗が大きく、電流を流すと熱を出しやすいから", "銅よりも抵抗が小さく、電流が流れやすいから", "電流をまったく通さないから", "色が目立つから"], "ex": "ニクロムは金属の中では抵抗が大きい。電熱線に向いている。", "kind": "judge", "level": 2, "fig": null, "game": "material-curling"}, {"id": "chu2-material-curling-q005", "koma": "chu2-denryu-11", "t": "choice", "q": "長さ1m・断面積1mm²にそろえた線の抵抗を表にした。同じ電圧を加えたとき、流れる電流が最も大きいのはどれ？", "choices": ["銅", "鉄", "ニクロム", "アルミニウム"], "ex": "抵抗が最も小さい銅が、電流が最も流れやすい。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 72\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"72\" fill=\"#fff\"/>\u003crect x=\"2\" y=\"2\" width=\"88\" height=\"34\" fill=\"#f3e6c9\" stroke=\"#999\"/>\u003ctext x=\"46\" y=\"24\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">物質\u003c/text>\u003crect x=\"90\" y=\"2\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"118.8\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">銅\u003c/text>\u003crect x=\"147.5\" y=\"2\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"176.2\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">鉄\u003c/text>\u003crect x=\"205\" y=\"2\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"233.8\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">ニクロム\u003c/text>\u003crect x=\"262.5\" y=\"2\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"291.2\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">アルミ\u003c/text>\u003crect x=\"2\" y=\"36\" width=\"88\" height=\"34\" fill=\"#f3e6c9\" stroke=\"#999\"/>\u003ctext x=\"46\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">抵抗〔Ω〕\u003c/text>\u003crect x=\"90\" y=\"36\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"118.8\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.017\u003c/text>\u003crect x=\"147.5\" y=\"36\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"176.2\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.10\u003c/text>\u003crect x=\"205\" y=\"36\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"233.8\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">1.1\u003c/text>\u003crect x=\"262.5\" y=\"36\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"291.2\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.027\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "material-curling"}, {"id": "chu2-material-curling-q006", "koma": "chu2-denryu-11", "t": "order", "q": "表の4つの物質を、同じ電圧を加えたときに流れる電流が大きい順に並べよう。", "items": ["銅", "アルミ（アルミニウム）", "鉄", "ニクロム"], "ex": "抵抗が小さい順＝電流が大きい順。銅0.017＜アルミ0.027＜鉄0.10＜ニクロム1.1。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 72\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"72\" fill=\"#fff\"/>\u003crect x=\"2\" y=\"2\" width=\"88\" height=\"34\" fill=\"#f3e6c9\" stroke=\"#999\"/>\u003ctext x=\"46\" y=\"24\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">物質\u003c/text>\u003crect x=\"90\" y=\"2\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"118.8\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">銅\u003c/text>\u003crect x=\"147.5\" y=\"2\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"176.2\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">鉄\u003c/text>\u003crect x=\"205\" y=\"2\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"233.8\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">ニクロム\u003c/text>\u003crect x=\"262.5\" y=\"2\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"291.2\" y=\"24\" font-size=\"14\" text-anchor=\"middle\">アルミ\u003c/text>\u003crect x=\"2\" y=\"36\" width=\"88\" height=\"34\" fill=\"#f3e6c9\" stroke=\"#999\"/>\u003ctext x=\"46\" y=\"58\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">抵抗〔Ω〕\u003c/text>\u003crect x=\"90\" y=\"36\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"118.8\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.017\u003c/text>\u003crect x=\"147.5\" y=\"36\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"176.2\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.10\u003c/text>\u003crect x=\"205\" y=\"36\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"233.8\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">1.1\u003c/text>\u003crect x=\"262.5\" y=\"36\" width=\"57.5\" height=\"34\" fill=\"#fff\" stroke=\"#999\"/>\u003ctext x=\"291.2\" y=\"58\" font-size=\"14\" text-anchor=\"middle\">0.027\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "material-curling"}, {"id": "chu2-material-curling-q007", "koma": "chu2-denryu-11", "t": "choice", "q": "物質のちがいによる抵抗の大きさを比べる実験で、そろえなければならない条件は？", "choices": ["線の長さと太さ、加える電圧", "線の色だけ", "線の物質の種類", "実験する時刻"], "ex": "比べたいのは物質の種類。それ以外（長さ・太さ・電圧）はそろえる。", "kind": "method", "level": 2, "fig": null, "game": "material-curling"}, {"id": "chu2-material-curling-q008", "koma": "chu2-denryu-11", "t": "choice", "q": "長さ・太さが同じ銅の線を、赤いビニルの線から青いビニルの線にかえた。流れる電流はどうなる？", "choices": ["変わらない", "大きくなる", "小さくなる", "流れなくなる"], "ex": "外側の被覆の色は電流に関係しない。電流を決めるのは中の物質・長さ・太さ・電圧。", "kind": "judge", "level": 1, "fig": null, "game": "material-curling"}, {"id": "chu2-material-curling-q009", "koma": "chu2-denryu-11", "t": "choice", "q": "図は、長さと太さが同じ線X・Y・Zに同じ電圧を加えたときの電流の大きさである。抵抗が最も大きいのは？", "choices": ["線 Z", "線 X", "線 Y", "3本とも同じ"], "ex": "同じ電圧で流れる電流が最も小さいZが、最も電流を流しにくい＝抵抗が大きい。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 150\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"150\" fill=\"#fff\"/>\u003ctext x=\"10\" y=\"18\" font-size=\"12\" font-weight=\"bold\">同じ電圧を加えたときの電流の大きさ\u003c/text>\u003ctext x=\"10\" y=\"46\" font-size=\"15\" font-weight=\"bold\">線 X\u003c/text>\u003crect x=\"90\" y=\"32\" width=\"189\" height=\"20\" rx=\"4\" fill=\"#2d5fa8\"/>\u003ctext x=\"10\" y=\"86\" font-size=\"15\" font-weight=\"bold\">線 Y\u003c/text>\u003crect x=\"90\" y=\"72\" width=\"73\" height=\"20\" rx=\"4\" fill=\"#2d5fa8\"/>\u003ctext x=\"10\" y=\"126\" font-size=\"15\" font-weight=\"bold\">線 Z\u003c/text>\u003crect x=\"90\" y=\"112\" width=\"10\" height=\"20\" rx=\"4\" fill=\"#2d5fa8\"/>\u003c/svg>", "kind": "graph", "level": 2, "game": "material-curling"}, {"id": "chu2-material-curling-q010", "koma": "chu2-denryu-11", "t": "choice", "q": "図の線X・Y・Zは、銅・鉄・ガラスのどれかである。線Zとして最も考えられるのは？", "choices": ["ガラス", "銅", "鉄", "どれでも同じ"], "ex": "電流がほとんど流れないZは絶縁体のガラス。最も流れるXが銅、中くらいのYが鉄。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 150\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"150\" fill=\"#fff\"/>\u003ctext x=\"10\" y=\"18\" font-size=\"12\" font-weight=\"bold\">同じ電圧を加えたときの電流の大きさ\u003c/text>\u003ctext x=\"10\" y=\"46\" font-size=\"15\" font-weight=\"bold\">線 X\u003c/text>\u003crect x=\"90\" y=\"32\" width=\"189\" height=\"20\" rx=\"4\" fill=\"#2d5fa8\"/>\u003ctext x=\"10\" y=\"86\" font-size=\"15\" font-weight=\"bold\">線 Y\u003c/text>\u003crect x=\"90\" y=\"72\" width=\"73\" height=\"20\" rx=\"4\" fill=\"#2d5fa8\"/>\u003ctext x=\"10\" y=\"126\" font-size=\"15\" font-weight=\"bold\">線 Z\u003c/text>\u003crect x=\"90\" y=\"112\" width=\"10\" height=\"20\" rx=\"4\" fill=\"#2d5fa8\"/>\u003c/svg>", "kind": "judge", "level": 2, "game": "material-curling"}, {"id": "chu2-material-curling-q011", "koma": "chu2-denryu-11", "t": "choice", "q": "電気コードは、中の線が銅で、外側がビニルでおおわれている。ビニルでおおう理由は？", "choices": ["ビニルは電流をほとんど通さないので、外に電流がもれないようにするため", "ビニルが電流を強めるため", "ビニルで抵抗を小さくするため", "ビニルが電気をためるため"], "ex": "ビニルは絶縁体。中の銅（導体）を流れる電流が人や他の物に流れないようにしている。", "kind": "judge", "level": 1, "fig": null, "game": "material-curling"}, {"id": "chu2-material-curling-q012", "koma": "chu2-denryu-11", "t": "choice", "q": "金属のように電流を通しやすい物質を何という？", "choices": ["導体", "絶縁体", "不導体", "磁石"], "ex": "電気抵抗が小さく電流を通しやすい物質が導体。", "kind": "term", "level": 1, "fig": null, "game": "material-curling"}, {"id": "chu2-material-curling-q013", "koma": "chu2-denryu-11", "t": "choice", "q": "「金属ならどれも同じくらい電流を通す」という考えについて、正しいのは？", "choices": ["金属でも種類によって抵抗の大きさがちがう", "金属ならどれも抵抗は同じ", "金属は電流を通さない", "抵抗の大きさは色で決まる"], "ex": "同じ長さ・太さでも、銅と鉄とニクロムでは抵抗が大きくちがう。", "kind": "judge", "level": 1, "fig": null, "game": "material-curling"}, {"id": "chu2-gattai-card-q001", "koma": "chu2-denryu-12", "t": "num", "q": "10Ωの抵抗器2個を直列につないだ。回路全体の抵抗（合成抵抗）は何Ω？", "ans": 20, "unit": "Ω", "tol": 0, "ex": "直列では全体の抵抗は2つの和。10＋10＝20Ω。", "kind": "calc", "level": 1, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q002", "koma": "chu2-denryu-12", "t": "choice", "q": "10Ωの抵抗器2個を並列につないだ。回路全体の抵抗はどうなる？", "choices": ["10Ωより小さくなる", "20Ωになる", "10Ωのまま変わらない", "10Ωと20Ωの間になる"], "ex": "並列にすると電流の通り道が増え、全体の電流が大きくなる＝全体の抵抗は1個のときより小さい（5Ω）。", "kind": "judge", "level": 1, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q003", "koma": "chu2-denryu-12", "t": "choice", "q": "20Ωと30Ωの抵抗器を並列につないだ。回路全体の抵抗について正しいのは？", "choices": ["20Ωより小さい", "20Ωと30Ωの間", "30Ωより大きい", "ちょうど50Ω"], "ex": "並列の全体の抵抗は「間の値」ではなく、小さい方（20Ω）よりもさらに小さい（12Ω）。", "kind": "judge", "level": 2, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q004", "koma": "chu2-denryu-12", "t": "num", "q": "2つの抵抗器を並列につなぎ、電源の電圧を6.0Vにすると、回路全体に1.2Aの電流が流れた。回路全体の抵抗は何Ω？", "ans": 5, "unit": "Ω", "tol": 0, "ex": "全体の抵抗＝全体の電圧÷全体の電流＝6.0÷1.2＝5Ω。", "kind": "calc", "level": 2, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q005", "koma": "chu2-denryu-12", "t": "num", "q": "2つの抵抗器を直列につなぎ、電源の電圧を6.0Vにすると、回路全体に0.20Aの電流が流れた。回路全体の抵抗は何Ω？", "ans": 30, "unit": "Ω", "tol": 0, "ex": "全体の抵抗＝6.0÷0.20＝30Ω。", "kind": "calc", "level": 2, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q006", "koma": "chu2-denryu-12", "t": "choice", "q": "同じ電源に、図のア〜ウの回路をつないだ。電流計の示す値が最も大きいのはどれ？", "choices": ["ウ", "ア", "イ", "どれも同じ"], "ex": "全体の抵抗は ウ（並列5Ω）＜ア（10Ω）＜イ（直列20Ω）。抵抗が最も小さいウの電流が最も大きい。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 130\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"130\" fill=\"#fff\"/>\u003cg transform=\"translate(5 0)\">\u003cpath d=\"M10 100V30H90V100H58M42 100H10\" stroke=\"#222\" stroke-width=\"2\" fill=\"none\"/>\u003cline x1=\"44\" y1=\"92\" x2=\"44\" y2=\"108\" stroke=\"#222\" stroke-width=\"2\"/>\u003cline x1=\"52\" y1=\"95\" x2=\"52\" y2=\"105\" stroke=\"#222\" stroke-width=\"4\"/>\u003ccircle cx=\"10\" cy=\"65\" r=\"9\" fill=\"#fff\" stroke=\"#c33\" stroke-width=\"2\"/>\u003ctext x=\"10\" y=\"69\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c33\" font-weight=\"bold\">A\u003c/text>\u003crect x=\"35\" y=\"24\" width=\"30\" height=\"12\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/>\u003ctext x=\"50\" y=\"18\" font-size=\"10\" text-anchor=\"middle\">10Ω\u003c/text>\u003ctext x=\"50\" y=\"124\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">ア\u003c/text>\u003c/g>\u003cg transform=\"translate(112 0)\">\u003cpath d=\"M10 100V30H90V100H58M42 100H10\" stroke=\"#222\" stroke-width=\"2\" fill=\"none\"/>\u003cline x1=\"44\" y1=\"92\" x2=\"44\" y2=\"108\" stroke=\"#222\" stroke-width=\"2\"/>\u003cline x1=\"52\" y1=\"95\" x2=\"52\" y2=\"105\" stroke=\"#222\" stroke-width=\"4\"/>\u003ccircle cx=\"10\" cy=\"65\" r=\"9\" fill=\"#fff\" stroke=\"#c33\" stroke-width=\"2\"/>\u003ctext x=\"10\" y=\"69\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c33\" font-weight=\"bold\">A\u003c/text>\u003crect x=\"22\" y=\"24\" width=\"24\" height=\"12\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/>\u003crect x=\"54\" y=\"24\" width=\"24\" height=\"12\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/>\u003ctext x=\"34\" y=\"18\" font-size=\"9\" text-anchor=\"middle\">10Ω\u003c/text>\u003ctext x=\"66\" y=\"18\" font-size=\"9\" text-anchor=\"middle\">10Ω\u003c/text>\u003ctext x=\"50\" y=\"124\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">イ\u003c/text>\u003c/g>\u003cg transform=\"translate(219 0)\">\u003cpath d=\"M10 100V30H90V100H58M42 100H10\" stroke=\"#222\" stroke-width=\"2\" fill=\"none\"/>\u003cline x1=\"44\" y1=\"92\" x2=\"44\" y2=\"108\" stroke=\"#222\" stroke-width=\"2\"/>\u003cline x1=\"52\" y1=\"95\" x2=\"52\" y2=\"105\" stroke=\"#222\" stroke-width=\"4\"/>\u003ccircle cx=\"10\" cy=\"65\" r=\"9\" fill=\"#fff\" stroke=\"#c33\" stroke-width=\"2\"/>\u003ctext x=\"10\" y=\"69\" font-size=\"10\" text-anchor=\"middle\" fill=\"#c33\" font-weight=\"bold\">A\u003c/text>\u003cpath d=\"M30 30V14H70V30M30 30V46H70V30\" stroke=\"#222\" stroke-width=\"2\" fill=\"none\"/>\u003crect x=\"38\" y=\"8\" width=\"24\" height=\"12\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/>\u003crect x=\"38\" y=\"40\" width=\"24\" height=\"12\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/>\u003crect x=\"31\" y=\"27\" width=\"38\" height=\"6\" fill=\"#fff\"/>\u003ctext x=\"50\" y=\"60\" font-size=\"9\" text-anchor=\"middle\">10Ω×2\u003c/text>\u003ctext x=\"50\" y=\"124\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">ウ\u003c/text>\u003c/g>\u003c/svg>", "kind": "judge", "level": 2, "game": "gattai-card"}, {"id": "chu2-gattai-card-q007", "koma": "chu2-denryu-12", "t": "choice", "q": "グラフのX・Y・Zは、抵抗器Pだけの回路、PとQの直列回路、PとQの並列回路のどれかで、全体の電圧と全体の電流の関係を表す。並列回路はどれ？", "choices": ["Z", "X", "Y", "グラフからは分からない"], "ex": "並列は全体の抵抗が最も小さい＝同じ電圧で全体の電流が最も大きい＝傾きが最も大きいZ。直列は傾きが最も小さいY。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 220\" font-family=\"sans-serif\">\u003crect width=\"320\" height=\"220\" fill=\"#fff\"/>\u003cline x1=\"44\" y1=\"14\" x2=\"44\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"44\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">0\u003c/text>\u003cline x1=\"87.3\" y1=\"14\" x2=\"87.3\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"87.3\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">1\u003c/text>\u003cline x1=\"130.7\" y1=\"14\" x2=\"130.7\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"130.7\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">2\u003c/text>\u003cline x1=\"174\" y1=\"14\" x2=\"174\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"174\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">3\u003c/text>\u003cline x1=\"217.3\" y1=\"14\" x2=\"217.3\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"217.3\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">4\u003c/text>\u003cline x1=\"260.7\" y1=\"14\" x2=\"260.7\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"260.7\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">5\u003c/text>\u003cline x1=\"304\" y1=\"14\" x2=\"304\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003ctext x=\"304\" y=\"200\" font-size=\"11\" text-anchor=\"middle\">6\u003c/text>\u003cline x1=\"44\" y1=\"186\" x2=\"304\" y2=\"186\" stroke=\"#e6c9a6\"/>\u003cline x1=\"44\" y1=\"157.3\" x2=\"304\" y2=\"157.3\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"161.3\" font-size=\"11\" text-anchor=\"end\">0.1\u003c/text>\u003cline x1=\"44\" y1=\"128.7\" x2=\"304\" y2=\"128.7\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"132.7\" font-size=\"11\" text-anchor=\"end\">0.2\u003c/text>\u003cline x1=\"44\" y1=\"100\" x2=\"304\" y2=\"100\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"104\" font-size=\"11\" text-anchor=\"end\">0.3\u003c/text>\u003cline x1=\"44\" y1=\"71.3\" x2=\"304\" y2=\"71.3\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"75.3\" font-size=\"11\" text-anchor=\"end\">0.4\u003c/text>\u003cline x1=\"44\" y1=\"42.7\" x2=\"304\" y2=\"42.7\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"46.7\" font-size=\"11\" text-anchor=\"end\">0.5\u003c/text>\u003cline x1=\"44\" y1=\"14\" x2=\"304\" y2=\"14\" stroke=\"#e6c9a6\"/>\u003ctext x=\"40\" y=\"18\" font-size=\"11\" text-anchor=\"end\">0.6\u003c/text>\u003cpath d=\"M44 186H308M44 186V10\" stroke=\"#222\" stroke-width=\"2\" fill=\"none\"/>\u003ctext x=\"308\" y=\"216\" font-size=\"11\" text-anchor=\"end\">電圧〔V〕\u003c/text>\u003ctext x=\"48\" y=\"22\" font-size=\"11\">電流〔A〕\u003c/text>\u003cpath d=\"M44 186L304 100\" stroke=\"#d2402f\" stroke-width=\"2.4\" fill=\"none\"/>\u003ctext x=\"282.3\" y=\"100\" font-size=\"14\" font-weight=\"bold\" fill=\"#d2402f\">X\u003c/text>\u003cpath d=\"M44 186L304 151.6\" stroke=\"#2c5ea8\" stroke-width=\"2.4\" fill=\"none\"/>\u003ctext x=\"282.3\" y=\"145.9\" font-size=\"14\" font-weight=\"bold\" fill=\"#2c5ea8\">Y\u003c/text>\u003cpath d=\"M44 186L304 42.7\" stroke=\"#1f8a4c\" stroke-width=\"2.4\" fill=\"none\"/>\u003ctext x=\"269.3\" y=\"42.7\" font-size=\"14\" font-weight=\"bold\" fill=\"#1f8a4c\">Z\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "gattai-card"}, {"id": "chu2-gattai-card-q008", "koma": "chu2-denryu-12", "t": "choice", "q": "家のコンセントの器具は並列につながっている。たこ足配線で同時に使う器具を増やすと、コンセントから流れる全体の電流はどうなる？", "choices": ["大きくなる", "小さくなる", "変わらない", "0になる"], "ex": "並列で器具（抵抗）を増やすと全体の抵抗が小さくなり、全体の電流が大きくなる。流しすぎると発熱して危険。", "kind": "judge", "level": 2, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q009", "koma": "chu2-denryu-12", "t": "choice", "q": "2つの抵抗器をつないだ回路全体の抵抗を、実験で求める方法として正しいのは？", "choices": ["回路全体に加わる電圧と、回路全体を流れる電流を測り、電圧÷電流を計算する", "片方の抵抗器の電流だけを測る", "抵抗器の色の帯の数を数える", "電源の電圧だけを測る"], "ex": "全体の抵抗＝全体の電圧÷全体の電流。回路全体の値を測る。", "kind": "method", "level": 2, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q010", "koma": "chu2-denryu-12", "t": "order", "q": "同じ電源につないだとき、回路全体の抵抗が小さい順に並べよう。", "items": ["10Ωを2個 並列", "10Ωを1個", "10Ωを2個 直列", "10Ωと20Ωを 直列"], "ex": "並列5Ω＜1個10Ω＜直列20Ω＜直列30Ω。", "kind": "judge", "level": 2, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q011", "koma": "chu2-denryu-12", "t": "num", "q": "5Ωと15Ωの抵抗器を直列につないだ。回路全体の抵抗は何Ω？", "ans": 20, "unit": "Ω", "tol": 0, "ex": "直列は和。5＋15＝20Ω。", "kind": "calc", "level": 1, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q012", "koma": "chu2-denryu-12", "t": "choice", "q": "2つの抵抗器を直列につないだとき、回路全体の抵抗について正しいのは？", "choices": ["どちらの抵抗器の抵抗よりも大きい", "どちらの抵抗器の抵抗よりも小さい", "2つの抵抗の間の値になる", "大きい方の抵抗と同じになる"], "ex": "直列では全体の抵抗は2つの和なので、どちらよりも大きい。", "kind": "judge", "level": 1, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q013", "koma": "chu2-denryu-12", "t": "choice", "q": "同じ電源に、20Ωの抵抗器1個をつないだときと、20Ωの抵抗器2個を並列につないだときとで、回路全体の電流を比べると？", "choices": ["並列の方が2倍になる", "並列の方が半分になる", "どちらも同じ", "並列の方が4倍になる"], "ex": "20Ω2個の並列は全体で10Ω。抵抗が半分なので、全体の電流は2倍。", "kind": "judge", "level": 2, "fig": null, "game": "gattai-card"}, {"id": "chu2-gattai-card-q014", "koma": "chu2-denryu-12", "t": "choice", "q": "2つ以上の抵抗をつないだとき、回路全体を1つの抵抗とみなしたときの抵抗を何という？", "choices": ["合成抵抗（全体の抵抗）", "電気抵抗の単位", "電圧降下", "内部抵抗"], "ex": "回路全体を1つとみなした抵抗を合成抵抗（全体の抵抗）という。", "kind": "term", "level": 1, "fig": null, "game": "gattai-card"}, {"id": "chu2-fuin-box-q001", "koma": "chu2-kagaku-01", "t": "choice", "q": "ある物質を加熱して出てきた気体を石灰水に通すと、白くにごった。この気体は何と考えられる？", "choices": ["二酸化炭素", "酸素", "水素", "窒素"], "ex": "石灰水を白くにごらせるのは二酸化炭素の性質。", "fig": null, "kind": "judge", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q002", "koma": "chu2-kagaku-01", "t": "choice", "q": "加熱した試験管の口についた液体が水かどうかを調べるには、何を使う？", "choices": ["青色の塩化コバルト紙", "石灰水", "火のついた線香", "フェノールフタレイン液"], "ex": "塩化コバルト紙は水にふれると青色から赤（桃）色に変わる。", "fig": null, "kind": "method", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q003", "koma": "chu2-kagaku-01", "t": "choice", "q": "青色の塩化コバルト紙に液体をつけると、赤（桃）色に変わった。この液体についていえることは？", "choices": ["水がふくまれている", "二酸化炭素がとけている", "アルカリ性である", "油である"], "ex": "塩化コバルト紙の色の変化は、水があることを示す。", "fig": null, "kind": "judge", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q004", "koma": "chu2-kagaku-01", "t": "choice", "q": "試験管に集めた気体が酸素かどうかを確かめる方法は？", "choices": ["火のついた線香を入れ、炎を上げて燃えるか見る", "石灰水を入れてよくふる", "マッチの火を近づけ、ポンと音がするか見る", "においをかぐ"], "ex": "酸素にはものを燃やすはたらきがあるので、線香が激しく燃える。", "fig": null, "kind": "method", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q005", "koma": "chu2-kagaku-01", "t": "choice", "q": "マッチの火を近づけると、ポンと音を立てて燃えた気体は？", "choices": ["水素", "酸素", "二酸化炭素", "窒素"], "ex": "水素は燃える気体で、燃えると水ができる。", "fig": null, "kind": "judge", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q006", "koma": "chu2-kagaku-01", "t": "choice", "q": "固体を加熱して液体が出てきそうな実験で、試験管の口を少し下げて固定するのはなぜ？", "choices": ["口にできた液体が加熱部分に流れ、試験管が割れるのを防ぐため", "気体を早く出すため", "固体が外に落ちないようにするため", "炎が当たりやすくなるため"], "ex": "冷たい液体が熱いガラスに流れると、急に冷えて割れることがある。", "fig": null, "kind": "method", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q007", "koma": "chu2-kagaku-01", "t": "choice", "q": "A・Bのうち、固体を加熱して出てくる物質を調べるときの試験管の向きとして正しいのは？", "choices": ["B（口を少し下げている）", "A（口を少し上げている）", "どちらでもよい"], "ex": "口を少し下げておくと、口にできた液体が加熱部分へ流れない。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 135\" width=\"320\" height=\"135\" font-family=\"sans-serif\">\u003cg transform=\"translate(0,0)\">\u003cline x1=\"20\" y1=\"20\" x2=\"20\" y2=\"110\" stroke=\"#555\" stroke-width=\"3\"/>\u003crect x=\"6\" y=\"108\" width=\"40\" height=\"6\" fill=\"#555\"/>\u003cg transform=\"rotate(-10 70 50)\">\u003crect x=\"20\" y=\"40\" width=\"100\" height=\"20\" rx=\"10\" fill=\"#eef6fb\" stroke=\"#222\" stroke-width=\"2\"/>\u003crect x=\"116\" y=\"38\" width=\"10\" height=\"24\" fill=\"#6b4b2a\"/>\u003cpath d=\"M24 58 Q36 50 56 58Z\" fill=\"#fff\" stroke=\"#222\"/>\u003c/g>\u003cpath d=\"M34 106 C30 98 34 90 40 84 C44 92 48 94 50 88 C54 96 54 104 50 110Z\" fill=\"#ff8a1d\"/>\u003ctext x=\"70\" y=\"128\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">A\u003c/text>\u003c/g>\u003cg transform=\"translate(160,0)\">\u003cline x1=\"20\" y1=\"20\" x2=\"20\" y2=\"110\" stroke=\"#555\" stroke-width=\"3\"/>\u003crect x=\"6\" y=\"108\" width=\"40\" height=\"6\" fill=\"#555\"/>\u003cg transform=\"rotate(10 70 50)\">\u003crect x=\"20\" y=\"40\" width=\"100\" height=\"20\" rx=\"10\" fill=\"#eef6fb\" stroke=\"#222\" stroke-width=\"2\"/>\u003crect x=\"116\" y=\"38\" width=\"10\" height=\"24\" fill=\"#6b4b2a\"/>\u003cpath d=\"M24 58 Q36 50 56 58Z\" fill=\"#fff\" stroke=\"#222\"/>\u003c/g>\u003cpath d=\"M34 106 C30 98 34 90 40 84 C44 92 48 94 50 88 C54 96 54 104 50 110Z\" fill=\"#ff8a1d\"/>\u003ctext x=\"70\" y=\"128\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">B\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q008", "koma": "chu2-kagaku-01", "t": "choice", "q": "気体を水上置換で集めている。加熱をやめる前に、ガラス管を水そうの水から出すのはなぜ？", "choices": ["水そうの水が試験管に逆流して、試験管が割れるのを防ぐため", "気体が爆発するのを防ぐため", "集めた気体をにがさないため", "ガスを節約するため"], "ex": "先に火を消すと、試験管が冷えて水が吸いこまれる（逆流）。", "fig": null, "kind": "method", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q009", "koma": "chu2-kagaku-01", "t": "choice", "q": "加熱して出てきた気体を集めるとき、はじめに出てくる気体を集めずに捨てるのはなぜ？", "choices": ["試験管の中にあった空気が多くまじっているから", "有毒な気体だから", "温度が高すぎるから", "水が多くふくまれるから"], "ex": "はじめの気体には、装置の中にもともとあった空気がまじる。", "fig": null, "kind": "method", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q010", "koma": "chu2-kagaku-01", "t": "order", "q": "加熱して出る気体を集める実験を、正しい順に並べよう。", "items": ["試験管の口を少し下げて装置を組む", "加熱し、はじめに出る気体は集めずに捨てる", "出てくる気体を試験管に集める", "ガラス管を水から出してから火を消す"], "ex": "装置の点検→空気をにがす→集める→逆流を防いで終える、の順。", "fig": null, "kind": "method", "level": 2, "game": "fuin-box"}, {"id": "chu2-fuin-box-q011", "koma": "chu2-kagaku-01", "t": "choice", "q": "砂糖を加熱すると黒くこげた。冷やしても砂糖にはもどらなかった。ここからいえることは？", "choices": ["別の物質ができた", "すがたが変わっただけ（状態変化）", "砂糖が水になった", "砂糖が消えてなくなった"], "ex": "冷やしても元にもどらず、色などの性質もちがうので、別の物質ができたといえる。", "fig": null, "kind": "judge", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q012", "koma": "chu2-kagaku-01", "t": "choice", "q": "氷を加熱すると水になり、冷やすと氷にもどった。この変化についていえることは？", "choices": ["すがたが変わっただけで、同じ物質のまま", "別の物質ができた", "氷が2種類の物質に分かれた", "水が消えてなくなった"], "ex": "固体・液体・気体とすがたが変わるだけの変化は状態変化で、物質は同じ。", "fig": null, "kind": "judge", "level": 1, "game": "fuin-box"}, {"id": "chu2-fuin-box-q013", "koma": "chu2-kagaku-01", "t": "choice", "q": "加熱したあとに残った白い固体が、元の粉と同じ物質かどうかを確かめる方法として、最もよいのは？", "choices": ["元の粉と並べて、水へのとけ方やフェノールフタレイン液の色を比べる", "見た目の色が同じかどうかを見る", "手でさわってかたさを比べる", "においをかいで比べる"], "ex": "見た目が似ていても、性質を比べないと同じ物質かどうかは決められない。", "fig": null, "kind": "method", "level": 2, "game": "fuin-box"}, {"id": "chu2-fuin-box-q014", "koma": "chu2-kagaku-01", "t": "choice", "q": "「炭酸水素ナトリウムを加熱すると気体が出る」と予想した。その根拠として最もふさわしいのは？", "choices": ["炭酸水素ナトリウムをふくむふくらし粉を入れたホットケーキは、焼くとふくらむ", "炭酸水素ナトリウムは白い粉だから", "なんとなくそう思うから", "ほかの人がそう言っていたから"], "ex": "根拠は、すでに知っている事実や経験と予想がつながっているものを選ぶ。", "fig": null, "kind": "judge", "level": 2, "game": "fuin-box"}, {"id": "chu2-fuin-box-q015", "koma": "chu2-kagaku-01", "t": "choice", "q": "フェノールフタレイン液を加えると赤色になる水溶液は、何性？", "choices": ["アルカリ性", "酸性", "中性", "どの水溶液でも赤くなる"], "ex": "フェノールフタレイン液はアルカリ性で赤色になる。", "fig": null, "kind": "term", "level": 1, "game": "fuin-box"}, {"id": "chu2-shiroi-kona-jiken-q001", "koma": "chu2-kagaku-02", "t": "choice", "q": "炭酸水素ナトリウムを加熱したあとに残った白い固体を水にとかすとよくとけ、フェノールフタレイン液でこい赤色になった。元の炭酸水素ナトリウムは、とけ残りがあり、うすい赤色だった。ここからいえることは？", "choices": ["加熱後の固体は、元の物質とは別の物質である", "加熱後の固体は、元の物質と同じ物質である", "加熱後の固体は、水である", "実験に失敗したので何もいえない"], "ex": "同じ条件で調べて性質（とけ方・水溶液の性質）がちがうので、別の物質といえる。", "fig": null, "kind": "judge", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q002", "koma": "chu2-kagaku-02", "t": "choice", "q": "表は、加熱前の物質と加熱後の固体を調べた結果である。加熱後の固体の水溶液について、正しいものはどれ？", "choices": ["加熱前の物質の水溶液より、アルカリ性が強い", "加熱前の物質の水溶液より、アルカリ性が弱い", "中性である", "酸性である"], "ex": "フェノールフタレイン液は、アルカリ性が強いほどこい赤色になる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 110\" width=\"320\" height=\"110\" font-family=\"sans-serif\" font-size=\"13\">\u003crect x=\"1\" y=\"1\" width=\"318\" height=\"108\" fill=\"#fff\" stroke=\"#222\"/>\u003cline x1=\"1\" y1=\"36\" x2=\"319\" y2=\"36\" stroke=\"#222\"/>\u003cline x1=\"1\" y1=\"72\" x2=\"319\" y2=\"72\" stroke=\"#222\"/>\u003cline x1=\"110\" y1=\"1\" x2=\"110\" y2=\"109\" stroke=\"#222\"/>\u003cline x1=\"215\" y1=\"1\" x2=\"215\" y2=\"109\" stroke=\"#222\"/>\u003ctext x=\"162\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\">加熱前の物質\u003c/text>\u003ctext x=\"267\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\">加熱後の固体\u003c/text>\u003ctext x=\"55\" y=\"59\" text-anchor=\"middle\">水へのとけ方\u003c/text>\u003ctext x=\"162\" y=\"59\" text-anchor=\"middle\">少しとけ残る\u003c/text>\u003ctext x=\"267\" y=\"59\" text-anchor=\"middle\">よくとける\u003c/text>\u003ctext x=\"55\" y=\"88\" text-anchor=\"middle\">フェノール\u003c/text>\u003ctext x=\"55\" y=\"103\" text-anchor=\"middle\">フタレイン液\u003c/text>\u003ctext x=\"162\" y=\"95\" text-anchor=\"middle\">うすい赤色\u003c/text>\u003ctext x=\"267\" y=\"95\" text-anchor=\"middle\">こい赤色\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q003", "koma": "chu2-kagaku-02", "t": "choice", "q": "加熱後に残った白い固体が、元の粉と同じ物質かどうかを判断する根拠にならないものはどれ？", "choices": ["どちらも白い粉に見えること", "水へのとけ方", "フェノールフタレイン液を加えたときの色", "同じ量の水にとかしたときのようす"], "ex": "見た目が似ている物質はたくさんある。性質を比べないと判断できない。", "fig": null, "kind": "judge", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q004", "koma": "chu2-kagaku-02", "t": "choice", "q": "炭酸水素ナトリウムを加熱したとき、試験管に残る白い固体は何？", "choices": ["炭酸ナトリウム", "炭酸水素ナトリウム", "塩化ナトリウム", "炭酸カルシウム"], "ex": "炭酸水素ナトリウムは分解して、炭酸ナトリウム・二酸化炭素・水になる。", "fig": null, "kind": "term", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q005", "koma": "chu2-kagaku-02", "t": "choice", "q": "出てきた気体が、元の炭酸水素ナトリウムとは別の物質だといえる理由として、最も適切なものは？", "choices": ["石灰水を白くにごらせたので、二酸化炭素だとわかったから", "気体だったから", "泡がたくさん出たから", "においがしたから"], "ex": "石灰水を白くにごらせる性質から二酸化炭素と決まる。元の物質（白い固体）にはない性質。", "fig": null, "kind": "judge", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q006", "koma": "chu2-kagaku-02", "t": "choice", "q": "試験管の口についた液体が水であることは、どうすれば確かめられる？", "choices": ["青色の塩化コバルト紙をつけると、赤（桃）色に変わる", "石灰水を入れると、白くにごる", "火のついた線香を近づけると、激しく燃える", "フェノールフタレイン液を入れると、赤くなる"], "ex": "塩化コバルト紙は、水にふれると青色から赤（桃）色に変わる。", "fig": null, "kind": "method", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q007", "koma": "chu2-kagaku-02", "t": "choice", "q": "試験管の口についた液体について「はじめから試験管についていた水ではないか」と言われた。反論に使える事実はどれ？", "choices": ["実験の前に、かわいた試験管を使っていた", "液体は無色透明だった", "加熱すると泡が出た", "石灰水が白くにごった"], "ex": "かわいた試験管から水が出てきたので、加熱によって生じたといえる。", "fig": null, "kind": "judge", "level": 2, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q008", "koma": "chu2-kagaku-02", "t": "order", "q": "加熱後に残った固体が元の物質と同じかどうかを調べる手順を、正しい順に並べよう。", "items": ["元の物質と加熱後の固体を同じ量ずつとる", "それぞれ同じ量の水に入れて、とけ方を比べる", "フェノールフタレイン液を加えて、色を比べる", "結果から、同じ物質かどうかを判断する"], "ex": "比べるときは、量などの条件をそろえてから調べる。", "fig": null, "kind": "method", "level": 2, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q009", "koma": "chu2-kagaku-02", "t": "choice", "q": "1種類の物質が、2種類以上の別の物質に分かれる化学変化を何という？", "choices": ["分解", "状態変化", "燃焼", "蒸発"], "ex": "熱による分解は熱分解ともいう。", "fig": null, "kind": "term", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q010", "koma": "chu2-kagaku-02", "t": "choice", "q": "炭酸水素ナトリウムを加熱したときの変化を、物質名で正しく表しているのはどれ？", "choices": ["炭酸水素ナトリウム → 炭酸ナトリウム ＋ 二酸化炭素 ＋ 水", "炭酸水素ナトリウム → 炭酸ナトリウム ＋ 酸素 ＋ 水", "炭酸水素ナトリウム → ナトリウム ＋ 二酸化炭素 ＋ 水", "炭酸水素ナトリウム → 炭酸ナトリウム ＋ 水素"], "ex": "気体は二酸化炭素、液体は水、固体は炭酸ナトリウム。", "fig": null, "kind": "judge", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q011", "koma": "chu2-kagaku-02", "t": "choice", "q": "ホットケーキの生地にふくらし粉（炭酸水素ナトリウムをふくむ）を入れて焼くとふくらむ。その理由は？", "choices": ["加熱で炭酸水素ナトリウムが分解して、二酸化炭素が発生するから", "小麦粉が燃えて気体が出るから", "卵が加熱でとけて広がるから", "炭酸水素ナトリウムが水にとけて消えるから"], "ex": "分解で出た二酸化炭素が、生地の中で泡になってふくらませる。", "fig": null, "kind": "judge", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q012", "koma": "chu2-kagaku-02", "t": "choice", "q": "A・Bは、炭酸水素ナトリウムと、それを加熱したあとの固体を、それぞれ同じ量の水にとかしてフェノールフタレイン液を加えたものである。加熱後の固体はどちら？", "choices": ["B（こい赤色）", "A（うすい赤色）", "どちらとも決められない"], "ex": "加熱後の固体（炭酸ナトリウム）の水溶液は、アルカリ性が強くこい赤色になる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 140\" width=\"200\" height=\"140\" font-family=\"sans-serif\">\u003cg transform=\"translate(50,10)\">\u003cpath d=\"M0 0h30v86a15 15 0 0 1-30 0Z\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/>\u003cpath d=\"M2 40h26v46a13 13 0 0 1-26 0Z\" fill=\"#f3c6d2\"/>\u003ctext x=\"15\" y=\"122\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">A\u003c/text>\u003c/g>\u003cg transform=\"translate(120,10)\">\u003cpath d=\"M0 0h30v86a15 15 0 0 1-30 0Z\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/>\u003cpath d=\"M2 40h26v46a13 13 0 0 1-26 0Z\" fill=\"#c21d4f\"/>\u003ctext x=\"15\" y=\"122\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">B\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q013", "koma": "chu2-kagaku-02", "t": "choice", "q": "炭酸水素ナトリウムの加熱が「分解」だといえる理由は？", "choices": ["1種類の物質から、性質のちがう3種類の物質ができたから", "加熱したから", "白い粉が残ったから", "気体が出たから"], "ex": "分解は、1種類の物質から2種類以上の別の物質ができる変化。", "fig": null, "kind": "judge", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q014", "koma": "chu2-kagaku-02", "t": "num", "q": "炭酸水素ナトリウムを加熱すると、元とはちがう物質が何種類できる？", "ans": 3, "unit": "種類", "tol": 0, "ex": "炭酸ナトリウム・二酸化炭素・水の3種類。", "fig": null, "kind": "judge", "level": 1, "game": "shiroi-kona-jiken"}, {"id": "chu2-shiroi-kona-jiken-q015", "koma": "chu2-kagaku-02", "t": "choice", "q": "重曹（炭酸水素ナトリウム）だけを入れて焼いたホットケーキは、苦くなることがある。その原因と考えられる物質は？", "choices": ["加熱でできた炭酸ナトリウム", "加熱でできた二酸化炭素", "加熱でできた水", "小麦粉がこげた炭"], "ex": "加熱後に残る炭酸ナトリウムは、強いアルカリ性で苦みのもとになる。", "fig": null, "kind": "judge", "level": 2, "game": "shiroi-kona-jiken"}, {"id": "chu2-rika-busshitsu-q001", "koma": "chu2-kagaku-03", "t": "choice", "q": "1種類の物質が 2種類以上の別の物質に分かれる化学変化を何というか。", "choices": ["分解", "状態変化", "燃焼", "融解"], "ex": "1種類の物質が2種類以上の別の物質に分かれる化学変化を「分解」という。", "fig": null, "kind": "term", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-rika-busshitsu-q002", "koma": "chu2-kagaku-04", "t": "choice", "q": "電流を流すことによって 物質を分解することを何というか。", "choices": ["電気分解", "熱分解", "蒸留", "ろ過"], "ex": "電流を流して物質を分解することを「電気分解」という。", "fig": null, "kind": "term", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-rika-busshitsu-q003", "koma": "chu2-kagaku-05", "t": "choice", "q": "化学変化で それ以上分けることができない 小さな粒子を何というか。", "choices": ["原子", "分子", "結晶", "細胞"], "ex": "化学変化でそれ以上分割できない小さな粒子が「原子」。", "fig": null, "kind": "term", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-rika-busshitsu-q004", "koma": "chu2-kagaku-08", "t": "choice", "q": "いくつかの原子が結びついてできた、物質の性質のもとになる最小の粒子を何というか。", "choices": ["分子", "原子", "元素", "結晶"], "ex": "原子がいくつか結びついてできた、物質の性質を示す最小の粒子が「分子」。", "fig": null, "kind": "term", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-rika-busshitsu-q005", "koma": "chu2-kagaku-04", "t": "choice", "q": "水を電気分解したとき、陰極側に発生する気体は何か。", "choices": ["水素", "酸素", "塩素", "窒素"], "ex": "陰極側の気体はマッチの火で音を立てて燃える → 水素。", "fig": null, "kind": "judge", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-rika-busshitsu-q006", "koma": "chu2-kagaku-04", "t": "choice", "q": "水の電気分解で発生する 水素と酸素の体積の比（水素：酸素）は、およそどれか。", "choices": ["2：1", "1：2", "1：1", "3：1"], "ex": "水素の体積は酸素の約2倍になる。", "fig": null, "kind": "judge", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-rika-busshitsu-q007", "koma": "chu2-kagaku-04", "t": "choice", "q": "塩化銅水溶液に電流を流したとき、陰極に付着する物質は何か。", "choices": ["銅", "塩素", "水素", "酸素"], "ex": "塩化銅 → 銅 ＋ 塩素。陰極に赤茶色の銅が付く。", "fig": null, "kind": "judge", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-rika-busshitsu-q008", "koma": "chu2-kagaku-08", "t": "choice", "q": "次のうち、分子をつくらない物質はどれか。", "choices": ["鉄", "水", "酸素", "アンモニア"], "ex": "鉄・銅・銀などの金属は、1種類の原子がたくさん集まってできていて分子をつくらない。", "fig": null, "kind": "judge", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-rika-busshitsu-q009", "koma": "chu2-kagaku-08", "t": "choice", "q": "水分子のつくりとして 正しいものはどれか。", "choices": ["水素原子2個と 酸素原子1個", "水素原子1個と 酸素原子2個", "水素原子2個と 酸素原子2個", "酸素原子2個"], "ex": "水分子は水素原子2個と酸素原子1個が結びついてできている。", "fig": null, "kind": "judge", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-rika-busshitsu-q010", "koma": "chu2-kagaku-03", "t": "choice", "q": "次のうち、状態変化であるものはどれか。", "choices": ["ドライアイスが 気体になる", "水を 電気分解する", "炭酸水素ナトリウムを 加熱する", "酸化銀を 加熱する"], "ex": "二酸化炭素の分子そのものは変わらず、集まり方が変わるだけ → 状態変化。", "fig": null, "kind": "judge", "level": 1, "game": "rika-busshitsu"}, {"id": "chu2-jewel-atelier-q001", "koma": "chu2-kagaku-06", "t": "choice", "q": "物質をつくっている原子の種類を何という？", "choices": ["元素", "原子", "分子", "単体"], "ex": "原子の種類のことを「元素」という。", "fig": null, "kind": "term", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q002", "koma": "chu2-kagaku-13", "t": "choice", "q": "物質を元素記号と数字などで表したものを何という？", "choices": ["化学式", "元素記号", "化学反応式", "周期表"], "ex": "元素記号と数字で物質を表したものが「化学式」。", "fig": null, "kind": "term", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q003", "koma": "chu2-kagaku-09", "t": "choice", "q": "1種類の元素からできている物質を何という？", "choices": ["単体", "化合物", "混合物", "元素"], "ex": "1種類の元素だけでできている物質が「単体」。", "fig": null, "kind": "term", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q004", "koma": "chu2-kagaku-09", "t": "choice", "q": "2種類以上の元素からできている物質を何という？", "choices": ["化合物", "単体", "混合物", "分子"], "ex": "2種類以上の元素でできている物質が「化合物」。", "fig": null, "kind": "term", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q005", "koma": "chu2-kagaku-15", "t": "choice", "q": "化学変化を化学式で表したものを何という？", "choices": ["化学反応式", "化学式", "周期表", "元素記号"], "ex": "化学変化を化学式で表したものが「化学反応式」。", "fig": null, "kind": "term", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q006", "koma": "chu2-kagaku-06", "t": "choice", "q": "鉄の元素記号はどれ？", "choices": ["Fe", "F", "Ir", "Te"], "ex": "鉄はラテン語 ferrum から Fe。", "fig": null, "kind": "term", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q007", "koma": "chu2-kagaku-06", "t": "choice", "q": "ナトリウムの元素記号はどれ？", "choices": ["Na", "So", "N", "Nt"], "ex": "ナトリウムは natron（ラテン語）から Na。", "fig": null, "kind": "term", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q008", "koma": "chu2-kagaku-06", "t": "choice", "q": "ラテン語の「明るい」argentum が由来の元素記号はどれ？", "choices": ["Ag", "Au", "Ar", "Al"], "ex": "銀は argentum から Ag。金は Au（aurum）。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q009", "koma": "chu2-kagaku-07", "t": "choice", "q": "周期表の横の行を何という？", "choices": ["周期", "族", "段", "群"], "ex": "周期表の横の行を「周期」、縦の列を「族」という。", "fig": null, "kind": "term", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q010", "koma": "chu2-kagaku-07", "t": "choice", "q": "周期表で同じ族に並ぶ元素について、正しいものはどれ？", "choices": ["化学的な性質がよく似ている", "原子の重さが同じ", "同じ年に発見された", "どれも気体である"], "ex": "同じ縦の列（族）の元素は、化学的な性質がよく似ている。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q011", "koma": "chu2-kagaku-07", "t": "choice", "q": "人体をつくる元素で、いちばん多い（質量比）のはどれ？", "choices": ["酸素", "炭素", "水素", "窒素"], "ex": "人体の質量の約65%は酸素。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q012", "koma": "chu2-kagaku-13", "t": "choice", "q": "水分子 H\u003csub>2\u003c/sub>O をつくっている元素は何種類？", "choices": ["2種類", "3種類", "1種類", "4種類"], "ex": "H（水素）と O（酸素）の2種類。原子の数（3個）と混同しない。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q013", "koma": "chu2-kagaku-13", "t": "choice", "q": "塩化ナトリウムの化学式として正しいものはどれ？", "choices": ["NaCl", "Nacl", "ClNa", "NaCL"], "ex": "2文字目は小文字。ナトリウム Na と塩素 Cl が 1：1 で NaCl。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q014", "koma": "chu2-kagaku-13", "t": "choice", "q": "二酸化炭素の化学式として正しいものはどれ？", "choices": ["CO\u003csub>2\u003c/sub>", "CO\u003csup>2\u003c/sup>", "C\u003csub>2\u003c/sub>O", "Co\u003csub>2\u003c/sub>"], "ex": "原子の数は右下の小さい数字で書く。炭素1個・酸素2個で CO\u003csub>2\u003c/sub>。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q015", "koma": "chu2-kagaku-09", "t": "choice", "q": "次のうち、混合物はどれ？", "choices": ["空気", "酸素", "水", "塩化ナトリウム"], "ex": "空気は窒素・酸素などが混ざった混合物。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q016", "koma": "chu2-kagaku-09", "t": "choice", "q": "ダイヤモンドと黒鉛のように、同じ元素からできているが性質がちがう単体を何という？", "choices": ["同素体", "化合物", "混合物", "同位体"], "ex": "同じ元素でできていて性質のちがう単体どうしを「同素体」という。", "fig": null, "kind": "term", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q017", "koma": "chu2-kagaku-15", "t": "choice", "q": "2H\u003csub>2\u003c/sub> の前の「2」が表すものはどれ？", "choices": ["水素分子が2個あること", "水素原子が2個結びついていること", "水素原子4個が結びついた分子が1個あること", "水素が2gあること"], "ex": "前の大きい数字（係数）は分子の個数。右下の小さい数字は分子の中の原子の数。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q018", "koma": "chu2-kagaku-15", "t": "choice", "q": "2Ag\u003csub>2\u003c/sub>O → □Ag ＋ O\u003csub>2\u003c/sub>　□に入る数は？", "choices": ["4", "2", "1", "3"], "ex": "左辺の Ag は 2×2＝4個。右辺も4個になるように 4Ag。", "fig": null, "kind": "calc", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q019", "koma": "chu2-kagaku-15", "t": "choice", "q": "水の電気分解を表す化学反応式として正しいものはどれ？", "choices": ["2H\u003csub>2\u003c/sub>O → 2H\u003csub>2\u003c/sub> ＋ O\u003csub>2\u003c/sub>", "H\u003csub>2\u003c/sub>O → H\u003csub>2\u003c/sub> ＋ O", "H\u003csub>2\u003c/sub>O → 2H ＋ O", "H\u003csub>2\u003c/sub>O\u003csub>2\u003c/sub> → H\u003csub>2\u003c/sub> ＋ O\u003csub>2\u003c/sub>"], "ex": "酸素は分子 O\u003csub>2\u003c/sub> で書き、左右の原子の数をそろえると 2H\u003csub>2\u003c/sub>O → 2H\u003csub>2\u003c/sub> ＋ O\u003csub>2\u003c/sub>。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-jewel-atelier-q020", "koma": "chu2-kagaku-13", "t": "choice", "q": "ルビーやサファイアの Al\u003csub>2\u003c/sub>O\u003csub>3\u003c/sub> が表していることはどれ？", "choices": ["アルミニウム原子と酸素原子が 2：3 の割合で結びついている", "アルミニウム原子2個と酸素分子3個が混ざっている", "アルミニウムが2g、酸素が3gふくまれている", "アルミニウムと酸素の単体が混ざっている"], "ex": "化学式の右下の数字は原子の数の割合。Al：O＝2：3 で結びついた化合物。", "fig": null, "kind": "judge", "level": 1, "game": "jewel-atelier"}, {"id": "chu2-tetsu-iou-tamago-q001", "koma": "chu2-kagaku-10", "t": "choice", "q": "鉄粉に磁石を近づけると、どうなる？", "choices": ["引きつけられる", "引きつけられない", "一部だけ引きつけられる"], "ex": "鉄は磁石に引きつけられる性質がある。", "fig": null, "kind": "judge", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q002", "koma": "chu2-kagaku-10", "t": "choice", "q": "硫黄（粉末）は何色？", "choices": ["黄色", "灰色", "黒色", "白色"], "ex": "硫黄は黄色の固体。", "fig": null, "kind": "term", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q003", "koma": "chu2-kagaku-10", "t": "choice", "q": "鉄粉と硫黄をよく混ぜた混合物に磁石を近づけた。どうなる？", "choices": ["鉄の部分が引きつけられる", "全体が引きつけられない", "硫黄の部分が引きつけられる", "全体が同じように引きつけられる"], "ex": "混ぜただけなので、鉄は鉄の性質、硫黄は硫黄の性質をもったまま。", "fig": null, "kind": "judge", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q004", "koma": "chu2-kagaku-10", "t": "choice", "q": "A〜Cは、原子のモデルで表した物質である（Fe＝鉄原子、S＝硫黄原子）。鉄と硫黄の「混合物」を表しているのはどれ？", "choices": ["B", "A", "C"], "ex": "混合物は、鉄の粒と硫黄の粒がまざっているだけで、結び付いていない。", "fig": "\u003csvg id=\"mfig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 310 104\" width=\"310\" height=\"104\" font-family=\"sans-serif\">\u003cstyle>#mfig .F{fill:#767C8A}#mfig .S{fill:#EAD23C}#mfig text{font-size:7px;font-weight:bold;text-anchor:middle}#mfig .tF{fill:#fff}#mfig .tS{fill:#4d3f00}\u003c/style>\u003cg transform=\"translate(4,6)\">\u003crect width=\"92\" height=\"74\" rx=\"6\" fill=\"#fdf8ec\" stroke=\"#999\"/>\u003ccircle class=\"F\" cx=\"12\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tF\" x=\"12\" y=\"15\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"29\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tS\" x=\"29\" y=\"15\">S\u003c/text>\u003ccircle class=\"F\" cx=\"46\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tF\" x=\"46\" y=\"15\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"63\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tS\" x=\"63\" y=\"15\">S\u003c/text>\u003ccircle class=\"F\" cx=\"80\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tF\" x=\"80\" y=\"15\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"12\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tS\" x=\"12\" y=\"32\">S\u003c/text>\u003ccircle class=\"F\" cx=\"29\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tF\" x=\"29\" y=\"32\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"46\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tS\" x=\"46\" y=\"32\">S\u003c/text>\u003ccircle class=\"F\" cx=\"63\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tF\" x=\"63\" y=\"32\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"80\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tS\" x=\"80\" y=\"32\">S\u003c/text>\u003ccircle class=\"F\" cx=\"12\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"12\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"29\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tS\" x=\"29\" y=\"49\">S\u003c/text>\u003ccircle class=\"F\" cx=\"46\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"46\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"63\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tS\" x=\"63\" y=\"49\">S\u003c/text>\u003ccircle class=\"F\" cx=\"80\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"80\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"12\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tS\" x=\"12\" y=\"66\">S\u003c/text>\u003ccircle class=\"F\" cx=\"29\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tF\" x=\"29\" y=\"66\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"46\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tS\" x=\"46\" y=\"66\">S\u003c/text>\u003ccircle class=\"F\" cx=\"63\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tF\" x=\"63\" y=\"66\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"80\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tS\" x=\"80\" y=\"66\">S\u003c/text>\u003ctext x=\"46\" y=\"94\" style=\"font-size:14px\">A\u003c/text>\u003c/g>\u003cg transform=\"translate(109,6)\">\u003crect width=\"92\" heigh t>\u003ccircle class=\"F\" cx=\"80\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tF\" x=\"80\" y=\"15\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"12\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tF\" x=\"12\" y=\"32\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"29\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tF\" x=\"29\" y=\"32\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"46\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tF\" x=\"46\" y=\"32\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"63\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tF\" x=\"63\" y=\"32\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"80\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tF\" x=\"80\" y=\"32\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"12\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"12\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"29\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"29\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"46\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"46\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"63\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"63\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"80\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"80\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"12\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tF\" x=\"12\" y=\"66\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"29\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tF\" x=\"29\" y=\"66\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"46\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tF\" x=\"46\" y=\"66\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"63\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tF\" x=\"63\" y=\"66\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"80\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tF\" x=\"80\" y=\"66\">Fe\u003c/text>\u003ctext x=\"46\" y=\"94\" style=\"font-size:14px\">C\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q005", "koma": "chu2-kagaku-10", "t": "choice", "q": "鉄と硫黄の混合物を加熱する実験で、必ず換気をするのはなぜ？", "choices": ["硫黄を使う実験では、有害な気体が出ることがあるから", "鉄が燃えやすいから", "部屋が暑くなるから", "磁石が使えなくなるから"], "ex": "硫黄を使った実験では有害な気体が発生することがあるので、換気が欠かせない。", "fig": null, "kind": "method", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q006", "koma": "chu2-kagaku-10", "t": "choice", "q": "鉄と硫黄の混合物を加熱するとき、試験管のどこを加熱する？", "choices": ["混合物の上部", "試験管の底", "試験管の口", "混合物を入れない部分"], "ex": "混合物の上部を加熱して、反応を始めさせる。", "fig": null, "kind": "method", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q007", "koma": "chu2-kagaku-10", "t": "order", "q": "鉄と硫黄の混合物を加熱する準備と手順を、正しい順に並べよう。", "items": ["乳鉢で硫黄を細かくすりつぶし、鉄粉とよく混ぜる", "混合物を試験管に入れ、口に脱脂綿を軽くつめる", "換気をして、混合物の上部を加熱する", "上部が赤くなったら加熱をやめ、冷めるまで待つ"], "ex": "よく混ぜる→脱脂綿→換気して上部を加熱→冷ましてから調べる。", "fig": null, "kind": "method", "level": 2, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q008", "koma": "chu2-kagaku-10", "t": "choice", "q": "加熱する試験管の口に、脱脂綿を軽くつめるのはなぜ？", "choices": ["有害な気体が外に出ていくのを防ぐため", "混合物がこぼれないように密閉するため", "試験管を冷やすため", "磁石を近づけやすくするため"], "ex": "脱脂綿で軽くふさぐ。ゴム栓で密閉すると危険。", "fig": null, "kind": "method", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q009", "koma": "chu2-kagaku-10", "t": "choice", "q": "加熱している試験管の口の向きとして正しいものは？", "choices": ["人のいない方に向ける", "自分の顔の方に向ける", "となりの人の方に向ける", "真上に向けてのぞきこむ"], "ex": "加熱中の試験管の口は、人に向けない。", "fig": null, "kind": "method", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q010", "koma": "chu2-kagaku-10", "t": "choice", "q": "硫黄を細かくすりつぶし、鉄粉とよく混ぜ合わせるのはなぜ？", "choices": ["鉄と硫黄がよくふれ合うようにするため", "混合物の色を黒くするため", "においを消すため", "質量を軽くするため"], "ex": "よくふれ合っていないと、反応が進みにくい。", "fig": null, "kind": "method", "level": 2, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q011", "koma": "chu2-kagaku-10", "t": "choice", "q": "2種類以上の物質が、結び付かずにまざっているものを何という？", "choices": ["混合物", "化合物", "単体", "分子"], "ex": "鉄と硫黄を混ぜただけのものは混合物。", "fig": null, "kind": "term", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q012", "koma": "chu2-kagaku-10", "t": "choice", "q": "「加熱後の物質は磁石に引きつけられない」と予想した。その根拠として筋が通っているものは？", "choices": ["鉄が別の物質に変われば、鉄の性質（磁石につく）はなくなると考えられるから", "混合物は鉄の部分が磁石についたから", "鉄粉は灰色だから", "なんとなくそう思うから"], "ex": "予想は、分かっている事実や規則とつなげて根拠を書く。", "fig": null, "kind": "judge", "level": 2, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q013", "koma": "chu2-kagaku-10", "t": "num", "q": "鉄粉3.5gと硫黄2.0gの割合で混合物をつくる。鉄粉を7.0gにするなら、硫黄は何g用意すればよい？", "ans": 4.0, "unit": "g", "tol": 0.05, "ex": "鉄粉を2倍にしたので、硫黄も2倍の4.0g。", "fig": null, "kind": "calc", "level": 2, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q014", "koma": "chu2-kagaku-10", "t": "choice", "q": "鉄と硫黄を混ぜた混合物の中の硫黄は、混ぜる前の硫黄と比べて性質はどうなっている？", "choices": ["同じ性質のまま", "鉄と同じ性質になっている", "磁石につく性質になっている", "黒い物質に変わっている"], "ex": "混ぜただけでは、それぞれの物質の性質は変わらない。", "fig": null, "kind": "judge", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-tetsu-iou-tamago-q015", "koma": "chu2-kagaku-10", "t": "choice", "q": "加熱した試験管に磁石を近づけて調べるのは、いつがよい？", "choices": ["試験管が冷めるまで待ってから", "加熱している最中", "加熱をやめた直後の熱いうち", "調べなくてよい"], "ex": "熱いうちにふれるとやけどのおそれがある。冷めてから調べる。", "fig": null, "kind": "method", "level": 1, "game": "tetsu-iou-tamago"}, {"id": "chu2-before-after-q001", "koma": "chu2-kagaku-11", "t": "choice", "q": "鉄と硫黄の混合物を加熱してできた物質に磁石を近づけると、どうなる？", "choices": ["引きつけられない", "引きつけられる", "一部だけ引きつけられる"], "ex": "反応後の物質は鉄とはちがう物質なので、磁石に引きつけられない。", "fig": null, "kind": "judge", "level": 1, "game": "before-after"}, {"id": "chu2-before-after-q002", "koma": "chu2-kagaku-11", "t": "choice", "q": "鉄と硫黄の混合物を加熱してできた物質の色は？", "choices": ["黒色", "黄色", "灰色と黄色がまじった色", "白色"], "ex": "加熱後は黒い物質ができる。", "fig": null, "kind": "judge", "level": 1, "game": "before-after"}, {"id": "chu2-before-after-q003", "koma": "chu2-kagaku-11", "t": "choice", "q": "表は、加熱前後の物質を調べた結果である。この結果からいえることは？", "choices": ["加熱後には、鉄とも硫黄とも性質のちがう物質ができた", "加熱後も、鉄と硫黄がまざったままである", "加熱後には、鉄だけが残った", "加熱後には、硫黄だけが残った"], "ex": "色・すがた・磁石・塩酸との反応がすべてちがうので、別の物質ができたといえる。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 150\" width=\"320\" height=\"150\" font-family=\"sans-serif\" font-size=\"12\">\u003crect x=\"1\" y=\"1\" width=\"318\" height=\"148\" fill=\"#fff\" stroke=\"#333\"/>\u003cline x1=\"1\" y1=\"30\" x2=\"319\" y2=\"30\" stroke=\"#333\"/>\u003cline x1=\"1\" y1=\"60\" x2=\"319\" y2=\"60\" stroke=\"#333\"/>\u003cline x1=\"1\" y1=\"90\" x2=\"319\" y2=\"90\" stroke=\"#333\"/>\u003cline x1=\"1\" y1=\"120\" x2=\"319\" y2=\"120\" stroke=\"#333\"/>\u003cline x1=\"80\" y1=\"1\" x2=\"80\" y2=\"149\" stroke=\"#333\"/>\u003cline x1=\"200\" y1=\"1\" x2=\"200\" y2=\"149\" stroke=\"#333\"/>\u003ctext x=\"140\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\">加熱前（混合物）\u003c/text>\u003ctext x=\"260\" y=\"20\" text-anchor=\"middle\" font-weight=\"bold\">加熱後\u003c/text>\u003ctext x=\"40\" y=\"50\" text-anchor=\"middle\">色\u003c/text>\u003ctext x=\"140\" y=\"50\" text-anchor=\"middle\">灰色と黄色\u003c/text>\u003ctext x=\"260\" y=\"50\" text-anchor=\"middle\">黒色\u003c/text>\u003ctext x=\"40\" y=\"80\" text-anchor=\"middle\">すがた\u003c/text>\u003ctext x=\"140\" y=\"80\" text-anchor=\"middle\">粉\u003c/text>\u003ctext x=\"260\" y=\"80\" text-anchor=\"middle\">かたまり\u003c/text>\u003ctext x=\"40\" y=\"110\" text-anchor=\"middle\">磁石\u003c/text>\u003ctext x=\"140\" y=\"110\" text-anchor=\"middle\">引きつけられる\u003c/text>\u003ctext x=\"260\" y=\"110\" text-anchor=\"middle\">引きつけられない\u003c/text>\u003ctext x=\"40\" y=\"140\" text-anchor=\"middle\">塩酸\u003c/text>\u003ctext x=\"140\" y=\"140\" text-anchor=\"middle\">においのない気体\u003c/text>\u003ctext x=\"260\" y=\"140\" text-anchor=\"middle\">特有のにおいの気体\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "before-after"}, {"id": "chu2-before-after-q004", "koma": "chu2-kagaku-11", "t": "choice", "q": "加熱後の物質にうすい塩酸を加えると、どんな気体が発生する？", "choices": ["卵がくさったようなにおいの気体（硫化水素）", "においのない気体（水素）", "ものを燃やす気体（酸素）", "石灰水をにごらせる気体（二酸化炭素）"], "ex": "硫化鉄に塩酸を加えると、有毒な硫化水素が出る。", "fig": null, "kind": "judge", "level": 1, "game": "before-after"}, {"id": "chu2-before-after-q005", "koma": "chu2-kagaku-11", "t": "choice", "q": "加熱前の混合物にうすい塩酸を加えると、どんな気体が発生する？", "choices": ["においのない気体（水素）", "卵がくさったようなにおいの気体（硫化水素）", "酸素", "気体は発生しない"], "ex": "混合物の中の鉄が塩酸と反応して水素が出る。", "fig": null, "kind": "judge", "level": 2, "game": "before-after"}, {"id": "chu2-before-after-q006", "koma": "chu2-kagaku-11", "t": "choice", "q": "鉄と硫黄が結び付いてできた物質を何という？", "choices": ["硫化鉄", "硫黄鉄", "酸化鉄", "鉄硫黄"], "ex": "鉄と硫黄が結び付いた物質は硫化鉄。", "fig": null, "kind": "term", "level": 1, "game": "before-after"}, {"id": "chu2-before-after-q007", "koma": "chu2-kagaku-11", "t": "choice", "q": "鉄と硫黄が結び付く化学変化を、物質名で正しく表しているのはどれ？", "choices": ["鉄 ＋ 硫黄 → 硫化鉄", "硫化鉄 → 鉄 ＋ 硫黄", "鉄 ＋ 硫黄 → 鉄 ＋ 硫黄", "鉄 ＋ 硫黄 → 硫化鉄 ＋ 酸素"], "ex": "2種類の物質（鉄と硫黄）が結び付いて1種類の硫化鉄ができる。", "fig": null, "kind": "judge", "level": 1, "game": "before-after"}, {"id": "chu2-before-after-q008", "koma": "chu2-kagaku-11", "t": "choice", "q": "A〜Cは原子のモデルである（Fe＝鉄原子、S＝硫黄原子）。鉄と硫黄が結び付いてできた物質を表しているのはどれ？", "choices": ["C", "A", "B"], "ex": "硫化鉄は、鉄原子と硫黄原子が結び付いている。Aは混ぜただけの混合物。", "fig": "\u003csvg id=\"bafig\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 310 104\" width=\"310\" height=\"104\" font-family=\"sans-serif\">\u003cstyle>#bafig .F{fill:#767C8A}#bafig .S{fill:#EAD23C}#bafig text{font-size:7px;font-weight:bold;text-anchor:middle}#bafig .tF{fill:#fff}#bafig .tS{fill:#4d3f00}\u003c/style>\u003cg transform=\"translate(4,6)\">\u003crect width=\"92\" height=\"74\" rx=\"6\" fill=\"#fdf8ec\" stroke=\"#999\"/>\u003ccircle class=\"F\" cx=\"12\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tF\" x=\"12\" y=\"15\">Fe\u003c/text>\u003ccircle class=\"F\" cx=\"29\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tF\" x=\"29\" y=\"15\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"63\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tS\" x=\"63\" y=\"15\">S\u003c/text>\u003ccircle class=\"S\" cx=\"80\" cy=\"12\" r=\"8\"/>\u003ctext class=\"tS\" x=\"80\" y=\"15\">S\u003c/text>\u003ccircle class=\"F\" cx=\"12\" cy=\"29\" r=\"8\"/>\u003ctext class=\ " x=\"12\" y=\"32\">S\u003c/text>\u003ccircle class=\"F\" cx=\"29\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tF\" x=\"29\" y=\"32\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"46\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tS\" x=\"46\" y=\"32\">S\u003c/text>\u003ccircle class=\"F\" cx=\"63\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tF\" x=\"63\" y=\"32\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"80\" cy=\"29\" r=\"8\"/>\u003ctext class=\"tS\" x=\"80\" y=\"32\">S\u003c/text>\u003ccircle class=\"F\" cx=\"12\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"12\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"29\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tS\" x=\"29\" y=\"49\">S\u003c/text>\u003ccircle class=\"F\" cx=\"46\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"46\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"63\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tS\" x=\"63\" y=\"49\">S\u003c/text>\u003ccircle class=\"F\" cx=\"80\" cy=\"46\" r=\"8\"/>\u003ctext class=\"tF\" x=\"80\" y=\"49\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"12\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tS\" x=\"12\" y=\"66\">S\u003c/text>\u003ccircle class=\"F\" cx=\"29\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tF\" x=\"29\" y=\"66\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"46\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tS\" x=\"46\" y=\"66\">S\u003c/text>\u003ccircle class=\"F\" cx=\"63\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tF\" x=\"63\" y=\"66\">Fe\u003c/text>\u003ccircle class=\"S\" cx=\"80\" cy=\"63\" r=\"8\"/>\u003ctext class=\"tS\" x=\"80\" y=\"66\">S\u003c/text>\u003ctext x=\"46\" y=\"94\" style=\"font-size:14px\">C\u003c/text>\u003c/g>\u003c/svg>", "kind": "graph", "level": 2, "game": "before-after"}, {"id": "chu2-before-after-q009", "koma": "chu2-kagaku-11", "t": "choice", "q": "混合物の上部を加熱し、赤くなったところで加熱をやめた。それでも赤い部分が広がっていった。この理由として正しいのは？", "choices": ["反応で熱が出て、その熱で反応が進んだから", "ガスバーナーの熱が残っていたから", "空気中の酸素が入ったから", "磁石の力がはたらいたから"], "ex": "鉄と硫黄が結び付く反応では熱が出るので、加熱をやめても反応が進む。", "fig": null, "kind": "judge", "level": 2, "game": "before-after"}, {"id": "chu2-before-after-q010", "koma": "chu2-kagaku-11", "t": "choice", "q": "2種類の物質が結び付いてできた物質の性質について、正しいものは？", "choices": ["元のどちらの物質とも性質がちがう", "元の2つの物質の性質をあわせもつ", "多い方の物質と同じ性質になる", "元の物質と同じ性質のまま"], "ex": "結び付いてできた物質は、別の物質なので性質もちがう。", "fig": null, "kind": "judge", "level": 1, "game": "before-after"}, {"id": "chu2-before-after-q011", "koma": "chu2-kagaku-11", "t": "choice", "q": "加熱後の物質が「別の物質」だといえる根拠にならないものはどれ？", "choices": ["加熱に使った試験管の大きさ", "磁石に引きつけられなくなったこと", "色が黒に変わったこと", "塩酸で出る気体がちがったこと"], "ex": "根拠になるのは、物質の性質のちがい。", "fig": null, "kind": "judge", "level": 1, "game": "before-after"}, {"id": "chu2-before-after-q012", "koma": "chu2-kagaku-11", "t": "choice", "q": "鉄粉と硫化鉄は、どちらも暗い色をしている。この2つを見分ける方法として、最もよいものは？", "choices": ["磁石を近づける", "重さをはかる", "手でさわる", "においをかぐ"], "ex": "鉄粉は磁石に引きつけられるが、硫化鉄は引きつけられない。", "fig": null, "kind": "method", "level": 1, "game": "before-after"}, {"id": "chu2-before-after-q013", "koma": "chu2-kagaku-11", "t": "choice", "q": "加熱前と加熱後の物質の、磁石へのつき方を比べるときに大切なことは？", "choices": ["同じ磁石を、同じように近づけて比べる", "加熱後の物質だけに近づける", "ちがう強さの磁石を使う", "熱いうちにすぐ近づける"], "ex": "比べるときは条件をそろえる。熱いうちはやけどのおそれもある。", "fig": null, "kind": "method", "level": 2, "game": "before-after"}, {"id": "chu2-before-after-q014", "koma": "chu2-kagaku-11", "t": "num", "q": "鉄と硫黄の混合物を加熱すると、何種類の物質ができる？", "ans": 1, "unit": "種類", "tol": 0, "ex": "2種類の物質が結び付いて、1種類の物質（硫化鉄）ができる。", "fig": null, "kind": "judge", "level": 1, "game": "before-after"}, {"id": "chu2-before-after-q015", "koma": "chu2-kagaku-11", "t": "choice", "q": "発生した気体のにおいを調べるときの正しい方法は？", "choices": ["手であおぐようにしてかぐ", "試験管に鼻を近づけて深く吸いこむ", "口に入れて味をみる", "においは調べてはいけない決まりなので、見るだけ"], "ex": "有毒な気体もあるので、深く吸いこまず手であおいでかぐ。硫化水素は有毒なので必ず換気し、先生の指示に従う。", "fig": null, "kind": "method", "level": 1, "game": "before-after"}, {"id": "chu2-atom-block-q001", "koma": "chu2-kagaku-12", "t": "choice", "q": "図は、ある化学変化を原子のモデルで表したものです。この変化の種類として正しいものはどれ？", "choices": ["結び付く反応（2種類の物質から、別の1種類の物質ができる）", "分解（1種類の物質から、2種類以上の物質ができる）", "状態変化（物質そのものは変わらない）"], "ex": "鉄と硫黄の2種類から、硫化鉄という別の1種類の物質ができている。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 180.4 60\" width=\"180.4\" height=\"60\" font-family=\"sans-serif\">\u003ccircle cx=\"22.0\" cy=\"30\" r=\"12\" fill=\"#767C8A\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"22.0\" y=\"34\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">Fe\u003c/text>\u003ctext x=\"48.0\" y=\"36\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">＋\u003c/text>\u003ccircle cx=\"74.0\" cy=\"30\" r=\"12\" fill=\"#EAD23C\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"74.0\" y=\"34\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#4d3f00\">S\u003c/text>\u003ctext x=\"104.0\" y=\"36\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">→\u003c/text>\u003ccircle cx=\"132.0\" cy=\"30\" r=\"12\" fill=\"#767C8A\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"132.0\" y=\"34\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">Fe\u003c/text>\u003ccircle cx=\"152.4\" cy=\"30\" r=\"12\" fill=\"#EAD23C\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"152.4\" y=\"34\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#4d3f00\">S\u003c/text>\u003c/svg>", "kind": "judge", "level": 1, "game": "atom-block"}, {"id": "chu2-atom-block-q002", "koma": "chu2-kagaku-12", "t": "choice", "q": "図は、酸化銀を加熱したときの変化をモデルで表したものです。正しい説明はどれ？", "choices": ["1種類の物質が、銀と酸素の2種類に分かれた（分解）", "2種類の物質が結び付いて、1種類の物質になった", "銀原子が、酸素原子に変わった", "加熱すると、原子がこわれて小さくなった"], "ex": "酸化銀1種類から銀と酸素の2種類ができる分解。原子の組合せが変わっただけで、原子の種類は変わらない。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 351.5 60\" width=\"351.5\" height=\"60\" font-family=\"sans-serif\">\u003ccircle cx=\"17.0\" cy=\"30\" r=\"11\" fill=\"#C9CDD4\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"17.0\" y=\"34\" font-size=\"9\" font-weight=  x=\"292.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"309.0\" cy=\"24\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"309.0\" y=\"28\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"18.0\" cy=\"66\" r=\"10\" fill=\"#C8773C\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"18.0\" y=\"70\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">Cu\u003c/text>\u003ccircle cx=\"44.0\" cy=\"66\" r=\"10\" fill=\"#C8773C\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"44.0\" y=\"70\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">Cu\u003c/text>\u003ctext x=\"68.0\" y=\"72\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">＋\u003c/text>\u003ccircle cx=\"92.0\" cy=\"66\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"92.0\" y=\"70\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"109.0\" cy=\"66\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"109.0\" y=\"70\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"137.0\" y=\"72\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">→\u003c/text>\u003ccircle cx=\"163.0\" cy=\"66\" r=\"10\" fill=\"#C8773C\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"163.0\" y=\"70\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">Cu\u003c/text>\u003ccircle cx=\"180.0\" cy=\"66\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"180.0\" y=\"70\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"206.0\" cy=\"66\" r=\"10\" fill=\"#C8773C\" stroke=\"#00000055\" stroke-wi text-anchor=\"middle\" fill=\"#cfc5a8\">反応後\u003c/text>\u003ccircle cx=\"28\" cy=\"48\" r=\"10\" fill=\"#C8773C\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"28\" y=\"52\" font-size=\"9\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">Cu\u003c/text>\u003ctext x=\"46\" y=\"52\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" fill=\"#f3ecd8\">銅\u003c/text>\u003ctext x=\"150\" y=\"53\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#f3ecd8\">2\u003c/text>\u003ctext x=\"240\" y=\"53\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#f3ecd8\">2\u003c/text>\u003ccircle cx=\"28\" cy=\"74\" r=\"10\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"28\" y=\"78\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"46\" y=\"78\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" fill=\"#f3ecd8\">酸素\u003c/text>\u003ctext x=\"150\" y=\"79\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#f3ecd8\">2\u003c/text>\u003ctext x=\"240\" y=\"79\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#f3ecd8\">2\u003c/text>\u003ctext x=\"20\" y=\"100\" font-size=\"12\" font-weight=\"700\" text-anchor=\"start\" fill=\"#e7dcc0\">物質：銅・酸素 → 酸化銅\u003c/text>\u003c/svg>", "kind": "graph", "level": 2, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q003", "koma": "chu2-kagaku-14", "t": "choice", "q": "ある人が、水ができる変化を図のようなモデルで表した。このモデルのおかしなところはどれ？", "choices": ["反応の後で、酸素原子が1個なくなっている", "反応の後で、水素原子がふえている", "反応の前と後で、原子の組合せが変わっている", "おかしなところはない"], "ex": "反応前は酸素原子2個、反応後は1個。原子は化学変化でなくなったり生まれたりしない。組合せが変わるのは正しい。", "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 212.7 60\" width=\"212.7\" height=\"60\" font-family=\"sans-serif\">\u003ccircle cx=\"19.0\" cy=\"30\" r=\"11\" fill=\"#EAF6FF\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"19.0\" y=\"34\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1c4f86\">H\u003c/text>\u003ccircle cx=\"37.7\" cy=\"30\" r=\"11\" fill=\"#EAF6FF\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"37.7\" y=\"34\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1c4f86\">H\u003c/text>\u003ctext x=\"62.7\" y=\"36\" font-size=\"18\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">＋\u003c/text>\u003ccircle cx=\"87.7\" cy=\"30\" r=\"11\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"87.7\" y=\"34\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ccircle cx=\"106.4\" cy=\"30\" r=\"11\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"106.4\" y=\"34\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003ctext x=\"135.4\" y=\"36\" font-size=\"20\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#444\">→\u003c/text>\u003ccircle cx=\"162.4\" cy=\"36.6\" r=\"11\" fill=\"#EAF6FF\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"162.4\" y=\"40.6\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1c4f86\">H\u003c/text>\u003ccircle cx=\"187.7\" cy=\"36.6\" r=\"11\" fill=\"#EAF6FF\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"187.7\" y=\"40.6\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1c4f86\">H\u003c/text>\u003ccircle cx=\"175.05\" cy=\"23.95\" r=\"11\" fill=\"#E4572E\" stroke=\"#00000055\" stroke-width=\"1.2\"/>\u003ctext x=\"175.05\" y=\"27.95\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#fff\">O\u003c/text>\u003c/svg>", "kind": "judge", "level": 2, "game": "genshi-recycle"}, {"id": "chu2-genshi-recycle-q004", "koma": "chu2-kagaku-14", "t": "choice", "q": "問題の「水ができる変化」を正しく表したモデルはどれ？（酸素は、原子2個が結び付いた分子）", "choices": ["イ", "ア", "ウ"], "ex": "水素分子2個と酸素分子1個から、水分子2個。アは酸素が分子になっていない。ウは酸素原子1個だけが余る形になっている。", "fig": "\u003csvg xmlns=\"http://www.w3.org/
