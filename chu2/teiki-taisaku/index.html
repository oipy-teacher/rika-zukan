は地上より十数m高いだけなので、正しく測れば気温の差はごくわずか。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q014", "koma": "chu2-kisho-07", "t": "choice", "q": "グラフは、ある日の気温と風向の記録である。寒冷前線が通ったのは何時ごろと考えられるか。", "choices": ["15時ごろ（気温が急に下がり、風向が北寄りに変わった）", "9時ごろ（気温が低かった）", "12時ごろ（風向が南南西だった）", "20時ごろ（気温がいちばん低かった）"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 150\" font-size=\"10\">\u003crect x=\"34\" y=\"16\" width=\"256\" height=\"110\" fill=\"#fff\" stroke=\"#23324a\"/>\u003cline x1=\"34\" x2=\"290\" y1=\"126.0\" y2=\"126.0\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"129.0\" text-anchor=\"end\">5\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"98.5\" y2=\"98.5\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"101.5\" text-anchor=\"end\">10\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"71.0\" y2=\"71.0\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"74.0\" text-anchor=\"end\">15\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"43.5\" y2=\"43.5\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"46.5\" text-anchor=\"end\">20\u003c/text>\u003cline x1=\"34\" x2=\"290\" y1=\"16.0\" y2=\"16.0\" stroke=\"#dde7f1\"/>\u003ctext x=\"31\" y=\"19.0\" text-anchor=\"end\">25\u003c/text>\u003ctext x=\"34.0\" y=\"138\" text-anchor=\"middle\">8\u003c/text>\u003ctext x=\"76.7\" y=\"138\" text-anchor=\"middle\">10\u003c/text>\u003ctext x=\"119.3\" y=\"138\" text-anchor=\"middle\">12\u003c/text>\u003ctext x=\"162.0\" y=\"138\" text-anchor=\"middle\">14\u003c/text>\u003ctext x=\"204.7\" y=\"138\" text-anchor=\"middle\">16\u003c/text>\u003ctext x=\"247.3\" y=\"138\" text-anchor=\"middle\">18\u003c/text>\u003ctext x=\"290.0\" y=\"138\" text-anchor=\"middle\">20\u003c/text>\u003ctext x=\"2\" y=\"11\">℃\u003c/text>\u003ctext x=\"290\" y=\"148\" text-anchor=\"end\">時\u003c/text>\u003cpolyline fill=\"none\" stroke=\"#c9302c\" stroke-width=\"2.5\" points=\"34.0,43.5 55.3,43.5 76.7,43.5 98.0,43.5 119.3,43.5 140.7,43.5 162.0,49.0 183.3,87.5 204.7,93.0 226.0,93.0 247.3,93.0 268.7,93.0 290.0,93.0\"/>\u003ccircle cx=\"34.0\" cy=\"43.5\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"55.3\" cy=\"43.5\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"76.7\" cy=\"43.5\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"98.0\" cy=\"43.5\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"119.3\" cy=\"43.5\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"140.7\" cy=\"43.5\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"162.0\" cy=\"49.0\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"183.3\" cy=\"87.5\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"204.7\" cy=\"93.0\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"226.0\" cy=\"93.0\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"247.3\" cy=\"93.0\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"268.7\" cy=\"93.0\" r=\"3\" fill=\"#c9302c\"/>\u003ccircle cx=\"290.0\" cy=\"93.0\" r=\"3\" fill=\"#c9302c\"/>\u003ctext x=\"34.0\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" fill=\"#3f7d4e\">南\u003c/text>\u003ctext x=\"76.7\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" fill=\"#3f7d4e\">南\u003c/text>\u003ctext x=\"119.3\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" fill=\"#3f7d4e\">南南西\u003c/text>\u003ctext x=\"162.0\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" fill=\"#3f7d4e\">南南西\u003c/text>\u003ctext x=\"204.7\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" fill=\"#3f7d4e\">北北西\u003c/text>\u003ctext x=\"247.3\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" fill=\"#3f7d4e\">北北西\u003c/text>\u003ctext x=\"290.0\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" fill=\"#3f7d4e\">北\u003c/text>\u003ctext x=\"150.0\" y=\"11\" text-anchor=\"middle\" font-weight=\"700\">ある日の気温と風向（緑の文字）\u003c/text>\u003c/svg>", "ex": "寒冷前線が通ると、気温が急に下がり、風向が南寄りから北寄りに変わる。", "kind": "graph", "level": 2, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-kansokujo-q015", "koma": "chu2-kisho-07", "t": "num", "q": "6時から18時まで、1時間ごとに気温を測る。測る回数は全部で何回か。（6時と18時もふくむ）", "ans": 13, "unit": "回", "tol": 0, "ex": "18−6＝12時間。はじめの6時の1回を加えて13回。", "kind": "calc", "level": 2, "fig": null, "game": "kisho-kansokujo"}, {"id": "chu2-kisho-highlow-q001", "koma": "chu2-kisho-08", "t": "choice", "q": "上のグラフは、ある晴れた日の気温の変化である。この日の湿度の変化を表すグラフとして、もっとも適切なものは？（上ほど湿度が大きい）", "choices": ["ウ（朝に高く、昼すぎに低い）", "ア（朝に低く、昼すぎに高い）", "イ（1日中ほとんど変わらない）", "エ（上がったり下がったりをくり返す）"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 330 200\" font-size=\"10\">\u003ctext x=\"4\" y=\"12\" font-weight=\"700\">気温（ある晴れた日）\u003c/text>\u003cg transform=\"translate(113 18)\">\u003crect width=\"104\" height=\"70\" fill=\"#fff\" stroke=\"#333\"/>\u003cpolyline fill=\"none\" stroke=\"#e8333a\" stroke-width=\"2.5\" points=\"8,60 30,42 52,18 74,12 96,30\"/>\u003ctext x=\"0\" y=\"82\">6時\u003c/text>\u003ctext x=\"84\" y=\"82\">18時\u003c/text>\u003c/g>\u003cg transform=\"translate(4 112)\">\u003crect width=\"74\" height=\"62\" fill=\"#fff\" stroke=\"#333\"/>\u003cpolyline fill=\"none\" stroke=\"#1f7de0\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\" points=\"5.76,60 21.599999999999998,42 37.44,18 53.28,12 69.12,30\"/>\u003ctext x=\"37\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">ア\u003c/text>\u003c/g>\u003cg transform=\"translate(86 112)\">\u003crect width=\"74\" height=\"62\" fill=\"#fff\" stroke=\"#333\"/>\u003cpolyline fill=\"none\" stroke=\"#1f7de0\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\" points=\"5.76,36 21.599999999999998,34 37.44,35 53.28,34 69.12,36\"/>\u003ctext x=\"37\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">イ\u003c/text>\u003c/g>\u003cg transform=\"translate(168 112)\">\u003crect width=\"74\" height=\"62\" fill=\"#fff\" stroke=\"#333\"/>\u003cpolyline fill=\"none\" stroke=\"#1f7de0\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\" points=\"5.76,10 21.599999999999998,24 37.44,48 53.28,56 69.12,38\"/>\u003ctext x=\"37\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">ウ\u003c/text>\u003c/g>\u003cg transform=\"translate(250 112)\">\u003crect width=\"74\" height=\"62\" fill=\"#fff\" stroke=\"#333\"/>\u003cpolyline fill=\"none\" stroke=\"#1f7de0\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\" points=\"5.76,40 21.599999999999998,12 37.44,55 53.28,18 69.12,50\"/>\u003ctext x=\"37\" y=\"76\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">エ\u003c/text>\u003c/g>\u003ctext x=\"4\" y=\"106\" font-weight=\"700\">湿度のグラフの候補\u003c/text>\u003c/svg>", "ex": "晴れの日は、気温が上がると湿度が下がる。気温のグラフと逆の形になる。", "kind": "graph", "level": 2, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q002", "koma": "chu2-kisho-08", "t": "choice", "q": "グラフは、ある晴れた日の気温・湿度・気圧のどれかを表している（A・B・C）。湿度を表しているのはどれか。", "choices": ["B（気温が高い昼すぎに低くなっている）", "A（昼すぎに高くなっている）", "C（1日中ほとんど変わらない）"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 150\" font-size=\"10\">\u003crect x=\"30\" y=\"10\" width=\"250\" height=\"110\" fill=\"#fff\" stroke=\"#333\"/>\u003cpolyline fill=\"none\" stroke=\"#e8333a\" stroke-width=\"2.5\" points=\"30,95 80,80 130,45 180,35 230,50 280,70\"/>\u003cpolyline fill=\"none\" stroke=\"#1f7de0\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\" points=\"30,30 80,45 130,80 180,92 230,72 280,50\"/>\u003cpolyline fill=\"none\" stroke=\"#2a9d4b\" stroke-width=\"2.5\" points=\"30,62 80,60 130,63 180,64 230,62 280,61\"/>\u003ctext x=\"284\" y=\"74\" fill=\"#e8333a\" font-weight=\"700\">A\u003c/text>\u003ctext x=\"284\" y=\"48\" fill=\"#1f7de0\" font-weight=\"700\">B\u003c/text>\u003ctext x=\"284\" y=\"62\" fill=\"#2a9d4b\" font-weight=\"700\">C\u003c/text>\u003ctext x=\"30\" y=\"134\">6時\u003c/text>\u003ctext x=\"130\" y=\"134\">12時\u003c/text>\u003ctext x=\"250\" y=\"134\">18時\u003c/text>\u003ctext x=\"40\" y=\"146\">ある晴れた日の気温・湿度・気圧（A・B・C）\u003c/text>\u003c/svg>", "ex": "晴れの日の昼に高くなるAが気温。その逆の形のBが湿度。変化の小さいCは気圧。", "kind": "graph", "level": 2, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q003", "koma": "chu2-kisho-08", "t": "choice", "q": "晴れた日、気温がもっとも高くなる14時ごろ、湿度はどうなっていることが多いか。", "choices": ["1日の中で低いころになっている", "1日の中で高いころになっている", "100％になっている", "朝と同じになっている"], "ex": "晴れの日は気温と湿度が逆向きに変化するので、気温が最も高いころ湿度は低い。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q004", "koma": "chu2-kisho-08", "t": "choice", "q": "雨の日の気温と湿度の変化の特徴として、正しいものはどれか。", "choices": ["湿度は高いままで、気温も湿度も変化が小さい", "湿度がとても低く、気温が大きく変化する", "晴れの日と同じく、気温と逆向きに大きく変化する", "気温と湿度がどちらも急に上がり続ける"], "ex": "雨の日は湿度が高いまま、日ざしが弱いので気温の変化も小さい。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q005", "koma": "chu2-kisho-08", "t": "choice", "q": "表は、ある晴れた日に校庭で測った記録である。不自然な値と考えられるものはどれか。", "choices": ["13時の湿度（80％）", "9時の気温（18℃）", "14時の湿度（47％）", "12時の気温（23℃）"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 70\" font-size=\"11\">\u003crect x=\"2\" y=\"2\" width=\"296\" height=\"66\" fill=\"#fff\" stroke=\"#333\"/>\u003ctext x=\"24\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\">時刻\u003c/text>\u003ctext x=\"62\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\">9\u003c/text>\u003ctext x=\"100\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\">10\u003c/text>\u003ctext x=\"138\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\">11\u003c/text>\u003ctext x=\"176\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\">12\u003c/text>\u003ctext x=\"214\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\">13\u003c/text>\u003ctext x=\"252\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\">14\u003c/text>\u003ctext x=\"290\" y=\"20\" text-anchor=\"middle\" font-weight=\"700\">15\u003c/text>\u003ctext x=\"24\" y=\"40\" text-anchor=\"middle\" font-weight=\"700\">気温℃\u003c/text>\u003ctext x=\"62\" y=\"40\" text-anchor=\"middle\" font-weight=\"400\">18\u003c/text>\u003ctext x=\"100\" y=\"40\" text-anchor=\"middle\" font-weight=\"400\">20\u003c/text>\u003ctext x=\"138\" y=\"40\" text-anchor=\"middle\" font-weight=\"400\">22\u003c/text>\u003ctext x=\"176\" y=\"40\" text-anchor=\"middle\" font-weight=\"400\">23\u003c/text>\u003ctext x=\"214\" y=\"40\" text-anchor=\"middle\" font-weight=\"400\">24\u003c/text>\u003ctext x=\"252\" y=\"40\" text-anchor=\"middle\" font-weight=\"400\">24\u003c/text>\u003ctext x=\"290\" y=\"40\" text-anchor=\"middle\" font-weight=\"400\">23\u003c/text>\u003ctext x=\"24\" y=\"60\" text-anchor=\"middle\" font-weight=\"700\">湿度%\u003c/text>\u003ctext x=\"62\" y=\"60\" text-anchor=\"middle\" font-weight=\"400\">70\u003c/text>\u003ctext x=\"100\" y=\"60\" text-anchor=\"middle\" font-weight=\"400\">62\u003c/text>\u003ctext x=\"138\" y=\"60\" text-anchor=\"middle\" font-weight=\"400\">55\u003c/text>\u003ctext x=\"176\" y=\"60\" text-anchor=\"middle\" font-weight=\"400\">51\u003c/text>\u003ctext x=\"214\" y=\"60\" text-anchor=\"middle\" font-weight=\"400\">80\u003c/text>\u003ctext x=\"252\" y=\"60\" text-anchor=\"middle\" font-weight=\"400\">47\u003c/text>\u003ctext x=\"290\" y=\"60\" text-anchor=\"middle\" font-weight=\"400\">49\u003c/text>\u003c/svg>", "ex": "晴れの日は気温が上がると湿度は下がる。13時だけ湿度が急に高く、前後とつながらない。", "kind": "graph", "level": 2, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q006", "koma": "chu2-kisho-08", "t": "num", "q": "乾湿計で、乾球が20.0℃、湿球が17.0℃を示した。乾球と湿球の示度の差は何℃か。", "ans": 3, "unit": "℃", "tol": 0.05, "ex": "20.0−17.0＝3.0℃。この差と乾球の値から湿度表で湿度を読む。", "kind": "calc", "level": 1, "fig": null, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q007", "koma": "chu2-kisho-08", "t": "num", "q": "乾湿計で、乾球が24℃、湿球が18℃を示した。表の湿度表を使うと、湿度は何％か。", "ans": 53, "unit": "％", "tol": 0, "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 300 120\" font-size=\"10\">\u003ctext x=\"4\" y=\"12\" font-weight=\"700\">湿度表（一部）単位％\u003c/text>\u003ctext x=\"96\" y=\"26\" font-weight=\"700\">乾球と湿球の差（℃）\u003c/text>\u003ctext x=\"70\" y=\"40\" text-anchor=\"middle\" font-weight=\"700\">0\u003c/text>\u003ctext x=\"102\" y=\"40\" text-anchor=\"middle\" font-weight=\"700\">1\u003c/text>\u003ctext x=\"134\" y=\"40\" text-anchor=\"middle\" font-weight=\"700\">2\u003c/text>\u003ctext x= xt x=\"262\" y=\"84\" text-anchor=\"middle\">50\u003c/text>\u003ctext x=\"22\" y=\"98\" text-anchor=\"middle\" font-weight=\"700\">20\u003c/text>\u003ctext x=\"70\" y=\"98\" text-anchor=\"middle\">100\u003c/text>\u003ctext x=\"102\" y=\"98\" text-anchor=\"middle\">91\u003c/text>\u003ctext x=\"134\" y=\"98\" text-anchor=\"middle\">81\u003c/text>\u003ctext x=\"166\" y=\"98\" text-anchor=\"middle\">72\u003c/text>\u003ctext x=\"198\" y=\"98\" text-anchor=\"middle\">64\u003c/text>\u003ctext x=\"230\" y=\"98\" text-anchor=\"middle\">56\u003c/text>\u003ctext x=\"262\" y=\"98\" text-anchor=\"middle\">48\u003c/text>\u003ctext x=\"22\" y=\"112\" text-anchor=\"middle\" font-weight=\"700\">18\u003c/text>\u003ctext x=\"70\" y=\"112\" text-anchor=\"middle\">100\u003c/text>\u003ctext x=\"102\" y=\"112\" text-anchor=\"middle\">90\u003c/text>\u003ctext x=\"134\" y=\"112\" text-anchor=\"middle\">80\u003c/text>\u003ctext x=\"166\" y=\"112\" text-anchor=\"middle\">71\u003c/text>\u003ctext x=\"198\" y=\"112\" text-anchor=\"middle\">62\u003c/text>\u003ctext x=\"230\" y=\"112\" text-anchor=\"middle\">53\u003c/text>\u003ctext x=\"262\" y=\"112\" text-anchor=\"middle\">44\u003c/text>\u003cline x1=\"4\" x2=\"296\" y1=\"44\" y2=\"44\" stroke=\"#333\"/>\u003cline x1=\"44\" x2=\"44\" y1=\"30\" y2=\"118\" stroke=\"#333\"/>\u003c/svg>", "ex": "差は24−18＝6℃。乾球24℃の行と差6℃の列が交わる所を読む→53％。", "kind": "calc", "level": 2, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q008", "koma": "chu2-kisho-08", "t": "choice", "q": "乾湿計の湿球の示度が、乾球より低くなるのはなぜか。", "choices": ["湿球を包むぬれたガーゼの水が蒸発するとき、熱をうばうから", "湿球は日かげに、乾球は日なたに置くから", "湿球の温度計は目盛りが小さく書かれているから", "湿球のほうが空気が重いから"], "ex": "水が蒸発するときにまわりから熱をうばうので、湿球は乾球より低くなる。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q009", "koma": "chu2-kisho-08", "t": "choice", "q": "乾湿計で、乾球と湿球の示度の差が大きいときの空気のようすとして正しいものは？", "choices": ["乾燥していて、湿度が低い", "しめっていて、湿度が高い", "湿度は100％である", "気温がとても低い"], "ex": "乾いた空気ほど湿球の水がよく蒸発して温度が下がり、差が大きくなる。差が0なら湿度100％。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q010", "koma": "chu2-kisho-08", "t": "choice", "q": "晴れた日の朝6時に、気温14℃・湿度85％だった。同じ日の14時に気温は24℃になった。このときの湿度として考えられるものは？", "choices": ["85％より低い", "85％より高い", "85％のまま", "0％"], "ex": "晴れの日は気温が上がると湿度が下がる。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q011", "koma": "chu2-kisho-08", "t": "choice", "q": "グラフは、2つの日の気温（実線）と湿度（点線）の変化である。雨の日はどちらか。", "choices": ["B（湿度が高いまま、どちらも変化が小さい）", "A（気温と湿度が逆向きに大きく変化している）", "AもBも晴れの日で、雨の日はない"], "fig": "\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 120\" font-size=\"10\">\u003cg transform=\"translate(20 10)\">\u003crect width=\"120\" height=\"84\" fill=\"#fff\" stroke=\"#333\"/>\u003cpolyline fill=\"none\" stroke=\"#e8333a\" stroke-width=\"2.5\" points=\"9.6,70 36.0,50 62.4,22 88.8,15 115.19999999999999,35\"/>\u003cpolyline fill=\"none\" stroke=\"#1f7de0\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\" points=\"9.6,20 36.0,38 62.4,64 88.8,70 115.19999999999999,48\"/>\u003ctext x=\"60\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">Aの日\u003c/text>\u003c/g>\u003cg transform=\"translate(170 10)\">\u003crect width=\"120\" height=\"84\" fill=\"#fff\" stroke=\"#333\"/>\u003cpolyline fill=\"none\" stroke=\"#e8333a\" stroke-width=\"2.5\" points=\"9.6,52 36.0,50 62.4,48 88.8,49 115.19999999999999,51\"/>\u003cpolyline fill=\"none\" stroke=\"#1f7de0\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\" points=\"9.6,12 36.0,11 62.4,13 88.8,10 115.19999999999999,12\"/>\u003ctext x=\"60\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\">Bの日\u003c/text>\u003c/g>\u003ctext x=\"20\" y=\"118\">実線＝気温　点線＝湿度（上ほど大きい）\u003c/text>\u003c/svg>", "ex": "雨の日は湿度が高いまま、気温も湿度も変化が小さい。Aは晴れの日の特徴。", "kind": "graph", "level": 1, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q012", "koma": "chu2-kisho-08", "t": "order", "q": "ある晴れた日の次の時刻を、湿度が高い順にならべよう。", "items": ["6時（日の出ごろ）", "10時", "14時（気温が最も高いころ）"], "ex": "晴れの日は気温が上がるほど湿度が下がる。気温が低い朝ほど湿度が高い。", "kind": "judge", "level": 2, "fig": null, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q013", "koma": "chu2-kisho-08", "t": "choice", "q": "晴れた日の夕方から夜にかけて気温が下がっていくと、湿度はどうなるか。", "choices": ["上がっていく", "下がっていく", "変わらない", "0％になる"], "ex": "晴れの日は気温と湿度が逆向きに変化する。気温が下がると湿度は上がる。", "kind": "judge", "level": 1, "fig": null, "game": "kisho-highlow"}, {"id": "chu2-kisho-highlow-q014", "koma": "chu2-kisho-08", "t": "choice", "q": "「晴れの日は気温と湿度が逆向きに変化する」ことを確かめたい。調べ方としてもっとも適切なものは？", "choices": ["晴れた日に、同じ場所で1時間ごとに気温と湿度を測り、グラフにして比べる", "雨の日に1回だけ気温と湿度を測る", "晴れた日に、場所を毎回変えて気温だけを測る", "気温を1日1回、1か月測る"], "ex": "同じ場所・同じ間隔で、気温と湿度の両方を続けて記録し、グラフで比べる。", "kind": "method", "level": 2, "fig": null, "game": "kisho-highlow"}], "mini": [], "textIndex": {"豆電球に流れる電流を測りたい。電流計はどうつなぐ？": "chu2-meter-socket-q001", "豆電球に加わる電圧を測りたい。電圧計はどうつなぐ？": "chu2-meter-socket-q002", "図のように電流計をつないでスイッチを入れた。どうなる？": "chu2-meter-socket-q003", "図のように電圧計をつないでスイッチを入れた。どうなる？": "chu2-meter-socket-q004", "電流の大きさの見当がつかない。電流計の−端子は、最初にどれにつなぐ？": "chu2-meter-socket-q005", "電圧の大きさの見当がつかない。電圧計の−端子は、最初にどれにつなぐ？": "chu2-meter-socket-q006", "スイッチを入れたら、電流計の針が0より左に振れた。原因として考えられるのは？": "chu2-meter-socket-q007", "図は電流計の目盛りと針のようす。流れている電流は何mA？": "chu2-meter-socket-q008", "図は電流計の目盛りと針のようす。流れている電流は何A？": "chu2-meter-socket-q009", "電流計で電流を測る手順を、正しい順に並べよう。": "chu2-meter-socket-q010", "抵抗器Aに加わる電圧を測りたい。電圧計を図のア〜エのどこにつなぐ？": "chu2-meter-socket-q011", "抵抗器Bを流れる電流だけを測りたい。電流計を図のア〜エのどこに入れる？": "chu2-meter-socket-q012", "回路図で電流計を表す記号は？": "chu2-meter-socket-q013", "電流計を電池の両極に直接つないではいけないのはなぜ？": "chu2-meter-socket-q014", "0.25Aは何mA？": "chu2-meter-socket-q015", "豆電球に流れこむ電流と、流れ出る電流の大きさを比べたい。図のア〜エのうち、電流計を入れる2か所として正しい組は？": "chu2-lamp-pin-nuki-q001", "実験の結果、豆電球の前も後も0.18Aだった。ここから言えることは？": "chu2-lamp-pin-nuki-q002", "図の回路で、A₁は0.30Aを示した。A₂は何Aを示す？": "chu2-lamp-pin-nuki-q003", "1つの輪になった回路で、豆電球の前を流れる電流は250mAだった。豆電球の後を流れる電流は何mA？": "chu2-lamp-pin-nuki-q004", "「豆電球が光るのは、電流が使われて減るからだ」という考えが正しいか確かめたい。どうすればよい？": "chu2-lamp-pin-nuki-q005", "豆電球の前と後の電流を調べる実験の進め方を、正しい順に並べよう。": "chu2-lamp-pin-nuki-q006", "ある班の記録は「豆電球の前0.26A、後0.25A」だった。どう考えるのがよい？": "chu2-lamp-pin-nuki-q007", "図は豆電球の後に入れた電流計の目盛り。流れている電流は何mA？": "chu2-lamp-pin-nuki-q008", "回路を流れる電流の向きは、どう決められている？": "chu2-lamp-pin-nuki-q009", "電流計が1台しかない。豆電球の前と後の電流を比べるには？": "chu2-lamp-pin-nuki-q010", "豆電球のかわりにモーターをつないだ。モーターに流れこむ電流と流れ出る電流は？": "chu2-lamp-pin-nuki-q011", "豆電球の前と後で電流が同じなのに、豆電球が光り続けられるのはなぜと考えられる？": "chu2-lamp-pin-nuki-q012", "電流の大きさを表す単位は？": "chu2-lamp-pin-nuki-q013", "図の直列回路で、点aの電流計は0.2Aを示した。点b・点cの電流計は？": "chu2-heranai-ippondo-q001", "図の回路で、点Qの電流計は0.35Aを示した。点Pの電流計は何mAを示す？": "chu2-heranai-ippondo-q002", "直列回路で、電流計を電池の−極のすぐそばに入れた。示す値は？": "chu2-heranai-ippondo-q003", "2つの抵抗器の直列回路で、ある班が表のように記録した。まちがっていると考えられる記録は？": "chu2-heranai-ippondo-q004", "直列回路の記録で、1つだけほかと大きく合わない値があった。まずすることは？": "chu2-heranai-ippondo-q005", "直列回路のある点に入れた電流計が図のようになった。同じ回路の別の点では何mAを示すはず？": "chu2-heranai-ippondo-q006", "図の回路で、電流計は0.18Aを示した。スイッチのすぐ後の点Xを流れる電流は？": "chu2-heranai-ippondo-q007", "電流の流れる道すじが1本（分かれ道がない）回路を何という？": "chu2-heranai-ippondo-q008", "豆電球2個の直列回路で、1個をソケットからはずした。もう1個はどうなる？": "chu2-heranai-ippondo-q009", "「直列回路では各点の電流が等しいか」を調べる手順を正しい順に並べよう。": "chu2-heranai-ippondo-q010", "直列回路の3つの点で、0.30A、0.30A、0.29Aだった。どう考えるのがよい？": "chu2-heranai-ippondo-q011", "0.45Aは何mA？": "chu2-heranai-ippondo-q012", "図の直列回路のア〜エに電流計を入れた。ほかと違う値を示すのは？": "chu2-heranai-ippondo-q013", "図の並列回路で、A₁は0.8A、A₂は0.3Aを示した。A₃は何Aを示す？": "chu2-bunki-suimon-q001", "図の回路の電流計A₁〜A₄の値の関係として正しいのは？": "chu2-bunki-suimon-q002", "並列回路の2本の枝に、0.25Aと0.35Aの電流が流れている。分かれる前の電流は何mA？": "chu2-bunki-suimon-q003", "分岐点に0.9Aの電流が流れこみ、一方の枝へ0.4Aが流れ出た。もう一方の枝へ流れ出る電流は？": "chu2-bunki-suimon-q004", "並列回路の枝に流れる電流について、正しいのは？": "chu2-bunki-suimon-q005", "図は並列回路の枝1に入れた電流計（500mA端子）。分かれる前の電流は0.60Aだった。枝2の電流は何mA？": "chu2-bunki-suimon-q006", "図の3本の枝に0.1A、0.2A、0.3Aが流れている。本線の電流は？": "chu2-bunki-suimon-q007", "電流の道すじが枝分かれしている回路を何という？": "chu2-bunki-suimon-q008", "合流点に、0.20Aと0.35Aの電流が流れこんでいる。合流点から流れ出る電流は？": "chu2-bunki-suimon-q009", "並列回路の各点の電流を調べる手順を、正しい順に並べよう。": "chu2-bunki-suimon-q010", "並列回路で表のように記録した。まちがっていると考えられる記録は？": "chu2-bunki-suimon-q011", "豆電球2個の並列回路で、一方の豆電球をソケットからはずした。もう一方の豆電球は？": "chu2-bunki-suimon-q012", "本線の電流が450mA、枝1の電流が0.15Aの並列回路。枝2の電流は何A？": "chu2-bunki-suimon-q013", "図の並列回路で、いちばん大きい値を示す電流計は？": "chu2-bunki-suimon-q014", "2つの抵抗器A・Bを直列につないだ。Aにかかる電圧をVA、Bにかかる電圧をVB、電源の電圧をVとすると、成り立つ関係は？": "chu2-denatsu-slide-q001", "図の直列回路で、電源の電圧は6.0V、抵抗器Aにかかる電圧は2.5Vだった。抵抗器Bにかかる電圧は何Vか。": "chu2-denatsu-slide-q002", "2つの抵抗器を直列につないだ回路で、抵抗器Aの電圧は1.2V、抵抗器Bの電圧は1.8Vだった。電源の電圧は何Vか。": "chu2-denatsu-slide-q003", "電源6.0Vの直列回路に、抵抗の大きさがちがう2つの抵抗器をつないだ。それぞれの抵抗器にかかる電圧について正しいのは？": "chu2-denatsu-slide-q004", "電源6.0Vの直列回路で、抵抗器Aの両端に電圧計をつなぐと、図のようになった（−端子は15V）。抵抗器Bにかかる電圧は何Vか。": "chu2-denatsu-slide-q005", "電源3.0Vの直列回路で、抵抗器Aの両端に電圧計をつなぐと、図のようになった（−端子は3V）。抵抗器Bにかかる電圧は何Vか。": "chu2-denatsu-slide-q006", "抵抗器にかかる電圧を測るとき、電圧計はどうつなぐ？": "chu2-denatsu-slide-q007", "電圧がどれくらいか見当がつかないとき、電圧計の−端子はどれに最初につなぐ？": "chu2-denatsu-slide-q008", "直列回路の電圧の関係を調べる実験の手順を、正しい順にならべよう。": "chu2-denatsu-slide-q009", "直列回路で電源の電圧を変えて、抵抗器A・Bの電圧を測った。表の「？」は何Vと考えられるか。": "chu2-denatsu-slide-q010", "電源6.0Vの直列回路で、はじめAは2.0V、Bは4.0Vだった。電源はそのままでAだけを別の抵抗器にかえると、Aの電圧が4.0Vになった。Bの電圧は？": "chu2-denatsu-slide-q011", "とちゅうで枝分かれがなく、電流の通り道が1本になっている回路を何という？": "chu2-denatsu-slide-q012", "2つの抵抗器を直列につないだ回路の、電流と電圧について正しいのは？": "chu2-denatsu-slide-q013", "電源9.0Vの直列回路につないだ2つの抵抗器に、同じ大きさの電圧がかかっていた。1つの抵抗器にかかる電圧は何Vか。": "chu2-denatsu-slide-q014", "図の回路で、電圧計が測っているのはどこの電圧？": "chu2-denatsu-slide-q015", "2つの抵抗器A・Bを並列につないだ。Aにかかる電圧をVA、Bにかかる電圧をVB、電源の電圧をVとすると、成り立つ関係は？": "chu2-parallel-defense-q001", "図の並列回路で、電源の電圧は6.0Vだった。抵抗器Bにかかる電圧は何Vか。": "chu2-parallel-defense-q002", "並列回路の抵抗器Bの両端に電圧計をつなぐと、図のようになった（−端子は15V）。電源の電圧は何Vと考えられるか。": "chu2-parallel-defense-q003", "豆電球Aだけが光っている回路で、図のスイッチを入れて豆電球Bを並列に加えた。豆電球Aの明るさはどうなる？（電源の電圧は変わらないものとする）": "chu2-parallel-defense-q004", "豆電球Aだけが光っている回路で、図のスイッチを入れて豆電球Bを並列に加えた。電源から流れ出る電流の大きさはどうなる？（電源の電圧は変わらないものとする）": "chu2-parallel-defense-q005", "同じ豆電球2個を、同じ電源に「直列」でつないだ場合と「並列」でつないだ場合。豆電球1個にかかる電圧が大きいのはどちら？": "chu2-parallel-defense-q006", "同じ豆電球2個を、電源6.0Vに直列につないだ。豆電球1個にかかる電圧は何Vか。": "chu2-parallel-defense-q007", "家のコンセントにテーブルタップをつなぎ、電気スタンドと充電器を同時に使った。それぞれの器具にかかる電圧について正しいのは？（コンセントの電圧は100V）": "chu2-parallel-defense-q008", "並列回路で、抵抗器Bにかかる電圧を測りたい。電圧計はどうつなぐ？": "chu2-parallel-defense-q009", "図の並列回路で、電圧計V1は3.0Vを示した。電圧計V2は何Vを示すか。": "chu2-parallel-defense-q010", "抵抗の大きさがちがう2つの抵抗器を、3.0Vの電源に並列につないだ。抵抗が大きい方の抵抗器にかかる電圧は何Vか。": "chu2-parallel-defense-q011", "とちゅうで枝分かれがあり、電流の通り道が2本以上ある回路を何という？": "chu2-parallel-defense-q012", "並列回路の電圧の関係を調べる実験の手順を、正しい順にならべよう。": "chu2-parallel-defense-q013", "並列回路について正しい組み合わせは？": "chu2-parallel-defense-q014", "並列回路で電圧を測った結果が表のようになった。1つだけ測りまちがえたと考えられるのはどれ？": "chu2-parallel-defense-q015", "箱の中に抵抗器①②が入っていて、つなぎ方が分からない。電源の電圧は6.0V。①の両端の電圧を測ると6.0Vだった。つなぎ方は？": "chu2-kuroi-kinko-q001", "箱の中の抵抗器①②のつなぎ方を調べる。電源の電圧は6.0V。①の両端の電圧を測ると2.5Vだった。つなぎ方は？": "chu2-kuroi-kinko-q002", "箱の中の抵抗器①②のつなぎ方を調べる。①を通る電流は0.20A、回路全体の電流は0.50Aだった。つなぎ方は？": "chu2-kuroi-kinko-q003", "箱の中の抵抗器①②のつなぎ方を調べる。①を通る電流は0.30A、回路全体の電流も0.30Aだった。つなぎ方は？": "chu2-kuroi-kinko-q004", "箱の中の抵抗器①②の両端の電圧を測ると、どちらも3.0Vだった（電源の電圧は分からない）。この結果だけで、つなぎ方は決められる？": "chu2-kuroi-kinko-q005", "並列回路で、①を通る電流は0.15A、②を通る電流は0.25Aだった。回路全体を流れる電流は何Aか。": "chu2-kuroi-kinko-q006", "直列回路で、電源の電圧は9.0V、①の両端の電圧は3.5Vだった。②の両端の電圧は何Vか。": "chu2-kuroi-kinko-q007", "箱の中の抵抗器①②について、表のような測定結果が出た。つなぎ方と、その決め手として正しいものは？": "chu2-kuroi-kinko-q008", "箱の中の抵抗器①を通る電流を、500mA端子の電流計で測ると図のようになった。回路全体の電流は0.30Aだった。つなぎ方は？": "chu2-kuroi-kinko-q009", "回路のある点を流れる電流を測るとき、電流計はどうつなぐ？": "chu2-kuroi-kinko-q010", "電流計を、まちがえて抵抗器に並列につないでしまった。どうなるおそれがある？": "chu2-kuroi-kinko-q011", "箱の中の抵抗器①②が直列か並列かを、電圧計で見分ける手順を正しい順にならべよう。": "chu2-kuroi-kinko-q012", "1Aの1000分の1の電流の大きさを表す単位は？": "chu2-kuroi-kinko-q013", "箱の中の抵抗器①②を調べた。①の電流も②の電流も0.20Aで、回路全体の電流は0.40Aだった。つなぎ方は？": "chu2-kuroi-kinko-q014", "図の直列回路で、点aを流れる電流は0.25Aだった。点cを流れる電流は何Aか。": "chu2-kuroi-kinko-q015", "電熱線に加える電圧を2倍にした。流れる電流はどうなる？": "chu2-hirei-beat-q001", "ある電熱線に加える電圧を変えて電流を測り、表にまとめた。表の「？」に入る電流は何Aと考えられるか。": "chu2-hirei-beat-q002", "ある電熱線に3.0Vを加えると0.60Aの電流が流れた。同じ電熱線に5.0Vを加えると、電流は何Aになるか。": "chu2-hirei-beat-q003", "電熱線を流れる電流と電圧の関係を表すグラフはどれ？": "chu2-hirei-beat-q004", "電圧と電流の測定値をグラフにするとき、正しいかき方は？": "chu2-hirei-beat-q005", "グラフは、電熱線A・Bに加えた電圧と流れた電流の関係を表している。電熱線Bに4.0Vを加えたときの電流は何Aか。": "chu2-hirei-beat-q006", "グラフの電熱線A・Bについて、同じ電圧を加えたとき電流が流れやすいのはどちら？": "chu2-hirei-beat-q007", "金属線などの、電流の流れにくさを表す量を何という？": "chu2-hirei-beat-q008", "電熱線の実験で、グラフの点が直線からわずかにずれた。どう考えるのがよい？": "chu2-hirei-beat-q009", "電熱線に加える電圧と流れる電流の関係を調べる実験の手順を、正しい順にならべよう。": "chu2-hirei-beat-q010", "中1で調べた「ばねに加える力の大きさとばねののび」の関係と、電熱線の「電圧と電流」の関係について、正しいのは？": "chu2-hirei-beat-q011", "ある電熱線に6.0Vを加えると0.30Aの電流が流れた。この電熱線に0.45Aの電流を流すには、何Vを加えればよいか。": "chu2-hirei-beat-q012", "電熱線の代わりに豆電球で同じ実験をすると、グラフが原点を通る直線にならなかった。この結果の考え方として正しいのは？": "chu2-hirei-beat-q013", "ある電熱線に1.5Vを加えると、500mA端子につないだ電流計が図のようになった。この電熱線に3.0Vを加えると、電流は何mAになるか。": "chu2-hirei-beat-q014", "電熱線の電圧と電流を測って点を打った。関係を表す線として最も適切なのはどれ？": "chu2-graph-audition-q001", "測定した値が、本当の値からわずかにずれてしまうことを何という？": "chu2-graph-audition-q002", "電圧と電流のグラフで、線を原点を通るように引くのはなぜ？": "chu2-graph-audition-q003", "測定した点を順に折れ線でつながないのはなぜ？": "chu2-graph-audition-q004", "測定値の中に、1つだけ大きく外れた点があった。まずどうするのがよい？": "chu2-graph-audition-q005", "図の直線は、ある電熱線の電圧と電流の関係を表している。電圧が3.0Vのとき、電流は何A？": "chu2-graph-audition-q006", "ある電熱線の電圧と電流を測った結果が表のようになった。電圧と電流の関係として正しいのは？": "chu2-graph-audition-q007", "電熱線に0.5Vを加えると100mAの電流が流れた。電圧と電流が比例するとき、2.0Vでは何mA流れると予想できる？": "chu2-graph-audition-q008", "測定値からグラフをかく手順を、正しい順に並べよう。": "chu2-graph-audition-q009", "原点を通る3本の直線のうち、測定値の関係を表す線として最もよいのはどれ？": "chu2-graph-audition-q010", "グラフの点が、直線からわずかに上下にずれていた。その理由として考えられるのは？": "chu2-graph-audition-q011", "誤差をできるだけ小さくする電流計・電圧計の読み方として正しいのは？": "chu2-graph-audition-q012", "ある電熱線の測定結果が表のようになった。測り間違いと考えられるのは、電圧が何Vのとき？": "chu2-graph-audition-q013", "中1で学んだ「ばねを引く力とばねののび」の関係と同じように、電熱線を流れる電流は加える電圧に（）する。": "chu2-graph-audition-q014", "電流の流れにくさを表す量と、その単位の組み合わせとして正しいのは？": "chu2-teikou-seri-q001", "電熱線に6.0Vの電圧を加えると、0.30Aの電流が流れた。この電熱線の抵抗は何Ω？": "chu2-teikou-seri-q002", "電熱線に3.0Vの電圧を加えると、電流計は150mAを示した。この電熱線の抵抗は何Ω？": "chu2-teikou-seri-q003", "ある電熱線に3.0Vを加えると0.20Aの電流が流れた。同じ電熱線に6.0Vを加えると、電流は何A？": "chu2-teikou-seri-q004", "グラフは電熱線A・Bに加えた電圧と流れた電流の関係である。抵抗が大きいのはどちら？": "chu2-teikou-seri-q005", "グラフはある電熱線の電圧と電流の関係である。この電熱線の抵抗は何Ω？": "chu2-teikou-seri-q006", "電気器具の回路に抵抗器が入れてある理由として、最も適切なのは？": "chu2-teikou-seri-q007", "抵抗が10Ωの電熱線に0.40Aの電流が流れているとき、電熱線に加わっている電圧は何V？": "chu2-teikou-seri-q008", "抵抗が15Ωの電熱線に6.0Vの電圧を加えると、流れる電流は何A？": "chu2-teikou-seri-q009", "抵抗の大きい電熱線と小さい電熱線に、同じ大きさの電圧を加えた。流れる電流について正しいのは？": "chu2-teikou-seri-q010", "値札に「10Ω」とある電熱線を測った。3.0Vで0.30A、6.0Vで0.60Aだった。言えることは？": "chu2-teikou-seri-q011", "電熱線の電気抵抗を調べる手順を、正しい順に並べよう。": "chu2-teikou-seri-q012", "「1Ω（オーム）」の抵抗とは、どんな抵抗か？": "chu2-teikou-seri-q013", "電熱線Aは6.0Vで0.60A、電熱線Bは6.0Vで0.20Aの電流が流れた。電流が流れにくいのはどちらで、抵抗は何Ω？": "chu2-teikou-seri-q014", "長さと太さをそろえた線で比べたとき、電気抵抗が最も大きいのはどれ？": "chu2-material-curling-q001", "銅が導線に使われる理由として、最も適切なのは？": "chu2-material-curling-q002", "ゴムやガラスのように、電流をほとんど通さない物質を何という？": "chu2-material-curling-q003", "電熱線（ヒーター）にニクロムが使われる理由として、最も適切なのは？": "chu2-material-curling-q004", "長さ1m・断面積1mm²にそろえた線の抵抗を表にした。同じ電圧を加えたとき、流れる電流が最も大きいのはどれ？": "chu2-material-curling-q005", "表の4つの物質を、同じ電圧を加えたときに流れる電流が大きい順に並べよう。": "chu2-material-curling-q006", "物質のちがいによる抵抗の大きさを比べる実験で、そろえなければならない条件は？": "chu2-material-curling-q007", "長さ・太さが同じ銅の線を、赤いビニルの線から青いビニルの線にかえた。流れる電流はどうなる？": "chu2-material-curling-q008", "図は、長さと太さが同じ線X・Y・Zに同じ電圧を加えたときの電流の大きさである。抵抗が最も大きいのは？": "chu2-material-curling-q009", "図の線X・Y・Zは、銅・鉄・ガラスのどれかである。線Zとして最も考えられるのは？": "chu2-material-curling-q010", "電気コードは、中の線が銅で、外側がビニルでおおわれている。ビニルでおおう理由は？": "chu2-material-curling-q011", "金属のように電流を通しやすい物質を何という？": "chu2-material-curling-q012", "「金属ならどれも同じくらい電流を通す」という考えについて、正しいのは？": "chu2-material-curling-q013", "10Ωの抵抗器2個を直列につないだ。回路全体の抵抗（合成抵抗）は何Ω？": "chu2-gattai-card-q001", "10Ωの抵抗器2個を並列につないだ。回路全体の抵抗はどうなる？": "chu2-gattai-card-q002", "20Ωと30Ωの抵抗器を並列につないだ。回路全体の抵抗について正しいのは？": "chu2-gattai-card-q003", "2つの抵抗器を並列につなぎ、電源の電圧を6.0Vにすると、回路全体に1.2Aの電流が流れた。回路全体の抵抗は何Ω？": "chu2-gattai-card-q004", "2つの抵抗器を直列につなぎ、電源の電圧を6.0Vにすると、回路全体に0.20Aの電流が流れた。回路全体の抵抗は何Ω？": "chu2-gattai-card-q005", "同じ電源に、図のア〜ウの回路をつないだ。電流計の示す値が最も大きいのはどれ？": "chu2-gattai-card-q006", "グラフのX・Y・Zは、抵抗器Pだけの回路、PとQの直列回路、PとQの並列回路のどれかで、全体の電圧と全体の電流の関係を表す。並列回路はどれ？": "chu2-gattai-card-q007", "家のコンセントの器具は並列につながっている。たこ足配線で同時に使う器具を増やすと、コンセントから流れる全体の電流はどうなる？": "chu2-gattai-card-q008", "2つの抵抗器をつないだ回路全体の抵抗を、実験で求める方法として正しいのは？": "chu2-gattai-card-q009", "同じ電源につないだとき、回路全体の抵抗が小さい順に並べよう。": "chu2-gattai-card-q010", "5Ωと15Ωの抵抗器を直列につないだ。回路全体の抵抗は何Ω？": "chu2-gattai-card-q011", "2つの抵抗器を直列につないだとき、回路全体の抵抗について正しいのは？": "chu2-gattai-card-q012", "同じ電源に、20Ωの抵抗器1個をつないだときと、20Ωの抵抗器2個を並列につないだときとで、回路全体の電流を比べると？": "chu2-gattai-card-q013", "2つ以上の抵抗をつないだとき、回路全体を1つの抵抗とみなしたときの抵抗を何という？": "chu2-gattai-card-q014", "ある物質を加熱して出てきた気体を石灰水に通すと、白くにごった。この気体は何と考えられる？": "chu2-fuin-box-q001", "加熱した試験管の口についた液体が水かどうかを調べるには、何を使う？": "chu2-fuin-box-q002", "青色の塩化コバルト紙に液体をつけると、赤（桃）色に変わった。この液体についていえることは？": "chu2-fuin-box-q003", "試験管に集めた気体が酸素かどうかを確かめる方法は？": "chu2-fuin-box-q004", "マッチの火を近づけると、ポンと音を立てて燃えた気体は？": "chu2-fuin-box-q005", "固体を加熱して液体が出てきそうな実験で、試験管の口を少し下げて固定するのはなぜ？": "chu2-fuin-box-q006", "A・Bのうち、固体を加熱して出てくる物質を調べるときの試験管の向きとして正しいのは？": "chu2-fuin-box-q007", "気体を水上置換で集めている。加熱をやめる前に、ガラス管を水そうの水から出すのはなぜ？": "chu2-fuin-box-q008", "加熱して出てきた気体を集めるとき、はじめに出てくる気体を集めずに捨てるのはなぜ？": "chu2-fuin-box-q009", "加熱して出る気体を集める実験を、正しい順に並べよう。": "chu2-fuin-box-q010", "砂糖を加熱すると黒くこげた。冷やしても砂糖にはもどらなかった。ここからいえることは？": "chu2-fuin-box-q011", "氷を加熱すると水になり、冷やすと氷にもどった。この変化についていえることは？": "chu2-fuin-box-q012", "加熱したあとに残った白い固体が、元の粉と同じ物質かどうかを確かめる方法として、最もよいのは？": "chu2-fuin-box-q013", "「炭酸水素ナトリウムを加熱すると気体が出る」と予想した。その根拠として最もふさわしいのは？": "chu2-fuin-box-q014", "フェノールフタレイン液を加えると赤色になる水溶液は、何性？": "chu2-fuin-box-q015", "炭酸水素ナトリウムを加熱したあとに残った白い固体を水にとかすとよくとけ、フェノールフタレイン液でこい赤色になった。元の炭酸水素ナトリウムは、とけ残りがあり、うすい赤色だった。ここからいえることは？": "chu2-shiroi-kona-jiken-q001", "表は、加熱前の物質と加熱後の固体を調べた結果である。加熱後の固体の水溶液について、正しいものはどれ？": "chu2-shiroi-kona-jiken-q002", "加熱後に残った白い固体が、元の粉と同じ物質かどうかを判断する根拠にならないものは shi-recycle-q006", "マグネシウム原子4個を、酸素分子と余りなく結び付けて酸化マグネシウムにしたい。酸素分子は何個いる？": "chu2-genshi-recycle-q007", "鉄原子3個と硫黄原子2個を、モデルで組み替えて硫化鉄（鉄原子1：硫黄原子1）をつくる。組み替えのあとのようすとして正しいのはどれ？": "chu2-genshi-recycle-q008", "酸化銀を試験管で加熱すると、試験管の中の物質の質量が軽くなる。原子のモデルで考えると、その理由として正しいのはどれ？": "chu2-genshi-recycle-q009", "化学反応式2H₂O→2H₂＋O₂から読み取れることとして正しいのはどれ？": "chu2-genshi-recycle-q010", "水素と酸素から水ができる変化を、原子のモデルで確かめる。すじの通る順に並べよう。": "chu2-genshi-recycle-q011", "鉄と硫黄が結び付いて硫化鉄ができるとき、原子について正しく説明しているのはどれ？": "chu2-genshi-recycle-q012", "ア〜ウのモデルのうち、化学変化として「ありえない」ものはどれ？": "chu2-genshi-recycle-q013", "いくつかの原子が結び付いて1つのまとまりになった粒子を何という？": "chu2-genshi-recycle-q014", "化学反応式2H₂＋O₂→2H₂Oから読み取れる、水素分子・酸素分子・水分子の数の比（水素：酸素：水）はどれ？": "chu2-hannoshiki-sort-q001", "2H₂＋O₂→2H₂Oをもとに考える。水分子を10個つくるには、水素分子は何個いる？": "chu2-hannoshiki-sort-q002", "2H₂＋O₂→2H₂Oをもとに考える。酸素分子5個と、余らずに反応する水素分子は何個？": "chu2-hannoshiki-sort-q003", "水素分子6個と酸素分子2個を反応させた（2H₂＋O₂→2H₂O）。反応のあとに残っているものとして正しいのはどれ？": "chu2-hannoshiki-sort-q004", "化学反応式2Cu＋O₂→2CuOが表していることとして正しいのはどれ？": "chu2-hannoshiki-sort-q005", "2Ag₂O→4Ag＋O₂をもとに考える。酸化銀（Ag₂O）6つ分がすべて分解すると、酸素分子は何個できる？": "chu2-hannoshiki-sort-q006", "炭素が燃えて二酸化炭素ができる変化（C＋O₂→CO₂）を、正しくモデルで表しているのはどれ？": "chu2-hannoshiki-sort-q007", "「2H₂O」の「2」は何を表している？": "chu2-hannoshiki-sort-q008", "「2H₂」が表しているものとして正しいのはどれ？": "chu2-hannoshiki-sort-q009", "水素と酸素から水ができる変化の化学反応式をつくる。手順を正しい順に並べよう。": "chu2-hannoshiki-sort-q010", "図は、マグネシウムが燃える変化をモデルで表したもの。この変化を表す化学反応式はどれ？": "chu2-hannoshiki-sort-q011", "2Mg＋O₂→2MgOをもとに考える。マグネシウム原子8個と余らずに反応する酸素分子は何個？": "chu2-hannoshiki-sort-q012", "水の電気分解2H₂O→2H₂＋O₂で、水素分子が6個できた。同時にできた酸素分子は何個？": "chu2-hannoshiki-sort-q013", "化学反応式H₂＋O₂→H₂Oは、正しい式ではない。その理由はどれ？": "chu2-hannoshiki-sort-q014", "ろうそくや木などの物が燃えるとき、空気中から使われる気体はどれ？": "chu2-moetara-debate-q001", "集気びんの中でろうそくを燃やしたあと、石灰水を入れてふると白くにごった。このことから分かることはどれ？": "chu2-moetara-debate-q002", "紙を燃やすと、残った灰は燃やす前の紙よりずっと軽くなる。その理由として、理科として筋が通っているのはどれ？": "chu2-moetara-debate-q003", "しぼんだボールの質量をはかったあと、空気を入れてふくらませてから、もう一度はかった。結果として正しいものはどれ？": "chu2-moetara-debate-q004", "次の予想の（）に入る、根拠とつながった言葉はどれ？「金属が燃えるときに空気中の酸素と結び付くとしたら、燃えた後の物質の質量は、燃やす前より（）はずだ。」": "chu2-moetara-debate-q005", "「スチールウールも燃やすと軽くなる」と予想した人がいる。この予想の根拠として、理科として筋が通っているものはどれ？": "chu2-moetara-debate-q006", "スチールウールを燃やすと質量がどう変わるかを確かめる実験。正しい手順に並べよう。": "chu2-moetara-debate-q007", "「熱い物は、冷たい物より軽い」という考えについて、正しいものはどれ？": "chu2-moetara-debate-q008", "スチールウールとは何か。正しいものはどれ？": "chu2-moetara-debate-q009", "火をつけたスチールウールを、酸素を入れた集気びんに入れると、空気中よりも激しく燃えた。このことから考えられることはどれ？": "chu2-moetara-debate-q010", "燃やす前と後の質量をくらべる実験で、気をつけることとして正しいものはどれ？": "chu2-moetara-debate-q011", "物質が、熱や光を出しながら激しく酸素と結び付く変化を何という？": "chu2-moetara-debate-q012", "火をつけたろうそくをてんびんにのせたまま燃やし続けた。ろうそくの質量の変化を表すグラフはア〜ウのどれ？": "chu2-moetara-debate-q013", "予想の書き方として、いちばん理科らしいものはどれ？": "chu2-moetara-debate-q014", "初めて見る生物の体の一部を顕微鏡で拡大した（図）。「この部分は細胞でできている」と言える根拠として、最も適切なものはどれ？": "chu2-bio-cell-nurie-q001", "ほおの内側の細胞を観察した図。A〜Dのうち、細胞ではなく気泡（空気のあわ）なのはどれ？": "chu2-bio-cell-nurie-q002", "次のうち、顕微鏡で拡大しても細胞が見られないものはどれ？": "chu2-bio-cell-nurie-q003", "生物の体をつくっている、区切られた小さな部屋のような単位を何という？": "chu2-bio-cell-nurie-q004", "タマネギの表皮を観察するとき、染色液（酢酸オルセインなど）を1滴落とすのはなぜ？": "chu2-bio-cell-nurie-q005", "3種類の小さな生物を、ちがう倍率で観察し、どれも同じくらいの大きさにスケッチした（図）。実物がいちばん大きいのはどれ？": "chu2-bio-cell-nurie-q006", "池の水にいるミカヅキモやゾウリムシの体について、正しいものはどれ？": "chu2-bio-cell-nurie-q007", "細胞の形について、正しいものはどれ？": "chu2-bio-cell-nurie-q008", "接眼レンズが10倍、対物レンズが40倍のとき、顕微鏡の倍率は何倍？": "chu2-bio-cell-nurie-q009", "染色液でよく染まり、植物の細胞にも動物の細胞にも1つずつ見られる丸いつくりを何という？": "chu2-bio-cell-nurie-q010", "ほおの内側の細胞を観察する手順。正しい順に並べよう。": "chu2-bio-cell-nurie-q011", "ツユクサの葉の裏の表皮を観察した図。Xのすきま（気孔）について正しいものはどれ？": "chu2-bio-cell-nurie-q012", "ほおの内側の細胞は、1つ1つがばらばらに見えた。それでも「ほおの内側も細胞でできている」と言える理由として、最も適切なものはどれ？": "chu2-bio-cell-nurie-q013", "葉をうすく切った断面の図。ア〜エのうち、細胞（区切られた部屋）ではないものはどれ？": "chu2-bio-cell-nurie-q014", "顕微鏡の倍率を100倍から400倍に上げた。視野に見える細胞の数と、1つ1つの細胞の見え方はどうなる？": "chu2-bio-cell-nurie-q015", "顕微鏡の倍率を100倍から400倍に上げた。見えるものの大きさと、見える範囲はどうなる？": "chu2-bio-scope-sagashie-q001", "顕微鏡で小さな目当てを見つけるときの手順。正しい順に並べよう。": "chu2-bio-scope-sagashie-q002", "接眼レンズ10倍、対物レンズ40倍のとき、顕微鏡の倍率は何倍？": "chu2-bio-scope-sagashie-q003", "ある顕微鏡では、40倍のとき見える範囲の直径が4.5mmだった。同じ顕微鏡で400倍にすると、見える範囲の直径は何mm？": "chu2-bio-scope-sagashie-q004", "100倍で、ゾウリムシが図のように視野のはしに見えている。このまま400倍にすると、どうなる？": "chu2-bio-scope-sagashie-q005", "低い倍率から高い倍率にかえると、視野の明るさはふつうどうなる？": "chu2-bio-scope-sagashie-q006", "顕微鏡の視野の右上に、見たいものが見えている（図）。これを視野の中央に動かすには、プレパラートをどの向きに動かす？": "chu2-bio-scope-sagashie-q007", "泳いでいるゾウリムシを観察する。高い倍率で見るときに起こりやすいことはどれ？": "chu2-bio-scope-sagashie-q008", "40倍で、ゾウリムシが視野のはしに小さく見えた。形をくわしく見るために、次にすることはどれ？": "chu2-bio-scope-sagashie-q009", "スライドガラスに観察するものをのせ、カバーガラスをかけてつくった、顕微鏡で見るためのものを何という？": "chu2-bio-scope-sagashie-q010", "対物レンズを10倍から40倍にかえてピントを合わせた。対物レンズとプレパラートの間の距離はどうなる？": "chu2-bio-scope-sagashie-q011", "100倍で見たとき、ゾウリムシの像の長さを見取り図にすると20mmだった。同じゾウリムシを400倍で見ると、像の長さは何mmになる？": "chu2-bio-scope-sagashie-q012", "ピントを合わせるとき、はじめに横から見ながら対物レンズとプレパラートを近づけ、そのあと接眼レンズをのぞきながら「遠ざけて」合わせる。その理由は？": "chu2-bio-scope-sagashie-q013", "同じタマネギの表皮を3つの倍率で見た（図）。倍率の低いものから順に並べよう。": "chu2-bio-scope-sagashie-q014", "顕微鏡の倍率を変えても、変わらないものはどれ？": "chu2-bio-scope-sagashie-q015", "図はオオカナダモの葉の細胞の模式図。ア〜エのうち、植物の細胞だけに見られるつくりをすべて選んだものはどれ？": "chu2-bio-cell-guesswho-q001", "植物の細胞と動物の細胞に共通して見られるつくりの組み合わせはどれ？": "chu2-bio-cell-guesswho-q002", "A〜Cは、オオカナダモの葉・タマネギの表皮・ヒトのほおの内側のどれかの細胞を染色してスケッチしたもの。動物の細胞はどれ？": "chu2-bio-cell-guesswho-q003", "ある細胞を観察すると、核はあったが、細胞壁も葉緑体も見られなかった。「動物の細胞」と判断できる決め手はどれ？": "chu2-bio-cell-guesswho-q004", "タマネギの表皮の細胞には葉緑体が見られない。それでも「植物の細胞」と言える決め手はどれ？": "chu2-bio-cell-guesswho-q005", "植物の細胞で、細胞膜の外側にあるじょうぶなしきりを何という？": "chu2-bio-cell-guesswho-q006", "植物の細胞に見られる緑色の粒で、光合成を行うつくりを何という？": "chu2-bio-cell-guesswho-q007", "細胞の核を観察しやすくするために使う染色液はどれ？": "chu2-bio-cell-guesswho-q008", "表は、動物の細胞と植物の細胞で見られるつくりを○×でまとめたもの。①に入るつくりはどれ？": "chu2-bio-cell-guesswho-q009", "ある動物の皮ふの細胞は、角ばってすきまなく並んで見えた。この細胞について正しいものはどれ？": "chu2-bio-cell-guesswho-q010", "植物の細胞と動物の細胞を同じ染色液で染めた。赤く染まる丸いつくりが見られるのはどれ？": "chu2-bio-cell-guesswho-q011", "オオカナダモの葉の細胞とタマネギの表皮の細胞に共通して見られ、ヒトのほおの内側の細胞には見られないものはどれ？": "chu2-bio-cell-guesswho-q012", "細胞壁のはたらきとして正しいものはどれ？": "chu2-bio-cell-guesswho-q013", "細胞のつくりのうち、核と細胞壁以外の部分（細胞膜・葉緑体・液胞などをふくむ）をまとめて何という？": "chu2-bio-cell-guesswho-q014", "図のオオカナダモの葉の細胞で、動物の細胞にもあるつくりはどれ？": "chu2-bio-cell-guesswho-q015", "ヒトの体のなりたちを、小さい単位から順に並べよう。": "chu2-bio-cell-merge-q001", "植物の体のなりたち。小さい単位から順に並べよう。": "chu2-bio-cell-merge-q002", "動物の体のなりたち。小さい単位から順に並べよう。": "chu2-bio-cell-merge-q003", "形やはたらきが同じ細胞が集まったものを何という？": "chu2-bio-cell-merge-q004", "何種類かの組織が組み合わさって、特定のはたらきをする部分を何という？": "chu2-bio-cell-merge-q005", "次のうち、器官にあたるものはどれ？": "chu2-bio-cell-merge-q006", "次のうち、組織にあたるものはどれ？": "chu2-bio-cell-merge-q007", "植物の器官の組み合わせとして正しいものはどれ？": "chu2-bio-cell-merge-q008", "表皮組織だけをいくら集めても、葉にはならない。葉ができるために必要なことはどれ？": "chu2-bio-cell-merge-q009", "図は胃のかべの一部の模式図。A（表面の細胞の集まり）・B（筋肉の細胞の集まり）・C（神経の集まり）のように、何種類かの組織が組み合わさってできている胃は、次のどれにあたる？": "chu2-bio-cell-merge-q010", "図のAは、胃の内側の表面に同じ形の細胞が並んだもの。Aのようなものを何という？": "chu2-bio-cell-merge-q011", "ゾウリムシの体について、正しいものはどれ？": "chu2-bio-cell-merge-q012", "ある生物の体を調べると「表皮組織・葉肉組織・維管束が組み合わさった部分」があった。この部分について正しいものはどれ？": "chu2-bio-cell-merge-q013", "細胞に酸素が届かなくなった。細胞はどうなる？": "chu2-bio-one-cell-q001", "細胞が、二酸化炭素などのいらない物を外へ出せなくなった。どうなる？": "chu2-bio-one-cell-q002", "図は1つの細胞と、物質の出入りを表している。細胞に入る矢印ア・イにあてはまる物の組み合わせは？": "chu2-bio-one-cell-q003", "からだが1つの細胞だけでできている生物を何という？": "chu2-bio-one-cell-q004", "池の水にいる生物のうち、からだが1つの細胞だけでできているものはどれ？": "chu2-bio-one-cell-q005", "ゾウリムシ（単細胞生物）について、正しいものはどれ？": "chu2-bio-one-cell-q006", "植物の細胞について、正しいものはどれ？": "chu2-bio-one-cell-q007", "細胞がエネルギーを得るまでの流れを、正しい順に並べよう。": "chu2-bio-one-cell-q008", "同じ水を入れた容器A・Bのうち、Aにだけゾウリムシを入れ、同じ場所に置いた。グラフは水にとけている酸素の量の変化。Aで酸素が減ったのはなぜ？": "chu2-bio-one-cell-q009", "ゾウリムシが呼吸していることを実験で確かめたい。いちばんよい方法は？": "chu2-bio-one-cell-q010", "細胞が酸素を使って養分を分解し、エネルギーを取り出すはたらきを何という？": "chu2-bio-one-cell-q011", "ヒトが肺で取り入れた酸素は、最終的にどこで使われる？": "chu2-bio-one-cell-q012", "表は、ゾウリムシを入れた容器の水にとけている酸素の量の記録（例）。同じ減り方が続くとすると、30分のときは何mg/Lと考えられる？": "chu2-bio-one-cell-q013", "酸素は十分にあるが、養分がなくなった細胞はどうなる？": "chu2-bio-one-cell-q014", "図は、ある葉の断面の模式図。葉の外と中で気体が出入りする所は、ア〜エのどれ？": "chu2-bio-stomata-maze-q001", "葉の表面で気体が出入りできるのが気孔だけなのは、なぜ？": "chu2-bio-stomata-maze-q002", "葉の表面にある、気体の出入り口になっているすき間を何という？": "chu2-bio-stomata-maze-q003", "昼の葉で、気孔を通って出入りするものの組み合わせとして正しいものは？": "chu2-bio-stomata-maze-q004", "図のように、枝についた葉を表側と裏側から同じ大きさの透明な容器ではさんだ。しばらくすると、裏側の容器だけ内側がくもった。このことからわかることは？": "chu2-bio-stomata-maze-q005", "同じような3本の枝A〜Cの葉にワセリンをぬり、水の減った量を比べた（水面からの蒸発はふせいである）。表の結果から考えられることは？": "chu2-bio-stomata-maze-q006", "葉の気孔を顕微鏡で観察したい。いちばんよい方法は？": "chu2-bio-stomata-maze-q007", "スイレンの葉は水面に浮かび、裏側は水につかっている。スイレンの気孔が多いのはどちら側と考えられる？": "chu2-bio-stomata-maze-q008", "図は、ある葉の断面を向きを変えて描いたもの。葉の裏側はA・Bのどちら？": "chu2-bio-stomata-maze-q009", "ある葉の裏側にだけワセリンをぬった。どうなると考えられる？": "chu2-bio-stomata-maze-q010", "青い塩化コバルト紙を、葉の表と裏にテープで同時にはった。先に色が変わるのはどちらと考えられる？": "chu2-bio-stomata-maze-q011", "気孔を顕微鏡で観察する手順を、正しい順に並べよう。": "chu2-bio-stomata-maze-q012", "もし葉の表面に、すき間（気孔）がまったくなかったとしたら、どうなると考えられる？": "chu2-bio-stomata-maze-q013", "ある植物に、二酸化炭素と水は十分にあたえたが、光を当てずに暗い所に置いた。デンプンはどうなる？": "chu2-bio-leaf-kitchen-q001", "光合成でデンプンをつくるとき、材料になる物質の組み合わせは？": "chu2-bio-leaf-kitchen-q002", "光合成によってできる物質の組み合わせは？": "chu2-bio-leaf-kitchen-q003", "植物の細胞の中で、光合成が行われている緑色の粒を何という？": "chu2-bio-leaf-kitchen-q004", "光のエネルギーを使って、二酸化炭素と水からデンプンなどと酸素をつくるはたらきを何という？": "chu2-bio-leaf-kitchen-q005", "葉にデンプンができたかを調べる薬品と、デンプンがあるときの色の組み合わせは？": "chu2-bio-leaf-kitchen-q006", "光を当てたオオカナダモから出た泡を試験管に集めた。この気体が酸素であることを確かめる方法と結果は？": "chu2-bio-leaf-kitchen-q007", "試験管Aには葉を入れ、Bには何も入れずに、両方に息をふきこんでゴム栓をし、光を30分当てた。そのあと石灰水を入れてふると、より白くにごるのはどちら？": "chu2-bio-leaf-kitchen-q008", "息をふきこんで黄色にしたBTB液を試験管A〜Cに入れ、光を当てた（A：オオカナダモB：オオカナダモをアルミはくでおおうC：何も入れない）。しばらくすると、Aだけ青色になった。なぜ？": "chu2-bio-leaf-kitchen-q009", "光合成に光が必要かを調べる実験で、正しい計画はどれ？": "chu2-bio-leaf-kitchen-q010", "葉をあたためたエタノールにつける操作について、正しいものは？": "chu2-bio-leaf-kitchen-q011", "葉にデンプンがあるか調べる手順を、正しい順に並べよう。": "chu2-bio-leaf-kitchen-q012", "光合成をしている植物に、酸素や土の肥料を多くあたえても、できるデンプンの量は増えなかった。なぜ？": "chu2-bio-leaf-kitchen-q013", "グラフは、オオカナダモに当てる光の強さを変えて、1分間に出る泡の数を数えた結果（例）。わかることは？": "chu2-bio-leaf-kitchen-q014", "ふ入りの葉の一部をアルミはくでおおい、暗い所に一晩置いてから日光に当てた。脱色してヨウ素液につけると、青紫色になるのはどの部分？": "chu2-bio-starch-sonar-q001", "この実験で「光合成には光が必要」と分かるのは、どことどこを比べたとき？": "chu2-bio-starch-sonar-q002", "この実験で「光合成は葉の緑色の部分（葉緑体のある所）で行われる」と分かるのは、どことどこを比べたとき？": "chu2-bio-starch-sonar-q003", "アとエを比べても、光と葉緑体のどちらが必要なのかは分からない。なぜ？": "chu2-bio-starch-sonar-q004", "実験の前に、植物を暗い所に一晩置いたのはなぜ？": "chu2-bio-starch-sonar-q005", "葉を、あたためたエタノールにつけるのはなぜ？": "chu2-bio-starch-sonar-q006", "光合成が行われる、植物の細胞の中にある緑色の粒を何という？": "chu2-bio-starch-sonar-q007", "ふ入りの葉の「ふ」（白い部分）について、正しいものは？": "chu2-bio-starch-sonar-q008", "初めて見る葉。一晩暗い所に置いたあと、図のようにおおいをして日光に当て、脱色してヨウ素液につけた。青紫色になると考えられるのはどこ？": "chu2-bio-starch-sonar-q009", "光を当てたオオカナダモの葉を脱色してヨウ素液をたらし、顕微鏡で見た。青紫色になっていたのはどこ？": "chu2-bio-starch-sonar-q010", "もし「暗い所に一晩置く」を省いて同じ実験をしたら、どんな困ったことが起こりうる？": "chu2-bio-starch-sonar-q011", "ふ入りの葉を使った実験の手順を、正しい順に並べよう。": "chu2-bio-starch-sonar-q012", "日光がよく当たっていたのに、デンプンができていない所があった。考えられる理由は？": "chu2-bio-starch-sonar-q013", "表は実験の結果。ここから言えることとして最も適切なものは？": "chu2-bio-starch-sonar-q014", "上から見た図のように、ふき流しがなびいている。このときの風向は？": "chu2-kisho-kazami-q001", "えんとつのけむりが図のようにたなびいている。このときの風向は？": "chu2-kisho-kazami-q002", "風速4m/sの風に乗って流れる風船は、5秒間で何m進む？（風船は空気といっしょに動くとする）": "chu2-kisho-kazami-q003", "「南の風3m/s」のとき、空中に放したシャボン玉は1秒後にどこにある？（空気といっしょに動くとする）": "chu2-kisho-kazami-q004", "風向の表し方として正しいものは？": "chu2-kisho-kazami-q005", "風速の意味として正しいものは？": "chu2-kisho-kazami-q006", "観測地点（中央）に、図の矢印のように空気が流れてきた。風向を16方位で答えると？": "chu2-kisho-kazami-q007", "的まで2秒で届く矢がある。東の風3m/sのとき、矢は西へ何m流される？（矢は空気といっしょに流れるとする）": "chu2-kisho-kazami-q008", "西北西の風2m/s。的まで1秒の矢で的の中心に当てるには、ねらいをどうずらす？（矢は空気といっしょに流れるとする）": "chu2-kisho-kazami-q009", "校庭で風向と風速を調べる。正しい順に並べよう。": "chu2-kisho-kazami-q010", "表は、ある日の観測記録。タンポポの綿毛が空気といっしょに運ばれるとき、1秒間に最も遠くまで運ばれるのは何時？": "chu2-kisho-kazami-q011", "「北の風」と「北へ吹く風」の関係は？": "chu2-kisho-kazami-q012", "風速5m/sの風で、空気が60m進むのに何秒かかる？": "chu2-kisho-kazami-q013", "図は、ある地点の天気図記号（天気は晴れ）。風向と風力の組み合わせは？": "chu2-kisho-kazami-q014", "図の天気図記号の地点で、ふき流しはどの方位へなびいている？": "chu2-kisho-kazami-q015", "同じ直方体を、ア・イ・ウのように面を変えてスポンジに置いた。スポンジがいちばん深くへこむのはどれ？": "chu2-kisho-yukiwatari-q001", "同じ直方体を、置く面を変えてスポンジにのせる。直方体にはたらく重力の大きさはどうなる？": "chu2-kisho-yukiwatari-q002", "Aさん（体重400N）は、ふつうの靴の4倍の面積のかんじきをはく。Bさん（体重300N）はふつうの靴。雪に深く沈むのはどちら？": "chu2-kisho-yukiwatari-q003", "スポンジの実験で「力は同じで、面積だけを変える」比べ方になっているのはどれ？": "chu2-kisho-yukiwatari-q004", "スポンジの実験で「面積は同じで、力だけを変える」には、どう比べればよい？": "chu2-kisho-yukiwatari-q005", "物体がスポンジをおす力を2倍にし、ふれる面積も2倍にした。へこみ方はどうなる？": "chu2-kisho-yukiwatari-q006", "ふれる面積を変えずに、スポンジをおす力を3倍にした。へこみ方はどうなる？": "chu2-kisho-yukiwatari-q007", "面を垂直におす力の、単位面積あたりの大きさを何という？": "chu2-kisho-yukiwatari-q008", "画びょうの先がとがっているのはなぜ？": "chu2-kisho-yukiwatari-q009", "スキー板をはくと、雪に沈みにくいのはなぜ？": "chu2-kisho-yukiwatari-q010", "表は、同じ物体で同じ力をかけ、ふれる面積だけを変えたときのへこみ。面積を80cm²にすると、へこみは何mmと考えられる？": "chu2-kisho-yukiwatari-q011", "A：60Nの力を30cm²で受ける。B：40Nの力を10cm²で受ける。1cm²あたりの力が大きいのはどちら？": "chu2-kisho-yukiwatari-q012", "「面積とへこみ方の関係」を調べる実験。正しい順に並べよう。": "chu2-kisho-yukiwatari-q013", "同じ直方体をA・Bのように置いた。スポンジのへこみ方はどうなる？": "chu2-kisho-yukiwatari-q014", "質量3kgの本を、面積0.06m²の面を下にして机に置いた。本が机をおす圧力は何Pa？（100gの物体にはたらく重力を1Nとする）": "chu2-kisho-kori-kenchiku-q001", "質量2kgの物体を、10cm×20cmの面を下にして置いた。圧力は何Pa？（100gで1N）": "chu2-kisho-kori-kenchiku-q002", "質量60kgの人が、片足150cm²の靴で両足で立っている。床が受ける圧力は何Pa？（100gで1N）": "chu2-kisho-kori-kenchiku-q003", "床をおす圧力を半分にしたい。正しい方法は？": "chu2-kisho-kori-kenchiku-q004", "面をおす力を2倍にし、ふれる面積を4倍にした。圧力はどうなる？": "chu2-kisho-kori-kenchiku-q005", "1Pa（パスカル）はどんな圧力？": "chu2-kisho-kori-kenchiku-q006", "図の直方体を、圧力がいちばん大きくなる向きで置いた。圧力は何Pa？": "chu2-kisho-kori-kenchiku-q007", "図の直方体で、面アを下にしたときの圧力は、面ウを下にしたときの何倍？": "chu2-kisho-kori-kenchiku-q008", "雪上車やブルドーザーにキャタピラ（無限軌道）がついているのはなぜ？": "chu2-kisho-kori-kenchiku-q009", "圧力が5000Paをこえると割れる板がある。板の上に置く台の、板にふれる面積は0.4m²。台と荷物の重さを合わせて何Nまでのせられる？": "chu2-kisho-kori-kenchiku-q010", "重さ1200Nの物を置くとき、圧力を3000Pa以下にしたい。ふれる面積は何m²以上にすればよい？": "chu2-kisho-kori-kenchiku-q011", "圧力が小さい順に並べよう。": "chu2-kisho-kori-kenchiku-q012", "1hPa（ヘクトパスカル）は何Pa？": "chu2-kisho-kori-kenchiku-q013", "同じれんがを、置く面を変えてスポンジにのせる。置く面によって変わるものは？": "chu2-kisho-kori-kenchiku-q014", "机の上に置いた直方体が机をおす圧力を求めたい。測らなくてよいものは？": "chu2-kisho-kori-kenchiku-q015", "空気をつめたスプレー缶から、空気を3L出した。缶の質量はおよそ何g減る？（空気1Lの質量を1.2gとする）": "chu2-kisho-kuki-tsumiki-q001", "空の圧力容器に、自転車の空気入れで空気をたくさん入れた。容器全体の質量はどうなる？": "chu2-kisho-kuki-tsumiki-q002", "スプレー缶から出した空気の体積を測る方法として、適切なものは？": "chu2-kisho-kuki-tsumiki-q003", "大気圧が大きい順に並べよう。": "chu2-kisho-kuki-tsumiki-q004", "地上で口を閉じたお菓子の袋が、高い山の上でぱんぱんにふくらんだ。その理由は？": "chu2-kisho-kuki-tsumiki-q005", "大気圧とは何か。正しいものは？": "chu2-kisho-kuki-tsumiki-q006", "少しの水を入れて熱した空き缶を、口を下にして水に入れたら、ぐしゃっとつぶれた。正しい説明は？": "chu2-kisho-kuki-tsumiki-q007", "海面付近の大気圧（1気圧）は、約何hPa？": "chu2-kisho-kuki-tsumiki-q008", "大気圧が1013hPa（101300Pa）のとき、1m²の面が大気からおされる力は約何N？": "chu2-kisho-kuki-tsumiki-q009", "グラフは、高さと気圧の関係。高さ約5.5kmの気圧はおよそいくら？": "chu2-kisho-kuki-tsumiki-q010", "空気の層を、積み重ねた箱と考える。下から3段目の箱の底をおす強さを決めるものは？": "chu2-kisho-kuki-tsumiki-q011", "圧力容器に空気を5L押しこんだ。容器全体の質量はおよそ何gふえる？（空気1L＝1.2g）": "chu2-kisho-kuki-tsumiki-q012", "高い山に登るほど大気圧が小さくなるのはなぜ？": "chu2-kisho-kuki-tsumiki-q013", "空気1Lの質量を調べる実験。正しい順に並べよう。": "chu2-kisho-kuki-tsumiki-q014", "水を満たしたコップに厚紙でふたをして、さかさにしても水が落ちない。おもな理由は？": "chu2-kisho-kuki-tsumiki-q015", "空き缶の中の空気を減らすと、缶がつぶれた。缶をつぶした大気圧は、どの向きから働いていた？": "chu2-kisho-kan-3d-q001", "図のように、たてのガラスに吸盤がくっついている。吸盤がはなれない理由として正しいものは？": "chu2-kisho-kan-3d-q002", "図のように、天井のガラスに下から吸盤をつけると落ちなかった。吸盤を支えている大気圧は、主にどの向きに吸盤を押している？": "chu2-kisho-kan-3d-q003", "次のうち、大気圧（気圧）が関係しているできごとはどれ？": "chu2-kisho-kan-3d-q004", "水をいっぱいに入れたコップに厚紙をのせ、手で押さえて逆さにしてから手をはなしても、厚紙は落ちなかった。厚紙を支えているものは？": "chu2-kisho-kan-3d-q005", "図のように、ふたを閉めた空のペットボトルをベルジャーに入れ、ベルジャーの中の空気を抜いた。ペットボトルはどうなる？": "chu2-kisho-kan-3d-q006", "ふたを開けたままの空き缶は、まわりから大気圧を受けているのに、つぶれない。その理由は？": "chu2-kisho-kan-3d-q007", "空き缶を大気圧でつぶす実験で、缶に少しの水を入れて加熱し、湯気を十分に出してから冷やすのはなぜ？": "chu2-kisho-kan-3d-q008", "空き缶を大気圧でつぶす実験（先生が見せる実験）の手順を、正しい順にならべよう。": "chu2-kisho-kan-3d-q009", "大気圧を1013hPaとする。1hPa＝100Paである。面積1m²の面を大気圧が押す力は何Nか。": "chu2-kisho-kan-3d-q010", "大気圧を1000hPa（100000Pa）とする。面積0.001m²（10cm²）の吸盤の面を、大気圧が押す力は何Nか。": "chu2-kisho-kan-3d-q011", "同じ缶で、中の空気を「半分くらい抜いたとき」と「ほとんど抜いたとき」を比べた。正しいものは？": "chu2-kisho-kan-3d-q012", "中の空気を抜いて、つるした密閉容器がある。この容器に働く大気圧の向きを正しく表した図は？": "chu2-kisho-kan-3d-q013", "山の頂上で、ふもとで買ったお菓子の袋がぱんぱんにふくらんでいた。正しい説明は？": "chu2-kisho-kan-3d-q014", "同じ日・同じ時刻に、4つの地点で気圧を測った（表）。いちばん標高が高いと考えられる地点は？": "chu2-kisho-kiatsu-dive-q001", "高いところほど気圧が小さくなるのは、なぜか。": "chu2-kisho-kiatsu-dive-q002", "高さと気圧の関係を表したグラフとして、もっとも適切なものは？（たて軸が高さ、横軸が気圧）": "chu2-kisho-kiatsu-dive-q003", "同じ学校で3日間、気圧を測ると、グラフのように少しずつ下がった。学校の標高は変わっていない。考えられることは？": "chu2-kisho-kiatsu-dive-q004", "携帯気圧計を持ってエレベーターで1階から10階へ上がった。気圧計の値はどうなる？": "chu2-kisho-kiatsu-dive-q005", "ふもとで買ったお菓子の袋を持って山に登ると、山頂で袋がふくらんでいた。正しい説明は？": "chu2-kisho-kiatsu-dive-q006", "山頂で飲みきったペットボトルのふたを閉め、そのままふもとへ下りた。ボトルはどうなる？": "chu2-kisho-kiatsu-dive-q007", "地上付近では、高さが10m上がるごとに気圧は約1hPa小さくなる。地上で1010hPaのとき、高さ100mのビルの屋上では約何hPaか。": "chu2-kisho-kiatsu-dive-q008", "高さ約1500mでの気圧は約850hPaである。海面の気圧を1013hPaとすると、その差は何hPaか。": "chu2-kisho-kiatsu-dive-q009", "上空約5500mの気圧は約500hPaである。海面（約1013hPa）と比べると、およそどれくらい？": "chu2-kisho-kiatsu-dive-q010", "携帯気圧計で「高さによる気圧のちがい」を調べたい。よい方法はどれ？": "chu2-kisho-kiatsu-dive-q011", "次の場所を、気圧が大きい順にならべよう（同じ日・同じ時刻とする）。": "chu2-kisho-kiatsu-dive-q012", "ふだん私たちの体は大気圧に押されているのに、つぶれない。その理由として正しいものは？": "chu2-kisho-kiatsu-dive-q013", "登山口で高さを合わせた高度計（気圧から高さを出すしくみ）が、山頂でいつもより高い値を示した。山頂の本当の高さは変わらない。何が起きたと考えられる？": "chu2-kisho-kiatsu-dive-q014", "気温を正しく測る場所として、もっとも適切なものは？": "chu2-kisho-kansokujo-q001", "百葉箱が白くぬられているのはなぜか。": "chu2-kisho-kansokujo-q002", "百葉箱の扉が北向きについているのはなぜか。": "chu2-kisho-kansokujo-q003", "「晴れた日に、気温が何時ごろいちばん高くなるか」を調べたい。観測の間隔と期間として、もっとも適切なものは？": "chu2-kisho-kansokujo-q004", "「寒冷前線が通るとき、気温がどう変わるか」を調べたい。観測の計画として、もっとも適切なものは？": "chu2-kisho-kansokujo-q005", "「季節によって、1日の最高気温がどう変わるか」を調べたい。適切な計画は？": "chu2-kisho-kansokujo-q006", "グラフは、校庭で1時間ごとに測った気温の記録である。不自然な値をふくむ時刻と、その理由として考えられるものは？": "chu2-kisho-kansokujo-q007", "日なたの地面の近くで気温を測ると、どうなると考えられるか。": "chu2-kisho-kansokujo-q008", "自記温度計を使うよい点はどれか。": "chu2-kisho-kansokujo-q009", "アメダスについて正しいものはどれか。": "chu2-kisho-kansokujo-q010", "グラフは、ある晴れた日の校庭の気温である。気温がもっとも高くなったのは何時ごろか。": "chu2-kisho-kansokujo-q011", "気象観測の進め方を、正しい順にならべよう。": "chu2-kisho-kansokujo-q012", "同じ日に、校庭の百葉箱と、屋上の百葉箱（どちらも日かげ・地上約1.5m）で気温を測った。結果として考えられるものは？": "chu2-kisho-kansokujo-q013", "グラフは、ある日の気温と風向の記録である。寒冷前線が通ったのは何時ごろと考えられるか。": "chu2-kisho-kansokujo-q014", "6時から18時まで、1時間ごとに気温を測る。測る回数は全部で何回か。（6時と18時もふくむ）": "chu2-kisho-kansokujo-q015", "上のグラフは、ある晴れた日の気温の変化である。この日の湿度の変化を表すグラフとして、もっとも適切なものは？（上ほど湿度が大きい）": "chu2-kisho-highlow-q001", "グラフは、ある晴れた日の気温・湿度・気圧のどれかを表している（A・B・C）。湿度を表しているのはどれか。": "chu2-kisho-highlow-q002", "晴れた日、気温がもっとも高くなる14時ごろ、湿度はどうなっていることが多いか。": "chu2-kisho-highlow-q003", "雨の日の気温と湿度の変化の特徴として、正しいものはどれか。": "chu2-kisho-highlow-q004", "表は、ある晴れた日に校庭で測った記録である。不自然な値と考えられるものはどれか。": "chu2-kisho-highlow-q005", "乾湿計で、乾球が20.0℃、湿球が17.0℃を示した。乾球と湿球の示度の差は何℃か。": "chu2-kisho-highlow-q006", "乾湿計で、乾球が24℃、湿球が18℃を示した。表の湿度表を使うと、湿度は何％か。": "chu2-kisho-highlow-q007", "乾湿計の湿球の示度が、乾球より低くなるのはなぜか。": "chu2-kisho-highlow-q008", "乾湿計で、乾球と湿球の示度の差が大きいときの空気のようすとして正しいものは？": "chu2-kisho-highlow-q009", "晴れた日の朝6時に、気温14℃・湿度85％だった。同じ日の14時に気温は24℃になった。このときの湿度として考えられるものは？": "chu2-kisho-highlow-q010", "グラフは、2つの日の気温（実線）と湿度（点線）の変化である。雨の日はどちらか。": "chu2-kisho-highlow-q011", "ある晴れた日の次の時刻を、湿度が高い順にならべよう。": "chu2-kisho-highlow-q012", "晴れた日の夕方から夜にかけて気温が下がっていくと、湿度はどうなるか。": "chu2-kisho-highlow-q013", "「晴れの日は気温と湿度が逆向きに変化する」ことを確かめたい。調べ方としてもっとも適切なものは？": "chu2-kisho-highlow-q014"}};
/*@QUIZ_END*/</script>

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

  /* ---------------- アプデ履歴 ---------------- */
  function all(){var U=window.ZUKAN_UPDATES;var a=Array.isArray(U)?U:(U&&Array.isArray(U.updates)?U.updates:[]);return a.filter(function(u){return u&&u.game&&u.date}).slice().sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:0})}
  function forGame(game){var k=gkey(game);var slug=k.split('/').pop();return all().filter(function(u){var g=String(u.game);return g===k||g===slug||g.split('/').pop()===slug&&g.indexOf('/')<0})}
  function jpDate(d){var m=String(d).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?(+m[1])+'年'+(+m[2])+'月'+(+m[3])+'日':String(d)}
  function titleOf(u){if(u.title)return u.title;var cat=window.ZUKAN_CATALOG;if(cat){var list=Array.isArray(cat)?cat:(cat.games||cat.koma||[]);var slug=String(u.game).split('/').pop();for(var i=0;i<list.length;i++){if(list[i].id===slug||list[i].game===slug)return list[i].title||''}}return ''}
  function noOf(u){if(u.no)return u.no;var cat=window.ZUKAN_CATALOG;if(cat){var list=Array.isArray(cat)?cat:(cat.games||cat.koma||[]);var slug=String(u.game).split('/').pop();for(var i=0;i<list.length;i++){if(list[i].id===slug||list[i].game===slug)return list[i].no||''}}return ''}
  function fmt(u){var t=titleOf(u),n=noOf(u);var head=(n?'第'+n+'回':'')+(t?'『'+t+'』':(n?'':'このゲーム'));
    return u.kind==='idea'?head+'は、みんなのアイデア『'+u.voice+'』から生まれました（'+jpDate(u.date)+'）':head+'は『'+u.voice+'』という声でアプデされました（'+jpDate(u.date)+'）'}
  function updatesFor(game){return forGame(game||curGame()).map(function(u){return {date:u.date,kind:u.kind||'voice',voice:u.voice||'',change:u.change||'',text:fmt(u)}})}
  function showUpdates(game,back){ensureCSS();var list=game?updatesFor(game):all().map(function(u){return {text:fmt(u),change:u.change||'',kind:u.kind}});
    var ov=document.createElement('div');ov.className='vc-ov';ov.style.zIndex='2147483150';
    ov.innerHTML='<div class="vc-sh"><div class="vc-grip"></div><div class="vc-h" style="color:#1d2433">📣 みんなの声で変わったこと</div>'+
      (list.length?'<ul class="vc-upd">'+list.map(function(x){return '<li>'+esc(x.text)+(x.change?'<small>変えたこと：'+esc(x.change)+'</small>':'')+'</li>'}).join('')+'</ul>':'<p class="vc-note" style="text-align:center;font-size:14px">まだアプデはありません。<br>あなたの声が、最初の1回になるかも！</p>')+
      '<div class="vc-btns"><button class="pri" data-a="x">もどる</button></div></div>';
    ov.querySelector('[data-a="x"]').onclick=function(){ov.remove();back&&back()};
    ov.addEventListener('click',function(e){if(e.target===ov){ov.remove();back&&back()}});
    document.body.appendChild(ov);return ov}
  function updatesBadge(el,game){ensureCSS();game=game||curGame();var list=forGame(game);if(!el||!list.length)return null;
    var idea=list.some(function(u){return u.kind==='idea'});var voices=list.filter(function(u){return u.kind!=='idea'}).length;
    var b=document.createElement('button');b.type='button';b.className='vc-badge';
    b.innerHTML='📣 '+(voices?'この回はみんなの声で'+voices+'回アプデされたよ':'みんなの声')+(idea?'<span class="vc-idea">みんなのアイデアから生まれた</span>':'');
    b.onclick=function(){showUpdates(game)};el.appendChild(b);return b}

  window.Voice={
    ask:function(game,opt){return ask(game,opt)},
    maybeAsk:maybeAsk,
    answer:answer,
    answerText:answerText,
    all:function(){return load().ans},
    updates:function(game){return game?forGame(game):all()},
    updatesFor:updatesFor,
    updatesBadge:updatesBadge,
    showUpdates:showUpdates,
    formatUpdate:fmt,
    config:config,
    KEY:KEY
  };
})();

/*@ZUKAN_END*/</script>

<script>
'use strict';
/* =====================================================================
   定期テスト対策 ～ボスラッシュ～（特別枠のゲーム。コマIDは持たない）
   ─ 問題は build が window.QUIZ_BANK として流し込む（140コマ分の questions.json のまとめ）
   ─ ×だった問題を優先（設計書 5-3）：記録は rika-zukan:chu2:qlog:v1 ＋ 提出カードの review
   ─ 30分: 範囲えらび1分 → 弱点スキャン3ラウンド → ボスラッシュ → 成績カード
   ─ ミニ課題のエンジン（questions.json の mini）：
       order-drag  {params:{prompt, items:[正しい順]}}
       sort-bins   {params:{prompt, bins:[名前…], items:[[文字, 正しい箱の番号]…]}}
       slider-match{params:{prompt, x:{label,min,max,step,unit}, y:{label,unit,k,b}, target, tol}}  y=k*x+b を target に合わせる
     それ以外のエンジンは今は出さない（とばす）
   ===================================================================== */
const BANK=window.QUIZ_BANK||{units:[],koma:[],games:{},questions:[],mini:[],textIndex:{}};
const GRADE='chu2', SAVE='rika-zukan:chu2:game:teiki-taisaku:v1', QLOG='rika-zukan:chu2:qlog:v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>esc(s).replace(/&lt;(\/?)(sub|sup|b|br)\s*\/?&gt;/g,'<$1$2>').replace(/\n/g,'<br>');
const plain=s=>String(s==null?'':s).replace(/<[^>]*>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=(a,b)=>a+Math.random()*(b-a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const S=Object.assign({v:1,lastRange:null,limited:{},bossFirst:{},fixed:{},mute:false,reports:[]},lsGet(SAVE)||{});
const save=()=>lsSet(SAVE,S);
const UNITS=BANK.units, UBY={};UNITS.forEach(u=>UBY[u.id]=u);
const KBY={};BANK.koma.forEach(k=>KBY[k.id]=k);
const QBY={};BANK.questions.forEach(q=>QBY[q.id]=q);
const QCOUNT={};BANK.questions.forEach(q=>QCOUNT[q.koma]=(QCOUNT[q.koma]||0)+1);
const BOSSFIG={denryu:'🗼',kagaku:'🦖',seibutsu:'🏰',kisho:'⛈️'};

/* ---------- 音（WebAudio で合成・小さめ） ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,when,slide){if(S.mute)return;const a=ac();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,vol){if(S.mute)return;const a=ac();if(!a)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;s.buffer=b;g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const sfx={
 tap:()=>tone(660,.05,'triangle',.06),
 ok:c=>{const b=523*Math.pow(1.06,Math.min(c,12));tone(b,.12,'triangle',.12);tone(b*1.5,.18,'triangle',.1,.08)},
 ng:()=>{tone(180,.25,'sawtooth',.07,0,110)},
 fix:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.18,'square',.06,i*.06))},
 hit:()=>{noise(.18,.25);tone(140,.2,'square',.08,0,60)},
 crit:()=>{noise(.35,.35);tone(90,.4,'sawtooth',.1,0,40);tone(1200,.3,'square',.05,.05,300)},
 hurt:()=>{tone(300,.3,'sawtooth',.09,0,80);noise(.2,.15)},
 win:()=>{[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'square',.07,i*.12))},
 card:()=>{for(let i=0;i<14;i++)tone(800+i*90,.14,'sine',.05,i*.05)},
 round:()=>{[392,523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.08,i*.09))}
};
document.querySelectorAll('[data-mute]').forEach(b=>b.onclick=()=>{S.mute=!S.mute;save();muteIcon()});
function muteIcon(){document.querySelectorAll('[data-mute]').forEach(b=>{b.textContent=S.mute?'🔇':'🔊';b.setAttribute('aria-label',S.mute?'音を出す':'音を消す')})}
(function(){const p=lsGet('rika-zukan:profile:v1');if(p&&(p.sound===false||p.mute===true)&&lsGet(SAVE)==null)S.mute=true})();
muteIcon();

/* ---------- パーティクル ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],fxOn=false;
function fit(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
fit();addEventListener('resize',fit);
function burst(x,y,colors,n,sp,shape){n=RM?Math.min(6,n):n;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rnd(sp*.4,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(shape==='conf'?3:0),life:1,dec:rnd(.012,.03),c:colors[i%colors.length],s:rnd(3,7),r:Math.random()*6,vr:rnd(-.3,.3),shape:shape||'dot'})}if(!fxOn){fxOn=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.shape==='conf'?.12:.18;p.vx*=.985;p.life-=p.dec;p.r+=p.vr;cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;if(p.shape==='conf'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillRect(-p.s,-p.s/2.5,p.s*2,p.s/1.3);cx.restore()}else if(p.shape==='star'){cx.beginPath();for(let k=0;k<5;k++){const A=p.r+k*1.2566,B=A+.628;cx.lineTo(p.x+Math.cos(A)*p.s*1.6,p.y+Math.sin(A)*p.s*1.6);cx.lineTo(p.x+Math.cos(B)*p.s*.6,p.y+Math.sin(B)*p.s*.6)}cx.fill()}else{cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill()}}cx.globalAlpha=1;if(parts.length)requestAnimationFrame(tick);else fxOn=false}
function confetti(n){for(let i=0;i<(RM?1:4);i++)burst(rnd(40,innerWidth-40),-10,['#ffc93c','#ff4d5e','#22c57a','#3d7bff','#fff'],n/4|0,7,'conf')}
const centerOf=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};
function stamp(html,color){const s=document.createElement('div');s.className='stamp';s.style.color=color;s.style.borderColor=color;s.innerHTML=html;document.body.appendChild(s);setTimeout(()=>s.remove(),950)}
function floaty(txt,x,y,color){const f=document.createElement('div');f.className='floaty';f.textContent=txt;f.style.left=(x-30)+'px';f.style.top=(y-20)+'px';if(color)f.style.color=color;document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
function flash(red){const f=document.createElement('div');f.className='flash'+(red?' red':'');document.body.appendChild(f);setTimeout(()=>f.remove(),400)}
function shakeScr(){const a=document.querySelector('.app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}

/* ---------- 画面 ---------- */
let comboEl=null;
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);if(id!=='play'){if(typeof comboEl!=='undefined'&&comboEl)comboEl.style.display='none';document.body.classList.remove('fever')}}

/* ---------- 記録（qlog ＋ 提出カードの review） ---------- */
// [出た回数, ×の回数, 最後が○なら1, 最後の日時（分）, 連続○]
function loadLog(){
  const L={};const q=(lsGet(QLOG)||{}).q||{};Object.keys(q).forEach(k=>{if(Array.isArray(q[k]))L[k]=q[k].slice()});
  const recs=(lsGet('mini-collection-records-v1')||[]).slice().sort((a,b)=>a.at-b.at);
  const fromRec={};
  recs.forEach(r=>(r.review||[]).forEach(v=>{
    const id=v.id||BANK.textIndex[plain(v.q).replace(/\s+/g,'')];if(!id||L[id])return;
    const e=fromRec[id]||(fromRec[id]=[0,0,0,0,0]);e[0]++;if(!v.ok)e[1]++;e[2]=v.ok?1:0;e[3]=Math.floor(r.at/60000);e[4]=v.ok?e[4]+1:0;
  }));
  Object.assign(L,fromRec);return L;
}
let LOG={};
function logAnswer(id,ok){const e=LOG[id]||(LOG[id]=[0,0,0,0,0]);e[0]++;if(!ok)e[1]++;e[2]=ok?1:0;e[3]=Math.floor(Date.now()/60000);e[4]=ok?e[4]+1:0}
function persistLog(){ // 提出カード v2 が qlog を更新しない場合だけ、ここで保存
  if(window.SubmitCard&&SubmitCard.isPass)return;
  const d=lsGet(QLOG)||{v:1,q:{}};d.v=1;d.q=d.q||{};
  G.answers.forEach(a=>{const e=d.q[a.q.id]||[0,0,0,0,0];e[0]++;if(!a.ok)e[1]++;e[2]=a.ok?1:0;e[3]=Math.floor(Date.now()/60000);e[4]=a.ok?e[4]+1:0;d.q[a.q.id]=e});
  lsSet(QLOG,d);
}

/* ---------- 図鑑（共通部品。無くても動く） ---------- */
const Z=()=>window.Zukan||null;
function zEarn(n,why,x,y,id){const z=Z();let got=0;try{if(z&&z.earn)got=z.earn(n,why,{x,y,id})||0}catch(e){}return got}
function limitedCard(key){const C=window.ZUKAN_CARDS;return C&&C.cards?C.cards.find(c=>c.limited===key):null}
function grantLimited(key,onClose){ // 共通部品が演出して図鑑に入れる。出せなかった（もう持っている等）ら false
  const z=Z();if(!(z&&z.grantLimited&&limitedCard(key)))return false;
  let sync=true;const ok=(()=>{try{return z.grantLimited(key,{onClose:()=>{if(!sync)onClose()}})}catch(e){return false}})();
  sync=false;return !!ok;
}
function zHud(){const z=Z();['zhud1','zhud2'].forEach(id=>{const el=$(id);el.innerHTML='';try{if(z&&z.hud)z.hud(el)}catch(e){}})}

/* ---------- 範囲えらび ---------- */
let SEL=new Set(), curU=null;
function unitKoma(u){return BANK.koma.filter(k=>k.unit===u)}
function renderRange(){
  if(!curU)curU=(UNITS.find(u=>unitKoma(u.id).some(k=>SEL.has(k.id)))||UNITS.find(u=>unitKoma(u.id).some(k=>QCOUNT[k.id]))||UNITS[0]||{}).id;
  $('utabs').innerHTML=UNITS.map(u=>{const n=unitKoma(u.id).filter(k=>SEL.has(k.id)).length;return `<button class="${u.id===curU?'on':''}" style="--uc:${u.color}" data-u="${u.id}">${esc(u.short)}<small>${n?n+'コマ':'―'}</small></button>`}).join('');
  const u=UBY[curU];if(!u){$('rlist').innerHTML='';return}
  document.documentElement.style.setProperty('--uc',u.color);
  $('rlist').innerHTML=(u.groups||[]).map((g,gi)=>{
    const ks=g.koma.map(no=>BANK.koma.find(k=>k.unit===u.id&&k.no===no)).filter(Boolean);
    const on=ks.filter(k=>SEL.has(k.id)).length, nq=ks.reduce((s,k)=>s+(QCOUNT[k.id]||0),0);
    return `<div class="grp"><button class="gh" data-g="${gi}"><span class="ck ${on===ks.length?'on':on?'half':''}">${on===ks.length?'✓':on?'−':''}</span>${esc(g.name)}<small>${nq?nq+'問':'問題じゅんび中'}</small></button>`+
      ks.map(k=>{const n=QCOUNT[k.id]||0,x=wrongIn(k.id);return `<button class="km ${n?'':'draft'}" data-k="${k.id}"><span class="ck ${SEL.has(k.id)?'on':''}">${SEL.has(k.id)?'✓':''}</span><span class="n">第${k.no}回</span><span class="t">${esc(k.emoji||'')} ${esc(k.title)}</span><span class="q ${x?'x':''}">${n?(x?'×'+x+' / ':'')+n+'問':'じゅんび中'}</span></button>`}).join('')+'</div>';
  }).join('');
  const ks=[...SEL].filter(id=>KBY[id]),nq=ks.reduce((s,id)=>s+(QCOUNT[id]||0),0),nx=ks.reduce((s,id)=>s+wrongIn(id),0);
  $('rsum').innerHTML=`<span>範囲 <b>${ks.length}</b>コマ</span><span>問題 <b>${nq}</b>問</span>${nx?`<span>いま× <b style="color:#ff8f9b">${nx}</b>問</span>`:''}`;
  $('bGo').disabled=nq<3;$('bGo').textContent=nq<3?'問題が3問以上ある範囲をえらんでね':'スタート！';
  $('bPrev').disabled=!(S.lastRange&&S.lastRange.length);
}

/* ---------- 出題の選び方（設計書 5-3） ---------- */
function prio(q,asked){
  const e=LOG[q.id];let s=Math.random()*.9;
  if(!e)s+=2;else{if(e[2]===0)s+=5;s+=Math.min(e[1],3);if(e[2]===1&&e[4]>=2)s-=4}
  if(asked&&asked.has(q.id))s-=(LOG[q.id]&&LOG[q.id][2]===0)?0:3.5;
  return s;
}
const cat=q=>{const e=LOG[q.id];return !e?'new':e[2]===0?'x':'o'};
function pickRound(pool,n,asked){
  n=Math.min(n,pool.length);
  const sc=pool.map(q=>({q,s:prio(q,asked)})).sort((a,b)=>b.s-a.s);
  const want={x:Math.round(n*.5),new:Math.round(n*.3)};want.o=n-want.x-want.new;
  const out=[],used=new Set(),perK={};
  const take=it=>{out.push(it.q);used.add(it.q.id);perK[it.q.koma]=(perK[it.q.koma]||0)+1};
  for(const c of ['x','new','o']){let k=0;for(const it of sc){if(k>=want[c])break;if(!used.has(it.q.id)&&cat(it.q)===c&&(perK[it.q.koma]||0)<Math.max(2,Math.ceil(n/3))){take(it);k++}}}
  for(const it of sc){if(out.length>=n)break;if(!used.has(it.q.id))take(it)}
  // 用語ばかりにしない（judge/graph/calc/method を半分以上に）
  const isTerm=q=>(q.kind||'term')==='term';
  let terms=out.filter(isTerm).length;
  if(terms>n/2){for(const it of sc){if(terms<=n/2)break;if(used.has(it.q.id)||isTerm(it.q))continue;const i=out.map((q,j)=>[q,j]).reverse().find(([q])=>isTerm(q));if(!i)break;used.delete(out[i[1]].id);out[i[1]]=it.q;used.add(it.q.id);terms--}}
  // 同じゲームが続かないように並べる
  const res=[];let rest=shuffle(out).sort((a,b)=>(cat(a)==='x'?0:1)-(cat(b)==='x'?0:1));
  while(rest.length){const last=res[res.length-1];let i=rest.findIndex(q=>!last||q.game!==last.game);if(i<0)i=0;res.push(rest.splice(i,1)[0])}
  return res;
}

/* ---------- 1問を出す（choice / num / order） ---------- */
function prepQ(q){const o=JSON.parse(JSON.stringify(q));if(o.t==='choice')o.shown=shuffle(o.choices);if(o.t==='order')o.shown=shuffle(o.items);return o}
function correctText(q){return window.Quiz&&Quiz.answer?Quiz.answer(q):(q.t==='num'?q.ans+(q.unit?' '+q.unit:''):q.t==='order'?q.items.join(' → '):q.choices[0])}
function checkQ(q,a){if(window.Quiz&&Quiz.check)return Quiz.check(q,a);if(q.t==='num')return Math.abs(parseFloat(a)-q.ans)<=(q.tol||0)+1e-9;if(q.t==='order')return JSON.stringify(a)===JSON.stringify(q.items);return a===q.choices[0]}
function srcLine(q){const k=KBY[q.koma],g=BANK.games[q.game]||{};const c=cat(q);
  return `<div class="src">${c==='x'?'<span class="tag x">前回×</span>':c==='new'?'<span class="tag n">はじめて</span>':''}<span>${esc(UBY[k&&k.unit]?UBY[k.unit].short:'')} 第${k?k.no:'?'}回</span><span>${esc(g.emoji||'')} ${esc(g.title||'')}</span></div>`}
function ask(q,opt){ // → Promise<{ok, y, el}>
  return new Promise(res=>{
    const A=$('qarea');
    A.innerHTML=`<div class="card">${srcLine(q)}<div class="qt">${safe(q.q)}</div>${q.fig?`<div class="fig">${q.fig}</div>`:''}<div id="ansArea"></div></div>`;
    const area=$('ansArea');
    const done=(ok,y,el)=>res({ok,y,el});
    if(q.t==='num'){
      let v='';area.innerHTML=`<div class="numbox"><div class="numdisp"><span id="nv">　</span><small>${esc(q.unit||'')}</small></div><div class="keys">${['7','8','9','⌫','4','5','6','OK','1','2','3','0','.','−'].map(k=>`<button data-n="${k}" class="${k==='OK'?'ok':''}">${k==='OK'?'決定':k}</button>`).join('')}</div></div>`;
      area.querySelector('.keys').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;sfx.tap();const k=b.dataset.n;
        if(k==='⌫')v=v.slice(0,-1);else if(k==='OK'){if(!v||v==='-')return;area.querySelectorAll('button').forEach(x=>x.disabled=true);return done(checkQ(q,v),v,b)}
        else if(k==='−'){v=v[0]==='-'?v.slice(1):'-'+v}else if(k==='.'){if(!v.includes('.'))v=(v||'0')+'.'}else if(v.replace(/[-.]/g,'').length<7)v+=k;
        $('nv').textContent=v||'　'};
    }else if(q.t==='order'){
      const got=[];area.innerHTML=`<div class="ordbox"><div class="ordsel" id="osel"><div class="ph">↓ 正しい順にタップ</div></div><div class="orditems">${q.shown.map((t,i)=>`<button data-o="${i}">${safe(t)}</button>`).join('')}</div><button class="ghost" id="oUndo" style="margin-top:8px;color:#1c2140;border-color:#c9cfdd">↺ 1つもどす</button></div>`;
      const draw=()=>{$('osel').innerHTML=got.length?got.map((i,n)=>`<div class="it">${n+1}. ${safe(q.shown[i])}</div>`).join(''):'<div class="ph">↓ 正しい順にタップ</div>';area.querySelectorAll('[data-o]').forEach(b=>b.classList.toggle('used',got.includes(+b.dataset.o)))};
      area.querySelector('.orditems').onclick=e=>{const b=e.target.closest('[data-o]');if(!b||got.includes(+b.dataset.o))return;sfx.tap();got.push(+b.dataset.o);draw();
        if(got.length===q.shown.length){const y=got.map(i=>q.shown[i]);area.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>done(checkQ(q,y),y,$('osel')),250)}};
      $('oUndo').onclick=()=>{got.pop();draw()};
    }else{
      area.innerHTML=`<div class="chs">${q.shown.map((c,i)=>`<button class="ch" data-c="${i}"><i>${'ABCDEF'[i]||i+1}</i><span>${safe(c)}</span></button>`).join('')}</div>`;
      area.querySelector('.chs').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;const y=q.shown[+b.dataset.c];const ok=checkQ(q,y);
        area.querySelectorAll('.ch').forEach((x,i)=>{x.disabled=true;if(q.shown[i]===q.choices[0])x.classList.add('right');else if(x!==b)x.classList.add('dim')});
        if(!ok)b.classList.add('wrong');done(ok,y,b)};
    }
  });
}
function feedback(q,r,extra){
  return new Promise(res=>{
    const A=$('ansArea');const g=BANK.games[q.game]||{},k=KBY[q.koma];
    const fb=document.createElement('div');fb.className='fb '+(r.ok?'o':'x');

      :`<b class="h">❌ ざんねん</b><div>正解：<span class="ans">${safe(correctText(q))}</span></div>${q.ex?'<div>'+safe(q.ex)+'</div>':''}<div class="from">📍 この問題が出たゲーム：${esc(g.emoji||'')} ${esc(g.title||'')}（第${k?k.no:'?'}回）</div>`;
    A.appendChild(fb);

/* ---------- 弱点スキャン（3ラウンド） ---------- */
async function runRound(){
  G.round++;const list=pickRound(G.pool,PER_ROUND,G.asked);const res=[];
  G.roundStat={o:0,x:0,f:0};
  $('bossTop').classList.add('hidden');$('plabel').textContent=`🔥 スキャン ${G.round}/${ROUNDS}`;
  show('play');
  for(let i=0;i<list.length;i++){
    progUI(list,i,res);const q=prepQ(list[i]);const r=await ask(q);const fx=record(list[i],r,'scan');res.push(r.ok);
    r.ok?G.roundStat.o++:G.roundStat.x++;if(fx)G.roundStat.f++;
    await feedback(list[i],r,fx?' 克服！':(G.combo>=3?` ${G.combo}連続！`:''));
  }
  // ミニ課題（範囲にあれば1ラウンド1つ）
  const m=pickMini();if(m){await runMini(m,false)}
  progUI(list,list.length,res);
  between();
}
function pickMini(unit){const ms=G.minis.filter(m=>!unit||(KBY[m.koma]&&KBY[m.koma].unit===unit));if(!ms.length)return null;
  ms.sort((a,b)=>wrongIn(b.koma)-wrongIn(a.koma)+Math.random()-.5);return ms[0]}
function between(){
  const st=G.roundStat,last=G.round>=ROUNDS;

  $('bwMeter').style.width='0';setTimeout(()=>$('bwMeter').style.width=(okN/G.pool.length*100)+'%',100);
  const tot=G.answers.filter(a=>a.ctx==='scan');
  $('bwMsg').innerHTML=(st.f?`<b style="color:var(--gold)">×だった問題を ${st.f}問 ○にした！</b><br>`:'')+(last?(G.bosses.length?`いよいよ <b>ボスラッシュ</b>！ ${G.bosses.map(u=>esc(UBY[u].boss)).join(' → ')}`:'範囲の問題が少ないので、ボスはお休み。成績カードへ！'):`ここまで ${tot.filter(a=>a.ok).length} / ${tot.length} 問 正解。つぎのラウンドは ×だった問題がまた出るよ。`);
  $('bwNext').textContent=last?(G.bosses.length?'ボスラッシュへ ▶':'成績カードへ ▶'):`ラウンド${G.round+1}へ ▶`;
  $('bwSkip').classList.toggle('hidden',last||!G.bosses.length);
  show('between');sfx.round();confetti(40);
