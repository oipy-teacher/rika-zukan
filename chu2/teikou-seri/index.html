<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FBE9E7">
<title>抵抗キャッチャー ～電気抵抗～</title>
<!--
  抵抗キャッチャー ～電気抵抗～　（ゲームID teikou-seri ／ コマID chu2-denryu-10 ／ 確認用）

  【遊びの核】クレーンゲーム。景品の電熱線には「2V で 0.4A」のような測定札だけが付いている。注文の「5Ω」を
    電圧÷電流で見抜き、その線をアームでつかむ。アームは動かすと揺れる（揺れたまま下ろすとずれる）。
    つかんで取り出し口に落とすと札が裏返り、Ωの数字が光る。まちがった線を落とすと札の裏で計算が見え、連続ヨシが切れる。
  【理科の埋め込み】正しい線＝電圧÷電流が注文のΩ。わな：札の「5V」の数字（3F）／mAのまま割る（4F）／
    同じ線なら電圧を変えても割り算は同じ（6F）／同じ電圧なら抵抗が大きいほど電流は小さい（8F）。
  【ハマる仕組み】主①ガチャ（正しい線をつかんだときだけカプセルが開き、標本のレア度を抽選・確率表示）／
    副⑦ニアミス（空振りは本当のずれ〔mm〕を表示）・⑯1階1〜2分・すぐやり直せる
  【道のり×集める×美麗】ゲームセンター「ねんど堂」を1Fから10F（閉店ラッシュ）へ／つかんだ電熱線の標本（Ωごと・レア度）／
    粘土でこねたぷっくりした景品と筐体
  【画風】クレイ（粘土のやわらかい陰影・指あと・ぷにっとつぶれる動き）。輪郭線は引かず、ハイライトと影と粒状の地で立体を出す。
    ボタン・札・HUDもすべて粘土のかたまり。
  【配色】背景 #FBE9E7（桃色の壁）／主 #E26D5A（テラコッタ粘土・1ごうき）／差し #3E7CB1（青粘土・2ごうき）／
    からし #F2B544・若草 #6BAF7A・生成り札 #FFF6EC・こげ茶の文字 #5A2E24
  【書体】Kiwi Maru（見出し・札の数字）／本文はOSのゴシック
  【全画面の構図】PC・iPad横＝筐体を正面から2台並べる。スマホ・iPad縦＝1台を縦長に大きく、左右の移動は下端のスライダー、
    上の「となりの台」札で台を切りかえる
  【HUD】筐体の看板（階・連続ヨシ・かけら）と操作盤（のこりクレジットの粘土コイン）に描く。Zukan.state() で数を読む
  【音】WebAudio合成のおもちゃ・マリンバ風（三角波・正弦波・ぷにっと音程が下がる音）。ミュートあり
  【もどる】画面左上にいつも粘土の立て札「◀ もどる」
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#5A2E24;--fk:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",serif;--fs:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#FBE9E7;overflow:hidden;overscroll-behavior:none}
body{color:var(--ink);font-family:var(--fs);user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button{font-family:var(--fk);cursor:pointer;touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:absolute;inset:0;pointer-events:none}
.scr .pe,.scr button,.scr input{pointer-events:auto}
.hidden{display:none!important}
/* ===== 粘土のかたまり ===== */
.clay{--c:#E26D5A;--d:#B24D3C;--l:#F7A897;position:relative;border:0;color:#fff;font:500 19px var(--fk);min-height:54px;padding:0 26px;letter-spacing:.04em;
  background:repeating-radial-gradient(circle at 78% 72%,rgba(255,255,255,0) 0 4px,rgba(255,255,255,.07) 4px 5px),radial-gradient(130% 100% at 28% 18%,var(--l) 0%,var(--c) 42%,var(--d) 100%);
  border-radius:24px 28px 25px 21px/27px 22px 28px 23px;
  box-shadow:inset 0 4px 3px rgba(255,255,255,.42),inset 0 -6px 8px rgba(70,15,5,.25),0 7px 0 var(--d),0 12px 16px rgba(130,50,40,.28);
  text-shadow:0 2px 0 rgba(60,10,0,.22);transition:transform .08s}
.clay:active{transform:translateY(5px) scale(1.02,.96);box-shadow:inset 0 4px 3px rgba(255,255,255,.42),inset 0 -6px 8px rgba(70,15,5,.25),0 2px 0 var(--d),0 4px 8px rgba(130,50,40,.25)}
.clay.b{--c:#3E7CB1;--d:#285987;--l:#86B7E0}
.clay.y{--c:#F2B544;--d:#C68A22;--l:#FBD88F;color:#5A2E24;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.clay.g{--c:#6BAF7A;--d:#4A8A58;--l:#A9D8B2}
.clay.w{--c:#FFF6EC;--d:#E3C4B3;--l:#FFFFFF;color:#5A2E24;text-shadow:none}
.clay.sm{min-height:46px;font-size:16px;padding:0 16px}
.clay:disabled{filter:grayscale(.8) brightness(1.05);opacity:.6}
.slab{background:repeating-radial-gradient(circle at 85% 80%,rgba(255,255,255,0) 0 5px,rgba(255,255,255,.08) 5px 6px),radial-gradient(140% 110% at 25% 15%,#FFFDF9 0%,#FFF1E6 45%,#EFD2C2 100%);
  border-radius:30px 34px 28px 32px/32px 28px 34px 30px;box-shadow:inset 0 5px 4px rgba(255,255,255,.7),inset 0 -8px 12px rgba(150,80,60,.18),0 10px 0 #DDB6A3,0 18px 26px rgba(130,50,40,.22)}
/* 左上の立て札（もどる）と右上の音 */
#bBack{position:fixed;left:calc(10px + env(safe-area-inset-left));top:calc(9px + env(safe-area-inset-top));z-index:30;min-height:50px;font-size:17px;padding:0 16px 0 12px;
  --c:#FFF6EC;--d:#D9B3A0;--l:#FFFFFF;color:#5A2E24;text-shadow:none;border-radius:16px 20px 18px 14px/18px 14px 20px 16px}
#bBack b{display:inline-block;background:#E26D5A;color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;margin-right:6px;font-size:14px;box-shadow:inset 0 2px 2px rgba(255,255,255,.4),inset 0 -3px 3px rgba(0,0,0,.2)}
#bMute{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(9px + env(safe-area-inset-top));z-index:30;min-height:50px;width:54px;padding:0;font-size:22px;--c:#FFF6EC;--d:#D9B3A0;--l:#fff}
/* ===== タイトル ===== */
#scrTitle{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 18px calc(26px + env(safe-area-inset-bottom))}
#ttl{position:absolute;left:0;right:0;top:calc(8vh + 40px);text-align:center;font-family:var(--fk);pointer-events:none}
#ttl .a{display:block;font-size:clamp(40px,10vw,112px);line-height:1.02;color:#E26D5A;letter-spacing:-.02em;-webkit-text-stroke:.03em #E26D5A;text-shadow:0 .03em 0 #F59A87,0 .06em 0 #C9533F,0 .09em 0 #B24D3C,0 .16em .12em rgba(120,45,30,.3),-.02em -.03em 0 rgba(255,255,255,.45)}
#ttl .s{display:inline-block;margin-top:10px;font-size:clamp(17px,2.6vw,28px);color:#fff;background:#3E7CB1;padding:6px 20px 8px;border-radius:20px 24px 18px 26px/22px 18px 26px 20px;box-shadow:inset 0 3px 2px rgba(255,255,255,.35),inset 0 -4px 5px rgba(0,0,0,.2),0 5px 0 #285987}
#ttl .k{display:block;margin-top:12px;font-size:clamp(14px,1.8vw,19px);color:#8A4A3A}
.tBtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:min(640px,100%)}
.tBtns .clay{flex:1 1 140px}
#nmRow{margin:0 0 14px;display:flex;gap:8px;align-items:center;font-family:var(--fk);font-size:16px}
#nameIn{font:500 18px var(--fk);color:#5A2E24;border:0;padding:11px 16px;width:220px;border-radius:18px 22px 16px 20px/20px 16px 22px 18px;background:#FFF6EC;box-shadow:inset 0 4px 6px rgba(150,80,60,.22),0 3px 0 #fff}
.tSub{display:flex;gap:10px;margin-top:14px}
#scrTitle.land{align-items:flex-start;padding-left:5vw}
#scrTitle.land #ttl{right:46%;top:18vh}
#scrTitle.land .tBtns{width:min(560px,46vw)}
#scrTitle.land #ttl .a{font-size:clamp(46px,6.4vw,104px)}
/* ===== 館内マップ ===== */
#scrMap{display:grid;padding:calc(72px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));gap:18px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow:hidden}
#scrMap.port{grid-template-columns:1fr;grid-template-rows:auto auto;overflow-y:auto;pointer-events:auto}
.bld{display:flex;flex-direction:column;gap:9px;padding:16px 16px 18px;min-height:0;overflow-y:auto}
.bld h2,.box h2{margin:0 0 4px;font:500 22px var(--fk);color:#5A2E24;text-align:center}
.fl{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 16px;text-align:left;font-size:17px}
.fl .no{font-size:24px;min-width:48px}
.fl .nm{flex:1}
.fl .st{font-size:15px;letter-spacing:1px;color:#FFE08A;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.fl.y .st,.fl.w .st{color:#C68A22;text-shadow:none}
.box{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:9px}
.sp{height:86px;border-radius:18px 22px 17px 21px/21px 17px 22px 18px;background:#F4DCD0;box-shadow:inset 0 4px 7px rgba(150,80,60,.25);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;font:500 16px var(--fk);color:#B48A7A;position:relative}
.sp canvas{position:absolute;left:50%;top:4px;transform:translateX(-50%)}
.sp.r1{background:#FFE7C2}.sp.r2{background:#D9ECFF}.sp.r3{background:linear-gradient(160deg,#FFF3B0,#F6C95A)}
.sp b{position:relative;z-index:1;color:#5A2E24}
.rates{font-size:13px;line-height:1.6;color:#7A4A3A}
.mapBtns{display:flex;gap:10px;flex-wrap:wrap}
.mapBtns .clay{flex:1 1 130px}
/* ===== 階のはじめ・クリア・失敗・確認 ===== */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(90,46,36,.28);pointer-events:auto;padding:18px}
.ovp{width:min(560px,100%);padding:24px 22px 22px;text-align:center}
.ovp h3{margin:0;font:500 clamp(30px,6vw,46px)/1.1 var(--fk);color:#E26D5A}
.ovp .fno{font:500 18px var(--fk);color:#3E7CB1}
.ovp p{margin:10px 0 16px;font-size:17px;line-height:1.7}
.ovp .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ovp .row .clay{flex:1 1 150px}
.stars{font-size:34px;letter-spacing:8px;margin:10px 0 4px}
.stars i{font-style:normal;color:#E7CFC3}.stars i.on{color:#F2B544;text-shadow:0 3px 0 #C68A22}
.stl{font-size:13px;color:#8A5A4A}
.rec{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px;font-size:15px}
.rec span{background:#F7E1D6;border-radius:14px;padding:6px 12px}
.rec b{font-family:var(--fk);font-size:19px}
/* ガチャ（カプセル） */
#gacha{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(circle at 50% 45%,rgba(255,246,236,.7),rgba(90,46,36,.35))}
#gCap{position:relative;width:220px;height:220px}
#gCap .h{position:absolute;left:10px;width:200px;height:100px;border-radius:100px 100px 0 0;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
#gCap .h.t{top:10px;background:radial-gradient(120% 120% at 30% 25%,#fff 0,var(--cc,#F7A897) 30%,var(--cd,#B24D3C) 100%);box-shadow:inset 0 -6px 8px rgba(0,0,0,.18)}
#gCap .h.b{top:110px;border-radius:0 0 100px 100px;background:radial-gradient(120% 120% at 30% 0%,#FFFDF9 0,#F4E2D8 55%,#D9B8A6 100%)}
#gCap .h{transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .5s}
#gCap.open .h.t{transform:translate(-120px,-140px) rotate(-38deg);opacity:0}
#gCap.open .h.b{transform:translate(90px,150px) rotate(18deg);opacity:0}
#gIn{position:absolute;left:50%;top:50%;width:230px;padding:10px 0 14px;border-radius:40px 46px 38px 44px/44px 38px 46px 40px;background:radial-gradient(130% 100% at 30% 15%,#fff,#FFF1E6 50%,#EBCDBD);box-shadow:inset 0 5px 4px #fff,inset 0 -8px 12px rgba(150,80,60,.2),0 12px 24px rgba(120,45,30,.3);transform:translate(-50%,-50%) scale(.2);opacity:0;transition:all .45s cubic-bezier(.3,1.7,.5,1) .12s;text-align:center}
#gCap.open #gIn{transform:translate(-50%,-50%) scale(1);opacity:1}
#gR{font:500 22px var(--fk);margin-top:8px;text-shadow:0 2px 0 #fff}
#gO{font:500 44px var(--fk);color:#5A2E24;text-shadow:0 3px 0 #fff}
#gNote{margin-top:64px;font-size:13px;color:#5A2E24;background:rgba(255,246,236,.85);border-radius:14px;padding:6px 12px;max-width:92vw;text-align:center}
/* ===== 確認テスト ===== */
#scrTest{pointer-events:auto;overflow-y:auto;padding:calc(74px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
.tWrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;min-height:100%;align-items:start;max-width:1400px;margin:0 auto}
.tWrap.port{grid-template-columns:1fr}
.tQ{padding:22px 24px}
#tNo{font:500 17px var(--fk);color:#3E7CB1}
#tLamps{display:flex;gap:6px;margin:8px 0 12px}
#tLamps i{width:22px;height:22px;border-radius:50%;background:#EAD3C8;box-shadow:inset 0 3px 4px rgba(150,80,60,.3)}
#tLamps i.cur{background:#F2B544}#tLamps i.ok{background:#6BAF7A}#tLamps i.ng{background:#E26D5A}
#tQ{font-size:20px;line-height:1.7;margin:0 0 12px;font-weight:600}
#tFig{background:#fff;border-radius:16px;padding:8px}
#tFig svg{width:100%;height:auto;max-height:44vh;display:block}
.tA{display:flex;flex-direction:column;gap:14px}
.tA .ch{display:flex;align-items:center;gap:12px;text-align:left;min-height:60px;font:600 17px var(--fs);padding:10px 18px;line-height:1.45}
.tA .ch i{font:500 20px var(--fk);font-style:normal;min-width:26px}
.tA .ch.ok{--c:#6BAF7A;--d:#4A8A58;--l:#A9D8B2;color:#fff}
.tA .ch.ng{--c:#E26D5A;--d:#B24D3C;--l:#F7A897;color:#fff}
.numbox{display:flex;align-items:center;gap:10px;justify-content:center}
.numbox .v{min-width:180px;min-height:60px;padding:6px 16px;font:500 34px var(--fk);text-align:right;background:#FFF6EC;border-radius:18px;border:4px solid #EAD3C8;box-shadow:inset 0 4px 6px rgba(150,80,60,.2)}
.numbox .u{font:500 26px var(--fk)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys .clay{padding:0;font-size:22px;min-height:56px}
.keys .go{grid-column:1/-1}
.ord{display:flex;flex-direction:column;gap:10px}
.slot{display:flex;gap:10px;align-items:center;background:#FFF6EC;border:3px dashed #D9B3A0;border-radius:16px;padding:10px 14px;font-weight:600}
.slot i{font:500 20px var(--fk);font-style:normal;color:#3E7CB1}
#tEx{padding:14px 16px;font-size:16px;line-height:1.7;background:#FFF6EC;border-radius:18px;box-shadow:inset 0 3px 6px rgba(150,80,60,.18)}
#tEx b{font-family:var(--fk);font-size:20px;margin-right:8px}
/* 結果 */
#scrEnd{display:flex;align-items:center;justify-content:center;padding:80px 18px 24px;pointer-events:auto}
.endp{width:min(620px,100%);padding:26px;text-align:center}
#eScore{font:500 64px var(--fk);color:#E26D5A}
#eScore small{font-size:24px;color:#5A2E24}
@media (prefers-reduced-motion:reduce){.clay,#gCap .h,#gIn{transition:none}}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>

<div id="scrTitle" class="scr">
  <div id="ttl"><span class="a">抵抗キャッチャー</span><span class="s">～電気抵抗～</span><span class="k">札の「電圧÷電流」で見ぬいて、注文のΩをつかめ</span></div>
  <div id="nmRow" class="pe"><label for="nameIn">なまえ</label><input id="nameIn" maxlength="16" placeholder="（空でもOK）" autocomplete="off"></div>
  <div class="tBtns"><button id="bStart" class="clay">はじめる</button><button id="bCont" class="clay b">つづきから</button></div>
  <div class="tSub"><button id="bBook1" class="clay w sm">📖 図鑑</button><button id="bGacha1" class="clay y sm">ガチャ</button></div>
</div>

<div id="scrMap" class="scr hidden">
  <div class="bld slab pe"><h2>ゲームセンター ねんど堂</h2><div id="floors" style="display:flex;flex-direction:column-reverse;gap:9px"></div></div>
  <div class="box slab pe"><h2>電熱線の標本箱 <span id="spN" style="font-size:16px;color:#3E7CB1"></span></h2>
    <div id="specs" class="specs"></div>
    <div class="rates">カプセルは<b>注文どおりの線をつかんだときだけ</b>開きます。<br>ふつう 60%／レア 28%／スーパー 10%／ゴールド 2%（連続ヨシ3以上のあいだは レア以上が1.5倍）</div>
    <div class="mapBtns"><button id="bBook2" class="clay w sm">📖 図鑑</button><button id="bGacha2" class="clay y sm">図鑑ガチャ</button><button id="bToTest" class="clay g sm">確認テストへ</button></div>
  </div>
</div>

<div id="scrPlay" class="scr hidden"></div>

<div id="ovFloor" class="scr hidden"><div class="ov"><div class="ovp slab"><div class="fno" id="fNo">1F</div><h3 id="fNm"></h3><p id="fHint"></p><div class="row"><button id="fGo" class="clay">あそぶ</button></div></div></div></div>
<div id="ovClear" class="scr hidden"><div class="ov"><div class="ovp slab"><div class="fno" id="cNo"></div><h3 id="cTitle">クリア！</h3>
  <div class="stars" id="cStars"></div><div class="stl">クリア ／ 全注文を一発で ／ 空振りなし</div>
  <div class="rec" id="cRec"></div><div class="row"><button id="cMap" class="clay w">館内マップ</button><button id="cNext" class="clay">上の階へ</button></div></div></div></div>
<div id="ovFail" class="scr hidden"><div class="ov"><div class="ovp slab"><h3 id="xTitle" style="color:#3E7CB1">クレジット切れ</h3><p id="xSub"></p>
  <div class="row"><button id="xMap" class="clay w">館内マップ</button><button id="xRetry" class="clay">もう1回（1〜2分）</button></div></div></div></div>
<div id="ovBack" class="scr hidden"><div class="ov"><div class="ovp slab"><h3 style="font-size:32px">もどりますか？</h3><p id="bkSub">進み具合は保存されます。</p>
  <div class="row"><button id="bkNo" class="clay w">つづける</button><button id="bkGo" class="clay b">もどる</button></div></div></div></div>
<div id="ovPause" class="scr hidden"><div class="ov"><div class="ovp slab"><h3>ひと休み</h3><p>アームは止まっています。</p><div class="row"><button id="pGo" class="clay">つづける</button></div></div></div></div>
<div id="gacha" class="scr hidden"><div id="gCap"><div class="h b"></div><div id="gIn"><canvas id="gCv" width="160" height="150"></canvas><div id="gO"></div><div id="gR"></div></div><div class="h t"></div></div><div id="gNote"></div></div>

<div id="scrTest" class="scr hidden"><div class="tWrap" id="tWrap">
  <div class="tQ slab"><div id="tNo"></div><div id="tLamps"></div><p id="tQ"></p><div id="tFig" class="hidden"></div></div>
  <div class="tA" id="tAcol"><div id="tA" class="tA"></div><div id="tEx" class="hidden"></div><button id="tNext" class="clay b hidden">つぎへ</button></div>
</div></div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };

})();

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

  var b=R.btn;ball(c,b.x,b.y,b.r,{c:'#E03E2D',l:'#FF9C8C',d:'#8E2014'});ctext(c,'つかむ',b.x,b.y,Math.max(13,b.r*.42),'#fff',{emb:'rgba(0,0,0,.25)'});
  ball(c,R.sl.x+R.sl.w*u,R.sl.y,Math.min(20,R.pn.h*.12),{c:PAPER,l:'#fff',d:'#D9B3A0'})}

/* ---------------- 指の操作 ---------------- */
var drag=null;
function hitMach(x,y){var list=LAND?[0,1]:[G.view];for(var i=0;i<list.length;i++){var mi=list[i],R=MR[mi];
  if(!LAND){var tb=tabRect(R);if(x>=tb.x&&x<=tb.x+tb.w&&y>=tb.y&&y<=tb.y+tb.h)return{mi:mi,k:'tab'}}
  var b=R.btn;if(Math.hypot(x-b.x,y-b.y)<b.r*1.15)return{mi:mi,k:'grab'};
  if(y>=R.pn.y&&y<=R.pn.y+R.pn.h&&x>=R.pn.x&&x<=R.btn.x-R.btn.r-4)return{mi:mi,k:'sl'};
  if(x>=R.gl.x&&x<=R.gl.x+R.gl.w&&y>=R.gl.y&&y<=R.gl.y+R.gl.h)return{mi:mi,k:'gl'}}return null}
function setTu(mi,k,x){var R=MR[mi],m=G.m[mi],u;if(k==='sl')u=.03+(x-R.sl.x)/R.sl.w*.955;else u=(x-R.gl.x)/R.gl.w;m.tu=Math.max(.03,Math.min(.985,u));G.act=mi}
cv.addEventListener('pointerdown',function(e){if(scene!=='play'||!G||G.state==='intro'||G.paused)return;ac();var h=hitMach(e.clientX,e.clientY);if(!h)return;
  if(h.k==='tab'){G.view=1-G.view;G.act=G.view;paintBG();tone(700,.08,'triangle',.05);return}
  if(h.k==='grab'){grab(h.mi);return}
  drag={mi:h.mi,k:h.k,id:e.pointerId};setTu(h.mi,h.k,e.clientX);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',function(e){if(drag&&drag.id===e.pointerId&&G)setTu(drag.mi,drag.k,e.clientX)});
function endDrag(e){if(drag&&drag.id===e.pointerId)drag=null}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
window.addEventListener('keydown',function(e){if(scene!=='play'||!G||G.state!=='play')return;var mi=LAND?G.act:G.view,m=G.m[mi];
  if(e.key==='ArrowLeft'){m.tu=Math.max(.03,m.tu-.06);e.preventDefault()}else if(e.key==='ArrowRight'){m.tu=Math.min(.985,m.tu+.06);e.preventDefault()}
  else if(e.key===' '||e.key==='Enter'){grab(mi);e.preventDefault()}else if(e.key==='Tab'&&LAND){G.act=1-G.act;e.preventDefault()}else if(e.key==='Tab'){G.view=1-G.view;G.act=G.view;paintBG();e.preventDefault()}});

/* ---------------- 階のクリア・失敗 ---------------- */
function clearFloor(){var g=G,fi=g.fi,st=[1,g.wrong===0?1:0,g.miss===0?1:0];G.state='clear';
  var old=SV.stars[fi]||[0,0,0];SV.stars[fi]=old.map(function(v,i){return v||st[i]});
  var firstClear=!old[0];SV.unl=Math.max(SV.unl,Math.min(FL.length,fi+2));SV.ms+=Math.round(g.t*1000);
  var b=SV.best[fi];if(!b||g.first>b.first)SV.best[fi]={first:g.first,n:g.orders.length,t:Math.round(g.t)};
  var z=Zk();
  if(firstClear&&(fi===3||fi===5)&&z&&z.earn)z.earn(30,'rule',{x:W/2,y:H*.3});
  if(g.F.boss){if(!SV.clearMs)SV.clearMs=SV.ms;if(!SV.bossT||g.t<SV.bossT)SV.bossT=Math.round(g.t);SV.done=1;if(z&&z.earn)z.earn(100,'boss',{id:GID+'-boss',x:W/2,y:H*.3})}
  save();SFX.clear();
  $('cNo').textContent=(fi+1)+'F　'+g.F.n;$('cTitle').textContent=g.F.boss?'閉店まで守りきった！':'クリア！';
  $('cStars').innerHTML=st.map(function(v){return'<i class="'+(v?'on':'')+'">★</i>'}).join('');
  $('cRec').innerHTML='<span>一発で見ぬいた <b>'+g.first+' / '+g.orders.length+'</b></span><span>最大連続ヨシ <b>'+g.maxCombo+'</b></span><span>タイム <b>'+fmtT(g.t)+'</b></span>';
  $('cNext').textContent=g.F.boss?'確認テストへ':'上の階へ';
  setTimeout(function(){if(G===g&&scene==='play')showOv('ovClear')},RM?300:900)}
function failFloor(why){if(!G||G.state==='fail'||G.state==='clear')return;G.state='fail';SV.ms+=Math.round(G.t*1000);save();SFX.bad();
  $('xTitle').textContent=why;$('xSub').innerHTML='注文 '+G.oi+' / '+G.orders.length+' 件までできた。<br>まちがった線を運ぶと、クレジットが1回分むだになる。札は全部割り算してから。';var gg=G;setTimeout(function(){if(G===gg&&scene==='play')showOv('ovFail')},500)}
function fmtT(s){s=Math.round(s);return Math.floor(s/60)+'分'+('0'+s%60).slice(-2)+'秒'}
$('cNext').onclick=function(){ac();if(G&&G.F.boss){G=null;toTest()}else if(G){startFloor(Math.min(FL.length-1,G.fi+1))}};
$('cMap').onclick=function(){G=null;setScene('map')};
$('xRetry').onclick=function(){if(G)startFloor(G.fi)};
$('xMap').onclick=function(){G=null;setScene('map')};
$('fGo').onclick=function(){ac();hideOv('ovFloor');if(G){G.state='play'}};

/* ---------------- 場面の切りかえ ---------------- */
var SCR=['scrTitle','scrMap','scrPlay','scrTest','scrEnd'],OVS=['ovFloor','ovClear','ovFail','ovBack','ovPause'];
function showScr(id){SCR.forEach(function(s){$(s).classList.toggle('hidden',s!==id)})}
function showOv(id){$(id).classList.remove('hidden')}
function hideOv(id){$(id).classList.add('hidden')}
function hideAllOv(){OVS.forEach(hideOv);closeGacha()}
var INHUB=!!window.COLLECTION_NAME||(function(){try{return window.parent!==window}catch(e){return true}})();
function backBtn(){var b=$('bBack'),on=scene==='play'||scene==='map'||scene==='test'||scene==='end'||(scene==='title'&&INHUB);b.classList.toggle('hidden',!on);b.innerHTML='<b>◀</b>'+(scene==='title'?'一覧へ':'もどる')}
var backFrom=null;
$('bBack').onclick=function(){ac();
  if(scene==='title'){try{window.parent.postMessage({type:'rika-close-game'},'*')}catch(e){}return}
  backFrom=scene;if(G)G.paused=true;
  $('bkSub').textContent=scene==='test'?'確認テストは、次はさいしょから。館内の進み具合は保存されています。':scene==='play'?'進み具合は保存されます（クリアした階と★はそのまま。この階は次にはじめから）。':'進み具合は保存されます。';
  $('bkGo').textContent=scene==='play'||scene==='test'||scene==='end'?'館内マップへ':'タイトルへ';showOv('ovBack')};
$('bkNo').onclick=function(){hideOv('ovBack');if(G)G.paused=false};
$('bkGo').onclick=function(){hideOv('ovBack');if(backFrom==='map'){setScene('title')}else{if(G&&G.state==='play')SV.ms+=Math.round(G.t*1000),save();G=null;setScene(TEST?'title':'map')}};
function setScene(s){scene=s;hideAllOv();
  if(s==='title')showScr('scrTitle');else if(s==='map'){showScr('scrMap');renderMap()}else if(s==='play')showScr('scrPlay');else if(s==='test')showScr('scrTest');else if(s==='end')showScr('scrEnd');
  backBtn();layoutDom();paintBG();$('bMute').textContent=muted?'🔇':'🔊'}
function layoutDom(){$('scrTitle').classList.toggle('land',LAND);$('scrMap').classList.toggle('port',!LAND);$('tWrap').classList.toggle('port',W<860)}
$('pGo').onclick=function(){hideOv('ovPause');if(G)G.paused=false};
$('bMute').onclick=function(){muted=!muted;try{localStorage.setItem(SKEY+':mute',muted?'1':'0')}catch(e){}$('bMute').textContent=muted?'🔇':'🔊';if(!muted)tone(880,.1,'triangle',.06)};
document.addEventListener('visibilitychange',function(){if(document.hidden&&scene==='play'&&G&&G.state==='play'){G.paused=true;showOv('ovPause')}});

/* 館内マップ */
function renderMap(){var box=$('floors');box.innerHTML='';
  FL.forEach(function(F,i){var b=document.createElement('button');var lock=i+1>SV.unl;b.className='fl clay '+(F.boss?'':(i%2?'b':''))+(lock?' w':'');b.disabled=lock;
    var st=SV.stars[i]||[0,0,0];b.innerHTML='<span class="no">'+(i+1)+'F</span><span class="nm">'+(lock?'？？？':F.n)+'</span><span class="st">'+(lock?'🔒':st.map(function(v){return v?'★':'☆'}).join(''))+'</span>';
    b.onclick=function(){startFloor(i)};box.appendChild(b)});
  var sp=$('specs');sp.innerHTML='';var got=0;
  DEC.forEach(function(r){var k=fmt(r),v=SV.spec[k],d=document.createElement('div');d.className='sp'+(v!=null?' r'+v:'');
    if(v!=null){got++;var cn=document.createElement('canvas');cn.width=120;cn.height=100;cn.style.width='60px';cn.style.height='50px';drawSpec(cn,null,v);d.appendChild(cn)}
    d.insertAdjacentHTML('beforeend','<b>'+(v!=null?k+'Ω':'？')+'</b>');sp.appendChild(d)});
  $('spN').textContent=got+' / '+DEC.length+(got<DEC.length?'（あと'+(DEC.length-got)+'種）':'　コンプリート！');
  $('bToTest').disabled=!SV.done;$('bToTest').textContent=SV.done?'確認テストへ':'確認テスト（10Fのあと）'}
function toTest(){var z=Zk();if(z&&z.mainClear&&!TEST){try{z.mainClear({onClose:startTest});return}catch(e){}}startTest()}
$('bToTest').onclick=function(){if(SV.done)startTest()};
function openBook(){var z=Zk();if(z&&z.openBook)z.openBook()}
function openGacha(){var z=Zk();if(z&&z.openGacha)z.openGacha()}
$('bBook1').onclick=openBook;$('bBook2').onclick=openBook;$('eBook').onclick=openBook;$('bGacha1').onclick=openGacha;$('bGacha2').onclick=openGacha;
if(!Zk()){['bBook1','bBook2','bGacha1','bGacha2','eBook'].forEach(function(id){$(id).classList.add('hidden')})}
function getName(){return(window.PLAYER_NAME||$('nameIn').value||SV.name||'').trim()}
$('bStart').onclick=function(){ac();SV.name=$('nameIn').value.trim()||SV.name;save();if(SV.unl<=1&&!SV.stars[0])startFloor(0);else setScene('map')};
$('bCont').onclick=function(){ac();SV.name=$('nameIn').value.trim()||SV.name;save();setScene('map')};

/* ---------------- 確認テスト ---------------- */
var TQ=[],TI=0,TA=[],TOK=[],CARD=null,OKC='#4A8A58',NGC='#C43D2B';
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
function startTest(){G=null;scene='test';setScene('test');TQ=window.Quiz?Quiz.test():[];TI=0;TA=[];TOK=[];showQ()}
function lamps(){$('tLamps').innerHTML=TQ.map(function(q,i){return'<i class="'+(i<TOK.length?(TOK[i]?'ok':'ng'):i===TI?'cur':'')+'"></i>'}).join('')}
function showQ(){if(TI>=TQ.length)return finishTest();var q=TQ[TI];$('scrTest').scrollTop=0;$('tNo').textContent='景品交換クイズ　第'+(TI+1)+'問 ／ '+TQ.length;lamps();
  $('tQ').textContent=q.q;var f=$('tFig');if(q.fig){f.innerHTML=q.fig;f.classList.remove('hidden')}else{f.innerHTML='';f.classList.add('hidden')}
  $('tEx').classList.add('hidden');$('tNext').classList.add('hidden');var box=$('tA');box.innerHTML='';
  if(q.t==='choice'){q.shown.forEach(function(s,i){var b=document.createElement('button');b.className='ch clay w';b.innerHTML='<i>'+'ABCDEF'.charAt(i)+'</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){answer(s,b)};box.appendChild(b)})}
  else if(q.t==='num'){var v='';box.innerHTML='<div class="numbox"><div class="v" id="nv">&nbsp;</div><div class="u">'+esc(q.unit||'')+'</div></div><div class="keys" id="nk"></div>';
    ['7','8','9','⌫','4','5','6','.','1','2','3','0'].forEach(function(k){var b=document.createElement('button');b.className='clay w';b.textContent=k;b.onclick=function(){if(TA.length>TI)return;if(k==='⌫')v=v.slice(0,-1);else if(v.length<7&&!(k==='.'&&v.indexOf('.')>=0))v+=k;$('nv').innerHTML=v?esc(v):'&nbsp;';SFX.tick()};$('nk').appendChild(b)});
    var go=document.createElement('button');go.className='go clay';go.textContent='この値で決定';go.onclick=function(){if(v&&TA.length<=TI)answer(v,null)};$('nk').appendChild(go)}
  else{var sel=[],wrap=document.createElement('div');wrap.className='ord';box.appendChild(wrap);
    var drawO=function(){wrap.innerHTML='';sel.forEach(function(s,i){var d=document.createElement('div');d.className='slot';d.innerHTML='<i>'+(i+1)+'</i><span></span>';d.querySelector('span').textContent=s;wrap.appendChild(d)});
      q.shown.forEach(function(s){if(sel.indexOf(s)>=0)return;var b=document.createElement('button');b.className='ch clay w';b.innerHTML='<i>＋</i><span></span>';b.querySelector('span').textContent=s;b.onclick=function(){if(TA.length>TI)return;sel.push(s);SFX.tick();if(sel.length===q.shown.length)answer(sel.slice(),null);else drawO()};wrap.appendChild(b)});
      if(sel.length&&TA.length<=TI){var r=document.createElement('button');r.className='clay b sm';r.textContent='やりなおす';r.onclick=function(){sel=[];drawO()};wrap.appendChild(r)}};drawO()}}
function answer(v,btn){if(TA.length>TI)return;var q=TQ[TI],ok=window.Quiz?Quiz.check(q,v):false;TA.push(v);TOK.push(ok);ok?SFX.ok():SFX.bad();
  [].slice.call($('tA').querySelectorAll('.ch')).forEach(function(b){b.disabled=true;var t=b.querySelector('span').textContent;if(q.t==='choice'){if(t===q.choices[0]){b.classList.add('ok');b.disabled=false;b.style.pointerEvents='none'}else if(b===btn){b.classList.add('ng');b.disabled=false;b.style.pointerEvents='none'}}});
  if(q.t==='order'){[].slice.call($('tA').querySelectorAll('.slot')).forEach(function(d,i){d.style.borderColor=v[i]===q.items[i]?OKC:NGC;d.style.borderStyle='solid'})}
  if(q.t==='num'){var nv=$('nv');if(nv)nv.style.borderColor=ok?OKC:NGC}
  var ex=$('tEx');ex.innerHTML=(ok?'<b style="color:'+OKC+'">ヨシ！</b>':'<b style="color:'+NGC+'">おしい</b>正解：'+esc(window.Quiz?Quiz.answer(q):'')+'<br>')+esc(q.ex||'');ex.classList.remove('hidden');
  lamps();var nb=$('tNext');nb.textContent=TI+1>=TQ.length?'結果を見る':'つぎへ';nb.classList.remove('hidden');setTimeout(function(){nb.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'})},50)}
$('tNext').onclick=function(){if(scene!=='test'||TA.length<=TI)return;TI++;showQ()};
function totalStars(){var n=0;for(var k in SV.stars)n+=SV.stars[k].filter(Boolean).length;return n}
function finishTest(){var qs=TQ,answers=TA;var review=window.Quiz?Quiz.review(qs,answers):[],marks=review.map(function(r){return r.ok}),score=marks.filter(Boolean).length,name=getName();
  var fs=0,ns=0;for(var k in SV.best){fs+=SV.best[k].first||0;ns+=SV.best[k].n||0}
  var got=DEC.filter(function(r){return SV.spec[fmt(r)]!=null}).length;
  var records=TEST?[['モード','確認テストだけ']]:[['クリアタイム',SV.clearMs?fmtT(SV.clearMs/1000):'（10Fまだ）'],['一発で見ぬいた注文',fs+' / '+ns],['標本箱',got+' / '+DEC.length+' 種'],['閉店ラッシュ',SV.bossT?fmtT(SV.bossT):'―']];
  $('eName').textContent=(name?name+'　':'')+'確認テスト';$('eScore').innerHTML=score+'<small> / '+qs.length+' 点</small>';
  setScene('end');
  if(window.SubmitCard)CARD=SubmitCard.show({gameId:GID,grade:'chu2',koma:[KOMA],unit:'中2理科　電流とその利用　第10回',
    game:'抵抗キャッチャー ～電気抵抗～'+(TEST?'（確認テストのみ）':''),name:name,score:score,total:qs.length,marks:marks,records:records,review:review},function(){})}
$('eCard').onclick=function(){if(CARD&&window.SubmitCard)SubmitCard.reopen(CARD)};
$('eMap').onclick=function(){setScene(TEST?'title':'map')};

/* ---------------- ループ ---------------- */
var last=performance.now();
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  if(scene==='play'&&G&&!G.paused&&G.state!=='intro')update(dt);else if(scene==='play'&&G)for(var mi=0;mi<2;mi++)G.m[mi].ps.forEach(function(p){if(p.st==='drop'){p.vy+=2200*dt;p.dy=Math.min(0,p.dy+p.vy*dt);if(p.dy>=0){p.st='stand';p.sq=.25}}if(p.sq>0)p.sq=Math.max(0,p.sq-dt*1.6)});
  draw();requestAnimationFrame(frame)}

/* ---------------- はじまり ---------------- */
mkNoise();window.addEventListener('resize',resize);resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){paintBG()});
window.Zukan&&Zukan.setup&&Zukan.setup({game:GID,koma:[KOMA]});
if(window.PLAYER_NAME){$('nameIn').value=window.PLAYER_NAME;$('nmRow').classList.add('hidden')}else if(SV.name)$('nameIn').value=SV.name;
if(!(SV.unl>1||SV.stars[0]))$('bCont').classList.add('hidden');
if(TEST)startTest();else setScene('title');
requestAnimationFrame(frame);
/* 自動操作の確かめ用（遊びには影響しない） */
window.__TS={G:function(){return G},start:startFloor,grab:grab,SV:function(){return SV},scene:function(){return scene},MR:function(){return MR},
  aimTarget:function(){var o=curOrder();for(var mi=0;mi<2;mi++){var p=G.m[mi].ps.filter(function(p){return p.id===o.tid})[0];if(p)return{mi:mi,u:p.u}}return null},
  aimWrong:function(){var o=curOrder();for(var mi=0;mi<2;mi++){var p=G.m[mi].ps.filter(function(p){return p.id!==o.tid&&p.st==='stand'})[0];if(p)return{mi:mi,u:p.u}}return null},
  go:function(){hideOv('ovFloor');G.state='play'},gen:genOrder,FL:FL};
})();
</script>
