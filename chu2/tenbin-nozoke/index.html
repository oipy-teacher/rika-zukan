<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天秤の中をのぞけ ～質量が保存されるわけ～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1114;--panel:#0f1c1f;--line:#2c6e62;--ph:#6ff5c8;--ph2:#3fbf95;--amber:#ffc15a;--red:#ff6b57;--txt:#dff7ee;--dim:#8fb5aa;--ok:#5fe39a;--ng:#ff7a64;
 --f:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Meiryo',sans-serif;--d:'DotGothic16','Hiragino Sans','Meiryo',monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--f);overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;
 background-image:radial-gradient(ellipse at 50% -20%,rgba(111,245,200,.12),transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
.scr{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:10px 12px 30px}
.btn{min-height:50px;border:none;border-radius:10px;padding:10px 18px;font-size:18px;font-weight:800;background:linear-gradient(#7af7cf,#35b98f);color:#06231a;box-shadow:0 4px 0 #1b6b52,0 0 14px rgba(111,245,200,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b6b52}
.btn.ghost{background:rgba(111,245,200,.06);color:var(--txt);box-shadow:0 0 0 2px var(--line) inset}
.btn.amber{background:linear-gradient(#ffd27f,#e39a2c);color:#2a1800;box-shadow:0 4px 0 #8a5a12}
.btn.wide{width:100%}
.btn:disabled{opacity:.35}
.small{font-size:13px;color:var(--dim)}
.mono{font-family:var(--d)}
/* title */
#title .wrap{text-align:center;padding-top:22px}
.kicker{font-size:13px;font-weight:800;color:var(--amber);letter-spacing:.1em}
.logo{font-family:var(--d);font-size:clamp(34px,10.5vw,50px);line-height:1.15;margin:8px 0 2px;color:var(--ph);text-shadow:0 0 14px rgba(111,245,200,.55)}
.subt{font-size:16px;font-weight:800;color:#bfe9dc;margin-bottom:8px}
.panelbox{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;text-align:left;font-size:15px;line-height:1.7;box-shadow:inset 0 0 20px rgba(0,0,0,.4)}
.panelbox b{color:var(--amber)}
.namein{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#051012;color:var(--txt);margin-top:6px}
.tbtns{display:grid;gap:10px;margin-top:12px}
/* HUD */
.hud{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.icon{min-width:44px;min-height:44px;border-radius:10px;border:none;background:rgba(111,245,200,.07);box-shadow:0 0 0 2px var(--line) inset;font-size:19px;padding:0}
.hmid{flex:1;min-width:0;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.pill{background:#051012;border-radius:6px;padding:3px 9px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 0 0 1px var(--line) inset;font-family:var(--d)}
.pill b{color:var(--ph);font-size:15px}
.combo{color:var(--amber)}
.dots{display:flex;gap:4px;justify-content:center;margin:2px 0 6px}
.dots i{width:18px;height:6px;border-radius:2px;background:rgba(111,245,200,.14)}
.dots i.on{background:var(--ph2)}.dots i.now{background:var(--ph);box-shadow:0 0 8px var(--ph)}
.head{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.head .no{font-family:var(--d);font-size:13px;color:var(--amber)}
.head h2{margin:2px 0 0;font-size:20px;line-height:1.35}
.head .eq{font-family:var(--d);font-size:14px;color:var(--ph);margin-top:4px;line-height:1.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.tab{min-height:48px;border:none;border-radius:10px 10px 0 0;background:#08171a;color:var(--dim);font-weight:800;font-size:15px;box-shadow:0 0 0 2px var(--line) inset}
.tab.on{background:#123238;color:var(--ph);box-shadow:0 0 0 2px var(--ph2) inset,0 0 12px rgba(111,245,200,.25)}
.tab.locked{opacity:.6}
.mon{position:relative;background:#041012;border:2px solid var(--ph2);border-radius:0 0 12px 12px;overflow:hidden;box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.mon::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(111,245,200,.05) 0 1px,transparent 1px 3px)}
.mon svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mon.wipe{animation:wipe .45s}
@keyframes wipe{0%{filter:brightness(2.2) contrast(.6)}100%{filter:none}}
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;background:var(--panel);border-radius:10px;overflow:hidden}
.tbl th{background:#123238;color:var(--ph);padding:5px 4px;font-weight:700;font-size:12px}
.tbl td{border-bottom:1px solid #1b3a3a;padding:4px;text-align:center;font-family:var(--d);font-size:15px}
.tbl td.el{text-align:left;font-family:var(--f);font-weight:800}
.tbl .dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.memo{color:var(--amber)}
#ctrl{margin-top:10px}
.qline{font-weight:800;font-size:16px;margin:4px 2px 8px;line-height:1.5}
.numshow{font-size:30px;font-weight:800;text-align:center;background:#051012;color:var(--ph);border:2px solid var(--line);border-radius:10px;padding:6px;margin:6px 0;font-family:var(--d)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:50px;font-size:22px;font-weight:800;border-radius:10px;border:none;background:#123238;color:var(--txt);box-shadow:0 3px 0 #0a2226,0 0 0 1px var(--line) inset;font-family:var(--d)}
.card{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;line-height:1.6;background:var(--panel);border:2px solid var(--line)}
.card .hd{font-family:var(--d);font-size:22px}
.card.ok{border-color:var(--ok)}.card.ok .hd{color:var(--ok)}
.card.ng{border-color:var(--ng)}.card.ng .hd{color:var(--ng)}
.card b{color:var(--amber)}
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:50px;border:none;border-radius:10px;padding:10px 12px;background:#123238;color:var(--txt);font-size:15px;font-weight:800;line-height:1.45;box-shadow:0 0 0 2px var(--line) inset}
.opt.ok{box-shadow:0 0 0 3px var(--ok) inset}.opt.ng{box-shadow:0 0 0 3px var(--ng) inset;opacity:.7}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.chip{min-height:46px;min-width:74px;border:none;border-radius:999px;padding:6px 14px;background:#123238;color:var(--txt);font-weight:800;font-size:16px;box-shadow:0 0 0 2px var(--line) inset}
.chip.used{opacity:.3}
.sent{font-size:17px;line-height:2.1;font-weight:800}
.slot{display:inline-block;min-width:92px;min-height:36px;border-radius:8px;border:2px dashed var(--amber);color:var(--amber);text-align:center;padding:0 6px;vertical-align:middle;line-height:32px}
.slot.cur{background:rgba(255,193,90,.15)}
.slot.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
.sum{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border-radius:10px;overflow:hidden}
.sum th{background:#123238;color:var(--ph);padding:5px 3px;font-weight:700}
.sum td{border-bottom:1px solid #1b3a3a;padding:5px 3px;text-align:center}
.sum td.l{text-align:left}
.tacard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px}
.tacard svg{display:block;width:100%;height:auto}
.tbar{height:10px;border-radius:5px;background:#123238;overflow:hidden;margin:6px 0}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ph),var(--amber))}
/* 演出 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.fly{position:fixed;z-index:61;font-weight:800;font-size:22px;color:var(--ph);text-shadow:0 0 8px rgba(111,245,200,.8);pointer-events:none;animation:fly 1s ease-out forwards;font-family:var(--d)}
@keyframes fly{to{transform:translateY(-54px);opacity:0}}
.banner{width:max-content;position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:62;background:#061417;color:var(--ph);font-family:var(--d);font-size:26px;padding:14px 22px;border-radius:12px;border:2px solid var(--ph);box-shadow:0 0 30px rgba(111,245,200,.4);text-align:center;animation:bn 1.8s forwards;pointer-events:none;max-width:92vw}
.banner small{display:block;font-family:var(--f);font-weight:800;font-size:14px;color:var(--txt);margin-top:4px}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}12%{transform:translate(-50%,-50%) scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;z-index:59;pointer-events:none;background:radial-gradient(circle,rgba(111,245,200,.35),transparent 70%);animation:fl .45s forwards}
@keyframes fl{to{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ov{position:fixed;inset:0;background:rgba(0,6,8,.78);display:flex;align-items:center;justify-content:center;padding:12px;z-index:40}
.ovc{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--panel);border:2px solid var(--ph2);border-radius:14px;padding:16px;text-align:center}
.ovc h2{font-family:var(--d);margin:4px 0 8px;font-size:22px;color:var(--ph)}
/* test */
.tq{font-size:18px;font-weight:800;line-height:1.6;margin:8px 0 10px}
.tfig{background:#f4fbf8;border-radius:10px;padding:6px;margin:6px 0;text-align:center}.tfig svg{max-width:100%;height:auto}
.choice{display:block;width:100%;min-height:52px;margin:8px 0;padding:10px 14px;text-align:left;font-size:17px;font-weight:700;border-radius:10px;border:none;background:#123238;color:var(--txt);box-shadow:0 0 0 2px var(--line) inset}
.prog{display:flex;gap:4px;margin:6px 0}.prog i{flex:1;height:6px;border-radius:3px;background:#123238}.prog i.on{background:var(--ph)}
.ordsel{min-height:52px;border:2px dashed var(--line);border-radius:10px;padding:6px;margin:6px 0}
.ordsel div{background:#123238;border-radius:8px;padding:8px 10px;margin:4px 0;font-weight:700;font-size:15px}
.bigscore{font-family:var(--d);font-size:58px;color:var(--ph)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="atomDefs"></defs></svg>
<canvas id="fx"></canvas>

<div id="title" class="scr"><div class="wrap">
 <div class="kicker">中2理科　化学変化と原子・分子</div>
 <div class="logo">🖥️ 天秤の中を<br>のぞけ</div>
 <div class="subt">～質量が保存されるわけ～</div>
 <div id="tMon" class="mon" style="border-radius:12px;max-width:340px;margin:0 auto"></div>
 <div class="panelbox"><b>艦内モニターの使い方</b><br>🔬<b>原子画面</b>：容器の中の原子を数える（分子をタップ）。<br>⚖️<b>天秤画面</b>：予言を入れると、ロックが外れて値が見える。<br>原子の数と「重さの札」から、天秤の値を<b>予言</b>しよう。</div>
 <div id="nameBox" class="panelbox" style="padding:10px 12px"><label style="font-weight:800;font-size:14px">なまえ（番号でもOK・空でも遊べる）</label><input id="nameIn" class="namein" maxlength="20" autocomplete="off"></div>
 <div class="tbtns">
  <button class="btn wide" id="bStart">▶ はじめる</button>
  <button class="btn ghost wide hidden" id="bCont">つづきから</button>
  <button class="btn ghost wide zk hidden" id="bBook1">📖 図鑑</button>
  <button class="btn ghost wide" id="bMute1">🔊 音：オン</button>
 </div>
</div></div>

<div id="game" class="scr hidden"><div class="wrap">
 <div class="hud">
  <button class="icon" id="bHome" aria-label="タイトルへ">🏠</button>
  <div class="hmid"><span class="pill">SCORE <b id="hScore">0</b></span><span class="pill combo" id="hCombo">×0</span><span class="pill" id="hTime">0:00</span></div>
  <button class="icon" id="bMute" aria-label="音">🔊</button>
 </div>
 <div class="dots" id="dots"></div>
 <div id="stageBox"></div>
</div></div>

<div id="clear" class="scr hidden"><div class="wrap" id="clearBox"></div></div>
<div id="test" class="scr hidden"><div class="wrap" id="testBox"></div></div>
<div id="ov" class="ov hidden"><div class="ovc" id="ovc"></div></div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:.8vmin;margin-top:.6vmin}',
    '#sc-card .sc-cell{border:2px solid #c9cfdd;border-radius:8px;text-align:center;padding:.4vmin 0 .6vmin;background:#fff}',
    '#sc-card .sc-cell small{display:block;font-size:clamp(10px,1.5vmin,13px);color:#6b7390;font-weight:700}',
    '#sc-card .sc-cell b{display:block;font-size:clamp(18px,3.2vmin,28px);line-height:1.1;font-weight:900}',
    '#sc-card .sc-cell.o b{color:#e8384f}',
    '#sc-card .sc-cell.x{background:#f1f3f8}',
    '#sc-card .sc-cell.x b{color:#2a55c9}',
    '#sc-card .sc-rec{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.8vmin 1.4vmin;font-size:clamp(13px,2vmin,17px);margin-top:.4vmin}',
    '#sc-card .sc-rec div{background:#eef1f8;border-radius:8px;padding:.6vmin 1.4vmin}',
    '#sc-card .sc-rec b{margin-left:.4em}',
    '#sc-card .sc-foot{font-size:clamp(11px,1.6vmin,13px);color:#6b7390;text-align:center;padding:0 2vmin 1.4vmin}',
    '#sc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.6vmin}',
    '#sc-btns button{font:inherit;font-weight:700;font-size:16px;padding:10px 20px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}',
    '#sc-rev{width:min(96vw,760px);max-height:86vh;overflow:auto;background:#fffdf8;color:#1d2433;border-radius:18px;padding:20px 24px;font-size:16px;line-height:1.6}',
    '#sc-rev h3{margin:0 0 10px;font-size:20px}',
    '#sc-rev li{margin-bottom:10px}',
    '#sc-rev .o{color:#e8384f;font-weight:900}#sc-rev .x{color:#2a55c9;font-weight:900}',
    '#sc-wrap{display:flex;flex-direction:column;align-items:center}',
    '#sc-card .sc-score em{font-style:normal;font-weight:900;font-size:clamp(12px,1.9vmin,15px);background:#e8384f;color:#fff;border-radius:999px;padding:1px 10px;margin-top:3px;letter-spacing:.1em}',
    '#sc-card .sc-voice{grid-column:1/-1;font-size:clamp(12px,1.8vmin,15px);color:#3a4460;background:#fff4d6;border-radius:8px;padding:.5vmin 1.4vmin;overflow-wrap:anywhere}'
  ].join('\n');

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){

      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

eight='700'>Na\u003c/text>\u003ccircle cx='48' cy='70' r='8' fill='#3a3d46' stroke='#555' stroke-width='1'/>\u003ctext x='48' y='73' font-size='8' text-anchor='middle' fill='#fff' font-weight='700'>C\u003c/text>\u003ccircle cx='48' cy='54' r='8' fill='#E4572E' stroke='#555' stroke-width='1'/>\u003ctext x='48' y='57' font-size='8' text-anchor='middle' fill='#fff' font-weight='700'>O\u003c/text>\u003ccircle cx='36' cy='82' r='8' fill='#E4572E' stroke='#555' stroke-width='1'/>\u003ctext x='36' y='85' font-size='8' text-anchor='middle' fill='#fff' font-weight='700'>O\u003c/text>\u003ccircle cx='62' cy='82' r='8' fill='#E4572E' stroke='#555' stroke-width='1'/>\u003ctext x='62' y='85' font-size='8' text-anchor='middle' fill='#fff' font-weight='700'>O\u003c/text>\u003ccircle cx='74' cy='90' r='6' fill='#EAF6FF' stroke='#555' stroke-width='1'/>\u003ctext x='74' y='92' font-size='6' text-anchor='middle' fill='#1c4f86' font-weight='700'>H\u003c/text>\u003ccircle cx='92' cy='60' r='6' fill='#EAF6FF' stroke='#555' stroke-width='1'/>\u003ctext x='92' y='62' font-size='6' text-anchor='middle' fill='#1c4f86' font-weight='700'>H\u003c/text>\u003ccircle cx='108' cy='60' r='9' fill='#2FA36B' stroke='#555' stroke-width='1'/>\u003ctext x='108' y='63' font-size='9' text-anchor='middle' fill='#fff' font-weight='700'>Cl\u003c/text>\u003ccircle cx='190' cy='90' r='9' fill='#E9B949' stroke='#555' stroke-width='1'/>\u003ctext x='190' y='93' font-size='9' text-anchor='middle' fill='#3d2a00' font-weight='700'>Na\u003c/text>\u003ccircle cx='208' cy='90' r='9' fill='#2FA36B' stroke='#555' stroke-width='1'/>\u003ctext x='208' y='93' font-size='9' text-anchor='middle' fill='#fff' font-weight='700'>Cl\u003c/text>\u003ccircle cx='250' cy='86' r='8' fill='#E4572E' stroke='#555' stroke-width='1'/>\u003ctext x='250' y='89' font-size='8' text-anchor='middle' fill='#fff' font-weight='700'>O\u003c/text>\u003ccircle cx='240' cy='98' r='6' fill='#EAF6FF' stroke='#555' stroke-width='1'/>\u003ctext x='240' y='100' font-size='6' text-anchor='middle' fill='#1c4f86' font-weight='700'>H\u003c/text>\u003ccircle cx='262' cy='98' r='6' fill='#EAF6FF' stroke='#555' stroke-width='1'/>\u003ctext x='262' y='100' font-size='6' text-anchor='middle' fill='#1c4f86' font-weight='700'>H\u003c/text>\u003ccircle cx='212' cy='16' r='8' fill='#E4572E' stroke='#555' stroke-width='1'/>\u003ctext x='212' y='19' font-size='8' text-anchor='middle' fill='#fff' font-weight='700'>O\u003c/text>\u003ccircle cx='228' cy='16' r='8' fill='#3a3d46' stroke='#555' stroke-width='1'/>\u003ctext x='228' y='19' font-size='8' text-anchor='middle' fill='#fff' font-weight='700'>C\u003c/text>\u003ccircle cx='244' cy='16' r='8' fill='#E4572E' stroke='#555' stroke-width='1'/>\u003ctext x='244' y='19' font-size='8' text-anchor='middle' fill='#fff' font-weight='700'>O\u003c/text>\u003cpath d='M228,34 V28' stroke='#c0442e' stroke-width='2'/>\u003cpath d='M224,31 L228,26 L232,31' fill='none' stroke='#c0442e' stroke-width='2'/>\u003ctext x='70' y='22' font-size='10' text-anchor='middle' fill='#333'>反応前（ふたなし）\u003c/text>\u003ctext x='268' y='22' font-size='9' fill='#c0442e' text-anchor='end'>外へ\u003c/text>\u003ctext x='230' y='118' font-size='10' text-anchor='middle' fill='#333'>反応後\u003c/text>\u003c/svg>"}, {"id": "chu2-tenbin-nozoke-q010", "koma": "chu2-kagaku-28", "t": "num", "q": "マグネシウムと酸素は、質量の比 3：2 で結び付き、酸化マグネシウム（MgO）ができる。マグネシウム原子1個の質量は、酸素原子1個の質量の何倍？", "ans": 1.5, "unit": "倍", "tol": 0, "ex": "MgO はマグネシウム原子1個と酸素原子1個が結び付いたもの。質量の比 3：2 がそのまま原子1個どうしの比になるので 3÷2＝1.5 倍。", "kind": "calc", "level": 3, "fig": null}, {"id": "chu2-tenbin-nozoke-q011", "koma": "chu2-kagaku-28", "t": "choice", "q": "うすい硫酸とうすい塩化バリウム水溶液を混ぜると、硫酸バリウムの白い沈殿ができた。混ぜる前と後で、全体の質量が変わらない理由は？", "choices": ["原子の組み合わせが変わっただけで、原子は出入りしていないから", "沈殿の重さと熱の重さがつり合うから", "沈殿ができると原子が増え、水が減るから", "ビーカーの中で原子が消えないように、ふたをしたから"], "ex": "気体が出ない反応なので原子は出入りしない。組み合わせが変わるだけなので質量は変わらない。", "kind": "judge", "level": 1, "fig": null}, {"id": "chu2-tenbin-nozoke-q012", "koma": "chu2-kagaku-28", "t": "num", "q": "重さの札を 銅64・酸素16・炭素12 とする。試験管で 2CuO＋C→2Cu＋CO₂ の反応を起こすと、二酸化炭素はガラス管から外へ出ていく。反応後に試験管に残る物質の札の合計はいくつ？（反応前は酸化銅2個と炭素1個）", "ans": 128, "unit": "", "tol": 0, "ex": "反応前：(64＋16)×2＋12＝172。二酸化炭素（12＋32＝44）が出ていくので、試験管に残るのは銅2個＝128。", "kind": "calc", "level": 3, "fig": null}, {"id": "chu2-tenbin-nozoke-q013", "koma": "chu2-kagaku-28", "t": "order", "q": "原子のモデルを使って「質量が保存される」ことを確かめる手順を正しい順に並べよう。", "items": ["反応前の原子の種類と数を数える", "反応後の原子の種類と数を数える", "前と後で、原子の種類と数を比べる", "原子1個1個に質量があるので、質量の総和も等しいと結論する"], "ex": "原子の種類と数が同じ → 原子1個ずつの質量の合計（総和）も同じ、という順で考える。", "kind": "method", "level": 2, "fig": null}, {"id": "chu2-tenbin-nozoke-q014", "koma": "chu2-kagaku-28", "t": "choice", "q": "化学反応式 2Cu＋O₂→2CuO について、正しいものはどれ？", "choices": ["左辺も右辺も、銅原子2個・酸素原子2個", "左辺は銅原子2個・酸素原子2個、右辺は銅原子2個・酸素原子1個", "左辺は銅原子2個・酸素原子1個、右辺は銅原子2個・酸素原子2個", "右辺のほうが原子の数が多い"], "ex": "左辺：Cu2・O2（O₂分子1個）、右辺：CuO が2個で Cu2・O2。化学反応式の左右で原子の種類と数は同じ。", "kind": "judge", "level": 2, "fig": null}, {"id": "chu2-tenbin-nozoke-q015", "koma": "chu2-kagaku-28", "t": "choice", "q": "鉄粉と硫黄の粉末を混ぜて試験管に入れ、口を脱脂綿でゆるくふさいで加熱すると、硫化鉄ができた。気体が出入りしないとき、加熱の前後で試験管の中の質量はどうなる？", "choices": ["変わらない（鉄原子と硫黄原子が結び付いただけだから）", "増える（硫化鉄は鉄より重いから）", "減る（黒い物質になったから）", "増える（熱をもらったから）"], "ex": "Fe＋S→FeS。原子の組み合わせが変わっただけで、種類と数は同じ。気体の出入りがなければ質量は変わらない。", "kind": "judge", "level": 2, "fig": null}]};

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

  $('chips').innerHTML=CHIPS.map(c=>`<button class="chip ${fill.includes(c)?'used':''}" data-c="${c}">${c}</button>`).join('');
  document.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(fill.includes(c))return;const i=fill.indexOf(null);if(i<0)return;sfx.tap();fill[i]=c;draw();if(!fill.includes(null))check()})};
 const check=()=>{const ok=ans[0].includes(fill[0])&&ans[3].includes(fill[3])&&fill[1]!==fill[2]&&ans[1].includes(fill[1])&&ans[2].includes(fill[2]);
  if(ok){document.querySelectorAll('.slot').forEach(s=>s.classList.add('ok'));sfx.fanfare();confetti(110);S.sentence=`化学変化では、原子の組み合わせは変わるが、原子の${fill[1]}と${fill[2]}は変わらない。原子1個1個に質量があるので、質量の総和は変わらない。`;
   if(!S.ruleDone){S.ruleDone=true;earn(30,'rule',$('sent'));S.score+=1000}save();hud();banner('質量が保存されるわけ','原子の種類と数が変わらないから');
   $('ctrl').innerHTML=`<div class="card ok"><div class="hd">記録完了</div>${esc(S.sentence)}<br><span class="small">ふたが開いていると質量が変わって見えるのは、原子が<b>出ていったり入ってきたり</b>するから。</span></div><button class="btn wide act" id="bN">最後の任務：タイムアタック ▶</button>`;$('bN').onclick=()=>{sfx.tap();startStage(S.stage+1)}}
  else{sfx.miss();$('sent').classList.add('shake');setTimeout(()=>{$('sent').classList.remove('shake');fill=[null,null,null,null];draw()},700)}};
 $('bClr').onclick=()=>{sfx.tap();fill=[null,null,null,null];draw()};draw()}

/* ================= タイムアタック ================= */
const TAQ=[
 {rx:{id:'t1',where:'ふたを閉めた容器',react:[['Mg',4],['O2',2]],prod:[['MgO',4]],lid:'closed'},a:'same',t:'マグネシウムの燃焼（閉じた容器）'},
 {rx:{id:'t2',where:'ふたの開いた容器',react:[['NaHCO3',3],['HCl',3]],prod:[['NaCl',3],['H2O',3],['CO2',3]],out:'CO2',lid:'open'},a:'down',t:'炭酸水素ナトリウム＋塩酸（開いた容器）'},
 {rx:{id:'t3',where:'試験管（綿でふさいだ口）',react:[['Fe',3],['S',3]],prod:[['FeS',3]],lid:'closed'},a:'same',t:'鉄と硫黄'},
 {rx:{id:'t4',where:'空気中のステンレス皿',react:[['Cu',4]],air:[['O2',2]],prod:[['CuO',4]],lid:'open'},a:'up',t:'銅を空気中で加熱'},
 {rx:{id:'t5',where:'ビーカーの中',react:PPT[SEALPAIR].react,prod:PPT[SEALPAIR].prod,lid:'none'},a:'same',t:'沈殿ができる反応'},
 {rx:{id:'t6',where:'試験管（気体は外へ）',react:[['CuO',4],['C',2]],prod:[['Cu',4],['CO2',2]],out:'CO2',lid:'open'},a:'down',t:'酸化銅の還元'},
 {rx:{id:'t7',where:'口を閉じた袋',react:[['H2',4],['O2',2]],prod:[['H2O',4]],lid:'closed'},a:'same',t:'水素の燃焼（袋の中）'},
 {rx:{id:'t8',where:'空気中',react:[['C',3]],air:[['O2',3]],prod:[['CO2',3]],out:'CO2',lid:'open'},a:'down',t:'炭（炭素）を空気中で燃やす'}
];
let TA=null;
function taStage(){
 $('stageBox').innerHTML=`<div class="head"><div class="no">最終任務</div><h2>タイムアタック：原子を見くらべろ</h2><div class="eq">120秒。反応の前と後の原子画面を見て、容器の中の質量が<br>「同じ」「増える」「減る」のどれかをすばやく判定せよ。</div></div><div id="taBox" class="act"></div>`;
 $('taBox').innerHTML=`<div class="card">最高記録：${S.taBest}問<br><span class="small">原子が<b>出ていく</b>か、<b>入ってくる</b>か、それだけを見る。</span></div><button class="btn wide act" id="bTA">▶ スタート</button>`;
 $('bTA').onclick=()=>{ac();sfx.tap();runTA()}}
function miniSVG(rx,phase){const b=buildRx(rx);const atoms=b.atoms;let s=`<svg viewBox="0 -26 360 262">${frameSVG(rx)}`;
 let outside=false;atoms.forEach(a=>{let x=phase===0?a.x0:a.x1,y=phase===0?a.y0:a.y1;const o=(phase===0&&a.air)||(phase===1&&a.in1===false);if(o){y=-10;outside=true;s+=`<g opacity=".55">${at(a.el,x,y,BR*RAD[a.el]*.9)}</g>`}else s+=at(a.el,x,y,BR*RAD[a.el])});
 if(outside)s+=`<text x="8" y="-18" font-size="12" fill="${phase===0?'#ffc15a':'#ff6b57'}" font-family="sans-serif" font-weight="800">${phase===0?'空気中':'外へ出た'}</text>`;return s+'</svg>'}
function runTA(){TA={deck:shuffle(TAQ),i:0,ok:0,combo:0,t:120,lock:false};nextTA();
 TA.iv=setInterval(()=>{if(document.visibilityState!=='visible')return;TA.t--;const b=$('taT');if(b)b.style.width=(TA.t/120*100)+'%';if(TA.t<=0){clearInterval(TA.iv);if($('taBox'))endTA()}},1000)}
function nextTA(){if(TA.i>=TA.deck.length)TA.deck=TA.deck.concat(shuffle(TAQ));const c=TA.deck[TA.i];
 $('taBox').innerHTML=`<div class="tbar"><i id="taT" style="width:${TA.t/120*100}%"></i></div><div style="display:flex;justify-content:space-between;font-weight:800" class="mono"><span>正解 ${TA.ok}</span><span class="combo">×${TA.combo}</span></div>
 <div class="tacard"><div style="font-weight:800;margin-bottom:4px">${c.t}</div><div class="row2"><div><div class="small">反応前</div>${miniSVG(c.rx,0)}</div><div><div class="small">反応後</div>${miniSVG(c.rx,1)}</div></div><div id="taWhy" class="small" style="min-height:20px;margin-top:4px"></div></div>
 <div class="row2 act" style="grid-template-columns:1fr 1fr 1fr"><button class="btn ghost" data-a="down">減る</button><button class="btn ghost" data-a="same">同じ</button><button class="btn ghost" data-a="up">増える</button></div>`;
 document.querySelectorAll('#taBox [data-a]').forEach(b=>b.onclick=()=>{if(TA.lock)return;TA.lock=true;const ok=b.dataset.a===c.a;
  if(ok){TA.ok++;TA.combo++;S.score+=50*Math.min(TA.combo,10);sfx.hit(TA.combo);const[x,y]=ctr(b);burst(x,y,['#6ff5c8','#fff'],12,4);
   if(TA.combo===4||TA.combo===8){const k='c'+TA.combo;if(!S.taEarn[k]){S.taEarn[k]=true;earn(10,'first-try',b)}banner(TA.combo+'連続！')}}
  else{TA.combo=0;sfx.miss()}
  $('taWhy').innerHTML=(ok?'○ ':'× ')+(c.a==='same'?'出入りなし → 同じ':c.a==='down'?'原子が外へ出ていく → 減る':'空気中の酸素原子が入る → 増える');hud();
  setTimeout(()=>{TA.lock=false;TA.i++;if(TA.t>0&&$('taBox'))nextTA()},ok?700:1500)})}
function endTA(){const best=TA.ok>S.taBest;if(best)S.taBest=TA.ok;save();sfx.fanfare();
 $('taBox').innerHTML=`<div class="card ok"><div class="hd">任務完了</div>正解 ${TA.ok} 問${best?'（最高記録 更新！）':''}</div><button class="btn ghost wide act" id="bTA2">もう一度</button><button class="btn wide act" id="bF">本編クリアへ ▶</button>`;
 $('bTA2').onclick=()=>{sfx.tap();runTA()};$('bF').onclick=()=>{sfx.tap();finishMain()}}

/* ================= クリア ================= */
function finishMain(){if(TA&&TA.iv)clearInterval(TA.iv);S.cleared=true;save();sfx.fanfare();confetti(140);
 const go=()=>{renderClear();show('clear')};
 if(window.Zukan&&Zukan.mainClear&&!S.mainDone){S.mainDone=true;save();setTimeout(()=>{try{Zukan.mainClear({onClose:go})}catch(e){go()}},600)}else go()}
function renderClear(){const rows=RX.filter(r=>S.log[r.id]);
 $('clearBox').innerHTML=`<div style="text-align:center;margin-top:16px"><div class="kicker">本編クリア</div><div class="logo" style="font-size:32px">原子モニター<br>観測士</div></div>
 <div class="panelbox">クリアタイム：${fmtT(S.elapsed)}<br>予言が一致：${S.hits} / ${S.tries}<br>最大コンボ：${S.maxCombo}　タイムアタック：${S.taBest}問<br>SCORE：${S.score.toLocaleString()}</div>
 <div class="card"><table class="sum"><tr><th>反応</th><th>原子の数</th><th>目盛り</th></tr>${rows.map(r=>{const L=S.log[r.id];return `<tr><td class="l">${r.name}</td><td>${L.n0}→${L.n1}</td><td>${fw(L.m0)}→${fw(L.m1)}</td></tr>`}).join('')}</table></div>
 ${S.sentence?`<div class="card ok"><div class="hd" style="font-size:18px">見つけたわけ</div>${esc(S.sentence)}</div>`:''}
 <div class="tbtns"><button class="btn wide" id="cT">📝 確認テストへ</button><button class="btn ghost wide zk hidden" id="cB">📖 図鑑</button><button class="btn ghost wide" id="cS">反応をえらんで遊ぶ</button><button class="btn ghost wide" id="cH">🏠 タイトルへ</button></div>`;
 zkBtns();$('cT').onclick=()=>{sfx.tap();startTest()};$('cB').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();$('cS').onclick=()=>{sfx.tap();stageMenu()};$('cH').onclick=()=>{sfx.tap();initTitle()}}
function stageMenu(){overlay(`<h2>どの反応から？</h2><div class="tbtns">${STAGES.map((s,i)=>`<button class="btn ghost wide" style="font-size:15px" data-i="${i}">${i+1}. ${s.name}</button>`).join('')}<button class="btn wide" id="oT">📝 確認テスト</button><button class="btn ghost wide" id="oX">とじる</button></div>`);
 document.querySelectorAll('#ovc [data-i]').forEach(b=>b.onclick=()=>{closeOv();startClock();startStage(+b.dataset.i)});$('oT').onclick=()=>{closeOv();startTest()};$('oX').onclick=closeOv}

/* ================= 確認テスト ================= */
let T=null;
function startTest(){if(!window.Quiz){overlay('<h2>問題データが読み込まれていません</h2>');return}T={qs:Quiz.test(),i:0,ans:[],cur:null};show('test');renderTest()}
function renderTest(){const q=T.qs[T.i];T.cur=q.t==='order'?[]:'';
 let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="pill">📝 確認テスト</span><b>第 ${T.i+1} 問 / ${T.qs.length}</b></div>
  <div class="prog">${T.qs.map((_,i)=>`<i class="${i<T.i?'on':''}"></i>`).join('')}</div><div class="tq">${q.q}</div>${q.fig?`<div class="tfig">${q.fig}</div>`:''}`;
 if(q.t==='choice')h+=q.shown.map((c,k)=>`<button class="choice" data-k="${k}">${c}</button>`).join('');
 else if(q.t==='num')h+=`<div class="numshow"><span id="numv">　</span> <small>${esc(q.unit||'')}</small></div><div class="keys">${['7','8','9','4','5','6','1','2','3','0','.','⌫'].map(k=>`<button data-n="${k}">${k}</button>`).join('')}</div><button class="btn wide" style="margin-top:10px" id="tOk">決定</button>`;
 else h+=`<p class="small">上から順になるように、タップして並べよう（もう一度タップで外す）</p><div class="ordsel" id="ordSel"></div>${q.shown.map((c,k)=>`<button class="choice" data-o="${k}">${c}</button>`).join('')}<button class="btn wide" style="margin-top:8px" id="tOk" disabled>決定</button>`;
 $('testBox').innerHTML=h;
 const next=a=>{T.ans.push(a);sfx.tap();setTimeout(()=>{T.i++;if(T.i<T.qs.length)renderTest();else finishTest()},180)};
 if(q.t==='choice')document.querySelectorAll('#testBox .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#testBox .choice').forEach(x=>x.disabled=true);b.style.boxShadow='0 0 0 3px #6ff5c8 inset';next(q.shown[+b.dataset.k])});
 else if(q.t==='num'){document.querySelectorAll('#testBox [data-n]').forEach(b=>b.onclick=()=>{sfx.key();const k=b.dataset.n;if(k==='⌫')T.cur=T.cur.slice(0,-1);else if(T.cur.length<8)T.cur+=k;$('numv').textContent=T.cur||'　'});$('tOk').onclick=()=>{if(!T.cur)return;next(T.cur)}}
 else{const upd=()=>{$('ordSel').innerHTML=T.cur.map((k,n)=>`<div data-r="${n}">${n+1}. ${q.shown[k]}</div>`).join('');
   document.querySelectorAll('#testBox [data-o]').forEach(b=>b.style.display=T.cur.includes(+b.dataset.o)?'none':'block');
   document.querySelectorAll('#testBox [data-r]').forEach(d=>d.onclick=()=>{T.cur.splice(+d.dataset.r);sfx.tap();upd()});$('tOk').disabled=T.cur.length!==q.shown.length};
  document.querySelectorAll('#testBox [data-o]').forEach(b=>b.onclick=()=>{sfx.tap();T.cur.push(+b.dataset.o);upd()});$('tOk').onclick=()=>{if(T.cur.length!==q.shown.length)return;next(T.cur.map(k=>q.shown[k]))};upd()}
}
function finishTest(){const qs=T.qs,answers=T.ans;
 const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const name=S.name||window.PLAYER_NAME||'';
 const records=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(S.elapsed)],['予言の一致',S.hits+' / '+S.tries],['タイムアタック',S.taBest+'問'],['見つけたわけ',S.sentence?S.sentence.slice(0,48):'（未記入）']];
 sfx.fanfare();
 const rec=SubmitCard.show({gameId:GAME_ID,grade:'chu2',koma:[KOMA],unit:'中2理科　化学変化と原子・分子　第28回',
  game:'天秤の中をのぞけ ～質量が保存されるわけ～'+(TEST_ONLY?'（確認テストのみ）':''),name,score,total:qs.length,marks,records,review},()=>renderResult(score,qs.length));
 T.rec=rec;renderResult(score,qs.length)}
function renderResult(score,total){show('test');
 $('testBox').innerHTML=`<div class="panelbox" style="text-align:center;margin-top:16px"><b>確認テスト</b>
  <div class="bigscore">${score}<span style="font-size:22px"> / ${total}</span></div>
  <p style="font-weight:800">${score===total?'満点！ 原子の目で質量が見えている。':score>=Math.ceil(total*.7)?'合格ライン突破！':'解説を読んで、もう一度ためそう。'}</p></div>
  <div class="tbtns"><button class="btn wide" id="rCard">📝 提出カードを表示</button><button class="btn ghost wide" id="rRetry">もう一度テストを解く</button>
  ${TEST_ONLY?'':'<button class="btn ghost wide zk hidden" id="rBook">📖 図鑑</button><button class="btn ghost wide" id="rTitle">🏠 タイトルへ</button>'}</div>`;
 zkBtns();$('rCard').onclick=()=>{if(T&&T.rec&&SubmitCard.reopen)SubmitCard.reopen(T.rec)};$('rRetry').onclick=()=>startTest();
 if(!TEST_ONLY){$('rBook').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();$('rTitle').onclick=()=>initTitle()}}

/* ================= タイトル ================= */
function initTitle(){show('title');zkBtns();
 const b=buildRx(RX[1]);let s=`<svg viewBox="0 0 360 250">${frameSVG(RX[1])}`;b.atoms.forEach(a=>{s+=at(a.el,a.x0,a.y0,BR*RAD[a.el])});$('tMon').innerHTML=s+`<text x="180" y="244" font-size="11" fill="#6ff5c8" text-anchor="middle" font-family="sans-serif">H×4　O×2　→　目盛り ？</text></svg>`;
 $('nameIn').value=S.name||window.PLAYER_NAME||'';if(window.PLAYER_NAME)$('nameBox').classList.add('hidden');
 $('bCont').classList.toggle('hidden',!S.started);
 $('bCont').textContent=S.cleared?'つづきから（確認テスト・反応えらび）':`つづきから（${(STAGES[Math.min(S.stage,STAGES.length-1)]||{}).name}）`}
function takeName(){const v=$('nameIn').value.trim();S.name=v||window.PLAYER_NAME||S.name||'';save()}
$('bStart').onclick=()=>{ac();sfx.tap();takeName();
 if(S.started&&S.stage>0){overlay(`<h2>はじめから遊ぶ？</h2><p>記録はそのまま残る。</p><div class="tbtns"><button class="btn wide" id="oY">はじめから</button><button class="btn ghost wide" id="oN">やめる</button></div>`);$('oY').onclick=()=>{closeOv();go0()};$('oN').onclick=closeOv}else go0()};
function go0(){COMBO=0;startClock();banner('原子を数えて 質量を読め','分子をタップ → 予言 → 天秤画面');startStage(0)}
$('bCont').onclick=()=>{ac();sfx.tap();takeName();startClock();
 if(S.cleared){overlay(`<h2>どこから遊ぶ？</h2><div class="tbtns"><button class="btn wide" id="oT">📝 確認テスト</button><button class="btn ghost wide" id="oC">クリア画面</button><button class="btn ghost wide" id="oS">反応をえらぶ</button><button class="btn ghost wide" id="oX">とじる</button></div>`);
  $('oT').onclick=()=>{closeOv();startTest()};$('oC').onclick=()=>{closeOv();renderClear();show('clear')};$('oS').onclick=()=>{closeOv();stageMenu()};$('oX').onclick=closeOv}
 else startStage(Math.min(S.stage,STAGES.length-1))};
$('bBook1').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();
$('bHome').onclick=()=>{sfx.tap();if(TA&&TA.iv)clearInterval(TA.iv);save();initTitle()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
setMute();
if(window.PLAYER_NAME&&!S.name)S.name=window.PLAYER_NAME;
if(TEST_ONLY){S.name=window.PLAYER_NAME||S.name||'';startTest()}else initTitle();
window.__TN={S:()=>S,G:()=>G,start:startStage,test:startTest,finish:finishMain,TA:()=>TA};
})();
</script>
</body>
