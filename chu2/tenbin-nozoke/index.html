<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2E4057">
<title>天秤の中をのぞけ ～質量が保存されるわけ～</title>
<!--
  ゲームID: tenbin-nozoke ／ コマID: chu2-kagaku-28（化学変化と原子・分子 第28回・確認用）
  ねらい: 反応の前後で原子の種類と数が変わらないから、質量の総和も変わらない

  【6. 別の世界】画風＝クロスステッチ刺繍（アイーダ布の目に×の糸で縫う。原子も天秤も×の目の集まり）
   1 世界とメタファー: 刺繍の見本布（サンプラー）。天秤の両皿は刺繍枠（木の輪）。左＝反応前・右＝反応後。
     分子をタップすると糸がほどけて原子になり、糸だまりに落ちる。原子を種類ごとの柱に積み分ける（Coin Sort型）。
     まだ縫っていない図案は青い下絵の線、縫い終えた図案は色糸で埋まる（道のり＝見本布の図案を1つずつ）。
   2 配色: 麻の生成り #F3EEE3 の地に、藍の糸 #2E4057・朱の糸 #E4572E。刺繍枠は木の色、下絵は青いチャコ線。
   3 書体: 見出し M PLUS 1p（太字）
   4 画面: 全画面canvas。PC・iPad横＝上に天秤の竿と左右の刺繍枠、下に積み場（元素ごとに「前」「後」の2本の柱）。
     スマホ・iPad縦＝上に反応前の枠、下に反応後の枠、真ん中に積み場（前は上へ・後は下へ積む鏡うつし）。
   5 HUD: 縫い付けたワッペン（もどる・図案名・かけら・図案帳・音）。天秤の針は縫い針。
   6 音: オルゴール（原子が柱に収まる・音程が上がる）・糸が切れる「プツッ」・はさみ・ファンファーレ

  【7. 動かす遊び】Coin Sort型の積み分け
   分子をタップ→糸がほどけて原子が糸だまりへ。糸だまりのいちばん上の原子（同じ種類が続けば まとめて）を
   ドラッグして元素の柱へ。まちがった柱にはのらない（はね返る・連続が切れる）。柱の重さの札の合計で天秤が傾き、
   前と後の柱の高さが全部そろうと天秤がつりあう。「あと H 2個」「あと 16」は本当の差。
  30分: 9枚の図案（炭素の燃焼→水→鉄と硫黄→沈殿→銅の酸化〔縫い足し〕→ふたのない容器〔山場〕→
   マグネシウムの燃焼〔空気から〕→酸化銅の還元〔縫い足し〕→見本布の大作〔タイムアタック〕）→ 確認テスト10問 → 提出カード
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--lin:#F3EEE3;--lin2:#E6DDCB;--lin3:#D8CCB3;--nv:#2E4057;--nvD:#1E2B3B;--nv2:#4A5E7A;--rd:#E4572E;--rdD:#B03F1E;--gd:#C99A3E;--gdD:#94701F;--blue:#5B8DC9;
  --hd:"M PLUS 1p","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --aida:radial-gradient(circle at 50% 50%,rgba(110,90,60,.20) 0 1px,transparent 1.6px) 0 0/7px 7px,linear-gradient(0deg,rgba(110,90,60,.05) 1px,transparent 1px) 0 0/7px 7px,linear-gradient(90deg,rgba(110,90,60,.05) 1px,transparent 1px) 0 0/7px 7px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--lin);overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  font-family:var(--hd);color:var(--nvD);-webkit-text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
input{-webkit-user-select:text;user-select:text}
/* 縫い付けたワッペン（ボタン） */
.patch{position:relative;font-family:var(--hd);font-weight:800;font-size:18px;min-height:50px;padding:8px 24px;border:0;border-radius:12px;cursor:pointer;
  color:var(--lin);background:var(--nv);letter-spacing:.04em;box-shadow:0 4px 0 var(--nvD),0 6px 12px rgba(30,43,59,.22);transition:transform .08s}
.patch::after{content:"";position:absolute;inset:5px;border:2px dashed rgba(243,238,227,.78);border-radius:8px;pointer-events:none}
.patch:active{transform:translateY(3px) scale(.98);box-shadow:0 1px 0 var(--nvD)}
.patch.rd{background:var(--rd);box-shadow:0 4px 0 var(--rdD),0 6px 12px rgba(30,43,59,.22)}
.patch.rd:active{box-shadow:0 1px 0 var(--rdD)}
.patch.ln{background:var(--lin);color:var(--nv);box-shadow:0 4px 0 var(--lin3),0 0 0 2px var(--nv) inset,0 6px 12px rgba(30,43,59,.16)}
.patch.ln::after{border-color:rgba(46,64,87,.55)}
.patch.gd{background:var(--gd);color:var(--nvD);box-shadow:0 4px 0 var(--gdD),0 6px 12px rgba(30,43,59,.2)}
.patch.gd::after{border-color:rgba(30,43,59,.45)}
.patch.sm{font-size:15px;min-height:44px;padding:6px 16px}
.patch[disabled]{opacity:.45;cursor:default}
/* もどる（いつも左上） */
#bBack{position:fixed;z-index:40;left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));min-height:46px;padding:4px 18px 4px 12px;font-size:17px}
#bBack b{display:inline-block;margin-right:6px;color:var(--rd);background:var(--lin);border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-size:13px}
#hudC{position:fixed;z-index:30;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);pointer-events:none;background:var(--lin);color:var(--nv);
  font-weight:900;font-size:clamp(14px,.6vw + 10px,19px);padding:7px 18px;border-radius:10px;box-shadow:0 0 0 2px var(--nv),0 3px 0 var(--lin3);white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
#hudC::after{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(46,64,87,.45);border-radius:7px}
#hudC em{font-style:normal;color:var(--rd)}
#topR{position:fixed;z-index:31;right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
#kk{font-weight:900;font-size:15px;background:var(--lin);color:var(--nv);padding:6px 10px;border-radius:9px;box-shadow:0 0 0 2px var(--nv)}
#kk i{font-style:normal;display:inline-block;width:11px;height:13px;background:var(--rd);clip-path:polygon(50% 0,100% 35%,80% 100%,20% 100%,0 35%);margin-right:5px;vertical-align:-1px}
.ib{width:48px;height:48px;padding:0;font-size:14px;border-radius:50%}
.ib::after{border-radius:50%}
.ib.off{background:var(--lin);color:var(--nv);text-decoration:line-through}
#bBook2{width:auto;border-radius:12px;padding:0 14px;font-size:14px}
#bBook2::after{border-radius:8px}
/* 刺繍の帯（指示） */
#strip{position:fixed;z-index:20;left:50%;transform:translateX(-50%);width:max-content;max-width:min(94vw,780px);pointer-events:none;background:var(--nv);color:var(--lin);
  padding:8px 22px 9px;font-weight:800;font-size:clamp(14px,.9vw + 9px,20px);line-height:1.45;text-align:center;border-radius:10px;box-shadow:0 4px 10px rgba(30,43,59,.2)}
#strip::after{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(243,238,227,.6);border-radius:7px}
#strip b{color:#FFC7B4}
#strip.warn{background:var(--rd)}
#strip.warn b{color:var(--lin);text-decoration:underline}
/* 図案（縫い足し）の棚 */
#patBar{position:fixed;z-index:22;display:flex;gap:8px;transform:translate(-50%,0);width:max-content}
#patBar .patch{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 8px;font-size:16px;min-height:52px}
#patBar svg{width:40px;height:40px;background:var(--lin);border-radius:8px}
/* 窓（刺繍の見本布の布地） */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
#dlg,#conf,#book{background:rgba(30,43,59,.3);padding:12px}
.box{position:relative;width:min(94vw,640px);max-height:92vh;overflow-y:auto;background:var(--aida),var(--lin);padding:0 0 18px;border-radius:14px;
  box-shadow:0 0 0 5px var(--nv),0 0 0 7px var(--lin),0 0 0 10px var(--rd),0 18px 30px rgba(30,43,59,.35);touch-action:pan-y}
.box::before{content:"";position:absolute;inset:8px;border:2px dashed rgba(46,64,87,.35);border-radius:9px;pointer-events:none}
.nh{position:relative;margin:0 0 10px;padding:18px 18px 12px;font-weight:900;font-size:clamp(24px,1.6vw + 16px,36px);color:var(--nv);text-align:center;line-height:1.2;letter-spacing:.04em}
.nh.rd{color:var(--rd)}
.nh small{display:block;font-size:.46em;margin-top:6px;color:var(--nv2);letter-spacing:.1em;font-weight:800}
.bd{position:relative;padding:0 22px;font-size:clamp(15px,.4vw + 13px,18px);line-height:1.75;font-weight:700}
.bd b{color:var(--rd)}
.eq{display:block;text-align:center;font-size:clamp(20px,1.2vw + 14px,30px);font-weight:900;color:var(--nv);margin:4px 0 8px;letter-spacing:.03em}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;position:relative}
.rec{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:center;margin:8px 0;font-weight:800}
.rec span:nth-child(odd){color:var(--nv2)}
.stars{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 10px}
.stars div{font-weight:900;font-size:15px;padding:7px 12px;border-radius:9px;background:var(--lin2);color:#9a8c70;box-shadow:inset 0 0 0 2px #cdbf9f;animation:don .34s cubic-bezier(.3,1.8,.5,1) both}
.stars div.on{background:var(--rd);color:var(--lin);box-shadow:inset 0 0 0 2px var(--rd),inset 0 0 0 4px var(--lin)}
@keyframes don{0%{transform:scale(2.4) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.take{position:relative;margin:10px 22px 0;padding:12px 16px;background:var(--nv);color:var(--lin);border-radius:10px;font-weight:700;line-height:1.75}
.take::after{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(243,238,227,.5);border-radius:7px;pointer-events:none}
.take b{color:#FFC7B4}
.cards{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:0 16px}
.card{background:#FBF8F1;border-radius:10px;padding:8px;text-align:center;box-shadow:inset 0 0 0 2px var(--nv);font-size:13px;line-height:1.45;font-weight:700}
.card svg{width:100%;height:76px;display:block;margin:0 auto 4px}
.card b{display:block;font-weight:900;font-size:15px;color:var(--nv)}
.card.no{opacity:.5;box-shadow:inset 0 0 0 2px #b9ab8b}
/* タイトル */
#title{flex-direction:column;justify-content:flex-start;pointer-events:none}
#logo{pointer-events:none;margin-top:calc(70px + env(safe-area-inset-top));text-align:center;position:relative;padding:16px 26px 20px;background:var(--nv);color:var(--lin);border-radius:18px;
  box-shadow:0 0 0 4px var(--lin),0 0 0 8px var(--rd),0 14px 26px rgba(30,43,59,.3);animation:logoIn 1s cubic-bezier(.2,1.5,.45,1) both;max-width:94vw}
#logo::after{content:"";position:absolute;inset:7px;border:2.5px dashed rgba(243,238,227,.7);border-radius:12px}
@keyframes logoIn{0%{transform:translateY(-140%) rotate(-6deg)}60%{transform:translateY(6%) rotate(1deg)}80%{transform:translateY(-2%)}100%{transform:none}}
#logo .kick{display:inline-block;font-weight:900;font-size:clamp(12px,.6vw + 9px,16px);letter-spacing:.16em;padding:3px 14px;background:var(--rd);color:var(--lin);border-radius:6px}
#logo h1{margin:8px 0 2px;font-weight:900;line-height:1.1;font-size:min(12vw,8.4vh,86px);letter-spacing:.05em;text-shadow:.05em .05em 0 var(--rd)}
#logo h1 em{font-style:normal;color:#FFC7B4;text-shadow:.05em .05em 0 var(--nvD)}
#logo .sub{font-weight:800;font-size:clamp(15px,1.2vw + 10px,26px);letter-spacing:.08em}
#tBox{pointer-events:auto;margin-top:auto;margin-bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;width:min(94vw,560px);animation:boxIn .6s .7s both}
@keyframes boxIn{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:none}}
#btnStart{font-size:clamp(24px,1.4vw + 16px,34px);min-height:66px;padding:10px 52px;animation:pulse 1.1s 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#nameBox{display:flex;align-items:center;gap:10px;background:var(--lin);padding:6px 14px;border-radius:10px;box-shadow:0 0 0 2px var(--nv)}
#nameBox label{font-weight:900;font-size:15px;color:var(--nv)}
#nameIn{width:180px;min-height:40px;font-size:17px;border:0;border-bottom:2px dashed var(--nv);background:transparent;color:var(--nvD);padding:4px 6px;outline:none;font-family:var(--hd)}
/* 確認テスト */
#test{flex-direction:column;justify-content:flex-start;align-items:stretch;overflow-y:auto;touch-action:pan-y;background:var(--aida),var(--lin);padding:calc(68px + env(safe-area-inset-top)) 14px 16px}
#test .thead{position:relative;display:flex;justify-content:space-between;align-items:center;background:var(--nv);color:var(--lin);padding:8px 18px;border-radius:10px;margin-bottom:12px;flex:none;font-weight:900;font-size:clamp(17px,1vw + 11px,24px)}
#test .paper{flex:1 0 auto;display:flex;flex-direction:column;padding:4px}
body.land #test .paper{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"q a" "f a" "f b";column-gap:30px}
body.land #tQ{grid-area:q}body.land #tFig{grid-area:f}body.land #tA{grid-area:a;align-self:start}body.land #tFb{grid-area:b}
#tQ{font-size:clamp(17px,.8vw + 11px,24px);font-weight:800;line-height:1.65;padding:12px 16px;background:#FBF8F1;border-radius:10px;box-shadow:inset 0 0 0 2px var(--nv);margin-bottom:10px}
#tFig{text-align:center;margin:6px 0 12px}
#tFig svg{max-width:100%;height:auto;background:#fff;border-radius:8px;box-shadow:0 0 0 2px var(--nv)}
body.land #tFig svg{width:100%;max-height:52vh}
#tA{display:flex;flex-direction:column;gap:10px}
.tag{min-height:50px;text-align:left;font-size:clamp(15.5px,.5vw + 12px,20px);font-weight:800;line-height:1.45;padding:10px 16px;cursor:pointer;border:0;border-radius:10px;font-family:inherit;
  background:#FBF8F1;color:var(--nvD);box-shadow:inset 0 0 0 2.5px var(--nv),0 3px 0 var(--nv)}
.tag:active{transform:translateY(2px);box-shadow:inset 0 0 0 2.5px var(--nv),0 1px 0 var(--nv)}
.tag.ok{background:var(--nv);color:var(--lin)}
.tag.ng{background:var(--rd);color:var(--lin);text-decoration:line-through}
.tag.pickd{opacity:.35}
.numrow{display:flex;gap:8px;align-items:center}
#numIn{flex:1;min-height:50px;font-size:22px;border:0;border-radius:10px;background:#FBF8F1;color:var(--nvD);padding:4px 12px;box-shadow:inset 0 0 0 2.5px var(--nv);font-family:var(--hd);font-weight:800}
.ord{display:flex;flex-direction:column;gap:6px;min-height:24px;padding:6px;border-radius:10px;box-shadow:inset 0 0 0 2px var(--gd);background:#FBF8F1}
.ord div{font-size:15px;font-weight:800;padding:6px 8px;background:var(--lin2);border-left:6px solid var(--rd);border-radius:4px}
#tFb{margin-top:12px;font-size:clamp(15px,.4vw + 13px,19px);line-height:1.6;font-weight:800}
#tFb .mk{font-size:1.8em;margin-right:8px;color:var(--rd);font-weight:900}
#tFb .mk.o{color:var(--nv)}
#tFb .ex{display:block;font-weight:700;margin-top:4px}
/* 本編クリア */
#clear{flex-direction:column;gap:14px;padding:76px 16px 20px;text-align:center;pointer-events:none}
#clear>*{pointer-events:auto}
#clear h2{position:relative;margin:0;font-weight:900;font-size:clamp(40px,7vw,96px);color:var(--lin);background:var(--rd);padding:8px 34px 14px;border-radius:16px;box-shadow:0 0 0 4px var(--lin),0 0 0 8px var(--nv)}
#clear h2::after{content:"";position:absolute;inset:7px;border:2.5px dashed rgba(243,238,227,.7);border-radius:10px}
#clear .take{max-width:min(92vw,720px);font-size:clamp(15px,.5vw + 12px,20px)}
#clear .recb{background:var(--lin);padding:10px 20px;border-radius:10px;box-shadow:0 0 0 2px var(--nv);font-weight:800}
/* 仕上げ 2026-09-28（tn-finish-2026-09-28）: 確認の窓は案内より上に・帯はボタンの段の下へ */
#conf{z-index:2147483300!important}
#bBack{z-index:60} /* 札（dlg）が開いていても もどるを押せるように */
@media (max-width:560px){.gd-band{top:calc(64px + env(safe-area-inset-top))!important}#btnStart{font-size:22px;min-height:56px;padding:8px 24px}}
@media (prefers-reduced-motion:reduce){#logo,#btnStart,#tBox,.stars div{animation:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="刺繍の見本布と天秤"></canvas>

<button id="bBack" class="patch hidden" aria-label="もどる" data-gd-pass><b>◀</b>もどる</button>
<div id="hudC" class="hidden"></div>
<div id="topR" class="hidden"><span id="kk"><i></i><span id="kkN">0</span></span><button id="bBook2" class="patch ln">図案帳</button><button id="bSnd" class="patch ib" aria-label="音のオン・オフ">音</button></div>
<div id="strip" class="hidden"></div>
<div id="patBar" class="hidden"></div>

<div id="title" class="ov">
  <div id="logo">
    <div class="kick">中2理科 化学 第28回</div>
    <h1>天秤の中を<em>のぞけ</em></h1>
    <div class="sub">～質量が保存されるわけ～</div>
  </div>
  <div id="tBox">
    <div id="nameBox"><label for="nameIn">なまえ</label><input id="nameIn" maxlength="16" autocomplete="off" placeholder="（空でもOK）"></div>
    <div class="row" style="margin-top:0">
      <button id="btnStart" class="patch rd">はじめる</button>
      <button id="btnCont" class="patch hidden">つづきから</button>
    </div>
    <div class="row" style="margin-top:0"><button id="btnHowto" class="patch sm">あそびかた（れんしゅう）</button><button id="btnBook" class="patch gd sm">📖 図鑑</button></div>
  </div>
</div>

<div id="dlg" class="ov hidden"><div class="box" id="dlgBox"></div></div>
<div id="conf" class="ov hidden" data-gd-pass><div class="box">
  <div class="nh">もどる？<small>進み具合は保存されます</small></div>
  <div class="bd" id="confTx" style="text-align:center"></div>
  <div class="row"><button class="patch" id="confNo">つづける</button><button class="patch rd" id="confGo">もどる</button></div>
</div></div>
<div id="book" class="ov hidden"><div class="box">
  <div class="nh">図案帳<small>ほどいた分子のモデル</small></div>
  <div class="cards" id="bookCards"></div>
  <div class="row"><button class="patch" id="bookClose">とじる</button></div>
</div></div>

<div id="clear" class="ov hidden">
  <h2>見本布 完成！</h2>
  <div class="recb" id="clRec"></div>
  <div class="take">反応の前と後で、<b>原子の種類と数は変わらない</b>（組み合わせが変わるだけ）。<br>原子1個1個に質量があるから、<b>質量の総和も変わらない</b>＝質量保存の法則。</div>
  <div class="row"><button id="toTest" class="patch rd">確認テストへ</button><button id="clBook" class="patch gd sm">📖 図鑑</button></div>
</div>

<div id="test" class="ov hidden">
  <div class="thead"><span>確認テスト ─ 見本布の検め</span><span id="tNo"></span></div>
  <div class="paper"><div id="tQ"></div><div id="tFig"></div><div id="tA"></div><div id="tFb"></div></div>
</div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2

  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}

  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}

  function cardHTML(r){

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;

  function run(){if(raf)return;var last=0;function step(t){var dt=Math.min(3,(t-last)/16.7||1);last=t;var W=innerWidth,H=innerHeight,x=FX.x;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';

  /* ---------------- かけら ---------------- */
  var cappedShown={};
  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

  /* ---------------- ガチャの中身 ---------------- */
  function pools(uid,P){P=P||loadP();var o={3:[],4:[],5:[]};unitCards(uid).forEach(function(c){if(isUnlocked(c,P)&&o[c.r])o[c.r].push(c)});return o}
  function effRates(po){var r={3:+ECO.rates['3']||0,4:+ECO.rates['4']||0,5:+ECO.rates['5']||0},moved=[];
    [5,4,3].forEach(function(t){if(!po[t].length&&r[t]>0){var to=0;for(var k=t-1;k>=3;k--)if(po[k].length){to=k;break}if(!to)for(var k2=t+1;k2<=5;k2++)if(po[k2].length){to=k2;break}if(to){r[to]+=r[t];moved.push([t,to,r[t]])}r[t]=0}});
    return {r:r,moved:moved}}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function drawOne(uid,Z,P){
    var po=pools(uid,P),er=effRates(po).r;
    Z.pity[uid]=(Z.pity[uid]||0)+1;
    var c;
    if(Z.pity[uid]>=ECO.pity&&po[5].length){var un=po[5].filter(function(x){return !Z.cards[x.id]});c=pick(un.length?un:po[5])}
    else{var x=Math.random()*(er[3]+er[4]+er[5]),t=x<er[3]?3:(x<er[3]+er[4]?4:5);if(!po[t].length)t=po[4].length?4:(po[3].length?3:5);c=pick(po[t])}
    if(!c)return null;
    if(c.r>=5)Z.pity[uid]=0;
    if(!po[5].length&&Z.pity[uid]>=ECO.pity)Z.pity[uid]=ECO.pity-1;
    return c}
  function give(Z,c){var isNew=!Z.cards[c.id];Z.cards[c.id]=(Z.cards[c.id]||0)+1;if(isNew)delete Z.seen[c.id];Z.hist.unshift([now(),c.id]);Z.hist=Z.hist.slice(0,30);return isNew}

function mkHoop(list){const mols=[];list.forEach(([k,n])=>{for(let i=0;i<n;i++)mols.push({k,id:Math.random(),ph:rnd(0,6)})});placeMols(mols);return{mols}}

 mols.forEach((m,i)=>{const r=Math.floor(i/cols),c=i%cols,inRow=Math.min(cols,n-r*cols);m.x=((c+.5)/inRow-.5)*1.25*(inRow/cols)*(cols===1?0:1)+(cols===1?0:0);m.y=((r+.5)/rows-.5)*(rows===1?0:1.05);if(cols>1&&inRow<cols)m.x=((c+.5)/inRow-.5)*1.25*inRow/cols})}

 if(LAND){

  o.end={pre:[o.piv[0]-ex,o.piv[1]-ey],post:[o.piv[0]+ex,o.piv[1]+ey]};
  o.hoop={pre:[o.end.pre[0],o.end.pre[1]+o.drop],post:[o.end.post[0],o.end.post[1]+o.drop]};

/* ================= 遊び方案内（Guide）2026-09-28 ================= */
let PAUSED=false,PRAC=false,HELP=null;
const INTRO={title:'天秤の中をのぞけ',
  learn:'反応の前と後で **原子の種類と数** は変わらない。だから **質量の総和** も変わらない（質量保存の法則）',
  how:'分子を **タップ** してほどき、原子を同じ種類の **柱へドラッグ**。左右の柱がそろうと天秤がつりあう',gesture:'tap'};
function endPractice(){if(!PRAC)return;PRAC=false;if(G)G.prac=false;if(window.Guide)Guide.tutorialEnd()}
function pracMol(sides){if(!G)return null;const o=geo();for(const side of sides){const m=G.hoops[side].mols.find(q=>!q.leaving);if(m){const [x,y]=molPos(o,side,m),s=span(m.k),u=molAR(o,side)*1.72;return {x,y,w:s.w*u+30,h:s.h*u+30}}}return null}
function pracPile(){if(!G)return null;const o=geo();for(const side of ['pre','post']){const pl=G.piles[side];if(pl.length&&pl[pl.length-1].arr){const [x,y]=pileSlot(o,side,pl.length-1);const ci=G.cols.findIndex(c=>c.el===pl[pl.length-1].el);return {side,x,y,ci}}}return null}
const NONE={x:-100,y:-100,r:4};
const PRACTICE={label:'れんしゅう中　炭素の燃焼',block:false,clearOn:'manual',clearText:'れんしゅうクリア！',
  start:()=>{PRAC=true;closeDlg();$('conf').classList.add('hidden');S.started=true;startStage(0,true)},
  steps:[
    {gesture:'tap',target:()=>pracMol(['pre'])||NONE,until:()=>G&&G.prac&&G.hoops.pre.mols.length<G.prac0,
     text:'左は **反応前**。枠の中の **分子をタップ** すると、糸がほどけて原子になる',praise:'ほどけた！'},
    {gesture:'drag',target:()=>{const p=pracPile();if(!p)return NONE;const o=geo();return {x:p.x,y:p.y,r:o.pa*1.1}},to:()=>{const p=pracPile();if(!p||p.ci<0)return NONE;const o=geo();return {x:colX(o,p.ci),y:LAND?o.base-o.a*1.5:o.mid,w:o.pw*.9,h:LAND?o.a*3.4:(o.midB-o.midT)}},
     until:()=>G&&G.prac&&G.cols.some(c=>c.pre+c.post>0),text:'糸だまりの **いちばん上** の原子を、同じ種類の **柱へドラッグ**',praise:'積めた！'},
    {gesture:'tap',target:()=>pracMol(['pre','post'])||NONE,until:()=>G&&G.prac&&!G.hoops.pre.mols.length&&!G.hoops.post.mols.length,
     text:'右は **反応後**。こちらの分子も、残りも、**ぜんぶタップ** してほどこう',praise:'ぜんぶほどけた！'},
    {gesture:'drag',target:()=>{const p=pracPile();if(!p)return NONE;const o=geo();return {x:p.x,y:p.y,r:o.pa*1.1}},to:()=>{const p=pracPile();if(!p||p.ci<0)return NONE;const o=geo();return {x:colX(o,p.ci),y:LAND?o.base-o.a*1.5:o.mid,w:o.pw*.9,h:LAND?o.a*3.4:(o.midB-o.midT)}},
     until:()=>G&&G.prac&&G.phase==='balanced',text:'原子を **ぜんぶ柱へ**。左右で **種類ごとの数** がそろうと、天秤がつりあう',praise:false}
  ],
  onExit:res=>{PRAC=false;if(res&&res.stopped)return;if(scene==='play'&&G&&G.prac){G.prac=false;if(res&&res.cleared&&G.phase==='balanced')stageResult();else{G.tut=0;strip('分子をほどいて、原子を<b>種類ごとの柱</b>へ');hud()}}}};
if(window.Guide){
  Guide.setup({theme:{bg:'#FAF6EE',fg:'#1E2B3B',accent:'#E4572E',accentText:'#FAF6EE',font:'"M PLUS 1p","Hiragino Kaku Gothic ProN",sans-serif',bodyFont:'"M PLUS 1p","Hiragino Kaku Gothic ProN",sans-serif',
      radius:10,texture:'grid',line:'#2E4057',dim:'rgba(30,43,59,.45)',shadow:'0 0 0 3px #FAF6EE, 0 0 0 5px #2E4057, 0 8px 20px rgba(30,43,59,.3)',outline:'#FAF6EE',hand:'#FAF6EE',handLine:'#2E4057'},
    sfx:k=>{AU.init();if(k==='step'||k==='done')SFX.put(5);else if(k==='clear')SFX.fan();else if(k==='open'||k==='close')SFX.tap();else if(k==='cheer')SFX.pair();else if(k==='nudge')SFX.tick()},
    muted:()=>!AU.on});
  HELP=Guide.help({title:'天秤の中をのぞけ',learn:INTRO.learn,how:INTRO.how,gesture:'tap',mount:$('topR'),size:46,attention:true,replay:'tutorial',
    rules:['枠の中の **分子をタップ** → 糸がほどけて原子が **糸だまり** に積まれる',
      '糸だまりの **いちばん上** の原子を、同じ種類の **柱へドラッグ**（同じ原子が続けば まとめて運べる）',
      '反応前と反応後の柱が **種類ごとに同じ高さ** になると、天秤がつりあう',
      '反応後の枠が空の図案は、**図案から縫い足す**。空へ出ていった気体・入ってきた空気は **枠へドラッグ** で数に入れる',
      '続けて正しく積むと **連続**。まちがえた柱に置くと連続が切れる'],
    onOpen:()=>{PAUSED=true},onClose:()=>{PAUSED=false;last=performance.now()}});
  HELP.hide();
}

 start:i=>{S.started=true;startStage(i)},go:()=>{const b=$('goB');b&&b.click()},map:()=>toMap(),stitch:k=>stitchPat(k),
 // 1手ずつ正しく進める（自動テスト用）
 step:()=>{if(!G||G.phase==='intro'||G.phase==='balanced'||G.phase==='over'||flyers.length)return'wait';const o=geo();
  for(const side of ['pre','post']){const pl=G.piles[side];if(pl.length&&pl[pl.length-1].arr){const run=takeRun(side);const ci=G.cols.findIndex(c=>c.el===run[0].el);drag={kind:'run',side,run,x:0,y:0};const x=colX(o,ci),y=LAND?o.base-20:o.mid;dropRun(x,y);drag=null;checkState();return'sort'}}
  for(const side of ['pre','post']){const m=G.hoops[side].mols.find(q=>!q.leaving);if(m&&G.piles[side].length+MOL[m.k].a.length<=10){unstitch(side,m);return'unstitch'}}
  const st=STAGES[STI];if(st.pat&&G.allOut){const need=elemsOf(G.def.pre),have={};G.cols.forEach(c=>have[c.el]=c.post);for(const k of st.pat){const ok=MOL[k].a.every(a=>(have[a[0]]||0)+MOL[k].a.filter(b=>b[0]===a[0]).length<=(need[a[0]]||0));if(ok){stitchPat(k);return'pat'}}}
  if(G.phase==='near'&&G.sky.length){const m=G.sky.find(q=>q.esc||q.k==='O2');if(m){drag={kind:'sky',m,x:0,y:0};const h=o.hoop[st.escape?'post':'pre'];dropSky(h[0],h[1]);drag=null;return'sky'}}
  return'idle'}};
})();
