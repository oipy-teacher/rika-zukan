<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>てんびんの予言 ～沈殿ができる反応の質量～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#221015;--bg2:#351820;--gold:#dcb660;--gold2:#a57f2e;--cream:#f6ecd6;--paper:#f3e5c6;--ink:#2d1b12;--sub:#7b5f45;
 --ok:#2f8a55;--ng:#c0442e;--wine:#6d1f2c;
 --f:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Meiryo',sans-serif;--m:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--f);overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;
 background-image:radial-gradient(ellipse at 50% -10%,rgba(220,182,96,.18),transparent 55%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.5),transparent 60%),
 repeating-linear-gradient(45deg,rgba(220,182,96,.035) 0 2px,transparent 2px 22px),repeating-linear-gradient(-45deg,rgba(220,182,96,.035) 0 2px,transparent 2px 22px)}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
.scr{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:10px 12px 30px}
.btn{min-height:50px;border:none;border-radius:14px;padding:10px 18px;font-size:18px;font-weight:800;background:linear-gradient(#e8c877,#c49b41);color:#2d1b12;box-shadow:0 4px 0 #7b5a1c,0 0 0 2px #f3dc9c inset}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7b5a1c}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--cream);box-shadow:0 0 0 2px rgba(220,182,96,.55) inset}
.btn.wine{background:linear-gradient(#8e2a3a,#651b28);color:#fbecd0;box-shadow:0 4px 0 #3a0f16,0 0 0 2px rgba(220,182,96,.6) inset}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.small{font-size:13px;color:#d8c4a2}
/* タイトル */
.curtain{position:fixed;left:0;right:0;top:0;height:46px;pointer-events:none;z-index:1;
 background:radial-gradient(circle at 20px -8px,#8e2a3a 24px,transparent 25px) 0 0/40px 46px repeat-x,linear-gradient(#5d1824,#5d1824) 0 0/100% 14px no-repeat}
#title .wrap{text-align:center;padding-top:54px;position:relative;z-index:2}
.kicker{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.1em}
.logo{font-family:var(--m);font-size:clamp(36px,11vw,54px);font-weight:800;line-height:1.1;margin:6px 0 2px;color:#fbe7b0;text-shadow:0 2px 0 #6b4a14,0 0 22px rgba(220,182,96,.35)}
.subt{font-family:var(--m);font-size:17px;font-weight:700;color:#e8d3a8;margin-bottom:8px}
.tcard{background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;margin:12px 0;box-shadow:0 0 0 3px var(--gold2) inset,0 0 0 6px var(--paper) inset,0 0 0 7px var(--gold2) inset,0 8px 20px rgba(0,0,0,.4);text-align:left;font-size:15px;line-height:1.7}
.tcard b{color:#7a2030}
.namein{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--gold2);background:#fffaf0;color:var(--ink);margin-top:6px}
.tbtns{display:grid;gap:10px;margin-top:12px}
/* HUD */
.hud{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.icon{min-width:44px;min-height:44px;border-radius:12px;border:none;background:rgba(255,255,255,.07);box-shadow:0 0 0 2px rgba(220,182,96,.45) inset;font-size:19px;padding:0}
.hmid{flex:1;min-width:0;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.pill{background:rgba(0,0,0,.28);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 0 0 1px rgba(220,182,96,.4) inset}
.pill b{color:#fbe7b0;font-size:15px}
.combo{color:#ffd66b}
.combo.big{animation:pulse .5s}
@keyframes pulse{50%{transform:scale(1.25)}}
.dots{display:flex;gap:4px;justify-content:center;margin:2px 0 6px}
.dots i{width:18px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.dots i.on{background:var(--gold)}.dots i.now{background:#fff3c9;box-shadow:0 0 8px #ffd66b}
/* 天秤の舞台 */
.stagecard{background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 12px 10px;box-shadow:0 0 0 2px var(--gold2) inset,0 6px 16px rgba(0,0,0,.35);position:relative}
.stagecard .no{font-family:var(--m);font-size:13px;font-weight:800;color:#8a2a38}
.stagecard h2{font-family:var(--m);margin:0;font-size:22px;line-height:1.3}
.stagecard p{margin:4px 0 0;font-size:14px;line-height:1.55;color:#4b3526}
.table{position:relative;margin-top:8px;border-radius:18px;padding:4px 2px 0;background:radial-gradient(ellipse at 50% 30%,rgba(255,220,150,.13),transparent 65%),linear-gradient(#3b1a22,#2a1117);box-shadow:0 0 0 2px rgba(220,182,96,.35) inset}
#balSvg{display:block;width:100%;height:auto}
.readrow{display:flex;gap:10px;align-items:center;padding:0 10px 10px}
.orb{flex:none;width:96px;height:96px;border-radius:50%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.85) 0 7%,rgba(255,255,255,.18) 18%,transparent 40%),radial-gradient(circle at 50% 60%,#fff6dc 0,#e8dcc0 38%,#b8a888 70%,#6f624c 100%);
 box-shadow:0 0 0 3px #caa04c,0 0 22px rgba(255,226,150,.35),inset 0 -8px 18px rgba(80,60,30,.35);color:#3a2a12}
.orb::after{content:'';position:absolute;left:18px;right:18px;bottom:-14px;height:14px;border-radius:0 0 12px 12px;background:linear-gradient(#b48a38,#6d5020)}
.orb small{font-size:10px;font-weight:800;opacity:.75}
.orb b{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:19px;letter-spacing:-.02em}
.orb.shine{animation:orbshine 1s}
@keyframes orbshine{30%{box-shadow:0 0 0 3px #ffe08a,0 0 44px rgba(255,236,170,.95),inset 0 -8px 18px rgba(80,60,30,.35)}}
#msg{flex:1;min-height:60px;font-size:15px;line-height:1.55;font-weight:700}
#msg .big{font-family:var(--m);font-size:22px;display:block}
/* 操作パネル */
#ctrl{margin-top:10px}
.qline{font-weight:800;font-size:16px;margin:4px 2px 8px;line-height:1.5}
.tilts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tilt{min-height:92px;border:none;border-radius:14px;background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;line-height:1.3;padding:6px 4px;box-shadow:0 4px 0 var(--gold2),0 0 0 2px var(--gold2) inset}
.tilt svg{display:block;margin:0 auto 4px;width:70px;height:34px}
.tilt.sel{background:#fff3c9;box-shadow:0 0 0 3px #d23d4f inset,0 4px 0 var(--gold2)}
.tilt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
.rcards{display:grid;gap:8px}
.rcard{text-align:left;min-height:52px;border:none;border-radius:12px;padding:10px 12px 10px 40px;background:var(--paper);color:var(--ink);font-size:15px;font-weight:700;line-height:1.45;position:relative;box-shadow:0 3px 0 var(--gold2),0 0 0 2px var(--gold2) inset}
.rcard::before{content:'✦';position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9a2a3a;font-size:18px}
.rcard.sel{background:#fff3c9;box-shadow:0 0 0 3px #d23d4f inset}
.rcard.ok{background:#e3f3e6;box-shadow:0 0 0 3px var(--ok) inset}
.rcard.ng{background:#f7dcd6;box-shadow:0 0 0 3px var(--ng) inset}
.act{margin-top:10px}
.panel{background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px;box-shadow:0 0 0 1px rgba(220,182,96,.35) inset;margin-top:10px}
.panel h3{margin:0 0 6px;font-family:var(--m);font-size:18px;color:#fbe7b0}
.result{border-radius:14px;padding:10px 12px;margin-top:10px;font-size:15px;line-height:1.6;background:var(--paper);color:var(--ink);box-shadow:0 0 0 2px var(--gold2) inset}
.result .hd{font-family:var(--m);font-size:24px;font-weight:800}
.result.ok .hd{color:var(--ok)}.result.ng .hd{color:var(--ng)}.result.half .hd{color:#a0671a}
.peep{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.peep .pv{background:#1a0c10;border-radius:12px;padding:4px;box-shadow:0 0 0 2px #caa04c inset;text-align:center}
.peep .pv svg{width:100%;height:auto;display:block}
.peep .pv b{display:block;font-size:12px;color:#fbe7b0;padding:2px 0 4px}
.cnt{font-family:ui-monospace,Menlo,monospace;font-size:16px;color:#ffe9a8}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{min-height:96px;border:none;border-radius:12px;background:var(--paper);color:var(--ink);font-size:12px;font-weight:800;padding:4px;box-shadow:0 3px 0 var(--gold2),0 0 0 2px var(--gold2) inset;line-height:1.3}
.item svg{display:block;margin:0 auto;width:64px;height:56px}
.item.on{background:#fff3c9;box-shadow:0 0 0 3px #d23d4f inset}
.numshow{font-size:30px;font-weight:800;text-align:center;background:#fffaf0;color:var(--ink);border-radius:12px;padding:6px;margin:6px 0;font-family:ui-monospace,Menlo,monospace}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:52px;font-size:22px;font-weight:800;border-radius:12px;border:none;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--gold2)}
.hold{position:relative;overflow:hidden;width:100%;min-height:64px;border:none;border-radius:16px;font-size:19px;font-weight:800;color:#fbecd0;background:linear-gradient(#8e2a3a,#651b28);box-shadow:0 4px 0 #3a0f16,0 0 0 2px rgba(220,182,96,.7) inset}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,214,107,.45)}
.sealmark{font-family:var(--m);color:#c0303f;border:5px double #c0303f;border-radius:50%;width:112px;height:112px;display:flex;align-items:center;justify-content:center;font-size:40px;transform:rotate(-12deg);margin:6px auto;background:rgba(255,250,235,.9)}
.sealmark.pop{animation:stampin .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes stampin{from{transform:rotate(-12deg) scale(2.2);opacity:0}}
.book{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper);color:var(--ink);border-radius:10px;overflow:hidden}
.book th{background:#5d1824;color:#fbe7b0;padding:5px 4px;font-weight:700}
.book td{border-bottom:1px solid #e0cda8;padding:5px 4px;text-align:center}
.book td.l{text-align:left}
/* TA */
.tacard{background:var(--paper);color:var(--ink);border-radius:14px;padding:12px;text-align:center;box-shadow:0 0 0 2px var(--gold2) inset;min-height:150px}
.tacard .ic{font-size:40px}
.tacard .tx{font-weight:800;font-size:17px;line-height:1.5}
.tbar{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd66b,#d23d4f)}
/* 演出 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.fly{position:fixed;z-index:61;font-weight:800;font-size:24px;color:#ffd66b;text-shadow:0 2px 0 #5b3b0a;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
.banner{width:max-content;position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:62;background:var(--paper);color:#7a2030;font-family:var(--m);font-weight:800;font-size:26px;padding:14px 22px;border-radius:14px;box-shadow:0 0 0 3px var(--gold2) inset,0 10px 30px rgba(0,0,0,.5);text-align:center;animation:bn 1.8s forwards;pointer-events:none;max-width:92vw}
.banner small{display:block;font-family:var(--f);font-size:14px;color:#4b3526;margin-top:4px}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}12%{transform:translate(-50%,-50%) scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
.flash{position:fixed;inset:0;z-index:59;pointer-events:none;background:radial-gradient(circle,rgba(255,236,170,.6),transparent 70%);animation:fl .45s forwards}
@keyframes fl{to{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* オーバーレイ */
.ov{position:fixed;inset:0;background:rgba(15,5,8,.72);display:flex;align-items:center;justify-content:center;padding:12px;z-index:40}
.ovc{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:18px;padding:16px;text-align:center;box-shadow:0 0 0 3px var(--gold2) inset,0 10px 30px rgba(0,0,0,.5)}
.ovc h2{font-family:var(--m);margin:4px 0 8px;font-size:22px}
.ovc .btn.ghost{color:var(--ink);box-shadow:0 0 0 2px var(--gold2) inset}
/* テスト */
.tq{font-size:18px;font-weight:800;line-height:1.6;margin:8px 0 10px}
.tfig{background:#fffaf0;border-radius:12px;padding:6px;margin:6px 0;text-align:center}.tfig svg{max-width:100%;height:auto}
.choice{display:block;width:100%;min-height:52px;margin:8px 0;padding:10px 14px;text-align:left;font-size:17px;font-weight:700;border-radius:14px;border:none;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--gold2),0 0 0 2px var(--gold2) inset}
.prog{display:flex;gap:4px;margin:6px 0}.prog i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}.prog i.on{background:var(--gold)}
.ordsel{min-height:52px;background:rgba(0,0,0,.25);border:2px dashed var(--gold2);border-radius:12px;padding:6px;margin:6px 0}
.ordsel div{background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px;margin:4px 0;font-weight:700;font-size:15px}
.bigscore{font-family:var(--m);font-size:60px;font-weight:800;color:#fbe7b0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="atomDefs"></defs></svg>
<canvas id="fx"></canvas>

<div id="title" class="scr"><div class="curtain"></div><div class="wrap">
 <div class="kicker">中2理科　化学変化と原子・分子</div>
 <div class="logo">⚖️ てんびんの<br>予言</div>
 <div class="subt">～沈殿ができる反応の質量～</div>
 <div id="tBal" style="max-width:320px;margin:0 auto"></div>
 <div class="tcard"><b>占いの館の決まり</b><br>変化が起きる<b>前に</b>、天秤がどう傾くかを予言する。<br>予言と<b>根拠のカード</b>がそろって当たれば、大当たり！<br>最後の天秤の予言は<b>封印</b>して、学校の実験のあとに開ける。</div>
 <div id="nameBox" class="tcard" style="padding:10px 12px"><label style="font-weight:800;font-size:14px">なまえ（番号でもOK・空でも遊べる）</label><input id="nameIn" class="namein" maxlength="20" autocomplete="off"></div>
 <div class="tbtns">
  <button class="btn wide" id="bStart">▶ はじめる</button>
  <button class="btn ghost wide hidden" id="bCont">つづきから</button>
  <button class="btn ghost wide zk hidden" id="bBook1">📖 図鑑</button>
  <button class="btn ghost wide" id="bMute1">🔊 音：オン</button>
 </div>
</div></div>

<div id="game" class="scr hidden"><div class="wrap">
 <div class="hud">
  <button class="icon" id="bHome" aria-label="タイトルへ">🏠</button>
  <div class="hmid"><span class="pill">占い力 <b id="hScore">0</b></span><span class="pill combo" id="hCombo">コンボ ×0</span><span class="pill" id="hTime">0:00</span></div>
  <button class="icon" id="bMute" aria-label="音">🔊</button>
 </div>
 <div class="dots" id="dots"></div>
 <div id="stageBox"></div>
</div></div>

<div id="clear" class="scr hidden"><div class="wrap" id="clearBox"></div></div>
<div id="test" class="scr hidden"><div class="wrap" id="testBox"></div></div>
<div id="ov" class="ov hidden"><div class="ovc" id="ovc"></div></div>

<script>/*@SUBMIT_CARD_BEGIN*/
/* ==========================================================
   提出カード（全ゲーム共通） v2
   ─ 確認テストの結果を「スクショ1枚」で提出できる形に表示する
   ─ ゲーム側は SubmitCard.show({...}) を呼ぶだけ
   ─ v2（2026-09-26）: rec に grade・koma、review に id・koma を足せる（無くても v1 と同じに動く）
     保存と同時に、達成率（rika-zukan:<学年>:progress:v1 の 開いた・合格・満点・最高点）と
     問題ごとの成績（rika-zukan:<学年>:qlog:v1）を更新する。合格＝確認テスト7割以上
     はじめて合格したコマには、中2理科図鑑のかけら（pass）を渡す（window.Zukan があるとき）
     「とじる」のあと、アンケート（window.Voice）を1ゲーム1回だけ出す（確認テストだけのモードでは出さない）
   ─ このファイルの中身は build_collections.py が各ゲームの
     「@SUBMIT_CARD_BEGIN」〜「@SUBMIT_CARD_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 保存はこの端末のブラウザ内（localStorage）だけ。外への送信はしない
   ========================================================== */
(function(){
  if (window.SubmitCard) return;
  var KEY = 'mini-collection-records-v1';
  var CSS = [
    '#sc-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(12,14,28,.78);display:flex;align-items:center;justify-content:center;padding:2vmin;overflow:auto;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Zen Maru Gothic",sans-serif;-webkit-text-size-adjust:100%}',
    '#sc-ov *{box-sizing:border-box}',
    '#sc-card{width:min(96vw,760px);max-height:94vh;background:#fffdf8;color:#1d2433;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(40,90,180,.07) 31px 32px)}',
    '#sc-card .sc-band{background:#1d2433;color:#fff;padding:1.4vmin 2.6vmin;display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(13px,1.9vmin,17px);letter-spacing:.08em}',
    '#sc-card .sc-band .sc-tag{background:#e8384f;color:#fff;border-radius:6px;padding:2px 10px;letter-spacing:.2em}',
    '#sc-card .sc-band .sc-col{margin-left:auto;opacity:.8;font-weight:500;letter-spacing:.02em}',
    '#sc-card .sc-body{padding:2.2vmin 3vmin 2vmin;display:grid;grid-template-columns:1fr auto;gap:1.2vmin 3vmin;align-items:start}',
    '#sc-card .sc-unit{grid-column:1/-1;font-size:clamp(15px,2.3vmin,20px);font-weight:700;color:#3a4460}',
    '#sc-card .sc-unit small{display:block;font-size:.72em;font-weight:500;color:#6b7390;margin-top:2px}',
    '#sc-card .sc-name{font-size:clamp(22px,4vmin,34px);font-weight:900;border-bottom:3px solid #1d2433;padding-bottom:4px;min-width:0;overflow-wrap:anywhere}',
    '#sc-card .sc-name span{font-size:.5em;font-weight:700;color:#6b7390;margin-right:.6em}',
    '#sc-card .sc-score{grid-row:span 2;text-align:center;border:4px solid #e8384f;border-radius:50%;width:clamp(120px,19vmin,170px);height:clamp(120px,19vmin,170px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8384f;transform:rotate(-6deg)}',
    '#sc-card .sc-score b{font-size:clamp(46px,8vmin,72px);line-height:1;font-weight:900}',
    '#sc-card .sc-score i{font-style:normal;font-weight:700;font-size:clamp(14px,2.2vmin,19px)}',
    '#sc-card .sc-when{font-size:clamp(16px,2.6vmin,22px);font-weight:700}',
    '#sc-card .sc-when span{font-size:.7em;color:#6b7390;margin-right:.6em}',

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.koma&&isPass(r)?'<em>合格</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();

      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

<script>/*@QUIZ_BEGIN*/
/* ==========================================================
   確認テスト（全ゲーム共通） v1
   ─ 問題データは各ゲームの questions.json が正本。build が window.QUIZ として流し込む
   ─ このファイルの中身は build が各ゲームの「@QUIZ_BEGIN」〜「@QUIZ_END」の印の間へ同期する
     （ゲーム側で直接いじらず、ここを直して build を実行する）
   ─ 問題の型: choice（choices[0] が正解）／num（ans・unit・tol）／order（items が正しい順）
   ─ ゲームの見た目（問題の出し方）は自由。データの持ち方と提出カードへの渡し方だけ共通
   ========================================================== */
(function(){
  if (window.Quiz) return;
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function data(){return window.QUIZ||{questions:[],testCount:0}}
  function strip(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/\s+/g,'')}
  function correctText(q){
    if(q.t==='num')return String(q.ans)+(q.unit?' '+q.unit:'');
    if(q.t==='order')return q.items.join(' → ');
    return q.choices[0];
  }
  var Quiz={
    /* testCount 問を選び、選択肢や並べ替えの項目をシャッフルして返す。
       返す問題には shown（表示用の選択肢の並び）が付く。opt.koma でコマを絞れる */
    test:function(opt){
      opt=opt||{};var d=data();
      var pool=(d.questions||[]).filter(function(q){return !q.retired&&(!opt.koma||q.koma===opt.koma)});
      var n=Math.min(opt.count||d.testCount||10,pool.length);
      return shuffle(pool).slice(0,n).map(function(q){
        var o=JSON.parse(JSON.stringify(q));
        if(o.t==='choice')o.shown=shuffle(o.choices);
        if(o.t==='order')o.shown=shuffle(o.items);
        return o;
      });
    },
    /* ○×を返す。choice は選んだ文字列、num は数（文字列でも可）、order は並べた配列 */
    check:function(q,ans){
      if(q.t==='num'){var v=parseFloat(String(ans).replace(/[^\d.\-]/g,''));if(isNaN(v))return false;var tol=q.tol==null?0:q.tol;return Math.abs(v-q.ans)<=tol+1e-9}
      if(q.t==='order'){if(!ans||ans.length!==q.items.length)return false;for(var i=0;i<ans.length;i++)if(ans[i]!==q.items[i])return false;return true}
      return ans===q.choices[0];
    },
    answer:correctText,
    /* 提出カード用の review 配列 [{id,koma,q,a,y,ok}] */
    review:function(qs,answers){
      return qs.map(function(q,i){
        var y=answers[i];
        var yt=y==null?'（未回答）':(q.t==='order'&&Array.isArray(y)?y.join(' → '):String(y)+(q.t==='num'&&q.unit?' '+q.unit:''));
        return {id:q.id,koma:q.koma,q:q.q,a:correctText(q),y:yt,ok:Quiz.check(q,y)};
      });
    },
    all:function(){return (data().questions||[]).filter(function(q){return !q.retired})},
    mini:function(){return data().mini||[]},
    key:strip
  };
  window.Quiz=Quiz;
})();

-yogen-q010", "koma": "chu2-kagaku-26", "t": "choice", "q": "物の質量をはかり、数字で表示する器具を何という？", "choices": ["電子てんびん", "メスシリンダー", "ガスバーナー", "ルーペ"], "ex": "電子てんびんは質量を数字で表示する。水平な台の上に置いて使う。", "fig": null, "kind": "term", "level": 1}, {"id": "chu2-tenbin-yogen-q011", "koma": "chu2-kagaku-26", "t": "order", "q": "2つの水溶液を混ぜる反応で、反応の前後の質量を比べる手順を正しい順に並べよう。", "items": ["2つの水溶液をビーカーごと両方のせて、全体の質量をはかる", "一方の水溶液を、もう一方のビーカーに入れて混ぜる", "空になったビーカーもいっしょにのせて、全体の質量をはかる", "反応の前と後の値を比べる"], "ex": "前と後で、のせる物（2つのビーカー）をそろえてはかり、値を比べる。", "fig": null, "kind": "method", "level": 2}, {"id": "chu2-tenbin-yogen-q012", "koma": "chu2-kagaku-26", "t": "choice", "q": "表は、いろいろな変化の前と後の質量をはかった結果である。外から物質が入ってきたと考えられるのはどれ？", "choices": ["C　スチールウールを空気中で燃やす", "A　ふたをした容器の中で氷をとかす", "B　食塩水を加熱して水をすべて蒸発させる", "D　ふたのない皿にドライアイスを置いておく"], "ex": "質量が増えたのは C だけ。鉄が空気中の酸素と結び付いた。B と D は物質が外へ出ていって減った。", "fig": "\u003csvg viewBox='0 0 260 118' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'>\u003crect x='2' y='2' width='256' height='114' rx='6' fill='#fff' stroke='#999'/>\u003crect x='2' y='2' width='256' height='22' rx='6' fill='#5d1824'/>\u003ctext x='70' y='17' font-size='11' fill='#fff' text-anchor='middle'>変化\u003c/text>\u003ctext x='170' y='17' font-size='11' fill='#fff' text-anchor='middle'>前 [g]\u003c/text>\u003ctext x='225' y='17' font-size='11' fill='#fff' text-anchor='middle'>後 [g]\u003c/text>\u003cg font-size='11' fill='#222'>\u003ctext x='10' y='42'>A 氷をとかす（ふた付き）\u003c/text>\u003ctext x='170' y='42' text-anchor='middle'>64.20\u003c/text>\u003ctext x='225' y='42' text-anchor='middle'>64.20\u003c/text>\u003ctext x='10' y='65'>B 食塩水の水を蒸発\u003c/text>\u003ctext x='170' y='65' text-anchor='middle'>85.30\u003c/text>\u003ctext x='225' y='65' text-anchor='middle'>35.30\u003c/text>\u003ctext x='10' y='88'>C スチールウールを燃やす\u003c/text>\u003ctext x='170' y='88' text-anchor='middle'>11.00\u003c/text>\u003ctext x='225' y='88' text-anchor='middle'>11.25\u003c/text>\u003ctext x='10' y='111'>D ドライアイス（ふたなし）\u003c/text>\u003ctext x='170' y='111' text-anchor='middle'>30.50\u003c/text>\u003ctext x='225' y='111' text-anchor='middle'>20.10\u003c/text>\u003c/g>\u003cpath d='M2,48 H258 M2,71 H258 M2,94 H258' stroke='#ddd'/>\u003c/svg>", "kind": "graph", "level": 2}, {"id": "chu2-tenbin-yogen-q013", "koma": "chu2-kagaku-26", "t": "choice", "q": "ふたをしたボトルの水をこおらせると、体積が約1.1倍に増えた。質量はどうなる？", "choices": ["変わらない", "約1.1倍に増える", "氷は水にうくので、減る", "ボトルがふくらんだ分だけ減る"], "ex": "体積が変わっても粒の数は同じなので質量は変わらない。「水にうく」は同じ体積どうしで比べた話。", "fig": null, "kind": "judge", "level": 1}, {"id": "chu2-tenbin-yogen-q014", "koma": "chu2-kagaku-26", "t": "choice", "q": "次のうち、ふたや栓をせずに行っても、変化の前後で全体の質量が変わらないものはどれ？", "choices": ["ビーカーの水に砂糖を入れてとかす", "ビーカーの水を沸とうさせ続ける", "皿にのせたドライアイスが小さくなる", "ろうそくを燃やす"], "ex": "砂糖をとかしても物質は外へ出ない。ほかの3つは気体が空気中へ出ていくので軽くなる。", "fig": null, "kind": "judge", "level": 2}, {"id": "chu2-tenbin-yogen-q015", "koma": "chu2-kagaku-26", "t": "num", "q": "水 50.0 g に食塩をすべてとかすと、食塩水が 56.0 g になった。この食塩水から水をすべて蒸発させると、何 g の食塩が残る？", "ans": 6.0, "unit": "g", "tol": 0.05, "ex": "食塩水の質量＝水＋食塩なので、食塩は 56.0−50.0＝6.0 g。水を蒸発させると食塩だけが残る。", "fig": null, "kind": "calc", "level": 2}]};

  function earn(n,why,opt){
    opt=opt||{};
    var R=REASONS[why];
    if(!R){try{console.warn('Zukan.earn: 理由コードがありません',why)}catch(e){}return 0}
    n=Math.floor(Number(n)||0);if(n<=0)return 0;n=Math.min(n,R.max);
    if(isTestMode()&&why!=='pass')return 0;
    var Z=loadZ(),got=0;
    if(R.needId){
      if(!opt.id)return 0;var key=why+':'+opt.id;
      if(Z.once[key]||Z.once['h:'+hash24(key)])return 0;
      Z.once[key]=1;got=n;
    }else{
      var kid=normKoma(opt.koma)[0]||cur.koma[0];
      if(!kid){try{console.warn('Zukan.earn: コマIDがわかりません（Zukan.setup を先に呼ぶ）')}catch(e){}return 0}
      var Pr=loadP(),p=pget(Pr,kid);
      if(R.once){if(p[R.once])return 0;p[R.once]=now()}
      if(R.perKoma){p.rules=(p.rules||0);if(p.rules>=R.perKoma){saveP(Pr);return 0}}
      if(R.once&&ECO.milestoneFree){got=n;p.earnFirst=(p.earnFirst||0)+n}
      else if(p.pass){var room=Math.max(0,ECO.capReplay-(p.earnReplay||0));got=Math.min(n,room);p.earnReplay=(p.earnReplay||0)+got}
      else{var room2=Math.max(0,ECO.capFirst-(p.earnFirst||0));got=Math.min(n,room2);p.earnFirst=(p.earnFirst||0)+got}
      if(R.perKoma&&got>0)p.rules++;
      saveP(Pr);
      if(got<=0){if(!cappedShown[kid]&&!opt.silent){cappedShown[kid]=1;toast('このゲームのかけらは集めきった！<br>図鑑をうめるには、ほかのゲームへ')}return 0}
    }
    Z.kakera=(Z.kakera||0)+got;saveZ(Z);
    if(!opt.silent){
      var x=opt.x,y=opt.y;
      if(x==null||y==null){var h=hudEls.filter(function(e){return e.isConnected})[0];if(h){var c=centerOf(h);x=c[0];y=c[1]+30}else{x=innerWidth/2;y=innerHeight*.3}}
      floatAt(x,y,'+'+got+' かけら<small>'+esc(R.label)+'</small>');sfx.coin();burst(x,y,PAL.k,10,4);
    }
    return got;
  }

/* ================= 音（WebAudioで合成） ================= */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,delay,slide){if(!S.sound)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
function noise(d,vol,freq){if(!S.sound)return;const a=ac();if(!a)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=freq||1200;g.gain.value=vol||.15;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start()}

 tap(){tone(880,.05,'triangle',.05)},

 shimmer(){[1318,1568,1976,2637].forEach((f,i)=>tone(f,.25,'sine',.035,i*.06))},
 hit(c){const k=1+Math.min(c,10)*.05;[523,659,784,1047].forEach((f,i)=>tone(f*k,.16,'triangle',.07,i*.07))},

const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function fitCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',fitCv);fitCv();
function burst(x,y,cols,n,spd){if(RM)return;for(let i=0;i<(n||24);i++){const a=Math.random()*Math.PI*2,v=(spd||5)*(.4+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,life:1,c:cols[i%cols.length],s:3+Math.random()*5,st:Math.random()<.5})}if(!raf)raf=requestAnimationFrame(loop)}
function confetti(n){if(RM)return;for(let i=0;i<n;i++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,life:1.7,c:['#dcb660','#fbe7b0','#c0303f','#f6ecd6','#8e2a3a'][i%5],s:5+Math.random()*5,st:false});if(!raf)raf=requestAnimationFrame(loop)}
function loop(){const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.life-=.018;cx.globalAlpha=Math.max(0,Math.min(1,p.life));cx.fillStyle=p.c;if(p.st){cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.life*6);cx.beginPath();for(let k=0;k<4;k++){cx.lineTo(0,-p.s*d);cx.rotate(Math.PI/4);cx.lineTo(0,-p.s*d*.35);cx.rotate(Math.PI/4)}cx.fill();cx.restore()}else cx.fillRect(p.x*d,p.y*d,p.s*d,p.s*d*.6)}cx.globalAlpha=1;raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

const EL={H:['#EAF6FF','#1c4f86'],C:['#3a3d46','#fff'],N:['#2549C9','#fff'],O:['#E4572E','#fff'],Na:['#E9B949','#3d2a00'],Mg:['#B9C6D4','#1f2a36'],S:['#EAD23C','#4d3f00'],Cl:['#2FA36B','#fff'],Ca:['#EDE6D6','#4d3f22'],Fe:['#767C8A','#fff'],Cu:['#C8773C','#fff'],Zn:['#9FB2BE','#1d2c36'],Ag:['#C9CDD4','#2a2f38'],Ba:['#9B87C4','#fff']};
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const t=k>0?255:0,a=Math.abs(k);r=Math.round(r+(t-r)*a);g=Math.round(g+(t-g)*a);b=Math.round(b+(t-b)*a);return`rgb(${r},${g},${b})`}
(function(){let h='';for(const k in EL){const c=EL[k][0];h+=`<radialGradient id="ga-${k}" cx="36%" cy="30%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".22" stop-color="${shade(c,.35)}"/><stop offset=".6" stop-color="${c}"/><stop offset="1" stop-color="${shade(c,-.42)}"/></radialGradient>`}

function at(sym,x,y,r){const e=EL[sym];const sw=Math.max(.5,r*.08);return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="url(#ga-${sym})" stroke="${shade(e[0],-.5)}" stroke-width="${sw}"/>${r>=4.2?`<text x="${x}" y="${y+r*.36}" font-size="${r*(sym.length>1?.82:1.02)}" font-weight="800" text-anchor="middle" fill="${e[1]}" font-family="sans-serif">${sym}</text>`:''}</g>`}
// 水分子（くの字）: O を中心に H を2つ
function h2o(x,y,s,rot){const r=s,rh=s*.68,d=s*1.02;const a=(rot||0)*Math.PI/180,b1=a+Math.PI/2+0.91,b2=a+Math.PI/2-0.91;return at('H',x+Math.cos(b1)*d,y+Math.sin(b1)*d,rh)+at('H',x+Math.cos(b2)*d,y+Math.sin(b2)*d,rh)+at('O',x,y,r)}
function co2(x,y,s,rot){const a=(rot||0)*Math.PI/180,d=s*1.45;return at('O',x-Math.cos(a)*d,y-Math.sin(a)*d,s)+at('O',x+Math.cos(a)*d,y+Math.sin(a)*d,s)+at('C',x,y,s*.95)}
function o2(x,y,s,rot){const a=(rot||0)*Math.PI/180,d=s*.72;return at('O',x-Math.cos(a)*d,y-Math.sin(a)*d,s)+at('O',x+Math.cos(a)*d,y+Math.sin(a)*d,s)}

function etoh(x,y,s,rot){const a=(rot||0)*Math.PI/180,c=Math.cos(a),sn=Math.sin(a);const P=(u,v)=>[x+u*c-v*sn,y+u*sn+v*c];const L=[['H',-2.1,-.7,.6],['H',-2.1,.8,.6],['H',-1.3,1.3,.6],['H',.1,-1.3,.6],['H',.3,1.25,.6],['H',2.1,-1.0,.6],['C',-1.2,0,1],['C',.1,.05,1],['O',1.35,-.1,1]];return L.map(q=>{const p=P(q[1]*s,q[2]*s);return at(q[0],p[0],p[1],s*q[3])}).join('')}

 $('ctrl').innerHTML='';$('msg').innerHTML='<span class="big">……</span>変化が起きている';
 if(st.fx==='fire'||st.fx==='spark')sfx.fire();else if(st.fx==='boil'||st.fx==='fizz')sfx.boil();else sfx.tap();

function judge(){const st=CUR.st,okT=CUR.pred===st.dir,okR=CUR.reason.ok;const first=!S.first[st.id];
 S.first[st.id]=true;

 if(okT&&okR){S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);S.hits++;const pts=100*Math.min(S.combo,8);S.score+=pts;
  cls='ok';hd=S.combo>=3?`大当たり！ ${S.combo}連続`:'大当たり！';sfx.hit(S.combo);flash();const[x,y]=ctr(el);burst(x,y,['#ffd66b','#fbe7b0','#fff'],34,6);flyText('+'+pts,x,y-30);
  if(first)earn(15,'hit',el);
  if(S.combo===3||S.combo===6)banner(`${S.combo}連続 的中！`,'予言の腕が上がってきた');}
 else if(okT){S.combo=0;S.score+=30;cls='half';hd='予言は当たり、根拠はずれ';sfx.half()}
 else{S.combo=0;cls='ng';hd='予言は外れ';sfx.miss();$('tbl').classList.add('shake');setTimeout(()=>$('tbl').classList.remove('shake'),450)}
 S.log[st.id]={pred:CUR.pred,ok:okT,rok:okR};save();hud();
 const d=st.m1-st.m0;const dtxt=Math.abs(d)<1e-9?'差 0':`差 ${d>0?'+':'−'}${st.dp===1?f1(Math.abs(d)):f2(Math.abs(d))} g`;
 $('msg').innerHTML=`${massTxt(st,st.m0)} → <b>${massTxt(st,st.m1)}</b><br><span class="small">${dtxt}</span>`;

}

/* ---- 粒のぞき（中1の粒子モデル＋原子の色） ---- */
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function peepSVG(kind,ph){const W=150,H=120;let s='',n=0,out=0,inn=0;const R=rnd(kind.length*31+(ph==='a'?7:3));
 const box=`<rect x="8" y="12" width="${W-16}" height="${H-20}" rx="6" fill="#0f0709" stroke="#5b4630"/>`;
 if(kind==='ice'||kind==='freeze'){const ice=(kind==='ice')===(ph==='b');n=12;
  if(ice){for(let i=0;i<12;i++){const c=i%4,r=Math.floor(i/4);s+=h2o(33+c*28,34+r*29,7.4,(c+r)%2?180:0)}}
  else{for(let i=0;i<12;i++){s+=h2o(26+(i%4)*30+R()*12,28+Math.floor(i/4)*28+R()*12,7.4,R()*360)}}}
 else if(kind==='sugar'||kind==='salt'){n=12;const salt=kind==='salt';
  for(let i=0;i<8;i++)s+=h2o(24+(i%4)*32+R()*8,34+Math.floor(i/4)*44+R()*14,6.4,R()*360);
  for(let i=0;i<4;i++){const x=ph==='b'?(i%2?102:88)+2:26+R()*98,y=ph==='b'?(i<2?34:48)+2:34+R()*70;s+=salt?nacl(x,y,6):sugarP(x,y,7)}}
 else if(kind==='wax'){n=10;const liq=ph==='b';for(let i=0;i<10;i++){if(liq){s+=waxP(26+R()*96,26+R()*80,6,R()*180)}else{const c=i%3,r=Math.floor(i/3);s+=waxP(40+c*34+(r%2)*6,62+r*14,6,0)}}}
 else if(kind==='etoh'){n=6;for(let i=0;i<6;i++){if(ph==='b'){s+=etoh(42+i%3*30,86+Math.floor(i/3)*16,3.4,R()*40-20)}else{s+=etoh(24+R()*100,30+R()*74,3.4,R()*360)}}}
 else if(kind==='boil'){n=12;for(let i=0;i<12;i++){if(ph==='b'||i<8){const j=ph==='b'?i:i;s+=h2o(26+(j%4)*31+R()*6,54+Math.floor(j/4)*19+R()*4,6.4,R()*360)}else{s+=h2o(26+(i-8)*32,20+R()*6,6.4,R()*360);out++}}
  s+=`<path d="M10,40 H140" stroke="#caa04c" stroke-dasharray="4 3" stroke-width="1"/>`}
 else if(kind==='wood'){n=12;if(ph==='b'){for(let i=0;i<4;i++)s+=at('C',30+i*26,78,7.5);for(let i=0;i<4;i++)s+=at('H',30+i*26,96,5);s+=at('O',43,62,6.5)+at('O',95,62,6.5);for(let i=0;i<4;i++)s+=o2(26+i*28,32,6.5,0)}
  else{for(let i=0;i<4;i++)s+=co2(26+i*33,10+(i%2)*12,5.8,R()*30);for(let i=0;i<2;i++)s+=h2o(46+i*58,34,6.2,0);s+=`<ellipse cx="75" cy="102" rx="10" ry="3" fill="#c9c3b8"/>`;out=12}}
 else if(kind==='soda'){n=12;for(let i=0;i<8;i++)s+=h2o(26+(i%4)*31+R()*6,64+Math.floor(i/4)*24+R()*4,6.2,R()*360);for(let i=0;i<4;i++){if(ph==='b')s+=co2(30+i*30,52+(i%2)*38,5.2,R()*60);else s+=co2(28+i*32,14+(i%2)*10,5.2,R()*30)}
  s+=`<path d="M10,44 H140" stroke="#caa04c" stroke-dasharray="4 3" stroke-width="1"/>`}
 else if(kind==='steel'){n=8;if(ph==='b'){for(let i=0;i<4;i++)s+=at('Fe',38+i*25,90,8);for(let i=0;i<2;i++)s+=o2(46+i*56,30,6.5,0)}
  else{for(let i=0;i<4;i++){s+=at('Fe',38+i*25,90,8)+at('O',38+i*25,74,6.5)}inn=4}}
 return {svg:`<svg viewBox="0 0 ${W} ${H}">${box}${s}${kind==='steel'||(kind==='wood'&&ph==='b')?`<text x="12" y="22" font-size="8" fill="#caa04c" font-family="sans-serif">空気</text>`:''}${(kind==='wood'||kind==='boil'||kind==='soda')&&ph==='a'?`<text x="12" y="${kind==='wood'?52:40}" font-size="8" fill="#caa04c" font-family="sans-serif">外へ出た</text>`:''}</svg>`,n,out,inn}}
function peep(){const st=CUR.st;const b=peepSVG(st.peep,'b'),a=peepSVG(st.peep,'a');
 let cnt;
 if(st.peep==='soda')cnt=`水の中の二酸化炭素の分子：<b>4 → 0</b>　外へ出た：<b>4</b>`;
 else if(st.peep==='boil')cnt=`容器の中の水の粒：<b>12 → 8</b>　外へ出た：<b>4</b>`;
 else if(st.peep==='wood')cnt=`皿の上の粒：へった　<b>二酸化炭素・水</b>になって空気中へ`;
 else if(st.peep==='steel')cnt=`鉄原子：<b>4 → 4</b>　結び付いた酸素原子：<b>+4</b>`;
 else cnt=`粒の数：<b>${b.n} → ${a.n}</b>　（出入り 0）`;
 $('ctrl').innerHTML=`<div class="panel"><h3>🔮 水晶玉の中の粒</h3><div class="peep"><div class="pv"><b>変化の前</b>${b.svg}</div><div class="pv"><b>変化の後</b>${a.svg}</div></div>
 <div class="cnt" style="margin-top:6px">${cnt}</div>
 <div class="small" style="margin-top:4px">${st.peep==='sugar'?'※砂糖・ロウは、中1で学んだ「1種類の粒」として描いている。':st.peep==='etoh'?'※エタノールの分子：炭素2・水素6・酸素1。':''}</div></div>
 ${st.rule&&!S.ruleDone?'<button class="btn wide act" id="bRule">✦ 見つけた決まりを記す</button>':`<button class="btn wide act" id="bNext">次の天秤へ ▶</button>`}`;
 if($('bRule'))$('bRule').onclick=()=>{sfx.tap();ruleStep()};
 if($('bNext'))$('bNext').onclick=()=>{sfx.tap();afterStage()};
}
function afterStage(){const st=CUR.st;if(st.measure&&!CUR.numDone)return numStep();startStage(S.stage+1)}

function ruleStep(){const opts=shuffle([['物質（粒）が外へ出ていったり、外から入ってきたりしたとき',1],['見た目や体積が大きく変わったとき',0],['温度が上がったり下がったりしたとき',0],['液体が固体になったとき',0]]);

 document.querySelectorAll('.rcard').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.k];
  if(o[1]){document.querySelectorAll('.rcard').forEach(x=>x.disabled=true);b.classList.add('ok');S.ruleDone=true;S.score+=300;hud();save();sfx.fanfare();confetti(90);earn(30,'rule',b);banner('決まりを見つけた！','出入りがなければ、質量は変わらない');
   setTimeout(()=>{$('ctrl').insertAdjacentHTML('beforeend',`<div class="result ok"><div class="hd">占いの館の決まり</div>物質（粒）の<b>出入りがなければ</b>、見た目や体積が変わっても<b>質量は変わらない</b>。</div><button class="btn wide act" id="bNext">次の天秤へ ▶</button>`);$('bNext').onclick=()=>{sfx.tap();afterStage()}},500)}

const LID={ice:'閉じた',freeze:'閉じた',sugar:'開いた',salt:'開いた',wax:'開いた',etoh:'閉じた',soda:'開けた',boil:'開いた',wood:'開いた',steel:'開いた'};

   if(TAS.combo===5||TAS.combo===10){const key='c'+TAS.combo;if(!S.taEarn[key]){S.taEarn[key]=true;earn(15,'hit',b)}banner(TAS.combo+'連続！')}}
  else{TAS.combo=0;sfx.miss();b.style.background='#f7dcd6'}

 $('msg').innerHTML='混ぜた後は、何をのせてはかる？';
 $('ctrl').innerHTML=`<div class="qline">⚖️ 混ぜた後：どうはかる？</div><div class="rcards">${opts.map((o,k)=>`<button class="rcard" data-k="${k}">${o.t}</button>`).join('')}</div>`;
 let tried=tried0;
 document.querySelectorAll('.rcard').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.k];if(o.ok){b.classList.add('ok');sfx.hit(2);if(!tried){earn(10,'first-try',b);S.score+=200;hud()}SEAL.method=o;setTimeout(sealTilt,700)}
  else{tried=true;b.classList.add('ng');b.disabled=true;sfx.miss();$('msg').innerHTML='<b style="color:#ffb3a8">前と後で、のせる物をそろえよう。</b>'}})}
function sealTilt(){$('msg').innerHTML='混ぜると<b>白い沈殿</b>ができる。<br>天秤はどうなる？（結果は学校で）';
 $('ctrl').innerHTML=`<div class="qline">🔮 封印する予言</div><div class="tilts">${['down','even','up'].map(d=>`<button class="tilt" data-d="${d}">${tiltIcon(d)}${DIRT[d].replace('（','<br>（')}</button>`).join('')}</div>`;
 document.querySelectorAll('.tilt').forEach(b=>b.onclick=()=>{sfx.pick();SEAL.tilt=b.dataset.d;placeMarker(SEAL.tilt);document.querySelectorAll('.tilt').forEach(x=>x.classList.toggle('sel',x===b));setTimeout(sealReason,260)})}
function sealReason(){const opts=shuffle(SEAL_REASONS);
 $('ctrl').innerHTML=`<div class="qline">🃏 根拠のカード（当たり外れはまだ決まらない）<br><span class="small">予言：${DIRT[SEAL.tilt]}</span></div><div class="rcards">${opts.map((o,k)=>`<button class="rcard" data-k="${k}">${o.t}</button>`).join('')}</div><button class="btn ghost wide act" id="bBack">← 予言をえらび直す</button>`;
 document.querySelectorAll('.rcard').forEach(b=>b.onclick=()=>{sfx.pick();SEAL.reason=opts[+b.dataset.k];sealConfirm()});
 $('bBack').onclick=()=>{sfx.tap();placeMarker(null);sealTilt()}}
function sealConfirm(){
 $('msg').innerHTML='<b>長押し</b>で封印。<br>一度封印すると、書きかえられない。';
 $('ctrl').innerHTML=`<div class="result" style="text-align:left"><div class="hd" style="font-size:18px">封印する予言</div>
 <b>水溶液</b>：${esc(SEAL.pair.t)}<br><b>予言</b>：${DIRT[SEAL.tilt]}<br><b>根拠</b>：${esc(SEAL.reason.t)}<br><b>はかり方</b>：${esc(SEAL.method.t)}</div>
 <button class="hold act" id="holdB"><i id="holdI"></i><span style="position:relative">長押しで 封印の蝋をたらす</span></button><button class="btn ghost wide act" id="bBack">← 根拠をえらび直す</button>`;
 $('bBack').onclick=()=>{sfx.tap();sealReason()};
 const b=$('holdB');let t0=0,iv=0;
 const stop=()=>{clearInterval(iv);iv=0;if(!b.disabled)$('holdI').style.width='0'};
 b.addEventListener('pointerdown',e=>{e.preventDefault();ac();t0=Date.now();clearInterval(iv);iv=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/900);$('holdI').style.width=(k*100)+'%';if(Math.random()<.4)sfx.tick();if(k>=1){clearInterval(iv);b.disabled=true;doSeal()}},40)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop))}
function doSeal(){
 const rec={v:1,koma:KOMA,game:GAME_ID,at:Date.now(),name:S.name||'',pair:{id:SEAL.pair.id,t:SEAL.pair.t},
  slots:{tilt:{id:SEAL.tilt,t:DIRT[SEAL.tilt],reason:SEAL.reason.t},reason:{id:SEAL.reason.id,t:SEAL.reason.t},method:{id:SEAL.method.id,t:SEAL.method.t}}};
 try{localStorage.setItem(SEAL_KEY,JSON.stringify(rec))}catch(e){}
 S.sealed=true;S.seal=rec;S.score+=500;hud();save();
 earn(10,'predict',$('holdB'));
 sfx.seal();flash();confetti(120);banner('封印完了！','開けるのは、学校の実験のあと');
 showSealed(true)}
function showSealed(fresh){const sl=S.seal;
 $('msg').innerHTML='天秤には<b>封印の布</b>がかけられた。';
 const svg=$('balSvg');if(svg){svg.insertAdjacentHTML('beforeend',`<g><path d="M22,44 Q180,22 338,44 L342,202 Q180,214 18,202Z" fill="#6d1f2c" stroke="#dcb660" stroke-width="2" opacity=".96"/><circle cx="180" cy="122" r="28" fill="#c0303f" stroke="#fbe7b0" stroke-width="2"/><text x="180" y="134" font-size="32" text-anchor="middle" fill="#fbe7b0" font-family="serif" font-weight="800">封</text></g>`)}
 $('ctrl').innerHTML=`<div class="result" style="text-align:center"><div class="sealmark ${fresh?'pop':''}">封</div><b>予言</b>：${esc(sl.slots.tilt.t)}<br><span class="small" style="color:#6b4a2a">根拠：${esc(sl.slots.reason.t)}</span>
 <p style="font-size:14px;line-height:1.6;margin:8px 0 0">開けるのは、学校で<b>沈殿ができる反応</b>の質量をはかったあと。<br>次の回「にげる気体をふさげ」の最初に開封する。</p></div>
 <button class="btn wide act" id="bFin">本編クリアへ ▶</button>`;
 $('bFin').onclick=()=>{sfx.tap();finishMain()}}

/* ================= クリア ================= */
function finishMain(){S.cleared=true;save();sfx.fanfare();confetti(140);
 const go=()=>{renderClear();show('clear')};
 if(window.Zukan&&Zukan.mainClear&&!S.mainDone){S.mainDone=true;save();setTimeout(()=>{try{Zukan.mainClear({onClose:go})}catch(e){go()}},700)}else go()}
const REG=STAGES.filter(s=>!s.ta&&!s.seal).length;
function rankName(){const h=S.hits;return h>=10?'てんびんの大賢者':h>=8?'てんびんの賢者':h>=5?'一人前の予言者':h>=3?'見習い予言者':'占いの館の新入り'}
function renderClear(){const sl=S.seal&&S.seal.slots;
 $('clearBox').innerHTML=`<div style="text-align:center;margin-top:18px"><div class="kicker">本編クリア</div><div class="logo" style="font-size:38px">${rankName()}</div></div>
 <div class="tcard"><b>予言の記録</b><br>クリアタイム：${fmtT(S.elapsed)}<br>大当たり（予言＋根拠）：${S.hits} / ${REG}<br>最大コンボ：${S.maxCombo}　百連の最高：${S.taBest}問<br>占い力：${S.score.toLocaleString()}</div>
 ${sl?`<div class="tcard"><b>封印した予言</b>（コマ27で開封）<br>${esc(S.seal.pair.t)}<br>予言：${esc(sl.tilt.t)}<br>根拠：${esc(sl.reason.t)}</div>`:''}
 <div class="panel"><h3>占いの館の決まり</h3>${bookTable(true)}<p style="margin:6px 0 0;font-size:14px">物質の<b>出入りがなければ</b>、見た目や体積が変わっても質量は変わらない。</p></div>
 <div class="tbtns"><button class="btn wide" id="cT">📝 確認テストへ</button><button class="btn ghost wide zk hidden" id="cB">📖 図鑑</button><button class="btn ghost wide" id="cS">天秤をえらんで遊ぶ</button><button class="btn ghost wide" id="cH">🏠 タイトルへ</button></div>`;
 zkBtns();$('cT').onclick=()=>{sfx.tap();startTest()};$('cB').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();$('cS').onclick=()=>{sfx.tap();stageMenu()};$('cH').onclick=()=>{sfx.tap();initTitle()}}
function stageMenu(){overlay(`<h2>どの天秤から？</h2><div class="tbtns">${STAGES.map((s,i)=>`<button class="btn ghost wide" style="font-size:15px" data-i="${i}">${i+1}. ${s.name}</button>`).join('')}<button class="btn wide" id="oT">📝 確認テスト</button><button class="btn ghost wide" id="oX">とじる</button></div>`);
 document.querySelectorAll('#ovc [data-i]').forEach(b=>b.onclick=()=>{closeOv();startStage(+b.dataset.i)});$('oT').onclick=()=>{closeOv();startTest()};$('oX').onclick=closeOv}

/* ================= 確認テスト ================= */
let T=null;
function startTest(){if(!window.Quiz){overlay('<h2>問題データが読み込まれていません</h2><button class="btn wide" onclick="document.getElementById(\'ov\').classList.add(\'hidden\')">とじる</button>');return}T={qs:Quiz.test(),i:0,ans:[],cur:null};show('test');renderTest()}
function renderTest(){const q=T.qs[T.i];T.cur=q.t==='order'?[]:'';
 let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="pill">📝 確認テスト</span><b>第 ${T.i+1} 問 / ${T.qs.length}</b></div>
  <div class="prog">${T.qs.map((_,i)=>`<i class="${i<T.i?'on':''}"></i>`).join('')}</div><div class="tq">${q.q}</div>${q.fig?`<div class="tfig">${q.fig}</div>`:''}`;
 if(q.t==='choice')h+=q.shown.map((c,k)=>`<button class="choice" data-k="${k}">${c}</button>`).join('');
 else if(q.t==='num')h+=`<div class="numshow"><span id="numv">　</span> <small>${esc(q.unit||'')}</small></div><div class="keys">${['7','8','9','4','5','6','1','2','3','0','.','⌫'].map(k=>`<button data-n="${k}">${k}</button>`).join('')}</div><button class="btn wide" style="margin-top:10px" id="tOk">決定</button>`;
 else h+=`<p class="small">上から順になるように、タップして並べよう（もう一度タップで外す）</p><div class="ordsel" id="ordSel"></div>${q.shown.map((c,k)=>`<button class="choice" data-o="${k}">${c}</button>`).join('')}<button class="btn wide" style="margin-top:8px" id="tOk" disabled>決定</button>`;
 $('testBox').innerHTML=h;
 const next=a=>{T.ans.push(a);sfx.tap();setTimeout(()=>{T.i++;if(T.i<T.qs.length)renderTest();else finishTest()},180)};
 if(q.t==='choice')document.querySelectorAll('#testBox .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#testBox .choice').forEach(x=>x.disabled=true);b.style.boxShadow='0 0 0 3px #d23d4f inset';next(q.shown[+b.dataset.k])});
 else if(q.t==='num'){document.querySelectorAll('#testBox [data-n]').forEach(b=>b.onclick=()=>{sfx.tap();const k=b.dataset.n;if(k==='⌫')T.cur=T.cur.slice(0,-1);else if(T.cur.length<8)T.cur+=k;$('numv').textContent=T.cur||'　'});$('tOk').onclick=()=>{if(!T.cur)return;next(T.cur)}}
 else{const upd=()=>{$('ordSel').innerHTML=T.cur.map((k,n)=>`<div data-r="${n}">${n+1}. ${q.shown[k]}</div>`).join('');
   document.querySelectorAll('#testBox [data-o]').forEach(b=>b.style.display=T.cur.includes(+b.dataset.o)?'none':'block');
   document.querySelectorAll('#testBox [data-r]').forEach(d=>d.onclick=()=>{T.cur.splice(+d.dataset.r);sfx.tap();upd()});$('tOk').disabled=T.cur.length!==q.shown.length};
  document.querySelectorAll('#testBox [data-o]').forEach(b=>b.onclick=()=>{sfx.tap();T.cur.push(+b.dataset.o);upd()});$('tOk').onclick=()=>{if(T.cur.length!==q.shown.length)return;next(T.cur.map(k=>q.shown[k]))};upd()}
}
function finishTest(){const qs=T.qs,answers=T.ans;
 const review=Quiz.review(qs,answers),marks=review.map(r=>r.ok),score=marks.filter(Boolean).length;
 const name=S.name||window.PLAYER_NAME||'';
 let sealRec=S.seal;if(!sealRec){try{sealRec=JSON.parse(localStorage.getItem(SEAL_KEY)||'null')}catch(e){}}
 const records=TEST_ONLY?[['モード','確認テストだけ']]:[['クリアタイム',fmtT(S.elapsed)],['大当たり（予言＋根拠）',S.hits+' / '+REG],['最大コンボ',String(S.maxCombo)],['封印した予言',sealRec?sealRec.slots.tilt.t+'（根拠：'+sealRec.slots.reason.t+'）':'なし']];
 sfx.fanfare();
 const rec=SubmitCard.show({gameId:GAME_ID,grade:'chu2',koma:[KOMA],unit:'中2理科　化学変化と原子・分子　第26回',
  game:'てんびんの予言 ～沈殿ができる反応の質量～'+(TEST_ONLY?'（確認テストのみ）':''),name,score,total:qs.length,marks,records,review},()=>renderResult(score,qs.length));
 T.rec=rec;renderResult(score,qs.length)}
function renderResult(score,total){show('test');
 $('testBox').innerHTML=`<div class="tcard" style="text-align:center;margin-top:16px"><span class="pill" style="color:#fbe7b0;background:#5d1824">確認テスト</span>
  <div class="bigscore" style="color:#7a2030">${score}<span style="font-size:22px"> / ${total}</span></div>
  <p style="font-weight:800">${score===total?'満点！ 天秤の声が聞こえている。':score>=Math.ceil(total*.7)?'合格ライン突破！':'解説を読んで、もう一度ためそう。'}</p></div>
  <div class="tbtns"><button class="btn wide" id="rCard">📝 提出カードを表示</button><button class="btn ghost wide" id="rRetry">もう一度テストを解く</button>
  ${TEST_ONLY?'':'<button class="btn ghost wide zk hidden" id="rBook">📖 図鑑</button><button class="btn ghost wide" id="rTitle">🏠 タイトルへ</button>'}</div>`;
 zkBtns();$('rCard').onclick=()=>{if(T&&T.rec&&SubmitCard.reopen)SubmitCard.reopen(T.rec)};$('rRetry').onclick=()=>startTest();
 if(!TEST_ONLY){$('rBook').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();$('rTitle').onclick=()=>initTitle()}}

/* ================= タイトル ================= */
function initTitle(){show('title');zkBtns();
 $('tBal').innerHTML=balanceSVG('ice');setAngle(0);placeMarker('even');
 $('nameIn').value=S.name||window.PLAYER_NAME||'';if(window.PLAYER_NAME)$('nameBox').classList.add('hidden');
 $('bCont').classList.toggle('hidden',!S.started);
 $('bCont').textContent=S.cleared?'つづきから（確認テスト・天秤えらび）':`つづきから（第${Math.min(S.stage+1,STAGES.length)}の天秤）`}
function takeName(){const v=$('nameIn').value.trim();S.name=v||window.PLAYER_NAME||S.name||'';save()}
$('bStart').onclick=()=>{ac();sfx.tap();takeName();
 if(S.started&&S.stage>0){overlay(`<h2>はじめから遊ぶ？</h2><p>予言の記録と封印はそのまま残る。</p><div class="tbtns"><button class="btn wide" id="oY">はじめから</button><button class="btn ghost wide" id="oN">やめる</button></div>`);$('oY').onclick=()=>{closeOv();go0()};$('oN').onclick=closeOv}else go0()};
function go0(){S.combo=0;startClock();banner('変化の前に 予言せよ！','予言＋根拠がそろえば大当たり');startStage(0)}
$('bCont').onclick=()=>{ac();sfx.tap();takeName();startClock();
 if(S.cleared){overlay(`<h2>どこから遊ぶ？</h2><div class="tbtns"><button class="btn wide" id="oT">📝 確認テスト</button><button class="btn ghost wide" id="oC">クリア画面</button><button class="btn ghost wide" id="oS">天秤をえらぶ</button><button class="btn ghost wide" id="oX">とじる</button></div>`);
  $('oT').onclick=()=>{closeOv();startTest()};$('oC').onclick=()=>{closeOv();renderClear();show('clear')};$('oS').onclick=()=>{closeOv();stageMenu()};$('oX').onclick=closeOv}
 else startStage(Math.min(S.stage,STAGES.length-1))};
$('bBook1').onclick=()=>window.Zukan&&Zukan.openBook&&Zukan.openBook();
$('bHome').onclick=()=>{sfx.tap();if(TAS&&TAS.iv)clearInterval(TAS.iv);save();initTitle()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
setMute();
if(window.PLAYER_NAME&&!S.name)S.name=window.PLAYER_NAME;
if(TEST_ONLY){S.name=window.PLAYER_NAME||S.name||'';startTest()}else initTitle();
window.__TY={S:()=>S,start:startStage,test:startTest,seal:()=>SEAL,cur:()=>CUR,finish:finishMain};
})();
</script>
</body>
</html>
