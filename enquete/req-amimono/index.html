<title>毛糸の化学工房 ～元素記号・化学式・化学反応式～</title>
<!-- 設計メモ
 生徒の希望: 「編み物などハンドメイドが出てくるゲームがやってみたいです」（アンケート1）
 範囲: 教科書ワーク p.94〜95「化学変化と原子・分子」1〜6だけ
 名簿の型: 05 箱庭の模型屋（やさしい・触った物から問いが始まる・物ごとに違う置く音・正解は現象で返す）を土台に、手芸の材料だけで組む
 世界とメタファー: 原子＝毛糸玉（元素ごとに色。金属はラメ糸の筋、気体の単体はモヘアのけば）
   1 刺しゅうワッペン＝元素記号と名前 ／ 2 あみぐるみ＝原子を編みつないだ物質（モデルと化学式）
   3 編み図＝化学反応式（毛糸は消えないし増えない＝左右で原子の数が同じ。係数＝同じモチーフを何個編むか）
 配色: 地＝カッティングマットの緑 #3f6a4e ／ 進み具合＝メジャーの黄 #f0c43a ／ 「ここ」「大事」＝しつけ糸の赤 #c8372d（1色1意味）
 書体: 本文 ヒラギノ丸ゴ ／ 元素記号・化学式 Avenir Next（数字は等幅）
 音: Web Audio で合成。毛糸玉を置く音は元素ごとに lowpass の周波数を変える。刺しゅうはチクチク、編み棒はカチカチ
 演出: 考えている間は何も動かない。答えた後に、刺しゅう・転がる毛糸玉・左から右へ移る毛糸（原子の組みかえ）
 罰: 共通の適当プレイ番（guard.js）。罰1回ごとに「おまけ注文」が1枚増える（もう1問）
-->

<script>/*@GUARD_BEGIN*/
/* ==========================================================
   BGMエンジン（全ゲーム共通）  ─ BGM
   ─ 2026-10-03 オーナー指示「BGMも本気出していいよ。全力でやっていこう」から作った共通部品
   ─ ゲームの index.html の印の外に window.GAME_FX = { bgm:{…} } を書くと、そのゲーム専用の曲が鳴る。
     GAME_FX.bgm が無いゲームでは何も鳴らさない（ボタンも出さない）。書き方は _shared/fx-README.md
   ─ WebAudio だけで鳴らす（外部ファイル・外部サイトなし）。曲は1小節ずつ先読みで組み立てる
       ・曲のセクション（intro／A／B／S＝サビ／T＝ピンチ／Q＝静か）と form（流れる順）
       ・ドラム（キック・スネア・ハット・タム・シンバル・太鼓・ブラシ…を合成）／ベース／和音パッド／
         刻み（伴奏）／アルペジオ／メロディ／副旋律。テンポ・調・音階・拍子・スウィング・音色はデータで決める
   ─ ゲームの場面に合わせて強さを変える
       BGM.mood('normal')   ふつう
       BGM.mood('tense')    ピンチ・時間切れ間近（T セクションへ。無ければサビの和音で急かす）
       BGM.mood('calm')     静か（確認テスト中は自動でこれ）
       BGM.mood('clear')    クリアのジングル（Zukan.mainClear で自動）→ そのあと ふつう
       BGM.level(0〜3)      コンボなどで楽器を足す・引く（1がふつう）
       BGM.duck(ms)         一瞬小さくする（適当プレイ番の罰の瞬間は自動）
   ─ iOS Safari の自動再生の決まりに合わせ、最初のタップで鳴り始める
   ─ 音量・オンオフのボタン（左下・指で押せる大きさ）。状態は localStorage（rika-bgm:v1）に保存。初期音量は「小」
     （教室で30台が同時に鳴る前提）。図鑑の「音を消す」（rika-zukan:profile:v1 の mute）にも従う
   ─ このファイルは build / sync_one.py が各ゲームの ZUKAN（または GUARD）の印の間へ同期する（ゲーム側で直接いじらない）
   ─ 外への送信はしない
   ========================================================== */
(function(){
  if (window.BGM) return;

  /* ---------------- 保存（音量・オンオフ） ---------------- */
  var KEY = 'rika-bgm:v1';
  var VOL = [0, .17, .32, .55];          /* 小・中・大 */

  }
  function pay(kind, n){
    if(typeof CFG.onPenalty === 'function'){ try{ CFG.onPenalty(kind, n); }catch(e){} return; }
    if(hasZukan()) S.debt += n;
  }
  function gamePenalty(kind, base){
    ensureLoaded();
    if(kind === 'guess') S.game.guess++; else S.game.mash++;
    S.game.sus++; S.game.streak = 0;
    var n = gameCost(base);
    pay(kind, n); save();
    pen(kind, costText(n), hasZukan() && typeof CFG.onPenalty !== 'function' ? 'つぎに もらう かけらから 引かれるよ' : '');
    emit(kind, {cost:n});
  }
  function testPenalty(kind){
    S.test[kind]++;
    var extra = '確認テストの点 −1・提出カードが「ひび入り」になる';
    if(kind === 'skip'){
      if(S.test.skip % 2){ note('<b>とばし読み</b>　問題と解説、ちゃんと読んだ？ <em>あと1回で −1点</em>', 2400); emit('skip'); return; }
    }
    pen(kind, '−1点', extra);
    emit(kind);
  }

  /* ---------------- 連打 ---------------- */
  function excluded(t){
    return !t || !t.closest || !!t.closest('#sc-ov,.zk-ov,.tk-pen,.tk-chk .tk-ch,[data-mash-ok]');
  }
  function isButton(t){
    return !!t.closest('button,[role=button],a[href],input[type=button],input[type=submit],label,summary,.btn');
  }
  function onClick(e){
    var t = e.target, at = now();
    if(at < lockUntil){ e.preventDefault(); e.stopPropagation(); return; }
    if(excluded(t)) return;
    if(S.inTest && at - Math.max(S.lastAt, S.t0) > 180000) S.inTest = false; /* テストを途中でやめて本編へもどった */
    clicks.push(at); if(clicks.length > 8) clicks.shift();
    if(gateBlock(e)) return;
    if(t.closest('canvas')) return;
    if(!S.inTest && (!CFG.mash || !isButton(t))) return;
    taps.push(at);
    while(taps.length && at - taps[0] > CFG.mashMs) taps.shift();
    if(taps.length >= CFG.mashN){
      taps = []; e.preventDefault(); e.stopPropagation();
      if(S.inTest) testPenalty('mash'); else gamePenalty('mash', CFG.debtMash);
    }
  }

  /* ---------------- カラオケ読み ---------------- */
  function karaoke(el, cps){
    var chars = [];
    (function walk(node){
      var kids = [].slice.call(node.childNodes);
      for(var i=0;i<kids.length;i++){
        var c = kids[i];
        if(c.nodeType === 3){
          var txt = c.nodeValue; if(!txt) continue;
          var frag = document.createDocumentFragment();
          for(var j=0;j<txt.length;j++){
            var ch = txt.charAt(j), sp = document.createElement('span');
            sp.className = 'tk-kc'; sp.textContent = ch; frag.appendChild(sp);
            var ms = /\s/.test(ch) ? 30 : 1000 / cps;
            if(/[、，,]/.test(ch)) ms += 200; if(/[。！？!?]/.test(ch)) ms += 350;
            chars.push({sp:sp, ms:ms});
          }
          c.parentNode.replaceChild(frag, c);
        }else if(c.nodeType === 1 && !/^(SCRIPT|STYLE|SVG|svg|CANVAS|IMG|BUTTON|INPUT|TEXTAREA|SELECT)$/.test(c.tagName)){
          if(c.tagName === 'BR' && chars.length) chars[chars.length-1].ms += 220;
          walk(c);
        }
      }
    })(el);
    if(!chars.length) return null;
    el.classList.add('tk-kara');
    var total = 0; for(var k=0;k<chars.length;k++) total += chars[k].ms;
    var i = 0, timer = 0, stopped = false;
    function step(){
      if(stopped || !el.isConnected) return;
      if(i > 0) chars[i-1].sp.className = 'tk-kc lit';
      if(i >= chars.length) return;
      chars[i].sp.className = 'tk-kc now';
      var ms = chars[i].ms; i++;
      timer = setTimeout(step, ms);
    }
    step();
    return {total:total, stop:function(){ stopped = true; clearTimeout(timer); chars.forEach(function(c){ c.sp.className = 'tk-kc lit'; }); }};
  }
  /* 解説の文が入っている、いちばん小さい見えている要素を探す */
  function findTextEl(text){
    var key = strip(text); if(key.length < 6) return null;
    var head = key.slice(0, Math.min(16, key.length));
    var all = document.body.getElementsByTagName('*'), best = null, bestLen = 1e9;
    for(var i=0;i<all.length;i++){
      var e = all[i];
      if(/^(SCRIPT|STYLE|BUTTON|svg|SVG|HTML|BODY)$/.test(e.tagName) || e.closest('#sc-ov,.zk-ov,.tk-note,.tk-pen,svg')) continue;
      var t = strip(e.textContent);
      if(t.length >= bestLen || t.indexOf(head) < 0) continue;
      var r = e.getBoundingClientRect(); if(r.width < 4 || r.height < 4) continue;
      best = e; bestLen = t.length;
    }
    /* 見出し（「もう一歩」「正解：…」）ごと読ませるため、親が解説とほぼ同じ大きさなら親まで上がる */
    while(best && best.parentElement && best.parentElement !== document.body){
      var pl = strip(best.parentElement.textContent).length;
      if(pl > key.length * 1.6 + 40 || best.parentElement.querySelector('button,input,select,canvas')) break;
      best = best.parentElement;
    }
    return best;
  }

  /* ---------------- 解説の「つぎへ」を読み終わるまで止める ---------------- */
  var NEXT_RE = /^(▶|→|＞|>)?\s*(つぎ|次|NEXT|Next|next|答え合わせ|こたえあわせ|結果|けっか)/;
  function textOf(b){ return String(b.textContent || b.value || '').trim(); }
  function visible(el){
    if(!el || !el.isConnected || el.disabled) return false;
    var r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return false;
    var cs = getComputedStyle(el); return cs.visibility !== 'hidden' && cs.display !== 'none' && +cs.opacity > 0.05;
  }
  function nextButtons(){
    var out = [], bs = document.querySelectorAll('button,[role=button],input[type=button]');
    for(var i=0;i<bs.length;i++){ var b = bs[i]; if(excluded(b)) continue; if(NEXT_RE.test(textOf(b)) && visible(b)) out.push(b); }
    return out;
  }
  function gate(btn, opt){
    if(!btn) return;
    opt = opt || {};
    var ms = opt.ms, el = opt.el || null, kara = null;
    if(ms == null){
      if(!el && opt.text) el = findTextEl(opt.text);
      if(el) kara = karaoke(el, opt.ok ? CFG.readCpsOk : CFG.readCps);
      if(kara) ms = kara.total + 300;
      else { var n = strip(opt.text || '').length; ms = n ? n / (opt.ok ? CFG.readCpsOk : CFG.readCps) * 1000 : (opt.ok ? 700 : 1200); }
    }
    ms = Math.min(CFG.readMax, ms);
    if(ms <= 0) return;
    ensureCSS();
    var g = {b:btn, until:now() + ms, tries:0, kara:kara};
    gates.push(g);
    btn.classList.add('tk-gated'); btn.style.setProperty('--tk-ms', (ms/1000) + 's');
    g.timer = setTimeout(function(){ ungate(g, true); }, ms);
  }
  function ungate(g, ready){
    var i = gates.indexOf(g); if(i >= 0) gates.splice(i, 1);
    clearTimeout(g.timer);
    if(g.kara) g.kara.stop();
    if(g.b){ g.b.classList.remove('tk-gated'); if(ready && g.b.isConnected){ g.b.classList.add('tk-ready'); setTimeout(function(){ g.b.classList.remove('tk-ready'); }, 2100); } }
  }
  function gateBlock(e){
    if(!gates.length) return false;
    var t = e.target, at = now();
    for(var i=gates.length-1;i>=0;i--){
      var g = gates[i];
      if(!g.b.isConnected){ ungate(g); continue; }
      if(at >= g.until){ ungate(g, true); continue; }
      if(g.b === t || g.b.contains(t)){
        e.preventDefault(); e.stopPropagation();
        g.tries++;
        if(g.tries >= 4){
          g.tries = 0;
          if(S.inTest){ S.test.skip += 2; pen('skip', '−1点', '確認テストの点 −1・提出カードが「ひび入り」になる'); emit('skip'); }
          else gamePenalty('skip', CFG.debtMash);
        }else{
          note('📖 光る文字を 目で追って 読もう　<em>あと ' + Math.ceil((g.until - at) / 1000) + ' 秒</em>', 1500);
        }
        return true;
      }
    }
    return false;
  }

  /* ---------------- 確認テスト ---------------- */
  function startTest(){
    S.inTest = true; S.t0 = now(); S.lastAt = 0; S.seen = {};
    S.test = {guess:0, mash:0, skip:0, n:0};
    if(!S.told){
      S.told = true;
      setTimeout(function(){
        note('📝 <em>確認テストのルール</em><br>● 問題が出てすぐ（2.5秒以内）の<b>まちがい</b> → あてずっぽう <b>−1点</b><br>● <b>連打</b>（1秒に7回） → <b>−1点</b><br>● 解説を<b>とばす</b>（光り終わる前に何度も押す・すぐ次を答える） → <b>−1点</b><br>罰があると 提出カードが「<b>ひび入り</b>」になる。わからない問題は、考えてから答えよう。', 5600);
      }, 350);
    }
  }
  function prevClickBefore(at){
    /* 答えを決めたクリック（いまから0.4秒以内）の、ひとつ前のクリック＝「つぎへ」を押した時刻 */
    var i = clicks.length - 1;
    if(i >= 0 && at - clicks[i] < 400) i--;
    return i >= 0 ? clicks[i] : 0;
  }
  function onTestAnswer(q, ok){
    var key = q && (q.id || q.q) ? String(q.id || strip(q.q)) : '#' + S.test.n;
    if(S.seen[key]) return;
    S.seen[key] = 1;
    var at = now(), gap = at - (S.lastAt || S.t0);
    S.lastAt = at; S.test.n++;
    var think = gap;
    if(!q || q.t === 'choice' || q.t == null){ var p = prevClickBefore(at); if(p && p > (S.t0 - 50)) think = Math.min(gap, at - p); }
    if(!ok && think < CFG.guessMs) testPenalty('guess');
    else if(S.test.n > 1 && gap < CFG.skipMs) testPenalty('skip');
    else if(ok && think >= CFG.guessMs) praise();
    if(!ok) S.game.streak = 0;
    /* 解説をカラオケ読みさせ、新しく出た「つぎへ」を読み終わるまで止める */
    var ex = q ? (q.ex || q.exp || '') : '';
    var before = nextButtons();
    setTimeout(function(){
      var after = nextButtons(), fresh = [];
      for(var i=0;i<after.length;i++) if(before.indexOf(after[i]) < 0) fresh.push(after[i]);
      if(!fresh.length) return;
      var ms = null, el = ex ? findTextEl(ex) : null, kara = el ? karaoke(el, ok ? CFG.readCpsOk : CFG.readCps) : null;
      if(kara) ms = kara.total + 300;
      for(var j=0;j<fresh.length;j++) gate(fresh[j], ms != null ? {ms:ms} : ex ? {text:ex, ok:ok, el:null} : {ms: ok ? 700 : 1200});
      if(kara && fresh.length) gates[gates.length-1].kara = kara;
    }, Math.max(40, lockUntil - now() + 40)); /* 罰の札が消えてから読み始める */
  }
  function penalty(){
    return S.test.guess + S.test.mash + Math.floor(S.test.skip / 2);
  }
  function fmtTime(ms){ var s = Math.round(ms/1000); return Math.floor(s/60) + '分' + String(s%60).padStart(2,'0') + '秒'; }

  /* ---------------- 本編の○×（ゲームが Tekitou.answer を呼んだとき） ---------------- */
  function onGameAnswer(ok){
    var at = now(), from = Math.max(S.game.shownAt || 0, S.game.lastAt || 0), think = from ? at - from : 1e9;
    S.game.lastAt = at;
    /* 子どもが押した（離した）直後に決まった正誤だけを数える。時間で自動に進む場面（流れてきた・ぶつかった）の正誤は数えない */
    var byHand = at - lastInputAt < 600;
    if(!byHand) { if(!ok) S.game.streak = 0; return; }
    if(ok) { S.game.wrongs = []; if(think >= CFG.guessMs) praise(); return; }
    S.game.streak = 0;
    S.game.wrongs.push(at);
    while(S.game.wrongs.length && at - S.game.wrongs[0] > CFG.burstMs) S.game.wrongs.shift();
    var fast = think < CFG.guessMs, burst = S.game.wrongs.length >= CFG.burstN;
    if(!(fast || burst)) return;
    S.game.wrongs = [];
    gamePenalty('guess', CFG.debtGuess);
  }

  /* ---------------- ごほうび：考えてから正解したら金の「本物 ×n」 ---------------- */
  function praise(){
    ensureCSS(); if(!document.body) return;
    S.game.streak++;
    var n = S.game.streak, d = document.createElement('div');
    var x = lastPt[0] || innerWidth / 2, y = lastPt[1] || innerHeight * .4;
    d.className = 'tk-real' + (n >= 5 ? ' big' : '');
    d.style.left = Math.max(70, Math.min(innerWidth - 70, x)) + 'px'; d.style.top = Math.max(40, y - 30) + 'px';
    d.innerHTML = '✨ 本物' + (n >= 2 ? ' <b>×' + n + '</b>' : '') + (n === 5 ? '<small>じっくり名人！</small>' : n === 10 ? '<small>理屈マスター！</small>' : '');
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1300);
  }
  var lastPt = [0, 0], lastInputAt = 0;
  window.addEventListener('pointerdown', function(e){ lastPt = [e.clientX, e.clientY]; lastInputAt = now(); }, true);
  ['pointerup','click','keydown'].forEach(function(t){ window.addEventListener(t, function(){ lastInputAt = now(); }, true); });

  /* ---------------- まぐれ判定（パズルの手） ---------------- */
  function median(a){ if(!a.length) return 1e9; var b = a.slice().sort(function(x,y){return x-y}); return b[b.length >> 1]; }
  function solved(o){
    o = o || {};
    var mv = S.moves.slice(), n = mv.length, gaps = [];
    for(var i=1;i<n;i++) gaps.push(mv[i] - mv[i-1]);
    S.moves = [];
    var min = +o.min || 0;
    var many = min ? (n >= Math.max(min * 2 + 4, min + 6)) : (n >= 12);
    var lucky = many && median(gaps) < CFG.luckyGapMs;
    if(!lucky){
      if(n && (!min || n <= min + 2)) praise();
      if(o.onResult) try{ o.onResult(true); }catch(e){}
      return false;
    }
    S.game.lucky++; S.game.sus++; S.game.streak = 0;
    emit('lucky', {moves:n, min:min});
    if(o.defer){
      /* アクションの最中は止めない：まぐれを覚えておき、本編クリアのときに理屈チェック */
      note('🔍 <b>まぐれ？</b>　手あたりしだいに さわって 合っただけ かも。<br><em>クリアのときに 理屈チェック</em>が 出るよ', 3000);
      if(o.onResult) try{ o.onResult(false); }catch(e){}
      return true;
    }
    riddle({q:o.q, title:'まぐれ？', sub:'手あたりしだいに さわって 合っただけ かも。<br>理屈が わかっているか 1問で たしかめよう'}).then(function(ok){
      if(o.onResult) try{ o.onResult(ok); }catch(e){}
    });
    return true;
  }

  /* ---------------- 理屈チェック（1問） ---------------- */
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pickQ(){
    try{
      if(!window.Quiz || !Quiz.all) return null;
      var all = Quiz.all().filter(function(q){ return q.t === 'choice' && q.choices && q.choices.length >= 2 && !q.fig; });
      var k = '';
      try{ k = (Zukan._cur.koma || [])[0] || ''; }catch(e){}
      var mine = all.filter(function(q){ return !k || q.koma === k; });
      var pool = mine.length ? mine : all;
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }catch(e){ return null; }
  }
  var riddleOpen = false;
  function riddle(o){
    return new Promise(function(res){
      var q = o.q || pickQ();
      if(!q || riddleOpen || !document.body){ res(true); return; }
      riddleOpen = true; ensureCSS();
      var shown = shuffle(q.choices), t0 = now(), done = false;
      var d = document.createElement('div'); d.className = 'tk-chk';
      d.innerHTML = '<div class="tk-card"><div class="tk-h">🔍 理屈チェック' + (o.title ? '<span>' + esc(o.title) + '</span>' : '') + '</div>' +
        '<p class="tk-sub">' + (o.sub || 'クリアの前に 1問だけ。ちゃんと わかってクリアしたか たしかめよう') + '</p>' +
        '<p class="tk-q"></p><div class="tk-ch"></div><div class="tk-ex"></div><div class="tk-go"></div></div>';
      d.querySelector('.tk-q').textContent = String(q.q || '').replace(/<[^>]*>/g, '');
      var box = d.querySelector('.tk-ch');
      shown.forEach(function(c){
        var b = document.createElement('button'); b.type = 'button'; b.textContent = String(c).replace(/<[^>]*>/g, '');
        b.onclick = function(){
          if(done) return; done = true;
          var ok = c === q.choices[0], think = now() - t0;
          [].forEach.call(box.children, function(x){ x.disabled = true; if(x.textContent === String(q.choices[0]).replace(/<[^>]*>/g, '')) x.className = 'ok'; else if(x === b) x.className = 'ng'; });
          var ex = d.querySelector('.tk-ex'), go = d.querySelector('.tk-go');
          if(ok && think >= CFG.guessMs){
            ex.innerHTML = '<div class="tk-big">本物！ ✨</div>';
            praise(); S.game.sus = 0; S.game.lucky = 0;
            setTimeout(function(){ d.remove(); riddleOpen = false; res(true); }, 1400);
            return;
          }
          ex.innerHTML = (ok ? '<b>正解。でも 早すぎ！</b> 考えてから 答えよう<br>' : '<b>もう一歩</b> 正解：' + esc(String(q.choices[0]).replace(/<[^>]*>/g, '')) + '<br>') + esc(String(q.ex || '').replace(/<[^>]*>/g, ''));
          ensureLoaded();
          var n = CFG.debtLucky; pay('lucky', n); save();
          var nb = document.createElement('button'); nb.type = 'button'; nb.className = 'tk-next'; nb.textContent = 'わかった（' + (costText(n) || 'もう一度 考えよう') + '）';
          nb.onclick = function(){ if(nb.classList.contains('tk-gated')) return; d.remove(); riddleOpen = false; res(false); };
          go.appendChild(nb);
          var kara = karaoke(ex, CFG.readCps);
          gate(nb, {ms: kara ? kara.total + 300 : 2500});
          if(kara && gates.length) gates[gates.length - 1].kara = kara;
        };
        box.appendChild(b);
      });
      document.body.appendChild(d);
    });
  }

  /* ---------------- 共通部品へのつなぎ ---------------- */
  function hookQuiz(){
    var Q = window.Quiz; if(!Q || Q.__tk) return; Q.__tk = 1;
    var test = Q.test, check = Q.check, review = Q.review;
    if(test) Q.test = function(){ var r = test.apply(this, arguments); startTest(); return r; };
    if(check) Q.check = function(q, ans){
      var ok = check.apply(this, arguments);
      if(!S.inReview){ try{ if(S.inTest) onTestAnswer(q, ok); }catch(e){} }
      return ok;
    };
    if(review) Q.review = function(){ S.inReview = true; try{ return review.apply(this, arguments); } finally { S.inReview = false; } };
  }
  function hookCard(){
    var C = window.SubmitCard; if(!C || C.__tk) return; C.__tk = 1;
    var show = C.show;
    C.show = function(r, onClose){
      try{
        if(r && S.t0){
          ensureLoaded();
          r = Object.assign({}, r);
          var raw = +r.score || 0, full = penalty(), p = Math.min(raw, full), rows = (r.records || []).slice(), why = [];
          if(S.test.guess) why.push('あてずっぽう ' + S.test.guess + '回');
          if(S.test.mash) why.push('連打 ' + S.test.mash + '回');
          if(S.test.skip) why.push('とばし読み ' + S.test.skip + '回');
          if(full > 0){ r.score = raw - p; rows.push(['適当プレイ', 'ひび入り −' + full + '点（' + why.join('・') + '）' + (full > p ? '　※0点より下にはならない' : '')]); }
          else if(why.length){ rows.push(['適当プレイ', why.join('・')]); }
          else rows.push(['解きかた', '◎ 本物（罰なし・じっくり解いた）']);
          rows.push(['テストの時間', fmtTime(now() - S.t0)]);
          if(S.game.mash || S.game.guess) rows.push(['ゲーム中の連打・あてずっぽう', (S.game.mash + S.game.guess) + '回']);
          r.records = rows;
          r.tekitou = {raw:raw, penalty:p, full:full, guess:S.test.guess, mash:S.test.mash, skip:S.test.skip, game:S.game.mash + S.game.guess};
        }
      }catch(e){}
      S.inTest = false; S.t0 = 0;
      return show.call(this, r, onClose);
    };
  }
  function hookZukan(){
    var Zk = window.Zukan; if(!Zk || Zk.__tk || !Zk.earn) return; Zk.__tk = 1;
    var earn = Zk.earn;
    Zk.earn = function(n, why, opt){
      ensureLoaded();
      if(S.debt > 0 && why !== 'pass'){
        n = Math.floor(Number(n) || 0);
        var cut = Math.min(S.debt, n);
        if(cut > 0){
          S.debt -= cut; n -= cut; save();
          if(!(opt && opt.silent)) setTimeout(function(){ note('<b>連打・あてずっぽう・とばし読み</b>の罰で かけら <em>−' + cut + '</em>', 2600); }, 600);
        }
        if(n <= 0) return 0;
      }
      return earn.call(this, n, why, opt);
    };
  }
  /* 本編クリア：まぐれ・罰があったときだけ理屈チェックを1問はさむ（ふつうに遊んだ子は止めない） */
  function hookClear(){
    var Zk = window.Zukan; if(!Zk || Zk.__tkc || !Zk.mainClear) return; Zk.__tkc = 1;
    var mc = Zk.mainClear;
    Zk.mainClear = function(opt){
      var self = this, args = arguments;
      if(S.game.sus > 0 && window.GAME_MODE !== 'test'){
        riddle({title:'クリアの前に', sub:'このプレイでは 連打・あてずっぽう・まぐれが あった。<br>理屈が わかっているか 1問で たしかめよう'}).then(function(){ S.game.sus = 0; mc.apply(self, args); });
        return 0;
      }
      return mc.apply(this, arguments);
    };
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}

function layoutOf(list,f){
  if(f&&LAYOUT[f])return LAYOUT[f].map(a=>({e:a[0],x:a[1],y:a[2]}));
  const n=list.length;
  if(!n)return[];
  if(n===1)return[{e:list[0],x:0,y:0}];
  if(n===2)return[{e:list[0],x:-.47,y:0},{e:list[1],x:.47,y:0}];

}

  return{html:cells.map(([c,r])=>{const x=x0+c*CELL+1.5,y=y0+r*CELL+1.5,z=CELL-3;
    return `<g class="x"><line x1="${x}" y1="${y}" x2="${x+z}" y2="${y+z}" stroke="${sh}" stroke-width="3.6" stroke-linecap="round"/><line x1="${x+z}" y1="${y}" x2="${x}" y2="${y+z}" stroke="${color}" stroke-width="3.2" stroke-linecap="round"/></g>`}).join(''),
    pts:cells.map(([c,r])=>[x0+c*CELL+CELL/2,y0+r*CELL+CELL/2])};
}

/* ======================= 音（Web Audio で合成・最初のタップで準備） ======================= */
const AU={ctx:null,nb:null,
  init(){
    try{
      if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.ctx=new C();
        const b=this.ctx.createBuffer(1,this.ctx.sampleRate,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;
        this.out=this.ctx.createGain();this.out.gain.value=.7;this.out.connect(this.ctx.destination)}
      if(this.ctx.state==='suspended')this.ctx.resume();
    }catch(e){}
  },
  ok(){return S.sfx&&this.ctx&&this.ctx.state==='running'},
  jit(){return 1+(Math.random()*.08-.04)},
  noise(t,dur,type,f,g,f2){const c=this.ctx,s=c.createBufferSource();s.buffer=this.nb;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const v=c.createGain();v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl).connect(v).connect(this.out);s.start(t,Math.random()*.5);s.stop(t+dur+.02)},
  tone(t,f,dur,g,type,f2){const c=this.ctx,o=c.createOscillator(),v=c.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v).connect(this.out);o.start(t);o.stop(t+dur+.02)},
  place(e){if(!this.ok())return;const t=this.ctx.currentTime,i=ELS.indexOf(e),f=(300+i*65)*this.jit();
    this.noise(t,.07,'lowpass',f,.5);this.tone(t,110+i*6,.09,.25,'sine',70)},
  chik(){if(!this.ok())return;const t=this.ctx.currentTime;this.noise(t,.018,'highpass',3600*this.jit(),.22)},
  clack(){if(!this.ok())return;const t=this.ctx.currentTime;[0,.09].forEach((d,i)=>{this.tone(t+d,(1250-i*180)*this.jit(),.04,.22,'sine',700);this.noise(t+d,.02,'bandpass',2400,.15)})},
  good(){if(!this.ok())return;const t=this.ctx.currentTime,b=523*this.jit();[0,4,7].forEach((s,i)=>this.tone(t+i*.085,b*Math.pow(2,s/12),.32,.2))},
  big(){if(!this.ok())return;const t=this.ctx.currentTime,b=440*this.jit();[0,4,7,9,12,16].forEach((s,i)=>this.tone(t+i*.07,b*Math.pow(2,s/12),.45,.18,i%2?'triangle':'sine'))},
  soft(){if(!this.ok())return;const t=this.ctx.currentTime;this.tone(t,240,.18,.2,'sine',150);this.noise(t,.12,'lowpass',500,.25)},
  zip(){if(!this.ok())return;const t=this.ctx.currentTime;this.noise(t,.32,'bandpass',2200,.25,500)},
  roll(){if(!this.ok())return;const t=this.ctx.currentTime;this.noise(t,.38,'lowpass',420,.18,260)}
};

function note(o){

  ${opts.map((v,i)=>isS2N

async function stitch(sym,undo){
  const xs=[...document.querySelectorAll('#stitches .x')];
  if(S.calm){xs.forEach(x=>x.classList.toggle('on',!undo));if(!undo)AU.clack();else AU.zip();return}
  if(undo){AU.zip();for(let i=xs.length-1;i>=0;i--){xs[i].classList.remove('on');if(i%3===0)await sleep(14)}return}
  const nd=$('needle'),pts=window._pts||[];nd.style.display='';
  $('needleThread').setAttribute('stroke',EL[sym].c);
  for(let i=0;i<xs.length;i++){xs[i].classList.add('on');const p=pts[i];if(p)nd.setAttribute('transform',`translate(${p[0]+4},${p[1]-4})`);if(i%2===0)AU.chik();await sleep(34)}

  if(!S.calm)t.animate([{transform:'rotate(16deg)'},{transform:'rotate(-10deg)',offset:.3},{transform:'rotate(5deg)',offset:.55},{transform:'rotate(-2deg)',offset:.78},{transform:'rotate(0)'}],{duration:950,easing:'linear'});

async function pickPatch(r,v,btn){
  if(S.busy)return;S.busy=true;
  const ans=r.s,ok=v===ans,isS2N=r.t==='s2n';
  T()&&T().answer(ok);
  document.querySelectorAll('#tray [data-v]').forEach(x=>x.disabled=true);
  if(isS2N){
    if(ok){btn.classList.add('ok');AU.good();hang(EL[ans].n);S.met[ans]=1;S.done.p++;await sleep(1000);return advance()}
    btn.classList.add('ng');AU.soft();hang(EL[v].n,true);await sleep(700);
    S.miss++;requeue(r);
    await note({title:'ほどき直し',html:`<span class="sym">${ans}</span> は <b>${EL[ans].n}</b>。${EL[ans].why}。<br>えらんだ「${EL[v].n}」の記号は <span class="sym">${v}</span>。`});
    hang(EL[ans].n);S.met[ans]=1;await sleep(700);return advance();
  }
  /* 名前→記号：えらんだ糸で刺しゅうする */
  btn.style.visibility='hidden';AU.place(v);
  const m=stitchMarkup(v,EL[v].c);$('stitches').innerHTML=m.html;window._pts=m.pts;
  await stitch(v);
  if(ok){AU.good();hang(EL[ans].n);S.met[ans]=1;S.done.p++;await sleep(1000);return advance()}
  hang(`${v} は ${EL[v].n}`,true);AU.soft();await sleep(900);
  await stitch(v,true);
  S.miss++;requeue(r);
  await note({title:'ほどき直し',html:`「${EL[ans].n}」の記号は <span class="sym">${ans}</span>。${EL[ans].why}。<br>えらんだ <span class="sym">${v}</span> は「${EL[v].n}」。`});
  const m2=stitchMarkup(ans,EL[ans].c);$('stitches').innerHTML=m2.html;window._pts=m2.pts;await stitch(ans);hang(EL[ans].n);S.met[ans]=1;await sleep(700);advance();
}

function drawBoard(list,f,edit,rollFrom){

function drawChart(R,ghost){

function sideAtoms(R,side){const terms=[...R.L,...R.R],nL=R.L.length,out=[];terms.forEach((f,i)=>{if((side==='L')===(i<nL))for(let c=0;c<S.k[i];c++)out.push(...atomsOf(f))});return out}
const gcd=(a,b)=>b?gcd(b,a%b):a;
async function tryKnit(r){
  if(S.busy)return;S.busy=true;const R=r.r;
  const L=countOf(sideAtoms(R,'L')),Rr=countOf(sideAtoms(R,'R'));
  const keys=[...new Set([...Object.keys(L),...Object.keys(Rr)])].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
  const bal=keys.every(e=>(L[e]||0)===(Rr[e]||0));
  const g=S.k.reduce((a,b)=>gcd(a,b));
  const ok=bal&&g===1;
  T()&&T().answer(ok);
  if(ok){
    const min=R.k.reduce((a,k)=>a+(k-1),0);
    T()&&T().solved({min:Math.max(1,min),q:rxQ(R)});
    $('knit').disabled=true;$('tally').innerHTML='';
    await flyKnit(R);
    S.done.c++;AU.big();
    $('chart').insertAdjacentHTML('beforeend',`<div class="done-label">編めた！</div>`);
    const cnt=keys.map(e=>`<span class="sym">${e}</span> ${L[e]}つ`).join('・');
    await note({title:'編めた',ok:true,html:`<span class="sym">${eqText(R)}</span><br>左にも右にも ${cnt}。毛糸は 消えず、<b>組み合わせが 変わっただけ</b>。<br>${RXNOTE[R.name]}`});
    return advance();
  }
  /* 合っていない：糸の勘定を見せる */
  AU.soft();S.tries++;
  const rows=keys.map(e=>{const a=L[e]||0,c=Rr[e]||0,dot=n=>Array.from({length:n},()=>`<i style="background:${EL[e].c};box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)"></i>`).join('');
    const msg=a===c?'<span class="msg ok">ぴったり</span>':a>c?`<span class="msg ng">右が ${a-c}つ 足りない（左の糸が 余る）</span>`:`<span class="msg ng">左が ${c-a}つ 足りない</span>`;
    return `<div class="trow"><div>${yarn(e,38,{tail:false,shadow:false})}</div><div class="bar"><em>左</em>${dot(a)}</div><div class="bar"><em>右</em>${dot(c)}</div>${msg}</div>`}).join('');
  let why;
  if(bal)why=`数は そろっているけれど、係数が 全部 ${g} で割れる。係数は <b>いちばん小さい整数</b> にする。`;
  else{const bad=keys.filter(e=>(L[e]||0)!==(Rr[e]||0));why=`${bad.map(e=>`<span class="sym">${e}</span>（${EL[e].n}）`).join('・')} の玉の数が 左右で ちがう。毛糸は 消えないし 増えないので、このままでは 編めない。足りない側のモチーフを ふやしてみよう。`}
  $('tally').innerHTML=`<div class="tally"><h4>糸の勘定（左＝反応の前／右＝反応の後）</h4>${rows}<div class="ex" id="tallyEx">${why}</div><div class="acts"><button class="act sub" id="fix">なおす</button></div></div>`;
  $('knit').disabled=true;
  const fix=$('fix');try{$('tally').scrollIntoView({block:'end',behavior:S.calm?'auto':'smooth'})}catch(e){}
  if(T()&&T().gate)T().gate(fix,{el:$('tallyEx'),ok:false});
  fix.onclick=()=>{S.busy=false;$('tally').innerHTML='';window.scrollTo(0,0);$('knit').disabled=false;T()&&T().shown()};
  if(S.tries===3)S.miss++;
}
const T2R={'炭酸水素ナトリウムの分解':'炭酸水素ナトリウムの分解','酸化銀の分解':'酸化銀の分解','水の分解':'水の分解（電気分解）','鉄と硫黄が結びつく化学変化':'鉄と硫黄が結びつく変化','銅と硫黄が結びつく化学変化':'銅と硫黄が結びつく変化','炭素の燃焼':'炭素の酸化（燃焼）','マグネシウムの燃焼':'マグネシウムの燃焼','銅の酸化':'銅の酸化','炭素による酸化銅の還元':'炭素による酸化銅の還元','水素による酸化銅の還元':'水素による酸化銅の還元'};

async function flyKnit(R){
  const nL=R.L.length;
  const left=[...document.querySelectorAll('#eqrow .side-L .atom')],right=[...document.querySelectorAll('#eqrow .side-R .atom')];
  if(S.calm){AU.clack();return}
  right.forEach(a=>a.style.visibility='hidden');
  const used=new Set(),fly=$('fly'),jobs=[];
  left.forEach((a,i)=>{
    const e=a.dataset.e;const j=right.findIndex((b,k)=>!used.has(k)&&b.dataset.e===e);if(j<0)return;used.add(j);
    const r0=a.getBoundingClientRect(),r1=right[j].getBoundingClientRect();
    const c=a.cloneNode(true);c.style.left=r0.left+'px';c.style.top=r0.top+'px';c.style.width=r0.width+'px';c.style.height=r0.height+'px';fly.appendChild(c);
    a.style.opacity=.18;
    const dx=r1.left-r0.left,dy=r1.top-r0.top,lift=-50-Math.random()*30;
    jobs.push(new Promise(res=>{
      const an=c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${dx*.5}px,${dy*.5+lift}px) rotate(200deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) rotate(360deg)`}],{duration:900,delay:i*55,easing:'cubic-bezier(.45,.05,.4,1)',fill:'forwards'});
      an.onfinish=()=>{right[j].style.visibility='';c.remove();AU.place(e);res()};
    }));
  });
  await Promise.all(jobs);
  right.forEach(a=>a.style.visibility='');
  AU.clack();
}

  const go=await note({title:'遊び方',read:false,btn:'とじる',alt:'確認テストだけ やる',html:'毛糸玉 1つ ＝ 原子 1つ。<br>① <b>ワッペン</b>：記号と名前を 結ぶ（札か 毛糸玉を タップ）<br>② <b>あみぐるみ</b>：毛糸玉を 台にのせて 物質を作る（台の玉をタップで ほどく）<br>③ <b>編み図</b>：□に入るモチーフを えらび、＋ − で 係数を決めて「編んでみる」<br>まちがえると「ほどき直し」の解説が 読み終わるまで 出る。<b>連打・あてずっぽう</b>は「おまけ注文」が 増える。<br>最後に 確認テスト 12問。'});
  if(go===false)startTest(true);
};

/* ======================= はじめ ======================= */
(async function(){
  drawTape();
  setSlip('注文票','毛糸の化学工房へ ようこそ','');
  $('bench').className='one';
  $('bench').innerHTML=`<div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px 18px;padding-top:30px">${['H','O','C','Cu','Na','S','Fe'].map((e,i)=>`<div style="transform:translateY(${[0,-18,6,-8,10,-22,2][i]}px) rotate(${ROT[i%6]*3}deg)">${yarn(e,[70,92,80,96,74,86,88][i])}</div>`).join('')}</div>`;
  await note({title:'毛糸の化学工房',read:false,btn:'工房に入る',html:'この工房では <b>毛糸玉 1つ ＝ 原子 1つ</b>。<br>注文票のとおりに、<b>ワッペン → あみぐるみ → 編み図</b> の順で 仕上げていく。<br>毛糸は 消えないし 増えない。これが 化学変化の きまり。<br>最後に 確認テスト。'});
  startGame();
})();
</script>
<script>window.ZUKAN_COUNTER={"db": "https://rika-zukan-rank-default-rtdb.asia-southeast1.firebasedatabase.app", "id": "req-amimono"};
/* プレイ回数を数える（公開サイトのゲームにだけ build_site.py が入れる）
   送るのはゲームIDだけ。同じタブで開き直しても1回しか数えない。届かなくてもゲームには何も起きない */
(function(){
  var C=window.ZUKAN_COUNTER;if(!C||!C.db||!C.id||!/^[a-z0-9-]{2,40}$/.test(C.id))return;
  var k='zukan-played:'+C.id;
  try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
  try{fetch(C.db+'/plays/'+C.id+'.json',{method:'PUT',body:JSON.stringify({'.sv':{increment:1}}),keepalive:true})['catch'](function(){})}catch(e){}
})();
</script>
