<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>分子バトルRPG ～原子を組んで技を放て（化学式・元素記号）～</title>
<!--
  設計メモ（勉強ゲーム職人・2026-10-04）
  ・生徒アンケート3本目「分子を組み合わせたり問題に答えたりして攻撃するRPG。友達と対戦」
  ・名簿の型: 14 黒窓の語り部（黒い窓・白4px枠・角6px・1文字40ms・▼0.5秒点滅・タップで全文）＋対戦の熱さ
  ・世界とメタファー: 原子の決闘場。キャラは教科書p.95のモデル記号（銅◎ 酸素● 炭素⊗ 鉄△ 硫黄◉ 銀⦶ 水素○）そのもの。顔は描かない
  ・配色: 硫黄の黄 #EFC81F（戦場の地・1色ベタ）／墨 #0B0B0B（窓）／白 #FAFAF5（文字と枠）／赤 #D42A1F（ダメージと体力が減る所だけ）
  ・書体: 窓＝ヒラギノ角ゴ W6、数字＝Avenir Next Condensed（iPad内蔵）。ドット書体は使わない
  ・音: 効果音はWeb Audioで合成。BGMは _shared/bgm.js（GAME_FX.bgm）。考えている間は効果音を鳴らさない
  ・外への送信なし。保存は共通部品の localStorage だけ。名前は打たせず、決まった呼び名から選ぶ
  ・作業メモ（2026-10-05 仕上げ）: same-look-causes.md を前後に通した。効いた項目＝1（硫黄・教科書のモデル記号・元素カードだけから材料）／8（黒地に光る1色ではなく、黄の地に黒い窓）／13（赤はダメージだけ）／15（角は4〜6px）／
    28・30（絵文字なし・顔なし）／39（考える間は静か）／44（不正解は責めない2音）／45（演出を減らす）／46（4択だけにせず、原子を組む・係数をそろえる操作そのものが学び）。
    直した所＝埋まった枠が全画面に広がる（.full の名前がぶつかっていた）／確認テストの関所が二重で押せそうで押せない「つぎへ」／
    Fe+S→FeS など係数1の式で CPU が「原子の数が合わない」と言う誤り／確認テストの選択肢が重なる／足もとの影の位置／iPad縦の並び
-->
<style>

  --io-deep:#C9A30F;   /* 影（光は左上から1つ） */
  --sumi:#0B0B0B;      /* 窓の黒 */
  --kami:#FAFAF5;      /* 文字と枠の白 */
  --chi:#D42A1F;       /* ダメージ・体力が減る所だけ */
  --dim:#8A8A82;
  --waku:4px;
  --kado:6px;
  --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --num:"Avenir Next Condensed","Avenir Next","Arial Narrow","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--io);color:var(--kami);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-text-size-adjust:100%}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
sub{font-size:.62em;vertical-align:-.28em;line-height:0}
.hidden{display:none!important}

/* ── 黒い窓（型14の土台） ── */
.win{background:var(--sumi);border:var(--waku) solid var(--kami);border-radius:var(--kado);
  box-shadow:0 0 0 3px var(--sumi);color:var(--kami)}

/* ── 画面の骨組み ── */

#msgT{min-height:3.4em}
#tri{position:absolute;right:16px;bottom:8px;font-size:18px;opacity:0}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wbtn{min-height:52px;padding:8px 18px;background:var(--sumi);color:var(--kami);border:3px solid var(--kami);border-radius:5px;font-size:19px;font-weight:700}

}

<script>/*@GUARD_BEGIN*/
/* ==========================================================
   BGMエンジン（全ゲーム共通）  ─ BGM
   ─ 2026-10-03 オーナー指示「BGMも本気出していいよ。全力でやっていこう」から作った共通部品
   ─ ゲームの index.html の印の外に window.GAME_FX = { bgm:{…} } を書くと、そのゲーム専用の曲が鳴る。
     GAME_FX.bgm が無いゲームでは何も鳴らさない（ボタンも出さない）。書き方は _shared/fx-README.md
   ─ WebAudio だけで鳴らす（外部ファイル・外部サイトなし）。曲は1小節ずつ先読みで組み立てる
       ・曲のセクション（intro／A／B／S＝サビ／T＝ピンチ／Q＝静か）と form（流れる順）
       ・ドラム（キック・スネア・ハット・タム・シンバル・太鼓・ブラシ…を合成）／ベース／和音パッド／
         刻み（伴奏）／アルペジオ／メロディ／副旋律。テンポ・調・音階・拍子・スウィング・音色はデータで決める
   ─ ゲームの場面に合わせて強さを変える
       BGM.mood('normal')   ふつう
       BGM.mood('tense')    ピンチ・時間切れ間近（T セクションへ。無ければサビの和音で急かす）
       BGM.mood('calm')     静か（確認テスト中は自動でこれ）
       BGM.mood('clear')    クリアのジングル（Zukan.mainClear で自動）→ そのあと ふつう
       BGM.level(0〜3)      コンボなどで楽器を足す・引く（1がふつう）
       BGM.duck(ms)         一瞬小さくする（適当プレイ番の罰の瞬間は自動）
   ─ iOS Safari の自動再生の決まりに合わせ、最初のタップで鳴り始める
   ─ 音量・オンオフのボタン（左下・指で押せる大きさ）。状態は localStorage（rika-bgm:v1）に保存。初期音量は「小」
     （教室で30台が同時に鳴る前提）。図鑑の「音を消す」（rika-zukan:profile:v1 の mute）にも従う
   ─ このファイルは build / sync_one.py が各ゲームの ZUKAN（または GUARD）の印の間へ同期する（ゲーム側で直接いじらない）
   ─ 外への送信はしない
   ========================================================== */
(function(){
  if (window.BGM) return;

  /* ---------------- 保存（音量・オンオフ） ---------------- */
  var KEY = 'rika-bgm:v1';
  var VOL = [0, .17, .32, .55];          /* 小・中・大 */
  var SFXVOL = [0, .45, .7, .95];
  var ST = {on:true, v:1};
  try{ var o = JSON.parse(localStorage.getItem(KEY)); if(o){ if(typeof o.on === 'boolean') ST.on = o.on; if(o.v >= 1 && o.v <= 3) ST.v = o.v | 0; } }catch(e){}
  function saveST(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }
  function profMute(){ try{ return !!(JSON.parse(localStorage.getItem('rika-zukan:profile:v1') || '{}').mute); }catch(e){ return false; } }
  function fx(){ return window.GAME_FX || null; }
  function songData(){ var f = fx(); return f && f.bgm && typeof f.bgm === 'object' ? f.bgm : null; }
  function gameMute(){
    var b = songData(); if(!b) return false;
    try{ if(b.muteKey && localStorage.getItem(b.muteKey) === '1') return true; }catch(e){}
    try{ if(typeof b.isMuted === 'function' && b.isMuted()) return true; }catch(e){}
    return false;
  }
  var tmpMute = false;
  function audible(){ return ST.on && !profMute() && !tmpMute && !gameMute(); }

  /* ---------------- 音の土台 ---------------- */
  var A = null;          /* いま使っている音の場（本物 or 書き出し用） */
  var LIVE = null;       /* 本物の AudioContext の場 */
  function makeIR(ctx, sec, decay){
    var n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for(var c=0;c<2;c++){
      var d = b.getChannelData(c), lp = 0;
      for(var i=0;i<n;i++){ var x = Math.random()*2-1; lp += (x - lp) * (0.35 - 0.25 * i / n); d[i] = lp * Math.pow(1 - i / n, decay); }
    }
    return b;
  }
  function build(ctx){
    var a = {ctx:ctx};

    return !!t.closest('button,[role=button],a[href],input[type=button],input[type=submit],label,summary,.btn');
  }
  function onClick(e){
    var t = e.target, at = now();
    if(at < lockUntil){ e.preventDefault(); e.stopPropagation(); return; }
    if(excluded(t)) return;
    if(S.inTest && at - Math.max(S.lastAt, S.t0) > 180000) S.inTest = false; /* テストを途中でやめて本編へもどった */
    clicks.push(at); if(clicks.length > 8) clicks.shift();
    if(gateBlock(e)) return;
    if(t.closest('canvas')) return;
    if(!S.inTest && (!CFG.mash || !isButton(t))) return;
    taps.push(at);
    while(taps.length && at - taps[0] > CFG.mashMs) taps.shift();
    if(taps.length >= CFG.mashN){
      taps = []; e.preventDefault(); e.stopPropagation();
      if(S.inTest) testPenalty('mash'); else gamePenalty('mash', CFG.debtMash);
    }
  }

  /* ---------------- カラオケ読み ---------------- */
  function karaoke(el, cps){
    var chars = [];
    (function walk(node){
      var kids = [].slice.call(node.childNodes);
      for(var i=0;i<kids.length;i++){
        var c = kids[i];
        if(c.nodeType === 3){
          var txt = c.nodeValue; if(!txt) continue;
          var frag = document.createDocumentFragment();
          for(var j=0;j<txt.length;j++){
            var ch = txt.charAt(j), sp = document.createElement('span');
            sp.className = 'tk-kc'; sp.textContent = ch; frag.appendChild(sp);
            var ms = /\s/.test(ch) ? 30 : 1000 / cps;
            if(/[、，,]/.test(ch)) ms += 200; if(/[。！？!?]/.test(ch)) ms += 350;
            chars.push({sp:sp, ms:ms});
          }
          c.parentNode.replaceChild(frag, c);
        }else if(c.nodeType === 1 && !/^(SCRIPT|STYLE|SVG|svg|CANVAS|IMG|BUTTON|INPUT|TEXTAREA|SELECT)$/.test(c.tagName)){
          if(c.tagName === 'BR' && chars.length) chars[chars.length-1].ms += 220;
          walk(c);
        }
      }
    })(el);
    if(!chars.length) return null;
    el.classList.add('tk-kara');
    var total = 0; for(var k=0;k<chars.length;k++) total += chars[k].ms;
    var i = 0, timer = 0, stopped = false;
    function step(){
      if(stopped || !el.isConnected) return;
      if(i > 0) chars[i-1].sp.className = 'tk-kc lit';
      if(i >= chars.length) return;
      chars[i].sp.className = 'tk-kc now';
      var ms = chars[i].ms; i++;
      timer = setTimeout(step, ms);
    }
    step();
    return {total:total, stop:function(){ stopped = true; clearTimeout(timer); chars.forEach(function(c){ c.sp.className = 'tk-kc lit'; }); }};
  }
  /* 解説の文が入っている、いちばん小さい見えている要素を探す */
  function findTextEl(text){
    var key = strip(text); if(key.length < 6) return null;
    var head = key.slice(0, Math.min(16, key.length));
    var all = document.body.getElementsByTagName('*'), best = null, bestLen = 1e9;
    for(var i=0;i<all.length;i++){
      var e = all[i];
      if(/^(SCRIPT|STYLE|BUTTON|svg|SVG|HTML|BODY)$/.test(e.tagName) || e.closest('#sc-ov,.zk-ov,.tk-note,.tk-pen,svg')) continue;
      var t = strip(e.textContent);
      if(t.length >= bestLen || t.indexOf(head) < 0) continue;
      var r = e.getBoundingClientRect(); if(r.width < 4 || r.height < 4) continue;
      best = e; bestLen = t.length;
    }
    /* 見出し（「もう一歩」「正解：…」）ごと読ませるため、親が解説とほぼ同じ大きさなら親まで上がる */
    while(best && best.parentElement && best.parentElement !== document.body){
      var pl = strip(best.parentElement.textContent).length;
      if(pl > key.length * 1.6 + 40 || best.parentElement.querySelector('button,input,select,canvas')) break;
      best = best.parentElement;
    }
    return best;
  }

  /* ---------------- 解説の「つぎへ」を読み終わるまで止める ---------------- */
  var NEXT_RE = /^(▶|→|＞|>)?\s*(つぎ|次|NEXT|Next|next|答え合わせ|こたえあわせ|結果|けっか)/;
  function textOf(b){ return String(b.textContent || b.value || '').trim(); }
  function visible(el){
    if(!el || !el.isConnected || el.disabled) return false;
    var r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return false;
    var cs = getComputedStyle(el); return cs.visibility !== 'hidden' && cs.display !== 'none' && +cs.opacity > 0.05;
  }
  function nextButtons(){
    var out = [], bs = document.querySelectorAll('button,[role=button],input[type=button]');
    for(var i=0;i<bs.length;i++){ var b = bs[i]; if(excluded(b)) continue; if(NEXT_RE.test(textOf(b)) && visible(b)) out.push(b); }
    return out;
  }
  function gate(btn, opt){
    if(!btn) return;
    opt = opt || {};
    var ms = opt.ms, el = opt.el || null, kara = null;
    if(ms == null){
      if(!el && opt.text) el = findTextEl(opt.text);
      if(el) kara = karaoke(el, opt.ok ? CFG.readCpsOk : CFG.readCps);
      if(kara) ms = kara.total + 300;
      else { var n = strip(opt.text || '').length; ms = n ? n / (opt.ok ? CFG.readCpsOk : CFG.readCps) * 1000 : (opt.ok ? 700 : 1200); }
    }
    ms = Math.min(CFG.readMax, ms);
    if(ms <= 0) return;

    var g = {b:btn, until:now() + ms, tries:0, kara:kara};
    gates.push(g);

  }
  function ungate(g, ready){
    var i = gates.indexOf(g); if(i >= 0) gates.splice(i, 1);
    clearTimeout(g.timer);
    if(g.kara) g.kara.stop();
    if(g.b){ g.b.classList.remove('tk-gated'); if(ready && g.b.isConnected){ g.b.classList.add('tk-ready'); setTimeout(function(){ g.b.classList.remove('tk-ready'); }, 2100); } }
  }
  function gateBlock(e){
    if(!gates.length) return false;
    var t = e.target, at = now();
    for(var i=gates.length-1;i>=0;i--){
      var g = gates[i];
      if(!g.b.isConnected){ ungate(g); continue; }
      if(at >= g.until){ ungate(g, true); continue; }
      if(g.b === t || g.b.contains(t)){
        e.preventDefault(); e.stopPropagation();
        g.tries++;
        if(g.tries >= 4){
          g.tries = 0;
          if(S.inTest){ S.test.skip += 2; pen('skip', '−1点', '確認テストの点 −1・提出カードが「ひび入り」になる'); emit('skip'); }
          else gamePenalty('skip', CFG.debtMash);
        }else{
          note('📖 光る文字を 目で追って 読もう　<em>あと ' + Math.ceil((g.until - at) / 1000) + ' 秒</em>', 1500);
        }
        return true;
      }
    }
    return false;
  }

  /* ---------------- 確認テスト ---------------- */
  function startTest(){
    S.inTest = true; S.t0 = now(); S.lastAt = 0; S.seen = {};
    S.test = {guess:0, mash:0, skip:0, n:0};
    if(!S.told){
      S.told = true;
      setTimeout(function(){
        note('📝 <em>確認テストのルール</em><br>● 問題が出てすぐ（2.5秒以内）の<b>まちがい</b> → あてずっぽう <b>−1点</b><br>● <b>連打</b>（1秒に7回） → <b>−1点</b><br>● 解説を<b>とばす</b>（光り終わる前に何度も押す・すぐ次を答える） → <b>−1点</b><br>罰があると 提出カードが「<b>ひび入り</b>」になる。わからない問題は、考えてから答えよう。', 5600);
      }, 350);
    }
  }
  function prevClickBefore(at){
    /* 答えを決めたクリック（いまから0.4秒以内）の、ひとつ前のクリック＝「つぎへ」を押した時刻 */
    var i = clicks.length - 1;
    if(i >= 0 && at - clicks[i] < 400) i--;
    return i >= 0 ? clicks[i] : 0;
  }
  function onTestAnswer(q, ok){
    var key = q && (q.id || q.q) ? String(q.id || strip(q.q)) : '#' + S.test.n;
    if(S.seen[key]) return;
    S.seen[key] = 1;
    var at = now(), gap = at - (S.lastAt || S.t0);
    S.lastAt = at; S.test.n++;
    var think = gap;
    if(!q || q.t === 'choice' || q.t == null){ var p = prevClickBefore(at); if(p && p > (S.t0 - 50)) think = Math.min(gap, at - p); }
    if(!ok && think < CFG.guessMs) testPenalty('guess');
    else if(S.test.n > 1 && gap < CFG.skipMs) testPenalty('skip');
    else if(ok && think >= CFG.guessMs) praise();
    if(!ok) S.game.streak = 0;
    /* 解説をカラオケ読みさせ、新しく出た「つぎへ」を読み終わるまで止める */
    var ex = q ? (q.ex || q.exp || '') : '';
    var before = nextButtons();
    setTimeout(function(){
      var after = nextButtons(), fresh = [];
      for(var i=0;i<after.length;i++) if(before.indexOf(after[i]) < 0) fresh.push(after[i]);
      if(!fresh.length) return;
      var ms = null, el = ex ? findTextEl(ex) : null, kara = el ? karaoke(el, ok ? CFG.readCpsOk : CFG.readCps) : null;
      if(kara) ms = kara.total + 300;
      for(var j=0;j<fresh.length;j++) gate(fresh[j], ms != null ? {ms:ms} : ex ? {text:ex, ok:ok, el:null} : {ms: ok ? 700 : 1200});
      if(kara && fresh.length) gates[gates.length-1].kara = kara;
    }, Math.max(40, lockUntil - now() + 40)); /* 罰の札が消えてから読み始める */
  }
  function penalty(){
    return S.test.guess + S.test.mash + Math.floor(S.test.skip / 2);
  }
  function fmtTime(ms){ var s = Math.round(ms/1000); return Math.floor(s/60) + '分' + String(s%60).padStart(2,'0') + '秒'; }

  /* ---------------- 本編の○×（ゲームが Tekitou.answer を呼んだとき） ---------------- */
  function onGameAnswer(ok){
    var at = now(), from = Math.max(S.game.shownAt || 0, S.game.lastAt || 0), think = from ? at - from : 1e9;
    S.game.lastAt = at;
    /* 子どもが押した（離した）直後に決まった正誤だけを数える。時間で自動に進む場面（流れてきた・ぶつかった）の正誤は数えない */
    var byHand = at - lastInputAt < 600;
    if(!byHand) { if(!ok) S.game.streak = 0; return; }
    if(ok) { S.game.wrongs = []; if(think >= CFG.guessMs) praise(); return; }
    S.game.streak = 0;
    S.game.wrongs.push(at);
    while(S.game.wrongs.length && at - S.game.wrongs[0] > CFG.burstMs) S.game.wrongs.shift();
    var fast = think < CFG.guessMs, burst = S.game.wrongs.length >= CFG.burstN;
    if(!(fast || burst)) return;
    S.game.wrongs = [];
    gamePenalty('guess', CFG.debtGuess);
  }

  /* ---------------- ごほうび：考えてから正解したら金の「本物 ×n」 ---------------- */
  function praise(){
    ensureCSS(); if(!document.body) return;
    S.game.streak++;
    var n = S.game.streak, d = document.createElement('div');
    var x = lastPt[0] || innerWidth / 2, y = lastPt[1] || innerHeight * .4;
    d.className = 'tk-real' + (n >= 5 ? ' big' : '');
    d.style.left = Math.max(70, Math.min(innerWidth - 70, x)) + 'px'; d.style.top = Math.max(40, y - 30) + 'px';
    d.innerHTML = '✨ 本物' + (n >= 2 ? ' <b>×' + n + '</b>' : '') + (n === 5 ? '<small>じっくり名人！</small>' : n === 10 ? '<small>理屈マスター！</small>' : '');
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1300);
  }
  var lastPt = [0, 0], lastInputAt = 0;
  window.addEventListener('pointerdown', function(e){ lastPt = [e.clientX, e.clientY]; lastInputAt = now(); }, true);
  ['pointerup','click','keydown'].forEach(function(t){ window.addEventListener(t, function(){ lastInputAt = now(); }, true); });

  /* ---------------- まぐれ判定（パズルの手） ---------------- */
  function median(a){ if(!a.length) return 1e9; var b = a.slice().sort(function(x,y){return x-y}); return b[b.length >> 1]; }
  function solved(o){
    o = o || {};
    var mv = S.moves.slice(), n = mv.length, gaps = [];
    for(var i=1;i<n;i++) gaps.push(mv[i] - mv[i-1]);
    S.moves = [];
    var min = +o.min || 0;
    var many = min ? (n >= Math.max(min * 2 + 4, min + 6)) : (n >= 12);
    var lucky = many && median(gaps) < CFG.luckyGapMs;
    if(!lucky){
      if(n && (!min || n <= min + 2)) praise();
      if(o.onResult) try{ o.onResult(true); }catch(e){}
      return false;
    }
    S.game.lucky++; S.game.sus++; S.game.streak = 0;
    emit('lucky', {moves:n, min:min});
    if(o.defer){
      /* アクションの最中は止めない：まぐれを覚えておき、本編クリアのときに理屈チェック */
      note('🔍 <b>まぐれ？</b>　手あたりしだいに さわって 合っただけ かも。<br><em>クリアのときに 理屈チェック</em>が 出るよ', 3000);
      if(o.onResult) try{ o.onResult(false); }catch(e){}
      return true;
    }
    riddle({q:o.q, title:'まぐれ？', sub:'手あたりしだいに さわって 合っただけ かも。<br>理屈が わかっているか 1問で たしかめよう'}).then(function(ok){
      if(o.onResult) try{ o.onResult(ok); }catch(e){}
    });
    return true;
  }

  /* ---------------- 理屈チェック（1問） ---------------- */
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pickQ(){
    try{
      if(!window.Quiz || !Quiz.all) return null;

      var k = '';
      try{ k = (Zukan._cur.koma || [])[0] || ''; }catch(e){}
      var mine = all.filter(function(q){ return !k || q.koma === k; });

      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }catch(e){ return null; }
  }
  var riddleOpen = false;
  function riddle(o){
    return new Promise(function(res){
      var q = o.q || pickQ();
      if(!q || riddleOpen || !document.body){ res(true); return; }
      riddleOpen = true; ensureCSS();
      var shown = shuffle(q.choices), t0 = now(), done = false;
      var d = document.createElement('div'); d.className = 'tk-chk';
      d.innerHTML = '<div class="tk-card"><div class="tk-h">🔍 理屈チェック' + (o.title ? '<span>' + esc(o.title) + '</span>' : '') + '</div>' +
        '<p class="tk-sub">' + (o.sub || 'クリアの前に 1問だけ。ちゃんと わかってクリアしたか たしかめよう') + '</p>' +
        '<p class="tk-q"></p><div class="tk-ch"></div><div class="tk-ex"></div><div class="tk-go"></div></div>';

  /* ---------------- 共通部品へのつなぎ ---------------- */
  function hookQuiz(){
    var Q = window.Quiz; if(!Q || Q.__tk) return; Q.__tk = 1;
    var test = Q.test, check = Q.check, review = Q.review;
    if(test) Q.test = function(){ var r = test.apply(this, arguments); startTest(); return r; };
    if(check) Q.check = function(q, ans){
      var ok = check.apply(this, arguments);
      if(!S.inReview){ try{ if(S.inTest) onTestAnswer(q, ok); }catch(e){} }
      return ok;
    };
    if(review) Q.review = function(){ S.inReview = true; try{ return review.apply(this, arguments); } finally { S.inReview = false; } };
  }
  function hookCard(){
    var C = window.SubmitCard; if(!C || C.__tk) return; C.__tk = 1;
    var show = C.show;
    C.show = function(r, onClose){

          r.records = rows;
          r.tekitou = {raw:raw, penalty:p, full:full, guess:S.test.guess, mash:S.test.mash, skip:S.test.skip, game:S.game.mash + S.game.guess};

  }
  function hookZukan(){

        }

  }
  /* 本編クリア：まぐれ・罰があったときだけ理屈チェックを1問はさむ（ふつうに遊んだ子は止めない） */
  function hookClear(){

    var mc = Zk.mainClear;
    Zk.mainClear = function(opt){

  function hookAll(){ hookQuiz(); hookCard(); hookZukan(); hookClear(); }

  window.addEventListener('click', onClick, true);

  window.Tekitou = {
    setup: function(o){ if(o) for(var k in o) if(Object.prototype.hasOwnProperty.call(CFG, k)) CFG[k] = o[k]; hookAll(); },

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}

/* 教科書p.94のような「丸と元素記号」の分子モデル。白黒2色だけ */
function molLayout(f){
  const L = {
    N2:[['N',0,0],['N',36,0]], H2:[['H',0,0],['H',22,0]], O2:[['O',0,0],['O',36,0]], Cl2:[['Cl',0,0],['Cl',40,0]],
    H2O:[['O',0,0],['H',-22,16],['H',22,16]], NH3:[['N',0,0],['H',-24,-14],['H',24,-6],['H',-2,25]],
    CO2:[['O',-36,0],['C',0,0],['O',36,0]], CuS:[['Cu',-16,0],['S',18,0]], NaCl:[['Na',-16,0],['Cl',19,0]],
    CuO:[['Cu',-15,0],['O',17,0]], FeS:[['Fe',-18,0],['S',20,0]], MgO:[['Mg',-18,0],['O',18,0]],
    Ag2O:[['Ag',-30,4],['O',0,-4],['Ag',30,4]],
    NaHCO3:[['Na',-52,0],['H',-28,-16],['C',-2,0],['O',30,0],['O',-2,-34],['O',-2,34]],
    Na2CO3:[['Na',-52,-12],['Na',-52,18],['C',-12,0],['O',22,0],['O',-12,-34],['O',-12,34]],
    O:[['O',0,0]], H:[['H',0,0]]
  };
  if(L[f]) return L[f];
  const a = atoms(f), out=[]; let x=0;
  Object.keys(a).forEach(e=>{ for(let i=0;i<a[e];i++){ out.push([e,x,0]); x+=ELEM[e]?ELEM[e].r*1.7:30; } });
  const mid = x/2 - (out.length?((ELEM[out[out.length-1][0]]||{r:18}).r*.85):0);
  return out.map(([e,xx,y])=>[e,xx-mid,y]);
}
function molSVG(f, opt){
  opt = opt||{}; const ink = opt.ink||'#FAFAF5', bg = opt.bg||'#0B0B0B', sc = opt.scale||1;
  const lay = molLayout(f);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  lay.forEach(([e,x,y])=>{const r=(ELEM[e]||{r:18}).r; minX=Math.min(minX,x-r);maxX=Math.max(maxX,x+r);minY=Math.min(minY,y-r);maxY=Math.max(maxY,y+r);});

}

}

}
function noise(t0, dur, vol, hp){
  const a=audio(); if(!a) return; const {c,o}=a, t=c.currentTime+t0;
  const len=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||400;
  const g=c.createGain(); g.gain.value=vol||.2; s.connect(f); f.connect(g); g.connect(o); s.start(t);
}

const MSG = {busy:false, full:'', res:null, typing:false, timer:0, autoT:0};
function say(html, opt){
  opt = opt||{};
  return new Promise(res=>{
    clearTimeout(MSG.timer); clearTimeout(MSG.autoT);
    const el=$('msgT'), tri=$('tri'); tri.classList.remove('on');
    MSG.full=html; MSG.res=res; MSG.typing=true; MSG.wait=!!opt.wait;
    const toks=[]; for(let i=0;i<html.length;i++){ if(html[i]==='<'){ const j=html.indexOf('>',i); toks.push(html.slice(i,j+1)); i=j; } else if(html[i]==='&'){ const j=html.indexOf(';',i); toks.push(html.slice(i,j+1)); i=j; } else toks.push(html[i]); }
    let k=0, cur='';
    const done=()=>{
      MSG.typing=false; el.innerHTML=MSG.full; tri.classList.add('on');
      if(!MSG.wait) MSG.autoT=setTimeout(finish, opt.hold!=null?opt.hold:1100);
    };
    MSG.done=done;
    const step=()=>{
      if(k>=toks.length) return done();
      cur+=toks[k]; k++; el.innerHTML=cur;
      if(k%3===0 && !opt.quiet) SFX.tick();
      MSG.timer=setTimeout(step, CALM?8:40);
    };
    step();
  });
}
function finish(){ clearTimeout(MSG.autoT); $('tri').classList.remove('on'); const r=MSG.res; MSG.res=null; if(r) r(); }

const cv=$('fx'), cx=cv.getContext('2d'); let parts=[], fxRun=false;
function fitFx(){ const r=cv.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); cv.width=r.width*d; cv.height=r.height*d; cx.setTransform(d,0,0,d,0,0); }
addEventListener('resize',fitFx);
function center(el){ const r=el.getBoundingClientRect(), f=$('field').getBoundingClientRect(); return {x:r.left-f.left+r.width/2, y:r.top-f.top+r.height/2}; }
function burst(x,y,n,col,kind){
  if(CALM) n=Math.min(n,8);
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,r:kind==='atom'?8+Math.random()*10:3+Math.random()*4,life:1,col,kind,el:pick(['H','O','C','N','S','Cu','Fe'])}); }
  loopFx();
}
function loopFx(){
  if(fxRun) return; fxRun=true;
  const step=()=>{
    const w=cv.clientWidth,h=cv.clientHeight; cx.clearRect(0,0,w,h);
    parts=parts.filter(p=>p.life>0);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.25; p.vx*=.98; p.life-=.022;
      cx.globalAlpha=Math.max(0,p.life);
      if(p.kind==='atom'){ cx.fillStyle='#FAFAF5'; cx.strokeStyle='#0B0B0B'; cx.lineWidth=2.5; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); cx.stroke();
        cx.fillStyle='#0B0B0B'; cx.font='700 '+Math.round(p.r)+'px "Avenir Next Condensed",sans-serif'; cx.textAlign='center'; cx.fillText(p.el,p.x,p.y+p.r*.35); }
      else if(p.kind==='ring'){ cx.strokeStyle=p.col; cx.lineWidth=4; cx.beginPath(); cx.arc(p.x,p.y,p.r*(2-p.life)*8,0,7); cx.stroke(); }
      else { cx.fillStyle=p.col; cx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r); }
    });
    cx.globalAlpha=1;
    if(parts.length) requestAnimationFrame(step); else { fxRun=false; cx.clearRect(0,0,w,h); }
  };
  requestAnimationFrame(step);
}
/* 分子のモデルが 攻撃する側から 相手へ飛ぶ */
function flyMol(f, fromEl, toEl){
  return new Promise(res=>{
    const a=center(fromEl), b=center(toEl), w=document.createElement('div');
    w.innerHTML=molSVG(f,{ink:'#0B0B0B',bg:'#FAFAF5',scale:1.6});
    w.style.cssText='position:absolute;z-index:8;left:0;top:0;pointer-events:none';
    $('field').appendChild(w);
    const r=w.getBoundingClientRect(); const ox=r.width/2, oy=r.height/2;
    SFX.whoosh();
    const an=w.animate([
      {transform:`translate(${a.x-ox}px,${a.y-oy}px) scale(.6)`},
      {transform:`translate(${(a.x+b.x)/2-ox}px,${Math.min(a.y,b.y)-90-oy}px) scale(1.15)`,offset:.55},
      {transform:`translate(${b.x-ox}px,${b.y-oy}px) scale(1)`}
    ],{duration:CALM?200:620,easing:'cubic-bezier(.5,0,.75,.4)'}); /* 投げたら加速して当たる */
    an.onfinish=()=>{ w.remove(); res(b); };

}

function dmgOf(atk, def, base){
  let d=base*(.92+Math.random()*.16);
  if(atk.flinch){ d*=.5; atk.flinch=false; }
  let guarded=false; if(def.guard){ d*=.5; def.guard=false; guarded=true; }
  if(atk.cpu && G.mode==='cpu') d*= G.lv?0.9:0.75;
  return {d:Math.max(1,Math.round(d)), guarded};
}
async function hitFoe(base, f, opts){
  opts=opts||{};
  const a=me(), b=foe();
  const {d,guarded}=dmgOf(a,b,base);
  if(f) await flyMol(f, $('figMe'), $('figFoe'));
  const at=center($('figFoe'));
  (opts.big?SFX.bigHit:SFX.hit)();
  burst(at.x,at.y,opts.big?36:18,'#0B0B0B','atom'); burst(at.x,at.y,1,'#D42A1F','ring');
  shakeField(opts.big?14:7);
  popNum(d, at, false, guarded?'まもりで半分':'');
  setHP(b, b.hp-d);
  if(window.BGM){ BGM.level(opts.big?3:2); setTimeout(()=>window.BGM&&BGM.level(1),2400); }
  await wait(CALM?400:900);
  return d;
}
async function applySub(s){
  const a=me(), b=foe();
  const base = 6 + 4*nAtoms(s.f) + (s.k==='化合物'?3:0) + (s.plus||0);
  if(s.fx==='heal'){
    SFX.heal(); const at=center($('figMe')); burst(at.x,at.y,14,'#0B0B0B','sq');
    const up=Math.min(15, a.max-a.hp);
    popNum('+'+up, at, true); setHP(a, a.hp+up); await wait(900);
    return up>0 ? `${esc(label(a))}の 体力が ${up} もどった！` : `${esc(label(a))}の 体力は もう 満タン。回復は 体力が へってから 使おう。`;
  }
  if(s.fx==='guard'){
    await flyMol(s.f, $('figMe'), $('figMe')); SFX.guard(); a.guard=true; render();
    const d=await hitFoe(6, null); return `${esc(label(a))}は まもりを かためた！ 相手に ${d} の ダメージ。`;
  }
  let broke=false; if(s.fx==='break' && b.guard){ b.guard=false; broke=true; }  /* 当てる前に まもりを消す（後だと まもりで半分にされてから消える） */
  const d=await hitFoe(base, s.f);
  let extra='';
  if(s.fx==='boost'||s.fx==='oxy'){ a.boost=true; extra=' 燃えやすくなった！'; }
  if(broke) extra=' 相手の まもりを 消して 当てた！';
  if(s.fx==='drain' && b.power>0){ b.power--; extra=' 相手の ちからが 1 へった！'; }
  if(s.fx==='flinch'){ b.flinch=true; extra=' 相手は ひるんだ！'; }
  if(s.fx==='douse'){ if(b.boost){ b.boost=false; extra=' 相手の 火が 消えた！'; } setHP(a,a.hp+6); extra+=' 体力 +6。'; }
  render();
  return `相手に ${d} の ダメージ！${extra}`;
}

async function startTurn(){
  if(G.over) return;
  G.tid++; const tid=G.tid; G.T++;
  const p=me();
  if(p.skipNext){
    p.skipNext=false; G.hideHand=true; render();
    SFX.fizzle();
    await say(`${esc(label(p))}は 審判の 笛で 1回 お休み。<br><span style="font-size:.85em;opacity:.85">連打・あてずっぽう・とばし読みを すると 手番が 飛ぶ。</span>`, {hold:1800});
    if(tid!==G.tid) return;
    G.cur=1-G.cur; return startTurn();
  }
  /* 手番のはじめに 1枚ひく（10枚まで） */
  if(p.hand.length<10){ p.hand.push(pick(DECK)); p._new=[p.hand.length-1]; }
  if(G.mode==='2p'){ G.hideHand=true; render(); await blind(); if(tid!==G.tid) return; }
  G.hideHand=false; render();
  if(window.BGM) BGM.mood(Math.min(G.P[0].hp,G.P[1].hp)<=30?'tense':'normal');
  /* 節目のゆっくり解説（飛ばせない時間がある） */
  if(!p.cpu){
    if(G.T>=5 && !G.seen.L2){ await lesson('L2'); if(tid!==G.tid) return; }
    else if(G.T>=9 && !G.seen.L4){ await lesson('L4'); if(tid!==G.tid) return; }
  }
  if(p.cpu){ await cpuTurn(tid); return; }
  SFX.turn();
  await say(`${esc(label(p))}の番。どうする？`, {hold:0, quiet:true});
  if(tid!==G.tid) return;
  menu(tid);
}

function craft(s, tid){
  const p=me(); const used=[]; /* 手札の何番目を使ったか */
  const draw=()=>{
    const list=used.map(i=>p.hand[i]);
    openOv(`<h2>「${s.n}」を つくる</h2>
      <p class="lead">${s.n}の 化学式に なるように、原子を 入れよう。数も ぴったりに。</p>

      <div class="grpH">手札</div>
      <div id="craftHand">${p.hand.map((e,i)=>`<button class="card${used.includes(i)?' used':''}" data-i="${i}" ${used.includes(i)?'disabled':''}>${e}</button>`).join('')}</div>

async function resolveCraft(s, used, tid){
  const p=me(); const list=used.map(i=>p.hand[i]);
  const ok=sameCount(atoms(trayFormula(list)), atoms(s.f));
  p.st.craft++; closeOv();
  if(ok){
    p.st.craftOk++;
    p.hand=p.hand.filter((e,i)=>!used.includes(i)); render();
    SFX.bond();
    await say(`${esc(label(p))}は ${fH(s.f)}（${s.n}）を つくった！`, {hold:500});
    if(tid!==G.tid) return;
    const r=await applySub(s);
    await say(r, {hold:700}); if(tid!==G.tid) return;
    await say(`<span style="font-size:.85em;opacity:.85">${esc(s.why)}</span>`, {hold:1500, quiet:true});
    return endTurn(tid);
  }
  SFX.fizzle();
  await say(`${fH(trayFormula(list))} では ${s.n}に ならない。技は 不発…`, {hold:400});
  if(tid!==G.tid) return;
  await explain(`<b>${s.n}の 化学式は ${fH(s.f)}</b><br>${atomsTalk(s.f)}<br>${esc(s.why.split('→')[0])}`);
  if(tid!==G.tid) return;
  endTurn(tid);
}

/* ---- 問題にこたえる ---- */
function makeQ(kind){
  kind = kind || pick(['s2n','n2s','mdl','n2f']);
  if(kind==='s2n'){
    const e=pick(Q_SYM2NAME); const ch=[ELEM[e].n, ...shuffle(CONFUSE[e]).slice(0,3).map(x=>ELEM[x].n)];
    return {kind, qH:`元素記号 <b style="font-family:var(--num);font-size:1.5em">${e}</b> は 何の元素？`, qU:`元素記号 ${e} は 何の元素？`, ch, cls:'', ex:ELEM[e].tip};
  }
  if(kind==='n2s'){
    const e=pick(Q_NAME2SYM); const ch=[e, ...shuffle(CONFUSE[e]).slice(0,3)];
    return {kind, qH:`「${ELEM[e].n}」の 元素記号は？`, qU:`「${ELEM[e].n}」の元素記号は？`, ch, cls:'f', ex:ELEM[e].tip+(ELEM[e].m?'（金属）':'（金属ではない）')};
  }
  if(kind==='mdl'){
    const f=pick(MODELS), s=subBy(f);
    const others=shuffle(SUB.filter(x=>x.f!==f && (MODELS.includes(x.f) || Object.keys(atoms(x.f)).some(e=>atoms(f)[e])))).slice(0,3).map(x=>x.n);
    return {kind, qH:`このモデルの 物質の 名前は？`, fig:molSVG(f,{scale:1.7})+`<div style="font-family:var(--num);font-size:26px;font-weight:700;margin-left:14px;align-self:center">${fH(f)}</div>`,
      qU:`モデル ${fU(f)} の物質の名前は？`, ch:[s.n,...others], cls:'', ex:`${fH(f)} は ${s.n}。${atomsTalk(f)}`};
  }
  /* n2f：物質名 → 化学式 */
  const s=pick(SUB); const wrong=wrongFormulas(s.f).slice(0,3);
  return {kind:'n2f', qH:`「${s.n}」の 化学式は？`, qU:`「${s.n}」の化学式は？`, ch:[s.f,...wrong], cls:'f', isF:1,
    ex:`${s.n}は ${fH(s.f)}。${atomsTalk(s.f)}${s.k==='単体'&&nAtoms(s.f)===2?' 気体の単体は 原子2個で1つの分子。':''}`};
}
/* まちがいの選択肢に 本当にある物質が まざらないように（範囲外の物質を「まちがい」と教えない） */
const NOT_REAL_OK = new Set(['CO','O3','H2O2','Cu2O','SO2','NO','NO2','Fe2O3','Fe3O4','CH4','HCl','NaOH','MgCl2','CuCl2','FeCl2','FeCl3','N2O','H2S','Na2O','AgCl',
  'FeS2','Cu2S','MgO2','AgO','Na2O2','CuO2','N2H4','C2H2','C2H4','C2H6']);
function wrongFormulas(f){
  const a=atoms(f), els=Object.keys(a), out=new Set();
  /* 気体の単体を 原子1個にする・金属を 2個にする */
  if(els.length===1){ const e=els[0]; out.add(a[e]===2?e:e+'2'); }
  /* 右下の数字を 動かす・取る・つける */
  els.forEach(e=>{
    const b={...a}; if(b[e]>1){ b[e]=1; } else { b[e]=2; }
    out.add(trayFormula(Object.entries(b).flatMap(([x,n])=>Array(n).fill(x))));
  });
  if(els.length>=2){ const b={}; els.forEach((e,i)=>b[e]=a[els[(i+1)%els.length]]); out.add(trayFormula(Object.entries(b).flatMap(([x,n])=>Array(n).fill(x)))); }
  /* 同じ原子をふくむ 別の物質 */
  shuffle(SUB).forEach(s=>{ if(s.f!==f && Object.keys(atoms(s.f)).some(e=>a[e])) out.add(s.f); });
  out.delete(f);
  let res=shuffle([...out].filter(x=>!NOT_REAL_OK.has(x) && !sameCount(atoms(x),a)));
  /* 原子1個の単体（Fe・Ag・Mg など）は 候補が足りない → まぎれやすい 元素記号で うめる */
  if(res.length<3 && els.length===1) shuffle(CONFUSE[els[0]]||[]).forEach(x=>{ if(res.length<3 && !res.includes(x) && x!==f) res.push(x); });
  return res;
}

function buildRxn(r, tid){
  const nL=r.L.length, nR=r.R.length;

  const pal=shuffle([...new Set([...r.L.map(x=>x[1]), ...r.R.map(x=>x[1]), ...r.x])]);
  const minMoves = nL+nR + [...r.L,...r.R].reduce((a,[c])=>a+(c-1),0);
  const draw=()=>{
    const term=i=>{ const f=S.slots[i], c=S.coef[i];
      return `<div class="term"><div class="box">
        <div class="coef" data-mash-ok><button data-up="${i}" aria-label="係数を ふやす">▲</button><b class="${c===1?'one':''}">${c}</b><button data-dn="${i}" aria-label="係数を へらす">▼</button></div>
        <button class="slot ${S.sel===i?'sel':''} ${f?'filled':''}" data-s="${i}">${f?fH(f):'？'}</button></div>
        <div style="min-height:50px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:220px">${f?Array(Math.min(c,4)).fill(molSVG(f,{scale:.7})).join(''):''}</div></div>`; };
    let eq=''; for(let i=0;i<nL;i++){ if(i) eq+='<span class="op">＋</span>'; eq+=term(i); }
    eq+='<span class="op">→</span>';
    for(let j=0;j<nR;j++){ if(j) eq+='<span class="op">＋</span>'; eq+=term(nL+j); }
    const cnt=countSides(S, nL);
    const els=[...new Set([...Object.keys(cnt.L),...Object.keys(cnt.R)])].sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
    const cntH = els.length ? els.map(e=>{ const l=cnt.L[e]||0, rr=cnt.R[e]||0, ok=l===rr;
      return `<div class="c ${ok?'':'ng'}">${e}：${l}</div><div class="c ${ok?'':'ng'}">${e}：${rr} ${ok?'＝':'≠'}</div>`; }).join('') : '<div style="opacity:.6">（入れると 数えられる）</div><div></div>';
    openOv(`<h2>${r.n}</h2>

      <div id="pal">${pal.map(f=>`<button data-f="${f}">${fH(f)}</button>`).join('')}</div>
      <div id="count"><div class="hd">左（反応前）の 原子</div><div class="hd">右（反応後）の 原子</div>${cntH}</div>
      <div class="row"><button class="wbtn main" id="rxGo" ${S.slots.every(Boolean)?'':'disabled'}>大技を 放つ</button><button class="wbtn" id="rxBook">ほかの技にする</button><button class="wbtn" id="rxBack">やめる</button></div>`);
    const box=$('ovBox');
    box.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{ SFX.card(); S.sel=+b.dataset.s; draw(); });
    box.querySelectorAll('#pal button').forEach(b=>b.onclick=()=>{ SFX.card(); S.slots[S.sel]=b.dataset.f; window.Tekitou&&Tekitou.move();
      const nx=S.slots.findIndex(x=>!x); if(nx>=0) S.sel=nx; draw(); });
    box.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; if(S.coef[i]<4){ S.coef[i]++; SFX.tick(); window.Tekitou&&Tekitou.move(); draw(); } });
    box.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; if(S.coef[i]>1){ S.coef[i]--; SFX.tick(); window.Tekitou&&Tekitou.move(); draw(); } });
    $('rxGo').onclick=()=>resolveRxn(r, S, nL, minMoves, tid);

function countSides(S, nL){
  const L={}, R={};
  S.slots.forEach((f,i)=>{ if(!f) return; const a=atoms(f), t=i<nL?L:R; Object.keys(a).forEach(e=>t[e]=(t[e]||0)+a[e]*S.coef[i]); });
  return {L,R};
}
function gcd(a,b){ return b?gcd(b,a%b):a; }
async function resolveRxn(r, S, nL, minMoves, tid){
  const p=me(); p.st.rxn++;
  const mine={L:S.slots.slice(0,nL).map((f,i)=>[S.coef[i],f]), R:S.slots.slice(nL).map((f,j)=>[S.coef[nL+j],f])};
  const key=side=>side.map(([c,f])=>f).sort().join('|');
  const fOk = key(mine.L)===key(r.L.map(x=>[0,x[1]])) && key(mine.R)===key(r.R.map(x=>[0,x[1]]));
  const cnt=countSides(S,nL), bal=sameCount(cnt.L,cnt.R);
  const g=S.coef.reduce((a,b)=>gcd(a,b));
  const exact = fOk && bal && g===1;
  closeOv();
  p.power-=2; render();
  if(exact){
    /* まぐれ判定（手あたりしだいに さわって 合っただけ？） */

      await new Promise(res=>{
        const hit=Tekitou.solved({min:minMoves, q:{q:'化学反応式の 係数（大きい数字）は 何をあらわす？', choices:['分子（または原子）の 数','原子の 重さ','反応の 速さ','温度'], ex:'係数は 分子（金属や炭素は 原子）の数。左右で 原子の数が そろうように つける。'},

    p.st.rxnOk++;
    await bigShow(r, true);
    if(tid!==G.tid) return;
    let pw=r.pw; let note='';
    if(r.burn && p.boost){ pw=Math.round(pw*1.5); p.boost=false; note='（燃えやすさで 1.5倍）'; }
    const d=await hitFoe(pw, null, {big:true});
    await say(`大技「${r.n}」！ 相手に ${d} の ダメージ！${note}`, {hold:900});
    if(tid!==G.tid) return;
    await say(`<span style="font-size:.85em;opacity:.85">${esc(r.why)}</span>`, {hold:1500, quiet:true});
    return endTurn(tid);
  }
  SFX.fizzle();
  let why;
  if(!fOk) why='化学式が ちがう物質が まざっている。';
  else if(!bal) why='左と右で 原子の数が そろっていない。';
  else why='原子の数は そろったが、係数は いちばん小さい 整数にする。';
  await say(`大技は 不発… ${why}`, {hold:400});
  if(tid!==G.tid) return;
  await explain(`<b>正しい 化学反応式</b><br><span style="font-family:var(--num);font-size:1.5em">${eqH(r)}</span><br>${countTalk(r)}<br>${esc(r.why)}`);
  if(tid!==G.tid) return;
  endTurn(tid);
}
function wrongEqs(r){
  const right=side2U(r.L)+' → '+side2U(r.R);
  const mono=f=>({O2:'O',H2:'H',Cl2:'Cl',N2:'N'}[f]||f);
  const cand=[
    {L:r.L.map(([c,f])=>[1,f]), R:r.R.map(([c,f])=>[1,f])},                 /* 係数なし */
    {L:r.L.map(([c,f])=>[c,mono(f)]), R:r.R.map(([c,f])=>[c,mono(f)])},     /* 気体の単体を 原子1個に */
    {L:r.L.map(([c,f])=>[c*2,f]), R:r.R.map(([c,f])=>[c,f])},               /* 左だけ 倍 */
    {L:r.L.map(([c,f])=>[c,f]), R:r.R.map(([c,f])=>[c*2,f])},               /* 右だけ 倍 */
    {L:r.L.map(([c,f])=>[c,f]), R:r.R.map(([c,f],i)=>[c, i===0&&r.x[0]&&subBy(r.x[0])?r.x[0]:f])} /* ちがう物質ができた */
  ];
  const out=[], seen=new Set([right]);
  cand.forEach(e=>{ const u=side2U(e.L)+' → '+side2U(e.R); if(seen.has(u)) return; seen.add(u);
    const L={},R={}; e.L.forEach(([c,f])=>{const a=atoms(f);for(const k in a)L[k]=(L[k]||0)+a[k]*c;}); e.R.forEach(([c,f])=>{const a=atoms(f);for(const k in a)R[k]=(R[k]||0)+a[k]*c;});
    e.bal=sameCount(L,R); out.push(e); });
  return out;
}
function countTalk(r){
  const L={}; r.L.forEach(([c,f])=>{ const a=atoms(f); Object.keys(a).forEach(e=>L[e]=(L[e]||0)+a[e]*c); });
  return '原子の数：'+Object.keys(L).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b)).map(e=>`${e}は 左右とも ${L[e]}個`).join('、')+'。';
}

/* 大技の演出：反応前の原子が ばらけて、反応後の分子に 組みかわる（原子の数は 変わらない） */
function bigShow(r, ok){
  return new Promise(async res=>{
    const B=$('big'), c=$('bigCv'), k=c.getContext('2d');
    B.classList.remove('hidden'); $('bigT').textContent=r.n; $('bigEq').innerHTML=''; $('bigCnt').textContent='';
    const d=Math.min(2,devicePixelRatio||1), W=c.clientWidth, H=c.clientHeight; c.width=W*d; c.height=H*d; k.setTransform(d,0,0,d,0,0);
    const place=(side, x0, x1)=>{
      const mols=[]; side.forEach(([n,f])=>{ for(let i=0;i<n;i++) mols.push(f); });
      const out=[]; const span=(x1-x0)/mols.length;
      mols.forEach((f,mi)=>{ const cxm=x0+span*(mi+.5); molLayout(f).forEach(([e,x,y])=>out.push({e,x:cxm+x*K,y:H/2+y*K+(mols.length>2?(mi%2?44:-44):0)})); });
      return out;
    };
    /* 原子の大きさ：いちばん横に長い側が 画面の4割に収まる倍率（大きく見せる・最大1.9倍） */
    const wide=side=>side.reduce((a,[n,f])=>{ const l=molLayout(f); const xs=l.map(([e,x])=>x); return a+n*((Math.max(...xs)-Math.min(...xs))+44); },0);
    const K=Math.max(.9, Math.min(1.9, (W*.4)/Math.max(wide(r.L),wide(r.R),1)));
    const A=place(r.L, 20, W*.42), Z=place(r.R, W*.58, W-20);
    /* 同じ元素どうしを 対応させる */
    const pool={}; Z.forEach((z,i)=>{ (pool[z.e]=pool[z.e]||[]).push(i); });
    const pairs=A.map(a=>{ const j=(pool[a.e]||[]).shift(); return {e:a.e, a, z:j!=null?Z[j]:a}; });
    const drawAtom=(e,x,y)=>{ const rr=(ELEM[e]||{r:18}).r*1.05*K; k.beginPath(); k.arc(x,y,rr,0,7); k.fillStyle='#0B0B0B'; k.fill(); k.lineWidth=3; k.strokeStyle='#FAFAF5'; k.stroke();
      k.fillStyle='#FAFAF5'; k.font='700 '+Math.round(rr*.95)+'px "Avenir Next Condensed",sans-serif'; k.textAlign='center'; k.fillText(e,x,y+rr*.35); };
    const frame=t=>{ k.clearRect(0,0,W,H);
      k.strokeStyle='#444'; k.lineWidth=2; k.beginPath(); k.moveTo(W/2-30,H/2); k.lineTo(W/2+30,H/2); k.lineTo(W/2+18,H/2-10); k.moveTo(W/2+30,H/2); k.lineTo(W/2+18,H/2+10); k.stroke();
      pairs.forEach((p,i)=>{ const u=Math.max(0,Math.min(1,(t-i*.03)/(1-pairs.length*.03||1)));
        const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
        const lift=Math.sin(e*Math.PI)*(i%2?-70:70);
        drawAtom(p.e, p.a.x+(p.z.x-p.a.x)*e, p.a.y+(p.z.y-p.a.y)*e+lift); }); };
    frame(0);
    $('bigEq').innerHTML=side2H(r.L)+' →';
    SFX.power();
    await wait(CALM?300:900);
    const dur=CALM?300:1500, t0=performance.now();
    SFX.whoosh();
    await new Promise(rs=>{ const st=now=>{ const t=Math.min(1,(now-t0)/dur); frame(t); if(t<1) requestAnimationFrame(st); else rs(); }; requestAnimationFrame(st); });
    $('bigEq').innerHTML=eqH(r);
    $('bigCnt').textContent=countTalk(r).replace(/。$/,'');
    SFX.bond();
    if(!CALM){ B.animate([{background:'#FAFAF5'},{background:'#0B0B0B'}],{duration:260}); }
    await wait(CALM?600:1500);
    B.classList.add('hidden'); res();
  });
}

      p.st.rxnOk++;
      await bigShow(rx, true); if(tid!==G.tid) return;
      let pw=rx.pw; if(rx.burn&&p.boost){ pw=Math.round(pw*1.5); p.boost=false; }
      const d=await hitFoe(pw, null, {big:true});
      await say(`${esc(label(foe()))}に ${d} の ダメージ！`, {hold:900});
    } else {
      SFX.fizzle();
      const w=pick(wrongEqs(rx));
      await say(`<span style="font-family:var(--num)">${side2H(w.L)} → ${side2H(w.R)}</span>…${w.bal?'ちがう物質が できてしまう！':'原子の数が 合わない！'} 不発。<br>正しくは <span style="font-family:var(--num)">${eqH(rx)}</span>`, {wait:true});
    }
    return endTurn(tid);
  }
  if(p.power<2 && r<0.4){
    const q=makeQ(pick(['s2n','n2s','n2f'])); p.st.quiz++;
    if(Math.random()<acc+0.1){
      p.st.quizOk++; p.power=Math.min(3,p.power+1); render(); SFX.power();
      await say(`${esc(label(p))}は 問題に こたえた。「${q.qH.replace(/<[^>]+>/g,'')}」→ ${q.isF?fH(q.ch[0]):esc(q.ch[0])}！ ちから +1。`, {hold:1400});
    } else {
      SFX.fizzle();
      const w=q.ch[1+rnd(3)];
      await say(`${esc(label(p))}は「${q.qH.replace(/<[^>]+>/g,'')}」に ${q.isF?fH(w):esc(w)} と こたえた… はずれ。正しくは ${q.isF?fH(q.ch[0]):esc(q.ch[0])}。`, {wait:true});
    }
    return endTurn(tid);
  }
  const s=pick(SUB); p.st.craft++;
  if(Math.random()<acc){
    p.st.craftOk++;
    SFX.bond();
    await say(`${esc(label(p))}は ${fH(s.f)}（${s.n}）を つくった！`, {hold:500}); if(tid!==G.tid) return;
    const msg=await applySub(s);
    await say(msg.replace('相手に', esc(label(foe()))+'に'), {hold:900});
  } else {
    SFX.fizzle();
    const w=wrongFormulas(s.f)[0]||s.f.replace(/\d/g,'');
    await say(`${esc(label(p))}は ${s.n}を ${fH(w)} で つくろうとした… 不発！<br>${s.n}は ${fH(s.f)}。`, {wait:true});
  }
  return endTurn(tid);
}

/* =========================================================
   2人対戦の 目隠し
   ========================================================= */
function blind(){
  return new Promise(res=>{
    const p=me();
    $('blindBox').innerHTML=`<div class="fig">${heroSVG(p.hero,'#FAFAF5','#0B0B0B')}</div>
      <p><b style="font-size:26px">${esc(p.hero.n)}</b> の番。<br>iPad を 渡してね。相手は 画面を 見ないで。</p>
      <p style="font-size:16px;opacity:.75">体力　${esc(G.P[0].hero.n)} ${G.P[0].hp}　／　${esc(G.P[1].hero.n)} ${G.P[1].hp}</p>
      <button class="wbtn main" id="blGo">わたしの番を はじめる</button>`;
    $('blind').classList.remove('hidden');
    $('blGo').onclick=()=>{ SFX.sel(); $('blind').classList.add('hidden'); res(); };
  });
}

/* =========================================================
   決着
   ========================================================= */
async function victory(wi){
  G.over=true; G.tid++; render();
  const w=G.P[wi], l=G.P[1-wi];
  const at=center(wi===G.cur?$('figFoe'):$('figMe'));
  burst(at.x,at.y,40,'#0B0B0B','atom');
  if(window.BGM) BGM.mood('clear'); SFX.win();
  await say(`${esc(label(l))}は たおれた。<br>${esc(label(w))}の 勝ち！`, {hold:1600});
  const sum=p=>`つくれた分子 ${p.st.craftOk}/${p.st.craft}　正解した問題 ${p.st.quizOk}/${p.st.quiz}　大技 ${p.st.rxnOk}/${p.st.rxn}`;
  const humans=G.P.filter(p=>!p.cpu);
  $('endBox').innerHTML=`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      <div class="fig" style="width:130px;height:130px">${heroSVG(w.hero,'#FAFAF5','#0B0B0B')}</div>
      <div><div style="font-size:15px;letter-spacing:.2em;opacity:.7">勝者</div><div style="font-size:34px;font-weight:800">${esc(label(w))}</div></div></div>
    <table class="tbl">${G.P.map(p=>`<tr><td style="white-space:nowrap;font-weight:700">${esc(label(p))}</td><td>${sum(p)}</td></tr>`).join('')}</table>
    <p class="lead" style="font-size:16px;opacity:.85">勝ち負けより、まちがえた 化学式を 覚えたかが 大事。最後に 確認テスト（10問）。</p>
    <div class="row">${humans.map((p,i)=>`<button class="wbtn main" data-t="${G.P.indexOf(p)}">確認テスト${humans.length>1?'（'+esc(p.hero.n)+'）':'へ'}</button>`).join('')}
      <button class="wbtn" id="again">もう一戦</button><button class="wbtn" id="toTitle">タイトルへ</button></div>`;
  $('endS').classList.remove('hidden');
  $('endBox').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ SFX.sel(); startTest(G.P[+b.dataset.t].hero); });
  $('again').onclick=()=>{ SFX.sel(); $('endS').classList.add('hidden'); begin(G.P.map(p=>p.hero), G.mode, G.lv); };
  $('toTitle').onclick=()=>{ SFX.sel(); location.reload(); };
}

/* =========================================================
   確認テスト（範囲の 1〜6 から 10問）
   ========================================================= */
let TQ=null;
function testQs(){
  const qs=[makeQ('s2n'),makeQ('s2n'),makeQ('n2s'),makeQ('n2s'),makeQ('mdl'),makeQ('mdl'),makeQ('n2f'),makeQ('n2f')];
  /* 同じ問題が重ならないように */
  const seen=new Set(); for(let i=0;i<qs.length;i++){ let t=0; while(seen.has(qs[i].qU) && t++<20) qs[i]=makeQ(qs[i].kind); seen.add(qs[i].qU); }
  shuffle(RXN).slice(0,2).forEach(r=>{
    const H=e=>side2H(e.L)+' <span style="margin:0 .25em">→</span> '+side2H(e.R), U=e=>side2U(e.L)+' → '+side2U(e.R);
    const opts=[[eqH(r),eqU(r)]];
    shuffle(wrongEqs(r)).forEach(b=>{ if(opts.length<4) opts.push([H(b),U(b)]); });
    qs.push({kind:'eq', qH:`「${r.n}」の 化学反応式として 正しいのは？`, qU:`「${r.n}」の化学反応式は？`, ch:opts.slice(0,4).map(o=>o[0]), chU:opts.slice(0,4).map(o=>o[1]), cls:'eqc', raw:1,
      ex:`${countTalk(r)} ${r.why}`});
  });
  return shuffle(qs);
}
function startTest(hero){
  $('endS').classList.add('hidden'); $('title').classList.add('hidden'); $('setup').classList.add('hidden');
  TQ={hero, qs:testQs(), i:0, ans:[]};
  window.Tekitou&&Tekitou.startTest();
  if(window.BGM) BGM.mood('calm');
  showTQ();
}
function chLabel(q,c){ return q.raw?c:(q.isF?fH(c):esc(c)); }
function chText(q,c){ if(q.raw) return q.chU[q.ch.indexOf(c)]; return q.isF?fU(c):c; }
function showTQ(){
  const q=TQ.qs[TQ.i];
  if(!q) return testEnd();
  const ch=shuffle(q.ch);
  $('endBox').innerHTML=`<div style="font-size:14px;letter-spacing:.2em;opacity:.7">確認テスト　${TQ.i+1} ／ ${TQ.qs.length}　（${esc(TQ.hero.n)}）</div>
    <div class="qText">${q.qH}</div>${q.fig?`<div class="qFig">${q.fig}</div>`:''}
    <div class="ch" id="tch">${ch.map(c=>`<button class="${q.cls}" data-v="${esc(c)}">${chLabel(q,c)}</button>`).join('')}</div><div id="tfb"></div>`;
  $('endS').classList.remove('hidden');
  window.Tekitou&&Tekitou.shown();
  let done=false;
  $('endBox').querySelectorAll('#tch button').forEach(b=>b.onclick=()=>{
    if(done) return; done=true;
    const v=b.dataset.v, ok=v===q.ch[0];
    TQ.ans.push({q, ok, y:v});
    $('endBox').querySelectorAll('#tch button').forEach(x=>{ x.disabled=true; if(x.dataset.v===q.ch[0]) x.classList.add('ok'); else if(x===b) x.classList.add('ng'); });
    (ok?SFX.ok:SFX.fizzle)();
    $('tfb').innerHTML=`<div class="ex" id="tex">${ok?'<b>正解</b>':'<b>正解は '+chLabel(q,q.ch[0])+'</b>'}<br>${q.ex}</div><div class="row"><button class="wbtn main" id="tnext">つぎへ</button></div>`;
    const nb=$('tnext');
    if(window.Tekitou) Tekitou.gate(nb,{el:$('tex'), ok});
    /* 番人への報告は「つぎへ」を出した後に（先に報告すると 番人が同じボタンに もう1つ 関所をかけ、
       短い方が先に外れて「押せそうなのに押せない」ボタンになる） */
    window.Tekitou&&Tekitou.answer(ok,{q:{id:'bb'+TQ.i, q:q.qU}});
    nb.onclick=()=>{ if(nb.classList.contains('tk-gated')) return; TQ.i++; showTQ(); };
  });
}
function testEnd(){
  const sc=TQ.ans.filter(a=>a.ok).length, n=TQ.qs.length;
  /* 2人対戦：まだテストを受けていない もう1人がいれば、結果画面から そのまま 進めるようにする */
  if(G.mode==='2p' && G.P.length){ G.tested=G.tested||[]; if(!G.tested.includes(TQ.hero)) G.tested.push(TQ.hero); }
  const nextH = (G.mode==='2p' && G.P.length) ? (G.P.map(p=>p.hero).find(h=>!G.tested.includes(h))||null) : null;
  $('endBox').innerHTML=`<h2 style="margin:0 0 6px;font-size:26px">確認テスト けっか</h2>
    <div style="font-family:var(--num);font-weight:800;font-size:64px">${sc}<span style="font-size:26px"> / ${n}</span></div>
    <table class="tbl">${TQ.ans.map((a,i)=>`<tr><td style="width:2em;font-weight:800">${a.ok?'○':'×'}</td><td>${i+1}. ${a.q.qH}${a.ok?'':'<br><span style="opacity:.75">正解：'+chLabel(a.q,a.q.ch[0])+'</span>'}</td></tr>`).join('')}</table>
    <div class="row"><button class="wbtn main" id="tCard">提出カードを 出す</button>${nextH?`<button class="wbtn main" id="tNextP">つぎは ${esc(nextH.n)}の 確認テスト</button>`:''}<button class="wbtn" id="tAgain">もう一戦</button><button class="wbtn" id="tTitle">タイトルへ</button></div>`;
  const card=()=>{ if(window.SubmitCard) TQ.card=SubmitCard.show({gameId:'req-bunshi-battle', unit:'中2理科　化学変化と原子・分子（元素記号・化学式・化学反応式）', game:'分子バトルRPG'+(G.P.length?'':'（確認テストのみ）'),
      name:'呼び名：'+TQ.hero.n, score:sc, total:n, marks:TQ.ans.map(a=>a.ok),
      records:G.P.length?[['対戦', G.mode==='cpu'?'CPUと（'+(G.lv?'ふつう':'やさしい')+'）':'2人で'],['勝敗', G.P.find(p=>p.hero===TQ.hero&&p.hp>0)?'勝ち':'負け']]:[['モード','確認テストだけ']],
      review:TQ.ans.map(a=>({q:a.q.qU, a:chText(a.q,a.q.ch[0]), y:chText(a.q,a.y), ok:a.ok}))}); };
  card();
  $('tCard').onclick=()=>{ if(window.SubmitCard){ if(TQ.card && SubmitCard.reopen) SubmitCard.reopen(TQ.card); else card(); } };
  if(nextH) $('tNextP').onclick=()=>{ SFX.sel(); startTest(nextH); };
  $('tAgain').onclick=()=>{ $('endS').classList.add('hidden'); if(G.P.length) begin(G.P.map(p=>p.hero), G.mode, G.lv); else location.reload(); };
  $('tTitle').onclick=()=>location.reload();
}

/* =========================================================
   はじまり（呼び名えらび）
   ========================================================= */
function setup(mode){
  const picks=[]; let lv=0; const need = mode==='2p'?2:1;
  const box=$('pickBox');
  const head=()=>{
    if(mode==='test'){ $('setupH').textContent='テストを受ける 呼び名を えらぶ'; $('setupL').textContent='名前は 打たない。提出カードには この呼び名が出る。'; return; }
    $('setupH').textContent = mode==='2p' ? (picks.length===0?'1人目の 呼び名を えらぶ':'2人目の 呼び名を えらぶ') : '呼び名を えらぶ';
    $('setupL').textContent = '名前は 打たない。姿は 教科書の 原子のモデル（◎＝銅 ●＝酸素 など）。';
  };
  const draw=()=>{
    head();
    box.innerHTML=HERO.map(h=>`<button data-h="${h.id}" class="${picks[picks.length-1]===h&&picks.length===need?'on':''}" ${picks.includes(h)&&!(picks.length===need&&picks[picks.length-1]===h)?'disabled':''}>${heroSVG(h,'#FAFAF5','#0B0B0B')}<span>${h.n}</span></button>`).join('');
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ SFX.sel(); const h=HERO.find(x=>x.id===b.dataset.h);
      if(picks.length===need) picks.pop(); picks.push(h);
      if(mode==='2p' && picks.length===1){ draw(); $('setupGo').disabled=true; return; }
      draw(); $('setupGo').disabled=false; });
    $('setupGo').disabled = picks.length!==need;
  };
  $('cpuLv').classList.toggle('hidden', mode!=='cpu');
  $('cpuLv').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{ SFX.sel(); lv=+b.dataset.lv; $('cpuLv').querySelectorAll('[data-lv]').forEach(x=>x.classList.toggle('main', x===b)); });
  $('setupGo').onclick=()=>{ if(picks.length!==need) return; SFX.sel(); $('setup').classList.add('hidden');
    if(mode==='test'){ G.P=[]; startTest(picks[0]); return; }
    const heroes = mode==='cpu' ? [picks[0], pick(HERO.filter(h=>h!==picks[0]))] : picks.slice();
    begin(heroes, mode, lv); };
  $('setupBack').onclick=()=>{ SFX.back(); if(mode==='2p'&&picks.length===1){ picks.pop(); draw(); return; } $('setup').classList.add('hidden'); $('title').classList.remove('hidden'); };
  $('title').classList.add('hidden'); $('setup').classList.remove('hidden');
  draw();
}
function begin(heroes, mode, lv){
  G.mode=mode; G.lv=lv||0; G.over=false; G.T=0; G.cur=0; G.tid++; G.tested=[];
  G.P=[newPlayer(heroes[0],false), newPlayer(heroes[1], mode==='cpu')];
  $('endS').classList.add('hidden');
  fitFx(); render();
  (async()=>{
    const tid=G.tid;
    if(mode==='cpu') await say(`${esc(label(G.P[1]))}が あらわれた！`, {hold:900});
    else await say(`${esc(G.P[0].hero.n)} と ${esc(G.P[1].hero.n)} の 決闘が はじまる！`, {hold:900});
    if(tid!==G.tid) return;
    G.T=0; startTurn();
  })();
}

/* 罰（連打・あてずっぽう・とばし読み）は「自分の手番が 飛ぶ」＝つぎの手番は お休み */
function penaltySkip(kind){
  if(kind==='lucky') return;
  if(G.over || !G.P.length || me().cpu) return;
  me().skipNext=true; render();
}
if(window.Tekitou) Tekitou.setup({onPenalty:penaltySkip, penaltyLabel:'つぎの手番は お休み'});

$('goCpu').onclick=()=>{ audio(); SFX.sel(); setup('cpu'); };
$('go2p').onclick=()=>{ audio(); SFX.sel(); setup('2p'); };
$('goTest').onclick=()=>{ audio(); SFX.sel(); setup('test'); };
$('calmSw').onclick=()=>{ CALM=!CALM; $('calmSw').setAttribute('aria-pressed',CALM); $('calmSw').textContent=CALM?'演出を もどす':'演出を減らす'; };
fitFx();
