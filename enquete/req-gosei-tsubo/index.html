<title>合成の壺ダンジョン ～元素記号・化学式・化学反応式～</title>
<!--
  設計メモ（勉強ゲーム職人・2026-10-05）
  ─ 生徒アンケートの希望「合成の壺で元素を合成して、その効果の薬草や杖にして戦う」シリーズ2本目
  ─ 範囲: 教科書ワーク p.94〜95「化学変化と原子・分子」①記号→名前 ②名前→記号 ③模型→物質名 ④物質名→化学式
          ⑤化学変化のモデル（係数で原子の数をそろえる） ⑥化学反応式。範囲外は入れていない
  ─ 名簿の型: 09 大粒ドットの射手（粗いドット絵の冒険／正しい値を選ぶことがそのまま攻撃）
      世界観: 16色まで・内部 288×192 を整数倍に拡大・補間なし／暗い地に光る粒を散らさない（灯りの届く所だけ見える）
      手触り: 倒すと止め90ms・白く光る・2つに割れて回りながら落ちる（重力0.4/フレーム）・画面揺れ1〜2px
              正解音は半音ずつ上げ、2オクターブで止める
      学び: 合間クイズにしない。かけらの識別＝拾う操作、壺の合成＝道具づくり、係数合わせ＝壺に火を入れる操作そのもの
  ─ 世界とメタファー（この単元の坑道にしか無い材料）: 岩盤と敷石・坑木（木の支柱）・素焼きに灰釉の壺・鉱石の本当の色
      （硫黄は黄、銅は赤茶、塩素は黄緑、酸化銅と酸化銀は黒っぽい、炭酸水素ナトリウムは白）
  ─ 配色（1色1意味）: 灯り #E9A23B＝自分の行動・押せる所／緑青 #2F7D68＝そろった・正解／赤錆 #A3392A＝体力・危険・ちがう
      地は岩盤の茶灰。問いの板は石灰岩の板（#DED6C4 に墨 #26211B）。紫・水色のグラデーション・ネオン・すりガラスは使わない
  ─ 書体: 問い・化学式＝ヒラギノ角ゴ（下付き数字は <sub>）／階の札＝ヒラギノ明朝の焼き印風。ドット書体は使わない
  ─ 音: 効果音は Web Audio で合成（毎回 ±4% 音程をゆらす）。BGM は GAME_FX（A ドリア・マリンバと爪弾き・ラテンの打楽器＝坑道の水滴）
      考えている間は効果音を鳴らさず、灯りのゆらぎも止める。演出は答えた後
  ─ 道具の効果は物質の本当の性質から（理由を1行出す）: 水＝回復／水素＝いちばん軽い→ふうせん／酸素＝燃やすはたらき→灯り
      窒素・二酸化炭素＝燃やすはたらきがない→火の粉を消す／塩素＝殺菌・漂白→カビ／塩＝ナメクジがちぢむ／アンモニア＝強いにおい
      鉄・銅と硫黄＝熱と光を出す→熱の巻物／マグネシウムの燃焼＝まぶしい白い光→閃光の杖／酸化銅の還元＝黒い盾が銅にもどる
  ─ 罰（guard.js）: 連打・あてずっぽう・とばし読み → 敵が1ターン動く。まちがい・節目は解説をカラオケ読み（飛ばせない）
  ─ 点検: same-look-causes.md A〜G を作る前と後に通した。人の顔は描かない（主人公はフードの後ろ姿）。外部読み込みなし
-->

<script>/*@GUARD_BEGIN*/
/* ==========================================================
   BGMエンジン（全ゲーム共通）  ─ BGM
   ─ 2026-10-03 オーナー指示「BGMも本気出していいよ。全力でやっていこう」から作った共通部品
   ─ ゲームの index.html の印の外に window.GAME_FX = { bgm:{…} } を書くと、そのゲーム専用の曲が鳴る。
     GAME_FX.bgm が無いゲームでは何も鳴らさない（ボタンも出さない）。書き方は _shared/fx-README.md
   ─ WebAudio だけで鳴らす（外部ファイル・外部サイトなし）。曲は1小節ずつ先読みで組み立てる
       ・曲のセクション（intro／A／B／S＝サビ／T＝ピンチ／Q＝静か）と form（流れる順）
       ・ドラム（キック・スネア・ハット・タム・シンバル・太鼓・ブラシ…を合成）／ベース／和音パッド／
         刻み（伴奏）／アルペジオ／メロディ／副旋律。テンポ・調・音階・拍子・スウィング・音色はデータで決める
   ─ ゲームの場面に合わせて強さを変える
       BGM.mood('normal')   ふつう
       BGM.mood('tense')    ピンチ・時間切れ間近（T セクションへ。無ければサビの和音で急かす）
       BGM.mood('calm')     静か（確認テスト中は自動でこれ）
       BGM.mood('clear')    クリアのジングル（Zukan.mainClear で自動）→ そのあと ふつう
       BGM.level(0〜3)      コンボなどで楽器を足す・引く（1がふつう）
       BGM.duck(ms)         一瞬小さくする（適当プレイ番の罰の瞬間は自動）

    setTimeout(function(){ d.remove(); }, ms);
    penSound(F.sound, F.pitch);
    try{ if(window.BGM && BGM.duck) BGM.duck(ms); }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate([60,40,120]); }catch(e){}
    try{ if(F.shake > 0 && !matchMedia('(prefers-reduced-motion:reduce)').matches && document.body.animate){ var k = 8 * F.shake; document.body.animate([{transform:'translate(-'+k+'px,2px)'},{transform:'translate('+(k-1)+'px,-3px)'},{transform:'translate(-'+(k-3)+'px,3px)'},{transform:'none'}], {duration:320}); } }catch(e){}
  }

  /* ---------------- 本編の罰の払い方 ----------------
     ゲームが onPenalty を渡していればゲーム自身の点で払う。なければ図鑑のかけら（次にもらう分から引く）。
     どちらも無いゲームでは、操作を止めるだけ（数字は出さない）。回数が増えるほど重くなる */
  function hasZukan(){ return !!(window.Zukan && Zukan.earn); }
  function gameCost(base){ S.game.k++; return Math.min(CFG.debtMax, base * S.game.k); }
  function costText(n){
    if(typeof CFG.onPenalty === 'function') return CFG.penaltyLabel || '−';
    if(hasZukan()) return 'かけら −' + n;
    return '';
  }
  function pay(kind, n){
    if(typeof CFG.onPenalty === 'function'){ try{ CFG.onPenalty(kind, n); }catch(e){} return; }
    if(hasZukan()) S.debt += n;
  }
  function gamePenalty(kind, base){
    ensureLoaded();
    if(kind === 'guess') S.game.guess++; else S.game.mash++;
    S.game.sus++; S.game.streak = 0;
    var n = gameCost(base);
    pay(kind, n); save();
    pen(kind, costText(n), hasZukan() && typeof CFG.onPenalty !== 'function' ? 'つぎに もらう かけらから 引かれるよ' : '');
    emit(kind, {cost:n});
  }
  function testPenalty(kind){
    S.test[kind]++;
    var extra = '確認テストの点 −1・提出カードが「ひび入り」になる';
    if(kind === 'skip'){
      if(S.test.skip % 2){ note('<b>とばし読み</b>　問題と解説、ちゃんと読んだ？ <em>あと1回で −1点</em>', 2400); emit('skip'); return; }
    }
    pen(kind, '−1点', extra);
    emit(kind);
  }

  /* ---------------- 連打 ---------------- */
  function excluded(t){
    return !t || !t.closest || !!t.closest('#sc-ov,.zk-ov,.tk-pen,.tk-chk .tk-ch,[data-mash-ok]');
  }
  function isButton(t){
    return !!t.closest('button,[role=button],a[href],input[type=button],input[type=submit],label,summary,.btn');
  }
  function onClick(e){
    var t = e.target, at = now();
    if(at < lockUntil){ e.preventDefault(); e.stopPropagation(); return; }
    if(excluded(t)) return;
    if(S.inTest && at - Math.max(S.lastAt, S.t0) > 180000) S.inTest = false; /* テストを途中でやめて本編へもどった */
    clicks.push(at); if(clicks.length > 8) clicks.shift();
    if(gateBlock(e)) return;
    if(t.closest('canvas')) return;
    if(!S.inTest && (!CFG.mash || !isButton(t))) return;
    taps.push(at);
    while(taps.length && at - taps[0] > CFG.mashMs) taps.shift();
    if(taps.length >= CFG.mashN){
      taps = []; e.preventDefault(); e.stopPropagation();
      if(S.inTest) testPenalty('mash'); else gamePenalty('mash', CFG.debtMash);
    }
  }

  /* ---------------- カラオケ読み ---------------- */
  function karaoke(el, cps){
    var chars = [];
    (function walk(node){
      var kids = [].slice.call(node.childNodes);
      for(var i=0;i<kids.length;i++){
        var c = kids[i];
        if(c.nodeType === 3){
          var txt = c.nodeValue; if(!txt) continue;
          var frag = document.createDocumentFragment();
          for(var j=0;j<txt.length;j++){
            var ch = txt.charAt(j), sp = document.createElement('span');
            sp.className = 'tk-kc'; sp.textContent = ch; frag.appendChild(sp);
            var ms = /\s/.test(ch) ? 30 : 1000 / cps;
            if(/[、，,]/.test(ch)) ms += 200; if(/[。！？!?]/.test(ch)) ms += 350;
            chars.push({sp:sp, ms:ms});
          }
          c.parentNode.replaceChild(frag, c);
        }else if(c.nodeType === 1 && !/^(SCRIPT|STYLE|SVG|svg|CANVAS|IMG|BUTTON|INPUT|TEXTAREA|SELECT)$/.test(c.tagName)){
          if(c.tagName === 'BR' && chars.length) chars[chars.length-1].ms += 220;
          walk(c);
        }
      }
    })(el);
    if(!chars.length) return null;
    el.classList.add('tk-kara');
    var total = 0; for(var k=0;k<chars.length;k++) total += chars[k].ms;
    var i = 0, timer = 0, stopped = false;
    function step(){
      if(stopped || !el.isConnected) return;
      if(i > 0) chars[i-1].sp.className = 'tk-kc lit';
      if(i >= chars.length) return;
      chars[i].sp.className = 'tk-kc now';
      var ms = chars[i].ms; i++;
      timer = setTimeout(step, ms);
    }
    step();
    return {total:total, stop:function(){ stopped = true; clearTimeout(timer); chars.forEach(function(c){ c.sp.className = 'tk-kc lit'; }); }};
  }
  /* 解説の文が入っている、いちばん小さい見えている要素を探す */
  function findTextEl(text){
    var key = strip(text); if(key.length < 6) return null;
    var head = key.slice(0, Math.min(16, key.length));
    var all = document.body.getElementsByTagName('*'), best = null, bestLen = 1e9;
    for(var i=0;i<all.length;i++){
      var e = all[i];
      if(/^(SCRIPT|STYLE|BUTTON|svg|SVG|HTML|BODY)$/.test(e.tagName) || e.closest('#sc-ov,.zk-ov,.tk-note,.tk-pen,svg')) continue;
      var t = strip(e.textContent);
      if(t.length >= bestLen || t.indexOf(head) < 0) continue;
      var r = e.getBoundingClientRect(); if(r.width < 4 || r.height < 4) continue;
      best = e; bestLen = t.length;
    }
    /* 見出し（「もう一歩」「正解：…」）ごと読ませるため、親が解説とほぼ同じ大きさなら親まで上がる */
    while(best && best.parentElement && best.parentElement !== document.body){
      var pl = strip(best.parentElement.textContent).length;
      if(pl > key.length * 1.6 + 40 || best.parentElement.querySelector('button,input,select,canvas')) break;
      best = best.parentElement;
    }
    return best;
  }

  /* ---------------- 解説の「つぎへ」を読み終わるまで止める ---------------- */
  var NEXT_RE = /^(▶|→|＞|>)?\s*(つぎ|次|NEXT|Next|next|答え合わせ|こたえあわせ|結果|けっか)/;
  function textOf(b){ return String(b.textContent || b.value || '').trim(); }
  function visible(el){
    if(!el || !el.isConnected || el.disabled) return false;
    var r = el.getBoundingClientRect(); if(r.width < 2 || r.height < 2) return false;
    var cs = getComputedStyle(el); return cs.visibility !== 'hidden' && cs.display !== 'none' && +cs.opacity > 0.05;
  }
  function nextButtons(){
    var out = [], bs = document.querySelectorAll('button,[role=button],input[type=button]');
    for(var i=0;i<bs.length;i++){ var b = bs[i]; if(excluded(b)) continue; if(NEXT_RE.test(textOf(b)) && visible(b)) out.push(b); }
    return out;
  }
  function gate(btn, opt){
    if(!btn) return;
    opt = opt || {};
    var ms = opt.ms, el = opt.el || null, kara = null;
    if(ms == null){
      if(!el && opt.text) el = findTextEl(opt.text);
      if(el) kara = karaoke(el, opt.ok ? CFG.readCpsOk : CFG.readCps);
      if(kara) ms = kara.total + 300;
      else { var n = strip(opt.text || '').length; ms = n ? n / (opt.ok ? CFG.readCpsOk : CFG.readCps) * 1000 : (opt.ok ? 700 : 1200); }
    }
    ms = Math.min(CFG.readMax, ms);
    if(ms <= 0) return;
    ensureCSS();
    var g = {b:btn, until:now() + ms, tries:0, kara:kara};
    gates.push(g);
    btn.classList.add('tk-gated'); btn.style.setProperty('--tk-ms', (ms/1000) + 's');
    g.timer = setTimeout(function(){ ungate(g, true); }, ms);
  }
  function ungate(g, ready){
    var i = gates.indexOf(g); if(i >= 0) gates.splice(i, 1);
    clearTimeout(g.timer);
    if(g.kara) g.kara.stop();
    if(g.b){ g.b.classList.remove('tk-gated'); if(ready && g.b.isConnected){ g.b.classList.add('tk-ready'); setTimeout(function(){ g.b.classList.remove('tk-ready'); }, 2100); } }
  }
  function gateBlock(e){
    if(!gates.length) return false;
    var t = e.target, at = now();
    for(var i=gates.length-1;i>=0;i--){
      var g = gates[i];
      if(!g.b.isConnected){ ungate(g); continue; }
      if(at >= g.until){ ungate(g, true); continue; }
      if(g.b === t || g.b.contains(t)){
        e.preventDefault(); e.stopPropagation();
        g.tries++;
        if(g.tries >= 4){
          g.tries = 0;
          if(S.inTest){ S.test.skip += 2; pen('skip', '−1点', '確認テストの点 −1・提出カードが「ひび入り」になる'); emit('skip'); }
          else gamePenalty('skip', CFG.debtMash);
        }else{
          note('📖 光る文字を 目で追って 読もう　<em>あと ' + Math.ceil((g.until - at) / 1000) + ' 秒</em>', 1500);
        }
        return true;
      }
    }
    return false;
  }

  /* ---------------- 確認テスト ---------------- */
  function startTest(){
    S.inTest = true; S.t0 = now(); S.lastAt = 0; S.seen = {};
    S.test = {guess:0, mash:0, skip:0, n:0};
    if(!S.told){
      S.told = true;
      setTimeout(function(){
        note('📝 <em>確認テストのルール</em><br>● 問題が出てすぐ（2.5秒以内）の<b>まちがい</b> → あてずっぽう <b>−1点</b><br>● <b>連打</b>（1秒に7回） → <b>−1点</b><br>● 解説を<b>とばす</b>（光り終わる前に何度も押す・すぐ次を答える） → <b>−1点</b><br>罰があると 提出カードが「<b>ひび入り</b>」になる。わからない問題は、考えてから答えよう。', 5600);
      }, 350);
    }
  }
  function prevClickBefore(at){
    /* 答えを決めたクリック（いまから0.4秒以内）の、ひとつ前のクリック＝「つぎへ」を押した時刻 */
    var i = clicks.length - 1;
    if(i >= 0 && at - clicks[i] < 400) i--;
    return i >= 0 ? clicks[i] : 0;
  }
  function onTestAnswer(q, ok){
    var key = q && (q.id || q.q) ? String(q.id || strip(q.q)) : '#' + S.test.n;
    if(S.seen[key]) return;
    S.seen[key] = 1;
    var at = now(), gap = at - (S.lastAt || S.t0);
    S.lastAt = at; S.test.n++;
    var think = gap;
    if(!q || q.t === 'choice' || q.t == null){ var p = prevClickBefore(at); if(p && p > (S.t0 - 50)) think = Math.min(gap, at - p); }
    if(!ok && think < CFG.guessMs) testPenalty('guess');
    else if(S.test.n > 1 && gap < CFG.skipMs) testPenalty('skip');
    else if(ok && think >= CFG.guessMs) praise();
    if(!ok) S.game.streak = 0;
    /* 解説をカラオケ読みさせ、新しく出た「つぎへ」を読み終わるまで止める */
    var ex = q ? (q.ex || q.exp || '') : '';
    var before = nextButtons();
    setTimeout(function(){
      var after = nextButtons(), fresh = [];
      for(var i=0;i<after.length;i++) if(before.indexOf(after[i]) < 0) fresh.push(after[i]);
      if(!fresh.length) return;
      var ms = null, el = ex ? findTextEl(ex) : null, kara = el ? karaoke(el, ok ? CFG.readCpsOk : CFG.readCps) : null;
      if(kara) ms = kara.total + 300;
      for(var j=0;j<fresh.length;j++) gate(fresh[j], ms != null ? {ms:ms} : ex ? {text:ex, ok:ok, el:null} : {ms: ok ? 700 : 1200});
      if(kara && fresh.length) gates[gates.length-1].kara = kara;
    }, Math.max(40, lockUntil - now() + 40)); /* 罰の札が消えてから読み始める */
  }
  function penalty(){
    return S.test.guess + S.test.mash + Math.floor(S.test.skip / 2);
  }
  function fmtTime(ms){ var s = Math.round(ms/1000); return Math.floor(s/60) + '分' + String(s%60).padStart(2,'0') + '秒'; }

  /* ---------------- 本編の○×（ゲームが Tekitou.answer を呼んだとき） ---------------- */
  function onGameAnswer(ok){
    var at = now(), from = Math.max(S.game.shownAt || 0, S.game.lastAt || 0), think = from ? at - from : 1e9;
    S.game.lastAt = at;
    /* 子どもが押した（離した）直後に決まった正誤だけを数える。時間で自動に進む場面（流れてきた・ぶつかった）の正誤は数えない */
    var byHand = at - lastInputAt < 600;
    if(!byHand) { if(!ok) S.game.streak = 0; return; }
    if(ok) { S.game.wrongs = []; if(think >= CFG.guessMs) praise(); return; }
    S.game.streak = 0;
    S.game.wrongs.push(at);
    while(S.game.wrongs.length && at - S.game.wrongs[0] > CFG.burstMs) S.game.wrongs.shift();
    var fast = think < CFG.guessMs, burst = S.game.wrongs.length >= CFG.burstN;
    if(!(fast || burst)) return;
    S.game.wrongs = [];
    gamePenalty('guess', CFG.debtGuess);
  }

  /* ---------------- ごほうび：考えてから正解したら金の「本物 ×n」 ---------------- */
  function praise(){
    ensureCSS(); if(!document.body) return;
    S.game.streak++;
    var n = S.game.streak, d = document.createElement('div');
    var x = lastPt[0] || innerWidth / 2, y = lastPt[1] || innerHeight * .4;
    d.className = 'tk-real' + (n >= 5 ? ' big' : '');
    d.style.left = Math.max(70, Math.min(innerWidth - 70, x)) + 'px'; d.style.top = Math.max(40, y - 30) + 'px';
    d.innerHTML = '✨ 本物' + (n >= 2 ? ' <b>×' + n + '</b>' : '') + (n === 5 ? '<small>じっくり名人！</small>' : n === 10 ? '<small>理屈マスター！</small>' : '');
    document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 1300);
  }
  var lastPt = [0, 0], lastInputAt = 0;
  window.addEventListener('pointerdown', function(e){ lastPt = [e.clientX, e.clientY]; lastInputAt = now(); }, true);
  ['pointerup','click','keydown'].forEach(function(t){ window.addEventListener(t, function(){ lastInputAt = now(); }, true); });

  /* ---------------- まぐれ判定（パズルの手） ---------------- */
  function median(a){ if(!a.length) return 1e9; var b = a.slice().sort(function(x,y){return x-y}); return b[b.length >> 1]; }
  function solved(o){
    o = o || {};
    var mv = S.moves.slice(), n = mv.length, gaps = [];
    for(var i=1;i<n;i++) gaps.push(mv[i] - mv[i-1]);
    S.moves = [];
    var min = +o.min || 0;
    var many = min ? (n >= Math.max(min * 2 + 4, min + 6)) : (n >= 12);
    var lucky = many && median(gaps) < CFG.luckyGapMs;
    if(!lucky){
      if(n && (!min || n <= min + 2)) praise();
      if(o.onResult) try{ o.onResult(true); }catch(e){}
      return false;
    }
    S.game.lucky++; S.game.sus++; S.game.streak = 0;
    emit('lucky', {moves:n, min:min});
    if(o.defer){
      /* アクションの最中は止めない：まぐれを覚えておき、本編クリアのときに理屈チェック */
      note('🔍 <b>まぐれ？</b>　手あたりしだいに さわって 合っただけ かも。<br><em>クリアのときに 理屈チェック</em>が 出るよ', 3000);
      if(o.onResult) try{ o.onResult(false); }catch(e){}
      return true;
    }
    riddle({q:o.q, title:'まぐれ？', sub:'手あたりしだいに さわって 合っただけ かも。<br>理屈が わかっているか 1問で たしかめよう'}).then(function(ok){
      if(o.onResult) try{ o.onResult(ok); }catch(e){}
    });
    return true;
  }

  /* ---------------- 理屈チェック（1問） ---------------- */
  function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pickQ(){
    try{
      if(!window.Quiz || !Quiz.all) return null;
      var all = Quiz.all().filter(function(q){ return q.t === 'choice' && q.choices && q.choices.length >= 2 && !q.fig; });
      var k = '';
      try{ k = (Zukan._cur.koma || [])[0] || ''; }catch(e){}
      var mine = all.filter(function(q){ return !k || q.koma === k; });
      var pool = mine.length ? mine : all;
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    }catch(e){ return null; }
  }
  var riddleOpen = false;
  function riddle(o){
    return new Promise(function(res){
      var q = o.q || pickQ();
      if(!q || riddleOpen || !document.body){ res(true); return; }
      riddleOpen = true; ensureCSS();
      var shown = shuffle(q.choices), t0 = now(), done = false;
      var d = document.createElement('div'); d.className = 'tk-chk';
      d.innerHTML = '<div class="tk-card"><div class="tk-h">🔍 理屈チェック' + (o.title ? '<span>' + esc(o.title) + '</span>' : '') + '</div>' +
        '<p class="tk-sub">' + (o.sub || 'クリアの前に 1問だけ。ちゃんと わかってクリアしたか たしかめよう') + '</p>' +
        '<p class="tk-q"></p><div class="tk-ch"></div><div class="tk-ex"></div><div class="tk-go"></div></div>';
      d.querySelector('.tk-q').textContent = String(q.q || '').replace(/<[^>]*>/g, '');
      var box = d.querySelector('.tk-ch');
      shown.forEach(function(c){
        var b = document.createElement('button'); b.type = 'button'; b.textContent = String(c).replace(/<[^>]*>/g, '');
        b.onclick = function(){
          if(done) return; done = true;
          var ok = c === q.choices[0], think = now() - t0;
          [].forEach.call(box.children, function(x){ x.disabled = true; if(x.textContent === String(q.choices[0]).replace(/<[^>]*>/g, '')) x.className = 'ok'; else if(x === b) x.className = 'ng'; });
          var ex = d.querySelector('.tk-ex'), go = d.querySelector('.tk-go');
          if(ok && think >= CFG.guessMs){
            ex.innerHTML = '<div class="tk-big">本物！ ✨</div>';
            praise(); S.game.sus = 0; S.game.lucky = 0;
            setTimeout(function(){ d.remove(); riddleOpen = false; res(true); }, 1400);
            return;
          }
          ex.innerHTML = (ok ? '<b>正解。でも 早すぎ！</b> 考えてから 答えよう<br>' : '<b>もう一歩</b> 正解：' + esc(String(q.choices[0]).replace(/<[^>]*>/g, '')) + '<br>') + esc(String(q.ex || '').replace(/<[^>]*>/g, ''));
          ensureLoaded();
          var n = CFG.debtLucky; pay('lucky', n); save();
          var nb = document.createElement('button'); nb.type = 'button'; nb.className = 'tk-next'; nb.textContent = 'わかった（' + (costText(n) || 'もう一度 考えよう') + '）';
          nb.onclick = function(){ if(nb.classList.contains('tk-gated')) return; d.remove(); riddleOpen = false; res(false); };
          go.appendChild(nb);
          var kara = karaoke(ex, CFG.readCps);
          gate(nb, {ms: kara ? kara.total + 300 : 2500});
          if(kara && gates.length) gates[gates.length - 1].kara = kara;
        };
        box.appendChild(b);
      });
      document.body.appendChild(d);
    });
  }

  /* ---------------- 共通部品へのつなぎ ---------------- */
  function hookQuiz(){
    var Q = window.Quiz; if(!Q || Q.__tk) return; Q.__tk = 1;
    var test = Q.test, check = Q.check, review = Q.review;
    if(test) Q.test = function(){ var r = test.apply(this, arguments); startTest(); return r; };
    if(check) Q.check = function(q, ans){
      var ok = check.apply(this, arguments);
      if(!S.inReview){ try{ if(S.inTest) onTestAnswer(q, ok); }catch(e){} }
      return ok;
    };
    if(review) Q.review = function(){ S.inReview = true; try{ return review.apply(this, arguments); } finally { S.inReview = false; } };
  }
  function hookCard(){
    var C = window.SubmitCard; if(!C || C.__tk) return; C.__tk = 1;
    var show = C.show;
    C.show = function(r, onClose){
      try{
        if(r && S.t0){
          ensureLoaded();
          r = Object.assign({}, r);
          var raw = +r.score || 0, full = penalty(), p = Math.min(raw, full), rows = (r.records || []).slice(), why = [];
          if(S.test.guess) why.push('あてずっぽう ' + S.test.guess + '回');
          if(S.test.mash) why.push('連打 ' + S.test.mash + '回');
          if(S.test.skip) why.push('とばし読み ' + S.test.skip + '回');
          if(full > 0){ r.score = raw - p; rows.push(['適当プレイ', 'ひび入り −' + full + '点（' + why.join('・') + '）' + (full > p ? '　※0点より下にはならない' : '')]); }
          else if(why.length){ rows.push(['適当プレイ', why.join('・')]); }
          else rows.push(['解きかた', '◎ 本物（罰なし・じっくり解いた）']);
          rows.push(['テストの時間', fmtTime(now() - S.t0)]);
          if(S.game.mash || S.game.guess) rows.push(['ゲーム中の連打・あてずっぽう', (S.game.mash + S.game.guess) + '回']);
          r.records = rows;
          r.tekitou = {raw:raw, penalty:p, full:full, guess:S.test.guess, mash:S.test.mash, skip:S.test.skip, game:S.game.mash + S.game.guess};
        }
      }catch(e){}
      S.inTest = false; S.t0 = 0;
      return show.call(this, r, onClose);
    };
  }
  function hookZukan(){
    var Zk = window.Zukan; if(!Zk || Zk.__tk || !Zk.earn) return; Zk.__tk = 1;
    var earn = Zk.earn;

      ensureLoaded();
      if(S.debt > 0 && why !== 'pass'){
        n = Math.floor(Number(n) || 0);
        var cut = Math.min(S.debt, n);
        if(cut > 0){
          S.debt -= cut; n -= cut; save();
          if(!(opt && opt.silent)) setTimeout(function(){ note('<b>連打・あてずっぽう・とばし読み</b>の罰で かけら <em>−' + cut + '</em>', 2600); }, 600);

      return earn.call(this, n, why, opt);

    show:function(r,onClose){

  };

/* ---- 化学式の表示 ---- */
const SUBD='₀₁₂₃₄₅₆₇₈₉', SUPD={'2':'²','3':'³','4':'⁴'};
function fh(f){const m=/^(\d+)(.*)$/.exec(f);let co='',b=f;if(m){co=m[1];b=m[2]}
  b=b.replace(/\^(\d)/g,'§$1').replace(/([A-Za-z])(\d+)/g,(a,l,d)=>l+'<sub>'+d+'</sub>').replace(/§(\d)/g,'<sup>$1</sup>');
  return (co?'<span class="co">'+co+'</span>':'')+b}
function fu(f){const m=/^(\d+)(.*)$/.exec(f);let co='',b=f;if(m){co=m[1];b=m[2]}
  b=b.replace(/\^(\d)/g,(a,d)=>SUPD[d]||d).replace(/([A-Za-z])(\d+)/g,(a,l,d)=>l+d.split('').map(x=>SUBD[x]).join(''));return co+b}
function atoms(f){const o={};f.replace(/([A-Z][a-z]?)(\d*)/g,(a,s,d)=>{o[s]=(o[s]||0)+(d?+d:1);return a});return o}
function termH(c,f){return (c>1?'<span class="co">'+c+'</span>':'')+fh(f)}
function termU(c,f){return (c>1?c:'')+fu(f)}
function eqH(L,R){return L.map(t=>termH(t[0],t[1])).join(' + ')+' → '+R.map(t=>termH(t[0],t[1])).join(' + ')}
function eqU(L,R){return L.map(t=>termU(t[0],t[1])).join(' + ')+' → '+R.map(t=>termU(t[0],t[1])).join(' + ')}
function elColor(s){return EL[s]?EL[s].c:'#ccc'}
function elInk(s){return EL[s]&&EL[s].t?EL[s].t:'#26211B'}
function partsText(f){const a=atoms(f);return Object.keys(a).map(s=>EL[s].n+'原子 '+a[s]+'個').join('と ')}
function exFormula(f){

function tryGen(F){
  const m=[];for(let y=0;y<MH;y++)m.push(new Array(MW).fill(1));
  const rooms=[];
  for(let cy=0;cy<2;cy++)for(let cx=0;cx<3;cx++){
    const rw=3+rnd(2),rh=3+rnd(2),x0=cx*6+1+rnd(5-rw),y0=cy*6+1+rnd(5-rh);
    for(let y=y0;y<y0+rh;y++)for(let x=x0;x<x0+rw;x++)m[y][x]=0;
    rooms.push({x0,y0,w:rw,h:rh,cx,cy,c:{x:x0+(rw>>1),y:y0+(rh>>1)}});
  }
  const R=(cx,cy)=>rooms[cy*3+cx];
  function carve(a,b){let x=a.c.x,y=a.c.y;const hf=Math.random()<.5;
    const goX=()=>{while(x!==b.c.x){x+=Math.sign(b.c.x-x);m[y][x]=0}},goY=()=>{while(y!==b.c.y){y+=Math.sign(b.c.y-y);m[y][x]=0}};
    if(hf){goX();goY()}else{goY();goX()}}
  for(let cy=0;cy<2;cy++){carve(R(0,cy),R(1,cy));carve(R(1,cy),R(2,cy))}
  const cols=shuffle([0,1,2]);carve(R(cols[0],0),R(cols[0],1));if(Math.random()<.6)carve(R(cols[1],0),R(cols[1],1));
  for(let x=0;x<MW;x++){m[0][x]=1;m[MH-1][x]=1}for(let y=0;y<MH;y++){m[y][0]=1;m[y][MW-1]=1}
  G.map=m;
  const sr=pick(rooms);G.start={x:sr.c.x,y:sr.c.y};
  const dist=bfs(G.start.x,G.start.y,null);
  let far=null,fd=-1;rooms.forEach(r=>{const d=dist[r.c.y][r.c.x];if(d>fd&&r!==sr){fd=d;far=r}});
  if(!far||fd<8)return false;
  G.stairs={x:far.c.x,y:far.c.y,open:false};
  const mids=rooms.filter(r=>r!==sr&&r!==far);
  let potOK=false;
  for(const r of shuffle(mids)){
    const cand=[];for(let y=r.y0;y<r.y0+r.h;y++)for(let x=r.x0;x<r.x0+r.w;x++)cand.push({x,y});
    for(const p of shuffle(cand)){

      const d2=bfs(G.start.x,G.start.y,G.pot);let all=true;
      for(let y=0;y<MH&&all;y++)for(let x=0;x<MW;x++)if(!m[y][x]&&!(x===p.x&&y===p.y)&&d2[y][x]<0){all=false;break}

  G.en=[];

    if(p)G.en.push(mkEnemy(k,p.x,p.y))});

  G.P.x=G.start.x;G.P.y=G.start.y;G.P.ox=G.P.oy=0;

}

}

  G.en.forEach(e=>{if(lit(e.x,e.y)&&!e.seen){e.seen=true;if(e.k==='boss')say('奥に <b>坑道の主</b> がいる！ 熱と まぶしい光に よわいらしい。')}})}
let lastT=0,frame=0;
function draw(t){

    const k=Math.pow(.55,dt/16);G.P.ox*=k;G.P.oy*=k;G.en.forEach(e=>{e.ox*=k;e.oy*=k;if(e.fl>0)e.fl--});

    G.fx.deb.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.r+=p.vr;p.life--});G.fx.deb=G.fx.deb.filter(p=>p.life>0);

  /* 敵 */
  G.en.forEach(e=>{if(!lit(e.x,e.y)&&!G.seen[e.y][e.x])return;const X=e.x*T+e.ox,Y=e.y*T+e.oy;
    let nm=e.k;if(e.k==='fire'&&!quiet&&(frame>>3)%2)nm='fire2';if(e.k==='bat'&&!quiet&&(frame>>2)%2)nm='bat2';
    const sp=sprite(nm,null,e.fl>0);

    if(e.stun>0){cx.fillStyle='#F6D27A';for(let i=0;i<3;i++){const a=frame/10+i*2.1;cx.fillRect(X+7+Math.round(Math.cos(a)*5),Y+(e.k==='boss'?-15:-2)+Math.round(Math.sin(a)*2),1,1)}}
    if(e.flee>0){cx.fillStyle='#F1ECE0';cx.fillRect(X+13,Y+1,1,3);cx.fillRect(X+13,Y+5,1,1)}});
  /* 主人公（フードの後ろ姿・灯りを下げている） */
  {const P=G.P,X=P.x*T+P.ox,Y=P.y*T+P.oy;const sp=sprite('player');
    if(P.face<0){cx.save();cx.translate(X+16,Y);cx.scale(-1,1);cx.drawImage(sp,0,0);cx.restore()}else cx.drawImage(sp,X,Y);
    const lx=P.face<0?X:X+13;cx.fillStyle='#1A1410';cx.fillRect(lx,Y+8,3,5);cx.fillStyle='#E9A23B';cx.fillRect(lx+1,Y+9,1,3);cx.fillStyle='#F6D27A';cx.fillRect(lx+1,Y+10,1,1);cx.fillStyle='#8C6440';cx.fillRect(lx+1,Y+7,1,1)}
  /* 粒・割れた敵 */
  G.fx.parts.forEach(p=>{cx.fillStyle=p.c;cx.fillRect(Math.round(p.x),Math.round(p.y),p.s||1,p.s||1)});
  G.fx.deb.forEach(p=>{cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.drawImage(p.img,p.sx,0,8,16,-4,-8,8,16);cx.restore()});
  /* 暗がり（灯りの届く所だけ見える。8px ごとに段をつけたドットの暗さ） */
  const P=G.P,fl=(!quiet&&!lessMotion)?Math.sin(t/240)*.12+Math.sin(t/97)*.05:0,r=G.light+fl;
  const pcx=P.x+.5,pcy=P.y+.5;
  for(let y=0;y<MH*2;y++)for(let x=0;x<MW*2;x++){
    const tx=x>>1,ty=y>>1;let a;
    if(G.lightAll)a=0;
    else{const dx=(x+.5)/2-pcx,dy=(y+.5)/2-pcy,d=Math.sqrt(dx*dx+dy*dy);
      a=d<r-1?0:d<r-.4?.28:d<r+.3?.55:G.seen[ty][tx]?.72:1}
    if(a>0){cx.fillStyle=a>=1?'#17120E':'rgba(23,18,14,'+a+')';cx.fillRect(x*8,y*8,8,8)}
  }
  /* 案内の矢印（灯り色） */
  const ht=hintTarget();if(ht&&G.mode==='play'){const o=lessMotion?0:(Math.sin(t/180)>0?1:0);const X=ht.x*T-1-o,Y=ht.y*T-1-o,W=T+1+o*2;
    /* 目標のマスを 灯り色のかぎかっこで囲む */
    [[X,Y,1,1],[X+W,Y,-1,1],[X,Y+W,1,-1],[X+W,Y+W,-1,-1]].forEach(c=>{cx.fillStyle='#1A1410';cx.fillRect(c[0]-(c[2]<0?4:0)-1+(c[2]<0?1:0),c[1]-(c[3]<0?1:0)-1+(c[3]<0?1:0),6,3);
      cx.fillRect(c[0]-(c[2]<0?1:0)-1+(c[2]<0?1:0),c[1]-(c[3]<0?4:0)-1+(c[3]<0?1:0),3,6);
      cx.fillStyle='#E9A23B';cx.fillRect(c[0]-(c[2]<0?4:0),c[1]-(c[3]<0?1:0),5,1);cx.fillRect(c[0]-(c[2]<0?1:0),c[1]-(c[3]<0?4:0),1,5)})}

  cx.restore();
}
function burst(x,y,col,n,spd,g){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(spd||1)*(.4+Math.random());G.fx.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(g?1:0),g:g||0,life:18+rnd(18),c:Array.isArray(col)?pick(col):col,s:1+rnd(2)})}}
function float(s,tx,ty,c){G.fx.floats.push({s,x:tx*T+5,y:ty*T-2,c:c||'#F1ECE0',life:40})}
function doFlash(ms){if(lessMotion)return;const f=$('flash');f.animate([{opacity:.92},{opacity:0}],{duration:ms||600,easing:'ease-out'})}

/* =========================================================

function canAny(){return potRecipes().some(r=>r.can&&!r.done)}
function hintTarget(){
  if(G.mode!=='play')return null;
  if(G.stairs&&G.stairs.open)return G.stairs;
  if(canAny())return G.pot;
  if(G.fi===0||G.stats.idOk+G.stats.idNg<2){let b=null,bd=99;G.items.forEach(it=>{if(!G.seen[it.y][it.x])return;const d=dist2(it,G.P);if(d<bd){bd=d;b=it}});if(b)return b}
  return null}

/* =========================================================
   石灰岩の板（メッセージ・上の帯）
   ========================================================= */
const board=$('board');
function say(h){G.log.unshift(h);if(G.log.length>30)G.log.length=30;if(G.mode==='play')renderLog()}
function sealText(){const F=FLOORS[G.fi];if(F.boss)return G.stairs.open?'地上への縄ばしごが 下りてきた！':'封印: <b>坑道の主</b> を たおす';
  return G.stairs.open?'封印がとけた！ <b>縄ばしご</b> へ':'封印: 壺で 作る <b>'+Math.min(G.crafted,F.goal)+' / '+F.goal+'</b>'}

function hud(){

  let h='';for(let i=0;i<G.P.max;i++)h+='<i class="'+(i<G.P.hp?'':'e')+'"></i>';$('hpbar').innerHTML=h;$('hpn').textContent=G.P.hp+'/'+G.P.max;
  $('def').textContent='盾: '+['黒く酸化した銅の盾','赤茶に光る銅の盾','みがかれた銅の盾'][G.P.def];

  let n=0;for(const k in G.bag.it)n+=G.bag.it[k];for(const k in G.bag.sh)n+=G.bag.sh[k];$('bBag').textContent='持ち物（'+n+'）';
}
function bossHp(){const b=G.en.find(e=>e.k==='boss');return b?b.hp+'/'+EN.boss.hp:'0'}
function ctrlOn(on){$('ctrl').classList.toggle('off',!on)}

/* =========================================================
   1歩・ターン
   ========================================================= */
function enemyAt(x,y){return G.en.find(e=>e.x===x&&e.y===y)}
function act(dx,dy){
  if(G.mode!=='play')return;
  if(G.busy){G.queued=[dx,dy];return}
  const P=G.P;
  if(dx===0&&dy===0){endTurn();return}
  if(dx)P.face=dx;
  const nx=P.x+dx,ny=P.y+dy;
  if(G.pot&&nx===G.pot.x&&ny===G.pot.y){SFX.bump();P.ox=dx*4;P.oy=dy*4;openPot();return}
  if(wall(nx,ny)){SFX.bump();P.ox=dx*3;P.oy=dy*3;return}
  const e=enemyAt(nx,ny);
  if(e){P.ox=dx*7;P.oy=dy*7;hitEnemy(e,1,'体当たり');endTurn();return}
  P.x=nx;P.y=ny;P.ox=-dx*T;P.oy=-dy*T;SFX.step();markSeen();
  const it=G.items.find(i=>i.x===nx&&i.y===ny);
  if(it){G.items.splice(G.items.indexOf(it),1);pickup(it,()=>endTurn());return}
  if(G.stairs&&nx===G.stairs.x&&ny===G.stairs.y){
    if(G.stairs.open){descend();return}
    say(FLOORS[G.fi].boss?'縄ばしごは まだ下りてこない。主を たおそう。':'石のふたで 封印されている。壺で あと <b>'+(FLOORS[G.fi].goal-G.crafted)+'</b> つ 物質を作ろう。');
  }
  endTurn();
}
function endTurn(){
  G.turn++;G.busy=true;
  enemiesAct();markSeen();hud();
  if(G.mode==='play')renderLog();
  setTimeout(()=>{G.busy=false;const q=G.queued;G.queued=null;if(q&&G.mode==='play')act(q[0],q[1])},95);
  if(G.P.hp<=0)knockedOut();
}
function hitEnemy(e,dmg,how){
  e.hp-=dmg;e.fl=3;SFX.hit();float('-'+dmg,e.x,e.y,'#F6D27A');G.fx.shake=lessMotion?0:2;
  if(e.hp<=0)killEnemy(e,how);else say(EN[e.k].n+'に '+how+'！（あと '+e.hp+'）');
}
function killEnemy(e,how){
  const i=G.en.indexOf(e);if(i>=0)G.en.splice(i,1);
  G.stats.kills++;SFX.kill();G.fx.freeze=performance.now()+90;
  const nm=e.k==='fire'?'fire':e.k==='bat'?'bat':e.k;const img=sprite(nm,null,false);
  const X=e.x*T+8,Y=e.y*T+8;
  if(e.k==='boss'){burst(X,Y,['#57493F','#8FA3A8','#E9A23B','#3D3530'],60,2.2,.15);doFlash(500)}
  else{G.fx.deb.push({img,sx:0,x:X-4,y:Y,vx:-1.1,vy:-2.4,r:0,vr:-.18,life:40},{img,sx:8,x:X+4,y:Y,vx:1.1,vy:-2.6,r:0,vr:.2,life:40})}
  say(EN[e.k].n+'を '+how+'で たおした！');
  if(e.k==='boss')bossDown();
}
function enemiesAct(){
  const P=G.P;let hurt=0,who='';
  for(const e of G.en.slice()){
    if(G.en.indexOf(e)<0)continue;
    const D=EN[e.k];
    if(e.stun>0){e.stun--;continue}
    if(D.slow&&(G.turn+e.id)%2)continue;
    const steps=D.fast?2:1;
    for(let s=0;s<steps;s++){
      if(e.k==='mold'){
        if(dist2(e,P)===1){hurt+=attack(e);who=EN[e.k].n}
        else if((G.turn+e.id)%6===0&&G.en.filter(x=>x.k==='mold').length<6)spread(e);
        break}
      if(e.flee>0){e.flee--;stepEnemy(e,-1);continue}
      if(dist2(e,P)===1){hurt+=attack(e);who=EN[e.k].n;break}
      if(dist2(e,P)<=7&&(!D.fast||Math.random()<.75))stepEnemy(e,1);else stepEnemy(e,0);
    }
  }
  if(hurt>0)say(who+'の こうげき！ 体力 −'+hurt);
}
function passable(x,y){if(wall(x,y))return false;if(G.pot&&G.pot.x===x&&G.pot.y===y)return false;if(enemyAt(x,y))return false;if(G.P.x===x&&G.P.y===y)return false;return true}
function stepEnemy(e,dir){
  const P=G.P;let opts=shuffle([[1,0],[-1,0],[0,1],[0,-1]]).filter(d=>passable(e.x+d[0],e.y+d[1]));
  if(!opts.length)return;
  if(dir!==0){opts.sort((a,b)=>dir*(Math.abs(e.x+a[0]-P.x)+Math.abs(e.y+a[1]-P.y))-dir*(Math.abs(e.x+b[0]-P.x)+Math.abs(e.y+b[1]-P.y)));
    const cur=Math.abs(e.x-P.x)+Math.abs(e.y-P.y),nd=Math.abs(e.x+opts[0][0]-P.x)+Math.abs(e.y+opts[0][1]-P.y);if(dir>0&&nd>cur)return}
  else if(Math.random()<.4)return;
  const d=opts[0];e.x+=d[0];e.y+=d[1];e.ox=-d[0]*T;e.oy=-d[1]*T;
}
function attack(e){
  const D=EN[e.k],dmg=Math.max(1,D.atk-G.P.def);G.P.hp=Math.max(0,G.P.hp-dmg);
  e.ox=(G.P.x-e.x)*6;e.oy=(G.P.y-e.y)*6;SFX.hurt();float('-'+dmg,G.P.x,G.P.y,'#E8826E');G.fx.shake=lessMotion?0:2;return dmg}
function spread(e){const ds=shuffle([[1,0],[-1,0],[0,1],[0,-1]]);for(const d of ds){const x=e.x+d[0],y=e.y+d[1];if(passable(x,y)&&!G.items.some(i=>i.x===x&&i.y===y)&&!(G.stairs.x===x&&G.stairs.y===y)){G.en.push(mkEnemy('mold',x,y));if(lit(x,y))say('黒カビが 増えた。');return}}}
function knockedOut(){
  G.stats.down++;G.mode='lesson';ctrlOn(false);
  showCard({kicker:'力つきた…',title:'縄ばしごの下で 目をさました',body:'体力は もとにもどった。持ち物と 識別した記号は そのまま。\n敵の そばでは 壺で作った道具を 使おう（持ち物 → 使う）。',btn:'つぎへ ▶ 立ちあがる',ms:2500}).then(()=>{
    G.P.hp=G.P.max;G.P.x=G.start.x;G.P.y=G.start.y;G.en.forEach(e=>{if(dist2(e,G.P)<3){const fs=[];for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(passable(x,y)&&Math.abs(x-G.P.x)+Math.abs(y-G.P.y)>5)fs.push({x,y});const p=pick(fs);if(p){e.x=p.x;e.y=p.y}}});
    markSeen();play()});
}

/* =========================================================
   拾う → 識別（記号→名前／名前→記号／名前→化学式）
   ========================================================= */
function addShard(s){G.bag.sh[s]=(G.bag.sh[s]||0)+1}
function addItem(k,n){G.bag.it[k]=(G.bag.it[k]||0)+(n||1)}
function pickup(it,done){
  SFX.pick();burst(it.x*T+8,it.y*T+8,'#F6D27A',6,.8);

function symNameChoices(s){
  const pool=Object.keys(EL).filter(x=>x!==s),sim=shuffle(pool.filter(x=>x[0]===s[0])),oth=shuffle(pool.filter(x=>x[0]!==s[0]));
  return [{h:EL[s].n,ok:1,p:EL[s].n}].concat(sim.concat(oth).slice(0,3).map(x=>({h:EL[x].n,p:EL[x].n})))}
function nameSymChoices(s){
  const w=[];if(s.length===2)w.push(s.toUpperCase());else w.push(s.toLowerCase());
  const pool=Object.keys(EL).filter(x=>x!==s);shuffle(pool.filter(x=>x[0]===s[0])).forEach(x=>w.push(x));shuffle(pool.filter(x=>x[0]!==s[0])).forEach(x=>w.push(x));
  const u=[];w.forEach(x=>{if(x!==s&&u.indexOf(x)<0)u.push(x)});
  return [{h:s,ok:1,p:s}].concat(u.slice(0,3).map(x=>({h:x,p:x})))}
function formulaChoices(f){return [{h:fh(f),ok:1,p:fu(f)}].concat(WF[f].map(x=>({h:fh(x),p:fu(x)})))}
function modelNameChoices(f){
  const pool=['N2','H2','Mg','C','NH3','H2O','CuS','NaCl','O2','CO2','CuO','FeS','MgO','Cl2'].filter(x=>x!==f);
  const a=atoms(f),sh=shuffle(pool.filter(x=>Object.keys(atoms(x)).some(k=>a[k]))),ot=shuffle(pool.filter(x=>!Object.keys(atoms(x)).some(k=>a[k])));
  return [{h:SUB[f].n,ok:1,p:SUB[f].n}].concat(sh.concat(ot).slice(0,3).map(x=>({h:SUB[x].n,p:SUB[x].n})))}

        const nx=$('nx');nx.onclick=()=>{if(nx.classList.contains('tk-gated'))return;finish(true)};window.Tekitou&&Tekitou.gate(nx,{text:fb.querySelector('.why')?fb.querySelector('.why').textContent:'',ok:true,el:fb.querySelector('.why')})}

function haveSub(f){return (G.bag.it[f]||0)>0||(ATOMIC.includes(f)&&(G.bag.sh[f]||0)>0)}
function useSub(f){if((G.bag.it[f]||0)>0){G.bag.it[f]--;if(!G.bag.it[f])delete G.bag.it[f]}else{G.bag.sh[f]--;if(!G.bag.sh[f])delete G.bag.sh[f]}}
function potRecipes(){

  return F.rec.map(id=>{const r=RX[id],ins=r.L.map(t=>t[1]);return {id,kind:'rx',ins,can:ins.every(haveSub),done:!!G.made[G.fi+':'+id]}});

/* ---- 化学変化（係数をそろえる） ---- */
function potRx(r){
  const F=FLOORS[G.fi],R=RX[r.id],model=F.lv==='rx5';
  potStir('#F1ECE0');
  G.mode='pot';ctrlOn(false);
  const terms=R.L.map(t=>({f:t[1],side:0,ans:t[0],c:1})).concat(R.R.map(t=>({f:t[1],side:1,ans:t[0],c:1})));
  const bi=terms.findIndex(t=>t.side===1&&t.f===R.blank);
  /* 1. 空いた所に入る物質（模型か化学式）を選ぶ */
  const vis='<div class="eqb">'+terms.map((t,i)=>(i===R.L.length?'<span class="op">→</span>':i>0?'<span class="op">＋</span>':'')+
    '<div class="term">'+(i===bi?'<span class="blank">？</span>':(model?molSVG(t.f,17):'<span class="tf">'+fh(t.f)+'</span>'))+'<span style="font-size:13px;font-weight:700">'+(i===bi?'？':SUB[t.f].n)+'</span></div>').join('')+'</div>';
  const ch=[R.blank].concat(R.wr).map((f,i)=>({h:model?molSVG(f,17)+'<span style="font-size:15px">'+fh(f)+'</span>':fh(f),ok:i===0,p:fu(f)}));
  askChoice({head:R.n,visual:vis,prompt:(model?'？に入る <b>模型</b> は？':'？に入る <b>化学式</b> は？'),choices:ch,okLine:'そう、'+SUB[R.blank].n+'（'+fu(R.blank)+'）ができる',
    ex:'正解は <b>'+fh(R.blank)+'</b>（'+SUB[R.blank].n+'）。'+(MOLECULAR.includes(R.blank)?'1個の分子は '+partsText(R.blank)+'でできている。':exFormula(R.blank).split('。').slice(1).join('。')),
    onEnd:ok=>{if(!ok){say('壺の中身は 元にもどった。もう一度 ためせる。');play();return}G.mode='pot';ctrlOn(false);coefStep(R,terms,model,r)}});
}
function gcd(a,b){return b?gcd(b,a%b):a}
function coefStep(R,terms,model,r){
  const nL=R.L.length;let tries=0;G._terms=terms;
  const els=[];terms.forEach(t=>Object.keys(atoms(t.f)).forEach(s=>{if(els.indexOf(s)<0)els.push(s)}));
  function count(){const L={},Rr={};terms.forEach(t=>{const a=atoms(t.f);for(const s in a){const o=t.side?Rr:L;o[s]=(o[s]||0)+a[s]*t.c}});return [L,Rr]}
  function render(){
    const [L,Rr]=count();
    let h='<div class="bh">'+R.n+' <span class="sm">係数で そろえる</span></div><p class="lead">＋で 物質の数（係数）を ふやす。<b>化学式の右下の数は 変えない</b>。左右の原子の数が そろったら 壺に火を入れる。</p><div class="eqb">';
    terms.forEach((t,i)=>{
      if(i===nL)h+='<span class="op">→</span>';else if(i>0)h+='<span class="op">＋</span>';
      h+='<div class="term"><div class="cbx"><button class="cb" data-k="'+i+'" data-v="-1" data-mash-ok aria-label="へらす">−</button><span class="cn'+(t.c===1?' one':'')+'">'+t.c+'</span><button class="cb" data-k="'+i+'" data-v="1" data-mash-ok aria-label="ふやす">＋</button></div>'+
        '<span class="tf">'+fh(t.f)+'</span>'+(model?'<span class="tm">'+molsH(t.f,t.c,12)+'</span>':'')+'</div>';
    });
    h+='</div><div class="tally">';
    els.forEach(s=>{const a=L[s]||0,b=Rr[s]||0,ok=a===b;
      h+='<span class="el">'+s+'</span>'+(model?'<span class="dots">'+('<i style="--c:'+elColor(s)+'"></i>').repeat(a)+'</span>':'<span>左 <b>'+a+'</b></span>')+'<span>｜</span>'+(model?'<span class="dots">'+('<i style="--c:'+elColor(s)+'"></i>').repeat(b)+'</span>':'<span>右 <b>'+b+'</b></span>')+'<span class="st '+(ok?'ok':'ng')+'">'+(ok?'そろった':'ちがう')+'</span>'});
    h+='</div><div><button class="go" id="fire">壺に 火を入れる</button><button class="sub2" id="back">やめる</button></div><div class="fb" id="fb"></div>';
    board.innerHTML=h;
    board.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{const t=terms[+b.dataset.k],v=+b.dataset.v;const nc=Math.max(1,Math.min(6,t.c+v));if(nc===t.c)return;t.c=nc;SFX.coef(v>0);window.Tekitou&&Tekitou.move();const st=board.scrollTop;render();board.scrollTop=st});
    $('back').onclick=()=>{say('壺の中身は 元にもどった。');play()};
    $('fire').onclick=fire;
  }
  function fire(){
    const [L,Rr]=count();const bad=els.filter(s=>(L[s]||0)!==(Rr[s]||0));
    let g=0;terms.forEach(t=>g=gcd(g,t.c));
    const fb=$('fb');
    if(!bad.length&&g===1){
      const min=terms.reduce((a,t)=>a+Math.abs(t.ans-1),0);
      if(window.Tekitou)Tekitou.solved({min,q:riddleQ()});
      success();return}
    tries++;SFX.ng();G.streak=0;
    let ex;
    if(!bad.length)ex='原子の数は そろっている。でも 係数は <b>いちばん小さい整数</b> にする（ぜんぶ '+g+' でわれる）。';
    else ex=bad.map(s=>'<b>'+EL[s].n+'原子 '+s+'</b>：左 '+(L[s]||0)+'個 ／ 右 '+(Rr[s]||0)+'個').join('<br>')+'<br>少ない側の 物質の係数を ふやす。ふやすと ほかの原子も いっしょに ふえるので、もう一度 数えなおす。';
    if(tries>=3&&bad.length){const hint=terms.find(t=>t.c!==t.ans);if(hint)ex+='<br>ヒント：'+fh(hint.f)+' の係数は '+hint.ans+'。'}
    fb.innerHTML='<div class="bad">壺が ぷすん…と止まった</div><p class="ex" id="exx">'+ex+'</p><button class="go" id="nx">つぎへ ▶ 直す</button>';
    const nx=$('nx');nx.onclick=()=>{if(nx.classList.contains('tk-gated'))return;fb.innerHTML=''};
    if(window.Tekitou)Tekitou.gate(nx,{text:$('exx').textContent,ok:false,el:$('exx')});
    setTimeout(()=>board.scrollTop=board.scrollHeight,60);
  }
  function success(){
    G.streak++;
    R.L.forEach(t=>useSub(t[1]));
    const items=R.give.filter(g=>g!=='@shield');
    const giveTxt=items.map(g=>g[0]==='#'?'「'+USE[g.slice(1)].n+'」（'+USE[g.slice(1)].d+'）':(SUB[g].n+' '+fh(g)+(SUB[g].use?'（'+USE[SUB[g].use].n+'）':''))).join('・')+(R.give.includes('@shield')?'・盾が 銅にもどる（守り +1）':'');
    board.innerHTML='<div class="bh">化学変化が 起きた！</div><div class="vis" style="font:800 26px/1.4 var(--gothic)"><span>'+eqH(R.L,R.R)+'</span></div>'+(model?'<div class="eqb">'+terms.map((t,i)=>(i===nL?'<span class="op">→</span>':i>0?'<span class="op">＋</span>':'')+'<div class="term"><span class="tm">'+molsH(t.f,t.c,11)+'</span><span class="tf" style="font-size:16px">'+termH(t.c,t.f)+'</span></div>').join('')+'</div>':'')+
      '<div class="why"><span class="tag">手に入れた</span>'+giveTxt+'<br>なぜ？ '+R.why+'</div><button class="go" id="nx">つぎへ ▶</button>';
    SFX.ok(G.streak);
    const nx=$('nx');nx.onclick=()=>{if(nx.classList.contains('tk-gated'))return;madeIt(r.id,R.give,true)};
    window.Tekitou&&Tekitou.gate(nx,{text:board.querySelector('.why').textContent,ok:true,el:board.querySelector('.why')});
    potStir('#F6D27A');doFlash(R.give.includes('#flash')?700:0);
  }
  render();
}
function riddleQ(){

/* =========================================================
   確認テスト（範囲①〜⑥から2問ずつ・12問）
   ========================================================= */
function eqChoices(R){
  const L=R.L,Rr=R.R;const all=L.concat(Rr);
  const cor={h:eqH(L,Rr),ok:1,p:eqU(L,Rr)};
  const out=[cor],seen=[cor.p];
  const add=(L2,R2)=>{const p=eqU(L2,R2);if(seen.indexOf(p)<0&&!balanced(L2,R2)){seen.push(p);out.push({h:eqH(L2,R2),p})}};
  /* 係数を全部1にした（数がそろっていない） */
  add(L.map(t=>[1,t[1]]),Rr.map(t=>[1,t[1]]));
  /* 化学式のまちがい */
  R.wr.forEach(w=>add(L,Rr.map(t=>t[1]===R.blank?[t[0],w]:t)));
  /* 係数を1つずらす */
  for(let i=0;i<all.length&&out.length<6;i++){const L2=L.map(t=>t.slice()),R2=Rr.map(t=>t.slice());const tg=i<L.length?L2[i]:R2[i-L.length];tg[0]=tg[0]===1?2:tg[0]-1;add(L2,R2)}
  return [cor].concat(shuffle(out.slice(1)).slice(0,3))}
function balanced(L,R){const a={},b={};L.forEach(t=>{const m=atoms(t[1]);for(const s in m)a[s]=(a[s]||0)+m[s]*t[0]});R.forEach(t=>{const m=atoms(t[1]);for(const s in m)b[s]=(b[s]||0)+m[s]*t[0]});
  const ks=new Set(Object.keys(a).concat(Object.keys(b)));for(const k of ks)if((a[k]||0)!==(b[k]||0))return false;return true}
function buildTest(){

  shuffle(L2).slice(0,2).forEach(s=>Q.push({head:'② 元素名 → 元素記号',prompt:'<b>'+EL[s].n+'</b> の 元素記号は？',p:EL[s].n+' の元素記号は？',ch:nameSymChoices(s),ex:'正解は '+s+'。'+EL[s].ex}));
  shuffle(L3).slice(0,2).forEach(f=>Q.push({head:'③ 模型 → 物質名',visual:molSVG(f,22),prompt:'この模型の 物質の名前は？',p:fu(f)+' の模型の物質名は？',ch:modelNameChoices(f),ex:exModel(f)}));
  shuffle(L4).slice(0,2).forEach(f=>Q.push({head:'④ 物質名 → 化学式',prompt:'<b>'+SUB[f].n+'</b> の 化学式は？',p:SUB[f].n+' の化学式は？',ch:formulaChoices(f),ex:exFormula(f)}));
  shuffle(RX5).slice(0,2).forEach(id=>{const R=RX[id],terms=R.L.map(t=>[t[0],t[1],0]).concat(R.R.map(t=>[t[0],t[1],1]));const bi=terms.findIndex(t=>t[2]===1&&t[1]===R.blank),n=terms[bi][0];
    const vis='<div class="eqb">'+terms.map((t,i)=>(i===R.L.length?'<span class="op">→</span>':i>0?'<span class="op">＋</span>':'')+'<div class="term">'+(i===bi?'<span class="blank">？</span>':'<span class="tm">'+molsH(t[1],t[0],15)+'</span>')+'</div>').join('')+'</div>';
    const ch=[{h:molsH(R.blank,n,15),ok:1,p:n+'個の '+fu(R.blank)},{h:molsH(R.blank,n===1?2:1,15),p:(n===1?2:1)+'個の '+fu(R.blank)},{h:molsH(R.wr[0],n,15),p:n+'個の '+fu(R.wr[0])},{h:molsH(R.wr[1],n,15),p:n+'個の '+fu(R.wr[1])}];
    Q.push({head:'⑤ 化学変化のモデル　'+R.n,visual:vis,prompt:'？に入る 模型は？（左右で 原子の数が 合うもの）',p:R.n+'のモデルの？に入るのは？',ch,ex:R.n+'：'+eqU(R.L,R.R)+'。？には '+fu(R.blank)+' の模型が '+n+'個 入る。左右で 原子の種類と数が 同じになる。'})});
  shuffle(RX6).slice(0,2).forEach(id=>{const R=RX[id];Q.push({head:'⑥ 化学反応式',prompt:'<b>'+R.n+'</b> を表す 化学反応式は？',p:R.n+' を表す化学反応式は？',ch:eqChoices(R),one:true,ex:'正解は '+eqU(R.L,R.R)+'。左右で 原子の数が そろい、係数は いちばん小さい整数。'})});

/* テスト用の窓口（動作確認だけに使う） */
window.__gosei={showTQ,TS,potRecipes,G,FLOORS,RX,openPot,startTest,descend,useItem,addItem,addShard,genFloor,hud,play};

fit();requestAnimationFrame(draw);
if(TEST_ONLY){title();board.innerHTML='<div class="title-h">合成の壺ダンジョン</div><div class="title-s">確認テスト（12問）</div><button class="go" id="bT2">▶ 確認テストを はじめる</button>';$('bT2').onclick=()=>{ac();startTest()}}
else title();
})();
</script>
<script>window.ZUKAN_COUNTER={"db": "https://rika-zukan-rank-default-rtdb.asia-southeast1.firebasedatabase.app", "id": "req-gosei-tsubo"};
/* プレイ回数を数える（公開サイトのゲームにだけ build_site.py が入れる）
   送るのはゲームIDだけ。同じタブで開き直しても1回しか数えない。届かなくてもゲームには何も起きない */
(function(){
  var C=window.ZUKAN_COUNTER;if(!C||!C.db||!C.id||!/^[a-z0-9-]{2,40}$/.test(C.id))return;
  var k='zukan-played:'+C.id;
  try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
  try{fetch(C.db+'/plays/'+C.id+'.json',{method:'PUT',body:JSON.stringify({'.sv':{increment:1}}),keepalive:true})['catch'](function(){})}catch(e){}
})();
</script>
