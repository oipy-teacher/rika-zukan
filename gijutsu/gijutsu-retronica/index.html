<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>電脳ジャンクシティ レトロニカ ― 技術 1-4・2-1・2-2</title>
<style>
/* 色は「役目」で決める：琥珀＝入力／翡翠＝出力／真鍮＝処理（CPU・制御）／鋼＝記憶／赤＝暴走・エラー */
:root{
  --night:#16171a; --iron:#2a2b2f; --iron2:#36373c; --soot:#0d0e10;
  --brass:#c3913a; --brass-hi:#e9c77c; --brass-lo:#6b4a1b;
  --copper:#a85f36;
  --pcb:#1d4535; --pcb-line:#2c6a4f; --solder:#cfd5d6;
  --crt:#0e1611; --phos:#bfe9c3;
  --in:#f0b13a; --in-lo:#8a5f12;
  --out:#3dbb8c; --out-lo:#16654a;
  --mem:#8fb3c7; --mem-lo:#3e5f72;
  --ctl:#c3913a; --ctl-lo:#6b4a1b;
  --bad:#e2483a;
  --paper:#ece2cb; --ink:#2b2418;
  --slate:#24272a;
  --f-ui:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --f-mono:"Menlo","SF Mono","Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0b0c;overflow:hidden;font-family:var(--f-ui);color:#eee;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:1180px;height:820px;flex:none;background:var(--night);overflow:hidden;transform-origin:center center}
button{font-family:var(--f-ui);cursor:pointer;touch-action:manipulation}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}

/* 真鍮の板・リベット */
.plate{background:linear-gradient(180deg,#d6a752 0%,#b8862f 45%,#8e6322 100%);color:#2a1b05;border:2px solid #5a3d12;
  box-shadow:inset 0 2px 0 rgba(255,240,200,.55),inset 0 -2px 0 rgba(0,0,0,.25),0 3px 0 #3a280c}
.rv{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6dfa6,#9a6c25 60%,#4a320d);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.btn{border:none;border-radius:6px;padding:0 18px;height:52px;font-size:18px;font-weight:700;letter-spacing:.04em;position:relative}
.btn:active,.btn.press{transform:translateY(3px) scale(.97);box-shadow:inset 0 2px 0 rgba(255,240,200,.3),0 0 0 #3a280c}
.btn.dark{background:#3a3c42;color:#f2e6c9;border:2px solid #17181a;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 #0b0b0c}
.btn[disabled]{opacity:.38;pointer-events:none}

/* ===== 地図 ===== */
#scr-map{background:#121316}
#mapsvg{position:absolute;left:0;top:0;width:1180px;height:820px}
#maptitle{position:absolute;left:28px;top:20px;padding:10px 26px 12px 26px;border-radius:4px}
#maptitle h1{margin:0;font-size:34px;letter-spacing:.12em;font-weight:900}
#maptitle p{margin:2px 0 0;font-size:14px;font-weight:700;letter-spacing:.08em}
#mapside{position:absolute;right:20px;top:22px;display:flex;gap:10px}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #2b1c06;
  background:radial-gradient(circle at 38% 32%,#f1d08a,#b9852f 55%,#5d3f12);color:#2a1b05;font:900 17px var(--f-mono);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #1a1206,0 0 0 5px rgba(0,0,0,.35)}
.node.lock{background:radial-gradient(circle at 38% 32%,#6b6c70,#3b3c40 60%,#1f2023);color:#8a8b90}
.node.done{background:radial-gradient(circle at 38% 32%,#c9f3d6,#3dbb8c 55%,#155a41);color:#062a1c}
.node.boss{width:84px;height:84px;margin:-42px 0 0 -42px;font-size:15px;border-color:#3b0d08;
  background:radial-gradient(circle at 38% 32%,#ff9a86,#c8392b 55%,#5a120b);color:#fff}
.node.boss.done{background:radial-gradient(circle at 38% 32%,#c9f3d6,#3dbb8c 55%,#155a41);color:#062a1c}
.node.side{width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:8px;font-size:13px;
  background:linear-gradient(#e8dcc0,#c8b78f);color:#3a2a10;border-color:#4b3a1a}
.node.side.done{background:linear-gradient(#c9f3d6,#6fcfa5);}
.node.chk{width:70px;height:54px;margin:-27px 0 0 -35px;border-radius:6px;font-size:14px;background:linear-gradient(#f3e6c4,#d8c08a);color:#3a2a10;border-color:#4b3a1a}
.node.chk.done{background:linear-gradient(#c9f3d6,#6fcfa5)}
.nlabel{position:absolute;transform:translate(-50%,0);font-size:13px;font-weight:700;color:#e8dcc0;white-space:nowrap;
  text-shadow:0 1px 2px #000,0 0 6px #000;pointer-events:none}
.distname{position:absolute;padding:6px 14px;border-radius:3px;font-weight:900;font-size:19px;letter-spacing:.1em}
.distsub{display:block;font-size:12px;letter-spacing:.02em;font-weight:700;opacity:.85}

/* ===== 修理画面 ===== */
#scr-play{background:var(--night)}
#topbar{position:absolute;left:0;top:0;width:1180px;height:48px;display:flex;align-items:center;gap:10px;padding:0 10px;
  background:linear-gradient(#3b3c41,#26272b);border-bottom:2px solid #0b0b0c}
#topbar .btn{height:38px;font-size:15px;padding:0 14px}
#stitle{font-weight:900;font-size:18px;color:#f2e6c9;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:470px}
#stitle small{font-weight:700;color:#bba980;font-size:13px;margin-right:8px}
#phases{display:flex;gap:4px;margin-left:auto}
.ph{height:32px;padding:0 12px;border-radius:16px;display:flex;align-items:center;font-size:14px;font-weight:700;background:#1b1c1f;color:#77787d;border:2px solid #111}
.ph.on{background:var(--brass);color:#2a1b05;border-color:#5a3d12}
.ph.done{color:#bfe9c3}
#simrow{position:absolute;left:0;top:48px;width:1180px;height:246px}
#simbox{position:absolute;left:8px;top:8px;width:512px;height:232px;border-radius:10px;padding:8px;
  background:linear-gradient(#5b4a2c,#2e2413);border:2px solid #120d05;box-shadow:inset 0 2px 0 rgba(255,220,150,.25)}
#simbox .rv{z-index:2}
#sim{display:block;width:496px;height:216px;border-radius:14px/22px;background:var(--crt)}
#scan{position:absolute;left:8px;top:8px;width:496px;height:216px;border-radius:14px/22px;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#bosshp{position:absolute;left:24px;top:16px;width:300px;height:22px;display:none;z-index:3}
#bosshp .lab{font:700 12px var(--f-ui);color:#ffd6cf;text-shadow:0 1px 2px #000}
#bosshp .bar{height:10px;background:#3a0f0b;border:1px solid #000;margin-top:2px}
#bosshp .bar i{display:block;height:100%;background:var(--bad);transition:width .5s}
#envbox{position:absolute;left:528px;top:8px;width:272px;height:232px;border-radius:8px;background:#1f2024;border:2px solid #0e0e10;padding:10px 12px;overflow:hidden}
#envbox h4{margin:0 0 6px;font-size:13px;color:#bba980;letter-spacing:.06em}
.envnote{font-size:13px;color:#8d8e93;line-height:1.5}
.sl{margin:6px 0 10px}
.sl .row{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.sl .row b{font:700 18px var(--f-mono);color:var(--in)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#3a3b40,#55565c);border:1px solid #000}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;margin-top:-15px;border-radius:50%;border:3px solid #2b1c06;
  background:radial-gradient(circle at 38% 32%,#f9d58d,#c18c33 60%,#6b4a1b)}
input[type=range]:disabled{opacity:.45}
.envbtns{display:flex;flex-wrap:wrap;gap:8px}
.envbtns .btn{height:48px;font-size:15px;padding:0 12px;min-width:56px}
#bitbox{position:absolute;left:808px;top:8px;width:364px;height:232px}
#bit{position:absolute;left:0;top:0;width:86px;height:86px;cursor:pointer}
#bubble{position:absolute;left:92px;top:2px;width:272px;min-height:70px;max-height:98px;overflow:auto;background:var(--paper);color:var(--ink);
  border-radius:4px;padding:8px 11px;font-size:14px;line-height:1.5;font-weight:600;border:2px solid #5a4a2a}
#bubble:before{content:"";position:absolute;left:-12px;top:20px;border:6px solid transparent;border-right:8px solid #5a4a2a}
#bubble b{color:#8a2d12}
#tests{position:absolute;left:0;top:104px;width:364px;height:128px;background:#141517;border:2px solid #0a0a0b;border-radius:6px;padding:6px 8px;overflow:auto}
#tests h5{margin:0 0 3px;font-size:12px;color:#bba980;letter-spacing:.06em;display:flex;justify-content:space-between}
.ti{display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.3;margin:2px 0;color:#d7d8dc}
.ti i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #55565c;font-style:normal;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.ti.ok i{border-color:var(--out);background:var(--out);color:#062a1c}
.ti.ng i{border-color:var(--bad);background:var(--bad);color:#fff}
.ti.ok{color:#bfe9c3}

#work{position:absolute;left:0;top:294px;width:1180px;height:526px}
#hw{position:absolute;left:0;top:0;width:560px;height:526px;background:#121314;border-top:2px solid #0a0a0b}
#board{position:absolute;left:0;top:0;width:560px;height:404px;touch-action:none}
#tray{position:absolute;left:0;top:404px;width:560px;height:122px;display:flex;gap:6px;padding:8px 8px 8px 96px;align-items:stretch;
  background:linear-gradient(#3a2f1e,#241c10);border-top:3px solid #120d05;touch-action:none}
#tray .trlab{position:absolute;left:8px;top:10px;width:80px;font-size:13px;font-weight:900;color:#e8d3a4;line-height:1.3;letter-spacing:.05em}
#tray .trlab small{display:block;font-weight:600;font-size:11px;color:#b9a77f;letter-spacing:0;margin-top:4px}
.chip{width:62px;flex:none;border-radius:5px;background:#e9dfc8;border:2px solid #4a3a1c;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding-top:4px;color:#2b2418;font-size:11px;font-weight:700;line-height:1.15;text-align:center;touch-action:none}
.chip svg{width:52px;height:52px;pointer-events:none}
.chip span{pointer-events:none;padding:0 2px}
.chip.used{opacity:.18;pointer-events:none}
#hwok{position:absolute;right:10px;top:350px;height:46px;font-size:16px;z-index:3}
#sw{position:absolute;left:560px;top:0;width:620px;height:526px;overflow:hidden;background:#101112;border-top:2px solid #0a0a0b}
#swin{position:absolute;inset:0;background:var(--slate);transition:transform .6s cubic-bezier(.2,.9,.25,1)}
#swin.hidden{transform:translateX(100%)}
#swhead{position:absolute;left:0;top:0;width:620px;height:44px;display:flex;align-items:center;gap:8px;padding:0 10px 0 66px;background:#1b1d20;border-bottom:2px solid #0a0a0b}
#swhead .t{font-weight:900;color:#f2e6c9;letter-spacing:.06em}
#swhead .btn{height:34px;font-size:13.5px;padding:0 10px}
#swhead .cnt{margin-left:auto;font:700 14px var(--f-mono);color:#bba980}
#palette{position:absolute;left:0;top:44px;width:214px;height:482px;overflow-y:auto;overflow-x:hidden;padding:26px 6px 40px 10px;background:#1c1e21;border-right:2px solid #0a0a0b;touch-action:pan-y}
#palette .cat{font-size:11.5px;font-weight:700;color:#8d8e93;margin:6px 0 4px;letter-spacing:.06em}
#script{position:absolute;left:214px;top:44px;width:406px;height:482px;overflow:auto;padding:14px 14px 160px 14px;touch-action:pan-y;
  background-image:radial-gradient(circle,#33373b 1px,transparent 1.4px);background-size:22px 22px}
#shutter{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#3a3b40 0 58px,#2c2d31 58px 62px);display:flex;align-items:center;justify-content:center;transition:opacity .4s}
#shutter .msg{width:380px;padding:18px 22px;border-radius:4px;text-align:center;font-weight:800;line-height:1.6;font-size:16px}
#diagram{position:absolute;left:214px;top:44px;width:406px;height:482px;overflow:auto;background:#f1ead8;display:none;padding:10px}
#diagram.on{display:block}
#runbtn{position:absolute;left:522px;top:-14px;width:76px;height:76px;border-radius:50%;z-index:20;border:4px solid #2b1c06;
  background:radial-gradient(circle at 38% 30%,#ffe7ad,#d39b3c 50%,#7a5214);color:#2a1b05;font:900 19px var(--f-mono);letter-spacing:.02em;
  box-shadow:0 5px 0 #2b1c06,0 0 0 6px rgba(0,0,0,.45)}
#runbtn.stop{background:radial-gradient(circle at 38% 30%,#ffb3a8,#d2463a 50%,#6d140c);color:#fff;font-size:16px}
#runbtn[disabled]{filter:grayscale(1) brightness(.6);pointer-events:none}
#runbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #2b1c06,0 0 0 6px rgba(0,0,0,.45)}

/* ===== ブロック ===== */
.blk{position:relative;display:inline-flex;align-items:center;flex-wrap:wrap;gap:5px;min-height:40px;padding:5px 10px 5px 10px;margin:0;border-radius:4px;
  font-size:14.5px;font-weight:700;color:#1a1408;border:2px solid rgba(0,0,0,.45);touch-action:none;max-width:380px;line-height:1.25}
.blk.k-out{background:var(--out);border-color:var(--out-lo);color:#05271a}
.blk.k-in{background:var(--in);border-color:var(--in-lo)}
.blk.k-ctl{background:var(--ctl);border-color:var(--ctl-lo)}
.blk.k-mem{background:var(--mem);border-color:var(--mem-lo);color:#0f2633}
.blk.k-hat{background:#4a4b52;border-color:#1c1d20;color:#f2e6c9;border-radius:16px 16px 4px 4px;padding-top:9px}
.blk.cond{border-radius:20px;min-height:34px;padding:3px 12px}
.blk.c{display:inline-flex;flex-direction:column;align-items:stretch;padding:0;gap:0}
.blk.c > .hd,.blk.c > .md,.blk.c > .ft{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:5px 10px;min-height:38px}
.blk.c > .ft{min-height:16px;padding:0}
.blk.c > .bd{margin-left:16px;min-height:42px;padding:3px 4px 3px 0;background:rgba(0,0,0,.18);border-radius:0 3px 3px 0}
.lst{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:34px}
.stack{margin-bottom:22px}
.stack > .lst{padding-left:2px;margin-top:4px}
.arg{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:32px;padding:0 9px;border-radius:16px;background:#fbf6e9;color:#1a1408;
  font:700 15px var(--f-mono);border:2px solid rgba(0,0,0,.35);cursor:pointer}
.arg.dd:after{content:"▾";font-size:11px;margin-left:4px;opacity:.6}
.arg.warn{background:#ffd9d2;color:#8a1a0f;border-color:#8a1a0f;font-family:var(--f-ui);font-size:13px}
.pin{display:inline-block;font:800 12.5px var(--f-mono);background:#1a1408;color:#ffe7ad;padding:2px 6px;border-radius:3px;margin-right:3px}
.pin.bad{background:#8a1a0f;color:#fff}
.hole{display:inline-flex;flex-wrap:wrap;min-width:64px;min-height:34px;border-radius:17px;background:rgba(0,0,0,.28);border:2px dashed rgba(0,0,0,.45);align-items:center;justify-content:center;font-size:12px;color:rgba(0,0,0,.55)}
.hole.hot{background:#fff6;border-color:#fff}
.blk.ghost{position:absolute;z-index:200;pointer-events:none;opacity:.92;box-shadow:0 10px 18px rgba(0,0,0,.5)}
.blk.pal{margin:0 0 7px 0}
.blk.pal.c > .bd{min-height:16px}
.blk.pal .hole{min-width:44px;min-height:28px}
#palmore{position:absolute;left:0;bottom:0;width:214px;height:30px;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#e9c77c;background:linear-gradient(transparent,#1c1e21 45%);pointer-events:none}
.blk.pal.off{opacity:.3;pointer-events:none}
.blk.ro{pointer-events:auto}
.blk.tapbug{outline:3px solid transparent}
.blk.picked{outline:4px solid #fff;outline-offset:2px}
.blk.flash{animation:fl .9s 3}
@keyframes fl{50%{outline:4px solid #fff;outline-offset:2px}}
#ins{position:absolute;height:6px;width:150px;background:#fff;border-radius:3px;box-shadow:0 0 0 2px #000;pointer-events:none;display:none;z-index:50}
.limit{color:#ffb3a8}

/* ===== ポップアップ・モーダル ===== */
#popup{position:absolute;z-index:300;display:none;background:#f3ecd9;border:2px solid #3a2a10;border-radius:6px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.6);color:#1a1408}
#popup .opts{display:flex;flex-wrap:wrap;gap:6px;max-width:330px}
#popup .opts button{min-width:52px;height:48px;font:700 17px var(--f-mono);border:2px solid #3a2a10;border-radius:5px;background:#fff;padding:0 10px}
#popup .opts button.sel{background:var(--brass);}
#popup .disp{font:700 24px var(--f-mono);text-align:right;padding:4px 8px;background:#fff;border:2px solid #3a2a10;margin-bottom:6px;min-height:40px}
#popup .pad{display:grid;grid-template-columns:repeat(3,60px);gap:6px}
#popup .pad button{height:52px;font:700 20px var(--f-mono);border:2px solid #3a2a10;border-radius:5px;background:#fff}
#modal{position:absolute;inset:0;z-index:400;display:none;background:rgba(5,5,6,.72);align-items:center;justify-content:center}
#modal.on{display:flex}
.card{position:relative;width:760px;max-height:760px;overflow:auto;background:var(--paper);color:var(--ink);border-radius:4px;padding:26px 30px;border:3px solid #3a2a10;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.card h2{margin:0 0 6px;font-size:26px;letter-spacing:.05em}
.card h3{margin:14px 0 6px;font-size:17px}
.card p{font-size:16px;line-height:1.75;margin:6px 0}
.card .row{display:flex;gap:12px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.card .row.sticky{position:sticky;bottom:-26px;background:var(--paper);padding:12px 0 14px;margin-bottom:-12px;border-top:1.5px solid #c9b78f}
.card .tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 8px;border-radius:3px;background:#3a2a10;color:#f3e6c4;letter-spacing:.06em}
.kotei{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0;background:#fffaf0}
.kotei th,.kotei td{border:1.5px solid #6b5a3a;padding:6px 8px;text-align:left;vertical-align:top;line-height:1.45}
.kotei th{background:#e2d3ad;width:118px;font-size:13px}
.kotei .c-in{color:#7a4f00}.kotei .c-out{color:#0c5a3c}.kotei .c-ctl{color:#5a3d12}
.term{border-left:0;background:#fff8e6;border:1.5px solid #b59a62;border-radius:3px;padding:8px 12px;margin:6px 0;font-size:15px;line-height:1.6}
.term b{font-size:16px}
.stamp{position:absolute;right:30px;top:22px;transform:rotate(-8deg);border:4px solid #b4321f;color:#b4321f;font-weight:900;font-size:24px;padding:4px 14px;letter-spacing:.1em;border-radius:4px}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;min-height:54px;font-size:16.5px;font-weight:700;background:#fffaf0;border:2px solid #6b5a3a;border-radius:5px;color:var(--ink)}
.choice.ok{background:#cdeedc;border-color:#16654a}
.choice.ng{background:#f6d3cd;border-color:#a3291b}
.expl{background:#fff;border:2px solid #6b5a3a;border-radius:4px;padding:10px 14px;margin-top:8px;font-size:15.5px;line-height:1.7}

/* ===== バグ札・CHECK ===== */
#scr-bug,#scr-check{background:#1a1b1e}
.sheet{position:absolute;left:40px;top:70px;width:1100px;height:720px;background:var(--paper);color:var(--ink);border-radius:4px;border:3px solid #3a2a10;padding:22px 28px;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:24px}
.symp{background:#fff;border:2px solid #a3291b;padding:10px 14px;border-radius:4px;font-size:16.5px;line-height:1.6;margin:8px 0}

<script>
"use strict";
/* ============ 共通の道具 ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const APP = $('#app');
let SCALE = 1;
function fit() {
  SCALE = Math.min(innerWidth / 1180, innerHeight / 820);
  APP.style.transform = `scale(${SCALE})`;
}
addEventListener('resize', fit); fit();
function toApp(cx, cy) { const r = APP.getBoundingClientRect(); return { x: (cx - r.left) / SCALE, y: (cy - r.top) / SCALE }; }
function rectApp(el) { const r = el.getBoundingClientRect(), a = APP.getBoundingClientRect(); return { x: (r.left - a.left) / SCALE, y: (r.top - a.top) / SCALE, w: r.width / SCALE, h: r.height / SCALE }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let UID = 1; const uid = () => 'b' + (UID++);
const deep = o => JSON.parse(JSON.stringify(o));

/* ============ 保存（この端末の中だけ） ============ */
const SAVE_KEY = 'retronica_v1';
let SV = { clear: {}, check: {}, bug: {}, intro: false, unlockAll: false, reduce: null, snd: true, wip: {}, ending: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) SV = Object.assign(SV, s); } catch (e) { }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SV)); } catch (e) { } }
if (SV.reduce === null) SV.reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
function applyReduce() { APP.classList.toggle('reduce', !!SV.reduce); }
applyReduce();

/* ============ 音（Web Audio で合成・最初のタップまで鳴らさない） ============ */
const AU = { ctx: null, master: null, nbuf: null, loops: {} };
function auInit() {
  try {
    if (!AU.ctx) {
      AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
      AU.master = AU.ctx.createGain(); AU.master.gain.value = SV.snd ? 0.55 : 0; AU.master.connect(AU.ctx.destination);
      const n = AU.ctx.sampleRate; AU.nbuf = AU.ctx.createBuffer(1, n, n); const d = AU.nbuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AU.ctx.state === 'suspended') AU.ctx.resume();
  } catch (e) { }
}
document.addEventListener('pointerdown', auInit, true);
function setSnd(on) { SV.snd = on; save(); if (AU.master) AU.master.gain.value = on ? 0.55 : 0; $('#b-snd').textContent = on ? '音 ON' : '音 OFF'; }
function vary(f) { return f * (1 + (Math.random() * 0.08 - 0.04)); }
function tone(f, dur, type = 'sine', vol = .25, f2 = null, delay = 0) {
  if (!AU.ctx || !SV.snd) return; const c = AU.ctx, t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .2, ft = 'lowpass', f = 1200, f2 = null, delay = 0, q = 1) {
  if (!AU.ctx || !SV.snd) return; const c = AU.ctx, t = c.currentTime + delay;
  const s = c.createBufferSource(); s.buffer = AU.nbuf; const fl = c.createBiquadFilter(); fl.type = ft; fl.Q.value = q;
  fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(AU.master); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
const SFX = {
  tap() { tone(vary(1500), .03, 'square', .06); },
  snap(f = 900) { noise(.035, .5, 'bandpass', vary(f) * 2.2, null, 0, 4); tone(vary(f), .04, 'square', .1); noise(.03, .35, 'bandpass', vary(f) * 3, null, .045, 6); },
  wire() { tone(vary(520), .09, 'triangle', .16, 1300); },
  spark() { for (let i = 0; i < 5; i++) noise(.04, .4, 'bandpass', rnd(1800, 4200), null, i * .045, 3); tone(90, .15, 'sawtooth', .08); },
  cut() { noise(.06, .4, 'highpass', 4200); tone(vary(2400), .03, 'square', .05); },
  blk() { tone(vary(330), .05, 'square', .07); noise(.03, .25, 'bandpass', 1400, null, 0, 3); },
  pop() { tone(vary(880), .05, 'sine', .12, 1100); },
  ok() { tone(vary(1046), .09, 'triangle', .16); tone(vary(1568), .12, 'triangle', .12, null, .07); },
  ng() { tone(330, .16, 'triangle', .14, 250); tone(250, .2, 'triangle', .1, 210, .12); },
  chime() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, .35, 'triangle', .14, null, i * .09)); noise(.6, .05, 'highpass', 6000, null, .3); },
  big() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .5, 'triangle', .14, null, i * .1)); [262, 392].forEach((f, i) => tone(f, .9, 'sawtooth', .05, null, .45)); noise(1.2, .07, 'highpass', 3000, 8000, .4); },
  alarm() { for (let i = 0; i < 4; i++) { tone(620, .16, 'square', .07, null, i * .36); tone(440, .16, 'square', .07, null, i * .36 + .18); } },
  whoosh() { tone(160, .7, 'sawtooth', .07, 900); noise(.8, .25, 'bandpass', 500, 4000, 0, 2); },
  thump() { tone(110, .28, 'sine', .4, 38); noise(.18, .35, 'lowpass', 500); },
  steam() { noise(.7, .16, 'highpass', 2500, 6000); },
  beep() { tone(1000, .12, 'square', .08); },
  buzz() { for (let i = 0; i < 3; i++) tone(880, .1, 'square', .07, null, i * .16); },
  bell() { tone(1318, .5, 'sine', .14); tone(1760, .6, 'sine', .08, null, .02); },
  clunk() { tone(vary(180), .12, 'square', .12, 90); noise(.08, .3, 'lowpass', 900); },
  step() { tone(vary(240), .05, 'triangle', .1); },
  bit() { const n = 2 + (Math.random() * 3 | 0); for (let i = 0; i < n; i++) tone(vary(rnd(700, 1250)), .045, 'sine', .07, null, i * .055); },
};
function loopOn(key, kind) {
  if (!AU.ctx || !SV.snd || AU.loops[key]) return;
  const c = AU.ctx, g = c.createGain(); g.gain.value = 0; g.connect(AU.master); const nodes = [];
  if (kind === 'fan') { const s = c.createBufferSource(); s.buffer = AU.nbuf; s.loop = true; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = .8; s.connect(f); f.connect(g); s.start(); nodes.push(s); const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 95; const og = c.createGain(); og.gain.value = .25; o.connect(og); og.connect(g); o.start(); nodes.push(o); g.gain.linearRampToValueAtTime(.09, c.currentTime + .4); }
  else if (kind === 'motor') { const o = c.createOscillator(); o.type = 'square'; o.frequency.value = 62; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380; o.connect(f); f.connect(g); o.start(); nodes.push(o); g.gain.linearRampToValueAtTime(.06, c.currentTime + .2); }
  else if (kind === 'heat') { const s = c.createBufferSource(); s.buffer = AU.nbuf; s.loop = true; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260; s.connect(f); f.connect(g); s.start(); nodes.push(s); g.gain.linearRampToValueAtTime(.12, c.currentTime + .3); }
  else if (kind === 'buzz') { const o = c.createOscillator(); o.type = 'square'; o.frequency.value = 880; const l = c.createOscillator(); l.type = 'square'; l.frequency.value = 3; const lg = c.createGain(); lg.gain.value = .04; l.connect(lg); lg.connect(g.gain); o.connect(g); o.start(); l.start(); nodes.push(o, l); g.gain.value = .04; }
  AU.loops[key] = { g, nodes };
}
function loopOff(key) { const L = AU.loops[key]; if (!L) return; try { L.g.gain.cancelScheduledValues(0); L.g.gain.value = 0; L.nodes.forEach(n => n.stop()); } catch (e) { } delete AU.loops[key]; }
function loopsOff() { Object.keys(AU.loops).forEach(loopOff); }

/* ============ ビット（相棒のフローティング・ドロボット） ============ */
function bitSVG(mood = 'n') {
  const eyes = {
    n: '<circle cx="35" cy="45" r="4.5" fill="#bfe9c3"/><circle cx="51" cy="45" r="4.5" fill="#bfe9c3"/>',
    h: '<path d="M30 47 q5 -7 10 0 M46 47 q5 -7 10 0" stroke="#bfe9c3" stroke-width="3.5" fill="none" stroke-linecap="round"/>',
    w: '<path d="M30 42 l9 5 M56 42 l-9 5" stroke="#bfe9c3" stroke-width="3.5" stroke-linecap="round"/><circle cx="35" cy="49" r="3" fill="#bfe9c3"/><circle cx="51" cy="49" r="3" fill="#bfe9c3"/>',
    a: '<path d="M35 38 v9 M51 38 v9" stroke="#ffb3a8" stroke-width="4" stroke-linecap="round"/><circle cx="35" cy="52" r="2.4" fill="#ffb3a8"/><circle cx="51" cy="52" r="2.4" fill="#ffb3a8"/>',
    t: '<path d="M30 45 h10 M46 45 h10" stroke="#bfe9c3" stroke-width="3.5" stroke-linecap="round"/>'
  }[mood] || '';
  return `<svg viewBox="0 0 86 86" width="86" height="86" class="bitsvg">
  <g class="bitfloat">
   <path d="M43 6 v8" stroke="#6b4a1b" stroke-width="3"/><circle cx="43" cy="6" r="4" fill="${mood === 'a' ? '#e2483a' : '#f0b13a'}"/>
   <ellipse cx="43" cy="15" rx="20" ry="3.5" fill="#3a3b40"/>
   <circle cx="43" cy="46" r="31" fill="#b8862f" stroke="#2b1c06" stroke-width="3"/>
   <path d="M18 34 a31 31 0 0 1 50 0" fill="none" stroke="#f1d08a" stroke-width="3" opacity=".7"/>
   <circle cx="16" cy="46" r="3" fill="#6b4a1b"/><circle cx="70" cy="46" r="3" fill="#6b4a1b"/><circle cx="43" cy="74" r="3" fill="#6b4a1b"/>
   <rect x="23" y="32" width="40" height="27" rx="7" fill="#0e1611" stroke="#2b1c06" stroke-width="2.5"/>
   ${eyes}
   <path d="M30 78 q-4 5 -10 4 M56 78 q4 5 10 4" stroke="#cfd5d6" stroke-width="2" fill="none" opacity=".6"/>
  </g></svg>`;
}
const BIT = { mood: 'n', hintIdx: 0 };
function bitMood(m) { BIT.mood = m; $('#bit').innerHTML = bitSVG(m); }
function say(html, mood = 'n', quiet = false) {
  $('#bubble').innerHTML = html; bitMood(mood); if (!quiet) SFX.bit();
}
(function bitStyle() { const s = document.createElement('style'); s.textContent = `.bitfloat{animation:bf 2.6s ease-in-out infinite}@keyframes bf{50%{transform:translateY(-4px)}}`; document.head.appendChild(s); })();

/* ============ トースト・モーダル・ポップアップ ============ */
let toastT = 0;
function toast(s, ms = 1800) { const t = $('#toast'); t.innerHTML = s; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms); }
function modal(html, bind) {
  const m = $('#modal'); m.innerHTML = `<div class="card">${html}</div>`; m.classList.add('on');
  if (bind) bind(m.firstElementChild); return m.firstElementChild;
}
function closeModal() { const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }
let popOwner = null;
function popup(anchor, html, bind) {
  const p = $('#popup'); p.innerHTML = html; p.style.display = 'block'; popOwner = anchor;
  const r = rectApp(anchor); const pw = p.offsetWidth, ph = p.offsetHeight;
  let x = r.x, y = r.y + r.h + 6; if (y + ph > 812) y = r.y - ph - 6; if (x + pw > 1172) x = 1172 - pw; if (y < 4) y = 4;
  p.style.left = x + 'px'; p.style.top = y + 'px';
  if (bind) bind(p); SFX.pop();
}
function closePopup() { $('#popup').style.display = 'none'; popOwner = null; }
document.addEventListener('pointerdown', e => {
  if ($('#popup').style.display === 'block' && !e.target.closest('#popup') && e.target !== popOwner && !(popOwner && popOwner.contains(e.target))) closePopup();
}, true);

/* ============ 効果の層（火花・蒸気）：問題文や式は揺らさない ============ */
const FX = { c: $('#fx'), g: null, p: [] };
FX.g = FX.c.getContext('2d');
function burst(x, y, color = '#f0b13a', n = 14, spd = 160, life = .6, size = 3) {
  if (SV.reduce) n = Math.min(n, 4);
  for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), v = rnd(spd * .3, spd); FX.p.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life, max: life, color, size }); }
}
function puff(x, y, n = 6) { for (let i = 0; i < n; i++) FX.p.push({ x: x + rnd(-8, 8), y, vx: rnd(-20, 20), vy: rnd(-70, -30), life: 1.1, max: 1.1, color: 'steam', size: rnd(8, 16) }); }
function fxStep(dt) {
  const g = FX.g; g.clearRect(0, 0, 1180, 820);
  FX.p = FX.p.filter(p => (p.life -= dt) > 0);
  for (const p of FX.p) {
    p.x += p.vx * dt; p.y += p.vy * dt; const k = p.life / p.max;
    if (p.color === 'steam') { p.vy *= .98; g.fillStyle = `rgba(230,230,225,${.28 * k})`; g.beginPath(); g.arc(p.x, p.y, p.size * (1.6 - k), 0, 7); g.fill(); }
    else { p.vy += 300 * dt; g.globalAlpha = k; g.fillStyle = p.color; g.fillRect(p.x, p.y, p.size, p.size); g.globalAlpha = 1; }
  }
}

/* ============ 画面の切りかえ ============ */
function show(id) { $$('.scr').forEach(s => s.classList.toggle('on', s.id === id)); closePopup(); }
/* ============ ハードウェア・ビュー（基板・部品・配線） ============ */
let ST = null;      // いまのステージ
let HW = null;      // 基板の状態
let PHASE = 'hw';   // hw / sw / test

const COREROLE = {
  ram: { name: '主記憶', desc: '作業中のデータを一時的に置く。電源を切ると消える', y: 14, h: 104 },
  cpu: { name: '演算・制御', desc: '命令を読んで計算し、ほかの部品に指示を出す', y: 140, h: 118 },
  rom: { name: '補助記憶', desc: 'プログラムやデータを長く保存。電源を切っても残る', y: 280, h: 108 },
};
const COREPART = {
  cpu: { name: 'CPU', sub: '中央処理装置', desc: '<b>CPU</b>は命令を読んで計算（演算）し、ほかの部品を動かす指示（制御）を出す、コンピュータの頭脳。' },
  ram: { name: 'メモリ', sub: 'RAM', desc: '<b>メモリ（RAM）</b>は主記憶装置。動いているプログラムや変数のデータを<b>一時的に</b>置く。電源を切ると消える。' },
  rom: { name: 'ストレージ', sub: 'ROM', desc: '<b>ストレージ</b>は補助記憶装置。プログラムを<b>保存</b>しておく場所。電源を切っても消えない。' },
};
const PINS = {
  A1: { x: 196, y: 50, dir: 'in', kind: 'A' }, A2: { x: 196, y: 98, dir: 'in', kind: 'A' }, A3: { x: 196, y: 146, dir: 'in', kind: 'A' },
  D1: { x: 196, y: 222, dir: 'in', kind: 'D' }, D2: { x: 196, y: 270, dir: 'in', kind: 'D' }, D3: { x: 196, y: 318, dir: 'in', kind: 'D' },
  O1: { x: 364, y: 66, dir: 'out', kind: 'O' }, O2: { x: 364, y: 130, dir: 'out', kind: 'O' }, O3: { x: 364, y: 194, dir: 'out', kind: 'O' }, O4: { x: 364, y: 258, dir: 'out', kind: 'O' },
  C1: { x: 364, y: 340, dir: 'com', kind: 'C' },
};
const SLOTS = {
  P1: { x: 8, y: 10, side: 'L' }, P2: { x: 8, y: 142, side: 'L' }, P3: { x: 8, y: 274, side: 'L' },
  P4: { x: 400, y: 10, side: 'R' }, P5: { x: 400, y: 142, side: 'R' }, P6: { x: 400, y: 274, side: 'R' },
};
const SLW = 152, SLH = 120;

/* ---- 部品の絵（その場で描く。外部の画像は使わない） ---- */
const IC = {
  cpu: `<rect x="10" y="10" width="32" height="32" rx="2" fill="#2d2f33" stroke="#111" stroke-width="2"/><rect x="17" y="17" width="18" height="18" fill="#c9ced1"/>${[14, 20, 26, 32, 38].map(v => `<path d="M${v} 4v6M${v} 42v6M4 ${v}h6M42 ${v}h6" stroke="#c3913a" stroke-width="2"/>`).join('')}`,
  ram: `<rect x="3" y="16" width="46" height="20" rx="1" fill="#1d4535" stroke="#111" stroke-width="2"/>${[7, 18, 29, 40].map(v => `<rect x="${v}" y="19" width="7" height="10" fill="#2d2f33"/>`).join('')}${[6, 11, 16, 21, 26, 31, 36, 41, 46].map(v => `<path d="M${v} 36v6" stroke="#c3913a" stroke-width="2"/>`).join('')}`,
  rom: `<path d="M12 6h22l8 8v32H12z" fill="#3e5f72" stroke="#111" stroke-width="2"/><rect x="17" y="12" width="14" height="10" fill="#c9ced1"/><path d="M16 34h20M16 39h20" stroke="#8fb3c7" stroke-width="2"/>`,

/* ---- 部品・ピンの情報 ---- */
function devOf(id) { return ST.devs[id]; }
function isCore(id) { return id === 'cpu' || id === 'ram' || id === 'rom'; }
function partName(id) { return isCore(id) ? COREPART[id].name : devOf(id).name; }
function slotOf(dev) { for (const k in HW.slots) if (HW.slots[k] === dev) return k; return null; }
function termPos(dev) { const s = SLOTS[slotOf(dev)]; return s.side === 'L' ? { x: s.x + SLW, y: s.y + SLH / 2 } : { x: s.x, y: s.y + SLH / 2 }; }
function ioColor(io) { return io === 'out' ? 'var(--out)' : io === 'com' ? 'var(--mem)' : 'var(--in)'; }
function ioColorHex(io) { return io === 'out' ? '#3dbb8c' : io === 'com' ? '#8fb3c7' : '#f0b13a'; }
function bez(p, t) { const u = 1 - t; return { x: u * u * u * p[0].x + 3 * u * u * t * p[1].x + 3 * u * t * t * p[2].x + t * t * t * p[3].x, y: u * u * u * p[0].y + 3 * u * u * t * p[1].y + 3 * u * t * t * p[2].y + t * t * t * p[3].y }; }
function wirePts(a, b) { const dx = b.x - a.x; const sag = Math.min(40, Math.abs(dx) * .25 + 10); return [a, { x: a.x + dx * .45, y: a.y + sag }, { x: b.x - dx * .45, y: b.y + sag }, b]; }
function pathD(p) { return `M${p[0].x} ${p[0].y}C${p[1].x} ${p[1].y} ${p[2].x} ${p[2].y} ${p[3].x} ${p[3].y}`; }

/* 配線の診断（ブロックの名前・テストのヒントで使う） */
function wireState(dev) {
  const d = devOf(dev); if (!d) return { ok: false, why: 'none' };
  if (d.uses) { for (const u of d.uses) { const s = wireState(u); if (!s.ok) return s; } return { ok: true }; }
  if (!slotOf(dev)) return { ok: false, why: 'unplaced' };
  const p = HW.wires[dev]; if (!p) return { ok: false, why: 'nowire' };
  const P = PINS[p];
  if (d.io === 'com') return P.dir === 'com' ? { ok: true, pin: p } : { ok: false, why: 'dir', pin: p };
  if (d.io === 'out') return P.dir === 'out' ? { ok: true, pin: p } : { ok: false, why: 'dir', pin: p };
  if (P.dir !== 'in') return { ok: false, why: 'dir', pin: p };
  if (d.io === 'ain' && P.kind === 'D') return { ok: true, pin: p, dig: true };
  return { ok: true, pin: p };
}

/* ---- 初期化 ---- */
function hwInit(st, wip) {
  HW = { sockets: { ram: null, cpu: null, rom: null }, slots: { P1: null, P2: null, P3: null, P4: null, P5: null, P6: null }, wires: {} };
  const h = st.hw || {};
  (h.preCores || ['cpu', 'ram', 'rom']).forEach(c => HW.sockets[c] = c);
  Object.assign(HW.slots, h.preSlots || {});

}
function trayItems() {
  const h = ST.hw || {}; const pre = h.preCores || ['cpu', 'ram', 'rom'];

  ['cpu', 'ram', 'rom'].forEach(c => { if (!pre.includes(c) || (h.trayCores || []).includes(c)) items.push(c); });
  Object.keys(ST.devs).forEach(id => { if (!ST.devs[id].uses && !ST.devs[id].virtual) items.push(id); });

function wrapText(str, cx, y, perLine, lh, fs, fill, fw = 700) {

/* ---- 動いている信号（RUN中だけ） ---- */
function boardDyn(R) {
  const g = $('#dyn'); if (!g) return; let s = '';
  if (R && R.running) {
    for (const dev in HW.wires) {
      if (!slotOf(dev)) continue; const D = devOf(dev); const act = R.flow[dev];
      const p = wirePts(termPos(dev), PINS[HW.wires[dev]]);
      if (act && R.t - act < .2) {
        const toPin = D.io !== 'out';
        for (let i = 0; i < 3; i++) { let t = ((R.t * 1.6 + i / 3) % 1); if (!toPin) t = 1 - t; const q = bez(p, t); s += `<circle cx="${q.x}" cy="${q.y}" r="4.5" fill="#fff" stroke="${ioColorHex(D.io)}" stroke-width="2"/>`; }
      }
    }
    for (const dev in R.fail) {
      if (R.t - R.fail[dev] > .5) continue; const d = devOf(dev);
      const list = d && d.uses ? d.uses : [dev];
      for (const u of list) {
        if (wireState(u).ok) continue;
        let pos = slotOf(u) ? termPos(u) : null; if (!pos) continue;
        if (Math.floor(R.t * 2) % 2 === 0) s += `<g transform="translate(${pos.x},${pos.y})"><circle r="14" fill="#e2483a"/><path d="M-6 -6L6 6M6 -6L-6 6" stroke="#fff" stroke-width="3.5"/></g>`;
      }
    }
  }
  g.innerHTML = s;
}

/* ---- 説明（タップしたとき） ---- */
function explainPin(p) {
  const P = PINS[p];
  if (P.kind === 'A') return `<b>${p}（アナログ入力）</b>：センサーの電気の変化を、インタフェースで数値（デジタル）に変えて読む。温度や明るさのように<b>連続して変わる量</b>を読める。`;
  if (P.kind === 'D') return `<b>${p}（デジタル入力）</b>：<b>ONかOFF（1か0）だけ</b>を読む。ボタンやタッチなど、2通りの入力向き。`;
  if (P.kind === 'O') return `<b>${p}（出力）</b>：コンピュータの命令を、モーターやLEDを動かす電気に変えて送り出す。`;
  return `<b>${p}（通信）</b>：無線通信モジュールをつなぐ。ほかの機械とデータをやりとりする。`;
}

/* ---- 指の操作（つまむ・はめる・なぞる・切る） ---- */
let DRAG = null;
function boardLocal(cx, cy) { const a = toApp(cx, cy), r = rectApp($('#board')); return { x: (a.x - r.x) * 560 / r.w, y: (a.y - r.y) * 404 / r.h }; }
function hitSlot(pt, pad = 14) { for (const k in SLOTS) { const P = SLOTS[k]; if (pt.x > P.x - pad && pt.x < P.x + SLW + pad && pt.y > P.y - pad && pt.y < P.y + SLH + pad) return k; } return null; }
function hitSocket(pt, pad = 14) { for (const k in COREROLE) { const R = COREROLE[k]; if (pt.x > 222 - pad && pt.x < 338 + pad && pt.y > R.y - pad && pt.y < R.y + R.h + pad) return k; } return null; }
function hitPin(pt, rad = 28) { let best = null, bd = rad; for (const p in PINS) { if (p === 'C1' && !(ST.hw && ST.hw.comm)) continue; const P = PINS[p]; const d = Math.hypot(P.x - pt.x, P.y - pt.y); if (d < bd) { bd = d; best = p; } } return best; }
function hitTerm(pt) { for (const k in HW.slots) { const d = HW.slots[k]; if (!d) continue; const t = termPos(d); if (Math.hypot(t.x - pt.x, t.y - pt.y) < 26) return d; } return null; }
function hitWire(pt) {
  for (const dev in HW.wires) { if (!slotOf(dev)) continue; const p = wirePts(termPos(dev), PINS[HW.wires[dev]]); for (let i = 1; i < 30; i++) { const q = bez(p, i / 30); if (Math.hypot(q.x - pt.x, q.y - pt.y) < 11) return dev; } }
  return null;
}

function mazeWorld(cols, rows, open, start, dir, goal) {
  return () => ({ cols, rows, open: new Set(open.map(p => p.join(','))), x: start[0], y: start[1], dir, ax: start[0], ay: start[1], ad: dir * 90, goal: false, crash: false, gx: goal[0], gy: goal[1], moves: 0, bump: 0 });
}
const DXY = [[0, -1], [1, 0], [0, 1], [-1, 0]];
function mazeCmd(kind) {
  return R => {
    const W = R.W; if (W.goal || W.crash) return;
    if (kind === 'fwd') { const nx = W.x + DXY[W.dir][0], ny = W.y + DXY[W.dir][1]; if (!W.open.has(nx + ',' + ny)) { W.crash = true; W.bump = R.t; SFX.clunk(); return; } W.x = nx; W.y = ny; W.moves++; SFX.step(); if (nx === W.gx && ny === W.gy) { W.goal = true; } }
    if (kind === 'left') { W.dir = (W.dir + 3) % 4; SFX.tap(); }
    if (kind === 'right') { W.dir = (W.dir + 1) % 4; SFX.tap(); }
  };
}
function mazeUpdate(W, R, dt) { W.ax += (W.x - W.ax) * Math.min(1, dt * 10); W.ay += (W.y - W.ay) * Math.min(1, dt * 10); let td = W.dir * 90; let d = td - W.ad; while (d > 180) d -= 360; while (d < -180) d += 360; W.ad += d * Math.min(1, dt * 10); }
function mazeDraw(g, R, W, cs, ox, oy, title) {
  g.fillStyle = '#1b1712'; g.fillRect(0, 0, 496, 216);
  for (let y = 0; y < W.rows; y++) for (let x = 0; x < W.cols; x++) {
    const X = ox + x * cs, Y = oy + y * cs;
    if (W.open.has(x + ',' + y)) { D.rr(g, X + 1, Y + 1, cs - 2, cs - 2, 2, '#8a7a5a'); g.strokeStyle = '#6b5e44'; g.lineWidth = 1; g.strokeRect(X + 5, Y + 5, cs - 10, cs - 10); }
    else { D.rr(g, X + 1, Y + 1, cs - 2, cs - 2, 2, '#3a3b40', '#16171a', 1.5); D.circ(g, X + 6, Y + 6, 1.6, '#6b6d73'); D.circ(g, X + cs - 6, Y + cs - 6, 1.6, '#6b6d73'); }
  }
  // ゴール
  const GX = ox + W.gx * cs + cs / 2, GY = oy + W.gy * cs + cs / 2;
  D.line(g, GX - 6, GY + 12, GX - 6, GY - 13, '#2b2418', 2); g.fillStyle = W.goal ? '#3dbb8c' : '#e2483a'; g.beginPath(); g.moveTo(GX - 5, GY - 13); g.lineTo(GX + 12, GY - 8); g.lineTo(GX - 5, GY - 2); g.fill();
  // ロボット（配達台車）
  const RX = ox + W.ax * cs + cs / 2, RY = oy + W.ay * cs + cs / 2;
  g.save(); g.translate(RX, RY); g.rotate(W.ad * Math.PI / 180);
  if (W.crash && !SV.reduce) g.translate(Math.sin(R.t * 40) * 2, 0);
  D.rr(g, -11, -10, 22, 22, 4, '#c3913a', '#2b1c06'); g.fillStyle = '#2b1c06'; g.fillRect(-14, -8, 4, 16); g.fillRect(10, -8, 4, 16);
  g.fillStyle = '#f0b13a'; g.beginPath(); g.moveTo(0, -16); g.lineTo(-6, -8); g.lineTo(6, -8); g.fill(); g.restore();
  if (W.crash) D.t(g, 'ゴツン！', RX, RY - 18, 13, '#ffb3a8', 'center');
  D.t(g, title, 12, 24, 13, '#e9c77c');
  D.t(g, '▲ 向いている方', 12, 44, 10.5, '#bba980');
  if (R.running) D.mono(g, `進んだマス ${W.moves}`, 12, 64, 11, '#bfe9c3');
  D.sleep(g, R);
}

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function strip(s){return String(s==null?'':s).replace(/<(?!\/?(sub|sup|b)>)[^>]*>/g,'')}
  function fmtDate(ms){var d=new Date(ms),w='日月火水木金土'[d.getDay()];return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+w+') '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function ensureCSS(){if(document.getElementById('sc-style'))return;var st=document.createElement('style');st.id='sc-style';st.textContent=CSS;document.head.appendChild(st)}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
  function store(rec){try{var a=load();a.unshift(rec);localStorage.setItem(KEY,JSON.stringify(a.slice(0,60)))}catch(e){}}

  /* ---------- v2: 達成率と問題ごとの成績（端末の中だけ） ---------- */
  function hash24(s){var h=0x811c9dc5;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return (h&0xffffff).toString(16)}
  function rdj(k){try{var o=JSON.parse(localStorage.getItem(k));return o&&typeof o==='object'?o:null}catch(e){return null}}
  function komaList(r){var k=r.koma;k=Array.isArray(k)?k.slice():(k?[k]:[]);(r.review||[]).forEach(function(v){if(v&&v.koma&&k.indexOf(v.koma)<0&&!(r.koma&&r.koma.length))k.push(v.koma)});return k.map(String).filter(function(x){return /^[a-z0-9]+-[a-z]+-\d+$/.test(x)})}
  function isPass(r){var t=+r.total||0,sc=+r.score||0;return t>0&&sc*10>=t*7}
  function record(r){
    var out={newly:[],pass:isPass(r),koma:[]};
    try{
      var ks=komaList(r);out.koma=ks;
      var grade=r.grade||(ks[0]&&ks[0].split('-')[0])||'';
      var t=+r.total||0,sc=+r.score||0,at=r.at||Date.now();
      if(grade&&ks.length){
        var PK='rika-zukan:'+grade+':progress:v1',P=rdj(PK)||{v:1,koma:{},last:null};if(!P.koma||typeof P.koma!=='object')P.koma={};P.v=P.v||1;
        ks.forEach(function(k){var p=P.koma[k];if(!p)p=P.koma[k]={open:null,main:null,pass:null,full:null,best:null,earnFirst:0,earnReplay:0,memorial:false};
          if(!p.open)p.open=at;
          if(t>0){var b=p.best;if(!b||!b.total||sc/t>b.score/b.total||(sc/t===b.score/b.total&&t>b.total))p.best={score:sc,total:t,at:at}}
          if(out.pass&&!p.pass){p.pass=at;out.newly.push(k)}
          if(t>0&&sc===t&&!p.full)p.full=at});
        P.last={koma:ks[0],at:at};
        localStorage.setItem(PK,JSON.stringify(P));
      }
      var byG={};(r.review||[]).forEach(function(v){if(!v||!v.id)return;var g=String(v.id).split('-')[0];if(!/^chu\d$/.test(g))g=grade;if(!g)return;(byG[g]=byG[g]||[]).push(v)});
      Object.keys(byG).forEach(function(g){var QK='rika-zukan:'+g+':qlog:v1',Q=rdj(QK)||{v:1,q:{}};Q.v=Q.v||1;if(!Q.q||typeof Q.q!=='object')Q.q={};var mins=Math.floor(at/60000);
        byG[g].forEach(function(v){var id=String(v.id),e=Q.q[id];if(!e&&Q.qh){var h=hash24(id);if(Q.qh[h]){e=Q.qh[h];delete Q.qh[h]}}e=e||[0,0,0,0,0];var ok=!!v.ok;
          Q.q[id]=[(e[0]|0)+1,(e[1]|0)+(ok?0:1),ok?1:0,mins,ok?(e[4]|0)+1:0]});
        localStorage.setItem(QK,JSON.stringify(Q))});
      try{window.dispatchEvent(new Event('rika-zukan-change'))}catch(e){}
    }catch(e){}
    return out;
  }
  function payPass(res){
    if(!res.newly.length||!window.Zukan||!Zukan.earn)return;
    var got=0;res.newly.forEach(function(k){got+=Zukan.earn(30,'pass',{koma:k,silent:true})||0});
    if(got>0&&Zukan.toast)setTimeout(function(){Zukan.toast('🎖 合格！ 中2理科図鑑のかけら <b>+'+got+'</b>')},500);
  }

  function cardHTML(r){
    var marks=r.marks||[];
    var cells=marks.map(function(ok,i){return '<div class="sc-cell '+(ok?'o':'x')+'"><small>'+(i+1)+'</small><b>'+(ok?'○':'×')+'</b></div>'}).join('');
    var rec=(r.records||[]).map(function(x){return '<div'+(x[0]==='適当プレイ'?' class="sc-bad"':x[0]==='解きかた'?' class="sc-good"':'')+'>'+esc(x[0])+'<b>'+esc(x[1])+'</b></div>'}).join('');
    return '<div id="sc-card">'+
      '<div class="sc-band"><span class="sc-tag">提出</span>確認テスト 提出カード<span class="sc-col">'+esc(r.collection||'')+'</span></div>'+
      '<div class="sc-body">'+
        '<div class="sc-unit">'+esc(r.unit||'')+'<small>'+esc(r.game||'')+'</small></div>'+
        '<div class="sc-name"><span>なまえ</span>'+esc(r.name||'（未入力）')+'</div>'+
        '<div class="sc-score"><b>'+esc(r.score)+'</b><i>/ '+esc(r.total)+' 点</i>'+(r.tekitou&&r.tekitou.full>0?'<s>ひび入り<br>減点前 '+esc(r.tekitou.raw)+'点</s>':'')+(r.koma&&isPass(r)?'<em>合格</em>':'')+(r.tekitou&&!r.tekitou.full?'<em style="background:linear-gradient(135deg,#f3c34a,#c8862a)">✨本物</em>':'')+'</div>'+
        '<div class="sc-when"><span>受けた日時</span>'+fmtDate(r.at)+'</div>'+
        '<div class="sc-grid">'+cells+'</div>'+
        (rec?'<div class="sc-rec">'+rec+'</div>':'')+voiceLine(r)+
      '</div>'+
      '<div class="sc-foot">この画面をスクリーンショットして提出しよう</div>'+
    '</div>';
  }
  function voiceLine(r){try{if(!window.Voice||!r.gameId)return '';var a=Voice.answer(r.gameId,r.grade);return a?'<div class="sc-voice">'+esc(Voice.answerText(a))+'</div>':''}catch(e){return ''}}
  function reviewHTML(r){
    return '<div id="sc-rev"><h3>解答と解説</h3><ol>'+(r.review||[]).map(function(v){
      return '<li><span class="'+(v.ok?'o':'x')+'">'+(v.ok?'○':'×')+'</span> '+strip(v.q)+'<br>　正解：<b>'+strip(v.a)+'</b>'+(v.ok?'':'　<span style="color:#6b7390">（あなた：'+strip(v.y)+'）</span>')+'</li>'}).join('')+'</ol></div>';
  }
  function open(r,onClose,fromShow){
    ensureCSS();
    var ov=document.getElementById('sc-ov');if(ov)ov.remove();
    ov=document.createElement('div');ov.id='sc-ov';
    var mode='card';
    function draw(){
      ov.innerHTML='<div id="sc-wrap">'+(mode==='card'?cardHTML(r):reviewHTML(r))+
        '<div id="sc-btns">'+(r.review&&r.review.length?'<button data-a="rev">'+(mode==='card'?'📖 解答を見る':'📝 提出カードにもどる')+'</button>':'')+
        '<button data-a="close">とじる</button></div></div>';
    }
    draw();
    ov.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='rev'){mode=mode==='card'?'rev':'card';draw();ov.scrollTop=0}
      else{ov.remove();if(onClose)onClose();if(fromShow&&window.Voice&&Voice.maybeAsk)setTimeout(function(){Voice.maybeAsk(r)},fromShow===2?0:250)}});
    document.body.appendChild(ov);
  }
  window.SubmitCard={
    /* r = {collection, unit, game, gameId, grade, koma:[コマID], name, score, total, marks:[bool],
            records:[[label,value]], review:[{id,koma,q,a,y,ok}]}
       at（日時）は自動で入る。保存して表示し、達成率と問題ごとの成績を更新する */
    show:function(r,onClose){
      r=Object.assign({},r);if(!r.at)r.at=Date.now();
      if(!r.collection)r.collection=window.COLLECTION_NAME||'';
      store(r);
      var res=record(r);
      try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'submit-card',rec:r},'*')}catch(e){}
      open(r,onClose,1);payPass(res);return r;
    },
    reopen:function(r,onClose){open(r,onClose)},
    isPass:isPass,
    all:load,
    KEY:KEY
  };
})();

/*@SUBMIT_CARD_END*/</script>
<script>window.ZUKAN_COUNTER={"db": "https://rika-zukan-rank-default-rtdb.asia-southeast1.firebasedatabase.app", "id": "gijutsu-retronica"};
/* プレイ回数を数える（公開サイトのゲームにだけ build_site.py が入れる）
   送るのはゲームIDだけ。同じタブで開き直しても1回しか数えない。届かなくてもゲームには何も起きない */
(function(){
  var C=window.ZUKAN_COUNTER;if(!C||!C.db||!C.id||!/^[a-z0-9-]{2,40}$/.test(C.id))return;
  var k='zukan-played:'+C.id;
  try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1')}catch(e){}
  try{fetch(C.db+'/plays/'+C.id+'.json',{method:'PUT',body:JSON.stringify({'.sv':{increment:1}}),keepalive:true})['catch'](function(){})}catch(e){}
})();
</script>
